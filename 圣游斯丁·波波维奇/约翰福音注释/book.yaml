title:
  ru: Тумачење Светог Еванђеља по Јовану
  cn: 约翰福音注释
authors:
- cn: 圣游斯丁·波波维奇
  ru: преподобный Иустин (Попович)
document:
- type: heading1
  text:
    ru: Тумачење Светог Еванђеља по Јовану
    cn: 圣约翰福音诠释
  children:
  - type: heading2
    text:
      ru: Глава прва. Божанство оваплоћеног Бога Логоса
      cn: 第一章. 道成肉身的上帝圣言的神性
    children:
    - type: paragraph
      text:
        ru: «У почетку бјеше Логос (Ријеч), и Логос бјеше у Бога, и Логос бјеше Бог.» (Ин.1:1)
        cn: 「起初有道，道与神同在，道就是神。」（约翰福音 1:1）
    - type: paragraph
      text:
        ru: Ако је почетак празан и пуст, какво ли ће тек бити оно што произилази из њега и долази из њега? Ако је у почетку испред ових почетака ништа, онда из ништа може произаћи само ништа.
        cn: 如果开端是空虚而荒芜的，那么从中产生并出自于它的事物，又会是怎样的呢？如果这些开端之前，在起初就一无所有，那么从虚无中就只能产生虚无。
    - type: paragraph
      text:
        ru: 'Наша људска мисао која уопште мисли у категорији: почетак, трајање, завршетак, не може ни о овету, ни о бићу, ии о постојању да мисли без почетка. Полазећи од себе као од прве непосредне стварности своје ка ономе што је на њеноме почетку она се природом свога бића мора питати: шта је почетак свих почетака, почетак испред свих почетака, па и почетак саме људске мисли? Јер чим мисао људска почне да мисли, она већ у самом акту мишљења има почетак. Тако има почетак и у самом бићу, постању и постојању свом.'
        cn: 我们的思，总是以开始、持续、结束的范畴进行思考，因此无法在思考世界、存有或存在时，不包含一个开始。从自身作为其最初的直接实相出发，走向在其开端处的事物，它必然以其存有的本性自问：万有之始的开始是什么？在所有开始之前的开始是什么？乃至人类思本身的开始是什么？因为，人类的思一旦开始思想，它在思想的行动中就已有了开始。同样地，它在其自身的存有、生成和存在中，也都有一个开始。
    - type: paragraph
      text:
        ru: 'А када мисао људска обухвати овај видљиви свет, она се с правом природно и логично пита: шта је почетак овоме свету, шта је пре почетка овога света, јер је очигледно да овај свет има почетак, кад и ја, мисао људска, имам почетак?'
        cn: 当人的思想审视这个可见的世界时，它理所当然地、自然而合乎逻辑地问道：这个世界的开端是什么？在这个世界的开端之前又是什么？因为显而易见，这个世界有开端，就像我，人的思想，也有开端一样。
    - type: paragraph
      text:
        ru: 'Христовођена и богонадахнута мисао Светог Еванђелиста Јована вида тај први почетак, прапочетак, почетак свију почетака, сав испуњен Логосом, Богом: Он је почетак, Он испуњује сав почетак, Он је «у почетку».'
        cn: 基督引导并受上帝启示的圣福音传道者约翰的思想，看到了那第一个开端，原初的开端，万有的开端，完全充满着道，充满着上帝：祂是开端，祂充满着整个开端，祂就是「在起初」。
    - type: paragraph
      text:
        ru: 'На почетку свега, испред свих почетака, као почетак и бића, и постојања, и света, и живота, стоји Бог Логос: Творац свега што је почело и постојањем траје. Овај Свепочетак је тиме Свепочетак што нема почетка; он је у непрекидном трајању; и Он даје силе свима почецима у створеном свету да постојањем трају, и развијају се, и одвијају се у најразноазрсније облике постојања и збивања. Зато је и изречена ботомудра реч која значи не само трајање већ светрајање: = беше. Али овај глагол је пуста граматичка схема ако није испуњен Логосом = Мудрошћу, Речју, Богом.'
        cn: 在万物之始，在所有开端之先，作为存在、存有、世界和生命的开端，屹立着上帝圣言：祂是所有起始之物、以及借着存有而持续存在之物的创造者。这位万有之始之所以是万有之始，是因为祂没有开端；祂处于不间断的持续之中；并且祂赐予受造世界中所有开端力量，使它们借着存有而持续，并发展、演变为最多种多样的存在和事件形式。因此也说出了这句神圣智慧的话语，它不仅意味着持续，更意味着万古的持续： = 曾是。但这个动词是一个空洞的语法结构，如果它没有被圣言 = 智慧、道、上帝所充满。
    - type: paragraph
      text:
        ru: 'Трага ли радознала људока мисао за почетком тог Свепочетка за почетком Логоса, ево њега: «И Логос беше у Бога». Његов почетак је у Бога, значи: Он и нема почетка; сав је у Бога, па ипак самосталан, ипостасно самосталан, не обезличен неком обезличујућом погруженошћу у Богу. Људска мисао, када мисли о Богу, не може друкче а да и почетак Његов не замишља беопочетним. За њу је и најприродније и најлогичније да Бога замишља бескрајним и бесконачним у сваком погледу, па и у логледу почетка: почетком је Он бескрајан, бесконачан, беспочетан. Да, то је једини беспочетан почетак.'
        cn: 当好奇的人类思想探寻那万有之始的开端，探寻圣言（Logos）的开端时，看啊，它就在那里：「圣言与上帝同在。」祂的开端在上帝里面，这意味着：祂根本就没有开端；祂全然在上帝里面，然而却是独立的，在位格上是独立的，并未因某种使位格消弭的沉浸于上帝之中，而被消除其位格。人类思想，当思及上帝时，不能不将祂的开端设想为无始的。对它而言，最自然也最合乎逻辑的是，将上帝设想为在各方面都无限无量的，包括在开端方面：就开端而言，祂是无限的、无量的、无始的。是的，这是唯一的无始之始。
    - type: paragraph
      text:
        ru: 'Зато је Логос свим бићем Својим сав «у Бога»; а то значи: сав бескрајан, са сваке стране бескрајан и безграничан. Иако је «у Бога», Логос није ништа мањи од Бшта: сва су божанска савршенства у Њему као и у Богу, те је и Он по свему и свачему Бог, и то Бог Логос, зато је и речено Духом Светим преко светог тајновидца и боговидца: «и Бог беше Логос».'
        cn: 因此，逻格斯以其全部存在，完全「在神里面」；这意味着：完全无限，各方面都无限且无边界。尽管「在神里面」，逻格斯却丝毫不逊于那存有：一切神圣的完满都存在于祂之内，如同在神之内一样，因此祂在各方面都是神，并且是神逻格斯，因此圣灵借着神圣的奥秘洞察者和神视者所说：「神就是逻格斯。」（约翰福音 1:1）
    - type: paragraph
      text:
        ru: 'Значи: Бог Логос је посебна Личност у Богу, друго Лице Свете Тројице. Тако: у почетку испред свих почетака сгоји и постоји Пресвета Тројица. Јер Бог Логос никада није одвојен од Бога Оца; Он је стално и вечито «у Бога». Он «нема почетка» (1Ин.2:19).'
        cn: 所以，圣言（Logos）神是神里面一个独特的位格，是圣三一的第二个位格。因此，在起初，在所有开端之前，至圣三一就已立定并存有。因为圣言（Logos）神从未与父神分离；祂恒常且永远地「与神同在」。祂「没有起初」（1约翰福音 2:19）。
    - type: paragraph
      text:
        ru: 'Богомудри Свети Кирило Александриски благовести: Блажени Еванђелист Јован под почетком означава овде Бога Оца, да би се Божанска природа јавила изнад свега, имајући под својом влашћу сву твар. Нема ничег старијег од почетка. Употребљена реч «беше» означава превечни почетак Бога Логоса, и води мисао човекову ка дубоком непостижном, неизрецивом и ванвременом рођењу. Еванђелист благовести: «И Логос беше у Бога», и тиме указује на Ипостас Бога Оца и на Ипостас Бога Сина.[1]'
        cn: 亚历山大的神智圣者西里尔宣讲道：蒙福的圣史约翰在此以「起初」指称父上帝，好使神性彰显于万物之上，将万有置于其权柄管辖之下。没有什么比这起初更古老的了。所用的词语「是」指称了圣言上帝那先于永恒的开端，并引导人的思想趋向那深邃、不可领会、不可言说且超乎时空的诞生。圣史宣讲道：「圣言与上帝同在」，并以此指明父上帝的位格以及子上帝的位格。[1]
    - type: paragraph
      text:
        ru: «Он бјеше у почетку у Бога» (Ин.1:2)
        cn: 「他起初与神同在」（约翰福音 1:2）
    - type: paragraph
      text:
        ru: 'Да је Логос – Бог, и да је Бот заиста Света Тројица казује нам следећа благовест новозаветног громовника богочовечанске истине: «Логос беше у почетку у Бога» – «Логос беше Бог» (Ин.1:1).'
        cn: 圣言即是神，并且神确实是圣三一，新约中那位宣扬神人合一真理的雷子，以其以下的福音向我们如此述说：「圣言起初与神同在」——「圣言就是神」（约翰福音 1:1）。
    - type: paragraph
      text:
        ru: 'Значи: Бог Логос ни по чему није мањи од Бога Оца, нити је Он по почетку постојања каснији од Бога Оца, па макар творевина «пре свих векова», како су то учили христохулни и богохулни Аријанци.'
        cn: 也就是说：圣言上帝在任何方面都不次于圣父上帝，他也不是在存在的起始上晚于圣父上帝，即便他被宣称为「万世之前」的受造物，正如那些亵渎基督和亵渎上帝的亚流派所教导的那样。
    - type: paragraph
      text:
        ru: Он ни у ком смислу није створење, већ у свему и по свему, свагда. и увек вечити Бог Логос, увек «беше у Бога», «код Бога», окренут «к Богу» – никада, ни по чему мањи од Њега, па ни по почетку свога бића и постојања. Логос «беше у почетку».
        cn: 祂在任何意义上都不是受造物，而是在一切事上、按一切方式，始终，且永远是永恒的上帝圣言（Logos），总是「与上帝同在」、「在上帝那里」、面向「上帝」——从未、在任何方面小于祂，甚至在祂的存有和存在的开端上也不小于祂。圣言「在起初」就有了。
    - type: paragraph
      text:
        ru: 'Али да ко не би помислио да тај почетак има почетка, и да Логос није прави и истинити Бог, по свему раван Богу Оцу, свети благавесник и додаје: «Он беше у почетку у Бога». Тако света логика еванђелског богословља не допушта ни помисао да је Бог Логос ма по чему нижи и мањи од Бога Оца.'
        cn: 但为免有人认为那个开端本身有一个开端，并且圣言（Logos）并非真正和真实的上帝，在一切事上都与父上帝平等，圣福音传道者又补充道：「他起初与上帝同在。」如此，福音神学的神圣逻辑甚至不允许有这种想法，即圣言上帝在任何方面低于或小于父上帝。
    - type: paragraph
      text:
        ru: 'Свети Златоуст благовести: Син грома има кључеве неба. Он је обучен у Христа. Поприште његове делатности јесте васцело небо, гледалиште – васељена. Гледаоци и сви анђели и од људи они који су слични анђелима или желе да постану такви. Еванђелиста Јована окружују вишње силе, дивећи се племенитости душе његове и красоти врлине његове, којом је он привукао себи и Самога Христа и добио духовну благодат. Стога обратимо ову пажњу не на рибара, не на сина Зеведејевог, него на онога који зна дубине Божије, дубине Духа Светога. Он нам ништа људско неће говорити, већ све што нам буде рекао биће из дубине Духа Светога, из оних тајни које чак ни анђели нису знали пре но што су се збиле. То нам је открио Апостол Павле рекавши: «Да се кроз Цркву сад обзнани поглаварствима и властима на небу многоразлична премудрост Божија» (Еф.3:10).'
        cn: 圣金口若望宣扬道：「雷子拥有天堂的钥匙。他披戴着基督。他事工的场域是整个天堂，观众席是普世。观众是所有天使，以及人类中那些与天使相似的，或渴望成为那样的人。传福音者约翰被至高权能所围绕，他们惊叹于他灵魂的崇高和他美德的华美，借此他吸引了基督自己，并获得了属灵的恩典。因此，我们应将此注意力不是放在渔夫身上，不是放在西庇太的儿子身上，而是放在那洞悉上帝深奥、圣灵深奥的人身上。他不会对我们谈论任何属人的事，而是他将对我们所说的一切，都将出自圣灵的深处，出自那些甚至连天使在它们成就之前都不知道的奥秘。使徒保罗向我们启示了这一点，他说：「为要藉着教会，使天上执政的、掌权的，现在得知上帝百般的智慧。」（以弗所书 3:10）
    - type: paragraph
      text:
        ru: Значи, анђели заједно с нама научили су се ономе што раније нису знали. Еванђелист Јован удостојио се проникнути у најнеприступачније тајне, и имајући у себи говорећег Самог Господа, није подлегао никаквим људским слабостима…
        cn: 因此，天使与我们一同明白了他们以前不知道的事。圣史约翰得以洞悉最不可企及的奥秘，并且有主亲自在他里面言说，他没有屈服于任何人类的软弱……
    - type: paragraph
      text:
        ru: Еванђеље је не властити производ Светог Еванђелиста Јована, него дело божанске силе која је делала у души његовој… Еванђелист нам доноси тако узвишене догмате, тако превасходна правила живота и такву мудрост, какви су могуће само ономе који благовести из саме дубине Светога Духа, и објављује као онај који тек што је сишао са самих небеса. Кроз Еванћелиста благовести сам Бог роду људском.[2]«Све кроз Њега постаде, и без Њега ништа не постаде што је постало»(Ин.1:3)
        cn: 福音并非圣福音传道者约翰自己的创作，而是神圣力量在他灵魂中运行的作为…… 这位福音传道者带给我们的教义如此崇高，生命法则如此卓越，智慧如此高深，唯有那从圣灵深处宣讲，并如同刚刚从天上降临之人才能传达。借着这位福音传道者，上帝亲自向人类宣讲。[2]「万物是藉着他造的；凡被造的，没有一样不是藉着他造的。」(约翰福音 1:3)
    - type: paragraph
      text:
        ru: 'Ево почетка свима почетцима; ево Свеизвора из кога је потекло све што постоји: сви потоци постојања истичу из њега разграњавајући се у безброј поточића и поточићи у безброј још ситнијих поточића, па кроз капиларе до у атоме, електроне, фотоне, праелектроне.'
        cn: 这就是万始之始；这就是万有之源，万有皆从其中涌出：存有的一切洪流皆从其中涌流而出，分岔为无数细流，细流又分岔为无数愈加微细的细流，再经由毛细管，直至原子、电子、光子、原电子。
    - type: paragraph
      text:
        ru: 'Кроза све то струји једна једина, нека чудесно диференцирана и разливена и разграната и размрежена Логосова стваралачка сила: «Све кроз Њега постаде што постаде»: све од највећег до најмањег, од највидљивијег до најневидљивијег, све што видимо на кори света и све што не вииимо под том кором.'
        cn: 贯穿这一切，流淌着那独一的、奇妙地分化、扩散、分枝并交织成网络的圣言的创造大能：《万物都是藉着祂而有，凡已有的，都是藉着祂而有的》；一切，从至大到至微，从至显到至隐；我们在这世界表层所能看见的一切，以及在这表层之下我们所不能看见的一切。
    - type: paragraph
      text:
        ru: То Логосово «све» ко зна у какве се све димензије пружа, ко зна где су му и какви су му крајеви, какве запремине, какве дубине, ширине, висине! Нема сумње да се то «све» не може измерити никаквом људском мером, никаквом људском мишљу. У том Логосовом створеном «све» колики је безброј ствари које ми људи својим органом вида не видимо, а колики ли тек које превидимо.
        cn: 道（Logos）的那个「一切」，谁知道它延展到何等维度，谁知道它的尽头在何处，是何种模样，它又有着怎样的体积、怎样的深邃、广阔、崇高！毫无疑问，那个「一切」无法用任何人类的尺度，任何人类的思虑来衡量。在那道（Logos）所创造的「一切」之中，有多少无数的事物是我们人类用自己的视觉器官所看不到的，又有多少是我们所忽略的啊！
    - type: paragraph
      text:
        ru: Само у Богу Логосу «све што постаде», тј. сви светови видљиви и невидљиви јесу и претстављају једну органску целину, логосну и логичну целину. Само полазећи из Њега, и вођена Њиме људска мисао може то наслутити, назрети, и људско осећање осетити; а само освећена и просвећена Њиме људска мисао може то јаоно сагледати и сазнати, и људско срце – очигледно дознати и схватити. Да би постао један камен, колико је силе потребно, и какве? Сигурно силе несравњено веће него што су људске, јер ниједна људска сила не би могла створити из ничега и један најмањи каменчић. А, камоли – створити сунце, месец, небеса, земљу, човека, душу, мисао, осећање, савест.
        cn: 唯独在神逻格斯中，「一切所成的」（即所有可见和不可见的世界）是并代表着一个具有逻格斯性且逻辑性的有机整体。唯独从祂而出，并由祂引导的人类思想，才能隐约觉察、隐约看见它，而人类的感受才能感受到它；唯独被祂圣化并被祂光照的人类思想，才能清楚地审视并认识它，而人类的心才能——清楚地得知并领悟它。要使一块石头形成，需要何等大的能力，以及何种能力？无疑，这能力远超人类的能力，因为没有任何人类能力能够从虚无中创造出哪怕最小的一颗卵石。更遑论——创造太阳、月亮、诸天、大地、人类、灵魂、思想、感受、良心。
    - type: paragraph
      text:
        ru: 'О, за све то неопходне су силе несравњено веће од људских, силе Бога Логоса. Зато је и речено: «И без њега ништа не постаде што постаде» (Ин.1:3). Значи: у постојање се улази само помоћу Бога Логоса; нема друтог улаза, нема других врата помоћу којих би се могло ући у царство постојања. И у овом погледу важе оне божанске речи огааплоћеног Бога Логоса: «Ја сам врата» (Ин.10:9).'
        cn: 哦，为了这一切，所需要的力量远超人类，是圣言上帝（Logos）的力量。因此经上说：「凡被造的，没有一样不是借着他造的」（约翰福音 1:3）。这意味着：进入存在只能通过圣言上帝；没有其他的入口，也没有其他的门可以进入存在的王国。在这方面，道成肉身的圣言上帝（Logos）的那些神圣话语也适用：「我就是门」（约翰福音 10:9）。
    - type: paragraph
      text:
        ru: Нема твари, нема трунчице која постоји, а да није постала Богом Логосом. На свему, по свему и у свему је Његов стваралачки дах, Његова свестваралачка сила. Када би људкжа мисао могла да до краја разгрне атом и сунце, нашла би ту лотосну силу и у једном и у другом. По пореклу свом ове је логосно. Отуда сва твар, сва творевина и јесте прво Еванђеље Божије, прво праеванђеље о Богу Логосу, Творцу и Сведржитељу свега што постоји.
        cn: 没有一个受造物，没有一粒微尘的存在，不是由神圣的道而成的。在万物之上，遍及万物，并在万物之中，都有祂创造的气息，祂全然创造的能力。若是人类的思想能彻底揭开原子与太阳，就会在两者之中找到那道的能力。就其本源而言，这一切都是属道的。因此，一切受造之物，正是神的首个福音，首个关于神圣的道，这位创造主与万有护持者的原始福音。
    - type: paragraph
      text:
        ru: У ствари, сав створени овет, ове видљиве и све невидљиве васионе јесу своје врсте богојављење, христојављење. Само површно и површинско, само кокошије чепркање мишљу људском по храпавој кори, по површинској прашини васионе, не проналази то и не види то. Чим људска мисао озбиљно крене кроз овај свет, она свуда, у срцу сваке твари наиђе на божанску логосну силу која све што постоји, води тајанственим путевима постојања ка богоодређеном свециљу васионе (ср.Кол.1:16;Евр.2:10).
        cn: 实际上，所有受造之界，这可见的和一切不可见的穹苍，都是其自身的一种神显，基督显现。唯有肤浅且流于表面的，唯有人的思想如鸡啄食般扒拉于粗糙的表皮上，扒拉于宇宙表面的尘埃中，才无法发现也无法看见那（神显和基督显现）。一旦人的思想认真地深入这个世界，它便在各处，在每一受造物的心坎里，遇见那神圣的逻各斯能力，这能力引领着一切存在之物，沿着存在的奥秘之路，导向穹苍神所命定的终极目的（参阅歌罗西书 1:16，希伯来书 2:10）。
    - type: paragraph
      text:
        ru: 'Све што постаде са божанским циљем постаде, јер све Богом Логосом постаде. Нема ничег случајног у Божијем овету; најмање је случај створио ишта у овоме свету. Нема случаја, нема ниечг случајног, јер има Бога Логоса, који је и Свемудрост и Свелогика, и Свесила овега постојећег, и усто: Свепромислитељ, јер је Свестворитељ.'
        cn: 凡是受造之物，都是带着神圣的目的被造的，因为万物都由神性的逻各斯（Logos）所造。在神的世界里，没有任何偶然之事；偶然性更是丝毫未曾创造这个世界上的任何事物。没有偶然性，也没有任何偶然之事，因为有神性的逻各斯（Logos），他是万物的全智、全逻辑和全能，此外，他还是全护理者，因为他是全创造者。
    - type: paragraph
      text:
        ru: 'А ђаво? Зар је и он «Њиме постао»? Да, само је Бог Логос створио њега као светог и светлог анђела. Он је ушао у такво постојање. Ђаволом је постао, јер је, вођен и завоћен својим гордим самољубљем, зажелео да потисне Бога, и сам постане Бог. Тако је он злоупотребом своје слободне воље, својим гордим самољубљем претворио себе из светог и светлог анђела у ђавола: у биће противбожно, зло, грешно и свемрачно.'
        cn: 那魔鬼呢？难道它也是『藉着他而存在』的吗？是的，只是圣言上帝创造了它，把它造为一个圣洁光明的天使。它就是那样开始存在的。它之所以成为魔鬼，是因为，被其骄傲的自爱所引导和引诱，它渴望推翻上帝，并自己成为上帝。就这样，它滥用了其自由意志，凭着其骄傲的自爱，将自己从一个圣洁光明的天使变成了魔鬼：成为一个与上帝为敌、邪恶、有罪且全然黑暗的存有。
    - type: paragraph
      text:
        ru: У ствари, ђаво зида себе на небићу, на сенкама свога уображења да је он нешто велико и огромно. Но он и јесте тиме ђаво, и тиме лудило, што хоће да царство свога постојања, свога бића заснује не на Богу Логосу, већ на својој фантастичној гордости и безразложном самољубљу. Суштина је ђаволове трагедије у томе, што на небићу хоће да заснује своје биће.
        cn: 实际上，魔鬼将自己建立在非有之上，建立在他自己幻想中他乃是某种伟大而庞然之物的幻影之上。然而，他正因此而成为魔鬼，并因此而陷入疯狂，因为他想要将他存在、他本有的国度，不是奠基于上帝的道（圣言）之上，而是奠基于他那狂想般的骄傲和无根无据的自恋之上。魔鬼的悲剧实质在于，他企图在非有之上建立他的本有。
    - type: paragraph
      text:
        ru: 'У томе је трагедија и ђаволовог зла и ђаволовог греха, па и људског зла и људског грвха: хоће да заснује своје биће, своје постојање на нечему што нема у себи Бога Логоса, што нема истинитог Бога. А то значи: што хоће своје биће да заснује на небићу. А у томе је прва ђаволова лудост, у томе и све ћаволско лудило људско, које у својој грозници држи природу људску која се добровољно определила за грех и зло.'
        cn: 魔鬼的邪恶和魔鬼的罪，以及人类的邪恶和人类的罪，其悲剧就在于此：它们企图将自己的存有和存在，建立在自身没有道（圣言）上帝、没有真上帝的事物之上。而这意味着：它们企图将自己的存有，建立在非存有之上。这就是魔鬼的首要疯狂，也是所有魔鬼式人类疯狂的所在，这种疯狂以其狂热掌控着自愿选择罪和恶的人类本性。
    - type: paragraph
      text:
        ru: 'Богомудра мисао Светог Григорија Ниског казује ову тајну зла и философије греха. Ево ње: «зло има своје биће у небићу».'
        cn: 蒙神智慧的圣格里高利·尼撒的思想揭示了这恶的奥秘与罪的哲学。其内容是：「恶的存有在于非存有之中」。
    - type: paragraph
      text:
        ru: 'Свети Кирил Александриски благовести: Бог Логос као Јединородни Син очигледно све ради уз сарадњу и у саприсуству Оца и Свегога Духа. А Сину саприсуствује Отац не као немоћноме да ишта уради од постојећег, него као сав будући у Сину истоветношћу суштине. Пошто, дакле, Један постоји у Другоме природно и неопходно, те кад ради Отац очигледно ради и Син као Његова природна, суштаствeна и ипостасно постојећа Сила. Исто тако када ради Син, ради и Отац као извор стваралачког Логоса, природно присутан соиственом Породу, као што је огањ присутан у топлоти која происходи из њега.[3]'
        cn: 圣基里尔·亚历山大宣讲：上帝圣言作为独生子，显然一切都与父和圣灵同工同在而行。父与子同在，并非因为子无力成就任何存在之事，而是因为父与子同质，全然在子之中。因此，既然一位自然而必然地存在于另一位之中，那么当父行事时，子也显然行事，作为祂自然、本质、位格性存在的权能。同样地，当子行事时，父也行事，作为创造性圣言的源头，自然地临在于祂自己的受生者之中，如同火焰临在于其所发出的热量之中。[3]
    - type: paragraph
      text:
        ru: 'Свети Златоуст богомудро објашњава тајну Бога Логоса. Речи блаженог Еванђелиста: «У почетку беше Логос» означавају не што друго него биће вечно и безгранично… Није речено: беше у Богу, већ: «беше у Бога» шго означава вечност Бога Логоса по ипостаси. Логос је ипостасно биће које је бестрасно произашло од самога Оца.[4]'
        cn: 圣金口若望以神圣的智慧解释了圣言上帝的奥秘。蒙福的传福音者（约翰）的话语：「在起初，有圣言」，所指的无非是一个永恒无限的存有……它没有说：「在上帝里面」，而是说：「与上帝同在」，这表示圣言上帝按位格而言是永恒的。圣言是一个位格性存有，无受苦地出自父本身。[4]
    - type: paragraph
      text:
        ru: 'Блажени Теофилакт Охридски богомудрује: Еванђелистове речи: «Логос беше у Бога» показују да је Син савечан Оцу и да Отац никада није био без Сина. Реч је о две Личности, али и о једној природи и о једном Божанству. Логос се никада није одвајао од Бога Оца и појавио као неки антибог.[5]'
        cn: 至圣奥赫里德的特奥菲拉克特智言道：福音作者的言语：「道与神同在」，表明圣子与圣父同永恒，且圣父从未没有圣子。这里论及的是两位位格，却也是一个本性和一个神性。道从未与父神分离，也未曾显现为某种反神。[5]
    - type: paragraph
      text:
        ru: «У Њему бјеше живот, и живот бјеше светлост људима.» (Ин.1:4)
        cn: 「在他里面有生命，这生命是人的光。」（约翰福音 1:4）
    - type: paragraph
      text:
        ru: Не само постање света већ и само постање живота, сав живот у неизмерној тајанствености овојој дошао је од Бога Логоса, и сав «беше у Њему». Нема сумње, живот није нешто што је само од себе постало у већ постојећој творевини, у утроби природе; нити је «оно што постаде» могло да само од себе створи, произведе живот.
        cn: 不仅是世界的创生，更是生命本身的生成，整个生命，在其无垠的奥秘中，都源于上帝道，并且整个生命「在他里面」。毫无疑问，生命并非某种在早已存在的受造物中、在自然的子宫里自行生成之物；也不是「那已受造之物」能够自行创造、产生生命。
    - type: paragraph
      text:
        ru: 'Очигледно је: сав живот у свој целини својој, и у свима чудесним појединостима својим, води порекло непосредно од Бога Логоса. Све што у створеном свету постаде, па и сам живот – «Њиме постаде»; и за све живо важи ово: «без њега ништа не постаде што постаде» живо (Ин.1:3).'
        cn: 显而易见：所有生命，无论就其整体而言，还是就其所有奇妙的细节而言，都直接源自神圣的逻各斯。凡在受造世界中产生的一切，甚至生命本身——「万物是借着他造的」；对于所有活物而言，此理亦然：「没有他，凡被造而有生命的，没有一样不是借着他造的」 (约翰福音 1:3)。
    - type: paragraph
      text:
        ru: Силе и границе живота су у Богу Логосу. Зато је сав живот, и све што живи, еванђеље о Богу Логосу, проповед, благовест о Њему. Зато је тајна живота тако божански узвишена, сложена и дивна, јер је у њој – сав Бог Логос, који кроз њу и по њој разлива своја божанска тајиства и силе. Тако је и живот, од врха до дна, од почетка до краја, овоје врсте богојављење, христојављење. Све што живи, самом природом својом објављује Христа Бога Логоса. Зато се живот и појава живота у «мртвој» природи ничим не може објаснити до Богом Логосом. Пошто живот бићем својим тоне и извире из Бога Логоса и његових савршенстава, то и све његово у суштини има логосни карактер.
        cn: 生命的力量和界限都在圣言上帝之中。因此，所有的生命，以及一切有生命之物，都是关于圣言上帝的福音，是关于祂的宣讲、佳音。因此，生命的奥秘是如此神圣崇高、复杂而美妙，因为其中蕴含着完整的圣言上帝，祂透过它、借着它倾流出祂神圣的奥秘和力量。同样，生命，从上到下，从开始到结束，都是一种神显，是基督显现。一切有生命之物，都凭藉其自身本性宣告基督圣言上帝。因此，生命以及生命在「死寂」自然界中的显现，唯有圣言上帝才能解释。既然生命以其本质沉浸于并涌现自圣言上帝及其完全性，那么它的一切在本质上都具有圣言的特质。
    - type: paragraph
      text:
        ru: У тој логосности живота садржи се права логика живота. Логос и јесте једина божанска логика живота, зато се Он и назива «Логос живота» (1Ин.1:1). У ствари, без Христа, без те Логике, божанске Логике живота, нема једине божанске виодикеје, и сав живот постаје бесмислица, страшна и душеубиствена. Чим човек хоће да без Бога Логоса објасни, осмисли, оправда живот, већ је закорачио и ступио на клизаву литицу алогичности којом се отискује у потпуни хаос и смрт духовну. Јер шта је то смрт?
        cn: 在生命的这道性中，蕴含着生命的真正逻辑。道即是生命唯一的神圣逻辑，因此祂也被称为「生命之道」（约翰一书 1:1）。事实上，没有基督，没有那逻辑，那神圣的生命逻辑，就没有唯一的神圣神正论，所有的生命都变得毫无意义，可怕且摧残灵魂。一旦人想在没有道上帝的情况下解释、赋予意义、证明生命，他就已经踏上了非逻辑性的滑坡，由此坠入完全的混沌和属灵的死亡。因为死亡究竟是什么呢？
    - type: paragraph
      text:
        ru: 'Смрт је хтети бити жив без Бога Логоса. А она наступа чим човек хоће то да оствари. Први је са тим почео праотац Адам: хтео је да живи, али не Богом већ грехом. А то значи: хтео је да небићем изграђује овоје биће. И тако је смрт ушла у људску природу. А смрт? исте је природе и логике које и ђаво и грех и зло.'
        cn: 死亡就是想要没有神性道（罗格斯）而活着。而它一旦人想要实现这一点就降临。第一个以此开始的是原祖亚当：他想活着，但不是借着神而是借着罪。而这意味着：他想以非存在来建造他自己的存在。于是死亡进入了人的本性。而死亡，其本性与逻辑都与魔鬼、罪和恶相同。
    - type: paragraph
      text:
        ru: 'Или боље, једно је тројство: грех, смрт и зло; тројство – нераздвојно и једносушно. Оно и хоће да на призрацима, на привидима, на привиђењима зида себе, гради себе, заснива себе.'
        cn: 或者更确切地说，有一个三位一体：罪、死亡和邪恶；这个三位一体——不可分割，同本体。它也想要在幻影、虚幻和假象之上建造自己，建立自己，奠定自己。
    - type: paragraph
      text:
        ru: 'Чим људска мисао крене у грех, већ је ступила путем у духовну смрт. А духовна смрт настаје у души људској када се она одвоји од Бога Логоса, када неће да живи Њиме, када неће да верује у Њега, и најзад – када Га одриче и пориче, и тврди: нема Бога. То је врхунац смртности, она «друга» смрт (Откр.21:8), која и јесте најпакленији пакао за боголику душу људску, њен вечни пакао.'
        cn: 人类思想一旦转向罪，就已经踏上了通往属灵死亡的道路。属灵的死亡发生于人的灵魂，当灵魂与上帝圣言（Logos）分离，当它不愿靠祂而活，当它不愿相信祂，最终——当它否认和驳斥祂，并断言：没有上帝。这是死亡的顶点，是那「第二次」的死亡（启示录 21:8），这正是对神似的人类灵魂而言最地狱般的地狱，是它永恒的地狱。
    - type: paragraph
      text:
        ru: У тој другој смрти за душу човекову заиста нема Бога, заиста не постоји Бог, јер Га она неће у себи, неће његове животворне, светле и свете силе. А Бог се никоме не намеће насилно. Тако душа, која стварно живи само Богом Логосом и од Њега добија ове што је живо у њој, чим гресима и неверјвм потисне из себе Бога Логоса осгаје по инерцији жива, и у греху и у смрти жива. А живот, чија је једина суштаствена и радосна сила и једини логички бесмртни смисао – Бог Логос, чим изгуби Бога претвара се у смрт, у бесмислицу, у пакао, у ужас, у страшило, у наказно привиђење које лудачки проглашује себе за све и сва у свима световима. Тако душа саму себе мучи вечним мукама. А то и јесте пакао, који почиње у овом, да се, при непромењеној садржини душе, вечито продужи у оном овету. Пример? Богаташ у причи о богаташу и Лазару (Лк.16:19–31).
        cn: 在那第二次的死亡中，对于人的灵魂而言，确实没有上帝，确实不存在上帝，因为它（灵魂）不愿上帝在自身之内，不愿祂赋予生命的、光明的和神圣的能力。然而，上帝从不强行加诸于任何人。如此，灵魂，它实际上只靠着上帝圣言（逻各斯）而活，并从祂领受其内在一切生命之物，一旦借着罪和不信将上帝圣言（逻各斯）从自身驱逐出去，仍因惯性而存活，在罪中和在死亡中存活。然而，生命，其唯一的实质性且充满喜乐的能力，及其唯一的逻辑性不朽意义——就是上帝圣言（逻各斯）——一旦失去上帝，就转变为死亡，变为毫无意义，变为地狱，变为恐怖，变为一个吓人的怪物，变为一个畸形的幻象，它疯狂地宣称自己在所有世界中就是一切和所有。如此，灵魂就以永恒的痛苦折磨自己。而这正是地狱，它始于今生，以便在灵魂内容未曾改变的情况下，永远延续到来世。例证？富人与拉撒路的故事中的那个富人（路加福音 16:19-31）。
    - type: paragraph
      text:
        ru: 'Живот је по себи логосан, а то значи: божански логичан. Отуда: живети значи логосовати, логосне божанске силе и особине остваривати. Ући у живот значи: ући у све што је Логосно, Божије: у Његову светлост, истину, правду, доброту, љубав, бесмртност, мудрост. А пошто је Бог Логос – вечна божанска Светлост, то живети у ствари и није друго до светлети. И још: живети значи бити у светлости. Само као жива бића људи могу у светлости живота сагледати свој вечни, божански, логосни смисао.'
        cn: 生命本身是道性的，这意味着：它是神圣且合乎逻辑的。因此：活着就意味着按道而行，意味着实现道性的神圣能力与特质。进入生命意味着：进入一切属于道、属于神的事物：进入祂的光、真理、公义、良善、爱、不朽和智慧。既然神是道——那永恒的神圣之光，那么活着实际上无非就是发光。而且：活着意味着处在光中。只有作为活物，人们才能在生命的光中洞察到他们永恒的、神圣的、道性的意义。
    - type: paragraph
      text:
        ru: 'Живети за човека значи: душу, која је логосном светлошћу запаљена, одржавати у светлењу и горењу оним што је логосно, божанско, бесмртно. И све што живи у човеку, види свој прави пут само у светлости Бога Логоса. И што живи – Њиме живи. Зато што је свим бићем својим у Богу Логосу, живот и јесте живот и у исто време светлост. Бог Логос преко живота светли, и дарује светлост. А без тога и око тога је тама. Стога је тама синоним смрти, и сама смрт.'
        cn: 对人而言，活着意味着：使被逻格斯之光点燃的灵魂，凭借那逻格斯的、神圣的、不朽的事物，持续发光和燃烧。而凡活在人里面的一切，唯独在圣言上帝的光中，才能看见其真正的道路。而凡有生命的，都是靠祂而活。因为生命以其全部的存有居于圣言上帝之中，所以生命既是生命，同时也是光。圣言上帝通过生命发光，并赐予光。而没有了祂（圣言上帝），以及在祂（光照）之外的，便是黑暗。因此，黑暗是死亡的同义词，并且是死亡本身。
    - type: paragraph
      text:
        ru: 'Зато свети Еванђелист благовести: «и живот беше светлост људима» (Ин.1:4). Живот – светлост, живети=светлети, и то светлети Богом Лотооом. То је првобитна, божанска, бесмртна, неугасива светлост. И Она се сва оваплоћењем Бога Логоса уселила у човека, Она – «Истинита Светлост» (Ин.1:9). И отуда Богочовекова благовест: «Ја сам светлост света» (Ин.8:12).'
        cn: 因此，圣福音作者宣告：「生命是人的光」（约翰福音 1:4）。生命——光，活着即是发光，而且是借着上帝的道发光。那是原始的、神圣的、不朽的、不灭的光。而这光，借着上帝的道的道成肉身，全然居于人内，她就是「真光」（约翰福音 1:9）。因此，有了神人（基督）的宣告：「我是世界的光」（约翰福音 8:12）。
    - type: paragraph
      text:
        ru: Живот из прасуштине своје зрачи логосном светлошћу; отуда и материја од које је тело људско, састоји се из фотона, из светлосних зрнаца. Све што улази у живот људски саткано је од светлости, од светлосних сила и светлосне материје.
        cn: 生命从其本源散发着逻各斯的光；因此，构成人体的物质，由光子、由光粒子组成。一切进入人类生命的事物都由光、由光的力量和光的物质编织而成。
    - type: paragraph
      text:
        ru: «И Свјетлост свијетли у тами, и тама је не обузе» (Ин.1:5)
        cn: «光照在黑暗中，黑暗却不能胜过它。» (约翰福音 1:5)
    - type: paragraph
      text:
        ru: Живот? – Сав је у Богу Логосу и од Бога Логоса. Све што није од Њега и у Њему – у тами је. А то? – у смрти је. Јер је смрт оно што нема Бога Логоса, и што је изван Њега. А то је? – грех, и зло, и ђаво.
        cn: 生命？——全然在圣言上帝里面，并源于圣言上帝。凡不源于祂、不在祂里面的，都在黑暗里。那又如何？——那便是在死亡里。因为死亡就是那没有圣言上帝，并在祂之外的事物。那又如何？——那就是罪、是恶、是魔鬼。
    - type: paragraph
      text:
        ru: Ово троје. Али је све то троје – једна смрт. А смрт – то је непрекидна тама, вечна тама и мрак. Само та тама не шкоди Богу Логосу, не смањује, нити гаси Његову вечну и неугасиву Светлост, коју он пали животом и по људима. Она као и да не постоји, јер где логосна светлост светли тамо нема таме нити је може бити.
        cn: 这三者。但所有这三者——都是一死。而死亡——那是不间断的黑暗，永恒的黑暗和幽暗。唯独这黑暗不伤害圣言（道），不削减，也不熄灭祂那永恒而不灭的光，就是祂用生命并借着众人所点燃的光。它就如同不存在一般，因为凡有圣言（道）之光照耀之处，那里就没有黑暗，也不可能有黑暗。
    - type: paragraph
      text:
        ru: 'Зато свети Благовесник благовести: «И светлост се светли у тами, и тама је не обузе» (Ин.1:5). Тама је нешто ограничено, јер долази од сазданих бића; а светлост Бога Логоса је безгранична, зато је тама обузети не може. Она је безгранична и у људском животу као логосној творевини. Зато ни њега тама обузети не може све док светли Богом Логосом и зрачи његовим животворним силама.'
        cn: 于是，圣福音使徒传福音说：「光在黑暗里照耀，黑暗却不能胜过它。」(约翰福音 1:5) 黑暗是有限的，因为它源于受造之物；但上帝圣言的光是无限的，因此黑暗不能胜过它。这光在人的生命中也是无限的，作为按圣言而造的受造物。因此，只要他以上帝圣言发光，并散发祂赐生命的恩能，黑暗就也不能胜过他。
    - type: paragraph
      text:
        ru: 'Основно је хришћанско искуство из живота и рада Богочовека Господа Христа: «Бог је светлост, и таме у њему нема никакве» (1Ин.1:5). Љубав је Светлост, мржња је тама: «који љуби – у светлости живи; који мрзи – у тами је (1Ин.2:10–11). Новозаветно је начело: Свака еванђелска врлина је светлост; сваки порок је тама.'
        cn: 基督教的基本经验，来自神人主基督的生平与工作：「神就是光，在他毫无黑暗。」（约翰一书 1:5）爱是光，恨是黑暗：「爱者住在光明中；恨者在黑暗中。」（约翰一书 2:10-11）新约的原则是：每一种福音美德都是光；每一个罪恶都是黑暗。
    - type: paragraph
      text:
        ru: 'И светлост се светли у тами. Свети Златоуст богомудрује: Тамом се овде назива и смрт и заблуда. Вештаствена светлост светли не у тами, већ када нема таме; међутим еванђелска проповед светлила је у сред мрака заблуде која све опседа. Ова светлост прониче и у саму омрт и иобеђује је. Према томе, пошто ни смрт ни заблуда не савлађују ову светлост већ она свуда блиста и светли сопствеиом снагом, то Еванђелист и вели: «и тама је не обузе». Да, она је несавладљива, и не воли обитавати у душама које не желе просветљење…'
        cn: 光照在黑暗里。圣金口若望阐释道：此处的黑暗，指的是死亡和谬误。物质的光不在黑暗中照耀，而是在没有黑暗时才照耀；然而，福音的宣讲却在笼罩一切的谬误黑暗中照耀着。这光甚至穿透死亡本身，并且胜过它。因此，既然无论是死亡还是谬误都不能胜过这光，而是它凭着自身的力量处处照耀，所以，圣史才说：「黑暗未曾胜过光。」是的，这光是不可战胜的，并且它不喜欢居住在那些不渴望得到光照的灵魂中…
    - type: paragraph
      text:
        ru: Бог се не приближава нама силом, против наше воље, него по нашој вољи, по нашој жељи и благорасположењу. Не закључавај врата овој светлости, и доживећеш велику насладу. Ова пак светлост долази нам помоћу вере; и дошавши, веома просвећује онога који је прима. И ако јој ти понудиш чисти живот, она ће стално обитавати у теби.[6]
        cn: 上帝不强力地亲近我们，违逆我们的意志，而是依照我们的意志，我们的愿望和我们乐意的心。不要对这光关上门，你将体验到巨大的喜乐。而这光借由信德临到我们；并且，一旦临到，它就极大光照那接纳它的人。并且，如果你向它献上纯洁的生命，它就会常住在你里面。[6]
    - type: paragraph
      text:
        ru: 'Свети Кирил Александриски вели: Син није створен; напротив, Он је Бог и стога живот по природи… Он је живот по природи, као Бог из Бога и живот из живота … Бог и Отац је све у свему кроз Сива у Духу… По човекољубљу Бога твари имају светлост, и уједно са својим прелазом у биће доносе са собом као неку стављену у њих силу разума.[7]'
        cn: 圣基利尔·亚历山大里亚说：圣子未被造；相反地，祂是上帝，因此按其本性而言是生命……祂按其本性而言是生命，正如出自上帝的上帝、以及出自生命的生命……上帝与圣父在圣灵里借着圣子是一切中的一切……借着上帝的仁爱，受造物拥有光明，并且与它们进入存在的同时，带有一种被置入它们之中的理智能力。[7]
    - type: paragraph
      text:
        ru: «Би човјек послан од Бога, по имену Јован. Овај дође за свједочанство, да свједочи о Свјетлости, да сви верују кроз њега. Он не бјеше свјетлост, него да свједочи о свјетлости. Бјеше Свјетлост Истинита која обасјава свакога човека који долази на свијет. У свијету бјеше, и свијет кроз Њега постаде, и свијет Га не позна. Својима дође и своји Га не примише.» (Ин.1:6–11)
        cn: «有一个人，是从神那里差来的，名叫约翰。这人来，是要作见证，就是为光作见证，叫众人因他可以信。他不是那光，乃是要为光作见证。那光是真光，照亮一切生在世上的人。他在世界，世界也是藉着他造的，世界却不认识他。他到自己的地方来，自己的人倒不接待他。» (约翰福音 1:6-11)
    - type: paragraph
      text:
        ru: Свака стварчица, свако биће зрачи, светли Логосом, логосном светлошћу, јер је у томе суштина постојања и бића. Исто тако сва творевина скупа зрачи, светли логосном светлошћу. Али, да би то човвк могао угледати и сагледати, потребно је да има здраве очи душе, здрав вид ума, чисто срце. Јер греси су као скрама која падне на очи, те не виде светлост, иако она постоји свуда наоколо, и у вис до у бескрај, и на ниже до у бескрај, и са свих страна до у бескрај.
        cn: 每一个微小的受造物，每一个生命，都照耀着圣言（逻各斯），照耀着逻各斯之光，因为那便是存在与生命的本质。同样地，所有的受造物整体也照耀着逻各斯之光。但是，为了人能够看见并领悟这一切，就需要拥有健康的灵魂之眼，健康的心智之视，以及一颗纯洁的心。因为罪孽就像一层蒙在眼睛上的翳膜，使人看不见光明，尽管光明无处不在，向上直至无穷，向下直至无穷，从四面八方直至无穷。
    - type: paragraph
      text:
        ru: 'Највидовитији од људи до Христа у том погледу јесте Свети Јован Крститељ. Сва је његова мисија у томе: открити људима истиниту светлост. Он само о томе и сведочи као очевидац који ту светлост непрестано гледа и као богоосетљивац који ту светлост живо осећа.'
        cn: 在这一方面，基督之前的人当中，最有洞察力的就是圣约翰·施洗者。他全部的使命就在于：向人们揭示真光。他只为此作证，如同一个持续不断地瞻仰那真光的亲眼见证者，又如同一个活生生地感受那真光的神感者。
    - type: paragraph
      text:
        ru: 'Упоређен са том истинитом светлошћу, Свесветлошћу – Богом Логосом, и он није светлост, иако у човечанском свету светли шојом светлошћу и праведношћу као сунце. Иако је он, по речи Самога Спаситеља, био «највећи између рођених од жена», свети Еванђелист вели за њега: «Он не беше светлост, него да сведочи за светлост» (Ин.1:8).'
        cn: 与那真光，全然之光——圣言上帝相比，他也不是光，尽管在人类世界中，他以自己的光和公义如同太阳般照耀。尽管他，根据救主自己所说，是「凡妇人所生的，没有一个大过他的」，然而，圣福音书作者论及他时说：「他不是那光，乃是要为光作见证」（约翰福音 1:8）。
    - type: paragraph
      text:
        ru: 'Ма колико били «светлост света» (Мф.5:14) Свети Апостоли и остали Светитељи, њихова светлост је увек позајмљена од Бога светлости; они оу само преноситељи божанске Логосове оветлости. Циљ је њиховог доласка у овај свет, као и Претечиног: «да сведочи за светлост, да сви верују кроз њега» (Ин.1:7). Значи: он је само пут и прелаз и пролаз ка Истинитој Светлости – Богу Логосу. «Кроз њега» – Богу Логосу. То је целокупна проповед његова.'
        cn: 尽管圣使徒和其他圣徒是«世上的光»（马太福音 5:14），但他们的光总是从光的上帝那里借来的；他们只是神圣圣言之光的传递者。他们来到这个世界的目的，也如前驱者一样，是为了«为光作见证，叫众人因他信»（约翰福音 1:7）。这意味着：他只是通往真光——上帝圣言的道路、通路和途径。«借着他»——通往上帝圣言。这就是他全部的宣讲。
    - type: paragraph
      text:
        ru: 'Та Свесветлост није нешто страно и туђе људском бићу; њу ће пронаћи сваки човек у свакој твари само ако иде до њенота дна, до њенога срца: јер ту су и разливена безбројна зрнца Логосне светлости. А најпре, ту Свесветлост, њене најјаче одразе наћи ће у себи самом, у најтајнијој суштини свога људског бића. Јер са том светлошћу Бог Логос и шаље свако људско биће у овај наш земаљски свет. Та светлост и јесте суштина боголикости човечије. Она му је светлост у тами постојања.'
        cn: 这普照之光并非对人类而言是陌生与疏离之物；每个人都会在万物之中找到它，唯有深入其底蕴，抵达其核心；因为在那里，散布着无数圣言（道）之光的微粒。而首先，他会在自身之中，在他人类存有的最隐秘本质里，找到这普照之光及其最强烈之映照。因为正是带着这光，圣言（道）上帝将每一个人类存有差遣进入我们这尘世。这光正是人类神性肖似的本质。它于他而言是在存在之黑暗中的光。
    - type: paragraph
      text:
        ru: 'Главна, неугасива светлост. Зато је за човека и природно и лотично да верује у ту Лопосову Светлост, у Бога Логоса, у ту истиниту Светлост. То казују свете речи богонадахнутог Еванђелиста: «Беше светлост истинита која обасјава свакога човека који долази на свет» (Ин.1:9). «Свакога човека» без изузетка, био Хришћанин или нехришћанин. Јер та светлост и чини човека човеком, и људско биће људским бићем. То значи: сваки је човек по души логосан, по души Хришћанин; сваки је човек по природи својој христоносац, светлоносац. У томе је вечна вредност сваког човека. У томе је божанско величанство сваког човека.'
        cn: 首要的、不灭的光。因此，对人而言，相信那道逻各斯之光，相信逻各斯上帝，相信那道真实的光，既是自然的，也是合乎情理的。受神默示的福音书作者的圣言如此说：「那光是真光，照亮一切生在世上的人」(约翰福音 1:9)。「每一个人」都无一例外，无论是基督徒还是非基督徒。因为那道光使人成为人，并使人性成为人性。这意味着：每个人在灵魂上都是逻各斯性的，在灵魂上都是基督徒；每个人在其本性上都是承载基督者，承载光者。每个人永恒的价值就在于此。每个人神圣的尊严也就在于此。
    - type: paragraph
      text:
        ru: Долазећи на свет, сваки човек већ доноси у души својој мало Христово Еванђеље; сваки еванђелист, сваки – богослов, сваки – Христослов, сваки – христообјавитељ, сваки христопроповедник, сваки – богојавитељ.
        cn: 当降生世上，每个人在他的灵魂里都已经带来了一点基督的福音；每个人都是传福音者，每个人都是神学家，每个人都是基督论者，每个人都是基督的启示者，每个人都是基督的宣讲者，每个人都是神的启示者。
    - type: paragraph
      text:
        ru: 'Стога, у основи нема нико од људи изговор за свој нехришћански живот у свету, нико, поготову хришћани, јер они бар,по природи» својој треба да чине срж Христова Еванђеља. Утолико пре што је та логосна светост – логосна Светлост разливена по овима тварима и бићима. Све гласи, све громогласи Христа Бога Логоса; све што постоји слива се у једно огромно богојављење, христојављење: «у свету беше, и свет кроза њ постаде, и свет га не позна» (Ин.1:10), па и боголика круна света – човек. Па ипак: «свет га не позна» (Ин.1:10). Зашто? По слободи својој, по нежељи својој, по добровољно изабраном злу свом, богоборачком и христоборачким.'
        cn: 因此，根本上，在世上没有人能为自己不基督化的生活找借口，没有任何人，尤其基督徒，因为他们至少凭着他们「本性」理应构成基督福音的精髓。更何况那属道（逻格斯）的圣洁——属道（逻格斯）的光明——倾洒在这些受造物和众生之中。万物都在宣扬，万物都在轰鸣着宣扬基督上帝圣道（逻格斯）；凡存在的一切都汇聚成一个巨大的神显、基督显现：「祂在世界，世界也是藉着祂造的，世界却不认识祂」（约翰福音 1:10），甚至这世界神性的冠冕——人。然而：「世界却不认识祂」（约翰福音 1:10）。为何？凭着自己的自由，凭着自己的不愿，凭着自己自愿选择的、与上帝为敌又与基督为敌的邪恶。
    - type: paragraph
      text:
        ru: Зловољом својом, као неким свеобухватним црним звоном, људи су покрили све логосне светлости света, погасили све свеће, све лампе Божије у свету, и залетели се кроз своју таму у мрак и хаос. И тако се у њему стално копрцају и даве, еда би у своме мраку удаљиле све што их потсећа на Бога, на Христа.
        cn: 人们以其自身的恶意，如同一个无所不包的黑色钟罩，遮蔽了世上一切属道的亮光，熄灭了世上所有蜡烛和上帝的灯火，并穿过他们自身的黑暗，冲入了昏暗与混沌之中。他们便如此在其中不断地挣扎沉沦，为要在自己的黑暗中，除去一切提醒他们上帝和基督的事物。
    - type: paragraph
      text:
        ru: 'Људи, због логосне светлости коју са собом у природи својој доносе у овај свет, по природи су «своји» Христу, али по својој злој вољи су отућени од Христа, као да му нису никакав род. Зато еванђелист и пише: «К својима дође, и своји га не примише» (Ин.1:11). Повучена је овде врло танана разлика измећу људи као својих Христу, и осталих бића као својих Њему. Он је дошао «својима» обухвата сва бића, све твари овога света, и људе са њима, јер да се односи само на људе, еванђелист би рекао: «само људима». Но пошто су људи одбили да приме оваплоћеног Бога Логоса, а друге тварр остале уз Њега (камење, црквена завеса, земља, сунце=сва природа сем човека), то је свети еванћелист издвојио људе, а на челу свих људи – Јевреје, који су у најпотпунијем смислу били – своји.'
        cn: 人们，因着他们在自身本性中带入这世上的道（Logos）之光，按本性是基督的「自己人」，但因着他们邪恶的意志而与基督疏离，仿佛与祂毫无血缘关系。因此，福音书作者写道：「祂来到自己的地方，自己的人却不接受祂」（约翰福音 1:11）。这里作了一个非常细微的区分，在作为基督「自己人」的人类，与作为祂「自己人」的其他受造物之间。「祂来到自己的地方」涵盖了所有受造物，这世上的一切受造物，也包括人类在内；因为如果仅仅是指人类，福音书作者会说：「只对人类」。然而，既然人类拒绝接受道成肉身的上帝圣言（Logos），而其他的受造物却与祂同在（石头、圣殿的幔子、大地、太阳——即除了人类之外的所有自然界），于是圣福音书作者将人类单独列出，而所有人类中的首要群体——犹太人，他们是按最完全的意义上的「自己人」。
    - type: paragraph
      text:
        ru: «А онима који Га примише даде власт да буду чеда Божија, онима који верују у Име Његово.» (Ин.1:12)
        cn: 「凡接待祂的，祂就赐他们权柄，作神的儿女，就是信祂名的人。」（约翰福音 1:12）
    - type: paragraph
      text:
        ru: 'Све то знак је бескрајне слободе људске: да се људи односе према Богу по своме слободном личиом нахоћењу. У том погледу не постоји никакво насиље од стране Бога и Господа Христа према људима. Васцело Еванђеље његово је засноваео на тој слободи, на том слободном самоопредељивању за и против Христа.'
        cn: 所有这一切都是人类无限自由的标志：人们可以依照自己自由的个人意愿与上帝建立关系。在这方面，上帝和主基督对人没有任何强迫。祂的整部福音都建立在这种自由之上，建立在这种为基督或反基督的自由自我抉择之上。
    - type: paragraph
      text:
        ru: '«Ако хоћеш», то је Христово руководно начело у проповедању и придобијању за Еванђеље. Најочигледнији пример: Дванаесторица Апостола. Сви су они били очевидци Хриотових дела, чудеса, дотађаја, учења, па се ипак Јуда по овојој слободи определио против Христа, а Једанаесторица, исто тако по својој слободи, за Христа. А за њима – безброј других све до данас; а и за Јудом многи – све до данас.'
        cn: 「如果你愿意」，这是基督在传扬福音和争取世人归向福音上的指导原则。最明显的例子是：十二使徒。他们所有人都是基督的作为、神迹、事件和教导的目击者，然而，犹大却凭着他自己的自由意志选择了反对基督，而那十一位使徒，也同样凭着他们自己的自由意志，选择了归向基督。而在他们之后——直到今日，仍有无数其他人；在犹大之后——直到今日，也有许多人。
    - type: paragraph
      text:
        ru: Но тако ће бити и од данас до Страшнога суда. Који се год определе за Господа Христа, додају својој већ урођеној логосној светлости још много светлости и силе Христаве; они у светлости својој виде светлост Христаву; и она кроз веру и остале еванђелске врлине овим бујицама силази у душе њихове; и они лостају силни до непобедивости и свемоћи.
        cn: 但从今天起直到末日审判都将如此。凡是选择主基督的人，都会在他们已经与生俱来的逻各斯之光上，增添更多基督的光和力量；他们会在自己的光中看见基督的光；并且那光借着信心和其他福音的德行，如洪流般降临到他们的灵魂中；并且他们变得强大，达到不可战胜和全能的境地。
    - type: paragraph
      text:
        ru: 'Они непрекидно помоћу тих логосних оила «расту растом Божијим» (Кол.2:19) «у човека савршена», охристовљују се и постају синови Божји. То значе Еванђелистове речи: «А који га примише даде им власт да постану неда Божја који верују у име његово» (Ин.1:12). Свима који верују у име Његово даје се та свемоћна власт која биће људско преображава у сина Божјег, у наследника Божјег, коме као сунаследнику Богочовековом припадају сва блага и сва савршенства Божија.'
        cn: 他们不间断地藉着那些逻各斯的能力，「按着神的增长而增长」（歌罗西书 2:19），「成为完全人」，被基督化，并成为神的儿女。这就是福音作者的话语的意义：「凡接待祂的，祂就赐他们权柄，作神的儿女，就是信祂名的人」（约翰福音 1:12）。所有信祂名的人，都被赐予那全能的权柄，这权柄将人的存在转变为神的儿子，成为神的继承者，对他们而言，作为神人的共同继承者，一切神的福惠和一切神的完全都归于他们。
    - type: paragraph
      text:
        ru: «Који се не родише од крви, ни од жеље тјелесне, ни од жеље мужевљеве, него од Бога».  (Ин.1:13)
        cn: 「这等人不是从血气生的，不是从情欲生的，也不是从人意生的，乃是从神生的。」 (约翰福音 1:13)
    - type: paragraph
      text:
        ru: 'То човеково раћање, то његово развијање има ове одлике духовног рођења од Богоочовека и узрастање Богочовеком: «у човека савршеиа, у меру раста висине Христове» (Еф.4:13). Такав човек, такви људи свим бићем се рађају од Бога: сву своју вољу, све своје мисли, сва овоја осећања, сва своја расположења, сав свој живот изводе из Бога, из Његових светих заповести, и своде на Бога, на његове свете заповести. Они ове своје толико предају Богу, толико препуштају Богу да их Бог испуњује својом божанском љубављу, божанском Истнном, божанском Правдом, божанском Светлошћу, те они помоћу ових светих божанских сила прерађују себе у синове Божје, те љубе и творе све што је Божије, а презиру ове што је ћавоље.'
        cn: 这种人的诞生和发展，具有从神人而来的属灵重生，并以神人样式成长之特质：「成为完全人，达到基督长成身量的尺度」（以弗所书 4:13）。这样的人，这类人，以他们的全人从上帝而生：他们将自己所有的意志、所有的思想、所有的感受、所有的性情，以及自己所有的生命，都源于上帝，源于祂的圣洁诫命，并归向于上帝，归向于祂的圣洁诫命。他们将自己这些全然地献给上帝，全然地交给上帝，以至于上帝用祂神圣的爱、神圣的真理、神圣的公义、神圣的光充满他们。于是，他们藉着这些神圣的力量，将自己蜕变为上帝的儿子，爱慕并遵行一切属乎上帝的事，而鄙弃一切属乎魔鬼的事。
    - type: paragraph
      text:
        ru: 'Отуда онолико опитне истине у речима светог Богослова: «Који је год рођен од Бога не чини греха, јер његово семе стоји у њему, и не може грешити, јер је рођен од Бога» (1Ин.3:9). Тако у душама оних који верују у Христа све се непрекидно рађа од Бога; они све своје изводе из Бога: и мисли, и осећања, и расположења, и речи, и дела. Све од њих бива по Богу, ништа по човеку. Истинита је реч богонадахнутог еванђелиста о њима: Који се не родише од крви, ни од воље телесне ни од воље мужевље, него од Бога (Ин.1:13).'
        cn: 因此，在圣神学家的话语中有如此深刻的经验性真理：「凡从神生的，就不犯罪，因为他的种子存留在他里面；他也不能犯罪，因为他是由神生的」（约翰一书 3:9）。如此，在那些信靠基督之人的灵魂中，一切都持续地从神而生；他们一切所有都源于神：思想、感受、心态、言语和行为。他们的一切都是按着神而行，没有一样是按着人。神所默示的福音书作者关于他们的话语是真实的：「这等人不是从血气生的，不是从情欲生的，也不是从人意生的，乃是从神生的」（约翰福音 1:13）。
    - type: paragraph
      text:
        ru: Где је онда њихова воља? Сва у њиховој вери, у њиховој љубави, у њиховом богољубљу, у њиховом Христољубљу, у њиховом еванђелском животу, у њиховом живљењу Христом, и у Христу, и ради Христа; сва им је воља потчињена Богочовеку испуњавајући Његове свете заповести кроз подвизавање светим еванђелским врлинама и служење светим еванђелским истинама.
        cn: 那么，他们的意志何在呢？他们的意志完全在于他们的信仰，在于他们的爱，在于他们对神的爱，在于他们对基督的爱，在于他们合乎福音的生活，在于他们藉着基督而活，在基督里活，并为基督而活；他们的全部意志都顺服于神人，借由操练圣福音美德，并事奉圣福音真理，来履行祂的神圣诫命。
    - type: paragraph
      text:
        ru: «И Логос постаде тијело и настани се међу нама, и видјесмо славу Његову, славу као Јединороднога од Оца, пун благодати и истине» (Ин.1:14)
        cn: 「道成了肉身，住在我们中间，我们也见过他的荣光，正是父独生子的荣光，充充满满地有恩典有真理。」（约翰福音 1:14）
    - type: paragraph
      text:
        ru: '«И Логос постаде тело» (Ин.1:14): сав Бог Логос постаде човек. А раније је на други начин био присутан у телу, у човеку; и опет још на друкчији начин у осталим бићима и тварима. Сада? Сав Бог Логос, са свима божанским савршенствима «постаде тело», вештаство, и кроз тело показа Себе целог, показа ову пуноћу овога Божанства (ср.Кол.2:9). Поставши човек Бог Логос је на најприснији и најпотпунији начин сјединио Себе са људском природом, и кроз своје посебно тело – са целокупном природом људском. Зато Еванђелист додаје: «и обитаваше међу нама» (Ин.1:14). Као човек, Он није само за себе човек већ је то ради нас и за нас, и зато «мећу нама». Он «постаде тело» да би показао како је и тело ради Бога и за Бога; како је и оно позвано, и има за циљ да се испиуни Богом Логосом; да живи Њиме и ради Њега и у Њему, да се сво испуни Богом, да оваплоти у себи Бога.'
        cn: «和 道成了肉身» (约翰福音 1:14)：整个神道成了人。而在此之前，祂曾以另一种方式存在于肉身中，在人里面；又以另一种方式存在于其他众生和万物中。现在呢？整个神道，带着一切神圣的完满，「成了肉身」，成了实质，并通过肉身显明了祂自己整体，显明了这神性的丰盛（参考歌罗西书 2:9）。神道既已成为人，便以最亲密和最完整的方式使自己与人性联合，并借着祂特殊的身体——与整个人类本性联合。因此，福音书作者补充道：「并住在我们中间」（约翰福音 1:14）。作为人，祂不仅仅是为了祂自己而为人，更是为了我们，并为着我们，因此「住在我们中间」。祂「成了肉身」是为了显明肉身也是为了神，并为着神；肉身也蒙召，并旨在被神道充满；藉祂而活，为祂而活，并在祂之内而活；使自己完全被神充满，在自身中具化神。
    - type: paragraph
      text:
        ru: 'Мало људско тело – сместило у себи целог Бога Логоса. Да, у томе је света тајна, и света истина, и света стварност: тело је храм Бога, обиталиште Бога, дом Бога. Малецно тело људско смешта у себи Несместивог. Како?'
        cn: 渺小的人类身体——在自身之中容纳了整个圣言（道）上帝。是的，这正是神圣的奥秘，和神圣的真理，和神圣的现实：身体是上帝的殿，上帝的居所，上帝的家。渺小的人类身体在自身之中容纳了不可容纳者。如何？
    - type: paragraph
      text:
        ru: 'Ено стварности у Светој Богородици Дјеви: Она Духом Светим зачиње, носи и рађа несместивог Бога Логоса. Да, необјашњиво али истинито. Да је истинито, показује касније целокупна историја на звмљи Богочовека Христа, Сина Свете Дјеве. Целокупним својим животом и радом на земљи Он је показао да је Бог, и тиме да је Света Дјева, Богородица, јер је родила Бога и Господа Исуса Христа.'
        cn: 这就是事实，在圣童贞女、上帝之母身上：她藉着圣灵受孕，怀胎并分娩那不可容纳的圣言上帝。是的，不可解释但却真实。其真实性，日后彰显在圣童贞女之子——基督神人，在世上的全部历史中。祂藉着祂在世上的全部生命和工作，显示祂是上帝，也由此显示圣童贞女是上帝之母，因为她生下了上帝和主耶稣基督。
    - type: paragraph
      text:
        ru: 'Сва божанска савршенства која је Бог Логос донео и унео у тело поставши тело богомудри Еванђелист назива благодаћу и истином. Он благовести: Бог Логос, поставши тело, обитаваше мећу нама «пун благодати и истине» (Ин.1:14). А сва та божанска савршенства, ову ту благодат и истину, Богочовек је показао кроз дела своја и речи своје, кроз свој богочовечански домострој спасења света «и видесмо славу Његову, славу као Јединороднога од Оца» (Ин.1:14).'
        cn: 圣言神（Logos）道成肉身，将一切神圣的完全带入并融入肉身之中，蒙神启示的智慧的福音作者称之为恩典与真理。他宣讲道：圣言神道成肉身，住在我们中间，「满有恩典和真理」（约翰福音 1:14）。而所有那些神圣的完全，这恩典与真理，神人通过祂的作为和祂的言语，通过祂拯救世人的神人奥秘安排而彰显出来，「我们也见过祂的荣光，正是父独生子的荣光」（约翰福音 1:14）。
    - type: paragraph
      text:
        ru: «Видесмо» ми, не само ја, један у неком углу неког маленог града галилејског или засеоку јудејском, већ ма, сви ми људи, савременици Његови за жнвота Његова на земљи. «Видесмо» ову славу Бога и силу Божју у телу људском у телу Исуса Назарећанина, Јединородног Сина Божјег.
        cn: '«我们看见了》，不是单单我，一个在加利利某个小城或犹大某个村庄的角落里的人，而是，我们所有的人，祂在世时的同代人。

          «我们看见了»上帝的荣耀和上帝的权能，在人的身体里，在拿撒勒人耶稣，上帝的独生子的身体里。'
    - type: paragraph
      text:
        ru: '«Јован свједочи о Њему и виче говорећи: Ово је Онај за кога рекох: који за мном долази испред мене, јер прије мене бјеше. И од пуноће Његове ми сви примисмо, и благодат на благодат. Јер се Закон даде преко Мојсеја, а благодат и истина постаде кроз Исуса Христа.» (Ин.1:15–17)'
        cn: «约翰为他作见证，并且喊着说：「这就是我所说的：那在我以后来的，却是在我以前的，因为他是在我以前的。」 从他的丰盛里，我们都领受了，而且恩上加恩。因为律法本是借着摩西赐下的，而恩典和真理却是借着耶稣基督成就的。» (约翰福音 1:15-17)
    - type: paragraph
      text:
        ru: Први сведок Богочовека, његове силе и славе – Свети Јован Претеча. Он не само сведочи за Њега него и «виче» да би га сви чули и разумели. Шта сведочи Јован?
        cn: 圣约翰前驱是神人、祂的能力与荣耀的首位见证者。他不仅为祂作见证，而且「呼喊」，好让所有人都能听见祂并理解祂。约翰作了什么见证？
    - type: paragraph
      text:
        ru: 'Сведочи: да је Исус – Бог у телу; порекло његово је не у свету човечанском, јовановском; иако рођењем у телу долази иза Јована, Он као Бог Логос беше пре њега: «Овај беше онај за кога рекох: који за мном иде преда мном бејаше, јер он пре мене беше» (Ин.1:15).'
        cn: '它见证说：耶稣——是道成肉身的神；祂的源头并非属乎人类的、约翰式的世界；尽管祂肉身降生在约翰之后，但作为圣言（逻各斯）上帝，祂在约翰之前就已存在：

          「这就是我曾说：『那在我以后来的，反在我以前，因他本来在我以前。』」 (约翰福音 1:15)'
    - type: paragraph
      text:
        ru: 'Али у томе се и састоји изузетни значај Исусов у овом свету: што Он – Вечни – обитава у ограниченом телу људском, Он – Непролазни – у пролазном телу, Он – сав Бог, сва Истина Божја, сва Доброта, сва Љубав, сва Мудрост живи у мајушном телу људском.'
        cn: 但这也正是耶稣在这个世界上非凡意义之所在：他——永恒者——寓居于有限的人类身体中，他——不朽者——寓居于必朽的身体中，他——全然的上帝，上帝的一切真理，一切良善，一切的爱，一切的智慧——活在微小的人类身体中。
    - type: paragraph
      text:
        ru: 'И то тако да «ми сви од пуноће Његове примисмо и благодат на благодат» (Ин.1:16), примисмо: од његове божанске Љубави, и сад знамо њу, јер њоме живимо; примисмо и од Његове божанске Доброте, и од његове божанске Истине, и од његове божанске Мудрости, и од свеколике његове божаноке пуноће; и све то сад знамо, и све то сад имамо, јер тиме и живимо у његовом Богочовечанском Телу – Цркви.'
        cn: 如此，我们都「从他丰满的恩典里领受了，而且恩上加恩」（约翰福音 1:16）。我们领受了：从他神圣的爱，现在我们认识这爱，因为我们藉着这爱而活；我们也领受了从他神圣的良善，从他神圣的真理，从他神圣的智慧，以及从他一切神圣的丰满；这一切我们现在都认识，这一切我们现在都拥有，因为我们借此在他的神人同体的身体——教会中生活。
    - type: paragraph
      text:
        ru: А све то по богатству своме, по новини својој, по истинитости својој, по бескрајности, безграничности, неизмерности својој толико превазилази оно што смо имали и знали о томе у Закону и природи, да се заиста може рећи да је све то тек са Исусом постало, и да свега тога раније као да није ни било.
        cn: 而这一切，按照其丰盛、其新颖、其真实性、其无限性、无边性、不可测度性，如此超越了我们过去在律法和自然界中所拥有和了解的，以至于确实可以说，这一切唯独是随着耶稣才产生的，而且在这之前，这一切仿佛根本就不存在。
    - type: paragraph
      text:
        ru: 'То значе речи светог Еванђелиста: Јер се Закон даде преко Мојсија а благодат и истина постаде кроз Исуса Христа (Ин.1:17).'
        cn: 这是圣史的话语：因为律法是藉着摩西传的，而恩典和真理却是藉着耶稣基督而来的（约翰福音 1:17）。
    - type: paragraph
      text:
        ru: 'Христос и Истина, Христос и Благодат су толико једно, да пре Христове појаве у телу, њих као да није било у овоме свету. Благодат означава сва божанска савршенства и све божанске силе које Бог Логос доноси у наш земаљски свет оваплотишши се, поставши човек. А сва та божанска савршенства, све те божанске силе биле су у старозаветном свету присутне преко својих сенки; једино оваплоћени Бог Логос даје их роду људском у потпуној божанској и човечанској стварности и пуноћи: свестварности и свепуноћи.'
        cn: 基督与真理，基督与恩典是如此合一，以至于在基督肉身显现之前，它们仿佛不曾存在于这世上。恩典意指一切神圣的完满和一切神圣的力量，是神圣的道（Logos）借着道成肉身、成为人而带到我们这尘世的。而所有这些神圣的完满，所有这些神圣的力量，在旧约时代的世界中是借由它们的影子而存在；唯有道成肉身的神圣的道才将它们赐予人类，在完整的神性与人性的实在和丰满中：即完全的实在和完全的丰满。
    - type: paragraph
      text:
        ru: 'После Њега и помоћу Њега ми имамо и знамо: савршену божанску Истину, савршену божанску Правду, и остала божанска савршена својства и силе; имамо их у њиховој божанској безграничности и савршености и вечности, али и у њиховој савршеној земаљској остварености и стварности, зато је охристовљени Еваиђелист у потпуном праву када тврди да «благодат и истина постаде кроз Исуса Христа».'
        cn: 因着祂，并藉着祂的帮助，我们拥有并认识到：完美的属神真理，完美的属神公义，以及其他属神完美的属性和能力；我们拥有它们，是在它们神圣的无限性、完美性与永恒性中，也是在它们完美的属世实现与真实性中。因此，被基督化的福音撰写者完全有理由宣称：「恩典和真理都是藉着耶稣基督来的。」
    - type: paragraph
      text:
        ru: «Бога нико није видио никад; Јединородни Син који је у наручју Оца, Он Га објави.» (Ин.1:18)
        cn: 「从来没有人见过神；独生子，那在父怀里的，他将神表明出来。」（约翰福音 1:18）
    - type: paragraph
      text:
        ru: 'Да је тако, да Исус Христос заиста доноси сва божанока савршенства, и оличава и показује васцелог Бога са свима Његовим својствима, силама, савршенствима, доказују даље речи боганадахнутот благовесника: «Бога нико није видео никад: Јединородни Син који је у наручју Очеву, Он га објави» (Ин.1:18). – Да, «Бога нико није видео никад», али ови могу да Га виде у Исусу: Он објављује Бога целокупним својим бићем, сваким својим поступком, осећањем, речју, мишљу, делом, и то објављује васцелог у свој пуноћи Његовој.'
        cn: 事实的确如此，耶稣基督确实带来了所有神圣的完满，并且具身化并显明了整个上帝及其所有的属性、能力、完满。这些都进一步由那受神默示的传福音者的话语所证实：「从来没有人看见神，只有在父怀里的独生子将他表明出来。」（约翰福音 1:18）——是的，「从来没有人看见神」，但人们可以在耶稣里看见祂：祂以其整个存有，以其每一个举动、感受、言语、思想、行为来显明上帝，并且是在其完全的丰盛中显明了整全的上帝。
    - type: paragraph
      text:
        ru: '«Ми сви примисмо благодат на благодат» (Ин.1:16): примисмо све Христове врлине једну за другом, љубав за правдом, истину за љубављу; шта више: примисмо, и примамо васцелог Бога кроз свето Причешће. И Њиме постојимо; и Њиме живимо. И све што је Христово доживљујемо као своје, наше, људско, богочовечанско. И кроза све то видимо Јединог Истинитог Бога и Господа – Богочовека Исуса Христа.'
        cn: 「我们都领受了恩上加恩」（约翰福音 1:16）：我们领受了基督所有的美德，一个接着一个：爱紧随公义，真理紧随爱；甚至，我们过去领受了，现在也正在领受借由圣餐而来的整全的上帝。并且藉着祂我们得以存有；藉着祂我们得以存活。我们将所有属于基督的一切都体验为我们自己的、我们人类的、神人性的。并且透过这一切，我们看到独一的、真实的上帝和主——神人耶稣基督。
    - type: paragraph
      text:
        ru: 'И још ова благовест над благовестима, радост над радостима: «Бога нико не виде никад: ако имамо љубав међу собом, Бог у нама стоји, и љубав је његова савршена у нама» (1Ин.4:12). Што важи за Христову божанску љубав, важи и за његову божанску Истину и Правду, и Доброту, и Мудрост, и Живот. Све је то оно «што чусмо, што видесмо очима својим, што расмотрисмо и руке наше опипаше» у оваплоћеном Богу Логосу – Богочовеку Господу Исусу (1Ин.1:1), Једином Спаситељу човека и света.'
        cn: 并且还有这福音中的福音，喜乐中的喜乐：「从来没有人见过神，我们若彼此相爱，神就住在我们里面，他的爱在我们里面得以完全了」（约翰一书 4:12）。凡适用于基督神圣之爱的，也同样适用于他神圣的真理、公义、良善、智慧和生命。所有这一切，正是我们在道成肉身的上帝圣言——神人主耶稣（约翰一书 1:1），即人类和世界的唯一救主身上，「所听见、所看见、亲眼看过、亲手摸过」的。
    - type: paragraph
      text:
        ru: 'Ово еванђелско учење о Богу Логосу потпуно је самостално и опитно, засновано на живом историском искуству. Ту нема ничег из оне апстрактне философске логосологије, од оних учења о Логосу: александриског, платоновоког, стојичког, неоплатоновског, филоновског.'
        cn: 这份关于神圣道（Logos）的福音教导是完全独立且经验性的，它基于活生生的历史经验。其中没有任何抽象的哲学性逻格斯学（logos-ology），也无关于那些亚历山大派、柏拉图派、斯多葛派、新柏拉图派、斐洛派的道（Logos）学说。
    - type: paragraph
      text:
        ru: 'Ови философски логоси су увек, више или мање, трансцендентна бића, или силе, или појмови, или идеје, али никада личност, најмање савршена божанска Личност, Бог Логос, а још мање и од најмањег: Бог Логос који се оваплотио, постао човек и делао као жива и стварна човечанска личност у извесном периоду људске историје.'
        cn: 这些哲学上的逻各斯（Logos）总是或多或少地，是超然的存有、能力、概念或观念，但绝不是一个位格，遑论那完美的、神圣的位格——上帝逻各斯，更遑论那道成肉身、成为人、并在人类历史的特定时期作为活生生且真实的位格而行事的上帝逻各斯了。
    - type: paragraph
      text:
        ru: 'Свети Златоуст благовести: Ако Бог Логос, та «истинита светлост обасјава свакога човека који долази на свет», откуда онда толики људи остају необасјани, непросветљени. Свакако отуда што сви нису познали веру Христову. А како Он «просветљује свакога човека»? – Сразмерно пријемљивости свакога. Ако неки, по својој вољи, затворивши очи ума свога, не желе да приме зраке те светлости, онда њихово помрачење произлази не од природе саме светлости већ од злоће тих људи који својевољно лишавају себе дара.'
        cn: '圣金口若望宣告说：


          如果上帝圣言，即「那照亮每个来到世上之人的真光」，那么为何有如此多的人仍然未被光照、未受启迪呢？显然，那是因为并非所有人都认识基督的信仰。然而，祂又如何「启迪每个人」呢？——这乃是依照每个人自身的领受能力。如果有些人，凭着自己的意愿，闭上自己心智的眼睛，不愿领受那光芒的射线，那么他们的昏暗并非源于光本身的性质，而是源于那些人自愿剥夺了自己这份恩赐的邪恶。'
    - type: paragraph
      text:
        ru: Благодат се излива на све; она није туђа ни Јеврејину, ни Јелину, ни Варвару, ии Скиту, ни слободњаку, ни мужу, ни жени, старцу ни младићу; она је свима подједнако блиска и све равноправно призива. Оне пак, који не желе да се користе тим даром, они правично сами себи дужни су приписати тако ослепљење. И они гину не од чега другог већ од своје сопствене порочности.[8]
        cn: 恩典倾泻在所有人身上；它对犹太人、希腊人、化外人、西古提人、自由人、男人、女人、老人或年轻人，都并非陌生；它对所有人都是同样亲近的，并平等地呼召所有人。然而，那些不愿受益于这恩赐的人，他们理应将这样的盲目归咎于自己。他们灭亡并非因为其他任何事物，而是因为他们自己的邪恶。[8]
    - type: paragraph
      text:
        ru: 'Тајна живота, тајна светлости, тајна вере је у Богу Логосу. А кроз Бога Логоса у Светој Тројици. По благовести светог Кирила Александриског: Све је од Оца кроз Сина у Духу Светом… Бог Логос обитава међу тварима као међу својима. Разуме се, свет је свој Богу по творевини и превођењу ка Њему и кроз Њега. Тако, получивши најзад поново првобитну красоту своје природе и иреображени сходно оној божанственој природи побеђујмо зло које нас сналази.'
        cn: 生命的奥秘、光明的奥秘、信仰的奥秘都在于上帝道。并且借着上帝道，存在于圣三一之中。根据圣基里尔·亚历山大宗主教的教诲：一切都源于父，借着子，在圣灵里… 上帝道在受造物中居住，如同在祂所拥有的中间。当然，世界借着创造、借着归向祂的引导以及借着祂，都属于上帝。如此，我们最终再次获得本性的原始美善，并依照那神圣的本性被转化，从而战胜临到我们的邪恶。
    - type: paragraph
      text:
        ru: 'Стога, дакле, узлазимо у надприродно достојанство кроз Христа, и будимо и ми синови Божији, не без икакве разлике с Њим. Подражавајмо Му по благодати. Он је истинити Син од Оца, истина изражена у речима: «Рекох: богови сте и синови Вишњега сви» (Псал. 81:6). Ми смо синови по усиновљењу и подражавању, а Он по природи и истински. Кроз веру у Христа ми постајемо заједничари Божје природе и називамо се богови по благодати.[9]'
        cn: 所以，那么，我们借着基督升入超自然的尊严，让我们也成为上帝的儿子，并非与他毫无区别。让我们靠着恩典效法他。他是父的真儿子，这个真理表达在这些话语中：「我说：『你们是神，都是至高者的儿子。』」 (诗篇 81:6) 我们是借着收纳和效法而成为儿子，而他是按着本性，是真实的。借着对基督的信仰，我们成为上帝本性的有份者，并靠着恩典被称为神。[9]
    - type: paragraph
      text:
        ru: '«И ово је свједочанство Јованово кад послаше Јудејци из Јерусалима свештенике и левите да га запитају: Ко си ти? И признаде и не порече; и признаде: Ја нисам Христос.» (Ин.1:19–20)'
        cn: 「这是约翰的见证，当犹太人从耶路撒冷差遣祭司和利未人去问他：『你是谁？』他就承认，并不否认；他承认说：『我不是基督。』」 (约翰福音 1:19-20)
    - type: paragraph
      text:
        ru: 'Сведочанство Светог Претече месијанског карактера. Као пророк Божји, као анђео Божји, као Претеча Христов, он Богом зна какав треба да је Месија=Христос. Иако «највећи између рођених од жена», тј. највећи човек, он изјављује питачима: «ја нисам Христос». То не може нико од људи ни бити. Богоучени Јован то јасно зна и осећа, јер Христос је Месија чије се месијаисшо састоји у томе да род људски ослободи греха, смрти и ђавола. Зар онда може човек бити Месија, па макар тај човек био «највећи измећу рођених од жена» – Свети Јован Крститељ?'
        cn: 圣先驱者弥赛亚特性的见证。作为神的先知，作为神的使者，作为基督的先驱者，他蒙神启示知道弥赛亚=基督当是怎样的。尽管是「凡妇人所生的，没有一个大过他」——即，最伟大的人，他向提问者宣告：「我不是基督。」这绝非任何人所能是。蒙神教导的约翰清楚地知道并感受到这一点，因为基督是弥赛亚，他的弥赛亚特性在于将人类从罪、死亡和魔鬼中解救出来。那么，人怎能成为弥赛亚呢？即便那个人是「凡妇人所生的，没有一个大过他」——圣约翰施洗者？
    - type: paragraph
      text:
        ru: 'Зашто Свети Претеча на питање свештеника: «ко си ти?» – одговара «ја нисам Христос». Зато што он зна да они желе да сазнаду да ли је он Месија. То је било доба нарочите духовне узбуђености, месијанске узнемирености, када се Месија грозничаво очекивао од стране јвврејског народа. Шта више, Претеча са осећањем, и убеђењем, и одлучношћу исповедника изјављује да није Христос: «исповеди». И та реч два пута се понавља у истој реченици, да не би било двоумице код учених и лукавих питача јерусалимских.'
        cn: 为什么圣先驱者在祭司问他「你是谁？」时，回答说「我不是基督」？因为他知道他们想知道他是不是弥赛亚。那是一个特别的属灵激动和弥赛亚骚动不安的时期，当时弥赛亚正被犹太民族狂热地期待着。不仅如此，先驱者怀着一个宣信者的情感、确信和决心，宣告他不是基督：「他宣认了。」这个词在同一句话中重复了两次，以免耶路撒冷那些博学而狡猾的提问者心存疑虑。
    - type: paragraph
      text:
        ru: '«И упиташе га: Шта дакле? Јеси ли ти Илија? И рече: Нисам. Јеси ли ти пророк? И одговори: Не.» (Ин.1:21)'
        cn: «于是他们问他：那么你是谁呢？你就是以利亚吗？他说：我不是。你就是那先知吗？他回答说：不是。» (约翰福音 1:21)
    - type: paragraph
      text:
        ru: 'И остала питања јерусалимских пигача су месијанског карактера. Зачуђени првим одговором Претечиним, они настављају: «ко си онда?»'
        cn: 耶路撒冷的发问者们剩余的问题都具有弥赛亚的性质。他们对先行者的第一个回答感到惊讶，便继续追问：「那你到底是谁呢？」
    - type: paragraph
      text:
        ru: 'По свему, као да веле; ти личиш на Месију: по животу, по учењу, по испосништву. Ако ти ниси Христос, ко онда може бити? «Јеси ли Илија?» питају они даље. Јер по светим пророштвима старозаветним Илија се има на известаи начин јавити као Претеча Месије. Крститељ одлучно одговара: «Нисам». И треће питање којима се затвара круг месијанских питања: «Јеси ли пророк?»'
        cn: 综观一切，他们仿佛在说：你像弥赛亚：无论是生活、教导还是苦修。如果你不是基督，那么谁会是呢？「你是以利亚吗？」他们接着问。因为根据旧约的圣先知预言，以利亚将以某种方式显现，作为弥赛亚的开路先锋。施洗者坚定地回答：「我不是。」而第三个问题，也正是弥赛亚系列问题的终结：「你是那位先知吗？」
    - type: paragraph
      text:
        ru: 'И опет одлучан одговор: «Нисам». Зар свети Претеча није пророк? – Јесте и већи од свих пророка, по речима Спаситеља, само он није онај пророк о коме је боговидац Мојсије пророковао као о Месији, Спаситељу. Богомислилац и провидац: до дна провиди у душе питача, и својим одгавара на оно главно питање које се скрива ита свих њихових обилазних питања, на питање: Јеси ли ти Христос?'
        cn: 又一次坚决的回答：「我不是。」难道圣先驱者不是先知吗？是的，他就是，并且按照救主的话，他比所有先知都伟大，只是他不是那位神视者摩西曾预言为默西亚、为救主的先知。神思者和预见者：他彻底看透了提问者的灵魂深处，并以他的回答回应了那个隐藏在他们所有迂回问题之下的主要问题——那个问题是：「你是不是基督？」
    - type: paragraph
      text:
        ru: '«А они му рекоше: Ко си? Да одговор дамо онима који нас послаше: Шта кажеш о себи самом? Рече: Ја сам глас вапијућег у пустињи: Поравните пут Господњи, као што каза Исаија пророк.»  (Ин.1:22–23)'
        cn: 「他们就问他说：『你是谁？好叫我们回复那差我们来的人。你自己说是谁呢？』他说：『我是在旷野有人声喊着说：修直主的道路，正如先知以赛亚所说的。』」(约翰福音 1:22-23)
    - type: paragraph
      text:
        ru: 'Стога је њихово последње питање искрено и јасно: «Ко си? да можемо одговорити онима што су нас послали: шта кажеш о себи самом?» Нема сумње, целокупном појавом својом свети Претеча је поставзвао собом месијансже проблеме, и изазивао их, и распиривао их; он је сав у тим проблемима; зато је и Богом послан да их решава, и коначно реши указавши иа Месију – Богочовека Христа. У земаљском свету, који је пустиња греха и смрти, свети Претеча је свеснији од ових скупа и од свакога посебно, опустошености природе људске, васцелог рода људског, грехом и смрћу. Зато је он ваистину пустињак, изузетан по свему, и мисија његова заиста пустињачка и изузетна. Стога и одговара на последње питање речима: «Ја сам глас онога који виче у пустињи: Поравните пут Господњи; као што каза пророк Исаија» (Ин.1:23).'
        cn: 因此，他们最后的问题是真诚而清晰的：「你是谁？好叫我们能回复那些差遣我们来的人：你自己怎么说呢？」毫无疑问，凭着他整个的显现，圣先驱者带来了弥赛亚的问题，挑起了它们，并煽动了它们；他完全沉浸在这些问题中；因此他也被上帝差遣来解决它们，并最终解决它们，指明了弥赛亚——神人基督。在这个世俗世界里，这个世界是罪恶与死亡的旷野，圣先驱者比这些群体和其中任何一个人都更清楚地意识到，人性、整个人类，因罪恶和死亡而荒芜。因此他确实是位隐士，在各方面都与众不同，他的使命也确实是隐士般的、非凡的。因此，他用以下的话语回答了他们最后的问题：「我是在旷野里呼喊者的声音：修直主的道路；正如先知以赛亚所说的。」 (约翰福音 1:23)。
    - type: paragraph
      text:
        ru: Од муке људске, свељудске; од греха људског, свељудског; од смртности људоке, свељудске, човек се сав, овим бићем својим претворио у глас, вапајни глас, који се разлеже бескрајном пустињом људског живота, људских душа, и сваке људске душе посебно. Зар није свако од њих и све оне скупа, пустиња, у којој све што је божанско и бесмртно, превија се, мучи, обамире, издише и умире од греха и смрти? Нема пута Господњег у пустињи живота људскгаг. Пут од душе до Бога сав је пороцима излокан, испроваљиван, упропашћен. Ко може по њему поћи и до Бога доћи? Ове што је људско, толико је опусшшеио грехом и смрћу, да беспомоћно умире у оромној пустињи својој.
        cn: 从人的、普世的痛苦；从人的、普世的罪；从人的、普世的必死性，人全然以他这整个生命，化为一声悲恸的呼号，在人类生命、人类诸般灵魂，以及每一个人的灵魂那无尽的旷野中回荡。难道他们每一个人，以及他们所有人，不正是旷野，在其中，所有神圣和不朽的事物，都因罪和死亡而挣扎、受苦、萎靡、气息奄奄、死去吗？在人类生命的旷野中，没有主的道路。从灵魂通往神的道路，全然被诸般罪恶侵蚀殆尽、冲毁不堪、荒废无用。谁又能沿着它行走并抵达神呢？所有属人的存在，如此被罪和死亡摧残荒芜，以至于它在自身巨大的旷野中无助地死去。
    - type: paragraph
      text:
        ru: Зато нема људима спасења од греха које би оии сами измислили и остварили. Спасење им може доћи од Онога који је Безгрешан и Бесмртан, и стога моћан и силан да сатре и грех и смрт.
        cn: 然而，人们无法从他们自己构思和实现的罪中获得救赎。救赎可以从那位无罪且不朽者而来，祂因此大有能力，足以摧毁罪和死亡。
    - type: paragraph
      text:
        ru: 'Па ипак, ви људи можете да у томе нешто учините: освестите се, дођите к себи и сагледајте и своју и свеопшту грешност; будите колико толико свесни својих и свеопштих грехова људских, који су вас затворили у безизлазну тамницу смрти, и нека се то излије у покајничко расположење, и тим покајањем ви ћете поравнити пут Господњи, и Он ће њиме доћи у живот ваш, у душу вашу, ући у опустошени и опустињени свет ваш.'
        cn: 然而，你们世人可以在这事上有所作为：醒悟吧，回转己心，察觉你自身的以及普世的罪性；要多少有些觉察到你自身和普世人类的罪过，这些罪过将你们囚禁在无法逃脱的死亡牢狱中，并让这倾泻为悔改的心志，藉着这悔改，你们将修直主的道路，他必借此道进入你们的生命，进入你们的灵魂，进入你们荒芜贫瘠的世界。
    - type: paragraph
      text:
        ru: '«А изасланици бијаху од фарисеја. И запиташе га и рекоше му: Зашто, дакле, крштаваш кад ти ниси Христос, ни Илија, и пророк? Одговори им Јован говорећи: Ја крштавам водом, а међу вама стоји кога ви не знате. То је Онај што долази за мном, који преда мном би, коме ја нисам достојан одријешити ремена на обући Његовој».  (Ин.1:24–28)'
        cn: «那些奉差遣来的原是法利赛人。他们就问他：「你既不是基督，不是以利亚，也不是那先知，为什么施洗呢？」约翰回答他们说：「我用水施洗，但有一位站在你们中间，是你们不认识的。他是在我以后来的，在我以先就有的，我就是给他解鞋带也不配。」» (约翰福音 1:24-28)
    - type: paragraph
      text:
        ru: 'Зато свети Претеча и крштава «крштењем покајања». Он већ Духом Светим види Месију међу људима, готовог да спасава свет од греха, смрти и ђавола, зато и позива људе покајању, крштењу покајања, и тако их припрема за долазак Спаситељев и за Његов спаситељски рад. А то је баш оно што учени јерусалимски питачи не разумеју, те и даље питају отворено: «Зашто, дакле, крштаваш кад ти ниси Христос, ни Илија, ни Пророк?» (Ин.1:25). Јован им онда јасно одгавара и указује на природу свога крштења, и на природу и личност Месије: «Ја крштавам водом, а мећу вама стоји кога ви не знате. То је Онај што долази за мном, који беше преда мном; коме ја нисам достојан одрешити ремена на обући Његовој» (Ин.1:25–26).'
        cn: 于是，圣先驱者也施以「悔改的洗礼」。他已经借着圣灵，看见弥赛亚在人群中，准备好将世界从罪、死亡和魔鬼中拯救出来，因此也呼召人们悔改，接受悔改的洗礼，从而预备他们迎接救主的到来和祂的救赎工作。而这正是那些有学问的耶路撒冷提问者所不明白的，于是他们继续公开地问：「那么，你既然不是基督，也不是以利亚，也不是那先知，为什么还施洗呢？」（约翰福音 1:25）。约翰于是清楚地回答他们，并指出他洗礼的性质，以及弥赛亚的本质和位格：「我用水施洗，然而有一位站在你们中间，是你们不认识的。这就是那在我以后来的，他本在我以前；我就是给他解鞋带也不配。」（约翰福音 1:25-26）。
    - type: paragraph
      text:
        ru: 'Људска природа је толико обесцењена и осрамоћена грехом и смрћу, да је бескрајно удаљеиа од Бога. Тога је жеравично свестан и «највећи између роћених од жена», зато сматра и свенародно објављује, и тиме се за сав људски род каје: «ја нисам достојан одрешити ремена на обући» Богочовековој Меоијиној.'
        cn: 人性因罪和死而如此贬损和蒙羞，以至于无限地远离了上帝。对此，就连「妇人所生中最伟大的」也深切地意识到，因此他认为并向所有人宣告，以此为全人类悔改：「我就是给神人弥赛亚解鞋带也不配。」
    - type: paragraph
      text:
        ru: 'Ако ико, Претеча је и за себе и за сав род људски поравнио пут Господњи, по коме Спаситељ може несметано ући у свет душа људсжих. Објашњавајући благовест: «Бога нико није видео никад» (Ин.1:18) Св. Златоуст примећује: А шта ћемо рећи на речи громогласног пророка Исаије: «Видех Господа где седи на престолу висаку и преузвишену?» (Ис.6:1). Шта ћемо рећи о сведочанству самога еванђелиста Јована о овим речима када је ввдео славу Господњу (Ин.12:41). Шта ћемо рећи на речи пророка Језекиља? Гле, и он је видео Бога где седи на херувимима. Шта ћемо рећи на речи пророка Данила? И он вели: «И Стари данима седе» (Дан.9:7). А шта на речи Мојсијеве: «Покажи ми пут твој, да Те поанам и да Те видим» (Исх.33:13). А Јаков је и назив добио од тога, то јест био је назван Израиљ, а Израиљ значи: Боговидац.'
        cn: 若有谁，施洗者约翰为他自己也为全人类铺平了主的道路，借此救主可以畅通无阻地进入人类灵魂的世界。在阐释这佳音：「从未有人见过上帝」(约翰福音 1:18)时，圣金口若望指出：那么，对于声音洪亮的先知以赛亚的话：「我看见主坐在高高在上的宝座上？」(以赛亚书 6:1)，我们又该怎么说呢？对于福音传扬者约翰本人关于这些话的见证——当他看见主的荣耀时（约翰福音 12:41），我们又该怎么说呢？对于先知以西结的话我们又该怎么说呢？看哪，他也看见上帝坐在基路伯上。对于先知但以理的话我们又该怎么说呢？他也说：「那亘古常在者坐下」（但以理书 9:7）。那么，对于摩西的话：「求你将你的道指示我，使我认识你，又得见你」（出埃及记 33:13），我们又该怎么说呢？雅各也因此而得了名号，也就是说，他被称为以色列，而以色列的意思是：见神者。
    - type: paragraph
      text:
        ru: 'Тако дакле, видели су Бога и други. Због чега је, онда, Еванђелист Јован рекао: «Бога нико није видео никад?» (Ин.1:18). Да би показао, да је све то било дело снисходљивости а не виђење саме Суштине Божанства.'
        cn: 所以，其他人也见过上帝。那么，为什么圣史约翰却说：「从来没有人见过上帝」？（约翰福音 1:18）这是为了表明，所有这些都是屈尊俯就的行为，而非对神性本质的真切洞见。
    - type: paragraph
      text:
        ru: Јер да су они видели само биће, видели би га не на разне начине. Божанство је просто, безоблично, непроменљиво, неописиво, не седи, не стоји, не хода. Све је то својствено само телима.
        cn: 因为如果他们只看见了其本体，就不会以各种方式看见它。神性是单纯的、无形的、不变的、不可言喻的，不坐、不站、不行走。这一切都只属于身体。
    - type: paragraph
      text:
        ru: 'Али како Бог постоји, то Он једини зна, и то је објавио сам Бог Отац преко пророка: «виђења умножих и у рукама пророчким уподобих се» (Ос.12:10–11), то јест, ја сам се спустио, јавио се, али не оним што ја јесам. А пошто је Син Његов имао да се јави нама у стварном телу, то је Он испочетка припремао људе за созерцање бића Божјег, колико им је било могуће видети.'
        cn: 但是神如何存在，唯有他自己知道，并且这事是父神自己藉着先知宣告的：「我增多异象，并藉着先知的手显现自身为喻」（何西阿书 12:10-11），也就是说，我降临，我显现，但并非以我本来的面目。而既然他的圣子将要以真实的肉身向我们显现，他便从一开始就预备人们，让他们默观神的本体，尽其所能地看见。
    - type: paragraph
      text:
        ru: 'Али шта је Бог Сам по Себи, то нису видели не само пророци, него и анђели и арханђели; и ако би их ти питао о томе, ти у одговору не би чуо ништа о суштини него само певање: «Слава иа висинама Богу, и на звмљи мир, међу људима добра воља» (Лк.2:14).'
        cn: '但是，上帝本身是怎样的，不仅先知没有看见，就连天使和天使长也没有看见；如果你问及此事，你不会在他们的回答中听到任何关于其本质的内容，而只听到歌颂：

          「在至高之处荣耀归与神，在地上平安归与他所喜悦的人。」(路加福音 2:14)'
    - type: paragraph
      text:
        ru: Ако би ти пожелео да што о томе сазнаш од херувима и серафима, овда би чуо Трисвету песму тајанствену и да су небо и земља пуни славе Његове (Ис.6:2). Тако, дакле, самога Бога Оца види само Син и Дух Свети.[10]
        cn: 如果你愿从基路伯和撒拉弗那里了解一些这方面的事，你就会听到神秘的三圣颂，以及天地都充满他的荣耀（以赛亚书 6:2）。因此，唯有圣子和圣灵才能看见父神自己。[10]
  - type: heading2
    text:
      ru: 'Друго сведочанство светог крститеља о Месији: Господу Исусу'
      cn: 另一个圣施洗者的见证，关于默西亚：主耶稣
    children:
    - type: paragraph
      text:
        ru: '«А сутрадан видје Јован Исуса гдје долази к њему, и рече: Гле, Јагње Божије које узима на се гријехе свијета!» (Ин.1:29)'
        cn: 第二天，约翰看见耶稣向他走来，就说：「看哪，上帝的羔羊，除去世人罪孽的！」 (约翰福音 1:29)
    - type: paragraph
      text:
        ru: 'Какво је узбуђење и усхићење морао осећати свети Крститељ, свестан свегрешности и свесмртности људске, гледајући Исуса где долази к њему. На свима људима, од ггрвог до последњег, он је видео само грех, грех, грех, и само омрт, смрт, смрт, а ево Исуса, ево човека, ево првог човека у роду људоком у коме нема ни греха ни смрти, ни грешног, ни смртног. Али Претеча види да је баш тај безгрешни Исус који узима на Себе грех света: «Гле, Јагње Божје које узима на себе грех света» (Ин.1:29): «грех света» – сав грех, тај један једини свеобухватни грех света, из кога се изводе и на који се своде ови греси света.'
        cn: 圣施洗者该是何等激动和狂喜，意识到人类全然的罪性和全然的必死性，当他看见耶稣走向他的时候。在所有人身上，从第一个到最后一个，他只看到罪、罪、罪，只看到死、死、死，而今，耶稣来了，一个人，人类中第一个人，在他里面既没有罪也没有死，既没有罪性也没有必死性。然而，这位先驱者看到，正是这位无罪的耶稣，将世界的罪孽承担在自己身上：「看哪，神的羔羊，除去世人罪孽的！」 (约翰福音 1:29) 「世界的罪孽」——是全部的罪孽，那一个独一无二、包罗万象的世界罪孽，所有的世界之罪都源于它，也归结于它。
    - type: paragraph
      text:
        ru: 'Свети Златоуст блатовести: Сви су пророци и апостоли проповедали Христа у Његовом отсуству: једни – до Његовог доласка у телу, други – по Његовом вазнесењу; једини Јован је проповедао о Њему у Његовом присуству. Стога се он и назива пријатељем Женика што је он једини присуствовао на свадби; он је све то устројио и обавио; он је поставио почетак томе. «И угледавши Исуса где иде к њему, рече: Гле, Јагње Божије, које узима на себе грех света» (Ин.1:29). Он говори то показујући да сведочи не само глаоом иего и очима. Он се дивио Христу у радости и усхићењу; показује свима и дар са којим је Христос дошао и начин искупљења. Реч «јагње» означава и једно и друго. Јер Јован није рекао: који ће узети, или који је узао грехе света, него: који узима грех света, и тиме показао да Христос чини то свагда. У самој ствари, Он је примио на Себе грех света не само онда када је пострадао, него и од тога времена па све до сада узима на Себе грехе, не тако као да је свагда био распињан. Он је једном принео жртву за грехе, и том једном жртвом Он свагда очишћује грехе.[11]'
        cn: '金口圣若望宣告说：


          所有的先知和使徒都在基督缺席时宣讲祂：一些是在祂道成肉身降临之前，另一些是在祂升天之后；唯独约翰是在祂面前宣讲祂。因此，他也被称为新郎的朋友，因为唯有他出席了婚宴；他安排并完成了这一切；他为此奠定了开端。「次日，约翰看见耶稣来到他那里，就说：看哪，神的羔羊，除去世人罪孽的！」 (约翰福音 1:29) 他这样说，表明他不仅用声音，也用眼睛作见证。他在喜悦和狂喜中景仰基督；他向众人展示基督所带来的恩赐，以及救赎的方式。「羔羊」一词同时指明了这两者。因为约翰没有说：「将要除去」，或「已除去世人罪孽的」，而是说：「除去世人罪孽的」，由此表明基督是恒常如此行。实际上，祂承担世人的罪孽，不仅是在祂受难之时，而且从那时直到现在，祂都在承担罪孽，并非祂是恒常被钉十字架。祂曾一次为罪献上祭物，并以那一次的祭物，祂恒常洁净罪孽。[11]'
    - type: paragraph
      text:
        ru: 'То понети на себи и ослободити сав род људски и сав свет од тог свеубилачког чудовишта могло је само свемоћно и у исто време бескрајно човекољубиво биће као што је Исус Богочовек. Ту жртву могло је принети само кротко и незлобиво Јагње Божије: да, Јагње Божије: јер у Њему нема нимало гордости шго оно врши тако свеспасоносни подвиг. Кротошћу, смиреношћу и свежртвеном љубављу Јагње Божије спасава род људски од основног греха људског: гордог самољубља.'
        cn: 唯有像耶稣神人那样全能且无限仁爱世人的存在，才能将那杀灭万有的怪兽承担在自己身上，并将全人类和整个世界从中解脱出来。这份牺牲唯有柔和且毫无恶意的上帝的羔羊才能献上：是的，上帝的羔羊：因为祂在施行如此普世救赎的壮举时，毫无一丝骄傲。藉着柔和、谦卑和全然牺牲的爱，上帝的羔羊将人类从其根本罪恶——骄傲的自爱中拯救出来。
    - type: paragraph
      text:
        ru: 'Значи: Јагње Божје Исус долази у свет људски, у свирепу и стравичну пустињу греха и смрти, долази јагањачки кротко и смирено, не да осуди, него да милује. Јер да није дошао као Јагње Божје већ као судија који истражује, ко би од људи остао, ко не би с правом сто пута на смрт осуђен био? Али, у томе је дирљива величина Христова што Он у вучји свет људски долази као кротко и смерно Јагње Божје свежртвено.'
        cn: 所以，神的羔羊耶稣降临人间，进入残酷可怕的罪与死的荒漠，以羔羊般的柔顺谦卑而来，不是为了定罪，而是为了施予怜悯。因为，倘若他不是以神的羔羊，而是以审察的法官身份而来，世人中有谁能存留呢？谁又不会理所当然地被判死刑一百次呢？然而，基督感人的伟大之处正在于此：他进入这狼性的人世，却是以柔顺谦卑、全然献祭的神的羔羊身份而来。
    - type: paragraph
      text:
        ru: '«Ово је Онај за кога ја рекох: За мном долази човјек који преда мном би, јер прије мене бјеше.»  (Ин.1:30)'
        cn: «这就是我所说的那一位：在我以后有一人到来，他先于我，因为他在我以前就已存在。» (约翰福音 1:30)
    - type: paragraph
      text:
        ru: 'Зато Претеча понавља своју похвалу о Њему: «Ово је Онај за кога ја рекох: За мном иде Човек који ме претече, јер пре мене беше» (Ин.1:30). «Човек» = Јагње Божје: у томе и јединствена величина Исусова, што је човек, и као такав «Јагње Божје»: сав без греха и смрти, и стога сав кротост и жртвеност.'
        cn: '于是，施洗者再次称颂他：

          「这就是我所说的：『在我以后来的那一位，是超越我的，因为他本在我以前。』」 (约翰福音 1:30)。

          「人」即是「神的羔羊」：耶稣独特伟大之处就在于，他既是人，又因此是「神的羔羊」：完全没有罪和死亡，因此完全是柔和与奉献。'
    - type: paragraph
      text:
        ru: Човек међу људима, Он стога не плаши већ привлачи; безгрешан и бесмртан и бесмртан, Он тиме лечи и спасава. «Човек» без греха и смрти, да би се људима показало да се такав човек може бити и у овом земаљском свету. А такав човек и јесте прави човек, потпун човек, савршен човек.
        cn: 人中之人，因此祂不使人畏惧，反而吸引人；无罪的，无死的，无死的，祂以此医治并拯救。「人」——无罪亦无死，以便向世人表明，这样的人即使在此尘世之中，也是可能存在的。而这样的人也正是真正的〇人，完全的〇人，完美的〇人。
    - type: paragraph
      text:
        ru: Такав је био Адам пре греха и смрти, такав је Исус у сред греха и смрти.
        cn: 亚当在罪与死亡之前是如此，耶稣在罪与死亡之中是如此。
    - type: paragraph
      text:
        ru: «И ја га не знадох, али да се јави Израиљу, зато дођох ја да крштавам водом.» (Ин.1:31)
        cn: 我先前不认识他，但是为了要使他显明给以色列人，所以我来用水施洗。(约翰福音 1:31)
    - type: paragraph
      text:
        ru: 'Исус, по свему човек, само без греха, тешко га је познати, открити у Њему Спаситеља и Месију, Бога и Господа. То је истина и за самог «Претечу» и «анћела» Месијиног Јована Крститеља. Он се не стиди да то јавно призна: «И ја га не знадох» (Ин.1:33). Али, како Га онда познаде? – По откривењу Божјем. Јер се само Богом може дознати да је Исус – Месија и Спаситељ. Бог се косне душе човекове, и она прогледа, и у Христу Бога и Спаситеља угледа.'
        cn: 耶稣，在一切方面都是人，只是没有罪，因而难以认识祂，难以在祂里面发现救主和弥赛亚，上帝和主。这对于弥赛亚的「前驱者」和「使者」约翰·施洗者本身来说也是如此。他不羞于公开承认这一点：「我也不认识祂」（约翰福音 1:33）。但是，他又是如何认识祂的呢？——借着上帝的启示。因为只有借着上帝才能得知耶稣是弥赛亚和救主。上帝触动人的灵魂，于是灵魂便明察了，并在基督里看到了上帝和救主。
    - type: paragraph
      text:
        ru: 'Претечина месијанска делатност сва је у завионости од личности Месије Исусу. Он и крштава водом да би на тај начин објавио људима да је Месија дошао, да је већ ту: да крштење почиње, и да је циљ крштења привести људе Месији, који ће крштавати Духом Светим; а то значи: крштењем у коме се опраштају греси, убија смрт, уништава ђаво.'
        cn: 施洗约翰的弥赛亚事工，完全取决于弥赛亚耶稣的位格。他也用水施洗，为要以此方式向人们宣告弥赛亚已经来临，已经在这里：洗礼开始了，而洗礼的目标是将人们引向弥赛亚，那位将要用圣灵施洗的。而这意味着：藉着洗礼，其中罪孽得赦免，死亡被消灭，魔鬼被摧毁。
    - type: paragraph
      text:
        ru: Али и Дух Свети је за Месијиног Претечу нешто видљиво, стварно, и то у нашем човечанском свету.
        cn: 然而，圣灵对弥赛亚的前驱者而言，是可见的、真实的，而且是在我们人类的世界里。
    - type: paragraph
      text:
        ru: '«И посвједочи Јован говорећи: Видио сам Духа гдје силази као голуб са неба и остаде на Њему.» (Ин.1:32)'
        cn: 「约翰又作见证说：「我看见圣灵仿佛鸽子从天降下，停留在祂身上。」」(约翰福音 1:32)
    - type: paragraph
      text:
        ru: 'И Претеча нам сведочи о томе из свог личног искуства, као очевидац, као духовидац: «Видех Духа где силази с неба као голуб и остаде на Њему» (Ин.1:32). – «Видех Духа», – то је лично и ново, новозаветно искуство.'
        cn: 前驱者也从他个人的经验，作为亲眼目睹者，作为灵视者，向我们见证此事：「我看见圣灵仿佛鸽子从天降下，停留在祂身上。」（约翰福音 1:32）——「我看见圣灵」，那是个人且崭新的，是新约的经验。
    - type: paragraph
      text:
        ru: У томе и најубедљивије сведочанство да је Исус заиста Месија који ће крстити Духом Светим који је сишао на Њега као на човека, и остао на Њему као на човеку, иако је Он вечно и једносушно са Њим као са Другим Лицем Свете Тројице.
        cn: 在这之中，最确凿的见证就是耶稣确实是弥赛亚，祂将用圣灵施洗。这圣灵降临在祂身上，如同降在一个凡人身上，并停留在此祂身上，如同停留在一个凡人身上；尽管祂作为圣三一的第二个位格，与祂永远是同质的。
    - type: paragraph
      text:
        ru: '«И Ја Га не знадох, али Онај који ме посла да крштавам водом Он ми рече: на кога видиш да силази Дух и остаје на Њему то је Онај који крштава Духом Светим. И ја сам видио и засвједочио да је Он Син Божији.»  (Ин.1:33–34)'
        cn: «我先前不认识他，但那差我来用水施洗的对我说：你看见圣灵降下来，住在谁的身上，谁就是用圣灵施洗的。我看见了，也作证了，他就是神的儿子。» (约翰福音 1:33-34)
    - type: paragraph
      text:
        ru: 'Свети Претеча не престаје наглашавати ту чињеницу: «И ја га не знадох, али Онај који ме посла да крстим водом он ми рече: На кога видиш да силази Дух и остаје на њему, то је онај који крштава Духом Светим, И ја видех и посведочих да је овај Син Божји» (сг. 33–34). «И ја видех и посведочих». – На том личном искуству је заснована кзва месијанска делатност Претечина. То је основно начело новозаветног христопознања: видети и сведочити о виђеном.'
        cn: 圣施洗者不停地强调这一事实：「我先前不认识他，但那差我来用水施洗的，他对我说：你看见圣灵降下来，住在谁的身上，谁就是用圣灵施洗的。我看见了，就证明这是神的儿子。」（约翰福音 1:33-34）「我看见了，就证明。」——圣施洗者的弥赛亚事工就是建立在这一亲身经历上的。这是新约基督认知的基本原则：看见并为所看见的作见证。
    - type: paragraph
      text:
        ru: 'Зато су новозаветни проповедници првенствено очевидци = сведоци = апостоли: они су послани да као очевидци сведоче само оно што сами видеше и чуше, што очима својим видеше и расмотрише, што ушима својим чуше, пгго рукама својим опипаше (1 Јн.1:1). С&едочансгво Светог Претече о Исусу:'
        cn: 因此，新约宣讲者首先是目击者 = 见证人 = 使徒：他们被差遣，作为目击者来见证唯独他们自己所看见和听见的，他们亲眼所看见和仔细查验的，他们亲耳所听见的，他们亲手所摸过的（约翰一书 1:1）。圣前驱者关于耶稣的见证：
    - type: paragraph
      initial:
        ru: 1)
        cn: 1)
      text:
        ru: Исус је «човек» (Ин.1:30);
        cn: 耶稣是「人」（约翰福音 1:30）；
    - type: paragraph
      initial:
        ru: 2)
        cn: 2)
      text:
        ru: На Њега, човека, сишао је Дух Свети;
        cn: 在他——这个人——身上，圣灵降临了；
    - type: paragraph
      initial:
        ru: 3)
        cn: 3)
      text:
        ru: Исус је Син Божји;
        cn: 耶稣是上帝之子；
    - type: paragraph
      initial:
        ru: 4)
        cn: 4)
      text:
        ru: Исус=Син Божји, као Јагње Божје узима на себе грех света, и
        cn: 耶稣，上帝之子，作为上帝的羔羊，承担世人的罪，并
    - type: paragraph
      initial:
        ru: 5)
        cn: 5)
      text:
        ru: Исус крштава Духом Светим.
        cn: 耶稣用圣灵施洗。
  - type: heading2
    text:
      ru: Треће сведочанство претечино о Месији и први ученици Христови
      cn: 前驱关于弥赛亚的第三次见证和基督的首批门徒
    children:
    - type: paragraph
      text:
        ru: '«Сутрадан опет стајаше и Јован и двојица од ученика његових. И угледавши Исуса гдје иде, реће: Гле, Јагње Божије!» (Ин.1:35–36)'
        cn: 「第二天，约翰和他的两个门徒又站着。他看见耶稣行走，就说：『看哪，神的羔羊！』」 (约翰福音 1:35-36)
    - type: paragraph
      text:
        ru: 'Трећег дана – треће Јованово сведочанство. Сада, Претеча као да на Исусу види само Његаву огромну жртву за спасење света од греха: Исус=Јагње Божје», и на Њему сви греси света од памтивека. Заиста, све што је Исус Богочовек учинио за спасење света јесте једна беспрекидна жртва за свет: од Рођења па до Вазнесења.'
        cn: 第三天——约翰的第三次见证。现在，这位前驱者仿佛只在耶稣身上看见了他为拯救世人脱离罪恶所做的巨大牺牲：耶稣是「神的羔羊」，世间从亘古以来的所有罪过都在他身上。确实，耶稣这位神人（Theanthropos）为拯救世界所做的一切，都是为了世界而献上的一次不间断的牺牲：从他诞生直到升天。
    - type: paragraph
      text:
        ru: 'Гледајући Га где се у пећини рађа од Дјеве, чавек мора Претечински узбућено узвикнути: «Гле, Јагње Божје!»'
        cn: '望着祂在洞穴中从童贞女所生，人必须以如同前驱般的激动呼喊：

          「看哪，神的羔羊！」'
    - type: paragraph
      text:
        ru: 'Гледајући Га где од гњева Иродова бежи у Мисир, опет то исто осећање потреса душу: «Гле, Јагње Божје!»'
        cn: 看着他因希律的愤怒逃往埃及，同样的感受再次震撼心灵：「看哪，神的羔羊！」
    - type: paragraph
      text:
        ru: 'Гледајући Га где као дрводеља ради и живи у свету Он, Творац и Сведржитељ свих безбројних светова, из душе се невољно отима уздах: «Гле, Јагње Божје!»'
        cn: 当我们看着祂——所有无数世界的创造者和维系者——在世上作为木匠工作和生活时，灵魂深处不禁迸发出一声叹息：「看哪，神的羔羊！」
    - type: paragraph
      text:
        ru: 'Гледајући Га где пости, где се моли, где плаче, где страда, где пати, где умире на крсту, где кротко подноси и пљување и исмевање и шибање, из душе се отима дирљиви крик за криком: «Гле, Јагње Божје!»'
        cn: 看着祂如何禁食，如何祷告，如何哭泣，如何受难，如何受苦，如何死在十字架上，又如何谦和地承受着吐唾沫、嘲弄和鞭打，从灵魂深处迸发出一声又一声感人的呼喊：「看哪，神的羔羊！」
    - type: paragraph
      text:
        ru: 'И када се сав његов Богоочовечански подвиг на земљи обухвати једним свеобухватним погледом, и овда човек мора свим срцем, свом душем, свом мишљу својом завапити: «Гле, Јагње Божје!»'
        cn: 而当他（指基督）在世上的一切神人功业被一个全面的眼光所综览时，人就必须全心、全魂、全意地呼喊：「看哪，神的羔羊！」
    - type: paragraph
      text:
        ru: '«И чуше га оба ученика кад говораше, и отидоше за Исусом. А Исус обазревши се и видјевши их, гдје иду за Њим, рече им: Шта тражите? А они Му рекоше: Рави, што преведено значи: учитељу, гдје станујеш? Рече им: Дођите и видите! И отидоше, и видјеше где станује; и остадоше код Њега онај Дан.А бијаше око десетога часа. А један од двојице који чуше од Јована и одоше за Њим бијаше Андреј, бтрат Симона Петра.»  (Ин.1:37–40)'
        cn: 两个门徒听见他说话，就跟随了耶稣。耶稣转过身来，看见他们跟着他，就对他们说：「你们要什么？」他们对他说：「拉比（「拉比」翻出来就是「夫子」），你住在哪里？」他说：「你们来，就看见。」他们就去了，看见他住在哪里，那一天便与他同住。那时大约是第十个小时。听了约翰的话并跟随他的两个人中，有一个是安得烈，就是西门彼得的兄弟。(约翰福音 1:37-40)
    - type: paragraph
      text:
        ru: 'У овим простим речима Претечиним морало је бити нечег божански дирљивог и привлачног. Сведоци? – Два Претечина ученика који оставише свог учитеља, човека «највећег између рођених од жена»: «и отидоше за Исусом» (Ин.1:37).'
        cn: 施洗者约翰的这些朴素的话语中，一定有某种神圣的感动和吸引力。见证？——施洗者约翰的两个门徒离开了自己的老师，这位「在妇人所生的中没有一个比他大的」人，他们「就跟随了耶稣」（约翰福音 1:37）。
    - type: paragraph
      text:
        ru: Ради чега? – Сигурно да лично испитају и извиде ко је тај Исус пред којим се до прашине и праха смирава и понижава њихов велики учитељ, пустињак, испосник и пророк. И они би хтели да насамо разговарају са тим «Јагњетом Божјим», Коме њихов знаменити учитељ није достојан одрешити ни ремена на обући његовој.
        cn: '为了什么？

          ——毫无疑问，是为了亲自查明并了解：这位耶稣究竟是谁？在祂面前，他们伟大的导师、隐修士、苦修者和先知都谦卑自抑，甚至降至尘土和灰烬。他们也希望能与那『神的羔羊』私下交谈，而他们的著名导师甚至不配为祂解开鞋带。'
    - type: paragraph
      text:
        ru: 'То нам казује њихов одговор на Исуоово питање: «Шта тражите?» – «Учитељу, где станујеш?» – и прост одговор: «Доћите и видите». – «И отидоше и видеше где станује; и осташе у њега онај дан» (Ин.1:38–39). Да чудесног и невиђеног на земљи разтовора! Зацело, два ученика они осетили нису време у присуству Вечнога.'
        cn: 这向我们揭示，他们对耶稣问题的回答是：「你们要什么？」 – 「夫子，你住在哪里？」 – 以及耶稣简洁的回答：「你们来看。」 – 「他们就去，看见他在哪里住，那一天便与他同住。」 (约翰福音 1:38-39) 这是何等奇妙，世上从未有过的对话啊！确实，两位门徒在永恒者的面前，确乎没有感到时间的流逝。
    - type: paragraph
      text:
        ru: Устрептале душе, жедне божанскога, бесмртнога, идеалнога, морале су од усхићења и радости занемети, слушајући насамо божанске речи Јагњета Божјег. Тада се у њима саткало у души убеђење да је Исус – заиста Син Божји, заиста – Јагње Божје, заиста – Спаситељ света. Несумњиво тако. То се и види из онога што та два ученика чине.
        cn: 悸动的灵魂，渴慕神圣、不朽、至善之物，当独自聆听神羔羊的圣言时，必会因狂喜和喜乐而哑然失声。于是，他们的灵魂中编织成了一种确信，即耶稣——确实是神的儿子，确实是神的羔羊，确实是世界的救主。毫无疑问如此。这一点也从那两位门徒的所作所为中显明出来。
    - type: paragraph
      text:
        ru: '«Он нађе најприје брата својега Симона, и рече му: Нашли смо Месију, што преведено значи: Христос. И доведе га Исусу. И Исус погледавши на њега рече: Ти си Симон, син Јонин; Ти ћеш се звати Кифа, што значи Петар.» (Ин.1:41–42)'
        cn: 他先找到自己的兄弟西门，对他说：「我们遇见弥赛亚了！」（「弥赛亚」翻出来就是「基督」。）他就领西门去见耶稣。耶稣看着他，说：「你是约翰的儿子西门，你要称为矶法。」（「矶法」翻出来就是「彼得」。）(约翰福音 1:41-42)
    - type: paragraph
      text:
        ru: «Ми нађосмо Месију» (Ин.1:41), – то је све што они у узбуђењу, од радости могу да откликћу. У њиховим речима нема ни трунке колебања, двоумљења. То је нешто толико сигурно и несумњиво, да Петар без речи полази за својим братом Андријом који је био један од двојице срећника и ту вест и новост и саопштио овоме брату.
        cn: 「我们找到了弥赛亚！」(约翰福音 1:41)——这就是他们在激动与喜乐中所能喊出的全部。在他们的话语中，没有一丝一毫的犹豫与怀疑。这事是如此地确定无疑，以至于彼得一言不发地跟随他的兄弟安德烈，安德烈是那两位有福之人中的一个，并将这消息和新事传达给了这位兄弟。
    - type: paragraph
      text:
        ru: '«И доведе га к Исусу» (Ин.1:42): доведе као дете, толико је Андрија понесен био љубављу и одушевљењем за Исуса да је Петра «довео» к Исусу, а не да је сам Петар ишао и да су они дошли к Исусу.'
        cn: «他便领他去见耶稣» (约翰福音 1:42)：他领他如同领一个孩子，安德烈被对耶稣的爱和热情全然充满，以至于他将彼得「领」去见耶稣，而不是彼得自己去，也不是他们二人一同去见耶稣的。
    - type: paragraph
      text:
        ru: 'У души Петровој се морало дешавати нешто необично: нове мисли, слатка очекивања, устрептала осећања. Све је то вихорило у њему, стапало се у неки хаас, мили хаос, у чијим се врелим дубинама рађало нешто ново за Петра, неки нови свет, нови живот, нешто ни налик на све дотадашње.'
        cn: 在彼得的灵魂里，一定有什么非凡的事情正在发生：新的思绪，甜美的期盼，悸动的情感。这一切在他里面翻腾汹涌，汇聚成一种混沌，一种可爱的混沌，在这炽热的深处，为彼得诞生了新的事物，一个崭新的世界，一种崭新的生命，与他以往所经历的一切都截然不同。
    - type: paragraph
      text:
        ru: Све је то благи Спаситељ прочитао и у души и на лицу детињски узбућеног и усплахиреиог Петра и због те унутрашње промене која се у њему збивала, променио му одмах име као Авраму што је променио име када му је обећао да ће постати отац многим народима.
        cn: 仁慈的救主看透了这一切——彼得当时孩子般激动又慌乱，无论是在他灵魂深处，还是在他脸上。并且，由于他里面所发生的这种内在变化，救主立刻给他改了名，就像当初应许亚伯拉罕将成为多国之父时，也给他改了名一样。
    - type: paragraph
      text:
        ru: 'Еванђелист пише: «Исус погледавши на њега рече: Ти си Симон, син Јонин; ти ћеш се звати Кифа што значи Петар» (Ин.1:41). Петар – камен, камен на камен ће се изградити иов духовни свет, не само његов, него и многих, многих других који као он буду променили себе Богочовеком, његовим Еванђељем.'
        cn: 福音书作者写道：「耶稣看着他说：『你是西门，约翰的儿子；你将被称为矶法，矶法的意思是彼得。』」 (约翰福音 1:41)。彼得——磐石，他的属灵世界将由磐石一块块地建造起来，不仅仅是他自己的，更是许多许多其他人的，那些像他一样，借着上帝人、借着他的福音而改变自己的人。
    - type: paragraph
      text:
        ru: Као да сав овет добија ново име због многозначајне Петрове промене, Петровог обраћења Христу.
        cn: 仿佛整个世界都获得了一个新名字，因为彼得那意义深远的转变——他的归信基督。
    - type: paragraph
      text:
        ru: '«Сутрадан хтједе Исус изићи у Галилеју, и нађе Филипа, и рече му: Хајде за Мном!» (Ин.1:43)'
        cn: 次日，耶稣想要往加利利去，又遇见腓力，就对他说：「来跟从我吧！」（约翰福音 1:43）
    - type: paragraph
      text:
        ru: '«Хајде за мном!» – и Филип дође за Њим, не упитавши: Зашто? Ко си ти? Шта хоћеш ти од мене? Зашто да Тебе ради оставим све своје на дому, и дом и имање? – Шта је то било у Исусу што је толико привлачило к Њему те су људи остављали све и одмах полазили, и за навек одлазили за Њим?'
        cn: 「来跟从我！」——腓力就跟从了祂，没有问：「为什么？祢是谁？祢想从我这里得到什么？我为什么要为了祢而撇下家中所有的一切，家宅和财产呢？」——耶稣身上究竟有什么，能如此强烈地吸引人归向祂，以至于人们撇下一切，立刻动身，并永远地跟随祂呢？
    - type: paragraph
      text:
        ru: Сигурно се кроз Његово свето лице и тело изливала и по душама људским на тајанствен начин разливала чудесна сила и светлост Бога Логоса.
        cn: 无疑地，上帝圣言（逻各斯）的奇妙能力与光辉，借着祂圣洁的面容与身体倾泻而出，并以奥秘的方式弥漫于人类的灵魂之上。
    - type: paragraph
      text:
        ru: И иоле боготражљиве и богочежњиве душе приањале су за Њега свим бићем. И налазиле у Њему свога Месију, свога Господа, свој живот, своју бесмртност и вечност.
        cn: 和那些哪怕是稍微为神受苦且切慕神的灵魂，都以他们全部的生命紧紧依附祂。和在祂里面找到了他们的弥赛亚、他们的主、他们的生命、他们的不朽和永恒。
    - type: paragraph
      text:
        ru: Да, у Њему су налазиле све оно најузвишеније, најсветије, најбожанскије, најбесмртније, најмоћније што су Месији приписивали и од Месије очекивали сви свети Божји људи.
        cn: 是的，在祂里面，他们找到了所有那些最崇高、最神圣、最神性、最不朽、最强有力的一切，这些都是所有圣洁的属神之人归于弥赛亚并从弥赛亚所期待的。
    - type: paragraph
      text:
        ru: '«А Филип бјеше из Витсаиде, из града Андрејева и Петрова. Филип нађе Натанаила и рече му: Нашли смо Онога за кога писа Мојсеј у Закону и Пророци: Исуса, сина Јосифова, из Назарета.» (Ин.1:44–45)'
        cn: 腓力是伯赛大人，是安得烈和彼得的城里人。腓力找到拿但业，对他说：「我们找到了摩西在律法书上和众先知书上所写的那一位，就是约瑟的儿子，拿撒勒人耶稣。」 (约翰福音 1:44-45)
    - type: paragraph
      text:
        ru: То се десило и са Филипом. Пошао је за Њим, и одмах свим бићем открио, пронашао да је Исус – Месија.
        cn: 这也发生在腓力身上。他跟随了祂，并立刻全心全意地发现并找到：耶稣就是弥赛亚。
    - type: paragraph
      text:
        ru: 'Пронашао, да! јер је тражио, истраживао, на Исуса примењивао све што су Мојсије и Пророци писали о Месији и пронашао да је Исус тај божански Месија, Спаситељ. Зато и изјављује своме пријатељу Натанаилу, кога је потражио да подели са њим своју радост и саопшти му свој проналазак: «Нађосмо онога за кога писа Мојсије у закону и Пророци: Исуса, сина Јосифова, Назарећанина» (Ин.1:45).'
        cn: 他找到了，是的！因为他寻找、探究，将摩西和先知所写关于弥赛亚的一切都应用到耶稣身上，并发现耶稣就是那位神圣的弥赛亚、救主。因此他向他的朋友拿但业宣告——他特意去找他，好与他分享自己的喜乐，并告诉他自己的发现：「我们遇见了摩西在律法上所写，众先知所记的那一位：拿撒勒人约瑟的儿子耶稣。」 (约翰福音 1:45)
    - type: paragraph
      text:
        ru: 'Боготражљивој души Филиповој није било потребно да дуго испитује Исуса: он је применио иа Њега месијанско мерило Мојсијево и пророчко, и овим бићем се убедио и пронашао да је то заиста Месија.'
        cn: 腓力那敬爱上帝的灵魂，无须长久查验耶稣：他将摩西和先知的弥赛亚标准应用于祂（耶稣），并且凭着这真理，他确信并发现祂确实是弥赛亚。
    - type: paragraph
      text:
        ru: '«И рече му Натанаило: Из Назарета може ли бити шта добро? Рече му Филип: Дођи и види!» (Ин.1:46)'
        cn: 拿但业对他说：「拿撒勒还能出什么好的吗？」腓力对他说：「你来，看吧！」 (约翰福音 1:46)
    - type: paragraph
      text:
        ru: Учени Натанаило је опрезан, а и помало сумњалица. Месија – «из Назарета?» «Из Назарета може ли бити што добро?» (Ин.1:46). – То је пророчки оправдано питање. Из Назарета може ли бити што добро, а камоли највеће добро – Месија? Филип овим као да је нешто збуњен, или не жели да се упушта у дуге расправе о таме, јер је сав препун и осећања и убеђења да је Исус – Месија.
        cn: 门徒拿但业是谨慎的，并且有点怀疑。弥赛亚——「来自拿撒勒？」「从拿撒勒能出什么好东西吗？」（约翰福音 1:46）——那是一个基于预言的合理疑问。从拿撒勒能出什么好东西吗，更何况是最大的善——弥赛亚？腓力对此似乎有些困惑，或者不愿就此深入冗长的辩论，因为他完全充满着情感和确信，相信耶稣就是弥赛亚。
    - type: paragraph
      text:
        ru: 'И зато сву своју апологију и апологетику своди на две речи: «дођи и види» (Ин.46). Доћи и види Исуса, и отпашће све сумње, сва провериличка питања. Јер видети Њега, значи видети Месију, сем ако човек намерио не ослепи све очи душе своје, да не би виделе и откриле у Њему Месију и Бога. Пример: Натанаило.'
        cn: 因此，他所有的辩护和护教都归结为两个词：「来，看」（约翰福音 1:46）。来，看看耶稣，一切疑虑都将消除，所有求证性的问题都将消失。因为看见祂，就意味着看见弥赛亚，除非人刻意蒙蔽自己灵魂所有的眼睛，以免它们在祂里面看见并认出弥赛亚和上帝。例子：拿但业。
    - type: paragraph
      text:
        ru: '«А Исус видје Натанаила гдје долази к Њему и рече за њега: Ево правог Израиљца у коме нема лукавства. Рече Му Натанаило: Откуда ме познајеш? Одговори Исус и рече му: Прије него те позва Филип, видјех те кад бијаше под смоквом.» (Ин.1:47–48)'
        cn: 耶稣看见拿但业向他走来，就论到他说：「看哪，这真是一个以色列人，他心里没有诡诈。」 拿但业对他说：「你从哪里认识我呢？」 耶稣回答他说：「腓力还没有招呼你，你在无花果树底下的时候，我就看见你了。」 (约翰福音 1:47-48)
    - type: paragraph
      text:
        ru: 'Његов сусрет са Исусом, заиста је сусрет правога Израиљца са Месијом: «Ево правога Израиљца у гсоме нема лукавства» (Ин.1:47), говори Исус за Натанаила тек што је са Филипом дошао и још ни једну реч изустио, и кога Исус први пут види. Исусове речи хвале опрезност Натанаилову; Натанаила изненађује то откуда га Исус познаје. Он и даље душом својом иде по колосеку своје сумњалачке опрезности: проверава Филипово тврђење и своје сумње.'
        cn: 他与耶稣的相遇，确实是一个真正的以色列人与弥赛亚的相遇：「看哪，一个真以色列人，他心里是没有诡诈的！」 (约翰福音 1:47)，耶稣对拿但业说，那时他刚与腓力前来，尚未说一句话，耶稣也是第一次见到他。耶稣的话语赞扬了拿但业的谨慎；拿但业惊讶耶稣怎会认识他。他的灵魂依然沿着自己那疑虑重重的谨慎的轨道前行：他核实腓力的主张，也核实自己的怀疑。
    - type: paragraph
      text:
        ru: 'Тада му Исус открива делић свога Божанства: свезнање, свевиђење: «Пре но што те позва Филип видех те кад беше под смоквом» (Ин.1:48). – На таквој даљини? Како је то могуће? Не, то не може видети обичан човек, па ни највећи човек; то може видети само Син Божји, Месија, Бог.'
        cn: 那时，耶稣向他揭示了祂神性的一部分：全知，全视：「腓力还没有召你，你在无花果树底下，我就看见你了」（约翰福音 1:48）。——那么远的距离？这怎么可能？不，这绝不是普通人能看见的，甚至也不是最伟大的人能看见的；这只有上帝的儿子，弥赛亚，上帝才能看见。
    - type: paragraph
      text:
        ru: '«Одговори Натанаило и рече Му: Рави, Ти си Син Божији, Ти си цар Израиљев» (Ин.1:49)'
        cn: 「拿但业回答说：『拉比，你是上帝的儿子，你是以色列的王！』」 (约翰福音 1:49)
    - type: paragraph
      text:
        ru: 'И Натанаило, као што је искрено посумњао, тако је искрено и поверовао, и признао Исуса за Месију: «Рави, Ти си Син Божји, Ти си цар Израиљев» (Ин.1:49). Јер иза твога свезнања ко стоји ако не свезнајући Месија? Филип је у праву: доћи и видети Исуса, то је све, сва апологија, сав метод христопознања.'
        cn: 拿但业，他真诚地怀疑了，也同样真诚地相信了，并承认耶稣是弥赛亚：「拉比，你是上帝的儿子，你更是以色列的王」（约翰福音 1:49）。因为在你全知背后，若不是全知的弥赛亚，还能有谁呢？腓力说得对：来，看耶稣——这就是一切，是全部的护教，是认识基督的全部方法。
    - type: paragraph
      text:
        ru: Само треба доћи у лични додир с Њим, прићи Му отворено, испитивачки, проверилачки искрено, и Он ће души богочежњивој показати да је Месија, Спаситељ, Бог. Све се ту заснива на личном, непролазном искуству. Од човека се тражи само искреност, онда Господ Исус казује Себе, показује да је заиста Месија, заиста Бог и Господ.
        cn: 只需要与祂亲身接触，开放地、探究地、诚恳地验证祂，祂就会向渴慕上帝的灵魂显明祂是弥赛亚、救主、上帝。这一切都建立在个人不朽的经验之上。人所需要的唯有真诚，那时主耶稣就会显明祂自己，显明祂确实是弥赛亚，确实是上帝与主。
    - type: paragraph
      text:
        ru: '«Одговори Исус и рече му: Зато што ти казах да те видјех под смоквом, вјерујеш? Видјећеш више од овога. И рече му: Заиста, заиста вам кажем: од сада ћете видјети небо отворено и анђеле Божије како узлазе и силазе на Сина Човјечијега.»  (Ин.1:50–51)'
        cn: 「耶稣回答，对他说：「因为我告诉你，说我看你在无花果树底下，你就信吗？你将要看见比这更大的事。」又对他说：「我实实在在地告诉你们：从今以后，你们要看见天开了，神的使者上去下来在人子身上。」 (约翰福音 1:50-51)
    - type: paragraph
      text:
        ru: 'Натанаило је видео само једно својство Христова Божанства: свезнање. Али, то није у Исуса неко тренутно, шророчко свезнање, које се Њему, као и осталим пророцима даје за извесно време. Не, Исус није само пророк, Он је Бог пророка.'
        cn: 拿但业只看到了基督神性的一个属性：全知。但是，在耶稣这里，这并非某种暂时的、预言性的全知，这种全知是像赐予其他先知那样，在某个特定时期被赐予祂的。不，耶稣不仅仅是一位先知，祂是众先知之神。
    - type: paragraph
      text:
        ru: 'То Натанаило још не зна, не увиђа. Иза свезнања, и око свезнања Исусовог, стоје и сва остала, засада невидљива, божанска својства и савршенства, стоји: «сва пуноћа Божанства телесно» (Кол.2:9): ту су иза Њега и сва небеса, и сви анђели који Му даноноћно невидљиво служе као Богу и Господу. Богочовечанска је истина: «Од сада ћете видети небо отворено и анђеле Божије где се пењу и силазе на Сина Човечијег» (Ин.1:51).'
        cn: 拿但业对此尚不知晓，亦未领悟。在耶稣的无所不知背后，以及围绕着他的无所不知，是所有其余的、目前不可见的、神圣的属性与完备，是「神性一切的丰盛都有形有体地居住着」（歌罗西书 2:9）。在他身后，亦有诸天和众天使，昼夜不息地隐形侍奉他，尊他为神与主。神人合一的真理是：「从今以后，你们要看见天开了，神的使者在人子身上，上去下来。」（约翰福音 1:51）
    - type: paragraph
      text:
        ru: '«Од сада» је небо отворено над земљом преко Богочовека Господа Исуса: Бог је на земљи, Његов силазак је ова небеса отворио над земљом; и сва небеска војска силази к Њему и опет узлази на небо. «Од сада ћете видети»... сви који желите небо и сва богатства неба.'
        cn: «从今以后»，天在地上藉着神人主耶稣敞开了：上帝在地上，祂的降临使这天向地敞开；所有天军都降到祂那里，又再次升回天上。「从今以后，你们将要看见」……所有渴望天堂及其所有丰盛之人。
    - type: paragraph
      text:
        ru: Ето их иа земљи у Исусу Месији, Сину Човечијем, Богочовеку, у коме је «сва пуноћа божанства телесно».
        cn: 看哪，他们在此世上，在耶稣弥赛亚，人子，神人里面，在他里面「一切神性的丰盛都有形有体地存在」。
    - type: paragraph
      text:
        ru: Небо је већ на земљи, анђели су Божији већ на земљи, јер је Сам Бог већ на земљи у Богочовеку Исусу.
        cn: 天国已然在地上，上主的众天使也已然在地上，因为上主自己已然在神而人者耶稣内降临于地。
  - type: heading2
    text:
      ru: Глава друга. Исус на свадби у Кани Галилејској
      cn: 第二章 耶稣在加利利的迦拿的婚礼上
    children:
    - type: paragraph
      text:
        ru: «И у трећи дан би свадба у Кани Галилејској, и ондје бјеше Мати Исусова. А позван бјеше и Исус и ученици Његови на свадбу.» (Ин.2:1–2)
        cn: 「第三日，在加利利的迦拿有婚宴，耶稣的母亲在那里。耶稣和祂的门徒也被请去赴席。」 (约翰福音 2:1-2)
    - type: paragraph
      text:
        ru: 'Чудо Исусово – на свадби, на сиромашној свадби. Несумњиво сиромашној чим им је недостало вина. Исус је позван са ученицима: обичан човек мећу обичним људима. Али баш тај обичан истински, прави човек Исус чини нешто бескрајно необично, чини божанско чудо: претвара воду у вино. И то чини на један беспримерnо прост начин. Чини невиђено чудо, и опет остаје човек, сав човек, истински човек.'
        cn: 耶稣的神迹——是在一场婚礼上，一场贫穷的婚礼上。毫无疑问是贫穷的，因为他们缺了酒。耶稣和门徒被邀请：一个普通人，身处普通人中间。但恰恰是这位普通、真实而真正的人耶稣，行了一件无限不寻常的事，行了一个神圣的神迹：他将水变成了酒。他以一种无比简单的方式做到了这一点。他行了前所未有的神迹，却仍旧是人，完全的人，真实的人。
    - type: paragraph
      text:
        ru: 'Ваљда тако и треба да буде: да Бог живи и дела у човеку и из човека као нешто сасвим природно; да човек буде природно обиталиште Бога, његов дом, његов храм, његово тело. У Богочовеку тако и јесге: Човек је постао и јесте тело Бажје. И ове што чини у човеку, да човека, помоћу човека, чини на природаи и нормалан начин. Природво је богочовечанско јединство у човеку, богочовечански живот, богочовечанска делатност.'
        cn: 或许理当如此：神在人里面并借着人而活并工作，如同极其自然之事；人要成为神自然的居所、祂的家、祂的殿、祂的身体。在神人中，事实正是如此：人已成为且是神的身体。并且凡祂在人里面所行的，祂都是为人，借着人，以自然且正常的方式成就。在人里面，神人的合一、神人的生命、神人的活动，是自然而然的。
    - type: paragraph
      text:
        ru: '«И кад неста вина, реће Мати Исусова Њему: Немају вина. А Исус јој рече: Шта хоћеш од Мене, жено? Још није дошао час Мој.» (Ин.2:3–4)'
        cn: «当酒用尽了，耶稣的母亲对祂说：他们没有酒了。耶稣对她说：妇人，我与你有什么相干？我的时候还没有到。» (约翰福音 2:3-4)
    - type: paragraph
      text:
        ru: 'И пре првог чуда на свадби у Кани Галилејској једно људско биће зна тајну Исуоову. То је Пресвета Богомајка. А и ко би знао главну тајну овога детета ако не мајка. У овом случају – чудесна Богомајка. Од Њењог божаноког зачећа, од те прве благовести, па кроз Његово чудесно рођење, и надаље: Она слаже у срцу свом тајну на тајиу «чуваше све» то «у срцу свом» (Лк.2:5), док се ове то није стопило у једио осећање, у једно јасно сазнање: да је Исус – оваплоћени Бог.'
        cn: 甚至在加利利的迦拿婚宴上的第一个神迹之前，就有一个人知道耶稣的秘密。那就是至圣上帝之母。又有谁能知晓这孩子的主要秘密，如果不是祂的母亲呢？在这个例子中——是奇妙的上帝之母。从祂那神圣的受孕，从那最初的喜报开始，再经过祂奇妙的诞生，以及之后：祂将奥秘层层叠叠地珍藏在心中，如同『将这一切都珍藏在心里』（路加福音 2:5）一样，直到这一切融合成一种情感，融合成一个清晰的认知：即耶稣——是道成肉身的上帝。
    - type: paragraph
      text:
        ru: Да, тајну оваплоћеног Бога прва је сазнала Она од које се Он и оваплотио. Она је прва и сазнала за Његову божанску свемоћ, али и за Његову божанску смерност. Стога Му Она опрезно и неприметно сапшитава да «немају вина». А затим? Он у бескрајном човекољубљу свом знаће шта треба да чиии.
        cn: 的确，道成肉身之神的奥秘，首先被那位祂藉之道成肉身者所知晓。她也是第一个知晓祂神圣的全能，但也知晓祂神圣的谦卑。因此，她谨慎而隐秘地告知祂：「他们没有酒了。」然后呢？祂以其无限的仁爱，将知道该做什么。
    - type: paragraph
      text:
        ru: А Он, свесмирени, жели да им помогне али тако да то буде неупадљиво и ненаметљиво, већ природно и нормално.
        cn: 而祂，至谦的祂，希望帮助他们，但要以一种不显眼、不突兀的方式，而是自然而正常的方式。
    - type: paragraph
      text:
        ru: '«Рече Мати Његова слугама: Што год вам рече учините.» (Ин.2:5)'
        cn: 「他的母亲对仆人们说：『凡他所吩咐你们的，你们只管照着行。』」 (约翰福音 2:5)
    - type: paragraph
      text:
        ru: 'Божанска Посредница зна шта треба људи да чине да би изазвали смернога Исуса на чудотворну делатност: «Што год вам рече учините» (Ин.2:5). То је Њен проналазак који је постао вечио начело у људ-ком обраћању Богочовеку за помоћ, за спасење, за заштиту.'
        cn: 神圣的代祷者知道人们需要做什么，才能促使谦卑的耶稣施行奇迹：「他无论吩咐你们什么，你们只管照着行」（约翰福音 2:5）。这是她的发现，已成为人类向神人寻求帮助、救赎和保护时的一个永恒原则。
    - type: paragraph
      text:
        ru: 'Свемилостива, тиме нам је указала божанску свемилост: открила сав пут оваком човеку, пут спаоења, пут еванђелског живота, и радости, и утехе: «што год вам рече учините». То је наш удео у Богочовечанскам еванђељу, у Богочовечанском подвигу спасења. А све остало је Богочовеково.'
        cn: 至仁至慈者，借此向我们显明了神圣的完全慈悲：祂向这样的人揭示了整条道路，即救赎之路，福音生活之路，以及喜乐与安慰之路：「凡祂所吩咐你们的，你们都照着做吧。」 (约翰福音 2:5) 这是我们在神人福音中，在神人救赎的属灵争战中的份。而其余的一切都归于神人。
    - type: paragraph
      text:
        ru: «Што год вам рече», па макар то било нешто најнеобичније, најневероватније. А Богочовек неће тражити од вас ништа што не можете учинити, ништа што не би водило вашем спасењу, вашој бесмртности, вашем рају.
        cn: 「祂无论告诉你们什么」，即使那是最不寻常、最不可思议的事。然而，神人不会向你们要求任何你们做不到的事，也不会要求任何不导向你们的救赎、你们的不朽、你们的天国的事。
    - type: paragraph
      text:
        ru: '«А ондје бјеше шест камених судова за воду, постављених по обичају јудејског очишћења, који хватаху по двије или по три мјере. Рече им Исус: Напуните судове водом. И напунише их до врха. И рече им Исус: Захватите сад и носите пехарнику. И однесоше.» (Ин.2:6–8)'
        cn: 「在那里有六个石水缸，是照犹太人洁净的规矩摆着的，每口能盛两三桶水。耶稣对仆人说：『把缸倒满水。』他们就倒满了，直到缸口。耶稣又对他们说：『现在舀出来，送给管筵席的。』他们就送去了。」 (约翰福音 2:6-8)
    - type: paragraph
      text:
        ru: И они учинише по савету Богомајке. Да није било Ње, зар би учинили? Сигурно не би. И напунивши судове водом, захватише и однесоше куму уместо вина воду. Ко би испунио такво наређење Исусово, иапунио када Он још није био познат ни као пророк, а камоли као Син Божји и Бог?
        cn: 他们就照着圣母的建议行了。若非有她，他们岂会照做？肯定不会。于是，他们将缸里盛满水，舀出来，送到宴席总管那里，代替酒的却是水。谁会遵行耶稣这样的吩咐呢？在当时，他甚至还没被认为是先知，更遑论是神的儿子和神，又有谁会去遵行呢？
    - type: paragraph
      text:
        ru: Зато је дирљиво посредништво Бошмајке уствари половина првог чуда Исусовог. То је знамење за сва времена и за сва чудеса Исуоова у свима временима? Богамајка посредује, а Он чудотвори.
        cn: 因此，上帝之母那感人的代祷，实际上是耶稣第一个神迹的一半。这是对所有时代以及耶稣在所有时代所有神迹的记号吗？上帝之母代祷，而祂行神迹。
    - type: paragraph
      text:
        ru: '«А кад окуси пехарник вино које је постало од воде, и не знађаше откуда је, а слуге знадијаху које су захватиле воду, позва пехарник женика. И рече му: сваки човек најприје добро вино износи, а када се опију, онда лошије; а ти си чувао добро вино до сада.» (Ин.2:9–10)'
        cn: 「管筵席的尝了那水变的酒，并不知道是哪里来的，只有舀水的用人知道。管筵席的便叫新郎来，对他说：「人都是先摆上好酒，等到客人喝醉了，才摆上次等的；你倒把好酒留到现在。」（约翰福音 2:9-10）
    - type: paragraph
      text:
        ru: 'Кумов суд о вину «које је постало од воде» значајан је: он се чуди женику што је «добро вино чувао до сада» (Ин.2:10). Да, јер Богочгавек даје укус вину, укус свему у свету. Без Његовог божанског посредовања све обљутави. Његова божанока сила и у виновој лози претвара воду у вино; само ми то не видимо и не знамо; а чудо у Кани Галилејској је и учинио да то увидимо и сазнамо.'
        cn: 教父对「用水变出的」酒的判断是意义深远的：他惊讶于新郎「竟然把好酒留到现在」（约翰福音 2:10）。是的，因为神人赐予酒味道，也赐予世间万物味道。没有祂的神圣介入，一切都将索然无味。祂的神圣力量甚至在葡萄藤中也能将水变成酒；只是我们看不见，也不知道；而在加利利的迦拿行的奇迹，正是为了让我们得以看见并知晓。
    - type: paragraph
      text:
        ru: Та овај наш земаљски свет и није друго до раскошна изложба све самих таквих чудеса Божијих, Гле, ко то у љубичици, у босиљку, у рузмарину претвара у мирис воду, ваздух, топлоту, земљу? Ко то у шљиви, у јабуци, у трешњи претвара ваздух и светлост у род њихов? Ко то онако мајушно зрно пшенично у утроби земљиној иретвара у клицу која расте, класа и род доноси? Ко, ако не Онај исти што је у Кани Галилејској воду у вино претворио.
        cn: 其实，我们这尘世的世界，无非就是一场尽显此类神迹的华丽展示。看啊，是谁在紫罗兰、罗勒、迷迭香中，将水、空气、热量、泥土转化为芬芳？又是谁在李子、苹果、樱桃树上，将空气和光转化为它们各自的果实？又是谁将那般微小的麦粒，在泥土的子宫中，转化为生长、结穗并带来收成的幼芽？除了在加利利迦拿将水变为酒的那一位，还能有谁？
    - type: paragraph
      text:
        ru: «Овим, у Кани Галилејској, учини Исус почетак знамења, и показа славу Своју; и вјероваше у Њега ученици Његови.» (Ин.2:11)
        cn: 「借此，耶稣在加利利的迦拿行了神迹的开端，并显出祂的荣耀；祂的门徒就信了祂。」 (约翰福音 2:11)
    - type: paragraph
      text:
        ru: '«Ово учини Исус почетак чудесима у Кани Галилејској» (Ин.2:11): почетак који објашњава сва потоња чудеса Исусова. «Учини», да би преко чуда поверовали у чудотворца Богочовека, јер је у тој вери спасење људи. А спасење је циљ целокупне делатносги Богочовекове на земљи, па и свих његових чудеса од првог до последњег.'
        cn: 「这是耶稣在加利利的迦拿所行的头一件神迹」（约翰福音 2:11）：这是一切后续耶稣神迹的开端和解释。他「行」神迹，是为了让人借由神迹信奉行神迹的道成肉身者（神人），因为人的救赎就在于这份信仰。而救赎正是道成肉身者在世上全部活动的宗旨，包括祂从第一件到最后一件的所有神迹。
    - type: paragraph
      text:
        ru: 'Посебан смисао првог чуда Исусовог: брак добија свој божански, бесмртан смисао тек са благословом Христовим који долази од Његавог присусгва. А присутан је Он увек у Цркви Својој. И прво чудо Своје Спас је учинио на свадби, да би показао колико је освећење брака важно за род људски.'
        cn: 耶稣第一个神迹的特殊意义：婚姻唯有借着基督的祝福，即源于祂的临在，才获得其神圣、不朽的意义。而祂总是临在于祂的教会中。救主在婚礼上行了祂的第一个神迹，为要表明婚姻的圣化对人类是何等重要。
    - type: paragraph
      text:
        ru: 'Од светог брака – света породица, свет породични живот; благословен брак – благословена породица, благословен сав брачни живот. А брак постаје божанска збиља и радост када супрузи стално испуњују божански савет Богамајкин: «што год вам рече учините». А то што је чудесни Господ рекао, и увек говори свима супрузима и овима људима налази се у његовом светом Еванђељу, а оно у Светој Цркви Његовој.'
        cn: 圣洁的婚姻带来圣洁的家庭，圣洁的家庭生活；蒙福的婚姻带来蒙福的家庭，蒙福的整个婚姻生活。而当夫妻双方恒常遵行圣母的属神建议：「凡他所吩咐你们的，你们只管照着行」，婚姻就成为属神的实相与喜乐。而那奇妙的主所说，且恒常对所有夫妻以及众人所说的，都记载在他的圣洁福音书里，而这福音书又在他的圣教会中。
    - type: paragraph
      text:
        ru: 'Свети Златоуст благовести о овом чуду: Исус је био најпознатији у Галилеји. Зато Га и зову на свадбу, и Он долази. Он није гледао на своје достојанство, него на нашу корист. Он, који се није одрекао узети на себе обличје слуге, утолико пре није могао одбити да присуствује на свадби слугу и да буде мећу званицзма на свадби. Разуме се, они који су Га звали на свадбу нису тачно знали ко је Он, нити су Га звали као великог човека, већ просто као обичног човека и познаника.'
        cn: 圣金口若望宣讲了关于这个神迹的教导：耶稣在加利利最有名望。因此他们邀请祂参加婚宴，祂也来了。祂不顾念自己的尊严，而是为了我们的益处。祂既然没有拒绝取了奴仆的形像，何况更不能拒绝出席仆人们的婚宴，并与婚宴上的宾客同席。很显然地，那些邀请祂参加婚宴的人并不确切知道祂是谁，他们邀请祂，也不是将祂当作一位伟大的人物，而仅仅是当作一个普通人或一个熟人。
    - type: paragraph
      text:
        ru: 'На то донекле и указују речи светог Еванђелиста: беше онде мати Исусова и браћа Његова (Ин.2:1), то јест Исуса оу позвали као и Матер Његову и браћу. И кад нестаде вина, рече Мати Исусова Њему: «Немају вина» (Ин.2:3). Овде треба скренути пажњу откуда Матери Његовој тако узвишена мисао да тамо што велико помисли о Сину овом, када до тога времена Он иије учинио био још никакво чудо. Јер Еванђелист вели: «Овим учини Исус почетак чудесима у Кани Галилејској» (Ин.2:11).'
        cn: 圣福音使徒的话在某种程度上也指向了这一点：「耶稣的母亲在那里，他弟兄也在那里」（约翰福音 2:1），也就是说，耶稣和他的母亲以及弟兄都被邀请了。当酒用尽了，耶稣的母亲对他说：「他们没有酒了」（约翰福音 2:3）。在这里，需要注意的是，他的母亲怎么会有如此崇高的想法，认为她的儿子会行大事，要知道在那之前他还没有行过任何神迹。因为福音使徒说：「这是耶稣在加利利的迦拿所行的头一件神迹」（约翰福音 2:11）。
    - type: paragraph
      text:
        ru: 'Ако пак ко рече да ту још нема довољно доказа да је чудо у Кани било почетак чудесима, пошто додатак: «у Кани Галилејској» показује да је ово чудо било прво «у Кани», а ие уопште прво од свих чудеса Христових; јер вероватно је Хрисгос и раније у другим местима чинио чудеса; … овда треба рећи оно што је Јован рекао, а то је Ја Га не знадох, него да се објави Израиљу» (Ин.1:31)…'
        cn: 但若有人说，那里还没有足够的证据表明迦拿的奇迹是诸神迹的开端，因为「在加利利的迦拿」这个补充说明，表明这个神迹是「在迦拿」的第一个，而并非基督所有神迹中的第一个；因为基督很可能以前也在其他地方行过神迹；……在这里需要引述约翰所说的话，即：「我素不认识他，但要他显明给以色列。」（约翰福音 1:31）
    - type: paragraph
      text:
        ru: То јест, Он је овим чудом почео да бива свима познат.[12]
        cn: 也就是说，祂藉着这个神迹开始变得人人皆知。[12]
  - type: heading2
    text:
      ru: Исус изгони из храма трговце
      cn: 耶稣将商人赶出圣殿。
    children:
    - type: paragraph
      text:
        ru: '«Потом сиђе у Капернаума, Он и Мати Његова и ученици Његови, и ондје остадоше не много дана. И близу бјеше Пасха јудејска, и отиде Исус у Јерусалим. И нађе у храму оне што продају говеда и овце и голубове, и мјењаче новца гдје седе. И начинивши бич од узица, изагна све из храма, и овце и говеда; а мјењачима просу новац и столове испретура. И рече онима што продају голубове: Носите то одавде! Не правите од дома Оца Мога дом трговине.»  (Ин.2:12–16)'
        cn: 然后，他、他的母亲和他的门徒下到迦百农，并在那里住了不多几天。犹太人的逾越节近了，耶稣就上耶路撒冷去。他在殿里看见卖牛、羊和鸽子的，和兑换银钱的人坐在那里。就用绳子作了一条鞭子，把殿里所有的人赶出去，又把羊和牛赶出去；倒出兑换银钱之人的银钱，推翻他们的桌子。又对卖鸽子的说：「把这些拿走！不要将我父的殿当作买卖的殿。」 (约翰福音 2:12-16)
    - type: paragraph
      text:
        ru: 'Храм? – Дом Божји: дом Божји: «дом Оца Мога», изјављује Господ Исус. У дому Божјем живе деца Божја, породица Божја; они – «домаћи Богу» (Еф.2:19). Живећи трговци, са свима својим «воловима», «овцама», «голубовима», тезгама, новцима, они дом Божји претварају у дом трговачки. А то – у дом хајдучки. За све њих кротки Господ Исус има само бич.'
        cn: 圣殿？——上帝的家：上帝的家：「我父的家」，主耶稣宣称。在上帝的家中住着上帝的孩子们，上帝的家庭；他们是「上帝家里的人」（以弗所书 2:19）。那些商贩们，带着他们所有的「牛」、「羊」、「鸽子」、摊位、钱币，将上帝的家变成了买卖之家。而那——成了一个强盗之家。对于他们所有的人，温和的主耶稣只有鞭子。
    - type: paragraph
      text:
        ru: Ни за кога, само за њих. «Изгна све из храма» (Ин.2:15), мењачима просу новце и столове испретура» (Ин.2:15). Сигурно, никада Господ није био гневнији иего овом приликом. «Јагње Божје» се разгаевило.
        cn: '唯独是为了他们，不为他人。

          「把殿里的一切都赶出去」（约翰福音 2:15），「倒出兑换银钱之人的银钱，推翻他们的桌子」（约翰福音 2:15）。

          确实，主在任何时候都不曾比这一次更愤怒。「神的羔羊」发怒了。'
    - type: paragraph
      text:
        ru: 'Такав гњев је иајстрашнији, јер најоправданији. Да се јагње изазове на гњев, и то «Јагње Божје», треба учинити изузетно богомрско дело. А таква су дела и по среди. «Дом Божји» је тиме Божји што у њему живи Бог и Његови домаћи; а домаћи опште са Оцем: молитвом, љубављу, вером, смерношћу, кротошћу, послушношћу.'
        cn: 这种愤怒是最可怕的，因为它是最有理由的。要激怒一只羔羊，而且还是「上帝的羔羊」，就必须做出极其令上帝憎恶的行为。而这些行为也正是现在所论及的。「上帝的家」之所以是上帝的，是因为上帝和祂的家人居住在其中；而家人借着祷告、爱、信心、谦卑、温柔、顺服与父相通。
    - type: paragraph
      text:
        ru: А трговци у дому Божјем све то замењују својим хајдучким среброљубљем, самољубљем, сластољубљем, блатољубљем. Зато за те ниске душегубне страсти Господ има бич.
        cn: 而上帝殿中的商人们，用他们强盗般的贪爱钱财、贪爱自己、贪爱享乐、贪爱污秽来取代所有这一切。因此，对于这些卑劣的、败坏灵魂的情欲，主有鞭子。
    - type: paragraph
      text:
        ru: 'У духовном смислу: душа је – храм Божји, дом Божји. Не живи ли се у њој молитвом, вером, љубављу, смиреношћу, гле, она се претвара у дом трговачки у коме страст страсти продаје и предаје човека, и грех греху, и смрт смрти, и ђаво ђаволу.'
        cn: 属灵意义上：灵魂是——神的殿，神的家。若不以祷告、信心、爱、谦卑在其内生活，看哪，它就变成一个买卖的殿，在其中情欲将人卖给情欲，并交付于情欲；罪也将人交付于罪；死亡也将人交付于死亡；魔鬼也将人交付于魔鬼。
    - type: paragraph
      text:
        ru: '«А ученици се Његови сјетише да је написано: Ревност за дом Твој изједе Ме.» (Ин.2:17)'
        cn: «门徒们想起经上写着：「为祢的殿所发的热心吞噬了我。」» (约翰福音 2:17)
    - type: paragraph
      text:
        ru: 'Онда у такву душу Господ обично улази са бичем болести, страдања, карања, искушења. Јер је Господ увек пун ревности за дом Божји: «ревност за дом твој изеде ме».'
        cn: 于是，主通常会带着疾病、苦难、惩戒、试炼的鞭子进入这样的灵魂。因为主总是对神的殿充满热心：「我为你的殿心焦如焚」。
    - type: paragraph
      text:
        ru: 'А дом је твој: и човек, и храм, и љубичица и крин, и свет, и васиона, и сва сазвежђа. Јер у свима њима: оно шго је ло госно сачињава твој престо: у логосном је и обиталиште Логоса. А то: у сваком цвету, у свакој звезди, у свакој твари, у сваком сунцу, у сваком атому. Зато, у свету се непрекидно врши богослужење, христослужење.'
        cn: 而你的家是：人和殿，紫罗兰和百合，世界和宇宙，以及所有星宿。因为在所有这些之中：凡是具逻格斯性者，便构成你的宝座；在具逻格斯性者之中，也有逻格斯的居所。而这则体现在：在每一朵花中，在每一颗星辰中，在每一个受造物中，在每一个太阳中，在每一个原子中。因此，在世上不间断地进行着事奉上帝，事奉基督。
    - type: paragraph
      text:
        ru: '«Јудејци пак одговорише и рекоше Му: Какав нам знак показујеш да то чиниш? Исус одговори и рече им: Развалите овај храм и за три дана ћу га подићи. А Јудејци рекошше: четрдесет и шест година зидан је овај храм, а ти ћеш за три дана да га подигнеш? А Он говораше о храму тијела Својега. Када пак устаде из мртвих, сјетише се ученици Његови да ово говораше, и вјероваше Писму и ријечи коју рече Исус.» (Ин.2:18–22)'
        cn: 犹太人于是回答祂说：「你给我们显什么神迹，证明你做这些事呢？」耶稣回答他们说：「你们拆毁这殿，三日之内我要将它建立起来。」犹太人说：「这殿是四十六年才建成的，你三日之内就要将它建立起来吗？」然而祂说的是祂身体的殿。所以当祂从死里复活以后，祂的门徒就想起祂说这话了，并且相信了圣经和耶稣所说的话。(约翰福音 2:18-22)
    - type: paragraph
      text:
        ru: Све је у овом свету – храм Божји. А на првом месту човек, тело човечије. То је оно што фарисеји и садукеји не разумеју. И када посгављају Господу питање каквом влашћу Он истерује трговце из храма, Он им и објашњава да је човек – главни храм Божји у свету. А пре свега – Богочовек.
        cn: 世间万物皆是上帝的殿宇。而首先，是人，是人的身体。这正是法利赛人和撒都该人不明白之处。当他们向上主询问他凭什么权柄将商人逐出圣殿时，他便向他们解释说，人——是世上主要的上帝的殿宇。而最主要的——是神人。
    - type: paragraph
      text:
        ru: 'Тело човечије је храм – опогањеи и разрушен грехом и смрћу. То је најтужнија рушевина у овом свету. Ту рушевину може поиово подићи у велелепни храм Божји само Богочовек васкрсењем из мртвих безгрешног тела свог. И тиме дати залог и првину и почетак за васкрсење тела људских из смрти: за обновљење свих тих храмова Божјих које је смрт грехом порушила.'
        cn: 人的身体是殿宇——被罪与死亡所玷污和毁坏的。这是这个世界上最悲惨的废墟。这个废墟，只有神人借着他那无罪的身体从死里复活，才能重新将其建造成为宏伟的上帝殿宇。并因此为人身体从死亡中复活给予保证、初熟的果子和开端：为了更新所有那些因罪被死亡所毁坏的上帝的殿宇。
    - type: paragraph
      text:
        ru: 'Тек у васкрсењу себе Христом човек постаје величанственим и неразоривим храмом Божјим, у коме се непрекидно врши богослужење дивно, сво сачињеио из хорова еванђелских врлина и са њима свих Небеских сила. Јер тек у васкрсењу тела Христовог постаје очигледан божански циљ тела људског уоиште: вечно служити Богу и бити вечно светим храмом Божјим.'
        cn: 唯有通过基督使自身复活，人才能成为宏伟而不朽坏的上帝圣殿，其中不间断地举行着奇妙的崇拜，这崇拜全然由福音美德的诸圣咏团以及所有天上的能力一同构成。因为唯有在基督身体的复活中，人类身体的普遍神圣目的才变得清晰可见：即永远地侍奉上帝，并永远成为上帝的圣殿。
    - type: paragraph
      text:
        ru: «А када бјеше у Јерусалиму о празнику Пасхе, многи вјероваше у Име Његово, видећи знаке Његове које чињаше. А Сам Исус не повероваше себе њима, јер их је Он знао све. И не требаше да Му ко свједочи за човјека; јер Сам знадијаше шта бјеше у човјеку.» (Ин.2:23–25)
        cn: 当祂在耶路撒冷过逾越节的时候，许多人信了祂的名，因为他们看见祂所行的神迹。但耶稣却不把自己信托给他们，因为祂认识所有的人。祂也不需要人向祂作证关于人的事，因为祂自己知道人里面有什么。(约翰福音 2:23-25)
    - type: paragraph
      text:
        ru: 'Вера и поверење: «Многи вероваше у Име Његово, видећи чудеса Његова која чињаше» (Ин.2:23). А Исус? – «Не повераваше себе њима, јер их знађаше све. И не требаше Му да ко сведочи за човека, јер сам знађаше шта беше у човеку» (Ин.2:24–25).'
        cn: 信仰与信赖： 「许多人因看见祂所行的神迹，就信了祂的名」（约翰福音 2:23）。但耶稣呢？——「祂却不将自己交托他们，因为祂认识所有人。祂也不用人见证什么，因为祂知道人心里所存的」（约翰福音 2:24-25）。
    - type: paragraph
      text:
        ru: 'Вера, изазвана само чудесима, а не и љубављу према Господу Исусу, и жељом за спасењем од греха и зла, није постојана, не заснива се на неразоривом темељу. Вера у Христа, то је пре свега, бескрајно поверење у Њега: да Он има излазе за све људске муке, да Он има одговоре за сва људска питања, да Он има утехе за сва људска страдања.'
        cn: 仅仅由神迹所引发，而非也由对主耶稣的爱以及渴望从罪恶中得救所引发的信心，是不稳固的，没有建立在不可摧毁的根基之上。对基督的信心，首先在于对祂无限的信赖：相信祂为人类所有的痛苦都有出路，祂为人类所有的问题都有答案，祂为人类所有的苦难都有安慰。
    - type: paragraph
      text:
        ru: 'На такву веру, засновану на потпуном поверењу у Христа, Христос одговара Својим поверењем: открива верујућем Себе, Своје тајне, Своја савршесства, Своја Божанска богатства, Своје Царство Небеско. Дотле, Он је неповерљив према човеку због зла христоборског што је у њему, због греха богоиздајничког.'
        cn: 对于这种建立在对基督完全信赖基础上的信心，基督以祂的信赖回应：祂向信徒启示祂自己，祂的奥秘，祂的完美，祂神圣的丰盛，以及祂的天国。然而，祂不信任人，因为人心中那与基督为敌的邪恶，以及那背叛神的罪。
    - type: paragraph
      text:
        ru: 'Јер Он, као свезнајући, сам зна «шта је у човеку» уолште, затим шта и у сваком човеку посебно: самољубље, и у њему отровно грехољубље. А томе поверавати бесмртна блага значи давати их блудном сину или лењом слузи; дати му рај да би га обесветио, загадио.'
        cn: 因为祂，作为全知者，祂自己知道「人里面有什么」，普遍而言，其次，在每个人里面具体有什么：自爱，以及其中有毒的罪爱。而将不朽的财宝托付给这样的人，就意味着将它们交给浪子或懒惰的仆人；将乐园赐给他，好让他去亵渎、玷污它。
    - type: paragraph
      text:
        ru: 'Обратити пажњу: Господ «ученицима особито казиваше све», – ето коме Он повераваше Себе и све тајне на Тајној вечери, а «онима споља» све бива у причама, у сликама, у алегоријама.'
        cn: 请注意：主「尤其将一切都告诉门徒」——祂就是向这些人，在最后的晚餐上，将自己和一切奥秘都托付了；而「对外面的人」，一切都呈现在比喻、图像和寓言中。
    - type: paragraph
      text:
        ru: Јер богопознање, јер христопознање даје се вери. «Вером сазнајемо» (Евр.11:3), вером схватамо, вером разумевамо све што се односи не само на Бога него и на свет. То је основни гносеолошки критеријум новозаветни и начело. Јер вера, шта је?
        cn: 因为对神的认识，因为对基督的认识是藉着信心赐予的。「我们因着信，就知道」（希伯来书 11:3），我们凭信心领悟，凭信心理解一切不只与神相关，也与世界相关的事物。这是新约基本的认识论准则和原则。因为，信心是什么呢？
    - type: paragraph
      text:
        ru: 'Она је најпре духовно сједињење верујућег са Оним у кога верује, Господом Христом. Из тог духовног јединства истиче заједница живота, истине, осећања, срца, ума («ми ум Христов имамо» –1Кор.2:16); једном речју: облачење у Христа, ухрисговљење, охристовљење: органско сједињење човека са Богочовеком, попут лозе на чокоту (Ин.15:1–5); из чега логички и природно следи основни закон еванђелског живота, живота у Христу: човек не може чинити ништа без Христа: «без мене не можете чинити ништа» (Ин.15:5).'
        cn: 它首先是信徒与他所信的那一位，主基督，在灵性上的合一。从这属灵的合一中，涌流出生命、真理、情感、心灵和心智的相通（「我们是有基督的心了」——哥林多前书 2:16）；简而言之：披戴基督，与基督合一，基督化：即人与神人之间的有机结合，犹如枝子在葡萄树上（约翰福音 15:1-5）；由此，逻辑上和自然地引申出福音生活，即在基督里的生活的基本法则：人若没有基督就不能做什么：「离了我，你们就不能做什么」（约翰福音 15:5）。
    - type: paragraph
      text:
        ru: А ово се односи на сва људска бића у свима световима, јер без Христа људи не могу чинити ништа истински добро, божанско, бесмртно, непролазно, вечно.
        cn: 这适用于所有世界中的所有人类，因为没有基督，人们就无法做任何真正良善的、神圣的、不朽的、不朽坏的、永恒的事。
    - type: paragraph
      text:
        ru: Сва њихова делатност без Христа потапа њихово биће кроз грех у смрт, кроз зло у пакао, јер грех не може одвести Безгрешном, и зло – у рај.
        cn: 他们一切离开了基督的活动，藉着罪使他们的本性沉沦于死亡，藉着恶沉沦于地狱，因为罪不能引向无罪者，恶也不能引向天堂。
  - type: heading2
    text:
      ru: Глава трећа. Разговор Господа Исуса са Никодимом
      cn: 第三章. 主耶稣与尼哥德慕的对话
    children:
    - type: paragraph
      text:
        ru: Никодим, учени фарисеј и кнез јеврејски, учи се вери. Јер је вера наука, и то најтежа наука. Најтежа стога што она учи како се човвк опредељује за Бога, духовно сједињује са Ботм, испуњујући Његово еванђеље, и непрекидно живи Богом у свима световима и у свима својим животима.
        cn: 尼哥德慕，一位有学问的法利赛人，也是犹太人的官长，正在学习信仰。因为信仰是一门学问，而且是最难的学问。它之所以最难，是因为它教导人如何为上帝做出抉择，如何在灵性上与上帝结合，履行祂的福音，并在所有的世界里和所有的生命中不间断地活在上帝里。
    - type: paragraph
      text:
        ru: 'А све то значи: поновно духовно рођење човека Богом помоћу Духа Божјег који се сав разлива по бићу човековом и својим божанским силама преображава човека у сасвим ново биће, у биће – «рођено од Духа», које и живи вечито по вечним законима Духа.'
        cn: 而这一切都意味着：人藉上帝而来的属灵重生，是藉着上帝的圣灵——这圣灵完全倾注于人的存有之中，并以其神圣力量，将人转化为一个全新的存有——一个「由圣灵所生」的存有，它也永远依照圣灵的永恒法则而活。
    - type: paragraph
      text:
        ru: '«А бијаше човјек међу фарисејима, по имену Никодим, кнез јудејски. Он дође Исусу ноћу и рече Му: Рави, знамо да си учитељ од Бога дошао; јер нико не може ова знамења творити која Ти твориш ако није Бог са њим.» (Ин.3:1–2)'
        cn: 「有一个法利赛人，名叫尼哥德慕，是犹太人的官。这人夜里来见耶稣，对他说：拉比，我们知道你是一位从神那里来的夫子，因为没有人能行你所行的这些神迹，除非有神与他同在。」(约翰福音 3:1-2)
    - type: paragraph
      text:
        ru: 'Никодим приступа Господу Исусу као учитељу, не као Богу: «ти си учитељ од Бога» (Ин.3:2).'
        cn: 尼哥德慕来到主耶稣面前是作为一位教师，并非作为神，说：「你是从神那里来的老师」（约翰福音 3:2）。
    - type: paragraph
      text:
        ru: 'Још нешто: за њега је Госгод Исус учитељ са којим је Бог. То је све у духу старозаветног општења Бога са људима: преко светих Пророка. Са човеком може бити Бог као што је био са Мојсијем, са Илијом, са Исаијом; али да човек буде Бог, то је ново и несхватљиво.'
        cn: 此外：对他而言，主耶稣是一位有神同在的老师。这完全符合旧约中神与人交通的精神：通过圣先知们。神可以与人同在，就像祂与摩西、与以利亚、与以赛亚同在一样；但人成为神，这却是新鲜且不可理解的。
    - type: paragraph
      text:
        ru: 'А Никодим се баш и нашао пред новим бићем, новом стварношћу. Како то биће схватити? Старозаветним видом оно се не може сагледати, ни старозаветном мером мерити, ни старозаветним умом схватити. Ту се са човеком мора десити нвшто ново: он просто мора добитии нов вид, нов слух, иава чула, нов ум, нову душу да би могао схватити ново биће = Богочовека Исуса. Он се просто мора наново родити не само делимично обновити.'
        cn: 尼哥底母正是发现自己面对着一个新的生命，一个新的实在。如何才能理解这个生命呢？凭旧约的眼光无法将其看清，凭旧约的标准无法衡量，凭旧约的心智也无法理解。在这里，人必须发生一些新的事情：他简直必须获得新的视野、新的听觉、新的感官、新的心智、新的灵魂，才能理解这个新的生命，即——神人耶稣。他简直必须重生，而不仅仅是部分地更新。
    - type: paragraph
      text:
        ru: '«Одговори Исус и рече му: Заиста, заиста ти кажем: ако се ко не роди одозго, не може видјети Царства Божијега.» (Ин.3:3)'
        cn: 「耶稣回答说：「我实实在在地告诉你，人若不重生，就不能见神的国。」 (约翰福音 3:3)」
    - type: paragraph
      text:
        ru: 'О томе Господ Исус и говори Никодиму: «Ако се човек не роди наново (не роди одозго), не може видети царства Божјега» (Ин.3:3). А родити се наново, то је родити се одозго: свим бићем својим полазити из оног света, свим мислима, свим осећањима, свим расположењима; је ли мисао нека буде с неба, нека буде корењем на небу; је ли осећање, је ли дело, нека такође буде с неба.'
        cn: 关于此事，主耶稣也对尼哥德慕说：「人若不重生（不从上而生），就不能见神的国。」 (约翰福音 3:3) 而重生，就是从上而生：要用自己的全部生命从那个世界出发，用所有的思想、所有的感受、所有的心境；无论是思想，让它来自天上，让它根植于天上；无论是感受，无论是行为，也让它来自天上。
    - type: paragraph
      text:
        ru: Одакле ти је мисао? – одозго, с неба. Одакле осећање, одакле савест, одакле жеље? – с неба, с неба, с неба. А ти сам одакле си, човече? – с неба. Ништа твоје нека не буде од земље и са земље. Ти си нови човек тиме што си с неба, што си небо снео на земљу, што на земљи живиш небом. А очи твоје, навикнуте на небо и саме небеског порекла, умеће пронаћи и видети самога Господара неба, и распознати Га свуда ма где Он био, распознати Га и у Исусу.
        cn: '你的思想从何而来？——来自上方，来自天。

          情感、良心、渴望，它们又从何而来？——来自天，来自天，来自天。

          而你自身，人啊，你又从何而来？——来自天。

          愿你的一切都不属地，不生于地。

          你之所以是新造的人，是因为你来自天，将天带到地上，并且在地上以天的方式生活。

          而你的眼睛，已习惯于天，其本身也源自天，将能寻见并看见天之主宰本身，并能无论祂身在何处都认出祂，也能在耶稣里认出祂。'
    - type: paragraph
      text:
        ru: Пошто си као боголико биће с неба, ти си већ видео царство небеско, царство Божје. А на земљи ено васцелог царства Божјег у Господу Исусу.
        cn: 既然你作为来自天堂的肖像神性的存在，你已经看到了天国，神的国度。而在地上，看哪，整个神的国度就在主耶稣里。
    - type: paragraph
      text:
        ru: То не виде они који се нису родили «одозго», него оу свим бићем «одоздо» са земље, у земљи, на земљи.
        cn: 那些没有「从上方」重生的人，并没有看见这（属灵的真相），而是以他们整个生命，完全「从下方」地、从地上、在土里、在地上来体会的。
    - type: paragraph
      text:
        ru: '«Рече Му Никодим: Како се може човјек родити кад је стар? Еда ли може по други пут ући у утробу матере своје и родити се?» (Ин.3:4)'
        cn: 尼哥德慕对祂说：「人老了，怎能重生呢？岂能再进母腹生出来吗？」 (约翰福音 3:4)
    - type: paragraph
      text:
        ru: 'Такав је стари човек, старозаветни човек. Типолошки је дат у Никодиму: «Како се човек може родити кад је стар? Еда ли може по други пут ући у утробу матере своје и родити се? (Ин.3:4). – Да, то је тако кад је реч о телу и телесном рођењу. Али дух, како се дух раћа? Ено мисао се рађа из духа, и осећање, и хтење. А дух, како се он раћа? Одкуда он? Овакав какав је он се сигурио родио. А кад се једном родио, зашто се не може поново родити, препородити?'
        cn: 这就是旧人，旧约之人。在尼哥德慕身上有其典型展现：「人老了，怎能重生呢？岂能再进母腹生出来呢？」(约翰福音 3:4)。——是的，当谈及身体和肉身的出生，情况便是如此。但是灵呢，灵如何诞生？你看，思想从灵中生出，情感也是，意愿也是。而灵呢，它如何诞生？它从何而来？它现今这样，无疑是诞生了。它既然已诞生过一次，为何不能再次诞生，不能重生呢？
    - type: paragraph
      text:
        ru: Једну мисао ти много пуга са муком рађаш у духу, из духа свог? То је могуће, зар не? А дух, зашто се дух не би могао по друга пут родити?
        cn: 你是否多次以艰辛在你的灵里、从你自己的灵中生出一个念头呢？这是可能的，不是吗？那么，灵为什么不能第二次重生呢？
    - type: paragraph
      text:
        ru: '«Одговори Исус: Заиста, заиста ти кажем: ако се ко не роди водом и Духом, не може ући у царство Божије.» (Ин.3:5)'
        cn: 耶稣回答说：「我实实在在地告诉你，人若不是从水和圣灵生的，就不能进神的国。」 (约翰福音 3:5)
    - type: paragraph
      text:
        ru: 'То Спаситељ и објављује Никодиму: «Заиста, заиста ти кажем: ако се човек не роди водом и Духом, не може ући у царство Божје» (Ин.3:5). Родити се «од воде и Духа»? Дух Божји, Дух Свети – родитељ човека. Човек се од њега рађа када свим бићем погрузи себе у Њему, када се крсти Њиме, и узаживи Њиме свим бићем: свим срцем, свом душом, овом мишљу, свом снагом: када Истина «Духа Истине» постане његовом Истином; када светост Духа Светога постане његовом светошћу; када дарови Духа Светога постану његовим даровима; када сав дух свој изводи из Духа Светога и своди на Њега.'
        cn: 救主向尼哥德慕宣告说：「我实实在在地告诉你，人若不是从水和圣灵生的，就不能进神的国」（约翰福音 3:5）。「从水和圣灵生」？神的灵，圣灵——是人的生养者。人从祂而生，是当他将自己整个生命浸没在祂里面，当他被祂施洗，并以祂充满自己的整个生命时：以全心、全魂、全意、全力：当「真理的灵」的真理成为他的真理时；当圣灵的圣洁成为他的圣洁时；当圣灵的恩赐成为他的恩赐时；当他将自己的整个灵性从圣灵引出并归于祂时。
    - type: paragraph
      text:
        ru: А то и јесте најсвакодневнија стварност Хришћана, духоносаца; «Не живимо по телу него по Духу» (Рим.8:4). «Ви нисте у телу него у Духу јер Дух Божји живи у вама» (Рим.8:9). Стога што им је све од Духа Светога, апостол и назива хришћане духовнима (1Кор.2:12–16). И све што се у душама њиховим рађа, раћа се од Духа Светога, од блатодати Његове.
        cn: 这正是承载圣灵的基督徒的日常实况；「我们不随从肉体，只随从圣灵」（罗马书 8:4）。「你们不在肉体里，而是在圣灵里，因为神的灵住在你们里面」（罗马书 8:9）。因此，因为他们的一切都来自圣灵，使徒便称基督徒为属灵人（哥林多前书 2:12-16）。凡在他们灵魂中诞生的，都由圣灵、由祂的恩典所诞生。
    - type: paragraph
      text:
        ru: 'Пример, свепример: Силазак Светога Духа на дан Свете Педесеинице. Ето апостола Петтра, и осталих; ето шта значи родити се одозго; родити се наново=крстити се Духом Светим. Да је све то тако физички, очигледан дскказ? – Света вода, јер њу Дух Свети силом својом осењује, и тако освећује, и од кварежи избавља. Тело се и само «поново рађа» у светој води очишћујући се од свакога греха.'
        cn: 一个例子，一个完美的例子：圣灵在圣灵降临节（五旬节）那日降临。看哪，使徒彼得和其余的门徒；看哪，这就是从上头生（重生）的意义；重生，即是受圣灵的洗。难道这一切都是如此肉身、物质的，一个明显的证明吗？— 圣水，因为圣灵以其大能庇佑它，并借此使其圣化，且使其免于败坏。身体本身也在圣水中「重生」，得以洁净，脱离一切罪恶。
    - type: paragraph
      text:
        ru: То је физички доказ да тако бива и духовно рођење = крштење Духом Светим. Тако удуховљен и одуховљен чавек једино и «може ући у царство Божје» и «видети царство Божје». То је оно «ново рухо» без кога се не може бити на «свадби» Сина Божјег, у царству Божјем.
        cn: 这是身体上的证明，表明属灵的重生——即圣灵的洗——也是如此。如此被圣灵充满并被灵化的人，唯独他能「进入神的国」和「看见神的国」。这就是那「新袍」，没有它，就不能在神的国里参加神子的「婚筵」。
    - type: paragraph
      text:
        ru: '«Што је рођено од тијела, тијело је; а што је рођено од Духа, дух је. Не чуди се што ти рекох: ваља вам се родити одозго.» (Ин.3:6–7)'
        cn: «凡从肉身生的，就是肉身；从灵生的，就是灵。你不要希奇我对你说：你们必须重生。» (约翰福音 3:6-7)
    - type: paragraph
      text:
        ru: 'Но све то у своме божанском реду и поретку: тело, његово духовно рођење остаје у границама своје телесности; дух, наново рођен, остаје у границама Духовданске духовности. Отуда је у човека наново рођеног све по новом: на нов начин он и мисли, и осећа, и живи, и види, и чује. У њега су и нове очи и нов уши, и нова чула, јер је у њега нов дух, нова душа, ново срце.'
        cn: 但这一切都在其神圣的秩序和规划之中：身体，其属灵的诞生仍在其肉体的界限内；灵，重生了的，仍在其圣灵降临节的灵性界限内。因此，在重生的人里面，一切都是新的：他以新的方式思考、感受、生活、看见、听见。他有新的眼睛、新的耳朵、新的感官，因为他里面有新的灵、新的魂、新的心。
    - type: paragraph
      text:
        ru: 'У човека нерођеног наново – све је старо и све по старом: све је остарело грехом и састарело смртношћу: стара душа, старе очи, старо срце, и сав духовни живот изнемогао, обогаљио, оболестжо. Под тим теретом старости и греховности, осмрћености су ови људи, зато Спас одлучно препоручује свима: «треба вам се наново родити» (Ин.3:7)'
        cn: 对于未重生之人——一切都是陈旧的，一切都循着旧例：一切都因罪而朽坏，并与必死性一同老去：陈旧的灵魂，陈旧的眼睛，陈旧的心，整个属灵生命都已衰弱、残废、病重。在衰老、罪恶和死亡的重担之下，这些人就是如此，因此救主明确地建议所有人：「你们必须重生」（约翰福音 3:7）。
    - type: paragraph
      text:
        ru: '«Дух дише гдје хоће, и глас Његов чујеш, а не знаш откуда долази и куда иде: тако је сваки који је рођен од Духа». (Ин.3:8)'
        cn: 「圣灵随意吹气，你听见祂的声音，却不知祂从何处来，往何处去：凡从圣灵而生的，都是如此。」（约翰福音 3:8）
    - type: paragraph
      text:
        ru: 'Какве су особине човека рођеног «од Духа», рођеног «одозго»? Све је у њега бескрајно и бесконачно: и мисли, и осећања, и расположења, јер их све обрађује и прерађује Духом Светим: свака мисао његова постаје духомисао; и осећање – духоосећање. А Дух има ли краја?'
        cn: 一个被「圣灵所生」、从「上头生」的人，有什么样的特质？他的一切都是无限且无穷的：无论是思想、情感还是心境，因为圣灵将这一切都处理并更新；他每一思想都成为属灵的思念；每一情感都成为属灵的情感。那么，圣灵有尽头吗？
    - type: paragraph
      text:
        ru: '«Бог не даје Духа на меру» (Ин.3:34). Зато је у духоносног човека све бездано, бескрајно, бесконачно. На свему његовом је «печат Духа Светога»: духоносци су «запечаћени» Духом Светим (Еф.1:13; 4:30).'
        cn: 「上帝不限量赐下圣灵」（约翰福音 3:34）。因此，在一个有圣灵同在的人身上，一切都是深不可测、无限无垠、无穷无尽的。在他的一切上都带有「圣灵的印记」：有圣灵的人是被圣灵「盖了印记」的（以弗所书 1:13，4:30）。
    - type: paragraph
      text:
        ru: '«Одговори Никодим и рече Му: Како може то бити? Исус одговори и рече му: Ти си учитељ Израиљев, а то ли не знаш? Заиста, заиста ти кажем да оно што знамо говоримо и што смо видјели свједочимо, и свједочанство наше не примате.» (Ин.3:9–11)'
        cn: 尼哥德慕回答说：「怎能有这事呢？」耶稣回答说：「你是以色列人的先生，还不明白这事吗？我实实在在地告诉你，我们所知道的，我们说；我们所看见的，我们作见证；你们却不领受我们的见证。」 (约翰福音 3:9-11)
    - type: paragraph
      text:
        ru: 'Није чудо што Никодим то не разуме, јер све то «треба да се духовно разгледа» (1Кор.2:14), мада је у Старом Завету јављено о томе преко светог пророка, што «учитељ Израиљев» Никодим треба да зна. То је очигледна истина и стварност не само за Исуса него и за свете пророке, који о духовним истинама гаворе на основу личног искуства, личних виђења и упутстава од Духа Светога. Зато Спас у Име Своје и Његово говори о томе: 3аиста, заиста ти кажем да ми говоримо и сведочимо што видесмо, и сведочанства нашега не примате» (Ин.3:11).'
        cn: 尼哥德慕不明白这事，这不足为奇，因为这一切「必须用属灵的眼光去审察」（哥林多前书 2:14），尽管旧约中已借着圣先知启示了此事，而这位「以色列的教师」尼哥德慕本应知道。这不仅对耶稣是显而易见的真理和事实，对圣先知们也是如此，他们是基于个人经验、亲身所见和圣灵的指示来谈论属灵真理的。因此，救主以祂自己的名义并以祂（父）的名义谈论此事：「我实实在在地告诉你，我们所说的，是我们知道的；我们所见证的，是我们见过的，你们却不领受我们的见证」（约翰福音 3:11）。
    - type: paragraph
      text:
        ru: 'Свети Златоуст благовести: Спаситељ говори: «Ако се ко не роди одозго» (сг. 3) и не добије тачно познање о предметима вере, лутаће далеко ван царства небеског. Под царством небеским Господ Исус разуме овде себе сама; показује да је Он не само оно што они виде у Њему, већ да су им потребне и друге очи да би они видели у Њему Месију = Христа.'
        cn: 圣金口约翰宣讲：救主说：「人若不重生」（约翰福音 3:3），并且不获得关于信仰事物的精确知识，就必漂离天国甚远。在这里，主耶稣以天国指代祂自己；祂表明祂不只是他们所看见的祂，而是他们还需要其他的眼睛，好使他们能在祂里面看见弥赛亚，即基督。
    - type: paragraph
      text:
        ru: Не треба Биће безгранично потчињавати слабим умовима људским. Знајући то, немојмо својим умом испитивати Божанске тајне, нити их подводити под ток обичних ствари и подчињавати их законима природе, него примајмо и са вером што је речено у Светом Писму.
        cn: 不应当将无限的存有屈从于人类软弱的心智。深知此理，我们不要用自己的心智查究神圣的奥秘，也不要将它们归入寻常事物的范畴，使它们顺从自然法则，而是当以信心领受圣经中所言说的一切。
    - type: paragraph
      text:
        ru: Ништа не производи толико мрака, колико ум људски који о свему расућује по земаљски и не прима просветљење одозго. Земне помисли садрже у себи много нечистоте. Зато су нам и потребна небеска просветљења да униште блато духа нашег, и он узнесен горе прими небеско учење. А то може бити онда када ми покажемо у себи и душу добромислећу и живот прави, јер душа предана страстима не може постигнути ништа велико и благородно.[13]
        cn: 没有什么能比人的心智产生更多的黑暗，如果它以属世的方式思考万事，并且不接受来自上方的启迪。属世的思想自身包含许多不洁。因此，我们也需要天上的启迪来消除我们灵魂的污秽，并且当它被提升到上方时，能够接受天上的教导。而这只有在我们自身展现出一个思想纯正的灵魂和正直的生活时才能实现，因为一个沉溺于情欲的灵魂无法成就任何伟大和高尚的事物。[13]
    - type: paragraph
      text:
        ru: «Када вам казах оно што је земаљско па не вјерујете, како ћете вјеровати ако вам кажем оно што је небеско? И нико се није попео на небо осим Онај Који сиђе с неба, Син Човјечији Који је на небу.» (Ин.3:12–13)
        cn: «我 对 你 们 说 地 上 的 事 ， 你 们 尚 且 不 信 ， 若 说 天 上 的 事 ， 如 何 能 信 呢 ？ 除 了 从 天 降 下 仍 旧 在 天 的 人 子 ， 没 有 人 升 过 天 。» (约翰福音 3:12-13)
    - type: paragraph
      text:
        ru: 'Све довде речено Спас назива земаљским, тојест све то још није она највећа и најтајанственија тајна коју Богочовек Исус Собом доноси и има да објави: поновно рођење «од воде и Духа» и све што је са тим у вези збива се на земљи и «земаљско» је.'
        cn: 迄今所言，救主称之为属地的，也就是说，所有这一切还不是那最大、最奥秘的秘密，即神人耶稣亲自带来并即将揭示的：「从水和圣灵而生」的重生，以及与此相关的一切都发生在地上，并且是「属地的」。
    - type: paragraph
      text:
        ru: Али, када се Богочовек буде телом узнео на небо, када тело човечије буде показао васкрслим, бесмртним, духовним, вечним, како ће онда веровати у то, у то – што је по свему и свачему толико невероватно, јер су тела људска смртна, сва смртна. То је оно «небеско» што Богочовек, има да открије овету својим Еванђељем. То је врхунац Богочовечанског домосгроја спасења света; то завршно откриће последње тајне.
        cn: 但是，当神人以肉身升天，将人的身体显为复活的、不朽的、属灵的、永恒的之时，人们又如何能相信那，相信那从各方面看都如此不可思议之事，因为人的身体是必死的，完全是必死的呢？那就是神人要以祂的福音向世界揭示的「属天之事」。这是神人拯救世界之经纶的顶峰；这是最终奥秘的最终启示。
    - type: paragraph
      text:
        ru: '«Небеско» је и све оно што је уследило за вазнесењем Богочовековим на небо: Силазак Светога Духа на Апостоле, на Цркву, и сва делатност њихова и њихових наследника у свету. То је све у истини «небеско», и веродостојно само за оне који су рођени «одозго» с неба. Уствари, све је у Цркви «небеско» и «земаљско» уколико се све у Цркви држи истинитим телом Богочовека Христа, и уколико се у њој спасава и тело, вештаство, материја. У истини: «Нико се не попе на небо од људи», осим Богочовека «који сиђе с неба» (Ин.3:13), и као Бог узнесе тело у божанску беомртност и вечност.'
        cn: «那『属天的』»也包括神人升天之后所发生的一切：圣灵降临于使徒和教会，以及他们和他们的继承人在世上的一切活动。这一切在真理中都是«属天的»，并且只对那些从天上«从上头»而生的人是可信的。实际上，教会中的一切既是«属天的»也是«属地的»，只要教会中的一切都持守着神人基督的真实身体，并且在其中，身体、本质、物质也得到拯救。在真理中：「没有人升过天」，除了那「从天上降下来的神人」（约翰福音 3:13），并且祂作为神，将身体提升至神圣的不朽和永恒之中。
    - type: paragraph
      text:
        ru: Тек у лицу вазнесеног Богочовека човек је стварно први пут узшиао на. небо, и остао на небу. И тек тада тиме показао да је «и тело за Господа» (1Кор.6:13), за његову бесмртност и вечност, и да је човек заиста небеско биће, а само привремено земаљско. Тиме је откривена целокупна тајна човекова бића.
        cn: 唯独在升天的神人位格中，人才是真正第一次升上天堂，并留在了天堂。也唯独那时，借此表明「身体是为了主」（哥林多前书 6:13），为了祂的不朽与永恒；并表明人确实是属天的存有，而仅仅是暂时属地的。借此，人的存有之全部奥秘便得以揭示了。
    - type: paragraph
      text:
        ru: «И као што Мојсеј подиже змију у пустињи, тако треба да се подигне Син Човјечији. Да сваки који верује у Њега не погине, него да има живот вјечни.» (Ин.3:14–15)
        cn: 「正如摩西在旷野里举起蛇，照样，人子也必须被举起来，使凡信祂的，不致灭亡，反得永生。」(约翰福音 3:14-15)
    - type: paragraph
      text:
        ru: 'Змија – уводитељ греха и смрти у човечански свет; она – нешто најодвратније за људско сазнање и осећање. Но сила Божја и човекољубље Божје и сам лик змије претвара у средство спасења; тако било у пустињи: ко с вером погледао у змију бакарну, спасавао се смрти.'
        cn: 蛇——罪和死亡进入人类世界的引入者；它——在人的认知和感受中，是最可憎恶的存在。然而，上帝的权能和仁爱，甚至将蛇的形象本身转化为救赎的工具；昔日在旷野便是如此：凡是怀着信心仰望铜蛇的，就从死亡中得了救赎。
    - type: paragraph
      text:
        ru: 'Значи: вера нешто заиста надљудско: спасава оним чиме човек убијен, и усмрћеи и умртаљен. Тако и Господ Христос: спасава оним чиме су људи хтели да га убију и за навек осрамоте: Крстом. Зато Спас о томе овоме подизању на крст говори као о нечем што «треба» да буде. Ради чега? «Да ниједан који верује у њега не погине, него да има живот вечни» (Ин.3:15). Вера у крст, – то је подвиг за људско сазнање и осећање, зато спасава и даје живот вечни. И то стога што ће се крст, то оруђе срама и злочинства, због распећа на њему Богочовека Христа, претворити у оруђе вечне славе и вечнога живота.'
        cn: 这意味着：信仰是真正超乎人性的：它藉着那使人被杀害、被处死、被致死的东西来拯救。照样，主基督也是如此：祂藉着人们想要杀害祂并永远羞辱祂的东西来拯救：借着十字架。因此，救主谈及这次被高举于十字架，称之为「必要」之事。为何如此？「叫一切信祂的，不至灭亡，反得永生」（约翰福音 3:15）。相信十字架，——这是对人类认知和情感的属灵挣扎，因此它拯救并赐予永生。这也是因为十字架，那羞辱和罪行的工具，因着上帝——道成肉身者基督在其上的受难，将转变为永恒荣耀和永恒生命的工具。
    - type: paragraph
      text:
        ru: «Сваки који верује» у Распетог Богочовека, као у Победитеља смрти васкрсењем, «има вечни живот». Људско биће гине (ван вере и крста, ван Богочовека, јер је ван Њега – царство греха и смрти, а грех убија људско биће, умртвљује га за оно што је вечно, што је Божје, и тако још на земљи врлинама еваиђелским стиче и има живот вечни.
        cn: «凡相信»被钉十字架的神人，视祂为借由复活战胜死亡的得胜者的人，«就拥有永恒的生命»。人类灭亡（脱离了信仰与十字架，脱离了神人，因为在祂之外——是罪与死亡的国度，而罪恶会杀死人类，使其对永恒的、属神的事物变得死寂，而这样，人甚至在地上，借由福音的德行，就能获得并拥有永恒的生命。）
    - type: paragraph
      text:
        ru: 'Откуда та сила Крсту? Од све љубави Божје у њему: јер у крсиој смрти Боточовековој врхуни божанска љубав према роду људском: смрћу спасти од смрти, сав ући у њу, у њене страхоте, у агонију, у ропац њен, са човеком и ради човека, и сиих људи, осетити и доживети до краја све њене страхоте, и из свега тога изаћи васкрсењем као победитељ, и са Собом изнети род људски, – ето, то је заиста љубав, заиста свељубав Божја лрема роду људском уопшге, и према сваком људском бићу посебно.'
        cn: 十字架的力量从何而来？从它里面所蕴含的上帝的一切爱而来：因为在神人受难的死中，上帝对人类的爱达到了顶峰：以死救死，完全进入死亡，进入其恐怖、其痛苦、其垂死挣扎，与人同在，并为人、为所有的人，彻底感受并经历其一切恐怖，并从这一切中，以复活者的身份凯旋而出，与祂一同带出人类——看哪，这才是真正的爱，真是上帝对人类整体，以及对每一个人类个体，全备的爱。
    - type: paragraph
      text:
        ru: 'А и све што је у Богочовековом животу претходило крсту – спасоносно је, јер је од Спаситеља, а све што је од Спаситеља – спасава. Свељубав од Бога, вера од човека, – ето пгга спасава и даје живот вечни човеку. Или: човекољубље Божје и богољубље човеково, – ето шта спасава чоовека од сваке смрти и сваког греха и даје му живот вечни.'
        cn: 并且，在神-人的生命中，所有先于十字架的，都是带来救恩的，因为它们来自救主；而所有来自救主的一切，都能拯救。神的全然之爱，人的信心——这便是拯救并赐予人永生的。或者说：神对人的爱和人对神的爱——这就是将人从一切死亡和一切罪恶中拯救出来，并赐予人永生的。
    - type: paragraph
      text:
        ru: «Јер Бог тако завоље свијет да је Син Својега Јединороднога дао, да свакки који вјерује у Њега не погине, него да има живот вјечни.Јер не посла Бог Сина Својега на свијет да суди свијету, него да се свијет спасе кроз Њега.» (Ин.3:16–17)
        cn: 「神爱世人，甚至将他的独生子赐给他们，叫一切信他的不至灭亡，反得永生。因为神差他的儿子降世，不是要定世人的罪，乃是要叫世人因他得救。」 (约翰福音 3:16-17)
    - type: paragraph
      text:
        ru: 'То нам казују речи Спасове: «Јер Богу тако омиле свет да и Сина свог Јединородног даде, да ниједан који у Њега верује не погине, него да има живот вечни» (Ин.3:16). Овим Еванђелист као да објашњава претходни стих: крст је примио Син Божји не зато што је морао него из човекољубља. Јер да није тог безмерног човекољубља Божјег, зар би Син Божји дошао у земаљски свет смрти да смрћу својом спасава свет од смрти? Не, Он би дошао као Судија, и то праведни, да суди и осуди свет због страшног греха његовог и смрти његове, због безбројмих грехова његових и безбројних смрти његових.'
        cn: 救主的这些话告诉我们：「神爱世人，甚至将祂的独生子赐给他们，叫一切信祂的，不至灭亡，反得永生。」(约翰福音 3:16)。借此，福音书作者似乎在解释前一节经文：神的儿子领受了十字架，并非出于被迫，而是出于祂的爱世人。因为若没有神那无限的爱世人，神的儿子怎会来到这充满死亡的世间，以祂的死来拯救世界脱离死亡呢？不，祂会作为审判者而来，而且是公义的审判者，来审判并定世界的罪，因其可怕的罪恶与死亡，因其无数的罪恶和无数的死亡。
    - type: paragraph
      text:
        ru: 'Међутим Он је дошао «да се свет спасе Њиме (кроза Њ)» (ет. 17), спасе у Богочовечанском телу Његовом које је Црква: спасава се сав свет пролазећи кроз Њега, живећи у Њему, остајући у Њему; јер осгаје у Безгрешноме, који једини спасава од греха, осгаје у Бесмртноме, који једини спасава од смрти. Сваки човек који остане изван Њега, остаје у греху и смрти, и зато гине. Само је Он очишћење од грехова људских, очистилиште. Човек се спасава ако свим бићем кроз веру уђе у Њега, остане у Њега, живи у Њему. Истинита је благовест Спасова: «Ја сам врата, ко уђе кроза Ме спасће се» (Ин.10:9).'
        cn: 然而祂来了，「为要叫世人因祂得救（借着祂）」（эт. 17），在祂的神人一体的身体中得救，这身体就是教会：全世界借着祂，在祂里面生活，在祂里面常存，从而得救；因为他常存于那无罪者之中，唯有祂能将人从罪中拯救；他常存于那不死者之中，唯有祂能将人从死亡中拯救。任何一个在祂之外的人，仍在罪和死亡之中，因此灭亡。唯有祂是除去人类罪恶的洁净，是洁净之源。人若以其全部的生命，借着信心进入祂、常存与祂、在祂里面生活，便可得救。救主的福音是真实的：「我就是门，凡从我进来的，必然得救」（约翰福音 10:9）。
    - type: paragraph
      text:
        ru: Спасење је Спаситељем; спасење је у Спаситељу; мора се бити у Њему и живети Њиме, да би се човек спасао од греха, смрти и ђавола. Другог пута нема. Зато «нема ни у једноме другоме спасења»; зато и «нема другога Имена под небом данога људима којим би се могли спасги» (Деян.4:11–12).
        cn: 救赎是藉着救主；救赎是在救主里；人必须在祂里面并靠祂而活，才能从罪、死亡和魔鬼中得救。没有别的道路。所以，「除祂以外，别无拯救」；所以，「在天下人间没有赐下别的名，我们可以靠着得救」（使徒行传 4:11-12）。
    - type: paragraph
      text:
        ru: 'Свети Златоуст благовести: Два највећа добра: крсно Распеће Спасово н Света Тајна Крштења показују боље од свега неисказану љубав Господа Христа за род људски: Он је и пострадао за непријатеље и умро за непријатеље и у Крштењу иам даровао потпуни опроштај грехова. Но да не би ко рекао, како се могу спасти они који верују у Распетога када је и Он сам био савладан смрћу, Он нам наводи пример из старе историје: бакарну змију.'
        cn: 圣金口若望宣讲：两项至高的美善，即救主的十字架受难和圣洗圣事，比一切更能彰显主基督对人类无可言喻的爱：祂既为仇敌受难，也为仇敌而死，并在洗礼中赐予了我们罪愆的完全赦免。然而，为免有人说，那些相信被钉在十字架上的主的人，当祂自己也曾被死亡所胜时，如何能得救呢？祂便引用了古老历史中的一个例子：铜蛇。
    - type: paragraph
      text:
        ru: 'Када су се Јевреји у пустињи спасавали од смрти погледом иа бакарну змију, утолико пре могу добити огромно добро они који верују у Распетога. Распеће се збило не по немоћи Распетога, и не по томе што су Јевреји однели победу над Њим, већ што «Бог заволе свет» (Ин.3:16). Разлог због кога је телесни храм Спасов подвргнут распећу јесте: да ниједан који верује у њега не погине, него да има живот вечни» (сг. 15). Ето шта је крст и спасење које Он даје. Видиш ли подударност између праслике и стварности? У пустињи се Јевреји спасавају само од привремене смрти; а овде који верују – од вечне смрти.'
        cn: 当犹太人在旷野因仰望铜蛇而得免死亡时，那些信靠被钉十字架者的人，就更能够获得巨大的益处。钉十字架之事并非出于被钉者的软弱，也非因犹太人战胜了他，而是因为「神爱世人」（约翰福音 3:16）。救主肉身殿宇被钉十字架的原因是：「叫一切信他的不至灭亡，反得永生」（约翰福音 3:15）。这就是十字架以及祂所赐的救恩。你是否看到预象和真实之间的相似之处？在旷野中，犹太人仅仅得免暂时的死亡；而在此处，信者则得免永远的死亡。
    - type: paragraph
      text:
        ru: 'Тамо окачена змија исцељује од уједа змија; овде Распети Исус лечи од уједа духовне змије. Тамо који гледа телесним очима добија исцељење; овде који гледа душевним очима ослобађа се од свих грехова. Тамо је окачен бакар који има обличје змије; овде – тело Господа, образовано Духом Светим. Тамо је змија уједала, змија и лечила; тако и овде: смрт је погубила, смрт и спасла. Али змија, која је погубљивала имала је отров, а која је спасавала није имала отрова; тако и овде: смрт која је погубила имала је грех, као змија отров, а смрт Господа била је слободна од свакога греха, као бакарна змија – од отрова. Речено је за Господа: «Он греха не учини, нити се превара нађе у устима Његовим» (1Пет. 2:22).[14]'
        cn: 那里悬挂的蛇医治了被蛇咬伤的人；这里被钉十字架的耶稣医治了被属灵的蛇咬伤的人。那里凡用肉眼注视的，就获得医治；这里凡用心灵的眼睛注视的，就得以摆脱所有的罪。那里悬挂着具有蛇形状的铜；这里——是主的身体，由圣灵所形成。那里是蛇咬伤了人，也是蛇医治了人；这里也是如此：是死亡带来了败坏，也是死亡带来了拯救。但带来败坏的蛇带着毒，而带来拯救的蛇没有毒；这里也是如此：带来败坏的死亡带着罪，就像蛇带着毒一样；而主的死亡是全然自由，没有丝毫罪的，就像铜蛇没有毒一样。论到主，经上说：「他没有犯过罪，口里也没有诡诈」（彼得前书 2:22）。[14]
    - type: paragraph
      text:
        ru: «Који у Њега вјерује не суди му се, а који не вјерује већ је осуђен, јер није вјеровао у Име Јединороднога Сина Божијега. А ово је суд што је свјетлост дошла на свијет, а људи више заволеше таму неголи свјетлост; јер њихова дела бијаху зла.» (Ин.3:18–19)
        cn: 凡信祂的，不被定罪；那不信的，已经被定罪了，因为他没有信神的独生子的名。审判就是：光已经来到世上，而人们爱黑暗甚于爱光；因为他们的行为是邪恶的。（约翰福音 3:18-19）
    - type: paragraph
      text:
        ru: Љубав, не суд, – то је сав Богочовек. Ту је и суд, али не суд којим Бог суди човека, већ суд којим сам човек суди себи. И то суди побућен Христовом љубављу, Христовим човекољубљем. Јер шта је вера човекова у Господа Исуса, кроткога, благога и многострадалнога Спаситеља? Нипгга друго него човекова осуда својих грехова, своје палости и пропалости, своје смрти и смртности. Поверује ли човек у Богочовека, поверовао је зато и тиме што је осудио своје грехе и своју погибао, и помоћу Њега и Његове љубави спасава себе од греха и погибли.
        cn: 爱，而非审判——这就是完完全全的神人。其中也有审判，但并非是神审判人的审判，而是人自己审判自己的审判。而且这审判是被基督的爱、基督的仁爱所激发而做出的。因为人对主耶稣，这位温柔、良善并多受苦难的救主所怀的信心，又是什么呢？无非就是人对自己罪恶、自己的堕落与沉沦、自己的死亡与必死性的一种谴责。人若相信神人，他之所以相信，也正是因为他谴责了自己的罪恶和自己的灭亡，并且借着祂和祂的爱，将自己从罪恶和灭亡中拯救出来。
    - type: paragraph
      text:
        ru: 'Ко пак не верује у Богочовека, већ је осудио себе на смрт, осудио грехом и грехољубљем који увек воде у смрт, а тиме осудио себе и на пакао где је вечно царство греха и смрти. Тако је човек сам себи страшни и коначии судија: или вером у Богочовека стиче живот вечни, или неверјем у Њега осуђује себе на вечне муке. То значе Спасове речи: «Који верује у њега не суди му се; а који не верује већ је осућен, јер не верова у Име Јединороднога Сина Божјега» (Ин.3:18).'
        cn: 凡不信奉神人者，就已判定自己死罪，因罪和恋罪而被判，这总是导向死亡的；如此也判定自己下地狱，那里是罪和死亡的永恒国度。如此，人自己就是自身可畏的终极审判者：或因信奉神人而获得永生，或因不信祂而判定自己受永恒的折磨。这就是救主的话语所要表达的含义：「信他的人，不被定罪；不信的人，罪已经定了，因为他不信神独生子的名。」（约翰福音 3:18）
    - type: paragraph
      text:
        ru: 'Јер Бог Логос = Светлост, дошавши на свет осветљава до дна свако људоко биће, ове његове тмине и дубине, и сваки човек може у светлости Богочовека видети свега себе: све грехе своје, све смрти своје, и у њима и иза њих и сав пакао свој.'
        cn: 因为神，道（逻各斯）即是光，祂降世后，彻彻底底地光照每一个人的存有，他（人）的这些幽暗和深邃之处，每一个个体都能在神人（道成肉身者）的光中，看清自己的全貌：自己所有的罪，自己所有的死亡，以及在它们之中、超越它们和自己所有的地狱。
    - type: paragraph
      text:
        ru: А када људи и поред тога, и пошто сагледају сву палост и пропалосг своју, одбацују Богочовека и остају при својим гресима, одбацују Његову светлост и тиме сами остају при својој тами, онда су сами криви и за своју смрт и за свој пакао, јер су већма волели таму него светлост, смрт него бесмртност, пакао него рај.
        cn: 然而，当人们尽管如此，并且在他们认识到自己所有的堕落与败坏之后，却拒绝了神人，并固守于自己的罪恶中，拒绝了祂的光明，并因此让自己停留在自己的黑暗中，那么他们自己就应为自己的死亡和自己的地狱负责，因为他们更爱黑暗胜于光明，爱死亡胜于不朽，爱地狱胜于天堂。
    - type: paragraph
      text:
        ru: 'То јасно благовести Спас: «Ово је суд: светлост доће на свет, и људи заволеше већма таму него ли светлост, јер дела њихова беху зла» (Ин.3:19).'
        cn: 救主清楚地宣告说：「这就是审判：光临到世上，世人爱黑暗甚于爱光，因为他们的行为是邪恶的。」（约翰福音 3:19）
    - type: paragraph
      text:
        ru: «Јер сваки који чини зло мрзи свјетлост и не иде ка свјетлости, да се не разоткрију дела његова, јер су зла.» (Ин.3:20)
        cn: 「因为凡作恶的，都恨恶光明，并不来到光明，免得他的行为暴露，因为是恶的。」（约翰福音 3:20）
    - type: paragraph
      text:
        ru: 'Који год зло чини себи чини, јер њиме одређује своју вечну судбу, њиме осуђује себе на вечну смрт, на вечни живот у греху и злу. У ствари, нико другоме не може учинити зла, макар му и убио тело, јер само грех убија душу у човеку, и баца је у пакао. Значи: само грех и јесте зло; само грех и јесте «човекоубица од искони» (Ин.8:44).'
        cn: 任何作恶的人都是在对自己作恶，因为他以此决定自己的永恒命运，以此将自己定罪于永恒的死亡，定罪于在罪恶与邪恶中的永恒生命。事实上，没有人能对他人作恶，即便他杀害了他的身体，因为唯有罪才能杀死人的灵魂，并将其投入地狱。这意味着：唯有罪才是邪恶；唯有罪才是「从起初就杀人的」（约翰福音 8:44）。
    - type: paragraph
      text:
        ru: Грех пак човек чиии из сластољубља, из грехољубља. А греховне сласти вуку и маме човека из греха у грех, из смрти у смрт, из пакла у пакао (Иак.1:14–15). Кроз сваки овој грех човек повећаиа у себи грехољубље, јер се оно грехом храни, јача и расге. А грехољубив увек мрзи све оно што му спречава и онемогућава греховне страсти. Грех мрзи врлину; зло мрзи добро; тама мрзи светлост. Отуда грехољубиви људи не трпе Господа Исуса; често неће ни да чују за Њега; и увек Га гоне, тајно или јавно.
        cn: 然而，人犯下罪恶，是出于贪恋享乐，出于爱罪。而罪恶的享乐将人从罪引向罪，从死亡引向死亡，从地狱引向地狱（雅各书 1:14-15）。通过每一次这样的罪，人就在自己里面增加了爱罪之心，因为它以罪为食，得以增强并增长。而爱罪之人总是憎恨一切阻止并妨碍他罪恶情欲的事物。罪憎恨美德；邪恶憎恨良善；黑暗憎恨光明。因此，爱罪之人无法忍受主耶稣；常常甚至不愿听闻祂；并总是或暗中或公开地迫害祂。
    - type: paragraph
      text:
        ru: 'За сва времена истинита је реч Спасова: «Сваки који зло чини мрзи светлост и не иде к светлости да се не открију дела његова, јер су зла» (Ин.3:20). Све док «зло чини», док је «злочинитељ», човек мрзи светлост, мрзи Бога, не иде к Богу, бежи од Њега кроз свако своје зло; јер свако учињено зло – удаљује од Бога; велико зло – удаљује га много – а највеће – највише.'
        cn: 历世历代救主的圣言都是真实的：「凡作恶的，恨恶光，也不来就光，恐怕他的行为被显明，因为他的行为是恶的」（约翰福音 3:20）。只要人「作恶」，只要他是「作恶者」，他就恨恶光，恨恶上帝，不来就上帝，借着他所行的每一件恶事逃离祂；因为每一件所行的恶事，都使人远离上帝；大的恶事，使他远离更多；而最大的恶事，则使他远离最多。
    - type: paragraph
      text:
        ru: Отуда правило; рђави људи не верују у Бога, мрзе Бога. Ако по каткад и не изгледају рђави, јер – или се тајно у себи боре против зла или зло још није потпуно овладало њиховим срцем и сазнањем, али и у том стадијуму они су добровољни кандидати за рђаве људе, за зле људе, богоборце и ботомрзитеље.
        cn: 由此而来有一条规则：邪恶的人不信上帝，憎恨上帝。如果他们有时看起来并不邪恶，那是因为——他们要么在内心秘密地与邪恶争战，要么邪恶尚未完全掌控他们的心智和认知，但即使在那个阶段，他们也是邪恶的人、恶人、与上帝为敌者和憎恨上帝者的自愿候选人。
    - type: paragraph
      text:
        ru: «А ко истину твори, иде ка свјетлости, да се виде дјела његова, јер су у Богу учињена.» (Ин.3:21)
        cn: 但行真理的，必来就光，叫他行为显明，因为是靠神而行。(约翰福音 3:21)
    - type: paragraph
      text:
        ru: 'Јер је речено: «Сваки који зло чини», сваки без изузетка, «мрзи светлост и не иде к светлости да се не открију дела његова, јер су зла» (Ин.3:20). Насупрот злу, које одводи од Бога стоји истина која приводи Богу.'
        cn: 因为经上说：「凡作恶的，无一例外地，都恨恶光明，也不就光明，免得他的行为被显明出来，因为他的行为是邪恶的。」(约翰福音 3:20) 与那使人远离上帝的恶相对的，是那使人归向上帝的真理。
    - type: paragraph
      text:
        ru: То бива када човек «чини истину», твори истину, живи њоме, а не посматра је из далека као неку теорему, као неку логичку схему, као неки апстрактни логични појам. Истина се живи, доживљује, и само тако, и само тада постаје жива сила у човеку која га ослобађа зла и одводи Богу. По Спасовом Еванђељу истина је врлина која се твори, чини; «који чини истину» (Ин.3:21).
        cn: 唯有当一个人「实行真理」、活出真理、以真理为生，而不是从远处将其视为某个定理、某个逻辑图式、某个抽象的逻辑概念时，这才会发生。真理是被活出、被体验的；并且唯有如此，唯有在那时，真理才能成为人里面活泼的动力，使人脱离邪恶，并引向上帝。依照救主之福音，真理是某种被实行、被活出的美德；「行真理的」（约翰福音 3:21）。
    - type: paragraph
      text:
        ru: 'Као што сваки сунчев зрак води сунцу, тако и свака остварена еванђелска истина одводи Господу Христу, Који је оличење и вечност свих еванђелских истина, јер је Сам Спаситељ објавио ту чудесну благовест: «Ја сам Истина» (Ин.14:6). А када се та Истина преведе у речи добија се Христово Еванђеље. Онда ове речи Спасове: «чини Истину» значе испуњује Еванћеље.'
        cn: 正如每一道阳光都引向太阳，照样，每一个被实践的福音真理都引向主基督，祂是所有福音真理的化身和永恒，因为救主亲自宣告了这奇妙的福音：「我就是真理」（约翰福音 14:6）。而当那真理被翻译成言语时，便形成了基督的福音。那么，救主的这些话语：「行真理」意即实现福音。
    - type: paragraph
      text:
        ru: 'Свака испуњена еванђелска заповест и јесте «учињена» божанска истина која одводи самој Свеистини: Господу и Богу Исусу Христу. Свака доживљена еванђелска истина орођује човека са Богом, потапа га у светлост Божју. И човек истином поотаје светлост. Он творећи истину светли, јер оу истина и светлост у Богу једно, као што су зло и тама у ћаволу једно, а и у човеку једно.'
        cn: 每一个得到遵行的福音诫命，就是一种「被践行的」神圣真理，它引领人归向全然真理本身：主、神耶稣基督。每一个被亲身经历的福音真理，都使人与神建立亲缘，将他浸没在神的光中。并且人藉着真理成为光。他践行真理，便发出光芒，因为真理与光在神里面是合一的，正如邪恶与黑暗在魔鬼里面是合一的，并且在人里面也是合一的。
    - type: paragraph
      text:
        ru: 'Ако си далеко од Бога «твори» истину, и она ће те приближити Богу, Који је сав Истина и Свеистина. «Ко твори истину» воли Бога и све што је Божје, и живи и дела Богом и у Богу. Кроз творење истине човек «иде к светлости», путује к светлости: Богу; свим бићем својим он стално кроз истину путује Богу, Који је вечна Истина, бескрајна са сваке стране. Не твори ли истину, човек остаје у тами, не миче се из ње, јер му недостаје силе која вуче к светлости, која «иде к светлости».'
        cn: 如果你远离上帝，就当「行」真理，它就会使你亲近上帝，祂是全然的真理和全真理。「行真理的人」爱上帝，爱一切属上帝的，并且靠上帝、在上帝里面生活和行动。借着实行真理，人就「走向光明」，走向光明，也就是上帝；他以他全部的存在，借着真理不断地走向上帝，祂是永恒的真理，从各方面来说都是无限的。如果不行真理，人就留在黑暗中，无法从中挪动，因为他缺少那牵引他走向光明、那「走向光明」的力量。
    - type: paragraph
      text:
        ru: 'А када човек загледа у дела своја учињена еванђелском истином и ради еванђелске истине он види да су «у Богу учињена», Богам учињена. То значе Спасове речи: «А ко истину твори иде к светлости да се виде дела његова, јер су у Богу учињена» (Ин.3:21).'
        cn: 而当一个人审视自己藉着福音真理并为了福音真理所成就的行为时，他会看到这些行为是「在上帝里做成的」，是由上帝所成就的。这正是救主的话语的意义：「凡实行真理的，就走向光明，好使他的行为显明出来，因为这些行为是在上帝里做成的」（约翰福音 3:21）。
    - type: paragraph
      text:
        ru: Последње сведочанство св. Јована Крститеља о месији – Исусу
        cn: 圣施洗者约翰关于弥赛亚——耶稣的最后见证
    - type: paragraph
      text:
        ru: '«Потом дође Исус и ученици Његови у јудејску земљу, и ту борављаше с њима и крштаваше. А и Јован крштаваше у Енону близу Салима, јер ондје бјеше много воде; и долажаху те се крштаваху. Јер још не бијаше Јован бачен у тамницу. Тада настаде распра међу ученицима Јовановим и неким Јудејцем око очишћења. И дођоше Јовану и рекоше му: Рави, онај што бјеше с тобом преко Јордана, за кога си ти свједочио, ено крштава, и сви иду Њему. Јован одговори и рече: не може човјек ништа примати ако му не буде дано с неба.» (Ин.3:22–27)'
        cn: «随后，耶稣和他的门徒到了犹太地，在那里同他们住下，并且施洗。约翰也在靠近撒冷的艾嫩施洗，因为那里水多；众人都来受洗。那时约翰还没有被下在监里。约翰的门徒与一个犹太人发生了一场洁净礼的争论。他们就来到约翰那里，对他说：「拉比，那与你一同在约旦河外、你所见证的那位，看哪，他也施洗，众人都往他那里去了。」约翰回答说：「人若不是从天上蒙赐，就不能得什么。」» (约翰福音 3:22-27)
    - type: paragraph
      text:
        ru: 'Велики Претеча, први сведок о Богочовеку и први Апостол Његов, мора да брани Господа Исуса од слабосги својих ученика. Њих збуњује и онерасположује, и у завист доводи што Исус крштава. И они са болом говоре своме учитељу: «Рави, сви иду к Њему» (Ин.3:26), а тебе и нас са тобом, већ напуштају.'
        cn: 伟大的先驱，那位神人的第一个见证人，也是他第一个使徒，必须捍卫主耶稣，抵御他门徒的软弱。耶稣的施洗令他们困惑、沮丧，并心生嫉妒。他们痛苦地对他们的老师说：「拉比，所有人都到他那里去了（约翰福音 3:26），而他们已经离开了你，以及与你同在的我们。」
    - type: paragraph
      text:
        ru: 'А рави гледа Исуса и Његова дела с неба, са висине Његове божанске мисије у свету: Не може човек, такав човек као што је Исус, узимати на себе нешто ако му не буде дано с неба. Он је сав с неба, и посао који врши – сав је с неба.'
        cn: 而那位拉比从天上，从祂在世上神圣使命的高度，观看耶稣和祂的作为：若非从天上赐予他，人就不能为自己取什么，像耶稣这样的人也不能。祂完全是从天上来的，祂所做的工作——也完全是从天上来的。
    - type: paragraph
      text:
        ru: '«Ви ми сами свједочите да рекох: Нисам ја Христос, него сам послан пред Њим. Ко има невјесту Женик је, а пријатељ Жеников стоји и слуша Га, и радошћу се радује гласу Женикову. Ова, дакле, радост моја испуњена је.» (Ин.3:28–29)'
        cn: «你们自己可以作证，我曾说：我不是基督，我是奉差遣在他前面的。娶新妇的，就是新郎；新郎的朋友站着听他，一听见新郎的声音，就甚喜乐。所以，我这喜乐满足了。» (约翰福音 3:28-29)
    - type: paragraph
      text:
        ru: 'Ја сам толико пута и пред вама сведочио за себе и за Њега: «ја нисам Христос, него сам послан пред њим» (Ин.3:28). Зар нисам сведочио да је Он – Син Божји, Христос = Месија? Моје је то, саамо то, да Њега покажем свету; и кад Њега покажем свету, Њега – Сунце, шта ће онда моје и ваше свећице? Ко пали свеће када сунце блиста на земљи? А сада још и хода по земљи. «Радост моја испуни се» (Ин.3:29): Месија је дошао, Он је ту, у свету, а ја сам само слуга његов. О! и каква радост: «пријатељ» Његов. Он је дошао у овај свет као небески Женик по Невесту; а Невеста је Црква којом ће Он спасавати људе од греха, смрти и ђавола. Ја сам пријагељ Његов који то објављује свету «који стоји и слуша га, и радошћу се радује гласу Женикову» (Ин.3:29). Он је тек почео своје огромно богочовечанско дело, које има да узрасте у све бескрајности божанске као ниједно дело људско на земљи.'
        cn: 我在你们面前，为自己也为祂，已经作了无数次见证：「我不是基督，而是奉差遣在祂前面」（约翰福音 3:28）。难道我没有见证过祂是神的儿子，基督 = 弥赛亚吗？我的职责就是，仅仅就是，向世人显明祂；当我把祂——这太阳——向世人显明后，我和你们的微弱烛光还有什么用呢？当太阳普照大地时，谁还会点燃蜡烛呢？而祂现在仍在世间行走。「我的喜乐满足了」（约翰福音 3:29）：弥赛亚已经来了，祂就在这里，在世上，而我只是祂的仆人。哦！这是何等的喜乐：成为祂的「朋友」。祂来到这个世界，如同天上的新郎来迎娶新妇；而新妇就是教会，祂将借着教会拯救人们脱离罪、死亡和魔鬼。我是祂的朋友，向世人宣告这一切，「站着听祂，因新郎的声音就甚喜乐」（约翰福音 3:29）。祂刚刚开始了祂那宏伟的、神人同工的工作，这工作必将成长，达到神圣的一切无限境界，是世上任何人类工作所无法比拟的。
    - type: paragraph
      text:
        ru: «Он треба да расте, а ја да се умањујем. Који одозго долази над свима је. Који је са земље од земље је, и од земље говори; а који долази с неба над свима је. И што је видио и чуо, то свједочи; и свједочанство Његово нико не прима.» (Ин.3:30–32)
        cn: 「他应该兴盛，我却应该衰微。那从天上来的，是在万有之上；那从地上来的，是属乎地的，他所说的，也是属乎地的；那从天上来的，是在万有之上。他将所见所闻的证出来；只是没有人领受他的见证。」 (约翰福音 3:30-32)
    - type: paragraph
      text:
        ru: 'Зато: «Он треба да расте, а ја да се умањујем» (Ин.3:30). Све што је људско треба да се смањује пред Њим, повлачи, смирава, у пепео претвара због свеопште греховности људске. Њега чини бескрајно великим и недосежним Његова безгрешност, а нас људе, све људе чини бескрајно малим наша грешност.'
        cn: 然而：「他必兴旺，我必衰微。」（约翰福音 3:30）所有属人的，都应在祂面前减少，退却，谦卑，并因人类普遍的罪性而化为尘土。是祂的无罪性使祂无限伟大且不可企及，而我们的罪性则使我们人类，所有人类，无限渺小。
    - type: paragraph
      text:
        ru: Нико од људи није велики пред Њим. То је сазнање и осећање «највећег између рођених од жена». Зашто? Зато шго је Он – сав с неба; а људи, сви су људи са земље и од земље. Све што је људско – заудара на земљу; све што је Христово – мирише на небо. Он долази «одозго», а људи – одоздо, од земље. «Који одозго долази над свима је; који је са земље од земље је, и од земље говори; који долази с неба над свима је» (Ин.3:31).
        cn: 在祂面前，没有一个人是伟大的。这是「凡妇人所生的，没有一个大过他」的（指施洗约翰）认知和感受。为什么呢？因为祂——完全是出于天；而世人，所有世人都是出于地，并属乎地。凡属人的，都带着属地的气味；凡属基督的，都散发着天堂的芬芳。祂「从上头」来，而世人——从下头来，从地上来。「那从天上来的，是在万有之上；那从地上来的，是属地的，他所说的也是属地的；那从天上来的，是在万有之上。」（约翰福音 3:31）
    - type: paragraph
      text:
        ru: 'Ко је са земље, мали су видици и његових мисли, и његових телесних очију, и његових речи. А Месија=Исус долази с неба, види сву земљу као зрно песка, и зна шта јој треба. Када говори Он у ствари: сведочи о ономе што види и што чује, што види својим божанским видом ишто чује својим божанским слухом: «и сведочанство Његово нико не прима» (Ин.3:32); нико од оних што су са земље и од земље.'
        cn: 凡属地的人，其思想、肉眼和言语的视野都非常狭窄。而弥赛亚=耶稣从天而来，视全地如一粒沙，并深知大地所需。当他说话时，他实际上是为他用神圣的视觉所见的，和他用他神圣的听觉所听见的作证：「他的见证没有人接受」（约翰福音 3:32）；没有一个属地和出于地的人接受。
    - type: paragraph
      text:
        ru: «Који прими свједочанство Његово, потврди да је Бог истинит.» (Ин.3:33)
        cn: 「那领受祂见证的，就证明神是真实的。」（约翰福音 3:33）
    - type: paragraph
      text:
        ru: Али то сведочанство примају они који се добровољно смањују пред Његовим божанским величансвтом који смерно признају своју људску сићушност и ништавност пред Њим – свевеликим Богом и Спаситељем.
        cn: 但那份见证，是那些甘愿在祂的神圣威严面前谦抑自己，谦卑地承认自己在祂——这位至高无上的上帝与救主——面前的渺小与虚无之人所领受的。
    - type: paragraph
      text:
        ru: 'И тиме потврђују да је Бог истинит: у свима обећањима и речима, и делима својим; нарочито у свима обећањима, речима и делима Христовим. Без Богочоввка=Месије, нити је Бог истинит, нити човек. Јер без Њега, како би Бог могао доказати људима да је Он: Истина, Љубав, Правда, Милост, Доброта, Бесмртност, Рај, Живот Вечни?'
        cn: 借此他们证实上帝是真实的：在他所有的应许、话语和作为中；尤其是在基督所有的应许、话语和作为中。没有道成肉身的神人=弥赛亚，上帝既不真实，人也不真实。因为没有他，上帝怎能向世人证明他就是：真理、爱、公义、怜悯、良善、不朽、天堂、永生呢？
    - type: paragraph
      text:
        ru: Без Богочовека Бог је тиранија, а човек – сићушна играчка њена.
        cn: 若无神人，神即暴政，而人——乃其渺小的玩物。
    - type: paragraph
      text:
        ru: '«Јер кога Бог посла, онај ријечи Божије говори: Јер Бог Духа не даје на мјеру.» (Ин.3:34)'
        cn: 「因为神所差遣的，就说神的话语：因为神赐予圣灵是没有限量的。」 (约翰福音 3:34)
    - type: paragraph
      text:
        ru: 'Људи «од земље», говоре, од земље»; Исус Богочовек – «речи Божје говори» (Ин.3:34), јер је послан од Бога. У таме је сва разлика између човечијег и Богочовечијег. Нема речи Христове која није Божја, и у њој – сав Бог, сав Дух Божји: «јер Бог Духа нг даје на меру» (Ин.3:34): «јер Бог Духа не даје на меру» најпре Њему – Исусу = Човеку = Богочовеку, а преко Њега и свима људима.'
        cn: 世人「属乎地」，他们所说的，「也是属乎地」；而耶稣这位神人——「说上帝的话语」（约翰福音 3:34），因为祂是由上帝所差遣的。人的和神人的之间，所有的区别就在于此。基督的言语没有一句不是属乎上帝的，在其中——是完全的上帝，完全的上帝的圣灵：「因为上帝赐圣灵，是没有限量的」（约翰福音 3:34）：祂「赐圣灵，是没有限量的」，首先是赐予祂——耶稣 = 人 = 神人，并通过祂赐予所有世人。
    - type: paragraph
      text:
        ru: Ништа Божје није остало што Бог није дао Богочовеку Исусу, ништа небеско, зато што је као Јединородни Син Божји у свему једнак са Богом Оцем у свему послушан Њему. Јер Очинском љубављу својом Отац Себе, све своје даје Сину, а Син Му исто тако свега Себе, све Своје узвраћа љубављу.
        cn: 凡属神之物，没有一样是上帝未曾赐给神人耶稣而留下来的；凡属天之物，没有一样是上帝未曾赐给祂而留下来的。因为祂作为上帝的独生子，在一切事上都与圣父上帝同等，在一切事上都顺服祂。因为藉着祂的父爱，父将祂自己，以及祂所有的一切，都赐予子；而子也同样地，将祂完全的自己，以及祂所有的一切，用爱回馈给父。
    - type: paragraph
      text:
        ru: «Јер Отац љуби Сина, и све је дао Њему у руку. Ко вјерује у Сина, има живот вјечни; а ако је непослушан Сину, неће видјети живота, него гњев Божији остаје на њему.» (Ин.3:35–36)
        cn: 「因为父爱子，已将万有交在他手里。信子的人有永生；不顺从子的人必不得见生命，神的震怒常在他身上。」 (约翰福音 3:35-36)
    - type: paragraph
      text:
        ru: «Јер Отац љуби Сина, и све даде у руке његове» (Ин.3:35). Даде Му као човеку у Богочовеку, као савршеном човеку.
        cn: 「因为父爱子，已将万有交在他手里」（约翰福音 3:35）。天父将这一切交予祂（圣子），是作为神人中的人，作为完美的人。
    - type: paragraph
      text:
        ru: 'Даде Му све: и небо и земљу, и човека и сав род људски, и спасење света и суд над светом. Зато што је Богочовек ималац свега Божјег, и што је Бог Син: што је људима донео, показао и дао сва савршвнсгва Божја, све дарове Божје: «Ко верује у Сина, има живот вечни», још овде на земљи има; «а ко не верује Сина, неће видети живота, него гњев Божји остаје на њему» (Ин.3:36).'
        cn: 祂将万有都赐予了祂：天与地，人与全人类，世界的救赎与世界的审判。因为这神人拥有一切属神之物，并且因为祂是神子：祂将一切属神的完全、一切属神的恩赐带给了人们，向人们展示并赐予了人们：「凡信子的，就有永生」，就在地上拥有了；「不信子的，必不得见永生，神的震怒常在他身上」（约翰福音 3:36）。
    - type: paragraph
      text:
        ru: 'Зашто неће видети живота? Зато што је сав, са свих страна опкољен и затворен смрћу, коју око њега и у њему луче греси, и претварају је у његову безпрозорну и бездверну тамницу. То значи: он се добровољно изједначио са грехом и злом, одбацио је све Божје; и на њему почива гњев Божји, јер је боголику слободу злоупотребио, и на грех употребио, не на божанско добро.'
        cn: 他为何看不见生命呢？因为他整个人，从四面八方都被死亡围困并囚禁，这死亡乃是罪恶在他周围和在他里面所滋生的，并将其转化成他那无窗无门的监狱。这意味着：他自愿与罪恶和邪恶等同，他抛弃了所有属于神的事物；神的震怒降在他身上，因为他滥用了那肖乎神的自由，并将其用于罪恶，而非神圣的良善。
    - type: paragraph
      text:
        ru: Нема живота где нема Бога и добра Божјег, где нема Богочовека, јер је ван Њега – све сам псевдоживот, назовиживот, фалсификат живота, смрт која себе проглашује за живот, сенке и сновиђења који лудују и себе у лудилу проглашавају за стварност и јаву.
        cn: 没有上帝与上帝的良善之处，没有神人之处，就没有生命；因为在祂之外，一切都是伪生命、假冒的生命、生命的赝品，是自称为生命的死亡，是狂乱作祟，并在狂乱中将自己宣称为真实和清醒的阴影和幻象。
    - type: paragraph
      text:
        ru: Стога, мртве душе су сви који у Христа не верују; они «неће видети живота», а камоли имати га.
        cn: 因此，所有不信基督的人都是死的灵魂；他们「不会看见生命」，更何况拥有生命。
  - type: heading2
    text:
      ru: Глава четврта. Господ Исус и жена самарјанка
      cn: 第四章. 主耶稣和撒玛利亚妇人
    children:
    - type: paragraph
      text:
        ru: «Када, дакле, сазнаде Господ да су фарисеји чули да Исус више ученика задобија и крштава него Јован – иако Сам Исус не крштаваше него ученици Његови – остави Јудеју и отиде опет у Галилеју. А ваљало Му је проћи кроз Самарију. Тако дође у град самаријски звани Сихем, близу села које даде Јаков Јосифу, сину својему. А ондје бјеше извор Јаковљев. Исус пак уморан од пута сјђаше тако на извору; бјеше око шестога часа.» (Ин.4:1–6)
        cn: 「当主知道法利赛人听见耶稣收的门徒，施洗的人，比约翰还多——虽然不是耶稣亲自施洗，乃是祂的门徒施洗——就离开了犹太，又往加利利去。祂必须经过撒马利亚。于是祂来到撒马利亚的一个城，名叫叙加，靠近雅各给祂儿子约瑟的那块地。在那里有雅各井。耶稣因走路困乏，就这样坐在井旁。那时约是午正。」 (约翰福音 4:1-6)
    - type: paragraph
      text:
        ru: 'Како је веродостојан сведок Свети Еванђелист Јован? Заиста је руководно начело његово при писању Еванћеља да бележи оно што види и што чује (1Ин.1:1). Ево, он види Исуса уморна, и пише: «Исус уморан од пута сећаше на извору» (Ин.4:6). – Шта говориш Јоване?'
        cn: '圣福音传道者约翰是一位多么可靠的见证人啊！确实，他撰写福音书的指导原则是记录他所见所闻的 (约翰一书 1:1)。看哪，他看到耶稣疲惫，便写道：「耶稣因行路疲乏，就坐在井旁」(约翰福音 4:6)。

          —约翰，你在说什么呢？'
    - type: paragraph
      text:
        ru: Зар уморан Исус чудотворац, Исус коме велики Претеча није достојан да одреши ремена на обући Његовој? Да, Он како Га видиш, такав и јесте. А да није такав, зар би био прави човек, зар би знао шта је у човеку и шта сачињава главну муку његову? Он то не скрива, чак ни од жене Самарјанке. Он јој изјављује да је жедан, и моли је да му да воде да пије. Реците, зар није прави човек? Он је не само уморан, него и жедан.
        cn: 难道行神迹的耶稣会感到疲惫吗？那位连伟大的施洗者约翰都自觉不配为祂解鞋带的耶稣，会感到疲惫吗？是的，祂就如你所见的，正是如此。如果祂不是这样，祂还能是真正的_人_吗？祂还能知道在_人_里面的是什么，以及_人_主要的痛苦是什么吗？祂并不隐藏这些，甚至不向撒马利亚妇人隐藏。祂向她表明祂口渴了，并请她给祂水喝。请问，祂难道不是真正的_人_吗？祂不仅疲惫，而且口渴。
    - type: paragraph
      text:
        ru: '«Дође жена из Самарије да захвати воде. Рече јој Исус: Дај ми да пијем. Јер ученици Његови бијаху отишли у град да купе хране. Рече Му жена Самарјанка:Како ти, који си Јудејац, тражиш од мене жене Самарјанке да пијеш? Јер се Јудејци не друже са Самарјанима. Одговори Исус и рече јој: Кад би ти знала дар Божији, и ко је Тај који ти говори: дај ми да пијем, ти би тражила од Њега и дао би ти воду живу. Рече Му жена: Господе, ни ведра немаш, а студенац је дубок; одакле ти онда вода жива? Еда ли си ти вћи од оца нашега јакова, који нам даде овај студенац, и он из њега пијаше и синови његови и стока његова? (Ин.4:7–12)'
        cn: 有一个撒玛利亚妇人来打水。耶稣对她说：「请给我水喝。」（因为他的门徒都进城买食物去了。）撒玛利亚妇人对他说：「你既是犹太人，怎么向我一个撒玛利亚妇人要水喝呢？」（因为犹太人和撒玛利亚人没有来往。）耶稣回答她说：「你若知道上帝的恩赐，和对你说『给我水喝』的是谁，你必早求他，他也必早给了你活水。」妇人说：「先生，你没有打水的器具，井又深，你从哪里得这活水呢？难道你比我们的祖宗雅各还大吗？他把这井给了我们，他自己和他的儿女以及牲畜都喝这井里的水。」 (约翰福音 4:7-12)
    - type: paragraph
      text:
        ru: 'Жеђ? – Слабост правог човека, а не човека са привидним телом. Ту слабост своје људске природе Господ Исус искоришћује и употребљује као средства спасења за Самарјанку: говари јој о води живој. Вода жива? То збуњује жену и она с правом пита: «одакле ти имаш воду живу» (Ин.4:11). Њу није имао велики праотац Јаков, а ти?'
        cn: 渴？——这是真人的软弱，而非幻影之身的弱点。主耶稣利用并使用祂人性中的这一软弱，作为拯救撒玛利亚妇人的途径：向她讲论活水。活水？这让妇人感到困惑，她便理所当然地问道：「你从哪里得活水呢？」(约翰福音 4:11)。伟大的先祖雅各尚且没有，而你呢？
    - type: paragraph
      text:
        ru: Ко си ти? и шта је то «вода жива»?
        cn: 你是谁？而「活水」又是什么？
    - type: paragraph
      text:
        ru: 'Свети Кирил Александриски вели: «Водом живом» Спаситељ овде назива благодат Светога Духа. Ко се ње удостоји, имаће у себи постојани извор божанских учења.[15]'
        cn: 圣基里尔·亚历山大说：「活水」在此被救主称为圣灵的恩典。凡配得此恩者，将在自己里面拥有一持续不断的神圣教诲泉源。[15]
    - type: paragraph
      text:
        ru: '«Одговори Исус и рече јој: Сваки који пије од ове воде, опет ће ожедњети. А који пије од воде коју ћу му Ја дати неће ожедњети довијека, него вода коју ћу му Ја дати постаће у њему извор воде која тече у живот вјечни.» (Ин.4:13–14)'
        cn: 「耶稣回答她说：『凡喝这水的，还要再渴。人若喝我所赐的水，就永远不渴。我所赐的水，要在他里头成为泉源，直涌到永生。』」（约翰福音 4:13-14）
    - type: paragraph
      text:
        ru: 'Спаситељ јој објашњава: «Сваки који пије од ове воде, опет ће ожеднети» (Ин.4:13): «сваки», и ти, и ја, и сви. Ти то већ знаш; «а који пије од воде коју ћу му ја дати, неће ожеднети никад; него вода коју ћу му ја дати биће у њему извор воде која тече у живот вечни» (Ин.13–14).'
        cn: 救主向她解释说：「凡喝这水的，还要再渴」（约翰福音 4:13）。「凡」——就是你，就是我，就是所有人。你对此早已知晓。「人若喝我所赐的水，就永远不渴。我所赐的水，要在他里头成为泉源，直涌到永生」（约翰福音 13-14）。
    - type: paragraph
      text:
        ru: 'А та жива вода јесте Дух Свети: «Ко је жедан нека дође к мени и пије. Који верује у мене, као што Писмо рече: «из његава тела потећи ће реке воде живе» (Ин.7:37–38;Ис.12:3;Иоил.3:18). И богонадахнути Еванђелист убрзо објашњава ову Спасову благовест: «А ово рече за Духа кога су имали примати они који верују у Име Његово. Јер Дух Свети још не беше дат, јер Исус још не беше прослављен» (Ин.7:37–39). Осим телесне жеђи постоји духовна жеђ: жеђ боголике душе човекове, жеђ богочежњива: та жеђ хоће бесмртност и живот вечни и све што томе води.'
        cn: 而那活水就是圣灵：「人若渴了，可以到我这里来喝。信我的人，就如经上所说：『从他腹中将流出活水的江河来』」（约翰福音 7:37-38，以赛亚书 12:3，约珥书 3:18）。而那蒙神启示的福音书作者很快解释了救主的这番喜讯：「耶稣这话是指着信他之人要受圣灵说的。那时还没有圣灵，因为耶稣尚未得荣耀」（约翰福音 7:37-39）。除了肉体的干渴，还存在着属灵的干渴：人那肖似神的灵魂的干渴，对神的渴慕之渴：这干渴渴望着不朽与永生，以及一切导向它们的事物。
    - type: paragraph
      text:
        ru: А то може дати само Бог, само Дух Свети, само Божанска Тројица, која је и «створила човека тројицеликим = триадоликим, по лику Своме, да би он само у Њој могао наћи вечну пуноћу и вечну оствареност овога тројицеликог бића. Дух Свети, када уђе у човека кроз свето крштење, Он Своје божанске и свете силе разлива по боголиком бићу човековом помоћу светих еванђелских врлина. Јер свете врлине и јесу свете божанске силе које испуњују човека свим оним што је свето, божанско, бесмртно, вечно. Само се даровима Духа Светога утољује жеђ душе људске за бесмртношћу и вечношћу.
        cn: 而这，唯有上帝、唯有圣灵、唯有神圣三位一体方能赐予，祂曾按其自身形像，即三位一体的形像，创造了人，以使他唯有在祂里面，才能寻得永恒的圆满和此具三一形像之存有的永恒实现。当圣灵藉着圣洗礼进入人里面时，祂便藉着神圣的福音美德，将祂神圣而圣洁的能力倾注于人那肖似上帝的存有之中。因为圣洁的美德正是那神圣的能力，以一切圣洁、神圣、不朽、永恒的事物充满人。唯有藉着圣灵的恩赐，方能止息人类灵魂对不朽与永恒的渴求。
    - type: paragraph
      text:
        ru: 'Они се путем подвига толико сједине са човеком, са сушитном његовог бића, толимо постану његови, да се у њему претварају у непресушни «извор воде која тече у живот вечни» (Ин.4:14); која све што је његово, цело биће његово преображава у вечно и бесмртно; кроз њих, и помоћу њих, он стално: свим мислима, свим ооећањима, свим расталожењима «тече у живот вечни». Све то лично даје Богочовек за веру у Њега.'
        cn: 它们通过苦修的途径，如此与人、与他生命最深层的本质合一，如此与他融为一体，以至于在他里面，它们变成了永不枯竭的「活水泉源，直涌到永生」(约翰福音 4:14)；这泉源将他所有的一切和他整个的存在都转化成永恒而不朽的；借着它们，并靠着它们，他持续不断地：用他所有的思想、所有的感受、所有的内心倾向，「流向永生」。这一切，都是神人因着对祂的信仰而亲自赐予的。
    - type: paragraph
      text:
        ru: 'А вера? – Сав се поверити, свим се бићем својим предати Господу Христу, да Он начини од тебе што хоће. А Он хоће свима људима једно: да се сви спасу од греха, смрти и ђавола, и постану божански бесмртна бића, добију живот вечни. Кроз сваку свету врлину човек отиче душом својом у живот вечни; а кроз сваки грех отиче у смрт, у смртно, у муку вечну. Тако човек непрестано или увећава своју бесмртност или своју смртност.'
        cn: 那么，信心是什么呢？——是完全信赖，以自己全部的存在把自己献给主基督，让他按他的旨意成就你。而他对所有人的旨意只有一件：就是让所有人都从罪、死亡和魔鬼中得救，并成为神圣不朽的存在，获得永生。借着每一种神圣的德行，人的灵魂便趋向永生；而借着每一个罪，则趋向死亡，趋向必朽坏之物，趋向永恒的痛苦。如此，人便不断地要么增长他的不朽性，要么增长他的必朽性。
    - type: paragraph
      text:
        ru: И до Страшнога Суда сваки ће човек или сав отећи у живот вечни или сав отећи у смрт вечну.
        cn: 直到可畏的审判，每个人都将或全然归入永生，或全然归入永死。
    - type: paragraph
      text:
        ru: 'Свети Златоуст благовести: Бог нас је увео у овај живот и удахнуо нам душу да бисмо ми користили не само овај свет, него ради тога да бисмо радили све ради будућег живога; само су неразумна створења саздана једино за земаљски живот.[16]'
        cn: 圣金口若望宣讲道：上帝将我们引入此生，并向我们吹入灵魂，并非仅仅是为了让我们利用今世，而是为了让我们为着未来的生命做一切事；唯有无理性的受造物，才是单单为了属世的生命而受造的。[16]
    - type: paragraph
      text:
        ru: '«Рече Му жена: Господе, дај ми ту воду да не жедним и не долазим овамо да захватам. Рече јој Исус: иди, зови мужа својега, и дођи овамо. Одговори жена и рече: Немам мужа. Рече јој Исус: Добро каза: немам мужа; јер си пет мужева имала, и сада кога имаш није ти муж; то си право казала. Рече Му жена: Господе, видим да си ти пророк.» (Ин.4:15–19)'
        cn: '妇人对他说：「先生，请把这水赐给我，叫我不再渴，也不用来这里打水。」

          耶稣对她说：「你去叫你丈夫，然后到这里来。」

          妇人回答说：「我没有丈夫。」

          耶稣对她说：「你说『没有丈夫』是对的；因为你曾经有五个丈夫，现在和你在一起的并不是你的丈夫。你这话是真的。」

          妇人对他说：「先生，我看出你是先知。」 (约翰福音 4:15-19)'
    - type: paragraph
      text:
        ru: 'Отвореној и радозналој Самарјанки: «Господе, дај ми те воде», Господ јој заиста и даје мало – мало: открива јој Своје божанско свезнање, и тиме целом бићу њеном отвара пут ка Богу живом и истинитом. Она кроз то откривење види у Исусу најпре пророка Божјег, весника истине. Али, Он је Јеврејин, а она Самарјанка; међу њима је вечити спор.'
        cn: 致那开放而好奇的撒马利亚妇人：「主啊，请你把这水赐给我吧」，主确实一点一点地赐予她：向她启示祂神圣的全知，从而为她整个生命开启了通往又活又真之神的道路。她通过这启示，首先在耶稣身上看到了神的先知，真理的使者。然而，祂是犹太人，而她是撒马利亚人；他们之间存在着永恒的争端。
    - type: paragraph
      text:
        ru: '«Оци наши клањаху се Богу на гори овој, а ви кажете да је у Јерусалиму мјесто гдје се треба клањати. Рече јој Исус: Жено, вјеруј ми долази час када се нећете клањати Оцу ни на гори овој ни у Јерусалиму. Ви се клањате ономе што не знате; а ми се клањамо ономе што знамо; јер је спасење од Јудејаца. Али долази час, и већ је ту, када ће се истински богомољци клањати Оцу у духу и истини, јер Отац тражи да такви буду они који Му се клањају. Бог је Дух; и који Му се клањају, у духу и истини треба да се клањају.» (Ин.4:20–24)'
        cn: 「我们的祖先在这山上敬拜上帝，你们却说在耶路撒冷是敬拜的地方。」耶稣对她说：「妇人，你信我，时候将到，那时你们敬拜父，将不在在 Samaritan Mount Gerizim，也不在耶路撒冷。你们所敬拜的，你们不知道；我们所敬拜的，我们知道；因为救恩是从犹太人出来的。但是时候将到，现在就是了，那时真正敬拜的，要用心灵和诚实敬拜父，因为父寻求这样敬拜祂的人。上帝是灵；所以敬拜祂的，必须用心灵和诚实敬拜祂。」 (约翰福音 4:20-24)
    - type: paragraph
      text:
        ru: 'Ваљда ће га он – Свезналац – решити: где се треба молити Богу? Ко је у праву: ми или ви, Јевреји? «Спасење је од Јевреја» (Ин.4:22), јер је Спаситељ од њих. Од њих, али не само и за њих, већ за све људе.'
        cn: 他——那位全知者——必会解决它：究竟该在哪里向上帝祈祷呢？谁是对的：是我们还是你们，犹太人？「救恩是从犹太人出来的」（约翰福音 4:22），因为救主出自他们。出自他们，但不仅是为他们，更是为所有的人。
    - type: paragraph
      text:
        ru: 'Јер су сви људи у Адаму једно, у греху и смрти једно, тако треба да буду и у Спаситељу једно, у спасењу и бесмртности једно. Када се то зна, оида нема осметње за спасење никоме. То сазнање је основ богопоштовања, богамољства: «Иде време и ввћ је настало, кад ће се прави богомољци молити Оцу духом и истином, јер Отац тражи такве богомољце» (Ин.4:24).'
        cn: 因为所有人在亚当里都是合一的，在罪和死亡里都是合一的，照样，在救主里也应该合一，在救恩和不朽里也应该合一。明白了这一点，那么对任何人的救恩都没有阻碍。这种认知是敬拜和虔诚的基础：『时候将到，现在就是了，那时真正敬拜的人要用心灵和诚实敬拜父，因为父寻找这样敬拜他的人。』（约翰福音 4:24）
    - type: paragraph
      text:
        ru: Прави богомољци, Духоносци. Молити се Богу «духом и истином». Дух Свети је Дух Истине. Ко има Њега има истину; и молећи се воћен Њим, он се моли Духом и Истином.
        cn: 真正的虔心祷告者，圣灵的承载者。向神祷告要「用心灵和真理」。圣灵是真理的灵。凡是拥有祂的，就拥有真理；并且，当他被祂引导祷告时，他就是用心灵和真理祷告。
    - type: paragraph
      text:
        ru: Дух људски без Духа Светога нити може познати Бога нити Му истински служити. Дух Свети је тај који «нам помаже у нашима слабостима, јер не знамо зашто ћемо се молити као шгго треба, него сам Дух моли се за нас уздисањем неисказаним» (Рим. 8:26). Само који има Духа Светог «зна» шта је богомољство, зна шта је молитва и «по вољи Божјој моли се» (Рим.8:27).
        cn: 人的灵若没有圣灵，既不能认识上帝，也不能真正侍奉祂。圣灵就是那位「在我们的软弱中帮助我们，因为我们不知道当怎样祷告才合适，而是圣灵亲自用不可言喻的叹息替我们祷告」（罗马书 8:26）。唯有拥有圣灵的人，「知道」什么是敬虔，知道什么是祷告，并「按着上帝的旨意祷告」（罗马书 8:27）。
    - type: paragraph
      text:
        ru: 'Само налазећи се у Духу Оветом дух људски налази се у истини, живи њоме, мисли њоме, осећа њоме; а без Њега он је у лажи, или на путу који води лажи. Само духоносац служи Богу истински, јер свим бићем својим истинује; а истина и није друго него знати истинитог Бога и живети Њиме: «Бог је Дух; и који му се моле, духом и истином треба да се моле» (Ин.4:24).'
        cn: 只有置身于圣灵之中，人的灵才在真理之中，才借真理而生活、思想、感受；而没有圣灵，人的灵就在谎言之中，或在通往谎言的道路上。只有领受圣灵者才真正地侍奉神，因为他以其全部的生命活出真理；而真理无非就是认识真神并靠祂而活：「神是灵；凡敬拜祂的，必须用心灵和真理敬拜祂」（约翰福音 4:24）。
    - type: paragraph
      text:
        ru: 'Свети Златоуст вели: Дух Свети се назива огњем – ради означења топлоте благодати коју Он изазива, и истребљења грехова; а водом – да се изрази чистота и обновљење које Он даје душама које Га примају.[17]'
        cn: 圣金口若望说：圣灵被称为火——意在标示他所引发的恩典的温暖，以及罪恶的涤除；而被称为水——意在表达他所赐予领受他的灵魂的洁净与更新。[17]
    - type: paragraph
      text:
        ru: 'Наводећи Спаситељеве речи: «Бог је Дух; и који му се моле, духом и истином треба да се моле», Свети Златоуст вели да је ту реч о Цркви: «јер је њој својствено истинско и достојно Бога поклоњење Богу».[18]'
        cn: 引用救主的话：「神是灵；凡敬拜祂的，必须以心灵和真理敬拜。」圣金口若望说，这里指的是教会：「因为真实且配得上神的敬拜，是教会所固有的。」[18]
    - type: paragraph
      text:
        ru: 'То још значи: Христом треба да се моле, јер је Христос – Истина (Ин.14:6), и који Њиме живи – живи Исгииом, и тако цео живот свој претвара у служење Богу истином, у богослужење истином. Све што је требало да у речима остави од овоје Истине, Христос је оставио у светим речима свога Еванђеља. А себе цела оставио Цркви, и ко у Цркви живи – Њиме живи, Њиме који је истина и живот.'
        cn: 这还意味着：应当借着基督祷告，因为基督是——真理（约翰福音 14:6），凡借着祂生活的人——就借着真理生活，从而将自己的一生转变为以真理事奉上帝，以真理敬拜上帝。基督把这真理中凡需要以言语形式留下的一切，都留在了祂福音的圣言之中。而祂自己则全然留给了教会，凡在教会中生活的人——就借着祂生活，借着那位是真理和生命的祂生活。
    - type: paragraph
      text:
        ru: '«Рече Му жена: Знам да долази Месија звани Христос; кад Он дође, објавиће нам све. Рече јој Исус: Ја сам – Који говорим с тобом. И утом дођоше ученици Његови, и зачудише се што са женом разговара, али ниједан не рече: шта тражиш, или што говориш са њом? А жена остави свој крчаг и отиде у град и рече људима: Ходите да видите човека који ми каза све што сам учинила. Да није он Христос? Изиђоше, дакле, из града и пођоше Њему.» (Ин.4:25–30)'
        cn: «妇人对祂说：「我知道弥赛亚，就是那称为基督的，要来；祂来了，祂会把一切都告诉我们。」耶稣对她说：「我就是——现在和你说话的。」正在这时，祂的门徒来了，并希奇祂竟然和妇人说话，但没有人说：「你要什么？」或「为什么与她说话？」而那妇人则放下她的水罐，往城里去，对人们说：「你们来，看一个人，祂把我所做的一切都告诉我了。莫非祂就是基督吗？」于是，他们就从城里出来，往祂那里去。» (约翰福音 4:25-30)
    - type: paragraph
      text:
        ru: 'Самарјанка је осетила да Исус говори о нечем месијанском, о нечем новом, али очекиваном само од Месије. Она зна да је прва одлика Месије свезнање: «Када Христос (=Месија) доће, казаће нам све» (Ин.4:25).'
        cn: 撒玛利亚妇人感觉到耶稣在谈论弥赛亚的事情，谈论一件新的事情，却是唯有从弥赛亚而来才被期待的。她知道弥赛亚的第一个特点是无所不知：「基督（=弥赛亚）来的时候，会把一切都告诉我们」（约翰福音 4:25）。
    - type: paragraph
      text:
        ru: 'Она то говори као да продужава Спасово месијанско благовешће о правим богомољцима. Зато Спас и открива прво њој сву истину о себи: «Ја сам (Месија) који говори с тобом» (Ин.4:26).'
        cn: 她这样说，仿佛在延续救主关于真正敬拜者的弥赛亚的福音。因此，救主便首先向她揭示了关于他自身的一切真理：「我就是那与你说话的（弥赛亚）。」 (约翰福音 4:26)
    - type: paragraph
      text:
        ru: 'То Господ не откри ни ученом Никодиму, ни мудром Натанаилу, већ простој богољубивој жени, која је срцем осетила Еванђеље Месије, и прву истину његову, истину о правим богомољцима. И са том истином, понесена њоме, оставила своје судове и похитала у град и рекла људима: «Хајдете да видите човека који ми каза све што сам учинила: да није то Христос?» Проверите и ви, браћо Самарјани (Ин.4:29).'
        cn: 但主并没有向博学的尼哥德慕启示，也没有向智慧的拿但业启示，而是向一位爱神的普通妇人启示，她以心感受了弥赛亚的福音，及其首要真理——关于真正敬拜者的真理。带着这真理，被其所激励，她放下自己的水罐，匆忙赶回城里，对人们说：「你们来，看看一个人，他把我所做的一切都告诉我了：这莫非就是基督吗？」撒马利亚的弟兄们，你们也去验证吧 (约翰福音 4:29)。
    - type: paragraph
      text:
        ru: '«А у међувремену мољаху Га ученици Његови говорећи: Рави, једи! А Он им рече: Ја имам јело да једем за које ви не знате. Тада ученици говораху међу собом: Да Му неко не донесе да једе? Исус им рече: Јело је Моје да вршим вољу Онога Који Ме је послао и извршим дјело Његово. Не кажете ли ви да су још четири мјесеца па ће настати жетва? Ето, велим вам: подигните очи своје и видите њиве како се већ жуте за жетву. И који жање прима плату, и сабира род за живот вјечни, да се радује заједно и који сије и који жање.» (Ин.4:31–36)'
        cn: 「当这其间，祂的门徒请祂说：『拉比，请吃！』祂却对他们说：『我有一个食物可吃，是你们不知道的。』门徒就彼此说：『莫非有人拿什么给祂吃了吗？』耶稣说：『我的食物就是遵行那差我来者的旨意，并完成祂的工。你们不是说『还有四个月才到收割的时候』吗？看哪，我告诉你们，举目向田观看，庄稼已经发黄，可以收割了。那收割的人得工价，积蓄五谷直到永生，使撒种的和收割的可以一同快乐。』」(约翰福音 4:31-36)
    - type: paragraph
      text:
        ru: За то време ученици моле свог гладног, и жедног, и уморног Учитеља да једе. А Он им, потстакнут тиме, говори о својој тајаиственој храни којом он храни Своје чавекољубиво биће. А то је? – Спасење људи. То је посао његов у овету; вршећи га Он храни себе. До малочас, разговарајући са Самарјанком о спасењу света и спасавајући њу лично, нахранио себе, док су ученици ишли у град по храну. А то је посао у који треба да ућу и ученици као што су пре њих улазили Пророци.
        cn: 那时，门徒们恳求他们饥饿、干渴又疲惫的夫子进食。然而，祂受此启发，向他们谈论祂那奥秘的食物，借此滋养祂那爱人类的本性。而那是什么呢？——是人类的救赎。那是祂在这世上的工作；祂藉着完成这项工作来滋养自己。就在片刻之前，祂与撒马利亚妇人谈论世界的救赎，并亲自拯救了她，从而滋养了自己，而门徒们那时正往城里去买食物。而这项工作，是门徒们也应当投入的，正如先知们在他们之前所投入的那样。
    - type: paragraph
      text:
        ru: «Јер у томе је истинита ријеч, да је други који сије, а други који жање. Ја вас послах да жањете гдје се ви нсте трудили; други су се трудили, а ви сте у труд њихов ушли.» (Ин.4:37–38)
        cn: 「因为在这事上，这话是真的：『撒种的是一人，收割的是另一人。』我差你们去收割不是你们劳苦的；别人劳苦，你们却进入他们的劳苦。」 (约翰福音 4:37-38)
    - type: paragraph
      text:
        ru: 'То је «посао» Месије у свету, то и храна за све његове сараднике. Кроз Пророке је Месија припремао свет за спасење света од греха, смрти и ђавола; а сада је Сам дошао да тај посао обави, и у њега уведе Своје ученике. У целокупном том послу ради се једно: сабира се род за живот вечни: спасавају се душе од смрти и преводе у живот вечни.'
        cn: 这是弥赛亚在世上的「事工」，也是他所有同工的粮食。弥赛亚藉着先知预备世界，使其从罪、死亡和魔鬼中得拯救；而现在他亲自降临，要完成这事工，并把他的门徒引入其中。在这整个事工中，只有一件事在进行：就是为永生收取果实：使灵魂从死亡中得救，并迁入永生。
    - type: paragraph
      text:
        ru: 'Сваки Пророк и сваки Апостол ради један те исти Месијин посао: «сабира род за живот вечни» (Ин.4:36). Свако људско биће, спасено Месијом, јесте род (плод) који земља даје за живот вечни. Земља! – какво достојанство има у васиони: рађа род за живот вечни; расадник је бесмртнога и вечиога; расадник бвомртника и вечника.'
        cn: 每个先知和每个使徒都做着同一个弥赛亚的工作：「为永生收割果实」(约翰福音 4:36)。每一个被弥赛亚拯救的人，都是大地为永生所结的果实。大地啊！——它在宇宙中拥有何等尊严：为永生孕育果实；是不朽者与永恒者的苗圃；是不死者与永生者的苗圃。
    - type: paragraph
      text:
        ru: Она је Божји рукосад.
        cn: 她乃上帝亲手栽种的。
    - type: paragraph
      text:
        ru: '«А из града онога многи од Самрјана повјероваше у Њега за ријеч жене која је свједочила: Каза ми све што учиних. Када, дакле, дођоше к Њему Самарјани, мољаху Га да остане код њих; и остаде ондје два дана. И много их више вјерова за ријеч Његову. Те жени говораху: Сад не вјерујемо више због твог казивања, јер сами смо чули и знамо да је ово заиста Спаситељ свијета, Христос.» (Ин.4:39–42)'
        cn: 从那城里，有许多撒马利亚人信了祂，因为那作见证的妇人说：「他把我所做的一切事都告诉我了。」于是撒马利亚人来到祂那里，求祂留在他们那里；祂就在那里住了两天。还有更多的人因为祂的话信了祂。他们对那妇人说：「现在我们信不再是因为你的话了，因为我们亲自听见了，也知道这真是世界的救主，基督。」 (约翰福音 4:39-42)
    - type: paragraph
      text:
        ru: 'Ево првих родова за живот вечни: Самарјани многи обраћају се Христу и примају Га као Спаситеља света. Проверили су Самарјанкин исказ и уверили се да је Исус заиста Спас свету, Христос=Месија. Стога и говоре жени: «Сад не верујемо више за твоју беседу, јер сами чусмо и познасмо да је овај заиста Спаситељ света, Христос» (Ин.4:42). – Какво ретко исповедништво! и колико у њему искрености, простоте, силе! «Сами чусмо и познасмо да је овај заиста Спас света, Христос»: то је наше лично искуство.'
        cn: 这是永生初熟的果子：许多撒玛利亚人归向基督，并接受祂为世界的救主。他们查验了撒玛利亚妇人的话，并确信耶稣确实是世界的救主，基督（即弥赛亚）。因此他们对妇人说：「现在我们相信，不再是因你的话，而是我们亲自听见了，也知道这真是世界的救主，基督。」 (约翰福音 4:42) ——多么难得的信仰告白啊！其中有多少真诚、朴实、力量啊！「我们亲自听见了，也知道这真是世界的救主，基督」：这就是我们个人的经验。
    - type: paragraph
      text:
        ru: '«Спас света» – целога света, не само Самарјана, не само Јевреја, већ свих људи скупа, и још: целога света што постоји, миче се и живи. Јер све то стење у оковима преха и смрти, «уздише и тужи» (Рим.8:22): чекајући спасења од Спаоитеља света. «Сами чусмо и по знасмо», – то је најсигурнији начин да се Христос упозна.'
        cn: «世界的救主»——是整个世界的救主，不仅仅是撒马利亚人，不仅仅是犹太人，而是所有人类，还有：整个存在、运行并活着的万物。因为所有这一切都在罪和死亡的枷锁中呻吟，「叹息并劳苦」（罗马书 8:22）：等待着世界救主的拯救。「我们亲耳听见，并且知道」——这是认识基督最可靠的方式。
    - type: paragraph
      text:
        ru: 'Треба сам доћи у лични додир са Њим; сам Му постављати питања, и добијати од Њега одговоре. И ако човек није с предумишљајем и с предубеђењем пришао Исусу, мора открити у Њему и Спаситеља свога и Спаситеља света. Увек један и за све један, категорички еванђелски императив христопознања: «дођи и види» (Ин.1:46; ср.Ин.1:39).'
        cn: 必须亲自与祂建立个人联系；亲自向祂提问，并亲自从祂那里获得答案。并且，如果一个人并非带着预谋和偏见接近耶稣，他就必将在祂里面发现他自己的救主和世界的救主。那始终如一、普世共通的，关于认识基督的绝对福音诫命是：「来，看一看」（约翰福音 1:46；参 约翰福音 1:39）。
  - type: heading2
    text:
      ru: Исцељење сина царевог службеника
      cn: 医治大臣的儿子
    children:
    - type: paragraph
      text:
        ru: '«А послије два дана изиђе оданде, и отиде у Галилеју. Јер Сам Исус посвједочи да пророк у својој постојбини нема части. А када дође у Галилеју, примише Га Галилејци, који бијаху видјели све што учини у Јерусалиму о Празнику, јер и они дођоше на Празник.Исус пак дође опет у Кану Галилејску, гдје претвори воду у вино. И бјеше неки царев човјек чији син боловаше у Капернауму. Овај чувши да је Исус дошао из Јудеје у Галилеју, отиде к Њему и мољаше Га да сиђе и да му исцијели сина, јер бијаше на самрти. Каза му, дакле, Исус: Ако не видите знаке и чудеса, нећете да поверујете. Рече Му царев човјек: Господе, дођи док није умрло дијете моје. Рече му Исус: Иди, син твој је жив. И вјерова човјек ријечи коју му рече Исус и пође. А већ док он силажаше, гле, сретоше га слуге његове и јавише му говорећи: Дијете је твоје живо. Тада их упита за час у који му би лакше; и казаше му: Јуче у седми час пусти га грозница. Тада разумје отац да то бјеше у онај час у који му рече Исус: Син твој је жив. И вјерова он и сва кућа његова.Ово је опет друго знамење које учини Исус дошавши из Јудеје у Галилеју.» (Ин.4:43–54)'
        cn: '两日以后，祂离开那里，往加利利去了。因为耶稣自己曾作见证说：「先知在自己的家乡是没有尊荣的。」祂到了加利利的时候，加利利人接待了祂，因为他们都曾见过祂在耶路撒冷过节时所行的一切事，他们也曾去过那节期。

          耶稣又来到加利利的迦拿，就是祂从前使水变为酒的地方。有一个王室大臣，他的儿子在迦百农患病。这人听说耶稣从犹太回到了加利利，就去见祂，求祂下去医治他的儿子，因为他儿子快要死了。于是耶稣对他说：「若不看见神迹奇事，你们总是不信。」那王室大臣对祂说：「主啊，求祢在我孩子还没有死以前下去！」耶稣对他说：「去吧，你的儿子活了。」那人信了耶稣对他所说的话，就走了。

          他正下到路上的时候，看哪，他的仆人就来迎接他，告诉他说：「你的孩子活了！」他就问他们孩子好转是哪个时辰；他们对他说：「昨天下午一点钟，热病就退了。」他父亲就知道，那正是耶稣对他说「你的儿子活了」的时候。他自己和他的全家都信了。这是耶稣从犹太回到加利利以后所行的第二件神迹。(约翰福音 4:43-54)'
    - type: paragraph
      text:
        ru: 'Нема сумње, у овог царевог човека посреди је мука која га гони к Исусу, а не нека одређвна вера у Исуса као Спаситеља света. Та се вера у њему образовала тек пошто је Спас учинио чудо. Еванђелист благовести: и верова он и сва кућа њггова (Ин.4:53).'
        cn: 毫无疑问，这个王的臣仆所遭受的是一种痛苦，驱使他来到耶稣面前，而不是某种明确的、对耶稣是世界救主的信心。这种信心是在救主行了神迹之后才在他心中形成的。福音书作者宣告说：「他和他的全家都信了。」 (约翰福音 4:53)
    - type: paragraph
      text:
        ru: 'И још ово: Спаситељ га кори: «Ако не видите знаке и чудеса, не верујете» (Ин.4:48). И још треће, што сведочи да царев човек није веровао да је Исус Спаситељ од смрти: «Господе, дођи док није умрло дете моје» (Ин.4:49). А ако умре, значи непотребан је Исус јер је немоћан да подигне из смрти. И на ту полуверу и почетну веру човекољубиви Господ одговара: «Иди, син јe твој здрав» (Ин.4:50).'
        cn: 还有这句：救主责备他：「若不看见神迹奇事，你们总是不信。」 (约翰福音 4:48)。还有第三点，这表明这大臣并不相信耶稣是能救人脱离死亡的救主：「主啊，求你趁着我的孩子还没有死就下去。」 (约翰福音 4:49)。而如果他死了，就意味着耶稣是无用的，因为祂无力使人从死亡中复活。面对这半信半疑和初步的信，满有慈爱的主回答说：「你去吧，你的儿子活了。」 (约翰福音 4:50)。
    - type: paragraph
      text:
        ru: Самарјани су се на основу разговора са Исусом убедили да је Исус – «Спас света», Месија; поверовали у Њега као таквог, а Јевреји знаке ишту.
        cn: 撒玛利亚人基于与耶稣的对话，确信耶稣是——「世界的救主」，弥赛亚；他们相信祂就是这样一位，而犹太人却寻求神迹。
    - type: paragraph
      text:
        ru: Зато их Спаситељ са тугом кори.
        cn: 然而，他们的救主却带着悲伤责备他们。
  - type: heading2
    text:
      ru: Глава пета. Господ Исус и чудо у бањи витезди
      cn: 第五章。主耶稣和毕士大池的神迹
    children:
    - type: paragraph
      text:
        ru: '«Потом бјеше празник јудејски, и изиђе Исус у Јерусалим. А у Јерусалиму код Овчијих врата постоји бања, која се јеврејски зове Витезда, и има пет тријемова. У њима лежаше велико мноштво болесника, лсијепих, хромих, сухих, који чекаху да се вода заталаса. Јер анђео Господи силажаше и узбуркаваше воду; и који би први ушао у воду пошто се узбурка вода, оздравио би, ма одкакве болести бјеше болестан. А ондје бијаше неки човјек који тридесет и осам година бјеше болестан. Кад видје Исус овога гдје лежи и разумије да је већ много година болестан, рече му: Хоћеш ли здрав да будеш? Одгоори му болестан: Господе, човјека немам, да ме спусти у бању када се узбурка вода; а док ја дођем, други сиђе прије мне. Рече му Исус: Устани, узми одар свој и ходи! И одмах оздрави човјек, и узе одар свој и хоћаше. А тај дан бјеше субота.» (Ин.5:1–9)'
        cn: 后来，有一个犹太人的节期，耶稣就上耶路撒冷去。在耶路撒冷，靠近羊门有一个池子，希伯来话叫作毕士大，有五个廊子。在那里躺着许多病人，就是瞎眼的、瘸腿的、枯干的，他们等候水动。因为主的使者下来搅动那水；水动之后，谁先下去，无论患了什么病，就痊愈了。在那里有一个人，病了三十八年。耶稣看见他躺着，知道他病了许久，就问他说：「你要痊愈吗？」病人回答说：「主啊，水动的时候，没有人把我放到池子里；我正要去的时候，就有别人比我先下去了。」耶稣对他说：「起来，拿你的褥子走吧！」那人立刻痊愈了，就拿起褥子走了。那天是安息日。(约翰福音 5:1-9)
    - type: paragraph
      text:
        ru: 'Витезда – болница; «анђео Господњи» исцељује помоћу замућене воде и то само једнога болесника годишње. На меру исцељење и под меру исцељени. Замућена вода – символ воде крштења; «анђео Господњи» – предвесник Светoга Духа. У ширем смислу: Витезда = сав свет, у коме лежи «мноштво болесника, слепих, хромих, сухих». Греси повалили и свалили у неизлечиве болести сав род људски; само један тренутак у години – непосредна веза са Богом, и то преко анђела и воде; а ове остало време потопљено у мрак, у смрт, у ванбожје. И тај тренутак, тај пут између неба и земље, Бога и рода људског – од милости Божје, не по заслузи људској. Појава Богочовека у свету, у тој огромној Витезди, све мења из основа: свима и свакоме пружа се могућност исцељења, оздрављења од греха и смрти. И то: преко Светог Крштења водом и Духом. Пример: исцељени тридесетосмогодишњи болесник. Спас као да свакога пита, свакога болесника, – а то сваки човек: «хоћеш ли да будеш здрав?»'
        cn: 毕士大——医院；«主的使者»借着搅动的水医治，并且一年只医治一个病人。医治有其限度，被医治者亦有其限度。搅动的水——洗礼之水的象征；«主的使者»——圣灵的先驱。更广义地讲：毕士大 = 整个世界，其中躺卧着«许多病人、瞎眼的、瘸腿的、枯干的»。罪恶使全人类陷于不可医治的疾病之中；一年中只有一个瞬间——与神直接相连，而且是通过天使和水；而其余的时间则沉浸在黑暗、死亡和离弃神的状态中。而那个瞬间，那条介于天与地、神与人类之间的道路——是出于神的恩典，并非凭着人的功德。神人降临世间，在那巨大的毕士大中，从根本上改变了一切：向所有人，向每一个人，都提供了从罪和死亡中得到医治、恢复健康的可能。而且是：借着水和圣灵的圣洗。例证：那位被医治的三十八年病人。救主仿佛在问每一个人，问每一个病人——而那正是每一个人：「你想要痊愈吗？」
    - type: paragraph
      text:
        ru: 'И ко одговори: «да, Господе»; одмах бива исцељен од греха и смрти. Јер није више анђео Господњи посредиик измећу, и то једанпут годишње, између Бога и људи, већ је сам Бог сишао међу људе са свима својим силама и непрекидно борави међу људима као Црква, исцељујући од сваке болести и немоћи, а претходно од сваког греха, који и јесте једини извор људских болести и људске сомрти. «Али, – немам човека». Да; али имаш Бога. Човек и не може спасти. А и кад спасава, обично спасава преко човека. – Још: Витезда је свака душа људска, јер је у свакој «мноштво болесника, слепих, хромих, сухих,» = мисли, осећања, жеља. Уђе ли у њу Господ Христос помоћу ма које Свете Тајне или ма које Свете Врлине, она се намах исцели, од свих болести исцели.'
        cn: 凡是回答说：「是的，主啊！」的，就立刻从罪和死亡中得到医治。因为不再是主的使者一年一次在上帝与人之间作中保，而是上帝亲自带着祂所有的能力降临到人中间，并以教会的形式持续地居住在人中间，医治一切疾病和软弱，而首先医治的是一切罪恶，因为罪恶正是人类疾病和死亡的唯一根源。「可是，我没有人。」是的；但你有上帝。人是无法拯救的。即使在拯救时，通常也是借着人来拯救的。——再者：每个人的灵魂都是毕士大，因为在每个灵魂中都有「许多病人，瞎眼的，瘸腿的，枯干的」——即思想、情感、欲望。若是主基督借着任何圣事或任何圣德进入其中，它就立刻得到医治，从一切疾病中得到医治。
    - type: paragraph
      text:
        ru: '«Тада говораху Јудејци исцијељеном: Субота је, није ти допуштено да носиш одар. Он им одговори: Који ме учини здравим он ми рече: Узми одар свој и ходи. А они га запиташе: Ко је тај човјек који ти рече: Узми одар свој и ходи? А излијечени не знађаше ко је; јер се Исус бјеше удаљио због многог народа на ономе мјесту. Потом га нађе Исус у храму и рече му: Ето постао си здрав, више не гријеши, да ти се што горе не догоди.» (Ин.5:10–15)'
        cn: 「那时，犹太人对那被医好的人说：今天是安息日，你不可拿你的褥子。他回答说：那使我痊愈的，他对我说：拿起你的褥子走吧。他们就问他：对你说『拿起你的褥子走吧』的是什么人呢？那被医好的人不知道是谁，因为那里人多，耶稣已经离开了。后来耶稣在殿里遇见他，对他说：看哪，你已经痊愈了，不要再犯罪，免得你遭遇的更加厉害。」 (约翰福音 5:10-15)
    - type: paragraph
      text:
        ru: 'Откуда болести у роду људском? – Од греха. То је истина коју нам откри Богочовек Господ Христос када рече иецељеноме од тридесетосмогодишње болесгга: «Ето си здрав, више не греши, да те не снађе што горе» (Ин.5:14). Значи: од греха долази и најтежа болест; од греха и оно_што је «горе» и од ње саме. А то је? – Губљење душе, омрт душе=пакао. Тако Спас и говори свакоме по крштењу: «Ето си здрав, више не греши да те не снађе што горе». – И заиста крштеноме бива горе када се ода греху и пороцима, те тако бисер баца предс. О томе овети Апостол Павле благовести јасно:Евр.6:4–6. А такви су обично богохулници и духохулници. Они упорно, свесно и «рационално» остају при својим гресима и прљавштинама.'
        cn: 人类为何有疾病？——因罪。这是道成人身的主基督向我们揭示的真理，祂对那位从三十八年病痛中得医治的人说：「看哪，你已经痊愈了，不要再犯罪，免得你遭遇的更加厉害」（约翰福音 5:14）。这意味着：最严重的疾病也源于罪；甚至比疾病本身「更厉害」的事也源于罪。那是什么？——灵魂的失丧，灵魂的死亡，即地狱。救主也如此对每个受洗后的人说：「看哪，你已经痊愈了，不要再犯罪，免得你遭遇的更加厉害」。——确实，当受洗者沉溺于罪恶和邪行时，他们的境况会变得更糟，这如同将珍珠丢在猪面前。关于这一点，圣使徒保罗清楚地宣告：「希伯来书 6:4-6」。而这样的人通常是亵渎上帝者和亵渎圣灵者。他们顽固地、自觉地、「理性地」固守着他们的罪恶与污秽。
  - type: heading2
    text:
      ru: Господ Исус о себи као месији
      cn: 主耶稣论及自己作为弥赛亚
    children:
    - type: paragraph
      text:
        ru: '«И зато гоњаху Јудејци Исуса, и гледаху да га убију, јер чињаше то у суботу. А Исус им одговори: Отац Мој до сада дјела и Ја дјелам.» (Ин.5:16–17)'
        cn: 因此，犹太人迫害耶稣，并设法要杀害他，因为他在安息日做这些事。耶稣却回答他们说：「我的父直到如今作工，我也作工。」 (约翰福音 5:16-17)
    - type: paragraph
      text:
        ru: 'Проблем суботе. Субота је дан одмора и празновања. Када човек све своје посвећује Богу, проверава Богом и освећује Богом. Све што томе служи – од Бога је; све супротно томе, не служи Богу а тиме ни човеку. Законски циљ суботе: освећење човека Богом, исцељење, оздрављење од свих духовних болести. Зиачи: «субота је човека ради». А чим то није, она постаје идол човеков, опасан и душегубан као и сваки духовни идол. Спаситељ и у суботу исцељује људе, оздрављује са тим циљем: јер Божје добро је увек потребно човеку кроз сва времена, и кроз све мене дана и ноћи. Јевреји хоће да убију Исуса што исцељује људе у суботу.'
        cn: 安息日的问题。安息日是安息与欢庆之日。当人将自己的一切献给上帝，接受上帝的省察，并蒙上帝的圣化时。一切为此服务的——都是出于上帝的；一切与此相悖的，则既不侍奉上帝，也不侍奉人。安息日的律法目标：人蒙上帝的圣化，从一切属灵疾病中得医治、得痊愈。这意味着：「安息日是为人设立的」。而一旦它不再如此，它就成为人的偶像，像任何属灵偶像一样危险并毁灭灵魂。救主也在安息日医治人，以那目标使人痊愈：因为上帝的良善在任何时候，以及日夜的所有变迁中，都始终是人所需要的。犹太人想要杀死耶稣，因为他在安息日医治人。
    - type: paragraph
      text:
        ru: 'А Он? Он им одговара: «Отац мој до сада дела, и ја делам» (Ин.5:17). Ко ради кроз сунце и у суботу све греје и животвори вас и земљу вашу, ако не Он – Бог, и ја са Њим? Ко ради и у суботу кроз земљу вашу, њене усеве, њено биље, њене животиње, те све то постоји и живи, ако не Бог Својом божансжом силом? Ко одржава звезде, небеса, сва бића и све твари, непрестано па и у суботу, ако не Бог Својом промислитељском и сведржитељском силом? Бог непрестано ради кроз сва бића и кроз све твари. Ко даје силе срцу нашем те оно непрекидно ради и дању и ноћу, и у суботу, и у сваки други дан, ако не Бог. Ко такву исту силу даје и осталим нашим унутрашњим органима те раде и мимо наше свести и мимо наше воље и у суботу и у сваки други дан, ако не Бог?'
        cn: 而他呢？他回答他们说：「我父直到如今仍在作工，我也作工。」 (约翰福音 5:17) 谁透过太阳，甚至在安息日，也使一切温暖，并赐予你们和你们的土地生命呢？若不是他——上帝，和我与他同在，又能是谁呢？谁在安息日也透过你们的土地、土地上的庄稼、植物、动物作工，使这一切得以存在和存活呢？若不是上帝以他神圣的力量，又能是谁呢？谁持续不断地，甚至在安息日也维系着星辰、诸天、万有和一切受造物呢？若不是上帝以他那护理万有和全然维系的力量，又能是谁呢？上帝透过万有和一切受造物持续不断地作工。谁赐予我们心脏力量，使它日夜不停地跳动，在安息日，以及在其他每一天都如此呢？若不是上帝，又能是谁呢？谁将同样的力量赐予我们其他内脏器官，使它们在不经我们意识和意愿的情况下，在安息日以及在其他每一天都作工呢？若不是上帝，又能是谁呢？
    - type: paragraph
      text:
        ru: 'Бог не престаје чинити људима Своја божанска добра никада, па и у суботу. Бог Логос = Господ Исус Христос ради непрекидно кроз сву творевину Своју, ради на видљив и невидљив начин, више на невидљив него на видљив. Зато одлучно изјављује: «и ја радим» (Ин.5:17): и у суботу радим чинећи божанска добра. Нема одмора, нема «суботе», за Божје добро; оно увек ради, увек дела, увек дејствује.'
        cn: 上帝从不停止向人们施行祂的神圣美善，即使在安息日也是如此。圣言上帝——即主耶稣基督——持续不断地借由祂的整个受造物运行，祂以可见和不可见的方式工作，更多是以不可见的方式，而非可见的方式。因此，祂坚定地宣告：「我仍在做工」（约翰福音 5:17）：即使在安息日，我也做工，施行神圣的美善。对于上帝的美善而言，没有休息，也没有「安息日」；它总是在工作，总是行动，总是运行。
    - type: paragraph
      text:
        ru: «И зато још више тражаху Јудејци да га убију, не само зато што нарушаваше суботу, него што и Бога називаше Својим Оцем градећи се једнак Богу.» (Ин.5:18)
        cn: «因此犹太人就越发想要杀他，不只是因为他犯了安息日，更是因为他称神为自己的父，将自己与神等同了。» (约翰福音 5:18)
    - type: paragraph
      text:
        ru: 'Да, откривен је главни «грех»: Исус гради се једнак Богу. То Јевреји не могу да опросте. А како они објашњавају дела Исусова; да ли су она «једнака» Божјим? Ето, Његово најновије дело: исцељење болесника у Витезди. Ко може то чинити, зар човек? Нема таквог човека. Нема сумње ово дело спада у божанска дела. А Онај који га је учинио зар није «једнак Богу»? Сетимо ое месијанских пророштава: Сва она говоре о томе, о таквим делима која ће громовито јављати: «с нама је Бог=Емаиуил» (Мф.1:23). Зиачи: ви сте одбацили месијанока пророштва и браните своје изуме, своје «обичаје», своје грехе.'
        cn: 是的，主要的「罪」已被揭示：耶稣使自己与神同等。这是犹太人无法原谅的。那么，他们如何解释耶稣的作为呢？这些作为「等同于」神的作为吗？看哪，他最新的作为：在毕士大治愈病人。谁能做这事，难道是人吗？没有这样的人。毫无疑问，这作为属于神圣的作为。那么，成就这事的那一位难道不「与神同等」吗？让我们回想弥赛亚的预言：所有这些预言都谈到，关于那些将雷鸣般宣告「神与我们同在=以马内利」（马太福音 1:23）的作为。这意味着：你们拒绝了弥赛亚的预言，并维护你们自己的发明、你们的「习俗」、你们的罪。
    - type: paragraph
      text:
        ru: '«А Исус одговори и рече им: Заиста, заиста вам кажем: Син не може ништа чинити сам од себе него што види да Отац чини; јер што Он чини, то исто чини и Син. Јер Отац љуби Сина, и све Му показује што Сам чини; и показаће Му већа дијела од ових да се ви чудите.» (Ин.5:19–20)'
        cn: 耶稣回答他们说：「我实实在在地告诉你们：子凭着自己不能做什么，惟有看见父所做的，子才能做；因为父所做的事，子也照样做。因为父爱子，将自己所做的一切事指示给子看；并且还要将比这更大的事指示给他看，叫你们希奇。」 (约翰福音 5:19-20)
    - type: paragraph
      text:
        ru: 'Ако иоле непристрасно расудите о Исусовим делима видећете да су сва месијанска. Онда, зар Он није Месија? Ако брижљиво исиитате стваралачке силе које чине та дела, ви ћете на диу сваке пронаћи: Божанство, и то и Оца и Сина. Сва та дела показују да је и сила у њима и начин на који су учињена – божански. Ако хоћете гледати непристрасно, ви ћете видети у њима Оца небеског, а у Њему – Сина Његовог, који све ради са Оцем и у Име Оца.'
        cn: 如果你们哪怕稍微不偏不倚地审视耶稣的作为，就会看到，它们都是弥赛亚性的。那么，他难道不是弥赛亚吗？如果你们仔细探究成就这些作为的创造性力量，就会在每一种力量的深处发现：神性，并且是父与子的神性。所有这些作为都表明，它们之中所蕴含的力量以及它们成就的方式——都是神圣的。如果你们想要不偏不倚地看待，你们就会在其中看到天父，并在天父那里——看到他的圣子，他与父一同，并奉父之名行一切事。
    - type: paragraph
      text:
        ru: 'У погледу делатности међу Њима нема никакве разлике, јер нема ни у погледу супгпине и бића Њиховог. Једносушни међу собом, једносушна су им и дела. Свако дело Сииа указује на Оца, и свамо дело Оца указује на Сина: «Заиста, заиста вам кажем: Син не може ништа чинити сам од себе него што види да Отац чини; јер што он чини, то исто чинп и Син» (Ин.5:20).'
        cn: 在他们的活动方面，他们之间没有任何区别，因为在他们的本质和存有方面也没有区别。他们彼此同质同体，他们的作为也同质同体。圣子的每一项作为都指向圣父，圣父的每一项作为也指向圣子：「我实实在在地告诉你们，子凭着自己不能做什么，唯有看见父所做的才能做；父所做的事，子也照样做。」（约翰福音 5:20）
    - type: paragraph
      text:
        ru: 'Чега је то знак? – Бескрајне божанске љубави, јер је љубав та сила која сачињава једносушност Њихове природе и Њихове делатноети. Та љубав све зна, све открива Очево Сину, Сину који је постао човек, а својсгвено је људској природи не зиати све: њој се открива од Бога оно што је Божје. И то се открива кроз нарочита дела; и кроз «већа дела од ових», да се људско сазнање мора чудити. Чему? Божанствености тих дела. Јер се ни на који начин не могу свести на човека, на људске стваралачке силе; све у њима, и све из њих указује на Бога, сведочи о Богу. Када то не би било тако, христоборачки људи би их могли лако одбацити и порицати, овако им остаје једно: да им се чуде. Видели сте иацељење болеоника у Витезди. То је мало дело.'
        cn: 这是什么的记号？——是无尽神圣之爱的记号，因为爱是那构成他们本性与他们行动之同一本体的力量。那爱无所不知，将父的一切启示给子，给成了人的子；而人性的特征是不知晓一切：对它而言，那属于神圣的，是由神启示的。而这借着特别的作为被启示出来；并且借着「比这些更大的作为」，以至于人类的认知必须惊奇。惊奇什么呢？惊奇那些作为的神圣性。因为它们绝不能归结于人，归结于人类的创造力；它们内的一切，以及它们所出的一切都指向神，为神作证。若非如此，那些敌基督的人会轻易地拒绝和否认它们；然而如此一来，他们只剩一件事可做：对它们感到惊奇。你们见过在毕士大治愈病患。那是一个微小的作为。
    - type: paragraph
      text:
        ru: «Јер као што Отац подиже мртве и оживљава, тако и Син које хоћео живљује. Јер Отац не суди никоме, него је сав суда дао Сину. Да сви поштују Сина као што поштују Оца. Ко не поштује Сина не поштује ни Оца који Га је послао.» (Ин.5:21–23)
        cn: 「因为正如父使死人复活，使他们活过来，照样子也随自己的意思使人活过来。因为父不审判任何人，而是将一切审判都交给了子，为要叫所有的人尊敬子，如同尊敬父一样。不尊敬子的，就是不尊敬那差遣祂来的父。」 (约翰福音 5:21-23)
    - type: paragraph
      text:
        ru: 'Ево и већих дела: васкрсење мртвих, суд над свима. Сигурно, то су дела Божја, не људска. Али, она су подједнако и Очева и Синовљева. Јер једна иста божанска воља подиже мртве и кроз Оца и кроз Сина. Јер су им и воље једносушне. Син, иако у телу, иако човек, има ту свемоћну божанску вољу, којом и «које хоће оживљује» (Ин.5:21). А његова човечанска воља радосио сарађује Његовој Божанској вољи, и свим бићем својим учествује у њеним делима. Поставши човек, Бог Логос је на известан начин «умањио себе» (Еф.2:7), поиизио себе из свог бескрајног човекољубља. Зато Бог Отац «сав суд даде Сину» (Ин.5:22). Даде Њему Који је као човек прошао кроз мучилиште и патилиште људског живота. Јер је тиме стекао право да с правом суди људима. Живео је са њима у истим условима, али није злрешио. Тиме је стекао право и пред васкрслим родом људским да му суди, због греха. Јер Њему нико од људи неће моћи с правом рећи и пребацити иа страшном суду: Да си ти био човек, и живео у околностима у којима су живели људи на земљи, и ти би згрешио, зато немаш права да иам судиш, јер ниси живео на земљи као човек, на том грешилишту и мучилишту. А да си живео и ти би згрешио.'
        cn: 看哪，还有更大的作为：死人的复活，以及对所有人的审判。当然，这些是神的作为，而非人的作为。但是，它们同样是父的也是子的。因为同一神圣的旨意，通过父也通过子，使死人复活。因为他们的旨意也是同本体的。子，尽管身在肉身，尽管是人，却拥有那全能的神圣旨意，借此祂『叫谁活就叫谁活』（约翰福音 5:21）。而祂属人的旨意欣然地与祂神圣的旨意合作，并以其整个存有参与其事工。成为人后，神道以某种方式『使自己卑微』（以弗所书 2:7），出于祂无限的爱世人之心而降卑自己。因此，父神『将审判的事全交与子』（约翰福音 5:22）。祂将此赐予那位，作为人，祂经历了人类生命的苦难与磨砺。因为祂因此获得了公正地审判人类的权利。祂曾与他们一同生活在相同的境况下，却未曾犯罪。祂因此获得了权利，甚至在复活的人类面前审判他们，因为他们的罪。因为在可怕的审判日，没有人能公正地对祂说或指责祂：『如果你也是人，并且生活在地上人类所生活的境况中，你也会犯罪，因此你没有权利审判我们，因为你没有像人一样活在这罪恶与苦难之地。如果你活过，你也会犯罪。』
    - type: paragraph
      text:
        ru: 'Али баш тиме, баш том својом човечанскам безгрешношћу на земљи, Син Човечији показује да је «једнак Богу» (Ин.5:18), да је Богочовек, и да заслужује божанско богопоштовање као и Бог Отац. То порећи Сину значи бити богоборац и незнабожац. Јер је одлучна и јасиа реч Спасова: «Ко не поштује Сина, не поштује ни Оца који га је послао» (Ин.5:23). Цео Стари Завет пун је дела које је најочигледније чинио Бог Отац; зато га људи с правом поштују као Оца; а Нови – пун је дела која најочигледније чини Бог Син, зато и Њега треба људи да поштују као и Бога Оца. А дела Његова нису ли равна Очевим делима, па и већа од њих (Ин.5:20).'
        cn: 然而，正是藉着他，正是藉着他自己在世上的人性无罪，人子显明他「与神是同等的」（约翰福音 5:18），他是一位神人，并且配得如同神父一样得到神圣的敬拜。否认这一点，就是否认圣子，就是与神为敌者和不信者。因为救主的话语是明确而清晰的：「不尊敬子的，就是不尊敬差子来的父」（约翰福音 5:23）。整个旧约充满了神父最明显地所行的作为；因此人们理当敬拜他为父；而新约则充满了神子最明显地所行的作为，因此人们也应当如同敬拜神父一样敬拜他。难道他的作为不与父的作为相等，甚至比它们的更大吗？（约翰福音 5:20）
    - type: paragraph
      text:
        ru: '«Заиста, заиста вам кажем: ко Моју ријеч слуша и вјерује Ономе који Ме је послао, има живот вечни, и не долази на суд, него је прешао из смрти у живот.» (Ин.5:24)'
        cn: 「我实实在在地告诉你们：那听我的话，又信差我来者的，就有永生，不至于定罪，而是已经出死入生了。」（约翰福音 5:24）
    - type: paragraph
      text:
        ru: 'Вера у Месију? – То је стицање вечнога живота. «Ко верује… има живот вечни» (Ин.5:24), има још сада на земљи. Јер има Бога Оца и Бога Сина; а у њима је живот вњчни. Вером отвара човек све своје биће к Богу, призива га себи: и Он улази, усељује се у њега «вером» (Еф.3:17); гради у њему обитавалиште Своје, и усељује се у њега Света Тројица (Ин.14:23). А где је Света Тројица ту нема места омрти већ свуда и у свему живот вечни. Ко слуша еванђеље Богочовеково, и прима га у душу, и живи његовим божанским силама, он на тај начин потискује из себе све грешно и смртно, прелази свим бићем из смрти у бесмртност, из смрти у живот, и «има живот вечни» (Ин.5:24), то јест живот иза кога и у коме нема смрти. А вера у Еванђеље Богочовекојво, вера је у Самог Бога Оца Који је и послао Сина са тим Еванђељем у наш земаљски свет. То казује благовест Спасова: «Заиста, заиста вам кажем: ко моју реч слуша и верује Ономе који ме је послао, има живот вечни, и не долази на суд, него је прешао из смрти у живот» (Ин.5:24). – «И не долази на суд», јер је сам покајањем својим осудио грехе своје, па и саму смрт своју осудио на смрт покајањем и еванђелским врлинама, које су по себи свете божанске бесмртне силе и убијају све смрти и све њихове претече и доводитеље: грехе.'
        cn: 信仰弥赛亚？——那是获得永生。「凡信的……有永生」（约翰福音 5:24），现在在地上就已经有了。因为有天父上帝和圣子上帝；在他们里面有永生。人借着信，向上帝敞开他整个生命，呼唤祂到自己这里：祂就进入，「借着信」住在他里面（以弗所书 3:17）；在他里面建造祂的居所，圣三一住在他里面（约翰福音 14:23）。而圣三一所在之处，那里就没有死亡之地，唯有在一切之中、一切之处都有永生。凡聆听神人之福音的，并将其领受于灵魂之中，且凭藉其神圣能力生活之人，他便以此方式将一切罪恶和属乎死亡的从自身中驱逐出去，以其整个生命从死亡过渡到不朽，从死亡过渡到生命，并且「有永生」（约翰福音 5:24），即是说，一个在其之后、在其之中都没有死亡的生命。而对神人之福音的信仰，是对天父上帝本身的信仰，祂也将圣子与那福音一同差遣到我们这个尘世之中。救主的喜讯如此宣告：「我实实在在地告诉你们：凡听我话，又信差我来者的，就有永生，不至于定罪，乃是已经出死入生了」（约翰福音 5:24）。——「不至于定罪」，因为他自己已借着悔改而定了他自身诸罪的罪，甚至借着悔改和福音的诸德性，将他自身的死亡判处死刑，这些德性本身就是神圣、神性、不朽的力量，它们能杀死所有的死亡及其一切先兆与引致者：即罪恶。
    - type: paragraph
      text:
        ru: 'Постоје две смрти: смрт душе и смрт тела, зато постоје и два васкрсења: Васкрсење душе и васкрсење тела. Васкрсење душе бива вером, и осталим врлинама које су од ње; васкрсење тела – неиосредним дејством силе Божје.'
        cn: 有两种死亡：灵魂的死亡和身体的死亡，因此也有两种复活：灵魂的复活和身体的复活。灵魂的复活是借着信心，以及其他源于信心的美德；身体的复活则是借着神能力的直接作为。
    - type: paragraph
      text:
        ru: «Заиста, заиста вам кажем, да долази час, и већ је настао, када ће мртви чути глас Сина Божијега, и чувши га оживјеће.» (Ин.5:25)
        cn: 「我实实在在地告诉你们，时候将到，现在就是了，死人要听见神儿子的声音，听见的人就要活了。」(约翰福音 5:25)
    - type: paragraph
      text:
        ru: 'Васкрсење душе предвесник је и огласитељ васкрсења тела. И његов доказ. Васкрсење душа збиовало се на земљи већ око Богочовека Господа Христа: васкрсли су душом Његови ученици, па Никодим, па Натаиаило, иа Самарјанка, па ови они који су поверовали у Њега као у Сина Божјег и Бога. «Заиста, заиста вам кажем: иде час и већ је настао кад ће мртви чути глас Сина Божјега, и чувши оживети» (Ин.5:25). – «И већ је настао»: јер мртви душом већ васкрсавају, а ено и мртви телом: Лазар, син Наинске удовице, Јаирова кћи.'
        cn: 灵魂的复活是身体复活的先驱和宣告者，也是其证明。灵魂的复活已在世上，在神人主基督周围发生过：祂的门徒们灵魂已复活，接着是尼哥底母，接着是拿但业，接着是撒玛利亚妇人，接着是那些相信祂是上帝的儿子和上帝的人们。「我实实在在地告诉你们：时候将到，现在就是了，死人要听见上帝儿子的声音，听见的人就要活了。」（约翰福音 5:25）——「现在就是了」：因为那些灵魂已死的人已经复活了，并且那些身体已死的人也复活了：拉撒路，拿因寡妇的儿子，睚鲁的女儿。
    - type: paragraph
      text:
        ru: '«Кад ће мртви чути глас Сина Божјега», мртви душом на првом месту, они чују глас Његов кад се разбуде на покајање и принуде себе на еванђелске подвиге; они и живе вечним животом; то казују речи: «и чувши – оживеће». Чим човек «чује глас Сина Божјега»; а он га чује чим почне да извршује заповести Његове; и тако одмах из греха, из смрти устаје, и новом се животу предаје.'
        cn: «死人何时将听见神的儿子的声音？»——首先，这指的是灵魂已死之人。当他们觉醒悔改，并勉力自己投身福音的属灵操练时，他们就听见祂的声音了。他们也因此活出永恒的生命；这正是这些话语所言明的：「听见的人就活了。」一个人只要一「听见神的儿子的声音」——他何时听见呢？他只要一开始遵行祂的诫命就听见了——于是他立刻从罪恶中、从死亡中站起来，并将自己献给新的生命。
    - type: paragraph
      text:
        ru: «Јер као што Отац има живот у себи, тако даде и Сину да има живот у себи» (Ин.5:26)
        cn: 「因为父怎样在自己有生命，就赐给子也照样在自己有生命。」 (约翰福音 5:26)
    - type: paragraph
      text:
        ru: 'Да се не би Исусу рекло: па ти си човек, како нам можеш дати живот вечни, Он и указује на Своју једнакост са Богом Оцем и у животу. Бог Отац је једно биће које «има живот у себи»; као Бог Логос то исто има и Син, само је то добио од Оца да има и као човек, те да као човек даје људима тај исти живот. Сва друга бића: и анђели и људи, и све што живи и дише, добија живот од њих: од Бога Оца преко Бога Логоса (Ин.1:4). Зато Спас и објављује благовестну истину: «Као што Отац има живот у себи, тако даде и Сину да има живот у себи» (Ин.5:26). И ко је у Њему, у Исусу, у Њему је и вечни живот са свима својим бесмртним силама које спаљују сваку смрт и све што је смртно. Зато што је Богочовек донео људима живот вечни, и све што он укључује, Богочовек и зна да сваки човек може стећи тај живот, и тиме избећи суд и осуду за грех и смрт. И стварно, ко «има живот вечни» тај «и не долази на суд» (Ин.5:24), јер је сатро и уништио у себи оно због чега се иде пред Богочавека на суд, а то је: грех, смрт и ђаво.'
        cn: 为免有人对耶稣说：「你不过是个人，怎能赐我们永生呢？」祂便指出自己与父神在生命上的平等。父神是那「有生命在自己里面」的独一存在；作为神道（Logos），子也同样拥有这生命，只是祂从父领受，得以也作为人拥有这生命，并因此作为人将这生命赐予世人。所有其他存在：天使和人类，以及一切有生命、有气息的，都从祂们那里获得生命：从父神通过神道（Logos）获得（约翰福音 1:4）。因此，救主宣扬这福音真理：「因为父怎样在自己有生命，就赐给子也照样在自己有生命」（约翰福音 5:26）。凡是在祂里面，在耶稣里面的人，在祂里面也有永生，连同其一切不朽的力量，这力量能焚尽一切死亡和一切属乎死的。因为神人将永生以及其所包含的一切带给了人类，神人也知道每个人都能获得这生命，并借此免于因罪和死亡而来的审判与定罪。诚然，凡「有永生」的人，「就不至于定罪」（约翰福音 5:24），因为他已在自己里面粉碎并摧毁了使人必须来到神人面前受审判的原因，即：罪、死亡和魔鬼。
    - type: paragraph
      text:
        ru: «И даде Му власт и да суди, јер је Син Човјечији.» (Ин.5:27)
        cn: 又赐给他权柄，可以施行审判，因为他是人子。(约翰福音 5:27)
    - type: paragraph
      text:
        ru: 'Зато што је као човек дао људима све што им је потребно за победу над грехом, смрћу и ћаволом; зато што је Он као човек, у име свих људи, за све људе и место свих људи победио и грех и смрт и ђавола, и дао људима пример и силе како се та победа постиже, Он је и добио од Оца «власт да и суд врши» (Ин.5:27). Добио је суд над светом и људима, јер је као човек, као нови Адам, живео у свету греха, а није згрешио. То што се није ни с једним човеком десило. О томе сведочи безгрешна благовест еванђелска: «И даде му власт да и суд врши, јер је Син Човечији» (Ин.5:27). А Син Човечији је тиме Човечији што је све човечије, све људско проживео од врха до дна, па ипак није згрешио. То сведочи: грех, и са њим смрт, није нешто неопходно, ни природно, ни логично у човеку и његовом животу, већ ствар слободне воље човекове, јер је човек својом добровољом увео грех у овај свет, а са њим и за њим – смрт. За све човечанске светове свеистинита је благовест Светог философа Максима Исповедиика: «Грех је злоупотреба слободне воље човекове».'
        cn: 因为他作为一个人，赐予人类战胜罪、死亡和魔鬼所需的一切；因为他作为一个凡人，以所有人的名义，为了所有人并代替所有人战胜了罪、死亡和魔鬼，并赐予人类如何取得那胜利的榜样和力量，他也因此从父那里得到了「施行审判的权柄」（约翰福音 5:27）。他得到了对世界和人类的审判权，因为他作为一个凡人，作为新亚当，活在罪恶的世界中，却从未犯罪。这事从未在任何一个人身上发生过。无罪的福音真理对此作证：「并赐给他施行审判的权柄，因为他是人子」（约翰福音 5:27）。而人子之所以为人子，是因为他从头到尾经历了一切人性、一切人类的事物，然而却从未犯罪。这证明了：罪，以及随之而来的死亡，在人及其生命中并非必要、并非自然、也并非逻辑之事，而是出于人的自由意志，因为人是自愿地将罪带入了这世界，随之而来的便是死亡。对于所有人类世界，圣哲学家马克西姆·宣信者完全真实的真理信息是：「罪是对人的自由意志的滥用。」
    - type: paragraph
      text:
        ru: «Не чудите се томе, јер долази час у који ће сви који су у гробовима чути глас Сина Божијега, и изићи ће они који су чинили добро у васкрсење живота, а они који су чинили зло у васкрсење суда.» (Ин.5:28–29)
        cn: 「你们不要为此感到希奇，因为时候将到，那时所有在坟墓里的，都要听见上帝儿子的声音，并要出来；行善的，复活得生命；作恶的，复活被定罪。」 (约翰福音 5:28-29)
    - type: paragraph
      text:
        ru: '«Не чудите се овоме» (Ин.5:28), тојест томе што Син Човечији има живот вечни и васкрсава мртве, јер је то природно за њега пошто је Он Бог Логос; и томе што је Бог Отац «сав суд» дао Сину Човечијем, јер је и то природно пошто је Он – прави човек, али човек без греха те има природно право да суди грехе. «Не чудите се овоме, јер иде час у који ће сви који су у гробовима чути глас Сина Божјега, и изићи ће који су чинили добро у васкрсење живота а који су чинили зло у васкрсење суда (Ин.5:28–29). «Сви који су у гробовима чуће глас Сина Божјега»: сви без изузетка. И по дејству Сина Божјега сви који су у гробовима чуће глас Његов и васкрснуће. Васкрсење је обавезно за све: јер је и у Адаму и у Христу човек створен за бесмртност и живот вечни. У Адаму је то изгубио грехом и смрћу; у Христу се то повраћа човвку као човеку, као Адаму, и то Спасовом безгрешношћу и васкрсењем. И то зато што је Бог Логос = Христос у исто време Син Човечији, и све Његово прелази на људску природу.'
        cn: 「不要为此诧异」（约翰福音 5:28），也就是说，人子拥有永生并使死人复活，因为这对他而言是自然的，因为祂是圣言（道）上帝；以及天父将「一切审判」都交给人子，因为这也是自然的，因为祂是——真正的人，但却是无罪的人，因此拥有审判罪恶的自然权利。「不要为此诧异，因为时候将到，凡在坟墓里的，都要听见上帝儿子的声音，并且要出来；行善的，复活得生命；作恶的，复活受审判。」（约翰福音 5:28-29）。「凡在坟墓里的，都要听见上帝儿子的声音」：所有人都无一例外。并且藉着上帝儿子的作为，凡在坟墓里的，都要听见祂的声音并复活。复活对所有人而言都是必然的：因为无论是藉着亚当还是藉着基督，人都被创造为拥有不朽和永生。在亚当里，人因罪和死亡而失去了这些；在基督里，这些被归还给作为人的存在，如同归还给亚当，并且是藉着救主的无罪和复活。这也是因为圣言（道）上帝 = 基督同时也是人子，祂的一切都转移到人性之中。
    - type: paragraph
      text:
        ru: 'Васкрсење, иако је природно и абавезно за свако људско биће, оно је двоструко: једни ће васкрснути за васкрсење живота, а друпи за васкрсење суда. И то: који су чинили добро – за васкрсење живота, а који су чинили зло – за васкрсење суда. Добро је у суштини вечно, и зато уводи у живот вечни, јер је пореклом и свим бићем својим од Бога; зло је по природи, и по пореклу, и по васцелом бићу свом од ђавола, и природно – одводи њему, али кроза суд Сина Божјег. Јер на суду биће потуно јасно и онима «који су чинили зло» зашто одлазе у пакао и огањ вечни. Зло само себи суди, јер само себе води своме творцу и оцу; и сви они који су се изједначили с њим: «који су чинили зло», иду са њим и за њим. Кроз васкрсење улазе у живот вечни и добри и зли: само добри улазе у живот Вечнога Добра – Бога, а зли – у живот вечнога зла – ђавола. Ту је сва разлика, разлика између добра и зла између Бога и ђавола. Нема ничег заједничког међу њима, ни икакве компромисне симбиозе, саживота.'
        cn: 复活，尽管对每个世人而言是自然的和必然的，它却是双重的：一些人将复活，得享生命的复活，而另一些人则复活，受审判的复活。也就是说：行善的人将得生命的复活，而作恶的人则得审判的复活。善，其本质是永恒的，因此引人进入永生，因为它从起源和其全部的存在都来自于上帝；恶，其本性、起源和其全部的存在都来自魔鬼，自然地——它引人归向魔鬼，但却是通过上帝之子的审判。因为在审判中，甚至对「作恶的人」来说，他们为何会进入地狱和永火，都将会完全清楚。恶本身就审判自己，因为它将自己引向它的创造者和父亲；所有那些与它同化的人——「作恶的人」，都与它同行，并追随它。通过复活，善人和恶人都进入永生：只有善人进入永恒之善——上帝的生命，而恶人则进入永恒之恶——魔鬼的生命。这就是所有的区别，是善与恶之间的区别，是上帝与魔鬼之间的区别。它们之间没有丝毫共同之处，也没有任何妥协性的共生关系或共存。
    - type: paragraph
      text:
        ru: «Ја не могу чинити ништа сам од себе; Како ћујем онако судим, и суд је Мој праведан јер не тражим вољу Своју, но вољу Оца који Ме је послао. Ако Ја свједочим сам за себе, свједочанство Моје није истинито. Други је који свједочи за Мене; и знам да је истинито свједочанство којим свједочи за Мене.» (Ин.5:30–32)
        cn: 我凭着自己不能作什么；我怎么听见，就怎么审判。我的审判是公义的；因为我不求自己的意思，只求那差我来者的意思。我若为自己作见证，我的见证就不真实。另有一位给我作见证的；我也知道他给我作的见证是真实的。(约翰福音 5:30-32)
    - type: paragraph
      text:
        ru: 'Суд Сина Човечијег, да ли је праведан? Несумњиво, јер иако је по људској природи Син Човечији, Он је по Личности Својој Божанској, Син Божји, Друго Лице Свете Тројице, и све што чини и као човек, чини као Богом Оцем, чини својим безгрешним и свеправедним Божанством. Он је толико једно и по бићу и по вољи са Богом Оцем да не може ништа чинити сам од себе, ни судити; у свему и све Он чини са Оцем и кроз Оца, па и у суду над људима «који су чинили зло»: «Ја не могу ништа чинити сам од себе како чујем онако судим, и суд је мој праведан; јер не тражим вољу своју но вољу Оца који ме је послао» (Ин.5:30–31). – Не мислите: Исус је човек те и суд његов подлеже слабостима и неправдама људским. Иако сам човек, Ја сам увек по Божанству: свеправедан Син Божји и Бог. Најзад, и кад одбаците мој суд, Моје сведочанство о Мени зато што сам човек, ево Бога Оца који сведочи за Мене; а шта ћете са Њим и са Његовим сведочанством? Не можете га одбацити као човечаиско, као човечански погрешиво и неправедно, јер је у свему и по свему божанско, и божански свеправедно и безгрешно. Ако хоћете да будете еванђелски правични и искрени, ви ћете у Његовом сведочанству видети сву истину о Мени.'
        cn: 人子的审判，是否公义？毫无疑问，因为尽管祂按着属人的本性是人子，但按着祂神圣的位格，祂是神的儿子，是三位一体的第二个位格，祂所做的一切，即使是作为人所做的，也是与父神一同做的，是以祂无罪和全义的神性做的。祂与父神在本体和旨意上是如此合一，以至于祂不能凭自己做什么，也不能审判；在一切事上，一切都是祂与父并藉着父做的，甚至在审判那些「行恶的人」时也是如此：「我凭着自己不能做什么，我怎么听见，就怎么审判。我的审判也是公义的，因为我不寻求自己的意思，只寻求那差我来的父的意思。」 (约翰福音 5:30-31)——不要以为：耶稣是人，因此祂的审判也受制于人的软弱和不义。虽然我是人，我却总是按着神性：是全义的神的儿子，是神。最后，即使你们因为我是人而拒绝我的审判，拒绝我为自己所作的见证，看哪，有父神为我作见证；你们要拿祂和祂的见证怎么办呢？你们不能将其当作属人的而拒绝，当作属人的、会犯错的和不义的，因为祂在一切事上，并且按着一切都是神圣的，并且是神圣地全义和无罪的。如果你们愿意按照福音公义和真诚，你们将在祂的见证中看到关于我的一切真理。
    - type: paragraph
      text:
        ru: Ено те истине у Претечином сведочанству. Ко њему откри да сам Ја Син Божји ако не Отац Бог, који га и посла да крсти крштењем покајања? А и ви, чиме ћете објаснити дело Моје, чудеса Моја која надмашују све шго је људско, све силе људске? Сведочанство Бога Оца је сво исковано од истине Његове и стварности Моје. Али све што људи могу сведочити о мени мало је, премало. Па чак и Јован Крститељ, као човек, шта би и са којом силим могао сведочити за мене, за истину Моју?
        cn: 这些真理就在前驱的见证里。若不是父神，谁向他启示我就是神的儿子呢？父神也正是差遣他施行悔改洗礼的那一位。那么你们呢，你们将如何解释我的作为，我的神迹，那些超越一切属人的、一切人类能力的神迹呢？父神的见证完全是由祂的真理和我的真实铸造而成的。但凡人能为我作的见证是微不足道的，太微不足道了。那么，即便施洗约翰，作为一个凡人，他又能凭着什么，用何等力量为我、为我的真理作见证呢？
    - type: paragraph
      text:
        ru: «Ви сте послали к Јовану, и он је свједочио за истину. А Ја не примам свједочанство од човјека, него ово говорим да се ви спасете.» (Ин.5:33–34)
        cn: «你们曾差人到约翰那里，他为真理作过见证。我不接受从人来的见证，我说这些话，为要叫你们得救。» (约翰福音 5:33-34)
    - type: paragraph
      text:
        ru: «Ја не примам сведочанство од човека» (Ин.5:34). Сведочанство човека о Богочовеку? Није ли свако раслабљено грехом, или бар свеопштом људском греховношћу? Човек, остајући сав у себи, затворен у своју људску природу, у своју човечјост, људскост, није ли слепи сведок о Богу? Зар човек није одавно, испочетка, узео грех, и наочаре греха за воју визију Бога и за своје сведочанство о Богу? Све што је човечије опосредовано је грехом, зато «ја не примам сведочанство од човека» (Ин.5:33), већ од Бога и оних људи које Бог очисти и освети те кроз њих и из њих Он Сам говори.
        cn: 「我不受人的见证。」（约翰福音 5:34）人关于神人的见证？难道不是每个人都因罪而衰弱，或者至少因普遍的人类罪性而衰弱吗？人，若完全滞留于自身之中，封闭于他的人性、他的人之本相、他的人类本质之内，难道不是关于上帝的盲目见证者吗？难道人不是早在起初，就戴上了罪，以及罪的眼镜，来观看上帝，并为上帝作见证吗？凡是属人的，都已被罪所中介，因此「我不受人的见证」（约翰福音 5:33），而是受来自上帝的，以及受来自那些上帝洁净并圣化，并通过他们、从他们那里亲自说话的人的见证。
    - type: paragraph
      text:
        ru: «Он бјеше свјетиљка која гораше и свијетљаше; а ви хтједосте мало времена да се радујете светлости његовој. Али Ја имам свједочанство веће од Јованова; јер дјела која Ми даде Отац да их свршим, ова дјела која Ја чиним свједоче за Мене да Ме је Отац послао.» (Ин.5:35–36)
        cn: «约翰是点着的明灯，你们情愿暂时欢喜他的光。但我有比约翰更大的见证；因为父交给我要我成就的事，就是我所作的这些事，都为我作见证，证明是父差了我来。» (约翰福音 5:35-36)
    - type: paragraph
      text:
        ru: 'У тој светлости Божјој «говораше и светљаше» Јован, и осветљаваше Мене и пут Мој и дело Моје: «али ви се хтедосте мало времена радовати његовом светљењу» (Ин.5:35). Но његово сведочанство је пролазно; само је једно сведочанство о мени непролазно и необесциво: сведочанство Бога Оца. Ево њега у свима делима Мојим, у свима речима, у свима осећањима, у васцелом бићу Мом Богочовечанском. Ви сте људи, волите земаљоку стварност: дела. Ето дела Мојих, разгледајте их. Зар у овима не видите Њега – Бога Оца? Зар она не «сведоче за мене да ме Отац посла?» (Ин.5:36).'
        cn: 在那神的亮光中，约翰「言说并照耀」，并且照亮了我、我的道路和我的工作：「但你们情愿暂时喜欢他的光」（约翰福音 5:35）。但他的见证是短暂的；只有关于我的一个见证是永恒的、不可磨灭的：父神的见证。看啊，他就在我所有的作为中，在我所有的言语中，在我所有的感受中，在我整个神人二性中。你们是人，喜爱地上的真实：作为。看啊，这是我的作为，审视它们。难道在这些之中你们看不到他——父神吗？难道它们不「为我作见证，证明父差遣了我吗？」（约翰福音 5:36）。
    - type: paragraph
      text:
        ru: «И Отац ко Ме посла, Он је и посвједочио за Мене. Нити сте глас Његов икада чули ни лице Његово видјели. И ријеч Његову немате да обитава у вама; зато што ви не вјерујете Ономе кога Он посла.» (Ин.5:37–38)
        cn: «差我来的父，他也为我作了见证。你们从未听见过他的声音，也未曾看见他的面貌。他的道也没有住在你们心里，因为你们不信他所差来的。» (约翰福音 5:37-38)
    - type: paragraph
      text:
        ru: А када бисте истински били Божји, истински били Израиљци, ви бисте и осетили и видели да «Отац који Ме посла Сам сведочи за Мене» (Ин.5:37). Али ви «ни гласа Његова кад чусте ни лица Његова видесте» (Ин.5:37). Све што је Његово, ви сте одбацили, па ето одбацујете и Мене који сам сав Његов. Када би ма која реч Његова била у вама, ви бисте помоћу ње осетили Мене и видели да Ме Он посла. А
        cn: А，如果你们真正属于神，真正是以色列人，你们就会感受到并看到「差我来的父也为我作证」（约翰福音 5:37）。然而你们「从来没有听见祂的声音，也没有看见祂的形像」（约翰福音 5:37）。凡属祂的，你们都拒绝了，所以你们也拒绝了我这完全是属祂的。如果祂的任何一句话在你们里面，你们就会借着它感受到我，并看到是祂差遣了我。
    - type: paragraph
      text:
        ru: ли Његове речи, говорене у Закону и Пророцима, за вас нису живе те ви не осећате Бога живог и истинитог ни у Њему ни у Мени. Када би те речи «стајале у вама», живеле у вама, светлеле и гореле, ви бисте веровали Ономе кога Он посла. Јер све оне сведоче о Њему и воде Њему. Ви сте књижевници, хвалите се Божјим Писмом, Светим Писмом.
        cn: 难道祂在律法和先知书中所说的话，对你们而言并非活泼的，以致你们感受不到活泼而真实的上帝，无论是在祂里面还是在我里面？如果那些话语「常在你们里面」，活在你们里面，发光并燃烧，你们就会相信祂所差遣的那一位。因为所有这些话语都为祂作证，并引人归向祂。你们是文士，夸耀上帝的圣卷，圣经。
    - type: paragraph
      text:
        ru: «Истражујете Писма, јер ви мислите да у њима имате живот вјечни; а баш она свједоче о Мени. И нећете да дођете к Мени да имате живот.» (Ин.5:39–40)
        cn: 「你们查考圣经，因你们以为内中有永生；给我作见证的就是这经。然而，你们不肯到我这里来得生命。」 (约翰福音 5:39-40)
    - type: paragraph
      text:
        ru: '«Истражујте јер мислите да у њима гшате живот вечни; а баш она сведоче за мене» (Ин.5:39). «Живот вечни» је нешто што је и шире и бескрајније од ових писаних речи; он је по свему и свачему – Бог; и ако озбиљно испитате Овето Пиомо, ви ћете видети да је вечни живот о коме оно говнри – Сам Бог Логос; Син Божји, оваплоћени: Христос Спаситељ. Речи Светога Писма су знаци и кажипрсти који указују на Живот Вечни: Бога. А оне су по себи «дух и живот» (Ин.6:63). Ако живите по њима ви ћете бити одведени Ономе, Ко их је изрекао и преко Светмх људи Духом Својим Светим записао… и у Светим Књигама оставио као сведочанство о Себи. Али ви уиорно остајете при своме мртвилу, при својим мртвим обичајима; нећете да оживите себе духом и животом речи Божијих, јер би вас то одвело Богу живом и истинитом: Мени – Месији. Ви сте се скаменили у своме лицемерју и човекопоклонству, заљубили у своје самољубље, зазидали себе смрћу са свих страна: «и нећете да дођете к мени да имате живот» (Ин.5:40).'
        cn: 「你们查考，因为你们以为在其中有永生；但那正是为我作见证的。」(约翰福音 5:39) 「永生」乃是比这些书写之言更广阔、更无限的事物；他处处皆是——是神；如果你们认真查考圣经，你们就会看到它所说的永生——就是神圣言（道）本身；是道成肉身的神之子：基督救主。圣经的言语是标志和指引，指向永生：神。而它们自身就是「灵和生命」（约翰福音 6:63）。如果你们遵照它们而活，你们就会被引领到那位说出它们、并通过圣洁之人借着祂的圣灵将它们写下…并将其作为关于祂自己的见证留在圣书中。但你们却顽固地停留在自己的死亡状态中，停留在你们死去的习俗中；你们不愿借着神言语的灵和生命使自己复活，因为那会把你们引向又活又真的神：引向我——弥赛亚。你们在自己的伪善和崇拜人中变得刚硬如石，爱上了自己的自私，四面八方用死亡把自己围堵起来：「并且你们不肯到我这里来得生命」（约翰福音 5:40）。
    - type: paragraph
      text:
        ru: 'Коме је стало до живота може га са сигурношћу наћи једино у Боточовеку Господу Христу, јер у Њему нема трага ни од смрти духовне ни од смрти телесне. А који се окрећу од Њега и траже «живот» и «живо» изван Њега, они у смрти траже живот, и не налазе, јер смрт је тиме смрт што убија живот и све живо. А људи то чине зато што свесно неће Христа. Отуда и Спасова благовест: «И нећете да дођете к Мени да имате живот» (Ин.5:40). – Људи то чине као да се у њима воља за живот претворила у вољу за смрт. Оно уствари тако и јесте: јер волети грех и хтети грех, то је волети и хтети амрт, пошто, грех учињен рађа смрт» (Иак.1:15).'
        cn: 谁若渴望生命，唯有在神人主基督里才能确切找到生命，因为在他里面，既没有属灵死亡，也没有肉体死亡的痕迹。然而，那些离弃他、在他以外寻求「生命」和「生机」的人，他们是在死亡中寻求生命，却寻不着，因为死亡之所以是死亡，就是因为它扼杀生命和一切有生机的事物。而人们之所以这样做，是因为他们有意识地拒绝基督。因此，救主的宣告说：「你们不肯到我这里来得生命。」 (约翰福音 5:40)。——人们这样做，仿佛他们里面的求生意志已转变为求死意志。实际上，事情确实如此：因为爱罪和意欲犯罪，就是爱死亡和意欲死亡，因为「罪既长成，就生出死来。」 (雅各书 1:15)。
    - type: paragraph
      text:
        ru: «Него вас познајем да љубави Божије немате у себи» (Ин.5:42)
        cn: 但我认识你们，知道你们心里没有上帝的爱。（约翰福音 5:42）
    - type: paragraph
      text:
        ru: 'Зашто људи не желе и неће да иду Господу Христу? Зато што немају љубави Божје у себи. Љубав Божја хрли и отима се ка свему Божјем. Богољубље је супротна сила грехољубљу. Оно увек воли добро, и иде к њему; а идући к њему оно иде само извору добра: Богу, Христу. Љубав је увек богочежњива, богоцентрична; кроз све што је њено она водн Богу. Ниједна сила није тако богочежњива као љубав; ниједна тако стваралачка, сјединилачка, животворна, боготворна, исцељујућа, обожујућа. Насупрот њој, грех је разједињујућа, злотворна, смртотворна, ђавотворна, ођавољујућа сила. А човек између њих, увек слободан да буде са једном или са другим. Нико није дошао у овај свет са толико божанске љубави као Господ Христос.'
        cn: 人们为什么不愿、不肯去到主基督那里？因为他们里面没有神的爱。神的爱奔向并渴慕一切属神之物。爱神之心是恋罪之爱的对立力量。它总是喜爱良善，并趋向良善；而当它趋向良善时，它只是趋向良善的源头：神，基督。爱总是渴慕神的、以神为中心的；藉着它的一切，它将人引向神。没有一种力量像爱那样渴慕神；没有一种力量像爱那样具有创造性、联合性、赐生命性、神化性、医治性、使人成神性。与之相对，罪是分裂性的、作恶的、致死的、魔化性的、使人魔化的力量。而人居于二者之间，总有自由去选择与其中之一同在。没有人带着像主基督那样多的神圣之爱来到这个世界。
    - type: paragraph
      text:
        ru: «Ја сам дошао у Име Оца Својега и не примате Ме; ако други дође у име своје, њега ћете примити.» (Ин.5:43)
        cn: 「我奉我父的名来，你们不接待我；若有别人奉自己的名来，你们倒要接待他。」 (约翰福音 5:43)
    - type: paragraph
      text:
        ru: 'Он је просто дошао у Име Ње, «у име Оца», а људи Га непримају, јер су грехољубиви и ђавопоклоници. Да, ђавопоклоници, јер сваки грех и јесте клањање ђаволу, метанисање ђаволу, обожавање ђавола. Христос = Месија сав долази у име Бога Оца, јер је Сам Бог; а људи Га не признају због грехољубља свог. С правом вели Спаситељ: «Ако други дође у име своје, њега ћете примити» (Ин.5:43).'
        cn: 他仅仅是奉祂的名，「奉父的名」而来，然而人们却不接纳祂，因为他们恋罪且是拜魔鬼者。是的，拜魔鬼者，因为每一个罪行都确实是向魔鬼下拜，向魔鬼行大拜，崇拜魔鬼。基督，即弥赛亚，全然是奉父神的名而来，因为祂自己就是神；然而人们却因其恋罪之心而不认祂。救主说得公义：「若有别人奉自己的名而来，你们就必接纳他。」（约翰福音 5:43）
    - type: paragraph
      text:
        ru: 'И много их је дошло и долази их «у име своје», и несретни људи трче за њима. Колико је самозваиих вођа и спасилаца човечанства, и увек се нађе лакомислених људи који иду за њима. Зашто? Зато што они обично обећавају лако спасење, лако избављење људи, рода људског. И то избављање од малих иевоља и зала свакодневног живота. А онај који долази да спасе људе од главних мука и зала: греха, смрти и ђавола, – тражи од њих напор, покајање, самоосуду, умртвљење самољубља и сластољубља. Томе се људи, по грехољубивом атавизму и навикнутости не одазивају, и ретко следују; јер се за тим може ићи само ако се човек одрекне себе, свог греховног самољубља, и узме крст, и распне на њему своје грехољубиве сласти и страсти.'
        cn: 许多人曾来，并正「奉自己的名」而来，不幸的人们追随他们。有多少自封的领袖和人类的拯救者啊，总能找到轻信的人们追随他们。为何？因为他们通常承诺轻易的救赎，轻易地解救人们，解救人类。并且这种解救是脱离日常生活中微小的困扰和邪恶。然而，那位来拯救人们脱离主要苦难和邪恶——罪、死亡和魔鬼——的，却要求他们付出努力，悔改，自我谴责，以及治死自爱和贪爱享乐。人们由于贪爱罪恶的返祖现象和习以为常，对此不予回应，也鲜少追随；因为只有当一个人舍弃自己，舍弃自身罪性的自爱，背起十字架，并在其上将自己贪爱罪恶的欢愉和情欲钉死，才能如此行。
    - type: paragraph
      text:
        ru: «Како ви можете вјеровати када примате славу један од другога, а славу која је од јединога Бога не тражите? Славу од људи не примам.» (Ин.5:41:44)
        cn: 「你们怎能相信呢，当你们从彼此接受荣耀，却不寻求那来自独一之神的荣耀？我不接受来自人的荣耀。」（约翰福音 5:41，44）
    - type: paragraph
      text:
        ru: 'Испитајте и проверите: све што је добро у човеку, води порекло од самога Бога: све што је велико, бесмртно и вечновредностно. За све то припада слава Богу; а човеку, уколико прославља Бога оним што је добро, свето, бесмртно, вечио. Шта је то пгго треба хвалити и славити у човеку, а да га није добио од Бога? Разуман човек то увиђа и осећа, зато сву славу за сва славна дела људска приписује Богу. Само људи ситних ћуди, спарушеиих осећања, кратких мисли, приписују људима славу због њихових дела. Њу и упорно траже. А у роду људском славно је, у ствари, само оно што је божанско, бесмртно, и вечно. Све друго јесте или убрзо постаје срамно.'
        cn: 查验并确认：凡人身上一切美好的，都源于上帝本身：凡是伟大的、不朽的、具永恒价值的。这一切的荣耀都归于上帝；至于人，唯有当他藉着良善、圣洁、不朽、永恒去荣耀上帝时，荣耀才归于他。人身上有什么值得称赞和荣耀的呢，是他没有从上帝那里得到的呢？明智之人洞察并感知到此，因此将人类一切光荣作为的全部荣耀归于上帝。只有心胸狭隘、情感枯萎、思想短浅之人，才将荣耀归于人的作为。他们也执意追逐这荣耀。而在人类中，真正光荣的，唯有那神圣的、不朽的、和永恒的。其他一切不是可耻的，就是很快变得可耻的。
    - type: paragraph
      text:
        ru: 'Човек славан само Богом, само Богочовеком. Јер му само Он даје и бесмртност, и вечност, и истину, и љубав, и правду, и мудрост – оно што га чини славним пред Богом. А то: што га чини вечито славним. Зато Богочовек, у Име Своје и свих Својих правих следбеника одлучно изјављује: «Ја не примам славе од људи» (Ин.5:41). А тражи ли човек славу од људи то црв од црва тражи црвоточину – шта ће му онда Господ Христос? Шта ће му вера у Њега? Та он не може ни да верује у Господа Христа. Самољубље и јвсте главна сметња за веровање у Богочовека, самољубље човекоугодничко. Угађа ли човек људима, живи ли за људску славу, већ је онеспособио себе за веру у Бога и Божје: Божју Истину и Правду и Живот. Зато Спас с правом пита такве: «Како ви можете веровати када примате славу један од другога, а славу која је од јединога Бога не тражите?» (Ин.5:44).'
        cn: 人的荣耀唯独来自上帝，唯独来自神人。因为唯独他赐予他不朽、永恒、真理、爱、公义和智慧——这些使他在上帝面前得荣耀的事物。而这使他永远荣耀。因此，神人以自己的名义和他所有真正追随者的名义，斩钉截铁地宣告：「我不受从人来的荣耀」（约翰福音 5:41）。而人若向人寻求荣耀，那无异于虫子向虫子寻求腐朽——那他还要主基督作什么呢？他还要信靠他作什么呢？事实上，他甚至不能相信主基督。自爱确实是相信神人的主要障碍，是那取悦于人的自爱。人若取悦于人，若为人的荣耀而活，就已使自己丧失了相信上帝和属于上帝之事物的能力：即上帝的真理、公义和生命。因此，救主理所当然地问这样的人：「你们怎能相信呢？当你们彼此从人领受荣耀，却不寻求那从独一上帝来的荣耀呢？」（约翰福音 5:44）。
    - type: paragraph
      text:
        ru: «Не мислите да ћу вас Ја тужити Оцу; има који вас оптужује, Мојсеј, у кога се ви уздате. Јер да вјеровасте Мојсеју, веровали бисте и Мени; јер он писа о Мени. А кад његовим Писмима не вјерујете, како ћете вјеровати Мојим речима?» (Ин.5:45–47)
        cn: 「不要以为我会在父面前控告你们；有控告你们的，就是你们所仰赖的摩西。你们若信摩西，也必信我；因为他写过关于我的事。你们若不信他的书，怎能信我的话呢？」 (约翰福音 5:45-47)
    - type: paragraph
      text:
        ru: Славни боговидац Мојсије сву је славу своју и народа свога и свих људи видео у Богу и Његовом Месији. Свака његова реч је читав пожар ревности за Бога и оно што је Божије. Ако истражујете истину његових речи, шта је она ако не Бог и Његов Месија? Мојсије није друго ни радио него «писао за Мене» (Ин.5:46). Када бисте правилно схватили Мојсија,[19]ви бисте преко њега поверовали у Месију о коме он писа.
        cn: 荣耀的见神者摩西，将他自己、他的人民以及所有人的荣耀，都看见在神和祂的弥赛亚里面。他的每句话都是一团为神和属神之事所发的炽热热忱之火。如果你探究他话语的真理，那真理若不是神和祂的弥赛亚，又会是什么呢？摩西不曾做别的事，只是«为我写作» (约翰福音 5:46)。如果你们正确地理解了摩西[19]，你们就会藉着他相信他所写的那位弥赛亚。
    - type: paragraph
      text:
        ru: Упоредите Моје речи и Мојсијеве, ви ћете пронаћи да кроз њих путује једна иста Истина Божја, једна иста Правда, иста Љубаав, иста Мудрост, иста Доброта. И све оне воде и цриводе Богу а иза Њега и кроз Њега – Мени. Мислите да вас Ја корим и тужим самовољно и безразложно, не ослањајући се на Мојсија и његов Закон? Та погледајте у његове речи; о, како вас оне туже и оптужују што Мене, Месију не примате!
        cn: 比较我的话语和摩西的话语，你将发现，贯穿它们的是同一个神的真理、同一个公义、同一份爱、同一份智慧、同一份良善。所有这一切都引导人归向上帝，而从祂那里，并透过祂——归向我。你们以为我责备和控告你们是任意妄为且毫无理由的吗，没有依据摩西和他的律法吗？那么，请看他的话语；哦，它们何等控告和指责你们，因你们不接受我，不接受弥赛亚！
  - type: heading2
    text:
      ru: Глава шеста. Одлазак Христов у Галилеју и чудесно нахрањење народа са пет хлебова и две рибе
      cn: 第六章。基督前往加利利，并用五饼二鱼奇迹般地喂饱众人
    children:
    - type: paragraph
      text:
        ru: «Послије тога отиде Исус преко Галилејског, Тиверијадског мора. И за Њим иђаше мноштво народа, јер гледаху знамења Његова која чињаше на болесницима. А Исус изиђе на гору, и ондје сјеђаше са ученицима Својим.» (Ин.6:1–3)
        cn: 「之后，耶稣渡过了加利利海，就是提比利亚海。有许多人跟着祂，因为他们看见祂在病人身上所行的神迹。于是耶稣上了山，在那里和祂的门徒一同坐着。」 (约翰福音 6:1-3)
    - type: paragraph
      text:
        ru: 'Божански пустињак: Господ Исус; и Његови ревносни сапустињаци: богочежњиви ученици. Пример како се теба удаљавати у гору, и тамо боравити: ради усредсређеног богомислија и молитве; ради неометаног решавања животних питања. Насамо са природом која упућује Богу. Она у многоме бољи посредник између човека и Бога, неголи људи. Мање греха на њој, и у њој него у човеку и на човеку; јер човек измислио и увео грех у њу, и наметнуо јој га, поробио је греху и смрти (Рим.8:19–22). Овде видимо и Спаситеља Божанског где проводи 40 дана у пустињи, живећи «са зверињем» (Мк.1:13) мирно и пријатељски; и оно Му је чак служило. А људи? – исмевали, пљували, тукли, били и убили. Није ли звериње несрављњено боље, питомије, богољубивије од људи?'
        cn: 神圣的隐士：主耶稣；以及祂热心的同隐修者：渴慕神的门徒。一个范例，教导人当如何退隐山中，并在那里居住：为了专注的默想神和祷告；为了不受打扰地解决生命中的问题。独自与大自然相处，它指引人归向神。它在许多方面是人与神之间更好的中介，胜过人类。在它身上和里面，罪恶较少，比在人身上和里面要少；因为人发明并将罪恶带入其中，并将其强加于它，使它臣服于罪和死亡（罗马书 8:19-22）。在此我们也看到神圣的救主在旷野度过四十天，与「野兽」同住（马可福音 1:13），平静而友善；它们甚至服事祂。而人类呢？——嘲笑、吐唾沫、殴打、鞭打并杀害了祂。难道野兽不是无可比拟地更好，更温顺、更爱神，胜过人类吗？
    - type: paragraph
      text:
        ru: '«Подигнувши Исус очи, и видјевши да мноштво народа долази к Њему, рече Филипу: Одакле да купимо хлеба да ови једу? А ово говораше кушајући га, јер сам знађаше шта ће чинити. Одговори Му Филип: Ни за двјеста динара хљеба није им доста, да свако до њих само мало добије. Рече Му један од ученика Његових, Андреј, брат Симона Петра. Овдје има једно момче које има пет хљебова јечмених и двије рибе. Али шта је то на толико мноштво?» (Ин.6:5–9)'
        cn: «耶稣举目看见许多人来到他跟前，就对腓利说：我们从哪里买饼叫这些人吃呢？他说这话是要试验腓利，他自己原知道要怎样行。腓利回答说：就是两百银币的饼也不够叫他们每人分得一点。他的门徒中有一个人，就是西门·彼得的兄弟安德烈，对他说：这里有一个孩童，带着五个大麦饼和两条鱼。只是分给这么多人，还算什么呢？» (约翰福音 6:5-9)
    - type: paragraph
      text:
        ru: 'У пустињи чудо са пет хлебова и две рибе; људи око пет хиљада. Несумњиво и истинито све, јер ниоткуда у пустињи не би могли наћи толики хлеб и толике рибе. Зато Спас и пита Филипа «кушајући га». А Филип сав остаје при немоћи људској: «где ћемо купити хлеба», толико хлеба? Све шго његово ограничено и беспомоћно сазнање људско зна, то је да је за толики свет потребно много, врло много хлеба. Таме се придружује и Андреја, још беспомоћнији: има пет хлебова и две рибе «али шта је то на толики свет». Значи: никаква људска средства и силе не помажу. Излаз: у Богочовека: «сам знађаше шта ће чинити». Шта? Божанском силом својом решити питање исхране толиких људи: умножити пет хлебова и две рибе.'
        cn: 在旷野里，五饼二鱼的神迹；人数约五千。一切都真实无误，确凿无疑，因为在旷野里，他们不可能从任何地方找到那么多的饼和那么多的鱼。因此救主就问斐利，「试探他」。而斐利则完全停留在人的无能中：「我们从哪里买饼呢」，那么多的饼？他的有限且无助的人类认知所知道的全部，就是对于这么多人来说，需要很多，非常多的饼。安德列也参与其中，他更加无助：他有五饼二鱼，「但这对于这么多人来说算得了什么呢」。这意味着：任何人类的手段和力量都无济于事。出路：在于神人：「他自己知道将要做什么」。什么？就是用他神圣的力量解决这么多人的食物问题：使五饼二鱼增多。
    - type: paragraph
      text:
        ru: '«А Исус рече: Реците људима да посједају. А бјеше траве много на ономе мјесту. Посједаше, дакле, људи на број око пет хиљада. А Исус узе хљебове и заблагодаривши, раздаде ученицима, а ученици онима који бијаху посједали; тако и од риба колико хтједоше. А када се наситише рече ученицима Својим: скупите преостале комаде, да ништа не пропадне. И сакупише, и напунише дванаест котарица комада од пет хљебова јечмених што преостаде иза оних који су јели.» (Ин.5:10–13)'
        cn: 「耶稣说：『叫众人坐下。』在那地方，草很多。于是众人坐下了，人数约有五千。耶稣拿起饼来，祝谢了，就分给门徒，门徒又分给那些坐着的人；鱼也照样，他们要多少就分给多少。他们吃饱了以后，耶稣对门徒说：『把剩下的零碎收集起来，免得有损失。』他们就收集起来，把那吃剩的五块大麦饼的零碎，装满了十二个篮子。」 (约翰福音 5:10-13)
    - type: paragraph
      text:
        ru: 'Он то и чини: узима хлебове, благосиља их и даје ученицима, а ученици народу. Тако и рибе. Ученици учествују заиста у једном божанском чуду: у њиховим рукама хлеб расте, умножава се, и уколико више дају народу утолико све више и остаје. Њих дванаесторица накупише од комада дванаест котарица; и то кад су људи не само јели него «и наситили се». Беспомоћне руке људске постају посредници умножења хлеба да би Спас показао њима да они могу божанском силом Његовом чинити и оно што је људима немогуће. Тако у свему, у свакој прилици. То и бива када се са потпуном вером и безграничним поверењем у Исуса врши све што Он наређује. У овом случају ниједан од дванаесторице није ое покавао ни маловеран, ни сумњало, јер ниједан од њихније рекао Исусу, који је је дао пет хлебова и две рибе: Шта то радиш? Како ћемо са пет хлебова нахранити пет хиљада људи! Та ми ћемо се осрамотити, јер ће хлеба битии за њих дваестину, и онда ће нам се они смејати и потсмевати! Не, ми то нећемо чинити, јер је неприродно и нелогично да тиме оволики свет нахранимо.'
        cn: 他就那样做：拿起饼，祝福它们，然后给门徒，门徒再分给众人。鱼也是如此。门徒们确实参与了一个神迹：在他们手中，饼生长，增多，他们分给众人越多，剩下的就越多。他们十二个人从碎块中捡满了十二个篮子；而且这还是在人们不仅吃了，「而且都吃饱了」之后。人类无助的双手成为饼增多的中介，以便救主向他们表明，他们借着祂的神圣力量也能成就人所不能的事。在一切事上，在每个场合，都是如此。这就会发生，当人怀着对耶稣完全的信心和无限的信任，行祂所吩咐的一切时。在这个事例中，十二门徒中没有一个人表现出小信或怀疑，因为他们中没有一个人对耶稣——那位给了五饼二鱼的——说：「你在做什么？我们怎么能用五块饼喂饱五千人呢！那样我们会蒙羞的，因为饼只够他们几十个人吃，然后他们会嘲笑和讥讽我们！不，我们不会这么做，因为用这些东西喂饱这么多人是不自然且不合逻辑的。」
    - type: paragraph
      text:
        ru: 'Још нешто: овим чудом Спас показао да је чудотворац зато што је Творац: Он је тај који умножава зрно пшенично и преображава га у многоплодни клас силом својом божанском преко «мртве» природе. Његове логосне силе, уњедреие још при стварању света у његову природу, стваралачки и животворно дејствују, и чудодејствују, творе, у ствари чудотворе. Разуман човек то чудо стално открива у природи, која није друго до непокварљива радионица у којој непрестано раде животворне сале логосне.'
        cn: 此外，救主借此神迹表明祂是创造奇迹者，因为祂是造物主：祂就是那藉着祂神圣的能力，透过「死寂的」自然界，使麦粒增多并将其转化为多产麦穗者。祂的逻各斯能力，早在创世时就已深植于自然界的本性之中，它们以创造性和赋予生命的方式运行着，并施行奇迹，实际上是在创造，在行神迹。有理性的人在自然界中不断发现这个奇迹，而自然界无非是一个永不朽坏的工场，其中永不停止地运作着赐予生命的逻各斯能力。
    - type: paragraph
      text:
        ru: '«А људи видјевши знамење које учини Исус говораху: Ово је заиста Пророк који треба да дође на свијет. А кад разумије Исус да хоће да дођу да Га ухвате и учине царем, Он отиде опет на гору сам.» (Ин.6:14–15)'
        cn: «众人看见耶稣所行的神迹，就说：这真是那要到世间来的先知！耶稣既知道他们要来强逼他作王，就独自又退到山上去了。» (约翰福音 6:14-15)
    - type: paragraph
      text:
        ru: 'Људи који су доживели ово чудо с правом доносе закључак да је Исус «Пророк који треба да дође на свет» = Месија. Али са једним погрешним додатком: да га зато учине царем. Јер је у савременика Спасових Јевреја, било погрешно схватање да Месија треба да буде и земаљоки цар. А Спас сав остаје изнад тога, у чисто божаиском схватању Месије и његавог спасоносног дела у свету: спасење света од греха, смрти и ђавола. То се не постиже никаквим «царским» земаљским силама и средствима, већ једино божанским, богочовечанским. Да је то могао учинити цар, онда би спасење света било поверено тако славном цару кар што је Давид. Пошто све то није тако, Спаситељ се уклања: «отиде опет у гору сам».'
        cn: 经历这个神迹的人们正确地得出结论，认为耶稣是「那将要来到世上的先知」 = 弥赛亚。但带有一个错误的附加条件：为此而立他为王。因为在救主时代的犹太人当中，存在一个错误的理解，认为弥赛亚也应是一位地上的君王。而救主则全然超乎其上，在对弥赛亚及其在世上救赎工作的纯粹神圣理解中：将世界从罪、死亡和魔鬼手中拯救出来。这并非通过任何「君王」的属地权势和手段所能成就的，而是唯独凭借神圣的、神人合一的方式。如果一位君王能够做到这一点，那么世界的救赎就会被托付给大卫那样荣耀的君王。既然这一切并非如此，救主便退去了：「又独自退到山上去了。」
  - type: heading2
    text:
      ru: Идење исуса по мору
      cn: 耶稣在海上的行走
    children:
    - type: paragraph
      text:
        ru: '«Када пак наста вече, сиђоше ученици Његови на море, и ушавпи у лађу пођоше преко мора у Капернаум. И већ бјеше пао мрак, а Исус не бјеше дошао к њима. А море се подизаше од великога вјетра. Пошто су, дакле, веслали око двадесет пет или тридесет стадија, угледаше Исуса како иде по мору и приблжава се лађи, па се предадоше. А Он им рече: Ја сам; не бојте се! И хтједоше Га узети у лађу; и одмах се лађа обрете на земљи у коју иђаху.» (Ин.6:16–21)'
        cn: «到了晚上，祂的门徒下到海边，上了船，往海那边迦百农去。那时天已经黑了，耶稣还没有到他们那里。又因起了大风，海就翻腾起来。他们摇橹约行了二十五或三十斯他第，看见耶稣在海面上行走，渐渐靠近船，他们就甚是惧怕。祂却对他们说：「是我，不要害怕！」他们就愿意接祂上船；船立时到了他们所要去的地方。」 (约翰福音 6:16-21)
    - type: paragraph
      text:
        ru: 'Заиста Исус влада целокупном природом: јуче умножава хлебове, ноћас иде по мору као по суву. За Њега је то сасвим природно, зато и вели ученицима, који се од тога беху уплашили: «Ја сам; не бојте се». Људи су дугом навиком, која је почела одмах после Адамовог пада у грех, изгубили власт над природом и контролу над њом. А имали су је од Бога у Његовом благослову: «рађајте се и множиге се, и напуните земљу, и владајте њоме». Како се влада земљом показује Богочовек: Њега безгрешног слуша и земља и море; значи: тако је слушала и безгрешног Адама све до његовог грехопада. Људска природа, када је безгрешна, располаже божаноким силама помоћу којих она влада земљом и свим што је на њој; грех осакаћује, раслабљује, потискује те силе, и човек постепено губи власт над њом, док је потпуно не изгуби и постане роб природе, тј. роб свога некадашњег роба. На то робовање прирпди људц су се толико навикли, да су све то прогласили за природно, одговара «природиим законима». А уствари то је једино неприродно у природи. Позив је и назначење је природе да служи човеку, само Божјем човеку. И она заиста и служи: ено у Христу Багу најочигледније, а затим и осталим христоносцима. Колико је подвижника ишло по води као по суву, почеиши од Апостола Петра…'
        cn: 确实，耶稣掌管着整个自然界：昨天他使面包增多，当夜他行走在海上如同走在旱地。对他而言，这完全是自然的，所以他对那些为此感到害怕的门徒们说：「是我；不要害怕。」人们因着长期的习惯，这习惯始于亚当堕入罪恶之后，失去了对自然的权柄和掌控。而他们曾从上帝那里，在他的祝福中拥有它：「生养众多，遍满地面，治理这地。」如何治理大地，神人（指基督）展示了出来：土地和海洋都听从他这位无罪者；这意味着，它们也曾同样听从无罪的亚当，直到他堕落犯罪。人的本性，当它是无罪的时候，掌握着神圣的力量，借此它掌管大地和地上的一切；罪使这些力量残缺、衰弱、受压制，人也逐渐失去对它的权柄，直到完全失去并成为自然的奴隶，也就是他曾经的奴仆的奴隶。对于这种对自然的奴役状态，人们已经习以为常，以至于他们把这一切都宣称为自然的，符合「自然法则」。然而实际上，这正是自然界中唯一不自然的。自然的呼召和旨意是服侍人类，只服侍上帝的人。而它确实也服侍着：看哪，在神基督身上最为明显，其次也服侍其他背负基督者。有多少苦修者在水上行走如同在旱地，从使徒彼得开始……
  - type: heading2
    text:
      ru: Учење Христово о себи као хлебу живота
      cn: 基督论自己为生命之粮的教导
    children:
    - type: paragraph
      text:
        ru: '«Исус им одговори и рече: Заиста, заиста вам кажем: не тражите Ме што сте знамења видјели, него што сте хљеба јели и наситили се. Трудите се не за јело које пролази, него за јело које остаје за живот вјечни, које ће вам дати Син Човјечији, јер овога потврди Бог Отац.» (Ин.6:26–27)'
        cn: 耶稣回答他们说：「我实实在在地告诉你们：你们找我，不是因为看见了神迹，而是因为吃了饼又吃饱了。不要为那必朽坏的食物劳力，却要为那存到永生的食物劳力，就是人子要赐给你们的，因为父神已经印证了祂。」 (约翰福音 6:26-27)
    - type: paragraph
      text:
        ru: 'Шта је важније: питање хлеба или душе? Несумњиво душе. Спаситељ то наглашује. Када би људи хтели да нахране своје душе, они би у Чудотворца тражили такву храну. Чиме се душа храни? Истином Божјом, и Правдом, и Милошћу, и Добротом, и Мудршпћу. То је њен хлеб, њена храна, њено непролазмо јело, «јело које остаје за вечни живот». Или боље: неиролазна храна душе је све што је Христово, тј. најпре Он сам, па затим целокупно Његово Еванђеље. Хранити себе том храиом, треба да је главна брига човека у авом свету. Зато Спас и вели: «Старајте се не за јело које пролази (=које пропада), него за јело које остаје за вечни живот, које ће вам дати Син Човечији, јер Овога потврди Бог Отац».'
        cn: 什么是更重要的：是关乎饼的问题还是关乎灵魂的问题？无疑是关乎灵魂的问题。救主强调了这一点。如果人们愿意滋养他们的灵魂，他们就会向行神迹者寻求那样的食物。灵魂靠什么滋养？靠着上帝的真理、公义、怜悯、良善和智慧。这就是它的饼，它的食物，它永不朽坏的粮食，「存到永生的食物」。或者更确切地说：灵魂永不朽坏的食物就是一切属于基督的事物，即首先是祂自己，其次是祂的全部福音。在这个世界上，用这食物滋养自己，应当是人类主要的关切。因此救主也说：「不要为那必坏的食物劳力，要为那存到永生的食物劳力，就是人子要赐给你们的，因为父上帝已印证了祂。」
    - type: paragraph
      text:
        ru: 'Све што је Христово очувава, конзервира биће човеково за живот вечни. Хранећи себе Христовом Истином, Љубављу, Правдом, човек се одједном осети вечним бићем, беамртним бићем, коме никаква смрт наудити не може. Јер никаква смрт не може уништити, умртвити оио што је Христово. Да, само на томе треба радити: јер Христос све Своје нуди човеку, само је потребан лични напор човеков да оно што је Христово учини својим, претвори у овоје. Попут телесне хране: као што телесна храна треба да се једе, свари, па тек онда пређе у крв и у животне сокове који одржавају тело, тако и духовна храна: Хрисгова Истина, Правда = Његово Еванђеље, треба да се једе, да се постепено претвара у крв наше душе, у њене животне силе. А све то претпоставља дуг и напоран посао, саморадњу. И када човек оно што је Христово подвизима претвара у своје, оно, зато што је бесмртно и вечно, и самог човека испуњује бесмртним и вечним, и он «остаје за живот вечни».'
        cn: '凡属基督的一切，都保守并维系着人的存有，使其进入永恒的生命。人以基督的真理、爱和公义滋养自身，便立刻感到自己是永恒的、不朽的存有，没有任何死亡能对其造成伤害。因为任何死亡都无法毁灭，或置凡属基督的于死地。是的，人惟独需要为此努力：因为基督将祂的一切赐予人，只须人付出个人的努力，使凡属基督的成为自己的，并将其转化成自己的。


          就像肉体的食物一样：正如肉体的食物需要被吃下、消化，然后才能转化为维持身体的血液和生命液，属灵的食物也是如此——基督的真理、公义，亦即祂的福音，需要被吃下，逐渐转化为我们灵魂的血液，成为其生命力。而这一切都预设了漫长而艰辛的工作，即自我操练。当人将凡属基督的，通过属灵的操练转化为自己的时候，凡属基督的，因为它是不朽和永恒的，也使人自身充满不朽与永恒，他便「存留直到永恒的生命」。'
    - type: paragraph
      text:
        ru: Све што није Христово, а човек тиме храни душу, храни је пропадљивом храном, која и душу чиии пропадљивом, уваљује је у смрт. Уствари, хран и душу отровом.
        cn: 凡不属基督的，而人却以此滋养灵魂，就是用败坏的食物滋养它（灵魂），这败坏的食物也使灵魂败坏，并将其拖入死亡。实际上，这是用毒药喂养灵魂。
    - type: paragraph
      text:
        ru: '«А они Му рекоше: Шта да чинимо да бисмо творили дјела Божија? Одговори Исус и рече им: Ово је дјело Божије да вјерујете у Онога кога Он посла.» (Ин.6:28–29)'
        cn: 「他们对祂说：我们当做什么才能行上帝的工呢？耶稣回答说：上帝的工就是叫你们信祂所差来的那一位。」 (约翰福音 6:28-29)
    - type: paragraph
      text:
        ru: 'Захтев је Богочовеков: човек треба да ради дело Божје у овом свету. Али како? «Шта ћемо чинити да радимо дела Божја» сва дела Божја своди на једно дело, сведело: веру у Богочовека. Сва остала дела Божја еманирају се из Тог свеизвора. А та су дела? Љубав божанска, Правда божанска, Истина божанска, и све уопшге божанско, односно богочовечанско, односно еванђелско. Дела Божја су – Еванђеље, и оно што оно тражи од људи. Испуњавати Богочовеково Еванђеље, ето то је испуњавати дела Божја. А тиме води, и у то уводи, вера у Богочовека: «ово је дело Божје да верујете у Онога кога од посла».'
        cn: 神人有此要求：人当在这世上行上帝的工。但是，如何行呢？「我们当做什么才能行上帝的工呢？」 将上帝所有的工归结为一项工作，一项总括性的工作：信入神人。所有其他上帝的工都从那个总源头流溢而出。而这些工作是什么呢？神圣的爱、神圣的公义、神圣的真理，以及一切普遍的神圣之物，换言之，是神人性的；换言之，是福音性的。上帝的工就是——福音，以及福音向人们所要求的。遵行神人的福音，这便是遵行上帝的工。而信入神人，引领人达致此，并使人进入此境：「上帝的工就是叫你们信那被派遣而来的那一位。」
    - type: paragraph
      text:
        ru: '«А они Му рекоше: Каав, дакле, знак ти показујеш да видимо и да ти вјерујемо? Шта ти чиниш? Оцеви наши једоше ману у пустињи, као што је написано: Хљеб са неба даде им да једу. Тада им рече Исус: Заиста, заиста вам кажем: није вам Мојсеј дао хљеб са неба него Отца Мој даје вам истинити хљеб са неба. Јер хљеб је Божији Онај који силази са неба и даје живот свијету.» (Ин.6:30–33)'
        cn: 「他们对祂说：『你显出什么神迹，叫我们看见就信你呢？你做什么事呢？我们的祖宗在旷野吃过吗哪，正如经上所记：「祂从天上赐下粮来给他们吃。」』于是耶稣对他们说：『我实实在在地告诉你们：赐给你们天上粮的不是摩西，而是我父把那真粮从天上赐给你们。因为神的粮就是从天上降下来赐生命给世界的。』」 (约翰福音 6:30-33)
    - type: paragraph
      text:
        ru: Томе сведелу води цели Стари Завет, на челу са Мојсијем. Јер је сав он припрема за Богочовека, (=руководитељ ка Христу) (Гал.3:24). А Христос, а вера у Њега, то је «истинити хлеб с неба»; «хлеб Божји». Њиме се храни оно што је Божје у човеку, и у свима Божјим створењима. Али «хлеб Божји» на првом месту јесге Личност Богочовека Хрисга, оно пгго Он по себи јесте и што са Собом доноси и даје свету. У најразличтијим облицима даје Он преко «хлеба Божјег» живот свету. Њиме живи, и ради Њега живи, све што је живо у свету. Као што на свету живот Њиме постаде, као што «Он беше живот» (Ин.1:4), тако Он и јесте живот, јер Он «даје живот свету».
        cn: 整个旧约，以摩西为首，都引向这光。因为旧约全部都是为神人做的准备（=引向基督的引导者）（加拉太书 3:24）。而基督，以及对祂的信仰，就是「从天上来的真粮」；「神的粮」。人里面属神的部分，以及所有神的受造物，都靠祂得滋养。但是，「神的粮」首先是神人基督的位格，祂本身所是以及祂亲自带来并赐予世界的。祂以最多种多样的形式，通过「神的粮」将生命赐予世界。世界上一切有生命的，都借由祂而活，并为祂的缘故而活。正如世上的生命借由祂而来，正如「祂是生命」（约翰福音 1:4），同样祂就是生命，因为祂「将生命赐予世界」。
    - type: paragraph
      text:
        ru: 'Речју: Богочовек је хлеб Божји, и тиме живот свету: «Јер је хлеб Божји онај који силази с неба и даје живот свету». Значи: живот на земљи је сав с неба, сав пореклом одозго, од Бога, од Богочовека. Овде је и сва логика живота, и сва сила живота, и сва вечиост живота – Богочовек Христос.'
        cn: 简言之，神人是上帝的粮，并以此赐生命予世界：「因为上帝的粮，就是那从天上降下来、赐生命给世界的。」（约翰福音 6:33）这意味着：地上的生命完全来自天上，完全发源于上方，源自上帝，源自神人。在此，亦是生命的全部逻辑，生命的全部力量，和生命的全部永恒——神人基督。
    - type: paragraph
      text:
        ru: '«А Исус им рече: Ја сам хљеб живота: који Мени долази неће огладњети, и који у Мене вјерује неће никад ожедњети.» (Ин.6:35)'
        cn: «耶稣对他们说：『我就是生命的粮。到我这里来的，永不饥饿；信我的，永不干渴。』» (约翰福音 6:35)
    - type: paragraph
      text:
        ru: 'Тајна живота је откривена цела по први пут у историји земље: «Исус им рече: Ја сам хлеб живота» који Мени долази неће огладнети, и који у Мене верује неће никад ожеднети». Глад и жеђ настаје за биће људско када се оно кроз грехе удаљује од Христа; удаљи ли се потпуно од Њега, та глад и жеђ изазивају смрт. А почетни грех је неверовање у Христа; из њега се разливају сви остали греси. Као што је «дело Божје», сведело – вера у Богочовека; таио је и дало ђавоље, сведело – неверје у Богочовека. Ђаво и смрт су синоними; Багочовек и живот су синоними. И још вера у Богочовека је живот; неверје у Њега је смрт трећега нити га може бити. И заиста, ко са ма којим проблемом живота приступи Богочовеку вером, налази у Њему потпуно и вечно решење, и занавек утољује ту глад своје душе. Тако и сваку духовну жеђ Богочовек гаси занавек. А та глад и жеђ духовна шгга су ако не: глад и жеђ душе људске за Правдом; Исшном, Љубављу, Добротом, Мудрошћу, бесмртношћу, вечношћу, блаженством, радошћу. Иако је Богочовек «хлеб живота», «хлеб Божји» који силази с неба, ипак Он никоме не намеће Себе, већ препушга то глади и жеђи људско, и слободи људској. Јер је ваистину велика и страшна слобода човекова: може слободно изабрати себи живот или смрт. И при свој очигледности да је Исус заиста Богочовек, заиста «Хлеб живота», људи по слободи својој одбацују Га, иако виде да је Он Богочовек.'
        cn: 生命的奥秘在地上历史上首次全然揭示出来：「耶稣对他们说：我就是生命的粮，到我这里来的，永不饥饿；信我的，永不干渴。」当人透过罪恶远离基督时，饥渴便临到人的存有上；若全然远离他，那饥渴便引致死亡。而最初的罪是不信基督；所有其他罪恶皆由此流散开来。正如「神的作为」可归结为——信神人；同样，魔鬼的作为可归结为——不信神人。魔鬼与死亡是同义词；神人与生命是同义词。再者，信神人即是生命；不信他即是死亡，无第三者，亦不可能有第三者存在。的确，任何带着生命中的任何问题，借着信心来到神人面前的人，都在他里面寻得完全且永恒的解决方案，并永远满足他灵魂的饥渴。同样，神人也永远熄灭所有属灵的干渴。而那属灵的饥渴，若不是以下这些，又是什么呢：即人类灵魂对公义、真理、爱、良善、智慧、不朽、永恒、至福与喜乐的饥渴。尽管神人是「生命的粮」、「从天而降的神的粮」，他却不将自己强加于任何人，而是将其交由人的饥渴和人的自由来决定。因为人的自由确实是伟大而可畏的：人可以自由选择生命或死亡。尽管有如此显而易见的证据表明耶稣确实是神人，确实是「生命的粮」，人们却凭着自己的自由拒绝了他，即便他们看见他就是神人。
    - type: paragraph
      text:
        ru: '«Него вам рекох: и видјели сте Ме, и не вјерујете.» (Ин.6:36)'
        cn: «但我对你们说过，你们已经看见了我，却不相信我。» (约翰福音 6:36)
    - type: paragraph
      text:
        ru: 'Зато и вели Својим сабеседницима: «Него вам казах да ме и видесте и не верујете». Видети Бога и неверовати у Њега, то је чисто људска специјалност. Ђаволи га виде, верују и дршћу. «Видесте мене» Бога, хлеб живота, хлеб Божји, и «не верујете».'
        cn: 因此，祂也对祂的对话者说：「但我告诉过你们，你们已经看见我了，却不相信。」看见上帝却不相信祂，这纯粹是人类的特性。魔鬼看见祂，相信祂，并且战栗。「你们看见我」——上帝，生命之粮，上帝的粮——「却不相信。」
    - type: paragraph
      text:
        ru: «Све што Ми даје Отац Мени ће доћи; и онога који долази Мени нећу истјерати напоље.» (Ин.6:37)
        cn: 「凡父所赐给我的人，必到我这里来；到我这里来的，我总不丢弃他。」 (约翰福音 6:37)
    - type: paragraph
      text:
        ru: '«Све што мени даје Отац, к мени ће доћи». То се односи на људе, јер одмах иза тога, и у вези са тим, Спас говори о људима који долазе к Њему. Ово (све) односи се на сву твар, на творевину, на природу. У творевини је много логосног, али и ванлогосног: греха, зла, смрти. У суштини својој твар је хрисгочежњива, њу и даје Бог Отац своме Сину, као Сину Човечјему; Њему се, и кроз Њега, човеку, људима враћа твар, добровољно потчињава Њему, слуша га (као море, ветрови). То је васпостављање допадних (пре човековог пада) односа измећу човека и твари човека и природе. Сва твар, «све» иде ка Христу, вуиу је к Њему њене иманитне логосне силе. На крају историје, сва ће се логосна творевина потпуно вратиги Господу Христу. Када се стара небеса и стара земља спасе, тј. када се спале на њима сви греси, сва зла, све смрти. Из тога ће изаћи ново небо и нова земља, тј. небо и земља логосни, очишћени од греха и смрти. На њима ће вечно и живети правда Божја.'
        cn: 「凡父所赐给我的人，都必到我这里来。」（约翰福音 6:37）这指的是人，因为紧随其后，并与此相关，救主谈论那些来到他这里的人。这（一切）指所有受造之物，指创造界，指自然。在创造界中，有许多合乎「道」的，但也有不合乎「道」的：罪恶、邪恶、死亡。在其本质上，受造物是渴望基督的，圣父将它赐予他的儿子，作为人子；受造物归向他，并通过他归向人、归向人们，自愿顺服于他，听从他（如同海洋、风）。这就是恢复人与受造物之间、人与自然之间美好的（在人类堕落之前的）关系。所有的受造物，「一切」都走向基督，将其拉向他的是其内在的合乎「道」的力量。在历史的终结，所有合乎「道」的创造界将完全归向主基督。当旧天旧地得救时，即，当其上所有的罪恶、所有的邪恶、所有的死亡都被焚尽时。从中将出现新天新地，即，合乎「道」的天与地，从罪恶和死亡中被洁净。在其上将永远居住上帝的公义。
    - type: paragraph
      text:
        ru: '«И који долази к мени нећу га исгерати напоље» – Ја, Син Божји и Бог на видику сам свима; по делима мојим сваки може видети ко сам; и буде ли добровољно дошао к Мени као таквом, нећу га истерати напоље. То важи за ове. Спас прима свакога, који му долази, макар натоварен и претешким гресима. По делима мојим ви видите да сам Бог («видесте и не верујете», ст. 36); као Бог ја имам све силе помоћу којих бих вас приморао да идете за мном, да верујете у мене. Али, вера је дело слободе човечје а не насиље оа стране Бога или ма кога. Вера је дело љубави према ономе што Ја као Богочовек доносим свету: Ко воли божанску Истину, божанску Мудрост, божанску Доброту, божанску Љубав, божански Живот, све што је Божје=Бога, тај се и одлучује на веру у Мене, као носиоца и раздаваоца свега тога. «Нећу га истерати напоље»: и заисга; није истерао покајаног разбојника, ни блудницу, ни Закхеја, ни цариника, нити икога од наведених грешника: ни Марију Египћанку, ни Мојсеја Мурина разбојника, ни безброј безаконика, блудника, лопова, среброљубаца, гордељиваца. Зашто? Зато шго су добровољко приступили Њему. Како? Покајањем. Јер покајање и јесте дело, најинтимније дело вере, дело душе верујуће.'
        cn: 「凡到我这里来的，我总不丢弃他。」我，上帝之子，亦是上帝，向众人显明；凡因我的作为，各人都能看见我是谁；若他甘心乐意地来到如此的我面前，我必不将他丢弃在外。这适用于这些人。救恩接纳每一个来到他面前的人，即便他们肩负着沉重的罪孽。借由我的作为，你们便可看见我是上帝（「你们看见了，却不相信」，约翰福音 6:36）；作为上帝，我拥有所有的权能，可以强迫你们跟随我，相信我。然而，信仰是人类自由的行为，而非出自上帝或任何一方的强迫。信仰乃是出于对我在神人身份中带给世界的一切的爱：凡爱慕神圣真理、神圣智慧、神圣良善、神圣之爱、神圣生命，凡爱慕一切属于上帝的，他便决定信靠我，我是这一切的承载者与施予者。「我必不将他丢弃在外」：这确实如此；他并未丢弃那悔改的强盗，也未丢弃那淫妇，也未丢弃撒该，也未丢弃那税吏，也未丢弃任何一位上述的罪人：他也没有丢弃埃及的马利亚，也没有丢弃强盗黑人摩西，也没有丢弃无数的恶人、淫乱者、窃贼、贪财者和骄傲自大者。为何如此？因为他们是甘心乐意地来到他面前。如何来到？藉着悔改。因为悔改正是一种行为，是信仰最深层的行为，是信者灵魂的行为。
    - type: paragraph
      text:
        ru: «Јер сам сишао с неба не да творим вољу Своју, него вољу Оца, који Ме посла. А ово је воља Оца који Ме посла, да све што Ми је дао ништа од тога не изгубим, него да то васкрснем у посљедњи Дан.А ово је воља Оца ко Ме посла, да сваки који види Сина и вјерује у Њега има живот вјечни; и Ја ћу га васкрснути у посљедњи дан.» (Ин.6:38–40)
        cn: «因为我从天上降下，不是要行我自己的旨意，乃是要行那差我来者的旨意。这差我来者的旨意就是：凡他所赐给我的，我一个也不失落，却要在末日叫他复活。这差我来者的旨意就是：叫一切看见子并信他的人得永生，并且我要在末日叫他复活。» (约翰福音 6:38-40)
    - type: paragraph
      text:
        ru: 'То што Син Божји ради: не истерује никога који долази к Њему, у пуној је сагласности са вољом Бога Оца. Много пута исмејан, поруган, гоњен, мучен, Исус је прави човек. Али, као човек, зар се не би могао због тога светити својим исмевачима, гониоцима, мучитељима? Не, јер Он није допгао да суди свету, него да спасе свет од онога што исмева, ружи, гони, мучи, оно шго је Божје и Бога; а то чини из човека и кроз човека грех. Њему се као правом човеку могла приписивати пристрассност, грешност воље, да би и то отклонио, Он вели: «Јер сиђох с неба не да чиним вољу своју, него вољу Оца који Ме посла». А воља Оца је: да ништа Син не изгуби од онога што му даде Бог Отац, него да васкрсне у последњи дан = спасе од греха, смрти и ђавола. У односу према људима Отац је сав љубав, сав човекољубље. А Син? Тиме'
        cn: '圣子所行的：不拒绝任何到他那里去的人，完全符合父神的旨意。

          许多次被嘲讽、讥诮、逼迫、折磨，耶稣是真正的人。但，作为人，难道他不能因此报复那些嘲讽他、逼迫他、折磨他的人吗？不，因为他来不是要审判世界，而是要将世界从那嘲讽、毁谤、逼迫、折磨神圣之事和神本身的事物中拯救出来；而那，就是从人里面产生并借由人而行的罪。

          作为真正的人，他可能被归咎于偏私，意志的罪性，为了排除这一点，他说：「因为我从天上降下，不是要行我自己的旨意，而是要行那差我来者的旨意。」

          而父的旨意是：圣子不失落父神所赐给他的任何一个，而是要在末日使他们复活 = 从罪、死亡和魔鬼中拯救出来。

          在对待世人方面，父全然是爱，全然的仁爱。

          那么圣子呢？借此'
    - type: paragraph
      text:
        ru: 'је Син што је исте природе са Оцем, исте воље, исте љубави, истог човекољубља: Он је дошао у свет да сваки који види Сина и верује у Њега, има живот вечни. Јер вера у Њега сједињује верујућег са Њим духовно, сједињује га са Његовим божанским силама, Исгином, Љубављу, Правдом, једном речју: са Његовим вечним животом. Те и верујући у Њега «има живот вечни», чим то доживи, још овде на земљи. Још нешто: Богочовек није своје Еванђеље спустио с неба на замљу, а Сам остао на небу, сакривен за очи људске.'
        cn: 是圣子，祂与父同性同体，旨意、爱和仁爱皆同：祂来到世上，好使凡看见圣子并相信祂的，都得永生。因为信靠祂，信徒在灵性上与祂结合，并与祂的神圣力量、真理、爱、公义结合；一言以蔽之：与祂的永恒生命结合。因此，凡信靠祂的，就「得享永生」，一旦他在地上就体验到这一点。还有一点：神人并没有将祂的福音从天上降到地上，而祂自己却留在天上，对人眼隐藏。
    - type: paragraph
      text:
        ru: 'У том случају људи би с правом одбацили Еванђеље као «књигу», као теорију, као збир мртвих прописа која није у стању да испуни земаљско биће као што је човек. Али супротно томе: Бог Логос је постао човек, постао видљив по животу земаљском, видљив по свима својим божанским савршенствима; људи у Њему, ако хоће могу да виде, и виде целога Бога, Његов вечни Живот, Његову Љубав, и Мудрост, и Свезнање, и Беомртност. И на основу виђенога, на основу онога што очима овојим расмотрише, и видеше, и рукама опипаше (1Ин.1:1), они се и одлучују на веру у Њега. Зато Спас то и наглашава: «сваки који види Сина = и верује у Њега, гша живот вечни»: тј. сваки има лично искуство, искуство и стварност моју му показују његове очи; а гледајући Исуса и Његова дела, шта људске очи могу видети у томе, ако не Бога и дела Божја? То Спас и хоће, да на томе, на виђеноме људи и заснивају своју веру у Њега као у Бога и Спаситеља. Али, људи, и видећи то својим рођеним очима, често пута не верују у Богочовека. То показује колика је слобода човвкова, и како је зла и богоборна. Види Бога, и неће га, одбацује га, не верује у Њега. А сваки који види Христа, и Бога и Спаса у Њему, и на томе заснива своју веру у Њега, и на тој вери свој живот у Њему, он заиста «има живот вечни». Никаква смрт већ нема власти над њим, нити ће имати. Зато Спас и вели: «И ја ћу га васкрснути у последњи дан»: тј. и његово тело савладаће вечну смрт, «другу смрт», и постаће вечно, и имаће живот вечни. Тако заиста Син «ништа» људско неће изгубити, већ ће целога чавека спасти од сваке смрти: васкрснути целога човека у последњи дан, и увести у божански живот вечни.'
        cn: 在那种情况下，人们就有理由弃绝福音，视其为「一本书」，一种理论，一堆死板的规条，无法满足像人这般属世的生命。然而与此相反，圣言（逻各斯）上帝成了人，在属世的生命中显而可见，在祂所有的神圣完美中显而可见；人们在祂里面，如果愿意，就能看见，并且看见整个上帝，祂的永恒生命、祂的爱、智慧、全知和不朽。并且基于所看见的，基于他们亲眼观察、亲眼看见、亲手触摸的（约翰一书 1:1），他们才决定信靠祂。因此，救主强调这一点：「凡看见子并信祂的人，就有永生」：亦即，每个人都有亲身经历，他的眼睛向他展示的经历和现实；而看着耶稣和祂的作为，人的眼睛还能看见什么，若不是上帝和上帝的作为呢？这正是救主所愿的，让人在此，在所看见的根基上，建立对祂作为上帝和救主的信仰。但是，人们即便用肉眼看见了这一切，却常常不信神人。这显明了人的自由是何等巨大，以及它是如何邪恶和反抗上帝的。他看见上帝，却不愿接受祂，弃绝祂，不信祂。而凡看见基督，并在祂里面看见上帝和救主，以此为基础建立对祂的信仰，并在那信仰之上建立在祂里面的生命的人，他就确实「有永恒的生命」。任何死亡都已不再对祂有权柄，也绝不会再有。因此，救主说：「我必在末日使他复活」：亦即，他的身体也将战胜永恒的死亡，「第二次的死亡」，并变得永恒，并且拥有永恒的生命。如此，子确实不会失去任何属人的「东西」，而是要将整个人从一切死亡中拯救出来：在末日使整个人复活，并引入神圣的永恒生命。
    - type: paragraph
      text:
        ru: '«Тада гунђаху Јудејци на Њега што рече: Ја сам хљеб који сиђе с неба. И говораху: Није ли ово Исус, син Јосифов, коме ми знамо оца и матер? Како, дакле, Он говори: С неба сам сишао? А Исус им одговори и рече: Не гунђајте међу собом. Нико не може доћи Мени ако га не привуче Отац који Ме посла; и Ја ћу га васкрснути у посљедњи Дан.У Пророцима је написано: И биће сви научени од Бога. Сваки који чује од Оца и научи, долази к Мени. Не да је ко видио Оца, осим Онога који је од Бога: Он је видио Оца.» (Ин.6:41–46)'
        cn: 「那时，犹太人因他（耶稣）说『我是从天上降下来的粮』而向他发怨言。就说：『这不是约瑟的儿子耶稣吗？他的父母我们岂不都认识吗？他怎么说「我是从天上降下来的」呢？』耶稣回答说：『你们不要彼此发怨言。若不是差我来的父吸引人，没有人能到我这里来；到末日我要叫他复活。在先知书上写着说：「他们都要蒙神的教训。」凡听见父的教训又学习的，都到我这里来。这不是说有人看见父，惟独从神来的，他才看见父。』」（约翰福音 6:41-46）
    - type: paragraph
      text:
        ru: 'Злољубиви савременици Господа Христа, и виде депа Његова, која су очигледно божанска, и не само не верују у Њега него вичу на Њега што рече: ја сам хлеб који сиђе с неба. Да су хтели, да ма које дело Христоо испитају до дна, они би на том дну наишли на самог Бога; и то би њихово срце окренуло Исусу. Али они својим пакосним христоборством одбацују себе далеко од Бога. А Спас? Он се труди да, показујући им дела Божја, помоћу тих дела их и привуче себи, и спасењу које Он доноси свету. Јер зашто је Отац послао Сина Свог у свет? – Да све привуче Себи, да свему на тај начин да живот вечни. Да помоћу божанских сила својих, које су у Сину Његовом, привуче све и Сину и Себи. Али богоборци то упорно неће, не желе. Зато Син и вели: «Нико не може доћи к Мени ако га не привуче Отац Који ме посла». Привуче помоћу бажанских блага и сила које ау у Сину тако очигледне за све људе, пошто је Он постао човек, да би на човечански начин учинио приступачним људима оно што је Божје, и Бога Самог.'
        cn: '心怀恶意的基督主的同代人，他们看到了祂明显是神圣的作为，却不仅不相信祂，反而因祂说：「我就是从天上降下来的粮」（约翰福音 6:41）而向祂叫嚷。如果他们愿意深入查考基督的任何一项作为，他们就会在那深处遇见神自己；这就会使他们的心转向耶稣。但是他们以其恶意的抵挡基督的行为，将自己远远地抛弃在神之外。


          然而救主呢？祂努力向他们显明神的作为，并借着这些作为吸引他们归向自己，归向祂带给世界的救恩。因为父为何将祂的儿子差遣到世上？——是为了将万有都吸引归向自己，以这种方式赐予万有永生。祂要借着祂神圣的力量——这些力量都在祂的儿子里面——将万有都吸引归向圣子和祂自己。


          但是那些抵挡神的人顽固地不愿，不希望如此。因此圣子也说：「若不是差我来的父吸引人，就没有能到我这里来的」（约翰福音 6:44）。祂借着神圣的宝藏和能力吸引人，这些在圣子里面对所有人都是如此显而易见的，因为祂成了人，好以人的方式使属神的一切，以及神自己，都能为人所亲近。'
    - type: paragraph
      text:
        ru: 'Питање и роптање Јевреја против Исуса је уствари роптање против старозаветних пророка, у које они тобож верују, јер: «у пророцима стоји написано, вели Спас: и биће сви научени од Бога. Сваки који чује од Оца и научи, доћи ће к мени». А сваки може чути од Оца и научити од Оца ко сам и шта сам преко пророка, преко светих и духоносних и богонаучених људи. Ко то научи – «доћи ће к мени», јер све то на разне начине доводи к мени. Сви виде Сина, јер је постао човек; Оца у суштини не види нико, само Син «који је од Бога» – Бог: Отац се да видети само у делима Својим и силама који су тако очигледни у Исусу Богочовеку. Али, то је доста за људско биће; То је максимум. Јер више од тога не би могла издржати, поднети људска природа.'
        cn: 犹太人对耶稣的质疑和抱怨，实际上是对他们假装相信的旧约先知的抱怨，因为，「正如救主所说，在先知书中记载着：『他们都要蒙神的教训。凡听见父的教训又学习的，就到我这里来。』」每个人都可以从父那里听到并从父那里学习我是谁、我所是，借着先知，借着圣洁的、被圣灵充满的、蒙神教导的人。凡学会这些的——「就到我这里来」，因为这一切都以各种方式将人引到我这里。众人都能看见子，因为祂成了人；在本质上，没有人能看见父，只有「从神而来」的子——神。父只能通过祂的作为和能力被看见，这些在神人耶稣身上是如此明显。然而，这对人类来说已足够；这是最大限度了。因为人类本性无法承受或忍受比这更多的。
    - type: paragraph
      text:
        ru: '«Заиста, заиста вам кажем: Који вјерује у Мене има живот вјечни.» (Ин.6:47)'
        cn: 「我实实在在地告诉你们：信我的人有永生。」 (约翰福音 6:47)
    - type: paragraph
      text:
        ru: 'Људи подносе визију Бога само опосредовану материјом. Тако и у Христу: Бога виде преко тела, преко материје, кроз «завесу» тела, не непосредно, јер је њихов вид неспособан да непосредно гледа Бога, суштииу Бића Његовог надбожанског. Бог се највише и најдубље може сагледати и видети само животом божанским, тј. ако човек живи божанском Истином, божанском Правдом, божаннском Љубављу, божанским Живогом=Богочовеком, Богочовековим Еванђељем. А таквом животу учи, у такав живот уводи, и кроз такав живот води само вера у Христа Бога, која значи апсолутно човеково поверење у Њега, предавање Њему свега себе са васцегаим делима, васцелим срцем, васцелом силом. Зато Спас не престаје одлучно тврдити: «Заиста, заиста вам кажем: Који верује у мене има живот вечни». Вера је сила која целога човека повраћа Христу Богу, преноси га у Бога, да Њиме и осећа и мисли и дела и живи.'
        cn: 人们唯独能承受借由物质中介的上帝异象。在基督里也是如此：人们藉着身体、藉着物质，穿透身体的「幔子」看见上帝，而非直接地，因为他们的视力无法直接观看上帝，即他那超神圣存有的本质。上帝唯独能被最高深地认识和看见，唯独借由神圣的生命，即如果人活出神圣的真理、神圣的公义、神圣的爱，活出神圣的生命=神人，活出神人的福音。唯独对基督上帝的信仰，才能教导人这样的生命，引入这样的生命，并引领人度过这样的生命。这种信仰意味着人对他绝对的信赖，将自己全然献给他，连同其全部行为、全心、全部力量。因此，救主坚定不移地宣告：「我实实在在地告诉你们：信我的人有永生。」信仰是一种力量，它使整个人归回基督上帝，将他带入上帝里面，使他藉着上帝而感受、思想、行动、并活着。
    - type: paragraph
      text:
        ru: «Ја сам хљеб живота» (Ин.6:48)
        cn: 我就是生命的粮 (约翰福音 6:48)
    - type: paragraph
      text:
        ru: 'Такав човек више није сам већ увек у Богу: његова мисао је богомисао, осећање – богоосећање, живот – богоживот. Мисао се храни Богом, увек корени Богом и врхуни Богом, зато се и претвара у богомисао; тако и осећање; тако и дела: тако сав живот човеков. Такав човек и осећа свим бићем да је Богочовек «хлеб живота»: мисао човекова када се Њиме храни, не умире, обесмрћује се, прешла је из смрти у живот, јер је постала богомисао; и њихово осећање исто тако, јер је посгало богоосећање; и њихов живот опет тако, јер је постао богоживот. Али све је то условљено Личношћу Богочовека Христа, не овим делом Његовим или оним; јер је «хлеб живота» Он Сам, у целокупној Својој Богочовечанској Личности, појави и стварности. Зато и изричито вели: «Ја сам хлеб живота».'
        cn: 这样的人不再是独自一人，而总是活在神里面：他的思想是神思想，感受是神感受，生命是神生命。思想以上帝为滋养，永远以上帝为根基，并以上帝为顶点，因此它也转化为神思想；感受亦然；行为亦然：人的整个生命都如此。这样的人甚至以他全部的存在感受，神人是「生命的粮」：当人的思想以上帝为滋养时，便不再死亡，而是获得不朽，它已从死亡进入生命，因为它已成为神思想；他的感受也一样，因为它已成为神感受；他的生命也如此，因为它已成为神生命。但这一切都以神人基督的位格为条件，而非他这一部分的作为或那一部分的作为；因为「生命的粮」是他自己，在他完整无缺的神人位格、显现和真实之中。因此，他也明确地说：「我就是生命的粮。」
    - type: paragraph
      text:
        ru: '«Оци ваши једоше ману у пустињи и помријеше. Ово је хљеб који силази с неба: да који од њега једе не умре. Ја сам хљеб живи који сиђе с неба; ако ко једе од овога хљеба живјеће вавијек; и хљеб који ћу Ја да ти тијело је Моје, које ћу Ја дати за живот свијета.» (Ин.6:49–51)'
        cn: 「你们的祖先在旷野里吃了吗哪，并且死了。这就是从天降下来的粮，使吃这粮的人不死。我就是从天降下的活粮；若有人吃这粮，就必永远活着；并且我将要给的粮，就是我的肉体，我要为世人的生命而舍。」 (约翰福音 6:49-51)
    - type: paragraph
      text:
        ru: 'Сва је сила тога хлеба живота да лечи од – смрти, дајући живот вечни. Тога хлеба нема на земљи, смрт га је онемогућила; Он у личности Богочовека «силази с неба» са јединим циљем: «да који од Њега једе не умре». Бог је постао човек, да би као човек дао људама средства и силе да савладају и победе смрт, хранећи се вечним животом, хранећи се хлебом живим. А то значи: хранећи се и живећи Хрисгом Богом, Његовим богочовечанским силама; Његовим богочовечанским Еванђељем. Као шго умире онај који се храни грехом, тако живи занавек онај који се храни Христом. Али, да се не би људи одвратили од Христа мислећи да Он непрестано говори о невидљивој вечној храни, Он им открива коикретну тајну вечног живота: она је сва «материјализована», овештаствљена у светом и безгрешном, али видљивом и опипљивом, телу Његовом – светом Причешћу. «Ја сам хлеб живи који сиће с неба; који једе од овога хлеба живеће вавек, и хлеб који ћу Ја дати тело је Моје које ћу дати за живот света». У Богочовеку, у телу Његовом је «живот света», а свуда наоколо је смрт света, агонија света, ропац и вечно умирање света без коначног издисаја.'
        cn: 这生命之粮的全部力量在于医治死亡，赐予永恒的生命。这面包地上没有，死亡使其无法存在；他以神-人的位格「从天上降下」，只有一个目的：「叫吃他的人不死」。上帝成为人，是为了作为人赐予世人战胜死亡的方法和力量，借由永恒的生命滋养自己，借由活粮滋养自己。这意味着：借由基督上帝，借由他神-人的力量；借由他神-人的福音，滋养自己并生活。正如那藉罪滋养自己的人会死去，照样，那藉基督滋养自己的人会永远活着。然而，为了不让人以为他总是谈论着不可见的永恒食物而远离基督，他向他们揭示了永恒生命的具体奥秘：这奥秘完全「具体化」、实体化在他的圣洁无罪、却又可见可触的身体中——即圣领圣体。「我就是从天上降下来的活粮；人若吃这粮，就必永远活着。我所要赐的粮就是我的肉，为着世人的生命所赐的。」在神-人里面，在他的身体里面，是「世界的生命」；而周遭的一切，是世界的死亡，世界的挣扎，临终的喘息声，以及永无止境、没有最终断气般的死去。
    - type: paragraph
      text:
        ru: '«А Исус им рече: Заиста, заиста вам кажем: ако не једете тело Сина Човјечијега и не пијете крви Његове, немате живота у себи. Који једе Моје тијело и пије Моју крв има живот вјечни; и Ја ћу га васкрснути у последњи дан.» (Ин.6:53–54)'
        cn: «耶稣对他们说：『我实实在在地告诉你们：你们若不吃人子的肉，不喝人子的血，就没有生命在你们里面。吃我肉喝我血的人，就有永生，在末日我要使他复活。』» (约翰福音 6:53-54)
    - type: paragraph
      text:
        ru: 'Конкретније средство за спасење света од смрти, и за живот света, нико није могао ни замислити, акамоли дагга, него што је то учинио Господ Христос. Бог и живот Божји се не може стварније дата нето Божјом крвљу и Божјим телом. А то баш Богочовек и даје људима, да би победили смрт а стекли живот вечни. Шта је живот људски? Храњење себе Богам, телом Божјим и крвљу Божјом. Без тога, нема живота људима; у њима је смрт, смрт, и само смрт. Тело и крв Христа су тело и крв Сина Човечјега, оваплоћеног Бога Логоса, а тиме су тело и крв Самог Бога Логоса, јер је Он зато и постао човек да и тело и крв и душу људску учини својим. Тако је тело Његово – тело Божје, крв Његова – крв Божја, душа Његова – душа Божја. Али притом и тело и крв и душа остају у границама и природи људокој, само су обожени. То нам Спас јасно казује: «Заиста, заиста вам кажем; ако не једете тела Сина Човечјега, и не пијете крви његове, немате живота у себи». И заиста ако човек не храни себе Господом Христом, ако не живи Њиме, нека уђе у себе и разгледа себе, и свуда ће у себи наићи на смрт, иа смртно, на пролазно. А почне ли себе хранити Господом Христом, Његовим светим телом и крвљу, светим силама и врлинама, осетиће како живот заструји у њему, и то живот вечни, у коме нема ничег смртног и који прогони сваку смрт из човека и све смртно и пролазно. «Логос постаде тело» (Ин.1:14), зато да се Њиме и телом хране људи, и на тај начин стекну живот вечни. Логос постаде тело да би људи, причешћујући се тим телом Бога Логоса, и сами постали сутелесници Његови (Еф.3:6), заједничари, причасници Његови: (Еф.3:6): и тако сав живот добијали од Њега; а од Њега се добија само живот вечни. То је у исто време и залог нашег васкрсења, тј. последње и коначне победе и тела нашег над смрћу. Спас је јасан у томе: «Који једе моје тело и пије моју крв, има живот вечни, и ја ћу га васкрснути у последњи дан». А у томе је божански смисао и назначење људског бића, свих људи уопште. Зато је та богочовечанска храна уствари једина права храна човекова, и Његова крв – једино право пиће човеково. Ако није тако, која је онда то храна, и пиће, који ће учинити човека вечним бићем и победником смрти?'
        cn: '没有任何人能够想象，更遑论给予，比主基督所行的更为具体的方法来拯救世界脱离死亡并赐予世界生命。上帝和上帝的生命，除了借由上帝的血和上帝的身体之外，不可能以更真实的方式被赐予。而这正是上帝-人赐予人类的，为要使他们战胜死亡并获得永生。什么是人类的生命？以上帝，借由上帝的身体和上帝的血滋养自己。没有它，人类就没有生命；在他们里面只有死亡，死亡，以及死亡。基督的身体和血是人子、道成肉身的上帝圣言的身体和血，因此也是上帝圣言自己的身体和血，因为祂正是为此才成为人，为要使人类的身体、血和灵魂都成为祂自己的。如此，祂的身体是上帝的身体，祂的血是上帝的血，祂的灵魂是上帝的灵魂。但同时，身体、血和灵魂仍保留在人类的界限和本性之内，只是它们已被神化。救主清楚地告诉我们：「我实实在在地告诉你们：你们若不吃人子的肉，不喝人子的血，就没有生命在你们里面。」（约翰福音 6:53）确实，如果人不用主基督滋养自己，如果不靠祂活着，就让他进入自身并审视自己，他会在自身各处遇到死亡、必朽坏和短暂之物。而如果他开始用主基督、用祂神圣的身体和血、神圣的能力和美德滋养自己，他将感受到生命如何在他里面涌流，而且是永恒的生命，其中没有任何必朽坏之物，这生命将死亡以及所有必朽坏和短暂之物从人里面驱逐出去。


          「道成了肉身」（约翰福音 1:14），因此人们可以借由祂和这身体滋养自己，并以此方式获得永生。道成了肉身，为要使人们借由领受上帝圣言的这身体，自己也成为祂的同体（以弗所书 3:6），成为祂的共同承受者、参与者：如此从祂那里获得全部生命；而从祂那里只能获得永生。这同时也是我们复活的保证，即我们身体最终和决定性地战胜死亡。救主对此是清楚的：「吃我肉、喝我血的人就有永生，在末日我要叫他复活。」（约翰福音 6:54）而这正是人类存在的（其）神圣意义和目的，是所有人类普遍存在的意义和目的。因此，这种上帝-人的食物实际上是人类唯一真正的食物，而祂的血是人类唯一真正的饮品。如果不是这样，那么哪种食物和饮品能够使人成为永恒的存在并战胜死亡呢？'
    - type: paragraph
      text:
        ru: «Јер тијело Моје истинско је јело, а крв је Моја истинско пиће. Који једе Моје тијело и пије Моју крв у Мени пребива и Ја у њему.» (Ин.6:55–56)
        cn: 「因为我的肉是真食物，我的血是真饮品。那吃我的肉、喝我的血的，住在我里面，我也住在他里面。」 (约翰福音 6:55-56)
    - type: paragraph
      text:
        ru: 'Зато је Спас у Божанском праву: «Јер је тело моје право јело и крв моја право пиће. Уствари свака друга храна је псевдохрана, и пиће псеудопиће, варљиви сурогати. Људи се хране њима, а хране се сенкама. Тело и крв Христова сједињују човека са Самим Богочовеком толико и тако присно и потпуно: да Богочовек живи у човеку, и човек у Богочовеку. Личност човекова се не само не губи, него добија у Христу своју савршену пуноћу и самосталност, своју бесмртност и вечност, само све то прожето, освећено, обожено богочовечанским силама Христовим. Стога Спас и вели: «Који једе моје тело и пије моју крв, обитава у мени и ја у њему». Увек се очувава начело богочовечанског саживота и сарадње: симбиозе и синергизма.'
        cn: 因此，救主以神圣的权柄而言：「我的肉是真粮，我的血是真饮。（约翰福音 6:55）事实上，任何其他食物都是伪食物，饮品都是伪饮品，都是欺骗性的替代品。人们以它们为食，却只以影为食。基督的身体和宝血将人与神人自身如此亲密而完全地结合，以至于神人住在人里面，人也住在神人里面。人的位格不仅没有失丧，反而通过基督获得了其完美的丰盛和独立性，其不朽和永恒，只是所有这一切都浸润、圣化、神化于基督的神人能力中。因此，救主又说：「吃我肉、喝我血的人，常在我里面，我也常在他里面。」（约翰福音 6:56）神人两性共生与合作的原则始终得以维系：即共生（symbiosis）与协同（synergism）。
    - type: paragraph
      text:
        ru: «Као што Мене посла живи Отац, и као што Ја живим због Оца, и онај који једе Мене и он ће живјети због Мене.» (Ин.6:57)
        cn: 「正如永活的父差遣了我，并且正如我因父活着，那吃我的人，他也要因我活着。」(约翰福音 6:57)
    - type: paragraph
      text:
        ru: 'Сав је живот од Бога и ради Бога. А сва је смрт од ђавола и ради ђавола. То свим бићем осећа Христов човек. Јер он осећа свом душом својом да све што је живо у њему, вечно живо – живо је Христом и због Христа; а све што је мртво – мртво је грехом, помоћу кога ђаво и изазива смрт у њему. Ова природа, сва сила, сва логика живота је од Бога; тако и све пројаве и варијанте живота. Али исто тако: сва природа, сва сила, ова логака смрти је од ђавола; тако и све пројаве и варијанте смрти. Живот је у суштини теономан и теоцентричан; а смрт је сва – ћавономна и ђавоцентрична. Богочовек живи «Оца ради», јер потпуно испуњује вољу Оца; тако и човек живи Христа ради, ако испуњује вољу Његову. Један је циљ живота и извор: Бог; једно је средство и сила живота: Свето причешће, живо тело и жива крв вечног живога Богочовека. Уствари, сав се живот креће између Бога и Богочовека; Он, у њима стоји, у њима и постоји; ван њих је смрт.'
        cn: '所有的生命都源于上帝，并为了上帝。而所有的死亡都源于魔鬼，并为了魔鬼。属基督的人以其整个存在感受着这一切。因为他以其整个灵魂感受着，在他里面所有活着的、永远活着的一切，都是藉着基督并为了基督而活着的；而所有死去的，都是因着罪而死去，魔鬼正是借此在他里面引发死亡。


          生命的整个本质、全部力量、全部逻辑都源于上帝；生命的一切显现和变体亦是如此。但同样，死亡的整个本质、全部力量、全部逻辑都源于魔鬼；死亡的一切显现和变体亦是如此。


          生命本质上是神律的、以上帝为中心的；而死亡则完全是魔鬼律法的、以魔鬼为中心的。神人因「为了父」而活着，因为他完全遵行父的旨意；同样，人若遵行基督的旨意，也便是为了基督而活着。


          生命只有一个目标和一个源头：上帝；生命只有一个方式和一种力量：圣餐，即永远活着的神人的活的身体和活的宝血。事实上，所有的生命都在上帝与神人之间运行；生命在他们之中得以站立，在他们之中得以存续；在他们之外便是死亡。'
    - type: paragraph
      text:
        ru: '«Ово је хљеб који сиђе с неба: не као што оци ваши једоше ману, и помријеше; који једе хљеб овај живјеће вавијек» (Ин.6:58)'
        cn: 「这是从天上降下来的粮，不像你们的祖宗吃了吗哪，还是死了；吃这粮的人将永远活着。」（约翰福音 6:58）
    - type: paragraph
      text:
        ru: 'Најзад је Спас открио сву тајну људског живота; она је у овоме: храна човекова је не само тело, и не само крв Христова, него Он сав као Богочовечанска Личност, јер Господ Христос вели: «Који једе Мене, и он ће живети Мене ради». Ово је еванђелски, богочовечански реализам. Од њега вема реалнијег ни емпиричнијег реализма. Богочавек је «хлеб који сиђе с неба»: јер све што је Собом донео, храна је, вечна храна за боголико биће људско: «Који једе хлеб овај живеће вавек». Значи: Богочовек је овде, на земљи, да би Га људи претворили у свој живот. А претварају Га ако се хране Њиме кроз свете тајне и свете врлине. На тај начин људи постају «уди тела Његова, од меса Његова, и од костију Његових» (Еф.5:30).'
        cn: 最终，救主揭示了人类生命的全部奥秘；这奥秘在于：人的食物不仅是基督的身体，也不仅是基督的血，而是祂作为神人位格的全部，因为主基督说：「吃我的，他也会因我而活。」这是福音性的、神人合一的实在论。没有比这更实在、更具经验性的实在论了。神人是「从天降下的粮」：因为祂所带来的一切，都是食物，是为神性般的人类生命提供的永恒食物：「吃这粮的人将永远活着。」这意味着：神人在这里，在地上，是为了让人类将祂融入他们的生命中。而如果他们通过圣事和圣德以祂为食，他们就能将祂融入自己的生命。如此，人们便成为「祂身体的肢体，是从祂的肉和祂的骨而出的」（以弗所书 5:30）。
    - type: paragraph
      text:
        ru: '«Ово рече у синагоги кад учаше у Капернауму. Тада многи од ученика Његових, чувпи то, рекоше: ово је тврда бесједа. Ко је може слушати?» (Ин.6:59–60)'
        cn: 祂在迦百农的会堂里教训人时说了这些话。那时，祂的许多门徒听见了这话，就说：「这是严厉的话语。谁能听得进去呢？」（约翰福音 6:59-60）
    - type: paragraph
      text:
        ru: 'До сада Спас открива тајну Богооваплоћења: шта значи она конкретно за спасење света од греха, смрти и ћавола: Бог Логос се оваплотио, да би се људи хранили Њиме, Његовом крвљу и телом, претворили их у своју природу, и тако Њиме – Вечним – потисли, савладали, сатрли у себи грех, смрт и ђавола, и тако стекли живот вечни. Нема сумње, ово је иовије од свега најновијег на свој планети. Али у томе се и састоји стварност спасења. У тој стварности је и апологија Богочовека, и Богочовечанског тела Његовог – Цркве. У томе је и изузетна, и сила, и свемоћ хришћанства. Јер је, по Њему, циљ и смисао: да сваки члан Цркве, човек, оваплоти у себи Бога хранећи се и живећи Њиме.'
        cn: 迄今为止，救主揭示了道成肉身的奥秘：它具体而言对拯救世界脱离罪、死亡和魔鬼意味着什么：圣言上帝道成肉身，是为了让人以祂、以祂的血和身体为食，将其转化为自身的本性，并藉着祂——这位永恒者——在自身内压制、战胜、粉碎罪、死亡和魔鬼，从而获得永生。毫无疑问，这比世上一切最新事物都更要新颖。但救赎的现实也正寓于此。在那现实中，也包含了神人的护教，以及祂神人一体的身体——教会的护教。在此之中，也蕴含着基督教的卓越、能力和全能。因为照祂而言，其目标和意义在于：教会的每一个成员，每一个人，藉着以祂为食并靠祂而活，在自身内使上帝道成肉身。
    - type: paragraph
      text:
        ru: 'Увек је, стога, истинита философија хришћанска, православна, светоотачка, чија је новина и (врх: Бог постаде човек, да би човек постао Бог. Стога и рефрен светоотачке философије хришћанства: «хришћани су богови по благодати». Разуме се, ово је тешко и за схватање и за веровање, ако се човек свим бићем не погрузи у ову тајну. Пример су први – сами слушаоци овоог Спасовог учења, његови ученици: «Ово је тврда беседа – Ко је може слушати?»'
        cn: 因此，基督教的、正教的、教父的哲学始终是真实的，其新颖之处和（顶点）在于：上帝成了人，是为了让人成为上帝。因此，教父基督教哲学的反复强调的主题是：「基督徒是因恩典而成为神的。」当然，如果人不用其全部生命沉浸于这奥秘之中，这既难理解，也难相信。第一个例子就是这救主教导的听众，祂的门徒们：「这话甚难，谁能听呢？」（约翰福音 6:60）
    - type: paragraph
      text:
        ru: '«А Исус, знајући у себи да ученици Његови ропћу због тога, рече им: Зар вас ово саблажњава? А шта ако видите Син Човјечијега да одлази горе гдје је прије био?» (Ин.6:61–62)'
        cn: 「而耶稣自己心里知道他的门徒为此事私下议论，就对他们说：『这事叫你们跌倒吗？那么，如果你们看见人子升到他从前所在的地方，又怎么样呢？』」 (约翰福音 6:61-62)
    - type: paragraph
      text:
        ru: 'А Спас на то? Не отступа од онога што је рекао, нигги ублажује, нити мења. Нацротив, Он продужава своје Еванђеље боговаплоћења, а то је спасења. И излази пред ученике са завршном тајвом оваплоћеног Бога Лотоса: оне у вазнесењу човечјег тела на небо и у вечни живот тела човечјег с десне стране Бога Оца. Ово је, нема сумње, још несхватљивије од силаска Бога Логоса у тело. Али сачињава једну живу целину са тим. Но, као пгго је очигледна сгварност: Син Човечји = Бог у телу, тако је круна те стварности: вазнесење Сииа Човечјег, тј. оваплоћеног Бога Логоса, на небо. Ту нема никакве «саблазни» за ум људски, ако хоће да дубоко размишља о основној дрироди и смислу бића људског и о основној тајни и циљу оваплаћења Бога Логоса. Али, то ум људски, и сав мислени апарат, може схватити, ако се одухови: ако пронађе прасуштину човековог духа: боголикост. Буде ли њу пронашао, и њоме размислио о главној тајни бића човекова, онда ће му јасно бити зашто се Бог Логос оваплотио, зашто је постао човек. А све док остане при чулности телесној, и све док буде човека и Бога мерио телесним мерилима, дотле му сва ова главна тајна остаје нејасна, «тврда», неусвојљива.'
        cn: '那么，救主对此呢？他不偏离他所说的话，既不软化，也不改变。相反地，他延续着他道成肉身（即救赎）的福音。他带着道成肉身的上帝圣言的最终奥秘呈现在门徒面前：即人的身体升入天堂，并与人的身体在上帝圣父的右边进入永恒的生命。毫无疑问，这比上帝圣言降入肉身（道成肉身）更难以理解。但它与此构成一个活生生的整体。然而，正如显而易见的事实是：人子 = 肉身中的上帝，同样，这个事实的巅峰是：人子，即道成肉身的上帝圣言，升入天堂。若人类心智愿深入思考人类存在的基本性质和意义，并思考上帝圣言道成肉身的基本奥秘和目的，那么对它而言，那里没有任何「绊脚石」。


          然而，如果人类心智和所有的思维机制被灵性化，它便能理解这一点：如果它能找到人类精神的原始本质——上帝的肖像。若它找到它（上帝的肖像），并借由它来思考人类存在的主要奥秘，那么它就会清楚地明白上帝圣言为何道成肉身，为何成为人。然而，只要它停留在肉体的感官性中，只要它用肉体的尺度来衡量人类和上帝，那么这所有主要的奥秘就仍然不清晰、「难以接受」、无法领会。'
    - type: paragraph
      text:
        ru: «Дух је оно што оживљава, тијело не користи ништа. Ријечи које вам Ја говорим дух су и живот су. Али има међу вама неких који не вјерују, јер знађаше Исус од почетка који су то што не вјерују, и ко ће Га издати.» (Ин.6:63–64)
        cn: 「叫人活着的乃是灵，肉体是无益的。我对你们所说的话，就是灵，就是生命。只是你们中间有不信的人，因为耶稣从起初就知道谁是不信的，谁将要出卖他。」 (约翰福音 6:63-64)
    - type: paragraph
      text:
        ru: 'То нам казују Спасове речи: «Дух је оно што оживљава, тело не помаже ништа: Речи које вам рекох, дух су и живот су». Дух је животворна сила, тј. логосна сила од које и у којој је сав живот свега што живи, па и самог бића човечјег: и душе, и ума, и срца, и воље његове. Ако се сав човек не улогоси и ологоси, остаје и слеп и глув за оно што сачињава изворну силу живота, а то је: Бог Логос, Богочовек. Но тај животворни дух садржи се баш у речима о Светом Причешћу човека Богочовеком, о храњењу и вечном живљењу човека Богочовеком, и све што је Спас о томе овом приликом рекао (Ин.6:26–58). Те су речи истовремеио «и дух и живот».'
        cn: 救主的话语告诉我们：「灵是使人活着的，肉体是无益的。我对你们所说的话，就是灵，就是生命」（约翰福音 6:63）。灵是赐生命的能力，即逻格斯（Logos）的力量，一切活物的全部生命，包括人自身的存在——他的灵魂、心智、心灵和意志——都源于它，也存在于它之中。如果整个人没有被逻格斯充满和转化，他就会对构成生命源初力量的一切，即神—逻格斯，道成肉身的神，保持又盲又聋。然而，这赐生命的灵正包含在那些关于人与道成肉身的神的圣餐、关于人通过道成肉身的神得以喂养和永远活着的话语中，以及救主在此场合所说的关于这一切的所有话语中（约翰福音 6:26-58）。这些话语同时是「灵，也是生命」。
    - type: paragraph
      text:
        ru: 'Чиме ће то човек осетити, сазнати? Вером у Богочовека, тј. поверењем у Њега, Који је очигледно, то дела Његова доказују, Син Божји, оваплоћени Бог Логос. Ко то не верује, не може да схвати ни Исуса ни учење Његово; све Његово за таквог човека остаје «тврда беседа». Стога је вера главно и једино средство Христопознања. Ту не помаже никакво рационализирање, дијелектизирање, софистикација, јер све то бежи од основне свечовечанске стварности: Богочовека, оваплоћеног Бога Логоса; а вера почиње тиме, шго ту чињеницу прво прима, а за њом и све што она собом доноси и претставља.'
        cn: 人要靠什么来感受、认识这一切呢？靠着对神人（即对祂的信赖）的信心，祂显然是——祂的作为证明了这一点——神的儿子，道成肉身的圣言上帝。凡不信此者，就不能理解耶稣和祂的教导；对这样的人而言，祂的一切都仍是「难以理解的话语」。因此，信心是认识基督的主要且唯一的途径。在此，任何理性化、辩证法或诡辩都无济于事，因为所有这些都偏离了人类根本的普世实相：神人，道成肉身的圣言上帝；而信心则始于首先接受那个事实，并随之接受它所带来和呈现的一切。
    - type: paragraph
      text:
        ru: '«И говораше: Зато сам вам рекао да нико не може доћи к Мени ако му не буде дано од Оца Мојега. Од тада многи од ученика Његових отидоше натраг, и више не иђаху с Њим.» (Ин.6:65–66)'
        cn: 「耶稣说：『因此我告诉你们，若非蒙我父的恩赐，没有人能到我这里来。』从那时起，祂的许多门徒退去了，不再与祂同行了。」(约翰福音 6:65-66)
    - type: paragraph
      text:
        ru: 'У тој чињеници, која је по своме значају и свеобимности божанској и човечанској, просто једина Свечињеница у роду људском, све је од Бога ра-ди човека; ту је присутно васцело Тројично Божанство свим својим божанским силама, јер се ради о смислу и свесмислу света, и у њему – човека, рода људског. На то указују речи Спасове: «Зато вам рекох да ншсо не може доћи к мени, ако му не буде дано од Оца мога». А даје се свакоме који хоће: ето и Јуди. Али, све зависи од слободне воље људске. Ево доказа: «Од тада многи од ученика његових отидоше натраг, и више не иђаху за Њим». «Оти доше натраг» – докле? До у своје раније ванхристовство, ванбоштво; а то – незнабоштво.'
        cn: 在这个事实中，它的意义和普适性是神圣且属人的，简直是人类中独一的至高实事，一切都从神而来，为了人；在那里，整个三一神性带着祂所有的神圣能力都在场，因为这关乎世界的意义和终极意义，以及在世界中的人，即人类。救主的这些话语指出这一点：「所以我对你们说，若非我父所赐，没有人能到我这里来。」（约翰福音 6:65）然而，这恩赐是赐给每一个愿意的人：看哪，甚至赐给了犹大。但是，一切都取决于人的自由意志。这里有证据：「从那时起，他许多的门徒退回去了，不再跟随他。」（约翰福音 6:66）「退回去了」——退到哪里？退回到他们从前的非基督状态，非神状态；那就是异教状态。
    - type: paragraph
      text:
        ru: '«А Исус рече Дванаесторици: Да нећете и ви да одете? Тада Му одговори Симон Петар: Господе, коме ћемо отићи? Ти имаш ријечи живота вјечнога. И ми смо повјеровали и познали да си Ти Христос Син Бога живога.» (Ин.6:67–69)'
        cn: 「于是耶稣对十二门徒说：你们也要去吗？西门·彼得回答祂说：主啊，我们往谁那里去呢？祢有永生之道。我们已经相信，又知道祢是基督，是永生神的儿子。」（约翰福音 6:67-69）
    - type: paragraph
      text:
        ru: 'Колико све зависи од слободне воље људске показује пример Дванаесторице: Исус их пита: «Да нећете и ви отићи?» Тада Петар одговори: «Господе, коме ћемо ићи? Ти имиш речи вечнога живота. И ми веровасмо и познасмо – да си ти Христос, Син Бога живога». Откривена је сва тајиа христопознања: вера: «ми веровасмо и познасмо». Поверовасмо гледајући Тебе, твоја дела, и видесмо у њима нешто необично, божанско, надљудско; и идући за Тобом убедисмо се да си Ти Христос- = Месија=Спаситељ, Син Бога Живога. Ми смо људи, тражимо трајни, нетролазни, вечни смисао свога бића, свога живота; тражипио бесмртност и вечност, бесмртни и вечни живот. Гледајући твоја дела, ми смо увидели да је у Њима све божанско, бесмртно и вечно, и кроз њих смо Тебе познали и сазнали да си Ти – Бог, Син Бога Живога, заиста Месија и Спаситељ. И слушајући Твоје речи, осветљене онаквим божанским делима, ми смо осетили и увидели да «Ти имаш речи вечнога живота». У све то «веровасмо», и кроз све то «познасмо» Тебе, ко си и шта нам доносиш. Нико од људи не пружа ништа ни приближно слично. Коме ћемо онда другоме ићи? Кад човек тражи бесмртни смисао овоме бићу, он мора доћи Теби и остати занавек са Тобом.'
        cn: 一切多么取决于人类的自由意志，十二门徒的例子就显明了这一点。耶稣问他们说：「你们也要离开吗？」彼得回答说：「主啊，我们还要归从谁呢？你拥有永生的话语。我们已经相信并认识了——你就是基督，永生神的儿子。」认识基督的全部奥秘都已揭示：信心：「我们已经相信并认识了。」我们相信，是因看见了你和你的作为，并在其中看到了非凡、神圣、超乎人性的东西；又因跟随你，我们便确信你就是基督——弥赛亚=救主，永生神的儿子。我们是人，寻求我们自身存在和生命的持久、不朽、永恒的意义；我们寻求不朽与永恒，不朽与永恒的生命。藉着观察你的作为，我们看出其中一切都是神圣、不朽和永恒的，并且藉着它们，我们认识了你，也得知你就是——神，永生神的儿子，真正的弥赛亚和救主。听闻你的话语，并因那些神圣作为的光照，我们感受到并领悟到「你拥有永生的话语」。对于这一切，我们都「相信了」，并通过这一切「认识了」你，认识你是谁以及你为我们带来什么。世人之中，没有任何人能提供哪怕是近似之物。那么，我们还能归从谁呢？当人寻求自身存在的不朽意义时，他就必须来到你面前，并永远与你同在。
    - type: paragraph
      text:
        ru: 'Без Тебе, ми смо људи – робље смрти, и гробље очајне бесмислености, безумља, лудила. Са Тобом, и уз Тебе, ми смо бесмртна, вечна, боголика бића, којима ни грех, ни смрт, ни ђаво, не могу наудити ништа. Вера у Богочовека увек се заснива само на чињеницама, ш «делима», и то Христовим делима; а њихова је стварност стварнија од сваке земаљске сгварности, и чињеничност животнија од свега живог. Апостол Петар, љубитељ чињеница, изјављује: «Ми вам не показасмо силе и доласка Господа наишпа Исуса Христа по бајкама вешто измишљеним, него сами видесмо славу Његову» (2Пет.1:16). А највећи тајнозналац, Св. Јован Богослов, изјављује: «Сведочимо вам и јављамо вам оно што чусмо, што очима својим, што расмотрисмо и руке наше: Реч живота», – а то је: «живот вечни». (1Ин.1:2). Значи: Наша се вера заснива на реалном и личном искуству, које је до сада опробано и посведочено од безброј Христових светитеља. Та вера проклијава, разлистава се, расцветава се у право христоиознање. Њоме познајемо уистини ко је и шта је Хрисгос. У хришћанској гносеологији увек врховно, руководно начело: «веровасмо и познасмо». Никако не обратно: познасмо па веровасмо. Ту чулни разум не помаже ништа. Ту се светлост богопознања запаљује и распаљује само личним доживљајима јеванђелских благовести. А доживљавање бива вером, која сва у поверењу према Христу: да Он има живот вечни, и стога има и «речи вечнога живота».'
        cn: 没有祢，我们是人——死亡的奴役，以及绝望的无意义、愚昧和疯狂的坟墓。与祢同在，并借着祢，我们是不朽的、永恒的、神性的存有，罪、死亡、魔鬼都不能伤害分毫。对神人的信仰，始终只基于事实，即「行为」，而且是基督的行为；它们的真实性比一切属地的真实性更真实，它们的实存性比一切有生命的事物更有生命力。使徒彼得，事实的爱好者，宣告说：「我们从前把我们主耶稣基督的大能和降临的事告诉你们，并不是随从巧妙编造的虚言，乃是亲眼见过祂的荣耀。」 (彼得后书 1:16) 而最大的奥秘知晓者，圣约翰·神学家，宣告说：「我们将那起初原有的生命之道，就是我们所听见、所看见、亲眼看过、亲手摸过的，传给你们。」——那就是：「永恒的生命」。 (约翰一书 1:2) 这意味着：我们的信仰建立在真实和个人的经验之上，这经验至今已被无数基督的圣徒所验证和见证。这信仰萌芽、生叶、开花，成为真正的基督认识。借着它，我们真实地认识到基督是谁、是什么。在基督教认识论中，始终是至高无上的指导原则：「我们相信并认识。」绝不是反过来：我们认识了才相信。在这里，感性理智毫无帮助。在这里，对神的认识之光唯有通过对福音的个人体验才被点燃并燃旺。而这种体验则通过信仰而发生，这信仰全然在于对基督的信任：即祂拥有永恒的生命，因此也拥有「永恒生命的言语」。
    - type: paragraph
      text:
        ru: '«А Исус им одговори: Не изабрах ли Ја вас дванаесторицу? И један од вас је ђаво. А говораше за Јуду Симонова Искариота, јер он намјераваше да Га изда, иако бјеше један од Дванаесторице.» (Ин.6:70–71)'
        cn: 耶稣回答他们说：「我不是拣选了你们十二个吗？但你们中间有一个是魔鬼。」他这话是指着西门的儿子加略人犹大说的，因为他将要出卖耶稣，他本是十二门徒中的一个。(约翰福音 6:70-71)
    - type: paragraph
      text:
        ru: Шта је у ствари човек који гледа божанска дела Христова и слуша божанске речи Његове, па ипак не верује у Њега, не признаје Га за Бога и Спаситеља? Ништа друго до ћаво. То није мој одговор, већ одговор самага Спаситеља. Јер он то вели за Јуду.
        cn: 一个人究竟是什么呢，他眼见基督的神圣作为，耳闻祂的神圣话语，却仍不信靠祂，不承认祂是神和救主？无非是魔鬼。这不是我的回答，而是救主自己的回答。因为祂是这样论及犹大的。
    - type: paragraph
      text:
        ru: Али то што важи за Јуду, важи за свакога који свесно и намерно неће да верује у Христа као Бога и Спаситеља.
        cn: 然而，那适用于犹大的，也适用于每一个有意识地、故意地不愿相信基督是神和救主的人。
  - type: heading2
    text:
      ru: Глава седма. Одлазак Христов у Јерусалим на празник сјеница
      cn: 第七章 基督前往耶路撒冷过住棚节
    children:
    - type: paragraph
      text:
        ru: '«И послије тога хођаше Исус по Галилеји; јер по Јудеји не хтједе да ходи, пошто тражаху Јудејци да Га убију. Бијаше пак близу јудејски празник Сјеница. Тада Му рекоше браћа Његова: Отиди одавде и иди у Јудеју, да и ученици Твоји виде дјела Твоја која чиниш. Јер нико не чини нешто у тајности, а сам тражи да је познат. Када тако што чиниш покажи се свијету. Јер ни браћа Његова не вјероваху у Њега. Тада им рече Исус: Вријеме Моје још није дошло, а вријеме је ваше свагда спремно. Не може свијет мрзити вас; а Мене мрзи јер Ја свједочим да су дјела његова зла. Ви отидите на овај Празник; Ја још нећу ићи на овај Празник, јер се Моје вријеме још није испунило. Рекавши им ово, остаде у Галилеји. А кад отидоше браћа Његова, тада и сам оде на Празник, не јавно, него као у тајности. А Јудејци Га тражаху о Празнику и говораху: Гдје је онај? И бијаху о Њему многе препирке у народу: једни говораху да је добар, а други говораху: не, него вара народ. Али нико не говораше јавно о Њему због страха од Јудејаца.» (Ин.7:1–13)'
        cn: 「此后，耶稣在加利利周游；因为祂不愿在犹太地周游，因为犹太人正在寻求杀害祂。当时，犹太人的住棚节临近了。于是祂的兄弟们对祂说：『你离开这里，往犹太去吧，好让你的门徒也能看见你所行的事。因为没有人暗中行事，却又自己寻求显扬。你若行这些事，就向世人显明自己吧。』因为连祂的兄弟们也不信祂。于是耶稣对他们说：『我的时辰还没有到，你们的时辰却常常是现成的。世人不能恨你们；却恨我，因为我指证他们的行为是邪恶的。你们去过这节期吧；我暂时不上去过这节期，因为我的时辰还没有满足。』耶稣对他们说了这些话，就仍留在加利利。祂的兄弟们上去过节以后，祂自己也上去了，不是公开地，而是如同暗地里一样。节期里，犹太人正在寻找祂，说：『那个人在哪里？』在民众中，关于祂有许多的议论：有些人说祂是个好人，另一些人说：『不，祂是迷惑百姓的。』但没有人公开谈论祂，因为害怕犹太人。」 (约翰福音 7:1-13)
    - type: paragraph
      text:
        ru: 'Колико је Спаситељ ненаметљив, колико жели да нико не поверује у Њега под притиском, или из страха, или механички, аутоматски, доказ су Његова браћа: «ни браћа Његова не вероваху у Њега». Он једино не жели: да учини насиље над слободом људском. Зато свакоме препушта да се слободно определи за или против Њега, и то на основу личног искуства. Свему има своје време. У божанском промишљању Свом о људима, Господ Христос устројава спасење људи на Своме човекољубљу и човековом христољубљу. Његово човекољубље увек бескрајно, увек ту, за свакога човека, али људи енмају потребно христољубље да би поверовали у Њега. Откуд то? Од злих дела. Зла дела људска израз су њиховог злољубља; а зло увек мрзи на добро; злољубље је сушти непријатељ христољубља, јер је христољубље – доброљубље. Господ Христос зна зашто свет који у злу лежи мрзи на Њега: «Свет мрзи на мене, јер ја сведочим за њ да су дела његова зла».'
        cn: 救主是何等的不强制，祂何等渴望无人因压力、恐惧、或机械式、自动地相信祂，祂的兄弟们就是明证：「连祂的兄弟也不信祂」。祂唯一不愿的，就是对人类的自由施加暴力。因此，祂让每个人都自由地选择支持祂或反对祂，并且是基于个人的经验。万事皆有其时。在祂对人类的神圣眷顾中，主基督基于祂的仁爱和人类对基督的爱来安排人类的救赎。祂的仁爱永远无限，永远在此，为每一个人，但人们缺乏必要的爱基督之心，以致无法相信祂。这是为何？源于恶行。人类的恶行是其爱恶之心的表现；而邪恶总是憎恨良善；爱恶之心是爱基督之心的本质敌人，因为爱基督之心就是爱善之心。主基督知道这卧在恶中的世界为何憎恨祂：「世界恨我，因为我指证它的行为是邪恶的。」
    - type: paragraph
      text:
        ru: 'Чиме то Спас сведочи? Самом појавом Својом: јер тек у светлости Његовој види се сва пагубност зла и величанственосг добра. Томе додати још и учење Његово, Еванђеље Његово. И с правом се може рећи: до Богочовека Христа људи уствари нису тачно знали шта је добро а шта зло. Он је богочовечанском светлошћу Својом први јасно осветлио граничну линију између добра и зла. Јер је демонска лукавост зла у томе што увек хоће да се ирокријумчари као добро, да се камуфлира, да се претстави као добро. И оно упорно и вешто брани себе. У свој светској изложби зла и добра, коју је Христос с краја на крај осветлио, људи су или уз добро или уз зло. Нарочито савременици Христови. Народ је у томе предњачио: осећао је да Хрисгос значи прелом и преврат у исгорији света, у исиорији живота. Отуда и толике распре око Њега у народу. Заиста се пророштво праведног Симеона испуњује на Њему: Он је «знак против кога ће се говорити» (Лк.2:34).'
        cn: 救主以何为证？以祂自身的显现为证：因为唯有在祂的光中，才能看清邪恶的一切害处，以及良善的恢弘庄严。再加上祂的教导，祂的福音。并且可以公正地说：在基督神人出现之前，人们实际上并不确切地知道什么是善，什么是恶。祂以自身神人的光，首次清晰地照亮了善与恶之间的界限。因为邪恶的魔性狡猾之处在于，它总是想要伪装成善，乔装打扮，把自己表现为善。而它顽固而巧妙地为自己辩护。在基督从头到尾照亮的善与恶的整个世界展示中，人们要么站在善的一边，要么站在恶的一边。尤其是基督的同代人。民众在这方面表现突出：他们感觉到基督意味着世界历史和生命历史中的一个转折点和一场剧变。因此，在民众中，围绕着祂也出现了如此多的争论。义人西缅的预言确实在祂身上应验了：祂是「一个被人反对的标记」（路加福音 2:34）。
  - type: heading2
    text:
      ru: Христос у храму
      cn: 基督在圣殿
    children:
    - type: paragraph
      text:
        ru: '«А већ у половини Празника дође Исус у храм и учаше. И чуђаху се Јудејци говорећи: Како овај зна књиге а није се учио? Тада им одговори Исус и рече: Моја наука није Моја, него Онога који Ме је послао. Ако хоће ко вољу Његову да твори, познаће да ли је ова нуака од Бога, или Ја сам од себе говорим.» (Ин.7:14–17)'
        cn: «到了节期，耶稣上殿里去教训人。犹太人就希奇说：这个人没有学过，怎么明白书呢？耶稣回答说：我的教训不是我自己的，乃是那差我来者的。人若立志遵着他的旨意行，就必晓得这教训或是出于神，或是我凭着自己说的。» (约翰福音 7:14-17)
    - type: paragraph
      text:
        ru: 'Откуда Христу онаква наука? Она ни по чему није школска, књижничка. Савременици су у недоумици, и у узбуђењу питају: «Како овај зна књиге а није се учио?» – Одговара им сам Господ: «Моја наука није моја, него Онога који ме је послао». Загледајте, да ли се разликује од науке Божје у Светом Писму. Зар не видите: она је сва од Бога. Ако је сва од Бога, онда: ко је Онај што је проповеда? Није ли посланик Божји, Месија? Није довољно само чудити се и дивити се Мојој науци, него треба пронаћи откуда Ми та наука. Да се то пронађе посгоји само један пут. А тај пут је ово: треба творити вољу Божју, и одмах ће ти се открити је ли ова наука од Бога. Воља Божја, ено је у Писму; хајде, твори је, и то ће те одвести сазнању, и ти ћеш дознати да је Моја наука заиста од Бога, заиста Божја по свему и свачему.'
        cn: 基督的教导从何而来？它绝非出自学堂，也非文士所授。同时代的人困惑不解，激动地问道：「这个人没有学过，怎么会懂书呢？」——主亲自回答他们说：「我的教导不是我自己的，而是那差我来者的。」你们仔细看，它与圣经中上帝的教导有何不同呢？难道你们没看到吗：它完全是来自上帝的。如果它完全来自上帝，那么：宣讲它的是谁呢？不正是上帝的使者，弥赛亚吗？仅仅惊奇和赞叹我的教导是不够的，还需要去探寻我这教导的来源。要探寻出这一点，只有一条路。而这条路就是：你们必须遵行上帝的旨意，这样，这教导是否来自上帝，就会立刻向你显明。上帝的旨意，看啊，它就在经文中；去吧，遵行它，这就会引领你获得认知，你就会知道我的教导确实来自上帝，确实在一切事上、在各方面都是上帝的。
    - type: paragraph
      text:
        ru: 'Све зависи од слободне воље човекове: само треба хтети. Да, само треба хтети творити вољу Божју и – све ће ти се откригги: дознаћеш сам својим личним опитом да је Моја наука од Бога. У свему Моме, и иза свега Мог, стоји Бог. Ништа Ја сам од себе не творим, већ што чујем од Оца: Он говори кроза Ме, и ја Њиме. У нас је једна суштина, једна воља, једна мудрост, једно еванђеље, једна истина, једна правда, једна наука. Све то проверити се може на један начин, на овај: «Ко хоће његову вољу творити, – сазнаће је ли ова наука од Бога или Ја сам од себе говорим»«. Опет: експериментални метод, опет пут личност опита и искуства; ништа се механички, аутоматски не намеће, најмање силом. Твори и – дознаћеш. Не твориш ли, увек остајеш у гробу мртвих теорија и бајки и претооставки: увек си онај мртвац кога треба осгавити мрттвима. И још: увек си, и остајеш, роб самољубља и славољубља.'
        cn: 一切都取决于人的自由意志：只需要立志。是的，只需要立志遵行神的旨意——那么一切都将向你显明：你将凭着你个人的经验亲自晓得，我的教导是出于神的。在我的一切之中，在我的一切背后，都有神。我自己什么也做不了，唯独我从父所听见的；他借着我说话，我也借着他。在我们里面有一个本质，一个意志，一个智慧，一个福音，一个真理，一个公义，一个教导。这一切都可以用一种方式来验证，就是这种方式：「人若立志遵行他的旨意，就必晓得这教导是出于神，还是我凭着自己说的。」又是实验的方法，又是个人试验和经验的道路；没有什么事物是机械地、自动地强加的，更不是凭着强力。去行，你就会明白。若不遵行，你就永远停留在死寂的理论、神话和假设的坟墓中：你永远是那个应该任凭死人去埋葬死人的人。还有：你永远是，并且仍然是自爱和爱慕虚荣的奴隶。
    - type: paragraph
      text:
        ru: «Који говори сам од себе, своју славу тражи; а ко тражи славу Онога који га је послао, тај је истинит и нема у њему неправде.» (Ин.7:18)
        cn: 「那凭着自己说话的，是求自己的荣耀；但那寻求差他来者的荣耀的，他就是真实的，在他心里没有不义。」(约翰福音 7:18)
    - type: paragraph
      text:
        ru: 'А самољубље и славољубље не чине правде Божје. Они се чак и не хруде да то чине, јер је биће њихово: живети и наслађивати се сластима које су саткане све од самољубивих жеља. А у њима нема Бога ни правде Божје. Онда нема ни истине. Славољубац увек све из себе испреда, из свог самољубља. А све је то и трагично, и пролазно, и смртно, и неправедно, и лажно. И право води у погибао и душу и тело. Не води ли нека људска наука Богу, знај: нема истине у њој, истине која се може одржати и пред смрћу, и не издахнути. А зар је истина – истина ако се не може одржати пред смрћу? Само је оно истина што надживљује смрт, тј. само оно што савлађује и побеђује и уништава смрт. А то је Христос, и све што је од Њега.'
        cn: '自爱和虚荣心不行神的义。他们甚至不屑于这样做，因为他们的本质就是：活在并沉溺于那些完全由自私的欲望所编织的享乐之中。而在其中，既没有上帝，也没有神的义。那么，也没有真理。


          贪慕虚荣者总是从自身，从他的自爱中编织一切。而这一切既是悲剧性的，也是转瞬即逝的，也是必朽的，也是不义的，也是虚假的。而且必然将灵魂和身体都引向灭亡。如果某种人类的学问不导向神，要知道：在其中就没有真理，没有那种能够经受住死亡考验而不消亡的真理。难道不能经受死亡考验的真理，还算真理吗？唯有那超越死亡的才是真理，也就是说，唯有能够克服、战胜并摧毁死亡的才是真理。而那就是基督，以及一切源自祂的。'
    - type: paragraph
      text:
        ru: 'Зато и нема истине ван Њега; зато је Он једини у роду људском смело и с правом објавио: «Ја сам Истина» (Ин.7:14). Све што чини, чини Богом ради спасења људи; чини ове у славу Божју, зато «Он је истинит, и нема у Њему неправде». – Истина и правда су близанци; исто тако: лаж и неправда су близанци. Ко славу своју тражи, ко је славољубив, – нема истине Божје у њему, ни правде.'
        cn: 因此，在祂以外没有真理；因此，唯有祂在人类中，勇敢且理直气壮地宣称：「我就是真理」（约翰福音 7:14）。祂所行的一切，都是藉着上帝为拯救人类而行的；祂行这些事是为了上帝的荣耀，因此「祂是真实的，在祂里面毫无不义。」——真理与公义是孪生子；同样地：谎言与不义也是孪生子。凡寻求自身荣耀的，凡贪爱虚荣的，——他里面就没有上帝的真理，也没有公义。
    - type: paragraph
      text:
        ru: '«Није ли Мојсеј дао вама Закон? И нико од вас не извршава Закон. Зашто тражите да Ме убијете? Одговори народ и рече: Демон је у теби; ко тражи да те убије? Одговори Исус и рече им: Једно дјело учиних, и сви се дивите томе. Мојсеј вам је дао обрезање, не што је оно од Мојсеја, него од отаца, и у суботу обрезујете човјека. Ако у суботу човјек прима обрезање, па се тиме не нарушава Закон Мојсејев, зашто се на Мене гњевите што цијелога човјека излијечих у суботу? Не судите по изгледу, него праведан суд судите.» (Ин.7:19–24)'
        cn: 「摩西岂不是将律法赐给了你们吗？你们中间却没有一个人遵行律法。为什么你们寻求杀我呢？」众人回答说：「你被鬼附了！谁寻求杀你呢？」耶稣回答说：「我只做了一件事，你们就都稀奇。摩西将割礼传给你们（其实不是从摩西来的，乃是从列祖来的），你们就在安息日给人行割礼。人若在安息日受割礼，摩西的律法就不被违背，为什么我在这安息日治好了一个完全的人，你们就向我发怒呢？不要凭外貌判断，乃要按公义判断。」（约翰福音 7:19-24）
    - type: paragraph
      text:
        ru: 'А Ја шта тражим? сигурно не славу своју, и сигурно не славу од вас. Све што радим, радим у славу Божју. Учиних једно дело у славу Божју: «свега човека исцелих у суботу», а ви – «тражите да ме убијете». Јер не знате истине Божје и правде Божје: субота је човека ради а не човвк суботе ради. Ви се обрезујете у суботу, и то не сматрате за грех; а грех је за вас шго ја исцелих човека у суботу. Обрезање је само символ духовног обрезања; а ја то духовно обр-зање, спасавање људи од греха и страсти и смрти већ спроводим: одсецам и одбацујем од њих све што је грешно, смртно, нечисто. Зато: «Не гледајте ко је ко кад судите, него праведан суд судите».'
        cn: 而我寻求什么呢？肯定不是我自己的荣耀，也肯定不是来自你们的荣耀。我所做的一切，都是为了上帝的荣耀。我做了一件事，是为了上帝的荣耀：「我在安息日治好了一个完全的人」，而你们——「却想杀我」。因为你们不知道上帝的真理和上帝的公义：安息日是为人设立的，人不是为安息日设立的。你们在安息日行割礼，却不认为那是罪；但对我而言，在安息日医治人，在你们看来却是罪。割礼仅仅是属灵割礼的象征；而我正在实施这属灵的割礼，拯救人们脱离罪、情欲和死亡：我从他们身上切除并弃绝一切罪恶的、必死的、不洁净的事物。所以：「你们判断的时候，不要看人的外貌，总要按公义判断。」
    - type: paragraph
      text:
        ru: '«Тада говораху неки од Јерусалимљана: Није ли то онај кога траже да убију? И гле, говори слободно и ништа Му не веле. Да стварно не познаше наши главари да је Он заиста Христос? Али овога знамо откуда је; а Христос када дође, нико неће знати откуда је. Тада Исус повика у храму учећи и говорећи: И познајете Ме и знате откуда сам; и сам од себе нисам дошао, него је истинит Онај који Ме посла, којега ви не знате. Ја Га знам, јер од Њега јесам, и Он Ме посла. Тада тражаху да Га ухвате, и нико не метну на Њега руку, јер још не бјеше дошао час Његов. А од народа многи повјероваше у Њега, и говораху: Када дође Христос, зар ће више знамења чинити него овај што учини?» (Ин.7:25–31)'
        cn: «那时，有些耶路撒冷人说：「这不就是他们想要杀的那个人吗？看哪，他坦然讲论，他们却什么也没对他说。难道我们的首领真的不知道他真是基督吗？但我们知道这个人是从哪里来的；基督来的时候，没有人会知道他从哪里来。」那时，耶稣在殿里大声教导说：「你们也认识我，也知道我从哪里来；我并不是凭着自己来的，而是那差我来的，他是真实的，你们却不认识他。我认识他，因为我本是出于他，也是他差了我来。」于是他们想要抓他，但没有人下手抓他，因为他的时候还没有到。但民众中有许多人信了他，就说：「基督来的时候，难道他所行的神迹会比这个人所行的更多吗？」» (约翰福音 7:25-31)
    - type: paragraph
      text:
        ru: 'Огреховљено људско сазнање се непрекидно труди да убеди себе како Исус није Христос, није Месија. Иако су Јерусалимљани из Пророка знали откуда је Христос, и откуда треба да буде, они тврде безочно како Исуса знају откуда је, «а Христос кад доће нико неће знати откуда је». Спас их онда упозорава на неистнитост њиховог тврђења. И додаје: да Он даје такве доказе о Себи које нико оспорити не може: Отац Га посла, Он је истинити = истинит је Онај који ме посла, и све је истина што је од Њега. Али они Га не примају због свог упорног грехољубља и злољубља. Јер Истинити се може познати и знати само Истином. Њега зна Онај који је од Њега: «Ја га знам, јер сам од Њега». Они који су себе отуђили од Њега гресима, не могу Га знати. А народ прости без лукаве софистике суди о Христу и Његовим делима; Он на основу дела Његогаих закључује да је Он Христос, «и многи га вероваху, и говораху: Кад доће Христос еда ли ће више чудеса чинити него овај што чини?».'
        cn: 被罪玷污的人类意识不断试图说服自己，耶稣不是基督，也不是弥赛亚。虽然耶路撒冷人从先知那里知道基督的来源，也知道祂应该来自何处，但他们厚颜无耻地声称，他们知道耶稣的来源，「而基督来的时候，没有人会知道祂是从哪里来的」。救主于是警告他们，他们的主张是不真实的。并补充说：祂给出关于自己的证据，无人能加以驳斥：父差遣了祂，祂是真实的 = 那差遣我的，是真实的，并且一切源于祂的都是真理。但他们不接受祂，是因他们执着地贪恋罪恶和贪恋邪恶。因为真实者唯有藉着真理，才能被认识和知晓。凡从祂来的，都认识祂：「我认识祂，因为我从祂而来。」那些藉着罪恶使自己与祂疏远的人，无法认识祂。然而，单纯的百姓没有狡诈的诡辩，论断基督及其作为；他们根据祂的作为得出结论，祂就是基督，「许多人就信了祂，说：基督来的时候，祂所行的神迹岂能比这人所行的更多吗？」
    - type: paragraph
      text:
        ru: '«Чуше фарисеји да народ о Њему тако говори, и послаше фарисеји и првосвештеници слуге да Га ухвате. Тада Исус рече: Још мало времена сам са вама, па идем Ономе који Ме је послао. Тражићете Ме и нећете Ме наћи; и гдје сам Ја ви не можете доћи. А Јудејци рекоше међу собом: Куда овај намјерава да иде, а да Га ми нећемо наћи? Не мисли ли ући у расијање јелинско и учити Јелине? Шта значи ова ријеч коју рече: Тражићете Ме и нећете наћи; и гдје сам Ја ви не можете доћи?» (Ин.7:32–36)'
        cn: 「法利赛人听见众人这样议论耶稣，法利赛人和祭司长就差遣差役去捉拿他。于是耶稣说：『我与你们同在的时候不多了，我将回到那差我来者那里。你们要寻找我，却找不着；我所在的地方你们不能到。』于是犹太人彼此说：『这人要往哪里去，叫我们找不着呢？难道他要往散居希腊人中间去，教训希腊人吗？他说的『你们要寻找我，却找不着；我所在的地方你们不能到』，这话是什么意思呢？』」（约翰福音 7:32-36）
    - type: paragraph
      text:
        ru: 'То је довољно, «и послаше фарисеји и главари свештенички слуге да га ухвате». Исус се не брани, али они ипак не могу да га ухвате, «јер још не беше дошао час његов» (сг. 30). Спаситељ им претсказује да ће им се и та жеља остварити, али не на њихову корист него у корист спасења света. Ухватићете ме, и убити Ме; али баш тада Ја ћу божанском силом Својом извршити спасење света: васкрснућу из мртвих и са телом узнети се на небо, тада: «где сам ја ви не можете доћи». Ви ме више нећете моћи убити.'
        cn: 这就够了，「法利赛人和祭司长差遣差役去抓捕他。」 耶稣没有自卫，但他们仍然无法抓捕他，「因为他的时刻还没有到。」（第30节）救主预言他们，他们的那个愿望也会实现，但并非对他们有利，而是为了世界的救恩的益处。你们会抓捕我，并杀害我；但就在那时，我将以我神圣的力量成就世界的救恩：我将从死者中复活，并带着身体升入天堂，那时：「我所在之处，你们不能到达。」 你们将无法再杀害我。
    - type: paragraph
      text:
        ru: '«А у посљедњи велики дан Празника стајаше Исус и повика говорећи: Ко је жедан нека дође Мени и пије! Који у Мене вјерује, као што Писмо рече, из утробе Његове потећи ће ријеке воде живе. А ово рече о Духу кога требаше да приме они који вјерују у Име Његово, јер Дух Свети још не бјеше дат, зато што Исус још не бјеше прослављен.» (Ин.7:37–39)'
        cn: 「在节期的末日，就是最大之日，耶稣站着，高声说：人若渴了，可以到我这里来喝！信我的人，就如经上所说，从他的腹中必流出活水的江河来。耶稣这话是指着信他名之人将要领受的圣灵说的；因为那时还没有赐下圣灵，因为耶稣尚未得着荣耀。」 (约翰福音 7:37-39)
    - type: paragraph
      text:
        ru: 'Смрт је опустошила људску природу, претворила је у пустињу: све што је живо у њој заразила је собом, испила, сасушила, и људска природа, знала то или не, ничег није тако жељна и жедна као живота. Отуда код људи толики страх од смрти и толика одвратност према смрти. Смрт се многовековним царовањем у људској природи толико уживела и саживела са људском природом, и људским сазнањем, да они мисле и сматрају да је смрт нешто природно за људе. Господ је први и једини показао и доказао да је за људе смрт нешто неприродно и нељудско, а живот вечни нешто природно и људско, једино природно и људако. Човак је у овоме свету зато да из њега теку реке воде живе. А то бива када се човек испуни Богом, Духом Светим. Јер Дух Свети потискује из човека смрт, уништава у њему све смртно, и претвара га у биће вечно и богочовечно, ради чега је човек и створен био од Бога.'
        cn: 死亡荒芜了人性，将其变为一片旷野：凡其内一切有生命的，死亡都以己身感染、吸尽、枯竭，而人性，无论知晓与否，对生命之渴慕与饥渴，无出其右。因此在人中对死亡有如此巨大的恐惧，以及对死亡如此巨大的厌恶。死亡以其在人性中数世纪之统治，如此深植并共存入人性与人的认知，以至于他们认为并相信死亡对人类而言是自然之事。主是第一位，也是唯一一位，显明并证明了对人类而言，死亡是不自然且非人性的事，而永生则是自然且人性的事，唯有它才是自然且人性的。人存在于此世，是为了有活水的江河流淌而出。而这发生于人被上帝、被圣灵充满之时。因为圣灵将死亡从人里面驱逐出去，毁灭他里面一切属乎死亡的，并将他转化为永恒且神人同在的生命体，这正是人由上帝所造的目的。
    - type: paragraph
      text:
        ru: 'А Духом Светим испуњује само вера у Христа Богочовека: у сав Његов богочовечански домострој спасења. Вера усељује Господа Христа у човека, а са Њим и Духа Светог. И заиста, онда потеку из човека «реке воде живе», тј. Дух Свети са Својом благодаћу и божанским даровима. И потекле су те реке воде живе на даи Свете Педесетнице из Светих Апостола, и непрестаио од тада теку из свих Христових духоносаца: светитеља и праведника; теку непрестано из Тела Богочовечанског Христовог: Цркве. Јер се од дана Свете Педесетнице Дух Свети налази у Цркви, и даје из Цркве и Црквом. Даје само онима који верују у Христа, по свеистинитој речи Спасовој: «Који верује у мене, из његова ће тела потећи (тачније: тећи) реке воде живе».'
        cn: 而圣灵的充满，唯独藉着对基督神人——以及祂神人一体的整个救赎计划——的信仰方可实现。信仰使主基督居住在人里面，而圣灵也随祂一同居住。那时，确实有「活水的江河」从人里面涌流出来，即圣灵带着祂的恩典和神圣恩赐。并且，这些活水的江河在圣五旬节那天从圣使徒们里面涌流出来；从那时起，它们也持续不断地从所有基督的圣灵承载者——圣者和义人——里面涌流出来；持续不断地从基督神人一体的身体——教会——里面涌流出来。因为从圣五旬节那天起，圣灵就存在于教会之中，并且借着教会并从教会中赐予。祂只赐予那些相信基督的人，按照救主完全真实的圣言：「信我的人，从他身体里必将涌流出（更确切地说：将要流出）活水的江河。」
    - type: paragraph
      text:
        ru: 'И поводом ових речи Спасових «постаде распра у народу ради Њега»: «подела» у народу, подвојеност: једии тврде да је пророк, други да је Христос, а трећи да није ни једно ии друго. А наки чак «хтедоше да га ухвате; али нико не метну руке на Њ». Зашто?'
        cn: 因着救主这些话语，在百姓中就「因着他起了争论」：在百姓中产生了「分裂」，意见不一：有些人坚称他是先知，另一些人坚称他是基督，而第三些人则坚称他既不是这个也不是那个。而有些人甚至「想要抓住他；但是没有人下手抓他。」为什么？
    - type: paragraph
      text:
        ru: '«Дођоше пак слуге првосвештеницима и фарисејима, и они им рекоше: Зашто Га не доведосте? Слуге одговорише: Никада човјек није тако говорио као овај човјек. Тада им одговорише фарисеји: Зар сте се и ви преварили? Вјерова ли ко у Њега од главара или фарисеја? Него народ овај који не зна Закон, проклет је! Рече им Никодим, који Му је долазио ноћу и бјеше један од њих: Еда ли Закон наш суди човјеку докле Га најприје не саслуша и дозна шта чини? Одговорише мму и рекоше: Да ниси и ти из Галилеје? Испитај и види да пророк из Галилеје не долази. И отидоше сваки дому своме.» (Ин.7:45–53)'
        cn: 「然而，差役们来到祭司长和法利赛人那里，他们对差役们说：你们为什么没有把他带过来？差役们回答说：从来没有人像这个人这样说话。于是法利赛人对他们说：难道你们也受了迷惑吗？难道有哪一位官长或法利赛人信他吗？只是这群不认识律法的百姓，是被咒诅的！尼哥底母，就是先前夜里来见耶稣的那位，也是他们当中的一人，对他们说：难道我们的律法，在没有先听他本人的陈述，并查明他所行的之前，就定一个人的罪吗？他们回答他说：难道你也是从加利利来的吗？你去查考，就会发现没有先知是从加利利出来的。于是他们各自回家去了。」 (约翰福音 7:45-53)
    - type: paragraph
      text:
        ru: 'Казују нам саме слуге главара свештеничких и фарисеја који су били послани да га ухвате. Они су саслушали ове шта Исус говори, вратили се својим господарима и на њихово пиггање: «зашто га не ухватисте»? одговарају: «Никада човек није тако говорио као овај човек». Зиачи: и они су осетили ону божанску силу и моћ у речима Спасовим, којима се не може одолети, нити им се супротставити. О томе се у Еванђељу каже: «Јер их учаше као онај који власт има, а не као књижевници» (Мф.7:29). Али фарисеји остају и даље уз своје пристрасне предрасуде о Исусу, које су прогласиле за истину о Исусу и одговарају слугама: «зар се и ви преваристе?».'
        cn: 那些被祭司长和法利赛人派去抓捕祂的仆人自己，告诉我们。他们听了耶稣所说的话，回到他们的主人那里。当他们的主人问：「你们为什么没有抓捕他？」他们回答说：「从未有人像这个人这样说话。」这意味着，连他们也感受到了救主言语中那神圣的力量和权柄，是无法抵挡，也无法对抗的。关于这一点，福音书中记载道：「因为祂教训他们，正像有权柄的人，不像他们的文士」（马太福音 7:29）。但是法利赛人仍然固守他们对耶稣的偏见，他们已将这些偏见宣称为关于耶稣的真理，并回答仆人们说：「难道连你们也被迷惑了吗？」
    - type: paragraph
      text:
        ru: 'Само Никодим чини обазриви изузетак: треба саслушати сваког и дознати шта чини, па онда доносити завршни суд о Њему.'
        cn: 唯有尼科迪姆作出了一个谨慎的例外：应当倾听每个人并查明他们所行的，然后才对他们做出最终的判断。
  - type: heading2
    text:
      ru: Глава осма. Христос и жена грешница
      cn: 第八章 基督和罪妇
    children:
    - type: paragraph
      text:
        ru: '«А Исус отиде на Маслинку гору. И ујутру опет дође у храм, и сав народ долажаше к Њему; и сједе и учаше их. А књижевници и фарисеји доведоше жену ухваћену у прељуби, и поставише је на средину. И рекоше Му: Учитељу, ова жена је ухваћена у прељуби на дјелу: а Мојсеј нам у Закону заповједи да такве каменујемо. Ти дакле, шта велиш? Ово пак рекоше искушавајући Га да би Га имали за што окривити. А Исус сагнувши се доље, писаше прстом по земљи. А кад Га упорно питаху, исправи се и рече им: Који је међу вама без гријеха нека први баци камен на њу. Па се опет саже доље и писаше по земљи. А они чувши то, и покарани од своје савјести, излажаху један по један, почевши од старјешина до посљедњих; и остаде Исус сам и жена стојећи на средини. А када се Исус исправи и не видјевши никога до саму жену, рече јој: Жено, гдје су они што те тужаху? Зар те нико не осуди? А она рече: Нико, Господе. А Исус јој рече: Ни Ја те не осуђујем; иди, и од сада више не гријеши.» (Ин.8:1–11)'
        cn: «耶稣却往橄榄山去。清晨他又回到圣殿，众百姓都到他那里去；他就坐下教训他们。文士和法利赛人带着一个行淫时被拿的妇人来，叫她站在中间。对他说：「夫子，这个妇人是正在行淫时被拿的：摩西在律法上吩咐我们把这样的妇人用石头打死。那么，你说该怎样呢？」他们说这话，是要试探耶稣，好得着告他的把柄。耶稣却弯下腰去，用指头在地上画字。他们还是不住地问他，耶稣就直起腰来，对他们说：「你们中间谁是没有罪的，谁就可以先拿石头打她。」于是他又弯下腰去，在地上画字。他们听见这话，就凭着自己的良心受到谴责，从年长的到年幼的，一个一个地都出去了；只剩下耶稣一人和那妇人仍然站在中间。耶稣又直起腰来，看着除了妇人以外没有人，就对她说：「妇人，那些控告你的人在哪里呢？没有人定你的罪吗？」她说：「主啊，没有。」耶稣说：「我也不定你的罪；去吧，从今以后不要再犯罪了。」» (约翰福音 8:1-11)
    - type: paragraph
      text:
        ru: 'У једном догађају – целокупно Еванђеље. Претпоставимо: изгубили се и нестали су потпуно сви новозаветни списи, од Матејевог Еванђеља до Јовановог Откривења, а остало само ових 11 стихова из осме главе Јовановог Еванђеља, само овај догађај, па би то било довољно да нам покаже да је Исус – Богочовек, и да је на најсавршенији начнн решио најтежи проблем људске савести и сазнања. Проблем: треба ли човека убијати због греха или не. Спаситељ га је решио као нико никада: човека треба одвојити од греха, никада га не изједначавати са грехом, него осудити грех а помиловати грешника, убити грех а очувати у животу грешника. Ниједан грех не може да обухвати целог човека, и да убије у њему све што је боголико и бесмртно. И највећи грешник ипак није сав греиган. Само му треба приступити богочовечанском љубављу и саучешћем: одвојити у њему тананим маказама еванђелског човекољубља грех од његове душе, од његовог бића, удаљити грех из њега, а њега третирати христовски нежно као реконвалесцента. А убијати грешника због греха, то је најзверскије решење проблема човека и греха.'
        cn: '在一个事件中——是整部福音书。


          假设：从马太福音到约翰的启示录，所有新约经文都已完全失落和消失，只剩下约翰福音第八章的这11节经文，只有这一个事件，那也足以向我们表明，耶稣是——道成肉身的神人，祂以最完美的方式解决了人类良心和认知的最艰难问题。这个问题就是：人是否该因罪被处死。救主以无人能及的方式解决了这个问题：人应该与罪分离，绝不可将人等同于罪，而是要定罪恶，却要赦免罪人；要灭绝罪恶，却要保全罪人的生命。


          没有一种罪能够完全占据整个人，也无法泯灭他里面所有神圣的、不朽的特质。即使是最大的罪人，也并非全然是罪恶的。我们只需以神人兼具的爱和怜悯来接近他：用福音书中的爱人如己之纤细剪刀，将他灵魂中、他本性中的罪剪除，将罪从他身上除去，并以基督般的温柔待他，如同待一个正在康复的人。而因为罪而处死罪人，那是解决人与罪之问题最残忍、最野蛮的方式。'
    - type: paragraph
      text:
        ru: 'У овом еванђелском догађају све је потресно и дирљиво: жену ухваћену у прељуби књижевници и фарисеји доводе пред Исуса: «Мојсије нам у закону заповеда да такве камењем убијамо; а ти шта велиш?» Кушање је јасно: изјасни ли се против Мојсија, значи: противник је Закона, и оптужићемо га због тога; а пристане ли да је каменујемо, онда – пропада ова Његова слава као свемилостивог човекољуупца и чудотворца.'
        cn: 在这个福音事件中，一切都令人震撼和感动：文士和法利赛人把一个犯奸淫被捕的妇人带到耶稣面前，说：「摩西在律法中吩咐我们，要用石头打死这样的人；那么你，你怎么说呢？」这试探是显而易见的：如果他表态反对摩西，那就意味着：他是律法的仇敌，我们就会因此控告他；但如果他同意用石头打死她，那么——他作为一位充满怜悯的爱人者和行神迹者的这份荣耀就会毁于一旦。
    - type: paragraph
      text:
        ru: 'У сваком случају: не може нам сад измаћи. А Исус? – «Саже се доле и писаше прстом по земљи»: земља сте, као да им вели, од земље сте, од праха сте, и све је у вама прашинско и прашњаво; загледајте у своје порекло кроз све претке до у Адама: све прах и пепео; сваки својим гресима осудио себе на смрт, и убијао; и по праху и иловачи тела вашег гамижу само греси. Јесте ли себе огледали у огледалу Мојсијевог Закона? Огледајте се; ко онда не заслужује смрт? О, колико је грехова у свакоме од вас! Колико зрнаца прашине у овом песку по коме ја прстом пишем сад. Ако није тако: «Који је међу вама без греха, – нека најпре баци камен на њу». «Па се опет саже доле и писаше по земљи»: ново еванђеље о односима према грешницима, а то значи: према свима људима. Ето, слободни сте: Каменујте је. Иако рекох што рекох, ја немам силе да вас натерам, нити хоћу, да учините по Мојим речима.'
        cn: 无论如何：她现在都逃不出我们的手掌了。那么耶稣呢？——「他弯下腰，用指头在地上写字」：你们是尘土，仿佛他对他们说，你们从尘土而来，从灰尘而来，你们里面的一切都充满尘埃，满是灰尘；审视你们从列祖直到亚当的根源：一切都是尘土和灰烬；各人因自己的罪判自己死刑，并不断杀戮；在你们身体的尘土和泥土上，只有罪恶在蠕动。你们可曾在摩西律法的镜子里照过自己？去照一照吧；那么，谁不配得死亡呢？哦，你们每个人里面有多少罪恶！就像我现在用指头写字的这片沙土上有多少尘沙颗粒一样。如果不是这样：「你们中间谁是没有罪的，谁就可以先拿石头打她。」（约翰福音 8:7）「他又弯下腰，在地上写字。」（约翰福音 8:8）这是一篇关于如何对待罪人的新福音，也就是说：关于如何对待所有人的新福音。你们自由了：用石头砸死她吧。尽管我说了我所说的，我没有能力强迫你们，也不愿意你们遵照我的话去做。
    - type: paragraph
      text:
        ru: 'Да, али је у њима пробудио ону утрнулу божанску силу – савест, и она ево чини своје: «А кад то чуше, и покарани будући од своје савести излажаху један за друггш почевши од старешина до последњих». Загледани у своје грехе, заборавише на грешницу; можда је се и не сетише, можда је и не видеше више од греха свог. «А Исус рече жени: Жено, где су они што те тужаху? Ниједан те не осуди? А она рече: ниједан, Господе. А Исус јој рече: Ни ја те не осућујем, иди, и више не греши»: не осуђујем тебе, божанско створење са боголиком душам, али осуђујем твој грех: «иди, и више не греши». «Ниједан те не осуди», јер ниједан није без греха. Што важи за њих, важи за све људе: ниједан није без греха. Ново Еванђеље, новина Новог Завета у овоме: спасавати грешника од греха, а не убијати га због греха. А када би се усвојило начело: убијати грешнике због греха; онда нико од људи не би остао, пошто су сви са многим гресима. А највише они који би то начело спроводили. Та људи сваким својим грехом каменују себе, убијају себе, врше самоубиство, сами на себе навлаче вечну смрт.'
        cn: '是的，但是他在他们心中唤醒了那麻木的、神圣的力量——良心，而它现在正在显明其作用：「他们听见这话，并且被自己的良心所责备，就一个一个地出去了，从年长的到最后的。」 他们凝视着自己的罪，忘记了那罪妇；也许他们根本没有想起她，也许他们因自己的罪，再也看不到她了。


          「耶稣对妇人说：『妇人，那些控告你的人在哪里呢？没有人定你的罪吗？』她回答说：『主啊，没有。』耶稣说：『我也不定你的罪。去吧，从今以后不要再犯罪了。』」 我不定你的罪，你这拥有神性灵魂的神圣受造物，但我谴责你的罪行：「去吧，从今以后不要再犯罪了。」 「没有人定你的罪」，因为没有人是没有罪的。 这对他们适用，对所有人都适用：没有人是没有罪的。


          新的福音，新约的新颖之处在于此：拯救罪人脱离罪恶，而不是因罪而杀害他。而如果采纳这项原则：因罪而杀害罪人；那么人类中将无人能存留下来，因为所有人都背负着许多罪。而最甚者，是那些实行这项原则的人。人们啊，他们的每一个罪行都在用石头砸自己，都在杀害自己，都在自杀，都在自己身上招致永恒的死亡。'
    - type: paragraph
      text:
        ru: 'А Христос сав у овоме: спасти људе од греха, као једине силе која производи и рађа смрт у свету човечанском. Спасавајући их од греха, Он их истовремено спасава од смрти. «Више не греши»; а то: обесмрти себе. Чиме? еванђелским врлинама, испуњавањем Божјих заповести. Јер више нећеш грешити ако душу испуниш богочежњивим осећањима, мислима, расположењима. Заволиш ли Бога, омрзнућеш грех. То је сигурно; то је најсигурније, и по томе ћеш познати да си на Еванћелском путу који кроз Истину води у бесмртност и живот вечни.'
        cn: 而基督的全部就在于此：将人从罪中拯救出来，因为罪是唯一在人类世界中产生并孕育死亡的力量。拯救他们脱离罪，他同时拯救他们脱离死亡。「不再犯罪」；而这意味着：使自己不朽。借着什么？借着福音的美德，借着履行上帝的诫命。因为如果你以渴慕上帝的情感、思想、心境充满灵魂，你将不再犯罪。如果你爱上帝，你将憎恨罪。这是确定的；这是最确定的，凭此你将认识到你是在福音的道路上，这道路借着真理引向不朽与永生。
  - type: heading2
    text:
      ru: Реч Христова о себи као истинском месији
      cn: 基督论及祂自己作为真正弥赛亚的话语
    children:
    - type: paragraph
      text:
        ru: '«Исус им опет рече, говорећи: Ја сам свјетлост свету; ко иде за Мном неће ходити у тами, него ће имати свјетлост живота.» (Ин.8:12)'
        cn: «耶稣又对他们说：「我是世界的光；跟从我的，就不在黑暗里行走，却要得着生命的光。」» (约翰福音 8:12)
    - type: paragraph
      text:
        ru: 'Све даље у осмој глави није друго до Спасово објашњење Његовог поступка са блудницом: «Исус им пак опет рече: Ја сам светлост света, ко иде за мном, неће ходити по тами, него ће имати светлост живота». «Светлост света» обасјава све што је у свету од врха до дна; обасјава од врха до дна и свакога човека, и ове што је у њему; тек помоћу те светлости човек може сагледати рве што је у њему: и зло и добро, и смртно и бесмртно, и, ђаволско и божанско. А дотле, без те светлости, човек нити зна себе, ни свет сжо себе; нити види себе ни свет ако себе. Он заиста ходи по тами. Само идући за Христом човек види себе и свет. Јер када «Светлост света» уводи и води човека кроз свет, онда су све тајне свега откривене пред њим. Исто тако та «Светлост» уводи човека и у тајну живота и показује му је у свима њеним божанским бескрајностима. Само вером Личношћу Богочовека човек сазнаје прави смисао живота и види његов логосан, божански циљ, и дубине, и висине, и ширине. Зато је опет Богочовек и «светлост живота».'
        cn: 第八章后面的所有内容无非是救主解释他对待淫妇的行为：「耶稣又对他们说：『我是世界的光；跟从我的，就不在黑暗里行，却要得着生命的光。』」 「世界的光」照亮世上的一切，从上到下；它从上到下照亮每一个人，以及人里面的一切；唯有借着这光，人才能看清自己里面的一切：邪恶与良善，必死的与不朽的，以及属魔鬼的与属神圣的。而在此之前，没有这光，人既不认识自己，也不认识自己周围的世界；既看不见自己，也看不见自己周围的世界。他确实行在黑暗中。唯有跟从基督，人才能看见自己和世界。因为当「世界的光」带领人穿越世界时，那么一切事物的奥秘都向他显明了。同样地，这「光」也将人引入生命的奥秘，并向他展示这奥秘在其所有神圣的无限性中。唯有通过信赖神人的位格，人才能认识到生命的真正意义，并看到其逻各斯式的、神圣的目的，以及它的深度、高度和广度。因此，神人也是「生命的光」。
    - type: paragraph
      text:
        ru: 'Све друге «вере» човечанства и човека, воде човека «по тами», којој нема краја и из које нема излаза. У тој тами се људа гуше, и слепе, и спотичу, и падају и у поноре пропадају. Само као вечни живот Богочовек је «светлост живота», коју никаква тама смрти не може ни обузети ни угасити. А таму лучи грех и разлива је по човековом бићу. Смрт пак, то је згуснут, сасирен, скамењен прех и греси. А иза њих стоји отац – ђаво. И као што Богочовек с правом вели за Себе: «ја сам светлост света», тако би ђаво могао с правом рећи: «ја сам тама света».'
        cn: 所有其他人类的「信仰」，都把人引向那没有尽头、也无处可逃的「黑暗」。在那黑暗中，人们窒息，失明，绊跌，坠落，并落入深渊。唯有作为永恒生命的道成肉身者是「生命之光」，没有任何死亡的黑暗能吞噬或熄灭它。而罪愆则散发黑暗，并将其倾泻于人的整个生命之中。至于死亡，那便是浓缩、凝固、石化的罪愆与罪孽。而在它们背后，站着那父——魔鬼。正如道成肉身者理所当然地为自己宣告：「我就是世界的光」，魔鬼也同样可以理所当然地说：「我就是世界的黑暗」。
    - type: paragraph
      text:
        ru: '«Тада Му рекоше фарисеји: Ти сам за себе свједочиш; свједочанство Твоје није истинито. Исус одговори и рече им: Ако Ја и свједочим за самога Себе, истинито је свједочанство Моје, јер знам откуда дођох и куда идем; а ви не знате откуда долазим и куда идем. Ви судите по тијелу, Ја не судим никоме. Али ако Ја и судим, суд је Мој истиит, јер нисам сам него Ја и Отац који Ме посла. А у Закону вашему стоји написано да је свједочанство двојице људи истинито. Ја сам Онај који свједочи за себе, и сједочи за Мене Отац који Ме посла.» (Ин.8:13–18)'
        cn: '于是法利赛人对祂说：「你为你自己作见证，你的见证不真。」


          耶稣回答说：「我虽然为自己作见证，我的见证还是真的，因为我知道我从何而来，往何而去；你们却不知道我从何而来，往何而去。你们是按外貌判断人，我却不判断任何人。即使我判断，我的判断也是真的，因为我不是独自一人，乃是我与差遣我来的父同在。并且在你们的律法上写着，两个人的见证是真的。我是为自己作见证的，也有差遣我来的父为我作见证。」（约翰福音 8:13-18）'
    - type: paragraph
      text:
        ru: 'Фарисеји заиста гледају а неће да виде да је Христос ваистину светлост света и светлост живота. Да, злонамерно неће да виде када гледају поступак Исусов према блудници, – то громовско чудо, не само доказ, него и сведоказ и свесведочанство о Исусовом Божанству и Богочовечанству. Они и даље безочно говоре Спаситељу: «Ти сам за себе сведочиш; сведочанство твоје није истиншо». Они неће да виде: да ни у једном делу Свом Хрисггос није сам; нити је Он у личности у бићу Свом сам, већ увек са Оцем Својим, нераздвојан са Њим и по бићу и у акцији. Зато Он одлучно тврди: «Нисам сам, него ја и Отац који ме посла». Зато је и сведочанство Моје увек сведочанство двојице, и то какве двојице? Двојице од Свете Тројице. Зато је оно увек истинито; зато је и суд мој – истинит. Ви Мене не признајете; а Бога Оца признајете? Ако бисте Га признавали, ви бисте мене кроз Њега познали и признали, јер Он «сведочи за Мене».'
        cn: 法利赛人确实观看，却不愿看见基督确实是世界之光，是生命之光。是的，当他们观看耶稣对待那淫妇的行为时——那雷霆般的奇迹，不仅是证据，更是耶稣神性与神人性的见证与完全的见证——他们恶意地不愿看见。他们仍然厚颜无耻地对救主说：「你为自己作见证；你的见证不是真实的。」他们不愿看见：基督在祂的任何一项工作中都不是独自一人；祂在位格和祂的存在中也不是独自一人，而是始终与祂的父同在，无论是在存在上还是在行动上都与祂密不可分。因此祂坚定地宣称：「我不是独自一人，而是我与那差我来的父同在。」因此我的见证始终是两个人的见证，而且是怎样的两个人呢？是圣三一中的两位。因此那见证始终是真实的；因此我的审判也是真实的。你们不承认我；难道你们承认父神吗？如果你们承认祂，你们就会藉着祂认识并承认我，因为祂「为我作见证」。
    - type: paragraph
      text:
        ru: '«Тада Му говораху: Гдје је Отац Твој? Исус одговори: Не знате ни Мене ни Оца Мојега; кад бисте знали Мене, знали бисте и Оца Мојега. Ове ријечи каза Исус код ризнице кад учаше у храму; и нико Га не ухвати јер још не бјеше дошао час Његов. А Исус им поново рече: Ја идем, и тражићете Ме; и помријећете у гријеху своме; куд Ја идем ви не можете доћи.» (Ин.8:19–21)'
        cn: 「于是他们问他：「你的父在哪里？」耶稣回答说：「你们不认识我，也不认识我的父；你们若认识我，也就认识我的父了。」这些话是耶稣在殿里的库房教训人时说的；并没有人拿他，因为他的时候还没有到。耶稣又对他们说：「我要去了，你们要寻找我；并且你们要死在自己的罪中；我所去的地方，你们不能到。」（约翰福音 8:19-21）
    - type: paragraph
      text:
        ru: '«Тада му говораху: где је Отац твој? Исус одговори: ни Мене знате ни Оца мога; кад бисте знали Мене, знали бисте и Оца Мога». Пођите ма којим Мојим делом, или речју, или мишљу, свако је од њих пут који право води Оцу. Али ви баш то нећете, зато не знате ни мене ни Оца мог. Знање о једном одводи знању о друшом. То је двоје једно и једносушно. Али ви сте се заљубили у једну и, и заробили себе њоме; та је мисао како бисте ухватили и убили мене. Но то неће бити док не буде дошао час за то. Има један грех, у коме су присутне све смрти, то је христоборство. Тај грех је у вама, и ви у њему. Да, ви сте опкољени, обзидаии њиме као неотворивом тамницом: «и помрећете у своме греху»: помрећете у греху христоборства, издајући и распињући Христа; и док будете мислили у својим злим душама да сте занавек убили Исуса, Ја ћу васкрсењем изаћи из овог и узнети се као вечно живи Богочовек у онај свет; тада: «Куд ја идем ви не можете доћи», – тада: «тражићете ме и – помрећете у свом греху».'
        cn: 于是他们对祂说：「你的父在哪里？」耶稣回答说：「你们不认识我，也不认识我的父；如果你们认识我，也就认识我的父了。」你们无论循着我哪一个行动、或哪一句言语、或哪一个思想，它们每一个都是直接通往父的道路。但是你们偏偏不愿如此，所以你们既不认识我，也不认识我的父。认识其中一位会引向对另一位的认识。这二者是一体的，并且是同质的。但是你们却爱上了一件事，并为此奴役了自己；那件事就是如何抓住并杀害我。然而，这事非到时机成熟不会发生。有一种罪，其中包含了一切的死亡，那就是与基督为敌。这罪在你们里面，你们也在罪里面。是的，你们被它包围，被它像一道不可逾越的监狱般围困着：「你们将死在自己的罪中」：你们将死在与基督为敌的罪中，背叛并把基督钉上十字架；当你们在自己邪恶的灵魂中以为你们已经永远杀死了耶稣时，我将藉着复活从这世上出来，并作为永远活着的道成人身者升入那世界；那时：「我所去的地方，你们不能到。」——那时：「你们将要寻找我，并且——你们将死在自己的罪中。」
    - type: paragraph
      text:
        ru: '«И рече им: Ви сте одоздо, Ја сам одозго; ви сте од овога свијета, Ја нисам од овога свијета.» (Ин.8:23)'
        cn: 「祂对他们说：你们是从下头来的，我是从上头来的；你们是属这世界的，我不是属这世界的。」 (约翰福音 8:23)
    - type: paragraph
      text:
        ru: 'Због свог главног греха свог: христоборства = богоборства, људи не осећају своје небеско порекло, заборавили су га; грех их је оземљио и уземљио; они су свим бићем одоздо, грех их је сатерао у земљу са свима њиховим особинама; постали су као гмизавци, изједначили се са оним што је ниско, што није небеског порвкла.'
        cn: 因着他们的主要罪恶：抵挡基督 = 抵挡上帝，人们不再感受他们的属天本源，并已将其遗忘；罪恶使他们尘化，并使他们陷于尘土之中；他们整个存有都来自下方，罪恶将他们连同他们所有的特质一并逼入尘土；他们变得如同爬行动物，与那卑下、非源自天上的事物等同了。
    - type: paragraph
      text:
        ru: 'А Исус? Сав је одозго, с неба: «Ја сам одозго». Бог који је сишао с неба, постао човек, али као човек остао Богом, и то показује и доказује делима својим. Људи су створени боголикима, да би живели у овоме свету, а били свесни да су од онога света, и да је тамо, у Богу, њихова главна и вечна отаџбина: на небу. А они су се гресима богоборним толико удаљили од неба и Бога, толико се зарили, загњурили у земљу, толико уземљили и оземљили, поиловачили, да су потпуно постали бића од овога овета, због чега им Спас и вели: «ви сте од овога света».'
        cn: 那么耶稣呢？他全然来自上方，来自天上：「我来自上方。」这位降自上天的上帝，成为了人，然而作为人仍是上帝，他用自己的行动展示并证明了这一点。人是按着肖似上帝的形像被造的，以便活在这世上，却知道自己是来自另一个世界的，并且在那里，在上帝里面，是他们主要且永恒的故乡：在天上。然而他们却因着与上帝为敌的罪，如此远离了天和上帝，如此深陷、沉溺于大地，彻底属土化，甚至化为泥土，以至于他们完全成了这世界的存在，正因如此，救主也对他们说：「你们是属这世界的。」
    - type: paragraph
      text:
        ru: 'Овај свет су људи претворили у радионицу греха и смртти, и потпуно се посветили производњи греха и смрти. Фабрика греха и смрти, ето то је земља; а људи – фабриканти. Тиме је овај свет одвојен од оног света, прекинуто је између њих оно предгреховно логосно стање, и овај је свет утонуо у таму незнабоштва. А Исус? Ето тог предгреховног безгрешног света; сав је у јединству са оним светом, «сав је од онога света». Питаш ли: какав је био човек пре греха? Ето ти одговора: Исус. А свет? – Све оно што Исус чини, и како чини; Његов свет – то је предгреховни свет, у коме нема ни греха, ни смрти.'
        cn: '这个世界被人变成了罪恶与死亡的作坊，人们完全投身于罪恶与死亡的生产。罪恶与死亡的工厂，这就是大地；而人们，就是生产者。如此，这个世界就与那个世界分离了，他们之间那种罪前的逻各斯状态被切断了，这个世界沉沦于异教的黑暗中。


          那么耶稣呢？他就是那个罪前无罪的世界；他全然与那个世界合一，「他全然来自那个世界」。若你问：人在犯罪前是什么样子的？这就是你的答案：耶稣。那么世界呢？——耶稣所做的一切，以及他所做的方式；他的世界，就是那个罪前的世界，其中既没有罪恶，也没有死亡。'
    - type: paragraph
      text:
        ru: '«Зато вам и рекох да ћете помријети у гресима Својим; јер ако не повјерујете да Ја јесам, помријећете у гријесима својим. Тада Му говораху: Ко си ти? И рече им Исус: Почетак, што вам и кажем. Много имам о вама говорити и судити; али Онај који Ме посла истинит је, и Ја говорим у свјиету оно што чух од Њега.» (Ин.8:24–26)'
        cn: 「因此我对你们说，你们要死在自己的罪中；因为你们若不信我是，你们必死在自己的罪中。于是他们对祂说：你是谁？耶稣对他们说：起初，我所告诉你们的。我论到你们有许多话要说，有许多要审判的；但那差遣我来的，是真实的，我在世上所说的，是我从祂那里听见的。」（约翰福音 8:24-26）
    - type: paragraph
      text:
        ru: 'И људи ће непрестано уништавати сами себе гресима својим, и сатеривати у смрт док то не увиде: док се не обрате Исусу, и не пођу за Њим вером у Њега. А вера у Њега изводи кроз свете врлине еванђелске из свих грехова и из свих смрти и уводи у бесмртност и живот вечни. И тамо изводи из овог света и уводи у онај овет. Све док не поверују да је Исус – Богочовек и Спаситељ, људи ће умирати у гресима својим: «јер ако не узверујете да сам Ја, помрећете у гресима својим». Поверују ли у Њега као Богочовека и Месију, враћају се у онај почетни, предгрешни, божански свет: у почетак. И када Га питају: «Ко си ти?» Он им одговара: «Почетак, како вам и кажем». Све што су људи чинили и чине у својим гресима и грехољубивим расположењима толико је и по количини и по каквоћи да би и свезнајући Богочовек имао о томе «много говорити и судити», али сада се уздржаЈва од суда, јер није дошао да суди људима за грехе нњго да их спасава од греха. А оно што говори, говори као Син Бога Оца; и то говори само оно што чује од Оца. Јер у Њих је једно биће, једна воља, једно Еванђеље.'
        cn: 人们将不断地用自己的罪恶毁灭自己，并把自己推向死亡，直到他们明白这一点：直到他们归向耶稣，并以对祂的信心跟随祂。而对祂的信心，借由福音的神圣美德，将人从一切罪恶和一切死亡中引出，并引入不朽与永恒的生命。在那里，它将人带出这个世界，并引入那个世界。除非人们相信耶稣是——神人兼救主，否则他们将死在自己的罪恶中：「因为你们若不信我是，必要死在罪中。」如果他们相信祂是神人兼弥赛亚，他们就回到那个最初的、罪前、神圣的世界：回到起初。当他们问祂：「祢是谁？」 祂回答他们：「起初，正如我告诉你们的。」凡是人们在自己的罪恶和恋罪情结中所做和正在做的一切，无论从数量上还是性质上都如此之多和如此之深，以至于即使是全知的神人也会对此「多有言说和审判」，但祂现在抑制审判，因为祂来不是要审判人的罪，而是要拯救他们脱离罪恶。而祂所说的，是作为天父上帝的儿子说的；而且祂只说从父那里听到的。因为在祂们里面是同一个本质，同一个意志，同一个福音。
    - type: paragraph
      text:
        ru: '«И не разумјеше да им говори за Оца. А Исус им рече: Кад подигнете Сина Човјечијега, онда ћете дознати да Ја јесам, и да ништа сам до себе не чиним; него онако како Ме научи Отац Мој онако говорим.» (Ин.8:27–29)'
        cn: «他们不明白祂对他们说的是关于父。于是耶稣对他们说：当你们高举人子的时候，那时你们就知道我是，并且我凭着自己什么都不作；而是照着我的父所教导我的那样我说话。» (约翰福音 8:27-29)
    - type: paragraph
      text:
        ru: 'Али људи то не разумеју, како да Он – Исус буде једно са Оцам небеским. Када ће разумети? Када Исус изврши богочовечанско дело спасења људи, када буде уздигнут на крст, и кроз васкрсење узнет са телом на небо. Онда ће дознати ко је Он и шта је Он: и да ништа сам од себе не чини, «него како Ме научи Отац Мој онако говорим». Разумети смерност Исусову: овде Он говори о својој човечанској природи која се увек учи од Бога свему, па и говорењу.'
        cn: 但是人们不明白，祂——耶稣如何能与天上的父合一。他们何时才会明白？当耶稣完成神人救赎人类的工作，当祂被举起在十字架上，并通过复活带着身体升天。那时，他们将会知晓祂是谁和祂是什么：并且祂自己什么也不做，「而是我的父如何教导我，我就如何说。」要理解耶稣的谦卑：在这里祂谈论的是祂的人性，这人性总是从神那里学习一切，甚至包括说话。
    - type: paragraph
      text:
        ru: 'Спас стално наглашава да је Он уједно и Бог и човек, и да је као човвк нижи од Оца. Али, иако у телу људском, Исус је Бог Логос, и пошто је такав, са Њим увек и Отац који га посла: «Не остави Отац мене сама, јер ја свагда чиним што је Њему угодно». У томе је и величина човека Исуса, што свагда чини оно што је угодно Богу Оцу. У томе је опет величина сваког човека уопште. Исус је пример и углед тога.'
        cn: 救主持续强调他同时是神也是人，并且他作为人低于父。但是，尽管身处属人的身体中，耶稣是神圣的道，并且因为他是这样的，差遣他的父总与他同在，正如他所说：「父没有撇下我独自一人，因为我总是行他所喜悦的事。」这正是人耶稣的伟大之处，他总是行神父所喜悦的事。这又是普遍而言的每个人的伟大之处。耶稣就是这方面的榜样和典范。
    - type: paragraph
      text:
        ru: '«Кад Он ово говораше, многи повјероваше у Њега. Тада Исус говораше оним Јудејцима који су Му повјеровали: Ако ви останете у науци Мојој, заиста сте Моји ученици; и познаћете истину, и истина ће вас ослободити.» (Ин.8:30–32)'
        cn: 「当他说这话的时候，有许多人信了他。于是耶稣对那些信了他的犹太人说：你们若常在我的道里，就真是我的门徒了；你们必认识真理，真理必叫你们得以自由。」 (约翰福音 8:30-32)
    - type: paragraph
      text:
        ru: 'Шта је то веровати у Христа? – Сав бити у речи Његавој, у Еванђељу Његовом: сав се обзидати том речју, остати у њој увек, живети њоме свагда. Таква вера, само таква преображава грехољубиво биће човеково у следбеника и ученика Христовог. Вера «на парче», вера на трненутак, вера условна – не спасава, нити човека преображава. Само вера овом душом, свим срцем, свом мишљу, свом снагом, – ето вере која спасава и потпуно човека преображава. Спас зато и вели онима који су поверовали у Њега: «Ако ви останете у беседи мојој (у речи мојој), заиста сте моји ученици».'
        cn: 什么是相信基督？——就是完全沉浸在他的圣言中，在他的福音里；就是完全被这圣言所建造，永远留在其中，时时以此为生。这样的信心，唯有这样的信心，才能将人那爱罪的本性，转化为基督的跟随者和门徒。「零碎的」信心，转瞬即逝的信心，有条件的信心——不能拯救，也不能转化人。唯有全心、全意、全灵、全力地相信，——这才是拯救并彻底转化人的信心。因此救主对那些信他的人说：「你们若常在我的话里，就真是我的门徒了。」（约翰福音 8:31）
    - type: paragraph
      text:
        ru: 'Шта вам то доноси и дарује? – Познање истине, а истина даје слободу од греха и обмане и лажи. Боравећи у Еванђељу Спасовом, у речи Његовој, по човековом се бићу постепено разлива Божанска Истина, и потискује из њега све прехе и греховно, а то: све обмане и лажи, јер је грех отровна лаж, и сав на лажи стоји и у њој постоји: «бићете као богови». Кроз ту прву лаж демонску ушао је грех у људе и род људски. Истина Богочовекова ослобађа људе од преха, и тиме од свих лажи, на којима је човек градио овој живот у овоме свету. Само Истина Богочовекова доноси људима истинску слободу: слободу од греха. Истина и слобода су једносушни. То је једна од новина Новога Завета. Свака друга слобода уствари је назови слобода, псевдослобода.'
        cn: 它给你们带来并赐予什么？——真理的认知，而真理赐予人脱离罪、欺骗和谎言的自由。住留在救主的福音中，在他的话语中，神圣的真理便逐渐遍布人的存在，并将其内的一切罪恶和有罪之事驱逐出去，即：一切欺骗和谎言，因为罪是剧毒的谎言，它完全建立在谎言之上并存在于其中：「你们将如神一般」。借着那第一个魔鬼的谎言，罪进入了人类和人类的种族。神人的真理使人脱离罪，从而脱离所有谎言，人曾在这世上用这些谎言来建造自己的生命。唯有神人的真理带给人真实的自由：脱离罪的自由。真理与自由是同质的。这是新约圣经的一个新颖之处。其他任何自由实际上都是所谓的自由，伪自由。
    - type: paragraph
      text:
        ru: '«Одговорише Му: Ми смо сјеме Авраамово, и никад никоме нисмо робовали. Како ти говориш: постаћете слободни? Исус им одговори: Заиста, заиста вам кажем да сваки који чини гријех роб је гријеху. А роб не остаје у кући вавијек, син остаје вавијек. Ако вас, дакле, Син ослободи, заиста ћете бити слободни. Знам да сте сјеме Авраамово; али тражите да Ме убијете, јер Моја ријеч нема мјеста у вама. Ја говорим што сам видио од Оца Својега, и ви, дакле, чините што сте видјели од оца вашега.» (Ин.8:33–38)'
        cn: 「他们回答祂说：『我们是亚伯拉罕的后裔，从未作过任何人的奴仆。你怎能说：『你们将得自由』呢？』耶稣回答他们说：『我实实在在地告诉你们，所有犯罪的，就是罪的奴仆。奴仆不能永远住在家里，儿子却能永远住在家里。所以，如果子（圣子）使你们自由，你们就真自由了。我知道你们是亚伯拉罕的后裔；但你们却设法要杀我，因为我的道在你们心里没有立足之地。我所说的，是我在我父那里看见的；你们所行的，是你们在你们的父那里看见的。』」 (约翰福音 8:33-38)
    - type: paragraph
      text:
        ru: 'И када Јевреји одвраћају да су они семе Авраамово и да ником нису робовали никад, стога им Исусова слобода није потребна, Он им одговара: «Заиста, заиста вам кажем да је сваки који чини грех роб греху. Грех поробљује човека сластима, лишавајући га божанских и боголиких сила, или паралишући их. А кроз то, лишавајући га слободе у Богу. Јер само у Богу Истина нема граница, и слобода у њој. Јер само та слобода и та истина не умиру. Свака друга истина и слобода, као творевине људске, умиру и издишу заједно са човеком, или боље: умиру и издишу кроз сваки његов грех и порок. «Роб греха» – човек гре-ха, одбегао је од Бога, иселио се кроз грехе из дома Божјег; престао је бити домаћи Богу (Еф.2:19), и сав ушао у дом ђавољи, јер грех је дом ђавољи у свету, и постао домаћи ђаволу. Грех одузима човеку његово богосиновство; све до предавања греху, човек је син Божји, и као син Божји остаје у дому Божјем: у царству Божјем, у царству Њетове вечне Истине, вечне Правде, вечне Љубави, вечне Силе.'
        cn: 当犹太人反驳说他们是亚伯拉罕的后裔，且从未为奴于任何人，因此他们不需要耶稣的自由时，祂回答他们说：「我实实在在地告诉你们，所有犯罪的，就是罪的奴仆。罪以各样享乐奴役人，使人失去神圣的与肖乎神的能力，或使之瘫痪。借此，也使人失去在神里的自由。因为只有在神里面，真理才没有界限，并在真理中有自由。因为只有那样的自由和那样的真理不会消亡。任何其他真理和自由，作为人类的创造物，都会随着人的死亡而消亡并断绝，或者更确切地说：都会因他的每一个罪恶和败坏而消亡并断绝。「罪的奴仆」——这个犯罪的人，已经背离了神，因着罪孽从神的家中迁出；他不再是神家中的人（以弗所书 2:19），并完全进入了魔鬼的家中，因为罪是魔鬼在世上的家，他成为了魔鬼家中的人。罪夺走了人的神子身份；在未向罪屈服之前，人是神的儿子，并作为神的儿子留在神的家中：在神的国度里，在祂永恒的真理、永恒的公义、永恒的爱、永恒的能力的国度里。
    - type: paragraph
      text:
        ru: 'Чим се ода греху, пороби греху, он престаје бити Божји син, и као такав исељује ое из дома Божјег, из царства Божјег, као блудни син. А Исус је вечни Син Божји, и као такав враћа свакоме човеку изгубљено синовство, ослобађајући га греха. Зато и вели: «Ако вас дакле Син ослободи, заиста ћете бити слободни» – стварно слободни, не привидно.'
        cn: 一旦人沉溺于罪，被罪奴役，他就不再是上帝的儿子，并因此被逐出上帝的家，逐出上帝的国度，如同浪子。而耶稣是上帝的永恒之子，并因此将失落的作儿子的名分归还给每一个人，使他脱离罪恶。因此，祂也说：「若子叫你们自由，你们就真自由了」——是真正地自由，而非表面上的自由。
    - type: paragraph
      text:
        ru: '«Знам да сте сјеме Авраамово; али тражите да Ме убијете, јер моја ријеч нема места у вама. Ја говорим што сам видио од Оца Својега, и ви, дакле, чините што сте видјели од оца вашега. Одговорише и рекоше Му: Отац наш је Авраам. Исус им рече: Да сте дјеца Авраамова, чинили бисте дјела Авраамова. А сада тражите да убијете Мене, човјека који сам вам казао истину, коју чух од Бога. То Аваам није чинио.» (Ин.8:37–40)'
        cn: 「我知道你们是亚伯拉罕的后裔；但是你们却想杀我，因为我的话语在你们心里没有立足之地。我讲我从我的父所看见的，你们也照样行你们从你们的父所看见的。他们回答说：我们的父是亚伯拉罕。耶稣对他们说：如果你们是亚伯拉罕的儿女，就会行亚伯拉罕的作为。但如今你们却想杀我，就是那个把从神那里听来的真理告诉你们的人。亚伯拉罕并没有做这样的事。」(约翰福音 8:37-40)
    - type: paragraph
      text:
        ru: 'Сва разлика између Христа и христобораца: Он говори и чини што види у Оца свога, а они опет чине што виде у оца свога, тј. ђавола (Ин.8:44). Он је веран Син Богу Оцу, а они – верни синови ђаволу. Волећи и чинећи грехе људи постају и остају вврни синови ђаволу. Чији су синови, људи показују својим делима. Христоборци Јевреји били би деца Авраамова, када би чинили дела Авраамава. Чинећи пак дела неавраамовска, они показују да су деца ђавола. А главно њихово неавраамовско дело је шго хоће да убију Богочовека који им је као човек, на човечански приступан начин казао истину коју је чуо од Бога. Спас нарочито лодвлачи да је Он стварни човек: «гледате да убијете мене, човека који вам истгшу казах коју чух од Бога». Чинећи то ви се јављате као отворени богоборци: «тако Авраам није чинио».'
        cn: 基督与基督之敌之间所有的区别在于：他所说所行的，都是他从他的父那里所见的；而他们却行他们从他们的父，即魔鬼那里所见的（约翰福音 8:44）。他是忠信于父神的儿子，而他们则是忠信于魔鬼的儿子。因着爱罪和行罪，人们就成为并持续是忠信于魔鬼的儿子。人们用他们的行为表明他们是谁的儿子。那些与基督为敌的犹太人，如果他们行亚伯拉罕所行的，本会是亚伯拉罕的儿女。然而，他们行不属亚伯拉罕的行为，他们就表明自己是魔鬼的儿女。而他们主要的不属亚伯拉罕的行为是，他们想要杀害那位神人，他作为一个人，以一种人类可亲近的方式，向他们宣讲了他从神那里听到的真理。救主特别强调他是一个真实的人：「你们想要杀我，杀一个将我从神那里听到的真理告诉你们的人。」这样做，你们就显明自己是公开地与神作对的人：「亚伯拉罕没有这样做。」
    - type: paragraph
      text:
        ru: '«Ви чините дјела оца својега. Тада Му рекоше: Ми нисмо рођени од блуда, једнога оца имамо – Бога.» (Ин.8:41)'
        cn: 「你们是行你们父所行的事。」他们就对他说：「我们不是从淫乱生的；我们只有一位父，就是神。」 (约翰福音 8:41)
    - type: paragraph
      text:
        ru: 'Пред човеком стаје само два пута: пут ка Богу и пут ка ђаволу. Човек је по створењу од Бога: и тело и душа постали су му од Бога; а по својој вољи он постаје од ђавола: кроз грехе. Богољубље је природан, нормалан, логичан пут човеков у свету; грехољубље је неприродан, ненормалан, нелогичан. Чини ли рђава двла, има ли рђаве мисли, рђава осећања, човек је на путу грехољубља, који кроз грехе води ђаволу, а и све грехе из ђавола доводи и уводи у човека. Јер сваки грех рађа се посредно или непосредно од ђавола. Нема греха да није од њега. Кад је тако, онда је грехољубив човек од њега, од ђавола, јер се миолима својим, жељама својим, осећањима својим рађа од њега. А то опет значи: он се сазнањем и самосазнањем, рађа из њега; душом се рађа. И људи онда свесно или несвесно чине дела оца свога – ђавола.'
        cn: 摆在人面前的只有两条路：一条通往上帝，一条通往魔鬼。人按其受造而言，是来自上帝的：他的身体和灵魂都来自上帝；但按其自由意志，他却通过罪恶而来自魔鬼。爱上帝是人在世上自然的、正常的、合乎逻辑的道路；爱罪恶则是不自然的、不正常的、不合逻辑的。如果他行为邪恶，思想邪恶，情感邪恶，这人就在爱罪恶的道路上，这条路通过罪恶将他引向魔鬼，并且将所有来自魔鬼的罪恶带入并引入人心中。因为每一个罪恶都或间接或直接地来自魔鬼。没有一个罪恶不是来自它的。既然如此，那么爱罪恶的人就是来自它，来自魔鬼的，因为他以自己的思想、愿望和情感而从它那里诞生。这又意味着：他以其认知和自我认知，从它那里诞生；他以其灵魂而生。于是人们就或有意或无意地做他们父亲——魔鬼——的作为。
    - type: paragraph
      text:
        ru: '«А Исус им рече: Кад би Бог био отац ваш, љубили бисте Мене; јер Ја од Бога изиђох и дођох; јер нисам дошао сам од себе, него Ме Он посла. Зашто не разумијете говор Мој? Јер не можете да слушате ријеч Моју?» (Ин.8:42–43)'
        cn: «倘若神是你们的父，你们就必爱我；因为我本是出于神，也来到世上；我不是凭着自己来的，乃是祂差了我来。你们为什么不明白我的话呢？因为你们不能听我的道。» (约翰福音 8:42-43)
    - type: paragraph
      text:
        ru: 'А човек који стоји на путу богољубља свим мислима, свим осећањима, свом душом, свим срцем, свом снагом извире из Бога и увире у Бога. Сав се рађа од Бога, сваког дана и сваке ноћи кроз све нове и нове богољубиве мисли, богочежњива осећања, божанска дела. И на тај начин постаје син Божји, и Бог – Отац његов. Син личи на Оца духовним ликом својим, боголиким. Ко је на путу богољубља одмах сазнаје да је Христос – савршени, вечни Син Божји. И љубав га односи Христу, и кроз веру и остале еванђелске врлине потпуно предаје Христу. И он се осећа христовски у целом бићу свом. И проверава себе Њиме: све мисли своје, и сва осећања, и ова расположења, и сва дела своја проверава Њиме да ли су од Бога. Јер све што Христос не би примио за Своје, није од Бога, недостојно је човека, недостојно и његове боголике душе и његовог богозданог тела.'
        cn: 而那行走在爱上帝之道上的人，用他所有的思想、所有的情感、他所有的灵魂、他所有的心、他所有的力量，源自上帝并汇入上帝。他全然由上帝而生，每日每夜，藉着一个又一个全新的爱神之思、慕神之情、神圣之举。如此，他便成为上帝的儿子，而上帝——是他的父。儿子以他属灵的、像上帝的形象肖似父。凡行走在爱上帝之道上的人，立刻知晓基督是完全的、永恒的上帝的儿子。爱将他引向基督，并且藉着信心和其余的福音德行，他将自己全然献给基督。他整个存有都感受到是属基督的。他也藉着祂检验自己：他所有的思想、所有的情感、所有的心境以及他所有的行为，都藉着祂来检验它们是否出于上帝。因为凡基督不认作是祂自己的，就不是出于上帝的，不配于人，也不配于他那肖似上帝的灵魂，以及他那神造的身体。
    - type: paragraph
      text:
        ru: Али христоборни, грехољубиви људи баш зато и неће Христа. Њихово грехољубље је увек огледало греха, а Христос је сав против греха, стога и устају на Њега, и неће да Га слушају и разумеју. Грех који се размилео и разлио по њиховом срцу и души смета им да схвате Христа, и Његово човекољубље. Огреховљена природа људска ништа тако не воли као сласти греховне. Зато је упорно против Христа. Нападајући Њега, она брани своје сласти греховне, своје грехољубље.
        cn: 然而，抵挡基督、贪恋罪恶的人，正是因此不愿接受基督。他们对罪恶的贪恋永远是罪的写照，而基督则全然反对罪恶，因此他们起来抵挡祂，不愿聆听祂，也不愿理解祂。罪恶在他们心中和灵魂中蔓延泛滥，阻碍他们领悟基督和祂的仁爱。被罪玷污的人性，没有什么比罪恶的甘甜更令其喜爱。因此，它执意抵挡基督。攻击祂，它是在捍卫自己罪恶的甘甜，捍卫自己对罪恶的贪恋。
    - type: paragraph
      text:
        ru: «Вама је отац ђаво, и жеље оца својега хоћете да чините; он бјеше човјекоубица од почетка, и не стоји у истини, јер нема истине у њему; кад говори лаж, своје говори, јер је он лажа и отац лажи.» (Ин.8:44)
        cn: 「你们的父是魔鬼，你们乐意行你们父的私欲；他从起初就是杀人的，不守真理，因为他心里没有真理；他说谎是出于自己，因他本来是说谎的，也是说谎之人的父。」 (约翰福音 8:44)
    - type: paragraph
      text:
        ru: 'Христоборци, знате ли откуда сте, и откуда ваше христоборсгво? – Од ђавола. Да, од њега. Јер је он једини прави отац христоборства и свега грехољубља. Немојте мислити да сте у томе оригинални проналазачи, аутохтони и самостални. Не, ви сте просто деца оца свакога греха и зла – ђавола, а на првом месту оца највећег греха и највећег зла – христоборства. И све док уживате у сластима греховним, све док волите грех и чините сласти његове – једини ваш отац духовни је ђаво. Али, он је човекоубица од искони. Јер је он први измислио средство како да убије човека: грех. Он грехом убија свакога човека. Грешиш ли, то те ђаво убија, наноси ти смрт, најпре духовну, па онда физичку. Ти сумњаш у то? Теби грех не изгледа страшан. Баш у томе је све лукавство греха и ђавола: да учине да они не изгледају страшни. Управо: ђаво вешто скрива од очију људских своје одвратно лице, али се зато труди да сваки грех претстави као нешто привлачно, слатко, мило, да га маскира. Лаж му је сва апологија греха. Лажно претставивши грех људима, то је сав посао лукавога.'
        cn: 抗基督者啊，你们知道自己从何而来，你们的抗基督行为又从何而来吗？——从魔鬼而来。是的，从它而来。因为它是一切抗基督行为和一切嗜罪之心的唯一真正父亲。别以为你们在这方面是独创的发明者，是原生且独立自主的。不，你们不过是所有罪恶和邪恶之父——魔鬼的子孙，而首先，是最大罪恶和最大邪恶——抗基督行为之父的子孙。只要你们沉溺于罪恶的欢愉中，只要你们爱罪恶并享受它的甜头——你们唯一的属灵之父就是魔鬼。但是，它从起初就是杀人的。因为它首先发明了杀害人的手段：罪。它藉着罪杀害每一个人。你若犯罪，便是魔鬼在杀害你，它带给你死亡，首先是属灵的死亡，然后是肉体的死亡。你对此有所怀疑吗？对你而言，罪恶似乎并不可怕。罪恶和魔鬼的所有狡诈都恰恰在于此：让它们看起来并不可怕。的确：魔鬼巧妙地将自己可憎的面目隐藏起来，不让世人看见，反而努力将每一个罪恶描绘成某种具有吸引力、甜美、可爱的事物，并加以伪装。它为罪恶所作的一切辩解都是谎言。将罪恶虚假地呈现给世人，这就是那狡猾者全部的工作。
    - type: paragraph
      text:
        ru: 'И у томе је ненадмашно довитљив: даје лажи хиљаде и хиљаде саблажњивих ликова, само да би што више људи саблазнио. И показао како је лаж нешто природно, па чак и неопходно, и мило, у човечанском свету. Притоме, он је врло одушевљен и речит, јер кад говори лаж, своје говори, себе говори: износи из себе своје мисли, своје биће, јер је лажа и отац лажи. То је све отуда што у њему нема истине ни трунке истине, јер нема у њему Бога који је једина Истина, и – Свеистина.'
        cn: 在此方面，他诡诈得无可匹敌：他赋予谎言千千万万个令人跌倒的形态，只是为了使尽可能多的人跌倒。并显示谎言是某种自然之物，甚至在人类世界中是必不可少且可喜的。此外，他非常热衷且能言善辩，因为当他说谎时，他说的就是他自己的，说的就是他自己：他从自己里面发出自己的思想，自己的存有，因为他是说谎者，也是谎言之父。这都是因为在他里面没有真理，连一丝一毫的真理都没有，因为在他里面没有上帝，而上帝是唯一的真理，并且是——全然的真理。
    - type: paragraph
      text:
        ru: 'Целокупно његово биће је ван Истине, зато је сав Неистина, сав – лаж, и отац лажи. То је јединствено биће у свима световима Божјим које нема нимало у себи Истине, које се драговаљно потпуно одрекло Истине, испало из Ње, удаљило од Ње, и тако себе претворило у лаж и у оца сваке лажи. Једино биће које «не остаде у истини», него васцело испаде из ње, васцело изађе из Ње, отпаде од Ње, и паде у своју бескрајну гордост, у свет фиктивног бића, у ствари: у не-биће. То је смисао Спасових речи: «Ваш је отац ћаво, и жеље оца свога хоћете да чините; – он је човекоубица од почетка, и не остаде у истини, јер нема истине у њему; кад говори лаж, своје говори: јер је лажа и отац лажи.»'
        cn: 他的整个存在都在真理之外，因此他全然是不真，全然是谎言，也是谎言之父。这是上帝所有世界中唯一的一个存在，自身之中没有任何真理，它自愿完全否认了真理，从祂那里堕落，远离了祂，并因此将自己变成了谎言和各种谎言之父。唯一一个「不常在真理里」的存在，而是全然地从真理中堕落，全然地离开了祂，从祂那里背离，坠入他无限的骄傲之中，坠入虚构存在的宇宙，实际上：坠入非存在。这就是救主的话语的意义：「你们的父是魔鬼，你们乐意遵行你们父的私欲；他从起初就是杀人的，也不常在真理里，因为他里面没有真理；他说谎是出于自己：因为他是说谎者，也是谎言之父。」 (约翰福音 8:44)
    - type: paragraph
      text:
        ru: «А Мени не вјерујете, јер Ја истину говорим.» (Ин.8:45)
        cn: 但你们不信我，因为我讲真理。（约翰福音 8:45）
    - type: paragraph
      text:
        ru: Зашто христоборци не верују Христу? Зато што сав Истина, Свеистина, и што Истину говори. А у њима нема љубави према Истини. У њима стално ради и дела лаж, са свима својим претечама и следбеницима. Ма како дијалектички разрађене и логички обрађене, философије греха и апологије греха, увек су на крају крајева философије лажи и апологије лажи. Али то христоборци не виде, јер су отшколовани у лажи и навикнути на лаж као на атмосферу своје логике и регулатора својих мисли.
        cn: 为什么与基督为敌者不相信基督？因为他全然是真理，是完备的真理，并且他所说的是真理。但他们心中没有对真理的爱。在他们里面，谎言及其所有的前驱和追随者，不断地运作和活动。无论罪恶的哲学和罪恶的辩护是如何在辩证上被阐述，在逻辑上被加工，它们最终都永远是谎言的哲学和谎言的辩护。但与基督为敌者看不到这一点，因为他们在谎言中受训，并且习惯于把谎言当作他们逻辑的氛围和思想的调节者。
    - type: paragraph
      text:
        ru: 'У њих заиста и мисао и логика диригована лажју и грехом. Зато су без икаквог контакта са Истином, нити је познају, нити је желе, јер «нема истине у њима». А истина се познаје Истином; Истина се привлачи Истином. Зато Спас и упућује христоборцима ове речи: «Мени не верујете, јер ја истину говорим».'
        cn: 他们的思想和逻辑确实被谎言和罪恶所支配。因此他们与真理没有任何接触，既不认识真理，也不渴望真理，因为「他们里面没有真理」。然而真理是借着真理被认识的；真理被真理所吸引。因此救主也向那些与基督为敌的人发出这些话语：「你们不相信我，因为我说的是真理。」
    - type: paragraph
      text:
        ru: «Који Ме од вас кори за гријех? Ако ли истину говорим, зашто Ми ви не вјерујете?» (Ин.8:46)
        cn: 「你们中间谁能指证我有罪呢？如果我讲的是真理，你们为什么不信我呢？」(约翰福音 8:46)
    - type: paragraph
      text:
        ru: 'Ево питања које никада нико од људи није могао поставити људима: «Који ме од вас кори за грех?» Поставио га је само безгрешни човек Господ Исус. Да су ови Његови непријатељи приметили ма какав грех на Њему, о! раструбили би га у све могуће светове. А најпре, ухватили би Га, и судили Му, или бар компромигговали пред народом. Овако, они су постиђени, и заливени муклим и подмуклим ћутањем. Они, неуспааљиви вребачи и шпијуни свега Христовог, јер им је главни посао био да га ухвате у речи, кад већ нису могли у делу. Ово је доказ безгрешности Христове и свегрешности људске.'
        cn: 以下这个问题，是世人中从未有人能够向他人提出的：「你们中间谁能指证我有罪呢？」唯有无罪之人，主耶稣，能提出这个问题。如果祂的这些仇敌发现祂有丝毫罪过，哦！他们一定会将之大肆宣扬，传遍世间万物。首先，他们会抓住祂，审判祂，或者至少在民众面前败坏祂的名声。然而，他们却蒙羞受辱，陷入沉闷而阴险的沉默之中。他们是基督一切事物的永不倦怠的窥探者和密探，因为他们的主要任务就是要在祂的言语中抓到把柄，既然他们无法在行为上抓到把柄。这证明了基督的无罪性和人类的全然有罪性。
    - type: paragraph
      text:
        ru: 'Јер, иако су овим питањем доведени у положај да јавно признају безгрешност Исусову, они ипак, по свегрешности својој, неће да верују у Њега. Стога је у праву Господ када их одмах пита: «Ако ли истину говорим, зашто ми не верујете?» Не зато ли што сте свесни и добровољни робови лажи. Јер само ђаволи виде истину Божју и упорно остају у својој лажи и безочно стоје за своју лаж. Мени не верујете, јер сте сву душу истрошили верујући лажи.'
        cn: 因为，尽管他们因此问题而被置于公开承认耶稣无罪的境地，他们却仍然因着自身的全罪性，不愿相信祂。因此，主立刻问他们时说得对：「如果我讲的是真理，你们为什么不相信我？」难道不是因为你们是自觉且自愿的谎言奴隶吗？因为唯有魔鬼看见上帝的真理，却顽固地停留在他们的谎言中，并无耻地坚持他们的谎言。你们不相信我，因为你们已因相信谎言而耗尽了全部灵魂。
    - type: paragraph
      text:
        ru: «Онај који је од Бога, ријечи Божје слуша; зато ви не слушате, јер нисте од Бога.» (Ин.8:47)
        cn: 凡属神的，就听神的话；你们不听，因为你们不是属神的。（约翰福音 8:47）
    - type: paragraph
      text:
        ru: 'Свом душом својом христоборци се рађају од ђавола. То је осведочени еванђелски реализам. А то одрођује боголику душу људску од Бога, од истине Божје, одузима јој богосиновство, а тиме богоосећање и богосазнање. И човек се осећа као да нема никакве везе са Богом, да није од Бога ни по створењу; осећа се као да и не треба му Бог, и најзад – као да и нема Бога. Да, и тврде: ми ниамо од Бога, јер нема Бога; ми смо од природе, од животиње, од биља, од траве, само не од Бога. Природно што такви људи не виде, нити хоће, и зато не могу да виде Бога ни у оваплоћеном Богу – Исусу Христу. И одбацују и Истину Његову и Еванђеље Његово. Јер неће Бога нити ишта Божје. Ни по чему нису од Бога, јер то сами желе, и сами су довели себе дотле: обезбожили су себе потпуно и у саанању и у осећању, па ни сазнањем не сазнају Бога, нити Га осећањем осећају.'
        cn: 那些与基督为敌的人，他们的整个灵魂都由魔鬼所生。这是经福音所确证的真实。而这使人类肖似神的灵魂与上帝疏远，与上帝的真理隔绝，剥夺了其神子身份，从而也剥夺了其对上帝的感受能力和对上帝的认知。于是人感觉仿佛自己与上帝毫无关联，甚至连受造也不是出于上帝；他感觉仿佛他根本不需要上帝，最终——仿佛上帝根本不存在。是的，他们断言：我们不是源于上帝，因为上帝不存在；我们源于自然、源于动物、源于植物、源于草芥，唯独不源于上帝。理所当然地，这样的人看不见，也不愿看见，因此他们无法在道成肉身的上帝——耶稣基督里看见上帝。他们拒绝祂的真理和祂的福音。因为他们不愿上帝，也不愿任何属于上帝的事物。他们在任何方面都不是源于上帝，因为那是他们自己所愿的，是他们自己使自己达到了那个地步：他们在认知和感受上都彻底地将自己去神化了，以至于既不能凭认知来认识上帝，也不能凭感受来感知祂。
    - type: paragraph
      text:
        ru: 'Стога Спас свима христоборцима свих времена упућује ове речи: «Ко је од Бога, – речи Божје слуша; зато ви не слушате, јер нисте од Бога».'
        cn: 因此，救主对历世历代所有对抗基督者说出这些话：「凡属神的，必听神的话；你们不听，因为你们不属神。」
    - type: paragraph
      text:
        ru: '«А Јудејци одговорише и рекоше Му: Не кажемо ли ми добро да си ти Самрјанин, и да је демон у теби? Исус одговори: У Мени демона нема, него поштујем Оца Својега, а ви Ме срамотите. А Ја не тражим славе Своје; постоји Онај који тражи и суди.» (Ин.8:48–50)'
        cn: 「犹太人回答说：『我们说你是撒玛利亚人，并且你被鬼附着，难道说得不对吗？』 耶稣回答说：『我没有鬼，我乃是尊敬我的父，你们却羞辱我。我不求自己的荣耀；有一位寻求并施行审判的。』」 (约翰福音 8:48-50)
    - type: paragraph
      text:
        ru: 'Христоборци се лудо бране; бране се тиме што на ово одговарају Исусу: «Не говоримо ли ми право... да је ђаво у теби»?. Ако је ђаво у Њему, зашто онда не наведете грехе Његове када вас је отворено питао пред свима мало час: «Који ме од вас кори за грехе?» Јер ђаво живи кроз грехе; и ако је у Исусу, мора се пројавити то борављење његово у Исусу кроз многобројне грехе Исусове. А ви сте сами сведоци да греха нема у Исусу. Звачи: ви намерно клеветате. Зато им Спас спокојно одгавара: «V мени ђавола нема, него поштујем Оца свога, а ви мене срамотите». Да, Спас, као безгрешан, одговара на очигледну клевету спокојно, јер не тражи славу од људи. Зна их: заљубљени у грехе, они само то и раде: хуле на Бога и на све Божје; срамоте Бога и све Божје. Но Исус је баш ради тога и дошао: да их спасе греха, тог творца свих богохулстава у души људској. А што се тиче суда над људима, Он ће доћи касније, много касније, када људи добровољно буду усвојили или одбацили средства спасења од греха која им нуди: Богочовек.'
        cn: 抵挡基督者疯狂地为自己辩护；他们用此来回应耶稣，为自己辩护说：「难道我们说得不对吗……就是你被鬼附了？」如果他被鬼附着，那你们为何不指出他的罪呢？当他刚才在众人面前公开问你们时：「你们中间谁能指证我有罪呢？」因为魔鬼是藉着罪而活的；如果它在耶稣里面，那它在耶稣里面的居留就必须通过耶稣的众多罪过显明出来。而你们自己就是见证，耶稣是没有罪的。这意味着：你们是在故意诽谤。所以救主平静地回答他们说：「我不是被鬼附着的，我尊敬我的父，你们却羞辱我。」是的，救主作为无罪者，平静地回应这明显的诽谤，因为他不寻求人的荣耀。他了解他们：沉迷于罪的人，他们只做一件事：亵渎上帝和一切属于上帝的事物；羞辱上帝和一切属于上帝的事物。然而耶稣正是为此而来的：为了将他们从罪中拯救出来，那罪是人类灵魂中一切亵渎的始作俑者。至于对世人的审判，他将会在更晚的时候到来，很久很久以后，届时世人将会自愿接受或拒绝神人所提供给他们的脱离罪的救赎方式。
    - type: paragraph
      text:
        ru: '«Заиста, заиста вам кажем: Ко одржи ријеч Моју неће видјети смрти вавијек.» (Ин.8:51)'
        cn: «我实实在在地告诉你们：人若遵守我的道，就永远不见死亡。» (约翰福音 8:51)
    - type: paragraph
      text:
        ru: 'Шта је грех? Очигледна мала смрт. Јер у сваком греху таји се смрт; учини ли га човек, одмах се она кроз жаоку греха разлије по бићу човеково. Јер «грех учињен рађа смрт» (Иак.1:15), одмах је рађа у души, одмах умртвљује један део душе у човеку. Багочовек је дошао да да људима лек, свелек, од смрти, од греха. То је: Он сам, Његово Еванђеље. Свака еванћелска врлина је лек од греха и смрти. Учини ли је човек, већ је убио у себи један грех, једну смрт, и оживео један део душе своје. Чини ли све врлине, убија у себи све смрти и све грехе, и васкрсава душу своју из мртвих, испуњујући је вечним животом. Тако, још за живота у овом свету Христов човек је прешао из смрти у живот, из свих смрти – у живот вечни. То нам казују Спасоове речи: «Заиста, заиста вам кажем: Ко одржи реч моју, неће видети смрти до века» (никада).'
        cn: 什么是罪？显而易见的小小死亡。因为在每个罪中都隐藏着死亡；人若犯了罪，死亡便立刻通过罪的毒钩蔓延到人的整个生命之中。因为「罪既长成，就生出死来」（雅各书 1:15），它立刻在灵魂中生出死亡，立刻使人灵魂的一部分死去。神人降世，为要赐予人类医治死亡、医治罪的良药，包罗万有的解药。这就是：他自己，他的福音。每一种福音的德行都是医治罪和死亡的良药。人若实行这德行，就已在自身内杀死了一个罪、一个死亡，并使自己灵魂的一部分复活了。人若实行所有的德行，就在自身内杀死了所有的死亡和所有的罪，并使自己的灵魂从死里复活，使其充满永生。如此，属基督的人即便在此世的生命中，也已从死亡进入生命，从所有的死亡——进入永生。救主的话语告诉我们：「我实实在在地告诉你们：人若遵守我的道，就必永远不见死亡」（约翰福音 8:51），（永不）。
    - type: paragraph
      text:
        ru: '«Тада Му рекоше Јудејци: Сада знамо да је демон у теби. Авраам умрије и пророци, а Ти говориш: ко одржи ријеч Моју неће окусити смрт вавијек. Еда ли си Ти већи од оца нашега Авраама, који умрије? И пророци помријеше? Ко се ти сам правиш?» (Ин.8:52–53)'
        cn: 「于是犹太人对他说：『现在我们知道你里面有鬼。亚伯拉罕死了，众先知也死了，你却说：人若遵守我的道，就永不尝死味。难道你比我们的祖宗亚伯拉罕还大吗？他死了，众先知也死了。你将自己当作什么人呢？』」 (约翰福音 8:52-53)
    - type: paragraph
      text:
        ru: 'Ове речи Спасове су толико несхватљиве за огреховљену душу христобораца, да они имају на њих овај одговор: «сад дознасмо да је ђаво у теби. – Авраам умре и пророци, а ти говориш: ко одржи реч моју неће окусити смрти довека. Еда ли си ти већи од оца нашега Авраама, који умре? И пророци помреше: ко се ти сам градиш?» Тако говори потпуно огреховљено сазнање, по коме је смрт разливена скраја накрај, и неуморно ради кроз смртне мисли и осећања. И брани себе као нешто најприродније у природи људској, па био то Авраам или пророци.'
        cn: '救主这些话语，对于那些被罪玷污的、与基督为敌的灵魂而言，是如此地不可理喻，以至于他们如此回应祂：


          「我们如今知道你是有鬼附着了。亚伯拉罕死了，众先知也死了，你还说：人若遵守我的话，就永不尝死味。难道你比我们的父亚伯拉罕还大吗？他死了，众先知也死了：你将自己当作谁呢？」


          这样说的，是那完全被罪玷污的意识，死亡藉着它从头到尾弥漫开来，并透过属死的思想和情感不倦地运作。它又为自己辩护，视之为人类本性中最自然的事物，无论是亚伯拉罕还是众先知，都是如此。'
    - type: paragraph
      text:
        ru: '«А Исус одговори: Ако Ја прослављам смога себе, слава је Моја ништа. Отац је Мој Онај који Ме прославља, за кога ви говорите да је Бог ваш. И не познајете Га, а Ја Га знам. И ако речем да Га не знам, бићу лажа као и ви. Него Га знам, и ријеч Његову држим.» (Ин.8:54–55)'
        cn: 「耶稣回答说：『我若荣耀自己，我的荣耀就算不得什么；荣耀我的乃是我的父，就是你们所说是你们的神。你们却不认识他，我却认识他；我若说不认识他，我就是说谎的，和你们一样。我却认识他，也遵守他的道。』」 (约翰福音 8:54-55)
    - type: paragraph
      text:
        ru: 'Али баш у томе се и састоји слава Богочовекова, једина права слава на земаљском попришту смрти, што је Он необично показао и доказао да смрт ни по чему није природна за човека; напротив, она је потпуно неприродна, и сачињава главну срамоту природе људске. Људи, све док су слепи робови смрти, и стога упорни приврженици и браниоци идеје: смрт је неопходност у људском роду, – хвале највећу срамоту своју, славе најсрамније ропство своје, и не знају, заиста не знају да је једина слава људска: бесмртност бића људског. И још, због тога не знају, да је главна, и једина вечна и свеистинита идеја – водиља чрвекова, и рода људског, кроз све ноћи и поноћи, кроз све тмине и помрчине, кроз све смрти ове планете, ово: беомртност је неопходност људске лрироде, бесмртност коју само Богочовек даје и осигурава. У томе је једина права слава човекова. Јер она везује биће његово са извором сваке божанске и бесмртне славе: Тројичним Божанством. Сва Истина, сва Правда, сва Љубав, сва божанска савршенства, која су неопходна за живот људски на земљи, за човекову бесмртност и његову бесмртну бо жанску славу налазе се у Светој Тројици.'
        cn: 但恰恰就在于此，才是神人之荣耀，是死亡之地上舞台上唯一真实的荣耀，那就是祂非凡地彰显并证明了死亡对人而言，绝非自然之事；相反，它是完全反自然的，并构成人类本性主要的耻辱。人们，只要他们是死亡的盲目奴隶，因而也是以下观念的顽固拥护者和捍卫者：死亡是人类必需的，他们就颂扬自己最大的耻辱，荣耀自己最可耻的奴役，他们不知道，真的不知道人类唯一的荣耀是：人类生命之不朽。此外，正因如此，他们不知道，那引领人类个体及人类族群、主要且唯一永恒和全然真实的指导理念，穿越这星球上所有的长夜与深宵，穿越所有的幽暗与昏暝，穿越所有的死亡，这个理念就是：不朽是人类本性的必需，唯有神人才能赐予并保障的不朽。人的唯一真实荣耀即在于此。因为它将人的生命与一切神圣且不朽荣耀的源头——三位一体的神性——联系在一起。所有的真理，所有的公义，所有的爱，所有神性的完满，这些对于人在世上的生命、对于人的不朽及其不朽的神圣荣耀而言皆属必需，都存在于圣三一之中。
    - type: paragraph
      text:
        ru: 'Један од Свете Тројице, Бог Логос, зато је и постао човек, да би нам то све предао на чисто човечански, људски начин. И Он целог Свог живота на земљи, само то и ради; а и по вазнесењу Свом Он и даље само то и ради кроз Цркву Своју и из Цркве Своје. Христоборци захтевају од Богочовека да се баш тога свега одрекне. Одрекне ли се тога, одрекао се Себе, престао је бити Богочовек, а то значи: престао је бити Спаситељ људи од греха и омрти, постао је обичан човек, па макар био «највећи мудрац»,,,највећи философ», «најбољи човек». А баш то Богочовештво, то вечно Богочовештво и јесте оно чега се Исус не може одрећи, нити хоће.'
        cn: 三位一体中的一位，神言，因此也成为人，为的是要以纯粹属人的、人性化的方式将这一切传授给我们。祂在地上的一生，所做的唯独是这件事；并且在祂升天之后，祂仍然藉着祂的教会并从祂的教会中，唯独做这件事。反对基督者要求神人放弃所有这一切。若祂放弃这一切，祂就放弃了祂自己，就不再是神人，而这意味着：祂就不再是人类脱离罪与死亡的救主，而成了一个普通人，哪怕祂是「最伟大的智者」、「最伟大的哲学家」、「最好的人」。然而，正是这种神人合一性，这种永恒的神人合一性，才是耶稣不能也不会放弃的。
    - type: paragraph
      text:
        ru: 'Зато и вели христоборцима да они све што раде, раде што не познају правога Бога: «И не познајете га, а ја га знам; и ако речем да га не знам, бићу лажа као и ви. Него га знам, и реч његову држим».'
        cn: 因此他也对反基督者说，他们所做的一切，都是因为他们不认识真神：「你们不认识他，我却认识他；我若说不认识他，我就是说谎的，和你们一样；但我认识他，也遵守他的道。」（约翰福音 8:55）
    - type: paragraph
      text:
        ru: '«Авраам, отац ваш, био је рад да види дан Мој; и видје и обрадова се. А Јудејци Му рекоше: Још немаш ни педесет година, а Авраама си видио? А Исус им рече: Заиста, заиста вам кажем: прије него Авраам настаде, Ја јесам.» (Ин.8:56–58)'
        cn: 「你们的父亲亚伯拉罕乐意看见我的日子；他看见了，就欢喜。于是犹太人对他说：你还没有五十岁，竟见过了亚伯拉罕吗？耶稣对他们说：我实实在在地告诉你们：在亚伯拉罕存在以先，我是。」（约翰福音 8:56-58）
    - type: paragraph
      text:
        ru: 'Ово што сам ја донео свету, желели су да виде и имају сви свети људи старога света, на челу са Праведним Авраамом. Али оно што ви због упорног грехољубља свог нећете да видите у Мени: сва вечна божандка савршенства која сам донео људској природи и оваплотио у њу, то из оног света види бесмртном душом својом Авраам, јер се испуни радост његова и очекивање њвгово: «Авраам, отац ваш, био је рад да види дан мој; и виде, и обрадова се».'
        cn: 我带给世界的这些，所有的古圣先贤，以义人亚伯拉罕为首，都曾渴望看见并拥有。但是你们因着你们顽固的罪恶之爱，不愿在我里面看见的——我已将其带入并道成肉身于人性之中的所有永恒神性完满——那亚伯拉罕却从另一个世界，以他那不朽的灵魂看见，因为他的喜乐和期待已经满足。 「你们的父亚伯拉罕，曾欢喜快乐地盼望看见我的日子；他看见了，就非常喜乐。」 （约翰福音 8:56）
    - type: paragraph
      text:
        ru: '«Дан мој» – време Мог оваплоћења, очовечења, и живљења међу људима ради спасења људи. Све то христоборци због грехољубља свог не виде, и намерно неће да виде, и протествују: «Још ти нема педесет година, и Авраама ли си видео?» А да су хтели погледати кроз безгрешност Исусову, коју су колико малочас ћутке признали, они би видели да је Исус старији од сваког човека у роду људском, јер је старији од греха, као предгрешан човек. И да су хтели да буду доследни, доследни самој огреховљеној логици својој, они би признали да је само Бог безгрешан; и када је то Исус, онда је несумњиво Бог. И као Бог, старији од Авраама. Стога им Господ и одговара, казујући ту божанску вечност Своју: «Заиста, заиста вам кажем: ја сам пре него се Авраам родио».'
        cn: 「我的日子」——就是我道成肉身、成为人、活在世人中间、为了拯救世人的时候。这一切，那些抵挡基督者因着他们自身的恋罪之心，看不到，并且故意不愿看到，反而抗议说：「你还没有五十岁，难道见过亚伯拉罕吗？」然而，如果他们愿意通过耶稣的无罪性——他们方才还默默承认的——去看，他们就会看到，耶稣比人类中任何一个人都更古老，因为他比罪更古老，是一位先于罪的人。而且，如果他们愿意保持一致，与他们自身罪化的逻辑保持一致，他们就会承认只有上帝是无罪的；而如果耶稣是无罪的，那么他无疑就是上帝。作为上帝，他比亚伯拉罕更古老。因此，主也回答他们，宣示他那神圣的永恒性：「我实实在在地告诉你们，还没有亚伯拉罕，就有了我。」
    - type: paragraph
      text:
        ru: «Тада узеше камење да баце на Њега; а Исус се сакри, и изиђе из храма, па прође између њих и тако отиде.» (Ин.8:59)
        cn: 「那时，他们拿起石头要砸祂；但耶稣隐藏了自己，便出了圣殿，从他们中间经过，就这样离开了。」(约翰福音 8:59)
    - type: paragraph
      text:
        ru: 'На то једини одговор који христоборци располажу, јесте: да узму камење и затрпају Исуса. Свети Еванђелист бележи: «Тада узеше камење да баце на Њ; а Исус се сакри, и изиће из храма прошавши између њих и отиде тако». И тако им даје још један доказ Свога Божанства: Он се скрива на необичан начив: иако човек са телом реалним и видљивим и опипљивим, јер они не би потегли камење на привиђење, Он пролази између њих, а они Га не виде, не бацају камење на Њ. Зашто? Зато што још није био дошао час страдања и крсне смрти. А када је дошао, Господ је сам изишао пред оне који су дошли да Га ухвате, и рекао им: «Ја сам».'
        cn: 对此，与基督为敌者所能提出的唯一回答是：拿起石头，用它们将耶稣掩埋。圣史家记载道：「于是他们拿起石头要砸祂；而耶稣却隐藏起来，从圣殿里出来，从他们中间经过，就这样离开了。」（约翰福音 8:59）祂就这样给了他们祂神性的又一个证明：祂以一种非凡的方式隐藏自己。尽管祂是拥有真实、可见、可触之身体的人——因为他们不会向幻影投掷石头——祂却从他们中间经过，而他们却看不见祂，也没有向祂投掷石头。为什么？因为受难和十字架死亡的时刻尚未到来。而当那时刻到来时，主亲自走到那些前来抓捕祂的人面前，并对他们说：「我就是。」（约翰福音 18:5-6）
    - type: paragraph
      text:
        ru: 'Тако у свему што Господ Христос чини продужава се од почетка до краја један промислитељски план о спасењу рода људског. Спаситељ га доследно и савршено остварује. Ту му нико није у стању сметати: ни људи, ни демони, ни ствари.'
        cn: 如此，在主基督所行的一切事中，一个关乎人类救赎的护理计划，自始至终地延续着。救主始终如一地、完美地实现着它。在此，无人能阻碍祂：无论是人、是邪魔、还是事物。
  - type: heading2
    text:
      ru: Глава девета. Христос исцељује слепога од рођења
      cn: 第九章 基督医治生来瞎眼的人
    children:
    - type: paragraph
      text:
        ru: '«И пролазећи видје човјека слијепа од рођења. И запиташе Га ученици Његови говорећи: Рави, ко сагријеши, овај или родитељи његови, те се роди слијеп? Исус одговори: Не сагријеши ни он ни родитељи његови, него да се јаве дјела Божија на њему.» (Ин.9:1–3)'
        cn: 「耶稣经过的时候，看见一个生来是瞎眼的人。他的门徒问他，说：拉比，是谁犯了罪，是这人呢，还是他的父母呢，以致他生来是瞎眼的？耶稣回答说：也不是这人犯了罪，也不是他的父母犯了罪，而是要在他身上彰显神的作为。」 (约翰福音 9:1-3)
    - type: paragraph
      text:
        ru: 'И смрт и болест ушли су у човека кроз грех. Других врата којим би оне ушле у род људски нема за њих. И смрт и болест су нешто наследно у људском роду, као и људска, адамовска природа. Наслећујући људску природу, људи са њом наслеђују греховност, смртност и болесност. Али то не значи да је свака болест непосредан резултат личног греха човековог. Узрок многим болестима није ни у једном од догледних предака, али је сигурно тамо, у дубинама људске природе. То нам сведочи сам Спаситељ својим одгооором ученицима: «Ни он сагреши ни родитељи његови». Какав смисао онда имају болести уопште, и посебно болест овог слепорођеног? – «Да се јаве дела Божја на њему». – «Дела Божја? – Исцелење од болести, избављење од смрти, ослобођење од греха. За слепорођеног, и за грехорођеног, – а сваки је човек грехорођен, рођен у греху – то су дела Божја; а све што га задржава у болести, у греху, у смрти, то нису дела Божја, већ или људска или демонска.'
        cn: 死亡和疾病通过罪进入了人。它们没有其他进入人类的门径。死亡和疾病在人类中是遗传的，正如人类的亚当本性一样。人类在继承了人性时，也随之继承了罪性、必死性和易病性。但这并不意味着每一种疾病都是人个人罪的直接结果。许多疾病的原因不在任何一个可追溯的祖先身上，但它肯定存在于人性深处。救主本人以他对门徒的回答向我们证实了这一点：「既不是这人犯了罪，也不是他的父母犯了罪。」（约翰福音 9:3）那么，疾病总的来说，以及这个生来瞎眼的人的疾病，究竟有什么意义呢？——「乃是要在他身上显出上帝的作为来。」（约翰福音 9:3）——「上帝的作为？——是从疾病中得医治，从死亡中得解脱，从罪中得自由。对于那生来瞎眼的人，以及那生在罪中的人——因为每个人都生在罪中，是罪中而生——这些都是上帝的作为；而一切使他停留在疾病中、罪中、死亡中的，都不是上帝的作为，而是出于人或出于魔鬼的。
    - type: paragraph
      text:
        ru: «Мени ваља чинити дјела Онога који Ме посла, док је дан. Долази ноћ када нико не може радити.» (Ин.9:4)
        cn: 「我必须趁着白日，做那差我来者的工；黑夜将到，就没有人能做工了。」 (约翰福音 9:4)
    - type: paragraph
      text:
        ru: 'У роду људском само су дела Христова очигледно по свему дела Божја, јер је Он – Бог, Богочовек. А у свима делима људским греховносг присуствује макар као сенка, ако не као тешка масивна суштина и неуклоњива стварност. Иначе греховност је ноћ у коју је зашло човечанство и којој нема краја. Само спасење Боточовеком од греха увело је зору и дан у ту мрклу ноћ. Боточовек и јесте «дан» рода људског, јер је сунце безгрешности и бесмртности. Он је и зора и подне; то јест: незалазни Дан.Свако негирање Богочовека у човечанском свету, свако одбацивање претставља и јесге помрачење рода људског, свега људског, а најпре савести и душе. А то помрачење је исто и ослепљење: савесг људска обневиди, те не види у Хрмсту ни Бога ни Спаситеља, ни у делима Његовим дела Божја. То је ноћ «кад нико не може радити», – не може радити ништа божанско, бесмртно, вечно, већ грех кроза њ ради само своје, и рађа само оно што је грешно, смртно, пролазно. А дела Божја се јављају у човеку («да се јаве дела Божја у човеку»), чим се у души његовој роди вера, љубав, молитша, пост, и остале еванђелске врлине. Све су оне саме по себи дела Божја, и у човеку су стваралачке силе божанске које га орасположују и оснажују да и сам може чинити дела Божја.'
        cn: 在人类中，唯有基督的作为在各方面都明显是神的作为，因为祂是神，是神人。然而在所有人的作为中，罪性都存在，即使只如影随形，如果不是作为沉重、庞大的本质和不可移除的实相。换言之，罪性就是人类已坠入其中、并且没有尽头的黑夜。唯有神人所成就的救赎，使人脱离罪恶，才将黎明与白昼带入那漆黑的夜晚。神人就是人类的「白昼」，因为祂是无罪与不朽的太阳。祂既是黎明，也是正午；也就是说：永不落的白昼。在人类世界中，任何否认神人、任何拒绝祂的行为，都代表并且确实是人类，以及一切属人范畴的蒙蔽，首先是良知和灵魂的蒙蔽。而这种蒙蔽也同样是盲目：人的良知变得昏暗，以致在基督身上看不到神，也看不到救主，在祂的作为中也看不到神的作为。那是「无人能工作」的夜晚——无法做任何神圣的、不朽的、永恒的事，反而罪透过他只做它自己的事，并只产生那些有罪的、必死的、转瞬即逝的事物。然而神的作为显现在人身上（「使神的作为显现在人身上」），只要在他灵魂中生出信心、爱、祷告、禁食以及其他福音的德行。它们本身都是神的作为，并且在人里面是神圣的创造性力量，这些力量使他心生喜乐并得着能力，使他自己也能行神的作为。
    - type: paragraph
      text:
        ru: А дела су Божја – сва дела еванђелска. Сва она одводе Богу и долазе од Бога. Сва су од Христа, и сва воде Христу. Сва она осветљавају пут човеков од земље до у врх небеса, сав пут њихов од смрти у бесмртност, од небића у свебиће. Од њихове светлости и саливен је «дан» Христов, саливено је Сунце правде.
        cn: 上帝的作为——就是所有福音的作为。它们全都引向上帝，并且来自上帝。它们全都源于基督，并且全都引向基督。它们全都照亮人类的道路，从大地直到至高的天堂，照亮他们从死亡进入不朽、从虚无进入万有的整个路径。从它们的光芒中，铸就了基督的「日子」，铸就了公义的太阳。
    - type: paragraph
      text:
        ru: «Док сам у свијету, свјетлост сам свијету» (Ин.9:5)
        cn: 「我在世上的时候，是世上的光。」（约翰福音 9:5）
    - type: paragraph
      text:
        ru: 'Док је тих дела у човеку, дотле је и дан Хрисгов у њему, и светлост Христова. Утоне ли човек у грехољубље, тоне у ноћ; нарочито утоне ли човек у христоборство, утоне у страшну помрчину: «Док сам у свету светлост сам свету». Ово важи и у индивидуалном и у колективном смислу: док је Богочовек у свету, сав је осветљен божанском светлошћу, сав је у дану, и живи као по дану, видећи све путеве који воде човека кроз Истниу и Правду у бесмртност и живот вечни; исто тако: док је Богочовек у свету људском – сав је свет у светлости, и иде божанским путевима, а не путевима греха, смрти и ђавола. А кад људи грехољубљем заволе више таму него светлост, онда устају на све што је Христово. Тако у души човековој: све док се држи Христа и Његовог светог Еванђеља, у души му влада светлост, безоблачни дан Христов; а појава греха то је појава облачка; сваки грех по облачак; заволи ли човак грехе и стане живети у њима, онда постепено настаје мрак, док се све не згусне у иоћ, и нестане из душе Христовог дана, Христове светлости. Тада човек не види, већ пипа као слепац. Уствари он рађа слепу душу у себи; он је – слепорођени. Тада му и очи душе не користе; као што не користе човеку ии телесне очи ако нема светлости.'
        cn: 只要人心里有这些作为，基督的白昼和基督的光就在他里面。若人沉溺于恋罪，就沉入黑夜；尤其是若人沉溺于与基督为敌，就沉入可怕的黑暗中：「我仍在世上的时候，是世上的光。」（约翰福音 9:5）这既适用于个体层面，也适用于集体层面：只要神人（基督）在世上，世界就全然被神圣之光照亮，全然置身于白昼之中，如同生活在白昼，能看见所有经由真理与公义引导人进入不朽与永生的道路；同样：只要神人（基督）在人类世界中，整个世界就沐浴在光明中，行走在神圣的道路上，而不是罪、死亡和魔鬼的道路上。但当人们因恋罪而爱黑暗甚于光明时，他们就会起来抵挡一切属基督的事物。同样在人的灵魂中：只要他持守基督和祂的神圣福音，光就会在他的灵魂中掌权，那是基督无云的白昼；而罪的出现，就像一片小云朵的出现；每个罪就是一片小云朵；若人爱上罪并开始活在罪中，那么黑暗就会逐渐降临，直到一切凝结成黑夜，基督的白昼和基督的光从灵魂中消失。那时人便看不见，而是像瞎子一样摸索。事实上，他在自己里面生出了一种盲目的灵魂；他就是——生来瞎眼的。那时连他灵魂的眼睛也无用武之地了；就像人若没有光，肉体的眼睛也毫无用处一样。
    - type: paragraph
      text:
        ru: '«Рекавши ово, пљуну на земљу и начини блато од пљувачке, и помаза блатом очи слијепоме. И рече му: Иди умиј се у бањи Силоамској, што преведено значи: послан. Он оде, дакле, и уми се, и дође гледајући.» (Ин.9:6–7)'
        cn: 「他说这话的时候，就吐唾沫在地上，用唾沫和泥，抹在那瞎子的眼睛上。又对他说：「你去西罗亚池子里洗一洗。」（这翻译出来是：奉差遣。）他于是去了，洗了，回来的时候，就看见了。」 (约翰福音 9:6-7)
    - type: paragraph
      text:
        ru: 'И кал (блато) у рукама Христовим постаје лек, лек који лечи од слепила. Заиста Христос светли и кроз оно што обично увећава мрак: заиста је светлост света, и кроз кал – светлост! Кал – преноситељ божанкже светлости! Не потсећа ли то на човеково стварање: у кал тела људског Господ је унео сунчани и светли лик Свој. «И светлост се светли у тами, и тама је не обузе». Кал зрачи, светли логосном светлошћу: као при стварању човека, тако и сада при исцелењу слепорођеног. А и једно и друго за сведочанство њима: да Логос светли из кала и кроз кал, а камоли из боголике душе. Само послушност Логосу – лечи од слепила духовног, на првном месту. Онда човек и у калу види логосну оилу; и грумен кала зрачи божанском светлошћу. И осећа, и види, како из целкоупног космичког кала струји и зрачи логосни смисао твари. То је осетно слепорођеии, и послушношћу дрема Господу Христу исцелио се: «Отиде, и уми се, и дође гледајући». Он се није чудио, нити питао Спаса: шта то радиш? Зар калом мажеш очи моје? Куда ме шаљеш? Него послушно чини ове што му Он,каже. Да, то је услов при оваком чуду, као при првом у Кани Галилејској: «што вам год рече учините».'
        cn: 在基督的手中，泥土（污泥）成为医治失明的良药。诚然，基督甚至通过通常会加深黑暗的事物来发光：祂确实是世界的光，甚至通过泥土——光！泥土——神圣之光的传递者！这不让人想起人类的受造吗：主将祂光辉的形象注入人类身体的泥土中。「光照在黑暗里，黑暗却不接受光。」（约翰福音 1:5）泥土辐射，发散着逻格斯之光：正如在人类受造时，现在医治生来瞎眼之人时也是如此。而这两者都是对他们的见证：即逻格斯从泥土中并透过泥土发光，更何况是从那像神一样的灵魂中发光呢。唯独顺服逻格斯——首先医治属灵的失明。那时人甚至在泥土中也能看到逻格斯的力量；一块泥土也辐射出神圣的光。他感受，也看见，万有的逻格斯意义如何从整个宇宙的泥土中流出并辐射而出。生来瞎眼之人感受到了这一点，他借着对主基督的顺服而得了医治：「他去了，洗了，回来的时候就看见了。」（约翰福音 9:7）他没有感到惊讶，也没有问救主：「你这是做什么？你竟用泥土涂抹我的眼睛吗？你要把我打发到哪里去？」但他顺服地做了一切祂所吩咐的事。是的，这是这类神迹的条件，就像在加利利的迦拿所行的第一个神迹一样：「他告诉你们什么，你们就做什么。」（约翰福音 2:5）
    - type: paragraph
      text:
        ru: '«А сусједи и они који га бијаху видјели прије да бјеше слијеп говораху: Није ли ово онај што је сједио и просио? Једни говораху да је онм, а други да је налик на њега. Он говораше: Ја сам. Тада му говораху: Како ти се отворише очи? Он одговори и рече: Човјек који се зове Исус начини блато, и помаза очи моје, и рече ми: иди у бању Силоамску и умиј се. И кад отидох и умих се, прогледах. Тада му рекоше: Гдје је Он? Рече: Не знам. Онда њега, некадашњега слијепца, одведоше фарисејима. А бјеше субота кад Исус начини блато и отвори му очи. А фарисеји га тада опет питаху како прогледа. А он ми рече: Блато ми метну на очи, и умих се и видим. Тада говораху неки од фарисеја: Није овај човјек од Бога, јер не светкује сунботу. Други говораху: Како мопже човјек грјешан таква знамења чинити? И наста раздор међу њима. Опет ријекоше слијепцу: Шта ти велиш за Онога што отвори очи твоје? А он рече: Пророк је. Тада Јудејци не вјероваше за њега да је био слијеп и прогледао, док не дозваше родитеље тога што је прогледао. И запиташе их говорећи: Је ли ово син ваш за кога ви кажете да се роди слијеп? Како, дакле, сада види? А родитељи његови одговорише им и рекоше: Знамо да је ово син наш, и да се роди слијеп; а како сада види не знамо, или ко му отвори очи ми не знамо; сам је већ одрастао, питајте њега, нека каже сам за себе. Ово рекоше родитељи његови јер се бојаху Јудејаца; јер се Јудејци бијаху договорили да буде одлучен од синагоге ко год Њега призна за Христа. Зато рекоше родитељи његови: Одрстао је, њега питајте.» (Ин.9:8–23)'
        cn: 「邻舍和先前看见他曾是瞎子的那些人就说：这不是那曾坐着讨饭的人吗？有人说：是他。又有人说：不是，却是像他。他自己却说：我就是。于是他们对他说：你的眼睛是怎么开的呢？他回答说：有一个人名叫耶稣，他和泥抹我的眼睛，对我说：你往西罗亚池子去洗。我去了，一洗，就看见了。他们就对他说：那个人在哪里？他说：我不知道。他们把从前是瞎眼的人带到法利赛人那里。耶稣和泥开他眼睛的日子是安息日。法利赛人又问他是怎么看见的。他对我说：他把泥抹在我的眼睛上，我一洗就看见了。法利赛人中有的说：这个人不是从神来的，因为他不守安息日。又有人说：一个罪人怎能行这样的神迹呢？他们就起了纷争。他们又对那瞎子说：他既然开了你的眼睛，你说他是怎样的人呢？他说：他是个先知。犹太人不相信他从前是瞎眼，后来能看见的，直到他们叫了那得以看见之人的父母来，问他们说：这是你们的儿子吗？你们说他生来是瞎眼的，如今怎么能看见了呢？他父母回答说：我们知道这是我们的儿子，也知道他生来是瞎眼的；只是他如今怎么能看见，我们却不知道；是谁开了他的眼睛，我们也不知道。他已经成人，你们问他吧，他自己会说。他父母说这话，是怕犹太人；因为犹太人已经商议定了，若有认耶稣是基督的，就要把他赶出会堂。所以他父母说：他已经成人，你们问他吧。」（约翰福音 9:8-23）
    - type: paragraph
      text:
        ru: 'Инквизиција прва: фарисеји никако не желе да признају дело Божје у исцелењу слепорођеног. И ипак га одричу, одричу му божанско порекло. Њих буни начин: «Како ти се отворише очи?» Не желе да признају чудо; а прогледање слепорођеног се не може другче објаснити. Они се хватају и за суботу. «Није овај човек од Бога, јер не светкује суботе». Само не признати дело Божје у свету; и још: присуство Бога у свету. Лако би признали дела Божја у свету, када би признали присуство Божје у свету; нарочито: присуство оваплоћеног Бога. Овако, једно без другог се не може објаснити ни признати. Онда – боље одрећи и само дело? Да, фарисеји «не вероваше за њега да беше слеп и прогледа, док не доведоше родитеље»...'
        cn: 第一次审问：法利赛人绝不愿承认神在医治生来瞎眼之人一事上的作为。然而他们否认此事，否认其神性来源。使他们感到困惑的是其方式：「你的眼睛是如何开的？」他们不愿承认这个神迹；然而生来瞎眼的人重见光明，除此之外无法另作解释。他们还抓住安息日不放。「这个人不是从神来的，因为他不守安息日。」他们只是不愿承认神在世上的作为；以及：神在世上的同在。如果他们承认神在世上的同在，他们就会轻易承认神在世上的作为；尤其是：道成肉身之神的同在。如此一来，没有彼此，二者都无法解释，也无法承认。那么——不如干脆否认这作为本身？是的，法利赛人「不相信他曾是瞎眼的，后来能看见了，直到他们带来他的父母」……
    - type: paragraph
      text:
        ru: 'Инквизиција над родитељима. Највештије организовано планско христоборсгво. Дијалектика зла на послу сва: «Како сад види?» – Да, види, али како прогледа – не знамо. Тајна је уопште како човек види. Поготову, кад је у питању слепорођени. Како окати виде, не знамо; како ћемо то знага за слепорођене?'
        cn: 对父母的审问。这是最巧妙地组织和策划的反基督行为。邪恶的辩证法全然在起作用：「他现在是怎么看见的？」——是的，他看见了，但他是如何开始看见的——我们不知道。一个人是如何看见的，这本身就是一个奥秘。尤其是当涉及到生来瞎眼的人时。有眼睛的人是如何看见的，我们不知道；那对于生来瞎眼的人，我们又怎能知道呢？
    - type: paragraph
      text:
        ru: '«Тада по други пут дозваше човијека који је био слијеп, и рекоше му: Подај славу Богу, ми знамо да је онај човјек грјешан. А он одговори и рече: Је ли грјешан, не знам; једно знам – да ја бијах слијеп, и сада видим. Тада му опет рекоше: Шта ти учини? Како отвори очи твоје? Одговори им: Већ вам казах и не слушасте. Шта опет хоћете да чујете? Да нећете и ви да постанете ученици Његови? Они га изгрдише и рекоеш: Ти си ученик Његов, а ми смо ученици Мојсејеви. Ми знамо да је Мојсеју говорио Бог; а овога не знамо откуда је. Одговори човјек и рече им: У томе и јесте чудо што ви не знате откуда је, а Он отвори очи моје. А знамо да Бог не слуша грјешнике; него ако ко Бога поштује и вољу Његову твори, тога слуша. Откако је вијека није се чуло да ико отвори очи рођеноме слијепцу. Кад он не би био од Бога, не би могао ништа чинити. Одговорише и рекоше му: Ти си се сав родио у гресима, па ти нас да учиш? И истјераше га напоље.» (Ин.9:24–34)'
        cn: 「于是他们第二次叫了那曾是瞎眼的人来，对他说：『把荣耀归给上帝吧，我们知道那个人是个罪人。』他回答说：『他是不是罪人，我不知道；我只知道一件事，就是我从前是瞎眼的，现在却看见了。』于是他们又问他：『他怎样开了你的眼睛？』他回答说：『我已经告诉你们了，你们却不听。为什么又想听呢？难道你们也想成为他的门徒吗？』他们就骂他，说：『你是他的门徒，我们却是摩西的门徒。我们知道上帝曾对摩西说话；至于这个人，我们不知道他从哪里来。』那人回答他们说：『这真是奇妙，你们不知道他从哪里来，他却开了我的眼睛。我们知道上帝不听罪人，只有敬拜上帝并遵行他旨意的人，上帝才听他。从创世以来，未曾听见过有人能开生来瞎眼之人的眼睛。这人若不是从上帝来的，他就什么也不能做。』他们回答他说：『你全然生在罪中，还要教训我们吗？』于是他们把他赶出去了。」 (约翰福音 9:24-34)
    - type: paragraph
      text:
        ru: 'У својој инквизицији фарисеји се служе лажју; лаж и јесте со христоборсже инквизиције: «ми знамо да је човек овај грешан». Доказе за то? Даје сам прогледали: Бог не слуша грешнике, ни у многим стварима; а камоли у овако једном огромном чуду, јер «откако је света није се чуло да ко отвори очи слепоме од рођења»; а кад је он то учинио, сигургно је велики праведник Божји, јер, «ако ко поштује Бога и вољу Његову твори онога слуша». Ово је дело његово несумњиво од Бога, значи: и Он је сам од Бога: «Кад Он не би био од Бога, не би могао ништа чинити». Шта на то инквизитори? «Истераше га напоље».'
        cn: 在他们的审问中，法利赛人诉诸谎言；谎言正是那与基督为敌之审问的精髓：「我们知道这个人是个罪人」（约翰福音 9:24）。对此有何证据？这是那个曾失明的人给出的：上帝不听罪人，在许多事上不听；更何况在如此巨大的神迹中，因为「自从创世以来，从未听过有人能开生来瞎眼之人的眼睛」（约翰福音 9:32）。而当他做了这件事，他必然是上帝的伟大义人，因为「如果有人敬畏上帝并遵行祂的旨意，上帝就听那人」（约翰福音 9:31）。他的这项作为无疑是出于上帝，这意味着：他自己也是出于上帝：「如果他不是出于上帝，他就什么也做不了」（约翰福音 9:33）。对此，那些审问者作何反应？「他们把他赶了出去」（约翰福音 9:34）。
    - type: paragraph
      text:
        ru: '«Чу Исус да га истјераше напоље, па нашавши га рече му: Вјерујеш ли ти у Сина Божијега? Он одговори и рече: А ко је Он, Господе, да у Њега вјерујем? А Исус му рече: И видио си Га и Онај који говори с тобом, тај је. А он рече: Вјерујем Господе! И поклони Му се. И рече Исус: За суд ја дођох у овај свијет, да виде који не виде, и који виде да постану слијепи. И чуше ово неки од фарисеја који бијаху са њим, и рекоше му: Еда ли смо и ми слијепи? Рече им Исус: Кад бисте били слијепи не бисте имали гријеха; а сада кажете: видимо, тако ваш гријех остаје.» (Ин.9:35–39)'
        cn: 「耶稣听说他们把他赶出去了，后来遇见他，就对他说：你信神的儿子吗？他回答说：主啊，谁是神的儿子，叫我信他呢？耶稣说：你已经看见他，现在和你说话的就是他。他说：主啊，我信！就拜耶稣。耶稣说：我到这世上来，是要叫不看见的可以看见，看见的反而失明。同他在一块的法利赛人听见这话，就说：难道我们也瞎了眼吗？耶稣对他们说：你们若瞎了眼，就没有罪了；但如今你们说「我们能看见」，所以你们的罪还在。」 (约翰福音 9:35-39)
    - type: paragraph
      text:
        ru: 'Ево коме Спас открива божанску тајну Своје личнсоти: прогледаломе. То и стварност и символика. Прогледа онај ко у Христу упозна Сина Божјег, који брани Његово божанско порекло, божански карактер Његових дела. За мало – даје се све; ко поверује у мало, Спас му открнва сву тајну Своју. «Ко је Син Божји? – Видео си га, и који говори с тобом, Он је». Говори с тобом кроз Еванђеље, кроз светлост, кроз лишће, кроз ваздух, кроз сваку твар, кроз сву творевину, кроз науку, окроз Своје боговаплоћење, кроз тело човечје, кроз боголику душу људску. Слепорођени је заиста двоструко прогледао: и телесно и духовно; телесно – када му је Спас отворио телесне очи, духовно – када је поверовао у Исуса као Сина Божјег: «верујем Господе! и поклони му се».'
        cn: 救主向那得见光明之人，揭示祂位格的神圣奥秘。这既是真实，又是象征。那得见光明之人，是在基督里认识神的儿子，维护祂的神性起源、祂作为之神圣属性的人。为那微小，一切都被赐予；凡信那微小之人，救主便向他揭示祂全部的奥秘。「谁是神的儿子？— 你已经看见他了，那与你说话的，就是他。」祂透过福音、透过光、透过树叶、透过空气、透过万物、透过一切受造之物、透过学问、透过祂的道成肉身、透过人的身体、透过人那有神形象的灵魂，与你说话。那生来瞎眼的人确实双重地得了看见：身体上和灵性上；身体上——当救主开启他肉眼的时刻；灵性上——当他信耶稣是神的儿子之时：「主啊，我信！」他便拜祂。
    - type: paragraph
      text:
        ru: 'Још једну истину открио нам Спас: показао ко су у људском роду прогледали, а ко слепи. Прогледали су они који верују у Христа као Сина Божјег; а слепи су, који то не верују. За ту протледалост вером, Спас је донео људима безброј божанских, богочовечанских чињеница, дела, сведочанстава, доказа. Па кад људи поред свега тога неће да верују у Њега као у Сина Божјег, заиста – постају слепи, заиста ослепе духовно; и тиме сами себе осуђују на вечне муке. А за човечје биће шта су вечне муке, ако не живот без Бога и против Бога.'
        cn: 救主又向我们揭示了一个真理：祂指明了人类中谁是明眼人，谁是瞎子。那些相信基督是上帝之子的人是明眼人；而不相信的人则是瞎子。为了这份借由信德而获得的视力，救主赐予人类无数神圣的、神人一体的史实、事迹、见证和证据。那么，当人们尽管拥有这一切却仍不愿相信祂是上帝之子时，他们就真的——变成瞎子，真的在灵性上失明；并且以此将自己判入永恒的痛苦。对于人类的生命而言，永恒的痛苦若不是没有上帝、并与上帝为敌的生命，又能是什么呢？
    - type: paragraph
      text:
        ru: Ко признаје да својим људским моћима, по грешној немоћи, не види ни смисао света, ни људи, нити може спасти себе од греха и смрти, и исповеда да заиста не види, опада у «оне који не виде», којима Спас због те смерности дарује духовни вид, веру и љубав, и они онда прогледају и виде да им Он – Спас – све то у изобиљу нуди и даје. А који осионо тврде да виде и знају, и без Бога, и без Христа, смисао света и људи, и да се без Христа могу ослободити свих зала, грехова и смрти, и презиру и душу и свет без Њега, они постају духовни слепци, обневиде, и тако ништа не виде како треба да виде, нити виде оно што треба да виде. На там пучу осионе ослепљености и заслепљености налазе се сви хуманисти, сви хоминисти и у философији, и у науци, и у уметности, и у религији. А тај пут води у све смрти…
        cn: '凡承认凭着自己属人的能力，因着罪的软弱，看不见世界的意义，也看不见人类的意义，也无法将自己从罪和死亡中拯救出来，并承认自己确实是看不见的，他就归入「看不见的人」之列。救主因着这谦卑赐予他们属灵的视觉、信心和爱，于是他们就得以看见，并明白祂——救主——将这一切丰丰富富地提供并赐予他们。


          而那些傲慢地声称，他们即便没有上帝、没有基督，也能看见并认识世界和人类的意义，并且在没有基督的情况下，也能摆脱一切的邪恶、罪和死亡，甚至蔑视没有祂的灵魂和世界的人，他们就成为属灵的瞎子，双目失明，因而他们既看不见应当看见的事物，也看不见他们需要看见的事物。


          在那条傲慢的蒙蔽和盲目之路上，存在着所有的人文主义者、所有「人本主义者」，无论是在哲学、科学、艺术还是宗教中。而那条道路通向所有的死亡……'
    - type: paragraph
      text:
        ru: 'На том путу су сви фарисеји свих времена, који мисле да без Богочовека знају све и имају све што људима треба: хуманисти окорели и човекопоклоници, тј. идолопоклоници. То су идолопоклоници најгоре врсте: обожавају човека, или човечанство, насупрот Богу: човеком замењују Бога: или човековим разумом, или људским чулима, или људском културом, техником, цивилизацијом, уметношћу. То је најтрајније идолопоклонство у историји рода људског, и стога највећи грех људски. Јер кроз њега човек стално собом замењује Бога, потискује Бога, отстрањује Бога, убија Бога.'
        cn: 在这条道路上，都是历世历代所有的法利赛人，他们认为，没有神人，他们就知晓一切，拥有一切人类所需：顽固的人本主义者和拜人者，也就是说，偶像崇拜者。这是最恶劣的偶像崇拜者：他们崇拜人，或崇拜人类，与上帝对抗；他们以人取代上帝：或以人的理性，或以人的感官，或以人的文化、技术、文明、艺术。这是人类历史上最持久的偶像崇拜，因此也是人类最大的罪。因为通过它，人不断地以自身取代上帝，排挤上帝，移除上帝，杀死上帝。
    - type: paragraph
      text:
        ru: А то је најцрње и најпроклетије незнабоштво.
        cn: 而那正是最邪恶和最可咒诅的异教。
  - type: heading2
    text:
      ru: Глава десета. Христос добри пастир
      cn: 第十章 基督是好牧人
    children:
    - type: paragraph
      text:
        ru: '«Заиста, заиста вам кажем: Ко не улази на врата у тровчији него прелази на другом мјесту; он је лопов и разбојник. А који улази на врата пастир је овцама. Њему вратар отвара, и овце глас Његов слушају, и Своје овце зове по имену, и изводи их. И када овце Своје истјера, иде пред њима, и овце иду за Њим, јер познају глас Његов.» (Ин.10:1–4)'
        cn: 「我实实在在地告诉你们：凡不从门进羊圈，倒从别处爬进去的，那人就是贼，就是强盗。从门进去的，才是羊的牧人。看门的就给他开门；羊也听他的声音。他按着名叫自己的羊，把它们领出来。既放出自己的羊来，就在前头走，羊也跟着他，因为它们认得他的声音。」 (约翰福音 10:1-4)
    - type: paragraph
      text:
        ru: 'Идолопоклонство краде душе људске од Бога, и поробљава их не-богу, анти-богу. Нико не зна пут у душе људске до Богочовек. Јер је Творац боголиког бића људског и свих тајни његових. Сваки који хоће да уђе у тајну бића људског мимо Бога и без Бога «лупеж је и разбојник». Род људски = тор овчиј; у тај тор воде само једиа врата: Бог Логос, Богочовек. Који год хоће да уђе у тор овај «на другом месту» – лупеж је и разбојник. А тако хоће да уђу у тор овај сви нехришћани, сви антихришћани, сви незнабошци=хуманисти и хоминисти. Човеку се може приступити само Богом; тако и роду људском, као целини. Исто тако: Човек, и род људски, могу се познати само Богом: «Који улази на врата јесте пастир овцама».'
        cn: 偶像崇拜将人的灵魂从上帝那里窃走，并奴役它们归于非神、反神。除了道成肉身的神人，无人知晓进入人灵魂的道路。因为他是拥有神圣形象的人类生命及其所有奥秘的创造者。任何想要离弃上帝且没有上帝而进入人类生命奥秘的人，都是「窃贼和强盗」。人类 = 羊圈；进入那个羊圈只有一道门：神圣的道，神人。任何想要「从别处」进入这个羊圈的，就是窃贼和强盗。而所有非基督徒、所有反基督徒、所有异教徒（即人文主义者和人本主义者）都想要这样进入这个羊圈。人只能借着上帝才能被接近；对全人类作为一个整体来说，也是如此。同样地：人，以及全人类，只能借着上帝才能被认识：「那从门进去的，才是羊的牧人。」
    - type: paragraph
      text:
        ru: 'Ово има ужи и шири смисао. Шири, односи се на род људски; ужи, на човека и његову душу: сва осећања, мисли, жеље = тор овчиј; у њих се улази Богом Логосом, у њихову тајну, у оно што их везује и чини једним стадом. Вратар и једног и другог тора је Логос, или боголика д-ша. «Пастир овцама» и једних и других јесте Богочовек, и сви христоносци. Све што је у људима логосно, боголико зна «глас Његов», и слуша глас Његов, и послушно му је. Он до у суштину зна «своје овце», зна ове што је логосно и богочежњиво у људима, и то зове себи, и то сачињава Његово божанско стадо. Он иде испред оваца: и мислима, и осећањима, и делима; «и овце иду за Њим, јер познају глас Његов». Која то добра мисао људска не иде за Христом? Које то добро осећање људско, и добра жеља, и добра реч – не иде за Њим послушно, као за својим божанским Пастирем, који ће је одвести на пашу божанске бесмртности и вечности? Шта је то у човеку што не познаје у Христу Богочовеку Творца свог, и Бога свог, и Спаситеља овог?'
        cn: 这有狭义和广义之分。广义上，它指的是人类；狭义上，它指的是人及其灵魂：所有的情感、思想、欲望——这便是羊圈；藉着上帝圣言（Logos），人们得以进入它们的奥秘，进入那将它们连结并使它们成为一群羊的东西。这两个羊圈的看门人是圣言（Logos），或神似的灵魂。「羊的牧者」，无论是对广义上的羊还是狭义上的羊而言，都是神人，以及所有基督的承载者。人里面凡是合乎圣言的、神似的（一切），都认得「祂的声音」，也听从祂的声音，并顺服祂。祂深知「祂的羊」的本质，知道人里面凡是合乎圣言的、渴慕神的一切，并呼召这些到祂自己那里，这些便构成了祂神圣的羊群。祂走在羊的前面：藉着思想、情感和行为；「羊也跟着祂，因为它们认得祂的声音。」有哪一种良善的人类思想不跟随基督？有哪一种良善的人类情感、良善的愿望、良善的言语——不顺服地跟随祂，如同跟随它们的神圣牧者，那位将带领它们进入神圣不朽与永恒牧场的牧者？在人里面，有什么是不在基督——这位神人中——认出自己的造物主、自己的上帝和自己的救主的呢？
    - type: paragraph
      text:
        ru: «А за туђином неће поћи, него ће побјећи од њега, јер не познају глас туђинаца. Ову причу каза им Исус, али они не разумјеше шта бијаше то што им говораше.» (Ин.10:5–6)
        cn: «他们却不跟着生人，反要从他面前逃跑，因为他们不认得生人的声音。耶稣将这比喻告诉他们，他们却不明白他所说的是什么意思。» (约翰福音 10:5-6)
    - type: paragraph
      text:
        ru: '«А за туђином неће да иду, него беже од њега, јер не познају гласа тућега». Туђин, ко? Најпре, ђаво, затим: зло, грех, смрт = све ђаволово, све што отуђује од Бога; и још: све што је туђе боголикој и богозданој природи људској. За тим «тућином», за тим туђим, неће да вде ништа што је божанско, боголико, богочежњиво у човеку, и у људима. – Али, због грехољубља овог човек, људи су изгубили правилан појам о своме и туђем: не знају чији су, коме су своји и ко је њима свој. Гледајући себе поробљеним гресима, они често сматрају да им Бот није свој; већ туђ; свој им је онај с ким су се ородили и сродили помоћу греховних сласти.'
        cn: 「他们不跟着陌生人走，反而躲避他，因为他们不认识陌生人的声音。」陌生人，是谁？首先，是魔鬼，其次：是邪恶、罪、死亡 = 一切属于魔鬼的，一切使人与神疏远的事物；还有：一切与人类那肖似神和由神所造的本性相悖的事物。对于那个「陌生人」，对于那个陌生的事物，人里面或人们里面，任何属神的、肖似神的、渴慕神的都不会去跟随。——然而，由于这种对罪的爱慕，人、人们已经失去了对自己和陌生事物的正确观念：他们不晓得自己是谁的，不晓得自己归属谁，也不知道谁是他们的自己人。当他们看到自己被罪奴役时，他们常常认为神不属于他们；反而是一个陌生人；他们的自己人是那些与他们因罪恶的欢愉而结亲和同化的人。
    - type: paragraph
      text:
        ru: 'Толико се људска природа посувратила: Бог који је по боголикој души њима свој и «њихов род», постао им је туђин; а ђаво, који им ни по чему у њиховој богозданој природи није свој, нити род, већ им је сав по свему туђ, постао им је кроз сластољубље свој, толико свој, да им је често и – духовни отац.'
        cn: 如此地，人性已经扭曲了：那按着神肖的灵魂与他们相属，且是「他们的族类」的上帝，对他们而言却成了外人；而魔鬼，它在他们那由神所造的本性中，无论在哪方面既不属于他们，也不是他们的族类，反倒处处皆是外人，却藉着贪爱享乐成了对他们而言相属的，如此相属，以至于它常常也是他们的——属灵父亲。
    - type: paragraph
      text:
        ru: '«Тада им рече Исус опет: Заиста, заиста вам кажем: Ја сам врата овцама. Сви који год дођоше прије Мене лопови су и разбојници; али их овце не послушаше.» (Ин.10:7–8)'
        cn: 那时，耶稣又对他们说：「我实实在在地告诉你们：我就是羊的门。凡在我以前来的，都是贼，是强盗；羊却不听他们。」 (约翰福音 10:7-8)
    - type: paragraph
      text:
        ru: 'Еванђеље је Богочовек објавио људима са намером: да им каже сву истину о Богу и њима: шта је Бог за њих, и шта они за Бога. И Он је ево сада казује: «Ја сам врата овцама»: Ја=Богочовек Исус Христос; све што је у Мени и од Мене води људе, те залутале Божје овце, Богу, на пашу Божју. Ко кроза Мене приступа људима, не зна пут у душе људске, нити га може знати ни наћи. Штавише, ево друге половине истине о такозваним «вођама» и,пастирима» рода људског: «Сви колико их год доће пре мене – лупежи су и разбојници; али их овце не примише». Не само «пре мене», него без мене, ма кад, ма где. Само христоносци не спадају у лупеже и разбојнике рода људског.'
        cn: 神人向世人宣示福音，意欲：将关于上帝与他们自身的一切真相告知他们：即上帝对他们是何，而他们对上帝是何。而祂此刻正言说：「我就是羊的门。」「我」即神人耶稣基督；凡在我之内并由我而来的一切，都引领世人，即那些迷失的上帝之羊，归向上帝，入上帝之草场。凡不借着我而接近世人者，不知通往人类灵魂之路，亦无从知晓或寻得。此外，关于所谓人类的「领袖」与「牧者」，此乃真相的另一半：「凡在我以前来的，都是盗贼和强盗；羊却不听从他们。」不仅是「在我以前」，更是离了我，无论何时，无论何地。唯有负基督者不属于人类中的盗贼和强盗。
    - type: paragraph
      text:
        ru: 'Обратите пажњу: Спас назива лупежима и разбојницима само самозване вође рода људског, оне који људима хоће да замене Бога и Његово руководство судбином рода људског. Али ту спадају све самозване вође, велике и мале, све вође који хоће да кроз живот и историју воде род људски без Христа: Бога Логоса и Богочовека. – Никада човек није говорио тако смело о вођама рода људског. На чему се заснива та Исусова смелост? На Истини. На томе што је Он као вођ, као «Пастир добри» донео роду људском, и на томе што оу роду људском донели и причинили «лупежи и разбојници». Он је донео спасење, а они – уништење; Он је донео живот вечни, а они – смрт вечну; Он је донео сва божанска савршенства, а они сва демонска зла. Ево смелих и јединствених по отварности речи Богочовекових.'
        cn: 请注意：救主称之为盗贼和强盗的，仅仅是人类中那些自封的领袖，是那些企图在人心中取代上帝及其对人类命运之引领的人。但这包括所有那些自封的、无论大小的领袖，所有那些想要在没有基督——即道成肉身的上帝和神人——的情况下，在生命与历史中引导人类的领袖。——从未有人如此大胆地谈论人类的领袖。耶稣的这份大胆建立在何处？建立在真理之上。建立在他作为领袖，作为「好牧人」带给人类的一切，以及那些「盗贼和强盗」带给人类、并使人类遭受的一切之上。他带来了救赎，而他们带来了毁灭；他带来了永生，而他们带来了永死；他带来了所有神圣的完满，而他们带来了所有邪恶的魔性。这就是神人所说的这些大胆而独一无二、敞开直言的话语。
    - type: paragraph
      text:
        ru: «Ја сам врата; ако ко уђе кроза Ме спашће се, и ући ће и изићи ће, и пашу ће наћи.» (Ин.10:9)
        cn: 「我就是门；凡从我进来的，必然得救，并且出入得草吃。」 (约翰福音 10:9)
    - type: paragraph
      text:
        ru: 'Ја сам врата, ко уђе кроза ме, спашће се, и ући ће и изићи ће, и пашу ће наћи». Значи: Богочовек је за људско биће: врата у бесмртност, и сама бесмртност, и храна бесмртности. Јер Он је Спаситељ: спасава од греха, смрти и ђавола; и то спасава својом Богочовечанском личношћу, зато и на челу свих његових речи стоји: «Ја – сам врата». Све што људско не уђе у Њега, остаје у смрти и греху, умире стално кроз грехе и сурвава се у вечно царство зла и греха: пакао. Ван Богочовека нема врата бесмртности за људско биће; само Њиме човек се спасава. Да, Њиме: свиме што је Он и што је Његово = Свето Еванђеље, Црква. У њима су све силе и сва средства којима људи савлађују грех, смрт и ђавола. А Он – увек у свему томе целокупном својом Богочовечанском личношћу. До појаве Богочовека на земљи, овај наш свет земаљски био је без врата тамница смрти; Он је прва врата из ње у бесмртност. Али је целокупно спасење условљено и ограђено Њиме, Његовом Богочовечанском Личношћу: «Ко уђе кроза ме = мноме – спашће се». Свуда и свему: Богочовек, Богочовек, Богочовек. Спасење = мноме. Спаситељем – спасење.'
        cn: 「我就是门，凡从我进来的，就必得救，并且出入自由，也必寻见草场。」意即：对人类而言，神人就是进入不朽之门，不朽本身，以及不朽的食粮。因为祂是救主：祂将人从罪、死亡和魔鬼中拯救出来；而且祂是藉着祂的神人位格来施行拯救的，因此祂所有话语的首要之处都宣告：「我就是门。」凡人类中不进入祂的，都留在死亡和罪中，不断地因罪而死亡，并坠入邪恶与罪的永恒国度：地狱。在神人之外，人类就没有进入不朽之门；唯有藉着祂，人才能得救。是的，藉着祂：藉着祂所是的一切，以及属于祂的一切 = 圣福音、教会。在其中蕴藏着人类战胜罪、死亡和魔鬼的一切能力和所有方法。而祂——始终以祂完整的神人位格，存在于这一切之中。在神人降世之前，我们这个尘世曾是一座没有门扉的死亡牢狱；祂是第一道从中通往不朽的门。但全部的救恩都以祂、以祂的神人位格为条件并受其限定：「凡从我（即：藉着我）进来的，就必得救。」无论何处，无论何事：神人，神人，神人。救恩 = 藉着我。藉着救主——获得救恩。
    - type: paragraph
      text:
        ru: 'У подвигу спасења је и права, безгранична слобода човекова: «и ући ће и изићи ће, и пашу ће наћи»; кроз спасење од греха и ђавола и смрти расте слобода, бесмртна и безгранична. Јер грех и јесте оков који поробљава људско биће злу, смрти и ђаволу. При томе свему човекова личност остаје нетакнута и «расте растом Божјим» – «у човека савршена, у меру раста висине Христове» (Еф.4:13;Кол.2:19): јер нема ни греха ни смрти да је спутава, ограничава, сужава. «Пашу ће наћи»: све чиме се храни боголика душа човекова и богочежњиво биће његово; све што служи као бесмртна храна за бесмртно биће човеково. А та «паша»? – вечна божанска Истина, и Правда, и Љубав, и Доброта, и Мудрост, и Милост, и сва остала божанкжа савршенства; на земљи: Еванђеље = Црква: свете тајне, свете божанске силе и свете врлине. То је «паша» које увек има у непотрошивом изобиљу у Богочовеку=Цркви=Еванђељу.'
        cn: 在救赎的属灵操练中，也有人真实的、无限的自由：「他必出入，也必得着草场」；藉着从罪、魔鬼和死亡中得救，自由得以增长，是不朽的、无限的。因为罪确实是奴役着人的存在，使其屈服于邪恶、死亡和魔鬼的锁链。在这一切之中，人的位格保持不受侵犯，并「靠着上帝而增长」——「成为完全的人，达到基督丰盛身量的尺度」（以弗所书 4:13，歌罗西书 2:19）：因为没有罪，也没有死亡能束缚、限制、狭隘化它。「他必得着草场」：一切滋养人那肖似上帝的灵魂及其渴慕上帝的本性之物；一切作为不朽之食，滋养人那不朽的本性之物。而这「草场」呢？——是永恒的神圣真理、公义、爱、良善、智慧、怜悯，以及所有其他神圣的全德；在地上，则是福音 = 教会：神圣奥秘、神圣的属神能力和神圣美德。这「草场」总是在道成人身者=教会=福音中以取之不尽的丰盛而存在。
    - type: paragraph
      text:
        ru: Због свега тога – Богочовек једини истински вођ рода људског. Вођ који изводи људе из смрти и уводи у бесмртност. Отуда, само Спаситељ – Вођа. И остали христоносци. Сви они воде људе у бесмртност и живот вечни.
        cn: 因此，神人是人类唯一真正的引导者。这位引导者将人们从死亡中引出，并引入不朽。因此，唯有救主是引导者。以及其他的负基督者。他们都引导人们进入不朽和永生。
    - type: paragraph
      text:
        ru: «Лопов не долази за друго него да украде и закоље и упропасти. Ја дођох да живот имају и да га имају у изобиљу.» (Ин.10:10)
        cn: 盗贼来，无非是要偷窃、杀害、毁坏。我来了，是要使人得生命，并且得的丰盛。」 (约翰福音 10:10)
    - type: paragraph
      text:
        ru: 'У чему разлика између Спаситеља као Вођа и осталих «вођа» рода људског. Они: «лупежи и разбојници»; «а лупеж не долази ни за шта друго него да украде и убије и погуби», док Спас дошао: «да имају живот, и то у изобиљу имају». «Лупежи» убијају својим учењима, лажима, наукама, културама све што је бесмртно у људима, краду све шгго је божанско и вечно у њима («краде посејано у срцу»,Мф.13:19), и уништава све што је трајније од смрти, – чиме све то чини? Грехом и учењима који им одобравају грех, и не признају грех.'
        cn: 救主作为领袖，与人类其他的「领袖」有何不同？他们是：「盗贼和强盗」；「盗贼来，无非要偷窃、杀害和毁坏」，而救主来，则是为了：「使他们得生命，并且得的更丰盛。」「盗贼」用他们的教导、谎言、学说、文化，杀害人们里面一切不朽的，偷窃他们里面一切神圣永恒的（「夺了撒在心里的」，马太福音 13:19），并毁灭一切比死亡更持久的——这一切是借着什么做的呢？借着罪，以及那些认可罪和不承认罪的教导。
    - type: paragraph
      text:
        ru: 'А грех је главни убица човеков: убија душу у човеку, и баца је у пакао; а са душом – убија и тело; и обоје осуђује иа вечне муке у паклу (Мф.10:28). Само Богочовек даје људима «живот у изобиљу» = вечни живот, који никаква смрт, никакав грех, никакав лупеж и разбојник, не може ни украсти, ни убити, ни уништити.'
        cn: 而罪是人类主要的杀手：它在人里面杀死灵魂，并将灵魂抛入地狱；它连同灵魂——也杀死身体；并且将两者都定罪，使其在地狱中受永恒的折磨 (马太福音 10:28)。唯有神人赐予世人「丰盛的生命」 = 永生，这生命是任何死亡、任何罪恶、任何窃贼和强盗都无法偷窃、无法杀死、无法毁灭的。
    - type: paragraph
      text:
        ru: «Ја сам пастир добри. Пастир добри живот Свој полаже за овце.» (Ин.10:11)
        cn: 「我是好牧人。好牧人为羊舍命。」(约翰福音 10:11)
    - type: paragraph
      text:
        ru: 'Ко је онда у правом смислу добротвор рода људског; ко истински добар? Само Богочовек, јер спасава човка од свих смрти и даје му живот вечни; то – вечно добро, које никакав лупеж украсти не може. Зато је Спаситељ једини и имао право да изјави смело: «Ја сам пастир добри; пастир добри душу своју полаже за овце»: пастир добри води на пашу бесмртносга људе, те овце бесмртности, које вуци смрти (а то: греси и страсти) растржу, грабе и кољу. Добар је пастир рода људског уистини само онај који спасава људе од смрти и даје им и осигурава им једино истинско добро: живот вечни. А са Њим и у Њему – бесмртност душе и личности. «Душу своју полаже за овце». Пастир добри; и положио је, жртвовао на крсту, ишао у чељусти и утробу смрти, да би својом богочовечанском смрћу, тј. својом божанском ипостасном силом, сатро смрт. А кроза све то и из свега тога струји и зрачи једно: бескрајно човекољубље Христово, бескрајна љубав божанска. То је оно чиме Богочовек води људе: љубављу их придобија за живот вечни, и води из смрти у живот. У томе се и састоји истинска доброта Доброг Пастира: све љубављу и за љубав; ништа ни силом, ни грехом, ни смрћу.'
        cn: 那么，谁才是人类真正的恩主；谁才是真正良善的呢？唯有神人，因为他将人从一切死亡中拯救出来，并赐予人永生；这便是永恒的良善，是任何窃贼都无法窃取的。因此，唯有救主有权大胆宣称：「我（耶稣）是好牧人；好牧人为羊舍命」（约翰福音 10:11）。好牧人引领人们走向不朽的牧场，而那些不朽的羊群，正被死亡的豺狼（即罪恶与情欲）撕裂、抢夺和宰杀。真正良善的人类牧者，唯有那位将人从死亡中拯救出来，并赐予并确保他们拥有唯一真正良善——永生的人。而与他同在，并在他之内——是灵魂与位格的不朽。「他为羊舍命」。好牧人；他已为羊舍命，在十字架上献祭，他进入死亡的颚口和腹中，为的是借着他神人性的死亡，即借着他神圣的位格性大能，来摧毁死亡。而这一切，以及从这一切之中，都流溢并散发出同一件事：基督无限的仁爱，无限的神圣之爱。这就是神人引领人类的方式：他以爱赢得他们归向永生，并带领他们从死亡走向生命。好牧人的真正良善也正在于此：一切皆由爱而生，并为爱而做；没有任何事是借由强力、罪恶或死亡来完成的。
    - type: paragraph
      text:
        ru: «А најамник, који није пастир, коме овце нису своје, види вука гдје долази, и оставља овце, и бјежи; и вук разграби овце и распуди их. А најамник бјеши, јер је најамник и не мари за овце.» (Ин.10:12–13)
        cn: 「但雇工不是牧人，羊也不是他自己的。他看见狼来，就撇下羊，逃跑了；狼就抓夺羊，把羊赶散了。雇工逃跑，因为他是雇工，不顾念羊。」 (约翰福音 10:12-13)
    - type: paragraph
      text:
        ru: 'Најамник ко? Прво: њему овце нису своје – јер није ни њихов Творац, ни њихов Промислитељ, ни њихов Спаситељ; због свега тога он и није пастир овцама, тј. људима, не води их на пашу бесмртности, нити има такву пашу; друго: најамник у опасностима напушта овце и бежи: «види вука где иде, и оставља овце, и бежи»: а вук је сваки грех, свака смрт, свако лажно учење, сваки маскирани или разголићени порок, свака страст; вук је све што није христовско, еванђелско, све што не води и не приводи Христу, већ одводи од Њега или води против Њега; све то разбија род људски, распућује, и у смрти пакао уваљује: «и вук разграби овце и распуди их». Најамник пак тиме је најамник што «не мари за овце». А за кога мари? Само за себе. Вук = сваки саможивац, сваки самољубац.'
        cn: '雇工是谁？


          首先：羊不属于他——因为他既不是它们的创造者，也不是它们的眷顾者，更不是它们的救主；因此，他也不是羊群（意即，人们）的牧人，不带领它们到不朽的草场，也没有这样的草场。其次：雇工在危险中撇弃羊群逃走：「他看见狼来，就丢下羊，逃走了」；而狼就是各样的罪、各样的死亡、各样的异端教训、各样隐藏或显露的恶习、各样的私欲；狼就是一切非基督性的、非福音性的事物，一切不引向基督、不带来基督，反而使人远离他或与他为敌的事物；所有这一切都摧毁人类，使人分散，并在死亡中将人推入地狱：「狼就把羊抢去，赶散了」。雇工之所以是雇工，就是因为他「不顾念羊」。那他顾念谁呢？只顾念自己。狼 = 每一个自私自利者，每一个只爱自己的人。'
    - type: paragraph
      text:
        ru: 'Јер нико и ништа тако не подивља и не покурјачи човека као самољубље, као саможивост. Знаш ли ко претвара људско биће у пустош и пустињу? Самољубље, саможивост. Ако ниси видео вука, ето то је најкрволочнији и најсвирепији вук. А саможивци, самољупци су сви који не воде ни себе ни друге Еванђељу Христоовом. Али једно је сигурно: увек одводе и себе, и оне које воде, у – смрт, у робовање греху, неправди, лажи. А кроза њих у – робовање смрти.'
        cn: 因为没有什么，也没有任何人，能像自爱和自私一样，使人变得如此野蛮、如此像狼般凶残。你知道是谁将人的生命化为荒芜和旷野吗？是自爱，是自私。如果你未曾见过狼，看哪，那就是最嗜血、最凶残的狼。而那些自私者、自爱者，都是那些既不引领自己也不引领他人归向基督福音的人。但有一件事是确定的：他们总是将自己和他们所引领的人引向——死亡，引向对罪、不义和谎言的奴役。而通过他们，则沦为——死亡的奴役。
    - type: paragraph
      text:
        ru: «Ја сам пастир добри и познајем Своје, и моје Мене познају. Као што Отац познаје Мене и Ја Оца; и живот Свој полажем за овце.» (Ин.10:14–15)
        cn: 「我是好牧人；我认识我的羊，我的羊也认识我，正如父认识我，我也认识父一样；并且我为羊舍命。」 (约翰福音 10:14-15)
    - type: paragraph
      text:
        ru: '«Пастир добри» је свим Својим бићем, свом Својом Истином, Правдом, Љубављу, Божанством отворен Својима, познат Својима; кроз све то они Њега знају и познају; Он нити мистифицира, нити скрива себе од њих; пуноћом Божанства свог, Он живи јавно међу њима и са њима; претворивши у своје Његово Еванђеље они су Му постали своји; ородивши се са Њим духовно помоћу светих врлина. Он их зна као Своје, јер живе оним шго је Његово и од Њега. Помоћу Његовог они знају Њега: живећи Његовом Добротом, Истином, Љубављу, Правдом, они су познали Њега, познали да је Бог и Спаситељ, јер само Бог може имати и људима давати такву божанску Истину, такву божанску Правду, и Љубав и Доброту. Свака од њих, доживљује ли је човек, претвара се у једно духовно чуло, којим христољубац упознаје Христа као Бога и Спаситеља. «Пастир добри» је тиме добар што увек, у свима опасностима свих времена: «душу своју полаже за овце»: ту сам место оваца и из оваца бори се са свима вуцима који насрћу на овце Његове.'
        cn: 「善牧」以祂的整个存有，以祂全部的真理、公义、爱和神性，向属祂的人敞开，为属祂的人所知；借着这一切，他们认识祂并了解祂；祂既不故作神秘，也不向他们隐藏自己；凭着祂神性的丰满，祂公开地在他们中间并与他们同在；将祂的福音变为自己的，他们就成了属祂的；借着圣洁的德行在灵性上与祂成为亲属。祂认他们为属祂的，因为他们活出那属乎祂并源于祂的。借着那属乎祂的，他们认识祂：活出祂的良善、真理、爱和公义，他们就认识了祂，认识到祂是神和救主，因为只有神才能拥有并赐予人类如此神圣的真理、如此神圣的公义、爱和良善。这一切中的每一样，若人亲身经历，就会变成一种属灵的感官，借此，爱基督者便认识基督是神和救主。「善牧」的良善在于，祂总是，在一切时代的一切危险中，「为羊舍命」：祂亲自站在羊群的位置上，并为了羊群与所有那些攻击祂羊群的狼搏斗。
    - type: paragraph
      text:
        ru: 'У томе је и Његова победа што се Он – Свепобедни Спаситељ и Бог бори из њих и за њих са свима непријатељима њиховим, са свима вуцима: смрћу, грехом, ђаволом, оваким злом. И они «помоћу Њега који нас љуби» (Рим.8:37). «Пастир добри» је вечан, и доброта Његова вечна, и љубав – вечна, зато је и победа Његова вечна. Само се вечном божанском Добротом истински пастирује, истински постаје вођ људи, и истински воде људи. Свако друго средство претвара «вођу» у најамника, коме људи заиста нису своји, нити је он свој људима. Такви пастири добри, такви истински вођи рода људског су Светитељи: они сами живе вечном божанском Добротом Христовом, и њиме владају над људима, њиме их и воде из смрти у бесмртност и Живот вечни. Зато је ово Еванђеље – Њихово Еванђеље по преимућству; стога се и чита о Њиховим празницима.'
        cn: 他的胜利也正在于此：他——全胜的救主和神——从他们里面，并为他们而战，与他们所有的仇敌，与所有的豺狼：死亡、罪、魔鬼、诸如此类的邪恶而战。而他们「靠着那爱我们的主」（罗马书 8:37）。「好牧人」是永恒的，他的良善是永恒的，他的爱也是永恒的，所以他的胜利也是永恒的。唯有借着永恒的神圣良善，才能真正地牧养，真正成为人的引导者，也才能真正引导人。任何其他手段都将「引导者」变为雇工，对他而言，人们确实不属于他自己，他也不属于人们。如此的好牧人，如此人类真正的引导者，就是圣者们：他们自己活在基督永恒的神圣良善之中，并且借着这良善治理人，借着这良善将他们从死亡引向不朽和永生。因此，这福音是他们的福音，更是其首要的福音；因此也在他们的节日中诵读。
    - type: paragraph
      text:
        ru: «И друге овце имам које нису из овога тора, и те ми ваља привести, и чуће глас Мој, и биће једно стадо и један пастир.» (Ин.10:16)
        cn: 「我另外有羊，不是这圈里的；我必须把他们也领来，他们也要听我的声音，并且要合成一群，归一个牧人了。」 (约翰福音 10:16)
    - type: paragraph
      text:
        ru: 'Сви су људи, по своме логосном пореклу, овце Богочовека Христа. Истина, многе су од њих залутале: у греху, лажи, смрти, незнабоштву, безбоштву, богоборству. Бсхг Логос је и постао човек, да би као човек, пронашао све залутале овце, вратио их из греха и смрти у свој тор бесмртности и еванђелског живота. И тако повратио првобитно предгреховно и досмртно стање: једно стадо и Један Пастир. Овако: многа стада и многи најамници; а каткад по нека сама овца чини стадо за себе. Чланови ту, на земљи: да их све Еванђељем сабере у једно стадо, Његово стадо, где ће Он бити Једини Пастир. То већ донекле остварено у Цркви: ту сви чланови повезани и срасли у једно Тело – Богочовеково Тело, под једном Главом: Богочовековом.'
        cn: 所有人，按其道性（逻格斯性）的本源，都是神人基督的羊。诚然，他们中有许多已经迷失：陷于罪恶、谎言、死亡、异教、无神和对抗神之中。神人性的道（罗格斯）之所以成为人，正是为了以人的身份，寻回所有迷失的羊，将它们从罪恶和死亡中带回祂不朽和福音生活的羊圈。从而恢复那最初的、未堕落和未曾经历死亡的状态：一个羊群和一位牧者。而现今却是：众多的羊群和众多的雇工；有时甚至一只羊就为自己构成一个羊群。地上的成员们：要藉着福音将他们所有人都聚集到一个羊群中，就是祂的羊群，在那里祂将是唯一的牧者。这在教会中已然部分实现：在那里，所有成员都结合并生长为一个身体——神人的身体，在同一位元首之下：即神人。
    - type: paragraph
      text:
        ru: 'Шта је то што људе раздваја, разбија, разједињује? Грех. Он разбио људску природу, која је до грехопада била једна, у свима људима једна. До тог јединства она долази понова у Богочовечанском Телу Христовом: Цркви. Ту сваки члан осећа себе једним са свима осталим члановима, и осећа то јединство излечене од греха, исцељене природе људске. Сваки је присутан у свима, и сви у свакоме, по једној свеживотворној богочовечанској сили која и држи у свејединству живом цео организам Цркве. У Цркви се уствари врши реинтеграција људске природе, људског самоосећања и самоса знања, те сваки искрени члан осећа себе као све и све као себе, и сматра све као себе и себе као све.'
        cn: 是什么将人们分开、破碎、分裂的呢？是罪。它破碎了人的本性，这本性在堕落之前原是合一的，在所有人里面是合一的。这本性在基督的神人身体——教会中，再次达成了那样的合一。在那里，每个成员都感到自己与所有其他成员是合一的，并且感受到这从罪中得到医治、得以痊愈的人性所带来的合一。每个人都在所有人之中，所有人也在每个人之中，借着那赐予万有生命的神人性力量，这力量维系着整个教会的有机体，使其处于活泼的普世合一之中。实际上，在教会中，人的本性、人的自我感受和自我认知得到了重新整合，因此，每个真诚的成员都感受到自己即是万有，万有即是自己，并且将万有视为自己，将自己视为万有。
    - type: paragraph
      text:
        ru: «Зато Ме Отац љуби, јер Ја живот Свој полажем да га опет узмем.» (Ин.10:17)
        cn: 「因此父爱我，因为我将生命舍去，为要再取回来。」（约翰福音 10:17）
    - type: paragraph
      text:
        ru: Целокупни подвиг Богочовеков заснован је на бескрајном човекољубљу. Зато све што је Његово – бескрајно је блиско и присно и мило људском бићу. Зато се све то и може љубављу једино и сазнати. Уистини, Он је Једини Човекољубац. Зашто? Зато што је Он једини из љубави постао човек, и Собом уништио у човеку грех и смрт и ђавола, и тако спасао род људски од тих најљућих и непобедивих непријатеља. Све је то Богочовек учинио и извршио чавекољубљем, да би у људима пробудио и изазвао богољубље. То и само то. На љубав одговорити љубављу. Ту нема ничег принудног, ничег насилног, ничег механичког, аутоматског. Богочовеково човекољубље је толико самопожртвовано, толико јединствено, толико огромно, да Бог Отац Њиме нормира свој однос према Сину. Син – душу своју полаже до у амрт за сав род људски скупа, и за сваког човека посебно. Полаже у смрт, да, разоривши њоме смрт, опет је врати себи.
        cn: 神人全然的作为奠基于其无限的仁爱。因此，凡属祂的一切，对人类而言都无限地亲近、亲密而珍贵。因此，这一切唯有借由爱才能被认识。诚然，祂是唯一的大仁爱者。为何？因为唯独祂因爱而成为人，并藉着自己，在人里面摧毁了罪、死亡和魔鬼，如此拯救了人类脱离了那些最凶恶、不可战胜的仇敌。神人所行并完成的这一切，都是藉着仁爱，为要在人心中唤醒并激发爱神之心。就是如此，仅此而已。以爱回应爱。其中没有丝毫强迫性、暴力性、机械性或自动性的东西。神人的仁爱是如此自我牺牲、如此独特、如此浩瀚，以至于父神借此规范祂与圣子的关系。圣子——将自己的生命舍弃至死，为全人类整体，也为每一个人个体。祂将生命置于死亡之中，是的，藉着这死亡摧毁了死亡，又将之取回己身。
    - type: paragraph
      text:
        ru: 'То јест: Он се толико изједначи са сваким људским бићем, толико спусти на дно његовог бића, уђе сав у смрт његову, у пакао његов, да би га тако извукао из пакла, и спасао од греха, смрти и ђавола. Он улази у сваку нашу смрт, у сваки наш пакао, да би нас отуда извукао: «Ти си Бог који је сишао у ад» … – извукао заједно са душом својом богочовечном, коју никаква смрт не може ни издржати, ни заробити, нити икакав пакао саблазнити или у ђавола претворити: «душу Своју полажем да је опет узмем».'
        cn: 也就是说：他如此与每个人类生命等同，如此降入他生命的深处，完全进入他的死亡，进入他的地狱，以便将他从地狱中拉出来，并从罪恶、死亡和魔鬼手中拯救出来。他进入我们每一次的死亡，进入我们每一个地狱，以便将我们从那里拉出来：「祢是降入阴间的上帝」……——连同他那神人二性的灵魂一起将我们拉出来，这灵魂是任何死亡都无法承受、无法囚禁的，任何地狱都无法诱惑或将其变成魔鬼的：「我舍弃我的生命，为要再取回来。」
    - type: paragraph
      text:
        ru: «Нико га не узима од Мене, него га Ја сам од себе полажем. Власт имам положити га и власт имам опет узети га. Ову заповијест примих од Оца Својега.» (Ин.10:18)
        cn: 「没有人从我夺去，乃是我自己由自己放下。我有权柄放下，也有权柄再取回来。这命令是我从我父所领受的。」 (约翰福音 10:18)
    - type: paragraph
      text:
        ru: «Нико је не отима од мене», ни смрт, која је свима људима отела душе, «него је ја сам од себе полажем», чак до у пакао полажем («У гробу с телом, а у аду с душом као Бог» …) да је опет из пакла изведем, али не саму, већ са безброј душа богочежњивих које су ме тамо очекивале. Смрт нема власти над Богочовеком, ни грех, ни пакао. Он Сам, из човекољубља неуморног силази до у дно смрти, до у дно греха, до у дно пакла, да из свију њих изведе људска бића и спасе их. Мада човек, Он све то ипак чини активизирајући човечанску природу Своју до максимума, божанском силом Својом. Он као Богочовек има ту «власт» – Он душу овоју полаже кроз Крсну смрт за све људе, а узима је опет васкрсењем.
        cn: 「没有人能从我这里夺走它，」甚至死亡，它夺走了所有人的灵魂，「而是我自己放下它，」甚至深入地狱放下它（「我的肉身在坟墓里，我的灵魂在地狱里，如同上帝一般」……），为的是我能再次将它从地狱带出，而且并非独自，而是带着无数渴望上帝的灵魂，它们在那里等候着我。死亡对神人没有权柄，罪恶和地狱也没有。祂亲自，出于其不倦的爱人之心，降到死亡的最深处，降到罪恶的最深处，降到地狱的最深处，好将人类从所有这些之中引领出来并拯救他们。尽管是人，祂却依然行这一切，将祂人性发挥到极致，凭借祂的神圣力量。祂作为神人拥有那「权柄」——祂借着十字架上的死，为所有人放下祂的灵魂，又借着复活再次将其取回。
    - type: paragraph
      text:
        ru: 'И тако спасава род људски. Све је то учинио из бескрајног човекољубља. Зато је баш Бог Отац то и претворио у заповест спасења, те Спас и вели: «Ову сам заповест примио од Оца свога».'
        cn: 就这样，祂拯救了人类。祂做这一切，是出于无限的仁爱。因此，正是圣父将它变为救恩的诫命，救主也说：「这诫命是我从我父那里领受的。」
    - type: paragraph
      text:
        ru: '«Тада опет настаде раздор међу Јудејцима због ових ријечи. А многи од њих говораху: У њему је демон, и махнита. Што Га слушате? Други говораху: Ово нису ријечи бесомучника. Зар може демон слијепима очи отварати?» (Ин.10:19–21)'
        cn: 「那时，犹太人因这些话又起了纷争。其中有许多人说：『他被鬼附着，而且疯了。你们为什么听他呢？』另有人说：『这不是被鬼附之人的话。鬼岂能开盲人的眼睛呢？』」 (约翰福音 10:19-21)
    - type: paragraph
      text:
        ru: 'Све речено – основа и темељ Еванђеља спасења, Еванђеља истинског вођства у роду људском. А Јевреји, а многи јеврејствујући савременици наши говоре: «у њему је ђаво, и полудео је; што га слушате?» Значи: нормално је, паметно је, мудро је: да човек остане роб греха, смрти и ђавола; да га воде најамници; да у човеку нема ничег бесмртног, вечног, божанског; да је Богочовек не само непотребан, већ и штетан по човечанство, јер је «ђаво у њему», јер је «полудео». Заиста, суд о Богочовеку страшнији и наказнији и од оног у паклу, јер је Он и у пакао оншао, али су Га и тамо, и овде на земљи, ђаволи признавали за Бога, и Сина Божјег, и Свеца Божјег. Зар нису људи гаднији од ђавола, од свих ђавола, према Богочовеку гаднији. А кад су такви према Њему, зар могу не бити људождери саможиви један према другоме, или један чопор према другом чопору? Такав суд о Исусу? Да, ено га, он се провлачи кроз многе савремене теорије о Христу и Његовом Еванђељу.'
        cn: 所有这些所说的，都是救恩福音的根基和基础，是人类之中真实引导的福音。然而犹太人，以及我们许多犹太化的当代人说：「他里面有魔鬼，他疯了；你们为什么听他的话？」这意味着：人仍是罪、死亡和魔鬼的奴隶；受雇工引导；人里面没有不朽、永恒、神圣的东西；神人不仅不必要，反而对人类有害——这才是正常、聪明、明智的，因为「他里面有魔鬼」，因为他「疯了」。确实，对神人的审判，甚至比地狱中的审判更可怕、更丑恶，因为祂甚至降到阴间，但即使在那里，以及在这地上，魔鬼都承认祂是上帝，是上帝的儿子，是上帝的圣者。难道人不对神人更令人厌恶，比魔鬼，比所有的魔鬼都更令人厌恶吗？当他们对祂如此的时候，难道他们不会对自己人成为自私自利的食人者，或一个群体对另一个群体成为食人者吗？对耶稣有这样的审判吗？是的，你看，它渗透到许多关于基督和祂福音的当代理论中。
    - type: paragraph
      text:
        ru: 'По њима: То је и «наивно», и «сентиментално», «болесни и болећиви идеализам», то је «нездрава наука», «болесна наука», «опијум за народ», «лаж», «губа», «варалица», «сањарење», «неостварљиво маштање»; све, све, све друго – само не блага вест, не нови живот, не спасење, не просвећење, не решење главних животних проблема. А ако Богочовек није све то, и несравњено више од тога, онда – ни човек, ни земља, ни небо, немају никаквог разумног смисла, већ све то треба спалити и потпуно уништити. Људима преостаје само један напор за њихов демонски чин: да измисле динамит којим ће у парампарче разнети и небо и земљу, и што је главно: људе, људе, људе …'
        cn: 在他们看来：这是「幼稚的」，也是「多愁善感的」，是「病态且多愁善感的理想主义」，是「不健康的教义」，是「病态的教义」，是「人民的鸦片」，是「谎言」，是「麻风」，是「骗子」，是「白日梦」，是「无法实现的幻想」；所有，所有，所有其他一切——唯独不是好消息，不是新生命，不是救赎，不是启蒙，不是解决生命主要问题的方法。然而，如果神人并非这一切，也并非远超这一切的所在，那么——无论是人，是地，是天，都毫无任何理性的意义可言，反而这一切都应该被焚烧并彻底毁灭。人们只剩下一个努力方向，以完成他们那魔鬼般的行径：那就是发明炸药，用它将天和地炸成碎片，而最主要的：是人，是人，是人……
  - type: heading2
    text:
      ru: Христос у храму говори о оцу и себи
      cn: 基督在圣殿里讲论关于父和他自己。
    children:
    - type: paragraph
      text:
        ru: '«И ходаше Исус у храму по тријему Соломонову. И Јудејци Га опколише и говораху Му: Докле ћеш мучити душе наше? Ако си Ти Христос, кажи нам отворено.» (Ин.10:23–24)'
        cn: 「耶稣在殿里所罗门的廊下行走。犹太人围住祂，对祂说：『你叫我们悬心到几时呢？如果你是基督，就明白地告诉我们吧。』」 (约翰福音 10:23-24)
    - type: paragraph
      text:
        ru: 'Као Богочовек, први и једини, Господ Христос је најзагонетнија појава у роду људском. Као савршени Бог и савршени човек, Он је необјаш њив, јер људима, као несавршеним бићима, недостаје адекватно средство којим би га потпуно познали. Само помоћу Њега човек Га може разумети, или тачније: разумевати. Ко Њиме и у Њему живи, он и расте у постепеном разумевању и схватању Њега. Само се тако човек може приближити Њему: урастајући у Њега, срастајући с Њим, као лоза са чокотом; и само се изнутра може видети и сагледати све Његове богочовечанске тајне и све богочовечанске силе. Све док људи посматрају Њега споља, све док су «напољу», Он за њих претставља и загонетку и муку. И то привлачну загонетку и привлачну муку. Они, као и Његови христоборни савременици, стављају му питање: «докле ћеш мучити душе наше? Ако си ти Христос, кажи нам слободно». Проблем Христа обухвата све главне проблеме људскога сазнања: проблем добра и зла, проблем греха и врлине, проблем живота и смрти, проблем Бога и човека, проблем света и ђавола.'
        cn: 作为神人，首位也是唯一的一位，主基督是人类中最奥秘的现象。作为全备的神和全备的人，祂是无法解释的，因为人类作为不完美的存在，缺乏足够的途径以完全认识祂。唯有藉着祂，人才能理解祂，或更确切地说：持续地理解。凡是藉着祂并在祂里面生活的人，他就会在对祂的逐步理解与领悟中成长。唯有如此，人才能亲近祂：如同枝子与葡萄树一般，与祂一同生长，与祂融为一体；也唯有从内部，才能看见并洞察祂所有神人的奥秘和所有神人的大能。只要人们从外部审视祂，只要他们「在外」，祂对他们而言，就既是奥秘，又是折磨。而且是具有吸引力的奥秘和具有吸引力的折磨。他们，如同祂那些与基督为敌的同代人一般，向祂提出问题：「你叫我们的灵魂悬到几时呢？你若是基督，就坦白地告诉我们吧！」（约翰福音 10:24）基督的问题涵盖了人类认知的所有主要问题：善与恶的问题，罪与美德的问题，生与死的问题，神与人的问题，以及世界与魔鬼的问题。
    - type: paragraph
      text:
        ru: 'Јер Христос и јесте тиме Спаситељ и Месија што решава све те проблеме, или бар треба да их реши. Разуме се Исус је посведочио да је заиста Христос, јер је све те проблеме решио практичво, животно доживљајно, опитно. Тако: проблем живота и смрти решио је Својим васкрсењем; проблем добра и зла – остварујући непрекидно у свом животу савршено божанско добро, и тиме побеђујући грех и зло; проблем Бога и човека – показавши у себи и Бога и човека у њиховом идеалном савршенству и ипостасном једииству; проблем света и ђавола – осветливши божанском светлошћу и свет и ђавола, и показавши ко су и шта су они у суштини. Разуме се, месијански проблемски стандард људи упрошћавају, спуштају на ниже, и врло ниске нивое, висоравни: они траже своје и на економском и на научном, и на културном пољу, и на уметничком и на техничком. Само су та проблемски стандарди ниски, и устаари нису месијански.'
        cn: 因为基督正是借此成为救主和弥赛亚，因为他解决了所有这些问题，或者至少应该解决它们。理所当然地，耶稣见证了自己确实是基督，因为他以实践的、生命的、亲身经历的方式解决了所有这些问题。如下：他借由自己的复活解决了生命与死亡的问题；借由在自己生命中不断实现完美的属神良善，从而战胜罪恶，解决了善与恶的问题；借由在自身中彰显神与人的理想完美与位格性合一，解决了神与人的问题；借由用神圣的光照亮世界和魔鬼，并揭示了他们在本质上究竟是谁、是什么，解决了世界与魔鬼的问题。当然，人们简化了弥赛亚式的问题标准，将其降至更低乃至极低的层面：他们在经济、科学、文化、艺术和技术领域寻求自己的东西。但这些问题标准是低级的，实际上并非弥赛亚式的。
    - type: paragraph
      text:
        ru: '«Исус им одговори: Рекох вам па не вјерујете. Дјела која творим Ја у Име Оца Својега, она свједоче о Мени.» (Ин.10:25)'
        cn: 耶稣回答说：「我告诉过你们，你们却不相信。我奉我父之名所行的事，那些事为我作见证。」 (约翰福音 10:25)
    - type: paragraph
      text:
        ru: 'Да ли је Исус – Месија = Христос? Он то доказује и речима и делима: једно и исто Еванђеље је у њима; дела Његова су остварено Еванђеље Његово, тј. речи Његове преведене у дела, у праксу, у земаљску стварност. У све то може човек логички и свесно веровати, ако хоће да буде доследан очигледној стварности; али он то може и оцрицати, ако хоће да не верује очигледним чињеиицама. То је у власти човекове воље и схватања. У томе је страшна и величанствена слобода човекова: може и признати и одбацити Бога и све стварности. У томе и суптилност његовог сазнања и духа, али у томе и суптилност његових страдања и мука.'
        cn: 耶稣——弥赛亚 = 基督吗？他用言语和行动证明了这一点：其中包含了同一福音；他的行动是他的福音的实现，即他的言语被转化为行动、实践和属世的现实。人若想与显而易见的现实保持一致，就能逻辑地、自觉地相信这一切；但若他不想相信显而易见的实事，他也可以否认这一切。这在于人的意志和理解力。人的可怕而又宏伟的自由正在于此：他既可以承认也可以拒绝上帝和所有现实。他的认知与精神的奥妙正在于此，但他痛苦与折磨的奥妙也正在于此。
    - type: paragraph
      text:
        ru: 'У човечанском свету дела су објективација мисли, осећања, жеља = духа; Исусова дела су објективација Његовог духа. Шта она показују и сведоче? Да је Он заиста Месија, заиста Богочовек: «дела која творим ја у име Оца свога она сведоче за мене»: сведоче да су сва од Бога, и сва Богом; да их нико од људи чинити не би могао; свако од њих одводи Богу. Значи: у свету човечанском дела Божија су стварност, чињенице, земаљско искуство.'
        cn: 在人类世界中，行为是思想、情感、愿望的客观化 = 精神；耶稣的行为是祂精神的客观化。它们显示和见证了什么？祂确实是弥赛亚，确实是神人：「我奉我父之名所行的事，都为我作见证」：见证它们全部源于上帝，且全部由上帝所行；没有任何人能够行出它们；它们中的每一个都引向上帝。这意味着：在人类世界中，上帝的作为是现实、事实、属地的经验。
    - type: paragraph
      text:
        ru: 'Све је ту експериментално, опитно, емпирично. Нема границе између Бога и човека, између оног и овог света: сав је Бог присутан у овоме свету, присутан лично и у делима Својим. Раније, Он је био присутан као промислитељска логосна оила; сада је присутан као овештаствљени, учовечени Бог Логос, као божанска Ипостас, која и твори божанска дела, помоћу Свог човечанског тела. И све је њено – човечанско, људско, овострано, земаљско.'
        cn: 一切都是实验性的，体验性的，实证性的。神与人之间，彼岸世界与此岸世界之间，没有界限：神全然临在于这个世界，亲自临在，也借着祂的作为临在。早先，祂是以护理性的逻格斯力量临在；现在，祂是作为具象化、道成肉身的神逻格斯临在，作为神圣的位格，借着祂的人性身体，也行神圣的作为。并且，祂的一切——是人性（的），是属人的，是此岸的，是属地的。
    - type: paragraph
      text:
        ru: 'Бог нам више није ни далеки туђинац, ни апстракција, ни идеја ни мисао: већ сав – наша земаљска стварност и чињеничност и људскост.'
        cn: 上主对我们而言，不再是疏远的陌生人，不再是抽象概念，不再是理念，亦不再是思想；祂全然是——我们切实的地上实存、事实性与人性。
    - type: paragraph
      text:
        ru: «Али ви не вјерујете; јер нисте од оваца Мојих, као што вам рекох» (Ин.10:26)
        cn: 「你们却不信，因为你们不是我的羊，正如我告诉你们的。」 （约翰福音 10:26）
    - type: paragraph
      text:
        ru: «Али ви не верујете, јер нисте од мојих оваца, као што вам казах». Чиме су то људи престали бити Христове, Божије овце? Тиме што су одбацили бесмртност и пригрлили смрт; а то су учинили заволевши грех, подивљавши од њега, поставши вукови зла.
        cn: 「然而你们不信，因为你们不是我的羊，正如我告诉你们的。」 人们是因何不再是基督的、上帝的羊了呢？是因为他们弃绝了不朽，并拥抱了死亡；他们之所以如此，乃是因着爱上了罪，因罪而变得狂野，成了作恶的狼。
    - type: paragraph
      text:
        ru: 'Грехољубље неда им да верују у Безгрешног; сластољубље неда им да воле Бестрасног. Јер је Христос – смрт за свако грехољубље и сластољубље, а живот за све што је божанско, вечно, бесмртно. Грехољубље поквари човеку вид и слух, те ни у Богу не види Бога, ни у речима Божијим чује Бога: сав је човек и слеп и глув за све што је Божије, Христово, спасоносно.'
        cn: 恋罪阻碍他们相信无罪者；恋乐阻碍他们爱无情欲者。因为基督——是对一切恋罪和恋乐的死亡，而对一切神圣的、永恒的、不朽的，则是生命。恋罪败坏了人的视力和听力，因此他在神里也看不到神，在神的言语中也听不到神：整个人对于一切属于神的、基督的、救赎性的事物，都既盲目又耳聋。
    - type: paragraph
      text:
        ru: «Овце Моје слушају глас Мој, и Ја њих познајем, и за Мном иду. И Ја им дајем живот вјечни, и никад неће изгинути, и нико их неће отети из руке Моје.» (Ин.10:27–28)
        cn: 「我的羊听我的声音，我也认识它们，它们也跟着我。我赐给它们永生，它们永不灭亡，也没有人能从我手里把它们夺去。」 (约翰福音 10:27-28)
    - type: paragraph
      text:
        ru: 'Мрзи ли грех, а воли Христа Бога и његово Еванђеље, он је већ прогледао и у Христу Бога утледао, и прочуо – и у речима Христовим Бога чуо. Такав човек испуњује себе од врха до дна, и открива да све што је у њему вредносио – припада Богу Логосу, Христу, «своје» је Богочовеку, и природно је што иде за Њим. И још: помоћу еванђелских врлина и светих сила он се све више орођује са Хрисгом, све више постаје Његов, све Га више познаје и упознаје.'
        cn: 如果人恨恶罪，并爱基督上帝和祂的福音，他便已经得了洞见，在基督里看见了上帝，并已经得闻，在基督的话语中听见了上帝。这样的人从里到外地充满自己，并发现他自身所珍视的一切，都属于圣言上帝、属于基督，是神人「祂自己的」，他追随祂是自然的。此外：借助福音的德行和神圣的力量，他与基督日渐亲密无间，越来越成为祂的，也越来越认识祂、了解祂。
    - type: paragraph
      text:
        ru: 'И идући за Христом Богочовеком, он уствари иде својом несавршеном истином за савршеном истином, својом несавршеном правдом за савршеном правдом, својом несавршеном љубављу за савршеном љубављу, својим несавршеним бићем за савршеним бићем, својим несавршеним животом за савршеним вечним животам. Стога Спас и вели: «И ја ћу им дати живот вечни, и никада неће изгинути, и нико их неће отети из руке моје». И Спас га даје кроз све еванђелске врлине: кроз љубав, веру, молитву, пост, смиреност и др. Кроз сваку од њих, Он разлива по души човековој живот вечни. Зато се сваки који практикује еванђелску свету љубав осећа вечним још овде на земљи; тако и онај који практикује еванђелску молитву; или пост, или ма коју другу врлину. Све су то свете божанске силе које духовно сједињују човека са Богочовеком и овај га испуњује кроз њих вечним животом. «И никад неће изгинути»: никаква смрт нема власти над њим: све своје биће, сву душу, сво срце, сву снагу пренели су у бесмртност и вечност, у Богочовека. «И нико их неће отети из руке моје»: нико од ђавола, нико од христобораца, нико од људождера.'
        cn: 当他追随神人基督时，他实际上是以自己不完美的真理追随完美的真理，以自己不完美的公义追随完美的公义，以自己不完美的爱追随完美的爱，以自己不完美的存在追随完美的存在，以自己不完美的生活追随完美的永恒生活。因此，救主也说：「我将赐予他们永生，他们永不灭亡，也没有人能将他们从我手中夺去。」救主通过所有福音性的美德赐予这永生：通过爱、信、祷告、禁食、谦卑等等。通过其中的每一种美德，祂将永生倾注于人的灵魂之中。因此，每一个践行福音性圣爱之人，在此世便已感受到永恒；践行福音性祷告的人亦然；或是践行禁食，或是任何其他美德的人也一样。这些都是神圣的力量，将人与神人基督属灵地结合起来，神人基督便通过这些力量使人充满永生。「他们永不灭亡」：没有任何死亡能在他身上拥有权柄：他们已将自己整个的存在、整个的灵魂、整个的心、整个的力量都转移到不朽和永恒之中，转移到神人基督里面。「也没有人能将他们从我手中夺去」：无论是魔鬼，是抵挡基督者，是噬人者，都不能。
    - type: paragraph
      text:
        ru: Смрти, ти хоћеш да ме отмеш, – али ја сам у рукама Његовим, Богочовековим, како ћеш ме отети из руке Бесмртнога и Свепобеднога? И сви пороци редом – камо ћете отети христоносца из Христових руку? Јер у свему томе ви имате посла са Богочовеком, не са трошним човеком. А кроз Богочовека имате посла са Самим Богом Оцем. Јер ако се и саблазните о Богочовека, да је слаб и немоћан зато што је у телу, али – и кроз тело и из тела он је нераздељиво сједињен са Оцем.
        cn: 死亡啊，你想要把我夺走——但我是在祂——即神人——的手中，你怎能从那不死者和全胜者的手中把我夺走呢？所有的恶习，逐一地——你们怎能从基督手中夺走一个负基督者呢？因为在这一切之中，你们所面对的是神人，而不是一个会朽坏的人。而通过神人，你们所面对的是父神自己。因为即便你们因神人而跌倒，认为祂因在肉身之中而软弱无力，但是——祂藉着身体，并从身体之中，与父神不可分割地联合。
    - type: paragraph
      text:
        ru: «Отац Мој који ми их је дао већи је од свију; и нико их не може отети из руке Оца Мојега. Ја и Отац једно смо.» (Ин.10:29–30)
        cn: 「我父所赐给我的，比一切都大；没有人能从我父手里把他们夺去。我与父原为一。」(约翰福音 10:29-30)
    - type: paragraph
      text:
        ru: 'Зато је и сва моћ и сила његова од Оца и у Оцу: «Отац Мој који ми их даде већи је од свију; и нико их не може отети из руке Оца Мога»: нико, јер су све руке свих створених бића исувише кратке исувише немоћне да би се могле пружити до Бога Оца и отети хриотољуице из руку Његових свемоћних. «Нико»: ни смрт, ни ђаво, ни грех. А све остало у свету – вуче Богу, привлачи Боту, упућује Богу. Утолико пре, што је Богочовек – једносуштан са Богом Оцем. У томе је Његова изузетна свемоћ и сила божанство:'
        cn: 因此，他的一切权能与力量都来自父，也在父里面：「我父把羊赐给我，他比万有都大，没有人能从我父手里把他们夺去」（约翰福音 10:29）：没有人能，因为所有受造物的一切手都太过短小、太过软弱无力，无法伸展到天父上帝那里，并从祂全能的圣手中夺走爱基督者。「没有人能」：既不是死亡，也不是魔鬼，也不是罪。而世上其余的一切都引向上帝，吸引向上帝，指向上帝。更何况，道成肉身者与父上帝是同一本性。在此，便是祂卓越的全能、力量与神性：
    - type: paragraph
      text:
        ru: '«Ја и Отац једно смо. Ја – Богочовек, ја Бог Логос са телом; и тело сам учинио Својим, учинио га Својим моме божанству, и кроз Моје божанство сјединио га и учинио својим и Оцу. Иако је лично Моје, оно је преко Мога божанства у нарочитом јединству са Оцем мојим. Преко тела и по телу ја сам једносуштан са људима; преко Божанства и у божанству Ја сам једносуштан са Богом Оцем. Зато људима на чисто човечански природан начин могу пружити и дати оно што је Божије, а и Богу на чисто божански природан начин могу принети оио што је људско. Тако: Богочовек је спона и веза Бога и људи, оног и овог света. Савршена богочовечанска синтеза. То је природно и логично када се са вишег, и највишег, човечанског гледишта пооматра Богочовек и Његово место и значај у свету.'
        cn: 「我与父原为一。我是神人，我是道成肉身的上帝圣言；我使身体成为我自己的，使它成为我神性的，并借着我的神性，使它与父结合并归于父。尽管它是属于我个人的，但它借着我的神性，与我的父有着特殊的合一。借着身体，就身体而言，我与人类同质同体；借着神性，就在神性而言，我与上帝父同质同体。因此，我可以以纯粹的人性自然方式向人类提供并赐予属上帝之物，也可以以纯粹的神性自然方式向上帝献上属人之物。如此：神人是上帝与人类、彼世与此世的纽带与联结。完美的、神人合一的综合。当从更高、乃至最高的人类视角审视神人及其在世界中的地位和意义时，这是自然而合乎逻辑的。
    - type: paragraph
      text:
        ru: '«А Јудејци опет подигоше камење да Га каменују. Исус им одговори: Многа добра дјела показах вам од Оца Својега, за које од тих дјела Ме каменујете? Одговорише Му Јудејци: Не каменујемо Те за добро дјело, него за хулу, што се ти човјек будући, правиш Бог.» (Ин.10:31–33)'
        cn: 犹太人又拿起石头来要打他。耶稣回答说：「我从我父那里向你们显明了许多善事，你们为哪一件善事拿石头打我呢？」犹太人回答说：「我们不是为善事拿石头打你，乃是为着你僭妄的话；因为你虽然是人，却自称是神。」 (约翰福音 10:31-33)
    - type: paragraph
      text:
        ru: 'Али то није ни природно ни логично када се Богочовек посматра из жабље, грехољубиве, гмизавачке перопективе. Јер се тада посматра исквареним умом и посувраћеном логиком: наопачке се посматра, наопаки су и закључци. Грех прво разори ум у човеку, затим упрља срце, те човек не види ни себе, ни Бога; ни правог себе, ни правог Бога. То је разлог што многи савременици Христови не виде у њему Богочовека, већ хоће да га каменују што тврди да је једно са Оцем. Спас их онда упозорава на овоја «добра дела», учињена на очиглед свију.'
        cn: 但是，当从青蛙般的、嗜罪的、爬虫般的视角来审视神人时，这既不自然也不合逻辑。因为那时是用败坏的理智和颠倒的逻辑来审视的：审视的方式是反常的，结论也都是反常的。罪首先摧毁了人里面的理智，然后玷污了心，以致人既看不到自己，也看不到神；既看不到真实的自己，也看不到真实的神。这就是为什么许多基督的同代人没有在他里面看到神人，反而想用石头打他，因为他声称与父原为一。那时，救主就这些在众人眼前所行的「善行」警告他们。
    - type: paragraph
      text:
        ru: 'Шта су она? За које од њих Он заслужује да буде каменован? И за дивно чудо, ни један од њих не рече: дела твоја нису добра или: ово дело твоје није добро, и заслужујеш да будеш каменован због њега као и када их је питао: «који ме од вас кори за грех?» Али налазе софистички, лукав изговор: «за добро дело не бацамо камење на те, него за хулу на Бога, што ти, човек будући, градиш се Бог» А то баш што називају богохулством – највећа је и најглавнија истина Богочовекова: Он на њој стоји сав, и целокупно Његово богочовечанско дело спасења света. Јер само као Бог и човек Он може обавити, и обавља, спасење света од греха, смрти и ђавола. Не од чега мањег и слабијег, већ од трију најстрашнијих и најљудождерскијих сила. Да је заиста једнак Богу, и Бог, Господ Христос упорно брани и кад хоће да га због тога камеиују. Јер то је нешто чега се Он никада и ни по коју цену не може одрећи. Јер би се одрекао себе и целокупног дела Свог. То Спас и образлаже Светим Писмом.'
        cn: 它们是什么？祂因其中哪一件配得被石头砸死？令人称奇的是，他们竟无一人说：「你的行为不好」或者：「你的这件行为不好，你配因此被石头砸死」，正如祂曾问他们：「你们中间谁能指证我有罪呢？」然而，他们却找出了一个诡辩的、狡猾的借口：「我们不是为善事拿石头打你，乃是为你说僭妄的话；又因你本是人，反将自己当作神。」而他们所称的这「亵渎」，正是神人之最大的、最核心的真理：祂完全立于此真理之上，祂那拯救世界的全部神人工作也立于此。因为只有作为神和人，祂才能完成、并且正在完成将世界从罪恶、死亡和魔鬼手中拯救出来的工作。不是从任何较小或较弱的事物中，而是从三个最可怕、最食人的势力中。即使当他们因此想用石头砸死祂时，主基督仍坚决维护祂确实与神同等，且是神这一事实。因为这是祂永远、无论如何都不能否认的。因为祂若否认，就是否认了自己和祂的全部工作。救主也用圣经来阐明这一点。
    - type: paragraph
      text:
        ru: '«Одговори им Исус: Није ли написано у Закону вашем: Ја рекох: богови сте?» (Ин.10:34)'
        cn: 耶稣回答他们说：「你们的律法上岂不是写着：『我曾说你们是神』吗？」(约翰福音 10:34)
    - type: paragraph
      text:
        ru: 'Тако Бог говори људима: «богови сте». По чему? По боголикости душе. «Богови сте», апи закржљали богови, недовршени, јер сте гресима закржљали боголика бића своја, која су и створена да би се израдила и усаоршила у «богове по благодати». «Богови сте» и по циљу стварања, и по средствима која су вам у рају била дата да то постанете. Али – ви сте узели грех, да тиме себе претворите у богове: «бићете као богови», и гле помоћу греха, постали сте као ћаволи. Јер греси и јесу сила која човека уподобљава ђаволу. То што су људи упропастили грехом, и уместо да постану као Бог постали су као ђаво: уместо да буду богови по благодати они су постали ђаволи по гресима, – то је у потпуности први пут у историји рода људског остварено у Богочовеку Христу. Он је заиста човек који је Бог. Као човек показује свима да је Бог. Када су у Св. Писму названи боговима они «којима реч Божија би», како да није Бог – Син Божији, Христос?'
        cn: 神如此对人说：「你们是神。」凭什么？凭着灵魂的肖神性。「你们是神」，但却是发育不良、尚未完成的神，因为你们因着罪恶，使你们肖神性的存在萎缩了，而这肖神性的存在被造的目的正是为了发展和完善自身，成为「靠恩典而成的神」。你们是「神」，也是因着被造的目的，并因着在乐园里赐予你们为达成此目的的工具。但是——你们选择了罪，妄想以此将自己变成神：「你们将如神一般」，然而，看哪，藉着罪，你们却变成了魔鬼。因为罪恶正是使人与魔鬼相似的力量。人们因罪恶而毁坏的，即非但没有变得像神，反而变得像魔鬼：他们非但没有靠恩典成为神，反而因罪恶变成了魔鬼——这在人类历史中，首次完全藉着道成肉身的神人基督得以实现。他确实是人，又是神。他以人的身份向所有人显明他是神。若圣经称那些「领受神话语的」人为神，那神的儿子基督怎会不是神呢？
    - type: paragraph
      text:
        ru: '«Кад оне назва боговима, којима ријеч Божија би дата, а Писмо се не може укинути. Како ви говорите Ономе кога Отац посвети и посла на свијет: хулиш, зато што рекох: Ја сам Син Божији? Ако не творим дјела Оца Својега, не вјерујте Ми. Ако ли творим, иако Мени не вјерујете, дјелима вјерујте, да познате и вјерујете да је Отац у Мени и Ја у Њему. Тада опет тражаху да Га ухвате; али им се измаче из руку.» (Ин.10:35–39)'
        cn: 祂既然称那些承受神言的人为神，而圣经是不能废弃的。你们怎么能对父所分别为圣并差遣到世上的人说：你僭越，就因为我说我是神的儿子吗？我若不行我父所行的事，你们就不必信我。我若行了，你们纵然不信我，也当信这些事，好叫你们知道并且相信父在我里面，我也在父里面。于是他们又想捉拿祂，祂却从他们手中逃脱了。(约翰福音 10:35-39)
    - type: paragraph
      text:
        ru: '«А Писмо се не може покварити», тј. не може не испунити, одбацити као нешто непотребно или лажно или сувишно. А Христос? Зар свом појавом својом не потврђује све што је речено о Месији у Св. Писму? Сам би Христос «покварио» васцело Писмо Божије када би порекао да је Бог и Син Божији. Да је Он заиста Бог и Син Божији сведоче божанска дела Његова на земљи. Разгрните ма које од њих, у свакоме ћете пронаћи Бога Оца, Његову свестваралачку божанску силу. Штавише, Спас јасно и отворено поставља дилему: «ако не творим дела Оца свога не верујте ми. Ако ли творим, ако мени и не верујете, делима мојим верујте, да познате и верујете да је Отац у мени и ја у њему». «Ако мени и не верујете», зато што ме видите у трошном људском телу, зато што сам «дрводеља», зато што сам по свему човек, онда – ево дела мојих: «делима мојим верујте»: јер сами сведочите да међу њима нема ни једног рђавог (Ин.10:33), већ су сва «добра», а то значи: сва су божанска.'
        cn: 《而圣经是不能作废的》，即，它不能不被成就，也不能被弃绝为无用、虚假或多余之物。那么基督呢？祂岂不是以自己的全部显现，证实了圣经中论及弥赛亚的一切吗？基督自己若否认自己是上帝和上帝之子，就等于「作废」了上帝的全部圣经。祂在地上所行的神圣工作，见证了祂确实是上帝和上帝之子。细察它们中的任何一个，你都会在其中发现上帝之父，以及祂那创造万物的神圣大能。再者，救主清楚而公开地提出了一个两难选择：「如果我不行我父的工，就不要信我。但我若行了，即便你们不信我，也要信我的工，好让你们知道并相信父在我里面，我也在父里面。」「如果你们不信我」，那是因为你们在必朽坏的人身中看见我，因为我是个「木匠」，因为我在各方面都是一个人，那么——看哪，这是我的工：「你们要信我的工」：因为你们自己见证说，在它们之中没有一件是邪恶的（约翰福音 10:33），而是每一件都「好」，这意味着：每一件都是神圣的。
    - type: paragraph
      text:
        ru: 'Идите за њима – коме ће вас одвести ако не Оцу моме који је у мени? и мени који сам у Оцу? Иако човечанска по свој земаљској стварности и очигледности, сва су дела моја – божанска по сили и узроку. Сва она воде кроз Мене Оцу, и кроз Оца Мени. Са једним циљем: да покажу да ја «човек будући», јесам у исто време Син Божији и Бог. И као такав, само као такав, Месија и Спаситељ.'
        cn: 跟从他们——除了引你们到在我里面的我的父，以及在父里面的我那里，还能引你们到谁那里呢？我的所有作为，就其一切属世的真实性和明显性而言，虽是人性的，但在能力和源头上却是神性的。它们都借着我引向父，又借着父引向我。只有一个目的：就是要表明我「身为凡人」，同时也是神的儿子，也是神。而且唯有如此，才是弥赛亚和救主。
    - type: paragraph
      text:
        ru: '«И отиде опет преко Јордана на мјесто гдје Јован најприје крштаваше; и остаде ондје. И многи дођоше к Њему и говораху: Јован не учини ниједно знамење, али све што каза Јован за овога истина бјерше. И многи вјероваше у Њега ондје.» (Ин.10:40–42)'
        cn: '他又往约旦河外去，到了约翰起初施洗的地方，就住在那里。

          有许多人来到他那里，并且说：「约翰没有行过一件神迹，但是约翰指着这个人所说的一切话都是真的。」

          在那里，有许多人信了他。（约翰福音 10:40-42）'
    - type: paragraph
      text:
        ru: 'Најубедљивије сведочанство о томе пружа Претеча. Уствари, сва се његова сведочанства о Исусу као Месији своде на једно сведочанство: да је Исус – Син Божији, Бог. Такав – Исус је највеће чудо у историји рода људског. А Претеча, први сведок и апостол и анђео те јединствене благе вести, јесте велики Пророк и провидац Божији.'
        cn: 关于这一点，施洗约翰提供了最有说服力的见证。实际上，他所有关于耶稣是弥赛亚的见证，都归结为一个见证：就是耶稣是上帝之子，是上帝。如此的耶稣，是人类历史上最伟大的奇迹。而施洗约翰，作为这独特佳音的第一位见证人、使徒和使者，是一位伟大的先知和上帝的先见。
    - type: paragraph
      text:
        ru: 'Многи од Јевреја су то осећали и сазнавали, зато су после свега што је Исус рекао о себи као Сину Божијем и Богу, говорили: «Јован не учини ниједнога чуда, али све што каза Јован за овога истина беше». «Не учини ни једнога чуда», али указа на највеће чудо света: Богочовека Христа.'
        cn: 许多犹太人感受到了并知道了这一点，因此，在耶稣说了关于他自己是上帝之子和上帝的一切之后，他们说：「约翰没有行过一件神迹，但约翰指着这个人所说的一切话都是真的。」「他没有行过一件神迹」，但他指出了世上最大的奇迹：道成肉身的神人基督。
    - type: paragraph
      text:
        ru: 'У томе се и састоји Претечино чудотворство. И испуни богоназначену дужност: «И многи вероваше у Њега», тј. у Исуса као Сина Божјег и Бога.'
        cn: 这正是前驱者的奇迹所在。他履行了蒙神拣选的职责：「许多人信了他」，即，信了耶稣是神的儿子和神。
  - type: heading2
    text:
      ru: Глава једанаеста. Васкрсавање Лазара
      cn: 第十一章。拉撒路的复活
    children:
    - type: paragraph
      text:
        ru: '«Бијаше пак неки болесник, Лазар из Витаније, из села Марије и Марте, сестре њезине. А Марија, чији брат Лазар боловаше, бјеше она која помаза Господа мирисом и обриса ноге Његове својом косом. Онда сестре послаше к Њему говорећи: Господе, ево болује онај кога Ти љубиш. А када чу Исус, рече: Ова болест није на смрт, него на славу Божију, да се Син Божији прослави кроза њу. А Исус љубљаше Марту и сестру њезину и Лазара.» (Ин.11:1–5)'
        cn: «有一个病人，名叫拉撒路，住在伯大尼，是他的姊妹马利亚和马大所住的村子。这马利亚，她的兄弟拉撒路正生病，就是那曾用香膏抹主，并用自己的头发擦干祂脚的。姊妹们就打发人到祂那里去说：「主啊，看哪，你所爱的人病了。」耶稣听见就说：「这病不至于死，乃是为神的荣耀，叫神的儿子因此得荣耀。」耶稣素来爱马大和她姊妹，并拉撒路。» (约翰福音 11:1-5)
    - type: paragraph
      text:
        ru: 'Еванђеље божанског пријатељства: све саткано од светости и нежности. У њему је све ново, и на нов, еванћелски, богочовечански начин природно. Колико дирљиве нежноспи у самом сестрином извештају: «Господе, онај који ти је мио болестан је». И колико нежне божанске свемоћи у Спасовом одговору: «ова болест није на смрт него на славу Божију, да се прослави Син Божији с ње». – Све ново, богочовечански и еванђелски ново: «болест није на смрт». Кад је Син Божији ту, међу људима, међу нама. Штавише: она је «на славу Божију», – то је заиста блага вест, сва нова. Она је основ новозаветне благовести, Еванђеља.'
        cn: 神圣友谊的福音：一切都由圣洁与温柔编织而成。在其中，一切都是新的，并以一种新的、福音的、神人合一的方式自然而然地流露。在姐妹自己的禀报中，是何等感人的温柔：「主啊，你所爱的人病了。」又是何等温柔的神圣全能，在救主的回答中：「这病不至于死，乃是为神的荣耀，叫神的儿子因此得荣耀。」——一切都是新的，神人合一地，福音地，都是新的：「这病不至于死。」当神的儿子在此，在人间，在我们中间。更有甚者：它乃是「为神的荣耀」，——这确实是全然新的好消息。它是新约喜讯，也就是福音，的根基。
    - type: paragraph
      text:
        ru: 'Када Богочовек хоће, Он и болест претвара у славу Божију. А Он то хоће увек у средини оних који сами то хоће, и то иражавају изузетном љубављу према Њему, и Он према њима. Не само болест, него и смрт претвара Богочовек «у славу Божију». То је оно што нико од људи учинити не може. V томе врхуни Његова благовест: Он Први и Једини у роду људском претвара смрт у сан; и проглашава смрт људску спавањем. Јер ои, Свемоћни и Свемилостиви Бог и Господ, буди људе из смрти као из сна:'
        cn: 当神人愿意时，他甚至将疾病转化为上帝的荣耀。而他总是在那些自身愿意如此，并以对他的非凡之爱表达出来的人中间，并且他也同样爱他们。神人不仅将疾病，也把死亡转化为「上帝的荣耀」。这是人类中无人能做到的事。在这其中，他的福音达到了极致：他是人类中第一位也是唯一一位将死亡转化为睡眠的人；并宣告人的死亡为睡去。因为他，全能且全慈的上帝和主，将人们从死亡中唤醒，如同从睡梦中唤醒一般：
    - type: paragraph
      text:
        ru: '«Ово каза, и потом им рече: Лазар, пријатељ наш, заспао је, но идем да га пробудим. Онда рекоше ученици Његови: Господе, ако је заспао, устаће. А Исус им бјеше рекао за смрт његову, они пак мишљаху да говори о починку сна. Тада им Исус рече отворено: Лазар умрије.» (Ин.11:11–14)'
        cn: 「说了这话，随后又对他们说：「我们的朋友拉撒路睡了，我去叫醒他。」于是门徒对他说：「主啊，他若是睡了，就会好的。」其实耶稣这话是指着拉撒路的死说的，他们却以为他说的是歇息睡觉。于是耶稣坦白地对他们说：「拉撒路死了。」 (约翰福音 11:11-14)
    - type: paragraph
      text:
        ru: '«Лазар, наш пријатељ, заспа; него идем да га пробудим». Ученици не разумеју такав однос према смрти; а ко од људи то разуме, када људоко свеопште искуство сведочи да је смрт – уништење тела, а не спавање? «Тада им Исус каза управо: Лазар умре». Зиачи: Благавест Богочовекова: умрети је што и заспати; тело заспи сном из кога га може пробудити Богочовек. Смрт више није страшна, није плашило рода људског. Али само када је Богочовек у нашем човечанском свету, и када Његовим очима, његовим Еванђељем, гледамо смрт и оцењујемо њену природу и њену појаву.'
        cn: 「我们的朋友拉撒路睡着了；我要去唤醒他。」门徒不理解这种对待死亡的态度；世人中又有谁能明白呢？当人类普遍的经验都见证着死亡是身体的毁灭，而不是睡眠。 「耶稣就明明白白地告诉他们：拉撒路死了。」 意思是：神人的福音是：死就是睡着了；身体睡着了，神人可以将其从这睡梦中唤醒。死亡不再可怕，不再是人类的惊恐。但这仅限于神人（基督）在我们人类的世界中，并且我们用祂的眼睛，用祂的福音，来看待死亡并评估它的本质和它的显现之时。
    - type: paragraph
      text:
        ru: Шта је смрт? – Смрт је спавање тела до? – докле Господ хоће, тј. до свеопштег васкрсења. Доказ? Лазарево васкрсење. Јер оно показало да је за Господа Исуса смрт заиста уснуће, заспалост тела. И то, привремена заспалост, па макар се протегла и до Страшног Суда.
        cn: 什么是死亡？——死亡是身体的睡眠，直到何时？——直到主愿意，即直到普世复活。证据呢？——拉撒路的复活。因为这表明，对主耶稣而言，死亡确实是身体的沉睡、入睡。而且，这是暂时的沉睡，即便它会一直持续到终末审判。
    - type: paragraph
      text:
        ru: Онда, смрт није ни у ком случају страшна за Христове следбенике. Јер они осећају и знају да је она пред Господом немоћна као сан и сен.
        cn: 那么，死亡对基督的追随者而言绝不令人畏惧。因为他们感受并知道，它在主面前如同睡和影，是无能为力的。
    - type: paragraph
      text:
        ru: '«И мило ми је због вас што нисам био ондје, да вјерујете; него хајдемо њему. Онда Тома, звани Близанац, рече осталим ученицима: Хајдемо и ми да помремо с Њим. Када пак дође Исус нађе га, а он већ четири дана у гробу. А Витанија бјеше близу Јерусалима око петнаест стадија. И многи од Јудејаца бијаху дошли Марти Марији да их тјеше за братом њиховим. Када пак марта чу да Исус долази, изиђе пред Њега, а Марта сјеђаше дома.» (Ин.11:15–20)'
        cn: 我为你们欢喜，因我那时不在那里，好叫你们相信；但我们去他那里吧。于是，那称为双子的托马对其他的门徒说：我们也去与他同死吧。耶稣到了，就发现他已在坟墓里四天了。毕大尼靠近耶路撒冷，约有十五里路。有许多犹太人来到马大和马利亚那里，为她们的兄弟安慰她们。马大听见耶稣来了，就去迎接他，马大却仍坐在家里。（约翰福音 11:15-20）
    - type: paragraph
      text:
        ru: 'На то и Сам Спас указује, јер одмах иза Својих речи: «Лазар умре», Он додаде: «и мило ми је вас ради што нисам био онамо да верујете». –,,Мило ми је» пгго је амрт ту да бисте могли видети како је немоћна, како је заиста – сан и спавање тела, из кога могу пробудити човека кад год хоћу. – Нико никада није од људи гаворио тако о смрти, и поступао тако са смрћу, и имао власт такву над смрћу.'
        cn: 连救主自己也指出这一点，因为祂说完「拉撒路死了」这句话后，立刻又补充道：「我很高兴我当时不在那里，以便你们可以相信。」——「我很高兴」死亡就在那里，这样你们就能看到它是多么无力，它实际上是如何——肉体的睡眠与沉睡，我随时都能从中唤醒一个人。——从未有人像祂这样谈论死亡，也从未有人像祂这样对待死亡，更从未有人对死亡拥有如此的权柄。
    - type: paragraph
      text:
        ru: '«Онда рече Марта Исусу: Господе, да си Ти био овдје, не би умро брат мој. Али и сада знам, да што год заиштеш у Бога, даће Ти Бог.» (Ин.11:21–22)'
        cn: 于是马大对耶稣说：「主啊，你若早在这里，我兄弟就不会死了。就是现在，我也知道，凡你向神所求的，神必要赐给你。」 (约翰福音 11:21-22)
    - type: paragraph
      text:
        ru: 'То знају само Његови најближи, који су се божанским осећањем љубави везали за Њега, ушли у Његов свет, проникли у Његове тајне и постали пријатељи Његови. Ето, то знају Марта и Марија и исповедају јавно: «Господе! да си ти био овде не би мој брат умро. А и сад знам да што заиштеш у Бога даће ти Бог».. Проширите ово на све људе свих времена. Али, онда: Богочовек заиста није био овде; Отврали смо га из овоје средине, са звмље – гресима; јер смо кроз све грехе своје упорно и христоборачки довикивали Њему: нећемо да ти царујеш над нама! а хоћемо – смрт; нека она царује! – то уствари значи наше људско грехољубље. То је и непосредна наша љубав према смрти, наша заљубљеност у смрт, наша воља за смрт. Уствари, то је наша воља за немоћ, за трулежност, за пролазност, док Христово Еванђеље јесте воља за бесмртност, за непролазност, за вечност, а то: воља за моћ, за истинску моћ, јер је само она моћ истинска, која смрт претвара у немоћ, у сан, у спавање, у сан.'
        cn: '只有祂最亲近的人才知道这一点，那些以神圣的爱之感受与祂结合，进入了祂的世界，洞悉了祂的奥秘，并成为了祂的朋友的人。看哪，马大和马利亚知道这一点，并公开承认说：「主啊，你若早在这里，我的兄弟就不会死。就是现在我也知道，你无论向神求什么，神都会赐给你。」（约翰福音 11:21-22）把这一点延伸到古往今来所有的人。


          然而，那样一来：神人确实不在这里；我们用罪恶将祂从我们中间，从地上赶走了；因为我们借着我们所有的罪恶，顽固地、抵制基督地向祂呼喊：我们不要你作我们的王！而我们要的是——死亡；让它来作王吧！——这实际上意味着我们人类的恋罪之心。这也是我们对死亡直接的爱，我们对死亡的迷恋，我们对死亡的意愿。实际上，那是我们对无力、腐朽、短暂的意愿，而基督的福音则是对不朽、永不消逝、永恒的意愿，那就是：对权能的意愿，对真正权能的意愿，因为只有那种将死亡转化为无力、一场梦、一次沉睡、一场梦的权能才是真正的权能。'
    - type: paragraph
      text:
        ru: '«Исус јој рече: Ја сам васкрсење и живот; који вјерује у Мене ако и умре, живјеће. И сваки који живи и вјерује у Мене неће умријети вавијек. Вјерујеш ли ово?» (Ин.11:25–26)'
        cn: «耶稣对她说：我就是复活，就是生命；信我的人，虽然死了，也必活着。凡活着信我的人，必永远不死。你信这话吗？» (约翰福音 11:25-26)
    - type: paragraph
      text:
        ru: 'Да то осети и сазна, човеку је потребиа вера у Богочовека: «знам да што заиштеш у Бога, даће ти Бог». То је права вера: верује у апослутну свемоћ Христову. Таквој вери Спас и открива сву тајиу Личности Своје, и дела Свог: «Ја сам васкрсење и живот: који верује у мене, ако и умре живеће. И ниједан који живи и верује у мене, неће умрети никад. Верујеш ли ово?»'
        cn: 为了感受和认识到这一点，人需要对道成肉身的神有信心：「我知道你无论向上帝求什么，上帝都会赐给你。」这就是真正的信心：相信基督的绝对全能。对于这样的信心，救主便显明祂位格的全部奥秘，以及祂工作的全部奥秘：「我就是复活和生命：凡相信我的人，虽然死了，也必活着。凡活着并相信我的人，必永远不死。你相信这话吗？」
    - type: paragraph
      text:
        ru: 'Ето Богочовековог скраћеног Еванђеља, ето Свееванђеља: Он је васкрсење и живот, тј. победа над смрћу и бесмртност и живот вечни; а човек=вера у Багочовека, јер том вером он побеђује смрт и стиче бесмртност и живот вечни. «Ја сам васкрсење и живот»: ко је у Мени, и у коме Ја живим: он је и сам васкрсење и живот; то он осећа свим бићем својим још овде на земљи; за њега је смрт тела – успављење тела привремено, а душа се осећа бесмртном и живом свва у Христу; и у њој сва личност човекова, и продужава свој свеживот у Христу с оне стране гроба. То није неки крњи живот, већ напротив сав испуњен Христом, а то: сав испуњен свеживотом, у коме нема трунке смрти, и који смрт тела осећа као спавање тела, из кога ће се оно пробудити на дан суда ради вечнога живота са душом својом.'
        cn: '这就是神人的简明福音，这就是全备的福音：他就是复活和生命，即是战胜死亡、获得不朽和永恒的生命；而人则等于对神人的信心，因为借着这信心，他战胜死亡，并获得不朽和永恒的生命。


          「我就是复活和生命」：凡在我里面的，凡我活在他里面的，他自己也是复活和生命；这他就在这地上用他自己的全人感受到；对他而言，身体的死亡是身体暂时的安眠，而灵魂则在基督里完全感受到自身的不朽和生命；并在其中是人的全部位格，并继续它在基督里、在坟墓的彼岸的全备生命。这不是某种残缺的生命，反之，却是全然充满基督的，也就是说，全然充满全备生命的，其中丝毫没有死亡的痕迹，并且感受到身体的死亡如同身体的沉睡，身体将从这沉睡中在审判之日醒来，为要与它的灵魂一同进入永恒的生命。'
    - type: paragraph
      text:
        ru: 'То значе речи: «Који верује у мене ако и умре живеће». Који у овом свету живи вером Христовом: Еванђељем Христовим и Његовим божанским силама, он сву душу своју толико оживи Христовим свеживотом, толико је сву обесмрти, да она и све што је њено никада умрети неће. То осећање свеживота, свебесмртности је главно осећање Христових људи у овом свету. Пример: свети Мученици, и сви Светитељи уопште. То је њихово свеосећање и свесазнање: из њега изводе оии ове своје мисли, сва осећања, сва расположења, сва дела. Једном речју: сав свој живот. Смрт се у души шири кроз грехе, кроз грехољубље.'
        cn: 这就是话语的意义：「信我的人，虽然死了，也必活着。」凡在这世上凭着基督的信仰——借着基督的福音和祂的神圣力量——而活的人，他便使自己的全魂借着基督的全然生命如此地活过来，如此地使它全然不朽，以至于它和所有属于它的，永远都不会死去。这种全然的生命，全然的不朽之感受，是在这世上的基督之人（信徒）的主要感受。例子：圣殉道者，以及所有广义上的圣徒。这就是他们的全然感受和全然认知：他们从中引申出自己的这些思想、所有的情感、所有的心境以及所有的行为。简而言之：他们的整个生命。死亡借着罪恶，借着对罪的爱，在灵魂中蔓延。
    - type: paragraph
      text:
        ru: 'А бесмртност и живот вечни кроз христољубље: кроз остваривање Христовог Еванђеља. Греси одвајају душу од Бога, а тиме – од извора живота и бесмрћа, и потапају је у глад и смрт: јер душа живи божанским силама; одвајање од њих – то је смрт за њу, она и даље постоји, али постоји, не хранећи се Богом, а то значи: не живи, мртва је Богу и за Бога. Остваривање Еванђеља испуњује душу божанским бесмртним силама, у којима и јесте живот вечни и бесмртни («то чини и бићеш жив»). У томе је сав Богочовек; у тој стварности: Његова личност је и васкрсење и живот; а човек је сав у овоме: у вери у Богочовека. Зато Спас и завршава сво Своје Свееванђеље пигањем: «Верујеш ли ово?»'
        cn: 而不朽与永生是借由对基督的爱而得：借由实现基督的福音。罪使灵魂与上帝分离，从而——脱离了生命与不朽的源头，并将其沉浸于饥饿与死亡之中：因为灵魂靠着神圣的力量而活；与这些力量分离——对它而言就是死亡，它仍旧存在，但其存在却并非以上帝为滋养，这意味着：它并未存活，它对上帝而言是死的，并且在上帝面前也是死的。实现福音，能使灵魂充满神圣不朽的力量，这些力量之中便蕴含着永恒与不朽的生命（「遵此而行，你便可活」）。神人全然在于此；在那实相中：祂的位格既是复活，也是生命；而人全然在于此：在于对神人的信仰。因此，救主便以提问作结，结束了祂的整部圣福音：「你信这话吗？」
    - type: paragraph
      text:
        ru: 'Јер у томе је сва мудрост, сва истина, сва правда, сав смисао људског бића и људског живота. То све и открива једино христољубљу – Марте, и сваког човека, и сваки са њом и кроз њу проповеда веру своју у Исуса као Багочовека и Спаси-теља: «Да, Господе! ја веровах да си ти Христос Син Божји који је требало да доће на свет». Јер без Тебе свет је смрт и ужас и пакао; а са Тобом – бесмртност, радост и рај.'
        cn: '因为在此之中，乃是全部的智慧，全部真理，全部公义，以及人的存在和人的生命的全部意义。这一切都唯独向着对基督的爱显明——向着马大，以及每一个人显明。并且，每个人都与她一同，并借着她宣讲自己对耶稣是神人和救主的信仰：

          「是的，主啊！我信你是基督，是神的儿子，就是那要临到世界的。」 (约翰福音 11:27)

          因为没有你，世界便是死亡、恐怖和地狱；但与你同在，便是永生、喜乐和天堂。'
    - type: paragraph
      text:
        ru: '«Онда Исус, кад је видје гдје плаче, и гдје плачу Јудејци који дођоше с њом, потресе се у духу и сам се узбуди. И рече: Гдје сте га метнули? Рекоше Му: Господе, дођи да видиш. Исусу ударише сузе. Онда Јудејци говораху: Гле, како га љубљаше.а неки од њих рекоше: Не могаше ли овај који отвори очи слијепоме учинити да и овај не умре? А Исус се опет потресе у себи и дође на гроб. А то бијаше пећина, и камен лежаше на њој.» (Ин.11:33–38)'
        cn: 「当耶稣看见她哭，并那些与她同来的犹太人也哭，就心中悲叹，又甚忧愁。便说：『你们把他放在哪里了？』他们对祂说：『主啊，请来看。』耶稣哭了。于是犹太人说：『你看，他多么爱他！』但他们中间有人说：『难道这开了瞎子眼睛的人，不能叫这人不死吗？』耶稣又心里悲叹，来到坟墓。那坟墓是个洞穴，外面有一块石头堵着。」 (约翰福音 11:33-38)
    - type: paragraph
      text:
        ru: Нема потресније чињенице од присуства смрти у човечанском свету који је од Бога створен за бесмртност и живот вечни. Нема потресније ни за Богочовека акамоли за човека. Над том чињеницом никада човеку није довољно плакати и јадиковати. Ево, над том страшном чињеницом плаче и Једини Победитељ смрти – Богочовек Христос. Толико је она страшна, и дирљива, и тајанствена.
        cn: 没有比死亡临在于人类世界这一事实更令人悲恸的了，这个世界是上帝为不朽和永生而创造的。甚至对神人来说，它也是如此令人悲恸，更何况是对凡人呢？面对这一事实，人永远也不足以为之哭泣和悲叹。看哪，面对这一可怕的事实，甚至唯一的死亡战胜者——神人基督，也为之哭泣。它就是如此可怕，如此感人，又如此神秘。
    - type: paragraph
      text:
        ru: Како човек лакомислемо уведе у свој свет овог највећег непријатеља и предаде му царство своје душе? и све престоле свога бића? и отвори му све одаје свога срца? и све скривнице своје свести и савести, те се сав усмрти и осмрти? те му смрт постаде и логична и природна, иако од ње ништа нелогичније ништа неприродније у свима Божјим световима? Од присуства смрти у телу – тело се усмрди. А од присуства смрти у душа, душа се исто тако усмрди. У души смрт је присутна гресима, помоћу грехова. Заиста је само Богочовек – миомир Божји; и људи само Христом постају «Христов мирис Богу» (2Кор.2:15). Он је «мирис живота», а све што није Он – смрад је живота; јер усмрћује живот и све живо, растаче га и усмрћује. Богочовек је безгрешан, и као такав – сав миомир Божји у нашем свету. Када се Он вером усели у срца људска, овда људи потискују из себе грехе, и њихов смрад, и постају «Христов мирис Богу». У томе је и благовест бесмртности Христове што Он омиомирује васцело биће људско. А горковест смрти – што усмрди биће људско. Лазар је већ четири дана у гробу, и «већ смрди», – смрт је свом одвратношћу својом присутна у Лазаревом телу.
        cn: '人是怎样轻率地将这最大的仇敌引入自己的世界，并将他灵魂的国度、他存在中所有的宝座、他心中所有的密室，以及他意识和良知中所有隐秘之处都拱手相让，以致他完全致死并腐化？以致死亡对他而言变得既合理又自然，尽管在上帝所有的世界中，没有什么比死亡更不合理、更不自然的了？


          因着死亡在身体里的临在，身体腐臭。而因着死亡在灵魂里的临在，灵魂也同样腐臭。在灵魂中，死亡是借由罪恶而临在的。诚然，唯有神人是上帝的馨香；人们也唯有借着基督，才能成为「基督的馨香之气归与上帝」（哥林多后书 2:15）。祂是「生命的馨香」，而一切不是祂的，都是生命的恶臭；因为它使生命和一切活物死亡，使之瓦解并致死。神人是无罪的，因此，祂在我们世界中是上帝的完全馨香。当祂借着信心居于人心中时，人们便将罪恶及其恶臭从自身驱逐出去，成为「基督的馨香之气归与上帝」。这正是基督不朽的佳音，祂使整个人类存在都充满馨香。而死亡的苦音，则是它使人类存在腐臭发烂。拉撒路已在坟墓里四天了，并且「他已经发臭了」——死亡以其一切可憎可厌之处，临在于拉撒路的身体里。'
    - type: paragraph
      text:
        ru: 'Има ли спаса од ње? Та она је претворила човека у стид и срам! А Спаситељ о смрти вели: «Не рекох ли ти да ако верујеш, видећеш славу Божију?». Да, из тога се види: права вера је – веровати у најневероватније, веровати у оно шго се противи целокупном искуству рода људског, и разуму и уму, и сазнању. Да, права вера – у одбацивању свега људског, и у потпуном предавању себе Богочовеку. Ако се не одречете себе и све што имате, не можете бити Моји ученици и ићи за Мном. То је еванђелска дилема вере. Не усвоји ли је човек, значи: нема еванђелске вере. Значи још: није доживео своје лично васкрсење Христом, васкрсење душе, савести, срца, јер није сишао у све скривене катакомбе смрти, расејане по његовом бићу, и није васкрсном и свеживотном силом Христовом протерао из себе све смрти.'
        cn: 难道没有得救之道吗？因为她已将人变成了羞耻与耻辱！而救主论及死亡时说：「我不是告诉过你，如果你相信，就会看见上帝的荣耀吗？」是的，由此可见：真正的信仰——就是相信那最不可思议之事，相信那与人类的全部经验，与理智、心智和认知都相悖之事。是的，真正的信仰——在于弃绝一切属人的，并在于将自己完全奉献给神人。你们若不舍弃自己和所拥有的一切，就不能作我的门徒并跟随我。这就是福音的信仰困境。若人不领会它，便意味着：他没有福音的信仰。这还意味着：他没有借着基督经历他个人的复活，即灵魂、良知、心灵的复活，因为他没有进入遍布他生命中的所有隐藏的死亡地穴，也没有借着基督复活的、赐予生命的力量将一切死亡从自己里面驱逐出去。
    - type: paragraph
      text:
        ru: Јер права вера верује да Христос може васкрснути из мртвих и оне најмртвије мртваце моје, оне који «већ смрде». А то су све силе душе моје, које су раслабљене и умртвљене гресима и страстима. Воља моја – сва је мртва пред Богом, ако је подложна гресима; душа моја и срце моје – мртви су пред Богом, ако у њима влада грехољубље и сластољубље; мисли моје – мртве су пред Богом, ако су рђаве, нечисте, прљаве; осећања моја – мртва су пред Богом, ако је кроз њих разливено самољубље. Уствари, безброј је мртваца у мени, и они одавно «већ смрде». Само их Богочовек може васкрснути из мртвих, као што је само он могао васкрснути и четверодневног Лазара.
        cn: 因为真正的信仰相信，基督能使死人复活，甚至是我那最死的死者，那些「已经发臭的」。而这些就是我灵魂的所有力量，它们因罪恶和情欲而衰弱并死去。我的意志——如果它屈从于罪恶，在上帝面前就是完全死的；我的灵魂和我的心——如果贪恋罪恶和贪恋享乐在它们里面作主，在上帝面前就是死的；我的思想——如果它们是邪恶的、不洁的、污秽的，在上帝面前就是死的；我的情感——如果自爱通过它们蔓延开来，在上帝面前就是死的。实际上，我里面有无数的死者，而且它们早已「已经发臭了」。只有神人才能使它们从死里复活，正如只有他才能使那死了四天的拉撒路复活。
    - type: paragraph
      text:
        ru: '«Тада склонише камен гдје лежаше мртвац. А Исус подиже очи горе, и рече: Оче, благодарим Ти што си Ме услишио! А Ја знадох да Ме свагда слушаш: него рекох народа ради који овдје стоји, да вјерују да си Ме Ти послао.» (Ин.11:41–42)'
        cn: «于是，他们挪开了那块石头，死人就在那里安卧着。耶稣举目望天，说：「父啊，我感谢你，因为你已经听了我！我原知道你常听我，但我说这话，是为周围站着的众人，要叫他们相信是你差遣了我。」» (约翰福音 11:41-42)
    - type: paragraph
      text:
        ru: 'Јер васкрсење мртвих – васцело је од Бога. То показује и сам начин обраћања Богочовека Богу Оцу пред васкрсење Лазара. Ту сам човек без Бога не може урадити ништа. Али може дати од себе оно на основу чега Бог може урадити све за њега. А то је: вера у немогуће; вера безусловна у Богочовека и Његову свемоћ и свељубав. Таква вера и јесте потпуна послушност и покориост Богу: потпуна свесност о својој немоћи и Христовој свемоћи.'
        cn: 因为死者的复活——完全是来自神的。这也表明了神人在拉撒路复活前向父神祈求的方式。在此，单凭人自己没有神就什么也做不了。但是，他可以付出自己，以此作为神能为他成就一切的基础。而那就是：相信不可能之事；对神人及其全能与全爱无条件的信。这样的信也正是对神完全的顺服与降服：完全自觉自己的无能和基督的全能。
    - type: paragraph
      text:
        ru: 'По Апостолу: «када сам слаб, онда сам силан»; и још «све могу у Христу Исусу који ми моћи даје». Смернима Господ даје благодат, а гордима се противи. То је основно начело еванћелског живота, вечног живота и победе над смрћу, и једном и другом.'
        cn: 照着使徒的话说：「我什么时候软弱，什么时候就刚强了」(哥林多后书 12:10)；又说：「我靠着那加给我力量的，凡事都能做」(腓立比书 4:13)。主赐恩惠给谦卑的人，却抵挡骄傲的人。这是福音生活、永生以及胜过死亡的基本原则，对二者皆然。
    - type: paragraph
      text:
        ru: '«И ово рекавши, викну громким гласом: Лазаре, изиђи напоље! И изиђе умрли увијен по рукама и ногама погребним повојима, и лице му убрусом повезано. Исус им рече: Раздријешите га и пустите нека иде.» (Ин.11:43–44)'
        cn: 「说了这话，就大声呼喊说：拉撒路，出来！那死了的人就出来了，手脚裹着布，脸上包着手巾。耶稣对他们说：解开他，让他走吧。」 (约翰福音 11:43-44)
    - type: paragraph
      text:
        ru: '«Лазаре, изиђи напоље!» – И изиђе мртвац обавит платном по рукама и по ногама, и лице његово убрусом повезано. «Исус им рече: раздрешите га и пустите нек иде». Ово је чињеница; она нам је дата као очигледиа, али не и начин на који је она постала чињеницом. У маломе: то је поновљеио стварање. Нама је васиона дата као готова чињеница, готова стварност, али нам није показан сам начин стварања васионе, њена унутрашња архитектоника. Ми видимо траву да расте, али не видимо начин на који расте.'
        cn: «拉撒路，出来！»——死人就出来了，手脚都缠着布，脸上也蒙着头巾。 «耶稣对他们说：解开他，让他走吧»。 这是一个事实；它作为显而易见的被赐予我们，但并非它成为事实的方式。 简单来说：这是重复的创造。 宇宙作为既成事实、既成实在被赐予我们，但创造宇宙本身的方式，以及其内部的架构，并未向我们展示。 我们看到草在生长，但我们看不到它生长的方式。
    - type: paragraph
      text:
        ru: 'Тако и васкрсење Лазарево, и уопште васкрсење мртвих: то је чињеница, стварност коју остварује сила Божија, али како – то не видимо и не знамо. Чак и ово: ми осећамо, осећања имамо, али на који се начин она формирају у нама, и какве све наше унутрашње силе учествују у њиховом формирању, ми не знамо. То исто важи и за наше мисли.'
        cn: 同样地，拉撒路的复活，以及普遍的死人复活：那是一个事实，一个实相，是上帝的能力所成就的，但如何（发生）——我们看不到也无从得知。甚至于此：我们能感知，我们有情感，但它们是如何在我们里面形成的，以及我们里面有哪些内在力量参与了它们的形成，我们不知道。同样适用于我们的思想。
    - type: paragraph
      text:
        ru: «Онда многи од Јудејаца који бијаху дошли Марији, видјевши шта учини Исус, повјкероваше у Њега. Неки пак од њих отидоше фарисејима и казаше им шта учини Исус.» (Ин.11:45–46)
        cn: 于是，那些曾来看望马利亚的犹太人中，有许多人看见耶稣所行的事，就信了祂。但他们中间，也有一些人去见了法利赛人，把耶稣所行的事都告诉了他们。(约翰福音 11:45-46)
    - type: paragraph
      text:
        ru: 'Циљ је и овог чуда – спасење душа људских вером: «Да верују да си ме ти послао» (Ин.11:42). И заиста многи од Јудејаца који видеше шта учини Исус, вероваше у Њега: тј. примише Га за све и сва у своме животу.'
        cn: 这个神迹的目的也是——藉着信德拯救人类的灵魂：「叫他们信是你差了我来。」 (约翰福音 11:42)。确实，许多犹太人看见耶稣所行的事，就信了祂：也就是说，他们在自己的生命中将祂接纳为一切。
    - type: paragraph
      text:
        ru: '«Онда првосвештеници и фарисеји сабраше Синедрион, и говораху: Шта да радимо? Овај човјек чини многа знамења? Ако Га оставимо тако, сви ће повјеровати у Њега, па ће доћи Римљани и узети нам и земљу и народ.» (Ин.11:47–48)'
        cn: 「于是，祭司长和法利赛人聚集了公会，说：『我们怎么办呢？这个人行了许多神迹。如果我们这样由着祂，众人都要信祂，罗马人就要来夺取我们的地土和百姓。』」（约翰福音 11:47-48）
    - type: paragraph
      text:
        ru: 'А фарисеји и главари свештенички «сабраше скупштину, и говораху: шта ћемо чшшти? човек овај чини многа чудеса, Ако га оставимо тако, сви ће га веровати: па ће доћи Римљани и узети нам земљу и народ». – Каква сатанска логика: изврћу у политичке закључке чисто духовне чињенице! васкрсење мртвог Лазара – какве везе има са римском политиком. Никада, ни једном речју, акамоли делом, чудом, Спас није узео у обзир политички положај Јевреја. Он их је спасавао од греха, и доносио им слободу од греха, смрти и ђавола.'
        cn: 而法利赛人和祭司长「聚集了公会，并说：『我们该做什么呢？这个人行了许多神迹。如果我们任凭他这样，众人都要信他；罗马人也要来夺取我们的地土和百姓了。』」（约翰福音 11:47-48）——这是何等撒但的逻辑：他们将纯粹的属灵事实扭曲成政治结论！使死去的拉撒路复活——这与罗马的政治有何关联呢？救主从未，无论是通过言语，更不用说通过行动或神迹，考虑过犹太人的政治处境。他拯救他们脱离罪恶，并赐予他们脱离罪恶、死亡和魔鬼的自由。
    - type: paragraph
      text:
        ru: 'Не само њима, већ свима људима он је објављивао једно исто небеско и божанско Еванђеље: како се савлађује смрт и грех, и помоћу светих божанских сила и врлина стиче бесмртнност и живот вечни. А све остало што припада људском животу има се нормирати према томе, и регулисати тиме и у светлости тога. А они подмећу Спасу политичке циљеве. Па и то подметање Божији промисао искоришћује у пророштво о спасоносности смртне жртве Христове за јеврејски народ и за све људе опште: јер ће смрћу својом Богочовек «расејану децу Божију (грехом и смрћу) скупити у једно». И тиме пореметити све политичке планове јеврејске, и – скупити све људе у једну истину Божију, у једно Еванђеље, у «један свети народ», «народ Божији».'
        cn: 他不仅是向他们，而是向所有人宣扬同一个属天和神圣的福音：如何战胜死亡和罪，并借着神圣的力量和美德获得不朽和永生。而所有属于人类生活其余的一切，都必须以此为准则，并以此来规范，且在其光照之下。然而他们却给救主安插政治目标。甚至这种安插，神的旨意也加以利用，成为基督为犹太民族和所有世人所作的死亡牺牲的救赎性预言：因为神人将藉着祂的死亡，「将散居的上帝的儿女（因罪和死亡）聚集归一」。借此打乱了所有犹太人的政治计划，并且—将所有人聚集到同一个神的真理中，聚集到同一个福音中，聚集到「一个圣洁的民族」，即「神的民族」中。
    - type: paragraph
      text:
        ru: «Од тога, дакле, дана договорише се да Га убију.» (Ин.11:53)
        cn: «从那天起，他们就定意要杀他。» (约翰福音 11:53)
    - type: paragraph
      text:
        ru: 'Заиста је савремени јеврејски интелектуализам неизвинљиво покварен и рђав: васкрсење Лазарево узима као најјачи разлог због кога треба убити Богочовека: «од тога дана договорише се да га убију». Да га убију зато што је васкрсењем Лазаревим показао да је човек – бесмртно биће, и да силу бесмртности има и даје људима само Богочовек.'
        cn: 确实，当代的犹太知识分子主义不可原谅地败坏和邪恶：他们将拉撒路的复活视为应该杀死那神人最强烈的理由：「从那日，他们就商议要杀他。」[约翰福音 11:53] 杀死他，因为他通过拉撒路的复活显明了人是永恒不朽的生命，并且唯有神人拥有并赋予世人这不朽之力。
    - type: paragraph
      text:
        ru: 'Као да веле: нећемо бесмртност! нећемо бесмртнога! хоћемо да останемо робље смрти; да нам све буде смртно, све, све, све…'
        cn: 他们仿佛在说：我们不要不朽！我们不要那不朽者！我们要继续作死亡的奴隶；让我们的一切都是必死的，一切，一切，一切……
  - type: heading2
    text:
      ru: Глава дванаеста. Христос у Витанији и Јерусалиму
      cn: 第十二章. 基督在伯大尼和耶路撒冷
    children:
    - type: paragraph
      text:
        ru: «А Исус на шест дана прије Пасхе дође у Витанију, гдје бјеше Лазар који умрије, кога Он подиже из мртвих. Ондје Му пак зготовише вечеру, и Марта служаше, а Лазар бјеше један од оних што сјеђаху са Њим за трпезом. А Марија, узјевши литру правога нардова скупоцјенога мириса, помаза ноге Исусове, и обриса косом својом ноге Његове; а кућа се напуни мириса од мира.» (Ин.12:1–3)
        cn: 耶稣在逾越节前六天来到伯大尼，那里有拉撒路，就是曾死了又蒙祂从死里复活的那人。人在那里为祂预备了筵席，马大伺候，拉撒路也在那些与耶稣同席的人中。马利亚就拿着一斤极贵的真拿рд香膏，抹耶稣的脚，又用自己的头发擦祂的脚；屋里就满了香膏的香气。(约翰福音 12:1-3)
    - type: paragraph
      text:
        ru: 'Ево човека из онога света: човека из мртвих; он живи међу осталим људама; сав је – сведочанство о овом свету, о бесмртности душе, о васкрсењу мртвих. Ето, посредно је испуњена жеља богаташева из пакла: Бог је послао Лазара из мртвих за сведочанство свима људима о оном свету, о бесмртности и васкрсењу. И ено где седи са Иоусом за трпезом. А сестре васкрслога Лазара? Њихов дом – то је мали рај, обновљени рај, а за трпезом њиховом: Бог и Господ Христос. Није, ваљда, било у свету срећније породице. Две сестре: Марија – сва небо, сва – небеско Еванђеље Христово; а Марта – сва Еванђеље небеско на земљи, сви – служба Исусу, и око Исуса. Као и обимно «Марта служаше», као анђео око Господа. А Марија? мироносица вечна: сва јој душа од небеских миомира: она многоценим миром помаза ноге Исусове, и отре косом својом ноге његове; и кућа се напуни мириса од мира». Магдалина – сва је у томе: сву је душу сабрала у Христољубљу нарочито сада, после васкрсења милог јој брата, она – «из које је некад седам духова истерао». За сведочанство свима: шта може Исус да начини од људског бића: да га васцело преобрази у вечни «мирис Божији». Он: једини и прави «мирис Божији», «мирис живота», у коме вама ни трага од смртнога, од трулежнога, ни трага од злосмрадија. Сав – благоуханије.'
        cn: 这是一个来自彼世之人：一个从死者中来的人；他活在世人之中；他全然是对此世、对灵魂不死、对死者复活的见证。看哪，地狱里那财主的愿望间接地实现了：上帝从死者中派遣了拉撒路，为要向世人见证那彼世、见证灵魂不死与复活。看哪，他正与伊苏斯一同在筵席上。那么，复活的拉撒路的姊妹们呢？她们的家——那是一个小天堂，一个被更新的天堂，在她们的筵席上，有上帝与主基督。世上大概没有比这更幸福的家庭了。两个姊妹：玛利亚——她全然是天，全然是基督属天的福音；而马大——她全然是地上的属天福音，全然是服侍伊苏斯，并且围绕着伊苏斯。正如那丰盛的「马大伺候着」，如同围绕着主的使者。那么玛利亚呢？永恒的抹香膏者：她整个灵魂都散发着属天的馨香：她用极贵重的香膏抹伊苏斯的脚，又用自己的头发擦干祂的脚；「屋子里就满了香膏的香气。」抹大拉——她全然投入其中：她把全部的灵魂都集中在对基督的爱里，尤其是在她亲爱的兄弟复活之后，她——「曾有七个鬼从她身上赶出来」。为向众人作见证：伊苏斯能把人类的生命塑造成什么样：就是将他完全地蜕变为永恒的「上帝的芬芳」。他：那唯一且真正的「上帝的芬芳」，「生命的芬芳」，在祂里面，没有任何死亡的痕迹，没有任何腐朽的痕迹，没有任何恶臭的痕迹。他全然是馨香。
    - type: paragraph
      text:
        ru: 'Он је сишао у наш земаљски свет, и «кућа» света – васиона – «напуни се мириса од мира». Тако је свет постао са Христом и у Христу: «мирис Божији». Да, тако је постао рај: Сигурно је и рај некада, пре смрти и греха, мирисао Богом, мирисом Божијим: сав је свет кроз сва бића и све твари био мироточив, сав логосан логоточив. Нико као Магдалина није знао и осетио шта је пријаноо Богу у телу: миомир од људи. Најдирљивија захвалност за све што нам је донео: за божанско Еванђеље и спасење. Све миомирне мисли душе своје, сва миомирна христочежњива осећања своја Магдалина је измешала са миром, прала њиме ноге Исусове.'
        cn: 他降临到我们这尘世，而世界的「殿堂」——宇宙——「充满了香膏的芬芳」。如此，世界与基督同在，并在基督里，成为了「上帝的馨香」。是的，乐园也因此而生：乐园在死亡和罪恶降临之前，也曾确实地散发着上帝的芬芳，上帝的馨香：整个世界，通过一切受造物和万有，都流溢着香气，全然是逻各斯，全然流溢着逻各斯。没有人像马格达利娜那样深知并感受到，何为蒙神悦纳的肉身之香：即由人而发的馨香。这是对祂赐予我们的一切：即神圣福音和救赎，最动人的感谢。马格达利娜将她灵魂中所有馨香的思想、所有馨香且渴慕基督的情感，都与香膏混合在一起，用它洗涤了耶稣的脚。
    - type: paragraph
      text:
        ru: '«Онда рече један од ученика Његових, Јуда Симонов Искариотски, који Га намераваше издати: Зашто се ово миро не продаде за триста динара и не даде сиромасима? А ово не рече што му бјеше стало до сиромаха, него што бјеше лопов, и имаше кесу, и узимаше што се меташе у њу. А Исус рече: Остави је! Она је то сачувала за дан Мојега погреба; Јер сиромахе свагда имате са собом, а Мене немате свагда.» (Ин.12:4–8)'
        cn: 于是祂的一个门徒，就是那将要出卖祂的加略人西门的儿子犹大说： 「为什么这香膏不卖三百第纳尔，用来施舍给穷人呢？」 他说这话，不是因为他关心穷人，而是因为他是个贼，他掌管钱囊，常窃取其中所投入的。耶稣说：「由她吧！她是为了我安葬之日存留这香膏的。因为穷人你们常和他们同在，只是我，你们不常有。」 (约翰福音 12:4-8)
    - type: paragraph
      text:
        ru: 'Зато је Господ овај њен дар и подвиг оценио бескрајно високом ценом. Магдалина је показала: да је Богочовек највећа вредност, и за сиромахе највећа; кад је Он у нашем свету, и сиромасима је лакше, и њима се проповеда Еванђеље и њихов живот постаје благовест, а они – благовесници. – Доласком Бога Логоса у свет учовечењем његавим: биће људско постаје сасуд мириса Божијет, вечног и непролазног, и човек постаје – мироточац; јер постаје бесмртан; а где нема греха, зла и смрти, ту нама ни злосмрадија; у Богочовеку тога нема, зато је – сав мироточац. То је нова вредност, која се ничим земаљским ни људским не може довољно, ни достојно оценити. А Јуда хоће да је – новцем оцени, да је обесцени. А Спас смерни? Нешто, нешто казује о тој свевредности коју Он Собом претставља за наш земаљски свет: «сиромахе свагда имате са ообом, а мене немате свагда». Немате нарочито онда када мене и моје Еванђеље хоћете да оцените вашом пијачном, новчаном ценом. Немате Ме ни онда, када грехе и сласти волите. А сиромахе имате, нарочито онда, јер их својим сластољубљем умножавате. Матдалинин подвиг – мио је Спасу, нарочито као символ његовог погреба. Људи помазују мртве мирисима да би отклонили злосмрадије смрти. Христово тело не виде труљење, зато у њему не би смртнота задаха, јер је сво без греха и зла, зато и у гробу миомирно. Али, као људско тело, требало је да и оно буде миропомазано. Магдалина је то учинила: и миром помазала «мирис Божији», «мирие живота» вечнога. То спада у свете, еванђелске обичаје. – Учинити то у присуству Лазара васкрслог, који је само за четири дана у гробу «већ» почео да смрди. А сада – седи сав с «мирисом живота» и смирењем поред Богочовека.'
        cn: 因此，主将她的这份礼物和功德评价为无限崇高的价值。马利亚·玛格达利娜表明：神人是最大的价值，对穷人而言也是最大的；当祂在我们世界中时，穷人也更容易，福音也传给他们，他们的生命成为佳音，而他们则成为佳音的传报者。— 借着道成肉身，圣言神降临世界：人类的存在成为神圣芬芳，永恒而不朽的器皿，人也成为——流香者；因为他变得不朽；而在没有罪恶、邪恶和死亡的地方，就没有恶臭；在神人那里没有这些，所以祂——完全是流香者。这是一种新的价值，是任何属世或属人的事物都无法充分或恰当地评估的。而犹大却想——用金钱来评估它，从而贬低它。然而那谦卑的救主呢？祂说了些什么，关于祂自己为我们这个尘世所代表的这一至高价值：「常有穷人和你们同在，只是你们不常有我。」 你们尤其没有我，当你们想用你们市井的、金钱的价格来评估我和我的福音时。你们也没有我，当你们热爱罪恶和放纵享乐时。但你们有穷人，尤其在那时，因为你们通过自己的贪乐增加了他们。马利亚·玛格达利娜的功德——蒙救主悦纳，尤其作为祂埋葬的象征。人们用香膏膏抹死者，以消除死亡的恶臭。基督的身体未见朽坏，因此祂里面没有死亡的臭气，因为祂完全没有罪恶和邪恶，所以即使在坟墓中也是芬芳的。但是，作为人的身体，它也需要受膏抹。马利亚·玛格达利娜做到了：她用香膏膏抹了「神圣芬芳」，「永恒生命的芬芳」。这属于神圣的福音习俗。—— 在复活的拉撒路面前做这件事，他仅仅在坟墓里四天「就已经」开始发臭了。而现在——他带着「生命的芬芳」和谦卑，完全地坐在神人身边。
    - type: paragraph
      text:
        ru: «Дознаде пак многи народ из Јудеје да је ондје и дођоше не само ради Исуса, него и да виде Лазара кога Он подиже из мртвих. А првосвештеници се договорише да и Лазара убију; Јер многи од Јудејаца долажаху због њега и вјеровхау у Исуса.» (Ин.12:9–11)
        cn: «有许多来自犹太的民众得知祂在那里，就来了，不只是为了耶稣，也是为了看拉撒路，就是祂使他从死里复活的。而祭司长们商议，要把拉撒路也杀了；因为有许多犹太人为了他的缘故而来，并信了耶稣。» (约翰福音 12:9-11)
    - type: paragraph
      text:
        ru: 'Није чудо што је он привлачио свет, јер су многи дошли «не само Исуса ради него и да виде Лазара кога подиже из мртвих». А главари свештенички договорише се да и Лазара убију; јер многи њега ради иђаху из Јудеје и вероваху у Исуса». Колико лудила у бићима људским! Да, јер је то врховно лудило: хтети убити васскрслог човека, живог и очигледног сведока човекове победе над смрћу, човекове бесмртности и вечности. Али тиме је овај грех нарочито и грешан, раван христоубиству. Као да веле: нећемо бесмртност! остави нас у смрти, у гресима! само нећемо с тобом, Боже и Богочовече! нећемо, нећемо, нећемо!'
        cn: '不足为奇，他吸引了世人，因为许多人前来，「不只是为了耶稣，也是为了见那从死里被他复活的拉撒路。」 (约翰福音 12:9)


          而祭司长们商议也要杀拉撒路；「因为有许多人为了他，离开了犹太地，信了耶稣。」 (约翰福音 12:10-11)


          人心中何等疯狂！是的，因为那是极度的疯狂：竟然想杀一个复活的人，一个活生生、明证着人类战胜死亡，人类不朽与永恒的见证。


          然而，这个罪恶也因此格外地罪孽深重，简直与弑基督无异。


          仿佛他们说：「我们不要不朽！把我们留在死亡和罪恶中吧！只要我们不与你同在，我的神，我的神人！我们不要，我们不要，我们不要！」'
    - type: paragraph
      text:
        ru: '«Сутрадан многи народ који бјеше дошао на Празник, чувши да Исус долази у Јерусалим, узеше гране од палми и изиђоше Му у сретање и клицаху: Осана! Благословен који долази у Име Господње, цар Израиљев! А Исус нашавши магаре усједе на њега, као што је писано: Не бој се, кћери Сионова, ево цар твој долази сједећи на магарету. Али ово не разумјеше испрва ученици Његови; него када се прослави Исус, онда се сјетише да ово бјеше за Њега писано, и да Му ово учинише. А свједочае народ који јбеше с Њим када Лазара позва из гроба и подиже га из мртвих. Због тога му и изиђе народ у сретање, јер чу да је Он учинио ово знамење. А фарисеји рекоше међу собом: Видите како ништа не помаже. Ето, свијет оде за Њим.» (Ин.12:12–19)'
        cn: 次日，有许多来过节的百姓，听说耶稣将到耶路撒冷，就拿着棕树枝，出去迎接他，喊着说：「和散那！奉主名来的，是应当称颂的，以色列的王啊！」耶稣寻得一匹驴驹，就骑上去了，正如经上所记的：「锡安的女儿啊，不要惧怕！看哪，你的王骑着驴驹来了。」这些事门徒起初不明白，等到耶稣得了荣耀以后，他们才想起经上是指着他写的，并且人果然向他做了这事。那些和耶稣在一起的百姓就作见证，说他曾把拉撒路从坟墓里召出来，使他从死里复活。因此，众人也出去迎接他，因为他们听说他行了这神迹。法利赛人就彼此说：「你们看，我们毫无益处。看哪，全世界都去随从他了。」（约翰福音 12:12-19）
    - type: paragraph
      text:
        ru: 'Испуњују се пророштва о кротком Цару, о Цару мира и смерности: Исус, Господ васионе, јаше на магарету онда када свет прославља Њега као Цара и световног чудотворца: «осана! благослоден … цар Израиљев!» и овим хоће да нам покаже да царство Његово «није од овога света»; да његова делатност нема ничег политичког (ср.Ин.11:48): да је царство његово: Истина, Бесмртност, Живот вечни. Али ово нико не разумеваше, па ни ученици Његови, док Исус не васкрсе из мртвих. Само, народ је осећао у Лазаревом васкрсењу грациозност чуда: «зато га и срете народ, јер чуше да Он учини ово чудо».'
        cn: 关于那位温柔谦卑的君王、那位平安与谦逊的君王的预言正在应验：宇宙之主耶稣，当世人颂扬祂为君王和属世的行神迹者时，却骑着驴驹：「和散那！蒙福者……以色列的王！」祂以此向我们表明，祂的国度「不属于这个世界」；祂的事工毫无政治色彩（参阅约翰福音 11:48）；祂的国度是：真理、不朽和永生。然而，没有人明白这一点，甚至包括祂的门徒，直到耶稣从死里复活。唯独民众在拉撒路的复活中感受到了神迹的恩典：「因此，众人也去迎接祂，因为他们听说祂行了这神迹。」
    - type: paragraph
      text:
        ru: 'Сведоче очевици: «народ сведочаше који беше пре с Њим кад Лазара изазва из гроба и подиже га из мртвих». А сам Лазар? као живи споменик бесмртносги и васкрсења ту је, међу њима. Убедљивијег сведочанства и свестранијег не може ни бити. Људска природа, људска скептичиоа логика мора положити оружје? Да, она га и полаже. Али га не полаже људска злоба, људска пакост, људска завист.'
        cn: 目击者作证说：「当时与他同在的民众，在他把拉撒路从坟墓里召出来并使他从死人中复活时，就作证了。」而拉撒路本人呢？作为不朽和复活的活生生纪念碑，他就在那里，在他们中间。没有比这更有说服力、更全面的见证了。人的本性，人的怀疑主义逻辑难道不需要放下武器吗？是的，它确实放下了。但人的邪恶、人的恶意、人的嫉妒却不放下武器。
    - type: paragraph
      text:
        ru: 'Ево доказа: «а фарисеји говораху међу собом: видите да ништа не помаже? гле, свет иде за њим», «свет, сав свет, не само народ, или људи. Али ипак, зато они остају при одлуци: да убију Исуса. То је још један доказ колика је сила богоборног зла у човеку. Заиста је душа људска у бунилу и лудилу од греха. Неисцељиво болесна: никакви људски лекови ту не помажу; само један лњк: Богочовек и његов надумни подвиг спасења људи од греха, смрти и ђавола. Зато се Бог Логос и оваплотио, јер је само Бог могао спасти човека, и нико друти, нико ни од анђела ни од људи.'
        cn: 这就是证据：「法利赛人彼此议论说：你们看，我们徒劳无益？看哪，世人都随从他去了。」「世人，是普世的人，不只是百姓，或某些人。但他们仍然坚持自己的决定：要杀死耶稣。这是人心中与神为敌的邪恶力量何等强大的又一证明。人的灵魂确实因罪而处于谵妄和疯狂之中。无可医治的疾病：没有任何人为的药物能对此有所帮助；只有一个良药：神人以及祂超乎理智的救赎壮举，将人从罪、死亡和魔鬼中拯救出来。因此，上帝圣言（Logos）道成肉身，因为唯有上帝能拯救人类，别无他人，无论是天使还是人类都不能。
    - type: paragraph
      text:
        ru: '«А бијаху и неки Јелини међу онима који дођоше да се поклоне о Празнику. Они, дакле, приступише Филипу, који бјеше из Витсаиде Галилејске, и мољаху га говорећи: Господине, хоћемо да видимо Исуса, дође Филип и каза Андреју, а опет Андреј и Филип казаше Исусу. А Исус им одговори говорећи: Дошао је час да се прослави Син Човјечији. Заиста, заиста вам кажем: ако зрно пшенице паднувши на земљу не умре, онда једно остане; ако ли умре, род многи доноси. Који воли живот свој изгубиће га, а ко мрзи живот свој на овоме свијету самочуваће га за живот вјечни.» (Ин.12:20–25)'
        cn: 「也有一些希腊人，在那些上来过节礼拜的人中。他们就去见腓力，这腓力是加利利伯赛大的人，对他说：『先生，我们想见耶稣。』腓力去告诉安得烈，安得烈同腓力又去告诉耶稣。耶稣回答他们说：『人子得荣耀的时候到了。我实实在在地告诉你们，一粒麦子不落在地里死了，仍旧是一粒；若是死了，就结出许多子粒来。爱惜自己生命的，就丧失生命；在这世上恨恶自己生命的，就要保全生命到永生。』」 (约翰福音 12:20-25)
    - type: paragraph
      text:
        ru: 'Али шта о Исусу чудотворцу мисли грчка мисао, грчки дух, грчка философија? И шта опет мисли Исус о грчкој мисли? Грци изјављују апостолу Филипу: «Господине, ми бисмо хтели да видимо Исуса». Зашто? Ето, ту су о Празнику у гомили света који слави Исуса чудотворца. Све је за њих то ново, нарочито – васкрсли Лазар. То грчка мисао не зна, нити може да схвати. То се противи јасним принципима аристотеловске «логике». Али, шта ћемо са чињеницом; куда ћемо са живим фактом: васкрслим Лазаром? На њихову жељу Спас одговара тако, да заиста одговором решава главни проблем грчке мисли, грчког духа, грчке философије (стих 23–25).'
        cn: '但是，希腊思想、希腊精神、希腊哲学对行神迹的耶稣有什么看法呢？而耶稣又怎么看待希腊思想呢？


          希腊人对使徒腓力说：「先生，我们想见耶稣。」为什么呢？原来，在节日期间，他们身处一群赞美行神迹的耶稣的人中间。对他们而言，这一切都是新鲜的，尤其是——复活的拉撒路。这希腊思想不了解，也无法理解。这违背了亚里士多德式「逻辑」的明确原则。


          但是，事实又如何呢？对于这活生生的事实——复活的拉撒路，我们又该怎么办呢？针对他们的愿望，救主如此回答，他的回答确实解决了希腊思想、希腊精神、希腊哲学的主要问题（经文 23-25）。'
    - type: paragraph
      text:
        ru: 'Грчка мисао је сва антропоцентрична и антрополатричка, хуманистичка и хоминистичка; сва се аксиологија и критериологија може свести на софистичко руководно начело: «човек је мера и мерило свега», човек је мера свију бића и свију ствари. Али, ето, грчка мисао нека примени то мерило на Исуса, на васкрслог Лазара. Е, то је нешто што грчка мисао не обухвата својом проблематиком; то је животни сектор који није ушао у њене логичке схеме и дијалектичке проблеме. Живот је несравњено и шири и дубљи и безграничнији но што то грчка мисао замишља и зна. Главно је да је њено основно начело: уско, сувише људско, и стога – егоистично, самољубиво, саможиво; потпуно затворено човеком, његовом природом и том рационалном Рационалистичком; а онај главни део људске природе, који је небеског, божанског порекла није ни узет у обзир. А мора се узети, јер – ето Лазара васкрслог ту, па ето и Исуса, васкрситеља мртвих и чудотворца.'
        cn: 希腊思想是完全人类中心主义的，人类崇拜的，人本主义的，以及人类本位的；其所有的价值论和判准论都可以归结为诡辩的指导原则：「人是万物的尺度和衡量标准」，人是一切存在者和一切事物的尺度。然而，且看希腊思想如何将那衡量标准应用在耶稣身上，应用在复活的拉撒路身上。哎，那是希腊思想在其问题体系之内所不涵盖的；那是生命的一个领域，没有进入其逻辑图式和辩证问题。生命远比希腊思想所想象和所知的更为宽广、更为深刻、更为无垠。关键在于，其基本原则是：狭隘的、过于人性的，因此——是利己的、自爱的、自我中心的；完全被局限于人、人的本性以及那种理性主义的理性；然而人性中那个主要的部分，即具有属天、神圣起源的，却丝毫没有被纳入考虑。然而，它必须被考虑到，因为——看啊，复活的拉撒路就在那里，且看，还有耶稣，死者的复活者和行神迹者。
    - type: paragraph
      text:
        ru: 'А Исус одговара Грцима и ако га они не питаше, на главну муку њиховог духа, и то им одговара «Син Човечији», тј. као прави човек, који зна и осећа све муке духа људског, бића људског, коме ништа људско није непознато, већ који зна човека и све његово из свог личног, непосредног искуства. Одговор Исусов поставља и тачну дијагнозу грчког ума и духа и даје једини, прави лек за његово исцељење: «заиста, заиста вам кажем: ако зрно пшенично паднувши у земљу не умре, онда једно остане, ако ли умре, много рода роди».'
        cn: 但耶稣回答希腊人，即使他们没有问祂，祂回答他们精神上的主要痛苦：「人子」。即作为真正的人，祂深知并感受人类精神和存在的全部痛苦，对祂而言，没有任何人性的事是陌生的，而是祂从自己亲身、直接的经验中了解人及其一切。耶稣的回答对希腊人的心智和精神做出了准确的诊断，并提供了唯一、真正的医治良方：「我实实在在地告诉你们：一粒麦子不落在地里死了，仍旧是一粒；若是死了，就结出许多子粒来。」（约翰福音 12:24）
    - type: paragraph
      text:
        ru: 'Дух људски, мисао људска, првенствено мисао грчка је затворена као зрно пшенично, затворена човеком, његовим егоцентризмом, антропоцентризмом који долази од антрополатрије: његовом аутаркичношћу, самодовољношћу, по начелу најубитачнијем за свако биће, од зрна пшеничног па до човека и анђела: Бити довољан самом себи. Које се убрзо претвори у неминовног близанца свог: бити задовољан собом.'
        cn: 人的精神，人的思想，尤其是希腊思想，如同麦粒般被封闭。它被人类、被人的自我中心主义、被源自对人崇拜的人类中心主义所封闭，表现为人的自给自足与自我满足。这遵循着对一切受造物——从麦粒到人，再到天使——而言最具致命性的原则：自足于自身。这一原则很快就转变为其必然的双生子：满足于自身。
    - type: paragraph
      text:
        ru: 'То је начело смрти, сваке смрти; јер чим се једно биће затвори у себе, и собом, оно умире: тако зрно пшенично, тако сваки цветић ако није отворен према осталој природи и не храни се њоме, онда вене и умире и умре; тако свака птичица, сваки инсект, ако се затвори у себе и остане при својој природи – гине, пропада, нестаје; тако и човек: ако се затвори у себе, у своју природу, у свој дух, у своју логику, у своју мисао; ако остане у својој природи и при својој природи, онда – суши се, вене, умире, сам остане; отвори ли пак тело према природи и узима од ње светлост, влагу, топлоту, ваздух, храну, пиће, онда – живи; тако и дух, отвори ли се према светлости духовној, и топлоти духовној, и храни духовној – Богу, и узима ли све то, онда живи широким и бесмртним животом, животом божанским. Зрно пшенично све дотле остаје једно, тј. бескорисно и за себе и за друге, док остаје у свом уском егоизму, у границама свога бића; чим се реши да изађе из те смрти, оно отвара себе, жртвује себе, «умире», рашчиња се и кроз њега прострује и уструје живи сокови земље, с топлотом и влаге и светлост, и све остале животворне силе, и оно се оплоди, поново роди, улази у нови, шири, дубљи живот, и класа и раћа многи род. Значи: жртвујући себе, саму природу своју, оно је оплодило, обесмртило себе, јер је унело у себе безброј других сила које су га спасле саможиве и самољубиве умртвљености и увеле у нови, шири, бесмртни живот. Само када се убије самољубље, омогућено је развијање, оплођење «мртве природе». Тај нам принцип живота важи и за људско биће у његовој целости.'
        cn: 这是死亡的原则，一切死亡的原则；因为一个生命一旦封闭在自己里面，并以自我为限，它就会死亡：就像一粒麦子，就像每一朵小花，如果它不向其余的自然开放，不从中汲取养分，那么它就会枯萎、凋零并死去；同样，每一只小鸟，每一个昆虫，如果它封闭在自己里面，并固守自己的本性——它就会消亡、败落、消失；人也是如此：如果他封闭在自己里面，在他的本性中，在他的精神中，在他的逻辑中，在他的思想中；如果他固守自己的本性并以自己的本性为限，那么——他就会枯竭、凋零、死去，独自一人留下；但如果他将身体向自然开放，并从中获取光照、湿润、温暖、空气、食物、饮水，那么——他就会活下来；精神也是如此，如果它向属灵的光照、属灵的温暖、以及属灵的滋养——即上帝——开放，并从中汲取这一切，那么它就会活出广阔而永恒的生命，即神圣的生命。一粒麦子在它自己的狭隘利己主义中，在它存在的界限内，始终是孤立的，也就是说，对自己和对他人都是无益的；一旦它决定摆脱那种死亡，它就会打开自己，牺牲自己，「死去」，分解自身，大地生命的汁液、伴随着温暖、湿润和光照、以及所有其他赋予生命的力量就会涌入并流经它，于是它就被孕育，重生，进入一个新的、更广阔、更深刻的生命，并结出许多子粒。这意味着：牺牲自己，牺牲自己的本性，它孕育了自己，使自己不朽，因为它将无数其他力量引入自身，这些力量将它从自私自爱、死气沉沉的状态中拯救出来，并带入了一个新的、更广阔、不朽的生命。只有当自爱被杀死时，「死寂的本性」才能得到发展和孕育。这个生命原则也适用于作为整体的人类。
    - type: paragraph
      text:
        ru: 'Све док је човек самољубив, тј. саможив, затворен у себе и хоће да живи само од себе, у себи, за себе, он је уствари бесплоДан.А чим пробије то буре самољубља и саможивости љубављу према другом, ближњем, Богу, он излази на нови живот, шири и дубљи: нове животне силе уструје у њега из спољњег света: и цело биће његово почиње да ради, узаври. Само кад човек душу своју подвигом вере посеје у Богу, онда се њено «зрно пшенично» рашчиња,»умире», и кроз то умирање проклија у нови, шири, божански, бесмртни живот, јер из Бога уструје у њу бесмртне божанске силе, и душа «много рода роди», тј. рађа бесмртне мисли, бесмртна осећања, бесмртна дела. Речју: она сва постаје бесмртна Богом, и зато способна да рађа из себе оно што је бесмртно, божанско, вечно, богочовечно.'
        cn: 只要人是自我中心的，也就是自私自利的，封闭在自己里面，只想靠自己而活，活在自己里面，为自己而活，他实际上就是毫无果实的。而一旦他借着对他人、对邻舍、对上帝的爱，冲破那自私自利与自我中心的牢笼，他便进入一种新的、更广阔、更深刻的生命：新的生命活力从外部世界涌入他里面：他的整个生命就开始运作，沸腾起来。只有当人借着信心的苦修将自己的灵魂播种在上帝里面时，它的「麦子」就会消解，「死去」，并且借着这死亡，发芽长成一种新的、更广阔的、神圣的、不朽的生命，因为不朽的神圣力量从上帝涌入其中，灵魂便「多结果实」，也就是说，生出不朽的思想、不朽的情感、不朽的行为。简而言之：它整个借着上帝变得不朽，因此能够从自身生出不朽的、神圣的、永恒的、神人合一的事物。
    - type: paragraph
      text:
        ru: 'Али први услов за то је: изгубити душу своју, омрзнути саможивост, самољубље, самодовољност, и заволети Бога, Богочовека и бити убеђен: само у Богу и само Богом човек је у истини човек, постаје бесмртан и вечан, тј. богочовечан; живот човеков је прави живот када се претвори у богоживот; и мисао – када се претвори у богомисао, и осећање – у богоосећање; једном речју: када се васцело биће човеково претвори у богочовечанско биће. Онда постаје јасна свеспасоносна еванђелска благовест и мерило: човек је само човек Богочовеком; и Богочовек је мерило свих бића и свих ствари у свим световима. Онда, човек: Богочовеком и ради Богочовека воли људе као бесмртна боголика бића; а и себе воли само као боголико биће, а не себе – грехољупца и сластољупца.'
        cn: 但首要的条件是：丧失自己的灵魂，憎恨自我中心、自爱、自足，并爱上帝，爱神人，并确信：唯独在上帝里并唯独借着上帝，人才是真实的人，变得不朽和永恒，亦即神人性的；人的生命当其转变为神性生命时，才是真正的生命；思想——当其转变为神性思想时，情感——当其转变为神性情感时；简而言之：当人的整个存在转变为神人性的存在时。那时，普世救恩的福音和准则就变得清晰了：人唯独借着神人才是人；并且神人是所有世界中所有存在和所有事物的准则。那时，人：借着神人并为了神人，爱人如同不朽的、神肖的存有；而且只爱自己作为一个神肖的存有，而不是爱那个罪恶爱好者和享乐爱好者。
    - type: paragraph
      text:
        ru: 'Душа моја – сама за себе мртвац је, ако не оживи и не обесмрти себе помоћу богочовечанских врлина; без Бога њу не треба волети, јер је она без Бога – само велика мука човекова; а Богочовека Христа треба претпоставити души својој као љубав мржњи, и онда ће тек човек правилно оценити себе, и почети живети правим еванђелским животом, који није ништа друго до вечни живот човеков у Богу, овде на земљи и горе на небу. То значе Спасове необичне речи: «који љуби душу своју изгубиће је; а ко мрзи душу своју на овом свету, сачуваће је за живот вечни».Као што тело, зато што је од земље, мора да се храни земљом; тако и душа, зато што је боголика, зато што је од Бога мора да се храни Богом, ако хоће да живи. Уобрази ли душа, и ако боголика, да је самостална, и довољна себи, тј. љуби ли само себе, она уствари губи себе, убија себе, а чим осети да је она без Бога ништа, и да ће умрети вечном смрћу ако се Њиме не храни и не одржава, она омрзне себе, не сматра себе низашто, већ сву вредност своју види у Богу и сву бесмртност, и сву вечност и сав рај.'
        cn: 我的灵魂，若不藉著神人兼具的美德使自己活过来并获得不朽，它自身就是死的；没有上帝，就不应该爱它，因为没有上帝，它就只是人类极大的痛苦；而那神人基督，应当置于自己的灵魂之上，如同爱胜过恨一般，这样人才会正确地评价自己，并开始过上真正的福音生活，这福音生活无非就是人在上帝里的永恒生命，无论是在地上还是在天上。这就是救主那些非凡话语的含义：「爱惜自己生命的，就必丧失生命；在这世上恨恶自己生命的，就必保全生命到永生。」正如身体，因其出于尘土，必须以尘土为食；灵魂也一样，因其肖似上帝，因其源于上帝，若要存活，就必须以上帝为食。假如灵魂，即使它肖似上帝，却妄想自己是独立的、自给自足的，也就是说，如果它只爱自己，它实际上就丧失了自己，杀死了自己；而一旦它感觉到，没有上帝它就一无是处，并且如果不以上帝为食并由祂维系，它就会死于永恒的死亡，它就恨恶自己，不认为自己有什么价值，而是将自己所有的价值、所有的不朽、所有的永恒和所有的天堂都看到在上帝那里。
    - type: paragraph
      text:
        ru: 'Грех, самоубиствени грех хуманизма и хоминизма је баш у томе: што боголику вредност човекову проглашава за самовредност, за свевредаост; а уствари је она само клица вредности, и свевредности, каја постаје правом вредношћу и свевредношћу када се човек усаврши и доврши Бгом, Бопочовеком. Човек је само почетак, само клица, која брзо угине, ако се не засеје у Богу, у Богочовеку, у његовом Еванђељу; он је све дотле саинго «зрно пшенично», које увек «једно остане». А многи род роди само ако подвигом вере посеје себе у Богочовеку, и осталим саможртвеним подвизима укорени себе у Богочовеку, те тако стекне бесмртност и живот вечни.'
        cn: 人本主义和人类中心主义的罪，其自绝的罪，就在于此：它宣称人的神圣价值是自足的价值、普世的价值；而实际上，这价值不过是价值和普世价值的萌芽，唯有当人被上帝、被神人完善并成全时，它才成为真正的价值和普世价值。人只是一个开端，一个萌芽，如果不播撒在上帝里，在神人里，在他的福音里，它就会迅速枯萎；在那之前，他只不过是「一粒麦子」，它总是「仍是一粒」。而它唯有在借着信德的苦修将自己播撒在神人里，并通过其他自我牺牲的苦修将自己扎根在神人里时，才能结出许多果实，如此便获得不朽和永生。
    - type: paragraph
      text:
        ru: «Ко Мени служи, за Мном нека иде, и гдје сам Ја, ондје ће и слуга Мој бити; и ко Мени служи томе ће дати почаст Отац Мој.» (Ин.12:26)
        cn: 「若有人服事我，就当跟随我；我在哪里，我的仆人也要在那里；若有人服事我，我父必尊重他。」(约翰福音 12:26)
    - type: paragraph
      text:
        ru: 'Отуда само следовање Богочовеку, спасава човека од смрти и преводи у бесмртност и живот. Богочовеку се следује кроз богочовечаиоке врлине; оне су пут ка њему и кроз њепа; помоћу њих се човек усељује у њега, утврћује у њему, и он у човеку; а ове оне значе живот у Христу и Христом, стално борављење у Њему и Њиме. То казују речи Спасове: «ко Мени служи, за Мном нек иде, и где сам Ја онде и слуга Мој нека буде; и ко Мени служи онога ће прославити Отац мој».'
        cn: 因此，仅仅跟随神人，就能将人从死亡中拯救出来，并带入不朽和生命。借由神人性的美德来跟随神人；这些美德是通往祂的道路，也是藉着祂的道路；藉着它们，人得以居住在祂里面，在祂里面得以坚固，祂也居住在人里面；而这些都意味着在基督里并藉着基督而活的生命，恒常地在祂里面并藉着祂而居住。救主的这些话语表明：「若有人服事我，就当跟随我；我在哪里，我的仆人也要在哪里；若有人服事我，我父必使他得荣耀。」
    - type: paragraph
      text:
        ru: 'Где је то Господ Христос? У свему што је божанско, бесмртно, вечно: у вечној Божанској Истини и Правди, и Љубави и Доброти и Милости и Мудрости у свима божанским савршенствима, у Бесмртностима, у Вечности, у Рају = у свему томе треба да буде и сваки слуга Христов. Следбеник Христов продужава живот Христов на земљи, и то продужава га самим Христом, који је увек у свима Својим следбеницима «у све дане до свршетка овета» То је један недељив живот: богочовечански живот, који је почео са Христом и наставља се Њиме у Богочовечанском телу Његовом – Цркви; то један недељив богочавечански подвиг, који је почео Христом и наставља се кроз све сутелеснике Богочовечанског тела Његовог – Цркве. У томе је сва тајна свих светова, у којима Богочовек живи и влада. Зато и тако велика част, изузетна част, припада следбеницима Христовим: њих поштује сам Бог Отац! Да, човека поштује Бог! каква необична част!'
        cn: '主基督在哪里？


          在一切神圣的、不朽的、永恒的事物中：在永恒的神圣真理与公义中，在爱、良善、怜悯与智慧中，在一切神圣的完满中，在不朽中，在永恒中，在天堂中——每个基督的仆人也当置身于这一切之中。基督的追随者在地上延续基督的生命，并且是借着基督自己来延续，因为基督常在祂所有的追随者中，「直到世代的终结」。那是一个不可分割的生命：一个神人生命，它始于基督，并借着祂在祂的神人身体——教会中延续；那是一个不可分割的神人功修，它始于基督，并借着祂神人身体——教会中所有的同体肢体而延续。所有世界的全部奥秘就在于此，在这些世界中，神人生活并掌权。因此，如此巨大的荣耀，这无比的尊荣，属于基督的追随者：天父上帝亲自尊荣他们！是的，上帝尊荣人！这是何等非凡的尊荣！'
    - type: paragraph
      text:
        ru: «Сад је душа Моја узбуђена, и шта да речем? Оче, спаси Ме од часа овога; али зато дођох за час овај.» (Ин.12:27)
        cn: 「现在我的灵魂感到搅动不安，我该说什么呢？父啊，求你救我脱离这时刻；但我正是为此时刻而来的。」 (约翰福音 12:27)
    - type: paragraph
      text:
        ru: 'Најраскошнији пример свега реченога: Богочовек Христос. Посејавши кроз добровољну Крсну омрт пшенично зрно Своје Личности, Он је родио толики род, да је довољан да увек храни и довољно нахрани све људе свих врвмена и свих вечности који су гладни Божије Истине, Бњсмртности, Вечности: свега Божијег, Богочовечански свеистинито гожазано: да на самопожртвовању стоји свет, сав Божији свет: Бог се жртвује за свет, за сав свет, на челу са родом људским. И тако Богочовек открива као Спаситељ ано што је као Творац ставио као циљ у души своје тваревине: самопожртвовање као средство себеобесмрћења, себеумножења, себепродужења кроз сву вечност. То самопожртвовање, та саможртва је и божански и човечански најсавршенија у Богочовеку Христу, те је на првом месту то хришћанско схватање света и живота; и још: основно начело и основна сила еванђелског живота људског у свету. Богочовеково је начело, свеначело: жртвуј себе за друге: ђаволово је начело, свеначело: жртвуј друге себи.'
        cn: 这一切所说的最宏伟的典范：神人基督。祂借着甘愿的十字架上的死亡，播撒下祂位格的麦粒，结出如此丰盛的果实，足以永远供养并饱足地喂饱所有时代、所有永恒中那些饥渴于上帝的真理、不朽与永恒——一切属于上帝的——的人。神人基督全然真实地彰显：世界立足于自我牺牲，整个上帝的世界皆是如此：上帝为世界，为整个世界，以人类为首而牺牲自己。如此，神人作为救主显明了祂作为造物主曾置于受造物灵魂中的目的：自我牺牲，以此作为自我不朽、自我增殖、自我延续贯穿所有永恒的方式。这种自我牺牲，这种自我献祭，在神人基督里，无论是神性上还是人性上，都是最完美的；因此，这首先是基督徒对世界和生命的理解；而且，它也是世上人类福音生活的基本原则和基本力量。神人的原则，总原则是：为他人牺牲自己；魔鬼的原则，总原则是：为自己牺牲他人。
    - type: paragraph
      text:
        ru: 'Самопожртвовање је израз свељубави еванђелске, богочовечанске; самоодржање себично и егоцентрично је израз мржње ђаволске. Самопожртвавање је божански метод живота у свима световима; самоодржање – ђаволски метод. Као творевина, и то чиста творевина, ђаволов грех је саможив од врха до дна, и увек друге жртвује себи. Усвојивши грех као метод живоха, људи су одбацили божанско свеначело живота: самопожртвовање, жртвовање себе за друге, и пригрлили демонско свеначело живота: самоодржање, жртвовање других себи и за себе. На том путу људи су се толико обезбожилии, ођаволили, да су просто изгубили лик Божији у себи; једва је нешто остало у њима што личи на Бота, и подсећа на некадашњу допадну боголикост. Спаситељ види све људе, онакажене, избезумљене, залуђене гресима, види их све својим бестелесним свевидећим оком, и потресно доживљује то, нарочито предголготском страдању Свом. Гледајући све ужасе људског грехољубља, све лешеве духовне, Спас збори: «сад је душа моја жалосна», жалосна. на догдеду свега што су људи учинили од себе пригрливши грех, и кроза њ смрт и ђавола, а напустивши Бога, а са Њим бесмртност и живот вечни.'
        cn: 自我牺牲是福音的、神人性的全爱的表达；自私和以自我为中心的自我保存是魔鬼的憎恨的表达。自我牺牲是神圣的、在万有世界中的生命之道；自我保存——是魔鬼之道。作为受造物，而且是纯粹的受造物，魔鬼的罪彻头彻尾地自私自利，并总是将他人献祭给自己。采纳罪作为生命之道，人们抛弃了神圣的生命总纲：自我牺牲，为他人而牺牲自己，并拥抱了邪魔的生命总纲：自我保存，为自己将他人献祭给自己。在这条道路上，人们变得如此去神化，如此魔鬼化，以至于他们完全失去了内在的上帝肖像；他们身上几乎没有留下任何像上帝的东西，并且提醒着他们曾经可喜的神性肖像。救主看到所有被罪孽扭曲、疯狂、迷惑的人，祂用祂无形的全视之眼看到他们所有人，并且痛苦地经历这一切，尤其是在祂加略山前的受难中。看到人类罪恶之爱的所有恐怖，所有属灵的尸体，救主说：「现在我的心极其忧伤」，忧伤。这是鉴于人们拥抱了罪，并借着罪（拥抱了）死亡和魔鬼，又抛弃了上帝以及与祂同在的不朽和永生，从而将自己变成了这副模样的一切境况。
    - type: paragraph
      text:
        ru: '«Жалосна је душа моја» што су људи толико ослепили себе, грехољубљем, да не виде, ни мало не виде да је пут њихове бесмртности у самопожртвовању, а не себичном и саможивом самоодржавању. Ево све смрти људске су предамном, и сви ужаси које су оне починиле са родом људским; о како је због свега тога, и у сред свега тога, тешко и мучно и страшно бипи човек; са свих страна насрћу на мене све смрти људске, урлају, прождиру, све што је људско, о: «сад је душа моја жалосна». Толике страхоте вихорима и олујама смрти ударају на мене: ено, сваки човек је читава смрт, и сви они, сви људи свих векова, избезумљени смрћу урлају, вапију, грче се, превијају од неућутних болова: «и шта да кажем? Оче, сачувај ме од овога часа!» али – ако Ја не узмем на себе све те смрти, ко ће спасти људе од њих, ко? Нико. Јер они сами сви до једног, робље су, кукавно и беспомоћно робље смрти.'
        cn: 「我的灵魂甚是忧伤」，因为人们被贪爱罪恶蒙蔽了自己，以至于他们全然看不见，丝毫看不见，他们不朽的道路在于自我牺牲，而非自私和贪生怕死的自我保全。看哪，所有人类的死亡都在我面前，以及它们对人类所造成的一切恐怖；哦，因此，又在这一切之中，作为一个人是多么艰难、痛苦和可怕！人类的一切死亡从四面八方向我袭来，它们咆哮着，吞噬着一切属于人类的东西，哦：「现在我的灵魂甚是忧伤。」如此多的恐怖以死亡的旋风和风暴向我袭来：看哪，每个人都是一个完整的死亡，而他们所有的人，所有世代的人，都被死亡逼疯了，咆哮着，哀嚎着，痉挛着，在无休止的痛苦中翻滚着：「我说什么才好呢？父啊，救我脱离这时候！」但是——如果我不能将所有这些死亡承担到自己身上，谁能将人们从它们中间拯救出来呢？谁能呢？没有人。因为他们自己，每一个人，都是奴隶，死亡可怜而无助的奴隶。
    - type: paragraph
      text:
        ru: 'То свим бићем осећам Ја: моја човечанска природа, сва је у грозници од страха пред смрћу, пред толиким смртима, јер их за све људе и уместо свих људи ја доживљујем као своје смрти. Све је то исувише страшно: «али зато дођох на час овај»: да све то осетим, проживим, и својом божанском силом спасем људе од смрти, од свих смрти, и кроз свељубеће самопожртвовање покажем им једини сигурни пут који их води у бесмртност и живот вечвни.'
        cn: 我以我整个的生命感受着这一点：我的人性，完全因着对死亡的恐惧，因着对如此众多死亡的恐惧而颤抖，因为我为所有的人，并代替所有的人，将这些死亡体验为我自己的死亡。所有这一切都过于可怖了：「但我正是为这时刻来的」：为了感受这一切，经历这一切，并用我神圣的力量将人们从死亡中，从所有的死亡中拯救出来，并通过全爱的自我牺牲，向他们显明那唯一引领他们进入不朽与永生的确凿道路。
    - type: paragraph
      text:
        ru: '«Оче, прослави Име Своје! Тада глас дође с неба: И прославих, и опет ћу прославити! А народ који стајаше, када то чу, говораше да је гром загрмио; а други говораху: Анђео ми је говорио. Исус одговори и рече: Овај глас није био Мене ради но вас ради.» (Ин.12:28–30)'
        cn: 「父啊，荣耀你的名！」当时有声音从天上来，说：「我已荣耀了我的名，还要再荣耀。」旁边站着的众人听见这话，就说：「是打雷。」又有人说：「是天使对他说话。」耶稣回答说：「这声音不是为我，是为你们。」（约翰福音 12:28-30）
    - type: paragraph
      text:
        ru: 'Да, тиме ћу прославити Оца Свог, који ме и посла на ово дело: «Оче, прослави Име Своје!» – «Тада дође глас с неба: и прославио сам и опет ћу прославити». Отац прослављује себе Сином, Богочовеком Христом: његовим неизмерним човекољубљем, Његовом свежртвом за људе, којом Он осигурава и даје људима бесмртност и живот вечни. А то дати несрећним људима: спасти их од смрти, греха и ђавола, – у томе је прослављање, једино право прослављање Бога.'
        cn: 是的，借此我将荣耀我的父，祂也差遣我来做这工：「父啊，愿你荣耀你的名！」那时有声音从天上出来说：「我已经荣耀了，还要再荣耀。」父借着子，即借着道成肉身的神人基督荣耀自己：借着祂无限的慈爱，借着祂为人类所献的全牺牲，借此祂确保并赐予人类不死性与永生。而将这些赐予不幸的人类，将他们从死亡、罪和魔鬼中拯救出来——这正是荣耀，是唯一真正荣耀上帝的方式。
    - type: paragraph
      text:
        ru: 'А сваки грех, и свака смрт људска, то је срамоћење Бога, који је саздао људе за бесмртност и живот вечни. Да ће то заиста учинити Исус сведочи глас с неба. Народ је чуо то сведочанство својим ушима, и говори: «гром загрме» а други: «анђео му говори». Спас и објашњава да овај глас не би Њега ради, «него народа ради». И сигурно, Грка ради. Да се и њима покаже: да је већ направљњн пут између неба и земље; да је небо отворено над земљом, и није туђе земљи; да је Бог ие нека далека надсветска идеја, мисао, већ благи Промислитељ света, који непрестано брине о нашем земаљском свету.'
        cn: 而每一个罪，以及人类的一切死亡，都是对上帝的羞辱，因为祂创造人类是为了不朽和永生。耶稣将确实如此行，这一点有来自天上的声音作证。民众亲耳听到了这见证，有人说：「雷声隆隆」，另一些人则说：「有天使对他说话」。救主也解释说，这声音不是为了祂自己，「而是为了民众的缘故」。而且无疑地，是为了希腊人的缘故，好向他们也显明：天与地之间已开辟了一条道路；天向地敞开，并且不与地陌生；上帝并非某种遥远、超越世界的观念或思想，而是世界仁慈的护佑者，祂持续不断地关怀着我们这个尘世世界。
    - type: paragraph
      text:
        ru: «Сад је суд овоме свијету; сад ће кнез овога свијета бити избачен напоље. И када Ја будем подигнут са земље, све ћу привући Себи. А ово говораше, указујући каквом ће смрћу умријети.» (Ин.12:31–33)
        cn: 「现在是对这世界的审判；现在这世界的王将要被赶出去。我若从地上被举起来，就要吸引万人来归我。」他说这话，是表明他将怎样死。(约翰福音 12:31-33)
    - type: paragraph
      text:
        ru: 'Присуство Богочовека у нашем земаљском свету, нарочито време Његовог крсног страдања, јесте време одлуке и судбоносне борбе Његове са смрћу, грехом и ћаволом. Бог Логос је владар овога света био све док људи нису толико огрезли у гресима, да су помоћу њих ђавола учинили и прогласили владарем овога света (ср.Ин.16:11); и он заиста влада у овоме свету гресима и смрћу. Богочовек је сишао у овај свет, да опет путем Еванђеља, путем Крсне Жртве и Васкрсења, узме опет сву власт над овим светом. Због чега и изјављује после Свог васкрсења: «даде ми се свака власт на небу и на земљи» (Мф.28:18). А док борба траје, а траје од рођења Богочовека у наш свет, нарочито се појачава и врхуни у голготском страдању, над овим светом врши се суд: овај свет доживљује свој суд: одлучује се, доноси пресуду за ким ће и са ким ће: да ли са ђаволом или са Богом, са ђаволом који влада помоћу греха и смрти, или са Богочовеком који влада помоћу Еванђеља и бесмртности; да ли је за бесмртност помоћу богочовечанског самопожртвовања или за смртност помоћу демонског самоодржања.'
        cn: 神人临在于我们的尘世，尤其是在他十字架受难的时期，是抉择的时刻，是他与死亡、罪恶和魔鬼进行命运之战的时刻。上帝圣言曾是这个世界的统治者，直到人们如此深陷于罪恶之中，以至于他们藉着这些罪恶，使魔鬼成为并宣告其为这个世界的统治者（约翰福音 16:11）；而他（魔鬼）确实藉着罪恶和死亡统治着这个世界。神人降临到这个世界，为了再次藉着福音、藉着十字架的献祭和复活，重新执掌对这个世界的一切权柄。因此，他在复活之后宣告说：「天上地下所有的权柄都赐给我了」（马太福音 28:18）。然而，在这场争战持续期间——这场争战自神人降生到我们世界以来就持续着，尤其是在各各他的受难中达到高潮并增强——对这个世界施行审判：这个世界正在经历自己的审判：它正在做出决定，做出裁决，选择它将属于谁，与谁同在：是与魔鬼，还是与上帝同在；是与藉着罪恶和死亡施行统治的魔鬼，还是与藉着福音和不朽施行统治的神人同在；是为了藉着神人的自我牺牲而获得不朽，还是为了藉着魔鬼的自我保存而走向死亡。
    - type: paragraph
      text:
        ru: '«Сад је суд овога света» – сад свет решава своју судбину, сад се одређује вечна судбина човечанског света: «сад ће бити истеран кнез овога света напоље»: крај овога света који је грехом и смрћу – најгором тиранијом – владао над светом. Он који је кроз људско грехољуље и страстољубље истерао из овог света његовог божанског владара: Бога Логоса. А и сада хоће да преко христобораца истера из овог света оваплоћеног, учовеченог Бога Логоса. Али, Богочовек осигурава Себи победу баш тиме што ће Крсном смрћу победити свет, и тако привући к себи људе: извући их из греха и смрти, тј. испод власти «кнеза овога света», и учинити их својима и то својима из љубави и Христољубља: «И кад будем подшнут од земље, све ћу привући себи». Подигнут ћу бити на Крст; а себе ћу још више подигнути васкрсењем до у врх небеса, и узнети тело човечије у вечну и бесмртну славу Божију, – и тиме ћу «све привући к себи». Људи ће се отрезнити од грехољубља, одрећи се греха и смрти, и поверовати у своју бесмртност кроз Мене васкрслог. И заиста, васкрсењем и вазнесењем Својим славним, Багочовек постаје истински кнез, владар овога света, и влада у њему својим Еванђељем у Цркви Својој. А у то је ушао кроз Своју славну, по човекољубивом пожртвовању, смрт, коју је убио својом богочовечанском смрћу: «смрћу смрт уништи». Зато свети Воанергес благовести: «а ово говораше да покаже каком ће смрти умрети».'
        cn: 「现在正是这世界的审判」——现在世界正在决定自己的命运，现在人类世界的永恒命运正在被决定：「现在这世界的王要被赶出去了」：这世界的终结，他曾借着罪与死亡——最恶劣的暴政——统治着世界。他曾借着人类对罪恶的贪恋和对情欲的痴迷，将这世界的神圣统治者：圣言上帝（道）赶出了世界。而现在，他仍想通过那些敌基督者，将道成肉身、取了人性的圣言上帝（道）赶出这世界。然而，这神人（基督）正是借由祂在十字架上的受死来战胜世界，从而确保祂的胜利，并如此将人吸引归向自己：将他们从罪与死亡中解救出来，即，从「这世界的王」的权势之下解救出来，使他们成为自己的人，而且是出于爱与对基督的爱而成为自己的人：「我若从地上被举起来，就要吸引万人来归我」（约翰福音 12:32）。我将被举在十字架上；而我将藉着复活，将自己更高地提升至诸天之上，并将人的身体提升至上帝永恒不朽的荣耀之中——并借此「吸引万人来归我」。人们将从对罪恶的贪恋中清醒过来，弃绝罪与死亡，并藉着我这位复活者，相信自己的不朽。确实，藉着祂荣耀的复活与升天，神人（基督）成为了这世界的真正君王和统治者，并在祂的教会中，以祂的福音来统治它。而祂是藉着祂荣耀的、充满爱人的牺牲的死亡，进入这境地的，祂以祂神人性的死亡杀死了死亡：「藉着死亡，祂摧毁了死亡」。因此，圣沃阿奈尔格斯宣讲说：「他说这话，是指明自己将怎样死。」（约翰福音 12:33）
    - type: paragraph
      text:
        ru: '«Народ Му одговори: Ми чусмо из Закона да Христос остаје вавијек; и како Ти говориш да се Сину Човјечијему ваља подигнути? Ко је тај Син Човјечији? А Исус им рече: Још је мало времена свјетлост са вама; идите док свјетлост имате да вас тама не обузме; а ко иде по тами не зна куда иде. Док свјетлост имате вјерујте у свјетлост да будете синови свјетлости. Рекавши ово, Исус отиде и сакри се од њих.» (Ин.12:34–36)'
        cn: «民众回答他：我们从律法中听说基督是永远长存的；你怎么说人子必须被举起来呢？这人子是谁呢？耶稣对他们说：光在你们中间还有不多的时候；趁着有光，行走吧，免得黑暗临到你们；在黑暗里行走的，不知道往何处去。趁着有光，信从光，使你们成为光明之子。耶稣说了这话，就离开他们，隐藏起来了。» (约翰福音 12:34-36)
    - type: paragraph
      text:
        ru: 'Иако је народу дао све доказе и пружио сва сведочанства, који би требало да их као разумна бића убеде да је Исус – Син Човечји, Богочоаек, они ипак стављају му питање: «Ко је тај Син Човечји?». Спас им одговара посредно: Онај који је Светлост, у телу човечјем Светлост. А шта је у вашим телима, завирите: мрак и тама. Сада је «Светлост с вама», Светлост која обасјава све поноре смрти, али и живота; све поноре греха али и врлине; ако се послужите њоме, изаћи ћете из таме, нећете ходити по тами греха и смрти; јер ко живи грехом у овом свету, он живи у тами, «ходи по тами», – «не зна куда иде». Заиста, човек греха «не зна куда иде»; а сигурно аде у понор смрти. Само идући за Светлошћу света – Богочовеком, човек иде светлим и осветљеним путем врлине, Еванђеља, у бесмртност и живот вечни. Чим грехољубљем човек напусти Христа, кренуо је кроз таму греха у таму смрти, у вечну таму вечне смрти. Само кроз грехе тама обузима човека. Чим човек поверује у Боточовека, одмах му сву душу испуни Светлост божанска, и аве његове путеве залије Светлост.'
        cn: 尽管祂向民众提供了所有证据和所有见证，这些本应足以使他们作为有理性的人相信耶稣是人子，是神人，但他们仍然问祂：「这人子是谁？」救主间接地回答他们：「祂就是光，是人体内的光。」「而你们的身体里有什么，审视一下吧：幽暗和黑暗。」现在，「光与你们同在」，这光照亮了死亡和生命的所有深渊；照亮了罪恶和美德的所有深渊；如果你们使用它，你们将走出黑暗，就不会行走在罪恶和死亡的黑暗中；因为凡是在这世上以罪为生的人，他都活在黑暗中，「行走在黑暗中」——「不知道他往何处去」。确实，罪人「不知道他往何处去」；但他必定走向死亡的深渊。唯有跟随世界之光——神人，人才能走上光明且被照亮的美德之路、福音之路，进入不朽和永生。一旦人因爱罪而离弃基督，他就已然从罪恶的黑暗走向死亡的黑暗，进入永恒死亡的永恒黑暗。唯有通过罪，黑暗才能笼罩人。一旦人相信神人，神圣之光立刻充满他整个灵魂，并充满他所有的道路。
    - type: paragraph
      text:
        ru: 'Вера у Христа, уводи сунце у душу, и оно осветли све светове човечје и све путеве: и он јасно види и зна шта је добро, а шта зло, шта грех а шта врлина, шта смрт, а шта живот, шта лаж, а шта истина, шта Бог, а шта ђаво, шта човек, а шта свет. Види све то, и зато зна куда иде. Зато Спас и вели: «Док свеглости имате, верујте у светлост, да будете синови светлости».'
        cn: 信靠基督，将太阳引入灵魂，它照亮了人的一切世界和一切道路：于是人能清楚地看见并知道何为善，何为恶；何为罪，何为德；何为死，何为生；何为谎言，何为真理；何为上帝，何为魔鬼；何为人，何为世界。他看清这一切，因此知道自己走向何方。因此，救主也说：「你们应当趁着有光，信从这光，使你们成为光明之子。」（约翰福音 12:36）
    - type: paragraph
      text:
        ru: 'Богочовекова светлост толико проникне све биће човеково, толико се сроди с њим, да она постаје просто родитељка и његове душе, и његовог срца, и његовог ума, васцелог бића његовог, а он сам постаје «син светлости»: јер се све у њему: и мисли, и осећања, и расположење, и дела – рађа из светлости. И он и живи и дела и мисли и осећа као «син светлости». Он – једина истинска Светлост наша у свету.'
        cn: 神人之光如此深入地穿透人的整个存在，如此与他融为一体，以至于它简直成了他灵魂的、他内心的、他心智的、他整个存在的孕育者，而他自己也成了「光明之子」；因为他里面的一切——无论是思想、情感、心绪，还是行为——都源自光明而生。他生活、行事、思想、感受，都如同「光明之子」。祂是世上我们唯一的真光。
    - type: paragraph
      text:
        ru: '«Јер иако је учинио толика знамења пред њима не вјероваху у Њега; Да се испуни ријеч Исаије пророка који рече: Господе, ко вјерова проповеди нашој? И рука Господња коме се откри? Зато не могаху вјеровати, јер опет рече Исаија: Заслијепио је очи њихове и окаменио срца њихова, да не виде очима ни срцем разумију, и не обрате се да их исцијелим. Ово рече Исаија када видје славу Његову и говораше о Њему.» (Ин.12:37–41)'
        cn: 「虽然他在他们面前行了这么多神迹，他们仍然不信他；这是要应验先知以赛亚的话，他说：『主啊，有谁信了我们的传报呢？主的膀臂向谁显露了呢？』所以他们不能信，因为以赛亚又说：『他弄瞎了他们的眼睛，硬化了他们的心，使他们不能用眼睛看见，不能用心领悟，也不能回转，我好医治他们。』以赛亚说这话，是因为他看见了主的荣光，并且论到他。」 (约翰福音 12:37-41)
    - type: paragraph
      text:
        ru: '«Рекавши ово Исус отиде и сакри се од њих», не из страха, него из жеље да их остави саме, да још једном промисле о Њему шта је и ко је: дали само човек, или и Бог у човеку? Јер, шта је то што би људи желели чути и видети од Бога, а да нису чули и видели од Исуса? Зато су многа од народа с правом говорили: «Кад дође Христоос еда ли ће више чудеса чинити него овај шго чини?» (Ин.7:31). Али, «ако је и чинио толика чудеса пред њима, опет Га не вероваху». Зашто? Одговор на то даје пророк Исаија на кога се св. Еванђелист позива: «неверјем су заслепили очи своје и окаменили срца своја, те нити очима виде, нити срцем разумеју».'
        cn: 「耶稣说了这话，就离开，自己隐藏起来，避开了他们，这并非出于惧怕，而是因为祂希望让他们独处，以便他们能再次思考祂究竟是谁、是什么：是仅仅一个凡人，抑或是以人形显现的上帝？因为，人们还能希望从上帝那里听到或看到什么，是他们未曾从耶稣那里听到或看到的呢？因此，民众中有许多人理所当然地说：「基督来的时候，祂所行的神迹会比这人行的更多吗？」(约翰福音 7:31)。然而，「祂虽然在他们面前行了许多神迹，他们还是不信祂。」为什么呢？圣福音书作者所引用的先知以赛亚对此提供了答案：「他们因着不信，蒙蔽了他们的眼睛，又使他们的心刚硬，以致他们的眼睛看不见，他们的心也不明白。」」
    - type: paragraph
      text:
        ru: 'А вера у Богочовека: отвара очи душе, те оне виде у Исусу Бога и Спаситеља; омекшава срце, чини га осетљивим за оно што је Божје, те оно осећа у Исусу Бога, и разуме кроз дела Његова да је Он заиста Спаситељ света и Месија. Неверје је обичио од грехољубља, јер сваки грех као нова тама све више заклања Бога од очију човекових. А кад се греси намноже у души, они навуку у њу и на њу безбројне таме, те она нити види Бога, нити Га осећа, а често – нити га признаје. Бог нити је узрок, нити саузрок људског неверја, људског слепила и окамењености срца: Он само допушта људима да се слободно опредељују или за грех или за Њега; и када људи изаберу грех, и живе у греху, Он их не спречава насилно, јер то не доликује Богу Љубави, да своме створењу насилно намеће своју вољу, своју Истину, своју Љубав, своје Евађеље.'
        cn: 而对神人的信仰：开启灵魂的双眼，使它们在耶稣身上看见神和救主；软化心灵，使它对属神之事敏感，于是它在耶稣身上感受神，并通过祂的作为明白祂确实是世界的救主和弥赛亚。不信，其根源在于恋罪，因为每个罪，犹如新的黑暗，越来越遮蔽人眼中的神。而当罪孽在灵魂中增多时，它们会给灵魂带来并笼罩无数黑暗，于是它既看不见神，也感受不到祂，而且常常——甚至不承认祂。神既不是人的不信、人的盲目和心的刚硬的原因，也不是其共同原因：祂只是允许人们自由地选择或罪或祂；当人们选择罪并在罪中生活时，祂不会强行阻止他们，因为将祂的旨意、祂的真理、祂的爱、祂的福音强加给祂的受造物，这不适合爱之神。
    - type: paragraph
      text:
        ru: 'Тако треба и разумети речи пророка Исаије: «Заслепио је очи њихове и окаменио срца њихова, да не виде очима ни срцем разумеју, и не. обрате се да их исцелим»: допустио је да они по слободи својој гресима ослепе очи душе своје, и окамене срце своје, те постану толико неосетљиви за оно што је Божје и добро, да и не осећају колико су болесни и колико им је потребан Бог да их исцели од страшних болести њихових.'
        cn: 因此也应如此理解先知以赛亚的话语：「他弄瞎了他们的眼睛，又使他们的心刚硬，免得他们眼睛看见，心里明白，也不回转，我就医治他们。」 (以赛亚书 6:10) 他容许他们凭着自己的自由意志，因罪而使自己灵魂的眼睛失明，又使自己的心刚硬，以至于对属神和良善之事变得如此麻木不仁，甚至不觉得自己病得有多重，也不觉得他们多么需要神来医治他们可怕的疾病。
    - type: paragraph
      text:
        ru: '«А и од старјешина многи вјероваше у Њега; но због фарисеја не признаваху, да не буду искључени из синагоге. Јер завољеше више славу људску него славу Божију. А Исус повика и рече: Ко вјерује у Мене, не вјерује у Мене, него у Онога који Ме је послао. И ко види Мене, види Онога који Ме је послао. И ко види Мене, види Онога који Ме је послао.» (Ин.12:42–45)'
        cn: 然而，有许多官长信祂；只因法利赛人的缘故，就不承认，恐怕被赶出会堂。这是因他们爱人的荣耀过于爱神的荣耀。耶稣却喊着说：信我的，不是信我，乃是信那差我来的。人看见我，就是看见那差我来的。人看见我，就是看见那差我来的。（约翰福音 12:42-45）
    - type: paragraph
      text:
        ru: 'Сав је Бог у свету, са свима својим добрима, и сав је ђаво у свету са свима својим залима, – а људима је остављено да се слободно определе за једног или за другог. Често људска слава спречава људе да се определе за Бога и његова савршенства. Све што је Христово, од Бога је, и води право Богу. И човечанска природа његова толико је испуњена Богом да право води Богу. Стога вера у Христа Богочовека уствари је вера у небеског Бога Оца. Која то његова мисао, или реч, или осећање, или дело – не показује то, и не доказује то? Заиста је Он човвк «у коме обитава сва пуноћа Божанства на телесан начин» (Кол.2:9). Стога је Он у праву када тврди: «Ко види мене види Онога који Ме посла». Богочовек је огледало Оца; какав је Бог на небу, такав је и на земљи. Међу њима нема разлике, сем што је Богочовек у телу, а Бог Отац изван свих телесних обличја. Једна иста Светлост су и Бог Отац и Бог Син: «Светлост од Светлости». Само Син је своју Светлост обукао у тело човечје; она из њега и кроз њега зрачи, не спаљујући га, јер је то «тиха Светлост» (Свјете тихиј...). Бог Логос је донео Себе свету, Себе = Светлост; унео Себе = Светлост у таму овога света, таму која је од греха.'
        cn: 整个上帝都在世上，带着他所有的美善；整个魔鬼也在世上，带着他所有的邪恶——而世人则被赋予了自由，去选择其一或其二。常常，人类的荣耀阻碍着人们去选择上帝和他的完全。凡是基督的，都来自上帝，并直接引向上帝。甚至他的人性也如此充满上帝，以至于直接引向上帝。因此，对基督神人的信仰，实质上是对天上父上帝的信仰。他哪一个思想、言语、情感、或行为，不展现这一点，不证明这一点呢？他确实是人，「上帝一切的丰盛，都有形有体地居住在他里面」（歌罗西书 2:9）。因此，当他宣称：「人看见我，就是看见那差我来的」时，他是正确的。神人是父的镜子；天上的上帝是怎样的，地上的他也是怎样的。他们之间没有区别，除了神人在肉身之中，而父上帝超越一切肉身形式。父上帝和子上帝是同一道光：「出自光的光」。唯有子将他的光穿上人的身体；这光从他而出，也藉着他照耀，却不烧毁他，因为那是「平静的光」（宁静之光……）。圣言上帝将他自己带给世界，他自己即是光；将他自己——光——带入这世界的黑暗中，这黑暗是来自罪的。
    - type: paragraph
      text:
        ru: Који год поверује у Њега = узаживи Њиме, Његовим Еванђељем, не остаје у тами, већ излази на Светлост Божју, и живи у њој и њоме. Када је Богочовек у свету, онда је са Њиме и сва Светлост Божја неугаЈоива, бесмртна, животворна и животодавна, а насупрот њој – језива и пуна смрти тајна греха. Човек је стављен пред избор, сваки човек, нарочито од како је Бог Логос сишао у наш свет, и постао човек, и остао у Цркви својој као Богочовек.
        cn: 凡是相信祂的人，藉祂、藉祂的福音而活，就不留在黑暗中，反而进入神的光中，并活在其内，藉其而活。当神人（基督）在世上之时，神的全部光也与祂同在，是不能熄灭的、不朽坏的、带来生命的、赐予生命的；而与这光相对的——是那可怖且充满死亡的罪之奥秘。人被摆在一个选择面前，每一个人都是如此，特别是自从圣言上帝降世，并成为人，又以神人的身份留在祂的教会中以来。
    - type: paragraph
      text:
        ru: 'Изабере ли њега, човек одмах ступа у друштво Светлоносца – Светитеља, који га и воде свима путевима еванђелске светлости, а сви они воде у бесмртност и живот вечни. Зато Спас и благавести: «Ја Светлост дођох на свет да ниједан који верује у Мене не остане у тами». Вера у Христа је идење за Христом; ко поће за Њим, чим пође – излази из греха, напушта грех и његову таму, и улази у незалазну и неугасиву светлост. Нема греха који може човека задржати у својој тами, ако човек узажели да пође за Христом. Узажели ли само, Господ му одмах даје божанске силе, којим савлађује сваки грех и свим бићем излази на широку стазу Светлости Богочовекове.'
        cn: 若人选择他，便立刻进入光照者——圣者的团契，他们引领人走上福音光明的诸般道路，而所有这些道路都通往不朽与永生。因此，救主宣示说：「我这光来到世上，为要使凡信我的人，都不留在黑暗里。」信基督就是跟随基督；凡跟随他的人，只要一开始跟随，就脱离了罪，舍弃了罪及其黑暗，进入了永不熄灭、永不落幕的光明之中。人若渴望跟随基督，就没有罪能将他拘禁在自己的黑暗里。只要他渴望，主便立刻赐予他神圣的能力，他凭此能力就能战胜一切罪恶，并以整个生命踏上神人光明的宽广之路。
    - type: paragraph
      text:
        ru: «Ја у свијет дођох као свјетлост, да свако ко вјерује у Мене не остане у тами. И ко чује Моје ријечи и не вјерује, Ја му не судим; јер не дођох да судим свијету, него да спасем свијет. Ко одбацује Мене, и не прима ријечи Моје, има себи судију; ријеч коју Ја говорих, она ће Му судити у посљедњи Дан.Јер Ја не говорих сам од Себе, него Отац Мој који Ме посла, Он Ми даде заповести шта да кажем и шта да говорим. И знам да је заповијест Његова живот вјечни. Што год, дакле, Ја говорим, онако говорим како Ми је рекао Отац.» (Ин.12:46–50)
        cn: 「我到世上来，乃是光，叫凡信我的，不住在黑暗里。并且人若听见我的话不信，我不审判他；因为我来本不是要审判世界，乃是要拯救世界。弃绝我、不领受我话的人，有审判他的；我所讲的道在末日要审判他。因为我不是凭着自己说的，乃是差我来的父已经给我命令，叫我说什么，讲什么。我也知道他的命令就是永生。所以我所说的，正是照着父对我所说的。」（约翰福音 12:46-50）
    - type: paragraph
      text:
        ru: 'Свака реч Христова – пуна је Божанске Светлости; свака је – читаво сунце Божје. Унеси је у душу, и она ће се распалити у сунце, само ако је будеш распиривао својом вером и љубављу и молитвом и постом. Свака Реч Његова је благовест о спасењу човека од греха, смрти и ђавола. Благовест и сила, сила која побеђује ово мрачно тројединство, и изводи људско биће у светлост спасења. Спас је дошао да спасава, не да суди нити уништава. Јер да је дошао да суди, – ко би то од људи остао неосуђен? Јер је сваки – роб греха, и таме греховне. Богочовек је зато и дошао као Исус = Спаситељ: да љубављу својом излечи људе од греха, и спасе од смрти и ђавола.'
        cn: 基督的每一句话都充满神圣之光；每一句都是一个全然属神的太阳。将其带入你的灵魂，它就会燃成一个太阳，只要你用你的信心、爱、祷告和禁食来不断激发它。祂的每一句话都是关于人类从罪恶、死亡和魔鬼中得救的福音。福音和能力，这能力战胜这黑暗的三重性，并引领人类进入救赎之光。救主降临是为了施行救赎，而不是为了审判或毁灭。因为如果祂降临是为了审判，那么谁能在世人中不被定罪呢？因为每个人都是罪的奴仆，且被罪恶的黑暗所奴役。神人因此也以耶稣 = 救主的身份降临：为了以祂的爱治愈人们脱离罪恶，并从死亡和魔鬼中拯救他们。
    - type: paragraph
      text:
        ru: 'У томе је љубав Божја неизмерна: што је дошао да спасе грешнике, не да суди и осуди. Зато је и донео и дао људима све што им је потребно за спасење. Тако да ниједан човек, ни сада, па ни на дан Страшнога Суда неће имати право да каже Богочовеку: нисам знао, нити сам имао средства да се спасем од греха и ђавола. – Рекне ли то, судиће му свака реч Христова, свака реч Еванђелска, и показати му да није у праву. Судиће му божански свеираведно, јер је свака – Божја и божанска, јер је у свакој присутан и Бог Логос и Бог Отац. Судиће човеку неверја оне речи које су му биле дате за спасење. И онда ће сваки осетити да је истина сва у томе: да је послушао Богочовекове речи, и силе се њихове испунио, спасао би себе од греха, смрти и ђавола. И ушао као спасен, у живот вечни, у живот божански, где непрестано живи Тросунчани Господ кроз сва своја безбројна и неизбројива савршенства.'
        cn: 上帝的爱在此是无限的：他来是为了拯救罪人，而非审判和定罪。因此，他也带来了并赐予了人类他们得救所需的一切。因此，没有任何人，无论现在还是在可畏审判之日，会有权对神人说：「我不知道，也没有办法从罪和魔鬼手中得救。」——如果他说了这话，基督的每一句话，福音的每一句话都将审判他，并向他表明他是错的。这对他将是神圣而完全公义的审判，因为每一句话都是上帝的，是神圣的，并且在每一句话中，圣言上帝和父上帝都同在。那些曾赐予他得救的话语，将审判这个不信之人。届时，每个人都会感受到，真理完全在于此：如果他听从了神人的话语，并被它们的力量充满，他就会将自己从罪、死亡和魔鬼手中拯救出来。并作为得救之人，进入永恒的生命，进入神圣的生命，在那里，三日上帝通过他无数和不可数计的完美，永恒地活着。
    - type: paragraph
      text:
        ru: 'Јер све речи Спасове, све речи Еванђеља спасења сливају се у једну заповест Божју, а та је заповест – живот вечни. То значи: циљ је, једини циљ Богочовековог Еванђеља спасења: спасти људе од греха, смрти и ђавола, и дати им живот вечни. То је смисао, то циљ, свих речи Божјих, свих заповести Божјих, свих савета Божјих, изречених људима преко чудесног Спаситеља н Његовог божанског Еванђеља спасења.'
        cn: 因为救主的所有话语，救恩福音的所有话语，都汇聚于一条神的诫命，而这条诫命就是永生。这意味着：神人救恩福音的目标，唯一的目标是：将人们从罪、死亡和魔鬼中拯救出来，并赐予他们永生。这正是所有神的话语、所有神的诫命、所有神的建议——神借着奇妙的救主和祂神圣的救恩福音向人们所说的一切——的意义和目标。
  - type: heading2
    text:
      ru: Тринаеста глава. Христова тајна вечера са ученицима
      cn: 第十三章。基督与门徒们的最后的晚餐
    children:
    - type: paragraph
      text:
        ru: «А пред празник Пасхе, знајући Исус да је дошао Његов час да пређе из овога свијета Оцу, љубивши Своје који су у свијету, љубио их је до краја. И кад би вечера, пошто ђаво већ бјеше метнуо у срце Јуди Симоновом Искариотском да Га изда, знајући Исус да Му је Отац све дао у руке, и да од Бога изиђе, и Богу иде.» (Ин.12:1–3)
        cn: 逾越节前夕，耶稣知道他离世归父的时候到了。他既然爱世间属自己的人，就爱他们到底。到了吃晚饭的时候，魔鬼已将出卖耶稣的意念放入了西门·依斯卡里奥特的儿子犹大的心里。耶稣知道父已将万有交在他手中，并且他原是从神出来的，也要归到神那里去。（约翰福音 12:1-3）
    - type: paragraph
      text:
        ru: 'Силаском Бога Логоса у земаљски свет, направљен је пут између овог и оног света. Богочовек сасвим природно спаја ова два света: Као Бог постао је човек, да би човека уздигао до Бога. Нема провале непремостиве више између два света, нита између човека и Бога. Из љубави је сишао из дивног божанског свегга у наш смрдљиви земаљски зверињак; љубављу је живео за све време Свога боравка на земљи, и остао до краја у тој љубави, иако су многи људи на Његову све-љубав одговарали мржњом, пакошћу, злобом, читавим паклом. Ето, и један од дванаесторице је такав: На свељубав Учитељеву он одговара тиме што пушта Сатану у срце своје, те га овај претвара у радиоиицу богоиздајничког и богоубилачког греха.'
        cn: 圣言上帝降入尘世，开辟了此世与彼世之间的道路。神人自然地连接着这两个世界：祂作为上帝成为人，为要将人提升到上帝那里。两个世界之间不再有无法逾越的鸿沟，人与上帝之间亦然。出于爱，祂从奇妙荣耀的神圣世界降到我们污秽的地上兽栏；祂在地上居住期间，一直以爱而活，并始终持守着这份爱，尽管许多人以仇恨、恶意、邪恶，甚至是整个地狱来回应祂那全备的爱。看哪，十二门徒中就有一个是这样的人：他回应老师的全爱的方式，是让撒但进入己心，于是撒但将他的心变成了一个背叛上帝、弑杀上帝的罪恶作坊。
    - type: paragraph
      text:
        ru: 'Шта то значи? – Да Богочовек Христос сав однос Свој са људима заснива на слободи и љубави. Никад и нигде насиље, нити захтев да му ма ко служи механички, аутоматски, принудно. Све по закону божанске љубави и слободе. На томе стоји и цело Еванђеље. Нико се насилно не спасава. Спасење Спаситељ нуди, али не намеће. Сав је домострој спасења Богочовек израдио на љубави и од љубави; А човек то спасење може усвојити једино љубављу за то и такво спасење. Богочовек је сав љубав: такав је дошао у свет, такав се и враћа у онај свет – Оцу. Враћа се, из бескрајног човекољубља, са обесмрћеним и прослављеним телом људским. Због те љубави према људима «Отац му све даде у руке».'
        cn: 这意味着什么？——这表示神人基督将祂与人的一切关系建立在自由与爱之上。绝无任何形式的暴力，也绝不要求任何人机械地、自动地、强迫地侍奉祂。一切都按照神圣的爱与自由的法则。整部福音书也以此为基础。没有任何人是被强迫得救的。救主提供救赎，但从不强加。这套救赎的整体安排，是神人基于爱并从爱中构建的；而人只有通过爱这样的救赎，才能接受它。这位神人全然是爱：祂以这样的爱来到世上，也以这样的爱回到那个世界——回到父那里。祂回归，出于无限的爱人之心，带着不朽并得荣耀的人类身体。因为祂对人的这份爱，「父将一切都交在祂手中。」
    - type: paragraph
      text:
        ru: 'Иако сав у греху, смрти, злу и ђаволу, овај наш земаљски свет није ии у чему, ни по чему могао умањити, или окрњити, или оштетити Богочовекову Личност, Његово Божанство, нити пак њетово безгрешно човечанство. Грех, смрт, зло и ђаво, нису могли нити да омету нити да онемогуће Његово дело спасења света. Толико је Он свет и свемоћан у свему, а пре свега у љубави према људима. Сав његов живот и под виг на земљи сведочи једмо: «Он од Бога изиђе, и к Богу иде». Пут је Његов прав и оигуран. Он од Бога изиђе и у наш свет сиђе, да би из нашег света изишао и Боту отишао са телом човечјим, спасеиим од греха, смрти и ђавола, и тако прослављеним вечном божанском славом.'
        cn: 尽管我们的这个尘世，全然浸染在罪恶、死亡、邪恶和魔鬼之中，却未能丝毫地削弱、损伤或毁坏神人（耶稣基督）的位格、祂的神性，也未能毁坏祂那无罪的人性。罪恶、死亡、邪恶和魔鬼，都未能阻碍或妨碍祂拯救世人的工作。祂在一切事上是如此圣洁且全能，而首先，是在对世人的爱中。祂在世的全部生命和功绩都见证了一件事：「祂从神而出，并归于神。」祂的道路是正直且确定的。祂从神而出，降临到我们的世界，为的是要离开我们的世界，带着从罪恶、死亡和魔鬼中被拯救的人类身体归于神，并以此被永远的神圣荣耀所荣耀。
    - type: paragraph
      text:
        ru: '«Устаде од вечере и скиде горње хаљине, па узе убрус и опаса се њиме. Потом усу воду у умиваоницу, и поче прати ноге ученицима и отирати убрусом којим бјеше опасан. Онда дође Симону Петру, а овај Му рече: Господе, зар Ти моје ноге да опереш? Одговори Исус и рече Му: Што Ја чиним, ти сад не знаш, али ћеш послије разумјети. Рече Му Петар: Никада Ти нећеш опрати моје ноге. Исус му одговори: Ако те не оперем, немаш удјела са Мном. Рече Му Симон Петар: Господе, не само ноге моје, него и руке и главу. Рече му Исус: Окупани нема потребе шта да пере осим ногу, јер је сав чист; и ви сте чисти, али не сви. Јер знађаше издајника Својега, зато рече: Нисте сви чисти.» (Ин.13:4–11)'
        cn: «他从晚餐中起来，脱下外衣，又拿一条手巾束腰。随后把水倒在盆里，开始洗门徒的脚，并用所束的毛巾擦干。轮到西门彼得，他对耶稣说：主啊，你竟洗我的脚吗？耶稣回答说：我所做的，你现在不明白，后来就明白了。彼得说：你绝不能洗我的脚。耶稣回答说：我若不洗你，你与我无分了。西门彼得说：主啊，不但我的脚，连手和头也要洗。耶稣说：洗过澡的人，除了脚，不需要再洗，因为全身是干净的；你们是干净的，但不是所有的人。耶稣原知道谁要出卖他，所以说：你们不是所有的人都是干净的。» (约翰福音 13:4-11)
    - type: paragraph
      text:
        ru: 'Ако божанска љубав има душу, онда је то – смерност. Ево ње увек у љубави Христовој, па и на Тајној Вечери. Да, она и сачињава почетак те Овете и свеспасоносне Вечере: Богочовек пере ноге ученицима својим и брише их сам убрусом. То спада у Еванђеље спасења, у силу спасења, и у символ спасења. Ове то значи: људе је могуће спасти од греха, смрти и ђавола само служећи им из богочовечанске љубави, богочовечански смерно. Само се тако може имати «удела» са Спаситељем: «удела са Мном»'
        cn: 如果神圣的爱有灵魂，那么它就是谦卑。你看，它总是在基督的爱里，甚至在最后的晚餐上。是的，它也构成了这神圣而普世救赎的晚餐的开端：神人洗他门徒的脚，并亲自用手巾擦干。这属于救恩的福音，救恩的力量，和救恩的象征。所有这些意味着：人类能够被拯救脱离罪、死亡和魔鬼，唯有通过出于神人一体的爱，以神人一体的谦卑服侍他们。唯有如此，才能与救主「有份」：「与我一同有份」。
    - type: paragraph
      text:
        ru: 'Јер само смерна љубав и љубећа смерност очишћава људе од сваке прљавштине. На њу спасавани може одговорити само истоветном љубављу и смерношћу, и онда му је спасење осигурано. У противном: Спаситељева омерна љубав је учинила све, али човек није на њу одговорио љубављу, и остаје – неспасен, нечист. Случај Јуде Искариотског. Ни њега Спаситељ благи не приморава на спасење, не спасава га насилно. Остављена је и њему, као и свакоме људоком бићу, бескрајна слобода: да изабере и воли Бога или ђавола, живот или смрт, рај или пакао, добро или зло. И Јуда се у пуној мери користи том слободом, као и сваки човек, па изабрао једно или друго. Главно је: пред сваким стоји Христос, Бог савршени и очигледни, и ђаво ружан и одвратан.'
        cn: '因为只有谦卑的爱和仁爱的谦卑，才能使人洁净，脱离一切污秽。被拯救者对此只能以同样的爱和谦卑来回应，这样他的救恩才能得以确保。反之：救主那谦卑的爱已成就了一切，但人若没有以爱回应祂，那么他仍将——未得救，不洁净。


          犹大·伊斯卡略的案例。慈爱的救主连他也没有强迫他得救，不会强行拯救他。无限的自由也留给了他，就像留给了所有人类一样：去选择并爱上帝或魔鬼，生命或死亡，天堂或地狱，善或恶。犹大也充分利用了这份自由，就像每一个人一样，从而选择了其一。重点是：在每个人面前都站立着基督，那位完美而彰显的上帝，以及那丑陋可憎的魔鬼。'
    - type: paragraph
      text:
        ru: '«А кад им опра ноге, узе хаљине Своје па опет сједе за трпезу у рече им: Знате ли шта сам вам учинио? Ви Ме зовете Учитељем и Господом, и право велите, јер јесам. Кад вам, дакле, опрах ноге, Ја Господ и Учитељ, и ви сте дужни једни другим прати ноге. Јер сам вам дао пример да, као што Ја учиних вама, и ви чините. Заиста, заиста вам кажем: Није слуга већи од господара Својега, нити је посланик већи од онога који га је послао. Кад ово знате, блажени сте ако то творите.» (Ин.13:12–17)'
        cn: 及至他洗完了他们的脚，就拿起自己的衣服，又坐下，对他们说：「你们知道我向你们所做的是什么吗？你们称呼我为夫子，称呼我为主，你们说得不错，我本来是。所以，我既是主，是夫子，为你们洗了脚，你们也当彼此洗脚。因为我给你们作了榜样，叫你们照着我向你们所做的去做。我实实在在地告诉你们：仆人不能大于主人，差人也不能大于差他的人。你们既知道这事，若是遵行，就有福了。」(约翰福音 13:12-17)
    - type: paragraph
      text:
        ru: 'Спаситељево прање ногу ученицима саставии је део велике богочовечанске тајне спасења света. На почетку те пресвете тајне стоји бескрајна смерност: рођење од Дјеве у пећини; ево бескрајне смерности где и завршава ту велику тајну. Колико је ове то божански важно, показује то што сам Спаситељ објашња ва одмах ученицима шта значи ово прање ногу. Он «Го-под и учитељ пере ноге учшицима». Ради чега? Да би им примером пкжазао да је смерна љубав – пут спасења, једини пут спасења. То сачињава обавезну дужност, уцраво еванђелску оведужност, за свакога који жели спасења себи и друлима.'
        cn: 救主为门徒洗脚，是那伟大的神人奥秘——即世界的救赎——的组成部分。这至圣奥秘的开端是无限的谦卑：即童贞女在洞穴中的诞生；看哪，这无限的谦卑也正是这伟大奥秘的终结。这项举动在神性层面何等重要，从救主亲自立即向门徒解释洗脚的意义可见一斑。他「是主，是老师，为门徒洗脚」。为何如此？是为了以身作则向他们表明，谦卑的爱是救赎的道路，是唯一的救赎道路。这构成了强制性的责任，确切地说，是福音性的责任，适用于每个渴望为自己和他人获得救赎的人。
    - type: paragraph
      text:
        ru: '«Кад дакле ја опраг вама ноге Господ и Учитељ, и ви сте дужни – један другоме прати ноге»: ма ко, и ма колико грешан и нечист био тај други, макар био Јуда, – оперите му ноге за сведочанство њему да сте учинили све за спасење његово: смерно и с љубављу служили њему нечисгом и прљавом. Иако је Спаситељ, и све шгго је чинио – чинио да би дао пример вама; иако је живео, и тиме давао пример како треба да ми живимо; иако је мислио, осећао, делао, творио, да би тиме нама дао пример живи како треба да и ми мислимо, осећамо, деламо, творимо; никад није то тако истакао и за таку свеобавезну дужност прогласио, као што је то учинио приликом прања ногу својим ученицима. Толико је смерна љубав свеважна, свевредносна и свеспасоносна. Зато и благовести: «Јер вам дадох углед (пример) да и ви тако чините као што ја вама учиних. Заиста, заиста вам кажем: није слуга већи од господара свога, нити је посланик већи об онога који га је послао. Кад ово знате, благо вама ако га извршујете».'
        cn: 「既然我——主和夫子——尚且洗了你们的脚，你们也当彼此洗脚」（约翰福音 13:14）。无论那人是多么有罪和不洁，即便他是犹大，也要为他洗脚，以此向他作见证，表明你们已为他的救恩尽了一切努力：谦卑并怀着爱心服事他这个不洁又污秽之人。尽管他是救主，他所做的一切，都是为了给你们树立榜样；尽管他活过，并借此为我们如何生活树立了榜样；尽管他思考、感受、行动、创造，并借此为我们如何思考、感受、行动、创造树立了活生生的榜样；但他从未如此强调这一点，也从未将其宣告为如此普遍的义务，就像他为门徒洗脚时所做的那样。谦卑的爱是如此至关重要、价值无限且具有普世救赎性。因此他也宣讲说：「我给你们作了榜样，叫你们照着我向你们所做的去做。我实实在在地告诉你们，仆人不能大于主人，差人也不能大于差他的人。你们既知道这事，若是去行就有福了」（约翰福音 13:15-17）。
    - type: paragraph
      text:
        ru: '«Блажени сте ако то извршујете»: блаженство је истовремено пракси, делу, делању, творењу, доживљавању смерне љубави Христове. У самом чињењу еванђелских подвига је почетак блаженства од тога: у трајању пак – свеблаженство. «Творац дела» је «блажен у делу свом» (Иак.1:25). Не знање о смерној љубави, о смерном служењу другима, већ само доживљавање те љубави и смерно служење друшима из љубави, то рађа неисказано христолико блаженство у души чинитеља. Ма колико се Христов човек у смерној љубави смиравао пред другима, никад се ни приближно не може то упоредити са смерном љубављу, са бескрајним смирењем безгрешног и Свемоћног Господа Исуса пред грешним и прљавим људима.'
        cn: 「你们若遵行这话，就有福了」：福乐同时存在于实践、行动、作为、成就，以及对基督谦卑之爱的体验中。在亲身实践福音的属灵争战中，便是福乐的开端；而其持续，则是全福。「行道的人」在「他所行的事上必然得福」（雅各书 1:25）。并非仅仅是关于谦卑之爱、关于谦卑地服侍他人的知识，而是亲自体验那爱，并因爱而谦卑地服侍他人，这才能在行道者的灵魂中孕育出不可言喻的、基督般的福乐。无论属基督的人如何以谦卑之爱在他人面前降卑自己，也绝不能与那无罪、全能的主耶稣在罪恶污秽之人面前所显明的谦卑之爱、以及无限的谦卑相比拟。
    - type: paragraph
      text:
        ru: 'Ваистину је Он у том погледу увек «пример» за нас, пример који треба свакако постизавати, и са радошћу признавати: да га никада у потпуности не можемо постићи. Просто би се могла, иза оваког Христовог дела и мисли и осећања и речи и доживљаја, као рефрен ставити ова Христова реч: «Ја вам дадох пример да и ви тако чините». Пример, то је еваиђелски буквар, еванђелски требник, еванћелски служебник. Спас нам је оставио пример као богочовечанско средство и уџбеник спасења. Еванђеље је, на првом месту, пример, Богочовеков пример како се људи спасавају од греха, смрти и ђавола. А за Њим су нам, и по угледу на Њега, пример еванђелски сви свети апостоли, и сви светитељи, и сви праведници, јер су спасавали и себе и друге, ушледајући се иа Њега, на Његов пример, и добијајући од Њета силе и надахнућа да му следују као у огледу и примеру. Само се угледањем на Спаситеља човек спасава. Све што је Сам чинио, Спаситељ даје силе да то чине и следбеници Његови, само даје то за – смерну љубав. А она је увек добровољна, сва саткана од велике, безграничне слободе човекове, слободе боголике и богочежњиве. Уколико боголикије, утолико безграничније и богочежњивије. А када своју боголику слободу човек потчини злу и греху, овда је безгранично и зло његово и грех његов, зато га и одводе у пакао, у то царство где је свако зло – безгранично и вечно. Јер безгранична заљубљеност у зло, води човека у пакао.'
        cn: '确实，在这方面，他永远是我们的「榜样」，一个我们无论如何都应努力达成、并要欣然承认我们永远无法完全达到的榜样。简直可以在基督这样的行为、思想、情感、言语和体验之后，作为叠句放入基督的这句话：「我为你们作了榜样，叫你们照着我向你们所行的去行。」 (约翰福音 13:15)


          榜样，它就是福音的识字课本，福音的礼仪手册，福音的事奉书。救主留给了我们榜样，作为神人合一的救赎工具和课本。福音，首先是一个榜样，是神人基督的榜样，关乎人们如何从罪、死亡和魔鬼中得救。而继他之后，并效法他，所有圣使徒、所有圣人和所有义人，都成为了我们福音的榜样，因为他们效法他，遵行他的榜样，并从他那里获得力量和灵感去追随他，以他为参照和楷模，从而拯救了自己也拯救了他人。唯有效法救主，人才能得救。凡是救主自己所行的，他都赐予力量使他的追随者也能行出来，但唯独是为了——谦卑的爱而赐予。而这爱总是出于自愿，完全由人那伟大、无限的自由编织而成，这自由是肖乎神性的、渴慕神的。越是肖乎神性，就越是无限，越是渴慕神。然而当人将自己肖乎神性的自由屈从于邪恶和罪时，他的邪恶和他的罪就变得无限，因此它们将他带入地狱，进入那个一切邪恶都——无限且永恒的国度。因为对邪恶无限的迷恋，将人引向地狱。'
    - type: paragraph
      text:
        ru: 'У томе је страшна слобода човекова: јер му ни Бог не може силом наметнути љубав према добру, ни ђаво – љубав према злу. Јер љубав и јесте сила, и сплет осећања који се не може наметнути; наметне ли се – љубав престаје бити љубав, љубав већ није љубав. Јер љубав и ниче из слободе, и расте у слободи, и стоји и постоји само у слободи. Где слободе нема, ту љубави нема. Човек без слободе је робот. Роботи су неспособни за љубав, јер им недостаје слободе, која и чини човека човеком, тј. бићем каквим га ми људи знамо из свеколиког искуства рода људског, и због чега га и човеком називамо.'
        cn: 在此，是人类可怕的自由：因为连上帝都不能强加于他爱慕良善，魔鬼也不能强加于他爱慕邪恶。因为爱本身就是一种力量，也是一种无法强加的情感组合；如果被强加，爱就不再是爱了，爱就不再是爱。因为爱萌生于自由，在自由中成长，并且唯独在自由中站立和存在。没有自由之处，就没有爱。没有自由的人是个机器人。机器人无能力去爱，因为他们缺乏自由，而正是这种自由使人成为人，亦即，我们人类从人类所有经验中认识到的那种存在，以及因此我们称之为人的原因。
    - type: paragraph
      text:
        ru: '«Не говорим о свима вама; Ја знам које изабрах; него да се испуни Писмо: Који са Мном хљеб једе, подиже пету своју на Мене. Од сада вам говорим прије него се збуде, да. Када се збуде, вјерујете да Ја јесам.» (Ин.13:18–19)'
        cn: «我说的不是你们所有人；我知道我所拣选的是谁；但这是为了要应验经上的话：『那与我一同吃饼的人，竟抬起脚跟反对我。』从现在起，我在事情发生以前告诉你们，好叫事情发生的时候，你们可以相信我就是那一位了。」 (约翰福音 13:18-19)
    - type: paragraph
      text:
        ru: 'Заиста, све што Спас чини на Тајној Вечери казује нам његову главну тајну: да је Он – Бог, Богочовек. Ево божанског свезнања: Он унапред говори о Јуди и шта он смера да учини. Он само жели од својих ученика да они запамте ове речи Његове «да, кад се збуде верујете да сам ја» – Бог и човек, Богочовек. Све је устремљено једном циљу: вери у Богочовека.'
        cn: 确实，救主在最后的晚餐上所做的一切，都向我们揭示了祂的主要奥秘：祂是神，是神人。看啊，这就是神性的全知：祂预先提及犹大以及他打算做的事。祂只希望祂的门徒记住祂的这些话：「这样，当这事发生的时候，你们就相信是我」——是神也是人，是神人。一切都旨在达成一个目标：相信神人。
    - type: paragraph
      text:
        ru: Па и издајство Јудино Спаситељ претсказује својим боанским свезнањем; да би и та страшна чињеница послужила ученицима као доказ да је он заиста свезнајући Бог, и да треба веровати у Њега као Богочовека и Спаситеља. Па и у овом случају смерна љубав Спаситељева прећуткује име издајниково, и показује како их заиста «до краја љуби» (Ин.13:1).
        cn: 救主以其神圣的无所不知预言了犹大的背叛；为的是让这可怕的事实也能成为门徒们的证据，证明他确实是无所不知的上帝，并且他们理当相信他是神人兼救主。即使在此情况下，救主谦卑的爱也对叛徒的名字保持缄默，并显明他确实「爱他们到底」（约翰福音 13:1）。
    - type: paragraph
      text:
        ru: '«Заиста, заиста вам кажем: Који прима Онога кога пошаљем, Мене прима; а ко прима Мене, прима Онога који Ме је послао.» (Ин.13:20)'
        cn: 「我实实在在地告诉你们，接待我所差遣的，就是接待我；接待我，就是接待那差我来的。」（约翰福音 13:20）
    - type: paragraph
      text:
        ru: Ко Христа не признаје за Бога, онда је ваистину прави безбожник. Онда заиста нема Бога за њега, не постоји Бог. Јер кад Христос, са свима својим тако очигледним савршенствима, није Бог, онда – нема другог Бога ни на небу, ни на земљи, ни под земљом.
        cn: 不承认基督为神的人，那么他当真是真正的无神者。对他而言，当真没有神，神就不存在。因为如果基督，带着祂如此显明的诸般完美，并非神，那么——无论是天上、地上还是地下，都没有别的神了。
    - type: paragraph
      text:
        ru: 'Јер ни Бога човек не може замислити бољим, савршенијим, мудријим, свемоћнијим, милостивијим, праведнијим, свезнајућим, светијим од Христа. Да, историја ове планете незна за милије и савршеније биће од Христа. Ако би се бирао, онда би сваки нормалан чо»ек, изабрао себи њега за Бога. Не признаје ли човек њега, онда је ваистину – атеист, јер одбацује јединог истинитог Бога и неба и земље. Ту истину открио нам је Спас на Тајној вечери: «заиста, заиста вам кажем: који прима онога кога пошаљем, Мене прима; а ко прима Мене, прима онога који Ме посла».'
        cn: 因为人无法想象有上帝比基督更美善、更完美、更智慧、更全能、更慈悲、更公义、更全知、更圣洁。是的，这个星球的历史不曾知晓有比基督更慈爱和更完美的存有。如果需要选择一位神，那么任何一个正常人都会选择他作自己的上帝。如果人不承认他，那么他确实是一个无神论者，因为他弃绝了天地间独一的真上帝。救主在最后的晚餐上向我们揭示了这个真理：「我实实在在地告诉你们：凡接待我所差遣的，就是接待我；凡接待我的，就是接待那差我来的。」（约翰福音 13:20）
    - type: paragraph
      text:
        ru: 'Заиста је страхотно величанствена слобода човекова: он, сићушан и мајушан, може признати или одбацитм Бога, може веровати у Њега или не; може сместити у себи целога Бога, или га потпуно избацити. «Који прима Мене, прима онога који Ме посла» – тј. прима Бога, све Његове силе, све Његове моћи, сва његова савршенства. Шта више треба човеку од тога?'
        cn: 人类的自由确实是令人敬畏的宏伟：他，如此渺小微不足道，却能承认或拒绝上帝，能相信祂或不相信；他能将完整的上帝容纳于自身之内，或将祂完全驱逐出去。「那接待我的，就是接待那差我来的」（马太福音 10:40）——即是说，领受了上帝，祂的一切能力，祂的一切权柄，以及祂的一切完美。人还需要比这更多的什么呢？
    - type: paragraph
      text:
        ru: '«Рекавши ово Исус се узбуди духом, и посвједочи и рече: Заиста, заиста вам кажем, један од вас издаће Ме.» (Ин.13:21)'
        cn: 「耶稣说了这话，心里忧愁，就明说：「我实实在在地告诉你们，你们中间有一个人要出卖我了。」」（约翰福音 13:21）
    - type: paragraph
      text:
        ru: 'А не примити то, зар је човек и даље човвк, није ли се преметнуо у ђавола. Заиста жалити треба, бескрајно и безгранично, човвка који не прима Христа, који не верује у њега. А шта тек рећи за човека који издаје Христа Бога Њега тек треба жалити, жалити бескрајније од бескрајног и безграничније од безлраничног. То Спас и чини: «рекавши ово Исус поста жалостан у духу, и посведочи и рече: заиста, заиста вам кажем: један измећу вас издаће ме»: запрепасти се, узбуди се; ко се не би запрепастио над човеком који Бога издаје, Бога продаје? запрепастио до суза, самилосних и дирљивих, као што је случај Спасов.'
        cn: 若不接受这一点，人还是人吗？他难道没有变成魔鬼吗？确实，那不接受基督、不相信他的人，应该得到无限而无尽的怜悯。那么对于那背叛基督上帝的人，又当说什么呢？他更应当被怜悯，被无限之无限地怜悯，被无尽之无尽地怜悯。救主也正是如此行：「耶稣说了这话，心里忧愁，就明明地告诉他们说：我实实在在地告诉你们，你们中间有一个人要出卖我了。」（约翰福音 13:21）他感到震惊，心灵激动；谁能不为那背叛上帝、出卖上帝的人感到震惊呢？震惊到流泪，流出充满怜悯与动容的泪水，正如救主的情形一样。
    - type: paragraph
      text:
        ru: 'Страшна је чињеница да је човек дошао дотле у злу и грехољубљу: да и очигледног Бога неће у свом зњмаљском свету, Бога са свима дирљивим силама његовим, са свом божанском Истином, и Правдом, и Љубављу, и Добротом и Свезнањем, и Светлошћу.'
        cn: 可怕的事实是，人竟然在邪恶和爱罪中堕落到如此地步，以至于在他这尘世中，甚至不要那显而易见的上帝，就是那带着祂一切感人至深的能力、一切神圣的真理、公义、爱、良善、全知和光明的上帝。
    - type: paragraph
      text:
        ru: 'Чињеница толико страшна, да би над њом требало да и камење заплаче и закука, акамоли бића, која располажу сазнањем и осећањем, макар мајушним и нај мајушнијим, или савршенијим и најсавршенијим: јер то је најстрашнија чињеница у свима световима. Нема страшније ни у паклу, јер ниједан ђаво није са Богочовеком учинио оно кад је сишао у пакао, што је Јуда учинио са њим у нашем земаљском свету. Ту смо ми људи испред пакла и испред свих демона. Ту нам нема такмаца. Нема – на стид и срам наш.'
        cn: 这是一个如此可怕的事实，甚至连石头都应该为之哭泣和哀嚎，更何况是那些拥有认知和情感的生灵，无论是微小到最微小的，还是完美到最完美的：因为这是所有世界中最可怕的事实。即使在阴间也没有更可怕的，因为当道成肉身的神人下到阴间时，没有一个魔鬼对他做了犹大在我们这个尘世间所做的事。在这方面，我们人类超越了阴间和所有恶魔。在这方面，我们没有对手。没有——这是我们的羞耻和耻辱。
    - type: paragraph
      text:
        ru: '«Онда се ученици згледаху међу собом, и бијаху у недоумици о коме говори. А један од ученика Његових, кога Исус љубљаше, бјеше наслоњен на наручје Исусово. Њему, дакле, Симон Петар даде знак да упита ко би то био о коме говори. А овај, наслонивши се на прса Исусова, рече Му: Господе, ко је то? Исус одговори: Онај је коме Ја умочивши залогај дам. И умочивши залогај даде Јуди Симоновом Искариотском. И по залогају тада уђеу њега сатана. Онда му рече Исус: Што чиниш, чини брже. А ово не разумједе нико од оних што бијаху за трпезом зашто му рече. А неки мишљаху, будући да у Јуде бјеше кеса, да му Исус рече: Купи што нам треба за празник; или да даде штогод сиромасима. А он узевши залогај одамх изиђе; а бјеше ноћ.» (Ин.13:22–30)'
        cn: «于是门徒们彼此对望，不明白他说的是谁。有一个门徒，是耶稣所爱的，侧身倚靠着耶稣的胸怀。西门·彼得便向他使个眼色，叫他问究竟是谁呢，主所指的是谁。那门徒便就着耶稣的胸膛，问祂说：「主啊，是谁呢？」耶稣回答说：「就是我蘸了一点饼递给谁，谁就是。」耶稣就蘸了一点饼，递给加略人西门的儿子犹大。他吃了以后，撒但就入了他的心。耶稣便对他说：「你所做的，快做吧！」坐席的人中却没有一个知道，耶稣为什么对他说这话。有人以为犹大管着钱囊，耶稣是吩咐他去买我们过节所需用的东西，或是叫他拿什么周济穷人。犹大受了那点饼，就立刻出去了。那时候是夜里了。» (约翰福音 13:22-30)
    - type: paragraph
      text:
        ru: 'Запрепашћење ученика је природно. Зар један од њих да изда Господа и Учитаља, чијим су именом мртве васкрсавали, болесне исцељивали, ђаволе изгонили, и друга многа чудеса чинили? Пада у очи: да нико од ученика није то приметио код Јуде, тако се и он вешто скривао; и још: да кротки Господ није то казао ни најприснијем ученику Свом: «кога Исус љубљаше». Јер љубав је љубав и тиме што казује тајне.'
        cn: 门徒的震惊是自然的。难道他们中的一个会出卖主和夫子，奉他的名使死人复活，医治病人，赶鬼，并行了许多其他神迹吗？令人瞩目的是：没有一个门徒察觉到犹大有此意，因为他隐藏得如此巧妙；以及，温柔的主甚至没有告诉他最亲密的门徒，就是「耶稣所爱的那位」。因为爱就是爱，它会通过倾吐秘密来显明。
    - type: paragraph
      text:
        ru: 'Овом тужном догађају дугујемо једно духовно сазнање: како и жолико је Господ љубио светог Воанергеса, апостола љубави. Он је ваљда зато и постао апостоп љубави, и осетио да је Богочоввк = Љубав, Бог Љубав, што је доживео најбожанскију и најсавршенију љубав у свима световима. Зато му Спас њему једином, открива и ову тајну о богоиздајнику. Али открива тако неприметно, да нико од осталих ученика није сазнао да је то Јуда. Спаситељ је до последњег тренутка Својом смерном љубављу пакушавао да спасе Јуду од зле намере. И тек када је сав Сатана ушао у Јуду, Спас му са болом и тугом рекао: «што чиниш чини брже», и то тако рекао да нико није разумео нашта се те речи односе. Сатана уђе у Јуду кад? «по залогају тада уђе у њега Сатана», сав Сатана. И то по залогају који му Спас даде.'
        cn: 我们从这个悲伤的事件中获得一个属灵的认知：主是多么深爱着圣博阿内格斯，那位爱的使徒。他或许正是因此而成为爱的使徒，并感受到「神人即爱，神是爱」，因为他在所有世界中体验到了最神圣、最完美的爱。因此，救主唯独向他揭示了这个关于出卖神者的奥秘。但揭示得如此不引人注意，以至于其他门徒中无人得知那就是犹大。救主直到最后一刻都以祂谦卑的爱，试图将犹大从邪恶的意图中拯救出来。直到所有撒但都进入犹大体内，救主才带着痛苦和悲伤对他说：「你所做的，快去做吧」，并且他这样说，以至于没有人明白这些话指的是什么。撒但何时进入犹大？「他拿了那点食物以后，撒但就进入了他的心」，所有撒但。而这正是在救主给他的那点食物之后。
    - type: paragraph
      text:
        ru: 'Значи: Јуда је сву душу отворио Сатани и пустио га да уђе у њу, када је Спаситељ љубави последњи пут покушао да га спасе. Заиста, страшан грех, и понорно грехољубље човекове природе. У присуству оваплоћеног Бога свога учитеља и добротвора, Јуда прима у себе Сатану. Заиста се Сатана својим најмилијим злом оваплотио у Јуди. Својим грехом Јуда се потпуно изједначио са Сатаном; јер за такав грех потребно је да сав Сатана буде у човеку, дела у њему, претвори цело његово биће у радионицу греха и зла. Колика слобода у човековој љубави за зло! Присутан је Бог, и не спречава је насилно; присутан је и Сатана; а човек слободно и смело изабра ђавола, и целог га прима у себе. Сигурно се никад ниједан човак није осећао тако слободан у греху и злу као Јуда када је у њега ушао Сатана. Еванђелист, сам ученик «кога љубљаше Исус», који је једини сазнао ову страшну тајну Јуднну, бележи то ничим не грдећи Јуду: «А он узевши залогај одмах изиђе; а беше ноћ».'
        cn: 因此，当爱的救主最后一次试图拯救犹大时，犹大将他整个灵魂向撒旦敞开，并允许撒旦进入他的灵魂。这确实是可怕的罪，以及人类本性深渊般的嗜罪欲。在道成肉身的神——他的老师和恩人——面前，犹大将撒旦收入自己里面。确实，撒旦以其最爱的邪恶在犹大身上道成肉身。通过他的罪，犹大与撒旦完全等同了；因为要犯下这样的罪，需要整个撒旦都在那人里面，在他里面运作，将他的整个存在变成罪恶与邪恶的作坊。人对邪恶的爱中蕴含着何等的自由！上帝在场，却没有强行阻止；撒旦也在场；而人却自由而大胆地选择了魔鬼，并将魔鬼完全地收入自己里面。无疑，从来没有一个人在罪恶中和邪恶中感到如此自由，像犹大被撒旦进入时那样。这位福音书作者——那位「耶稣所爱的」门徒本人，他是唯一知道犹大这个可怕秘密的人——记载了这件事，却丝毫没有责骂犹大：「他拿了那点食物，立刻就出去了；那时是夜间了。」 (约翰福音 13:30)
    - type: paragraph
      text:
        ru: У Јуди сигурно страшнија ноћ него напољу, у природи.
        cn: 对犹大来说，这夜晚无疑比外面大自然中的夜晚更可怕。
    - type: paragraph
      text:
        ru: '«Кад он изиђе, Исус рече: Сада се прослави Син Човјечији, и Бог се прослави у Њему. Ако се Бог прослави у Њему, и Бог ће Њега прославити у Себи, и одмах ће Га прославити.» (Ин.13:31–32)'
        cn: «他出去后，耶稣说：现在人子得了荣耀，神也在他身上得了荣耀。若是神在他身上得了荣耀，神也要在祂自身中荣耀他，并且立时就要荣耀他。» (约翰福音 13:31-32)
    - type: paragraph
      text:
        ru: 'Са Јудом је изашло све зло, сав Сатана: остао је сам Спаситељ, сав Бог, са својим божанским ученицима. То је славље божанског добра: клица оног божанског сведобра, оног божанског еванђеља, оне спасоносне Цркве: којом је прослављен Богочовек Христос, и сам Отац, и спасен свет. Јер је Богочовек са овим светим ученициома спасао свет од греха, смрти и ђавола, и тако прославио човека у Богу и Бога у човеку. Спасен човек – то је слава Божија, слава Богочовекова; а Богочовек је слава спасеног човека. Бог Логос је као Син Човечији, као човек извршио спасење света; у томе је слава његава; али Син Човечији је као човек Богом, оваплоћеним у Њаму, извршио то спасење; у томе је слава човекова. Једном речју: слава и Бога и човека је Богочовек: само Богочовеком и у Богочовеку, Бог је заиста постао славан у човеку, и међу људима; и још: само Богочовеком и у Богочовеку и човек је заиста постао славан у Богу и пред Богом: јер је стао пред Бага без греха, без смрти, без ђавола: сав безгрешан, сав бесмртан, сав вечан. То нам казују ове еванђелске речи: кад Јуда изиђе, Исус рече: сад се прослави Син Човечији, и Бог се прослави у њему. Ако се Бог прослави у њему, и Бог ће Њега прославити у себи, и одмах ће га прославити».'
        cn: 随着犹大出去的是所有的邪恶，全然是撒旦：只剩下救主，全然是神，与他神圣的门徒们同在。这是神圣良善的荣耀：那是神圣至善、神圣福音、救赎教会的肇始：借此，神人基督、父本身，以及得救的世界都得了荣耀。因为神人藉着这些圣洁的门徒，将世界从罪、死亡和魔鬼中拯救出来，并因此在神里面荣耀了人，也在人里面荣耀了神。得救的人——那是神的荣耀，是神人的荣耀；而神人则是得救之人的荣耀。神圣言作为人子，作为人完成了世界的救赎；这便是他的荣耀；但人子作为人，藉着在他里面道成肉身的神，完成了那救赎；这便是人的荣耀。一言以蔽之：神与人的荣耀皆是神人：唯独藉着神人并在神人之中，神才真正在人里面、在世人中间得了荣耀；并且：唯独藉着神人并在神人之中，人也才真正在神里面、在神面前得了荣耀：因为他得以无罪、无死、无魔鬼地站在神面前：全然无罪，全然不朽，全然永恒。这些福音书上的话语告诉我们：当犹大出去后，耶稣说：「如今人子得了荣耀，神也在他里面得了荣耀。如果神在他里面得了荣耀，神也必在他自己里面荣耀他，并且立刻荣耀他。」
    - type: paragraph
      text:
        ru: «Дјечице, још сам мало с вама; тражићете Ме, и као што рекох Јудејцима да куда Ја идем ви не можете доћи, то и вама сада говорим.» (Ин.13:33)
        cn: 「小子们，我与你们同在的时候不多了；你们会寻找我，正如我曾对犹太人说过：『我所去的地方你们不能到』，现在我也这样对你们说。」 (约翰福音 13:33)
    - type: paragraph
      text:
        ru: 'За грандиозну тајну спасења света Крсном смрћу и васкрсењем Богочовековим заиста су и Једанаесторица пре Педесетнице «дечица», мала деца. Они још од ње мало разумеју, или скоро нимало. На путу кроз смрт и васкрсење они не могу да прате Спаситеља, и нису могли све до Педесетнице. А све дотле, они ће том страшном тајном бити као дечица и збуњени и преплашени и ожалошћени. Зато их Господ нежно теши: «дечице, још сам мало с вама; тражићете ме, и као што рекох Јудејцима: куда ја идем ви не можете доћи, и вама говорим сад».'
        cn: 为了神人以十字架上的死与复活所成就的宏伟世界救赎奥秘，五旬节之前的十一位门徒，确实是「孩童」，是小孩子。他们对此仍旧了解甚少，或者说，几乎全不了解。在穿越死亡和复活的道路上，他们无法跟随救主，并且直到五旬节之前都未能跟随。而在此之前，他们将因这可畏的奥秘而像孩童一样，既困惑又惊恐，且充满哀伤。因此，主温柔地安慰他们说：「孩子们，我与你们同在的时候不多了；你们会寻求我，正如我曾对犹太人说：『我所去的地方，你们不能到那里去』，现在我也对你们说。」 (约翰福音 13:33)
    - type: paragraph
      text:
        ru: '«Заповијест нову дајем вам: да љубите једни друге, као што Ја вас љубих, да и ви љубите једни друге. По томе ће сви познати да сте Моји ученици ако будете имали љубав међу собом.» (Ин.13:34–35)'
        cn: 「我赐给你们一条新诫命：你们要彼此相爱，正如我爱你们一样，你们也要彼此相爱。众人因此就认出你们是我的门徒，如果你们彼此有爱。」（约翰福音 13:34-35）
    - type: paragraph
      text:
        ru: 'У Богочовеку све је ново: и Бог и човек, све Божије и све човечије. Бог је нов, зато што се јавио у потпуности својој, са свима божанским савршенствима; човек је нов, јер се појавио без греха и зла, у безгрешној бесмртности и валичанствености својој. Отуда је сав живот Богочовеков нешто ново и сва дела Његова, и Еванђеље Његово, Истина Његова, и Правда, и Милост, и Мудрост, и Доброта, а сврх свега љубав. Јер све што је Богочовеково слива се кроз све божанске врлине у једну свеврлину, и све заповести у једну свезаповест. А та свезаповест, те свеврлине, та богочовекова свесила јесте: Његова Богочовечанска љубав. Она је безгрешна, света, безгранична, увек божанствена, вечна, и тиме увек млада, увек нова. Јер вечност не стари, не зна за промене које све што стари гоне из прошлости кроз садашњост у будућност, која је обично гроб авега временског.'
        cn: 在神人中，一切都是新的：无论是神还是人，一切属于神的和一切属于人的。神是新的，因为他以其完全的自身，带着一切神圣的完满显现；人是新的，因为他显现时没有罪恶和邪恶，处于其无罪的不朽和威严之中。因此，神人的一切生命都是新的，祂的一切作为、祂的福音、祂的真理、祂的公义、祂的怜悯、祂的智慧、祂的良善，而最重要的是爱，都是新的。因为一切属于神人的，都通过一切神圣的美德汇聚成一种至高美德，并且一切诫命汇聚成一条至高诫命。而那条至高诫命，那些至高美德，那种神人性的至高力量就是：祂的神人性之爱。它是无罪的，圣洁的，无限的，永远神圣的，永恒的，因此永远年轻，永远常新。因为永恒不会衰老，它不知有变化，这些变化将一切会衰老的事物从过去经由现在推向未来，而未来通常是所有时间性事物的坟墓。
    - type: paragraph
      text:
        ru: Оно што Богочовекову љубав чини изузетно новом и по чему она и заслужује да се назива новом, увек новом, јесте то што она воли људе и у гресима њиховим, воли их и у смртима њиховим, воли их и у манама њиховим, јер никад не изједначује грек са грешником и смрт са смртником, и злочин са злочинцем; она разиучује грех од грешника, не убија грешника због греха, него га ослобађа од греха; не убија смртника због смрти, него га спасава од смрти; она осуђује грех а милује грешника, и спасава га од греха; она никада не воли грех због грешника, него мрзи грех, а воли грешника; исто тако она никада не воли грешника због греха, него жали грешника а осуђује грех; она увек и безгранично воли све шгго је божанско, свето, бесмртно и вечно, а мрзи безгранично само грех и ђавола.
        cn: 神人（道成肉身）的爱之所以异常新颖，也正因此配得上被称为新的、永远是新的，是因为它爱世人，甚至在他们的罪中；爱他们，甚至在他们的死亡中；爱他们，甚至在他们的过犯中。因为它从不将罪与罪人、死亡与死人、罪行与罪犯等同起来；它将罪与罪人区分开来，不因罪而杀害罪人，而是将他从罪中释放；不因死亡而杀害死人，而是将他从死亡中拯救；它谴责罪，而怜悯罪人，并将其从罪中拯救；它从不因罪人而爱罪，而是憎恨罪，而爱罪人；同样，它从不因罪而爱罪人，而是怜恤罪人，而谴责罪；它永远且无限地爱着一切属神的、神圣的、不朽的和永恒的事物，而无限地憎恨唯有罪和魔鬼。
    - type: paragraph
      text:
        ru: 'У томе је величина Богчовекове, еванђелске љубави. По томе се Он познаје и распознаје у земаљском свету; по томе се познају и распознају и ученици његови. Знак: богочовечанска љубав, јер љубе «као што он љуби»: не додајући ништа људско Његовој бошчовечанској љубави, нити јој одузимајући ишта божанско. То нам све казују речи ове Спасаве: «нову вам заповест дајем: да љубите један другога као што вас ја љубих да се и ви љубите мећу собом. По томе ће сви познати да сте моји ученици ако узимате љубав међу собом».'
        cn: 这就是神人的、福音之爱的伟大之处。借此，祂在尘世中被认识和辨认；祂的门徒也借此被认识和辨认。标记即是神人性的爱，因为他们爱「如同祂爱」一样：不给祂的神人性的爱增添任何属人的东西，也不从其中夺走任何神圣之物。救主这些话语向我们阐明这一切：「我赐给你们一条新诫命：你们要彼此相爱，如同我爱了你们，使你们也彼此相爱。众人因此就认出你们是我的门徒，如果你们彼此之间有爱。」
    - type: paragraph
      text:
        ru: 'Сва је суштина ове истине у речима: «као што вас Ја љубих». Таква љубав никада не стари; увек је нова за онога који је упражњава и за онога иа кога се односи. Увек нова, јер увек свега и непорочна. Само се од греха стари, само се од греха састарује свако људско осећање: и милост и љубав и доброта. Толико се од греха стари, да се најзад од старости и умре.'
        cn: 这项真理的全部精髓在于这些话语：「正如我爱了你们一样。」这样的爱永不衰老；对于践行它的人和它所指向的人来说，它永远是新的。永远是新的，因为它永远是全然且无瑕的。唯独因罪而衰老，唯独因罪而老旧的是每一种人类情感：包括怜悯、爱和良善。它因罪而衰老如此之甚，以至于最终因衰老而死亡。
    - type: paragraph
      text:
        ru: '«Рече Му Симон Петар: Господе, куда идеш? Исус му одговори: Куда Ја идем не можеш сада ићи за Мном, али ћеш послије поћи за Мном. Петар Му рече: Господе, зашто сад не могу ићи за Тобом? Живот свој положићу за Тебе. Одговори му Исус: Живот ли ћеш свој положити за Мене? Заиста, заиста ти кажем: неће пијетао запјевати док Ме се трипут не одрекнеш.» (Ин.13:36–38)'
        cn: «西门·彼得对祂说：主啊，你往哪里去？耶稣回答他：我所去的地方，你现在不能跟我去，后来却要跟我去。彼得对祂说：主啊，为什么我现在不能跟你去？我愿意为祢舍命。耶稣回答他：你愿意为我舍命吗？我实实在在地告诉你：鸡叫以前，你要三次不认我。» (约翰福音 13:36-38)
    - type: paragraph
      text:
        ru: 'Петар – тип пламене вере, која када се Духом Светим устали, Постје чудо и за анђеле на небу и за људе на звмљи. Такву веру обичмо сустопице прати пламена љубав, која такође док се Духом Светим не освети и не устали има своја драматична дизања и спуштања, успоне и падове. Ап. Петар је типичан пример правог човека: не зна себе до краја, верује у своје силе и моћи, а и не слути колике су то и како подмукле издајице. И заиста, човек сам собом никад не може познати све; потребно је да прође кроз миога искушења, да би донекле сазнао, сагледао и познао себе. Само кад Бог Логос – «Светлост света» и «Светлост живота» осветли све поноре људског бића и све скривнице, човек може истииски познати себе.'
        cn: 彼得是火热信心的典范，这种信心当被圣灵坚定后，便成为对天上的天使和地上的世人而言的奇迹。这样的信心通常伴随着火热的爱，而这爱在被圣灵洁净并坚定之前，也有着其戏剧性的起伏、高潮和低谷。使徒彼得是一个真实的人的典型例子：他不完全认识自己，相信自己的力量和能力，却不曾料到它们是多么巨大，又是多么阴险的叛徒。确实，人凭自己永远无法认识一切；他需要经历诸多试炼，才能在某种程度上了解、洞察并认识自己。唯有当神——道（Logos）——「世界之光」和「生命之光」照亮人类存在的一切深渊和所有隐秘之处时，人才能真正认识自己。
    - type: paragraph
      text:
        ru: 'Уствари, самопознање се добија кроз христопознање, коме претходи христољубље. Али ту «светлост света» и «светлост живота» човеку даје Дух Свети за веру у Христа и љубав према Христу. Њу је ап. Петар и добио, на дан Свете Педесетнице, и тек онда потпуно познао себе, и учврстио и веру своју и љубав своју. А сада, ено на Тајној Вечерн се куне у своју верност Господу Христу, а Спас му са тугом претсказује пад те исте ноћи: «неће петао запевати док ме се трипут не одречеш».'
        cn: 事实上，自我认知需通过对基督的认识才能获得，而对基督的认识又以爱慕基督为先导。但那「世界之光」和「生命之光」是圣灵为着人对基督的信仰和对基督的爱而赐予的。使徒彼得正是在圣灵降临节那天获得了它，直到那时才完全认识了自己，并坚固了自己的信仰和爱。而现在，看哪，他在最后的晚餐上向主基督发誓效忠，但救主却带着悲伤预言他将在当晚跌倒：「鸡叫以前，你要三次不认我。」（约翰福音 13:38）
    - type: paragraph
      text:
        ru: 'Крте су и ломљиве све људске силе док се не обогате Богом, док не ојачају Богом. За навек је истинита псалмопевчева истина који је као ретко ко познавао човека и његове слабости: «Богом смо јаки».'
        cn: 所有人类的力量都是脆弱易碎的，除非它们在神里得以丰盛，在神里得以坚固。诗篇作者的真理永远是真实的，他像鲜有人能那样认识人及其软弱，他说：「我们因神而刚强。」
    - type: paragraph
      text:
        ru: Да, само Богом.
        cn: 是的，唯独藉着上帝。
  - type: heading2
    text:
      ru: Глава четрнаеста. Опроштајна беседа са ученицима
      cn: 第十四章 告别讲论与门徒
    children:
    - type: paragraph
      text:
        ru: «Нека се не збуњује срце ваше, вјерујте у Бога, и у Мене вјерујте.» (Ин.14:1)
        cn: 「你们心里不要忧愁；你们信神，也当信我。」 (约翰福音 14:1)
    - type: paragraph
      text:
        ru: 'Од чега се плаши срце људско? или боље: Од чега се не плаши? Плаши се света, плаши зла у свету; плаши се људи, плаши богова; плаши се смрти, плаши греха, плаши се многих појава, плаши демона; плаши се мржње, плаши љубави, плаши се мисли, плаши осећања; а сврх свега плаши се себе. Све је то зато игпо је слабо, а сувише миого осећа, много види, много зна. Лек је од страха, шта? Бог, вера у Бога, вера у Богочовека. Јер га она испуњује Богом, Његовом мудрошћу и силом: и оно и осећа и зна да промисао Божји у свету влада, да ништа не бива без воље Божје, да ни длака с главе не пада без воље Божје. Оно онда осећа и зна: Бог Логос води све светове од њиховог почетка њиховом крају, њиховом циљу; води логосно, мудро, логично; води и свако срце људско, али – увек у споразуму са његовом вољом.'
        cn: 人的心惧怕什么？或者更确切地说：它不惧怕什么？它惧怕世界，惧怕世上的恶；惧怕人，惧怕神明；惧怕死亡，惧怕罪，惧怕许多现象，惧怕魔鬼；惧怕仇恨，惧怕爱，惧怕思想，惧怕情感；而最重要的是，它惧怕自己。所有这一切都是因为它软弱，却感受得太多，看得太多，知道得太多。恐惧的解药是什么？是上帝，是对上帝的信仰，是对神人的信仰。因为信仰以神、以祂的智慧和能力充满它（心）：并且它（心）感受到并知道上帝的护理在世上掌管一切，没有一件事不是出于上帝的旨意，甚至连一根头发也不会未经上帝的旨意而落下。那时它（心）感受到并知道：圣言（道）上帝引导所有世界从它们的开始到它们的终结，到它们的目的；引导得合乎道（理）、智慧、逻辑；也引导每一个人的心，但是——总是在与其（人）意愿的协调中。
    - type: paragraph
      text:
        ru: 'Јер је оно обдарено највећом слободом, боголиком а то – бескрајно. Поверује ли у Богочовека, срце се онда не плаши ни смрти, јер зна и осећа да је побеђена Христовим васкрсењем; не плапш се ни зла ии ћавола, јер осећа и зна да је несравњено јаче од зла – добро, и од ђавола – Бог. Верује ли у Богочовека, срце се не плаши ни себе, ни својих осећања, ни својих мисли: јер од старог вером постаје ново, и све мисли његове постају нове, постају – богомисли; и сва осећања његова постају – богоосећања; срце које је дотле било радионица сваког зла, постаје радионица сваког божанског добра. «Добар човек из добре клијети срца свог износи добро, а зао човек из зле клијелта срца свог износи зло» (Лк.6:45).'
        cn: 因为它被赋予了最大的自由，那是肖神的，并且是无限的。如果它（心）相信神人（基督），那么心就不再害怕死亡，因为它知道并感觉到死亡已被基督的复活所战胜；也不再害怕邪恶和魔鬼，因为它感觉到并知道，善比恶无可比拟地更强大，上帝比魔鬼更强大。如果它相信神人，心就不再害怕自己，不再害怕自己的情感，也不再害怕自己的思想：因为通过信仰，旧的（心）变为新的，它所有的思想都变为新的，变为神性思想；它所有的情感都变为神性情感；那在此之前曾是各种邪恶作坊的心，变成了各种神圣良善的作坊。「善人从他心里的善宝库中带出善，恶人从他心里的恶宝库中带出恶」（路加福音 6:45）。
    - type: paragraph
      text:
        ru: 'Док не поверује у Богочовека, и не испуни себе Његовим божанским силама, срце је извор свакога зла. «Јер изнутра из срца људскога излазе мисли зле, прељубе, блуд, убиства, крађе, лакомства, пакости, злоће, лукавство, срамоте, зло око, хуљење на Бота, понос, безумље» (Мк.7:21–22;Мф.15:19). Вером се обнавља срце у човаку: и све ново твори. Испуњује се Божје обећање: «Даћу им ново срце и нов дух» И заиста даје – Христом.'
        cn: 除非一个人相信了神人，并以祂的神圣能力充满自己，否则他的心便是万恶之源。「因为从人心里发出恶念、奸淫、淫乱、杀人、偷盗、贪婪、恶毒、邪恶、诡诈、放荡、恶眼、亵渎、骄傲、愚妄」（马可福音 7:21-22，马太福音 15:19）。藉着信心，人的心得以更新；并使一切都焕然一新。上帝的应许得以应验：「我必赐给他们一颗新心和一个新灵。」祂确实藉着基督赐下了这一切。
    - type: paragraph
      text:
        ru: Вера у Бога и вера у Богочовека, вера у једног истинитог Бога Тројичног. Зато су по светој речи Спасовој оне изједначене. Јер Син увек одводи Оцу, као што и Отац увек приводи Сину. Тако смо у Бошчовеку видели како стварно изгледа Бог, и Његова Истина, и Његова Правда, и Његова Доброта, и Његова Љубав. И кроз Њега истински поверовали у Бога. Без Богочовека и мимо Богочовека немогућа је права вера у једног истинитог Бога. Јер без Њега Бог увек остаје за људе неко далеко, наднебеско, недостижно, недокучиво биће, неки апкстрактни појам, или логичка и етичка неопходност, или логички појам, логичка схема и теорема.
        cn: 对上帝的信仰和对神人的信仰，乃是对独一真三一上帝的信仰。因此，按照救主的圣言，它们是等同的。因为圣子总是引人归向圣父，正如圣父总是引人归向圣子。通过神人，我们才得以看见上帝的真实面貌，祂的真理、祂的公义、祂的良善以及祂的爱。并借着祂真正地信仰了上帝。没有神人，脱离神人，就不可能真正信仰独一真上帝。因为没有祂，上帝对人们而言，永远是一个遥远、超乎诸天、无法触及、无法领悟的生命，一个抽象概念，或是逻辑上和伦理上的必然性，又或是一个逻辑概念、逻辑图式和定理。
    - type: paragraph
      text:
        ru: 'Са Богочовеком Христом све се мења: Бог постаје у нашем земаљском свету најнепосреднија и прочињеница људока стварност; тако и Божја Истина, и Божји Живот, и Божја Љубав, и Божја Правда, и сва Божја својства и савршенства постају најнепосредније и трочињенице људске стварности, људске емпирије, људско искуство и живот.'
        cn: 与神人基督同在，一切都改变了：上帝在我们这世上的世界中，成为最直接且被经历的人类现实；同样，上帝的真理、上帝的生命、上帝的爱、上帝的公义，以及上帝一切的属性和美德，都成为最直接且被经历的人类现实、人类经验、人类体验和生命。
    - type: paragraph
      text:
        ru: '«У кући Оца Мојега станови су многи. А да није тако, зар бих вам рекао: Идем да вам припремим мјесто. И ако отидем и припремим вам мјесто, опет ћу доћи, и узећу вас к Себи да гдје сам Ја, будете и ви. И куда Ја идем знате, и пут знате.» (Ин.14:2–4)'
        cn: 「在我父的家里有许多住处；若是没有，我就早已告诉你们了。我去原是为你们预备地方去。我若去为你们预备了地方，就必再来接你们到我那里去；叫我在哪里，你们也在那里。我往哪里去，你们知道；那条路，你们也知道。」（约翰福音 14:2-4）
    - type: paragraph
      text:
        ru: 'Небо је несравњено богатије од земље. Бог је несравњено богатији од човека. То нам је конкретно показао Богочовек. О, колико је места, колико бескрајних простора у Христу и Његовом Еванђељу за сваког човека: у Његовом добру колико вечиости и колико живота за сваког доброљубивог човека; тако и у Његовој љубави, и правди, и мудрости – толико вечности, и толико живота, и толико бескрајности, да и кад би сви људи ушли у њих, то би – неколико капи ушло у безобални океан. Свака од њих је – обиталиште Божје; а тиме и сваког Божјег слуге и следбеника. Како раскошан и величанствен стан за душу људску је Христова Истина, или Правда, или Љубав. А тек горе на небу – какве ли су и колике ли су, са колико вечности и бесмртности и бескрајности свака од њих. А све тек скупа. Зато Спас и говори о многим становима «у кући Оца Свог», у небеској кући. Да, небеса, и небеса над небесима, то је све једна кућа Божја, и у њој многи станови: и за Анђеле и за људе. Али те станове за људе припрема по своме бескрајном човекољубљу Господ Христос. А људе припрема за њих Својим Еванђељем.'
        cn: 天堂远比地上富饶。上帝远比世人富饶。神人具体地向我们展示了这一点。哦，在基督和祂的福音里，为每一个人预备了多少地方，多少无尽的空间：在祂的良善中，为每一个爱慕良善之人预备了多少永恒，多少生命；同样，在祂的爱、公义和智慧中，也预备了多少永恒，多少生命，多少无限，即便所有人都进入其中，那也只是几滴水滴入无垠的海洋。它们中的每一个都是——上帝的居所；也因此是上帝每一位仆役和门徒的居所。基督的真理、公义或爱，对人类灵魂而言，是何等华丽宏伟的居所啊！而在天上——它们中的每一个又是何等奇妙，何等浩大，蕴含着多少永恒、不朽和无限啊！更何况它们全部加起来呢。因此，救主也谈到「在我父的家里有许多居所」，也就是在天上的家。是的，诸天，以及诸天之上，这都是上帝唯一的家，其中有许多居所：既为天使，也为世人。但这些为世人预备的居所，是主基督凭着祂无限的慈爱所预备的。而祂则用自己的福音，预备世人进入其中。
    - type: paragraph
      text:
        ru: 'То значи: спасава их од греха, смрти и ђавола, – тј. од свега онога чему нема места у Богу и на небу, а испуњује свим што је божанско, бесмртно и вечно, тј. оним чему је вечни живот у Богу, у становима Божјим на небу. Јер је Богочовек и дошао међу људе, и извршио богочовечански подвиг спасења света, да би људе привео к себи, «узео» их к себи, да и они буду где је Он сам: «да и ви будете где сам ја». То је крајњи циљ Богочовека, Његове Цркве у свету. А Црква, са свима Светим Тајнама, и свима својим безбројним светињама, није ли кућа Божја на земљи са многима становима небеским? Сигурно јесте, јер је у њој вечноживи Богочовек, а где је Он – ту је већ небо, ту Његова небеска кућа са безбројним становима за Његове следбенике.'
        cn: 这意味着：祂将他们从罪、死亡和魔鬼中拯救出来——即从一切在上帝和天堂中无立足之地的事物中拯救出来，并以一切神圣、不朽和永恒的事物充满他们，即以那在上帝里、在上帝天上的居所里永恒生命的事物充满他们。因为上帝人子来到世人中间，并完成了神人拯救世界的壮举，为要将人们引到自己身边，「收纳」他们归于自己，好叫他们也能在祂所在之处：「叫你们也在我所在的地方。」这是上帝人子，以及祂在世上教会的最终目标。那么教会，连同她所有的圣奥秘以及她所有无数的圣物，难道不正是上帝在世上、带有许多天上居所的家吗？确然是如此，因为永生不灭的上帝人子在其中；而祂所在之处——那里便已是天堂，那里便是祂的天上家园，为祂的追随者预备了无数的居所。
    - type: paragraph
      text:
        ru: Ето, светог Причешћа! Зар у Њему није сав Богочовек Христос са свима својим божанским силама и светињама. Причешћује се човек, гле, он је већ онде где и Господ Христос; сав у Христу и Христос сав у њему. Па свето Крштење, па јелеосвећење, па свака молитва, па свако «Господи помилуј» низводе у душу блаогодат, и са њом и у њу Господа Христа; зар то није већ стварно Христов човек онде где и Господ његов? Јеси ли у Цркви, та ти си већ онде где и Господ Исус. А земаљска Црква је једно са небеском; из ње се улази у ону; сва ова улази у ону, јер су двоје – једно, зато што оу обе – једно тело Богочовека Христа. Богочовек Христос води и уводи у њих свим својим бићем, свим својим Еванђељем. Он је сам пут – у небеске станове, пут увек један, иако води кроз многе свете тајне и врлнне, пут Богу и свему Божјем, пут бесмртности и вечности Божјој.
        cn: 看哪，神圣圣餐！难道神人基督不带着祂一切的神圣力量和圣洁，全然在其中吗？人领受圣餐，看哪，他已然在主基督所在之处了；全然在基督里，基督也全然在他里面。还有神圣洗礼，还有傅油圣事，还有每一次祷告，还有每一次「主啊，怜悯我」，都将恩典倾注于灵魂之中，并借着恩典，也将主基督倾注于灵魂之中；这难道不是一个真正属基督的人，已经身处他的主所在之处了吗？你若在教会中，那么你就已然在主耶稣所在之处了。而地上教会与天上教会乃是一体；人由此进入彼；所有这些都进入到那里面，因为二者合一，皆因二者同为神人基督的一个身体。神人基督以祂的全部存有，以祂的全部福音，引领并带入其中。祂本身就是道路——通往天上居所的道路，这道路永远是唯一一条，尽管它穿越许多神圣圣事和美德，是通往上帝及一切属上帝之物的道路，是通往不朽和上帝永恒的道路。
    - type: paragraph
      text:
        ru: '«Рече Му Тома: Господе, не знамо куда идеш; и како можемо знати пут?» (Ин.14:5)'
        cn: 「托马对祂说：『主啊，我们不知道你往哪里去，怎能知道那条路呢？』」 (约翰福音 14:5)
    - type: paragraph
      text:
        ru: 'Али све то ипак није било јасно апостолима док Дух Свети није сишао иа њих, и увео их у сваку Христову истину, зато апостол Тома и пита на Тајиој вечери Спаситеља: «Господе! не знамо куда идеш! и како можемо пут знати?» Сви су наши људски путеви зашли у прашуму треха и смрти, и тамо се претворили у беспућа и распућа. Нема пута из овог у онај свет; нема пута из смрти у бесмртност, из смрти у живот вечни.'
        cn: 然而，所有这一切，直到圣灵降临在他们身上，并引导他们进入基督的全部真理之后，对使徒们来说才变得清楚。因此，使徒多马在最后的晚餐上问救主说：「主啊！我们不知道你往哪里去！我们怎能知道那条路呢？」我们所有属人的道路都已迷失在罪恶和死亡的原始森林中，并在那里变成了迷途和歧路。没有道路能从今生通往来世；没有道路能从死亡通往不朽，从死亡通往永恒的生命。
    - type: paragraph
      text:
        ru: '«Исус му рече: Ја сам Пут, Истина и Живот; нико не долази Оцу осим кроз Мене.» (Ин.14:6)'
        cn: 耶稣对他说：「我就是道路、真理、生命；若不藉着我，没有人能到父那里去。」(约翰福音 14:6)
    - type: paragraph
      text:
        ru: 'На то Спас одговара: «Ја сам пут и истина и живот». Испред пута и истине и живота стоји Богочовеково Ја, Богочовекова Личност. У Њему је то троје једно, И у исто врвме бескрајно и вечно. Све то и споља и изнутра носи печат Његове Личности. И пут је Личност, и то Богочовечанска Личност; и Истина је Личност; и Живот је Личност, и то опет све Богочовечанска Личност.'
        cn: 对此，救主回答说：「我就是道路、真理、生命。」在道路、真理和生命之前，乃是神人性的「我」，神人性的位格。在祂里面，这三者合一，并且同时是无限的和永恒的。所有这一切，无论是从外在还是内在，都带有祂位格的印记。道路也是位格，并且是神人性的位格；真理也是位格；生命也是位格，并且所有这些都是神人性的位格。
    - type: paragraph
      text:
        ru: 'Не, Истина није дискурсиван, логички појам; истина није ни сав ум људски, ни сва душа, ни сви умови људски ни све душе; истина није ни шта људско, па било то култура, цивилизација, техника, наука, философија, религија; Истина није ни Анђео, ни сви Анђели скупа; Истина није ни сав свет, ни све васионе; Истина је нешто несравњено више и веће од тога; Истина је Личност, и то Личност Христа Бога. Тиме се потпуио исцрпљује и биће Истине, и појам Истине, и дефиниција Истине. То што је речено о Истини важи и за Живот: Живот је – Личност Богочовека Христа. Тако исто и Пут у Истину, и Пут у Живот је опет – Личност Богочовека Христа. Он као Пут води кроз Истину у Живот вечни. То троје у Њему је једносушно.'
        cn: 不，真理并非一个论述性、逻辑性的概念；真理既不是人类的全部心智，也不是人类的全部灵魂；也不是所有人类的心智，也不是所有人类的灵魂；真理也不是任何人类的事物，无论是文化、文明、技术、科学、哲学，抑或是宗教；真理也不是任何一位天使，也不是所有天使的总和；真理也不是整个世界，也不是所有的宇宙；真理是某种远比这些更崇高、更伟大的事物；真理是一个位格，并且是基督上帝的位格。如此一来，真理的本体、真理的概念以及真理的定义就都完全涵盖了。关于真理所说的这些，也同样适用于生命：生命是神人基督的位格。同样地，通往真理的道路，以及通往生命的道路，也同样是神人基督的位格。祂作为道路，带领人穿越真理，进入永生。这三者在祂里面是同本体的。
    - type: paragraph
      text:
        ru: 'Нема Истине ван живота у Христу; нема живота ван истине Христове; нема пута у живот и истину ван Христа Бога. Таква благовест о Истини и Животу, такво сазнање Истине дошло је човечанском свету од појаве Богочовека. Стога је Еванђелист свети у праву када тврди да «Истина постаде од Исуса Христа» (Ин.1:17). А та Истина, која је Богочовек, разливена је по свему што је Богочовеково: по Његовим еванђелским речима, и делима, и догађајима. Сва је пристуна само у Њему, а Он сав присутан у Цркви, стога је «Црква – стуб и тврђава Истине» (1Тим.3:15).'
        cn: 在基督里的生命之外，就没有真理；在基督的真理之外，就没有生命；在基督上帝之外，就没有通往生命与真理的道路。这样关于真理与生命的福音，这样对真理的认识，自从上帝兼人者的显现，便临到了人类世界。因此，圣福音使者宣称「真理是由耶稣基督而来」（约翰福音 1:17），是正确的。而那真理，即是上帝兼人者，弥漫于一切属于上帝兼人者的事物之中：在祂的福音言语、行为和事件中。真理完全只存在于祂里面，而祂完全存在于教会中，因此「教会是真理的柱石和根基」（提摩太前书 3:15）。
    - type: paragraph
      text:
        ru: 'А то значи: Она је и пут и истина и живот, јер су ово троје увек једно у Христу. Тако само Црква има пут који кроз истину води у живот вечни. Јер где је Богочовек, онде је и Истина вечна и Живот вечни и Пут вечни. А Он је све то зато што је Друго Лице Пресвете Тројице. Поставши човек, Он је на човечански реалан и очигледан и приступачан начин показао да је Он, зато што је Друго Лице Пресвете Тројице, Истина и Живот, и Пут у Истину и у Живот. Зато је Он – најкраћи и најсигурнији пут за род људски, за људе – у Истину и Живот: Тросунчано Божанство: «нико неће доћи к Оцу до кроза ме». «Нико», значи нико од људи не може познати Истину ни на који други начин сем Богочовеком, ни стећи живот вечни. И још: нико не може осим Бопачавеком познати јединог и истинитог Бога. Сви други путеви воде лажним боговима. Иде ли човек до краја Христовом Истином, Правдом, Љубављу, морају га одвести Богу Оцу, Троједином Божанству, као свом Праизвору. Све што је Богочовеково: свака реч Његова, свако дело, свака мисао – одводе Богу Оцу, одводе Пресветој Тројици, као Свеизвору Исгиие, Живота, Правде, Љубави, Мудрости…'
        cn: 这便意味着：她既是道路，又是真理，又是生命，因为这三者在基督里永远合一。因此，唯有教会拥有这条道路，它通过真理引向永恒的生命。因为神人在哪里，永恒的真理、永恒的生命和永恒的道路就在哪里。而他就是这一切，因为他是至圣三位一体的第二位格。道成肉身之后，他以真实、明显且易于理解的人类方式表明，他，因为他是至圣三位一体的第二位格，就是真理和生命，以及通往真理和生命的道路。因此，他就是人类，就是世人，通往真理和生命，最短且最稳妥的道路：通往那放射三日光辉的神性：「若不借着我，没有人能到父那里去。」（约翰福音 14:6）「没有人」，这意味着，没有任何人能够通过除了神人以外的任何其他方式认识真理，也不能获得永生。并且，除了神人以外，没有任何人能够认识独一的真神。所有其他的道路都引向虚假的诸神。如果人彻底遵循基督的真理、公义和爱，它们必然将他引向上帝父，引向三一神性，作为它们自身的原始源头。凡是属于神人的：他的每一句话，每一个作为，每一个思想——都引向上帝父，都引向至圣三位一体，作为真理、生命、公义、爱、智慧……的万有源头。
    - type: paragraph
      text:
        ru: '«Кад бисте Мене знали и Оца Мојега бисте знали; и од сада познајете Га, и видјели сте Га. Рече Му Филип: Господе, покажи нам Оца, и биће нам доста.» (Ин.14:7–8)'
        cn: 你们若认识我，也就认识我的父了；从今以后，你们也认识祂，并且已经看见祂了。腓力对祂说：「主啊，将父显给我们看，我们就知足了。」 (约翰福音 14:7-8)
    - type: paragraph
      text:
        ru: 'На Тајној Вечери Спас потпуно открива тајну Свога Божанства, и у исто време тајну Пресвете Тројице: «Кад бисте мене знали, онда бисте знали и Оца Мога; и отсада познајете га – ( = знате га), и видесте га». Сином се познаје Отац; христопознање је у исто време и најсавршеније богопознање. Богопознање засновано на реалном боговиђењу. То збуњује апостола Филипа и он изражава исконску жељу људскога духа: «Господе, покажи нам Оца, и биће нам доста».'
        cn: 在最后的晚餐上，救主全然揭示了祂神性的奥秘，同时也是至圣三一的奥秘：「你们若认识我，也就认识我的父了；从今以后，你们认识他（ = 知道他），并且已经看见他了。」 借着子才能认识父；基督认识同时也是最全备的神认识。这种神认识建立在真实的看见神之上。这让使徒腓力感到困惑，他表达了人类灵性的本原渴望：「主啊，将父显给我们看，我们就知足了。」
    - type: paragraph
      text:
        ru: '«Исус му рече: Толико сам времена с вама и ниси Ме познао, Филипе? Ко је видио Мене, видио је Оца; па како ти говориш: Покажи нам Оца? Зар не вјерујеш да сам Ја у Оцу и Отац у Мени? Ријечи које вам Ја говорим не говорим од самога Себе, него Отац који пребива у Мени Он твори дјела.» (Ин.14:9–10)'
        cn: 耶稣对他说：「我与你们同在这么久了，你还不认识我吗，腓力？凡看见我的，就是看见了父；你怎么说：把父显给我们看呢？你不相信我在父里面，父在我里面吗？我对你们所说的话，不是凭着自己说的，而是住在我里面的父，祂作自己的工。」 (约翰福音 14:9-10)
    - type: paragraph
      text:
        ru: 'А «Исус му рече: толико сам време с вама и ниси ме познао. Филипе? Који виде Мене, виде Оца; па како говориш: покажи нам Оца? Зар не верујеш да сам ја у Оцу и Отац у мени?» Видети Исуса Богочовека, то је видети – истинитаг Бага, Сина Божјег, и у Њему Самога Оца. Исус је «обличје Бога невидљивога», видљиво обличје неивдљивога Бога. Уколико Невидљиви Бог може постати видљив за људске очи, Он је то постао у оваплоћеном Богу Логооу, Господу нашем Исусу Христу. Зато Господ Исус и одлучно тврди: «Који виде Мене, виде Оца». А не види ли чоеек Бога у Христу, значи стоји нечистота некаква у његовом срцу која му не да да види Бога ни у оваплоћеном Богу, јер само чисти срцем виде Бога. Али ако човек непристрасно и озбиљно загледа у Христа, у дела Његова, у речи његове, мора на крају угледати у Њаму Бога живог и истинитог. Јер она дела, зар може чинити човек ако није у исто време и Бог? И оне речи еванђелске говорити, и онако говорити «како никада човек није говорио», зар може човек који није у исто време и Бог? Зато Спас и указује на речи своје и на дела Своја: «Речи које еам ја говорим не говорим од себе; него Отац који обитава у Мени, Он твори дела». Једна је творачка и стваралачка сила у сва Три Лица Свете Тројице:'
        cn: 阿，「耶稣对他说：我与你们同在这样长久，你还不认识我吗，腓力？人看见了我，就是看见了父；你怎能说：将父显给我们看呢？难道你不相信我是在父里面，父是在我里面吗？」看见耶稣这位神人，就是看见了——真实的上帝，上帝的儿子，并在他里面看见了圣父。耶稣是「不可见之上帝的形像」，是那不可见之上帝的可见形像。就不可见之上帝能够为人类的肉眼所见而言，他已在那道成肉身、即我们的主耶稣基督的神道（Logos）里面成为了可见的。因此，主耶稣也断然肯定：「看见我的人，就是看见了父。」然而，如果人未能在基督里看见上帝，这就意味着他心中存有某种不洁，阻止他即使在那道成肉身之神里面也无法看见上帝，因为只有心地纯洁的人才能看见上帝。但是，如果一个人公正而认真地凝视基督，凝视他的作为，凝视他的言语，最终他必将在他里面看见活而真实的上帝。因为那些作为，若非同时也是上帝，人怎能行出来呢？并且，那些福音的言语，以及「从未有人像他那样说话」的言语，若非同时也是上帝，人怎能说出来呢？因此，救主也指出他自己的言语和他的作为：「我所说的这些话，不是凭着自己说的；而是住在我里面的父，他做这些事。」在圣三位的一体中，创造和造化之力是同一的：
    - type: paragraph
      text:
        ru: једна сила, једна воља, јер једна природа, једно биће, једна суштина. Зато је логично веровати да је Отац у Сину и Син у Оцу, ни један више у другоме ни други мање, већ подједнако присутни један у другоме истоветношћу Божанства, природе, суштине.
        cn: 一个能力，一个意志，因为一个本性，一个存有，一个本体。因此，相信圣父在圣子之内，圣子在圣父之内是合乎逻辑的，没有一个在另一个之中更多，也没有另一个更少，而是凭借着神性、本性、本体的同一性，彼此同等程度地临在。
    - type: paragraph
      text:
        ru: «Вјерујте Ми да сам Ја у Оцу и Отац у Мени; ако ли не, због самих дјела вјерујте Ми.» (Ин.14:11)
        cn: 你们当信我，我在父里面，父在我里面；即或不信，也当因我所做的事信我。(约翰福音 14:11)
    - type: paragraph
      text:
        ru: 'Зато Спас благовести: «Верујте мени да сам Ја у Оцу и Отац у Мени» Али ако би некоме сметало тело Исусово, – тело људско које је од свих људи толико осрамоћено кроз историју, толико огреховљено и осмрћено, да у Исусу не види, и неће да види, не признаје и неће да признаје – Бога, онда, ено дела Исусових. Зар су то чисто људска, и само људска дела? Лазарево васкрсење, васкрсење Јаирове кћери, васкрсење сина Наинске удовице, па изгоњење ђавола, па исцељивање од свих болести, па преображење, – зар све то нису дела Божја, дела која сам Бог чини из тела људског и помоћу тела људског? Зато Спас и вели: «Ако ли Мени не верујете, верујте Ми због самих тих дела.»'
        cn: 因此，救主宣告说：「你们当信我，我在父里面，父在我里面。」 (约翰福音 14:11) 但若有人因耶稣的身体而感到困扰——这人类的身体，在历史上被全人类如此羞辱，如此被罪玷污，被死亡侵蚀——以至于他看不到，也不愿看到，不承认，也不愿承认在耶稣里有神，那么，且看耶稣的作为吧。难道那是纯粹是人性的，且仅仅是人性的作为吗？拉撒路的复活，睚鲁女儿的复活，拿因寡妇儿子的复活，还有驱逐魔鬼，还有医治所有的疾病，还有变容——难道这一切不是神的作为吗？不是神亲自借着属人的身体并借助属人的身体所行的作为吗？因此，救主也说：「你们若不信我，也要因这些作为本身而信我。」 (约翰福音 14:11)
    - type: paragraph
      text:
        ru: '«Заиста, заиста вам кажем: Ко вјерује у Мене, дјела која Ја творим и он ће творити, и већа од ових ће творити; јер Ја идем Оцу Своме. И што год заиштете (од Оца) у Име Моје, то ћу учинити, да се прослави Отац у Сину. И ако шта заиштете у Име Моје, Ја ћу учинити.» (Ин.14:12–14)'
        cn: 「我实实在在地告诉你们：信我的人，我所做的事他也要做，并且要做比这更大的事；因为我往我的父那里去。你们奉我的名无论求什么（向父），我必成就，叫父因子得荣耀。你们若奉我的名求什么，我必成就。」 (约翰福音 14:12-14)
    - type: paragraph
      text:
        ru: 'Да ли су то божанска или људска дела, може сваки човек проверити. Проверити делима оних који су силом Христавом чинили таква иста дела. А то су дела светих Апостола и Мученика, и осталих Светитеља све до данас, и од данас до Страшнога суда. Сва дела они су чинили и чине само вером у Христа као Бога и Господа, који им због те вере и кроз ту веру даје божанске силе, те они, иако људи, чине еванђелска дела, еванђелока чудеса. Зато Спас и благовести: «Заиста, заиста вам кажем: који верује у Мене, дела која Ја творити и он ће творити, и већа ће од ових творити, јер ја идем к Оцу своме».'
        cn: 这些是神圣的还是属人的作为，每个人都可以验证。通过那些靠着基督的能力行了同样作为的人的作为来验证。这些作为是圣使徒和殉道者，以及其他圣人直到今日，从今日直到可怕的审判（日）所行的。他们过去和现在所行的一切作为，都唯独是藉着对基督是神和主的信心，是祂因为这信心并藉着这信心赐予他们神圣的力量，使他们，虽然是人，却能行福音的作为，福音的奇迹。所以救主也宣报说：「我实实在在地告诉你们，信我的人，我所作的作为，他也要作，而且要作更大的，因为我往父那里去。」（约翰福音 14:12）
    - type: paragraph
      text:
        ru: 'Значи: вера усељује васцелога Богочовека у душу верујућег, усељује кроз свете врлине све божанске силе Његове у срце верујућег, што га и оспособљава да чини дела христовска. А и већа од ових.'
        cn: 所以：信心使完完整整的神人进驻信者的灵魂，藉着圣洁的美德，使祂一切的神圣力量进驻信者的内心，这也使他有能力行出基督般的作为，甚至比这些更大的。
    - type: paragraph
      text:
        ru: 'Веће је од њих ово: сенка апостола Петра исцељује болеснике. Све то омогућио је Богочовек што је тело људско прославио, узнео га Оцу и посадио с десне стране Оца, те као човек заузима се за људе, и Отац им Небески даје ради Сина свог да могу чинити дела Његова, и већа од њих. Зато Спас и објављује чудесну по човекољубљу благовест: «И што год заиштете у Оца у Име Моје, оно ћу вам учинити, да се прослави Отац у Сину»«. Али да се не би помислило да је Син мањи од Оца, Спаситељ као да објашњава и допуњује претходну благовест: «И ако што заиштете у Име Моје, Ја ћу учинити».'
        cn: 比这些更大的，就是：使徒彼得的影子医治病人。所有这一切都是由道成肉身的神人促成的，祂荣耀了人的身体，将它升到父那里，并使它坐在父的右边，因此祂作为人为人代求，而天父为了祂的圣子，赐予他们能力，使他们能行祂的作为，甚至比这些更大的。因此，救主也宣告了这奇妙的、彰显其爱人如己的福音：「你们奉我的名无论求什么，我必成就，叫父在子身上得荣耀。」但为免有人认为圣子小于圣父，救主仿佛解释并补充了先前的福音：「你们若奉我的名求什么，我必成就。」
    - type: paragraph
      text:
        ru: «Ако Ме љубите, заповести Моје држите.» (Ин.14:15)
        cn: «如果你爱我，就遵守我的诫命。» (约翰福音 14:15)
    - type: paragraph
      text:
        ru: 'Послушност је пут којим стално путује љубећи ка љубљеном. Нарочито када је предмет љубави Сладчајши Господ Исус. Јер је циљ богочовечанске љубави: да се љубећи изједначи са љубљеним; да се сједини са љубљеним; да се оваплоти у љубљеном, и тако вечно живи са њим и у њему. Образац вечни и најсавршенији те љубави имамо у Богочовеку: Он је толико заволео човека: да се оваплотио занавек у њега. То саоваплоћавање у љубљеном, то оваплоћавање у љубљеном бива практиковањем еванђелских врлина, држањем «запо Вести» Христових.'
        cn: 顺服是爱者持续不断地走向被爱者的道路。尤其当爱的对象是至甜之主耶稣时。因为神人之爱的目标是：使爱者与被爱者平等；与被爱者合一；在被爱者内得以化身，并如此与祂、在祂里面永生。这种爱的永恒且最完美的典范，我们可以在神人（基督）身上拥有：祂如此爱人，以至于祂永远在人里面道成肉身。这种在被爱者内共同化身，这种在被爱者内得以化身，是通过实践福音美德，遵守基督的「福音诫命」来实现的。
    - type: paragraph
      text:
        ru: 'Свака пак реч Његова у Еванђељу и јесте заповест Његова. А речи Његове «дух су и живот су», и дају божанске силе ономе ко их држи у срцу, те их остварује и у животу. Свака од Христових заповести има мало од Христа у себи; и када је човек држи, он оваплоћује у себи Све то Христово. И све тако: «док обличје Христово не постане у нама». Лако је проверити себе, и друтога, да ли љуби Христа. Провера је божански непогрешиво дата у овим Спасовим речима: «Ако имате љубав к Мени – ( = ако Ме љубите), заповести Моје држите». По држању заповести Христавих познаје се христољубље човеково.'
        cn: 祂在福音中的每一句话，就是祂的诫命。而祂的话语「是灵，是生命」，并赋予那些将它们铭记于心、并在生活中实行出来的人以神圣的力量。基督的每一条诫命，都自身带有基督的一部分；当一个人遵守它们时，他就在自身中 вопло了这一切属于基督的。并且一直如此：「直到基督的形像成形在我们心里。」检验自己和他人是否爱基督是很容易的。检验被神圣地、无误地给出在这些救主的话语中：「你们若爱我——（=你们若爱我），就必遵守我的诫命。」借着遵守基督的诫命，便可知晓一个人的爱基督之心。
    - type: paragraph
      text:
        ru: «И Ја ћу умолити Оца, и даће вам другог Утјешитеља да пребива с вама вавијек.» (Ин.14:16)
        cn: 「我要求父，父就另外赐给你们一位保惠师，叫他永远与你们同在。」 (约翰福音 14:16)
    - type: paragraph
      text:
        ru: 'Разуме се, држати заповести Христове је труд и напор, и то непрекидан труд и напор, али увек радостан напор, радостан труд. Јер у свима напорима Сладчајши даје трудбенику љубави Утешитеља Светог: Он све муке претвара у радост; Он даје благодатне силе трудбенику, те држање заповести постаје лак и радостан подвиг. И тада се осети сва истинитост ове речи апостола љубави: «Ово је љубав Божја: да заповести Његове држимо; а заповести Његове нису тешке» (1Ин.5:3).'
        cn: 当然，遵守基督的诫命是努力和辛劳，而且是持续不断的努力和辛劳，但总是喜乐的辛劳，喜乐的努力。因为在一切的辛劳中，至甘甜者将圣安慰者赐给那以爱劳苦的人：他将一切的痛苦转化为喜乐；他赐给那劳苦者恩典的力量，使得遵守诫命成为一项轻松喜乐的属灵功绩。那时，便感受到了爱之使徒这番话的全部真理：「这是神的爱：就是要我们遵守他的诫命；他的诫命并不是难守的。」（约翰一书 5:3）
    - type: paragraph
      text:
        ru: 'Љубав је највећа стваралачка сила: боговаплотитељска, боготворна, теургична. А када оваплоти у човеку Христа Бога, онда Он сам твори у њему Своје заповести. Јер Он кроз Утешитеља Саветот борави «вавек» у следбеницима својим. Тако живот хришћанинов је један нњпрекидан блатодатни подвиг охристовљења, одуховљења, отројичења држањем заповести еванђелских. Држањем заповести Богочовекових човек низводи у душу своју не само благодат Светога Духа, него и самог Светог Духа. Отуда је прави хришћанин увек духоносац и христоносац. То је тестамент Спасов: «да држе све што сам вам заповедио; и ево ја сам с вама у све дане до свршетка века». (Мф.28:20). Да, и христоносац и духоносац је хришћанин.'
        cn: 爱是最大的创造力：使神性道成肉身、使人成神、行神迹大能的。当神基督在人里面道成肉身时，祂自己就在他里面实践自己的诫命。因为祂借着保惠师圣灵，「直到永远」地居住在祂的跟随者里面。因此，基督徒的生命是一个不间断的恩典的属灵操练，借着持守福音的诫命来达致基督化、属灵化、三一化。借着持守神-人的诫命，人引下到自己的灵魂里的，不仅是圣灵的恩典，而且是圣灵自己。因此，真正的基督徒总是圣灵的承载者和基督的承载者。这是救主的遗命：「教训他们遵守我所吩咐你们的一切；我就常与你们同在，直到世界的末了。」 (马太福音 28:20)。是的，基督的承载者和圣灵的承载者，就是基督徒。
    - type: paragraph
      text:
        ru: «Духа Истине, кога свијет не може примити, јер га не види, нити га познаје; а ви Га познајете, јер са вама пребива, и у вама ће бити.» (Ин.14:17)
        cn: «就是真理的灵，世人不能领受他，因为看不见他，也不认识他；你们却认识他，因为他常与你们同在，也要在你们里面。» (约翰福音 14:17)
    - type: paragraph
      text:
        ru: Ко је Утешитељ? Дух истине. Богочовек је Истина, пут који кроз Истину води Духу Истине. Богочовек је Божанска Истина, која се оваплотила, и постала конкретно остварена, и видљива, у човечанском свету. Али та видљива, и остварена, у нашем човечанском свету Божанска Истина, води тој истој Истини која је и у Духу Светом сва, ваоцела, да га Спас назива «Духом Истине.»
        cn: 谁是保惠师？是真理的灵。神人是真理，是借着真理通往真理之灵的道路。神人是道成肉身的神圣真理，在人类世界中具体地得以实现并显现。但是，那在我们人类世界中可见并得以实现的神圣真理，引向那全然存在于圣灵之中的同一真理，以至于救主称祂为「真理的灵。」
    - type: paragraph
      text:
        ru: 'И Дух Свети је сав Истина, зато што је сав Бог. Држањем заповести Христових човек прима у себе Духа Истине, који божанску Истину разлива по целом бићу његовом. Ко прими Христа као видљивог Бога и Господа, удостојава се те због тога прима и невидљивог Бога – Духа Истине, «кога свет не може примити, јер га не види нити ш познаје». Он постаје видљив и познат само онима који заповести Богочовекове држе: «а ви га познајете, јер у вама борави, и у вама ће бити». И заиста је Дух Свети сав у Цркви од дана Свете Педеоетнице. Он је од тада испунио богочовечанско тело Цркве, и није друго у њој до душа њена.'
        cn: 圣灵全然是真理，因为祂全然是神。借着遵行基督的诫命，人就领受了真理的灵，祂将神圣的真理倾注在他整个生命之中。凡是领受基督作为可见的神和主的，就蒙恩配得因此领受那不可见的神——真理的灵，「世人不能接受祂，因为看不见祂，也不认识祂」。祂变得可见并为人所知，唯独对那些遵行神人诫命的人：「你们却认识祂，因为祂与你们同住，也要在你们里面」。而且确实，自圣灵降临节之日（五旬节）起，圣灵就全然在教会中。祂自那时起就充满了教会的神人一体之身体，并且祂在其中，不是别的，正是教会的灵魂。
    - type: paragraph
      text:
        ru: 'Да, Дух Свети је душа Цркве. Што је душа у телу, то је Дух Свети у Цркви. Црква је Њиме Црква; Њиме живи стално, Њиме се оживотворава. Зато се Дух Свети и назива по преимућству: Господ животворни («Господа животворјашчаго; усто – Пресвет и благ (безброј возгласа: «са пресветим, и благим, и животворним твојим Духом»).'
        cn: 是的，圣灵是教会的灵魂。灵魂在身体里怎样，圣灵在教会里也怎样。教会是藉着祂才成为教会的；藉着祂，教会得以持续地生活，藉着祂，教会得以被赋予生命。因此，圣灵也被首要地称为：赐生命的主（「主、赐生命的」）；此外，祂也被称为至圣和良善的（无数次地呼求：「与你至圣、良善、并赐生命的圣灵」）。
    - type: paragraph
      text:
        ru: 'Дух Свети се познаје и даје Христом. Богочовек Христос уводи у васцело Тројично Божанстшо. Познавање Њега у исто време је познавање Свете Тројице. Усели ли се Он вером у човека, са Њим се усељује и Дух Свети, и Бог Отац. Дух Свети се познаје по присуству Истине Божје у човеку; а присуство се те Истине пројављује у држању заповести Христових. Све је ту засновано на личном искуству и доживљавању. Зато Спас и вели својим ученицима: «ви га познајете, јер у вама борави» када свете врлине, кроз света расположења која и творе заповести Божје.'
        cn: 圣灵借着基督被认识并被赐予。神人基督将人引入全然的三一神性。认识祂的同时就是认识圣三一。倘若祂借着信心内住于人，圣灵和父神也必与祂一同内住。圣灵借着上帝真理在人里面的存在而被认识；而这真理的存在则显明于对基督诫命的遵守。这一切都建立在个人经验和亲身体验之上。因此，救主对祂的门徒说：「你们认识祂，因为祂住在你们里面」，这便是在圣洁的德行中，借着那些也履行上帝诫命的圣洁性情得以实现。
    - type: paragraph
      text:
        ru: «Нећу вас оставити сиротне; доћи ћу к вама. Још мало и свијет Ме више неће видјети, а ви ћете Ме видјети, јер Ја живим и ви ћете живети.» (Ин.14:18–19)
        cn: 「我必不撇下你们为孤儿；我必到你们这里来。还有不多的时候，世人就不再看见我，你们却要看见我，因为我活着，你们也要活着。」(约翰福音 14:18-19)
    - type: paragraph
      text:
        ru: 'Шта је то што сачињава истинско богатство света? Несумњиво Богочовек Христос, који је сво небо скинуо на земљу, сву Истину Божју, и Правду Божју, и Љубав Божју, и Вечност Божју, једном речју: самога Бога. То су осетили најпре апостоли Христови. И то већ изразили једном: «Господе, коме ћемо ићи? Ти имаш речи вечнога живота» (Ин.6:68). Уствари, сиромах је у овом свету једино човек који или не зна за Христа, или не верује у Њега, или Га не признаје за Бога и Спаситеља; а пуки је сиромах који хули на Њега. Без Њега – страшно и пагубно сиромаштво пустоши свет: душе безбројне умиру од глади и жеђи за Истином Божјом, и Правдом = за Богом; умиру од голотиње и босотиње од зиме греха и циче порока. Од тога спасава само присуство Богочовека Христа, који Своја божанска богатства дарежљиво раздаје људима, те их спасава од греха, порока и смрти. Стога Спас и теши Своје ученике због свог привременог одласка – до васкрсења Свог. Јер ће за време Своје смрти, све до васкрсења, бити отсутан од њих: «Нећу вас оставити сиротне: доћи ћу к вама. Још мало и свет ме више нећете видети; а ви ћете ме видети; јер ја живим, и ви ћете живети». «Доћи ћу к вама» чим победим смрт васкрсењем. Од тада постаћу невидљив за свет који у злу лежи, и он ме «више неће видети». «А ви ћете ме видети» у васкрслом телу; и то видети освећеним и просвећеним очима од Духа Светог. «Јер ја живим, и ви ћете живети»: живети истим животом, истом бесмртношћу, истом истином. И стога и видети Мене који вечно живим. Један исти живот је и у Мени и у вама; отуда смрт неће имати власти над вама. Уствари, један је живот, и извор живота: Света Тројица.'
        cn: '构成世间真正财富的是什么？毫无疑问，就是神人基督，祂将整个天国降临于地，将上帝的真理、上帝的公义、上帝的爱以及上帝的永恒，一言以蔽之：就是上帝本身，带到了地上。基督的使徒们首先感受到了这一点。他们也曾这样表达过：「主啊，我们还要归从谁呢？祢有永生之道。」（约翰福音 6:68）事实上，世上唯一的贫穷人，是那些不认识基督、或不相信祂、或不承认祂为上帝和救主的人；而那些亵渎祂的人，则是彻头彻尾的贫穷人。没有祂——可怕而毁灭性的贫穷荒芜了世界：无数灵魂因饥渴于上帝的真理与公义，即饥渴于上帝本身而死去；他们因罪恶的寒冬和邪恶的刺骨寒冷，死于赤身露体和赤脚。唯有神人基督的临在能将他们从这境况中拯救出来，祂将自己的神圣财富慷慨地赐予世人，从而将他们从罪、邪恶和死亡中拯救出来。


          因此，救主安慰祂的门徒，因祂将暂时离去——直到祂的复活。因为在祂的死期间，直到复活，祂将不在他们身边：「我必不撇下你们为孤儿：我必回到你们这里。还有不多的时候，世人不再看见我；你们却要看见我，因为我活着，你们也要活着。」「我必回到你们这里」，一旦我以复活战胜死亡。从那时起，我将对那卧在恶中的世界而言是不可见的，而它「将不再看见我」。 「你们却要看见我」，是在复活的身体里；而且是借着圣灵，以被圣化和被光照的眼睛看见我。「因为我活着，你们也要活着」：活出同样的生命、同样的不朽、同样的真理。因此也能看见永活的我。在我里面和在你们里面是同一个生命；因此死亡将不会对你们有权柄。事实上，生命只有一个，并且这生命的源泉就是：圣三一。'
    - type: paragraph
      text:
        ru: «У онај дан знаћете ви да сам Ја у Оцу Своме, и ви у Мени, и Ја у вама.» (Ин.14:20)
        cn: «到那日，你们就知道我在父里面，你们在我里面，我也在你们里面。» （约翰福音 14:20）
    - type: paragraph
      text:
        ru: 'Васкрсење Христово то је показало, јер је обелоданило да само живећи тим животом човек може победити смрт и ући у живот вечни. Зато Спас и благовести: «У онај ћете ви дан дознати да сам Ја у Оцу свом, и ви у Мени, и Ја у вама». Преко Сина Божјег апостоли су у Оцу, као што је и Отац преко Сина Свг у њима. Они су у Сину Духом Истине.'
        cn: 基督的复活表明了这一点，因为它揭示了唯有活出那样的生命，人才能战胜死亡并进入永生。因此救主也宣告：「在那一天你们会明白我在我的父里面，你们在我里面，我在你们里面。」借着上帝的儿子，使徒们在父里面，正如父也借着祂的儿子在他们里面。他们靠着真理的圣灵在子里面。
    - type: paragraph
      text:
        ru: 'Истинујући, човек сву душу своју пресељује у Христа. А то чини када држи заповести Његове. А држи их из љубави. Тако: љубав оваплоћује Христа у ученицима, и ученици се љубављу саоваплоћују Христу. При томе личности се нимало не губе: «ви у Мени, и Ја у вама»: ви остајете ви, само обожени; Ја остајем ја, само очовечен.'
        cn: 当人践行真理时，他便将他全部的灵魂迁入基督。他这样做，乃是当他遵守祂的诫命时。而他遵守它们，是出于爱。如此：爱使基督在门徒身上道成肉身，而门徒则因着爱与基督共道成肉身。在此过程中，个体性丝毫没有失落：「你们在我里面，我也在你们里面」：你们还是你们，只是被神化了；我还是我，只是道成肉身了。
    - type: paragraph
      text:
        ru: «Ко има заповијести Моје и држи их, то је онај који Ме љуби; а који Мене љуби, тога ће љубити Отац Мој; и Ја ћу га љубити и јавићу му се сам.» (Ин.14:21)
        cn: 「那领受我的诫命并遵守的人，才是爱我的人；爱我的人，我父必爱他，我也要爱他，并且亲自向他显现。」 (约翰福音 14:21)
    - type: paragraph
      text:
        ru: 'Што више држи заповести Христове, човек све више воли Господа Христа, јер држањем заповести опитом саанаје и открива његове свете тајне и свете силе. Еванђелско правило: Ко заповести Христове твори, тај једино Христа и воли. За такво христољубље, Господ награђује изузетном наградом: лично се јавља сам христољупцу: «и Ја ћу имати љубав к њему, и јавићу му се сам». То је најмилије богојављење. Христољубље практично низводи самог Господа Христа у душу христољупчеву. На човеково христољубље Господ одгавара својом бажанском свељвубављу. За искрено христољубље даје се савршено божанско човекољубље. Да, јер њега има само Једини Човекољубац. Љубав је боговидац, Христотвидац. Без ње, човек остаје слеп, те не види Бога у Христу. А не види ли Бога у Њему, не може Га видети ни у ком другом бићу или твари, јер је у свему другом Бог присутан на начин бескрајно мање очигледан и видљив. «Јавићу му се сам»: и јављао се многобројним Светитељима и Праведницима.'
        cn: 人越是持守基督的诫命，就越发爱主基督，因为借着持守诫命，他凭经验领悟并发现祂的神圣奥秘和神圣能力。福音规条：凡遵行基督诫命的，唯独他爱基督。对于这样的爱基督之心，主以非凡的赏赐回报：祂亲自向爱基督者显现：「我必爱他，我也必亲自向他显现。」这是最可爱的显圣。爱基督之心实际上将主基督亲自带入爱基督者的灵魂。对于人的爱基督之心，主以祂神圣的全爱来回应。为了真诚的爱基督之心，赐予完全的神圣仁慈。是的，因为唯有那位独一的爱人者拥有它。爱是见神者，是见基督者。没有爱，人就仍然是瞎眼的，因此无法在基督里看见神。若他无法在基督里看见神，也无法在任何其他受造物或被造之物中看见祂，因为在所有其他事物中，神的同在都以一种无限不那么明显和可见的方式呈现。「我必亲自向他显现」：祂也曾向无数的圣者和义人显现。
    - type: paragraph
      text:
        ru: '«Рече Му Јуда, не Искариотски: Господе, шта је то да ћеш се јавити нама, а не свијету? Одговори му Исус и рече: Ако Ме неко љуби, ријеч Моју држаће, и Отац Мој љубиће њега; и њему ћемо доћи и у њему ћемо се настанити.» (Ин.14:22–23)'
        cn: 那不是加略人犹大的犹大对他说：「主啊，这是怎么回事，你要向我们显现，却不向世人显现呢？」耶稣回答他说：「人若爱我，就必遵守我的道；我父也必爱他，并且我们要到他那里去，与他同住。」 (约翰福音 14:22-23)
    - type: paragraph
      text:
        ru: 'Човекољубиви Господ никад никоме не намеће Себе и своје Еванђеље. Не намеће спасење. Јер хоће да човек сам добровољно и с љубављу учествује у ономе што је Божје, бесмртно, вечно. А љубав је израз, најпотпунији свеизраз слободе. Само у подвигу љубави човек стварно доживљује своју боголику слободу. Нарочито у подвигу љубави према Христу Богу. Јер је та љубав извор и животодавац сваке непролазне, бесмртне љубави. Љубав је најјача богочежњива и богоцентрична сила у човеку и у свету. Она свега човека вуче Богу, преноси у Бога, сједињује са Богом. А као одговор на тај изузетни иодвиг богољубља, Тројично Божанство одговара својом свељубављу: васцело се усељује у богољупца, и обитава у њаму: «к њему ћемо доћи, и у њега ћемо се стинити».'
        cn: 慈爱的主从不将祂自己和祂的福音强加于任何人。祂不强加救赎。因为祂愿人自己甘愿并以爱参与到那属乎神的、不朽的、永恒的事物中。而爱，是自由的表达，是最完全的全面表达。唯独在爱的灵性操练中，人才能真实体验其神肖的自由。尤其是在对基督神的爱的灵性操练中。因为那爱是不朽的、不死的爱的源泉和生命赋予者。爱是人与世上最强烈的切慕神和以神为中心的力量。它将整个人牵引到神那里，移入神中，与神联合。而作为对这份卓越的爱神的灵性操练的回应，三一神性以其全然的爱回应：完全居住在爱神者里面，并居于他中：「我们要到他那里去，与他同住。」
    - type: paragraph
      text:
        ru: 'Хоћеш да постанеш стан Свете Тројице? Ево начина: држи Христове заповести. Многи је Светитељ тако постао «тајник Свјатија Троици», и «жилиште Свјатија Троици». Значи: држањем Христових заповести човек се утројичује и отројичује: постиже иајвећи и најузвишенији циљ живота. У њему све бива од Оца, кроз Сина у Духу Светом. Ради тога је Бог Логос и дошао у наш свет, и постао човек, и извршио богочовечаноки подвиг спасења, да би људима открио тај циљ и дао им ова средства за остварење тог циља. Човек је и био саздан да би светим, безгрешним животом, постао вечно обиталиигге Пресвете Тројице. А то је циљ и спасења, извршеиог Богочовеком. Спасавајући се богочовечанским средствима од греха, смрти и ђавогаа, човек се постепено утројичује и отројичује, док најзад не постане вечно обиталиште Свете Тројице, и онда он сав живи у Оцу и Сину и Светоме Духу.'
        cn: 你想成为圣三一的居所吗？这就是方法：遵守基督的诫命。许多圣人就是这样成为了「圣三一奥秘的受托者」，以及「圣三一的居所」。这意味着：借着遵守基督的诫命，人被圣三一内住，并借此得以三一化；从而达到生命中最大和最崇高的目标。在他里面，一切都源于父，借着子，在圣灵里实现。因此，神道（Logos）也降临到我们的世界，并成为人，成就了神人合一的救赎功业，为要向世人启示那个目标，并赐予他们实现那个目标的这些途径。人类也曾被造，好借着圣洁无罪的生活，成为至圣三一永恒的居所。而那也是由神人所成就的救赎的目标。借着神人合一的途径，人得救脱离罪、死亡和魔鬼，从而逐渐地被圣三一内住并圣三一化，直到最终他成为圣三一永恒的居所，届时他便完全活在父、子和圣灵之中。
    - type: paragraph
      text:
        ru: «Ко Мене не љуби, ријечи Моје не држи; а ријеч коју чујете није Моја него Оца који Ме је послао. Ово сам вам говорио док сам боравио с вама.» (Ин.14:24–25)
        cn: 「不爱我的人，不遵守我的话；你们所听见的话不是我的，而是差我来的父的。我与你们同住的时候，已把这些事告诉了你们。」（约翰福音 14:24-25）
    - type: paragraph
      text:
        ru: Ко не љуби Христа, не држи речи Његове. Јер христољубље је извор стваралачких еванђелкжих сила. Лаж је очигледна да индиферентан пре ма Личности Христовој човек може испуњавати еванђелске заповести и држати начела еванђелског морала. Поготову то не може чинити христоборац и христомрзац.
        cn: 谁不爱基督，就不遵守祂的话语。因为爱基督之心是创造性的福音力量的源泉。这是一个显而易见的谎言，即一个对基督的位格漠不关心的人，能够履行福音的诫命并遵守福音道德的原则。尤其，抵挡基督者和憎恨基督者更不能做到这一点。
    - type: paragraph
      text:
        ru: 'Осећање љубави је оно што потстиче човека и даје му силе и истрајиости да држи речи Христове. Сваки чисто хуманистички и хоминистички извор је сувише плитак да би могао давати човеку потстрека и силе за вршење узвишених еванћелских заповести. Заиста ту важи она Спасова реч: «Без мене не можете чинити ништа» (Ин.15:5); и она апостолова: «Све могу у Христу Иоусу каји ми моћ даје» (Флп.4:13).'
        cn: 爱的情感是那激励人，并赐予人力量和坚韧去遵守基督话语的。任何纯粹的人本主义和人类中心主义的来源都过于肤浅，无法给人以激励和力量去遵行崇高的福音诫命。诚然，救主的话语在此适用：「离了我，你们就不能做什么」（约翰福音 15:5）；以及使徒的这话语：「我靠着那加给我力量的基督耶稣，凡事都能做」（腓立比书 4:13）。
    - type: paragraph
      text:
        ru: «А Утјешитељ Дух Свети, кога ће Отац послати у Име Моје, Он ће вас научити свему и подсјетиће вас на све што вам рекох.» (Ин.14:26)
        cn: «但保惠师，就是父将因我的名差遣而来的圣灵，他要将一切事指教你们，并且要叫你们想起我对你们所说的一切话。» (约翰福音 14:26)
    - type: paragraph
      text:
        ru: 'Заиста све што је Христово, човек може остваривати једино ако га у томе потпомаже својим божанским силама Тројично Божанство. Човек сам по себи није у стању ни да научи науку Христову, нити да је оствари. За њу – богочовечанску, човеку су потребне богочовечанске силе; а пре свега: сам Дух Свети – Утешитељ, и Учитељ. Јер само Дух Свети у потпуности зна све учење Боточовеково, и Он га једини и може саопштити духу човековом, сједињујући се са њим духовно помоћу благодати. И потсетити на све што је Богочовек рекао и учио.'
        cn: 确实，凡属基督的一切，人唯有在三一神性以其神圣力量扶助他时，才能实现。人单凭自己，既不能学习基督的教导，也无法实现它。对于这神人合一的教导，人需要神人合一的力量；而首先是：圣灵自己——保惠师，和教师。因为唯有圣灵完全晓得神人的一切教导，并且唯有祂能将其传达给人的灵，借着恩典与他灵里合一。并提醒神人所说和所教导的一切。
    - type: paragraph
      text:
        ru: 'Зато су и Свете Књиге написане по надахнућу Духа Светога. Човек је при томе добровољно и свесно оруће, и радосни сарадник. Тако, Еванђеље Христово је колико Христово, толико и Духа Светога, толико и васцеле Пресвете Тројице. Стога Спас и не престаје понављати како реч што нују од њега није његова него Оца који га је послао (Ин.14:24), и дела која виде ои њега нису његова него Оца који борави у Њему и «Он твори дела» (Ин.14:10). Тако, вера еванђелска није само вера у Христа, већ истовремено вара у Оца и у Духа Светог, тј. у Тројично Божанство. Трагичан је, у свима световима трагичан, човек који мисли да верује у Христа, ако не верује у Пресвету Тројицу. Зато је Сладчајши изговорио и ову благовест: «А Утешитељ Дух Свети, кога ће Отац послати у име моје, Он ће вас научити свему – и потсетити вас на све што вам рекох.»'
        cn: 因此，圣书也是藉着圣灵的默示写成的。在此过程中，人是自愿且自觉的工具，并且是欣然的合作者。如此，基督的福音既是基督的，也是圣灵的，更是整个至圣三位一体的。因此，救主也不断重复说，他所听见的道不是他自己的，而是差他来的父的（约翰福音 14:24），他所见的工也不是他自己的，而是住在他里面的父的，「是祂在行事」（约翰福音 14:10）。这样，福音的信仰不仅是信靠基督，而且同时相信父和圣灵，也就是说，相信三位一体的神性。认为自己相信基督，却不相信至圣三位一体的人，是悲剧性的，在所有世界中都是悲剧性的。因此，至甘者也宣告了这佳音：「但保惠师，就是父因我的名所要差来的圣灵，祂要将一切的事指教你们，并且要叫你们想起我对你们所说的一切话。」
    - type: paragraph
      text:
        ru: Зашто баш Дух Свети? Зато што «Дух све испитује, и дубине Божје» (1Кор.2:10); јер «нама је Бог открио Духом својим» све оно «што око не виде, и ухо не чу, и у срце човеку не дође», то «уготови Бог онима који га љубе» (1Кор.2:9).
        cn: 为什么恰恰是圣灵呢？因为「圣灵参透万事，就是神深奥的道理」（哥林多前书 2:10）；因为「神已藉着自己的灵向我们启示了」所有那些「眼睛未曾看见，耳朵未曾听见，人心也未曾想到的」，而这正是「神为爱他的人所预备的」（哥林多前书 2:9）。
    - type: paragraph
      text:
        ru: «Мир вам остављам, мир Свој дајем вам; не дајем вам га као што свијет даје. Нека се не збуњује срце ваше и нека се не боји.» (Ин.14:27)
        cn: «我留下平安给你们；我将我的平安赐给你们。我所赐的，不像世人所赐的。你们心里不要忧愁，也不要胆怯。» (约翰福音 14:27)
    - type: paragraph
      text:
        ru: 'Својим животом међу људима Богочовек је донео све ново: и Истину, и Правду, и Љубав, и Живот, и Мир, и Доброту, и Савршенство.'
        cn: 神人藉着祂在人间的生活，带来了一切崭新之物：即真理、公义、爱、生命、平安、良善和完美。
    - type: paragraph
      text:
        ru: Нарочито Мир. Мир од чега? Мир од смрти, јер се Христов човек не боји убијене звери – смрти; мир од греха, јер се и њега не боји пошто га Христос савлађује; мир од ђавола, јер је и он потучен до ногу. То је Мир који долази од духовне сједињености са Господом Христом, тим Јединим Победитељем греха, смрти и ђавола у свима световима. Испуњен Богочовеком, Његовим божанским свепобедним силама (Кол.2:9), човек се ничега и никога не плаши у овом свету; срце је његово заиста испуњено Божјим миром, «који превазилази сваки ум» (Флп.4:7), и «мир Божји влада у срцима» њиховим (Кол.3:15), те се срце њихово не плаши и не боји никога до Бога.
        cn: '特别的平安。平安从何而来？


          平安脱离死亡，因为基督里的人不惧怕那被杀的兽——死亡；平安脱离罪，因为他也不惧怕罪，基督已胜过它；平安脱离魔鬼，因为魔鬼也已被彻底击败。这是从与主基督属灵的合一而来的平安，他是罪、死亡和魔鬼在一切世界中唯一的得胜者。被神人、他的神圣全胜力量（歌罗西书 2:9）充满的人，在这世上不惧怕任何事和任何人；他的心确实充满着上帝的平安，这平安「超越一切理性」（腓立比书 4:7），并且「上帝的平安在他们心里作主」（歌罗西书 3:15），他们的心除了上帝，不惧怕任何人。'
    - type: paragraph
      text:
        ru: 'Тај мир богочовечански, тј. ту слободу од греха, смрти и ђавола, даје само Богочовек, и нико други; зато је та слобода, и мир у тој слободи, нешто изузетно Христово, нешто шго само Христос може дати, а никада свет или ма ко од овога света. То и подвлаче Спасове речи: «Мир вам осгав-љам, мир свој дајем вам; не дајем вам као што свет даје: да се не плаши срце ваше и да се не боји». – Како свет даје мир? Увек са примесом греха или у самом миру или у средствима којима се долази до мира или спроводи мир. Само је у слободи од греха – прави мир (ср.Ин.8:32,34:36): мир у савести људској, у срцу људском, у души људској, у уму људском, у друшгву људском, у роду људском. Сваки друга мир је псевдомир, и родитељ разноврсних немира и зала.'
        cn: 这种神人性的平安，亦即，那种从罪、死亡和魔鬼中得的自由，唯有神人赐予，别无他人；因此，那种自由，以及那种自由中的平安，是基督独有的，是唯有基督能赐予的，绝非这世界或这世上的任何人所能赐予。救主的这些话语也强调了这一点：「我留下平安给你们；我将我的平安赐给你们。我所赐的，不像世人所赐的。你们心里不要忧愁，也不要胆怯。」 (约翰福音 14:27) 世界如何赐予平安？总是在平安本身中，或是在达致平安或推行平安的手段中掺杂着罪。唯有在从罪中得的自由里，才有真正的平安 (参看 约翰福音 8:32，8:34，8:36)：在人的良知中，在人的心中，在人的灵魂中，在人的思想中，在人类社会中，在人类族群中的平安。任何其他平安都是虚假的平安，是各种不安和邪恶的根源。
    - type: paragraph
      text:
        ru: '«Чусте да вам Ја казах: Идем, и доћи ћу вама. Кад бисте Ме љубили, обрадовали бисте се што рекох: идем Оцу; јер Отац Мој већи је од Мене. А сада сам вам рекао, прије него се збуде, да вјерујете када се збуде.» (Ин.14:28–29)'
        cn: «你们听见我告诉你们说：我去了，还要回到你们这里来。你们若爱我，就必因我说了：我往父那里去而欢喜；因为我的父比我大。现在我先告诉你们，在事情发生以前，使你们在事情发生时可以相信。» (约翰福音 14:28-29)
    - type: paragraph
      text:
        ru: 'Богочовек је собом повезао људски род са Богом; васпоставио везе које је грех покидао. Он је то учинио, смањивши себе, понизивши себе до човека – учовечивши се. Тај акт божанске свељубави људи не могу да схвате, нарочито пре но што се Господ узнео са телом, послао с неба Светог Утешитеља. Људима је непојмљиво: како то да «Бог постане тело», да живи у трошном и осрамоћеном телу људском. Па чак ни онима који љубе Спаситеља, као ученици на Тајној Вечери. Њима још није био јасан богочавечански домострој спасења. А слава је његова у томе: да се као људско прослави вечно божанском славом на тај начин што ће га Богочовек узнети као своје и посадити с десне страие Бога Оца, изнад свих Херувима и Серафима. У томе је радост људска. Али ту радост још немају ученици на Тајној Вечери, јер још нису видели прослављеног Исуса. Зато што је носилац тела људског, Исус је мањи од Оца. Зато говори учемицима: «Чусте да вам казах: идем, и доћи ћу к вама. Кад бисте имали љубав к мени, онда бисте се обрадовали што рекох: идем к Оцу; јер је Отац мој већи од мене»: већи од моје човечанске лрироде, не од Божанске. Али све то Спас предсказује да би, када се то оствари, било разлог за његову веру у Њега као Богочоввка и Спаситеља: свезнајућег и свемоћног.'
        cn: 神人通过自身将人类与上帝连结起来；他修复了被罪切断的纽带。他这样做，是借由降卑自己，取了人的样式——即道成肉身。人类无法领悟这一神圣的普爱之举，特别是在主带着身体升天、从天上差遣圣安慰者之前。对人类而言，这是不可思议的：为什么「上帝成了肉身」，住在朽坏且蒙羞的人类身体里。甚至连那些爱救主的人，比如在最后的晚餐上的门徒，也无法理解。对他们而言，神人救赎的定旨尚未明了。而他的荣耀在于：他以人的身份，借由神人将他（即他的人性）高举为祂自身的，并使他坐在天父上帝的右边，高于一切基路伯和撒拉弗，从而永远地被神圣的荣耀所荣耀。这就是人类的喜乐所在。但这份喜乐在最后的晚餐上的门徒尚未拥有，因为他们还没有看到被荣耀的耶稣。因为耶稣是人类身体的承担者，他比父小。因此他对门徒说：「你们听见我对你们说了：『我去，还要回到你们这里来。』你们若爱我，因我曾说：『我往父那里去，』就必喜乐了，因为父是比我大的。」——比我的人性大，而不是比我的神性大。然而，救主预先宣告这一切，是为了当这些事实现时，能成为他们信靠祂是神人、救主——即全知全能者的理由。
    - type: paragraph
      text:
        ru: «Нећу више много говорити с вама, јер долази кнез овога свијета, и у Мени нема ништа. Него да зна свијет да љубим Оца, и као што Ми заповједи Отац, онако творим. Устаните, хајдемо одавде!» (Ин.14:30–31)
        cn: «我不再多与你们说话了，因为这世界的王将到，在我里面他是毫无所有。但要让世人知道我爱父，并且父怎样吩咐我，我就怎样行。起来，我们走吧！」(约翰福音 14:30-31)
    - type: paragraph
      text:
        ru: '«Кнез овога света» влада у овом свету грехом и смрћу. Богочовек је као човек, и прави човек у овоме свету, и на њега насрће «кнез овога света» – ђаво, тражећи и у њему своје, тј. грех, и у греху смртност и трулежност. Свега тога у Богочовеку нема. Иако човек, Он је једини човек без греха и греховне смртности и трулежности. Зато Спас и објављује: «Иде кнез овога света, и у мени нема ништа». Нема ништа у Христу греховног, ђавољег; ништа своје ђаво не може пронаћи у њему, зато и не може да влада над њим. То и јесте доказ Христове безгрешности, Христове божанске светости, Христовог божанства.'
        cn: 「这世界的王」借着罪和死亡统治着这世界。神人作为一个人，也是这世上真正的人，而「这世界的王」——魔鬼——就攻击他，企图在他里面找到属于它自己的东西，即罪，并在罪中找到死亡和败坏。然而，神人里面却没有所有这一切。尽管是人，他却是唯一一个没有罪、没有罪性的死亡和败坏的人。因此，救主也宣告说：「这世界的王将到，他在我里面毫无所有。」在基督里毫无罪性、毫无属于魔鬼的；魔鬼在他里面找不到任何属于自己的东西，因此它也无法统治他。这正是基督无罪性、基督神性的圣洁以及基督神性的明证。
    - type: paragraph
      text:
        ru: Зато су Његова љубав и Његов рад потпуно божански. Сва дела Његова говоре о Његовој божанској свемоћи и о Његовој љубави према небеском Оцу, коју Он непрестано изражава творећи заповести Очеве. Због свега тога ђаво и «нема ништа» свога у Њему.
        cn: 因此，祂的爱和祂的工作是完全神圣的。祂的一切作为都彰显祂神圣的全能，并显明祂对天父的爱，这份爱是祂通过不断遵行天父的诫命而表达出来的。正因这一切，魔鬼在祂里面「一无所有」。
    - type: paragraph
      text:
        ru: Да, први човек у коме ђаво нема ничег свог.
        cn: 是的，第一个人，魔鬼在他里面毫无所有。
  - type: heading2
    text:
      ru: Глава петнаеста. Христос прави чокот – о духу светом
      cn: 第十五章. 基督是真葡萄树 – 关于圣灵
    children:
    - type: paragraph
      text:
        ru: '«На Тајној Вечери казана је сва тајна Христоиих следбеника: откуда у њима оне божански моћне и свемоћне стваралачке силе; откуда им познање и поседовање божанске Истине, божанског Живота, божанске Љубави, божанске Мудрости, божанске Доброте, божанске чудотворне силе, и осталих божанских савршенстава; откуда силе да држе заповести еванђелске; откуда Христос у њима и они у Христу; откуда они – боравиште Свете Тројице; откуда им Дух Свети. Све је то отуда што је Господ Христос чокот а они лозе на том богочавечанском чокоту.'
        cn: 在最后的晚餐上，基督门徒的所有奥秘都已揭示：他们从何而来，拥有那些神圣的、大能的和全能的创造性力量？他们从何而来，拥有并掌握神圣的真理、神圣的生命、神圣的爱、神圣的智慧、神圣的良善、神圣的行神迹的能力，以及其他神圣的完全？他们从何而来，拥有力量去遵守福音的诫命？他们从何而来，基督在他们里面，以及他们在基督里？他们从何而来，成为圣三一的居所？他们从何而来，拥有圣灵？所有这一切都源于主基督是葡萄树，而他们是这神人一体的葡萄树上的枝子。
    - type: paragraph
      text:
        ru: Као што лозе на виновом чокоту живе и род доносе само ако су на њему, и ако их он храни својим животворним и плодоносним соковима; тако и људи, само ако су накалемљени на Христу вером и осталим врлинама, органски се сједињују са Њим, и живе Његовим божанским животворним и плодотворнима силама. И као што је Он вечан, тако и они постају вечни Њиме, јер их Он храни оним што је вечно, божанско, бесмртно. Људска природа, ако се органски не сједини са Богом кроз Богочовека, она се сасуши, увене, и без рода остане. Само органско сједињење са Богом и органско живљење Богом, даје људској природи оно што је бесмртно, божанско, вечно, свевредносно.
        cn: 正如葡萄树上的枝子，唯有若在树上，且被树以其赋予生命和结出果实的汁液所滋养，方能存活并结果子；照样，人唯有借着信德和其他德行被嫁接到基督里，才能与祂有机地联合，并靠祂神圣的、赋予生命和赋予果实的力量而活。并且正如祂是永恒的，照样他们也借着祂变得永恒，因为祂以那永恒的、神圣的和不朽的来滋养他们。人的本性，若不借着道成人身者与上帝有机地联合，就会枯干、枯萎，且不结果子。唯有与上帝的有机联合，以及有机地以上帝而活，才能赋予人的本性那不朽的、神圣的、永恒的和全有价值的。
    - type: paragraph
      text:
        ru: «Ја сам истински чокот, и Отац Мој је виноградар.» (Ин.15:1)
        cn: «我是真葡萄树，我父是栽培的人。» (约翰福音 15:1)
    - type: paragraph
      text:
        ru: 'Ја сам прави чокот тј. чокот који нико и ништа не може нагристи, оштешити, уништити, усмртити. Сав је бесмртан и вечан, јер је Он сам сва бесмртност божанска и сва вечност божанска. А Он, Богочовек, је то Својим божанством. Иако човек, он је Својим божанством сав у Оцу, сав у Светој Тројици. Зато и вели за Оца свог: «и Отац је Мој виноградар». Значи: богочовечанско дело спасења света је дело не само Сина Божијег, Богочовека Исуса, него и Бога Оца. Сва Света Тројица ради на томе, а Син је најнепосредиији посредник тога међу људима, јер је човек, јер је Син Човечији. Богочовек је чокот спасења, истинити чокот целокупном Личношћу Својом, не нечим парцијалним, фрагментарним, делимичним. А то значи и Својим учењем, и Својим животом, и свим Својим од најмањег до највећег, од најопипљивијег до најневидљивијег: једна органска целина, и то богочовечанска целина, и још: богочовечанска Личност као органска целина.'
        cn: 我就是真葡萄树，即那无人无物能侵蚀、损害、毁灭、致死的葡萄树。他全然是不朽而永恒的，因为他自身就是全然的神圣不朽与全然的神圣永恒。而他，这位神人，是以其神性如此。虽为人身，他却以其神性全然在父里面，全然在圣三一里面。因此他也论及他的父说：「我的父是栽培的人」。这意味着：神人救世之工不仅是上帝之子、神人耶稣之工，也是上帝圣父之工。整个圣三一都在为此努力，而圣子则是这在世人中最直接的居间者，因为他为人，因为他是人子。神人乃是救恩的葡萄树，以其整全位格而言的真葡萄树，而非以某种局部性、片段性、部分性的方式。而这亦意味着以其教导、其生命、以及其一切从最小到最大、从最具体到最不可见者而言：一个有机整体，并且是一个神人整体，更是一个作为有机整体的神人位格。
    - type: paragraph
      text:
        ru: «Сваку лозу на Мени која не рађа рода одсијеца је; а сваку која род рађа чисти је да више рода роди.» (Ин.15:2)
        cn: 「凡在我里面不结果子的枝子，他就剪去；凡结果子的，他就修剪，使它结更多的果子。」(约翰福音 15:2)
    - type: paragraph
      text:
        ru: 'Бог Отац је земљорадник; обрађује Сином сву земаљску њиву: све људе. А пошто је род људски – рукосад Божји, виноград Божји, то је и Отац – виноградар. Само тај је виноград сав заражен духовном филоксером: грехом и смрћу, те не доноси прави божански род. Људска природа је обесплођена грехом и смрћу. Зато Бог Логос постаје човек, да обнови људооку природу и оплоди је за божански род, ослободивши је собом од греха и смрти. Као стварно безгрешан Човек, Богочовек је заиста «прави чокот». И дао је људима сва средства којима се они могу накалемити на њему – правом чокоту, и живети њиме, и доносити богочовечанкзки род: бесмртне мисли, бесмртна осећања, бесмртна дела; а то значи: еванђелске мисли, еванђелска осећања, еванђелска дела. Та средства јесу: свете тајне и свете врлине, и у њима све богочовечанске силе.'
        cn: 上帝圣父是农夫；他借着圣子耕耘着所有尘世的田地：所有的人。而既然人类是上帝所栽种的、上帝的葡萄园，那么圣父也是葡萄园主。然而，这个葡萄园完全被属灵的根瘤蚜——罪和死亡所侵染，因此无法结出真正的神圣果实。人性因罪和死亡而变得贫瘠。因此上帝圣言（逻各斯）成为人，为要更新人性，并使其结出神圣的果实，借着他自己将人性从罪和死亡中解放出来。作为真正无罪的人，神人确实是「真葡萄树」。他也赐予人们一切途径，使他们能接枝在他——这真葡萄树上，并借他而活，结出神人性的果实：不朽的思想，不朽的情感，不朽的行为；而这意谓着：福音的思想，福音的情感，福音的行为。这些途径就是：圣奥秘（圣事）和圣美德，并在它们之中蕴含着一切神人性的大能。
    - type: paragraph
      text:
        ru: Светом Тајном Крштења човек се накалемљује на Христу – Чокоту. Али се учвршћује на Њему и органски сједињује све јаче и јаче са Њим помоћу осталих светих тајни и светих еванђелских врлина. Без ових, иако крштен, он се полако отпађује од Чокота, намерно се не храни Његовим животворним скоковима, и тако без рода остаје. Отац – «виноградар» Својим свевидећим оком прати сваку лозу на Чокоту свом, и лење лозе – одсеца и баца. То је тако дивно изражено примером смокве која три године не доноси рода, и домаћин (тј. Бог) хоће да је посече, а слуга (тј. Син) моли да је остави још за једну годину, па ако и онда не роди, исећиће је (Лк.13:7–9).
        cn: 人藉着圣洗圣事，被嫁接到基督——这葡萄树上。但藉着其余的圣事和圣福音的德行，他得以在祂里面坚固，并与祂有机地、越来越紧密地结合在一起。若无这些，即便受了洗，他也会渐渐地从葡萄树上脱落，蓄意不靠祂那赐生命的汁液滋养自己，如此便不结果子。父——「栽培的人」，祂以祂那全视之眼，察看祂葡萄树上的每一根枝子，并将懒惰的枝子砍下并丢弃。这在无花果树三年不结果子的例子中，得到了如此奇妙的体现：主人（即上帝）想要砍掉它，仆人（即圣子）祈求再留它一年，如果那时它仍然不结果子，就把它砍掉（路加福音 13:7-9）。
    - type: paragraph
      text:
        ru: А лоза која род доноси, тј. човек који умножава у себи еванђелске мисли, осећања, дела, – добија од Оца још више благодатне силе, помоћу којих још радикалније побеђује и уништава у себи грехе и искушења. И уколико се више чисти од греха, утолико се у њему више разливају благодатне силе Божије, које чине да душа његава постаје све плоднија и све више рађа еванђелског рода. У спасењу човека запослена је сва Света Тројица – толика је љубав њена огромна за човека, и толико је човњк важно и вредносно биће за Њу.
        cn: 结果实的葡萄树，即那在自己里面倍增福音的思想、情感和行为的人，从父那里领受更多恩典的力量，借着这些力量，他能更彻底地战胜并摧毁自己里面的罪和诱惑。并且，他越是从罪中洁净自己，神的恩典力量就越是浇灌在他里面，这使得他的灵魂变得更加丰饶，结出越来越多的福音果实。在人的救赎中，整个圣三一都参与其中——祂对人的爱是如此浩大，人对祂而言是如此重要且有价值的存在。
    - type: paragraph
      text:
        ru: «Ви сте већ чисти због ријечи коју сам вам говорио.» (Ин.15:3)
        cn: 「你们已经洁净了，因为我给你们讲的道。」 (约翰福音 15:3)
    - type: paragraph
      text:
        ru: Огњена сила која спаљује коров и трње греха у човеку, те га тако чисти од свега што смета да људска природа буде плодародна, и да раћа божански род, јесте реч Христова, еванђеље Христово. Јер у речи Христовој присутна је божанска сила која очишћује од оваке прљавштине и душу и тело.
        cn: 焚烧人心中罪孽的杂草和荆棘，从而洁净人，除去一切阻碍人性多结果子、生出神圣子嗣之物，这火一般的力量就是基督的道，基督的福音。因为在基督的道中，存在着神圣的力量，洁净灵魂和身体脱离各样污秽。
    - type: paragraph
      text:
        ru: 'Речи Христове «дух су и живот су», и прогоне из човека све што је телесно и смртно. «Јер се свако створење Божије освећује речју Божијом и молитвом» (1Тим.4:5). Пусти ли човек да жива реч Божије Речи проструји кроз његово биће, и помолили је својим подвизима на том путу кроз његово биће, она га заиста очишћава од сваке прљавштине. Зато Спас и вели ученицима својим: «Ви сте већ очишћени речју коју вам говорих».'
        cn: 基督的话语「是灵，是生命」，并且驱逐人里面一切属肉体的和必朽坏的事物。「因为上帝的一切受造之物都藉着上帝的话语和祷告得以圣化」（提摩太前书 4:5）。如果人让上帝之道的活泼话语流淌于他的生命之中，并且在他生命的这段旅程中，以他的苦修来助其通行，它就真的洁净他脱离一切污秽。因此救主也对祂的门徒们说：「你们已经因我给你们讲的道洁净了。」
    - type: paragraph
      text:
        ru: «Останите у Мени и Ја ћу у вама. Као што лоза не може рода родити сама од себе ако не остане на чокоту, тако ни ви ако у Мени не останете.» (Ин.15:4)
        cn: «你们要常在我里面，我也常在你们里面。枝子若不常在葡萄树上，自己就不能结果子；你们若不常在我里面，也是这样。» (约翰福音 15:4)
    - type: paragraph
      text:
        ru: 'Органско сједињење Богочовека и Његових следбеника није друго до богочовечанска симбиоза: он, Бог, живи у њима и са њима; и они, људи, живе у Њему и са Њим. То је међусобно духовно саоваплоћавање, ниуком случају никакво поробљавање: Он се саоваплоћује њима; они се саоваплоћују Њему. Све по основном еванђелском, богочовечанском начелу боговаплоћења: Бог Логос се оваплоћује у човека, да би се човек оваплотио у Бога. Јер је у Богочовековом Еванђељу стожер – истина ово: Бот Логос је постао човек, да би човек постао Бог по благодати. Ту стожер – истину ево Спас открива на Тајној Вечери као свету истину: «Будите у Мени и Ја у вама» ( = боравите у Мени и Ја у вама). Живећи Богом и у Богу човек се и сам обожује и сам постаје «бог по благодати», – по омиљеној речи светих трију православних богослова, јединих правих богослова, а нарочито светогСимеона Новог Богослова. Ништа еванђелско човек не може учинити без благодатне помоћи Спаситељеве; ништа еванћелско «родити» сам од себе; зато је увек потребна помоћ Богочовекова, јер је све еванђелско увек богочовечански синергично: увек на њему заједнички раде, један другоме сарађују, Бог и човек. То нам казују речи Спасове: «као што лоза не може рода родити сама од себе ако не буде на чокоту, тако и ви ако у мени не будете».'
        cn: 神人及其追随者的有机结合，不外乎是神人性的共生关系：祂，神，住在他们里面并与他们同在；而他们，人，住在祂里面并与祂同在。这是一种相互的精神性同道成肉身，绝非任何形式的奴役：祂与他们同道成肉身；他们与祂同道成肉身。这一切都按照福音性的、神人性的基本原则——神道成肉身：神圣言道成肉身为人，以便人得以道成肉身成为神。因为在神人的福音中，核心真理就是：神圣言成为了人，以便人凭恩典成为神。这核心真理在此，救主在最后的晚餐上将其启示为一项神圣真理：「你们住在我里面，我也住在你们里面」（= 住在或停留在我的里面，我也住在或停留在你们的里面）。人靠神而活，并在神里面而活，人自己也得到神化，并凭恩典成为「神」——正如圣三位东正教神学家（唯一的真正神学家，尤其是圣西默翁新神学家）所喜爱的话语。没有救主恩典的帮助，人无法完成任何福音性的事；无法独自「生出」任何福音性的事物；因此，神人的帮助总是必要的，因为一切福音性的事物总是神人协同的：神与人总是共同在其上工作，彼此合作。救主的话语告诉我们这一点：「枝子若不常在葡萄树上，自己就不能结果子；你们若不常在我里面，也是这样」（约翰福音 15:4）。
    - type: paragraph
      text:
        ru: «Ја сам чокот, а ви лозе. Ко остаје у Мени и Ја у њему, тај доноси многи плод, јер без Мене не можете чинити ништа.» (Ин.15:5)
        cn: «我是葡萄树，你们是枝子。常在我里面的，我也常在他里面，这人就多结果子；因为离了我，你们就不能做什么。» (约翰福音 15:5)
    - type: paragraph
      text:
        ru: 'Без Бога човек је неродна биљка. Човек, сам по себи, не располаже силама које би му осигурале бесмртност и живот вечни. А то значи човек је плен смрти, и домен смрти. Ма колико човек изживљавао себе аутаркично, из тога ма колико себе идололатризирао (будизам, евроиски хуманизам), ипак није у стању да себе претвори у неко трајније биће, акамоли у биће бесмртно и вечно. Увек и за увек човек остаје – смртан, пролазан, злосмраДан.Али то што не може дати ни један човек, ма који човек, ни сви људа скупа, – даје само Богочовек. Њиме и у њему једино човек постаје бесмртно и вечно биће. Јер Он узима човека у себе, и Собом га прерађује у биће вечно, богочавечно. И истовремено преноси Себе у човека, и човек осећа Њиме, мисли Њиме, дела Њиме, живи Њиме, бесмртује Њиме. Ту је посреди потпуна и савршена симбиоза Бога и човека: Бог остаје Богом, и ако свега Себе даје човеку; и човек остаје човеком, иако свега себе даје Богу. Даје, и постаје савршен човек (ср.Еф.4:13), «за свако добро дело приправљен» (2Тим.3:17). А сваки је човек саздан са циљем да постане савршени човек. Зато је Бог Логос и постао човек, да би дао силе сваком човеку да испуни своје божаиско назначење: да постане савршен човек. Христа проповедамо, изјављује Апостол: «да покажемо свакога човека савршеног у Христу Исусу» (Кол.1:28).'
        cn: '没有上帝，人就是一株不结果的植物。人，凭着自己，不具备能确保他获得不朽和永生的力量。这意味着人是死亡的猎物，是死亡的领域。无论人多么自足地活出自己，无论他多么将自己偶像化（佛教，欧洲人文主义），他仍然无法将自己转变为一个更持久的存在，更遑论一个不朽和永恒的存在。人永远并一直都是——必死的、短暂的、败坏恶臭的。


          然而，任何一个人，无论他是谁，甚至所有人类加起来都无法给予的，只有神人才能给予。唯有借着祂并在祂里面，人才能成为不朽和永恒的存在。因为祂将人摄入自己，并借着自己将人改造为一个永恒的、神人性的存在。同时，祂也将自己注入人里面，于是人借着祂感受，借着祂思考，借着祂行动，借着祂生活，借着祂获得不朽。在此，神与人之间存在着一种完全而完美的共生：上帝仍然是上帝，尽管祂将自己完全赐予人；人仍然是人，尽管他将自己完全献给上帝。人献上自己，便成为一个完全的人（参以弗所书 4:13），「为各样善事预备齐全」（提摩太后书 3:17）。


          每个人受造的目的都是为了成为一个完全的人。因此，圣道上帝也成了人，为要赐予每个人力量去实现他神圣的使命：成为一个完全的人。使徒宣称：「好使我们在基督耶稣里，将各人显为完全」（歌罗西书 1:28）。'
    - type: paragraph
      text:
        ru: 'Све док човек не осети да је Богочовек – Чокот а он лоза, ради тог чокота, и родна само њиме и од органског јединства са Њим, он се гуши у безваздушној епрувети свога хуманизма, свога хоминизма, па био он религијски, философски, научни, културни, уметнички, – свеједно, заувек свеједно. А што Богочовек говори, свима људима говори: «Ја сам чокот а ви лозе: који борави у Мени и Ја у њему, он раћа многи род: јер без Мене не можете чинити ништа», – ништа трајно, ништа бесмртно, ништа свето, ништа праведно, ништа вечно, ништа уствари вредносно. «Без Мене не можете чинити ништа», – овим је сваки хуманизам, сваки хоминизам свака људска аутаркичност и аутархичност, свако човекопоклонство, осуђено на смрт. И још тиме проглашена ова благовест: А самном можете чинити све, – све што човека диже и до божанских висина уздиже, све што је божанско, бесмртно, вечно, свевредносно. Јер се човек једино богочовечанским, помоћу оветих еванђелских врлина и сила, продужује, проширује, узвишује, у све божанске бескрајности и бесмртности. И постаје биће коме се и анђели диве.'
        cn: 除非人感受到神人是葡萄树而人是枝子，并且为了那葡萄树，唯有借着祂并因着与祂有机地结合方能结出果实，否则他便在自己人本主义和唯人论的无空气试管中窒息，无论是宗教的、哲学的、科学的、文化的、艺术的——都无关紧要，永远无关紧要。而神人对所有人说：「我是葡萄树，你们是枝子；常在我里面的，我也常在他里面，这人就多结果子；因为离了我，你们就不能做什么。」（约翰福音 15:5）——没有什么恒久的，没有什么不朽的，没有什么神圣的，没有什么公义的，没有什么永恒的，没有什么真正有价值的。「离了我，你们就不能做什么」——凭借此言，每一个人本主义，每一个唯人论，每一个人类的自给自足和自我统治，每一个对人的崇拜，都被宣判死刑。并且借此宣告了这福音：同我，你们能做万事——所有能提升人、将人高举到神圣高度的事物，所有神圣的、不朽的、永恒的、具有普世价值的事物。因为人唯有借着神人性的方式，并借助于这些福音的德行和力量，方能延长、扩展、提升自己，进入所有神圣的无限和不朽之中。并且成为一个连天使都为之惊叹的存在。
    - type: paragraph
      text:
        ru: «Ко у Мени не остане, избациће се напоље као лоза, и осушиће се, и скупиће је, и у огањ бацити, и спалити.» (Ин.15:6)
        cn: 「人若不常在我里面，就像枝子丢在外面枯干，人拾起来，扔在火里烧了。」 (约翰福音 15:6)
    - type: paragraph
      text:
        ru: Без Богочовека, без органског јединства са Њим, људско биће постепено вене, пресахњују његове силе, ма како изгледале велике и неисцрпне, док најзад сасвим не пресахну, не изумру. И тиме саме себе на смрт, на уништење, на ишчезнуће осуде. И збиља, шта је то људско, макар било ничеански «људско – сувише људско», што на крају крајева смрт не спаруши, не сасуши, и у огањ не баци, и не спали?
        cn: 没有神人，没有与他有机的合一，人的存在会逐渐枯萎，他的力量会枯竭，无论它们看起来多么宏大和取之不尽，直到最后完全枯竭，消亡。于是，他们便将自己判为死亡、毁灭和消逝。而实际上，什么东西是人的，即使是尼采式的「人性的，太人性的」，到头来，死亡不能使其枯萎、干涸，也不能将其投入火中、焚毁的呢？
    - type: paragraph
      text:
        ru: 'Да, све и сва, и у томе је неминовна трагедија сваког хуманизма. Бесмртна је, и за сва времена очигледна истина у овим Богочовековим речима: «Ко у мени не борави, избацује се напоље као лоза, и суши се, и скупљају је, и у огањ бацају, и спаљује се».'
        cn: 是的，万事万物，而这正是每一种人文主义的必然悲剧。在这些神人的话语中，蕴含着不朽且永恒显而易见的真理：「凡不常在我里面的，就像枝子丢在外面枯干，人拾起来，扔在火里烧了。」
    - type: paragraph
      text:
        ru: «Ако останете у Мени и ријечи Моје у вама остану, што год хоћете иштите и биће вам.» (Ин.15:7)
        cn: 「你们若常在我里面，我的话也常在你们里面，你们无论求什么，就给你们成就。」 (约翰福音 15:7)
    - type: paragraph
      text:
        ru: 'Органско сједињење човека са Богочовеком чини човека свемоћним, али и свемудрим. Он постаје свемоћан њиме, и свемудар њиме. И онда иште у Богочовека и за себе и за ближње само оно што им служи спасењу од греха, смрти и ђавола, само оно што је свето, узвишено, честито, божанско, бесмртно, вечно. Тада заиста човек сасвим природно «рађа многи род» богочовечански: еванђелска дела, мисли, расположења.'
        cn: 人与神人的有机结合使人全能，也使人全智。他借此成为全能，也借此成为全智。于是，他向神人祈求，为自己也为近人，唯独那有助于他们脱离罪、死亡和魔鬼而得救赎的，唯独那圣洁的、崇高的、贞洁的、神圣的、不朽的、永恒的事物。那时，人就真正地、完全自然地「结出许多神人性的果实」：福音性的行为、思想、心境。
    - type: paragraph
      text:
        ru: 'Главно је: бити у Богочовеку, боравити, живети у Њему, онда Он сам и твори дела своја кроз слугу Свога: чокот рађа лозом; лоза се види и род, више него чокот, који је једним делом у земљи, невидљив. Зато Спас благовести: «ако боравите у Мени и речи Моје у вама бораве, што год хоћете шитите и биће вам», «што год хоћете – иштите», а ви ћете, зато што живите Богочовеком, у Њему и ради Њега, искаћете само оно што је еванђелско, богочовечанско, спасоносно. «И биће вам», јер је ваша воља, сјединивши се са Његовом помоћу држања Његових заповести, и сама постала богочовечански свемоћна. Пример: безбројна чудеса Светитеља који су ова чинили ради спасења људи.'
        cn: 最重要的是：在神人里，居住在他里面，在他里面生活，那么他自己就通过他的仆人施行他的作为：葡萄树生出枝条；枝条和果实都看得见，比葡萄树本身更明显，因为葡萄树有一部分在土里，是看不见的。因此救主宣讲道：「你们若住在我里面，我的话也住在你们里面，无论你们求什么，就给你们成就。」（约翰福音 15:7）「无论你们求什么——尽管祈求」，而你们将会，因为你们藉着神人而活，在他里面并为了他，只会祈求那些是福音性的、神人性的、救赎性的事物。「就给你们成就」，因为你们的意愿，借着遵守他的诫命而与他的意愿合一，本身也变得神人般地全能。例子：圣徒们为了拯救人类而行的无数神迹。
    - type: paragraph
      text:
        ru: «Овим се прослави Отац Мој да род многи доносите, и бићете Моји ученици. Као што Отац љуби Мене, и Ја љубим вас; останите у љубави Мојој.» (Ин.15:8–9)
        cn: 「以此，我的父得荣耀，使你们多结果子，你们就作我的门徒了。父怎样爱我，我照样爱你们；你们要常在我的爱里。」 (约翰福音 15:8-9)
    - type: paragraph
      text:
        ru: 'Смерни Син Божији, Господ Христос све приписује Оцу, па и славу Својих богочовечанских дела која Он чини силом Својом преко Својих ученика. Сваки род има свој корен; корен свих хришћанских дела је Отац Небески. Ко се држи тог корена преко чокота – Богочовека – да као лоза рађа «многи род». То рађање многог богочовечанског рода благодатном силом Божијом која од Оца стално струји кроз Сина у Његове следбенике и чини људе ученицима Христовим. Провера апостолства? – Дела богочовечанска, и то многа. Та благодатна сила је неисцрпна, јер долази из непресушног божанског извора, зато су и дела неизбројна. Преноситељ те силе је човекољубље Богочовеково, по свему изузетно и једииствено, јер: свето, безгрешно, божанско, свемило стиво, сведарежљиво.'
        cn: 谦卑的上帝之子，主基督将一切都归于父，甚至祂藉着祂的门徒以祂自己的能力所行的神人合一之作为的荣耀。每一种果实都有其根源；所有基督徒行为的根源是天父。凡是借着藤蔓——神人——而持守这根源的，就会像葡萄枝一样结出「许多果实」。这种结出丰硕的神人合一之果实，是借着上帝的恩典能力来完成的，这能力不断地从父藉着子流向祂的追随者，并使人成为基督的门徒。使徒职分的验证？——是神人合一的作为，而且是许多的作为。这恩典能力是取之不尽的，因为它来自无穷无尽的神圣源泉，因此，这些作为也是不可胜数的。传递这能力的，是神人的博爱，这博爱在各方面都卓越且独特，因为它：神圣，无罪，属神，充满怜悯，慷慨施予。
    - type: paragraph
      text:
        ru: 'Уствари, ми људи, раслабљени злом и гресима, нисмо ни знали шта је то истинска, права, савршена љубав, јер у нашим човечанским љубавима увек има, више или мање, самољубља. Христова љубав је прва стварна и потпуна љубав: оригинал љубави; божански света, божански савршена, божански бесмртна, божански смерна. Зато Спас на Тајној Вечери и казује свету тајну свете богочовечанске љубави као «нову заповест» о новој љубави. То је заиста нова света сила која долази од Оца и даје нам се Сином у Духу Светом. Стога нас и утројичује и отројичује, као обожујућа благодатна сила. Та божанска љубав је врховни закон у животу свете божанске Тројице: она одржава свесавршено јединство Тројичног божанства при чему Света Три Лица увек остају свако за себе бескрајно божански савршена и божански самостална. Зато је та божанска љубав, преиесена и преношена Богочовеком у нас људе, стваралачка и синтетичка сила личности: уколико је човек више има, утолико његова личност постаје савршенија, и у исто време разливенија по људима као објектима овоје делатности. То је једина савршена хипостасирајућа сила, и у исто време саборнизирајућа. Она сједињује човека најпре са Богочовеком, и кроза њ са људима, за све време водећи његову личност из савршенства у савршенство. Живећи у тој љубави, човек живи главном животном силом Тројичног Божанства. Тада се доживљује божанско јединство, божанско свејединство живота: богочовечански монизам живота.'
        cn: 事实上，我们人类被邪恶和罪削弱了，根本不知道什么是真实、真正、完美的爱，因为在我们人类的爱中，或多或少总是存在自私。基督的爱是第一个真实而完全的爱：爱的原本；神圣地圣洁，神圣地完美，神圣地不朽，神圣地谦卑。因此，救主在最后的晚餐上，向世人讲述了神人圣爱的神圣奥秘，将其称为「新诫命」，关于一份新的爱。这确实是一股新的神圣力量，它源自父，并借着子在圣灵里赐予我们。因此，它也使我们三一化，并使我们呈现三一之相，作为神化恩典的力量。这份神圣的爱是神圣三位一体生命中的至高法则：它维系着三一神性全然完美的合一，同时圣洁的三位格各自始终保持无限神圣地完美和神圣地独立。因此，这份神圣的爱，是借着神人传递并注入我们人类的，是人格的创造性和综合性力量：人拥有得越多，他的人格就越完美，同时就越是洋溢于人，作为其活动的客体。它是唯一完美的位格化力量，同时也是共融性力量。它首先使人与神人联合，并借着神人与人联合，始终引领他的人格从完美走向完美。活在这种爱中，人就是活在三一神性主要的生命力量中。那时就会体验到神圣的合一，神圣的生命全合一：神人合一的生命一元论。
    - type: paragraph
      text:
        ru: «Ако заповијести Моје одржите, остаћете у љубави Мојој, као што сам Ја одржао заповијести Оца Мојега и остајем у љубави Његовој.» (Ин.15:10)
        cn: 「你们若遵守我的命令，就必常在我的爱里，正如我遵守了我父的命令，常在他的爱里一样。」 (约翰福音 15:10)
    - type: paragraph
      text:
        ru: 'И кроз то осећање божанске љубави човек стварно прелази из смрти у живот, и не умире. А та се љубав стиче држањем заповести Христових, испуњавањем Еванђеља Његовог. И не само стиче, него и увек притиче, те човек с радошћу остаје у њој свим бићем својим. Уствари та љубав је један непрекидни подвиг који почиње са вером у Христа а продужава се бескрајно и бесконачно. Што човек усрдније држи заповести, све се јаче укорењује у љубави и утемељује у њој, (ср.Еф.3:17), и њоме расте «са свима светима» у све дубине и ширине и висине и дужине Христове (Еф.3:19), – и тако се помоћу ње испуњује «сваком пуноћом Божијом» (Еф.3:19). Боравећи у њој, човек борави у светој Божанској Тројици: у Оцу кроз Сина у Духу Свегом. Све нам то казују речи Спасове: «као што Отац има љубав к Мени и Ја имам љубав к вама; будите у љубави Мојој, ако заповести Моје држите ви ћете остати у љубави Мојој, као што Ја одржах заповести Оца Свога и остајем у љубави Његовој».'
        cn: 借着这种神圣之爱的感受，人真正地从死亡进入生命，并且不死去。而这种爱是通过遵守基督的诫命，履行祂的福音而获得的。这种爱不仅被获得，而且一直在涌流，使人以其全部的生命喜乐地安住于其中。事实上，这种爱是一项永无止境的灵修苦行，始于对基督的信仰，并无限且无止尽地延续下去。人越是殷勤地遵守诫命，就越是牢固地在爱中扎根并建立其中 (参阅 以弗所书 3:17)，借着它，「与众圣徒一同」在基督的一切深、广、高、长中成长 (以弗所书 3:19)， – 从而借着它，被「一切上帝的丰盛」所充满 (以弗所书 3:19)。安住于其中，人就安住于神圣的上帝三一之中：在父里面，借着子，在圣灵之中。救主的话语向我们揭示了这一切：「正如父爱我，我也爱你们；你们要常在我的爱里。你们若遵守我的诫命，就必常在我的爱里，正如我遵守了我父的诫命，常在他的爱里一样。」
    - type: paragraph
      text:
        ru: «Ово сам вам казао да радост Моја у вама остане и радост ваша да се испуни.» (Ин.15:11)
        cn: 「我将这些事告诉你们，是要叫我的喜乐存在你们心里，并叫你们的喜乐可以满足。」 (约翰福音 15:11)
    - type: paragraph
      text:
        ru: 'Од божанске љубави разлива се по души нека бескрајна радост, и она – сва божанска, сва света, сва бесмртна, сва богочовечанска. Радост у којој нема ни смрти ни страха од смрти; она васкрсна радост коју је род људоки познао тек у васкрсењу Богочовековом. Она се христољубљем усељује у душу човекову, и христољубљем чува у њој. Нестане ли у души христољубља, нестаје и те божанске радости, и туга и мука поплаве душу, и све њене поноре, врхове и равнине. Спас и вели: «ово вам казах, да радост моја у вама остане и радост ваша се испуни». «Радост моја» = «Љубав моја»: св. Серафим: «радосте моја», то из њега љубав Христова.'
        cn: 从神圣的爱中，一种无尽的喜乐倾泻入灵魂，这喜乐——全然神圣，全然圣洁，全然不朽，全然神人同体。这喜乐中没有死亡，也没有对死亡的恐惧；这是人类唯有在神人（基督）复活中才得以认识的复活喜乐。这喜乐借着爱基督之心住入人的灵魂，也借着爱基督之心保存在其中。倘若灵魂中失去了爱基督之心，那神圣的喜乐便也消逝，悲伤与苦楚便会淹没灵魂，淹没其所有的深渊、高峰与平原。救主也说：「我将这些事告诉你们，是要叫我的喜乐存在你们心里，并叫你们的喜乐可以满足。」（约翰福音 15:11）「我的喜乐」等同于「我的爱」：圣塞拉芬（称呼信众）「我的喜乐」，这正是出于他（圣塞拉芬）的基督之爱。
    - type: paragraph
      text:
        ru: '«Ово је заповијест Моја: да љубите једни друге као што Ја вас љубим.» (Ин.15:12)'
        cn: 「这是我的命令，叫你们彼此相爱，像我爱你们一样。」 (约翰福音 15:12)
    - type: paragraph
      text:
        ru: 'Држање еванђелских заповести испуњује душу богочовечанском љубављу. И све те заповести увиру у љубав, и на увору своје име губе, јер се све сливају у једну свеобимну заповест, свезаповест Богочовекову о љубави. И то – богочовечанској љубави. Све њено: и суштина, и метод, и радост, и бесмртност, и вечност, – условљена је Богочовеком, јер долази од Богочовека. Зато Он и благовести: «ово је заповест Моја, да имате љубав међу собом као што Ја имадох љубав к вама» ( = да љубите један другог као што вас Ја љубих). Своју љубав увек проверавајте Мојом.'
        cn: 持守福音的诫命，使灵魂充满神人性的爱。所有的诫命都汇入爱中，在汇流之处便失去了它们各自的名，因为它们都汇聚成一条包罗万有的诫命，神人关于爱的总诫命。这爱，就是神人性的爱。它的一切：其本质、方法、喜乐、不朽和永恒，都以神人为条件，因为它源自神人。因此，他宣讲道：「这是我的诫命，你们要彼此相爱，正如我爱你们一样。」（即：你们要彼此相爱，正如我爱了你们。）你们的爱务必以我的爱为检验标准。
    - type: paragraph
      text:
        ru: 'Јер ништа теже него стећи свеобилну еванђелску, христовску љубав, и стекавши је: чувати је стално светом, божанском, радосном и увек растућом. Тако само Христовом благодатном силом заповест о љубави постаје «највећа и прва», постаје свезаповест, о којој виси сав закон, сви пророци, па и сав Богочовек и Његов богочавечански подвиг спасења света. Сам је Спаситељ целокупно Своје Еванђеље сабрао у једну заповест: заповест о богочовечанској љубави. Да, богочовечанска љубав и јесте – скраћено Еванђеље. Љубав према Христу у исто време је и радост према свему Христовом. Зато је Еванђеље: – блага вест, радосна вест: «велика радост» (Лк.2:10). И то радост у свему што је Хрис-тово: и у творењу заповести и у страдању, и у само пожртвовању; у састрадању Христу, у саваскрсавању са Христом, у савазнесењу са Христом.'
        cn: 因为没有什么比获得全备的福音式的、基督的爱更难了；而一旦获得，就要持续保守它为神圣的、神性的、喜乐的并永远增长的。唯有如此，借着基督的恩典大能，爱的诫命才成为「最大和首要的」，成为总括一切的诫命，全部律法、所有先知，甚至全部的神人以及祂神人的救世伟业都悬于其上。救主亲自将祂全部的福音浓缩成一条诫命：神人之间之爱的诫命。是的，神人之间的爱正是简明的福音。对基督的爱同时也是对一切基督之事的喜乐。因此福音就是：好消息，喜乐的消息：「极大的喜乐」（路加福音 2:10）。而且这种喜乐存在于一切属于基督的事物之中：在遵行诫命中，在苦难中，在自我牺牲中；在与基督一同受苦中，在与基督一同复活中，在与基督一同升天中。
    - type: paragraph
      text:
        ru: «Од ове љубави нико нема веће, да ко живот свој положи за пријатеље своје.» (Ин.15:13)
        cn: 「没有人有比这更大的爱，就是为他的朋友舍弃自己的生命。」 (约翰福音 15:13)
    - type: paragraph
      text:
        ru: 'Шта је најдрагоценије у свету? – Душа. Шта – највеће? – Душа. Јер боголика вредност њена више вреди него сав видљиви свет од истока до запада, од севера до југа и од врха до дна. А највећа љубав шта је? Жртвовати душу своју за пријатеље своје. Не живот, не тело, не имање, не свет, већ душу, јер је то све, скупа од бескрајно мање вредности него душа. А то на чему стоји, и ради чега постоји, човек може жртвовати само ако има љубави Хриотове, љубави свежртвене. Она је увек готова да се жртвује за све што је свето, узвишено, божанско, еванђелско, за све што долриноси спасењу човека, и људи, од смрти, греха и ђавола. Јер је она пријатељ свему томе. И то је полуга њеног пријатељства са људима. Она је пријатељ свему бесмртном, божанском, светом, богочежњивом у сваком човеку. Ко то има, већ је њен пријатељ. И она је увек готова, с радошћу готова, да себе жртвује за пријатеље своје. Таква је благовест у овим речима Спасовим: «од ове љубави нико нема веће, да ко душу своју положи за пријатеље своје».'
        cn: '世上最宝贵的是什么？—— 灵魂。

          最伟大的是什么？—— 灵魂。

          因为它那肖似神的价值，胜过从东到西、从北到南、从上到下所有可见的世界。

          而最大的爱是什么？—— 为自己的朋友舍弃自己的灵魂。

          不是生命，不是身体，不是财产，不是世界，而是灵魂，因为所有这一切加起来，其价值都远不及灵魂。

          而一个人若要献上那赖以立足、为之而存的，唯有拥有基督的爱，那全然牺牲的爱，方能做到。

          这爱总是乐意为一切神圣的、崇高的、神性的、福音性的事物，为一切有助于拯救人类脱离死亡、罪恶和魔鬼的事物而牺牲。

          因为它与这一切为友。这就是它与人友谊的根基。

          它与每个人心中一切不朽的、神性的、神圣的、渴慕神的事物为友。

          拥有这一切的，已经是它的朋友。

          它总是准备好，满怀喜乐地准备好，为自己的朋友牺牲自己。

          救主的话语中蕴含着这样的佳音：「爱没有比这更大的了，就是人肯为朋友舍弃自己的灵魂。」'
    - type: paragraph
      text:
        ru: «Ви сте пријатељи Моји ако творите што вам Ја заповедам.» (Ин.15:14)
        cn: 「你们是我的朋友，如果你们遵行我所吩咐的。」 (约翰福音 15:14)
    - type: paragraph
      text:
        ru: 'Богочовек је Својим Новим Заветом донео свету и ново пријатељство, нову садржину пријатељства. По њему, право пријатељство се састоји у светој и божанској љубави човека према човеку. Човек је пријатељ свему светом и божанском у човеку; то му је пријатно у пријатељу. На томе он и заснива све своје односе према пријатељу. То пак значи: садржину правом пријатељству даје Бог и оно што је Божје. Такво пријатељсто је уствари пријатељевање са Богом и божанским у пријатељу. У томе је и сила, и јачина, и бесмртност, и саможртвеност правог пријатељства. Такво пријатељство, у правом смислу, омогућио је Богочовек Својом појавом у свету. Он је Бога учинио темељом и суштином и садржином истинског, светог и бесмртног пријатељства људског. Да би човек могао бити прави пријатељ човеку, мора претходно постати пријатељ Богу, тј. пријатан Богу својим светим, божанским, еванђелским животом. Постане ли пријатељ Божји, он лако постаје пријатељ људима, а понајлакше – пријатељ пријатељима Божијим. Како се пак постаје пријатељ Божји, Спаситељ нам показује Својим Еванђељњм. Испуњавањем заповести Божијих постаје се пријатељ Божији, пријатељ Христов. А од тога нема веће славе и части за човека ни у овом ни у оном свеггу. Држање заповести Христових, а сврх свега заповести над заповестима: заповест о божанској љубави, постаје се пријатељ Христов. Таква благовест бруји из ових Христових речи: «ви сте пријатељи Моји ако творите што вам Ја заповедам»«. Ви сте пријатељи Моји ако сте пријатељи Мојој божансжој истини, Мојој божанској правди, Мојој божанској љубави, Мојој божанској мудрости, свему бажанском што Еванђеље проповеда. А ви сте то, ако све то творите и по томе живите.'
        cn: 神人通过祂的新约，给世界带来了新的友谊，以及友谊的全新内涵。据此，真正的友谊在于人与人之间圣洁而神圣的爱。人与人内在一切圣洁与神圣之物为友；这令他在友人身上感到愉悦。他便在此基础之上，建立起他与友人的一切关系。这又意味着：真正的友谊，其内涵由上帝以及属于上帝的一切所赋予。这样的友谊，实际上是与上帝为友，以及与友人身上之神圣为友。这其中蕴含着真正的友谊的力量、刚强、不朽与自我牺牲。这样的友谊，在真正意义上，是由神人借由祂在世上的显现而使之成为可能。祂使上帝成为人类真挚、圣洁而不朽的友谊的根基、本质与内涵。为了使人能成为人的真挚友人，他必须首先成为上帝的朋友，即借由他圣洁的、神圣的、福音般的生活而蒙上帝喜悦。倘若他成为上帝的友人，他便轻易地成为众人的友人，而最轻易的，则是成为上帝友人的友人。然而，如何才能成为上帝的友人，救主借由祂的福音向我们显明。借由遵行上帝的诫命，便可成为上帝的友人，基督的友人。而对人而言，无论今生或来世，再没有比这更大的荣耀与尊贵了。持守基督的诫命，尤其是一切诫命之上那诫命，即关于神圣之爱的诫命，方可成为基督的友人。这等佳音，自基督的这些话语中回荡而出：「你们若遵行我所吩咐你们的，就是我的朋友了。」你们是我的朋友，倘若你们与我的神圣真理、我的神圣公义、我的神圣之爱、我的神圣智慧，以及福音所宣讲的一切神圣事物为友。而你们之所以如此，便是因为你们遵行这一切，并以此为生。
    - type: paragraph
      text:
        ru: «Више вас не називам слугама, јер слуга не зна шта ради господар његов; него сам вас назвао пријатељима, јер све што чух од Оца Својега, објавих вам.» (Ин.15:15)
        cn: 「我不再称你们为仆人，因仆人不知道他主人所做的事；我却称你们为朋友，因我从我父所听见的一切，都告诉了你们。」（约翰福音 15:15）
    - type: paragraph
      text:
        ru: 'Пријатељима Божијим откривају се тајне Божије, јер их они неће ни злоупотребити ни издати. Искреној љубави према Богу Бог одговара искреном љубављу. Усрдно творећи заповести Божије, човек све више стиче божамске љубави, а са њом и у њој – истинско знање о Богу и Божијим тајнама. Такав човек, већ није слуга него пријатељ Божији. А пријатељима се поверавају тајне. Богочовек је и постао човек и остао међу људима, да би људе начинио пријатељима Божијим: тј. свесним и пуним љубави творцима заповести Божијих. И све што им је за то било потребно, Он им је и казао и дао. Тако је робовски однос према Богу претворен у пријатељски, сав заснован на узајамној љубави. То је благовест ових Христових речи: «више вас не називам слугама јер слуга не зна шта ради господар његов; него вас назвах пријатељима: јер вам све казах што чух од Оца Свога».'
        cn: 上帝的奥秘向祂的朋友们显明，因为他们既不会滥用，也不会出卖这些奥秘。对上帝真诚的爱，上帝以真诚的爱回应。热切地遵行上帝的诫命，人就越来越多地获得神圣的爱，并且与这爱一同，又在这爱之内，获得关于上帝和上帝奥秘的真正知识。这样的人，就不再是奴仆，而是上帝的朋友了。而奥秘是向朋友们托付的。神人降世为人并居住在人间，是为了使人成为上帝的朋友：即有意识且充满爱地遵行上帝诫命的人。凡为此所需的一切，他都对他们说了，也给了他们。这样，对上帝的奴仆关系就转变为朋友关系，完全建立在相互的爱之上。这是基督这些话语的福音：「我不再称你们为奴仆，因为奴仆不知道他主人所做的事；我却称你们为朋友：因为凡我从我父所听见的，我都告诉了你们。」
    - type: paragraph
      text:
        ru: «Не изабрасте ви Мене, него Ја вас изабрах и поставих вас да ви идете и род доносите; и род ваш да остане, да што год заиштете од Оца у Име Моје да вам да.» (Ин.15:16)
        cn: 「不是你们拣选了我，是我拣选了你们，并且分派你们去结果子，叫你们的果子常存，使你们奉我的名，无论向父求什么，他就赐给你们。」 (约翰福音 15:16)
    - type: paragraph
      text:
        ru: 'Све што човек од себе унесе у творење еванђелских дела, то остаје вечито, остаје као његова непролазност и бесмртност; то нити рђа времена квари, нити мољац смрти нагриза. Оплођен божанским силама кроз свете врлине човек заиста и рађа многи род. Такви су нарочито свети Апостоли, ти неуморни ревнитељи и творци речи Божијих. Творећи заповести Божије, и на тај начин поставши пријатељи Божији, пријатељи Христови, они се удостојавају тога да им Господ даје све што заишту од Њега у Име Христово. «У Име Христово», тј. све што је свето, спасоносно, божанско, све што одводи Христу и спасава од греха, смрти и ђавола. Јер апостоли свети не ишту од Бога ништа што није усагласности са светом вољом Божијом. А «тајну воље Своје» Бог нам је открио у Христу (Еф.1:9). Такву благовест казују ове речи Спасове: «ви мене не избрасте него Ја вас избрах, и поставх вас да ви идете и род родите; и да Ваш род остане, да што год заиштете у Оца у Име Моје да вам да».'
        cn: 凡人从自身投入福音圣工的一切，都将永远长存，存留作他的不朽和不灭；它既不被时间的锈蚀所败坏，也不被死亡的蛀虫所侵蚀。人借由圣洁的德行，被神性力量所孕育，果真也能结出丰硕的果实。圣使徒们尤其如此，他们是那些不知疲倦的热心者和神圣话语的践行者。他们遵行神的诫命，并因此成为神的朋友，基督的朋友，便蒙受殊荣，主应允他们奉基督之名向祂所求的一切。「奉基督之名」，即是凡圣洁的、救赎的、神圣的一切，凡引人归向基督、并使人脱离罪、死亡和魔鬼的一切。因为圣使徒们不向神祈求任何与神圣旨意不相符的事。而「祂旨意的奥秘」，神已在基督里向我们显明（以弗所书 1:9）。救主的这些话语宣示着如此的福音：「不是你们拣选了我，而是我拣选了你们，并且设立你们，使你们出去结果子，并且使你们的果子长存，使你们奉我的名无论向父求什么，祂就赐给你们。」
    - type: paragraph
      text:
        ru: '«Ово вам заповиједам: да љубите једни друге.» (Ин.15:17)'
        cn: 「我命令你们彼此相爱。」（约翰福音 15:17）
    - type: paragraph
      text:
        ru: 'Све ово има један божански свециљ: богочовечанску љубав. Кроз све Своје речи и дела Спаситељ само њој води као кроз зраке сунцу. Као да то сачињава тајну свих светих тајни откривених на Тајној вечери, Он непрестано понавља и наглашава Своју заповест о љубави. Ево где је опет истиче: «ово вам заповедам да имате љубав међу собом» ( = да љубите један другог)».'
        cn: 所有这一切都有一个神圣的至高目的：神人圣爱。救主借着祂所有的言语和作为，只引领我们走向她，如同光线通往太阳。仿佛这构成了所有在最后的晚餐上所揭示的神圣奥秘中的奥秘，祂不住地重复并强调祂关于爱的诫命。看哪，祂又一次强调了它：「我将这些事吩咐你们，是要你们彼此之间拥有爱」(即：要彼此相爱)。
    - type: paragraph
      text:
        ru: «Ако вас мрзи свијет, знајте да је Мене омрзнуо прије вас. Кад бисте били од свијета, свјет би своје љубио, а како нисте од свијета него вас Ја изабрах од свијета, зато вас мрзи свијет.» (Ин.15:18–19)
        cn: «如果世人恨你们，你们该知道，在恨你们以先，已经恨我了。你们若属世界，世界必爱属自己的；只因你们不属世界，而是我从世界中拣选了你们，所以世人就恨你们了。» (约翰福音 15:18-19)
    - type: paragraph
      text:
        ru: 'Богочовек са Својим савршенствима стоји насупрот свету који «у злу лежи» (1Ин.5:19). Захваћен грехом, прожет логиком греха и зла, свет не трпи Бога. Шта више: мрзи Га. Јер је грех тиме грех што мрзи Безгрешног, и смрт тиме смрт што мрзи Бесмртног. Свет, некадања творевина Божија, толико се грехољубљем удаљио од Бога и иступио против Бога, да собом претставља врло сложено и врло снажно непријатељство према Богу. Тако, да све што је од света, самим тим је делимично и од греха. И као такво, мрзи Бога и све што је Божје.'
        cn: 神人以祂的完备德性对抗着「躺卧在恶者手下」的世界（约翰一书 5:19）。世界被罪掌控，被罪和恶的逻辑所渗透，不容忍上帝。不仅如此：它还憎恨祂。因为罪之所以为罪，乃在于它憎恨无罪者；死亡之所以为死亡，乃在于它憎恨不朽者。世界，这上帝曾经的创造物，因着对罪的痴迷，如此远离了上帝，并起来反抗上帝，以至于其自身构成了对上帝一种极其复杂且极其强大的敌意。如此一来，凡是属世界的，就因此也是部分属罪的。而作为如此之物，它憎恨上帝以及一切属上帝的事物。
    - type: paragraph
      text:
        ru: Заљубљен у зло, свет мрзи Христово добро; заљубљен у лаж, он мрзи Христову истину; заљубљен у таму, он мрзи Христову светлост; а кроз све те заљубљености он је уствари заљубљен у творца свих зала – ђавола, те стога и мрзи Христа Бога. Христов човек, живећи његовом божанском иотином, и правдом, и љубављу, одваја се од света, срођује се са божанским светом, и сав духовно рађа из Бога свим срцем својим, свом душом својом, свом мишљу својом и свом снагом својом. Тако, Христови људи нису од овога света, већ од Христовог, Божијег, оног. Зато их и мрзи овај свет, као што мрзи и Бога њиховог – Господа Хрисга.
        cn: 迷恋邪恶，世界憎恨基督的良善；迷恋谎言，它憎恨基督的真理；迷恋黑暗，它憎恨基督的光明；通过所有这些迷恋，它实际上迷恋着万恶的制造者——魔鬼，因此也憎恨基督上帝。属基督的人，活在他的神圣真理、公义和爱中，与世界分离，与神圣的世界相亲近，并且用他全心、全魂、全意和全力，完全地在灵性上由上帝重生。因此，属基督的人不属于这个世界，而是属于基督的、上帝的，那永恒的世界。正因此，这个世界也憎恨他们，如同它憎恨他们的上帝——主基督一样。
    - type: paragraph
      text:
        ru: 'Доласком Богочовека у овај свет извршена је по први пут јасна и одређена диференцијација између овог и оног света: шта је овај а шта онај свет; чему тежи један, а чему други, чиме живи један, а чиме друга; шта воли један, а шта друти. Иако у овом свету, Христови људи су свим бићем својим од онога света; а живе у овом свету да би га помоћу Христа и Његових светих божанских сила и врлина спасавали од греха, зла и ђавола. Нико није уништио толико греха, толико зла, толико смрти, толико ђавола, као они, зато их безмерно мрзе и греси и зла, и смрти и ђаволи. Спаситељ благовењсти: «ако свет мрзи вас, знајте да Мене омрзну пре вас. Кад би сте били од света, онда би свет љубио своје, а пошто нисте од света, него вас ја избрах од света зато вас мрзи свет».'
        cn: 随着神人来到这个世界，在此世与彼世之间第一次进行了清晰而明确的区分：什么是此世，什么是彼世；一者追求什么，另一者追求什么；一者靠什么存活，另一者靠什么存活；一者爱什么，另一者爱什么。尽管身在此世，属基督的人们却以他们整个的存在属于彼世；他们生活在此世，是为了借助基督及其神圣力量和美德，将此世从罪恶、邪恶和魔鬼中拯救出来。没有人像他们一样摧毁了如此多的罪恶、邪恶、死亡和魔鬼，因此罪恶、邪恶、死亡和魔鬼都无尽地憎恨他们。救主宣告说：「如果世界恨你们，你们就知道，它在恨你们以先已经恨我了。你们若属世界，世界必爱属自己的；但因为你们不属世界，而是我把你们从世界中拣选出来，所以世界就恨你们了。」
    - type: paragraph
      text:
        ru: '«Опомињите се ријечи коју вам Ја рекох: није слуга већи од господара својега. Ако Мене гонише, и вас ће гонити; ако Моју ријеч одржаше, и вашу ће одржати. Али све ће вам ово чинити због Имена Мојега, јер не познају Онога који Ме посла.» (Ин.15:20–21)'
        cn: 「你们要记念我所说的话：没有仆人大于自己的主人。他们若逼迫了我，也要逼迫你们；他们若遵守了我的话，也要遵守你们的话。但他们因我的名要向你们行这一切的事，因为他们不认识那差我来的。」 (约翰福音 15:20-21)
    - type: paragraph
      text:
        ru: 'Богочовечанска је благовест: Господ Христос је и по истини и по доброти и по љубави и по милости и по страдању и по пожртвовању и по животу несравњено већи од свих својих следбеника. У свему томе Он је увек божански господар, а они – слуге. Њихова судбина у свету предодређена је, и претсказана, Његовом судбином. Све што их снађе Њега ради, за њих је благовест. И страдања Њега ради, за њих су радост и благовест. Они су увек само апостоли (=посланици), следбеници, слуге, сведоци: себе никад не проповедају већ Њега – јединог Господа и Спаситеља; Њему следују, Њему служе, о Њему сведоче. А свет не прима Њега, не прима ни њих, јер богоборни греси задржавају срце света у тами незнабоштва и Христоборства. Помрачени грехољубљем ум света не зна, нити хоће да зна, правог и истинитог Бога, и стално служи лажним боговима: било стварима, или страстима, или лажним идејама, лажним теоријама, лажним мислима.'
        cn: 神人一体的福音是：主基督在真理上、在良善上、在爱上、在怜悯上、在苦难上、在牺牲上、在生命上，都无可比拟地远超祂所有的追随者。在所有这一切上，祂永远是神圣的主宰，而他们——是仆人。他们在这世上的命运被祂的命运所预定和预言。一切因祂的缘故临到他们身上的事，对他们而言都是福音。甚至因祂的缘故所受的苦难，对他们而言也是喜乐和福音。他们永远只是使徒（=使者）、追随者、仆人、见证人：他们从不传扬自己，而是传扬祂——独一的主和救主；他们跟随祂，侍奉祂，为祂作见证。然而世界不接纳祂，也不接纳他们，因为抵挡神的罪恶将世界的心 удержи在异教和敌基督的黑暗中。被爱罪之心蒙蔽的世界的心智，不知道，也不愿知道，那真实无伪的神，并持续侍奉虚假的诸神：无论是事物，是情欲，是虚假的观念，虚假的理论，还是虚假的思想。
    - type: paragraph
      text:
        ru: «Да нисам дошао и говорио им, не би гријеха имали; а сад изговора немају за гријех свој.» (Ин.15:22)
        cn: 「如果我没有来对他们说话，他们就没有罪了；但如今他们没有借口为他们的罪。」 (约翰福音 15:22)
    - type: paragraph
      text:
        ru: Од како је Бог Логос постао човек, и казао и показао у себи Бога на најочигледнији и најнесумњивији начин, људи више немају изговора за неверовање у Бога, за непознавање истинитог Бога. Никаква логика људска, ни индивидуална ни колективна; никаква машта људска, никакав ум људски, не може замислити ни измислити савршенијег, истинитијег, љупкијег, праведнијег Бога него што је Богочовек Христос.
        cn: 自从圣言上帝成为人，并在他自己里面以最显明、最无疑的方式言说并启示了上帝，人们就再也没有不信上帝、不认识真神的借口了。任何人类的逻辑，无论是个人层面还是集体层面；任何人类的想象，任何人类的心智，都无法构想或创造出比神人基督更完美、更真实、更慈爱、更公义的上帝。
    - type: paragraph
      text:
        ru: 'Исто тако људи не могу имати изговора ни за какав грех откако је Господ Христос живео у свету међу људима и на најсавршенији начин показао им живот без греха, живот сав изаткан од истине Божије од правде Божије, од Љубави Божије, од вечности Божије, и од свега Божијег. Отуда је сва нада Христовмх следбеника у милост и човекољубље Христово. И још: људи немају «сада», тј. од Христа и после Христа, изговоре за грехе своје нарочито стога што Господ Христос кроз свете тајне и свете врлине даје свакоме човеку божанске, благодатне силе, које му дају моћи да потпуно живи животом Христовим на земљи, да живи Христовом истином, Христовом правдом, Христовом љубављу, једном речју – Христовим Еванђељем. Сетити се треба апостолових речи: «ја више не живим него у мени живи Христос» (Гал.2:20). Немају људи више изговор за грехе, јер Господ Христос и данас и сутра и ваовек је аасти (Евр.13:8), и живи међ нама у богочовечанском телу Свом – Цркви, и Црквом нам даје све што нам је потребно за еванђелски живот.'
        cn: 同样，自从主基督活在世上，在人们中间，并以最完美的方式向他们展示了无罪的生活——一种完全由上帝的真理、上帝的公义、上帝的爱、上帝的永恒以及所有属于上帝的一切编织而成的生活——以来，人们就不能为任何罪找借口了。因此，基督的追随者所有的希望都在于基督的怜悯和人爱。此外，人们「现在」，即从基督开始直到基督之后，更没有为自己的罪找借口了，尤其因为主基督通过圣事和圣德，赐予每个人神圣的、满有神恩的力量，使他们有能力在地上完全活出基督的生命，活出基督的真理、基督的公义、基督的爱，一言以蔽之——活出基督的福音。应当记住使徒的话：「我不再是我活着，乃是基督在我里面活着」（加拉太书 2:20）。人们不再有为罪找借口了，因为主基督昨日、今日、直到永远，都是一样的（希伯来书 13:8），祂活在我们中间，在祂的神人同体的身体——教会之中，并通过教会赐予我们福音生活所需的一切。
    - type: paragraph
      text:
        ru: «Који мрзи Мене и Оца Мојега мрзи.» (Ин.15:23)
        cn: «恨我的，也恨我的父。» (约翰福音 15:23)
    - type: paragraph
      text:
        ru: 'Не може се веровати у истинитог Бога, ако се не верује у Христа, јер Он и јесте једини истинити Бог. Ко Христа не признаје за Бога, а сматра и тврди да верује у Бога, говори бесмислицу. Да, он може веровати у Бога лажног, у идола, у нешто што је сам прогласио за Бога. То може бити и духовне природе: нека идеја, нека теорија, иоти нека страст, неки порок; или нека врлина, неко добро без Бога; хуманизам, и хоминизам; или – култура или цивилизација, или техника, или мода, – све то људи проглашавају за свог бога, за своје богове.'
        cn: 人若不相信基督，便无法相信真正的上帝，因为基督正是那独一的真神。谁若不承认基督是上帝，却认为并声称自己相信上帝，乃是胡言乱语。是的，他可能相信一个假神，一个偶像，或他自己宣称为上帝的某个东西。这也可以是属灵性质的：某种理念，某种理论，甚至是某种情欲，某种恶习；或者某种美德，某种脱离上帝的良善；人本主义，以及唯人主义；或者——文化，或者文明，或者科技，或者时尚——所有这些，人们都宣称为自己的神，自己的众神。
    - type: paragraph
      text:
        ru: Али све те богове лако је проверити и видети да не располажу никаквим уистини божанским особинама, својствима, савршенствима. У њих нема апсолутне истине, стога је и не могу дати људима; Нема апсолутне правде, апсолутне мудрости, нема бесмртности, нема вечности, нема силе која савлађује грех, смрт, зло, ђавола, стога ништа од свега тога не могу лружити људима. А без тога, без истинитог Бога, мука је, очајање, ужас је, проклетство је бити човек. Ко мрзи Христа, уствари мрзи Бога и све што је божанско, свето, узвишено.
        cn: 然而，所有这些神都易于验证，并可看出它们不具备任何真正神圣的属性、特质和完美。它们之中没有绝对真理，因此也无法将真理赐予人类；没有绝对公义，没有绝对智慧，没有不朽，没有永恒，没有能胜过罪、死亡、邪恶、魔鬼的力量，因此它们也无法将这一切赐予人类。而没有这一切，没有真正的上帝，做一个人就是折磨、绝望、恐惧和诅咒。凡是憎恨基督的人，实际上是憎恨上帝，以及一切神圣的、圣洁的、崇高的事物。
    - type: paragraph
      text:
        ru: 'Стога Господ Христос и благовести: «који мрзи Мене, и Оца мог мрзи».'
        cn: 因此，主基督宣称：「恨我的，也恨我的父。」
    - type: paragraph
      text:
        ru: '«Да не творих међу њима дјела која нико други ије творио, не би гријеха имали; а сада су и видјели, и омрзнули и Мене и Оца Мојега. Али да се испуни ријеч написана у Закону њихову: Омрзнуше ме ни за што.» (Ин.15:24–25)'
        cn: 「我若没有在他们中间行过别人未曾行的事，他们就没有罪了；但如今他们也看见了，又恨我也恨我的父。这要应验他们律法上所写的话，说：『他们无故地恨我。』」（约翰福音 15:24-25）
    - type: paragraph
      text:
        ru: Шта је највећи, најочигледнији, и најубедљивији доказ да је Христос – истинити Бог и Господ? – Дела Његова. То је нешто најизузетније у роду људском. Јер нико други није чинио таква дела. Пође ли се од њих као чињеница у сфери људских стварности, она се могу објаснити једино божанском силом Христовом. Само Богу телу могао је чинити онаква дела. Ако није тако, покажите ми чињеницама, делима. Јер се дела могу објаснити, и замислити само делима. Не признати дела Христова за дела оваплоћенога Бога – чист је инат људски. Јер она су очигледна за свако људско биће. Гледати та дела, и мрзети Христа, врхунац је људског сатанизма. Јер сатана гледа Бога, види Бога, и мрзи га зато што је Бог. «А сад и видеше и омрзнуше и Мене и Оца Мога». Ако су људи икада омрзнули низашта неко биће онда су то учинили са Христом. И стварно, који год мрзи Христа, несумњиво га мрзи низашта. Јер до сада ниједан од христобораца и христомрзаца није могао изнети оправдан, иоле оправдан разлог за своју мржњу према Христу.
        cn: 什么才是最大、最明显、最有说服力的证据，证明基督是真神和主宰？——是祂的作为。这是人类中最为非凡的事。因为再没有人行过那样的作为。如果将它们视为人类现实领域中的事实，那么它们就只能靠着基督的神圣力量来解释。唯有道成肉身的神，才能行出那样的作为。如果不是这样，请用事实和作为向我证明。因为作为只能用作为来解释，也只能用作为来设想。不承认基督的作为是道成肉身之神的作为，纯粹是人的固执和悖逆。因为它们对每个世人来说都是显而易见的。看着那些作为，却恨恶基督，是人类撒旦主义的顶峰。因为撒旦看着神，看见神，却恨祂，只因祂是神。「现在他们已经看见，又恨恶我，也恨恶我的父了。」 (约翰福音 15:24) 如果人曾无缘无故地恨恶过某个生命，那么他们就是对基督这样做了。而事实上，任何恨恶基督的人，无疑是无缘无故地恨祂。因为直到如今，没有一个与基督为敌者和恨基督者能够提出一个正当的，哪怕是稍有道理的理由来解释他们对基督的恨恶。
    - type: paragraph
      text:
        ru: 'Са тугом човекољубиви Господ каже: «да нисам био дела творио међу њима која нико други не твори, не би греха имали: а сада и видеше, и омрзнуше и мене и Оца мога. Али да се збуде реч написана у закону њиховом: омрзнуше ме низашта».'
        cn: 带着忧伤，满有仁爱的主说：「我若没有在他们中间行过无人能行的事，他们就没有罪了；但如今他们已经看见，又恨恶我，也恨恶我的父。但这要应验他们律法上所写的话：『他们无故地恨我。』」（约翰福音 15:24-25）
    - type: paragraph
      text:
        ru: «А када дође Утјешитељ, кога ћу вам Ја послати од Оца, Дух Истине, који од Оца исходи, Он ће свједочити за Мене.» (Ин.15:26)
        cn: 当保惠师，就是我将从父那里差遣给你们的，那从父而出的真理的灵，来到的时候，他将为我作见证。（约翰福音 15:26）
    - type: paragraph
      text:
        ru: Богочовек делима својим показује да је Бог и Спаситељ. И многи га ипак мрзе. Ко ће тешити христољупце у тугама њиховим што многи Господа њиховог мрзе низашта? – Утешитељ = Дух Истине». Он ће на божански свеубедљив начин сведочити о Исусу да је Бог и Спаситељ. Дух Свети нема тело да би га христомрсци могли распети. Његово сведочанство биће најсилније сведачанство Бога о Багочовеку, Бога о Богу. Он долази у овет ради Богочовека и Његовог домостроја спасења. Богочоввк Га шаље од Оца да као Дух Истине продужи дело спасења људи извршено Богочовеком. «Он ће сведочити», за Христа, дајући људима благодатне силе, помоћу којих ће они Христово дело опасења претварати у своје.
        cn: 神人以祂的作为显明祂是上帝和救主。然而许多人却憎恨祂。谁将在爱基督之人因许多人无故憎恨他们的主而有的忧伤中安慰他们呢？——是保惠师，即真理之灵。祂将以神圣且完全令人信服的方式为耶稣作证，证明祂是上帝和救主。圣灵没有身体，以致于憎恨基督之人无法将祂钉上十字架。祂的见证将是上帝关于神人、上帝关于上帝最有力的见证。祂来到世上是为了神人及祂的救恩安排。神人从父那里差遣祂，使祂作为真理之灵，继续由神人所完成的人类救恩工作。「祂将为基督作证」，赐予人们恩典的力量，借此他们将把基督的救恩工作转化为他们自己的。
    - type: paragraph
      text:
        ru: 'Он ће сићи на Цркву, и остати занавек у Богочовечанском телу Цркве као душа Цркве. Сваки сутелесник Цркве то ће осетити, и осећа: да је Дух Свети у Цркви све и сва, као што је душа у телу све и сва. У Духу Светом и кроз Духа Светог делаће и Бог Отац и Бог Син, јер је дело спасења сваког човека, у крајњој линији, дело целе Свете Тројице. Духа Истине, «који од Оца излази», шаље у свет Господ Христос. И док сва Три Лица Пресвете Тројице заједнички обављају у Цркви спасење света, ипак овамо од њих остаје потпуно самостална и савршена Личност. Све им је заједничко, осим личних својстава.'
        cn: 祂将降临于教会，并永远留在教会这神人一体的身体中，作教会的灵魂。每一位教会的肢体都将感受到，并且正在感受到：圣灵在教会中是万有与一切，正如灵魂在身体中是万有与一切。在圣灵里并借着圣灵，天父和圣子都将行事，因为最终，每个人的救赎工作是整个圣三一的工作。真理的圣灵，「祂从父出来」，被主基督差遣到世上。然而，即便至圣圣三一的所有三个位格在教会中共同施行世界的救赎，在他们中间，却仍然留有一个完全独立且完美的位格。除各自的位格属性外，他们的一切都是共同的。
    - type: paragraph
      text:
        ru: Лично својство Оца је нерођеност, Сина – рођеност, Духа Светог – исхођење.
        cn: 圣父的位格特质是无生，圣子的——受生，圣灵的——发出。
    - type: paragraph
      text:
        ru: 'Отац је тиме Отац што рађа Сина и исходи Духа; Син је тиме Син што се рађа од Оца; Дух је тиме Дух што исходи од Оца. Отац је корен и извор Божанства: једно је Божанство свих Лица, једна природа, једна воља, једна делатност. Али, иако је Отац «корен» и «извор», ипак Он ни по чему није пре Сина и Духа, јер су и Син и Дух савечни Оцу по Божанству, и у свему равни. Дело спасења света, изнршено Богочовеком, открило нам је јасно истину: да је Бог један по бићу, Тројичан по Лицима. То им Спас и казује овом благовешћу: «А кад дође Утешитељ, кога ћу вам послати од Оца, Дух Истине, Који од Оца излази, Он ће сведочити за мене».'
        cn: 父因此是父，因为祂生子并发出圣灵；子因此是子，因为祂由父而生；圣灵因此是圣灵，因为祂由父发出。父是神性的根源和泉源：所有位格的神性是一，本性是一，意志是一，行动是一。然而，尽管父是「根源」和「泉源」，祂却绝不先于子和圣灵，因为子和圣灵在神性上与父同享永恒，并在一切上平等。由神人所完成的世界救赎工作，清楚地向我们启示了真理：即上帝在本质上是一，在位格上是三位一体的。救主以这番报喜之言向他们宣告：「但当保惠师来时，就是我将从父那里差祂来给你们的真理的灵，祂从父出来，祂将为我作证。」（约翰福音 15:26）
    - type: paragraph
      text:
        ru: «А и ви ћете свједочити, јер сте од почетка са Мном.» (Ин.15:27)
        cn: 「你们也要作见证，因为你们从起头就与我同在。」 (约翰福音 15:27)
    - type: paragraph
      text:
        ru: Сведочанство Духа Истине о Истини бива на безброј начина, а за људе – најчешће преко људи. Аиостоли су постали прави и савршени сведоци Господа Христа тек онда када је Дух Свети сишао иа њих. Он им је објаснио и осветлио оно искуство које су они стекли живећи заједно са Господом Исусом три и по године. Он их је «потсетио на све», увео их у сваку Његову богочовечанску истину, и тек им је онда постало сасвим јасно ко је Исус и шта Он значи.
        cn: 真理之灵对真理的见证以无数种方式发生，而对人来说——最常见的是通过人。使徒们只有当圣灵降临在他们身上时，才成为主基督真实而完美的见证人。他向他们解释并照亮了他们与主耶稣共同生活三年半所获得的经验。他「提醒他们一切」，引导他们进入祂每一项神人二性的真理，然后他们才完全清楚耶稣是谁以及祂意味着什么。
    - type: paragraph
      text:
        ru: 'Њихово сведочанство сво је засновано на искуству личном; све је ту емпирично, опитно, лично: «Не можемо не говорити што видесмо и чусмо». «Што чусмо, што видесмо очима својим, што расмотрисмо и руке наше опипаше», то – «сведочимо» (1Ин.1:1–2).'
        cn: 他们所有的见证都建立在个人经验之上；其中一切都是实证的、亲身经历的、个人的：「我们不能不说我们所看见和听闻的。」「我们所听闻的，我们亲眼所看见的，我们所仔细察看的，我们亲手所摸过的」——这些我们都「作见证」（约翰一书 1:1-2）。
    - type: paragraph
      text:
        ru: 'Зато Спас и вели ученицима Својим: «А и ви ћете сведочити, јер сте од почетка са Мном».'
        cn: 因此，救主对祂的门徒说：「你们也要作见证，因为你们从起初就与我同在。」
  - type: heading2
    text:
      ru: Глава шеснаеста. Опроштајна беседа, обећање Светога Духа
      cn: 第十六章. 告别讲论，圣灵的应许
    children:
    - type: paragraph
      text:
        ru: «Ово сам вам казао да се саблазните. Изгониће вас из синагога; Али долази час када ће сваки ко вас убије мислити да Богу службу приноси.» (Ин.16:1–2)
        cn: 「我已将这些事告诉你们，使你们不至于跌倒。人要把你们赶出会堂；并且时候将到，凡杀你们的，就以为是事奉神。」(约翰福音 16:1-2)
    - type: paragraph
      text:
        ru: 'Опроштајна беседа, обећање Светога Духа Све што је Спас досад рекао, рекао је да Његове ученике не би изненадила мржња света на Хрисста и на њих; и још: да их не би изненадила гоњења, мучења, која ће подносити због Христа. «Ово вам казах да се не саблазните»: да не помислите: какав је то Бог када ми оволико страдамо сведочећи за Њега?'
        cn: '告别讲道，圣灵的应许


          救主到目前为止所说的一切，都是为了让祂的门徒不至于对世人憎恨基督和他们感到惊讶；还有：不至于对他们将因基督而忍受的迫害、折磨感到惊讶。「我把这些事告诉你们，是要叫你们不至于跌倒」：以免你们会想：当我们为祂作见证而承受如此多的苦难时，这到底是个怎样的上帝呢？'
    - type: paragraph
      text:
        ru: Какав је то Спаситељ, када се не појављује да нас спасе од мука, од невоља, од многих смрти? – А Он то чини, Он своје следбенике није претворио у телесне бесмртнике, да људи не би, видевши то, сви пошли за Христом, не из љубави према Њему, и из убеђења да је Он Бог и Спаситељ, него просто запрепашћени чудесима, просто механички пошли за Њим, без учешћа слободне воље, него заробљени неодољившрћу чудеса. Госспод Христос неће роботе, хоће слободне људе. А свет ће се толико механизирати, аутоматизирати, роботизирати, да ће одбацивати и гонити и убијати христоносце и христопроповеднике, зато што све препуштају слободној вољи људској; што никога не приморавају ни на добро, ни на љубав, ни на милосрће, ни на праведност. Јер какво ми је то добро, и та љубав, кад су изнуђени?
        cn: 当他没有显现来拯救我们脱离痛苦、患难和众多死亡时，他又是怎样的救主呢？——然而，他确实如此做。他没有将他的跟随者变成肉身不朽者，以免人们看到之后，都去跟随基督，不是出于对他的爱，也不是出于他就是上帝和救主的信念，而只是被神迹所震惊，只是机械地跟随他，没有自由意志的参与，而是被神迹的不可抗拒性所俘虏。主基督不想要机器人，他想要自由的人。然而，世界将如此地机械化、自动化、机器人化，以至于会摒弃、迫害并杀害基督的承担者和基督的传道者，因为他们将一切都交由人类的自由意志；因为他们不强迫任何人去行善、去爱、去慈悲、去公义。因为当善和爱是被强迫之时，那对我而言又算是什么善和什么爱呢？
    - type: paragraph
      text:
        ru: 'Чим су изнуђени, они су престали бити добро и љубав, и постали механички процес механичког човека – робота. Постали то, и тим самим престали бити и добро и љубав. Дијалектика зла ће бити толико разрађена од људи, логика зла ће толико постати логика људи, да ће они убијати Христоносце – Богоносце, сматрати да истински служе човечанству, том свом божанству. На то указују Спасове речи, упућене Његовим следбеницима: «Изгониће вас из зборница; а доћи ће време кад ће сваки који вас убије мислити да Богу службу чини».'
        cn: 一旦他们是被胁迫的，他们就不再是良善和爱了，而成为了一个机械人的机械过程——一个机器人。成为那样之后，他们也因此不再是良善和爱了。邪恶的辩证法会被人们如此精心阐述，邪恶的逻辑会如此成为人们的逻辑，以至于他们会杀害基督承载者——上帝承载者，并认为自己是在真正地事奉人类，那个他们自己的神性。救主的这些话语指明了这一点，是向祂的追随者说的：「他们要把你们赶出会堂；并且时候将到，凡杀你们的，就以为是事奉神。」(约翰福音 16:2)
    - type: paragraph
      text:
        ru: «И то ће чинити, јер не познаше Оца ни Мене.» (Ин.16:3)
        cn: «他们将做这事，因为他们未曾认识父，也未曾认识我。» (约翰福音 16:3)
    - type: paragraph
      text:
        ru: А прави узрок тога биће у томе што људи нису хтели да познаду и прианаду истинитог Бога. А нико им није више доказа дао о себи као таквом истинитом Богу од Господа Христа. Па кад и у њему не виде; не познају и не признају Бога, онда – су збиља незнабошци и богоборци. Јер у свему Христовом присутна је Пресвета Тројица, једини истинити Бог и Господ, присутна свим својим божанским савршенотвима и силама. То не видети, значи заиста бити добровољни и свесни роб и робот логике зла, демонске дијалектике зла. То незнабошгво се обично пројављује у животу људском као непознавање истинског добра; онда људи зло проглашују за добро, лаж за истину, неправду за правду, мрак за светлост, смрт за живот. Јер не-зна-божац, не знајући Бога – не зна ни шта је истинско добро, ни шта истинска правда, ни шта права истина.
        cn: 而其真正原因在于，人们不愿认识并归附真神。而没有人比主基督更能向他们显明自己是那样的真神。那么，当他们甚至在他里面也看不见、不认识、不承认神时，他们就真是异教徒和与神为敌者。因为在基督的一切中，至圣三位一体，独一的真神和主，以其所有的神圣完全性和能力临在。看不见这一点，就意味着真是那邪恶逻辑、那邪恶的魔鬼辩证法的自愿且有意识的奴隶和机器人。这种异教徒行径通常在人类生活中表现为不认识真正的良善；然后人们就把恶宣告为善，谎言为真理，不义为公义，黑暗为光明，死亡为生命。因为不认识神的人，不认识神，就不知道什么是真正的良善，不知道什么是真正的公义，也不知道什么是真正的真理。
    - type: paragraph
      text:
        ru: У њега је све преврнуто тумбе, све изопачено, јер има «изопачен ум» – «људи разореног ума, иструлелог у злу и греху ума, који своје умовање обавља увек посредовањем логике зла, која се у њему угнездила и потпуно потисла логику добра (1Тим.6:5).
        cn: 他里面的一切都颠倒了，一切都败坏了，因为他有「败坏的心思」——「心智败坏的人，思想腐烂在邪恶和罪中的人，他们的思维总是通过邪恶的逻辑来运作，这逻辑已在他里面扎根，并且完全压制了良善的逻辑 (提摩太前书 6:5)。」
    - type: paragraph
      text:
        ru: 'Незнабожац је обично најпре умни неваљалац, интелектуални неваљалац, а затим и практични и емпирични неваљалац. У њега постоји интелектуално, логичко, дијалектичко оправдање зла, које се згодном приликом транссубјективизира, и постаје емпириском чињеницом у спољњем свету. А све су то разне трансформације једне, и само једне стварности душевне: незнабоштва, непризнавања Христа за Бога и Господа. То Господ и наглашава говорећи: «И ово ће чинити, јер не познаше Оца ни Мене».'
        cn: 未识神者通常首先是心智上的恶棍，理智上的恶棍，然后才是实践上和经验上的恶棍。在他身上存在着对邪恶的智识上的、逻辑上的、辩证性的辩护，这在适当的时机跨主体化，并成为外部世界中的经验性事实。而这一切都是一种，而且是唯一一种灵魂实相的各种转变：不认神，不承认基督是上帝和主。主也强调这一点，他说：「他们要作这事，因为他们未曾认识父，也未曾认识我。」（约翰福音 16:3）
    - type: paragraph
      text:
        ru: '«Али ово сам вам казао да се, када дође час, сјећате овога да вам Ја казах; а испочетка не казах вам ово, јер бијах с вама. А сада идем Ономе који Ме посла, и нико Ме од вас не пита: куда идеш? Али зато што сам вам ово казао, жалост је испунила срце ваше. Но Ја вам истину говорим; боље је за вас да Ја одем, јер ако Ја не одем, Утјешитељ неће доћи к вама; ако ли одем, послаћу Га к вама.» (Ин.16:4–7)'
        cn: «但我把这些事告诉你们，是要叫你们到了时候，可以想起我已告诉你们了；我起先没有告诉你们这些事，因为我与你们同在。但现在我往那差我来的那里去，你们中间没有人问我：你往哪里去？只因我把这些事告诉你们，忧愁就充满了你们的心。然而我将真情告诉你们，我去了是与你们有益的；我若不去，保惠师就不到你们这里来；我若去了，就差他到你们这里来。» (约翰福音 16:4-7)
    - type: paragraph
      text:
        ru: 'Свим овим Спаситељ показује какво место у богочовечанском домостроју сласења заузима страдање. Истовремено Он даје и оправдање страдања, и смисао и циљ. Оно је неопходно, јер је саставни део оне органске богочовечанаке целине коју називамо спасење. Само оно је пролаз и прелаз у радост, кроз тугу у радост, кроз смрт у васкрсење. На њњму стоји божански печат оних речи које је Спас изговорио за себе и своје страдање: «треба много пострадати» (Мф.16:21;Лк. 17:25; 9:22). Ту је много надумног, несхватљивог, али је све – божанско, богочовечанско, испуњено божанском логиком спасења. Али, тај божански смисао страдања човек не може да схвати без благодати: треба најпре да се испуни Духом Светим, да се Њиме освети и просвети, и тек онда осети и схвати смисао страдања. Пример најбољи: свети апостоли. На Тајној Вечери, а и пре тога, они никако не могу да схвате зашто је потребно да страда тако диван човек, као што је њихов учитељ. Зато се срце њихово испуњује тугом. А Спаситељ их теши. Киме? – Опет Утешитељем. Јер Утешитељ има доћи у свет тек када Богочовек заврши свој богочовечански подвиг спасења света: «боље је за вас да ја одем». И заиста се показало «боље», јер чим се узнео на небо, Спас је послао с неба Божанског Утешитеља.'
        cn: '通过这一切，救主展现了苦难在神人救赎计划中所占据的位置。与此同时，祂也赋予了苦难以合理性、意义和目的。苦难是必要的，因为它是我们称之为救赎的那个有机神人整体的组成部分。唯有苦难是通向喜乐的道路和过渡，是穿越忧伤到达喜乐，是穿越死亡到达复活。苦难上印有神圣的印记，正是救主论及祂自己和祂的受难时所说的话：「必须受许多的苦」（马太福音 16:21，路加福音 17:25，9:22）。其中有许多超乎理智、难以理解之处，但一切都是神圣的、神人性的，充满着救赎的神圣逻辑。


          然而，人若没有恩典，就无法领悟苦难的神圣意义：人必须首先被圣灵充满，被祂圣化和光照，然后才能感受并理解苦难的意义。最好的例子：圣使徒们。在最后的晚餐上，甚至在那之前，他们都无法理解为什么像他们老师这样一位奇妙之人必须受苦。因此，他们的心里充满了忧伤。然而救主安慰了他们。借着谁呢？——又是借着保惠师。因为保惠师只有在神人完成祂救赎世界的受难功绩之后才会来到世上：「我去了对你们有益。」事实确实证明「有益」，因为救主一升入天堂，就从天上差遣了神圣的保惠师。'
    - type: paragraph
      text:
        ru: «И кад Он дође, покараће свет за гријех, и за правду, и за суд. За гријех, дакле, што не вјерују у Мене; За правду пак, што идем Оцу Својему, и више Ме нећете видјети; А за суд, што је кнез овога свијета осуђен.» (Ин.16:8–11)
        cn: 「他既来了，就要叫世人为罪、为义、为审判，自己责备自己。为罪，是因他们不信我；为义，是因我往父那里去，你们就不再看见我；为审判，是因这世界的王受了审判。」 (约翰福音 16:8-11)
    - type: paragraph
      text:
        ru: 'Утешитељ долази у наш свет због Господа Христа. И то долази да нам каже божанско мишљење о поступању света прњма Спаситељу света. И кротки Утешитељ, иако долази да теши и продужи спасење света, Он ће најпре покарати, изобличити – свет за три ствари: за грех, за правду, за суд. За какав грех? – За неверовање у Христа. То је највећи грех; сви се остали греси, посредно и непосредно, изводе из њега, извиру из њега. А тај грех су људи разрадили до генијалности: јер су мучили Спаситеља, били и убили Њега који је дошао да их спасе, и спасао их је од греха, смрти и ђавола, тј. од пакла и свега пакленога. Не веровати у Христа, то је: одбацити Бога, Божју Истину, Божју Правду, Божју Љубав, Божју Вечност, небо, рај, сва божанска савршенства, и свесно и с љубаовљу остати у греху, у смрти, у злу, у паклу, у свему ђаволском. Зар има већи грех од тога?'
        cn: 保惠师降临我们的世界，是因着主基督的缘故。祂降临是为了告诉我们神对世界对待世界救主之方式的神圣看法。那温柔的保惠师，虽然祂来是为了安慰并延续世界的救赎，但祂首先要为三件事责备、定罪世界：为罪、为义、为审判。为何罪？——为不信基督的罪。这是最大的罪；所有其他罪，或间接或直接，都源于它，出自它。而人类更是将这罪恶发展到了极致：因为他们折磨了救主，鞭打并杀害了那位来拯救他们的人，并且祂已经将他们从罪、死亡和魔鬼中拯救出来，即从地狱和一切属地狱的事物中拯救出来。不信基督，就是：拒绝神、神的真理、神的公义、神的爱、神的永恒、天堂、乐园，以及一切神圣的完美；并且有意地、带着喜爱留在罪中、死亡中、邪恶中、地狱中，以及一切属魔鬼的事物中。难道还有比这更大的罪吗？
    - type: paragraph
      text:
        ru: 'Покараће свет још? – «За правду, што идем к Оцу Своме, и више Ме нећете видети». «За правду?» – А «правда Божја» је Христос, Бог Логос оваплоћени. Он је у свету човечанском оличавао телом сву правду Божју: сву је учовечио и оваплотио.'
        cn: '世界还要受审判吗？—— «因着公义，我往我父那里去，你们就不再看见我了。»

          «因着公义？»

          —— 而「神的公义」就是基督，道成肉身的上帝圣言。祂在人类世界中以身体体现了上帝的全部公义：祂将这公义完全人性化并使之道成肉身。'
    - type: paragraph
      text:
        ru: 'А људи? – хтели су да се ослободе те правде, да је отерају из свога земаљскога света, да је не буде више у свету, да постане невидљива за свет. Зато су и распели, и у гроб отерали «правду Божју» – Господа Христа. И Он је заиста узнео се са телом к Оцу, и постао невидљив за свет: «нећете ме више видети», ма да су Га апостоли виђали после васкрсења 40 дана, и касније се много пута јављао њима и својим следбеницима, као што се и сада јавља. Рекао им је: «и више ме нећете видети», као претставницима христоборних људи, грехољубивих и богоборних. И заиста, за њих је Спас невидљив. Но иако се телом узнео к Оцу, Он је сав својим божанством, свим божанским силама својим остао у Црксви, и Духом Светим дела из ње непрекидно, све до Страшнога Суда.'
        cn: 然而世人呢？他们想要摆脱那公义，将其从自己的尘世驱逐出去，使其不再存在于世上，使其对世界而言变得不可见。因此他们也便将「上帝的公义」——主基督——钉上十字架，并将其逐入坟墓。而祂确实带着身体升到父那里，并对世界而言变得不可见：「你们将不再看见我」，尽管使徒们在祂复活之后，曾看见祂四十天，并且之后多次向他们和祂的追随者显现，正如祂现在仍然显现一样。祂对他们说：「你们将不再看见我了」，是作为与基督为敌之人的代表，是那些爱罪恶并与上帝为敌之人。而确实，对他们而言，救主是不可见的。然而，即使祂身体升到父那里去了，祂仍以祂的全部神性，以祂所有的神圣力量留在了教会中，并借着圣灵，在其中不间断地工作，直到可怕的审判日。
    - type: paragraph
      text:
        ru: 'Дух Свети покараће свет још «за суд, што је кнез овога света осућен». Да, људи, су извршили суд над Богом: најсрамнији и најодвратнији, какав ни демони нису извршили кад је у пакао сишао. Људи су осудили на смрт Кнеза, Владара овога света, Творца и Сведржитеља и Спаситеља. Има ли безумнијег суда од тога: осудити Бога, и то на смрт? Само за тај грех, колико ли паклова заслужују људи! Али, у бескрајном човекољубљу свом, Господ Христос опрашта «хулу на Сина човечјег». Јер Га та љубав чини јединим и јединственим Спаситељем света. Да ље није имао, већ да је само по правди овојој судио, од света не би остало ништа, прошао би горе од Содома и Гомора, јер је грех христоубиства несравњено већи од свих грехова учињених у овоме свету, од Адама па све до Страшнога Суда. Као Творац, и Сведржитељ, и Спаситељ, Господ Христос је заиста Владар овога света. Али људи су сеојим грехољубљем изабрали за овога владара – ђавола, и он је постао кнез овога света који у злу лежи, у злу, у које су га људи свалили својим гресима.'
        cn: 圣灵将进一步责备世人，「为审判，是因这世界的王受了审判」。是的，世人已经审判了上帝：这是最可耻、最令人憎恶的审判，连恶魔在他降入阴间时都未曾施行过。世人竟将这世界的君王、统治者、创造主、全能的维系者和救主判处死刑。还有比这更疯狂的审判吗：竟然审判上帝，而且判他死刑？仅仅为了这罪，世人该当承受多少地狱之苦啊！然而，在祂无限的爱世人之中，主基督赦免了「亵渎人子」的罪。因为这爱使祂成为世上独一无二的救主。如果他没有这爱，而只是按着他的公义审判，那么世上将一无存留，其遭遇将比所多玛和蛾摩拉更惨，因为杀害基督的罪，比从亚当直到末日审判为止世上所犯的一切罪都无可比拟地大。作为创造主、全能的维系者和救主，主基督确实是这世界的统治者。但世人因着对罪的喜爱，选择了魔鬼作为这世界的统治者，于是他便成了这世界的君王，一个沉沦于邪恶之中的世界，被世人以罪恶所拖入的邪恶之中。
    - type: paragraph
      text:
        ru: «Још вам имам много говорити, али сада не можете носити.» (Ин.16:12)
        cn: 「我还有许多事要告诉你们，但你们现在担当不了。」（约翰福音 16:12）
    - type: paragraph
      text:
        ru: «Још вам много имам казати», – јер Бога – ко ће исказати, нарочито Бога у телу? Ма колико било о Њему казано, несравњено више остаће неказано. Јер су у Њему сабране и оваплоћене све тајне Бога и ове тајне човека, сав живот Бога и сав живот човека. Зато исто Свети Еванђелист и вели на крају овог Еванћеља да «ни у сав свет не би могле стати књиге написане» о Исусу, када би се написало «оно што учини Исус» (Ин.21:25), а камоли када би се написало све што је Исус – Богочовек. Но Господ Христос је говорио Својим ученицима оно што је најважније за спасење света; то је продужио да им говори и преко свог Духа Светог, Утешитеља. Ено, Духом Светим својим Он говори Своје Еванђеље и преко Павла, и преко Петра, и преко Јакова, и преко Јуде, – јер све то што су они написали у својим Посланицама, и што сачињава Нови Завет – сачињава једно и исто, недељиво и божанско Еванђеље Богочовека Господа Христа. Све то Он им је казао касније, када их је благодаћу Духа Светога оспособио, осветио, обожио, те су могли С радошћу носити сав терет проповеди светог Еванђеља. А сада не на Тајној Вечери? – «Сада не можете носити». А моћи ће од дана Свете Педесетнице, када Дух Свега буде сишао на њих.
        cn: 「我还有许多事要告诉你们」——因为上帝——谁能完全言明呢？尤其是在肉身中的上帝？无论对祂说了多少，仍有无可比拟的更多将未被言说。因为在祂里面，上帝的一切奥秘和人类的这些奥秘都已汇集并道成肉身，上帝的全部生命和人类的全部生命亦是如此。因此，同一位圣福音书作者在这卷福音书的末尾说道，如果将「耶稣所行的事」都写出来，那么「所写的书，就是世界也容不下了」（约翰福音 21:25），何况是要写出耶稣——这位神人的一切呢？然而，主基督向祂的门徒们说了那对于世界的救赎最为重要的事；祂也藉着祂的圣灵，那位保惠师，继续向他们述说这些。看哪，祂藉着祂的圣灵，也透过保罗、彼得、雅各和犹大宣讲祂的福音——因为他们在其书信中所写的一切，以及构成了新约的一切，都构成了神人主基督的同一个、不可分割的、神圣的福音。所有这些，祂都在后来才告诉了他们，那时祂已藉着圣灵的恩典使他们具备能力、圣化他们、使他们神化，以致他们能以喜乐的心承担传扬神圣福音的全部重任。那现在在最后的晚餐上呢？——「现在你们不能承受」。但从圣五旬节那天起，当圣灵降临在他们身上时，他们就能够了。
    - type: paragraph
      text:
        ru: «А када дође Он, Дух Истине, увешће вас у сву истину; јер неће говорити од Себе, него ће говорити оно што чује, и јавиће вам оно што долази. Он ће Мене прославити, јер од Мојега ће узети, и јавити вам. Још мало, и нећете Ме видјети, и опет мало и угледаћете Ме, јер Ја идем Оцу.» (Ин.16:13–15)
        cn: 「但当他，真理的灵来了，他会引导你们进入一切真理；因为他不会凭自己说话，而是说他所听见的，并且要将未来的事指示给你们。他要荣耀我，因为他要从我的领受，并指示给你们。再过片刻，你们就看不见我了；再过片刻，你们又要看见我，因为我往父那里去。」 （约翰福音 16:13-15）
    - type: paragraph
      text:
        ru: '«А кад дође Он, Дух истине, упутиће вас на сваку истину, јер неће говорити од себе, него ће говорити што чује, и јавиће вам што ће бити убудуће. – Он ће ме прославити, јер ће од мога узети – и јавиће вам. Све што има Отац Моје је: зато рекох да ће од мога узети, и јавити вам». – «Дух истине» уводи у сваку истину богочовечанску, у сваку истину Бога Логоса. Сама Истина води Истини и уводи у Истину. Бескрајну и свесавршену Божанску Истину Тројичног Божанства Богочовек је кроз своје Еванђеље рашчланио у безброј истина, да би их свет могао лакше примити. Као што рашчлањује и расипа једно сунце у безброј зракова, који су пријемчиви за људе и остале твари, а не убацује цело сунце у сваког човека, ни твар, Јер би их спржило; тако поступа и са божанском Истином. Једна је Истина, она је просто Свеистина. И та Истина, која је увек и по свему Свеистина, јесте Тројично Божанство. Ту нам је Свеистину донео собом и објавио Својим Еванђељем Господ Христос; ту исту Свеистину доноси и Дух Свети, и објављује на овој ипостасни начин; а ту Свеистину има и Бог Отац. Нема ту ни супротности, ни противречности. Дух Свети, кад говори Свеистину, не говори «од себе», већ од Тројичног Божанства; тако и Син, тако и Отац. Свеистина је њихово биће; она је у свему што је њихово. Свако Лице Свете Тројице говори ту Свеистину и «од себе», јер је свака од њих као Ипостас носилац и ималац те Свеистине. Од како је Богочоввк са Духом Истине у овету, ми знамо Истину, јер нас Дух Истине упућује у сваку истину. Знајући Истину, ми знамо и шта је лаж. Лаж је ове што није од Христа, од Духа Истине, од Тројичног Божаиства; и што не води Тројичном Божанству. За наш човечански свет, сва Истина, Свеистина оваплоћена је у Богочовека Христа, и са Њим и кроз Њега присутна у нашем свегу.'
        cn: '«当他，真理的灵来的时候，他要引导你们进入一切真理；因为他不是凭自己说话，乃是只说他所听见的，并要把将来的事告诉你们。——他将荣耀我，因为他要从我的领受，并要告诉你们。凡父所有的，都是我的：所以我说他要从我的领受，并要告诉你们»。（约翰福音 16:13-15）


          「真理的灵」引人进入每一项神人真理，进入每一项圣言神的真理。真理本身引人归向真理，并引导人进入真理。无限且全然完美的、三一神性的属神真理，神人通过祂的福音将其分解为无数真理，以便世人能更容易地领受。正如祂将一个太阳分解并散布为无数光线，这些光线是人类及其他受造物所能领受的，而祂不将整个太阳投入每个人或每件受造物中，因为那样会烧毁他们；祂对待神圣真理亦是如此。真理是独一的，它简直就是全然真理。而那真理，它无论何时何地都是全然真理，就是三一神性。主基督以祂自己将这全然真理带给我们，并以祂的福音将其彰显；圣灵也带来这全然真理，并以这种位格的方式将其彰显；而圣父神也拥有这全然真理。在这其中既无对立，也无矛盾。圣灵在宣讲全然真理时，不是「凭自己说话」，而是出于三一神性；圣子亦然，圣父亦然。全然真理是他们的本质；它存在于他们的一切所有之中。圣三一的每一个位格都宣讲这全然真理，也是「凭自己」来宣讲，因为他们每一个位格作为位格，都是这全然真理的承载者和拥有者。自从神人与真理的灵同在世上以来，我们便认识了真理，因为真理的灵引导我们进入每一个真理。认识了真理，我们也就知道什么是谎言了。谎言是那些不源于基督、不源于真理的灵、不源于三一神性的，以及那些不引向三一神性的。对于我们人类世界而言，所有的真理，这全然真理，都道成肉身于神人基督之中，并且藉着祂，并通过祂，临在于我们的万有之中。'
    - type: paragraph
      text:
        ru: 'Он је тело Свеистине. А то тело Свеистине јесте Црква, која је богочовечанско Тело Његово. Зато је «Црква – стуб и тврђава Истине» (1Тим.3:15), Свеистина, која је њоме постала наша емпирија, наше искуство, наша стварност. Тако, Истина више није појам, или теорема, или схема, већ – тело, стварност, искуство. – Хришћани знају Духом Светим сву Истину о Богу, о свету, о човеку, о судбини света. И почетне и заоршне циљеве свега они знају. И то: Духом Светим знају. Ето Дух Свети је кроз свете књиге Новога Завета казао будуће – шта ће се збити и са родом људским и са оветом. Узети само апостола Павла: он само оно ради што му Дух Свети налаже; и унапред провиди много од тога. Па апостол Петар, па Јован Богослов, и остали свети видиоци и прозорљивци, сви духоносци и духоношени.'
        cn: 祂是全真理的身体。而这全真理的身体就是教会，她是祂神人同体的身体。因此，「教会是真理的柱石和根基」（提摩太前书 3:15），这全真理借着她成为我们的经验、我们的经历、我们的现实。如此，真理不再是一个概念，或一个定理，或一个图式，而是一个身体，一个现实，一个经历。——基督徒借着圣灵知晓一切关于上帝、关于世界、关于人类、关于世界命运的真理。他们也知晓万物的起始和最终目的。并且，他们是借着圣灵知晓的。看哪，圣灵借着新约圣书宣示了未来——人类和世界将要发生的一切。单看使徒保罗：他只做圣灵指示他的事；并且预先洞悉了其中许多。还有使徒彼得，还有神学家约翰，以及其他圣洁的先见者和预言家，所有的承灵者和被灵感动者。
    - type: paragraph
      text:
        ru: '«Још мало, и нећете Ме видјети, и опет мало и угледаћете Ме, јер Ја идем Оцу. Тада неки од ученика Његових рекоше међу собом: Шта је то што нам каже: Још мало, и нећете Ме видјети, и опет мало и угледаћете Ме, и: идем Оцу? Говораху, дакле: Шта је то што каже: мало? Не знамо шта говори. А Исус разумије да хтједоше да Га ипитају, па им рече: Зато ли се запиткујете међу собом, што рекох: Још мало, и нећете Ме видјети, и опет ммало, и угледаћете Ме. Заиста, заиста вам кажем да ћете ви заплакати и заридати, а свијет ће се радовати; и ви ћете жалосни бити, али ће се ваша жалост окренути на радост. Жена кад рађа трпи муку, јер дође час њезин; а када роди дијете, више се не опомиње жалости, због радости што се роди човјек на свијет. И ви, дакле, имате сада жалост; али ћу вас опет видјети, и радоваће се срце ваше, и радост вашу нико неће узети од вас. И у онај дан нећете Ме питати ништа. Заиста, заиста вам кажем да што год заиштете од Оца у Име Моје, даће вам. До сада не искасте ништа у Име Моје; иштите и добићете, да радост ваша буде испуњена.» (Ин.16:16–24)'
        cn: 「还有一点点时间，你们就看不见我了；又过了一点点时间，你们又要看见我了，因为我往父那里去。」他的门徒中有几个人就彼此说：「他对我们说的是什么呢？『还有一点点时间，你们就看不见我了；又过了一点点时间，你们又要看见我了』，又说：『因为我往父那里去』？」他们又说：「他所说『还有一点点时间』是什么意思呢？我们不明白他所说的。」耶稣知道他们想要问他，就对他们说：「你们彼此询问我所说的『还有一点点时间，你们就看不见我了；又过了一点点时间，你们又要看见我了』，是为此吗？我实实在在地告诉你们，你们将要哭泣哀号，而世人却要欢乐；你们将要忧愁，但你们的忧愁将变为喜乐。妇人生产的时候就痛苦，因为她的时辰到了；但当她生下孩子之后，她就不再记念那痛苦了，因为有一个人降生到世上了，她就喜乐了。你们现在也是忧愁；但我将再见到你们，你们的心将要喜乐，你们的喜乐也没有人能从你们那里夺去。到那日，你们就不会再问我什么了。我实实在在地告诉你们，你们奉我的名向父求什么，他就必给你们。到如今你们没有奉我的名求过什么；你们只管求，就必得着，好叫你们的喜乐得以满足。」 (约翰福音 16:16-24)
    - type: paragraph
      text:
        ru: 'Да се Спасове речи: «више ме нећете видети» (Ин.16:10), односе на апостоле као на претставнике рода људског, а не на њих као и на ученике, показују нам ове речи Спаситељеве: «Још мало, и нећете ме видети, и опет мало, па ћете ме видети: јер идем к Оцу». И заиста, док је Спас био у гробу, од погреба до васкрсења, апостоли Га нису виђали; кад је васкрсао, они су Га опет виђали, – и Он је у слави узишао к Оцу. Али, на Тајној Вечери неки од ученика нису могли разумети ове речи Спасове. Зато им Он предано и објашњава, да се оне односе на његову смрт и васкрсење. Њетова смрт биће за њих тешка туга, али ће Његово васкрсење из мртвих ту тугу претворити у радост. Туга је велика то, јер је мука велика: као у жене породиље; али је и радост велика када се туга велика заврши – рађања детета, и смрт – васкрсењем.'
        cn: 救主的话语：「你们将不再看见我」（约翰福音 16:10），指的是使徒们作为人类的代表，而不是指他们作为门徒，救主的这些话语向我们表明了这一点：「还有片时，你们就不再看见我了；再过片时，你们还要看见我，因为我往父那里去。」 确实，当救主在坟墓里时，从安葬到复活，使徒们没有看见他；当他复活时，他们又看见了他——他便在荣耀中升到父那里去了。但是，在最后的晚餐上，某些门徒无法理解救主的这些话。因此，他忠实地向他们解释，这些话指的是他的死和复活。他的死对他们来说将是深重的悲伤，但他从死里复活将把那悲伤变为喜乐。那悲伤是深重的，因为痛苦是巨大的：就像分娩的妇人；但当那深重的悲伤结束时，喜乐也是巨大的——因着孩子的诞生，以及死亡——因着复活。
    - type: paragraph
      text:
        ru: 'Туга ученика биће краткотрајна, а радост од васкрсења – вековечна и неисказана: «и радоваће се срце ваше, и радост вашу нико неће узети од вас». – «Нико неће узети од вас», нико од људи, нико од демона, нико од осталих бића, јер ће она постати душа душе ваше, и биће бића вашег, постати саставни део вашег вечног Еванђеља, Богочовековог Еванђеља. «Нико»: ни смрт, ни мучитељи, ни гонитељи, ни убице. Јер ће радост васкрсења постати ваша бесмртност, ваша вечност, недосежна ни за какву смрт или пролазност.'
        cn: 门徒的忧伤将是短暂的，而复活的喜乐将是永恒且不可言喻的：「你们的心就喜乐，这喜乐也没有人能从你们夺去。」——「没有人能从你们夺去」，无论是人，无论是魔鬼，无论是其余的受造物，因为这喜乐将成为你们灵魂的灵魂，你们存有的存有，成为你们永恒的福音、神人性的福音中不可分割的一部分。「任何事物」都无法夺去：无论是死亡，是施虐者，是迫害者，是杀人者。因为复活的喜乐将成为你们的不朽，你们的永恒，是任何死亡或消逝都无法企及的。
    - type: paragraph
      text:
        ru: '«И у онај дан нећете ме питати ни за шта»: и заиста, кад су Га видели васкрсла, они су од радости занемели: јер су све муке биле скинуте с душе њихове, и сва питања решена. Христос је васкрсао, – шта нам више треба? Шта је то на шта нам Он Својим васкрсењем није одговорио? Као васкрсли Богочовек, и притом неисказани човекољубац, Он – бесмртни и вечни добротвор рода људског – нуди људима сва блага бесмртности и вечног живота. Васкрснувши из мртвих, и узневши се са телом на небо, Господ Христос је дао свеубедљив доказ да је заиста Бог и Спаситељ, Бог који располаже свим божанским богатствима. Зато и одлучно благовесга: «Заиста, заиста вам кажем да што год узшитете – у Оца у Име Моје, даће вам». «Даће вам што год узиштете»: тиме ће се радост ваша употпуњавати, дак не буде потпуно испуњена. Јер сте ученици васкрслог и вечноживог човекољупца Бога: Господа Исуса Христа. «Иштите и примићете, да радост ваша буде испуњена». А они, освећени и просвећени Духом Светим искаће само оно што служи спасењу и њих и света.'
        cn: 「『在那个日子，你们不会问我任何事了』」：确实，当他们看到祂复活时，他们喜乐得说不出话来；因为他们灵魂的一切痛苦都被挪去了，所有问题都得到了解决。基督已经复活了——我们还需要什么呢？有什么是祂借着祂的复活没有回答我们的呢？作为复活的道成人身者，并且是难以言喻的爱人者，祂——人类不朽与永恒的施恩者——向人们提供不朽与永恒生命的一切美善。从死里复活，并带着身体升天之后，主基督已经提供了确凿无疑的证据，证明祂确实是上帝和救主，一位拥有所有神圣丰盛的上帝。因此，祂也坚定地宣告：「『我实实在在地告诉你们，你们无论向父求什么，祂必因我的名赐给你们。』」「『祂必赐给你们你们所求的一切』」：借此，你们的喜乐将得以完全，直到完全充满。因为你们是复活且永活的爱人者上帝的门徒：即主耶稣基督。「『祈求就必得着，使你们的喜乐得以满足。』」而他们，被圣灵分别为圣和光照之后，将只求那些有助于他们自己和世界得救赎的事。
    - type: paragraph
      text:
        ru: «Ово сам вам говорио у причама; али долази час кад вам више нећу говорити у причама, него ћу вам отворено јавити о Оцу. У онај дан ћете у Име Моје заискати, и не кажем да ћу Ја умолити Оца за вас; Јер сам Отац љуби вас, зато што сте ви љубили Мене, и вјеровали да Ја од Бога изиђох. Изиђох од Оца, и дошао сам на свијет; опет остављам свијет, и идем Оцу.» (Ин.16:25–28)
        cn: 「我已用比喻对你们说了这些；但时刻将到，我不再用比喻对你们说，而是要清楚地告诉你们关于父的事。到那日，你们将奉我的名祈求，我并不说我会为你们恳求父；因为父自己爱你们，就因为你们爱我，又相信我从神而来。我从父出来，来到世上；我又离开世界，往父那里去。」 (约翰福音 16:25-28)
    - type: paragraph
      text:
        ru: 'Када васкрсењем Својим и вазнесењем Својим буде унео у душе својих ученика нова искустаа, која ће душе њихове продубити и узвисити безгранично, тада ће им Он Духом Светим отворено казивати тајне Божје, отворено (слободно), а не завијено «у причама». Тада ће им «отворити ум» да разумеју Пиомо (Мф.24:45): и Оца помоћу оваплоћеног Сина. Све дотле, Отац Бог за њих је далека апстракција, или наднебеска, недокучива стварност. Седећи с десне стране Оца са својим Богочовечанским телом после неисказано велике жртве за род људски, Господ Христос ће своје беагранично човекољубље пренети и на Оца, и умилостављавати Њега према несрећном роду људоком, увек грехољубивом, и стога – слабом. Оно што Бог Отац највише цени код људи, то је христољубље. Стога их и највише воли.'
        cn: 当祂藉着祂的复活和升天，将新的体验带入祂门徒的灵魂中，这些体验将无限地深化并提升他们的灵魂时，那时祂将通过圣灵向他们敞开宣讲上帝的奥秘，公开地（坦然地），而不是「在比喻中」隐晦地。那时祂将「开启他们的心智」，使他们明白圣经（马太福音 24:45）：以及藉着道成肉身的圣子来认识父。在此之前，父上帝对他们来说是一个遥远的抽象概念，或者是一个超乎诸天之上、不可企及的现实。在为人类献上无法言喻的巨大牺牲之后，主基督带着祂的神人身体坐在父的右边，祂将祂无限的爱人类之心传递给父，并为不幸的人类，即那总是爱罪且因此软弱的人类，向祂求恩。父上帝最看重世人的，就是爱基督的心。因此祂也最爱他们。
    - type: paragraph
      text:
        ru: Јер ко има љубави према Христу, одбацио је грех, и нема љубави према злу. Љубав према Христу, љубав је према Богу и вера у Бога. Јер љубећи Христа, човек уствари љуби Бога, јер све што је Христаво толико је свето, узвишено, божанско, да је Он – несумњиво Бог. Отуда се из те љубави према Христу рађа и вера у Њега као Бога. Вера која је сва заснована на љубави према свему божанском у Њему, и на поверењу у Њога као човекољубивог Бога. Да вера у Христа као Бога заснива се на личном искуству доживљене љубави према његовој Божанској Личности и божанским делима. Показујући неизмерним човекољубљем себе као Бога, Господ Христос изазива у људима љубав према себи као према Богу. А из те љубави се и рађа вера у Њега као Бога. Вера, чија је основа – поверење у човекољубивог и благог Бога и Господа. А на том васцелом божанском путу, којим се креће чудесна Личност Богочовека Христа биће људско га и може пратити само љубављу и вером. Јер само тако види да је Он, Бог Логос, од Оца изишао, и дошао на свет; и опет оставља свет и кроз вазнесење иде к Оцу.
        cn: 因为凡爱基督的，就已弃绝了罪，也不爱邪恶。爱基督，就是爱上帝并信靠上帝。因为人爱基督，实际上就是爱上帝，因为凡属基督的一切，都是如此圣洁、崇高、神圣，以致祂——无疑是上帝。因此，从这爱基督的心中，也诞生了对祂作为上帝的信仰。这信仰完全建立在爱祂里面一切神圣之事的基础上，并建立在信靠祂是爱世人的上帝之上。是的，对基督作为上帝的信仰，是建立在个人经验上，即亲身经历到对祂神圣位格和神圣作为的爱。主基督以其无限的爱世之心彰显自己是上帝，从而唤起人们对祂作为上帝的爱。而从这爱中，也诞生了对祂作为上帝的信仰。这信仰的基础是——信靠那爱世且良善的上帝和主。在那神人基督奇妙位格所行的整条神圣道路上，人类只有通过爱和信仰才能跟随祂。因为唯有如此，人才能看见祂，即上帝圣言（Logos），从父而出，来到世上；又再次离开世界，藉着升天回到父那里去。
    - type: paragraph
      text:
        ru: '«Рекоше Му ученици Његови: Ето сад отворено говориш, и причу никакву не говориш. Сада знамо да све знаш, и не треба да Те ко пита. По томе вјерујемо да Ти од Бога изиђе. Исус им одговори: Сада ли вјерујете? Ево долази час, и већ је дошао, да се разбјегнете сваки на своју страну, а Мене сама оставите; али нисам сам, јер је Отац са Мном.» (Ин.16:29–32)'
        cn: 「祂的门徒对祂说：『看哪，现在你明明白白地讲，不用比喻了。现在我们知道你凡事都知道，用不着人问你。因此我们相信你是从神出来的。』耶稣回答他们说：『现在你们相信吗？看哪，时候将到，且已经到了，你们各人要分散到自己的地方去，留下我独自一人；但我并不孤独，因为父与我同在。』」 (约翰福音 16:29-32)
    - type: paragraph
      text:
        ru: 'На Тајној Вечери ученици и не слуте кроз каква ће ове искушења проћи њихова вера у Христа. Готово ће је нестати. А права вера није друго до непрвкздно доживљавање Христа и његовог Еванђеља као суштине овога свакоднввног живота. Тако се вера и проба и прекаљује. Чврста вера у Христа је код многих мучних христочежњивих подвига, који одводе Христу и утврђују човека у Њему. Ти су подвизи: еванђелска љубав, и молитва, и пост, и кротост, и трпљење, и смерност, и све остале еванђелске врлине. Свака је од њих жива сила као подвиг. Доживљује ли их човек, кроз њих расте вера његова у све већу и већу. Да, врлине еванђелске уопште расту једна кроз другу и помоћу друге. Свака је другој и помоћница и сила. Вера слаби без осталих врлина, па је најзад и нестане.'
        cn: 在最后的晚餐上，门徒们甚至没有预料到他们对基督的信仰将经历怎样的试炼。几乎会消失殆尽。然而，真正的信仰不过是持续不断地体验基督和祂的福音，将其作为这日常生活的精髓。信仰就是如此得到考验并得到磨炼的。坚固的基督信仰存在于许多艰苦的、渴慕基督的功修之中，这些功修引人归向基督，并在祂里面坚固人。这些功修是：福音的爱、祷告、禁食、温柔、忍耐、谦卑，以及所有其他的福音美德。它们当中的每一个，作为一种功修，都是一种活泼的力量。若人体验它们，通过它们，他的信仰会变得越来越大。是的，福音的美德总体而言彼此通过对方并借助对方而成长。每一种美德对另一种美德既是帮助者，也是力量。若没有其他的美德，信仰会衰弱，最终消失。
    - type: paragraph
      text:
        ru: «Ово сам вам казао, да у Мени мир имате. У свијету ћете имати жалост; али не бојте се, Ја сам побиједио свијет.» (Ин.16:33)
        cn: 「我将这些事告诉你们，是要叫你们在我里面有平安。你们在世上会有苦难；但你们不要怕，我已经胜了世界。」（约翰福音 16:33）
    - type: paragraph
      text:
        ru: 'А са осталим врлинама она јача, док не постане свемоћна и свесилна. Тада она изгони из себе сваки страх, и усељује у душу човекову ненарушив мир: мир од осећања и сазнања: да је Христос свепобедна сила која побеђује сва зла овога света, а на првом месту: грех, смрт и ђавола. Иако су ово троје свим бићем полегли по овом свету, и поробили га, ипак су немоћни и беспомоћни у борби против Христових следбеника. Јер је Богочовек зато и дошао у овај свет, да победи у њему све зле силе.'
        cn: 并且它与其余美德一同增强，直到它变得全能且满有能力。那时它便将一切恐惧从自身驱逐出去，并在人的灵魂中安放不可动摇的平安：这平安是出于感受与确知：基督是全然得胜的权能，它战胜了这世上的一切邪恶，首先是罪、死亡和魔鬼。尽管这三者已全然盘踞此世并奴役了它，然而在对抗基督追随者的争战中，它们却软弱无力且毫无助益。因为道成肉身的神人正是为此来到这世上，为要在此世战胜一切邪恶的权能。
    - type: paragraph
      text:
        ru: Истина, оне нарочито нападају и муче христоносце, али им не могу ништа, јер они Христом који је у њима савлађују свет и сва зла која су у њему. Зато их васкрсна радост никад не напушта, ни у највећим мукама и невољама не напушта.
        cn: 诚然，它们专门攻击并折磨基督承载者，但对他们却无能为力，因为他们靠着住在他们里面的基督，胜过了世界和其中一切的邪恶。因此，复活的喜乐永不离开他们，即便在最大的痛苦和患难中，也绝不离弃他们。
    - type: paragraph
      text:
        ru: 'То све благовести Сладчајши Гошод говорећи: «Ово вам казах, да у Мени мир имате. У свету ћете имати невољу; али не бојте се, Ја надвладах свет».'
        cn: 所有这一切，至甘甜的主宣讲说：「我已把这些事告诉你们，为要使你们在我里面有平安。在世上你们必有患难，但你们放心，我已经胜过了世界。」（约翰福音 16:33）
  - type: heading2
    text:
      ru: Глава седамнаеста. Христова првосвештеничка молитва
      cn: 第十七章 基督的大祭司祷告
    children:
    - type: paragraph
      text:
        ru: '«Ово изговори Исус и рече: Оче, дошао је час, прослави Сина Својега, да и Син Твој прослави Тебе; Као што си Му дао власт над сваким тијелом, да свему што си Му дао, дарује им живот вјечни.» (Ин.17:1–2)'
        cn: 耶稣说了这些话，又说：「父啊，时候到了，求你荣耀你的儿子，使你的儿子也荣耀你；正如你曾赐给他权柄管理凡有血气的，叫他将永生赐给你所赐给他的人。」 (约翰福音 17:1-2)
    - type: paragraph
      text:
        ru: 'Чиме то Отац прославља Сина а земљи, и Син Оца? Отац тиме што својим човекољубивим благовољеањвм учествује у богочовечанском домостроју спасења, у коме Син побеђује грех, смрт и ђавола, ослобаћа род људски од тога, и васкрсењем му даје бесмртност и живот вечни. А Син тим што је добровољно, из бескрајног човекољубља, изиршио подвиг спасења света. Грех је срамота и пораз људске природе; то нам је дао Адам; бесмртност и живот вечни је слава људске природе, – то нам даје очовечени Бог Логос. Спасеи човек, – то је слава и Оца и Сина, и радост њихова. Грехољубив човек, то је туга и Оца и Сина. Грехом човек претвара себе из бесмртног у смртно биће. А то значи: у ружно, трулежно, смрдљиво, пролазно. Кроз грех пак ђаво задобија власт над човеком, и влада смрћу над родом људским, и сва бића људска претвара у смртна. Богочовек пак, као победилац греха, смрти и ђавола, има власт и моћ «да свему да живот вечни». Јер је човек, сва природа људска, створена за бесмртност и живот вечни. Помоћу греха ђаво одузима свакоме човеку живот вечни; помоћу Еванђеља Господ Христос даје свакоме човеку живот вечни.'
        cn: '父在地上如何荣耀子，子又如何荣耀父呢？


          父藉着祂的爱人如己的恩慈，参与了神人同体的救赎经济；在这经济中，子战胜了罪、死亡和魔鬼，从而将人类从这一切中解放出来，并藉着复活赐予人类不朽和永生。而子藉着祂出于无限的爱人如己之心，自愿完成了救赎世界的壮举。罪是人性的羞辱和失败；那是亚当给予我们的；而不朽和永生则是人性的荣耀——那是道成肉身的神——圣言（Logos）——赐予我们的。得救之人——那是父与子的荣耀，也是他们的喜乐。嗜罪之人，那是父与子的忧伤。


          人藉着罪将自己从不朽的生命转变为必死的生命。而这意味着：变得丑陋、腐朽、恶臭、转瞬即逝。藉着罪，魔鬼获得了掌控人的权力，并以死亡统治人类，将所有人类的生命都变为必死的。而神人，作为罪、死亡和魔鬼的得胜者，拥有权柄和能力「将永生赐予万物」。因为人，即整个人性，被创造是为了不朽和永生。藉着罪，魔鬼从每个人那里夺走永生；藉着福音，主基督赐予每个人永生。'
    - type: paragraph
      text:
        ru: 'У томе је васцела тајна рода људског бића. Кроз грех ђаво је повео човека путем смрти који води у пакао; кроз Еванђеље Богочовек води човека путем вечнога живота који води у рај. Ту силу и власт дао је Христу као човеку Бог Отац, зато Спас и вели Оцу за себе, Сина: «Као што си му дао власт над сваким телом, да свему што си му дао да живот вечни». Тиме је казан сав циљ, и уткана тајна Спаситељевог Боговаплоћења.'
        cn: 这就是人类存在的全部奥秘。藉着罪，魔鬼将人引上了通往地狱的死亡之路；藉着福音，神人（基督）将人引上了通往天堂的永生之路。这权柄和能力是父神赐予基督作为人的，所以救主论及自己，即圣子时，对父说：「正如你赐给他权柄管理凡有血气的，使你所赐给他的人都能得着永生。」（约翰福音 17:2）至此，全部旨意已然揭示，救主道成肉身的奥秘亦已织入其中。
    - type: paragraph
      text:
        ru: «А ово је вјечни живот да познају Тебе једнога истинитога Бога и кога си послао Исуса Христа.» (Ин.17:3)
        cn: 「这就是永生，使他们认识你这独一的真神，并认识你所差来的耶稣基督。」 (约翰福音 17:3)
    - type: paragraph
      text:
        ru: 'Шта је живот вечни? «Ово је живот вечни: да знају Тебе јединог и истинитог Бога, и Исуса Христа кога си послао» Живот вечни је познавање Свете Тројице, тог јединог истинитог Божанства; познавање = признавање = исповедање. А то бива помоћу Богочовека, који је ради тота и постао човек: да нам да истинско познање о Богу, и благодатне силе за живот у Богу. То се богопознање стиче држањем заповести Божјих, творењем воље Божје, која је сва изражена у Христу и његовом Еванђељу (Ин.7:17;Еф.1:9). Све је то практично и прагматично; све засновано на искуству, опиту, емпирији. За све то даје нам силе Богочовек: оваплотивши се у човека, Он је показао да је Бог оваплотљив у човеку, да су божанске силе оваплотљиве, остварљиве у човеку и нашем човечанском свету. Он је стога и проповедао спасење, тј. живот вечни, и у исто време дао људима «све божанске силе своје које су потребне за живот (вечни) и побожност» (2Пет.1:3). Живећи помоћу тих божанских сила човек се саоваплоћује Богочовеку, и на тај начин постаје «заједничар у Божјој природи» (2Пет.1:4), а тиме и стиче истинско богопзнање.'
        cn: 什么是永生？「认识你独一的真神，并认识你所差来的耶稣基督，这就是永生。」永生就是认识圣三一，认识那位独一的真神性；认识 = 承认 = 宣认。而这乃是借着道成肉身的神人而实现的，神人正是为了此而成为人：为了赐给我们关于上帝的真知，以及在上帝里生活的恩典力量。这种认识上帝的知识是通过遵守上帝的诫命，实行上帝的旨意而获得的，上帝的旨意完全彰显在基督和他的福音中（约翰福音 7:17，以弗所书 1:9）。这一切都是实践性的和实用性的；这一切都建立在经验、体证和实证之上。神人赐予我们所有这些力量：通过道成肉身成为人，他表明上帝是可以在人里面道成肉身的，神圣的力量是可以在人以及我们人类世界中道成肉身并实现出来的。因此，他也宣讲了救恩，即永生，并且同时赐给人们「神的一切神能，就是一切关乎生命（永生）和敬虔的事」（彼得后书 1:3）。借着这些神圣的力量生活，人与神人一同道成肉身，从而成为「与神的性情有份的人」（彼得后书 1:4），借此也获得了真正的认识上帝的知识。
    - type: paragraph
      text:
        ru: 'Уствари, постиже обожење, постаје «бог по благодати», добија живот вечни. Те божанске силе унедрене су у светим тајнама и светим врлинама; живећи у њима, човек зна прави смисао, вечни смисао људскога бића, и иде путем који кроз Истину води у живот вечни (2Пет.1:5–9). Све пак то значи: живети Богочовеком помоћу еванђелске вере, љубави, наде, молитве, поста, кротости, смерности и осталих саветих еванђелских врлина. – Људи ван Богочовека, и без Богочовека, даве се у смрти и у смртном; гуше се у отровној магли и тами грехова, у мраку незнабоштва. Јер све то што ми називамо културом, науком, цивилизацијом, а нема у себи ни Христа ни Његовог Еванђеља, није друго до човекоубилачко незнабоштво, људождерско безбоштво. Јер не знати јединог истинитог Бога значи бити безбожник. Незнабоштво је безбоштво; незнабожац је безбожник. – И Отац и Син познају се стварно и истински једино Духом Светим. То је Спас најочигледније показао на Тајној Вечери. Тако: познање јединог истинитог Бога је познање које се добија од Оца кроз Сина у Духу Светом. А то: Црквом. Јер Дух Свети је душа у телу Цркве: и Њиме се даје све. Доказ? Света Педесетница. А у Цркви – никад не престаје Педесетница, ДуховДан.Она и јесте Духовдан, продужен кроза све векове.'
        cn: 实际上，他达成了神化，成为「按恩典而成的神」，获得了永恒的生命。这些神圣的力量根植于圣奥秘和神圣的德行之中；生活在其中，人便知晓了人类存在真正的、永恒的意义，并行走在一条通过真理引向永恒生命（彼得后书 1:5-9）的道路上。然而，这一切意味着：借助福音的信心、爱、希望、祷告、禁食、谦和、谦卑以及其余圣洁的福音德行，在神人中生活。——在神人之外，且没有神人的人们，沉溺于死亡和必死的事物中；他们窒息在有毒的迷雾和罪恶的黑暗里，在异教的幽暗中。因为我们所称之为文化、科学、文明的一切，若其自身既没有基督也没有祂的福音，则无异于杀人的异教，食人的无神论。因为不知道独一的真神，就意味着是无神者。异教就是无神论；异教徒就是无神者。——圣父和圣子实在地、真正地被认识，唯独藉着圣灵。救主在最后的晚餐上最明显地显明了这一点。因此：对独一真神的认识，是从圣父藉着圣子在圣灵里获得的认识。而这：借由教会。因为圣灵是教会身体中的灵魂：并且一切都是借由祂所赐予的。证据？神圣的五旬节。而在教会中——五旬节，圣灵降临节，永不停止。她就是圣灵降临节，延续至所有世代。
    - type: paragraph
      text:
        ru: «Ја Те прославих на земљи; дјело сврших које си Ми дао да извршим. И сада прослави Ти Мене, Оче, утебесамога, славом коју имадох утебеприје него свијет постаде.» (Ин.17:4–5)
        cn: 我已在地上荣耀了你；你交给我去做的工，我已完成了。父啊，现在求你用你自己的荣耀来荣耀我，就是我在创世以前与你同享的荣耀。(约翰福音 17:4-5)
    - type: paragraph
      text:
        ru: 'Уочи своје спасоносне крсне смрти и васкрсења са вазнесењем, Спас се налази пред свршеним делом Својим искупљења и спасења света. Све је урадио што је требао да уради, све казао, све свршио. Тиме је осигурао живот вечни човеку, људима. А кроз то прославио Свога Оца, који и створио човека за живот вечни. У томе је и слава Сина као Сатворца. А у тој слави Богочовека и слава човека, људске природе. Поставши човек, Бог Логос је замрачио своје Божанство завесом тела (ср.Евр.10:20). Али победивши телом својим смрт тела, и тело Бога Логоса заблистаће вечном славом вечног живота, те ће тако и оно учествовати у вечној и неисказаној слави Тросунчаног Божанства. На све то указују ове речи Христове: «Ја Тебе прославих на земљи: посао свришх – који си ми дао да радим. И сад прослави Ти мене, Оче, утебесамога славом коју имадох утебепре него свет постаде».'
        cn: 临近祂救赎性的十字架受死、复活并升天之际，救主正面临着祂已完成的救赎与拯救世界之工。祂已做成了祂需要做的一切，说了祂需要说的一切，完成了祂需要完成的一切。借此，祂确保了人类和众人得享永生。借此，祂荣耀了祂的父，那创造人类以享永生者。在此之中亦是子作为协同创造者的荣耀。而在那神人的荣耀中，亦是人的荣耀，人性的荣耀。既已成为人，神—逻各斯以身体为幔子遮蔽了祂的神性（参 希伯来书 10:20）。但祂以祂的身体战胜了身体的死亡，甚至神—逻各斯的身体也将以永生的永恒荣耀而闪耀，如此它也将参与在永恒且不可言喻的三日神性（三一真神）的荣耀中。基督的这些话语指明了这一切：「我已在地上荣耀了祢；祢交给我做的工，我已经完成了。现在求父用祢自己所有的荣耀，就是未有世界以先我与祢同享的荣耀来荣耀我。」
    - type: paragraph
      text:
        ru: «Објавих Име Твоје људима које си Ми дао од свијета; Твоји бијаху па си их Мени дао, и Твоју су ријеч одржали.» (Ин.17:6)
        cn: 「我已将你的名显明给你从世上赐给我的人；他们本是你的，你就把他们赐给了我，他们也遵守了你的道。」(约翰福音 17:6)
    - type: paragraph
      text:
        ru: Име јединог истинитог Бога било је до појаве Богочовека скоро непознато. Од многих имена лажних богова оно се није ни осећало ни чуло. Тако у човеку као посебном бићу, тако и у роду људском као целини. Иако је у боголикој души човековој Име Божје написано словима неугасиве светлјости, човек га је претрпао толиким тамама греха, толиким тамама лажних идеја, осећања, лажних богова, да се оно и не види. Тако исто урадио је и род људски. Бог Логос је и дошао у свет, да те таме многе уклони са боголиких душа људских, да их потсети да они носе у себи име и сјај јединог истинитог Бога. Који соу га примили и послушали, заиста су познали јединог истинитог Бога. А који нису, ти су га распели. Како тада, тако и увек отада, тако и сада.
        cn: 独一真神之名，在神人显现之前，几乎不为人知。在众多假神之名中，它既不被感知，也不被听闻。无论是人作为一个独特的生命，还是整个人类作为一个整体，都是如此。尽管在人那神似的灵魂中，神之名以不灭之光辉的字母写下，人却用如此多的罪恶黑暗、如此多的虚假思想、情感、假神之黑暗将其覆盖，以致它不复可见。整个人类亦是如此行事。圣言上帝降世，正是为要除去人那神似的灵魂中众多的黑暗，提醒他们，他们里面带着独一真神之名和荣光。那些接受并顺从祂的人，确实认识了独一真神。而那些不接受的，却将祂钉死。无论是那时，还是自那时起直到如今，还是现今，皆是如此。
    - type: paragraph
      text:
        ru: 'Људи који еванђелски озбиљно завире у душу своју, увек у суштини њеној пронађу да су Божји, да су божанског, тројичног порекла. А који не узимају озбиљно душу своју, они лакомислено тврде како човњк, људи, нису створења Божја, већ дело «природе», «воде», риба, мајмуна. И увек остају незнабошци = безбожници. Само истинито богопознање даје нам истинито човекопознање. И обратно. На то нам указује ова благовест Спасова: «Ја јавих Име Твоје људима које си ми дао од света; Твоји бејаху па си их Мени дао, и Твоју реч одржаше».'
        cn: 那些以福音真理严肃审视自己灵魂的人，总能在其本质中发现他们是属神的，是神圣的、三位一体的起源。而那些不认真对待自己灵魂的人，则轻率地声称人类并非神的受造物，而是「自然」、「水」、「鱼」或「猴子」的产物。他们也因此始终是异教徒，即无神论者。唯有真正认识神，才能使我们真正认识人。反之亦然。救主的这番福音宣告向我们指明了这一点：「我已将你的名显明给那些你从世上赐给我的人；他们原是你的，你将他们赐给了我，他们也遵守了你的道。」 （约翰福音 17:6）
    - type: paragraph
      text:
        ru: Људи који се осећају Божјим створењима, а не пролазним и трошним производом пролазног и трошног света, држе реч Божју као нешто своје, блиско, рођено. Они у Еванђељу Божјем и осећају и виде нешто, по природи своје, зато баш што је потпуно божанско, тројично свето. То не осећају људи који су се зарили у свет као нешто безбожно, нешто не-божје; који све своје биће своде на свет, и изводе из света, изједначују га са светом и његовим стихијама; који сматрају да је њихово порекло потпуно од овога света; да у њима нема ничег божанског, небеског, да нису од овога света.
        cn: 那些感觉自己是神的受造物，而非短暂易逝且朽坏的世界的短暂易逝且朽坏的产物的人，将神的道视为自己的，亲近的，如同与生俱来的。他们在神的福音中，既感受到又看见了某种事物，就其本质而言，正因为它完全是神圣的，是三一神圣的。那些沉溺于世界，将其视为无神、非神性之物的人，不会感受到这一点；他们将自己的全部存在归结于世界，并从世界中引申出来，将其等同于世界及其元素；他们认为自己的起源完全来自这个世界；认为他们里面没有任何神圣的、属天的东西；认为他们不属于这个世界。
    - type: paragraph
      text:
        ru: Све то претвара људе у беспомоћне глисте, у духовне глисте. А од глисте може ли се очекивати да подигне очи к Богу, к небу, и да држи реч Божју, Еванћеље Божје? Та све је то за њу лудост, беомислица, утопија. Она има своје сићушне лавиринте, и уввк је задовољна њима, задовољна својим љигама, она – самозадовољна и самодовољна, увек аутаркична – глиста љигава.
        cn: 所有这一切都把人变成了无助的蠕虫，变成了属灵的蠕虫。而我们能指望一条蠕虫仰望上帝，仰望天堂，并持守上帝的话语，上帝的福音吗？因为对它而言，这一切都是愚昧，毫无意义，乌托邦。它有它狭小的迷宫，并且总是满足于这些迷宫，满足于它的黏液，它——自满自足，永远自给自足——是一条黏滑的蠕虫。
    - type: paragraph
      text:
        ru: «Сад разумјеше да је све што си Ми дао од Тебе. Јер ријечи које си Ми дао, дао сам њима; и они примише, и познаше заиста да од Тебе изиђох, и вјероваше да Ме Ти посла.» (Ин.17:7–8)
        cn: 「现在他们明白了，你所赐给我的一切都是来自你。因为你所赐给我的话语，我已赐给他们；他们也领受了，并且确实知道我是从你那里出来的，也相信是你差遣了我。」（约翰福音 17:7-8）
    - type: paragraph
      text:
        ru: 'Држећи заповести Божје човек истински прогледа и јединог истинитог Бога угледа у Христу, и кроза Њу Његовом Оцу. Он постепено долази до потпуног Богопознања, сазнања и убећања: Да све што је Богочовеково уствари је Тројичног Божанства. То бива кад човек свим срцем и свом душом прими речи Еванђеља Христовог, и живи у њима и по њима. Тада се све то пројављује кроз разне еванђелске врлине и подвиге: веру, љубав, молитву, пост… А све врлине једнодушно и сложно израђују у души човековој истинско познање о Богу. Етичка тријада: вера, љубав и нада, и остале врлине са њима, одводе Божанској тријади.'
        cn: 遵守上帝的诫命，人才能真正开眼，并通过基督得见独一真神，并借着祂（基督）得见祂（基督）的父。他逐渐达到对上帝完整的认识、理解和确信：即凡属道成肉身者，实则皆属三一上帝。这发生于人全心全意地接受基督福音的教诲，并活在其（教诲）中、依照其（教诲）生活之时。届时，这一切都将通过各种福音的美德和功修而彰显：诸如信德、爱德、祈祷、斋戒等。而一切美德则同心合一地在人的灵魂中成就对上帝的真正认识。伦理三德：信德、爱德和望德，以及其他与它们同在的美德，都导向神圣的三一上帝。
    - type: paragraph
      text:
        ru: 'Познање о Богу даје се само за живот у Богу. Истинско богопознање је плод живљења у једном истинитом Богу. У истинитој побожности је истинско богопознање. Побожност, живот по Богу казује нам аву тајну о Богу. Спас зато и благовести: «Сад дознадоше да је све што си ми дао од Тебе. Јер речи које си дао Мени дадох им; и они примише и истински познадоше – да од Тебе изиђох, и вероваше да си Ме Ти послао». «Примише и – познадоше» – то је гносеолошки императив христопознања. Прими Христа вером, и – познаћеш Га. Та вера у почетку није друго до поверење у Христа: да Он, овакав никад, не може и неће обманути човека. Тада, та вера, почевши од поверења, расте кроз дела еванђелска, и доживљује, у ове већу и јачу веру, док се потпуно не облагодати, и постане дар Духа Светога (1Кор.12:9).'
        cn: 对上帝的认识唯独赐予那些在上帝里生活的人。真实的认识上帝是在独一的真上帝里生活的果实。在真实的虔诚中才有真实的认识上帝。虔诚，即按照上帝而生活，向我们揭示关于上帝的深奥奥秘。救主因此宣告：「现在他们知道，凡你所赐给我的，都是从你那里来的。因为你所赐给我的话，我已经赐给他们；他们也领受了，又确实知道我真是从你那里出来的，并且信你差了我来。」（约翰福音 17:7-8）「他们领受了，又知道了」——这是认识基督的认识论律令。凭着信心领受基督，你就会认识祂。那信心起初不外乎是对基督的信赖：即祂这样一位，绝不可能也不会欺骗人。届时，那信心从信赖开始，借着福音的作为而增长，并经历转化为这更大更强的信心，直到它完全充满恩典，成为圣灵的恩赐（哥林多前书 12:9）。
    - type: paragraph
      text:
        ru: «Ја се за њих молим, не молим се за свијет, него за оне који си Ми дао, јер су Твоји. И све Моје Твоје је, и Твоје Моје; и прославио сам се у њима.» (Ин.17:9–10)
        cn: 「我为他们祈求，不为世人祈求，却为祢所赐给我的人祈求，因为他们是祢的。凡是我的都是祢的，祢的也是我的；并且我已在他们身上得了荣耀。」（约翰福音 17:9-10）
    - type: paragraph
      text:
        ru: 'Свет је пут саблазни; а свима је саблазнима заједнички циљ: спречавати и онемогућавати људима веру у Христа Бога. Јер чинећи тако, оне осигуравају своју владавину над светом. Од грехољубља људског свет је проврео саблазнима, као некада земља мисирска жабама. Зато је следбеницима Христовим тежак и тегобан пут кроз овај свет ка оном свету. Да их намаме и заведу, идеал је свих саблазни. И они, ма колико се борили, не могу изборити слободу од саблазни овога свега, ако их Господ не помаже својом благодаћу, а сврх овега својом молитвом свемоћном за њих. Зато се Спас и обраћа Оцу овом: «Ја се за њих молим: не молим се за свет, него за оне које си ми дао, јер су твоји». Ко је Божји ако не онај који је Христов? Јер ко душом припада Богу, у исто време припада и Сину Божјем. Јер су обоје једно Божанство: што припада једноме, припада и другоме.'
        cn: 世界是诱惑之路；所有诱惑都有一个共同目标：阻止并使人无法相信基督上帝。因为这样做，它们确保了自己在世上的统治。由于人对罪的爱慕，世界充满了诱惑，如同昔日埃及地遍布青蛙一样。因此，基督的追随者们，穿越今世通往彼世的道路是艰难而困苦的。诱惑并引诱他们，是所有诱惑的目标。他们，无论如何努力争战，都无法从这一切诱惑中挣脱出来获得自由，除非主以祂的恩典帮助他们，并且，除此以外，祂还以其全能的祷告为他们祈求。所以，救主向父如此说：「我为他们祈求：我不为世界祈求，只为那些你所赐给我的人祈求，因为他们是你的。」谁是属神的，如果不是那属基督的人呢？因为凡灵魂归属于上帝的，同时也就归属于上帝的儿子。因为二者乃是一神性：凡归属于其一的，也就归属于其二。
    - type: paragraph
      text:
        ru: 'У њих је: једна природа, једна воља, једна истина, једна љубав, један живот, једно еванђеље. Све једно, и заједничко, осим личних својстава: Очинства и Синовства. Такви су њих Двоје и у онима који верују у њих. Њихове божанске силе зраче из следбеника њихових, на славу њихову. Зато Спас и вели Оцу свом: «И моје све је твоје, и твоје Моје; и Ја се прославих у њима». Ко не види да све што је Христово припада Тројичном Божанству, тај уствари ништа не види. Као Богочовек Он има права да за све Божје каже: «Моје је»; као што Бог Отац има права да за све Његово каже: «Моје је», и: све је Твоје – Моје.'
        cn: 在他们那里，有一性，一意志，一真理，一爱，一生命，一福音。一切都是一，并且是共有的，除了位格的特性：父性与子性。他们二位也是如此，在那些相信他们的人里面。他们的神圣能力从他们的追随者中散发出来，荣耀他们。因此，救主也对祂的父说：「我的一切都是你的，你的一切都是我的；我也在他们身上得了荣耀。」 (约翰福音 17:10) 谁若看不见基督的一切都属于三一神性，那人实际上什么也没看见。作为神人，祂有权柄对所有属神的事物说：「是我的」；正如天父有权柄对所有属祂的事物说：「是我的」，并且：「你的一切都是我的。」
    - type: paragraph
      text:
        ru: «И више нисам у свијету, а они су у свијету, и Ја долазим Теби. Оче свети, сачувај их у Име Твоје, оне које си Ми дао, да буду једно као ми. Док бијах с њима у свијету, Ја их чувах у Име Твоје; и нико од њих не погибе осим сина погибли, да се испуни Писмо. А сада долазим Теби, и ово говорим на свијету, да имају радост Моју испуњену у себи.» (Ин.17:11–13)
        cn: «我不再在世上，而他们却仍在世上，我往你那里去。圣父啊，求你因你的名保守他们，就是你所赐给我的人，使他们合而为一，像我们一样。我与他们同在世上的时候，我因你的名保守了他们；他们中没有一人灭亡，除了那灭亡之子，为要应验经上的话。现在我往你那里去，我还在世上说这话，使他们心里充满我的喜乐。» (约翰福音 17:11-13)
    - type: paragraph
      text:
        ru: 'Шта је циљ Спасове молитве Оцу за Његове следбенике? – «Да буду једно као и ми». А то? Као што су једносушни Отац и Син, тако да буду и они једносушни међу собом: да буду једног живота, једне Истине, једне Правде, једне Љубави, једне природе, једне воље. У том јединству све је по угледу на јединство Тројичног Божанства; за такво јединство не знају људи, и када много говоре о јединству. Овде је мерило једанства – Божанско јединство, Спасово – као ми. Само сједињени у такво јединство, следбеници се Христови могу сачувати од саблазни овога света, и друге спасавати од њих.'
        cn: 救主向父为祂的追随者祷告的目标是什么？——「愿他们合而为一，像我们一样。」而这又是什么呢？正如父与子是同质的，愿他们彼此之间也是同质的：拥有一个生命、一个真理、一个公义、一个爱、一个本性、一个旨意。在那样的合一中，一切都仿效三一神性的合一；对于这样的合一，人们并不了解，即使他们多谈合一。在这里，合一的衡量标准是神圣的合一，是救主的合一——「像我们一样」。唯有在这样的合一中结合起来，基督的追随者才能得以保守，免受这世界的诱惑，并能从这些诱惑中拯救他人。
    - type: paragraph
      text:
        ru: 'Само држећи се један другога таквим јединством, они се могу одржати као Христови и када најдивљији урагани зла пустоше овај свет. То ће им једино давати божанске радости у свима искушењима, радости какву је свету донео само Богочовек, и за коју свет пре њега није знао, нити је без њега и сада познаје. Из тог јединства, из тог «једног тела» – Цркве – они савлађују све грехове и све смрти овога света, и људска бића испуњују вечним животом. У томе је и изузетна радост њихова, радост за коју се Господ на Тајној Вечери моли Оцу: «да имају радост Моју испуњену у себи».'
        cn: 只有通过如此的合一彼此相依，他们才能持守为属基督的，即便最狂暴的邪恶飓风摧残着这个世界。唯有这合一才能在一切试炼中赐予他们神圣的喜乐，这喜乐是唯有神人带给世界的，世界在他之前不曾知晓，没有他，如今也不认识。从这合一，从这「一个身体」——教会——，他们战胜了这世界上一切的罪恶和一切的死亡，使世人充满永恒的生命。这其中也包含着他们非凡的喜乐，为此喜乐，主在最后的晚餐上向父祈求：「使他们心里充满我的喜乐。」
    - type: paragraph
      text:
        ru: «Ја сам им дао ријеч Твоју; и свијет их мрзну, јер нису од свијета, као ни Ја што нисам од свијета.» (Ин.17:14)
        cn: 「我已将你的道赐给他们；世界就恨他们，因为他们不属世界，正如我也不属世界一样。」（约翰福音 17:14）
    - type: paragraph
      text:
        ru: 'Никад није Спаситељ тако јасно нагласио супротност између људског греховног света и оног, свог света, као на Тајној Вечери. Овај свет – сав добровољно потчињен греху, смрти, и ђаволу, остао је у најунутрашњијем језгру свом логосан и логочежњив; али сва његова делатност тка се измећу тог тројединства: греха, смрти и ђавола. А Христов свет – сав од Оца кроз Сина у Духу Светом: сав од Божанске истине, Правде, Љубави, Мудрости, и осталих баожанских савршенстава, те стога сав од бесмртности и вечнога живота, и оних светих врлина које уводе у божанску бесмртност и живот вечни.'
        cn: 救主从未如此清晰地强调人类罪恶的世界与祂自己的世界之间的对立，如同在最后的晚餐上。这个世界——完全自愿地顺服于罪、死亡和魔鬼——在其最深的核心处，依然是具有逻格斯性并渴慕逻格斯的；但它的一切活动都编织于这三位一体之间：罪、死亡和魔鬼。而基督的世界——完全源于父，借着子，在圣灵里：完全源于神圣的真理、公义、爱、智慧以及其他神圣的完美，因此完全源于不朽和永生，以及那些引人进入神圣的不朽和永生的圣洁美德。
    - type: paragraph
      text:
        ru: Отуда толике супротности између та два света, и борбе. Богочовек Христос и његови следбеници, «нису од овога света», зато их и мрзи овај свет, мрзи их као носиоце и доносиоце једног другог света, по свему новог, по свему Божјег; светог, безгрешног, бесмртног. Христовим светим далама тај нови свет савлађује грех и сву силу његову. Хрисгговим бесмртним силама – савлађује смрт и сву силу њену; Христовим божанским силама – савлађује ђавола и сву силу његову.
        cn: 由此，那两个世界之间存在如此多的对立和争斗。神人基督和他的追随者，「不属这世界」，因此这世界恨他们，恨他们是另一个世界——一个全然是新的、全然是属神的；神圣的、无罪的、不朽的世界——的承载者和带来者。借着基督的神圣能力，那个新世界战胜罪及其一切权势。借着基督的不朽力量，战胜死亡及其一切势力；借着基督的神圣力量，战胜魔鬼及其一切势力。
    - type: paragraph
      text:
        ru: 'У томе је сва благовест Христова сво Еванђеље Његово. У томе нова свеспасоносна реч Божја свету. Нарочиго је новина то што следбеници Христови благодатним врлинама духовно се сједињују са Христом, и Његовим светом, и припадају томе свету. Они тиме показују да грех, смрт и ђаво нису могли уништити у њима оно божанско, оно боголико што их је привело Богочовеку и оном свету, коме припадају свим бићем. Спас и вели за њих: «Ја им дадох реч твоју; и свет омрзну на њих, јер нису од света, као ни ја што нисам од света». Нису од света ни својом Истином, ни Правдом, ни Животом, ни бесмртношћу, ни светлошћу. И још: «нису од света», тј. нису ни пореклом ни животом од греха, смрти и ђавола. Сушта су супротност томе чиме живи овај свет, и у чему ужива. Но свет, иако служи греху, омрти и ђаволу, није по бићу свом, у суштини својој, ни од греха, ни од смрти, ни од ђавола.'
        cn: 在于此乃是基督的全部福音，祂全然的佳音。在于此乃是神赐予世界的、新的、普世救赎的话语。尤其特别的新颖之处在于，基督的追随者借由恩典的德行，在灵性上与基督联合，并与祂的世界联合，归属于那个世界。他们借此表明，罪、死亡和魔鬼未能摧毁他们内心中的神圣本质，未能摧毁那类神性的特质，是这些将他们引向神人（基督）以及那个他们以全副生命归属的世界。救主论及他们说：「我已将你的话语赐予他们；世界憎恨他们，因为他们不属于世界，如同我也不属于世界一样。」(约翰福音 17:14) 他们不属于世界，无论是凭着他们的真理、公义、生命、不朽，还是光明。此外，还有：「不属于世界」，即无论就其起源还是生命而言，他们都不来源于罪、死亡与魔鬼。他们与这世界赖以为生并从中取乐的一切，形成截然相反的对立面。然而，世界尽管服侍罪、死亡与魔鬼，但就其存在本质而言，它既不来源于罪，也不来源于死亡，更不来源于魔鬼。
    - type: paragraph
      text:
        ru: «Не молим да их узмеш са свијета, него да их сачуваш од злога. Од свијета нису, као ни Ја што нисам од свијета.» (Ин.17:15–16)
        cn: 「我不求你将他们从世上取走，而是求你保守他们脱离那恶者。他们不属世界，正如我也不属世界一样。」（约翰福音 17:15-16）
    - type: paragraph
      text:
        ru: 'По пореклу свом он је од Бога; суштина му занавек остаје логосна, иако по њему и на њему пирују сва зла и све смрти. Спас је и дошао да спасе свет од греха, смрти и ђавола, а не да га уништи са грехом, смрћу и ђаволом. Овај свет и зло у свету су разнога и потпуно супротнога порекла: свет је од Бога; а зло у свету – од ђавола. Спас је дошао у овај свет, живео у њему без икаквог греха, без зла, побеђујући зло свуда у свету, и тиме показао да свет и зло нису једно, напротив нешто саовим супротно. И сав Богочовеков подвиг спасења света и има за циљ: спасти овај свет од зла, и тако га вратити Богу који га је и створио. Са тим циљем, и ради остварења тог циља, Богочовек је и основао Цркву у овом свету: да постојећи у овом свету, спасава свет од зла које је у њему. Иако по овему припада оном свеггу, Црква живи у овом свету, да би га спасавала од зла. Такво је назначење и свих Христових следбеника: они живе у оовоме свету, иако нису од овога света, да би га светим еванђелским силама спасавати од зла.'
        cn: 世界按其起源源自上帝；其本质永远是逻各斯性的，尽管一切邪恶和一切死亡都在其上并借助它恣意妄为。救主降世是为了将世界从罪、死亡和魔鬼中拯救出来，而不是与罪、死亡和魔鬼一同毁灭世界。这个世界与世间的邪恶来源不同且完全对立：世界源自上帝；而世间的邪恶则源自魔鬼。救主降临到这个世界，在其中生活，没有任何罪恶，没有任何邪恶，在世界各处战胜邪恶，从而表明世界与邪恶并非一体，反之，它们是完全对立的。并且，神人救世的全部伟业旨在：将这个世界从邪恶中拯救出来，并将其归还给创造它的上帝。为了这个目的，并为了实现这个目的，神人也在这个世界建立了教会：使其存在于这个世界中，拯救世界脱离其中的邪恶。尽管教会按其一切都属于那个世界，它仍生活在这个世界中，是为了拯救这个世界脱离邪恶。这也是基督所有追随者的使命：他们生活在这个世界中，尽管他们不属这个世界，却是为了以圣洁的福音力量拯救它脱离邪恶。
    - type: paragraph
      text:
        ru: 'О томе благовести Спас: «Не молим те да их узмеш са овета, него да их сачуваш од зла. Од света нжу, као ни ја што нисам од света», Богочовек је дошао у свет, да све што је багочежњиво у њему спасе од зла дајући му живот вечни. Јединствена је Он личност баш по томе: што је себе проширио, преобразио, претворио у Цркву, тј. у огроман скуп људских бића, духовно сједињеиих богочовечанским светим силама, који сачињавају једно Тело, један организам. Он није основао неку школу, нити неко друштво, нити «удружење», већ је оставио Себе цела у своме Телу – Цркви, у вечно-живом организму, и Његови следбеници су само они који постају сутелесници његови, живи чланови живог Богочовечанског Тела Његовог, живе, вечио живе, ћелијице у вечноживом организму Цркве. И зато што је Он увек ту у свету, са свим својим божанским савршенствима и силама, Он увек може и спасавати свакога који жели од греха, смрти и ђавола. Стага Он непрестано наглашава да следбеници Његови нису од овога света «као» ни Он што није, да треба да буду једно «као» што је Он један са Оцем; речју: да у свему буду «као» Он.'
        cn: 救主宣报：「我不求你将他们从世界带走，而是求你保守他们脱离那恶。他们不属世界，正如我也不属世界。」神人来到世上，为要将世上一切渴慕神的人从邪恶中拯救出来，赐予他们永生。他之所以是独特的位格，正是因为他将自己扩展、改变，并转变为教会，即一个巨大的人类群体，他们借着神人性的神圣力量在灵性上合一，构成一个身体，一个有机体。他没有建立某所学校，也不是某个社团，更不是一个「协会」，而是将他完整的自己留在了他的身体——教会之中，在这个永恒活着的有机体中，并且他的追随者唯独是那些成为与他同体之人、他那活生生的神人身体的活泼肢体、教会这永恒活着的有机体中活生生的、永远活着的细胞。并且因为他总是临在于世上，带着他一切神圣的完美和力量，他就总能拯救每一个愿意脱离罪恶、死亡和魔鬼的人。因此，他不断地强调，他的追随者不属这个世界，正如他也不属这个世界一样；他们应当合一，正如他与父原为一一样；简而言之：在一切事上都当「像」他。
    - type: paragraph
      text:
        ru: '«Посвети их истином Твојом: ријеч Твоја јесте истина.» (Ин.17:17)'
        cn: 「求你用你的真理使他们成圣：你的道就是真理。」 (约翰福音 17:17)
    - type: paragraph
      text:
        ru: 'Како се следбеници Христови, живећи у свету, могу сачувати од зла? Ако се освете Истином: ако Истина проникне васцњло биће њихово. Јер Истина, која је Богочовек (Ин.14:6); јер Истина, која је Дух Свети (Ин.15:26; 16:13), уђе ли у човека, она разлива по њему све божанске свете силе, које изгоне из њета и уништавају у њему сва зла, све грехе, све смрти, све ђаволе. Ова Тројична, ова Богочовечанска, ова еванђелска Ис тина постаје човековом својином помоћу вере и осталих еванђелских благодатних врлина.'
        cn: 基督的门徒，活在世上，如何才能保守自己免受邪恶？如果他们被真理所圣化：如果真理渗透他们整个的存有。因为真理，祂是神人（约翰福音 14:6）；因为真理，祂是圣灵（约翰福音 15:26，16:13），若进入人里面，它便将一切神圣的力量倾注在他身上，这些力量驱逐并摧毁他里面的一切邪恶、一切罪恶、一切死亡和一切魔鬼。这三位一体的，这神人的，这福音的真理，借着信心和所有其他福音性的恩典美德，成为人所拥有的。
    - type: paragraph
      text:
        ru: 'Помоћу њих Истина расте кроз цело биће човеково, и освећује човека. Нема сумње, Истина у свесавршенству своме није друго до Пресвета Тројица. А уколико се та Истина могла превести у људске речи, Господ Христос ју је превео својим Еванђељем. Еванђеље и јесте Истина Тројичног Божанства, преведена на људски језик, изражена људским речима. Зато у нашем човечанском свету: Еванђеље Христово је реч Истине Божје, реч = Истина. Стога се Спас и моли Оцу за своје следбенике: «Освети их истином својм: реч је твоја истина».'
        cn: 借着它们，真理在人的整个生命中成长，并使人成圣。毫无疑问，真理在其完全的完美中，无非是至圣三一。而如果那真理能够被翻译成人的言语，主基督便已用祂的福音将其表达出来。福音也正是三一神性的真理，被转化为人类语言，以人的言语表达出来的。因此，在我们人类的世界里：基督的福音是上帝真理的圣言，圣言即真理。因此，救主也为祂的追随者向父祷告：「求你用你的真理使他们成圣；你的话就是真理。」（约翰福音 17:17）
    - type: paragraph
      text:
        ru: «Као што Ти Мене посла у свијет, и Ја њих послах у свијет. Ја посвећујем Себе за њих, да и они буду посвећени истином. Не молим пак само за њих, него и за оне који због ријечи њихове повјерују у Мене.» (Ин.17:18–20)
        cn: 「正如你差遣我到世上，我也差遣他们到世上。我为他们的缘故使自己分别为圣，好叫他们也因真理分别为圣。我不只为这些人祈求，也为那些因他们的话信我的人祈求。」 (约翰福音 17:18-20)
    - type: paragraph
      text:
        ru: 'Ученици Христови су «апостоли» = послани. Послани «као» и сам Богочовек: Он од Бога Оца, а они – од Њега, Богочовека. Послани, са чим? – Са самим Богочовеком, Његовим светим еванђељем. Ради чега? Ради спасења света помоћу Богочовека. Као «послани» они имају једну дужност: да изврше поверени им посао; томе немају права ништа ни одузети ни додавати. Сав њихов посао одређен је Богочовеком и његовим Еванђељем. Они су само «сведоци», само сарадници Христови. Христос је за њих и у њима све и сва: «Ко вас слуша, мене слуша» (Лк.10:16); «Ко вас прима, мене прима; а који прима Мене, прима Онога који Ме је послао» (Мф.10:40). Апостол изјављује: «Ми смо сарадници Божји» (1Кор.3:9).'
        cn: 基督的门徒是「使徒」= 被差遣者。他们被差遣「如同」神人祂自己：祂从神父而来，而他们——从祂，神人而来。他们被差遣，带着什么？——带着神人祂自己，祂的神圣福音。为了什么？为了借着神人拯救世界。作为「被差遣者」，他们有一项义务：完成托付给他们的工作；对此，他们无权增减任何东西。他们所有的工作都由神人和祂的福音所规定。他们只是「见证人」，只是基督的同工。基督对他们而言、在他们里面就是一切：「凡听你们的，就是听我」（路加福音 10:16）；「凡接待你们的，就是接待我；凡接待我的，就是接待那差我来的」（马太福音 10:40）。使徒宣告：「我们是神的同工」（哥林多前书 3:9）。
    - type: paragraph
      text:
        ru: 'Једна Истина, једно Еванђеље протеже се од Тројичног Божанства кроз Богочовека до у наш човечански свет, и борави у Богочовечанском телу – Цркви. Она је сва у свету, иако није од овога света. Спас говори Оцу за своје ученике: «Као што си ти мене послао у свет, и ја њих послах у свет». – «Ја освећујем себе за њих да и они буду освећени истином». Ја освећујем тело људско које сам узео на себе, а кроза њ освећујем Богочовечанско тело Цркве: све оне који буду постали сутелесници тог тела, живи чланови његови.'
        cn: 一真理，一福音，从三一神性穿过神人，延伸到我们的人类世界，并居住在神人性的身体——教会之中。它完全在世上，尽管不属于这个世界。救主为他的门徒向父说：「正如你差遣我到世上，我也差遣他们到世上。」——「我为他们的缘故使自己成圣，好使他们也因真理成圣。」我使我所取的人类身体成圣，并且借着它使教会的神人性的身体成圣：使所有将成为那身体的共同肢体、它的活泼肢体的人成圣。
    - type: paragraph
      text:
        ru: 'Сва Божанска Истина оваплоћена у Христу, ено је у телу Његовом – Цркви. Њоме се освећују сви чланови Цркве, и тако ослобађају греха, смрти и ђавола (Ин.8:32,34:36). Само Божанска Истина поседује неисцрпну освећујућу божанску силу, те може кроза све векове освећивати хиљаде и хиљаде следбеника Христових, чланова цркве. «Ја… и они … освећени Истином»: ове и сва је личност Богочовека; само са Њим, и у Њему, и Њиме људи се освећују: и то као пуне, свесне личности. Гошод Христос освећује себе као човек ради људи, јер је Он «нови Адам», нови родоначалник рода људског. У Адаму људска природа се обесветила грехом, у коме је сва ђаволова лаж (ср.Ин.8:44), лаж без и трунке истине; у Христу се људска природа освећује вечном Истином Божанском, и сваки постаје заједничар те Истине и те освећености чим се духовно сједини са Христом у Његовом богочовечанском телу – Цркви.'
        cn: 凡在基督里道成肉身的神圣真理，都存在于祂的身体——教会之中。借着它，教会的所有成员得以成圣，从而从罪恶、死亡和魔鬼中获得自由（约翰福音 8:32，34:36）。唯有神圣真理拥有取之不尽、用之不竭的成圣神圣力量，因此能够在万世之中使千千万万的基督追随者、教会的成员成圣。「我……和他们……被真理成圣」：这正是神人的全部位格；唯有与祂同在、在祂里面、并借着祂，人们才能得以成圣：而且是作为完整、有意识的位格成圣。主基督为了人类而作为人圣化自己，因为祂是「新亚当」，是人类的新始祖。在亚当里，人性因罪而被玷污，罪中充满了魔鬼的一切谎言（参阅约翰福音 8:44），那谎言丝毫没有真理可言；在基督里，人性借着永恒的神圣真理得以成圣，并且每个人一与基督在祂神人同体的身体——教会中属灵地结合，就成为那真理和那圣洁的共享者。
    - type: paragraph
      text:
        ru: 'Прваци Цркве су свети апостоли; у томе је њихова изузетна и непоновљива величина. А од њих почиње ширење и напредовање Цркве: сви који су касније поверовати, и непрестано кроза све векове умножавају се верујући људи, – сви они уствари иду путем еванђелске вере који су апостоли пропутили. Хрис-ова вера је сва од њих, и кроз њих; «по свој земљи изиђе проповед њихова, и до краја васељене речи њихове». Зато се у Својој првосвештеничкој молитви Спаситељ моли не само за њих него и за све који буду поверовали преко њих: «Не молим пак само за њих, него и за оне који узверују у Мене њихове речи ради».И заиста «помоћу њихове речи», и свете божанске силе која је у њој, – бива вера сваког хришћанина. Јер једна је сила вере, сила «свише»; апостоли су се најпре обукли «силоју свише», па та вишња стигла вере иде из њих кроз све верне свих векова.'
        cn: 教会的首要人物是圣使徒；在此是他们卓越非凡且无可复加的伟大。教会的扩展与进步始于他们：所有后来相信的人，并在世世代代中不断增多的信徒，事实上，他们都行走在使徒们所开辟的福音信仰之路上。基督的信仰完全源于他们，并借着他们；「他们的声音传遍天下，他们的言语传到地极。」 (罗马书 10:18)。因此，救主在祂的大祭司祈祷中，不仅为他们祈祷，也为所有将通过他们相信的人祈祷：「我不但为这些人祈求，也为那些因他们的话信我的人祈求。」 (约翰福音 17:20)。的确，「借着他们的话语」，以及其中神圣的属神之力，每个基督徒的信仰由此形成。因为信仰的力量是同一的，是「从上而来的」力量；使徒们首先「穿上了从上而来的能力」，于是，那至高的信仰之流便从他们流向世世代代所有的信徒。
    - type: paragraph
      text:
        ru: «Да сви једно буду, као Ти, Оче, што си у Мени и Ја у Теби, да и они у нама једно буду да свијет вјерује да си Ме Ти послао.» (Ин.17:21)
        cn: 「愿他们都合而为一，正如你，父啊，在我里面，我也在你里面一样，使他们也在我们里面合而为一，好让世人相信是你差遣了我。」(约翰福音 17:21)
    - type: paragraph
      text:
        ru: 'То је уједињујућа сила, она и држи тело Цркве у јединству неразоривом. Сва је од Духа Светога, зато је свепобедна, свеосвећујућа, свеуједињујућа. Да, сва је од Духа Светога кроз свете апостоле у Цркви. А главни је циљ те свете вишње силе, те вере: да помоћу светих врлина и тајни потпуно уједини све верне, да их оједносуши, да их учини једносушнима међу собом као што су једносушни Син и Отац, Тројично Божанство. До те међусобне једиосушности верни долазе само живећи у Цркви, живећи у Светој Тројици и Светом Тројицом. Спас и благовести за све њих: «Да сви једно буду, као Ти, Оче, што си у Мени и Ја у Теби, да и они у нама једно буду, да и свет верује да си Ме Ти послао». – О оваквом јединству нико никада није говорио. Јер такво јединство постоји у Тројичном Божанству! Њега нам је открио Један од Свете Тројице, и дао нам силе која га остварује у нашем човечанском свету. То није нешто наметнуто ни туђе људској природи, јер она је боголика, и стога је богочежњива, способна за оно што би је уподобило Тројичном Богу, што би учинило да људи буду «као» што је у Богу. Ова једносушност људи, о којој Спас говори, боголика је, и треба да буде.'
        cn: 这是合一的力量，它维系着教会的身体，使其处于不可摧毁的合一中。这一切都源于圣灵，因此它是战胜一切的、圣化一切的、联合一切的。是的，这一切都借着圣使徒在教会中源于圣灵。而这神圣至高力量，这信仰的主要目标是：借着神圣的德行与圣事，将所有信徒完全联合起来，使他们成为同质的，使他们彼此同质，就像子与父、三位一体的上帝是同质的一样。信徒唯有活在教会中，活在圣三一之中并借着圣三一而活，才能达到那种彼此的同质性。救主为他们所有人宣告说：「愿他们都合而为一，正如你，父啊，在我里面，我也在你里面，愿他们也在我们里面合而为一，使世人可以相信是你差遣了我。」（约翰福音 17:21）— 论及这样的合一，从来没有人谈论过。因为这样的合一存在于三位一体的上帝之中！圣三一中的一位向我们启示了它，并赐予我们能在此人间世界中实现它的力量。这并非强加于或外在于人性之物，因为人性是肖乎上帝的，因此是渴慕上帝的，能够实现那将使其肖乎三位一体上帝的事物，那将使人「如同」在上帝之中一样的事物。救主所谈论的这种人类的同质性，是肖乎上帝的，而且理应如此。
    - type: paragraph
      text:
        ru: 'Грех је разбио јединство боголике природе људске, и зато се људи осећају тако удаљени један од другога. Од те разбијености лечи Господ Христос својом благодаћу, својим светим божанским силама. Он васпоставља јединство боголике душе најпре у човеку, а затим и у заједници међу људима који сачињавају Цркву. То идеално јединство људи «као» што је у Тројичном Божансгоу нарочито осећају Светитаљи, јер су они у најпунијој мери очистили себе од греха, и тиме излечили боголику душу своју од разбијености, од разједињености, и тако оспособили себе за боголико јединство са другим људима. Суштина овог јединства је живот људски у Тројичном Божанству, у утројичењу и отројичењу. То нам казују јасно Спасове речи: «да и они у нама једно буду». А људи живе у Светој Тројици помоћу вере и осталих светих еванћелских врлина, као што су: љубав, молитва, пост, кротост…'
        cn: 罪打破了人神肖本性的合一，因此人们感到彼此疏远。主基督借着祂的恩典，借着祂神圣的属神能力，医治这种破碎感。祂首先在人自身之内，然后也在构成教会的人群社群之中，恢复神肖之魂的合一。圣者们尤其感受到这种理想的人的合一，「如同」在三一神性中一样，因为他们在最充分的程度上洁净了自己，脱离了罪，从而医治了他们神肖之魂的破碎与分裂，并因此使自己有能力与他人达致神肖的合一。这种合一的本质是人类在三一神性中的生命，是在融入三一性之中，并被三一性充满之中。救主的这些话语清晰地向我们阐明这一点：「使他们也在我们里面合而为一」。而人们则借着信仰和其余神圣的福音美德，诸如：爱、祷告、禁食、温柔等等，生活在圣三一之中。
    - type: paragraph
      text:
        ru: 'Свакоме је неопходан лични подвиг еванђелски. Јер само он уводи у свето богочовечанско јединство, Остварено у Цркви «са свима светима» (Еф.3:18). Главна је карактеристика тог «једносушног» јединства: потпуно очување личности сваког појединца у тој заједници бопочовечанској. Јер то нам показује сам божански оригинал једносушног јединства трију Лица Свете Тројице. Три Пресвета Лица су не само вечно једносушна по него и вечно ипостасна по Лицима: свако је Лице – вечно и самостално као Личност.'
        cn: 每个人都需要个人的福音性苦修。因为唯有它才能引入那在教会中「与众圣徒一同」（以弗所书 3:18）所实现的神圣神人合一。这种「同质性」合一的主要特点是：在这种神人合一的社群中，每个个体的位格都得到完全的保留。因为这正是神圣三一三个位格同质性合一的原始范本。三个至圣的位格不仅是永恒同质的，更是位格上永恒自存的：每个位格都是永恒且独立自存的位格。
    - type: paragraph
      text:
        ru: 'Нешто слично је и у Цркви: тамо се оваки члан сједињује са осталим члановима до једносушности, оједносуштинује, ипак сваки остаје у пуној мери самостална личност, развијена и усавршена до крајњих граница. Тако се остварује идеално савршенство и личности и друштва. Не обезличује се човек на рачун друштва, нити се друштво обездруштвује на рачун личности; нити се друштво обешчовечује на рачун човека, тј. не развија се на рачун личности човека као друштвене јединке. Јер је готово у свим ваневанђелским друштвима и зајерницама правило: или се човек, као личиост, потцењује и обезличује ради друштва, па чак уништава и убија ради друштва; или се друштво потцењује, онемогућава, па и уништава ради личности, и њених саможивих прохтвва. Једни уништавају човека ради човечанства; а други уништавају човечанотво ради човека. Разуме се, то у крајњој линији.'
        cn: 类似的情况在教会中也存在：在那里，这样的成员与其余成员合一，达到同质同体，成为同质同体，然而每个人都完整地保持其独立的位格，发展并臻于完善，直至其极限。如此便实现了理想的圆满，无论是对位格而言，还是对社会而言。人不会为了社会而被剥夺位格，社会也不会为了位格而失去其社会性；社会也不会为了人而失去其人性，也就是说，它不会以牺牲人的位格（作为社会个体）为代价来发展。因为几乎所有非福音性的社会和团体都遵循一个规则：要么人作为位格，为了社会而被贬低、被剥夺位格，甚至为了社会而被毁灭和杀害；要么社会为了位格及其自私的欲望而被贬低、被阻碍，甚至被毁灭。一方为了人类而毁灭人；而另一方为了人而毁灭人类。不言而喻，这归根结底。
    - type: paragraph
      text:
        ru: «И славу коју си Ми дао Ја сам дао њима, да буду једно као што смо ми једно. Ја у њима и Ти у Мени, да буду усавршени у једно, и да позна свијет да си Ме Ти послао и да љубиш њих као што Мене љубиш.» (Ин.17:22–23)
        cn: 「我已将你赐给我的荣耀赐给他们，使他们合而为一，正如我们合而为一一样。我在他们里面，你在我里面，使他们完完全全地合而为一，这样世界就知道是你差遣了我，并且你爱他们如同爱我一样。」 （约翰福音 17:22-23）
    - type: paragraph
      text:
        ru: 'Све што је Богочовеково сачињава и славу људску. Јер је Он прославио Бога пред људима, и човека пред Богом. Прославио је Бога својим богочовечанским подвигом, а човека – спасивши га од смрти и увевши га у вечну славу Божју. Та двострука слава нарочито се испољава у боголиком јединству људи који верују у Тројично Божанство. То јединство је изузетни дар Богочовека роду људском. Изузетна слава људи састоји се у томе: «да буду једно као ми што смо једно». То јединство се постиже само боголиким животом, животом у Христу.'
        cn: 凡属神人的一切，也构成人的荣耀。因为祂在人面前荣耀了神，并在神面前荣耀了人。祂以其神人性的功绩荣耀了神；而荣耀人，则是通过将人从死亡中拯救出来并将人引入神永恒的荣耀。这双重的荣耀尤其彰显于相信三一真神的人们那神圣的合一中。这合一是神人赐予人类的非凡恩赐。人的非凡荣耀在于此：「愿他们合而为一，像我们合而为一一样。」这合一唯有通过效法神的生活，即在基督里的生活才能实现。
    - type: paragraph
      text:
        ru: 'Јер тек од Њега ми смо сазнали како човек може живети Богом, и шта то значи када човек живи у Богу. Зато, имајући Богочовека као пример тога, и као извор силе за живљење таквим животом у Богу и по Богу, свети апостол саветује: «Живите достојно Бога који вас је призвао у своје царство и славу» (1Фес.2:12; ср.Кол.1:10). А то опет значи: «Живите достојно Еванђеља Христова» (Флп.1:27). Живљењем по Еванђељу Христовом човек «расте растом Божјим», развија своју личност божански бескрајно: «у меру раста висине Христове», али не сам него увек у заједници «са свима светима» (Еф.4:11–13;Кол. 2:19). И тако постиже у исто време два циља: лично боголико савршенство, које га и чини чланом друштва боголиког једимства. И једно и друго Спас изражава овом благовешћу: «Ја у њима и ти у Мени, да буду сасвим уједно, и да позна свет да си Ми Ти послао и да си имао љубав к њима као и к Мени што си љубав имао».'
        cn: 因为唯独从祂那里，我们才得知人如何能凭着神而活，以及当人活在神里面时这意味着什么。因此，既然有神人作为这方面的榜样，并作为活出在神里面并顺服神的生活的力量源泉，圣使徒建议说：「行事为人要对得起那召你们进入祂自己的国和荣耀的神。」 (帖撒罗尼迦前书 2:12; 参看歌罗西书 1:10) 而这又意味着：「行事为人要与基督的福音相称。」 (腓立比书 1:27) 借着遵行基督的福音而生活，人「照着神的增长而增长」，将自己的位格神圣地、无限地发展，「达到基督丰满身量的程度」，但并非独自一人，而是总在「与众圣徒」的团契中 (以弗所书 4:11-13，歌罗西书 2:19)。于是同时实现两个目标：个人的肖似神的完美，这也使他成为神圣合一团体的成员。救主以这句福音宣告了这两者：「我在他们里面，你在我里面，使他们完完全全地合而为一，叫世人知道你差了我来，也知道你爱他们如同爱我一样。」
    - type: paragraph
      text:
        ru: И боголико савршенство личности, и боголико савршенство друштва, дар је неизмерне љубави Божје према човеку. Љубави, савршено остварене и показане у Богочовеку, а кроз Њега и у следбеницима Његовим. Љубав Бога Оца према следбеницима Христовим слична је љубави Његовој према самом Христу, јединородном Сину Божјем. А та љубав божанска и јесте свестваралачка сила којом се обавља и боголико усавршавање личности и боголико усавршавање богочовечанског друштва.
        cn: 肖神的人格完美，以及肖神的社会完美，都是上帝对人类无限之爱的恩赐。这爱在神人身上完美地实现和展现，并通过他，也在他的追随者身上实现和展现。圣父上帝对基督追随者的爱，与他对基督本身，即上帝独生子的爱，是相似的。而那份神圣的爱，正是那一切创造之力，借此得以实现肖神的人格完善，以及肖神的神人社会完善。
    - type: paragraph
      text:
        ru: '«Оче, хоћу да и они које си Ми дао буду са Мном гдје сам Ја, да гледају славу Моју коју си Ми дао, јер си Ме љубио прије постања свијета. Оче праведни, свијет Тебе не позна, а Ја Те познах, и ови познаше да си Ме Ти послао. И Ја им објавих Име Твоје и објавићу: да љубав којом Ме љубиш у њима буде, и Ја у њима.» (Ин.17:24–26)'
        cn: 「父啊，我愿你所赐给我的人，也同我在哪里，使他们看见你所赐给我的荣耀，就是你所赐给我的，因为在创立世界以前你已经爱我了。公义的父啊，世界不认识你，我却认识你，这些人也知道是你差遣了我。我已将你的名指示他们，还要指示，使你爱我的爱在他们里面，我也在他们里面。」（约翰福音 17:24-26）
    - type: paragraph
      text:
        ru: 'Заиста се само божанска љубав Христова према људима може звати човекољубљем, а Он – Једини Човекољупцем. Јер, сав од ње и у њој, Он људима и даје божанско савршенство. И тиме их оспособљава да могу бити где и Он. У тој љубави су дате човеку све божанске силе: оне га оспособљавају за истинско познање Бога, и за истинско живљење у Богу. У тој љубави је истинско богопознање и истинско богоживљење. Та је љубав сила ради које се и којом се Бог Логос оваплотио, постао човек; та љубав је сила којом се и човек обожује, Постаје «бог по блаоподати». Богочовек уствари љубављу борави у човеку; али и човек љубављу борави у Богу. Свети Богослов благовести: «Бог је љубав, и који у љубави борави, у Богу борави, и Бог у њему борави» – (1Ин.4:16). Значи: љубав је та божанска сила којом се остварује духовно јединство људи са Богом и Бога са људима; и још: љубав је та сила која душе Христових следбеника сједињује до једносушности, те сваки од њих живи у свима и за све; и сви – у свакоме и за свакога. А све то пак чини Он, чудесни Господ Христос, Бог те љубави и свих њених остварења у свима световима.'
        cn: 确实，唯有基督对人类的神圣之爱才能被称为爱世人之爱，而祂——是唯一的爱世人者。因祂完全源于这爱，并存在于这爱中，祂也赐予人类神圣的完满。借此，祂使他们有能力与祂同在。在这爱中，人被赋予一切神圣的能力：这些能力使他能够真正认识上帝，并真正活在上帝之中。在这爱中，有真正的识神与真正的居神之生活。这爱是上帝圣言（Logos）道成肉身、成为人的动力与凭借；这爱也是人被神化的动力，使人成为「按恩典而为的神」。实际上，神人借着爱居于人中；而人也借着爱居于上帝之中。圣神学家宣扬说：「上帝是爱，住在爱里面的，就是住在上帝里面，上帝也住在他里面」——（约翰一书 4:16）。这意味着：爱是那神圣的力量，借着它，人与上帝之间以及上帝与人之间的属灵合一得以实现；并且：爱是那将基督追随者的灵魂联合至同本质的力量，使他们中的每个人都活在众人之中并为众人而活；而所有人——都活在每个人之中并为每个人而活。而所有这一切，都是由祂——奇妙的基督主，那爱的上帝以及它在所有世界中的一切实现的上帝——所成就的。
    - type: paragraph
      text:
        ru: 'Зато Он и завршава своју првосвештеничку молитву – молитвом за такву љубав: «Оче, хоћу да и они које си ми дао буду са мном где сам ја; да виде славу коју си ми дао, јер си имао љубав к Мени пре постања света.'
        cn: 因此，祂也以祈求那种爱的祷告来结束祂的大祭司祷告：「父啊，我愿你所赐给我的人，也同我在哪里；叫他们看见你所赐给我的荣耀，因为创立世界以前，你已经爱我了。」
    - type: paragraph
      text:
        ru: 'Оче праведни, свет Тебе не позна, а Ја Те познах, и ови познаше да си Ме ти послао. И показах им Име Твоје, и показаћу: да љубав којом си Мене љубио у њима буде, и Ја у њима».'
        cn: 公义的父啊，世人未曾认识你，我却认识你，这些人也知道是你差遣了我。我已将你的名指示给他们，将来还要指示他们：为要使你爱我的爱在他们里面，我也在他们里面。
  - type: heading2
    text:
      ru: Глава осамнаеста. Гетсиманска молитва, издаја и суђење Христу
      cn: 第十八章. 客西马尼祷告，出卖与审判基督
    children:
    - type: paragraph
      text:
        ru: «Рекавши ово Исус изиђе са ученицима Својим преко потока Кедрона, гдје бјеше врт, у који уђе Он и ученици Његови. А и Јуда издајник Његов, знађаше то мјесто; јер се Исус често окупљаше ондје са ученицима Својим.» (Ин.18:1–2)
        cn: 「说了这话，耶稣和祂的门徒就出去了，过了汲沦溪。在那里有一个园子，祂和祂的门徒都进去了。那出卖祂的犹大也知道那地方，因为耶稣和祂的门徒常常在那里聚集。」 (约翰福音 18:1-2)
    - type: paragraph
      text:
        ru: 'Јуда је виртуозном дијалектиком разрадио свој план о издајству Господа Христа. И изводи га доследно. Он користи овој положај бившег ученика Исусовог: зна место где се Исус често скупљаше с ученицима својим: Маслинска гора. Запрепашћује хладноћа Јудина у томе. Зар га то место не потсећа на бесане ноћи Исусове које је проводио или у молитви или у разговору са њима. О, колико је у свему томе било божансжог, дирљивог, чудесног! Сигурно су у тим бесаним ноћима они сазнали оио «што око људско не виде, и ухо не чу, и у срце човеку не дође». Сигурно је Господ у тим чудесним ноћима говорио ученицима својим о оним божанским стварима, о којима кад би се све написало, по мишљењу Христољубљеног, књиге не би могле стати ни у цео свет. Али, Јуда је све то под ноге збацио и згазио, јер је у њему већ делао сав Сатана, кога је он пустио у себе, а претходно му сам припремио место. Заборавио је, или злурадо газио, Јуда она места где је сам чудеса именом Исусовим чинио: болесне исцељивао, ђаволе изгонио, мртве васкрсавао. Исус? Какав ли је Исус изгледао у Јуудиним очима сада? Шта ли је онај Свезли и Свелукави око светлог лика Исусовог изградио и исплео? Какве ли таме, и какве ноћи, и какве мреже! Зашто он Бог, а не ја? Сигурно је то луциферско питање вихорило по мрачној души Јудиној, као некада у Сатаниној када је био Прво-арханђел – Светлоноша: Луцифер. Нећу Бога, ни Његова савршенства, – промицала је и ова богохулна муња, кроз помрчину Јудине душе. Нека не буде Бога, нека будем само ја – славни Јуда! – тутњала је кар хука многах громова ова сатанска свежеља по свима урвинама Јудиног осатањеног сазнања.'
        cn: '犹大以高超的辩术制定了他出卖主基督的计划，并始终如一地贯彻执行。他利用自己作为耶稣昔日门徒的身份：他知道耶稣常与门徒聚集之处：橄榄山。犹大在此事上的冷酷无情令人震惊。难道那地方不使他想起耶稣所度过的，或在祈祷中，或与门徒交谈中的那些不眠之夜吗？哦，所有这一切之中，曾蕴含着何等神圣、感人、奇妙啊！确实，在那些不眠之夜里，他们领悟了「人眼未曾见过，人耳未曾听过，人心也未曾想过的事」。确实，主在那些奇妙的夜晚里，向祂的门徒们讲述了那些神圣之事；按照基督爱者的看法，关于这一切，若要一一写下，所有的书卷也容纳不下整个世界。


          然而，犹大将这一切践踏于足下，因为在他里面，撒旦已经完全作祟，是他自己将其放入心中，并预先为其准备了地方。犹大忘记了，或者说是恶意践踏了那些他曾亲自奉耶稣的名行过神迹的地方：医治病人、驱逐魔鬼、使死人复活。耶稣？如今，耶稣在犹大眼中究竟是何等模样？那全然邪恶和全然狡猾者围绕着耶稣光明形象，究竟建造和编织了什么？何等的黑暗、何等的黑夜、何等的罗网啊！


          「为何他是上帝，而不是我？」毫无疑问，这路西弗式的问题在犹大阴暗的灵魂中狂飙，就像昔日撒旦在他还是首位天使长——光之使者：路西弗时的灵魂中一样。「我不要上帝，也不要祂的完全，」——这句亵渎神明的闪电，亦穿透了犹大灵魂的幽暗。「愿没有上帝，愿只有我——荣耀的犹大！」——这撒旦式的全盘欲望，如同多重雷鸣般咆哮着，遍布了犹大被撒旦化的意识深处的所有深渊。'
    - type: paragraph
      text:
        ru: «Онда узе Јуда чету, и од првосвештеника и фарисеја слуге, и дође онамо са буктињама и свјетиљкама и оружјем.» (Ин.18:3)
        cn: 「那时，犹大带着一队兵，和祭司长并法利赛人的差役，拿着火把、灯笼、兵器，来到那里。」 (约翰福音 18:3)
    - type: paragraph
      text:
        ru: 'На подвиг Јуда: треба убити Бога! урлао је Сатана кроз сва осећања његова. И «Јуда узе чету и од главара свештеничких и фарисеја момке, и дође онамо с фењерима и са свећама и оружјем». – То је доста, Јуда, зар не? Та ти идеш против кроткога Исуса; ти знаш – Он се неће бранити. А ти баш то и мрзиш у Њему, зашто да се не брани. Та Он има моћи и власти; о, какве моћи и силе! Да, само моћ, само сила, – то ми дај, и ја сам Бог. И овда, све то исплети у једаи бич насиља. Нека се зна кад богује Јуда!'
        cn: 去行这事吧，犹大：必须杀死上帝！撒但咆哮着，这声音穿透了他所有的情感。于是，「犹大带着一队兵，又从祭司长和法利赛人那里带着差役，来到那里，拿着灯笼、火把和兵器。」——这就够了，犹大，不是吗？你要去对抗的是温柔的耶稣；你知道——他不会抵抗。而你恰恰憎恨他这一点，恨他为何不抵抗。他拥有权柄和能力；哦，那是何等的能力和力量啊！是的，只要有能力，只要有力量——把那给我，我就是上帝。于是，将所有这一切编织成一根暴力的鞭子。让世人知道犹大掌权作神的时候！
    - type: paragraph
      text:
        ru: '«А Исус знајући све шта има да Му се договди, изиђе и рече им: Кога тражите? Одговорише Му: Исуса Назарећанина. Исус им рече: Ја сам. А с њима стајаше и Јуда, издајник Његов. А када им рече: Ја сам, одступише назад и попадаше на земљу.» (Ин.18:4–6)'
        cn: «耶稣知道将要临到祂的一切事，就出来，对他们说：你们找谁？他们回答祂：拿撒勒人耶稣。耶稣对他们说：我就是。卖祂的犹大也和他们一同站在那里。祂一说：我就是，他们就退后倒在地上。» （约翰福音 18:4-6）
    - type: paragraph
      text:
        ru: 'А Исус? «А Исус знајући све што ће бити од Њега изиђе и рече им: кога тражите?» – Кротост, смиреност, спокојство. То баш Јуда и презире у Боту Исусу. Волео би он, да је Исус сунуо мећу њих олујама и громовима. Нек се запали земља, нек се запали васиона од гнева изданог Бога! Али, Исус? Не, Он није за Бога; Он не уме да богује! Такав Бог није потребан људима; нека умре! Ако је на земљи, ми ћемо га протерати. Да, ми тражимо Исуса Назарећанина. – А свезнајући и свепредвиђајући кротки Господ Исус кратко рече: «Ја сам». – Еванћелист одмах додаје: «А с њима стајаше и Јуда који га издаваше». Јуда, ти си тако нешто и очекивао, зар не? Кротки Исус зар може да се понаша као Бог? Боље га уклонити, да не омета смелом људском духу на његовим херојским путевима ка…?'
        cn: '而耶稣呢？

          「耶稣知道将要临到自己的一切事，就出来对他们说：『你们找谁？』」——温良、谦卑、平静。这正是犹大在主耶稣身上所鄙视的。他倒是希望耶稣能带着风暴和雷电冲向他们。让大地燃起熊熊烈火吧，让宇宙因那被出卖之神的愤怒而燃起熊熊烈火吧！可是，耶稣呢？不，他不配为神；他不懂得如何为神！这样一位神，世人不需要；让他去死吧！如果他在地上，我们就会把他赶走。是的，我们寻找拿撒勒人耶稣。——而那全知且预见一切的温良主耶稣简短地说：「我就是。」——福音书作者立刻补充道：「卖他的犹大也和他们一同站着。」犹大啊，你是不是也预料到了这样的情景呢？温良的耶稣怎能行事如神呢？最好把他除掉，免得他阻碍了勇敢的人类精神在其英勇的道路上走向……？'
    - type: paragraph
      text:
        ru: 'То ће знати онај у теби, Јуда. Онај главни режисер свеколиког богоиздајства, богоборства и богоубиства на земљи. Јуда, шта се то зби са четом твојом? «Кад им Исус рече: Ја сам; измакоше се натраг и попадаше на земљу». Где вам је оружје, људи? Где ти је присебност, Јуда? Зашто попадасте на земљу од Његове две речи: «Ја сам». Каква је то сила у њима? Та ви, можда, и не знате, али Јуда зна. Зна да те две Исусове речи увек стоје испред треће речи, коју Исус по кротости Својој није хтео изговорити. Та трећа реч јесте: Бог. Да: «Ја сам – Бог». Ако вам то не казују и не доказују прве две речи: «Ја сам», онда вам то каже и докаже божанска сила која бије из тих речи. – Јуда, све иде по твоме плану и очекивању, зар не? Ето, Исус их опет кротко запита: «Кога тражите?»'
        cn: '犹大，你里面的那个会知道的。地上一切背叛上帝、与上帝为敌以及弑杀上帝的主导演。犹大，你的那队人马怎么了？「耶稣对他们说：『我就是。』他们就退后倒在地上。」你们的武器呢，各位？犹大，你的镇定何在？为什么你们会因为祂的两个字：「我就是」，就倒在地上？这两个字里蕴含着何等力量？你们或许不知道，但犹大知道。他知道，耶稣的这两个字总是置于第三个字之前，而耶稣出于祂的温柔谦逊，不愿说出那第三个字。那第三个字就是：上帝。是的：「我就是——上帝」。如果那两个字：「我就是」，无法向你们诉说和证明这一点，那么从这些字中迸发出的神圣力量，就会向你们诉说和证明。


          犹大，一切都按照你的计划和预期进行，不是吗？看哪，耶稣又温和地问他们：「你们找谁？」'
    - type: paragraph
      text:
        ru: '«Онда их опет запита: Кога тражите? А они рекоше: Исуса Назарећанина. Одговори Исус: рекох вам да сам Ја. Ако, дакле, Мене тражите, пустите ове нека иду. Да се испуни ријеч коју рече: Не изгубих ни једнога од оних које си Ми дао.» (Ин.18:7–9)'
        cn: «于是他又问他们：你们找谁？他们说：拿撒勒人耶稣。耶稣说：我已经告诉你们，我就是。你们若找我，就让这些人去吧。这要应验他所说的话：你所赐给我的人，我一个也没有失落。» (约翰福音 18:7-9)
    - type: paragraph
      text:
        ru: 'Јуда, како небоговско понашање! Уместо да их прикује за земљу, да никад више не устану, већ се у прашину распу, Он их кротко и смирено поново пита. Не, иако је Бог, такав Бог не треба Јуди и јудејцима. Зато, са таквим Богом – напоље из света, боље. – да земљи не смета! Јудинском жељом прибрани, они рекоше: Исуса Назарећанина. – И опет небоговски одговор: «казах вам да сам Ја. Ако дакле Мене тражите, оставите ове нек иду». Зар их тако браииш, њих – ученике своје? Да, Јуда је у праву: ти ниси онакав Бог какав је потребан овом кукавичном, па ипак бунтовном, роду људском. Њима је потребан Бот по слици и прилици неустрашивог Луцифера. Сила, сила је једино еванђеље које ове кукавице бунтовне примају и признају. Сила која се неминовно преображава у хиљаде саблажњивих и неопходних насиља. Јуда, то је твоја философија живота. Ањихова? Ено је у пророцима, опет кротким Божјим посланицима; сигурно кротким, када их скоро све побише, а они се и не бранише. «Да се изврши реч што рече: не изгубих ни једнога од оних које си ми дао».'
        cn: 犹大啊，何等非神性的行径！他本该将他们钉在地上，使他们永不再起来，反而化为尘土，他却又谦和谦卑地再次询问他们。不，即使他是神，犹大和犹太人也不需要这样的神。因此，带着这样的神——不如离开这个世界，倒好——免得妨碍大地！应犹大之愿，他们回答说：「拿撒勒人耶稣。」——又是这非神性的回答：「我告诉你们，我就是。你们若寻找我，就让这些人去吧。」难道你就这样保护他们——你的门徒吗？是的，犹大是对的：你不是这种懦弱却又悖逆的人类所需要的神。他们需要的是一位拥有无畏路西法之形象与样式的神。力量，唯有力量才是这些懦弱叛逆者所接受和承认的福音。这种力量必然会转变为千百种令人跌倒且必要的暴力。犹大啊，这就是你的人生哲学。那他们的呢？就在先知那里，那些又是谦和的神的使者；他们确实是谦和的，因为他们几乎都被杀害时，甚至都没有反抗。「为要应验他所说的话：『你所赐给我的人，我没有失落一个。』」
    - type: paragraph
      text:
        ru: '«А Симон Петар имаше нож, па га потеже и удари слугу првосвештениковог и одсијече му десно ухо. А слуги бјеше име Малхо. Тада рече Исус Петру: Стави нож у корице! Чашу коју Ми је дао Отац зар да је не пијем? Онда чета и заповједник и слуге јудејске ухватише Исуса и свезаше Га. И одведоше Га најприје Ани, јер бјеше таст Кајафи, који бјеше првосвештеник оне године.» (Ин.18:10–13)'
        cn: 「而西门·彼得有一把刀，就拔出来，砍了大祭司的仆人，削掉了他的右耳。那仆人名叫马勒古。耶稣就对彼得说：『把刀收进鞘里去！我父所给我的杯，我岂可不喝呢？』于是，那队兵和千夫长，并犹太人的差役，就拿住耶稣，把祂捆绑了。他们先带祂到亚拿那里，因为亚拿是该亚法的岳父，这该亚法正是那年的大祭司。」 (约翰福音 18:10-13)
    - type: paragraph
      text:
        ru: 'Колико је тешко схватити кротост и смиреност Богочовека Христа у овим страшним тренуцима, показује и сам првоврховни апостол: Петар. Он «имаше нож, па га извади и удари слугу поглавара свештеничкога, и отсече му десно ухо. А слузи беше име Малхо2. – Богочовеков пут опасења света од греха, смрти и ђавола, води кроз кротост, смерност, страдање, љубав, трпљење, смрт, па кроз васкрсење и вазнесење у живот вечни, у славу вечну, у блаженство вечно. То је дух Христов, дух Богочовеков.'
        cn: 首席使徒彼得本人就表明了，在这些可怕的时刻，理解神人基督的温良和谦卑是多么困难。他「有刀，就拔出来，将大祭司的仆人砍了一刀，削掉他的右耳。那仆人名叫马勒古2。」（约翰福音 18:10）神人拯救世界脱离罪、死亡和魔鬼的道路，是经过温良、谦卑、苦难、爱、忍耐、死亡，然后通过复活和升天，进入永生，进入永恒的荣耀，进入永恒的福乐。这就是基督的精神，神人的精神。
    - type: paragraph
      text:
        ru: 'Али ученици Христови нису знали каквога је духа Христос, каквота су духа они, док Свети Дух није сишао на њих и открио им сву тајну Христовог домостроја опасвња света. А срж те тајне је пуна парадокса божанског: смрћу сатрти смрт и тако васкрснути са телом, са вечним телом. Томе свечуду води сва кротост кроткога Господа Исуса. О томе говоре и ове речи Његове упућене Петру: «Задени нож у ножнице. Чашу коју ми даде Отац зар да је не пијем?» Чашу кротког страдаења, чашу кротке смрти Јагњета Божјег, «које узима на себе грех свепга», и тако спасава свет од греха, а са њим и од омрти и од ђавола. Јуда? Сав је на оној другој обали, сав у другом свету, где људи хоће бога по слици и прилици анттибога, Сатане, са свима његовим атрибутима, које предводи гордост. Али су баш зато против кроткога и смернога Бога – Исуса. Зато «чета и војвода и момци Јеврејски ухватише Исуса и овезаше га».'
        cn: 但是，基督的门徒们并不知道基督是何等的灵，他们自己是何等的灵，直到圣灵降临在他们身上，并向他们揭示了基督拯救世界的救赎计划的全部奥秘。而这个奥秘的核心充满了神圣的吊诡：藉着死亡摧毁死亡，并因此带着身体复活，带着永恒的身体。温柔的主耶稣的全部温柔都引向这全然的奇迹。他的这些对彼得说的话语也提到了这一点：「把刀收回鞘里去。父所给我的那杯，我岂可不喝呢？」(约翰福音 18:11) 这杯温柔的苦难，这杯神的羔羊温柔的死亡，「除去世人罪孽的」(约翰福音 1:29)，并因此把世界从罪中拯救出来，同时也从死亡和魔鬼中拯救出来。犹大？他完全在那另一边，完全在另一个世界里，在那里人们想要一个照着敌神、撒旦的形像和样式而成的神，带着他所有的属性，由骄傲所主导。但正是因此，他们反对温柔而谦卑的神——耶稣。因此，「千夫长和兵丁，并犹太人的差役，就拿住耶稣，把他捆绑了。」(约翰福音 18:12)
    - type: paragraph
      text:
        ru: Јуда, зар се не сећаш како су те руке, које сада свезаше, додиром својим вид слепима враћале, слух глувима, говор немима, живот мртвима, здравље болеснима, исцељење губавима? Како су дечицу благосиљале, и теби благословено парче хлеба давале, и ти им једним толике стотине људи нахрањивао, па чак и котарицу од отпадака напунио? Али – сада је власт таме; сада су у мраку твоје душе погашене и све свеће и сва светила – тама крајња, тама најкрајња, и у њој шкргут зуба на све што је Божје, што је Исусово.
        cn: 犹大，难道你不记得，那双手如今虽被捆绑，却曾借着祂的触碰，使瞎子得见光明，聋子得以听见，哑巴得以开口，死者得以复生，病者得以康健，麻风病人得以痊愈？祂曾如何祝福小孩子，并且把被祝圣的饼碎赐给你，而你又用这一个饼喂饱了成百上千的人，甚至装满了筐篓的碎屑？然而——现在是黑暗掌权之时；现在，在你灵魂的黑暗中，所有蜡烛和所有灯火都已熄灭——那是极度的黑暗，最深邃的黑暗，并在其中，切齿痛恨一切属上帝的，一切属耶稣的。
    - type: paragraph
      text:
        ru: '«А Кајафа бјеше онај што даде савјет Јудејцима да је боље да један човјек умре за народ. За Исусом пак иђаше Симон Петар и други ученик; а тај ученик бјеше познат првосвештенику, па уђе са Исусом у двориште првосвештеника. А Петар стајаше напољу код врата. Онда изиђе тај други ученик, који бјеше познат првосвештенику, и рече вратарки те уведе Петра. Тада слушкиња вратарка рече петру: Да ниси и ти од ученика овога човјека? Он рече: Нисам. А слуге и момци бјеху наложили ватру и стајаху те се гријаху, јер бјеше хладно; а и Петар бјеше с њима, и стајаше и гријаше се.» (Ин.18:14–18)'
        cn: 迦法就是那给犹太人建议，说一个人为百姓死是更好的。然而，西门彼得和另一个门徒却跟着耶稣；而那个门徒是大祭司所认识的，于是他与耶稣一同进了大祭司的院子。但彼得却站在外面门旁。然后那个大祭司所认识的另一个门徒出来了，告诉守门女，叫她带彼得进去。那时，那婢女守门女对彼得说：你难道不也是这个人的门徒吗？他说：我不是。而仆人和差役们已经生了火，站着烤火取暖，因为很冷；彼得也和他们在一起，站着烤火取暖。(约翰福音 18:14-18)
    - type: paragraph
      text:
        ru: 'Ено, те таме је пун првосвештеник Ана, и двор његов. Ено, од те таме се препао и пламене вере и љубави Петар – три пута кроткога Господа Исуса одрекао. И то пред ким? Пред служавком. На једној страни кротки Господ Исус, на другој – лакомислена служавка. И Петар се, уплашен од самог питања њеног: «да ниси и ти ученик овога човека?» Одриче тога «човека», коме се колико ноћас клео и преклињао као Богу и Господу да Га се никад неће одрећи и да ће душу своју положити за Њега. Од тога почиње драма Петрова.'
        cn: 就在那里，那黑暗充满着大祭司亚拿和他的庭院。看啊，因那黑暗，甚至那有炽热的信心和爱心的彼得也感到恐惧——他三次否认了温柔的主耶稣。并且是在谁面前？在一个婢女面前。一边是温柔的主耶稣，另一边是一个轻浮的婢女。而彼得，仅仅因她提出的那个问题便害怕了：「你莫非也是这人的门徒吗？」他否认了那个「人」——他才在今晚向他起誓和恳求，称他为神和主，说永不否认他，并且愿为他舍弃自己的生命。从此，彼得的悲剧开始了。
    - type: paragraph
      text:
        ru: 'Ено, наставља се у двору Анином. Док се слухе и момци крај ватре греју: «и Петар стајаше с њима и грејаше се». Да ли је то спокојство или неосетљивосг и несаосетљивост? Или размишља о овоме ножу и о оттсеченом уву слуге Малха, које Исус чудесно опет постави на своје место? Можда је и Малхо ту негде, у неком двору: или Анином или Кајафином? Шта се то догађало у Петру? Човек бурне душе, коју су захватили и вихори одушевљења и тмурне дубине очајања, ковао је у себи нешто ново, ковао у хаосу неочекиваних мисли и осећања.'
        cn: 于是，在亚拿的院子里，（事情）仍在继续。当仆役和差役们在火旁取暖时，（经文记载）："彼得也和他们站在一起烤火。" 这是一种平静，还是一种麻木不仁和缺乏同情心呢？还是他正在思索那把刀，以及仆人马勒古被削掉的耳朵——就是耶稣奇迹般地将其复原的耳朵？也许马勒古也在附近的某个院子里：或是亚拿的，或是该亚法的？彼得心里究竟发生了什么？这个灵魂激荡之人，曾被热情的旋风和绝望的阴郁深渊所攫住，此刻正在他内心锻造着一些新的东西，在意想不到的思绪和感受的混沌中锻造着。
    - type: paragraph
      text:
        ru: '«Првосвештеник пак упита Исуса за ученике Његове и за науку Његову. Исус му одговори: Ја говорих јавно свијету; Ја свагда учих у синагоги и у храму, гдје се увијек скупљају Јудејци, и ништа у тајности не говорих. Што питаш Мене? Питај оне који су слушали шта им говорих; ето, они знају шта Ја говорих. А кад Он ово рече, један од слугу који стајаху ондје удари Исусу шамар и рече: Зар тако одговараш првосвештенику? Исус Му одговори: Ако зло рекох, докажи да је зло; ако ли добро, зашто Ме бијеш? Ана Га посла свезанога првосвештенику.» (Ин.18:19–24)'
        cn: 「大祭司又问耶稣关于祂的门徒和祂的教训。耶稣回答说：『我曾公开地对世人说话；我常常在会堂里和殿里教导，犹太人总是在那里聚集，我并没有在暗中说过什么。你为什么问我呢？去问那些听过我对他们说过什么的人吧；看哪，他们知道我说过什么。』当祂说了这些话的时候，一个站在那里的仆人打了耶稣一个耳光，说：『你竟这样回答大祭司吗？』耶稣回答说：『如果我说了不好的话，就证明它是不好的；如果我说的是好的，你为什么打我呢？』于是亚那把祂捆绑着，送到了大祭司那里。」 (约翰福音 18:19-24)
    - type: paragraph
      text:
        ru: 'Кротки и свезани Господ Исус је пред првосвештеником Аном. Да ли Ана ишта од свега тога разуме? Свемоћни Чудотворац стоји пред њим кротак и свезан? Где му је она необична, надчовечанска сила? Како је сада немоћан и, можда, беспомоћан? А он – Ана: да ли сав у фарисејској гордости и лицемерној свеправедности? или се у њему нешто крши, пуца и ломи? Од чега да почне? Од дела Исусових, или од науке?'
        cn: 温顺且被捆绑的主耶稣在大祭司亚拿面前。亚拿对此是否理解分毫？全能的行神迹者，温顺且被捆绑着站在他面前？他那不寻常、超乎人性的力量到哪里去了？他现在何等软弱，也许是何等无助？而他——亚拿：是否完全沉浸在法利赛人的骄傲和虚伪的自义中？抑或他内心深处有某物正在破碎、崩裂，并彻底瓦解？他该从何开始？从耶稣的作为，还是从他的教导？
    - type: paragraph
      text:
        ru: 'Дела су чудеса, све сама чуда; наука је учење, проповед, реч. Боље од науке. И он «запита Исуса за његову науку» – Исус му одговори: Ја говорих јавно свету, Ја свагда учих у збарници и у храму, где се свагда скупљају Јудејци, и ништа тајно не говорих. Што питаш Мене? Питај оне који су слушали шта сам им говорио; ево ови знају шта сам Ја говорио». Нити његова наука – заводи, нити Он – заводник: све јавно и отворено. Сведоци – сви Јудејци, па и ови овде што стоје а ти ме судиш. Ако има погрешке и греха у мојој науци, покажите и докажите. Ако нема, зашто ме везујете и судите? «А кад он ово рече, један од момака који стајаху онде удари Исуса по образу, и рече: зар тако одговараш поглавару свештеничкоме?».'
        cn: 行为是奇迹，尽是奇迹；教导乃是教诲、宣讲、言语。此胜于教导。于是，他问耶稣关于他的教导（约翰福音 18:19）。耶稣回答说：「我向世人公开地说话，我常常在会堂和圣殿里教导，犹太人总在那里聚集，我没有说什么隐秘的事。你为何问我？去问那些听过我说了什么的人吧；看，这些人知道我说了什么。」（约翰福音 18:20-21）他的教导不迷惑人，他也不是迷惑者：一切都是公开和坦诚的。见证人——所有犹太人，甚至包括这些站在这里而你却审判我的人。如果我的教导有错谬和罪过，请指明并证明。如果没有，你为何捆绑我并审判我？他说了这些，旁边站着的一个差役打在耶稣的脸上，说：「你这样回答大祭司吗？」（约翰福音 18:22）
    - type: paragraph
      text:
        ru: Почиње страшни суд над Богом. Да, почео је од Јуде. И ево се наставља. Страхота и ужас је у томе што тај суд не врше ђаволи у паклу већ људи на земљи. Заиста, ако игде има пакла за Бога, онда је то земља; а људи на њој – безумни ђаволи који муче Бога. Али, чиме би пакао земљин показао да је пакао, ако не би мучио кроткога Бога и Господа Исуса? И чиме би људи показали да су гори од самих ћавола, ако не својим држањем према Богочовеку Христу? Тиме су они и показали да их нико не може спасти њиховог пакла и зла осим оваплоћвног Бога, Бога који би сишао у њихово тело, живео у њиховом змијарнику, и својом свемоћном и свељубећом силом божанском извео их из пакла и зла.
        cn: 对上帝的可怕审判开始了。是的，它从犹大开始，并且此刻仍在继续。惊骇与恐惧在于，这场审判不是由身在地狱的魔鬼所执行，而是由地上的人类所执行。确实，如果说上帝有地狱，那便是大地；而其上的人类，则是折磨上帝的疯狂魔鬼。然而，如果地上的地狱不折磨谦和的上帝和主耶稣，它又怎能显明自己是地狱呢？如果人类不对神人基督表现出他们的态度，他们又怎能显明自己比魔鬼本身更糟糕呢？他们由此表明，除了道成肉身的上帝，没有人能将他们从他们的地狱和邪恶中拯救出来——这位上帝降入他们的肉身，住在他们那蛇窝般的地方，并以祂全能又全爱的神圣力量将他们从地狱和邪恶中引出。
    - type: paragraph
      text:
        ru: 'Сва непобедљива сила Исусова је баш у Његовој смиреној, но свемоћној кротости. Насиље савладати, обезоружати кротошћу, то је еванђелски пут победе добра над злом: «Исус му одговори: ако зло рекох, докажи да је зло; ако ли добро, зашто ме бијеш?». – На све то лицемерни Ана има један демонски одговор: «посла га свезана Кајафи».'
        cn: 耶稣一切不可战胜的力量，正是在于祂谦卑而全能的温柔。克服暴力，以温柔解除其武装，这就是善战胜恶的福音之道：「耶稣回答说：我若说得不好，你可以指证那不好；我若说得好，你为什么打我呢？」对此，伪善的亚拿给出了一个魔鬼般的回答：「将他捆绑，送到该亚法那里去了。」
    - type: paragraph
      text:
        ru: '«А Симон Петар стајаше и гријаше се. Онда му рекоше: Да ниси и ти од ученика Његових? А он се одрече и каза: Нисам. Рече један од слугу првосвештеникових, који бијаше рођак ономе што му Петар одсијече ухо: Не видјех ли ја тебе у врту са њим? Онда се Петар опет одрече; и одмах пијетао запјева. Исуса пак поведоше од Кајафе у судницу. А бјеше јутро, и они не уђоше у судницу да се не би оскврнили, него да би могли јести Пасху.» (Ин.18:25–28)'
        cn: «西门彼得站着，烤火取暖。有人对他说：你难道不是他的门徒吗？彼得却不承认，说：我不是。大祭司的一个仆人，是彼得削掉耳朵那人的亲戚，说：我不是看见你同他在园子里吗？彼得又否认了；立时鸡就叫了。他们把耶稣从该亚法的住所带到总督府。那时天还早，他们自己却没有进总督府，恐怕染了污秽，不能吃逾越节的筵席。» (约翰福音 18:25-28)
    - type: paragraph
      text:
        ru: 'А драма Петрова се несметано развија. За све то време «Петар стајаше и грејаше се». И душа тоне из тужног у трагично. Око ватре су слуге. И пред њима, пред слугама он се понова одрече Господа. На њихово питање: «да ниси и ти од ученика његових?» «он се одрече и рече: нисам». Прво одрицање: из страха од служавке; друго: из страха од слугу; треће одрицање: из страха од слуге, рођака Малховог, коме Петар отсече уво. Треће одрицање – «и одмах петао запева».'
        cn: 然而，彼得的戏剧却毫不受阻地发展着。在这整个过程中，彼得「站着烤火」。他的灵魂从悲伤沉沦至悲剧。火堆旁站着仆人们。在他们面前，在那些仆人面前，他再次否认了主。当他们问道：「你难道不也是他的门徒之一吗？」他否认道：「我不是。」第一次否认：出于对婢女的恐惧；第二次：出于对仆人们的恐惧；第三次否认：出于对那个被彼得砍掉耳朵的马勒库斯（Malchus）的亲戚，一个仆人的恐惧。第三次否认——「鸡随即就叫了。」
    - type: paragraph
      text:
        ru: Испуни се Спасово пророштво. Петао је буднији за Христово мучеништво на суду од Једанаесторице. И свеснији шта се дешава с Богом. Толико је грех, свеопшти грех, помрачио сазнање и савест људску, свеопште сазнање и свеопшту савест. И то помрачење лако захвата сазнање и савест сваког човека, па и апостола Петра, све док Дух Свети не буде сишао на њега.
        cn: 救主的预言应验了。公鸡对基督在审判中的受难比十一位门徒更加警醒。并且更清楚关于上帝所发生的一切。罪孽，普世的罪孽，如此深重地蒙蔽了人的认知与良知，普世的认知与普世的良知。而这种蒙蔽轻易地侵袭每个人的认知与良知，甚至使徒彼得，直到圣灵降临在他身上。
    - type: paragraph
      text:
        ru: '«Онда Пилат изиђе к њима нпоље и рече: Какву оптужбу износите против овога човјека? Одговорише му и рекоше: Кад он не би био злочинац, не бисмо Га предали теби. А Пилат им рече: Узите Га ви и по закону вашему судите Му. А Јудејци Му рекоше: Ми не смијемо никога погубити. Да се испуни ријеч Исусова коју рече, указујући каквом ће смрћу умријети. Онда уђе Пилат опет у судницу, па дозва Исуса и рече Му: Ти ли си цар јудејски? Одговори му Исус: Говориш ли ти то сам од себе, или ти други казаше о Мени? Пилат одговори: Зар сам ја Јудејац? Народ Твој и првосвештеници предаше Те мени. Шта си учинио? Исус одговори: Царство Моје није од овога свијета; кад би било од овога свијета царство Моје, слуге Моје би се бориле да не будем предан Јудејцима; али царство Моје није одавде. Тада Му рече Пилат: Дакле, ти си цар? Исус одговори: Ти кажеш да сам Ја цар. Ја сам за то рођен и за то сам дошао на свијет да свједочим истину. И сваки који је од истине слуша глас Мој. Рече Му Пилат: Шта је истина? И ово рекавши, изиђе опет Јудејцима, и рече им: Ја ниједне кривице не налазим на Њему. А у вас је обичај да једнога пустима на Пасху. Хоћете ли, дакле, да вам пустим цара јудејскога? Тада сви опет повикаше говорећи: Не овога, него Вараву! А Варава бјеше разбојник.» (Ин.18:29–40)'
        cn: '「于是彼拉多出来到他们那里，说：『你们用什么罪名控告这个人呢？』他们回答他说：『这人若不是作恶的，我们就不把他交给你了。』彼拉多对他们说：『你们自己带他去，按着你们的律法审判他吧。』犹太人对他说：『我们没有权柄处死任何人。』这是要应验耶稣所说的话，指示他将要怎样死。


          于是彼拉多又进了总督府，叫了耶稣来，对他说：『你是犹太人的王吗？』耶稣回答说：『这话是你自己说的呢，还是别人告诉论到我的呢？』彼拉多回答说：『我岂是犹太人呢？你的本国人和祭司长把你交给了我。你做了什么事呢？』耶稣回答说：『我的国不属这世界；如果我的国属这世界，我的仆人就会争战，使我不会被交给犹太人；但我的国不是从这里来的。』于是彼拉多对他说：『那么，你就是王了？』耶稣回答说：『你说了，我是王。我为此而生，也为此来到世间，特为真理作见证。凡属真理的人，就听我的声音。』彼拉多对他说：『真理是什么呢？』


          说了这话，他又出来到犹太人那里，对他们说：『我查不出他有什么罪。但你们有个规矩，在逾越节要我给你们释放一个人。那么，你们要我给你们释放犹太人的王吗？』他们就又都喊着说：『不要这个人，要巴拉巴！』巴拉巴是个强盗。」 （约翰福音 18:29-40）'
    - type: paragraph
      text:
        ru: 'Исус пред Пилатом: два опречна света: богопоклонички и човекопоклонички. Јер римски дух – сав у обожавању човека, и то трулежног, прљавог, развратног човека, максимално израженог у Августу – «цару и богу». Иако такав, Пилат ипак има више сазнања, па чак и осећања, за праведност и ревност Исусову него сви архијереји јеврејски и главари скупа. Пилатова је изјава искрена и јасна: «ја никакве кривице не налазим на Њему». А истину, Пилате, да ли налазиш у њему? Ти питаш Истину: «шта је то истина?» И Она ти не одговори. Знаш ли зашто? Зато што, ако је не видиш очима, како је можеш чути ушима? Јер једна иста душа гледа и кроз твоје очи, и чује кроз твоје уши. Римски скептицизам пројео је сва ткива твоје душе, и она није способна да осети истину, зато је не види и не чује ни у оваплоћеној Истини: Богочовеку Исусу, Богу Логосу.'
        cn: 耶稣在彼拉多面前：两个对立的世界——崇拜上帝的和崇拜人的。因为罗马精神，完全在于对人的崇拜，而且是对一个腐朽的、污秽的、淫荡的人的崇拜，这在奥古斯都——「君王和神」——身上得到了最大程度的体现。尽管如此，彼拉多对耶稣的公义和热忱却有着更多的了解，甚至感受，甚于所有犹太的大祭司和首领的总和。彼拉多的声明真诚而清晰：「我查不出他有什么罪来。」然而，彼拉多，你能在祂里面找到真理吗？你问真理：「真理是什么？」而祂没有回答你。你知道为什么吗？因为，如果你不用眼睛看到祂，又怎能用耳朵听到祂呢？因为同一个灵魂透过你的眼睛观看，也透过你的耳朵聆听。罗马的怀疑主义侵蚀了你灵魂的每一个组织，它无法感知真理，因此，它甚至无法在道成肉身的真理：神人耶稣，圣言上帝里面，看到和听到祂。
    - type: paragraph
      text:
        ru: Истина бескрајна, божанска, свеобухватна, то је царство Господа Христа.
        cn: 真理，无限的、神性的、包罗万象的，那就是主基督的国度。
    - type: paragraph
      text:
        ru: 'Он је зато рођен, и зато дошао «у свет да сведочи истину. И сваки који је од истине слуша глас» Његов. Сваки који је једним живим осећањем везан за Истину, за Бога живог и истинитог. То осећање се зачиње вером, а развија осталим светим врлинама и њиховим светим силама: љубављу, правдом, добротом, кротошћу, смиреношћу, трпљењем, молитвом, постом. И онда човек свим бићем осети да је Богочовек заиста и дошао у овај наш земаљски свет да сведочи Истину о Богу, о свету, о човеку, о животу, о смрти, и о свему што мучи људски дух и сазнање. Ничије сведочанство о истини иије тако оћно и свемоћно, тако убедљиво и свеубедљиво као Исусово. Јер је Он сав из онога света, из Божјег света, у нашем свету. И Собом је донео соу Истину Тросунчаног Божаиства, зато је смело и објавио себе као Истину, рвкавши: «Ја сам Истина». Зато царство Његово није од овога света, који «у злу лежи» и у коме царује лаж, и отац њен – ђаво. Царство Његово је царство Тројичног Божанства; оно је у оном свету са свима својим божанским бескрајностима и савршенствима. А дошло је у овај свет са Исусом. Само га треба примити од Исуса. Како?'
        cn: 他为此而生，也为此来到「世上，为要给真理作见证。凡属真理的人就听」他的声音。（约翰福音 18:37）凡是以活泼的感受与真理、与又活又真的上帝相连的，都是如此。这感受由信心所孕育，并借着其他圣德及其神圣力量而发展：爱、公义、良善、温柔、谦卑、忍耐、祷告、禁食。那时，人便会全然感受到，这道成肉身者确实来到我们这尘世，为要见证关于上帝、关于世界、关于人类、关于生命、关于死亡，以及关于一切困扰人类心灵与认知的真理。没有任何人对真理的见证，能像耶稣的见证那样有力、全能，那样具说服力、全然具说服力。因为他全然来自那个世界，来自上帝的世界，却身处我们的世界。他将三光神性的自身真理带到此世，因此他大胆地宣告自己就是真理，说：「我就是真理。」（约翰福音 14:6）因此，他的国不属这世界，这世界「卧在恶者手下」（约翰一书 5:19），谎言及其父——魔鬼——在其中掌权。他的国是三一神性的国度；它在那世界中，拥有其一切神圣的无限与完美。而它已随耶稣来到这世界。我们只需从耶稣那里领受它。如何领受呢？
    - type: paragraph
      text:
        ru: 'Вером у Њега као у Бога и Спаситеља, и држањем заповести Његових, јер су Божје. Да дође царство твоје; да буде воља твоја и на земљи као на небу». Царство Божје долази и улази у сваку душу човека који испуњује вољу Божју. То значи: који испуњује Еванђеље, јер је Бог сву вољу своју изразио преко Христа и његовог Еванђеља (ср.Еф.1:9). Царство Божје је «правда и мир и радост у Духу Светом» (Рим.14:17). Само када Дух Свети благодаћу испуни душу човекову, онда у њему завлада царство Божје, царство Вечне Истине Божје. И тек онда човек осети и сазна да царство Христово «није одавде», «није од овога света», већ од онога света, и у онаме свету, где су све његове бескрајне светиње и радости. Истина, оно се у овом свету зачиње и распростире у души човековој, да се у ономе свету продужи у Тросунчаном Божанству кроза све векове и кроза све вечности.'
        cn: 因信祂为神和救主，并遵守祂的诫命，因为它们是属神的。「愿你的国降临；愿你的旨意行在地上，如同行在天上。」神的国降临并进入每一个遵行神旨意之人的灵魂。这意味着：遵行福音的人，因为神已通过基督及其福音表达了祂所有的旨意（参以弗所书 1:9）。神的国是「公义、和平、并圣灵中的喜乐」（罗马书 14:17）。只有当圣灵以恩典充满人的灵魂时，神的国——神永恒真理的国度——才在他里面掌权。唯有那时，人才能感受到并知道基督的国「不属这里」，「不属这世界」，而是属于那个世界，并在那个世界里，那里有它所有无穷尽的圣洁与喜乐。确实，它在这个世界中在人的灵魂里萌生并扩展，以便在那个世界中，在三一之光的神性里，贯穿所有的世代和所有的永恒，得以延续。
    - type: paragraph
      text:
        ru: 'Колико је људско сазнање пало, и у гресима пропало, види се и из ове страшне чињенице: ослобађају тамнице разбојника Вараву, а не Богочовека Исуса. Заиста је у душама људским издан и убијен Бог пре но што га је Јуда издао. Он је завршитељ греха.'
        cn: 人类的认知何等堕落，又何等在罪中败坏，从这一可怕的事实中也可见一斑：他们释放了狱中的强盗巴拉巴，而非神人耶稣。确实地，在人的灵魂中，上帝在犹大出卖祂之前就已经被出卖并被杀害了。他就是罪恶的完成者。
  - type: heading2
    text:
      ru: Деветнаеста глава. Суђење Христу, распеће и погреб
      cn: 第十九章。基督受审、钉十字架和埋葬
    children:
    - type: paragraph
      text:
        ru: '«Тада, дакле, Пилат узе Исуса и ишиба Га. А војници оплетоше вијенац од трња и метнуше Му на главу и обукоше Му пурпурну хаљину, и говораху: Здраво, царе јудејски! И удараху Га по образима.» (Ин.19:1–3)'
        cn: 所以，彼拉多就将耶稣拿下，鞭打了祂。士兵们就用荆棘编作冠冕，戴在祂头上，又给祂穿上紫袍，又说：「恭喜，犹太人的王啊！」又用手掌打祂的脸。(约翰福音 19:1-3)
    - type: paragraph
      text:
        ru: 'Суђење Христу, распеће и погреб Пилат – човек разбијене душе и разорене савести. Типичан просечни Римљанин, саграђен од философоке скепсе и распусничке религије. Ту нема чврстог стожера савести ни карактера. Душа сва као живи песак, у коме се она сама стално дави, гуши и умире: непрекидни процес самоубиства. Пилат три пута изјављује да никакве кривице не налази на Исусу, па то тоне у живи песак његове душе, и он наређује да се Исус шиба. Онда «римско право» долази до свог уметничког израза: војници плету венац од трња, мећу га на главу Исусу, и облаче му скерлетну хаљину; бију га по образима, и исмевају: Здраво, царе Јудејски!'
        cn: '基督受审、被钉十字架与安葬


          彼拉多——一个灵魂破碎、良心泯灭的人。一个典型的、普通的罗马人，由哲学上的怀疑主义和放荡的宗教所构成。在他身上，良心和品格都没有坚实的支柱。他的灵魂完全如同流沙，在其中他自己不断地沉沦、窒息和死亡：一个不间断的自杀过程。彼拉多三次声明他在耶稣身上找不到任何罪，然而这声明却沉入他灵魂的流沙之中，于是他下令鞭打耶稣。接着，「罗马法」达到了其艺术化的表现：士兵们编织荆棘冠冕，戴在耶稣头上，给他穿上朱红色袍子；他们击打他的脸颊，并嘲讽说：「犹太人的王，万岁！」'
    - type: paragraph
      text:
        ru: '«Пилат пак опет изиђе напоље и рече им: Ево вам Га изводим напоље, да знате да на Њему не налазим ниједне кривице. А Исус изађе напоље носећи трнови вијенац и пурпурни огртач. И рече им Пилат: Ево човјека!» (Ин.19:4–5)'
        cn: 「彼拉多又出来，对他们说：『看哪，我带他出来见你们，叫你们知道我在他身上查不出一点罪来。』耶稣也出来，戴着荆棘冠冕，穿着紫色袍子。彼拉多对他们说：『看哪，这个人！』」 (约翰福音 19:4-5)
    - type: paragraph
      text:
        ru: 'Пилат је човекоугодник, као сваки типичан Римљанин, јер је навикао да служи многим боговима, са најопречнијим особинама. Да би угодио Јеврејима, он шиба Исуса, али да би донекле задовољио и своју савест која се дави у живом песку скептицизма, он понова изјављује Јеврејима да на Исусу не налази никакве кривице. Изводи Исуса напоље под венцем од трња и у скерлетној хаљини. Призор какав не виде свет, нити ће икада видети. Показује га Јеврејима са речима: «Ево човека!» – И не слути Пилат какву је божанску и вечну истину изрекао.'
        cn: 彼拉多是个讨好人的人，像所有典型的罗马人一样，因为他习惯于侍奉许多具有最相互矛盾特质的神祇。为了讨好犹太人，他鞭打耶稣；但为了在某种程度上也满足他自己的良心——这良心正淹没在怀疑主义的流沙之中——他再次向犹太人声明，他在耶稣身上找不到任何罪过。他把耶稣带出来，头戴荆棘冠冕，身披朱红色长袍。这是世上从未见过、也永远不会再见的景象。他指着耶稣对犹太人说：「看哪，这个人！」彼拉多并不晓得，他所说出的是何等神圣而永恒的真理。
    - type: paragraph
      text:
        ru: 'Сигурно по промислу Божјем. Пророк као Кајафа. Да би се показало, да људска природа понекад и невољно и несвесно служи Богу; и тиме казује праву себе, иако је искварена и покварена многим гресима и страстима. «Ево човека» – да, ево јединог уствари човека на земљи, правог, савршеног, безгрешног. Ни пре ни после Њега није било, нити ће бити таквог. Све што је најбоље, најлепше, најузвишеније, најбожанскије, најбесмртније, највеселије, најправедније у људској природи сабрало се и дало човека Исуса. Оваплоћење свега најузвишенијег: оваплоћење Бога. Пророчка је реч Пилатова. На Исусу – човеку стоји сва божанска истина о свету, стоји сав домастрој спасења света. Човеком, за човека и у име човека – Богочовек је извршио спасење рода људског.'
        cn: 这无疑是出于神的旨意。犹如该亚法先知。以此表明，人性有时即便是不情愿、无意识地，也在服事上帝；并借此显露其真实自我，尽管它已被诸多罪恶与情欲所败坏和玷污。「看哪，这个人！」——是的，看哪，这是世上唯一真正的人，真实的，完美的，无罪的。祂之前没有，祂之后也不会有这样的人。人性中一切最美善的、最美丽的、最崇高的、最神圣的、最不朽的、最喜乐的、最公义的，都汇聚一堂，构成了人子耶稣。这是对一切最崇高之事的道成肉身：是上帝的道成肉身。彼拉多的话语带有先知性。在人子耶稣身上，蕴含着关于世界的一切神圣真理，蕴含着世界救赎的整体经纶。藉着人、为了人、并以人的名义——这神人（基督）完成了对人类的救赎。
    - type: paragraph
      text:
        ru: 'Богочовек са трновим венцем на глави, зар то није сав пут хришћанске Цркве кроз историју? Увек са трновим венцем, али спокојна и мирна, јер зна да као таква даје спасење свету. «Ево човека» – без кривице и пред људима и пред Богом; другим речима: ево човека без греха. Зато Он и спасава од греха. Јер кад Он има силе да не пусти у себе, и да не допусти у себи грех, онда том истом силом може сатрти грех у сваком другом човеку, и у свима људима. «Ево човека», и то не само без кривице пред Богом и људима, већ без икакве кривице. Сведочанстао незнабошца – многобошца Пилата; а друго је сведочанство изабраног народа: нико га није могао не само ухватити у греху него ни прекорети за грех (Ин.8:46). Тако се добило сведочанство о безгрешности човека Исуса од целокупног рода људског.'
        cn: 头戴荆棘冠冕的神人，这难道不是基督教会贯穿历史的全部道路吗？她永远戴着荆棘冠冕，但却安详平和，因为她知道，唯有如此才能将救赎赐予世界。「看哪，这个人！」——他在世人面前和在上帝面前都毫无过犯；换言之：看哪，这个人没有罪。因此，他才将人从罪中拯救出来。因为当他有能力不让罪进入自己，也不容许罪在自己里面存在时，他就能以同样的能力，在每一个其他人身上，以及在所有人类中，将罪彻底粉碎。「看哪，这个人！」——他不仅在上帝和世人面前没有过犯，而是毫无任何过犯。这是异教徒——多神论者彼拉多的见证；而另一个见证则来自选民：没有人能不仅在罪上抓到他，甚至不能为罪指责他（约翰福音 8:46）。如此，关于人子耶稣的无罪的见证，便从全人类中得到了。
    - type: paragraph
      text:
        ru: '«Када Га, дакле, видјеше првосвештеници и слуге, повикаше говорећи: Распни га, распни! Пилат им рече: Узмите Га и и распните, јер ја на налазим на Њему кривице. Одговорише му Јудејци: Ми имамо закон и по закону нашему мора да умре, јер начини себе Сином Божијим. Када, дакле, Пилат чу ову ријеч, побоја се већма. И опет уђе у судницу, и рече Исусу: Одакле си ти? А Исус му не даде одговора.» (Ин.19:6–9)'
        cn: 「所以，当祭司长和差役看见祂，就喊叫着说：钉祂十字架！钉祂十字架！彼拉多对他们说：你们自己把祂带去钉十字架吧，因为我在祂身上查不出罪来。犹太人回答说：我们有律法，按着我们的律法，祂是该死的，因为祂自称是神的儿子。彼拉多听见这话，就越发害怕。又进了衙门，对耶稣说：你是哪里来的？耶稣却不回答他。」 (约翰福音 19:6-9)
    - type: paragraph
      text:
        ru: 'Како је, са вишег гледишта, беспомоћна римска одбрана човека пред људима, а камо ли спасење човека од греха, смрти и ђавола, показује Пилатова немоћ у одбрани Исуса од богоборних Јевреја. На његове речи: «Ево човека», – «главари свештенички и момци повикаше говорећи: распни га, распни». А Пилат, а претставник римске правне овести, шта ради, како брани и одбрањује човека на коме «никакве кривице» не налази? Ево како: «Рече им Пилат: узмите га ви и распните, јер ја не налазим на њему кривице». – Претставник римске савести не може да одбрани човека на коме нема никакве кривице; а претставници, самозвани претставници јеврејског закона хоће да убију човека на коме нема никакве кривице: «јер начини себе сином Божјим».'
        cn: 从更高的视角来看，罗马人在世人面前对人的辩护是多么的无助，更不用说人从罪、死亡和魔鬼中得拯救了，这体现在彼拉多在与神为敌的犹太人面前无法为耶稣辩护。当他说：「看哪，这个人！」（约翰福音 19:5）——「祭司长和差役就喊着说：钉他十字架！钉他十字架！」（约翰福音 19:6）彼拉多作为罗马法律良知的代表，他做了什么？他如何为这个他「丝毫没有罪过」的人辩护并保护？他是这样做的：「彼拉多对他们说：你们自己带他去钉十字架吧，因为我查不出他有什么罪来。」（约翰福音 19:6）——罗马良知的代表无法为这个没有任何罪过的人辩护；而犹太律法的代表，那些自称是其代表的人，却要杀死这个没有任何罪过的人：「因为他自称是神的儿子。」（约翰福音 19:7）
    - type: paragraph
      text:
        ru: 'По закону Божјем, израженим преко Мојсија и прорака, хвали се и подржава синовство човечје према Богу. Али они који оставивши Закон Божји «ради предања стараца», оставили су и изоставили су, потрли су и погазили су, све што је Божје у Закону, а остали при прању чаше споља. Они и тврде да Исус на коме нема никакве кривице: «ваља по нашем закону да умре, јер начини себе сином Божјим». «Кад Пилат чу ову реч, уплаши се веома». Заишто се Пилат «веома уплаши»? Њега није везивао јеврејски религиозни закон. Имао је да суди по прописима римског права, и то само политичке кривице. Вероватно да је овом тврђењу Пилат дао чисто многобожачко значење: Августи су били код њих богови, и синови божји. Ако је Исус – Син Божји – да не буде ту неке политичке толеранције? И Пилат улази у судницу, и испитује Исуса: «одакле си ти?» А Исус? – «А Исус му не даде одговора». Зашто одговарати човеку који све зида на живом песку? На живом песку личне користи и многобожачког непознавања истине. Поготову, када је Својим божаиским погледом Спаситељ до дна сагледао и видео Пилатову душу и све шта ће он као римски судија учинити са њим.'
        cn: 按照神的律法，经由摩西和先知所表达的，人的子女身份对神而言是值得称颂和支持的。但是那些为了「古人的遗传」而抛弃神律法的人，他们抛弃、省去、废除、践踏了律法中一切属神之物，却只顾洗净杯盘的外面。他们还声称，耶稣毫无过犯：「按着我们的律法，他当死，因为他自称是神的儿子。」「彼拉多听见这话，就越发害怕。」彼拉多为何「越发害怕」呢？犹太人的宗教律法并不约束他。他理应依照罗马法律的规定进行审判，而且仅限于政治罪行。彼拉多很可能对这种说法赋予了纯粹的多神论意义：奥古斯都皇帝们在他们看来是神，也是神的儿子。如果耶稣是——神的儿子——难道就没有某种政治上的宽容吗？于是彼拉多进了衙门，审问耶稣：「你是什么地方的人？」耶稣呢？——「耶稣却不回答他。」何必回答一个把一切都建立在流沙之上的人呢？建立在个人利益和多神论对真理的无知之上的流沙。尤其当救主以其神圣的目光彻底看透并洞察了彼拉多的灵魂，以及他作为罗马审判官将如何对待祂的一切时。
    - type: paragraph
      text:
        ru: '«Пилат Му тада рече: Зар мени не одговараш? Не знаш ли да имам власт да Те распнем и власт имам да Те пустим? Исус одговори: не би имао власти никакве нада Мном када ти не би било дано одозго; зато онај који Ме предаде теби има већи гријех. Од тада гледаше Пилат да Га пусти. Али Јудејци викаху говорећи: Ако овога пустиш, ниси пријатељ ћесару. Сваки који себе царем гради противи се ћесару.» (Ин.19:10–12)'
        cn: «彼拉多就对祂说：你不回答我吗？你不知道我有权柄把你钉十字架，也有权柄释放你吗？耶稣回答说：若不是从上头赐给你，你就毫无权柄待我；所以，把我交给你的那人罪更大。从那时起，彼拉多就设法要释放祂。但犹太人喊着说：你若释放这个人，就不是凯撒的朋友。凡自称是王的，就是与凯撒作对。» (约翰福音 19:10-12)
    - type: paragraph
      text:
        ru: 'Увређен Исусовим ћутањем, «Пилат му рече: зар мени ни одговараш? не знаш ли да имам власт распети те, и власт имам пустити те?» – Опет плитко, стојичко, римско гледање на ствари. Пилат и не слути ко је све умешан у Исусову ствар. Када би дубље загледао у змијски сплет јеврејске зависти према Исусу, сагледао би делатност онога што сав уђе у Јуду – Сатане. А изнад те, и око те сатанске игре, Божји промисао који кроз Исусово страдање врши спасење света од греха, смрти и Сатане. Зато Господ Исус и одговара Пилату: «Не би имао власти никакве нада мном кад ти не би било дано одозго зато онај има већи грех који ме предаде теби». План о спасењу овета Богочовеком Исусом «одозго» је, Божји је.'
        cn: 被耶稣的沉默所触怒，「彼拉多对他说：你竟不回答我吗？你岂不知我有权柄钉你十字架，也有权柄释放你吗？」（约翰福音 19:10）——这又是对事物肤浅的、斯多葛主义的、罗马式的看法。彼拉多丝毫不知有谁卷入了耶稣之事。若他能更深入地审视犹太人对耶稣那盘根错节的毒蛇纠葛般的嫉妒，他就会看到那完全进入犹大的——撒但——的作为。而在那撒但的游戏之上，围绕着那游戏，是神的护理，它借着耶稣的受难，完成了世界从罪、死亡和撒但中得到的救赎。因此主耶稣才回答彼拉多说：「若不是从上头赐给你的，你绝不能有任何权柄临到我；所以，把我交给你的人，罪更重了。」（约翰福音 19:11）由神人耶稣完成的世界救赎计划是「从上头来的」，是神的。
    - type: paragraph
      text:
        ru: 'Ометати остварење тог плана – грех је, и то: највећи грех. Омета га Сатана кроз људе: кроз Јуду, кроз свештеничке главаре и фарисеје и остале христомрсце. То је све један и исти грех, само неки људи учествују у њему јаче, неки слабије. Пилатов грех у овом случају је мањи од Јудиног, који кроз главаре свештеничке предаде Исуса Пилату. Кротки и неочекивано за Пилата мудри одговор Исусов потстаче Пилата да се озбиљно замисли над целом овом ствари, уколико то може душа – живи песак. «Од тада, вели Еванђелист, гледаше Пилат да га пусти». То није дуго трајало: вика Јевреја је брзо покренула живи песак душе Пилатове, и у Пилата се све изменило. «Јевреји викаху говорећи: ако овога пустиш ниси пријатељ ћесару. Сваки који себе царем гради противи се ћесару». – Јевреји су нашли пут за остварење своје намере. Потегли су питање ћесара, и изјавили да немају цара осим ћесара, када им је Пилат указао на Исуса и рекао: «ево цар ваш». На то «они викаху: узми, узми, распни га. Пилат им рече: зар цара вашега да распнем? Одговорише главари свештенички: ми немамо цара осим ћесара. Тада им га предаде да се разапне».'
        cn: 阻碍那一计划的实现——是罪，而且：是最大的罪。撒旦通过人来阻碍它：通过犹大，通过祭司长和法利赛人，以及其他憎恨基督的人。这都是同一个罪，只是有些人参与的程度更深，有些人更浅。在此情形下，彼拉多的罪小于犹大的罪，因为犹大是通过祭司长将耶稣交给彼拉多的。耶稣那谦和且出乎彼拉多意料的智慧回答，促使彼拉多认真思考整个事件，如果一颗（如流沙般）不定的灵魂能够如此的话。「从那时起，」福音书作者说，「彼拉多就设法要释放他。」这并没有持续多久：犹太人的叫喊声迅速搅动了彼拉多灵魂的流沙，彼拉多的一切都改变了。「犹太人喊着说：你若释放这个人，就不是凯撒的朋友了。凡是自称君王的，都是与凯撒作对。」——犹太人找到了实现其意图的途径。他们提起了凯撒的问题，并宣称除了凯撒，他们没有君王，那时彼拉多指着耶稣说：「看哪，这是你们的王。」对此，「他们喊着说：除掉他，除掉他，钉他十字架！彼拉多对他们说：我岂可把你们的王钉十字架吗？祭司长回答说：除了凯撒，我们没有君王。于是彼拉多将他交给他们去钉十字架。」
    - type: paragraph
      text:
        ru: '«Пилат, дакле, чувши ову ријеч изведе Исуса напоље, и сједе на судијску столицу, на мјесту званом Литостротон, а јеврејски Гавата. А бјеше ппетак уочи Пасхе, око шестога часа; и он рече Јудејцима: Ево цар ваш! А они повикаше: Узми, узми, распни Га! Пилат им рече: Зар цара вашега да разапнем? Одговорише првосвештеници: Немамо цара осим ћесара. Тада, дакле, предаде Га њима да се разапне. А они узеше Исуса и одведоше.»'
        cn: 彼拉多听了这话，就把耶稣带出来，坐上审判台，在名叫「铺华石处」的地方，希伯来话叫作「迦巴大」。那时是逾越节的预备日，约在午时。他对犹太人说：「看哪，这是你们的王！」他们就喊着说：「除掉他！除掉他！钉他十字架！」彼拉多对他们说：「我岂可把你们的王钉十字架呢？」祭司长回答说：「除了凯撒，我们没有王。」于是，彼拉多就把耶稣交给他们去钉十字架。他们就把耶稣带了去。（约翰福音 19:13-16）
    - type: paragraph
      text:
        ru: Пилате, зашто? Ти предаде Исуса да се разапне, а не рече зашто, не објави викакву кривицу Његову. Смртна пресуда, изречена римским правом, заснована ни на чему. Шта се може онда очекивати од таквог права, када у њему нема нимало правде. Право без правде је увек насиље. У овом случају – врховно насиље, јер осуђује на смрт човека – без икакве кривице, човека – без икаквог греха, осуђује Богочовека. Тако се на Исусовом случају показало најочигледније колико је све људско заиста грешно сувише, и колико је сам људски грех, и сав људски грех – заиста «и сувише грешан». Тешко човеку који се узда у човека.
        cn: 彼拉多，为什么？你将耶稣交出钉十字架，却没有说明理由，也没有宣告他有任何罪过。由罗马法律宣判的死刑判决，却没有任何依据。那么，当这样的法律中毫无正义的时候，我们又能指望什么呢？没有正义的法律永远是暴力。在这个案例中，这是极端的暴力，因为它判处了一个——没有任何罪过的——人死刑，判处了一个——没有任何罪恶的——人，它判处了道成肉身的神人。因此，在耶稣的案例中，最明显地显示出所有人性是何等真实地过于有罪，以及人类自身的罪恶，和所有人类的罪恶——真实地「甚至过于有罪」。祸哉那信赖人的人。
    - type: paragraph
      text:
        ru: 'А кроз свету душу пророка, то се извеја у оправдано проклетство: «Проклет човек који се узда у човека».'
        cn: 于是，藉着先知的圣洁灵魂，这便凝聚成一句公义的咒诅：「凡倚靠人的，是受咒诅的。」
  - type: heading2
    text:
      ru: Распеће Христово – брига о богомајци
      cn: 基督受难——照料圣母
    children:
    - type: paragraph
      text:
        ru: «И носећи крст свој изиђе на мјесто звано Лобања, а јеврејски Голгота. Ондје Га разапеше, и са Њим другу двојицу, с једне и са друге стране, а Исуса у средини.» (Ин.19:17–18)
        cn: 「他背着自己的十字架，出来到一个名叫『髑髅地』的地方，希伯来语叫『各各他』。在那里，他们把他钉在十字架上，又与他同钉另外两个人，一边一个，耶稣在中间。」 (约翰福音 19:17-18)
    - type: paragraph
      text:
        ru: 'Богочовека распињу на Голготи. Голгота = лобања: снмвол васцеле земље, јер смрт опустошила тело земље, скинула све са ње, и остала од ње сама лобања, сама кост: костурница. То и символика човека уопште: смрт скинула с његоог тела све, остала само лобања; и изнутра однела све: тако од човека остала сама костурница. У црквеном иконопису обично: крст забоден у звмљу, право над лобању. По предању: Адамова лобања. Свеистинито цредање: лобања човечанства, из које је смрт истерала све живо, а крст јој ваокрсењем повраћа живот, и то живот вечни. Коштурница постаје васкрсница. Смрћу је Господ сатро смрт васкрснувши из мртвих.'
        cn: 神人在各各他山上被钉死。各各他即是骷髅：这是整个大地的象征，因为死亡已将大地的身体掏空，将其上的一切剥去，只剩下骷髅本身，只剩下骨头：成了一座骸骨堆。这也是人类整体的象征：死亡从他身体上剥去了一切，只剩下骷髅；从内部也带走了一切：于是人只剩下一堆骸骨。在教会的圣像画中，通常是：十字架插在土里，正好在骷髅上方。根据传统：那是亚当的骷髅。一个完全真实的信念是：那是全人类的骷髅，死亡已将其中一切生机驱逐殆尽，而十字架借着复活使其生命复得，而且是永恒的生命。骸骨堆变成了复活之地。主藉着祂的死亡，并藉着从死里复活，摧毁了死亡。
    - type: paragraph
      text:
        ru: '«Пилат пак написа и натпис, па постави на крст; а бјеше написано: Исус Назарећанин цар јудејски. И овај натпис читаше многи Јудејци, јер близу града бјеше мјесто гдје разапеше Исуса; и бјеше написано јеверејски, јелински и римски. А првосвештеници јудејски говораху Пилату: Не пиши: цар јудејски, него да Он рече: Ја сам цар јудејски. Пилат одговори: Што писах, писах.» (Ин.19:19–22)'
        cn: «彼拉多又写了一个牌子，把它安在十字架上；上面写着：「拿撒勒人耶稣，犹太人的王。」有许多犹太人读了这个牌子，因为耶稣被钉十字架的地方离城不远；而且牌子是用希伯来语、希腊语和拉丁语写的。犹太人的祭司长就对彼拉多说：「不要写『犹太人的王』，倒要写：『他说：我是犹太人的王。』」彼拉多回答说：「我所写的，我已经写了。」» (约翰福音 19:19-22)
    - type: paragraph
      text:
        ru: 'Пилат је открио разлог због кога је Господа невиног осудио на распеће: «Пилат написа и натпис и метну на крст: Исус Назарећанин цар Јудејски»«, и то на три јеаика: јеврејски, грчки, латински, да би свима у васељени било знано зашто је то учињено. Само, Пилат је од Самог Господа Исуса добио објашњење: да царство Његово није од овога свега. Јасно: Пилат је очигледну, и за њега самог клевету примио као разлог да Исуса осуди на смрт. Утолико је грех његов већи. А и од овог греха већи је грех оиих који хоће да подметну Исусу као да је Он сам за себе рекао: ја сам цар Јудејски.'
        cn: '彼拉多揭示了他将无辜的主判处钉死在十字架上的原因：


          「彼拉多写了一个牌子，安在十字架上，写着：拿撒勒人耶稣，犹太人的王」，并且用三种语言书写：希伯来语、希腊语和拉丁语，为要让世上所有人都知道为何如此行。


          然而，彼拉多从主耶稣自己那里得到了解释：祂的国不属于这世上的一切。显然，彼拉多将一个显而易见、且对他自身而言是诽谤的指控当作理由，判耶稣死刑。他的罪因此而更大。而比这罪更大的罪，是那些想要诬陷耶稣，仿佛是祂自己说的：「我是犹太人的王」的人所犯的罪。'
    - type: paragraph
      text:
        ru: '«Војници пак када разапеше Исуса, узеше хаљине Његове и начинише четири дијела, свакоме војнику по дио, и доламу; а долама не бјеше шивена него изаткана изједна. Онда рекоше међу собом: Да је не деремо, него да бацимо коцку за њу коме ће допасти. Да се испуни Писмо које говори: Раздијелише хаљине Моје међу собом, и за доламу Моју бацише коцку. Војници, дакле, тако учинише.» (Ин.19:23–24)'
        cn: «士兵们钉了耶稣之后，拿了祂的衣服，分成四份，每个士兵一份，以及里衣；而这里衣不是缝制的，乃是上下一片织成的。于是他们彼此说：不要撕裂它，乃是为它拈阄，看归谁。这是要应验经上的话，说：他们分了我的外衣，又为我的里衣拈阄。士兵们因此就这样行了。» (约翰福音 19:23-24)
    - type: paragraph
      text:
        ru: Војници деле хаљине Исусове, а за доламу бацају коцке. Тако, и несвесно за њих, преко њих се извршује пророштво о томе. Божји човекољубиви промисао све окреће на спасење, и када то људи или упорно неће или се несвесно противе томе и раде против тога.
        cn: 士兵们分了耶稣的衣裳，又为里衣拈阄。就这样，即使他们自己并不知道，相关的预言也借着他们得以应验。上帝仁爱世人的眷顾使万事都转为救赎，即便当人们执意不愿，或无意识地抵触并对抗这旨意之时。
    - type: paragraph
      text:
        ru: '«А стајаху код Исусова крста Мати Његова, и сестре Матере Његове, Марија Клеопова, и Марија Магдалина. А Исус видјевши Матер и ученика кога љубљаше гдје стоји поред Ње, рече Матери Својој: Жено, ето ти сина! Потом рече ученику: Ево ти мајке! И од онога часа узе је ученик к себи.» (Ин.19:25–27)'
        cn: 站在耶稣的十字架旁的，有祂的母亲，和祂母亲的姊妹们，革罗罢的马利亚，和抹大拉的马利亚。耶稣看见祂的母亲，和祂所爱的那门徒站在她旁边，就对祂的母亲说：「妇人，看，你的儿子！」然后祂对那门徒说：「看，你的母亲！」从那一刻起，那门徒就把她接到自己家里去了。 (约翰福音 19:25-27)
    - type: paragraph
      text:
        ru: У овом свеопштем мраку, у коме из греха у грех посрћу и стропоштавају се људске свести и савести, једину светлост сачињавају жене. То је и једина радост за несрећно биће људско. Јер ниједна жена није учествовала у издавању и мучењу и распињању Исуса. Штавише, ево их и крај крста, иако то претставља очигледну опасност по њих. И, о срећног изузетка за несрећне људе! са њима је и «ученик кога Исус љубљаше». Тако се и људи имају за неког заклонити.
        cn: '在这普世的黑暗中，人的意识和良知从一个罪孽跌入另一个罪孽，步履蹒跚，坠入深渊，而唯一的亮光就是女性。

          这也是不幸的人类唯一的喜乐。

          因为没有一个女性参与了出卖、折磨和钉死耶稣的事。

          此外，看，她们甚至也在十字架旁，尽管那对她们构成了明显的危险。

          哦，对于不幸的人类来说，这是何等幸福的例外！与她们在一起的还有「耶稣所爱的门徒」。

          如此，人们也当有所倚靠。'
    - type: paragraph
      text:
        ru: 'И онда се збио божански дирљив призор: Најсавршенији Син препоручује на чување Своју нежну Мајку, Најсавршенију Мајку на земљи, Своме љубљеном ученику. Њему вели: «ето ти матере!» а Њој: «ето ти сина!» Како ли је божански савршен био «ученик кога љубљаше Исус» када се удостојио да постане други син Богомајке, као рођени брат Јединородног. Морало је у њему бити нешто изузетно мило, љупко, божанствено збаг чега га је Господ свељубећи волео изузетном љубављу. Њему је Господ и поверио Богомајку, као да му је са Њом поверио Цркву. Ова дирљива брига Господа Христа о Богомајци, када Он виси у мукама на крсту, чини саставни део богочовечанског домостроја спасења.'
        cn: 于是上演了神圣而感人的一幕：最完美的圣子将祂温柔的母亲，世上最完美的母亲，托付给祂所爱的门徒看顾。祂对他说：「看，你的母亲！」而对她说：「看，你的儿子！」这「耶稣所爱的门徒」该是多么神圣而完美啊，当他蒙受殊荣成为圣母的第二个儿子，犹如独生子的亲兄弟。他里面必然有某种格外蒙爱、可爱、神圣之处，因此主全然地爱着他，以非凡的爱爱着他。主也将圣母托付给他，仿佛与她一同将教会也托付给了他。主基督对圣母这份感人肺腑的关怀，当祂在十字架上受难悬挂时，构成了神人救赎计划中不可分割的一部分。
    - type: paragraph
      text:
        ru: 'Света брига о Мајци: ни у највећим мукама не заборављати иа Њу, па макар та мука била свекосмичка као што је мука спасења света. Јер је еванђелски саставни део те муке: нежна брига о Мајци.'
        cn: 对圣母的圣洁关怀：即使在最深的苦难中也不要忘记她，即便那苦难是普世性的，如同拯救世界的苦难。因为，那苦难中福音性的构成部分，就是对圣母的温柔关怀。
    - type: paragraph
      text:
        ru: '«Послије тога, знајући Исус да се већ све извршило, да се сасвим испуни Писмо рече: Жедан сам! Стајаше пак суд пун оцта; а они напунише сунђер оцта, и натакнувши на трску, принесоше устима Његовим. А када Исус окуси оцат рече: Сврши се! И преклонивши главу, предаде дух.» (Ин.19:28–30)'
        cn: 「此后，耶稣知道一切都已成就，为要使经文完全应验，就说：「我渴了！」那里放着一个装满了醋的器皿；他们就拿海绵蘸满了醋，绑在苇子上，送到他嘴边。耶稣尝了那醋，就说：「成了！」于是他低下头，气就断了。」（约翰福音 19:28-30）
    - type: paragraph
      text:
        ru: 'До последњег часа, до издахнућа Исус остаје прави човек, истинити човек. Ево, Он на крсту жедни. Његова природа људска изјављује: «жедан сам». Тако се испуњују сва света пророштва не само о Његовој божанској природи већ и о Његовој човечанској природи. Њему дају оцат. «А кад прими Исус оцат рече: свриш се. И приклонивши главу предаде дух свој». «Сврши се» – тајна спасења света: Богочовек силази у царство смрти, да смрћу сатре смрт, и васкрсењем изведе род људски из царства смрти, греха и ђавола. «Сврши се» пут Његовог човечанског живота на земљи; сврши се богочовечански подвиг, који је почео рођењем од Свете Дјеве у пећнни, а завршава се на Крсту, опет пред Светом Дјевом и Мајком свенежном.'
        cn: 直到最后一刻，直到断气，耶稣仍是真正的人，真实的人。看啊，他在十字架上口渴了。他的人性宣告说：「我渴了。」如此，所有神圣的预言得以应验，不仅是关于他的神性，而且是关于他的人性。他们给他醋。「当耶稣接过那醋，就说：成了。就低下头，将灵魂交付了。」「成了」——这是世界救赎的奥秘：神人降入死亡的国度，为要藉着死败坏死亡，并藉着复活将人类领出死亡、罪恶和魔鬼的国度。「成了」——他在世上属人的生命之路结束了；神人一体的圣工结束了，这圣工始于圣童贞女在洞穴中的诞生，却结束在十字架上，再次在圣童贞女和至慈圣母面前。
  - type: heading2
    text:
      ru: Погребење Христово
      cn: 基督的安葬
    children:
    - type: paragraph
      text:
        ru: '«А будући да бјеше петак, па да не би тијела остала на крсту у суботу, јер бијаше велики дан она субота, Јудејци замолише Пилата да им се пребију голијени, па да их скину. Онда дођоше војници, и првоме пребише голијени и другоме распетоме с њим; А дошавши до Исуса, кад видјеше да је већ умро, не пребише Му голијени, него један од војника прободе Му ребра копљем; и одмах изиђе крв и вода. И онај који је видио, посвједочио је, и истинито је свједочанство његово, и он зна да истину говори, да и ви вјерујете. Јер се ово догоди да се испуни Писмо: кост Његова неће се преломити. И опет друго Писмо говори: Погледаће на онога кога прободоше.» (Ин.19:31–37)'
        cn: 「到了那日是预备日，因为那天是星期五，为免得尸首在安息日留在十字架上，因为那安息日是个大日，犹太人就求彼拉多，叫他们的腿打断，好把他们拿去。于是兵丁来了，把头一个人的腿打断了，又把与耶稣同钉十字架的另一个人的腿打断了。但是走到耶稣那里，见他已经死了，就不打断他的腿；惟有一个兵丁用枪扎他的肋旁，立刻有血和水流出来。看见这事的，就作见证，他的见证是真的，他也知道自己所说的是真的，为要叫你们也可以信。这些事成了，为要应验经上的话说：『他的骨头一根也不可折断。』另有一句经文说：『他们要仰望自己所扎的人。』」 (约翰福音 19:31-37)
    - type: paragraph
      text:
        ru: Гоњени христоборством, сагоревани христомржњом, Јевреји опет чине нешто што изазива остварење месијанских пророштава. Да би се утврдила смрт, да би се они уверили да је Исус стварно мртав, а не привидно или непотпуно, они захтевају да Му војници пребију колееа. А они, пошто се уверише да је већ умро, не пребише му колена, него један од војника прободе Му ребра копљем и одмах изиђе крв и вода». – Све ово виде «ученик кога љубљаше Исус», и посведочи, и зато је «сведочанство његово истинито». Истинито и као остварено пророштво, истинито и као стварност коју је он очима својим видео.
        cn: 被对抗基督的冲动驱使，被对基督的仇恨焚烧着，犹太人再次做出引发弥赛亚预言实现的事情。为了确认死亡，为了让他们确信耶稣是真的死了，而不是假死或未完全死亡，他们要求士兵打断祂的腿骨。但他们，既然确信祂已经死了，就没有打断祂的腿骨，而是一个士兵用枪刺入祂的肋旁，立刻有血和水流出来。」（约翰福音 19:34）这一切都为「耶稣所爱的门徒」所见，并且他作了见证，所以「他的见证是真的」。（约翰福音 19:35）这见证是真实的，既是已实现的预言，也是他亲眼所见的真实。
    - type: paragraph
      text:
        ru: 'Тако: остварена су сва света месијанска пророштва о Спаситељу, завршен је богочовечаиски подвиг Његов на земљи.'
        cn: 如此：关于救主的一切神圣的弥赛亚预言都已应验，祂在世上的神人功绩也已完成。
    - type: paragraph
      text:
        ru: «А потом Јосиф из Ариматеје, који бјеше ученик Исусов, али кришом због страха од Јудејаца, замоли Пилата да узме тијело Исусово. И допусти Пилат. Онда дође и узе тијело Исусово. А дође и Никодим, који је први пут долазио ноћу Исусу, и донесе помијешане смирне и алоја око сто литара. Тада узеше тијело Исусово, и обавише Га платном с мирисима, као што је обичај у Јудејаца да сахрањују. А на ономе мјесту, гдје бјеше распет био је врт, и у врту гроб нов, у који још нико не бијаше положен. Ондје, дакле, због петка јудејскога, пошто бјеше близу гроб, положише Исуса.» (Ин.19:38–42)
        cn: «之后，亚利马太的约瑟，他是耶稣的门徒，只是因为怕犹太人，就暗暗地作门徒，他求彼拉多，要取走耶稣的身体。彼拉多就允许了。他就来，把耶稣的身体取走了。又有尼哥德慕也来了，就是先前夜里去见耶稣的那位；他带着没药和沉香，约有一百斤。他们就取了耶稣的身体，用细麻布和香料包裹了，照着犹太人安葬的规矩。耶稣被钉十字架的地方，有一个园子，园子里有一个新坟墓，里面还没有人安葬过。所以，因为是犹太人的预备日，又因那坟墓就在近处，他们就把耶稣安放在那里。» (约翰福音 19:38-42)
    - type: paragraph
      text:
        ru: 'Подвиг тајних ученика Христових: Јосифа и Никодима, потресан је. Они су, иако тајни, чак и до овог страшног тренутка остали верни и истрајни. Штавише, њихова храброст баш у овим часовима поражава. Разбегли се јавни ученици, а састали се тајни, да доврше велико дело. Они сахрањују Господа Христа: помазују га мирисима, обавијају платном, плаштаницом, и мећу у нов гроб.'
        cn: 基督隐秘门徒约瑟和尼哥底母的壮举，令人震撼。他们，虽然是隐秘门徒，却甚至直到这个可怕的时刻，仍然忠贞不渝，并坚韧不拔。更甚者，他们正是在这些时刻所展现的勇气，令人惊叹。公开的门徒都逃散了，隐秘的门徒却聚集起来，为了完成这项伟大的工作。他们埋葬了主基督：用香料膏抹他，用细麻布，也就是殓布，包裹他，并将他安放在一个新坟墓里。
    - type: paragraph
      text:
        ru: 'Како је било у душама ове дивне двојице када су сахрањивали – Бога и Господа Христа? Сигурно се над тајном том запрепастило све у њима. Нема сумње они су овај свети укоп обавили као неку свету тајну. Несумњиво свету, јер је она саставни део оне грандиозне и свесвете тајне, која се назива: Богочовечански подвиг спасења света.'
        cn: 当他们安葬——上帝和主基督——的时候，这两位可敬之人的灵魂作何感受？无疑，他们内心的一切都为此奥秘而惊愕不已。毫无疑问，他们以一个神圣奥秘的方式完成了这次神圣的安葬。这无疑是神圣的，因为它正是那个宏伟而至圣奥秘的组成部分，而那个奥秘被称为：神人救赎世界的壮举。
  - type: heading2
    text:
      ru: Глава двадесета. Васкрсење Христово и јављање ученицима
      cn: 第二十章。基督复活及向门徒显现
    children:
    - type: paragraph
      text:
        ru: '«А у први дан седмице дође Марија Магдалина на гроб рано, док још бјеше мрак, и видје да је камен дигнут са гроба. Онда отрча и дође Симону Петру и другом ученику кога љубљаше Исус, и рече им: Узеше Господа из гроба, и не знамо гдје Га положише. Тада изиђе Петар и други ученик, и пођоше ка гробу. Трчаху пак оба заједно, и други ученик трчаше брже од Петра и стиже први на гроб. И надвиривши се, видје покрове гдје леже; али не уђе. Тада стиже Симон Петар за њим и уђе у гроб и видје покрове гдје леже. И убрус који бјеше на глави Његовој, да не лежи са покровима, него посебно савијен на једном мјесту. Тада, дакле, уђе и други ученик, који први дође на гроб, и видје и верова; Јер још не знађаху Писмо да Он треба да васкрсне из мртвих. Онда се ученици опет вратише дома.» (Ин.20:1–10)'
        cn: 「七日的第一日，抹大拉的马利亚清早来到坟墓，那时天还黑，看见石头已从坟墓挪开了。于是她跑去，来到西门·彼得和耶稣所爱的那个门徒那里，对他们说：「有人把主从坟墓里取走了，我们不知道他们把他安放在哪里。」彼得和那个门徒就出来，往坟墓那里去。两人同跑，那另一个门徒比彼得跑得更快，先到了坟墓。他俯身往里看，看见细麻布还在那里，却没有进去。西门·彼得随后也到了，进了坟墓，看见细麻布还在那里，又看见耶稣的裹头巾，没有和细麻布放在一起，而是单独卷在一个地方。那时，先到坟墓的那个门徒也进去，看见就信了；因为他们还不明白圣经上耶稣必须从死里复活的话。于是两个门徒又回家去了。」（约翰福音 20:1-10）
    - type: paragraph
      text:
        ru: 'У Марије Магдалине осећање вере је остало најчитавије, најненачетије, најсачуваније. Само је било тужно од свих преживљених болова и туга за време Спасовог страдања. То здраво осећање вере води и непрестано руководи Магдалину, увек захвалну Исусу за огромна добра, учињена најпре њој (истерао 7 нечистих духоеа), за Еванђеље које је слушала седећи крај ногу Исусових (Лк.10:39–42), за васкрсење њеног брата Лазара. И још много, много божанскога и незаборавнога. То је осећање живе вере изводи и на Исусов гроб рано, док је још био мрак – пред зору. Она прва сазнаје и види да тела Спасовог нема у гробу. За њу је Исус – увек Господ, иако у гробу. Она узбуђено сапшиава ту вест прво апостолима, Петру и Јовану: «Узеше Господа из гроба, и не знамо где га метнуше».'
        cn: 在抹大拉的马利亚那里，信仰的感受依然是最完整无缺的，最未受损的，最被保守的。只是因在救主受难期间所经历的一切痛苦和忧伤而感到悲伤。这种健康的信仰感受引领并不断指引着抹大拉，她总是感谢耶稣所赐予的巨大恩惠：首先是赐给她的（赶出了七个污秽的灵），为了她坐在耶稣脚旁聆听的福音（路加福音 10:39-42），以及为了她兄弟拉撒路的复活。还有许多许多神圣的、难以忘怀的事。这种活泼的信仰感受也使她很早来到耶稣的坟墓，当时天还很黑——黎明前。她是第一个知道并看到救主的身体不在墓中。对她而言，耶稣永远是主，即使在坟墓里。她激动地首先将这消息告知使徒彼得和约翰：「他们把主从坟墓里挪走了，我们不知道他们把他放在哪里了。」
    - type: paragraph
      text:
        ru: 'Онда темпераментни Петар и муњевити Син грома трче на гроб. Син грома стиже први; али не уђе у гроб; Симон – «уђе у гроб и виде хаљине саме где леже»… Тада уђе и други ученик… и виде и верова. Први поверова – Син грома: тајновидац и христољубљени христољубац, тајник велике љубави Христове. Тешко је дефинисати ту веру њихову у васкрсење. То је било, можда, више радосна сумња него убеђење. У сваком случају, и као мала, ипак је то прва вера у васкрсење Господа Христа, вера «као зрно горушично». Нема сумње: у свет њихове душе ушло је нешто ново, налик на земљотрес, и немир је захватио све мисли, сва осећања, која су наслућивала нешто неисказано важно, прекретничко, свевредносно. «Онда отидоше опет ученици дома»: да смире мисли и осећања, и поделе их са осталим ученицима. За све важи: «Још не знађаху Писма да Њему ваља устати из мртвих». Недостајало им је живо осећање тога, које и најмање сазнање претвара у чврсто убеђење. Још поветарац благодати Педесетничке није био залахорио кроз њихове душе.'
        cn: 于是，性情急躁的彼得和闪电般迅速的雷子跑到坟墓那里。雷子先到了；但他没有进坟墓；西门——「进到坟墓里，看见细麻布还在那里放着」（约翰福音 20:6-7）……于是另一个门徒也进去了……他看见了，就信了。第一个信的——雷子：奥秘的见证者，蒙基督所爱、亦爱基督者，基督伟大之爱的奥秘执事。难以定义他们对复活的这种信心。那也许更多的是一种喜乐的怀疑，而不是确信。无论如何，即使微小，那仍然是第一次对主基督复活的信心，一种「如同芥菜种」的信心（马太福音 17:20）。毫无疑问：有一些新事物进入了他们的灵魂世界，犹如一场地震，骚动席卷了所有的思想，所有的感受，预示着某种无法言喻的重要、划时代、具有普世价值的事物。「于是门徒又回自己的住处去了」（约翰福音 20:10）：为了平息他们的思想和情感，并与其他的门徒分享。对于所有人来说都是如此：「因为他们还不明白圣经的意思，就是他必须从死里复活」（约翰福音 20:9）。他们缺乏对这种事情的生动感受，这种感受能将最微小的认知转化为坚定的确信。圣灵降临节的恩典之风尚未吹拂过他们的灵魂。
    - type: paragraph
      text:
        ru: '«А Марија стајаше напољу код гроба и плакаше. И када плакаше надвири се над гроб и видје два анђела у бијелим хаљинама гдје сједе, један чело главе, а други чело ногу, гдје бјеше тијело Исусово. А они јој рекоше: Жено, што плачеш? Рече им: зато што узеше Господа Мојега, и не знам гдје Га положише. И ово рекавши, обазре се натраг и угледа Исуса гдје стоји, ин не знађаше да је Исус.» (Ин.20:11–14)'
        cn: 「马利亚却站在坟墓外面哭。哭的时候，她俯身进坟墓，看见两个天使，穿着白衣，坐在安放耶稣身体的地方，一个在头那边，一个在脚那边。天使对她说：『妇人，你为什么哭？』她说：『因为有人把我的主拿走了，我不知道他们把他放在哪里了。』说完这话，她就转过身来，看见耶稣站着，却不知道是耶稣。」 (约翰福音 20:11-14)
    - type: paragraph
      text:
        ru: 'А Марија? «А Марија стајаше напољу код гроба и плакаше» Каква су осећања вихорила по тој христочежњивој души? Какве мисли као муње севале по тами њене бескрајне туте? Мисао на Господа – претворила се у сузарник, у коме су се топила од туге сва њена осећања; а тамо далеко, у мајској ноћи њене вере, појављивао се својом песмом славуј наде. «И кад плакаше надвири се над гроб, и виде два анђела у белим хаљинама где седе један чело главе а један чело ногу где беше лежало тело Исусово». Чудесна благовест почиње: два Анђела место Исуса. Анћели ту, а где је Господ Анђела, и мој Господ? Да не почиње одавде небо? Или се овде земља почела претварати у небо? Можда су то халуцинације расплакане и узбуђене душе? Али «халуцинације» не говоре, и не онако као ова два Анђела. «И рекоше јој они: жено, што плачеш? Рече им: узеше Господа мога, и не знам где га метнуше». Заиста, Исус је остао Господом још за њу; а за ученике, да ли је остао још Учитељем? За ту веру, и тој вери најпре се јавља сам васкрсли Господ. Јер Магдалина «ово рекавши обазре се натраг, и виде Исуса где стоји, и не знаћаше да је Исус». Зашто? Или од узбуђења, од суза, није могла да га јасно види, или је у самој појави васкрслог Господа било нечег изузетно новог и необичног. Сигурно је морало бити нечег изузетног у појави васкрслог Господа, те Га Магдалина није могла одмах распознати. Та она је бар била навикла да гледа васкрслог човека, јер је живела стално поред свог васкрслог брата Лазара. То је јединствени случај у историји рода људског, и јединствена част, указана пријатељу Христовом Лазару и дому његовом. У васкрслом Господу морало је бити нечег чега није било у васкрслом Лазару.'
        cn: 马利亚呢？«马利亚却站在坟墓外面哭泣» (约翰福音 20:11) 那颗渴慕基督的灵魂中涌动着何等样的情感？何等样的思绪如闪电般划破她那无尽悲恸的黑暗？对主的思念——化作泪泉，她所有的情感都因悲伤而在其中融化；而在遥远的彼方，在她信仰的五月之夜，希望的夜莺正以它的歌声显现。«当她哭泣的时候，就俯身往坟墓里看，看见两个天使穿着白衣，坐在安放耶稣身体的地方，一个在头，一个在脚。» (约翰福音 20:11-12) 奇妙的福音开始了：两位天使取代了耶稣的位置。天使在那里，可是天使的主，我的主在哪里呢？莫非天堂就从这里开始？抑或是大地在这里开始转变为天堂？也许那只是一个哭泣又激动之灵魂的幻觉？但「幻觉」不会说话，也不会像这两位天使那样说话。«他们对她说：妇人，你为什么哭？她说：因为有人把我的主挪走了，我不知道他们把他放在哪里了。» (约翰福音 20:13) 确实，对她而言，耶稣仍是主；但对门徒而言，他是否仍是夫子呢？正是为了这份信心，也正是向这份信心，复活的主首先亲自显现。因为抹大拉的马利亚«说了这话，就转过身来，看见耶稣站在那里，却不知道是耶稣。» (约翰福音 20:14) 为何如此？也许是由于激动，泪水模糊了她的视线，以致她无法清楚地看见他；又或许在复活的主显现本身，有着某种极其新颖和不同寻常之处。无疑，复活的主的显现必定有某种不同寻常之处，以至于抹大拉的马利亚无法立刻辨认出他。毕竟她至少曾习惯于看见复活之人，因为她一直与她那复活的兄弟拉撒路住在一起。这是人类历史上独一无二的事件，也是一份独一无二的尊荣，赐予了基督的朋友拉撒路及其家室。在复活的主身上必定有某种东西，是复活的拉撒路身上所没有的。
    - type: paragraph
      text:
        ru: 'Нема сумње: Лазар је човек, Исус – Богочовек. Лазар је васкрсао као личност, и то васкрсење није имало онтолошког значаја за целокупну људску природу. Богочовек је васкрсао као Нови Адам, као родоначелник који васкрсну силу божанског вечног живота лреноси на сву људску природу, ствара ново чоовечанство: човечанство васкрсења, човечансгао васкрсло,, човечанство које је победило смрт и ђавола.'
        cn: 毫无疑问：拉撒路是人，耶稣是神人。拉撒路是作为一个个体复活的，而那次复活对于全人类的本性并没有本体论上的意义。神人是作为新亚当复活的，作为始祖，他将复活的神圣永恒生命的力量传递给全人类的本性，创造了一个新的人类：一个复活的人类，一个已经复活的人类，一个战胜了死亡和魔鬼的人类。
    - type: paragraph
      text:
        ru: Он је «првенац из мртвих» и – «новина» ( = првак) (1Кор.15:20:23), и – «по Христу ће сва оживети» (1Кор.15:22). Све је то морало зрачити из Личности васкрслог Господа. Изузетан је дар што се могло гледати у њу од блеска славе њене. Али, по бескрајном човекољубљу свом, Он је приступачан и видљив за његове следбенике, јер никоме не намеће себе, да би био видљив за све, и за непријатеље своје.
        cn: 他既是「死人中初熟的果子」，又是「新样」（即首位）(哥林多前书 15:20，23)，并且「在基督里众人都要活过来」(哥林多前书 15:22)。这一切都必然从复活之主的位格中放射出来。得以瞻仰祂荣光的辉煌，这实在是一份非凡的恩赐。然而，祂因其无限的人爱，对祂的跟随者是可亲近、可见的，因为祂不向任何人强加自己，所以并非以一种让所有人，包括祂的仇敌，都能看见祂的方式显现。
    - type: paragraph
      text:
        ru: '«Рече јој Исус: Жено, што плачеш? Кога тражиш? Она, мислећи да је градинар, рече Му: Господине, ако си га ти однио кажи ми гдје си Га положио, и ја ћу га узети. Исус јој рече: Марија! Она, окренувши се, рече Му: Равуни, што ће рећи: Учитељу! Рече јој Исус: не дотичи Ме се, јер још нисам узишао Оцу Својему, него иди браћи Мојој и кажи им: Узлазим Оцу Мојему и Оцу вашему, и Богу Мојему и Богу вашему.» (Ин.20:15–17)'
        cn: 「耶稣对她说：妇人，你为什么哭？你找谁呢？她以为是园丁，就对祂说：先生，如果把你把他搬走了，请告诉我你把他放在哪里了，我就去取走他。耶稣对她说：马利亚！她转过身来，对祂说：拉波尼！（就是说：老师！）耶稣对她说：不要摸我，因为我还没有升到我父那里；你去到我的弟兄那里，告诉他们说：我升到我的父，也是你们的父那里去；升到我的神，也是你们的神那里去。」 (约翰福音 20:15-17)
    - type: paragraph
      text:
        ru: 'Ено, и прве речи као васкрсли Богочовек упућује њој која је «многу љубав имала»: «Жено, што плачеш? Кога тражиш? А она мислећи да је вртар рече му: господине, ако си га ти узео, кажи ми где си га метнуо, и ја ћу га узети». – Ако хоћете еванђелску љубав, ето ње. Ето њеног оригинала. Заиста: «љубав све верује» (1Кор.13:7). Исус је мртав, али за еванђелску љубав, Он и као такав претставља бескајну божанску вредност. «Исус јој рече: Марија! А она обазревши се рече му: Равуни! што значи: учитељу». Највећа еванђелска тајна открива се најпре еванђелској љубави. Васкрслог Господа Христа може раопознати и видети само та љубав. Јер је сама од Бога, и одводи васкрслом Богу. Ако у нашем човечанском свету има радости, која се не може никаквим речима описати и изразима изразити, онда је то – радост Магдалине при виђењу васкрслог Господа Исуса. Уоиште, у ускршњој радости има увек од те божанске неизразивости, увек миле и незаменљиве. Јер васкрсом Богочовековим, човек се вратио у божанску бесмртност и вечјни живот. Богочовек је вратио човека Богу; Бог је поново примио човека као сина Божјег, примио га као Отац небески.'
        cn: 看哪，祂作为复活的神人，头一句话就对那「有许多爱」的人说：「妇人，你为什么哭？你找谁呢？」她以为是看园的，就对他说：「先生，如果你把他挪走了，请告诉我你把他放在哪里，我便去取他。」——如果你们想要福音的爱，看哪，这就是它。这就是它的原貌。确实，「爱是凡事相信」（哥林多前书 13:7）。耶稣已死，但对福音的爱而言，即使是这样，祂也代表着无限的神圣价值。「耶稣对她说：『马利亚！』她一转身，就对他说：『拉波尼！』（就是老师的意思）」最大的福音奥秘首先向福音的爱显明。唯有那爱才能认出并看见复活的主基督。因为爱本身源于上帝，并将人引向复活的上帝。如果在我们的人类世界中存在着任何无法用言语描述和词句表达的喜乐，那么它就是抹大拉的马利亚见到复活主耶稣时的喜乐。总之，复活节的喜乐中总是带着那份神圣的不可言喻，总是如此甜美而无可替代。因为借着神人的复活，人回归了神圣的不朽和永恒的生命。神人使人回到了上帝面前；上帝再次接纳人作为上帝的儿子，像天父一样接纳了他。
    - type: paragraph
      text:
        ru: 'Својим безгранично човекољубивим подвигом Богочовек је одвео људску природу Богу, вратио је Богу, оправдао човека пред Богом, и учинио те је Бог Његов постао Ботом људи, и Отац Његов – Оцем људи. Богочовек је умилостивио Бога, те је постао Богом и Оцем следбеника Његових. Стога Спас и благовести Магдалини: «Не дохватај се до мене, јер се још не вратих к Оцу своме; него иди к браћи мојој, и кажи им: враћам се к Оцу свом и Оцу вашем, и Богу свом и Богу вашем». «Још се не вратих к Оцу» – као Богочовек, као човек, јер је за то време телом био у гробу, душом у аду, а Божанством свуда. «Иди к браћи мојој», – колико човекољубља! Васкрсли Господ назива браћом Своје ученике, који су се разбежали од Њега, који су се пред служавкама и слугама одрицали Њега… Али, тиме је баш Спаситељ – Спаситељ. Јер се само из љубави и љубављу спасава свако створење људско.'
        cn: 藉着他无限爱人的壮举，神人将人性带到上帝面前，使其回归上帝，并在上帝面前称义了人类，使他的上帝成为众人的上帝，他的父成为众人的父。神人使上帝得以和解，从而成为他追随者的上帝和父。因此，救主也向抹大拉报告说：「不要摸我，因为我还没有回到我父那里；却要去我的弟兄那里，告诉他们：我回到我的父和你们的父那里，回到我的上帝和你们的上帝那里。」 「我还没有回到父那里」——是作为神人，作为人而言，因为在那段时间里，他肉身在坟墓里，灵魂在阴间，而神性则无处不在。「去我的弟兄那里」，——这是何等的爱人情怀啊！复活的主称他的门徒为弟兄，而他们曾离弃他逃散，曾在使女和仆人面前否认他……但，正因如此，救主才是救主。因为唯有藉着爱和爱，才能拯救每一个人类受造物。
    - type: paragraph
      text:
        ru: «А Марија Магдалина отиде и јави ученицима да је видјела Господа и да јој ово рече.» (Ин.20:18)
        cn: 「玛丽亚·玛格达琳娜就去告诉门徒，她已经看见了主，又把主对她所说的话告诉他们。」 (约翰福音 20:18)
    - type: paragraph
      text:
        ru: 'Први апостол васкрсења – Марија Магдалина. Уствари, први апостол спасења. Јер је васкрсењем довршио опасење. Обратити пажњу: та част је указана Магдалини, јер је у васкрсење Господа Исуса поверовала одмах, никаква је сумња није колебала, а још мање неверје. Док то није случај са апостолима. Огромна је вера Магдалинина, огромна и љубав. Здружене, оне су и начиниле од Магдалине прву благовесницу васкрсења Христовог, светитељку изванредне величине. Она «отиде, и јави ученицима да виде Господа и каза јој ово». – Може се рећи: Еванђеље васкрсења је на првом месту Еванђеље Марије Магдалине, првог анђела и апостола васкрсења.'
        cn: 复活的首位使徒——抹大拉的马利亚。实际上，是救赎的首位使徒。因为祂以复活成全了救赎。请注意：这项殊荣赐予了抹大拉的马利亚，因为她立刻就相信了主耶稣的复活，没有任何怀疑动摇她，更没有不信。然而使徒们却并非如此。马利亚的信德是巨大的，爱也是巨大的。它们结合起来，使马利亚成为基督复活的首位报喜者，一位卓绝伟大的圣女。她「就去告诉门徒，说他们看见了主，并且主对她说了这些话」。（约翰福音 20:18）——可以说：复活的福音首先是抹大拉的马利亚的福音，她是复活的首位天使和使徒。
  - type: heading2
    text:
      ru: Јављање апостолу Томи
      cn: 向使徒多马的显现
    children:
    - type: paragraph
      text:
        ru: '«А кад би увече онога првога дана седмице, и док су врата била затворена, гдје се бијаху ученици Његови сакупили због страха од Јудејаца, дође Исус, и стаде на средину и рече им: Мир вам!» (Ин.20:19)'
        cn: 「当那一周的头一天晚上，门都关了，祂的门徒们因怕犹太人，都聚集在那里。耶稣来了，站在他们当中，对他们说：『愿你们平安！』」 (约翰福音 20:19)
    - type: paragraph
      text:
        ru: 'Васкрсли Господ улази и кроз затворена врата. Њвгово тело је нема сумње, стварно, опипљиво, видљиво, јер ученицима «показа руке и ребра своја». Али је при свој тој својој видљивости и опипљивости, оно ипак на неки нови начин духовно, небеско, свуда – проходљиво. Налазимо се пред новом тајном: шта је то васкрсло тело; од какве је грађе? Несумњиво од оне, од које је и било пре васкрсења, за време Спаоовог живота на земљи, страдања, смрти и погреба. Јер учеиици виде свог истог Учитеља и Господа Христа. Континуитет и кондивуалитет Његове Личности су сачувани. Материја телесног тела Христовог добила је васкрсењем нека нова својства, не изгубивши стара. Ново својство је: проходљивост. За њега материја више није непробојна, непроходљива. Друго својство је: невидљивост. Јер васкрсли Спас није увек видљив, већ само када то захтевају разлози богочовечамоког домостроја спасења. Уствари, пред нама је у свој својој јачини проблем материје. Од чега је она? Од какве грађе?'
        cn: '复活的主甚至穿过紧闭的门进入。祂的身体毫无疑问是真实的、可触的、可见的，因为祂「«向门徒展示了祂的手和肋旁»」。但尽管祂的身体具有所有这些可见性和可触性，它仍然以某种新的方式是属灵的、属天的、无处不通达的。我们面临着一个新的奥秘：那复活的身体究竟是什么？它是何种构造？


          毫无疑问，它是由复活前，在救主于世的生活、受难、死亡和安葬期间所是的物质构成的。因为门徒看到的是他们那位相同的导师和主基督。祂位格的延续性和连续性得以保存。基督肉身的物质借着复活获得了一些新的属性，同时没有失去旧的属性。新的属性是：通达性。对于它，物质不再是不可穿透的、不可通行的。另一个属性是：不可见性。因为复活的救主并非总是可见的，而仅当神人救赎的经纶要求时。事实上，物质的问题以其全部力量摆在我们面前。它由什么构成？由何种物质构成？'
    - type: paragraph
      text:
        ru: 'Васкрсење Христово на свој начин потврђује научну хемиску и физичку истину: да је материја у суштини од неких невидљивих, неопипљивих честица, зоните их: атомини, електроника, фотоника, праелектрони. У сржи – она је нешто духовно, невидљиво. То је изненађење, нема сумње. Али и стварност, мада стварност која изненађује и плаши. Зато су и прве речи Спаситељеве ученицима: «Мир вам». Као да вели: мир духу вашем који је запршашћен Мојом појавом! мир збуњеним и узбуђеним мислима вашим које не могу да схвате Моју појаву! мир преплашеним срцима вашим која виде нешто необично – необјашњиво! мир разуму вашем који се устумарао пред новом стварношћу! И још: мир вам! јер је решено најмучније питање духа и бића људског: смрт! решено не мање мучно питање добра и зла. Мир вам! јер старо проће, и гле, све ново постаде! То је онај мир, о коме сам вам говорио: «Мир свој остављам вам, мир свој дајем вам: не дајем вам га као што свет даје», већ као Богочовек – васкрсењем «да се не плаши срце ваше, и да се не боји» (Ин.14:27).'
        cn: 基督的复活以其独特的方式证实了科学上的化学和物理真理：物质的本质是由一些不可见、不可触的粒子构成，称它们为：原子、电子、光子、前电子。其核心——它是某种属灵的、不可见的存在。这无疑是令人惊异的。但它也是一种现实，尽管这种现实既令人惊异又令人恐惧。因此，救主对门徒说的第一句话是：「愿你们平安。」 仿佛祂在说：愿你们因我的显现而震惊的灵得到平安！愿你们因无法理解我的显现而困惑不安的思绪得到平安！愿你们因看见非同寻常——不可解释之事而恐惧的心得到平安！愿你们面对新的现实而动摇的理智得到平安！还有：愿你们平安！因为人类灵魂与存在的最大苦恼问题——死亡——已经解决！善与恶这个同样令人痛苦的问题也已解决。愿你们平安！因为旧事已过，看哪，一切都变成新的了！这就是我曾对你们说过的平安：「我留下平安给你们，我将我的平安赐给你们；我所赐的，不像世人所赐的」，而是作为神人——藉着复活——「叫你们心里不要忧愁，也不要胆怯。」 (约翰福音 14:27)
    - type: paragraph
      text:
        ru: '«И ово рекавши, показа им руке и ребра Своја. Тада се ученици обрадоваше видјевши Господа. А Исус им опет рече: Мир вам! Као што је Отац послао Мене, и Ја шаљем вас. И ово рекавши, дуну и рече им: Примите Духа Светога!» (Ин.20:20–22)'
        cn: 「说了这话，就将手和肋旁指给他们看。门徒看见主，就喜乐了。耶稣又对他们说：『愿你们平安！父怎样差遣了我，我也照样差遣你们。』说了这话，就向他们吹一口气，说：『你们受圣灵吧！』」(约翰福音 20:20-22)
    - type: paragraph
      text:
        ru: '«И ово рекавши показа им руке и ребра своја», и тиме потврди и посведочи стварност ваокрсења свог и идентитет Личности своје. Шта више треба? «Онда се ученици обрадоваше видевши Господа». Тако се зби Спасово пророштво да ће се њихова жалост претворити у радост (Ин.16:20). И ето, претворила се. За тренутак: ушетајте макар једном мишљу у душе ученика који први пут виде васкрслог Господа. Сви су светови њихових душа кренули кроз ко зна какве радости и усхићења, и закорачили у безбројне бескрајности и бесконачности. «А Исус им рече опет: мир вам! као тто Отац посла мене, и ја шаљем вас»: за исти посао, за исти циљ: спасавати свет од греха, смрти и ђавола и давати људима живот вечни.'
        cn: 「说了这话，就给他们看他的手和肋旁。」借此，他确认并见证了他复活的真实性以及他位格的身份。还需要什么呢？「门徒看见主，就喜乐了。」这样，救主的预言就应验了，他们的忧愁要变为喜乐（约翰福音 16:20）。果然，变了。稍作片刻：哪怕只用一个念头走进门徒的心灵，他们是第一次看见复活的主。他们心灵中的诸世界经历了不知怎样的喜乐和狂喜，并踏入了无数的无限和永恒。「耶稣又对他们说：『愿你们平安！父怎样差遣了我，我也照样差遣你们。』」为了同样的工作，为了同样的目标：从罪、死亡和魔鬼手中拯救世界，并赐给人们永生。
    - type: paragraph
      text:
        ru: 'Зар ми слаби и немоћни? Како ћемо чинити то ми, кукавни и плашљиви? – то не рекоше, то с радошћу и смерношћу примише речи и дар Христав: «И ово рекавши дуну, и рече им: примите Дух Свети»: тиме примате божанску моћ и свемоћ, божанску силу и свесилу, божанску љубав и свељубав, божанску истину и свеистину, божански живот и свеживот. Примате оно што вам даје и власт и право да уклањате грехе из душа људских, да их уништавате, а са њима и у њима све смрти и све ђаволе. «Којима опростите грехе, опростиће им се; и којима задржите, задржаће се». – И нико од њих не посумња у то, нико не приговори нишга, тако је била убедљива реч васкрслог Господа. И још: они одмах примише Духа Божјег «на меру», а на дан Педесетнице – Ипостас Духа. Али, испуни их неком божанском свесилом, радошћу и миром.'
        cn: 难道我们是软弱无力的吗？我们这些胆怯懦弱的人，又如何能做到呢？——他们没有那样说，而是带着喜乐和谦卑，领受了基督的话语和恩赐：「说了这话，就向他们吹一口气，说：你们受圣灵！」 (约翰福音 20:22)；借此你们领受神圣的权能与全然的权能，神圣的力量与全然的力量，神圣的爱与全爱，神圣的真理与全真，神圣的生命与全生命。你们领受了那赋予你们权柄和权利的，能从人的灵魂中除去罪恶，能毁灭它们，并与它们一起、在它们之中毁灭所有的死亡和所有的魔鬼。「你们赦免谁的罪，谁的罪就赦免了；你们留下谁的罪，谁的罪就留下了。」 (约翰福音 20:23)——他们中无人对此怀疑，无人提出异议，复活之主的言语是如此令人信服。此外：他们立刻「在一定程度上」领受了神的灵，而在五旬节，他们领受了圣灵的位格。可是，它以某种神圣的全能、喜乐与平安充满了他们。
    - type: paragraph
      text:
        ru: «А Тома, звани Близанац, један од Дванаесторице, не бјеше са њима када дође Исус.» (Ин.20:24)
        cn: 但多马，又称双生子，是十二门徒中的一个，耶稣来的时候，他没有和他们同在。（约翰福音 20:24）
    - type: paragraph
      text:
        ru: Еванђеље апостола Томе је првенствено еванђеље Спаситељевог ваокрсења. Нико као он није тако радикално проверио стварност васкрсења. Ако је до сумње, ето највеће; ако је до провере, ето најексперименталније; ако је до сведочанства, ево најубедљивијег. Огреховљени духовии инструменторијум природе људске није могао а да се сав не узбуди и сав не успротиви факту васкрсења Христовог.
        cn: 多马使徒的福音主要是救主复活的福音。没有人像他一样如此彻底地验证了复活的真实性。如果论及怀疑，这是最深的怀疑；如果论及验证，这是最具实验性的验证；如果论及见证，这是最有说服力的见证。被罪玷污的人性属灵机能，无法不被完全搅动，也无法不完全抗拒基督复活的事实。
    - type: paragraph
      text:
        ru: 'Да, факту васкрсења, а не схеми или теорији васкрсења, јер је схему и теорију лако априори оспорити и одбацити или силогистиком исмејати. Али, успротивити се очигледном факту, не примити га, не прихватити га, па и одбацити га зато што необјашњив у ланцу природних збивања и узрока, што не може да уђе у епрувету «чистога разума», да се смести, – то и јесте неверје. Неверје, увек засновано на рационалистичком предубеђењу: да факта, која не могу бити објашњена људским разумом, просто – нису факта. Зато их треба одбацити. А факт ваокрсења је потпуно нов факт у сфери људског живота. Живот је уопште шири и дубљи од логике. Поготову када је то живот Богочовека Христа. Ту логика никако не може да иде ускорак са фактима; факта увек иду далеко испред ње. Ново вино треба левати у нове мехове. Богочовечанска факта траже богочовечанску логику. Стара логика људска, логика греха ту не помаже ништа, а много одмаже. Ту треба имати «Христов ум» (1Кор.2:16), да би се могло разумети и «рационално» усвојити оно шго је Христово; ва првом месту: факт васкрсења Христовог. Значи треба имати Христову логику. А то је логика вере. Шта је логика вере? – Светост: светост душе, светост ума = чистота срца. Јер се само тако може видети Бог и Божје, и разумети Бог и Божје. Као што је грех – «логика Сатане», тако је светост – логика Бога. Бог Логос је постао човек, да би тим фактом, или јединством са човеком показао човеку: да је Бог – ум човеков, логика човекова, живот човеков, истина човекова, правда човекова, љубав човекова, мудрост човекова, све и сва човеку. И када свети апостол тврди: «ми ум Христов имамо» (1Кор.2:16), он уствари то тврди, то потврђује.'
        cn: 是的，是复活的事实，而不是复活的图式或理论，因为图式和理论很容易先验地驳斥、否定，或用三段论来嘲笑。但若反对一个明显的事实，不接受它，不接纳它，甚至因为其在自然事件和因果链中无法解释，不能进入「纯粹理性」的试管而拒绝它——这便是不信。不信，总是基于一种理性主义的偏见：即那些无法通过人类理性解释的事实，就根本不是事实。因此就应该摒弃它们。而复活的事实是人类生命领域中一个全新的事实。生命总体上比逻辑更广阔、更深刻。尤其是当那是神人基督的生命时。在这里，逻辑绝不能与事实同步；事实总是远远走在逻辑前面。新酒必须装在新皮袋里。神人性的事实需要神人性的逻辑。旧有的人类逻辑，罪的逻辑，在此毫无助益，反而大有妨碍。在此需要拥有「基督的心」（哥林多前书 2:16），才能理解并「理性地」接纳基督所赐的；首先是：基督复活的事实。这意味着需要拥有基督的逻辑。而这就是信的逻辑。何为信的逻辑？——是圣洁：灵魂的圣洁，心思的圣洁 = 内心的纯洁。因为唯有如此才能看见上帝和上帝的道，才能理解上帝和上帝的道。正如罪是「撒旦的逻辑」，圣洁就是上帝的逻辑。圣言（逻各斯）上帝成为了人，藉着这个事实，或藉着与人的结合，向人显明：上帝是人的心智，人的逻辑，人的生命，人的真理，人的公义，人的爱，人的智慧，是人的一切和一切为了人。当圣使徒宣称：「我们有基督的心了」（哥林多前书 2:16），他实际上就是这样宣称，这样确认的。
    - type: paragraph
      text:
        ru: '«А други му ученици говораху: Видјели смо Господа. А он им рече: Ако не видим на рукама Његовим ране од клинова, и не метнем прст свој у ране од клинова, и не метнем руку своју у ребра Његова, нећу вјеровати.» (Ин.20:25)'
        cn: «其他门徒就对他说：「我们已经看见主了。」他却对他们说：「我若不看见他手上的钉痕，又不用我的指头探入那钉痕，又不用我的手探入他的肋旁，我总不能信。」» (约翰福音 20:25)
    - type: paragraph
      text:
        ru: 'Неверје се и састоји у томе што нова факта богочовечанског живота Христовог хоће да провери чулима: вида, слуха, пипања. Тј. да камилу провуче кроз иглене уши. И разуме се, не успева. И ако по каткад успе, то бива само по изузетном снисхођењу Свеблагога; као што је у случају апостола Томе. Сви ученици Спасови тврде Томи: «видесмо Господа». А он им одвраћа: «Док не видим и рукама Његовим ране од клинаца, и не метнем прст свој у ране од клинаца, и не метнем руке своје у ребра Његова – нећу веровати». Зашто апостол жели да баш ране Спасове опипа и ребра? Зато што је са ранама умро, и тако био сахрањен. Има ли ране на рукама, и рану на ребрима, значи – васкрсао је стварно Он сам, а не неко други, или неко који би се наметнуо место њега, или подметнуо место њега, док је Он стварно мртав у гробу. «Нећу веровати» – «док»: то је томински скептицизам и неверје.'
        cn: 不信也在于此，即它想用感官（视觉、听觉、触觉）来验证基督神人生命的新事实。即把骆驼穿过针眼。不出所料，未能成功。而如果有时成功，那只是出于至善者的非凡俯就；就像在使徒托马斯的例子中一样。救主的众门徒对托马斯坚称：「我们看见了主。」而他回应他们说：「除非我亲自看见他手上的钉痕，把我的指头探入那钉痕里，又把我的手探入他的肋旁——我总不能信。」为什么使徒偏要触摸救主的伤痕和肋旁？因为他带着伤痕而死，并且就是这样被埋葬的。如果他手上有伤痕，肋旁有伤口，就意味着——真正复活的是他本人，而不是别人，也不是有人冒充他或代替他，而他本人实际上仍死在坟墓里。「我总不能信」——「除非」：这就是托马斯式的怀疑主义和不信。
    - type: paragraph
      text:
        ru: '«И послије осам дана опет бијаху унутра ученици Његови и Тома с њима. Дође Исус кад бијаху врата затворена, и стаде на средину и рече: Мир вам! Затим рече Томи: Пружи прст свој амо и види руке Моје; и пружи руку своју и метни у ребра Моја, и не буду невјеран него вјеран.» (Ин.20:26–27)'
        cn: «八日之后，门徒又在屋里，多马也和他们同在。耶稣来了，门都关了，站在当中说：「愿你们平安！」随后对多马说：「伸过你的指头来，看我的手；伸过你的手来，探入我的肋旁。不要疑惑，总要信。」» (约翰福音 20:26-27)
    - type: paragraph
      text:
        ru: Али за такво одлучно неверје човекољубиви Спаситељ има одговор спасоносни. Он, који је, оваплотивши се, понизио себе од Бога до роба, понижава себе и овом приликом са љубављу ради спасења људи, као што је апостол Тома. Он је оставио Тому читавих неколико дана да размишља о ономе што су му остали ученици говорили о васкрсењу Његовом.
        cn: 但是，对于如此决绝的不信，慈爱的救主有带来救恩的回应。祂，道成肉身时曾将自己从神谦卑为奴仆，在此刻也为了人类的救恩，出于爱而谦卑自己，如同使徒托马斯一样。祂让托马斯整整好几天去思考其他门徒对他所说的关于祂复活的一切。
    - type: paragraph
      text:
        ru: 'Ко зна у каквим је све недоумицама бивао апостол Тома, и кроз какве мисли, и кризе мисли и осећања пролазио. Али је ипак остао сав у жељи: да провери лично сам тврђење својих другова. И после осам дана то се збива. Васкрсли Господ опет улази кроз затворена врата, стаје међу ученике који су на окупу, и говори им: «Мир вам». А Тома? – сав је у немиру; запрепашћен и збуњен, а можда и постиђен од своје жеље. А Спас право се обраћа њему, и рече му: «Пружи прст овој амо и види руке моје; и пружи руку своју и метни у ребра моја, и не буди неверан него веран». – Извршена је најгрубља, иако најекперименталнија провера Христовог васкрсења: најјача сумња отклоњена је самом стварношћу факта у који се сумњало, логички сумњало. А иза апостола Томе стоје хиљаде и хиљаде људи томинске скепсе и томинског неверја. Богочовеков одговор је јасан: опипај и види!'
        cn: 谁知道使徒托马斯曾经历过多少困惑，以及怎样的思想和情感危机。但他却依然完全怀着一个愿望：亲自核实他同伴们的说法。八天之后，这件事发生了。复活的主再次穿过紧闭的门进来，站在聚集的门徒中间，对他们说：「愿你们平安。」而托马斯呢？他完全处于不安之中；他惊愕而困惑，也许也因自己的愿望而感到羞愧。而救主直接对他说：「伸过你的指头来，看看我的手；也伸出你的手来，探入我的肋旁；不要疑惑，总要信。」（约翰福音 20:27）对基督复活进行了一次最粗暴、却也是最实验性的验证：最强烈的怀疑被所怀疑之事实的真实性本身，即逻辑上所怀疑之事实的真实性所消除了。而在使徒托马斯身后，站着成千上万具有托马斯式怀疑和托马斯式不信的人。神人（基督）的回答是清楚的：「摸摸看吧！」
    - type: paragraph
      text:
        ru: 'Уствари, све што је Богочовеково располаже неодољивом и неуклонљивом стварношћу. За све скептике има једна апологија, једно средство да се увере у стварност Богочовека и свега његовог: опипај и види! Спаситељ не избегава и ту грубу експериментацију, него је чак и предлаже, али са благим прекором предлаже: «не буди неверан, него веран»: тј. имај поверење у Мене. Вера хришћанска је уствари сва заснована на поверењу у Христа. Вера у Христа је поверење у Христа. А Он, зар може обманути, и неистину рећи, и лаж заступати, и у заблуду човека одвести, или у грех и смрт завести? Верујем у Њега, имам поверење у Њега, па макар сав мој разум био против Њега, и моје срце, и мој вид, и мој слух, и цело биће моје. Знам да ме Он неће изневерити никад; само ја могу изневерити Њега. Он остаје увек веран Себи, доследан Себи: јер се не може одрећи Себе. Е баш на томе се и заснива наша вера у Њега.'
        cn: 实际上，凡是属神人的一切，都拥有不可抗拒和不可动摇的实在性。对于所有怀疑论者，有一个凭证，一个让他们确信神人及其一切之实在性的方法：触摸并看！救主并不回避那种粗陋的验证，反而甚至建议如此，但带着温和的责备建议说：「不要不信，总要信！」也就是说，要信赖我。基督教的信仰实际上完全建立在对基督的信赖之上。对基督的信仰就是对基督的信赖。而祂，难道能欺骗人，说谎话，维护虚假，将人引入歧途，或是引诱人陷入罪和死亡吗？我相信祂，我信赖祂，即便我的全部理性都反对祂，我的心、我的视力、我的听力，以及我的全人亦是如此。我知道祂永远不会背弃我；只有我能背弃祂。祂永远忠于祂自己，始终如一：因为祂不能否认自己。正是基于此，我们的信仰才建立在祂之上。
    - type: paragraph
      text:
        ru: 'Све се зида на поверењу у Њега. Поступи ли тако, повери ли се Њему, човек улази у претопљење свога целога бића: претапа у Христу, и сам Христос претапа, и ум човеков, и срце, и душу, и вољу: и човек добија нов ум – «ум Христов», ново срце, нову душу, нову вољу: од старог човека постаје нов човек: «старо прође, гле све ново постаде». И тај нови ум, нова душа, ново срце, тај обновљени, нови, новозаветни човек: и разуме, и схвата, и с радошћу верује свему што је Христово; потпуно се поверава Господу Христу да га Он води и руководи куда хоће и како хоће. Тако је наша вера у Христа уствари наше пооверење у Христа. До те вере може доћи сваки, и то – врло лако.'
        cn: 一切都建立在对祂的信赖之上。若他如此行，若他信赖祂，人便进入其整个生命的熔铸之中：在基督里被熔铸，而基督自己也熔铸着人的心思、人心、灵魂和意志：人便获得了新的心思——「基督的心思」，新的心，新的灵魂，新的意志：从旧人成为新人：「旧事已过，看哪，一切都更新了。」而那新的心思，新的灵魂，新的心，那更新的、新的、新约的人：他理解、领悟，并带着喜乐相信一切属基督的事物；他完全信赖主基督，任凭祂照祂所愿、照祂所喜地引导和带领他。如此，我们对基督的信德，实则就是我们对基督的全然信赖。每个人都能获得那样的信德，而且——非常容易。
    - type: paragraph
      text:
        ru: 'Главно је: одрећи се себе и поверити се Христу. Разуме мој, срце моје, душо моја, ти се колебаш, ти нећеш за Христом, ти сумњаш, ти се двоумиш, ти се буниш, онда се ја одричем и тебе – разуме мој, и тебе – срце моје, и тебе – душо моја, одричем се вас ради Христа, и поверавам себе Њему потпуно. А ви, идате од мене; без вас могу, али без Њега – никада, никада, никада ни у овом ни у оном свету.'
        cn: '关键在于：弃绝自己，并将自己完全交托给基督。

          我的理智，我的心，我的灵魂啊，你动摇，你不愿跟随基督，你怀疑，你犹豫，你反叛，那么我甚至弃绝你——我的理智，甚至弃绝你——我的心，甚至弃绝你——我的灵魂。为了基督，我弃绝你们，并将自己完全交托给祂。而你们，离开我吧；没有你们我可以，但没有祂——绝不，绝不，绝不，无论是在今生还是来世。'
    - type: paragraph
      text:
        ru: '«И одговори Тома и рече Му: Господ мој и Бог мој!» (Ин.20:28)'
        cn: 多马回答，并对祂说：「我的主，我的神！」（约翰福音 20:28）
    - type: paragraph
      text:
        ru: '«И одговори Тома и рече му: Господ мој и Бог мој». Ништа више не желим, испуњена је моја свежеља: Ти си заиста и Господ мој и Бог мој! Ти само Ти, и нико други! – Ти си Господ мој и Бог мој, јер је само Господ и Бог могао победити смрт и васкрснути из мртвих. Нема смрти више, јер има васкрслог Господа Христа. Ти си «Господ мој», да: «мој, мој, мој», макар те нико не признавао за Гоопода; јер сам у Теби нашао све што треба, и то – вечито треба и души мојој, и срцу мом, и уму мом, и телу мом.'
        cn: 「多马回答，对他说：『我的主，我的神！』」我别无所求，我心所愿尽都满足：祢确实是我的主，我的神！唯独是祢，唯有祢，别无他人！祢是我的主，我的神，因为只有主和神才能战胜死亡，并从死里复活。不再有死亡，因为有复活的主基督。祢是「我的主」，是的：「我的，我的，我的」，即便无人承认祢为主；因为我在祢里面找到了所需的一切，而且——是我永恒的需要，对我的灵魂、我的心、我的心思和我的身体都是如此。
    - type: paragraph
      text:
        ru: 'Зар може ико други постати Господ човеку, када си Ти ту, мој васкрсли Исусе? Ти си Бог мој, јер си за мене победио највећег непријатеља мог, и свачијег, смрт. Ти си Бог мој, јер ми једини пружаш бесмртност и живот вечни, и у њима: Истину вечну, Правду вечну, Љубав вечну, Мудрост вечиу, Доброту вечну. А ко то не пружа, не може бити Бог мој. Да, да, силно тврдим: то нико други, ни од богова ни од људи, пружити не може ни мени ни роду људском, зато си Ти – «Бог мој». Дуго сам бирао међу боговима, дуго сам тражио, док нисам пронашао, проверио и убедио се да си Ти – Једини Бог, и зато си «Бог мој».'
        cn: 当你在此，我复活的耶稣，难道还有谁能成为人的主呢？你是我的上帝，因为你为我战胜了我最大的仇敌，也是所有人的仇敌——死亡。你是我的上帝，因为你唯独赐予我不朽和永生，并在其中赐予我：永恒的真理、永恒的公义、永恒的爱、永恒的智慧、永恒的良善。而凡不赐予这些的，就不能成为我的上帝。是的，是的，我坚定地声明：除了你，无论是从诸神中还是从人中，没有人能赐予这些给我，也无人能赐予人类，因此你——「我的上帝」。我在诸神中选择良久，我寻找良久，直到我找到、验证并确信你是——独一的上帝，因此你是「我的上帝」。
    - type: paragraph
      text:
        ru: 'Упозна ли човек експериментално, емпириски, опитно, лично Богочовека Христа, мора као Тома узвикнути радосно и усхићено: Господ мој и Бог мој! Примените то исто правило, тај исти метод ишитивања на остале «богове», на остале идоле, на остала људска божанства, и ви ћете се уверити да нико од њих ни из далека није ни Бог ни Господ.'
        cn: 如果一个人实验性地、经验性地、亲身体验地、个人性地认识了基督神人，他就必然会像多马一样，喜悦而狂喜地高呼：「我的主，我的神！」 请将同样的规则和检验方法应用于其他「神明」、其他偶像以及人类的神祇，你就会确信，他们之中没有一个，丝毫称不上是神，也称不上是主。
    - type: paragraph
      text:
        ru: '«Рече му Исус: Зато што си Ме видио, повјеровао си; блажени који не видјеше а вјероваше.» (Ин.20:29)'
        cn: 耶稣对他说：「因为你看见了我，你就信了；那些没有看见却信了的人，是有福的。」 (约翰福音 20:29)
    - type: paragraph
      text:
        ru: '«Исус му рече: пошто ме виде, веровао си; блажени који не видеше и вероваше». Зашто? Зато што је вид човеков тако сићушан да једва може и од видљивог света захватити један бескрајно мали делић, акамоли од невидљивог света? А шта тек може захватити зеницом својом од Творца светова? Мука је за човека, за дух његов када све своје хоће да заснива на гледању, на виду, или на ма ком чулу свом. Мука је – поверити се виду човечјем као вођу. А живот, а тајна живота, то је нешто безгранично и шире и дубље и веће од људског вида. Зато апостол изјављује: «Јер вером живимо а не гледањем» (2Кор.5:7). Вером која види и невидљиво (2Кор.4:18): вером која човека поверава Богочовеку те га Он, свевидећи и свезнајући, води кроз све своје светове и његове тајне.'
        cn: 「耶稣对他说：你因为看见了我才信；那没有看见就信了的人是有福的。」（约翰福音 20:29）为什么呢？因为人的视力如此微小，以至于从可见世界中也只能捕捉到极微小的一部分，更何况是那不可见的世界呢？那么，他又能用自己的瞳孔从万物创造者那里捕捉到什么呢？人，以及他的灵魂，若想将自己的一切都奠基于观看、视力或任何感官之上，那便是痛苦。将人类的视力当作向导来信赖，这是一种痛苦。而生命，生命的奥秘，则是无限的，比人类的视力更广阔、更深邃、更宏大。因此，使徒宣称：「我们行事为人是凭着信心，不是凭着眼见。」（哥林多后书 5:7）凭着能看见不可见之物的信心（哥林多后书 4:18）：凭着将人托付给神人的信心，这样，祂，那洞察一切、无所不知的，就能引导他穿越祂所有的世界及其奥秘。
    - type: paragraph
      text:
        ru: 'Блаженство је за људско биће када се повери Господу Христу, вером повери. А мука је, а очајање је, а пакао је за људско биће, ако повери себе оку свом, или ма коме чулу; или разуму свом, или срцу свом; или човеку неком, ма како био «генијалан», и «велики», или ма коме или ма чему мањем од Богочовека Христа. «Не видеше и вероваше»: не видеше Мене телесним очима, и вероваше у Мене, имаше поверење у Мене. Многи, премноги Јевреји телесним очима гледаше и видеше Спаситеља, и мало их вероваше у Њега; милиони и милини Га не видеше телесним очима, и вероваше Га. Јер телесне очи виде само површину и човека и света, а вид вере – види Бога у Христу. «Блажени» су, јер су нашли сигурног вођа кроз живот и животе, кроз свет и светове.'
        cn: '一个人若信靠主基督，凭着信心信靠，那便是他的幸福。但若一个人将自己交托给自己的眼睛，或任何一个感官；或自己的理性，或自己的心；或任何一个人，无论他多么「才华横溢」，多么「伟大」；或任何低于神人基督的人或物，那便是他的苦难，是他的绝望，是他的地狱。


          「未曾看见就信了」：他们未曾用肉眼看见我，却信了我，信赖了我。许多，极多的犹太人用肉眼观看并看见了救主，但其中信祂的却很少；数以百万计的人未曾用肉眼看见祂，却信了祂。因为肉眼只看见人与世界的表面，而信心的视线——却在基督里看见神。他们是「有福的」，因为他们找到了一位稳妥的向导，能够带领他们穿越此生与永生，穿越此世与诸世界。'
    - type: paragraph
      text:
        ru: А са Христом и у Христу они доживљују сва савршенства Божја као своја, а у њима и сва блаженства Божја као своја.
        cn: 而他们与基督同在并在基督里，将神的一切完美体验为自己的；并且在这些完美之中，也将神的一切福乐体验为自己的。
    - type: paragraph
      text:
        ru: «А и многа друга знамења учини Исус пред ученицима Својим, која нису записана у књизи овој. А ова су записана да вјерујете да Исус јесте Христос, Син Божији, и да вјерујући имате живот у Име Његово.» (Ин.20:30–31)
        cn: 「耶稣在门徒面前另外行了许多神迹，没有记在这书上。但记这些事，是要叫你们信耶稣是基督，是神的儿子，并且叫你们信了，就可以因他的名得生命。」 (约翰福音 20:30-31)
    - type: paragraph
      text:
        ru: 'По васкрсењу Свом Спаситељ «учини и многа друга чудеса пред ученицима својим» која нису записана у светом Еванђељу. Као што је записано ово чудо са апостолом Томом. Зашто је тако урадио, свети Еванђелист нам објашњава: «А ова се написаше да верујете да Исус јесте Христос Син Божји, и да верујући имате живот у име његово». Циљ је Спасових чудеса: спасење људи вером. Господ их је чинио само уколико су она била потребна да би људи поверовали у Њега као у Бога и Спаситеља. Претпостављао је веру по слободним убеђењима вери заснованој на чудима. А то значи: веру оних «који не видеше и вероваше» вери оних који, пошто видеше, вероваше. Вера пак у Богочовека даје људима живот вечни.'
        cn: 祂复活之后，救主「在祂的门徒面前行了许多其他的神迹」，这些神迹并没有记载在圣福音中。正如记载了使徒多马的这个神迹一样。圣史家向我们解释了祂为何如此行：「但写这些事，是要叫你们信耶稣是基督，是神的儿子，并且叫你们信了祂，就可以因祂的名得生命。」 (约翰福音 20:31) 救主神迹的目的在于：借着信心使人得救。主施行这些神迹，仅当它们是必要的，以便人们相信祂是上帝和救主。祂更看重基于自由确信的信心，而非基于神迹的信心。这意味着：祂更看重那些「没有看见却相信的人」的信心，胜过那些看见了才相信的人的信心。(约翰福音 20:29) 然而，对神人的信心赐予人们永生。
    - type: paragraph
      text:
        ru: 'У томе се састоји сва вера оних који, пошто видеше, вероваше. Живот у Њему, живот је вечни. У томе је и блаженство верујућих: стално живе осећањем и сазнањем да је смрт побеђена и људска природа у вечни, блажени живот божански уведена. Да живи у њему бескрајно и бесконачно кроза све векове.'
        cn: 这就是所有那些看见了而信了的人的全部信仰所在。在祂里面的生命，就是永恒的生命。信徒的福祉也正在于此：他们持续活在一种感受和认知之中，即死亡已被战胜，并且人性已被引入永恒、蒙福的属神生命之中。从而在这生命中无休无止、无穷尽地活过世世代代。
  - type: heading2
    text:
      ru: Глава двадесет прва. Јављање васкрслога Христа ученицима
      cn: 第二十一章. 复活的基督向门徒显现
    children:
    - type: paragraph
      text:
        ru: '«Послије тога опет се јави Исус ученицима Својим на мору Тиверијадском. А јави се овако: Бијаху заједно Симон Петар и Тома, звани Близанац, и Натанаило из Кане Галилејске, и синови зеведејеви, и друга двојица од ученика Његових. Рече им Симон Петар: Идем да ловим рибу. Рекоше му: Идемо и ми с тобом. Изиђоше и уђоше одмах у лађу, и оне ноћи не ухватише ништа. А кад већ настаде јутро, стајаше Исус на обали, али ученици не познаше да је то Исус. А Исус им рече: Дјецо, немате ли што за јело? Одговорише Му: Немамо. А Он им рече: Баците мрежу са десне стране лађе, и наћи ћете. Онда бацише, и већ је не могаху извући од мноштва рибе. Онда онај ученик, кога љубљаше Исус, рече Петру: То је Господ! А Симон Петар, када чу да је Господ, опаса се огртачем, јер бјеше наг, и баци се у море. А други ученици стигоше лађицом, јер не бијаху далеко од земље него око двјеста лаката, вукући мрежу са са рибом. Чим пак изиђоше на земљу, видјеше огањ наложен и на њему положену рибу и хљеб.» (Ин.21:1–9)'
        cn: 此后，耶稣在提比哩亚海边又向祂的门徒显现。祂是这样显现的：有西门彼得和称为双子的多马，和加利利的迦拿人拿但业，和西庇太的儿子们，和祂的另外两个门徒在一起。西门彼得对他们说：「我去打鱼。」他们对他说：「我们也和你同去。」他们就出去，立刻上了船。那一夜，他们什么也没有打着。天将亮的时候，耶稣站在岸上，门徒却不知道是耶稣。耶稣对他们说：「孩子们，你们有没有吃的？」他们回答祂：「没有。」祂对他们说：「把网撒在船的右边，就必得到。」他们便撒下网去，竟不能拉上来了，因为鱼甚多。耶稣所爱的那门徒对彼得说：「是主！」西门彼得一听见是主，就束上一件外衣，因为他原是赤着身子，跳进海里去了。别的门徒坐着小船过来，因为离岸不远，约有二百肘，把那网鱼拖过来。他们上了岸，就看见那里有炭火，并且有鱼放在上面，也有饼。（约翰福音 21:1-9）
    - type: paragraph
      text:
        ru: Јављање васкрслог Господа ученицима на мору Тиверијадском показује да је љубав према Христу, христољубље, сила и вид који распознаје васксрслог Господа. Ту «ученик кога љубљаше Исус» први распознаде Васкрслога, и рече Петру «То је Господ». А Петар, пламена вера и у њој пламена љубав, «кад чу да је Господ, запреже се кошуљом, и – скочи у море», да ба што пре дошао до Господа, пошто је лађа ишла полако збот мноштва риба. Крај чудесног Господа роје се чудеса као нешто природно, онако као што се зраци роје из сунца. Јер изишавши из лађе на обалу, ученици «видеше огањ наложен, и на њему метнуту рибу, и хлеб».
        cn: 复活之主在提比利亚海向门徒显现，这表明对基督的爱，即爱基督之心，是认出复活之主的力量和洞见。在那里，「耶稣所爱的门徒」（约翰福音 21:7）首先认出了复活的主，并对彼得说：「是主！」而彼得，怀着火热的信心以及其中火热的爱，「一听见是主，就束上一件外衣，跳进海里」（约翰福音 21:7），为的是能尽快来到主身边，因为船因鱼多而行进缓慢。在奇妙的主身边，神迹奇事自然而然地涌现，如同光芒从太阳涌出一般。因为门徒们从船上岸后，「就看见那里有炭火，上面放着鱼，还有饼」（约翰福音 21:9）。
    - type: paragraph
      text:
        ru: '«Исус им рече: Донесите од рибе што сада ухватисте. А Симон Петар уђе и извуче мрежу на земљу пуну великих риба, сто педесет и три; и од толикога мноштва не продрије се мрежа. Рече им Исус: Ходите, обједујте. А ниједан од ученика не смједе да Га упита: Ко си ти? знајући да је Господ. Тада дође Исус, и узе хљеб и даде им, тако и рибу.» (Ин.21:10–13)'
        cn: 耶稣对他们说：「把你们现在打的鱼拿几条来。」西门彼得就上去，把网拉到岸上，那网满了大鱼，共一百五十三条；鱼虽这么多，网却没有破。耶稣对他们说：「你们来吃早饭吧。」门徒中没有人敢问他：「你是谁？」因为他们知道是主。耶稣就来，拿饼给了他们，也同样拿鱼给了他们。(约翰福音 21:10-13)
    - type: paragraph
      text:
        ru: 'А васкрсли Господ с њима општи на један бескрајно природан начин: пеку свеже рибе; заједно сви обедују од благословених хлеба и риба, које им васкрсли даје Својом руком: «Исус узе хлеб, и даде им, тако и рибу». – Васкрсли Господ једе, сигурно не зато што му је потребна храна за одржање бесмртног тела, већ да би и на тај иачин показао својим ученицима како је стварно васкрсао, и има стварно тело.'
        cn: '而复活的主以一种极其自然的方式与他们相交：他们烤新鲜的鱼；他们一同进食，吃的是复活的主亲手给他们的，蒙福的饼和鱼：「耶稣拿起饼来，递给他们，又递给他们鱼。」

          ——复活的主进食，当然不是因为祂需要食物来维持祂不朽的身体，而是为了也借此向祂的门徒们表明祂确已复活，并且拥有真实的身体。'
    - type: paragraph
      text:
        ru: А та храна, по речима СветогГригорија Паламе, сагоревала је у огњу Христовог Божанства. Као да се огањ хранио њоме.
        cn: 并且那食物，按照圣格列高利·帕拉马斯的话，在基督神性的火焰中被焚烧。仿佛火焰以它为食。
    - type: paragraph
      text:
        ru: '«Ово се већ трећи пут јави Исус ученицима Својим пошто устаде из мртвих. А кад обједоваше, рече Исус Симону Петру: Симоне Јонин, љубиш ли ме више него ови? Рече Му: Да, Господе, Ти знаш да Те волим. Рече Му: Напасај јагањце Моје». (Ин.21:14–15)'
        cn: 「这已经是耶稣从死里复活之后，第三次向门徒显现了。他们用过餐后，耶稣对西门·彼得说：『约翰的儿子西门，你爱我比这些人更深吗？』他回答说：『是的，主啊，你知道我爱你。』耶稣对他说：『你牧养我的羊羔吧。』」 (约翰福音 21:14-15)
    - type: paragraph
      text:
        ru: 'Нема сумње, од апостола, Петру је било најнелагодније крај васкрслог Господа. Три пута Га се одрекао, и сам га Господ тужно погледа када је петао запевао, и његово христоиздајсгво свету објавио. Он се истински покајао, али како све то рећи Васкрслом Гошоду? на који начин? Свемилостиви Господ сам спасава Петра тих мука, својим трикратним питањем и Петровим трикратним одговором. «А кад обедоваше, рече Исус Симону Петру: Симоне Јонин, љубиш ли ме већма него ови?».'
        cn: 毫无疑问，在众使徒中，彼得在复活的主身边最感到不安。他三次不认主，当鸡叫的时候，主也亲自忧伤地看着他，并将他背叛基督的事实宣告给世人。他真心悔改了，但他如何向复活的主倾诉这一切呢？以何种方式呢？全慈悲的主亲自将彼得从那些痛苦中解救出来，通过祂三次的提问和彼得三次的回答。「他们吃完了早饭，耶稣对西门彼得说：约翰的儿子西门，你爱我比这些更深吗？」
    - type: paragraph
      text:
        ru: 'На Вечери си се клео и преклињао, па си ме неколико часова после тога издао, три пута се мене одрекао. Клео си се и преклињао као да ме љубиш «већма него ови». Трократним одречењем показао си да ме не љубиш «већма него ови». Штавише, то је знак супротнога. Скрхан горким искуством, Петар се више не хвали, не тврди: «душу ћу своју положити за тебе» (Ин.13:37), већ покајнички смерно одговара: «Ти знаш да те љубим». А Христа љуби – ко заповести Његове држи, од којих је прва вера. То је основа апостолства.'
        cn: 在那次的晚餐上，你又起誓又赌咒，却在几个小时后离弃了我，三次不认我。你又起誓又赌咒，仿佛你爱我「比这些人更深」。你以三次不认我，表明你爱我「并不比这些人更深」。不仅如此，这更是恰恰相反的迹象。被这痛苦的经历击垮，伯多禄不再夸口，不再断言：「我必为祢舍命」（约翰福音 13:37），而是忏悔地谦卑回答说：「祢知道我爱祢。」而爱基督的，是那遵守祂诫命的人，其中首要的便是信德。
    - type: paragraph
      text:
        ru: '«Рече му опет други пут: Симоне Јонин, љубиш ли Ме? Рече Му: Да, Господе, Ти знаш да Те волим. Рече Му: Чувај овце Моје. Рече му тећи пут: Симоне јони, волиш ли Ме? Петар се ожалости што му рече трећи пут: волиш ли Ме? И рече Му: Господе, Ти све знаш, Ти знаш да Те волим. Рече му Исус: Напасај овце Моје. Заиста, заиста ти кажем: Када си био млађи, опасивао си се сам и ходио си куда си хтио; а кад останриш, раширићеш руке своје и други ће те опасати и одвести куда не желиш.» (Ин.21:16–18)'
        cn: «祂第二次又对他说：「约翰的儿子西门，你爱我吗？」他回答说：「主啊，是的，你知道我爱你。」祂说：「牧养我的羊。」祂第三次又对他说：「约翰的儿子西门，你爱我吗？」彼得因为祂第三次对他说「你爱我吗？」而忧愁，就对祂说：「主啊，你无所不知，你知道我爱你。」耶稣对他说：「喂养我的羊。我实实在在地告诉你：你年轻的时候，自己束上腰带，随意往来；但你年老的时候，你要伸出手来，别人会给你束上腰带，带你到你不愿意去的地方。」» (约翰福音 21:16-18)
    - type: paragraph
      text:
        ru: '«Рече му Исус: паси јагањце моје». А ти си их се, Петре, био одрекао њих одрекавши се Мене пред служавком. Али, изјављујеш да ме љубиш, једанпут – но ти си Ме се и по други пут одрекао. Можеш ли и по други пут изјавити да Ме љубиш: «Рече му опет другом: Симоне Јонин, љубиш ли ме?» Спас изоставља: «већма него ови?» јер је својим смерним одговором првим Петар избегао да то тврди. По други пут загледај у себе, да ли Ме љубиш, или Ме се можеш још који пут одрећи. «Рече му: да, Господе! Ти знаш да те љубим». Зар ништа не додајеш првом одговору, Петре? Значи, осетио си и научио си са горким искуством, да се не треба ослањати на себе, на људску природу, нити имати поверење у њу, у себе. Сазнао си да је вера у Христа – поверење у Христа, а не у себе или у људе око себе. «Рече му Исус: паси овце моје», које си напустио чим си вука угледао. Али, ти си ме се три пута одрекао; загледај још једном у себе да ли ме љубиш истински и да ли верујеш у Мене истински. «Рече му трећом: Симоне Јонин! љубиш ли Ме? А Петар поста жалостан што му рене трећом: љубиш ли Ме? и рече Му: Господе, ти све знаш, ти знаш да те љубим». Зашто Петар «поста жалостан»? Зато што је осетио сву оштрину божански благог прекора, спасоносног прекора, у Спаситељевом трикратном питању, због његовог трикратног одречења. И још један разлог: Спаситељ се у сва три питања обраћа Петру не као Петру, камену вере, већ као Симону сину Јонином. Значи: Петар се трократним одречењем био одрекао свога апостолства, себе као Петра, и вратио се себи старом, себи – Симону сину Јонином. – И када је и по трећи пут окајао своје трократно одречење од Христа и апостолства, Сггас му вели: «паси овце моје», – и тако васпоставља у апостолство.'
        cn: 「耶稣对他说：牧养我的小羊。」然而彼得，你曾因在使女面前否认我而否认了他们。可你却声明你爱我，一次——但你却也第二次否认了我。你还能第二次声明你爱我吗：「祂又第二次对他说：约翰的儿子西门，你爱我吗？」救主省略了：「比这些更爱我吗？」因为彼得用他谦逊的第一个回答，避免了如此声称。第二次审视自己，你是否爱我，抑或你还能再次否认我。「祂说：是的，主啊！你知道我爱你。」彼得，你没有在第一个回答上增添什么吗？这意味着你已带着苦涩的经验感受并学到，不应倚靠自己，倚靠人性，也不应信任它，信任自身。你已明白对基督的信心——是对基督的信任，而不是对自己或周围的人的信任。「耶稣对他说：牧养我的羊，」你一见到狼就抛弃了它们。但是，你三次否认了我；再次审视你自己，你是否真实地爱我，以及你是否真实地相信我。「祂第三次对他说：约翰的儿子西门！你爱我吗？彼得就忧愁，因为祂第三次对他说：你爱我吗？他对祂说：主啊，你无所不知，你知道我爱你。」为什么彼得「变得忧愁」？因为他感受到了救主三次提问中，那神圣温和的责备、救赎性的责备的全部锐利，这乃是因他三次否认了主。还有一个原因：救主在所有三个问题中，对彼得的称呼并非彼得——信德的磐石，而是约翰的儿子西门。这意味着：彼得通过他三次否认，已经放弃了他的使徒职分，放弃了他作为彼得的身份，并回到了他旧日的自己，回到了他——约翰的儿子西门。——当他第三次为他三次否认基督和使徒职分而忏悔时，救主对他说：「牧养我的羊，」——并因此将他恢复到使徒职分。
    - type: paragraph
      text:
        ru: '«А ово рече указујући каквом ће смрћу прославити Бога. И казавши ово, рече му: Хајде за Мном! А Петар осврнувши се видје гдје за њима иде ученик кога Исус љубљаше, који се и на вечери наслони на прса Његова и рече: Господе, ко је тај који ће Те издати? Видјевши Петар овога, рече Исусу: Господе, а шта ће овај? Исус му рече: Ако хоћу да он остане док не дођем, шта је теби до тога? Ти хајде за Мном.» (Ин.21:19–22)'
        cn: 「耶稣说这话，是指着他将要怎样死，以荣耀神。说了这话，就对他说：『你跟从我吧！』彼得转过身来，看见耶稣所爱的那门徒跟着；这门徒就是在晚饭的时候，靠着耶稣的胸膛，问『主啊，出卖你的是哪一个』的。彼得看见他，就问耶稣说：『主啊，这人将来怎么样呢？』耶稣对他说：『我若要他等到我来的时候，这与你何干？你跟从我吧！』」 (约翰福音 21:19-22)
    - type: paragraph
      text:
        ru: 'Да је ово трократно питање заиста Петрово васпостављање у апостолство, види се одмах из онога пгго одмах долази за тим. Спас вели Петру: «Хајде за мном». Тако је обично говорио ученицима када их је позивао на апостолство. Још му је Спас показао да апостолство значи: не само живот ради Христа, већ и жртву ради Христа, и смрт за Христа. И још нешто: Спас је апостолу Петру показао да је апостолсгво: идење за Христом васцелим бићем; ту нема освртања натраг, још мање – ударање уназад; оно је стално идење за Христом свим бићем. Зато Спас и по друти пут вели Петру: «Ти хајде за мном».'
        cn: 这三次问话确实是彼得重获使徒职分，这一点从紧随其后的内容中便立刻显明。救主对彼得说：「你跟从我吧。」他通常在召叫门徒担当使徒职分时，都会如此说。救主还向他表明，使徒职分不仅意味着为基督而活，也意味着为基督而献祭，并为基督而死。还有，救主向使徒彼得指出，使徒职分就是：全心全意地跟随基督；这其中没有回头张望，更没有退缩；它乃是全心全意地持续跟随基督。因此，救主第二次又对彼得说：「你跟从我吧。」
  - type: heading2
    text:
      ru: Вечно Еванђеље
      cn: 永远的福音
    children:
    - type: paragraph
      text:
        ru: «Ово је онај ученик који свједочи о овоме, и написа ово, и знамо да је истинито свједочанство његово. А има и много друго што учини Исус, које кад би се редом написало, ни у сами свијет, мислим, не би стале написане књиге. Амин.» (Ин.21:24–25)
        cn: «作这见证的就是这门徒，他也是写这些事的人；我们也知道他的见证是真的。耶稣所行的事还有许多，若是一一地都写出来，我想，全世界也容不下所写的书了。阿们。» （约翰福音 21:24-25）
    - type: paragraph
      text:
        ru: Цело своје Еванђеље свети Еванђелист назива сведочанством, личним сведочанством о свему шго је сам доживео као апостол и лични пратилац Господа Христа, а нарочито као ученик «кога љубљаше Исус».
        cn: 圣福音书作者将自己的整部福音书称为见证，一个关于他作为使徒、主基督的亲身同伴，尤其是作为「耶稣所爱的」门徒，所亲自经历的一切的个人见证。
    - type: paragraph
      text:
        ru: 'Лично, на личном опиту засновано сведочанство, ето то је Еванђеље. Ту нема ничег измишљеног, ни неемпиричног: све је емпирично, конкретно, доживљено. Богочовек је заиста донео свету ову благовест: Бог је помоћу човека постао најшира и најочигледнија стварност у човечанском свету; Бог је са свима својим савршенствима ушао кроз Богочовека у људски живот, оваплотио их овде, иа земљи; дао људима све што Бог љубави може и хоће да да људима.'
        cn: '福音是建立在个人经验之上的亲身见证。其中没有虚构的，也没有非经验性的事物：一切都是经验性的，具体的，被经历过的。


          神人确实将这大喜的信息带给了世界：借着人，上帝成了人类世界中最广阔、最显而易见的现实；上帝以祂所有的完美，借着神人进入了人类生命，在这里，在地上，将这些完美具体化了；将爱之神所能且愿赐予人类的一切，都赐给了人类。'
    - type: paragraph
      text:
        ru: 'Зато што је Еванђеље – живот и дело Богочовека Христа, оно је бескрајно и бесконачно са сваке стране. О томе се увек и кроза све векове могу писати и писати књиге, али се никад не може рећи и казати све о Исусу Богочовеку. Његова чудесна Личност остаје занавек: најмилије и најчудесније чудо на земљи, које никакве, речи не могу довољно изразити, нити икакви језици довољно исказати.'
        cn: 因为福音乃是神人基督的生命和事工，所以它在各方面都是无限而无穷的。关于祂，人们可以永远、在所有世代中不断地撰写书籍，但却永远无法说尽、道尽神人耶稣的一切。祂奇妙的位格永远长存：是地上最亲爱、最奇妙的神迹，没有任何言语能够充分表达，也没有任何语言能够充分阐明。
    - type: paragraph
      text:
        ru: 'Зато је свети Еванђелист у праву када своје свето Еванђеље завршава речима: «А има и друго много што учини Исус, које када би се редом пописало, ни у сами свет, мислим, не би могле стати написане књиге. Амин».'
        cn: 因此，圣福音书作者是正确的，当他用以下话语结束他的圣福音时：「阿，耶稣所行的事还有许多，若是一一的都写出来，我想，所写成的书，连这世界也容纳不下。阿们。」（约翰福音 21:25）
    - type: paragraph
      text:
        ru: На Преподобног Теодора Освећеног
        cn: 致 荣福的受圣者狄奥多尔
    - type: paragraph
      text:
        ru: 16/29 маја, 1945. године
        cn: 1945年5月16日/29日
    - type: paragraph
      text:
        ru: Град ман. Свете Тројице (Овчар-Каблар)
        cn: 格拉德修道院 圣三一 (奥弗卡尔-卡布拉尔)
  - type: heading2
    text:
      ru: Поговор
      cn: 格言
    children:
    - type: paragraph
      text:
        ru: Као и многи други велики Оци Цркве Христове и Отац Јустин је био не само велики богослов и философ, надахнути пастир и духовник, него такође и велики тумач Речи Божије, Еванђеља Богочовека Христа.
        cn: 像许多其他基督教会的伟大教父一样，尤斯廷教父不仅是一位伟大的神学家和哲学家，一位蒙受感召的牧者和神师，更是一位伟大的上帝圣言、即神人基督福音的诠释者。
    - type: paragraph
      text:
        ru: Његово тумачење Светога Писма, и нарочито Еванђеља = Благовести Христове, било је пре свега свеживотни лични подвиг, у којем је Реч Божију доживљавао као громогласну благовест (крштено му је име било Благоје) вечне Истине и вечног Живота, благовест коју Живи и Истинити Бог открива и дарује живом и пробуђеном човеку – као Свој логос = смисао за човекову егзистенцију и као свој хлеб насушни за живот овде на земљи и у вечном Царству Небеском.
        cn: 他对圣经，尤其是对福音，即基督的喜讯的诠释，首先是他贯穿一生的个人属灵奋斗。在这奋斗中，他将上帝的话语视为宏亮的喜讯（他的受洗名为布拉戈耶），即永恒真理和永恒生命的喜讯。这喜讯是活真上帝向活泼而觉醒之人所启示并赐予的——作为祂的逻各斯，即人类存在的意义，以及祂为着在此世和永恒天国中的生命所赐的日用粮。
    - type: paragraph
      text:
        ru: 'Зато је Отац Јустин приступао светописамској Речи Божијој увек подвижнички. Његово основно егзегетско правило било је: твори да би разумео, сходно речи Христовој из Еванђеља по Матеју 5:19: ««Ко изврши и научи, тај ће се велики назвати у Царству Небеском». Он је свагда Еванђељем најпре живео, а онда га и другима проповедао као пастир и духовник и предавао га као профеоор теологије.'
        cn: 因此，尤斯丁神父总是以苦修的方式对待圣经中上帝的圣言。他基本的解经原则是：实行方能理解，这符合基督在（马太福音 5:19）中的话：「凡遵行又教训人的，这人在天国里要被称为大的。」他总是首先活出福音，然后作为牧者和灵性指导者向他人宣讲，并作为神学教授传授福音。
    - type: paragraph
      text:
        ru: 'Као наставник у Богословијама (Сремски Карловци, Призрен, Битољ) између два рата, Отац Јустин је годинама предавао као предмет тумачење Новог Завета. Од тада је остало више бележака, његових и ђачких, са тих егзегетских предавања: на Еванђеље Матејево и Јованово, на Дела Апостолска, на поједине Посланице Св. Апостола Павла. Касније, у ратним и паратним годинама, он је писао и потпуна тумачења: на Еванђеља по Матеју и по Јовану, на три Саборне Посланице Св. Јована Богослова и на скоро све Посланице Апостола Павла. Већину тих тумачења манастир Ћелије је већ објавио. Сада издајемо и ово Тумачење Светог Еванђеља по Јовану, из рукописне заоставштине Великог Аве.'
        cn: 作为两战之间在神学院（斯雷姆斯基·卡尔洛夫奇、普里兹伦、比托拉）的教师，尤斯丁神父多年教授新约注释这门科目。从那时起，他的和学生的许多笔记，来自那些释经学讲座——关于马太福音和约翰福音、使徒行传，以及圣使徒保罗的某些书信——都留存了下来。后来，在战争年代和战后年代，他也撰写了完整的注释：关于马太福音和约翰福音，关于圣约翰神学家的三封大公书信，以及关于使徒保罗的几乎所有书信。采列耶修道院已出版了这些注释中的大部分。现在我们也将出版这部圣约翰福音注释，其来自伟大阿瓦的手稿遗作。
    - type: paragraph
      text:
        ru: У рукописима се налазе три редакције тумачења Оца Јустина на Еванђеље Јованово. Најпре белешке његових ученика богослова, умножаване литографски (негде трвдесетих година), али је од тога сачувано само тумачење првих 8 (осам) глава Јовановог Еванђеља. Друго тумачење је рукопис (писан оловком врло ситно, у 2 нотеса, на лошем ратном папиру) из 1945. године, који обухвата целокупно Јованово Еванђеље. (Писање овог тумачења започео је Ава Јустин 8/21. априла 45. и први блокнотес завршио (Гал.8:40) на Велики Петак 21. ацрила (4. маја) 45, а затим продужио у другом нотесу и завршио до краја Еванђеља (Гал.8:41 – 2125) на Преп. Теодора Освећеног 16/29. маја 1945. у Дучаловићу, у виноградској колиби манастира Сретења у Овчарско-кабларској клисури, где је тада проводио дане у критично послератно време, будући избачен са Универзитета и прогањан и затвараи на правди Бога.
        cn: 在手稿中，现存尤斯廷神父对约翰福音诠释的三个版本。首先是他的神学生们的笔记，以石版印刷复制（大约在三十年代），但其中只保存了约翰福音前8（八）章的诠释。第二个诠释是一份成于1945年的手稿（用铅笔在2本笔记本上写得非常小，采用劣质战时纸张），其涵盖了完整的约翰福音。(阿瓦·尤斯廷于45年4月8/21日开始撰写这份诠释，并于45年4月21日（5月4日）的圣周五完成了第一个笔记本（加拉太书 8:40），随后在第二个笔记本中继续撰写，并于福音书结尾处（加拉太书 8:41-2125）完成，完成日为1945年5月16/29日圣提奥多尔·奥斯维耶尼日，地点是杜察洛维奇，在奥夫察尔-卡布拉尔峡谷斯雷特涅修道院的一座葡萄园小屋中。当时他正身处危急的战后时期，被大学开除，并因着上帝的公义而遭受迫害和监禁。)
    - type: paragraph
      text:
        ru: Пред своје блажено престављење Отац Јустин је ово своје тумачење почео да прерађује и проширује (почев од 11. децембра 1978, у ман. Ћелије) и стигао је до гл. 5,47, а онда се предсмртно разболео (на 10 дана пред Благовести 1979, на који празник је и прешао из овога света у онај, спојивши тако свој телесни земаљски роћендан са вечним Рођенданом у Царству Небеском).
        cn: 在尤斯廷神父荣蒙安息之前，他开始修订和扩充自己的这部注释（始于1978年12月11日，在采列修道院），并完成了至第五章第四十七节。之后他便病重垂危（在1979年圣母领报节前十天，他在此节期中从此世归到彼世，从而将他肉身的尘世生日与在天国中的永恒生日合而为一）。
    - type: paragraph
      text:
        ru: Ово опширније тумачење, дакле главе 1–5, објављујемо овде у целини, а у наставку (тј. главе 5, 47 (завршетак стиха) до 21:25) објављујемо оно тумачење из рукописа насталог у Овчару. Тако добијамо штампано комплетно тумачење Св. Еванђеља по Јовану (остављајући да се касније објаве и остале варијанте тумачења из напред наведених рукописа). Свугде смо поштовали Ауторов рукопис (осим што смо, због техничких тешкоћа штампарије, из опширнијих грчких цитата наводили само најнужније).
        cn: 这篇更详尽的注释，即第1-5章，我们在此完整出版；而在下文（即第5章，第47节（节末）至21:25），我们出版源自奥夫查尔（Ovčar）所成手稿的注释。如此一来，我们便获得了圣约翰福音的完整印刷版注释（至于前述手稿中的其他注释版本，则留待日后出版）。我们在各处均尊重作者的手稿（除了由于印刷厂的技术困难，我们在较长的希腊语引文中，仅引用了最必要的部分）。
    - type: paragraph
      text:
        ru: 'Отац Јустин је иза себе оставио и низ других краћих бележака – схолија – на поједина места Еванђеља Јовановог и других књига Новог Завета, који записи престављају прворазредни егзегетски материјал, попут напр. светоотачких одломака у познатима Катенама. Навешћемо овде, примера ради, само један такав запис, који се односи на сам назив Апостола Јована дат му од Христа: «Воанергес» = «син грома» (Мр. 3:17).'
        cn: 父尤斯廷也留下了一系列其他短小的札记——旁注——针对约翰福音中的某些段落以及新约其他书卷。这些记录代表着一流的释经材料，比如在著名的《联环注经》中教父的片段。在此，我们仅举一例这样的记录，它涉及使徒约翰由基督赐予他的称呼：「博阿涅尔格斯」 = 「雷霆之子」（马可福音 3:17）。
    - type: paragraph
      text:
        ru: '* * *'
        cn: '* * *'
    - type: paragraph
      text:
        ru: '«Син грома» – громовима Истине влада. Сваки да чује: громове Истине. Нема глувога. Вера – то (је) слух, то уво: чути Бога Истинога. Еванђеље – громовске истине. Громобрани: вера, љубав, нада = врлине: помоћу њих се учити громовским истинама вере, Еванђеља. (То су) Громови вечнога Живота, вечне Истине. Он влада громовима Истине, Еванђеља = свеврлина. Истине Еванђеља (су) обучене у громове. (Јован је) Громовник Еванђеља, Цркве, вечног Живота, вечних Истина. – Свака реч = благовест = гром; нема глувог, сви чују – громове. Вера – слух, љубав – гром; све гром до грома; то је Нови Завет – то Господ Христос. Истина васкрсења – гром. Истина Вечног Живота – гром. Истина Вечне Љубави – гром. Истина Вечног Еванђеља – гром. Изнад облака времена и простора су новозаветни Громовници – Свети Јован и Јаков (Мр.3:17). То су уствари и сви Апостоли, за њима и Свети Оци. Ништа јаче од њих: владају смрћу и животом».'
        cn: 「雷子」——他以真理的雷声掌权。每个人都当听闻：真理的雷声。没有聋子。信仰——就是听觉，就是耳朵：听闻真神。福音——雷鸣般的真理。避雷针：信仰、爱、盼望，即诸德行：借着它们学习信仰和福音中雷鸣般的真理。这些是永生和永恒真理的雷声。他掌管真理和福音的雷声——即所有德行。福音的真理披上了雷声。（圣约翰是）福音、教会、永生、永恒真理的「雷霆之人」。——每一句话语——都是福音——都是雷声；没有聋子，所有人都听闻——雷声。信仰——是听觉，爱——是雷声；一切都是雷声接踵而来；这就是新约——这就是主基督。复活的真理——雷声。永生的真理——雷声。永恒之爱的真理——雷声。永恒福音的真理——雷声。在时间和空间之云之上，有新约的「雷霆之人」——圣约翰和圣雅各布（马可福音 3:17）。实际上，所有使徒也都是，在他们之后，还有圣教父们。没有比他们更强大的：他们掌管着死亡和生命。」
    - type: paragraph
      text:
        ru: '* * *'
        cn: '* * *'
    - type: paragraph
      text:
        ru: '«Бог Логос – свегром: постао човек. То (је) најважнији догађај у историји човека, света, земље, човечанства. Тако човек овладао временом и простором. Бог Логос – Живот свега живога, Истина свега истинитог, Смисао и Мисао свега постојећег, срце Еванђеља, Вечност саме вечностни – Бог Логос – тајна, светајна Еванђеља. Бог Логос – тајна, светајна Боговаплоћења. Бог Логос – тајна, светајна свега живог. Бог Логос – тајна, светајна свега човечијег, и свега постојећег. Бог Логос – тајна, светајна бића, свебића, света и светова, тајна свега постојећег.»'
        cn: 圣言上帝——全声者：成了人。这是人、世界、大地、人类历史上最重要的事件。如此，人掌握了时间与空间。圣言上帝——一切活物的生命，一切真实的真理，一切存在的意义与思想，福音的核心，永恒本身的永恒——圣言上帝是福音的奥秘，至圣奥秘。圣言上帝是上帝道成肉身的奥秘，至圣奥秘。圣言上帝是一切活物的奥秘，至圣奥秘。圣言上帝是一切属人的，以及一切存在的奥秘，至圣奥秘。圣言上帝是存在的，全体存在的，世界与诸世界的奥秘，一切存在的奥秘。
    - type: paragraph
      text:
        ru: '* * *'
        cn: '* * *'
    - type: paragraph
      text:
        ru: '«Бог Логос – казао нам Себе кроз Свето Еванђеље. Бог Логос – казао нам Себе кроз Цркву. Бог Логос – казао нам Себе кроз твар, кроз сву твар; кроз свете тајне и кроз свете врлине. Бог Логос – казао нам Себе кроз свако добро, кроз сваку истину. Вечно је у човеку оно што је логосно: оно је мудрост мудрости човекове, бесмртност бесмртности човекове, вечност вечности човекове.»'
        cn: '上帝之道——藉着圣福音向我们启示了他自己。

          上帝之道——藉着教会向我们启示了他自己。

          上帝之道——藉着受造物，藉着一切受造物；藉着圣奥秘以及藉着圣美德向我们启示了他自己。

          上帝之道——藉着一切良善，藉着一切真理向我们启示了他自己。

          凡属道性的，在人里面是永恒的：它乃是人智慧中的智慧，是不朽性中的不朽性，是永恒性中的永恒性。'
    - type: paragraph
      text:
        ru: '* * *'
        cn: '* * *'
    - type: paragraph
      text:
        ru: '«Еванђелист Јован: у самом почетку Светог Еванђеља казао иам сву тајну Еванђеља, сву тајну Богочовека. А то је? – Бог Логос = Богочовек = Црква. Кроз време и простор разрасло се све Христово, све Богочовеково, и узрасло у Цркву: Богочовечанско тело Христово».'
        cn: 圣史约翰：在《圣福音》的开篇之处，我已宣明了《福音》的全部奥秘，神人的全部奥秘。而那是什么呢？——神言 = 神人 = 教会。基督的一切，神人的一切，都穿越时空扩展，并成长为教会：基督的神人身体。
    - type: paragraph
      text:
        ru: Мислимо да ова успутна егзегетска схолија најбоље открива начин и карактер благовести блаженог Аве Јустина на Вечну Благовест Апостола и Еванђелиста Јована Богослова, Љубљеног Ученика Христовог.
        cn: 我们认为，这附带的释经学批注，最能揭示蒙福的阿瓦·尤斯廷在阐释使徒和福音传道者、约翰·神学家——基督所爱的门徒——的永恒福音时，其传讲的方式和品格。
