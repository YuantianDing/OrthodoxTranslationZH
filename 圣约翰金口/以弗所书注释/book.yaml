    text:
      ru: 'Итак, какЦерковь, составляемая из мужей и жен, повинуется Христу, так и жены должны повиноваться мужьям, как Богу.«Мужья, любите своих жен, как и Христос возлюбилЦерковь»(Еф.5:25). Ты слышал о великом послушании; ты доволен Павлом и рад, что он, как некий дивный и духовный учитель, учит нас порядку в жизни. Хорошо! Но послушай, чего он требует и от тебя: тот же самый пример он приводит и далее."Мужья, – говорит он, –любите своих жен, как и Христос возлюбилЦерковь». Видел меру послушания? Послушай же и о мере любви. Хочешь, чтобы жена повиновалась тебе, как Христу повинуетсяЦерковь? Заботься и сам о ней, как Христос о Церкви. Хотя бы нужно было пожертвовать за нее жизнью, хотя бы нужно было тысячекратно быть рассеченным, или потерпеть и пострадать что бы то ни было, не отказывайся; но и хотя бы ты потерпел все это, не думай, что ты сделал что-нибудь подобное тому, что сделал Христос. Ты терпишь это, будучи уже в союзе с женой; а Он (страдал заЦерковь) отвращавшуюся от Него и ненавидевшую Его. Как Он, когда она отвращалась, ненавидела, презирала Его и была развратна, по великому Своему снисхождению покорил ее под ноги Свои, не прибегая ни к угрозам, ни к порицаниям, ни к устрашениям и ни к чему подобному, – так и ты поступай в отношении к своей жене: хотя бы ты видел, что она пренебрегает тобою, что развратна, что презирает тебя, умей привести к своим ногам твоим великим о ней попечением, любовью и дружбой, нет уз крепче этих, особенно для мужа и жены. Слугу можно иногда связать страхом, – а скорее и его этим не свяжешь, он отскочит и сбежит, – но общницу жизни, мать детей и виновницу всех радостей нужно привязывать к себе не страхом и угрозами, но любовью и расположенностью. Что за супружество, когда жена трепещет мужа? Каким удовольствием может насладиться муж, который сожительствует с женой, как с рабой, а не как со свободной? Если бы и случилось потерпеть что за нее, не ропщи: Христос этого не делал.«И предал Себя за нее, – говорит, –чтобы освятить ее»(Еф.5:25–26). Значит, она была нечиста; значит, на ней были грязные пятна; значит, была безобразна и ничего не стоила. А ты какую бы ни взял жену, твоя невеста была не такова, какой Христос обрелЦерковь; она не так отлична от тебя, как была отлична Церковь от Христа. При всем том Он не возгнушался ею и не возненавидел ее за ее чрезмерное безобразие. Хочешь знать, как она была безобразна? Послушай, что говорит Павел:«Вы были некогда тьма»(Еф.5:8). Видишь черноту ее? Что чернее тьмы? Но посмотри и дерзость ее:«жили в злобе, – говорит, –и зависти". Посмотри и нечистоту:«несмысленны, непокорны»(Тит. 3:3). Что еще сказать? Она была и безумна, и богохульна. Однако, несмотря на то, что в ней было так много дурного, Он и за безобразную предал Себя как за прекрасную, как за возлюбленную, как за достойную дивной похвалы. Недоумевая пред этим, Павел и говорил:«Ибо едва ли кто умрет за праведника»(Рим. 5:7);  и еще:«Христос умер за нас, когда мы были еще грешниками»(Рим. 5:8). И принявши ее такой, Он украшает ее и омывает и не отказывается от этого.«Чтобы освятить ее, – говорит (апостол), –очистив банею водной посредством слова; чтобы представить ее Себе славною Церковью, не имеющею пятна, или порока, или чего-либо подобного, но дабы она была свята и непорочна»(Еф.5:26–27). Баней омывает ее нечистоту.«Посредством слова», – говорит. Каким? Во имя Отца и Сына и Святого Духа. И не только украсил ее, но и сделал славной, не имеющей«пятна, или порока, или чего-либо подобного». Итак, будем и мы искать этой красоты, и мы сможем стать ее творцами. Не требуй от жены того, чего у ней нет. Видишь, чтоЦерковьвсе получила от Владыки? Через Него она сделалась славной, через Него беспорочной. Не отвращайся же и ты от жены из-за ее непривлекательности. Послушай, что говорит Писание:«Мала пчела между летающими, но плод ее – лучший из сластей»(Сир. 11:3). Она – Божье создание: не ее ты порицаешь, но Того, Кто создал ее. Чем виновата жена?'
      cn: 所以，正如由男男女女组成的教会顺服基督一样，妻子也当顺服丈夫，如同顺服上帝。「丈夫们，要爱你们的妻子，正如基督爱教会一样」（以弗所书 5:25）。你听说了伟大的顺服；你满意保罗，并高兴他作为一位奇妙的属灵教师，教导我们生活的秩序。很好！但请听，他对你有什么要求：他接下来还引用了同样的例子。他说：「丈夫们，要爱你们的妻子，正如基督爱教会一样。」你看到了顺服的尺度吗？那么，也请听爱的尺度。你希望妻子顺服你，如同教会顺服基督一样吗？那么，你自己也要关爱她，如同基督关爱教会一样。即使需要为她献出生命，即使需要千次被劈裂，或是忍受和遭受任何事情，都不要拒绝；但即使你忍受了这一切，也不要认为你所做的与基督所做的有任何相似之处。你忍受这些，是因为你已经与妻子结合；而祂（为教会受苦）却忍受了那曾背离祂、憎恨祂的教会。正如祂，当教会背离祂、憎恨祂、轻蔑祂、放荡时，却以祂的伟大宽容使她顺服在祂脚下，不诉诸威胁、谴责、恐吓或任何类似手段，——你也要如此对待你的妻子：即使你看到她轻视你，放荡，蔑视你，你也要用你对她的大爱、关怀和友谊，使她顺服在你脚下。没有比这些更坚固的纽带了，尤其对于丈夫和妻子而言。仆人有时可以用恐惧来束缚，——但更可能的是，你无法用恐惧束缚他，他会挣脱逃走，——但你生命的伴侣、孩子的母亲、所有喜乐的源泉，不应以恐惧和威胁，而应以爱和善意来维系。如果妻子畏惧丈夫，那算是什么婚姻？一个与妻子如同与奴隶而非自由人同居的丈夫，又能享受何种乐趣呢？即使为她遭受什么，也不要抱怨：基督就没有这样做。他说：「并为她舍己，好使她成圣」（以弗所书 5:25-26）。这就意味着，她是污秽的；意味着，她身上有肮脏的斑点；意味着，她是丑陋的，一文不值。而你无论娶了哪位妻子，你的新娘都不会像基督所遇到的教会那样；她与你之间的差异，也不像教会与基督之间的差异那么大。尽管如此，祂并未因她极度的丑陋而厌恶或憎恨她。你想知道她有多丑陋吗？请听保罗怎么说：「你们从前是黑暗」（以弗所书 5:8）。你看到她的黑暗了吗？有什么比黑暗更黑呢？但也请看她的放肆：「生活在恶毒和嫉妒中」，他说。再看她的污秽：「愚昧、悖逆」（提多书 3:3）。还有什么可说的呢？她既愚昧，又亵渎上帝。然而，尽管她有如此多的恶行，祂却为这丑陋的她舍己，如同为美丽的、为蒙爱的、为配得奇妙称颂的她一样。保罗对此感到困惑，因此他说：「为义人死，是少有的」（罗马书 5:7）；他还说：「基督在我们还作罪人的时候为我们死」（罗马书 5:8）。祂接纳了这样的她，并装饰她、洁净她，并不拒绝这一切。「好使她成圣，」使徒说，「借着水洗和圣言洁净她，为要把她呈现给自己，作一个荣耀的教会，没有斑点，没有皱纹，或任何类似之物，却要她圣洁无瑕」（以弗所书 5:26-27）。祂以水洗涤她的污秽。他说：「借着圣言」。哪样的圣言？奉父、子、圣灵之名。祂不仅装饰了她，还使她成为荣耀的，没有「斑点，没有皱纹，或任何类似之物」。所以，我们也要寻求这种美，我们也能成为它的创造者。不要向妻子要求她所没有的。你看，教会的一切都得自祂吗？借着祂，她变得荣耀；借着祂，她变得无瑕。那么，你也不要因为妻子的不吸引人而厌弃她。请听圣经怎么说：「蜜蜂在飞禽之中虽小，但其果实却是甜中之最」（次经 德训篇 11:3）。她是上帝的受造物：你所责备的不是她，而是创造她的那一位。妻子有什么错呢？
  - type: paragraph
    text:
      ru: 'Не хвали ее и за красоту. Развратным душам свойственны такая похвала и такая ненависть, да и самая (страстная) любовь. Ищи красоты душевной; подражай Жениху Церкви. Телесная красота производит великую наглость и много неразумного; она возбуждает ревность и нередко заставляет подозревать тебя в гнусных поступках. Но она, скажешь, доставляет удовольствие? Один месяц или два, много, если год, но не далее; от привычки диво это скоро теряет свою прелесть. А то, что вследствие красоты бывает дурного, остается навсегда: ослепление, безумие, высокомерие. В (удовольствии же), доставляемом не этой (красотой), ничего нет подобного; там любовь, начавшаяся надлежащим образом, остается постоянной, как любовь к красоте душевной, а не телесной.'
      cn: 不要因其美貌而赞美她。淫荡的灵魂所固有的，是这样的赞美和这样的憎恶，乃至最炽热（情欲的）爱。寻求灵魂的美；效法教会的新郎。肉体之美产生极大的放肆和许多不理智之事；它激起嫉妒，并且常常使人怀疑你行为卑劣。但你会说，它能带来愉悦吗？一两个月，最多一年，但不会更久；因为习惯，这美妙之物很快便会失去它的魅力。然而，因美貌而产生的恶果却永远存留：蒙蔽、愚昧、傲慢。而在非此（美貌）所带来的愉悦中，则没有类似的东西；在那里，以适当方式开始的爱，将保持恒久，如同对灵魂之美的爱，而非肉体之美。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Скажи мне, что прекраснее неба? Что прекраснее звезд? Скажешь: тело, – но оно не так бело; укажешь на глаза, – но они не так блестящи. Когда созданы были небеса, им удивились ангелы; и мы ныне удивляемся им, хотя и не так, как сначала. Это от привычки, что мы ныне уже не так поражаемся ими. Не тем ли более (можно сказать это) по отношению к жене? А если приключится болезнь, то тотчас все улетает. Будем же искать в жене благоразумия, умеренности, кротости: таковы признаки (истинной) красоты, – а телесной красоты не будем искать, и не станем укорять ее за то, что не от нее зависит, или лучше, и вовсе не станем укорять, потому что это свойственно дерзости, не будем огорчаться и негодовать. Или не видите, сколько таких, которые жили и с красивыми женами, но бедственно окончили свою жизнь; напротив, сколько таких, которые имели жен не очень благообразных, но в полном благополучии дожили до глубокой старости? Истребим внутреннюю скверну, исторгнем внутренние недостатки, уничтожим пятна душевные. Бог желает такой красоты. Уготоваем ее (жену) прекрасной для Бога, а не для себя самих. Не станем искать денег, ни внешнего благородства, но благородства душевного. Пусть никто не думает разбогатеть через жену, постыдно и позорно такое богатство; и, вообще, пусть никто не ищет здесь богатства, потому что«А желающие обогащаться, – сказано, –впадают в искушение и в сеть и во многие безрассудные и вредные похоти, которые погружают людей в бедствие и пагубу»(1Тим. 6:9). Не ищи от жены больших денег, и ты легко найдешь все другое. Кто, скажи мне, оставив важнейшее, станет заботиться о маловажном? Но, увы, мы всегда так поступаем. Если у нас есть сын, то мы не о том стараемся, чтобы он был хорош, но как бы найти ему богатую жену, не о том, чтоб был благонравен, а о том, чтоб был богат. И если начертываем образ жизни, то также не о том заботимся, как бы нам жить безгрешно, но о том, как бы нам приобретать больше прибытков. Деньги стали значить все. Оттого и повредилось все, что мы одержимы этой страстью.'
      cn: '请告诉我，有什么比天更美的呢？有什么比星辰更美的呢？你或许会说：是身体，——但它没有那么洁白；你或许会指出眼睛，——但它们没有那么闪亮。当诸天被创造时，天使们都为此惊叹；如今我们仍然惊叹于它们，尽管不似起初那般。这是由于习惯，我们如今已不再那么震撼于它们。那么，（也可以说）对于妻子而言，岂不更是如此吗？而若疾病降临，那么一切都将立刻消逝。我们当在妻子身上寻求明智、节制、温柔：这些才是（真正）美丽的标志，——而不要寻求肉体的美，也不要为不取决于她的事而指责她，或者更确切地说，根本不要指责，因为那是一种鲁莽，我们也不要为此感到悲伤或愤怒。难道你们没有看见吗，有多少人与美丽的妻子生活在一起，却悲惨地结束了他们的生命；相反地，有多少人娶了不甚美貌的妻子，却在完全的福祉中安度晚年？


        让我们根除内在的污秽，拔除内在的缺陷，涤净灵魂的斑点。上帝渴望这样的美。让我们为上帝，而非为我们自己，将她（妻子）预备得美好。我们不要寻求金钱，也不要寻求外在的尊贵，而要寻求灵魂的尊贵。愿无人试图通过妻子而致富，这样的财富是可耻且羞辱的；并且，总而言之，愿无人在此寻求财富，因为「那些想要发财的人，——经上说，——就陷在试探、网罗和许多无知有害的私欲里，叫人沉溺在败坏和灭亡中。」 (1提摩太书 6:9)。不要从妻子那里寻求巨额金钱，你便能轻易寻得所有其他的一切。请告诉我，谁会舍弃最重要的，却去关心次要的呢？然而，唉，我们总是如此行事。假若我们有一个儿子，我们努力的不是让他品德优良，而是如何为他找到一个富有的妻子；不是让他品行端正，而是让他富有。并且，若我们描绘生活蓝图，我们关心的也不是如何过无罪的生活，而是如何获取更多收益。金钱已然意味着一切。正因我们被这贪欲所困，一切才遭损坏。'
  - type: paragraph
    text:
      ru: '«Так должны мужья, – говорит (апостол), –любить своих жен, как свои тела»(Еф.5:28). Что это значит? Значит, что он переходит к убедительнейшему и к сильнейшему примеру; и мало того, к примеру более близкому и ясному, и к новой причине. То не казалось весьма необходимым, и чтобы не сказал кто-нибудь: Он был Христос, был Бог, и сам Себя предал, – (апостол) иным способом доказывает то же, говоря:«Так должны»; итак это – не милость, а долг. Сказавши:«как свои тела», он присовокупил:«Ибо никто никогда не имел ненависти к своей плоти, но питает и греет ее»(Еф.5:29), т. е. заботится о ней с великим тщанием. Но каким образом (жена) – плоть мужа? Послушай:"вот, это, – говорил (Адам), –кость от костей моих и плоть от плоти моей»(Быт. 2:23). И не только это, но сказано еще:«и будут одна плоть... Как и Христос возлюбилЦерковь»(Еф.5:25, 31): обращается к прежнему примеру.«потому что мы члены тела Его, от плоти Его и от костей Его»(Еф.5:30). Каким образом? Он произошел от нашего естества, как и Ева есть плоть от плоти Адама. Он, кстати, упомянул о костях и о плоти, потому что это в нас главнейшее – плоть и кости. Одно – как бы основание, а другое – как бы здание. То, впрочем, очевидно; а это каким образом? Как там существует великая близость, так, говорит, и здесь. Что значит:«от плоти:Его»? Значит – истинно от Него. Но как через это мы бываем членами Христовыми? Так, что мы родились подобно Ему. Каким образом от плоти? Это знаете вы, которые приобщаетесь тайнам: ведь через это мы тотчас прообразуемся. Но как? Пока послушай, что говорит блаженный (Павел):«А как дети причастны плоти и крови, то и Он также воспринял оные»(Евр. 2:14). Но здесь Он нам приобщился, а не мы – Ему: каким же образом мы –«от плоти Его и от костей Его»? Некоторые говорят в этом случае о крови и о воде, но это неверно; Он, впрочем, благоволил показать это, именно – как Он, без соития, родился от Святого Духа, так и мы рождаемся в купели. Смотри, сколько примеров побуждают верить тому рождению! О, безумие еретиков! Что рождено от воды, это они признают истинным рождением, – то, что рождается, а что мы становимся Его телом, этого не принимают. Но если мы не делаемся им, то как согласить с этим слова:«от плоти  Его и от костей Его»? И заметь: Адам создан, Христос родился; из ребра Адамова произошло тление, из ребра Христова проистекла жизнь; в раю прозябла смерть, на кресте она уничтожена.'
      cn: '「丈夫也当照样爱他们的妻子，如同爱自己的身体一样」（以弗所书 5:28）。这意味着什么？这意味着他转向一个最令人信服、最强有力的例子；不仅如此，它还是一个更亲近、更清晰的例子，也是一个新的理由。这似乎并非完全必要，而且为了避免有人说：祂是基督，是上帝，祂自己舍弃了自己，——（使徒）便以另一种方式证明同样的事，说：「也当照样」；所以这并非恩典，而是本分。


        他说完了「如同爱自己的身体一样」之后，又补充说：「从来没有人恨恶自己的身体，总是保养顾惜」（以弗所书 5:29），也就是说，以极大的关切照顾它。但妻子如何是丈夫的骨肉呢？请听：（亚当）说：「看哪，这是我骨中的骨，肉中的肉」（创世记 2:23）。不仅如此，经上又说：「二人成为一体……正如基督爱教会一样」（以弗所书 5:25，31）：这里又回到了先前的例子。「因为我们是祂身体上的肢体，是祂的骨、祂的肉」（以弗所书 5:30）。如何是这样？祂是出自我们的人性，正如夏娃是亚当骨肉中的骨肉。他顺便提及了骨和肉，因为在我们里面，最主要的正是骨和肉。一个仿佛是根基，另一个仿佛是建筑。


        前者固然明显；但后者如何呢？他说，就像那里存在着极大的亲密一样，这里也同样。「从祂的肉」是什么意思？意思就是——真正地出自祂。但我们如何借此成为基督的肢体呢？是这样，我们是像祂一样被生出来的。如何是从祂的肉呢？你们这些领受圣奥秘的人都明白：因为借此我们立刻被预表了。但如何呢？姑且听听蒙福的（保罗）所说：「儿女既同有血肉之躯，祂也照样亲自成了血肉之躯」（希伯来书 2:14）。但在这里是祂与我们共享，而不是我们与祂共享：那么我们又如何是「祂的骨、祂的肉」呢？有些人在此处谈及血和水，但这并不正确；然而祂乐意显明这一点，即——祂如何未经结合而从圣灵诞生，我们也同样在洗礼中重生。看哪，多少例子促使人相信那诞生！哦，异端者的疯狂！他们承认从水而生的，是真正的诞生——也就是那被诞生的——却不接受我们成为祂的身体。但如果我们不成为祂的身体，那如何能与「祂的骨、祂的肉」这些话相符呢？


        并且请注意：亚当是被造的，基督是诞生的；从亚当的肋骨生出了朽坏，从基督的肋骨流出了生命；死亡在乐园中滋生，在十字架上却被废除。'
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Итак, подобно тому, как Сын Божий – нашего естества, так и мы – Его сущности; и как Он имеет нас в Себе, так и мы имеем Его в себе.«Посему оставит человек отца своего и мать и прилепится к жене своей, и будут двое одна плоть»(Еф.5:31). Вот и третья причина. Он показывает, что, когда кто-либо, оставивши родителей, от которых произошел, совокупляется с женой, то после того отец, мать и дитя их – одна плоть, составленная из взаимного соединения, потому что вследствие смешения семени рождается дитя, так что трое они – одна плоть. Таким же образом и мы делаемся с Христом одна плоть, по причастию, и мы гораздо более, чем дитя (в отношении к родителям). Почему это? Потому, что так было изначала. Не говори же мне, что (жена твоя) такая-то и такая-то. Разве не видишь, что и в плоти много бывает недостатков? Один хром, у другого кривые ноги, у третьего сухие руки, у четвертого страдает иной какой-либо член. И однако (такой человек) не скорбит, не отсекает его, и часто заботится о нем более, чем о других. И справедливо, – так как он его член. Итак, какую каждый из нас питает любовь к себе, такую же хочет (апостол), чтоб мы питали и к жене. И это не потому, что мы с нею одной природы, но у нас в отношении к жене гораздо более важная причина, именно – что (муж и жена) не два тела, а одно: он – глава, а она – тело. Но как же в другом месте говорит он:«а Христу глава – Бог»(1Кор. 11:3)? Это говорю и я, т.е., что как мы одно тело, так и Христос и Отец – одно. Оказывается, таким образом, что и Отец глава наш. (Апостол) выставляет два сравнения, т. е., с телом и с Христом. Потому и присовокупляет:«Тайна сия велика; я говорю по отношению ко Христу и к Церкви»(Еф.5:32). Что это значит? Называет (брак) великой тайной, потому что на нее указывал, как на нечто великое и дивное, и блаженный Моисей, или лучше – Бог. При том,"я говорю, – говорит, –по отношению ко Христу», так как и Он, оставивши Отца, сошел и пришел к невесте и сделался"один дух"с ней:«соединяющийся с Господом есть один дух с Господом»(1Кор. 6:17). Хорошо сказал: тайна велика есть, – как бы указывая на то, что иносказательное доказательство не уничтожает необходимости любви.«Так каждый из вас да любит свою жену, как самого себя; а жена да боится своего мужа»(Еф.5:33).'
      cn: 那么，正如上帝之子是我们的本性，我们也是祂的本质；正如祂在我们里面拥有我们，我们也就在我们里面拥有祂。「因此人要离开父母，与妻子结合，二人成为一体」（以弗所书 5:31）。这就是第三个原因。祂指出，当一个人离开了生养他们的父母，与妻子结合时，在此之后，父亲、母亲和他们的孩子——都是一体，由相互结合构成，因为由于精血的混合而生下孩子，如此他们三人便成为一体。同样地，我们也借着领受与基督成为一体，并且我们远胜于孩子（相对于父母而言）。这是为什么？因为从起初就是如此。那么，不要对我说（你的妻子）这样或那样。难道你没看到身体上也有许多缺陷吗？有的瘸腿，有的腿弯曲，有的手枯干，有的另一个肢体受苦。然而（这样的人）不忧伤，不截去它，并且常常照顾它多于照顾其他肢体。这是理所当然的，因为它（那肢体）是他的肢体。那么，我们每个人对自己怀有怎样的爱，（使徒）也希望我们对妻子怀有同样的爱。这不是因为我们与她有同一性情，而是我们对妻子而言有一个更为重要的原因，那就是（丈夫和妻子）不是两个身体，而是一个：他是头，她就是身体。然而，祂在另一个地方又说：「基督的头是上帝」（哥林多前书 11:3）？我也这样说，即，正如我们是一个身体，基督与父也是一。如此可见，父也是我们的头。（使徒）提出了两个比喻，即，与身体和与基督的比喻。所以祂接着说：「这奥秘是大的；我是指着基督和教会说的」（以弗所书 5:32）。这是什么意思？祂称（婚姻）为大的奥秘，因为蒙福的摩西，或者更确切地说——是上帝，曾指出它是一件伟大而奇妙的事。此外，祂说：「我是指着基督说的」，因为祂也离开了父，降临并来到新妇那里，与她成为「一灵」：「与主联合的，便是与主成为一灵」（哥林多前书 6:17）。说得好：这奥秘是大的，仿佛在指出，这个寓意性的证据并不取消爱的必要性。「这样，你们各人也当爱自己的妻子，如同爱自己一样；妻子也当敬畏自己的丈夫」（以弗所书 5:33）。
  - type: paragraph
    text:
      ru: 'Подлинно, это – таинство, и великое таинство, потому что человек, оставив произведшего его, родившего, воспитавшего, и ту, которая зачала его, в болезнях родила, (оставивши) тех, которые столько благодетельствовали ему, к которым он привык, – сочетается с той, которой прежде не видал, которая ничего не имеет с ним общего, и предпочитает ее всему.  Подлинно, это – таинство. И родители не печалятся, когда так делается, но напротив печалятся, когда этого не бывает, и, в знак радости, не жалеют денежных издержек и расходов. Поистине, это – великое таинство, заключающее в себе какую-то сокровенную мудрость. Это показал и древний пророк Моисей; об этом и ныне вопиет Павел, говоря:«по отношению ко Христу и к Церкви». Впрочем, так сказано не по отношению только к мужу, но и к жене, чтобы он согревал ее, как плоть свою, как и ХристосЦерковь, а жена чтобы боялась мужа. Говорит не только о любви, – но что?«да боится своего мужа». Жена – вторичная власть; значит, не должна требовать равенства (с мужем), так как стоит под главой; и он не должен высокомерно смотреть на нее, как на подчиненную, потому что она – тело его, а если голова станет пренебрегать телом, то пропадет и сама; взамен послушания она должна привносить любовь. Как глава, так и тело: тело отдает в услужение глав руки, ноги и все прочие члены; а глава заботится о теле, посвящая ему все свое разумение. Нет ничего лучше такого супружества. Но какая, скажут, может быть, любовь там, где страх? Там-то, собственно, она и будет. Которая боится, та и любит: любя, она боится, как главы, и любит, как член, потому что и голова есть член всего тела. Для того он и подчиняет ее, а мужа возносит над нею, чтобы был мир. Где равенство, там не может быть мира, народное ли то будет управление, или все будут повелевать, – необходимо, чтобы было одно начальство. Так всегда бывает с существами телесными; если бы люди были духовные, тогда был бы мир. Было некогда пять тысяч душ, и«никто ничего из имения своего не называл своим», но всем делились друг с другом (Деян. 4:32). Вот – знак мудрости и страха Божьего. Таким образом (апостол) показал образ любви, но образ страха – нет.'
      cn: 确实，这是一个奥秘，一个伟大的奥秘，因为人，离开了生养他、抚育他的父亲，以及怀他、在痛苦中生下他的母亲——离开了那些如此施恩于他、他所亲近的人——却与他从未见过、与他毫无共同之处的女子结合，并把她置于一切之上。确实，这是一个奥秘。当事情如此成就时，父母并不忧伤，反而当事情并非如此时他们才忧伤，并且作为喜乐的记号，他们不吝惜金钱开销和花费。实在，这是一个伟大的奥秘，其中包含着某种隐藏的智慧。古先知摩西也昭示了这一点；如今保罗也为此呼喊，说：「这是论到基督和教会的。」况且，这样说不仅是论到丈夫，也是论到妻子，使他像爱自己的身体一样温暖她，如同基督爱教会；而妻子则要敬畏自己的丈夫。这不只是在谈论爱，——而是什么呢？——「愿她敬畏自己的丈夫」。妻子是次位的权柄；这意味着，她不应要求（与丈夫）平等，因为她是在元首之下；而他也不应高傲地视她为从属，因为她是他的身体，如果头轻忽身体，那么头自己也会消亡；她应当在顺服中献上爱。正如头与身体：身体将手、脚和所有其他肢体都奉献给头使用；而头则关照身体，将自己所有的理智都倾注于其上。没有比这样的婚姻更好的了。但是，他们会说，有敬畏的地方，怎会有爱呢？恰恰就在那里，爱才会存在。敬畏的，就是爱的：她爱着，也像对元首一样敬畏，并像一个肢体一样爱着，因为头也是全身的一个肢体。为此，他使她顺服，而把丈夫高举在她之上，为了要有和平。在平等之处，不可能有和平，无论是民治政府，还是所有人都在发号施令，都必须有一个领导。有形体的受造物总是如此；如果人是属灵的，那么就会有和平。曾有五千人，并且「没有人称自己的财物是自己的」，而是大家共享（使徒行传 4:32）。这就是智慧和敬畏上帝的记号。这样，（使徒）展示了爱的样式，但没有展示敬畏的样式。
  - type: paragraph
    initial:
      ru: '5.'
      cn: '5.'
    text:
      ru: 'Замечаешь ли, как он распространяется о любви, приводит в пример Христа, упоминает о собственной плоти, говорит:«Посему оставит человек отца своего и мать», а о страхе не распространяется? Почему это? Потому что хочет, чтобы преобладала любовь. Если будет она, то за нею последует все остальное; а если будет страх, то – не вполне. Кто любит свою жену, тот, хотя бы она была и не очень послушна, все перенесет; но если (супруги) не связаны силою любви, то единомыслие между ними – дело неудобное и трудное. Страх же совсем не производит такого действия. Потому (апостол) и останавливается преимущественно на том, что сильнее. И жена, хотя ей, по-видимому, наносится ущерб тем, что предписывается страх, ничего не теряет, потому что мужу предписывается то, что особенно важно – любовь. Но, скажут, что, если жена не будет бояться мужа? Ты люби, ты исполняй свой долг; пусть другие не исполняют того, что следует, – мы должны исполнять. Укажу пример:"повинуясь, – сказано, –друг другу в страхе»Христовом (Еф.5:21). Что же? Пусть иные не повинуются, – ты покоряйся закону Божьему. Так и здесь: хотя бы муж и не любил своей жены, она должна бояться его, чтобы не быть ей в долгу у него; равным образом и, наоборот, если бы жена и не боялась мужа, он должен любить ее, чтобы ему не быть в долгу у нее. Каждый имеет свои обязанности. Таков брак во Христе, брак духовный и рождение духовное, не от кровей, не от болезней рождения. Таково и рождение Исаака. Послушай, что говорит Писание:«и обыкновенное у женщин у Сарры прекратилось»(Быт. 18:11). И брак не вследствие страсти или телесного влечения, но всецело духовный, в котором душа соединяется с Богом неизреченным союзом, как Он один знает. Потому и сказано:«соединяющийся с Господом есть один дух с Господом»(1Кор. 6:17). Видишь, с каким тщанием он говорит и о плотском соединении, и о единении духовном? Где (после того) еретики? Если бы брак был делом нечистым, то он не назвал бы (брачующихся) женихом и невестой, не привел бы для увещания слов:«оставит человек отца своего и мать», и не присовокупил бы, что это сказано«по отношению к Христу и к Церкви». О ней говорит и Псалмопевец:«Слыши, дщерь, и смотри, и приклони ухо твое, и забудь народ твой и дом отца твоего. И возжелает Царь красоты твоей»(Пс. 44:11–12). Потому и Христос говорил:«Я исшел от Отца и пришел в мир»(Иоан. 16:28). Но когда я говорю, что Он оставил Отца, ты не представляй при этом, по-человечески, перемены места: говорится, что Он исшел, не потому, что Он вышел, но потому, что воплотился: так точно (понимай) и слова: оставил Отца. Отчего не сказано и о жене: прилепится к мужу своему? Почему это? Потому, что о любви уже было говорено, и говорено мужу. Жене же (апостол) внушает страх и при этом говорит:«муж есть глава жены», и еще:«и Христос глава Церкви».С мужем он рассуждает о любви и вручает ему то, что (имеет отношение) к ней; говорит ему о любви, соединяя и сочетая его (с женой). В самом деле, оставивший отца для жены и потом оставляющий ее и отпускающий от себя может ли быть достоин какого-нибудь снисхождения? Видишь, какой, по воле Божьей, она должна пользоваться честью, когда Бог, отвлекая тебя от отца, соединяет с нею? Но что же, скажут, если мы исполняем все, что следует, а она нет?'
      cn: 你注意到吗，他如何详论爱，援引基督为例，谈到肉身，说：「因此人要离开父母」，而没有详论恐惧？这是为何？因为他希望爱能占主导。若有爱，则一切都将随之而来；而若有恐惧，则不完全。凡爱自己妻子的人，即使她不甚顺从，也会忍受一切；但如果（夫妻）没有被爱的力量束缚，那么他们之间的一致就是不便且困难的事。恐惧则完全不会产生这种作用。因此（使徒）着重强调了更强有力的那一点。妻子，尽管表面上因被规定要敬畏而蒙受损失，却一无所失，因为丈夫被规定了那格外重要的——爱。然而，有人会说，如果妻子不敬畏丈夫呢？你当去爱，你当履行你的本分；即使他人不履行应尽的，我们也必须履行。我举个例子：经上说：「当存敬畏基督的心，彼此顺服」（以弗所书 5:21）。那又如何呢？即使他人不顺服，你也要顺从上帝的律法。此处亦然：即使丈夫不爱他的妻子，她也应敬畏他，以免亏欠于他；同样地，反之亦然，即使妻子不敬畏丈夫，他也应爱她，以免亏欠于她。每个人都有自己的本分。这就是在基督里的婚姻，属灵的婚姻和属灵的生育，不由血气，不由生产之苦。以撒的出生亦是如此。听听圣经怎么说：「撒拉的月经已绝」（创世记 18:11）。婚姻不是因情欲或肉体吸引而起，而是全然属灵的，其中灵魂以祂独知之莫可言喻的结合与上帝联合。因此经上说：「与主联合的，便是与主成为一灵」（哥林多前书 6:17）。你看，他多么细致地谈论，论及肉身结合，也论及属灵结合？（如此之后）异端者何在？若婚姻是不洁之事，他就不会称（结合者）为新郎和新娘，也不会援引「人要离开父母」来劝诫，更不会补充说，这乃是论及「基督与教会」。诗篇作者也论及她：「我的女儿，你要听，要看，要侧耳而听；要忘记你的民族和你的父家。王就必羡慕你的美貌」（诗篇 44:11-12）。因此基督也曾说：「我从父出来，到了世界」（约翰福音 16:28）。但当我提及祂离开父时，你不要像世人那样想象是地方的变动：说祂出来，不是指祂离开了，而是指祂道成肉身了；同样（理解）「离开父」这几句话。为什么没有提及妻子「要与丈夫联合」呢？这是为何？因为爱已经被谈论过了，而且是向丈夫谈论的。至于妻子，（使徒）则教导她要敬畏，并同时说：「丈夫是妻子的头」，以及：「基督是教会的头」。他与丈夫论及爱，并将与爱相关之事交托给他；告诉他要爱，并以此联结和结合他（与妻子）。事实上，离弃父亲为了妻子，而后又遗弃她并打发她走的人，怎能配得任何宽恕呢？你看，照着上帝的旨意，当上帝引你离开父亲，与她结合时，她当受何等尊荣？然而，有人会问，如果我们履行了所有应尽的，而她没有呢？
  - type: paragraph
    text:
      ru: '«Если же неверующийхочетразвестись, пусть разводится»(1Кор. 7:15). В этих делах брат или сестра не подчинены рабству. А когда ты слышишь о страхе, то требуй страха, приличного свободной, а не как от рабы: ведь она – твое тело. А если будешь поступать не так, то опозоришь себя самого, бесчестя свое тело. Что же это за страх? Чтобы она не противоречила, чтобы не выходила у тебя из послушания, чтобы не стремилась к первенству. Довольно возбуждать только такого рода страх. Если же ты любишь, как тебе указано, то достигнешь гораздо большего, и достигнешь этого не столько угрозами, сколько собственно любовью. (Женский) пол весьма слаб; ему нужна большая помощь, особенное снисхождение. Что же скажут те, которые соединяются вторым браком? Не в осуждение говорю, – да не будет, – и апостол дозволяет это. Но снисходя к ее немощи, доставляй ей все, все ради нее делай и терпи: это необходимо тебе. В этом случае (апостол) не благоволит давать совета на основании внешних примеров, как это он часто делает. Достаточно было великого и сильного примера Христова, в особенности для доказательства (необходимости) повиновения."оставит, – говорит, –отца своего и мать». Вот, это указание внешнее. Однако ж не сказал: и будет жить вместе (с женой), но:«прилепится», означая этим теснейшее единение, сильнейшую любовь. Не удовольствовался и этим, но через наведение так изъяснил подчиненность (жены), что двое уже не представляются двумя. Не сказал: в дух; но сказал: в душу, – так как это очевидно и вполне возможно, – но (сказал, что они соединяются) так, что бывают«одна плоть».'
      cn: 「如果那不信的要离去，就由他离去吧」（哥林多前书 7:15）。在这些事上，弟兄或姊妹不受奴役的辖制。当你听到关于畏惧之事时，当要求那适宜于自由人的畏惧，而非如同对待婢女一般：因为她是你自己的身体。你若不如此行，就是自取羞辱，玷污你自己的身体。这畏惧究竟是何？是为使她不致顶撞，不致违背你的顺从，不致谋求居首。只激起此类畏惧就已足够。你若照所指示的去爱，就能成就更大的事，并且成就这事并非靠威吓，乃是靠着真正的爱。女性非常软弱；她需要更大的帮助，特别的宽容。那么，那些再婚的人会说什么呢？我说这话并非为了定罪，——绝不是如此，——使徒也允许这样做。然而，要体恤她的软弱，供给她一切，凡事为她做并忍受：这于你是必需的。在此情况下，（使徒）不乐于以世俗的例子来给出建议，如同他常做的那样。基督那伟大而有力的榜样已经足够了，特别是为了证明（顺从的）必要性。「要离开他的父亲和母亲，」祂说。看哪，这是一个外在的指示。然而，他并未说：并且要与（妻子）同住，而是说：「要联合」，以此表示最紧密的合一，最强烈的爱。他对此亦未满足，而是通过引导如此阐明了（妻子）的顺服，以致二人不再显为二人。他没有说：在灵里；而是说：在魂里，——因为这是显而易见且完全可能的，——但（他说他们结合）以致成为「一体」。
  - type: paragraph
    initial:
      ru: '6.'
      cn: '6.'
    text:
      ru: 'Хотя жене принадлежит также власть в доме, именно вторая, хотя она имеет начальство и равночестна мужу, – но при всем том, муж имеет нечто большее, именно – преимущественное попечение о доме. Соответственно со Христом, он получил и то, чтобы не только любить (свою жену), как должно, но и благоустроить (жизнь ее).«Дабы она была, – говорит, –свята и непорочна». Когда говорится –"плоть", разумеется любовь; равным образом, когда говорится –«прилепится», также разумеется любовь. Если ты сделаешь ее святой и непорочной, то за этим последует все. Ищи того, что Божье, а человеческое последует весьма легко. Управляй женой, и дом твой будет благоустроен. Послушай, что говорит Павел:«Если же они хотят чему научиться, пусть спрашиваюто томдома у мужей своих»(1Кор. 14:35). Если мы так будем управлять своими домами, то будем способны и к управлению церковью, потому что дом есть малаяцерковь. Таким образом, если хороши будут мужья и жены, то все будет превосходно. Вспомни об Аврааме, о Сарре, об Исааке, о трехстах восемнадцати домочадцах: как благоустроен был весь дом их, как он весь был полон благочестия! (Сарра) исполняла апостольскую заповедь и боялась мужа. Послушай, что она говорила:«мне ли, когда я состарилась, иметь сие утешение? и господин мой стар»(Быт. 18:12). И (Авраам) так любил ее, что слушал ее во всем, что она ни приказывала. И сын их был добродетелен, и самые домочадцы достойны удивления, так что не усомнились пойти и на опасность с господином своим, не колебались и не требовали объяснения. А один из них, начальствовавший над другими, был настолько дивный муж, что ему вверен был брак единородного сына и отлучка в чужую землю. Как, если военачальник хорошо устроил войско, то ни откуда не ворвется враг, так и здесь: когда муж, жена, дети и слуги заботятся об одном и том же, в таком доме бывает великое единомыслие. Если же, напротив, бывает не так, то часто от одного дурного слуги все низвращается и разоряется, часто один все губит и портит. Итак, будем прилагать особенное попечение о женах, детях и рабах, зная, что этим мы себе сделаем удобным начальство над ними, и снисходительный и благосклонный потребуется от нас отчет (в этом начальстве), – мы скажем:«Вот я и дети, которых дал мне Господь»(Ис. 8:18). Если муж хорош и глава добрая, то и во всем теле не будет никакого беспорядка.'
      cn: 尽管妻子在家里也拥有权柄，是次要的权柄，尽管她拥有权柄并与丈夫同等受敬重——但即便如此，丈夫仍拥有一些更重要的东西，即对家庭的首要关顾。与基督相称地，他所领受的，不仅是要按理（爱自己的妻子），更是要善加安排（她的生活）。他说：「好使她圣洁无瑕。」当提及「骨肉」时，意指爱；同样，当提及「联合」时，也意指爱。若你使她圣洁无瑕，则一切都会随之而来。寻求属上帝之事，属人之事则将轻而易举地随之而来。管理好妻子，你的家就会井井有条。听保罗所言：「她们若想学什么，就在家里问自己的丈夫吧。」(哥林多前书 14:35) 若我们如此管理自己的家庭，就也能胜任管理教会，因为家是小教会。因此，若丈夫和妻子都品行优良，则一切都将完美。回想亚伯拉罕、撒拉、以撒，以及那三百一十八位家仆：他们的全家何等井然有序，全家又何等充满虔敬！（撒拉）遵行了使徒的诫命，并敬畏她的丈夫。听她所言：「我既已年老，岂能有这福乐呢？我的主人也老了。」(创世记 18:12) 而（亚伯拉罕）如此爱她，以至于凡她所吩咐的，他都听从。他们的儿子品德高尚，甚至家仆也值得称颂，以至于他们毫不犹豫地与主人一同面对危险，不退缩也不要求解释。而他们中有一位管家，是如此卓越之人，以至于将独生子的婚事以及出使异地之事都托付于他。正如一位将领若能将军队安排妥当，敌人便无从入侵，同样在此：当丈夫、妻子、儿女和仆人都关切同一件事时，这样的家便有极大的同心合意。若情况相反，常常因一个恶仆，一切都被颠覆和破坏，常常一人败坏并毁损一切。因此，我们要特别关顾妻子、儿女和仆人，知道以此我们能使自己更好地管辖他们，并且对此（管辖），将要求我们提交一份宽容且仁慈的报告——我们将说：「看哪，我与上主所赐给我的儿女。」(以赛亚书 8:18) 若丈夫品行优良，又是好的首领，则在整个身体中也不会有任何紊乱。
  - type: paragraph
    text:
      ru: 'А каковы должны быть добрые отношения между женой и мужем, это (апостол) выразил точным образом, сделав увещание ей – бояться мужа, как главы, а ему – любить ее, как жену. Но каким образом, скажешь, это может быть? Что это должно быть, он показал; а как это может быть, я вам скажу. Именно, если будем презирать деньги, если будем смотреть только на одно – на душевную добродетель, если будем иметь пред очами страх Божий. Что сказал он, рассуждая о рабах:«чтобы каждому получитьсоответственно тому,что он делал, живя в теле, доброе или худое»от Господа (2Кор. 5:10), тоже и здесь. Не столько ради ее самой должно любить ее, сколько ради Христа. Имея это в виду, (апостол) и сказал: «Как и Господь». Итак, делай все из повиновения Господу, и как бы ты все делал ради Него. Этого достаточно для побуждения и убеждения, и для того, чтобы не допустить никакого соблазна или беспорядка. Ни один верный не должен клеветать жене на мужа; но и муж не должен верить наветам на свою жену, точно так, как и жена не должна по-пустому следить за входами и выходами (своего мужа). Впрочем, и муж отнюдь не должен подавать повод к какому-либо подозрению на себя. Для чего, скажи мне, весь день ты проводишь с друзьями, а с женой только вечер, и через это ни ее не можешь удовлетворить, ни отдалить подозрение? Если жена укоряет тебя, не печалься: это – по дружбе, а не по дерзости. Упреки – плод горячей любви, страстного расположения и опасения. Она боится, чтобы кто не похитил у нее ее ложе, чтобы кто не повредил ей в важнейшем благе, чтобы кто не отнял у нее главы, чтобы кто не разорил (брачного) ложа. Есть и еще повод к несогласию. Никто сверх меры не должен привязываться к слугам, ни муж к служанке, ни жена к служителю, так как этого достаточно, чтобы родились подозрения. Припомним еще о тех праведниках. Сама Сарра повелела патриарху взять Агарь; сама приказала, никто не принуждал; не настаивал и муж. Но хотя и много времени прожил он бездетным, однако лучше согласился вовсе не быть отцом, чем опечалить жену. И после всего этого, что говорит Сарра?«Господь пусть будет судьею между мною и между тобою»(Быт. 16:5). Если бы кто был другой (на месте Авраама), разве не пришел бы в гнев? Разве не поднял бы он рук и не сказал бы, например, так: что ты говоришь? Я не хотел иметь связи с этой женщиной, все произошло от тебя самой, – и ты еще упрекаешь меня? Но Авраам не сказал ничего подобного, – а что?«Вот, служанка твоя в твоих руках; делай с нею, что тебе угодно»(Быт. 16:6). Выдал общницу ложа, чтобы не опечалить Сары. А ничто не может быть столь сильной причиной расположенности. В самом деле, если общение в трапезе производит то, что разбойники бывают расположены к своим врагам, и Псалмопевец говорит: «который вместе со мною наслаждался пищею» (Пс. 54:15)[3], то тем более способно привязать единение плоти, – а это и есть общение ложа. Но ничто подобное не могло поколебать праведника: он выдал ее жене, показывая, что все случилось не по его вине, и, что особенно важно, отпустил ее беременной. Кто не сжалился бы над той, которая зачала от него ребенка? Но праведник не поколебался, потому что любовь к жене предпочитал всему.'
      cn: '至于夫妻之间应有何等美好的关系，使徒精确地阐明了：告诫妻子要敬畏丈夫，如同敬畏元首，而丈夫则要爱她，如同爱自己的妻子。然而，你会问，这如何可能呢？他已指明了这必须如此；至于这如何可能，我将告诉你们。


        倘若我们轻视金钱，倘若我们只关注一件事——灵魂的德行，倘若我们眼前常存对上帝的敬畏，这便可能了。他在论及仆役时所说的：「因为我们众人，必要在基督台前显露出来，叫各人按着本身所行的，或善或恶，受报」（哥林多后书 5:10），在这里亦是如此。不仅是为了她自己而爱她，更是为了基督。鉴于此，使徒说：「如同主一样。」所以，你当出于顺服上主而行一切事，并且仿佛你所做的一切都是为了祂。这足以成为激励和说服，也足以避免任何诱惑或混乱。


        任何一位信徒都不应向妻子诽谤丈夫；而丈夫也不应轻信针对妻子的诬告，正如妻子不应无谓地监视丈夫的进出。此外，丈夫也绝不应给人留下任何可疑之处。告诉我，你为何整日与朋友相处，而与妻子共度时光却仅限于夜晚，如此一来，既无法满足她，也无法消除疑虑？倘若妻子责备你，不要忧伤：这是出于情谊，而非放肆。责备是炽热爱意、深切情感和担忧的果实。她担心有人夺走她的床榻，担心有人损害她至关重要的福祉，担心有人夺走她的元首，担心有人毁坏（婚姻）床榻。


        还有另一个导致不和的原因。任何人都不应过度依恋仆役，无论是丈夫对女仆，还是妻子对男仆，因为这足以滋生猜疑。我们再回想那些义人。撒拉亲自吩咐先祖娶夏甲；是她自己命令的，没有人强迫；丈夫也没有坚持。但他虽然长久无子，宁愿完全不为人父，也不愿使妻子忧伤。而这一切之后，撒拉说了什么？「愿上主在你我之间判断」（创世记 16:5）。如果换作是别人（在亚伯拉罕的位置），难道不会大发雷霆吗？难道他不会举起双手，例如这样说：你究竟在说什么？我并不想与这个女人发生关系，一切都是由你而起——而你竟然还责备我？然而亚伯拉罕却未曾说任何类似的话——他说了什么呢？「看哪，你的使女在你手中，你可以随意待她」（创世记 16:6）。他交出了同床者，以免使撒拉忧伤。而没有什么能比这成为如此强烈的情感原因了。实际上，如果共享餐桌能让强盗对他们的敌人产生好感，并且诗篇作者说：「他与我一同享用美食」（诗篇 54:15）[3]，那么，肉体的结合——也就是同床共寝——就更能牢固地联系两人了。然而，任何此类事物都未能动摇这位义人：他把她交给了妻子，表明一切并非他的过错，而且，最重要的是，他放走了怀有他骨肉的她。谁会不对一个怀有自己孩子的人心生怜悯呢？然而，这位义人并未动摇，因为他将对妻子的爱置于一切之上。'
  - type: paragraph
    initial:
      ru: '7.'
      cn: '7.'
    text:
      ru: 'Будем и мы подражать ему. Пусть никто не упрекает ближнего в бедности, пусть никто не будет привязан к деньгам, и – все будет решено. Пусть не говорит жена мужу: о, ты малодушный и робкий, неповоротливый, трус и сонливый! Вот такой-то и незначительный человек, низкого происхождения, но он презирал опасности, предпринимал странствования, и за то приобрел большое имение, теперь жена его ходит в золоте, выезжает в повозке, запряженной белыми мулами, везде принимается, имеет толпы слуг и множество евнухов; а ты прячешься от страха и живешь понапрасну. Пусть жена не говорит этого и ничего подобного, потому что она – тело, долг ее не управлять главой, но слушаться и повиноваться. Но как можно, скажут, перенести бедность? Откуда почерпнуть утешение? Пусть в таком случае она представит себе тех, которые гораздо беднее ее; пусть вспомнит, сколько почтенных и благородных девиц не только ничего не получили от своих мужей, но передали им и израсходовали на них все свое имущество; пусть подумает о беспокойствах, происходящих от таких богатств, и довольствуется жизнью безмятежной. Вообще, если она искренно расположена к мужу, то ничего такого не скажет, и лучше будет желать иметь его при себе, хотя бы он ничего не приобретал, чем, если бы он приобрел тысячи талантов золота, но жить вдали от него с печалью и заботой, которые всегда бывают у женщин вследствие долгой разлуки. Но и муж, который слышит это, как имеющий власть, пусть не прибегает к брани и ударам, но пусть увещевает, уговаривает, убеждает ее, как менее основательную в суждениях, но отнюдь не налагает рук, – это неприлично душе свободной, – не употребляет ни брани, ни упреков, ни поношения, но пусть руководит ею, как менее разумной. Но как это может быть? Когда узнает истинное богатство и ознакомится с высшим любомудрием, то ни в чем таком не провинится. Пусть он научит ее, что бедность вовсе не есть зло; пусть научит не словами только, но и образом действий; пусть научит ее пренебрегать славой, – и жена ничего подобного не скажет и не пожелает. Как получивший драгоценное сокровище, он с самого того вечера, как введет ее в спальню, должен учить ее целомудрию, кротости, чтобы она жила честно и с самого начала и при первом входе в его дом покинула любовь к деньгам; пусть наставляет ее в любомудрии и увещевает, чтобы не было у нее золотых подвесок в ушах, над щеками и на шее, чтобы не было их в ее комнате, чтобы не лежали там золотые и многоценные одежды, – чтобы были на ней украшения изящные, однако ж, не такие, которых изящество предосудительно. Оставивши то, что свойственно играющим на сцене, укрась дом с большим благоприличием, чтобы он был полон лучше целомудрия, чем какого-либо благовония. От этого произойдут два или три блага. Первое – не будет печалиться невеста оттого, что, растворивши брачный чертог, каждому станут показывать одежды, и золотые и серебряные сосуды. Второе – жених не будет беспокоиться о покраже и о сохранении того, что там собрано. А еще третье, главное благо – то, что во всем этом он покажет свое настроение, именно, что он не восхищается ничем этим, что он уничтожит и все прочее, и что никогда не дозволит быть у себя пляскам и бесстыдным песням. Знаю, что, предписывая такие правила, я кажусь, может быть, кому-нибудь смешным. Но если поверите мне, то, по прошествии времени, когда сами увидите от этого пользу, вы поймете выгоду, и смех кончится; вы станете смеяться уже над нынешними обычаями, увидите, что нынешние обычаи свойственны только неразумным детям и людям пьяным; а то, к чему убеждаю я, исполнено целомудрия и любомудрия и свойственно высшему образу жизни.'
      cn: '愿我们也效法他。愿无人因贫穷而指责邻人，愿无人依恋金钱，如此，一切都会得到解决。愿妻子不要对丈夫说：噢，你这怯懦胆怯的、迟钝的、懦夫兼昏沉的家伙！某某人，一个出身卑微的微不足道之人，他却蔑视危险，四处闯荡，因此获得了巨大的财产；如今他的妻子身穿金饰，乘坐由白骡拉的马车出行，到处受到欢迎，拥有成群的仆人和众多宦官；而你却因恐惧而躲藏，白白虚度一生。愿妻子不要说这样的话或任何类似的话，因为她是身体，她的职责不是治理头部，而是顺从和服从。但有人会说，如何才能忍受贫困呢？从何处获得安慰呢？在这种情况下，愿她设想那些比她贫困得多的人；愿她回想有多少尊贵和高贵的女子，不仅未从丈夫那里得到任何东西，反而将自己所有的财产都交给丈夫并为他们耗尽；愿她思考因这些财富而产生的烦恼，并满足于平静无忧的生活。总体而言，如果她真心爱慕丈夫，就不会说那样的话，她宁愿他寸缕未获，也愿他陪伴在自己身边，胜过他获得千百他连得的金子，却与他远隔两地，伴随着因长期分离而常有的悲伤与忧虑生活。


        然而，丈夫听到此言，作为拥有权柄者，愿他不要诉诸咒骂和殴打，但愿他劝诫、说服、开导她，视她为判断力较弱者，但绝不动手——这与自由的灵魂不相称——不使用咒骂、指责或谩骂，但愿他引导她，视她为不那么理智者。但这如何能实现呢？当他认识到真正的财富，并熟悉更高的爱智时，就不会犯任何此类错误。愿他教导她，贫困绝非恶事；愿他不只言传，更要身教；愿他教导她轻视虚荣——如此，妻子就不会说出或渴望任何类似的话。犹如获得珍宝之人，他从将她引入卧室的那个夜晚起，就必须教导她贞洁、温柔，使她生活正直，从一开始，在她初次进入他家时就放弃对金钱的爱慕；愿他教导她爱智并劝诫她，耳朵、脸颊上方和脖子上不要佩戴金质吊坠，她的房间里不要有这些，也不要摆放金子和贵重的衣服——她佩戴的饰品要雅致，但其雅致不应是招致非议的。抛弃那些戏台上人物特有的东西，以更大的得体来装饰家园，让家中充满贞洁而非任何香气。由此将产生两到三项益处。其一，新娘不会因人们打开婚房，向众人展示衣物、金银器皿而悲伤。其二，新郎不会担忧盗窃以及对所聚之物的保管。还有一个第三项，也是主要的益处——那就是，在这一切中，他将展现自己的心境，即他对这一切都不感到欣喜，他将摒弃所有其他，并且绝不允许在家中有舞蹈和无耻的歌曲。


        我知道，在规定这些规则时，我或许在某些人看来是可笑的。但若你们相信我，那么随着时间的推移，当你们亲自看到其益处时，你们就会明白其好处，届时笑声将止息；你们将开始嘲笑现今的习俗，将看到现今的习俗只属于不理智的孩童和醉酒之人；而我所劝导的，则充满贞洁和爱智，并属于更高的生活方式。'
  - type: paragraph
    text:
      ru: 'Что же, говорю я, нужно? Изгони с брака все постыдные сатанинские песни, неблагопристойные припевы, сходбища бесстыдных юношей, – и это будет весьма назидательно для невесты. Тотчас она скажет сама себе: о, какой это муж! Он человек любомудрый; эту жизнь он считает за ничто; он ввел меня в дом свой для рождения и воспитания детей, для ухода за домом. Но это будет неприятно невесте? Может быть, один или два дня, но никак не далее; она почувствует величайшее удовольствие оттого, что ей не будет никакого повода к подозрению. Ведь тот, кто даже во время брака не допустил ни музыки, ни танцев, ни безобразных песен, тем более в другое время не позволит себе сделать или сказать что-либо постыдное, после же того, когда все это ты удалишь с брака, в отношении к самой невесте веди себя благопристойно, будь скромен в течение долгого времени и не скоро переставай быть таким. Хотя бы девица была и не так застенчива, но она сумеет себя сдерживать до времени, из уважения к мужу и по новости дела. Итак, не вскоре теряй эту скромность, как это делают люди бесстыдные, но храни ее долго. Это тебе принесет большую пользу; да и невеста твоя не обвинит тебя за это, не станет жаловаться на такое твое поведение.'
      cn: 那么，我说，需要什么呢？从婚姻中驱逐一切可耻的撒旦的歌曲、不雅的合唱、无耻青年们的聚会——这对于新娘将是极具教益的。她会立刻对自己说：哦，这是何等样的丈夫啊！他是一个爱慕智慧的人；他视此生为虚无；他引我入他家，为的是生育和抚养子女，以及照料家务。但这会令新娘不悦吗？或许一两天，但绝不会更久；她会感受到极大的喜悦，因为她不会有任何受猜疑的理由。因为那甚至在婚礼期间都不允许音乐、舞蹈或丑陋歌曲的人，更何况在其他时候，他也不会允许自己做或说出任何可耻之事。在你将这一切从婚姻中移除之后，对待新娘本人，你要行为端庄，长时间保持谦逊，不要很快就停止如此。即使新娘并非那么羞涩，她也会暂时克制自己，出于对丈夫的尊重，以及由于事情的新鲜感。所以，不要像那些无耻之人一样，很快就失去这份谦逊，而要长久地保持它。这会给你带来极大的益处；而且你的新娘也不会因此而指责你，不会抱怨你这样的行为。
  - type: paragraph
    initial:
      ru: '8.'
      cn: '8.'
    text:
      ru: 'Итак, во все то время, пока стыд, как некая узда, наложенная на душу, не допускает никакого укора или упрека за твое поведение, – во все это время предлагай своей жене правила жизни. Если же (вместо этого стыда) будет дерзость, тогда не будет никакого опасения, и во всем может произойти беспорядок и замешательство. Поистине нет столь удобного времени для образования жены как то, когда она еще осторожна с мужем, боится его и стыдится. Тогда-то и должно излагать ей все правила, и она, волей или неволей, всему будет покорна. Но каким образом, спросят, сохранить эту стыдливость? Если ты будешь казаться стыдливым не менее ее, мало будешь  говорить с ней, и то с большой важностью и рассудительностью. Тогда ты предлагай ей слова любомудрия, потому что тогда их принимает душа; тогда приводи и ее в наилучшее состояние, т.е. в состояние скромности. Если хотите, то я для примера скажу, о чем нужно с ней разговаривать. Ведь если Павел не усомнился сказать:«Не уклоняйтесь друг от друга»(1Кор. 7:5), и высказал слова, произносимые обыкновенно женщиной, приставленной к невесте, или лучше, не ее слова, но духовной души, – то тем более не усомнимся сказать мы. Итак, что же нужно говорить ей? С великой любовью нужно говорить ей: мы взяли тебя, детушка, в спутницы жизни и сделали тебя своей общницей в том, что всего честнее и необходимее, в деторождении и управлении домом. О чем же нам просить тебя? Впрочем, лучше, если прежде этого ты поговоришь с ней о любви, потому что ничто так не способствует к убеждению слушателя в том, чтобы он принял слова наши, как уверенность его, что они говорятся с великой любовью. Как же тебе выразить свою любовь? Если скажешь: многих можно было мне взять, и богаче тебя, и знатного рода, но я не взял их, а полюбил тебя, твой образ жизни, твою кротость, скромность, целомудрие. Потом от этого тотчас старайся повести речь о любомудрии и нападай на богатство, но с некоторой осторожностью, потому что, если поведешь речь прямо против богатства, то покажешься слишком суровым. Но если воспользуешься поводом, то покончишь все, потому что будет казаться, что ты делаешь это в виде защиты, а не как какой-нибудь человек жестокий, неприятный и придирчивый; а если она подаст тебе повод, и ты им воспользуешься, то она даже порадуется. Итак, говори (необходимо опять повторить сказанное), что, хотя бы я мог взять за себя с состоянием и богатую, но я не захотел этого. Почему? Не просто и не без рассуждения, но потому, что я хорошо научен, что богатство не есть какое-либо приобретение, но вещь достойная презрения, которая есть и у разбойников, и у блудниц, и у гробокопателей.'
      cn: '所以，当羞耻如同勒在灵魂上的缰绳，不容许任何人对你的行为有丝毫指责或责备时，在这整个期间，你要向你的妻子阐明生活的法则。但若（取代羞耻的）是放肆，那就不会有任何顾忌，一切都会变得混乱和困惑。确实，没有比妻子对丈夫仍旧谨慎、敬畏他并感到羞耻的时候，更适宜教导她的了。那时就当向她阐述一切法则，她无论情愿与否，都会顺服一切。但是，有人会问，如何才能保持这种羞怯呢？如果你显得不比她少羞怯，很少与她交谈，而且要非常庄重和审慎地与她交谈。那时你再向她阐明智慧（爱智）之言，因为那时她的灵魂才愿接受它们；那时你也要将她带入最佳状态，即谦逊的状态。


        如果你们愿意，我将举例说明该和她谈些什么。既然保罗不曾犹豫地说：「夫妻不可彼此亏负」（哥林多前书 7:5），并且说出了通常由陪伴新娘的妇女所说的话，或者更准确地说，不是她的言语，而是属灵的灵魂所说的话，那么我们更不应犹豫地去说。


        那么，我们该对她说什么呢？带着极大的爱，你必须对她说：「小宝贝，我们接纳你，成为我们生命的伴侣，并且让你在我们生命中最尊贵和最必要的事情上成为我们的伙伴：在生育后代和管理家庭上。我们又该向你要求什么呢？」然而，如果在此之前你先与她谈论爱情，那会更好，因为没有任何事比听者确信我们的话是出于极大的爱而言说，更能促使他接受我们的话。


        你又该如何表达你的爱呢？如果你说：「我本可以娶许多人，她们或比你富有，或出身显贵，但我没有娶她们，而是爱上了你，你的生活方式，你的温柔、谦逊和贞洁。」


        接着，立刻努力将话题转向智慧（爱智），并攻击财富，但要带点谨慎，因为如果你直接抨击财富，就会显得过于严厉。但如果你借机而为，就能把一切处理妥当，因为这样你似乎是在自我辩护，而非像某个残酷、令人不快和吹毛求疵的人；如果她给你一个机会，你又加以利用，她甚至会感到高兴。


        那么，你说（有必要再次重复）：「虽然我本可以娶一个有财有势的富女，但我没有这么做。为什么呢？并非无缘无故，也并非不经考虑，而是因为我深知，财富并非什么值得拥有的东西，而是一件可鄙之物，它在强盗、娼妓和盗墓者那里也都有。」'
  - type: paragraph
    text:
      ru: 'Поэтому, оставив его, я пошел к твоей душевной добродетели, которую предпочитаю всему золоту. Благоразумная и благородная молодая девушка, ревнующая при том о благочестии, (в моих глазах) стоит целой вселенной. Потому-то я и привязался к тебе и люблю, и считаю тебя дороже души моей. Настоящая жизнь ничего не значит, и я прошу, и умоляю, и всячески стараюсь сподобиться нам так устроить настоящую свою жизнь, чтобы можно было и там, в будущем веке, совершенно безбоязненно встретиться друг с другом. Настоящее время коротко и ненадежно; если же сподобимся перейти эту жизнь, благоугодив Богу, то будем пребывать вечно и с Христом и друг с другом в великой радости. Я всему предпочитаю твою любовь, и ничто не может быть для меня так тяжело, как когда-нибудь разлучиться с тобою. Хотя бы мне предстояло все потерять, сделаться беднее Ира, подвергнуться величайшим несчастиям, словом – потерпеть что бы то ни было, я ничего не устрашусь, все перенесу, пока будет продолжаться твоя расположенность ко мне; и дети для меня лишь тогда будут вожделенны, когда ты будешь искренно расположена к нам. Так тебе будет нужно сделать. Потом вставь и апостольские слова о том, какого тесного единения и благомыслия требует от нас Бог. Скажи ей: послушай, что говорит Писание:«Посему оставит человек отца своего и мать и прилепится к жене своей». Пусть же не будет у нас никакого повода к неудовольствию. Пусть и деньги, и множество слуг, и внешние почести имеют свое значение; но для меня это (семейное согласие) всего дороже. Не будут ли такие слова убедительнее для жены, чем изобилие золота или сокровищ? Не бойся, что возлюбленная твоя когда-нибудь изменит тебе; смело признайся, что ты ее любишь. Публичные женщины, которые сегодня выражают страсть к одним, а завтра к другим, справедливо восстают на своих любовников, когда слышат от них такие речи. Но свободная женщина и благородная девушка никогда не разгневается по поводу таких слов, а скорее – будет убеждена ими. Показывай, что ты дорого ценишь ее общество и предпочитаешь быть для нее дома, а не на площади; предпочитай также ее всем друзьям и детям, родившимся от нее: и их люби из-за нее. Если она сделает что-нибудь хорошо, хвали и удивляйся; если же – что-нибудь неуместное и свойственное молодости, убеждай и увещевай. Всячески нападай на богатство и расточительность; указывай ей украшение в скромности и честности, и постоянно учи тому, что нужно.'
      cn: '因此，我舍弃了他，转向你灵魂的美德，我珍视它胜过所有的黄金。一个明智高贵的年轻女子，若同时对虔敬充满热忱，在我看来，价值整个宇宙。正因此，我才依恋你、爱你，并视你贵于我的灵魂。今生毫无意义，我恳求、哀求并尽一切努力，使我们能如此安排今生的生命，以便在来世，能够毫无惧怕地彼此相遇。现世短暂且不可靠；若我们蒙恩，得以度过此生并蒙上帝喜悦，就将永远与基督同在，且与彼此同在，在极大的喜乐中。我将你的爱置于万物之上，没有任何事能比有朝一日与你分离更让我难以承受。即使我将失去一切，变得比约伯更贫困，遭受最大的不幸，总之——忍受任何苦难，我将无所畏惧，承受一切，只要你对我情意不变；孩子们也唯有在那时才成为我所渴望的，即当你真心倾心于我们之时。你就当如此行。


        随后引用使徒的话语，关于上帝要求我们拥有何等紧密的合一与和睦的心思。你对她说：「听听圣经怎么说：「因此，人要离开父母，与妻子结合。」」（以弗所书 5:31）愿我们之间没有任何不悦的缘由。钱财、众多的仆人以及外在的尊荣，都有其意义；但对我而言，这（家庭的和睦）最为宝贵。难道这样的话语，对妻子而言不比丰厚的黄金或财宝更具说服力吗？不要害怕你的挚爱有朝一日会背叛你；勇敢地承认你爱她。那些今天对这人表达情欲，明天对那人表达情欲的妓女，当她们从爱人那里听到此类言语时，理所当然地反抗她们的爱人。但自由的女子和高贵的姑娘绝不会因这类言语而发怒，反而会被其说服。


        你要表明你珍视她的陪伴，并且情愿为她待在家里，而非在广场上；也要将她置于所有朋友之上，以及所有她为你所生的孩子之上：并因为她而爱他们。如果她做得好，就赞美并欣赏她；如果她做了什么不合宜的、属于年轻人的事，就规劝和劝诫她。要竭力抨击财富和挥霍无度；引导她在谦逊和诚实中寻求美饰，并不断教导她所需之事。'
