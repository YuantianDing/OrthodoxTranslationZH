      cn: '2.'
    text:
      ru: 'Тысячи зол рождаются отсюда. Как камни до тех пор, пока они сплочены и не имеют пустоты, трудно раскалываются, а как скоро окажется в них скважина, хотя бы такая малая, как острие иглы, или сделается трещина, в которую можно лишь продеть один волос, распадаются и разрушаются, – так и при (нападениях) дьявола. Пока мы будем тесно соединены и сближены между собой, до тех пор он не сможет ввести (в среду нас) ни одного из своих (злых наветов). Но когда хотя немного он разделит нас, тогда вторгается подобно бурному потоку. Везде ему нужно только начало, – это для него самое трудное; когда же начало сделано, тогда он уже сам собой все подвигает вперед. Так, лишь только он открыл (твой) слух для клевет, и лжецы уже приобретают (твое) доверие, потому что (враждующие) руководствуются своей ненавистью, (все) осуждающей, а не истиной, право судящей. Как при дружбе даже справедливым нехорошим слухам не хочется верить, так при вражде напротив и ложные слухи принимаются за истину. Другой тогда бывает у нас ум, другое судилище, выслушивающее не со спокойствием, но с большим пристрастием и предубеждением. Как положенный на весы свинец все перетягивает, так и тягчайшая свинца тяжесть вражды.  Потому, прошу вас, будем всячески стараться о том, чтобы нам до захождения солнца погашать свою вражду. Когда ты не обуздаешь своей вражды в первый и в следующий день, то часто продолжишь ее и на целый год, и, наконец, она сама собою усилится до того, что уже не будет нуждаться ни в чьем (возбуждении). Она заставляет и слова, которые говорятся в одном смысле, принимать в другом, заставляет заподозривать движения и все, что ни есть, перетолковывать в худую сторону, и тем ожесточает и раздражает (человека), делая его хуже бесноватых, так что он не хочет ни называть, ни слышать имени того, против кого враждует, но произносить (против него) всякие бранные слова. Как же мы смягчим свой гнев? Как погасим этот пламень? Если помыслим о своих собственных грехах и о том, насколько мы виновны пред Богом; если помыслим, что мы мстим не врагу, но самим себе; если помыслим, что (враждой) мы доставляем радость дьяволу, этому врагу, истинному врагу нашему, ради которого мы наносим обиду своему собрату. Ты желаешь злопамятствовать, враждовать? Будь врагом, но против дьявола, а не против своего собрата. Для того и дал нам Бог в оружие гнев, чтобы мы не собственные тела поражали мечем, но чтобы вонзали все его острие в грудь дьявола. А это произойдет тогда, когда мы будем щадить друг друга, когда будем миролюбиво расположены друг к другу. Пусть я лишусь денег, пусть я погублю свою славу и честь: мой член всего для меня дороже. Так будем говорить друг другу; не будем оскорблять своей природы для приобретения денег, для снискания славы.'
      cn: '千般祸患皆由此生。如同磐石，只要它们紧密无缝，便难以劈裂；可一旦其中显露哪怕小如针尖的孔隙，或仅容一发穿过的裂缝，它们便会崩裂毁坏——魔鬼的攻击亦是如此。只要我们彼此紧密相连，亲近无间，它就无法在我们中间植入任何它的恶毒计谋。但一旦它稍稍将我们分开，便会如洪流般汹涌而入。它所求的无非只是一个开端——这是它最难之处；而一旦有了开端，它便会自行推动一切向前。因此，它刚一使（你）耳闻诽谤，那些说谎者便已赢得（你）的信任，因为（心怀敌意之人）乃是受其仇恨所主导，（其仇恨）审判一切，而非受真理公正判断。如同在友谊之中，连真实的不利传闻也不愿相信；而在仇恨之中，虚假的传闻反而被当作真理。彼时，我们的心智迥异，判断也别有他途，不是以平静，而是以极大的偏爱与偏见来听取一切。如同放在天平上的铅块总能压倒一切，仇恨之重，比铅尤甚。


        所以，我恳请你们，务必尽一切努力，在日落之前平息我们的敌意。若你在第一天和第二天未能遏制你的敌意，它便常常会延续一整年，最终，它将自行加剧，乃至不再需要任何人的（煽动）。它使人把本意如此的话语，理解成另一种意思，使人怀疑举动，并把所有一切都曲解为不好的方面，从而使（人）变得铁石心肠，暴躁易怒，甚至比被鬼附之人更甚，以致他既不愿称呼，也不愿听闻所仇视之人的名字，反而口出各种恶言秽语（攻击他）。我们当如何平息自己的怒气？又如何扑灭这火焰？若我们思念自身的罪过，并思考我们在上帝面前何等有罪；若我们思念我们所报复的不是仇敌，而是我们自己；若我们思念（通过敌意），我们取悦了魔鬼，这个敌人，我们真正的仇敌，为了它，我们竟伤害了自己的弟兄。你渴望怀恨在心，心存敌意吗？那么，去与魔鬼为敌，而非与你的弟兄为敌。上帝将愤怒赐予我们作为武器，并非要我们用剑伤害自己的身体，而是要我们将剑尖尽数刺入魔鬼的胸膛。而这唯有当我们彼此宽容，彼此和睦相处时方能实现。纵使我失去金钱，纵使我名誉扫地，尊严尽失：我的肢体对我而言，重于一切。我们要如此彼此劝勉；不要为了金钱，为了求取名声，而亵渎我们的本性。'
  - type: paragraph
    text:
      ru: '"Кто крал, – говорит, –вперед не кради»(Еф.4:28). Видишь, какие члены у ветхого человека? Ложь, памятозлобие, воровство. Почему он не сказал: крадый да будет наказан, да подвергнется пытке и истязанию, но – да не крадет?«А лучше трудись, делая своими руками полезное, чтобы было из чего уделять нуждающемуся»(Еф.4:28). Где те, которые называют себя чистыми, которые, будучи исполнены всякой нечистоты, дерзают называть себя так? Ведь для того, чтобы снять с себя обвинение, нужно не отстать только от греха, но и сделать что-либо доброе. Смотри, как должно заглаживать грехи: они крали, – это значит совершить грех; не крали, – это не значит загладить грех; но как (могли бы это сделать)? Если бы они трудились и помогали другим, то этим они загладили бы грех. Апостол хочет, чтобы мы не просто делали, но чтобы трудились, чтобы отдавали другим. И тот, кто крадет, также делает, но делает зло.«Никакое гнилое слово да не исходит из уст ваших»(Еф.4:29). Какое это слово –"гнилое"? То, которое в другом месте он называет словом праздным, злословием, срамословием, суесловием, буесловием. Видишь ли, как он посекает самые корни гнева – ложь, воровство, необдуманные речи? Слова:«вперед не кради»он сказал не столько для того, чтобы оказать снисхождение тем (кравшим), сколько для того, чтобы потерпевшим от этого внушить кротость и убедить их удовольствоваться тем, что они уже больше не подвергнутся этому. Кстати, учит он и относительно слов, потому что не только за дела, но и за слова мы дадим ответ."А только, – говорит, –доброе для назидания в вере, дабы оно доставляло благодать слушающим»(Еф.4:29). Т. е., говори только то, что назидает ближнего, и ничего излишнего.'
      cn: '「谁偷窃，——他说，——以后不可再偷窃了」（以弗所书 4:28）。可见，旧人有怎样的肢体？谎言、怀恨、偷窃。他为何不说：偷窃的当受惩罚，当遭受拷问和折磨，却说——不可再偷窃了呢？「倒要勤劳，亲手作正经事，好有所施舍给那有缺乏的人」（以弗所书 4:28）。那些自称洁净的人在哪里呢？他们明明充满了各样不洁，却还敢如此自称。因为要洗脱自己的罪名，不仅要离弃罪恶，还要行出善事。看哪，当如何弥补罪过：他们偷窃了，——这意味着犯了罪；他们不再偷窃了，——这并不意味着弥补了罪过；那么如何（才能弥补呢）？如果他们辛勤劳作并帮助他人，那么他们就以此弥补了罪过。使徒希望我们不只是行动，更是要劳作，要施予他人。那偷窃的，也做了事，但做的是恶事。


        「污秽的言语，一句不可出口」（以弗所书 4:29）。何为「污秽的」言语？就是他在别处所称的闲话、恶语、淫词、妄言、狂言。你可看见，他是如何砍断愤怒的根源——谎言、偷窃、轻率的言语？「以后不可再偷窃了」这些话，他并非旨在对那些（偷窃者）施予宽容，而是为了向那些受害者灌输温柔，并说服他们满足于此，即他们将不再遭受此害。顺带一提，他也在言语方面教导我们，因为我们不仅要为行为，也要为言语交账。「总要说造就人的好话，叫听见的人得益处」（以弗所书 4:29）。亦即，只说那些能造就近人的话，不要说任何多余的话。'
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Бог дал тебе уста и язык для того, чтобы ты благодарил Его и назидал ближнего. Если же ты разрушаешь здание, то лучше молчать и ничего не говорить. И руки художника, назначенные для построения стен, но вместо того навыкшие разрушать их, справедливо было бы отсечь. Так и Псалмопевец говорит:«Истребит Господь все уста льстивые»(Пс. 11:4). Язык – причина всех зол, или лучше, не язык, а те, которые худо им пользуются. Отсюда – обиды, злословия, хулы, страсть к удовольствиям, убийства, любодеяние, воровство, все рождается отсюда. Каким же образом, говорят, отсюда – убийства? От оскорбительного слова ты придешь в гнев, разгневанный начнешь драться, от драки недалеко до убийства. Каким образом – любодеяние? Тебе скажут, что такая-то особенно расположена к тебе, она отзывается о тебе с отличной стороны; эти слова поколеблют твою твердость, а затем в тебе возникнут и нечистые пожелания. Потому-то и сказал Павел:«только доброе». Так как слов великое множество, то он справедливо выразился неопределенно, повелевая касательно их употребления, и давая правило, как вести речь. Какое же правило?«Дабы оно доставляло благодать»,– сказал он. Иначе сказать: (говори так), чтобы слушающий тебя был благодарен тебе. Например, твой брат соблудил: не поноси его обидными словами, не насмехайся над ним. Ты не доставишь этим ни мало пользы слушающему, но решительно повредишь ему, если будешь язвить его (своими словами). Если же ты будешь увещевать его, как он должен поступать, то этим заслужишь от него великую благодарность. Если ты научишь его иметь доброречивые уста, научишь не злословить, то этим ты многому его обучишь и заслужишь его благодарность. Если будешь говорить с ним о раскаянии, о стыдливости, о милостыне, все это будет смягчать его душу. За все это он выскажет тебе свою благодарность. Если же ты возбудишь смех, произнесешь непристойное слово, а тем более, если похвалишь порок, то ты все расстроишь и погубишь. Так можно понимать слова (апостола). Или же слова эти значат: чтобы их (слушающих) сделать облагодатствованными. Ведь подобно тому, как миро подает благодать помазующимся им, так и доброе слово. Потому и сказал некто:«имя твое – как разлитое миро»(Песн. 1:2). Оно (доброе слово) наполняет (слушающих) своим благовонием. Видишь ли: о чем внушает он везде, о том говорит и теперь, когда повелевает каждому назидать ближнего по мере своих сил? Итак, увещевая других поступать таким образом, тем более (располагай к этому) себя самого.«И не оскорбляйте, – говорит, –Святаго Духа»(Еф.4:30).'
      cn: 上帝赐你口舌，是为使你感谢祂，并造就你的邻舍。若你拆毁建筑，那倒不如沉默，一言不发。画师的双手，本被指定用来建造墙垣，若反而惯于拆毁它们，那理应被砍掉。圣咏作者也说：「上主必剪除一切谄媚的口舌」（诗篇 11:4）。舌头是万恶之源，或者说，与其说是舌头，不如说是那些滥用它的人。由此而生的是侮辱、诽谤、亵渎、贪恋享乐、凶杀、奸淫、偷窃；一切都由此而生。人们会问：凶杀又是如何由此而来的呢？从一句侮辱之言，你会心生怒气，怒不可遏，便会开始争斗，从争斗到凶杀便不远了。奸淫又是如何呢？他们会告诉你，某某人对你特别青睐，她对你赞不绝口；这些话会动摇你的坚定，接着你心中便会生出不洁的欲望。正因如此，保罗才说：「唯独良善的」。由于言语种类繁多，他便公正地以不确定的方式表达，命令如何使用它们，并给出言谈的准则。那么，准则是什么呢？「好叫它施恩于人」，他说。换言之：(说话时)当使听你说话的人感谢你。例如，你的弟兄犯了奸淫：不要用侮辱之言辱骂他，不要嘲笑他。你丝毫不会给听者带来益处，反而会明确地伤害他，若你用言语刺伤他。若你劝诫他当如何行事，你便会由此赢得他极大的感谢。若你教导他口出善言，教导他不诽谤，那么你便由此教导了他许多，并赢得他的感谢。若你与他谈论悔改、谈论羞耻、谈论施舍，这一切都会使他的灵魂柔和。为这一切，他都会向你表达他的感谢。若你引人发笑，说出不雅之语，更甚者，若你赞美罪恶，那么你便会搅乱并毁坏一切。使徒的这些话便可如此理解。或者这些话的意思是：使他们（听者）蒙受恩典。须知，正如圣膏油赐予受膏者恩典，善言亦然。因此有人说：「你的名如同倾倒的香膏」（雅歌 1:2）。它（善言）以其芬芳充满（听者）。你看，他处处教导什么，如今也谈论什么，就是当他命令每个人尽其所能地造就邻舍时。所以，劝诫他人如此行事时，更当以此勉励自己。「并且不要使圣灵担忧」，他说（以弗所书 4:30）。
  - type: paragraph
    text:
      ru: 'Это – слова, приводящие в страх и ужас, которые (апостол) повторяет и в послании к Фессалоникийцам. И там он выразил нечто подобное, сказав:«Итак, непокорный непокорен не человеку, но Богу»(1Фес. 4:8). Так и здесь: если ты скажешь оскорбительное слово, если огорчишь брата, то огорчишь не его, а оскорбишь Духа Святого. При этом (апостол) указывает еще и на благодеяние (полученное от Святого Духа), чтобы тем сильнее было обвинение:«И не оскорбляйте, – говорит, –Святаго Духа Божия, Которым вы запечатлены в день искупления»(Еф.4:30). Он (Святой Дух) сделал нас пажитью царевою, освободил нас от всех прежних (зол), не оставил нас в числе тех, которые подлежат гневу Божьему, и – ты оскорбляешь Его? Смотри, какой там (внушается) страх:«Итак, непокорный, – говорит, –непокорен не человеку, но Богу», а здесь – он пристыжает словами:«И не оскорбляйте Святаго Духа Божия, Которым вы запечатлены». Пусть эти слова, как печать, лежат на твоих устах; не уничтожай этих знаков. Уста, запечатленные Духом, ничего такого (непристойного) не изрекают. Не говори: не важно, если я произнесу дурное слово, если оскорблю того или другого. Потому-то это и великое зло, что ты почитаешь его ничтожным. Зло, которое почитают ничтожным, легко оставляют в пренебрежении, а оставленное в пренебрежении оно усиливается, усилившись же, становится неизлечимым. У тебя уста запечатлены Духом? Вспомни, какое слово произнес ты сейчас, по своем рождении, вспомни о достоинстве твоих уст. Ты называешь Бога своим Отцом и в то же время поносишь своего брата? Помысли о том, почему ты называешь Бога своим Отцом. (Потому ли, что Он Отец) по природе? Но поэтому ты не мог бы (называть Его так). За добродетель? Нет, и не за то. Почему же? По одному человеколюбию (Божьему), по Его благосердию, по Его великой милости. Итак, когда ты называешь Бога Отцом, то имей в мысли не только то, что, оскорбляя (своего брата), ты поступаешь недостойно этого благородства, но и то, что ты имеешь это благородство по благости (Божьей). Не срами же своего благородства, – которое сам ты получил по милости, – жестоким обращением со своими братьями. Называешь Бога своим Отцом, и оскорбляешь (своего ближнего)? Это не свойственно сыну Божьему! Дело сына Божьего – прощать врагам, молиться за своих распинателей, проливать кровь за ненавидящих его. Вот что достойно сына Божьего: своих врагов, неблагодарных, воров, бесстыдных, коварных – сделать своими братьями и наследниками, а не то, чтобы своих братьев оскорблять, точно каких невольников.'
      cn: 这些话语令人恐惧和战栗，（使徒）在致帖撒罗尼迦人的书信中也重复了它们。在那里，他表达了类似的意思，说：「所以，不顺从的人，所不顺从的不是人，而是上帝」（帖撒罗尼迦前书 4:8）。在这里也是如此：如果你说冒犯的话语，如果你使弟兄忧伤，你所使忧伤的不是他，而是冒犯了圣灵。与此同时，（使徒）还指出一项恩典（指从圣灵所领受的），以使谴责更具分量：「你们不可使上帝的圣灵忧伤，」他说，「因为你们是在祂里面受了印记，直到得赎的日子」（以弗所书 4:30）。祂（圣灵）使我们成为君王的产业，使我们脱离了过去的一切罪恶，没有让我们留在那些将受上帝之震怒的人当中，而你竟然冒犯祂？你看，那里（所教导的）是何等的恐惧：「所以，不顺从的，」他说，「所不顺从的不是人，而是上帝。」而在这里，他用这些话使人羞愧：「你们不可使上帝的圣灵忧伤，因为你们在祂里面受了印记。」愿这些话语像印记一样，铭刻在你的口中；不要抹去这些标记。被圣灵所印证的口唇，不会说出任何（不当的）话语。不要说：如果我说出恶语，如果我冒犯这个人或那个人，那没关系。正因为你认为它是微不足道的，这才是极大的恶。被认为微不足道的恶，容易被忽略；而一旦被忽略，它便会加剧，加剧后，就变得无法医治。你的口唇是被圣灵所印证的吗？回想一下，在你受洗后你曾说过什么话，回想一下你口唇的尊严。你称上帝为你的父亲，却同时辱骂你的弟兄？思考一下，你为何称上帝为你的父亲。（是因祂是）按着本性的父亲吗？但如此一来，你便不能（如此称呼祂）。是因为美德吗？不，也不是因为这个。那是为何？单单是因着（上帝的）爱世人，祂的慈悲，祂的丰盛怜悯。所以，当你称上帝为父亲时，你不仅要想到，通过侮辱（你的弟兄），你的行为不配这崇高的身份，还要想到，你拥有这崇高的身份是出于（上帝的）恩典。因此，不要羞辱你的崇高身份——你自己是凭着怜悯获得的——却以残忍对待你的弟兄。你称上帝为你的父亲，却侮辱（你的近人）？这不符合上帝之子的身份！上帝之子的作为是：饶恕仇敌，为那些将他钉十字架的人祷告，为恨他的人流血。这才是上帝之子所配得的：使他的仇敌，那些忘恩负义的、盗贼、厚颜无耻的、诡诈的——成为他的弟兄和继承人，而不是侮辱自己的弟兄，如同对待奴仆一般。
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Подумай, какие слова произносили уста твои, какой они удостаиваются трапезы; подумай, к чему они прикасаются, что вкушают, какую принимают пищу. Ты полагаешь, что, злословя своего брата, ты не делаешь важного преступления? Как же, в таком случае, ты называешь его братом? А если он тебе – не брат, то как же ты говоришь:"Отче наш"? Ведь слово – наш указывает на множественность лиц. Подумай, с кем ты стоишь во время тайнодействий: с херувимами, с серафимами. Серафимы не злословят, но их уста имеют одно только занятие – славословить и прославлять Бога. Как же ты будешь вместе с ними говорить:«Свят, свят, свят», – после того как произносил своими устами злословия? Скажи мне: если бы царский сосуд, всегда наполнявшийся царскими кушаньями и назначенный на такое употребление, кто-нибудь из слуг употребил для нечистот, посмел ли бы он после этого опять ставить вместе с другими, употребляющимися при царском столе, сосудами, и этот, наполненный нечистотами? Отнюдь нет. Таково же и злословие, таково и оскорбленье (ближнего)!'
      cn: 思想，你的口舌曾说过什么话，它们配得上怎样的筵席；思想，它们触碰过什么，品尝过什么，领受过何种食物。你以为，诽谤你的兄弟，你没有犯下严重的罪行吗？那么，在这种情况下，你又如何称他为兄弟呢？如果他不是你的兄弟，那你又怎能说：「我们在天上的父」呢？因为「我们」这个词，指明了多个人。思想，在神圣的奥秘礼仪中，你与谁一同站立：与基路伯、与撒拉弗一同站立。撒拉弗不诽谤，但他们的口舌只有一个职事——就是颂赞和荣耀上帝。在你用你的口舌诽谤之后，你又怎能与他们一同说：「圣哉，圣哉，圣哉」呢？告诉我：倘若一个御用器皿，总是盛满了御膳，并专用于此途，却被某个仆人用来盛装污秽之物，在这之后，他还敢不敢将这个装满污秽的器皿，与御膳桌上所用的其他器皿一同摆放呢？绝不敢。诽谤亦是如此，冒犯（邻人）亦是如此！
  - type: paragraph
    text:
      ru: '"Отче наш". И то ли одно ты произносишь? Вникни и в следующие слова:«сущий на небесах». Сейчас ты сказал:«Отче наш, сущий на небесах», – и эти слова возбудили тебя, окрылили твою мысль, внушили, что ты имеешь Отца на небесах. Не делай же ничего, не говори ничего земного. Они вознесли тебя в горний чин, присоединили тебя к небесному лику. Зачем же ты низвергаешься долу? Предстоишь пред престолом Царским, и произносишь злословия! Ужели ты не боишься, что Царь почтет твой поступок за оскорбление себе? Когда раб, пред нашими глазами, наносит удары другому рабу и поносит его, то, хотя бы он делал это и по праву, мы тотчас взыскиваем, принимая такой поступок за обиду себе; а ты, поставленный вместе с херувимами пред престолом Царя, поносишь своего брата? Видишь ли, эти святые сосуды? Они имеют одно назначение: кто же осмелится употребить их на другое? А ты святее их и гораздо святее: зачем же ты оскверняешь себя и мараешь грязью? Стоишь на небесах, и предаешься злословию? Живешь с ангелами, и злословишь? Удостоился лобзания Владычного, и произносишь злословия? Бог украсил твои уста столькими ангельскими песнопениями, удостоил их брашна не ангельского, но свыше ангельского – Своего лобзания и Своих объятий, и ты предаешься злословию? Оставь это, прошу тебя. Такое поведение производит великие бедствия и не свойственно душе христианской. Ужели мы не убедили тебя своими словами, не пристыдили? В таком случае, необходимо устрашить тебя. Послушай же, что говорит Христос:«всякий,.. кто скажет брату своему:.. «безумный», подлежит геенне огненной»(Мф.5:22).'
      cn: 「我们的父」。难道你只念诵这一句吗？再深思接下来的话：「在天上的」。现在你说了：「我们的父，在天上的」——这些话语激励了你，给你的思想插上翅膀，让你确信你在天上有父。那么，不要做任何属地的事，不要说任何属地的话。它们将你提升到高贵的地位，使你加入天上的圣众。为何你竟自贬到尘世呢？你站在君王的宝座前，却口出恶言！难道你不怕君王视你的行为是对祂的冒犯吗？当一个奴仆，在我们眼前，殴打另一个奴仆并辱骂他时，即便他是出于正当理由而为，我们也会立刻惩戒，认为这种行为是对我们自身的冒犯；而你，与基路伯一同被安置在君王的宝座前，却辱骂你的弟兄？你看到这些圣洁的器皿了吗？它们只有一个用途：谁又敢将它们用于别的目的呢？而你比它们更圣洁，远比它们更圣洁：为何你却玷污自己，涂抹污秽呢？你站在天上，却沉溺于恶言？与天使同住，却口出恶言？你蒙受了主宰的亲吻，却口出恶言？上帝以如此多的天使颂歌装饰了你的口唇，又使它们蒙受的并非天使的食粮，而是超越天使的——祂的亲吻和祂的拥抱，你却沉溺于恶言？请你停止如此，我请求你。这种行为会酿成巨大的祸患，且不符合基督徒的灵魂。难道我们的话语没有说服你，没有使你感到羞愧吗？既然如此，就必须震慑你。那么，请听基督所说：「凡……骂弟兄是『蠢材』的，必受火刑的地狱」（马太福音 5:22）。
  - type: paragraph
    text:
      ru: Итак, если он угрожает геенной тому, кто скажет самое легкое (из обидных слов), то чего заслуживает тот, кто произносит более дерзкие укоризны? Научим свои уста доброречию. Отсюда происходит великая польза, а от злоречия – великий вред. Здесь не нужно тратить денег, – приставим только (к устам) дверь и запор, будем угрызать самих себя, как только с нашего языка сорвется оскорбительное слово, будем умолять Бога, будем упрашивать оскорбленного нами, чтобы нам не страдать безвинно, – ведь мы огорчили себя, а не его, – обратимся к лекарству, к молитве и к примирению с обиженным. Если мы должны наблюдать такую осторожность в словах, то тем более – в делах будем к себе строги. Будут ли это твои друзья, будет ли другой кто, кого ты злословил и поносил, извинись пред ними и испроси у них себе наказания. Будем знать, по крайней мере, что злословие есть грех. Если будем это знать, то скорее отстанем от него. Бог же мира да сохранит ваш ум и язык и да оградит твердой стеной – Своим страхом, во Христе Иисусе и Господе нашем, с Которым слава Отцу и Святому Духу.
      cn: 那么，如果他以地狱威胁那些说出最轻微（冒犯之言）的人，那么，那些说出更傲慢责骂的人，又当受何等惩罚呢？让我们教导自己的口舌善言。从中会产生极大的益处，而从恶言则会产生极大的损害。在这里无需花费金钱，——只需为（口舌）安上门和门闩，一旦有冒犯之言从我们口中说出，我们就要自责，我们要恳求上帝，我们要请求被我们冒犯的人，以免我们无辜受苦，——因为我们伤心的是自己，而不是他，——让我们转向药剂、祷告，并与被冒犯者和解。如果我们在言语上必须如此谨慎，那么在行为上更要对自己严格。无论是你的朋友，还是你曾诽谤和辱骂过的其他人，向他们道歉，并请求他们惩罚你。至少，我们要知道恶言是一种罪。如果我们知道这一点，我们就会更快地远离它。愿赐平安的上帝保守你们的心智和口舌，并以一道坚固的墙——祂的敬畏——来加以保卫，在我们的主耶稣基督里，祂与父和圣灵同享荣耀。
- type: heading1
  text:
    ru: Беседа 15
    cn: 第 15 讲
  children:
  - type: paragraph
    text:
      ru: Еф.4:31.Всякое раздражение и ярость, и гнев, и крик, и злоречие со всякою злобою да будут удалены от вас.
      cn: (以弗所书 4:31) 一切的苦毒、和忿怒、和恼怒、和喧嚷、和毁谤，连同一切的恶毒，都当从你们中间除去。
  - type: paragraph
    text:
      ru: Следует воздерживаться от крика, брани в побоев.
      cn: 应当戒绝吼叫、辱骂和殴打。
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Как рои пчел никогда не садятся в нечистый сосуд, и потому люди, опытные в этом, приготовляют для них место, окуривая его курениями, мастиками и всякого рода благовониями, обрызгивают ароматными винами и всякими другими составами корзины, в которые они должны садиться, отроившись из ульев, и делают все это для того, чтобы неприятный запах, противный пчелам, не заставил их лететь прочь, – так все это применимо и к Святому Духу. Наша душа есть как бы какой сосуд или корзина, в которой могут помещаться рои духовных дарований; но, если она наполнена желчью, горечью и гневом, то эти рои отлетают от нее прочь. Поэтому-то этот блаженный и мудрый домохозяин тщательно очищает наши сосуды, не употребляя для этого ни ножа, ни другого какого железного орудия. Он призывает нас в этот духовный улей и, устраивая его, очищает его молитвами, трудами и всякими другими средствами. Посмотри, как он очищает наше сердце: отгоните, говорит, ложь, отгоните гнев; и при этом показывает, как можно истребить зло с корнем: да не будем, говорит, гневливы духом. С нашей желчью обыкновенно бывает, что если ее немного, то и движете ее не сильно, когда расторгнется вместилище, но когда ее едкость и острота доведены до слишком сильной степени, то заключавшее ее доселе вместилище, будучи уже не в состоянии долее задерживать ее в себе и лопая как бы от сильного огня, действительно больше не удерживает ее в надлежащих границах; треснув от чрезмерного напряжения, он извергает ее из себя и она расходится по всему телу. И дикий и лютый зверь, приведенный в город, пока находится в огражденном месте, никому не может сделать вреда, сколько бы ни бесновался и ни кричал; но если, разъярившись, он перескакивает ограду, то производит страх и тревогу в целом городе и заставляет всех бежать от себя: таково же и естественное свойство желчи. Пока она находится в своих границах, то не производит в нас никакого важного вреда; но когда лопнет ее оболочка, и ей уже ничто не мешает разлиться по всему телу, тогда-то она, несмотря на свое крайне незначительное количество, по причине своей качественной силы проникает собою все элементы тела и портит их своей дурной примесью. Так, касаясь крови, к которой она близка и по месту и по качеству, разгорячает ее и все, что ни есть вблизи ее, делает излишне влажным и обращает в желчь; затем производит беспорядок и в других частях тела и, таким образом, все перепортив собою, лишает человека употребления языка и доводит его до смерти, изгоняя из тела душу. Но для чего мы говорим обо всем этом с такой подробностью? Для того, чтобы нам, через сравнение с чувственной желчью, лучше понять весь нестерпимый вред желчи духовной, – как она, производя совершенное расстройство в нашей душе, от которой рождается, причиняет ей совершенную погибель, – и чтобы, зная это, мы береглись, как бы не испытать на себе (ее вредного действия). Как та (желчь вещественная) производит воспаление в телесном составе, так эта (духовная) разжигает наши мысли и низводит того, кем овладевает, в гееннскую пропасть.'
      cn: '蜂群从不在不洁净的容器中安家，因此，有经验的人会为它们预备地方，用香料、乳香和各种馨香熏它，用芬芳的酒和各种其他混合物喷洒蜂群从蜂巢分出后将要安家的篮子。他们做这一切，是为了避免令蜜蜂厌恶的不悦气味把它们赶走——这一切都同样适用于圣灵。我们的灵魂就像一个容器或篮子，其中可以容纳群群属灵的恩赐；但是，如果它充满了胆汁、苦毒和愤怒，那么这些蜂群就会飞离它。因此，这位蒙福而智慧的管家仔细地洁净我们的容器，不用刀，也不用任何其他铁制工具。他召唤我们进入这个属灵的蜂巢，并建造它，用祷告、劳苦和各种其他方法洁净它。看，他如何洁净我们的心：他说，驱逐谎言，驱逐愤怒；并且同时展示了如何将邪恶连根拔除：他说，愿我们不要在灵里易怒。


        我们的胆汁通常是这样，如果它不多，那么当容器破裂时，它也不会剧烈地涌动；但当它的腐蚀性和刺激性达到极强的程度时，那么先前盛装它的容器，就再也无法继续将其容纳在内，并且像是被烈火烧灼而破裂，确实不再将其 удерживает 在应有的界限内；它因过度紧张而破裂，将胆汁排出体外，使其遍布全身。一只被带到城里的凶猛野兽，只要它还在围栏内，无论它如何狂暴嘶吼，都不能伤害任何人；但如果它发怒，跳过围栏，就会在整个城市制造恐慌和不安，并迫使所有人逃离它：胆汁的自然属性也是如此。只要它在其界限内，就不会对我们造成任何严重的伤害；但当它的外壳破裂，再也没有什么能阻止它扩散到全身时，届时，尽管其数量微乎其微，但由于其质的强大力量，它会渗入身体的所有元素，并以其有害的混合物败坏它们。这样，它接触到血液——与血液无论在位置还是性质上都接近——使其炽热，并使所有靠近它的部分过度潮湿并转化为胆汁；随后在身体的其他部位制造混乱，并如此，将一切彻底破坏，使人无法使用舌头，并导致其死亡，将灵魂逐出身体。但我们为何如此详细地谈论这一切呢？是为了让我们通过与肉体胆汁的比较，更好地理解属灵胆汁那无法忍受的全部危害——它如何在我们灵魂中造成彻底的紊乱，从灵魂中生出，又给灵魂带来彻底的毁灭——并为了让我们知道这一点后，警惕自己，以免亲身遭受（其有害作用）。正如那（物质的胆汁）在身体组织中引起炎症，照样，这（属灵的胆汁）则煽动我们的思想，并将它所掌控的人带入地狱的深渊。'
  - type: paragraph
    text:
      ru: 'Итак, чтобы нам, после того как мы все это тщательно рассмотрели, избежать этого зла, обуздать этого зверя, а лучше – чтобы с корнем вырвать, для этого послушаем слов Павла:«Всякое раздражение, – не сказал: да очистится, –да будет удаленоот вас". В самом деле, какая мне надобность удерживать ее при себе? Для чего мне держать у себя зверя, которого можно удалить из души и прогнать далеко прочь? Послушаем же слов Павла:«Всякое раздражение... да будет удаленоот вас". Но, к сожалению, вот какое у нас замешательство. Тогда как следовало бы всячески стараться об этом, некоторые так неразумны, что считают за счастье для себя такое зло, гордятся им, тщеславятся и возбуждают зависть в других. Такой-то, говорят, человек желчный, настоящий скорпион, змей, ехидна: его страшно боятся! Что боишься ты, возлюбленный, желчного человека? Боюсь, говорит, чтобы он не сделал мне вреда, не оскорбил меня. Я неопытен в коварстве, как он, и потому боюсь, чтобы он не завлек меня в свои сети, как человека простого и неспособного проникать в его замыслы, и не опутал нас своими ковами, приготовленными для нашего обмана. Смешно! Почему? Потому что такие слова приличны детям, которые боятся того, что нисколько не страшно. В самом деле, никто столько не заслуживает презрения, никто столько не достоин посмеяния, как желчный и злой человек. Ведь ничего нет бессильнее злобы: она делает (человека) бессмысленным и безумным.'
      cn: 所以，为了我们，在我们仔细审视这一切之后，能避免这恶，驯服这恶兽——更佳者，是将其连根拔除——为此，让我们听保罗的话：「一切的忿怒」——他没有说：当被洁净——「都当从你们中间除去。」事实上，我有什么必要将它留在身边呢？我为何要将这恶兽留在我这里，它本可从灵魂中除去，并远远赶走？那么，让我们听保罗的话：「一切的忿怒……都当从你们中间除去。」然而，可悲的是，我们有这样的困惑。当我们本应尽力为此努力时，有些人却如此愚昧，竟将这样的恶视为自己的幸福，因它而骄傲、自夸，并激发他人的嫉妒。他们说，某某人脾气暴躁，是个真正的蝎子、蛇、毒蛇：人人都非常害怕他！蒙爱者啊，你为何惧怕脾气暴躁的人呢？（有人）说，我害怕他会伤害我，侮辱我。我不像他那样诡计多端，因此我害怕他会将我诱入他的网罗，因为我是一个单纯、无法洞悉他意图的人，并用他为欺骗我们所设的诡计捆绑我们。可笑！为何？因为这样的话语只配儿童说出，他们惧怕那丝毫不值得惧怕的事物。事实上，没有人比一个脾气暴躁又邪恶的人更该被轻蔑，更配受嘲弄。因为没有什么比恶毒更无力的了：它使（人）变得愚昧和疯狂。
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: Разве вы не видите, что злоба слепа? Разве вы не слышали, что копающий яму ближнему роет ее для себя? Но как же, скажут, не бояться человека, предавшегося гневу? Если должно бояться демонов и сумасшедших, то должно бояться и гневливых людей, как безумцев, все делающих без рассуждения. Соглашаюсь и я с этим, но отнюдь не согласен с тем, будто в делах надобно прибегать к помощи таких людей. Для успешного ведения дел всего больше необходимо благоразумие; коварство же, злоба и лукавство более всего препятствуют нам сохранять благоразумие. Не видите ли, каковы бывают тела, в которых разливается желчь, как они бывают невзрачны, совершенно потеряв естественный свой цвет? Как они бывают слабы, немощны и ни к чему не способны? Таковы же и души, одержимые этой болезнью. Коварство – это не что иное, как желчная болезнь души. Итак, коварство ни мало не сильно, отнюдь нет. Хотите ли я опять уясню для вас свои слова примером, представив вам образец (человека) коварного и простого? Авессалом был коварен и всех привлек на свою сторону. Смотри же, каково было это коварство. Он ходил, как сказано, (близ врат) и всякому говорил:«некому выслушать тебя»(2Цар. 15:3), – желая привлечь этим на свою сторону. А Давид был прост. Что же? Смотри, каков был успех того и другого, смотри, как тот оказался безрассудным. Так как он имел в виду только то, как бы вредить своему отцу, то и был слеп относительно всего остального. Но Давид не так, потому что«Кто ходит в непорочности, тот ходит безопасно»(Притч. 10:9), – т. е., кто ничего не замышляет на других, не готовит никому зла.
      cn: '难道你们看不出怨恨是盲目的吗？难道你们没有听过，为邻舍挖坑的人，是为自己挖坑吗？但有人会说，难道不当惧怕那些沉溺于怒火的人吗？如果人们当惧怕魔鬼和疯子，那么也当惧怕那些暴怒之人，他们如同疯子一般，做任何事都不假思索。我对此表示同意，但我绝不同意在处理事务时需要寻求这类人的帮助。为了成功地处理事务，最重要的是审慎；而诡诈、怨恨和狡猾，最能阻碍我们保持审慎。难道你们看不出，当胆汁在体内弥漫时，身体会变得怎样吗？它们是何等憔悴，全然失去了本有的颜色？它们是何等虚弱、无力，并且一事无成？同样地，那些被这种疾病所缠绕的灵魂也是如此。诡诈无非是灵魂的胆汁病。因此，诡诈丝毫无力，绝非强大。你们是否希望我再用一个例子为你们阐明我的话，呈现一个诡诈之人与一个单纯之人的典范？


        押沙龙是诡诈的，他吸引了所有的人归向他。那么，请看这诡诈是如何的。他如所言，（在城门旁）来回走动，对每个人说：「没有人听你的申诉」（撒母耳记下 15:3），— 借此希望将他们吸引到自己一边。但大卫是单纯的。结果如何呢？请看，两人各自的结局如何；请看，押沙龙是何等愚昧无知。因为他一心只想着如何伤害他的父亲，所以他对其他一切都视而不见。但大卫并非如此，因为「行事纯全的，步步安稳」（箴言 10:9），— 也就是说，不图谋害人，不为任何人预备恶事的人。'
  - type: paragraph
    text:
      ru: Итак, послушаемся блаженного Павла и пожалеем о злонравных людях, будем оплакивать их и всячески стараться употреблять все меры к тому, чтобы освободить их душу от этого зла. И не безрассудно ли это, – что мы стараемся ослаблять силу желчи, – хотя она и необходимый элемент (в теле), так как без нее человек не может жить – я разумею желчь стихийную, – не безрассудно ли, говорю, что мы стараемся ослаблять ее силу, несмотря на то, что она весьма полезна для нас, и между тем нисколько не заботимся и не стараемся о том, чтобы подавлять в себе желчь душевную, которая ни к чему не полезна, напротив производит столько зла?«Если кто из вас думает быть мудрым в веке сем, – сказано, –тот будь безумным, чтобы быть мудрым»(1Кор. 3:18); или как еще говорит св. Лука:"принимали(верующие)пищу в веселии и простоте сердца, хваля Бога и находясь в любви у всего народа»(Деян. 2:46–47). Не видим ли мы и теперь, что люди простые и нековарные пользуются от всех общим уважением? Никто таким людям не завидует в счастье, никто не нападает на них в несчастии; но все радуются их благополучию и сожалеют об них, если их постигает несчастье. Напротив, когда благоденствует человек злонравный, то все скорбят об этом, как бы о каком несчастии; а если он впадает в несчастье, то все этому радуются. Пожалеем же о таких людях, потому что они везде, на каждом шагу, имеют у себя врагов. Иаков был простосердечен, но победил злонравного Исава, потому что«В лукавую душу не войдет премудрость»(Прем. 1:4).«Всякое раздражение... да будет удаленоот вас", так чтобы ее уже нисколько не оставалось. Иначе этот остаток, если будет возбужден, то, подобно искре, произведет внутри целый пламень.
      cn: '于是，让我们听从蒙福的保罗，怜悯那些心怀恶意之人，为他们哀哭，并千方百计地努力采取一切措施，使他们的灵魂摆脱这种邪恶。这难道不是愚蠢的吗？——我们努力削弱胆汁的力量——尽管它是（身体中）必不可少的元素，因为没有它，人就无法生存——我指的是原质胆汁——我再说，我们努力削弱它的力量，尽管它对我们非常有益，然而我们却丝毫不在意，也不努力去抑制我们内在的魂胆，它毫无益处，相反却会产生如此多的邪恶？


        「你们中间若有人自以为在今世有智慧，他就当成为愚拙的，好叫他有智慧。」（哥林多前书 3:18）；或者如圣路加所说：「（信徒们）欢喜快乐、心里纯一地用饭，赞美上帝，又蒙全体人民的喜爱。」（使徒行传 2:46-47）。难道我们现在不也看到，那些单纯而无诡诈的人受到所有人的普遍尊敬吗？没有人在他们幸福时嫉妒他们，没有人在他们不幸时攻击他们；但所有人都为他们的福祉欢喜，如果他们遭遇不幸，所有人都为他们感到惋惜。相反，当一个心怀恶意的人得享安乐时，所有人都为此感到悲伤，仿佛遭遇了什么不幸；而如果他陷入不幸，所有人都为此欢喜。那么，让我们怜悯这样的人，因为他们无论走到哪里，每一步都有自己的仇敌。雅各为人正直单纯，却战胜了心怀恶意的以扫，因为「智慧不入诡诈之魂。」（智慧篇 1:4）。


        「一切的愤怒……都当从你们中间除去，」以至于丝毫不再存留。否则，这残留之物若被激发，便会如同火星一般，在内部燃起熊熊烈焰。'
  - type: paragraph
    text:
      ru: 'Итак, тщательнее рассмотрим, что такое эта горесть: ей подвержен человек коварный, хитрый, злокозненный, подозрительный; от нее всегда рождается гнев и ярость, потому что невозможно такой душе оставаться в спокойствии. Горесть – корень гнева и ярости. Такой (человек) угрюм, никогда не отдыхает душой, всегда задумчив, всегда мрачен, потому что, как я сказал, эти люди первые испытывают на себе дурные последствия своего злого нрава."И крик". Что это? И почему (апостол) запрещает"крик"? Потому что таков должен быть (человек) кроткий. Крик – это конь, имеющий своим всадником гнев. Смири коня и победишь всадника. Пусть выслушают это с особенным вниманием женщины, потому что они особенно любят кричать и шуметь во всяком деле. В одном только случае полезно говорить громко, это – в проповедовании и учении, а более нигде, ни даже в молитве. Если ты хочешь проверить наши слова на деле, то воздерживайся всегда от крика, и ты никогда не придешь в гнев. Вот способ укрощения гнева! И как невозможно разгневаться тому, кто удерживается от крика, так невозможно не придти в гнев тому, кто кричит. Не говори мне здесь о людях враждующих, злопамятных, злобных и раздражительных: у нас теперь идет речь о немедленном погашении этой страсти.'
      cn: '那么，让我们更仔细地审视这「愁苦」究竟是什么：狡猾、诡诈、恶毒、多疑之人易受其侵扰；愤怒和狂怒总是由此而生，因为这样的灵魂不可能保持平静。愁苦是愤怒和狂怒的根源。这样的人（因愁苦）总是阴沉的，灵魂从不安宁，总是沉思默想，总是忧郁，因为正如我所说，这些人首先亲身承受了自己邪恶性情的恶果。「和喊叫。」这是什么？使徒为何禁止「喊叫」？因为（人）理当如此温顺。喊叫是马匹，愤怒是其骑手。驯服马匹，你就能战胜骑手。愿女人们特别留意聆听此言，因为她们在任何事情上都特别喜欢喊叫和喧哗。


        只有在一种情况下大声说话是有益的，那就是在宣讲和教导中；除此之外，在任何地方都不应如此，即便在祷告中也不应如此。如果你想要实际验证我们的话，那么就始终避免喊叫，你便永远不会陷入愤怒。这就是平息愤怒的方法！正如克制喊叫的人不可能发怒，喊叫的人也不可能不陷入愤怒。不要在这里对我说那些彼此为敌、怀恨在心、充满恶意和易怒之人：我们现在谈论的是立即熄灭这种激情。'
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Итак, если мы приучим себя воздерживаться от крика и брани, то это немало может способствовать нам к укрощению души. Подави крик, и ты этим отнимешь крылья у своего гнева, укротишь волнение сердца. И как невозможно, не поднимая рук, вступить в кулачный бой, так невозможно, не поднимая крика, предаться гневу. Свяжи руки у бойца и вели ему биться, – он не в состоянии будет этого делать; точно также не может и гнев. Крик же возбуждает гнев даже и тогда, когда его нет. Особенно скоро, в подобном случае, (гнев) овладевает женщинами. Когда женщина прогневается на своих служанок, то весь дом наполняет своим криком. И как часто случается, что дом бывает выстроен на тесной улице, то все мимоходящие слышат ее брань и вопли служанки. Что может быть постыднее, как слышать чьи-либо вопли? Все тогда начинают подслушивать и спрашивать: что такое там случилось? Такая-то, говорят, бьет свою служанку. Как это безобразно, какой стыд! Но что же, (скажут), ужели вовсе не нужно прибегать к наказаниям? Я этого не говорю: нужно, но только не беспрестанно, не без меры, не из желания выместить на других свою досаду, даже и не за неисправность, как я постоянно говорю, но лишь тогда, когда она вредит своей душе. Если ты по этому побуждению взыскиваешь с нее, то все будут хвалить тебя, и никто не осудит. Если же (ты бьешь ее) по своей прихоти, то все признают твою горячность и жестокость. И что всего постыднее, некоторые так бывают жестоки и безжалостны, до того бичуют (своих служанок), что раны не сходят с них целый день. Они обнажают девиц и, при содействии мужа, часто привязывают их к стульям. Увы, скажи мне, ужели в это время тебе не приходит на память геенна? Но ты обнажаешь девушку, и показываешь мужу: ты не стыдишься того, что они тебя осудят? Напротив ты, как можно сильнее, побуждаешь его к жестокости, настаиваешь связать ее, и, прежде всего, осыпаешь бедную и несчастную тысячей бранных слов, называя ее фессалинкой[2], беглянкой, проституткой. Гнев не щадит твоих уст, имея в виду одно, как бы досадить виновной, хотя бы с позором для себя. После всего этого, прогневанная садится на своем месте, подобно тирану, призывает отроков и, давши приказ глупому мужу, употребляет его вместо палача. Должно ли это происходить в христианских домах? Но, говорят, так поступают с людьми лукавыми, бессовестными, бесстыдными и неисправимыми. Знаю это и я. Но их можно бы исправлять иным образом, например, страхом, угрозами, словами и при том такими, которые бы могли подействовать на них и в то же время не унижали тебя. Ты, будучи благородной женщиной, произносишь постыдные слова и этим ты не столько ли же бесчестишь и себя, сколько ее? Потом, если ей понадобится пойти в баню, то раны на ее обнаженной спине не будут ли свидетельствовать о твоей жестокости?'
      cn: 那么，如果我们习惯于避免喊叫和咒骂，这对我们驯服灵魂大有裨益。压制喊叫，如此你便能折断你怒气的翅膀，驯服内心的激动。正如不举手就无法进行拳击一样，不喊叫就无法沉溺于愤怒。捆住拳击手的双手，命他搏斗——他将无法做到；愤怒也同样如此。喊叫会激起愤怒，即使怒气尚不存在。在这种情况下，尤其迅速地，（怒气）会掌控女性。当一个女人对她的婢女发怒时，她的喊叫声就会充满整个房屋。又因房屋常建于狭窄的街道上，故所有路过的人都能听到她的咒骂和婢女的哀嚎。还有什么比这更可耻的呢，竟然听到他人的哀嚎？那时所有的人都会开始偷听并询问：到底发生了什么事？他们说，某某人正在殴打她的婢女。这多么丑恶，多么羞耻啊！但是，（他们会说）难道完全不该施以惩罚吗？我不是这个意思：需要惩罚，但不能持续不断，不能没有节制，也不是为了发泄自己的不满在他人身上，甚至不是为了过失，正如我常常说的，唯有当她（指婢女）损害自己的灵魂时。如果你出于这个动机责罚她，那么所有人都会赞扬你，没有人会谴责你。如果你只是出于自己的任性（殴打她），那么所有人都会认为你性情暴躁且残忍。而最可耻的是，有些人如此残酷无情，竟然鞭打（自己的婢女）以至于伤痕整日不退。她们剥光少女的衣服，并且在丈夫的协助下，常常把她们绑在椅子上。唉，告诉我，难道在这时候你没有想起革赫拿吗？但你却剥光少女的衣服，展示给丈夫看：你不为他们会谴责你而感到羞耻吗？相反地，你尽可能地促使他变得更残忍，坚持要捆绑她，并且首先，你用无数咒骂之词辱骂那可怜不幸的她，称她为色萨利人[2]，逃犯，娼妓。怒气不放过你的嘴唇，只有一个念头，如何惹恼有过错的人，即使这会给自己带来羞辱。这一切之后，那发怒的女人坐在她的位置上，如同一个暴君，召集仆役们，然后下令给愚蠢的丈夫，用他来代替刽子手。这难道是基督徒家庭里应该发生的事吗？但是，有人说，人们这样对待那些狡猾、没有良心、不知羞耻和无法纠正的人。我也知道这一点。但是他们可以用其他方式改正，例如，通过威吓、威胁、言语，并且是那些既能对他们起作用，同时又不会贬低你的言语。你作为一个高贵的女人，竟然说出可耻的话语，难道你这样不是既羞辱了自己，又羞辱了她吗？之后，如果她需要去澡堂，那么她赤裸背上的伤痕，难道不会证明你的残忍吗？
  - type: paragraph
    text:
      ru: Но, говорят, рабы делаются негодными, если их предоставить самим себе. Я и это знаю; но исправляй их, как я уже говорил, иначе, не бичами только, не страхом, но и лаской, и добрым обращением. Она стала твоей сестрой, если она верующая. Помни, что ты ее госпожа, она тебе служит. Если она склонна к пьянству, отними у нее возможность пьянствовать, призови мужа, увещевай. Ужели ты не понимаешь, как тебе неприлично бить женщину? Законодатели, установившие много наказаний для мужчин, и костры и пытки, редко приговаривают к этому женщину, но простирают строгость только до сечения розгами. Они так снисходительны к их полу, что в необходимых случаях даже освобождают их от тяжелых наказаний, особенно когда они бывают беременными. Неприлично мужчине бить женщину; если же (неприлично это) мужчине, то тем более той, которая с ней одного пола. Это делает и жен ненавистными для своих мужей. Но что делать, говорят, если она предается распутству? Выдай ее замуж, пресеки повод к распутству, не позволяй развратничать. Но что, если она ворует? Наблюдай и присматривай за ней. О, скажешь, что за претензии? Мне быть сторожем? Какое безумие! Отчего же, скажи, и не быть тебе ее сторожем? Разве у тебя не такая же душа, как и у нее? Разве она не удостоена тех же (даров) от Бога? Не к одной ли она приступает с тобой трапезе? Не разделяет ли она и твоего (духовного) благородства? Что же, говоришь ты, если она бранчива, сварлива, склонна к пьянству? А сколько есть таких и между свободными женами? Господь повелел мужам переносить все недостатки жен. Пусть только, говорит, твоя жена не будет прелюбодейкой, и ты сноси все другие ее недостатки. Если она склонна к пьянству, если бранчива и сварлива, если завистлива, если расточительна, если любит пышные наряды, – тебе необходимо исправлять ее. Для того ты ее глава. Исправляй же, делай для этого то, что от тебя зависит. Если она остается неисправимой, если ворует, – храни свое имущество, но не наказывай ее так жестоко. Если она сварлива, загради ее уста. Это (правило) высшего любомудрия. А, между тем, некоторые доходят до такого бесстыдства, что срывают у служанок покрывала с головы и таскают их за волосы.
      cn: 但，有人说，仆役如果任由他们自生自灭，就会变得不中用。我也知道这一点；但你要纠正他们，正如我所说的，不要仅仅是用鞭子，不要仅仅是用恐惧，而要用温柔和善待。如果她是一位信徒，她就成了你的姐妹。记住，你是她的女主人，她服侍你。如果她好酒贪杯，要剥夺她酗酒的机会，请你丈夫来，规劝她。难道你还不明白，殴打一个女人对你来说是多么不体面吗？那些为男人设立了许多刑罚——包括火刑和拷打——的立法者，却很少判处女人这些刑罚，他们的严厉仅仅延伸到用细杖鞭打。他们对女性如此宽容，以至于在必要的情况下，甚至免除她们的重罚，尤其是在她们怀孕的时候。男人殴打女人是不体面的；如果男人做这事都不体面，那么对于与她同性的人来说，更是如此。这也使妻子们被她们的丈夫憎恨。但有人说，如果她放荡不羁，该怎么办呢？把她嫁出去，杜绝她放荡的诱因，不要让她淫乱。但如果她偷窃呢？观察她，照看她。哦，你会说，这是什么要求？难道我要当看守吗？这简直是疯了！那么，告诉我，你为什么不能做她的看守呢？难道你没有和她一样的灵魂吗？难道她没有从上帝那里蒙受同样的恩赐吗？难道她不是与你一同来到同一筵席前吗？难道她没有分享你的属灵高贵品格吗？那么，你说，如果她好骂人、爱争吵、嗜酒呢？而在自由的妻子们中间，有多少这样的人呢？上主命令丈夫们忍受妻子们所有的缺点。祂说，只要你的妻子不是个淫妇，你就容忍她所有其他的缺点。如果她嗜酒，如果她好骂人又爱争吵，如果她嫉妒，如果她挥霍无度，如果她喜欢华丽的服饰，——你有必要纠正她。为此你是她的头。那么就纠正她，为此做你力所能及的事。如果她依然无法改正，如果她偷窃，——保护你的财产，但不要如此残酷地惩罚她。如果她爱争吵，使她住口。这是最高智慧的准则。然而，与此同时，有些人竟达到如此无耻的地步，她们扯下女仆头上的头巾，并拽着她们的头发。
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Что вы все покраснели? У нас речь не обо всех, но только о тех, которые предаются такой зверской жестокости. Жена да не будет непокровенна (1Кор. 11:6), говорит Павел; а ты совершенно лишаешь ее покрывала? Видишь ли, как ты оскорбляешь саму себя? Если она явится к тебе с непокрытой головой, ты называешь это оскорблением; а между тем сама, обнажая ее, ты не считаешь своего поступка непристойным? Потом ты говоришь: что мне делать, если она не исправляется? Вразуми ее розгой и ударами. При том (подумай), сколько и у тебя самой недостатков, и ты не исправляешь их? Говорится теперь это не в защиту их (служанок), а для вашей пользы, свободные женщины, чтобы вы не делали ничего неприличного и унизительного, чтобы не вредили себе. Если ты дома приучишь себя к тихому и кроткому обращению со служанкой, то тем более такой будешь по отношению к своему мужу. Если ты даже там, где ты свободна в своих поступках, не будешь делать ничего подобного, то тем более не будешь делать этого там, где есть к тому препятствие.'
      cn: 你们怎么都脸红了？我们现在说的不是所有的人，而只是那些沉溺于这种野兽般残忍行径的人。保罗说：「妻子不可不蒙头」（哥林多前书 11:6）；而你却让她完全没有遮盖？你难道没看到你是在侮辱你自己吗？如果她以不蒙头的样子出现在你面前，你称之为侮辱；可你自己剥去她的遮盖，却不认为自己的行为是不体面的吗？然后你说：如果她不改正，我该怎么办？那就用杖和鞭打教训她吧。此外（想想看），你自己有多少缺点，你却没有改正它们？现在说这些不是为了替她们（女仆们）辩护，而是为了你们这些自由妇女的益处，好让你们不做任何不体面和贬低人的事，以免伤害自己。如果你在家中习惯于温柔谦逊地对待女仆，那么你对待你的丈夫时就更会如此。如果你甚至在行为上自由的地方都不做那样的事，那么在有阻碍之处你就更不会做那样的事了。
  - type: paragraph
    text:
      ru: 'Таким образом благоразумное обращение со служанками весьма много может вам способствовать к приобретению благосклонности у своих мужей."Какоймероймерите, – сказано, –такоюи вам будут мерить»(Мф.7:2). Обуздай свои уста. И если ты научишься твердо переносить строптивость служанки, то ты не будешь огорчаться и тогда, когда потерпишь обиду от равной себе; когда же ты не будешь огорчаться этим, то ты достигнешь высокого любомудрия. Но иные в гневе употребляют даже проклятия: ничего не может быть хуже, как выражать свой гнев таким образом. Что же мне, скажешь ты, делать, если она (служанка) любит украшать свою наружность? Удержи ее от этого, и я одобрю, но удержи, начавши с себя самой, не столько страхом, сколько своим примером. Будь ей во всем первым образцом. И"злоречие, – говорит (апостол), –да будет удаленоот вас". Замечай, как происходит зло: горесть рождает гнев, гнев – ярость, ярость – крик, крик – хулу, т. е. бранные слова, затем хула – удары, удары – раны, раны – смерть. Но ничего подобного Павел не хотел сказать, а сказал только:"со всякойзлобойда будут удалены от вас». Что такое –"со всякойзлобой»? Всякая злоба ведет к этому концу. Есть (люди, которые) подобны тем хитрым собакам, что не лают и не нападают прямо на проходящих, но притворяясь смирными и кроткими, схватывают неосторожных и вонзают в них свои зубы. Такие гораздо хуже нападающих прямо. Так как и между людьми есть собаки, которые, не прибегая к крику, к гневу, к оскорблениям и угрозам, строят тайные ковы и приготовляют другим тысячу зол, мстя им делами, то (апостол) указал и на таких.«Да будут удалены от вас, – говорит, –со всякойзлобой». Не мсти и делами, если щадишь слова. Для того я удержал твой язык, остановил крик, чтобы в тебе не возгорелся сильнейший пламень. Если же ты и без крика делаешь то же самое, таишь внутри себя пламень и угли, то что пользы в твоем молчании? Разве ты не знаешь, что те пожары хуже, которые таятся внутри и не бывают видны снаружи? Не также ли и раны, которые не выходят наружу, а производят воспаление внутри? Так и тот (скрытый) гнев хуже и вреднее для души. Но и он, – говорит (апостол), –"со всякойзлобойда будут удалены от вас», как малой, так и великой. Будем же послушны ему и изгоним из себя всякую горесть, всякую злобу, чтобы нам не оскорбить Святого Духа. Истребим горесть с корнем, отсечем ее от себя. Ничего доброго не может быть душе, наполненной горечью, ничего полезного, но от нее все несчастья, все слезы, все вопли и стенания. Не видите ли, как мы отвращаемся от тех зверей, которые кричат, – именно от львов, от медведей, – но не от овцы, так как у ней нет крикливости, а тихий голос? Равным образом, из музыкальных инструментов те, которые издают крикливые звуки, неприятны для слуха, как, например, тимпаны, трубы, а те, которые обладают тихими звуками, приятны, каковы: флейта, цитра и свирель.'
      cn: 这样一来，明智地对待侍女们能非常大地帮助你们赢得丈夫们的欢心。「你们用什么量器量给人，也必用什么量器量给你们，」经上如此说（马太福音 7:2）。勒住你的口舌。如果你学会了坚忍地承受侍女的倔强，那么当你遭受与你平等之人的冒犯时，你也不会感到苦恼；当你不再因此苦恼时，你将达到高超的爱智。但有些人甚至在愤怒中咒骂：以这种方式表达自己的愤怒，没有什么比这更糟糕的了。那么你也许会说，如果她（侍女）喜欢装饰自己的外表，我该怎么做呢？阻止她这样做，我会赞同，但要从你自己开始阻止她，与其说是靠恐惧，不如说是靠你自己的榜样。在一切事上都成为她的首要榜样。使徒说：「一切恶言都当从你们中间除去。」留意恶事是如何发生的：苦毒生出愤怒，愤怒生出狂怒，狂怒生出叫喊，叫喊生出亵渎（即辱骂的话），接着亵渎生出殴打，殴打生出创伤，创伤生出死亡。但保罗不想说任何类似的话，他只说了：「一切的恶意都当从你们中间除去。」「一切的恶意」是什么意思？任何恶意都会导致这个结果。有些人就像那些狡猾的狗，它们不直接吠叫或攻击路过的人，而是假装温顺和善良，抓住不小心的人，把牙齿刺入他们体内。这样的人比直接攻击的人更糟糕。正如在人当中也有像狗一样的人，他们不诉诸叫喊、愤怒、侮辱和威胁，却暗设诡计，并为他人准备千百种恶事，用行动报复他们，所以使徒也指出了这样的人。他说：「一切恶意都当从你们中间除去。」即使你吝惜言语，也不要用行动报复。因此，我勒住你的舌头，止住了你的叫喊，免得在你里面燃起更强烈的火焰。如果你即使没有叫喊也做同样的事，在你内心隐藏着火焰和炭火，那么你的沉默有什么益处呢？难道你不知道吗，那些隐藏在内部而不从外面显现的火灾更糟？那些不从外面显现，而是在内部造成炎症的伤口不也是如此吗？同样，那（隐藏的）愤怒对灵魂而言更糟、更有害。但使徒说，即使是它，「一切恶意都当从你们中间除去」，无论是微小的还是巨大的。那么让我们顺服他，将一切苦毒，一切恶意从我们自身驱逐出去，以免我们冒犯圣灵。根除苦毒，将它从我们自身割除。灵魂若充满苦毒，就不能有任何良善，也不能有任何益处；反之，一切不幸，一切眼泪，一切哀嚎和叹息都源于它。你们难道没看到吗，我们是如何厌恶那些咆哮的野兽——具体来说，是狮子和熊——但不厌恶绵羊，因为它没有尖叫，只有温柔的声音？同样地，那些发出嘈杂声音的乐器令听者不悦，例如定音鼓、号角；而那些拥有柔和声音的乐器则令人愉悦，例如：长笛、西特拉琴和牧笛。
  - type: paragraph
    text:
      ru: Итак, настроим свою душу удерживаться от крика, и этим мы сможем подавить в себе гнев. А когда мы отгоним от себя (гнев), то сами первые насладимся спокойствием и приплывем в тихую пристань, куда да будет дано всем нам достигнуть во Христе Иисусе Господе нашем, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.
      cn: 所以，让我们立定自己的灵魂，抑制喊叫，借此我们便能平息内心的愤怒。当我们把（愤怒）从自身赶走时，我们自己将首先享受到宁静，并驶入平静的港湾。愿我们所有人都能在那（港湾）里，藉着我们的主耶稣基督而抵达。与祂一同，愿荣耀、权能、尊贵归于圣父和圣灵，从今时直到永远，世世代代。阿们。
