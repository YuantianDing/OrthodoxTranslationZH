  text:
    ru: Беседа 8
    cn: 第 8 讲
  children:
  - type: paragraph
    text:
      ru: Еф.4:1–2.Итак я, узник в Господе, умоляю вас поступать достойно звания, в которое вы призваны,
      cn: (以弗所书 4:1) 所以，我这在上主里的囚徒恳求你们，行事为人与你们所蒙的召相称，
  - type: paragraph
    text:
      ru: со всяким смиренномудрием и кротостью и долготерпением,  снисходя друг ко другу любовью.
      cn: 以诸般的谦卑、温柔和恒忍，以爱彼此宽容。
  - type: paragraph
    text:
      ru: Быть узником за Христа славнее сиденияодеснуюЕго. – Страдание за Христа выше всех благ. – О страже темницы, в которую заключен был Павел. – Почему попустил Бог погибнуть тем, которые стерегли Петра в темнице. – Оковы и страдания послужили к прославлению Павла. – Против одержимых жадностью и любостяжанием. – О трех отроках.
      cn: '为基督作囚徒，胜过坐在祂的右边。

        为基督受难，超越一切福祉。

        论囚禁保罗的狱卒。

        为何上帝容许那些在监狱里看守彼得的人灭亡？

        镣铐与苦难，促成了保罗的荣耀。

        反对被贪婪和爱财所占据的人。

        论三圣童。'
  - type: paragraph
    text:
      ru: 'Достоинство учителей состоит не в том, чтобы стараться о приобретении чести и славы у своих учеников, но в том, чтобы вести их ко спасению, и все свои действия направлять к этой цели. Если бы какой учитель заботился только о первом (своей чести и славе), – он был бы не учителем, а тираном. И Бог поставил тебя над ними не для того, чтобы ты наслаждался большим почетом, но для того, чтобы, забывая себя, помышлял только о том, что относится к ним. Таков долг учителя. Таким был блаженный Павел; он был чужд всякой гордости и вел себя наравне с другими, – даже так, как будто он был меньше других: называл себя их рабом, и очень много наставлений преподавал в виде просьбы. Вот, смотри, и теперь пишет не повелительным, не властным тоном, а кротко и смиренно:«Итак я, узник в Господе, умоляю вас, – говорит, –поступать достойно звания, в которое вы призваны». Скажи мне, для чего ты просишь? Для того ли, чтобы тебе самому получить что-нибудь? Нет, говорит, а для того, чтобы спасти других. Но кто просит, тот просит о полезном для него самого? И мне это полезно, говорит, как я и написал об этом в другом месте:«ибо теперь мы живы, когда вы стоите в Господе»(1Фес. 3:8). Так всегда сильно желал спасения ученикам своим!«Итак я, узник в Господе». Подлинно, великая и важная честь (быть в узах ради Господа), – она выше и царского, и консульского, и всякого другого достоинства.'
      cn: 教师的尊严不在于向自己的学生求取荣誉和荣耀，而在于引领他们走向救恩，并将自己的一切行动都指向此目标。如果有哪位教师只顾及前者（即他自己的荣誉和荣耀），他就不是教师，而是暴君了。上帝将你设立在他们之上，不是为了让你享有更大的尊荣，而是为了让你忘却自身，只思念与他们相关的事。这就是教师的职责。蒙福的保罗就是如此；他远离一切骄傲，且与他人平等相待——甚至仿佛他比他人更微小：他称自己为他们的仆役，并且以请求的方式传授了许多训诫。看哪，他现在所写的也不是命令式、权威性的语调，而是温柔谦卑地写道：「所以我这在主里作囚犯的，恳求你们，」他说，「行事为人要与你们所蒙的召相称。」告诉我，你为何请求？是为了你自己得到什么吗？不，他说，而是为了拯救他人。可是，凡有所请求的人，岂不是为对自己有益的事而请求吗？这对我也有益处，他说，正如我在别处所写的：「因为你们若靠主站立得稳，我们就活了。」(1帖撒罗尼迦前书 3:8)。他总是如此强烈地渴慕他门徒的救恩啊！「所以我这在主里作囚犯的。」这确实是极大的、重要的荣誉（为主被囚）——它超越了君王、执政官以及一切其他的尊严。
  - type: paragraph
    text:
      ru: 'Об этом же (узах своих) говорит и в послании к Филимону:«как я, Павел старец, а теперь и узник Иисуса Христа»(Флм. 1:9). В самом деле, нет ничего так славного, как узы ради Христа, как оковы, возложенные на эти священные руки. Быть узником ради Христа славнее, чем быть апостолом, учителем и благовестником. Кто любит Христа, тот понимает эти слова. Кто неудержимо стремится к Владыке и горит любовью к Нему, тот знает силу уз. Павел предпочел бы узничество ради Христа жизни на небесах. Его (скованные) руки для них (учеников его) казались светлее всякого золота, всякого царского венца. Не столько блестит на голове повязка с драгоценными камнями, сколько железные оковы ради Христа. Тогда темница бывает светлее царских чертогов. Что говорю – царских? Светлее и самого неба, потому что содержит в себе узника Христова. Кто любит Христа, тот знает это достоинство, знает эту добродетель, знает, сколько благ принесло роду человеческому узничество ради Него. Быть может, узы ради Него славнее сиденияодеснуюЕго, досточтимее восседания на двенадцати престолах. И что сказать мне (после этого) о человеческих (благах)? Стыжусь сравнивать богатство и золотое украшение с узами. Но, переставши говорить о величии уз, (скажу), что если бы узы ради Христа ничем не награждались, то все же велика была бы награда, достаточно воздаяние уже в том одном, что эти страдания претерпеваются ради любимого. Слова эти понятны любящим, если не Бога, то людей, – тем, которые более радуются, терпя страдания ради своих возлюбленных, чем получая от них почести. Понятны они были и священному сонму апостольскому. В самом деле, послушай, что говорит блаженный Лука:«Они же пошли из синедриона, радуясь, что за имяХристаудостоились принять бесчестие»(Деян. 5:41). Иным кажется смешно – бесчестие считать достоинством и обращать в предмет радости. Но знающие Христову любовь считают это (бесчестие) выше всякого блаженства. Если бы кто давал мне или все небо, или эти оковы, я предпочел бы их. Если бы кто хотел поместить меня или в горних с ангелами, или с Павлом, заключенным в узы, я избрал бы темницу. Если бы кто делал меня одной из тех сил, которые окружают небо и престол (Божий), или таким узником, я предпочел бы сделаться этим узником. И справедливо, нет ничего блаженнее этих оков. Я желал бы теперь быть в тех местах, где, говорят, еще хранятся эти узы, посмотреть их и подивиться людям, имевшим столь сильную любовь к Христу. Я желал бы видеть оковы, которых ужасаются и трепещут демоны, которые почитаются ангелами. Нет ничего лучше злострадания ради Христа. Я не столько ублажаю Павла за то, что он был восхищен в рай, сколько за то, что был ввергнут в темницу. Не столько ублажаю его за то, что слышал неизреченные глаголы, сколько за то, что был в узах. Не столько ублажаю его за то, что восхищен был на третье небо, сколько – за узы. А что узы больше всего этого, он знал это и сам. Вот послушай: он не сказал: молю вас аз, слышавший неизреченные глаголы. А что?«Итак я, узник в Господе, умоляю вас».'
      cn: '论及此事（自己的捆绑），（使徒保罗）在写给腓利门的书信中也提到：「我保罗，现在是基督耶稣的囚徒，又是年老的」（腓利门书 1:9）。确实，没有什么比为基督受捆绑更荣耀的了，也没有什么比那些加诸在这双圣手上的镣铐更荣耀的了。为基督作囚徒，比作使徒、教师和传福音者更荣耀。凡爱基督的，必明白这些话。凡热切渴慕主宰并为祂的爱所焚烧的，必知捆绑的力量。保罗宁愿为基督受囚禁，也不愿在天上生活。他的（被捆绑的）手，在他们（他的门徒）看来，比一切黄金、一切王冠更闪耀。嵌有宝石的头巾，其光芒不及为基督所戴的铁镣。那时，监狱比君王的宫殿更光明。我说君王的宫殿又如何？它甚至比天国本身更光明，因为它里面关押着基督的囚徒。凡爱基督的，必知这尊荣，必知这美德，必知为祂受囚禁给人类带来了多少福祉。或许，为祂受捆绑比坐在祂右边更荣耀，比坐上十二个宝座更可敬。在这之后，我又能对人世的（福祉）说些什么呢？我羞于将财富和黄金饰物与捆绑相提并论。


        然而，停止谈论捆绑的伟大之处，（我要说），即使为基督受捆绑没有任何奖赏，其奖赏也已足够丰厚，因为仅仅是为了所爱之人忍受这些苦难，这回报就已经足够了。这些话，那些爱的人自会明白，即便他们不爱上帝，也会爱人——他们为所爱之人忍受苦难，比从他们那里获得尊荣更为喜乐。这些话，圣使徒群体也明白。确实，请听蒙福的圣路加所言：「他们就离开公会，为因基督的名配受羞辱而欢喜」（使徒行传 5:41）。在一些人看来，将羞辱视为尊荣并转为喜乐的对象是可笑的。然而，凡了解基督之爱的人，必认为这（羞辱）超越一切福乐。若有人给我选择：或整个天国，或这些镣铐，我将选择后者。若有人愿意将我安置：或在天上与天使同在，或与被捆绑的保罗同在，我将选择监狱。若有人使我成为那些环绕天国和（上帝的）宝座的诸能力之一，或成为这样的囚徒，我将宁愿成为这囚徒。理当如此，没有什么比这些镣铐更蒙福的了。我愿此刻置身于据说这些捆绑仍被保存的地方，瞻仰它们，并对那些对基督怀有如此强烈爱意的人们感到惊叹。我愿看到那些令邪魔惊恐战栗，并受天使尊崇的镣铐。没有什么比为基督受苦更好的了。


        我称颂保罗，与其说是因为他曾被提到乐园，不如说是因为他曾被投入监狱。我称颂他，与其说是因为他曾听见那不可言喻的话语，不如说是因为他曾被捆绑。我称颂他，与其说是因为他曾被提到第三层天，不如说是因为他的捆绑。至于捆绑超越这一切，他自己也明白。请听：他没有说：「我曾听见那不可言喻的话语，因此我恳求你们。」而是说：「所以我这在主里的囚徒劝你们。」'
  - type: paragraph
    text:
      ru: 'Неудивительно, если он не употребляет этих слов во всех посланиях, – ведь он был в узах не всегда, а по временам. Для меня доблестнее терпеть зло за Христа, чем принимать от Него почести. Это – великая честь, это – слава, выше которой нет ничего. Если Он, сделавшись для меня рабом и ни во что вменивши славу, ничего не считал для Себя столько славным, как распинаться за меня, то чего не должен я претерпеть? Послушай, что говорит Он сам:«Отче!.. прославь Сына Твоего»(Иоан. 17:1). Что говоришь? Тебя вместе с разбойниками и грабителями ведут на крест, чтобы подвергнуть позорной смерти; Ты терпишь заушения и заплевания, – и Ты это называешь славой? Называю, говорит. Так как Я страдаю за любимых Мною, то и считаю (эти страдания) славой. Если же Он, возлюбивши достойных сожаления и несчастных, называет страдания славой; если для Него слава состояла не в том, чтобы быть на престоле Отчем, не в славе, а в бесчестии, и последнее Он предпочитал первому, – то тем более я должен считать это славой. О, блаженные узы! О, блаженные руки, украшенные этими узами! Не столько были почтенны Павловы руки, когда они поставили на ноги и даровали способность ходить хромому в Листре (Деян. 14:8–11), сколько тогда, когда находились в узах. Если бы я жил в те времена, то по преимуществу лобзал бы их, и прилагал бы их к своим зеницам. Я непрестанно лобзал бы руки, удостоившиеся быть в узах ради моего Владыки. Ты дивишься Павлу, что ехидна, коснувшись его руки, ничего ему не сделала? Не дивись: она устрашилась оков; их страшилось и целое море, – потому что тогда он был в оковах. Если бы кто давал мне силу воскрешать мертвых, я избрал бы не ее, а оковы. Если бы я не имел забот по церкви и мои телесные силы были крепки, то не отказался бы совершить столь дальнее путешествие для того, чтобы только видеть Павловы оковы и темницу, в которой он был заключен. Хотя везде встречаются памятники его чудес, но они не производят такого впечатления, как памятники его язв. И в Писаниях он не столько радует меня, когда совершает чудеса, сколько тогда, когда злостраждет, когда его бьют, влачат. Справедливо пользуются почитанием платки и полотенца, от которых совершались чудесные действия, – они тоже достойны удивления, но не такого, как те (апостольские страдания). Сказано: бивше его, и«дав им много ударов, ввергли в темницу»(Деян. 16:23); еще:«узники ...воспевали Бога»(Деян. 16:25); еще:"побилиегокамнями и вытащили за город, почитая его умершим»(Деян. 14:19).'
      cn: 毫不奇怪，如果他在所有书信中都没有使用这些词语——因为他并非总是在捆锁之中，而是时有时无。对我来说，为基督忍受患难比接受祂的尊荣更为光荣。这是一份莫大的尊荣，一份没有任何事物能超越其上的荣耀。如果祂，为了我成为奴仆，将荣耀视若无物，没有什么比为我受十字架之刑更令祂引以为荣，那么我有什么不该承受的呢？听祂自己所说的：「父啊！……愿祢荣耀祢的儿子」（约翰福音 17:1）。祢说什么呢？祢与强盗和掠夺者一同被带上十字架，为要遭受耻辱的死亡；祢忍受耳光和唾沫──而祢竟称这为荣耀吗？祂说：「我称之为荣耀。因为我为我所爱的人受苦，所以我视（这些苦难）为荣耀。」既然祂，爱了那些可怜不幸的人，称苦难为荣耀；如果对祂而言，荣耀不在于坐在父的宝座上，不在于荣耀，而在于耻辱，并且祂宁愿选择后者而非前者──那么我更应该将此视为荣耀。哦，福哉这捆锁！哦，福哉这被捆锁所装饰的双手！保罗的双手在路司得使瘸腿的站起来行走（使徒行传 14:8-11）时受人尊崇，却不及它们处于捆锁之中时。如果我生在那个时代，我会特别亲吻它们，并将它们贴在我的眼瞳上。我会不断地亲吻那双手，那因我的主宰而蒙受捆锁的双手。你惊讶于保罗，毒蛇触碰他的手却未伤他分毫吗？不要惊讶：它惧怕那些镣铐；甚至整片大海都惧怕它们──因为那时他正被镣铐捆锁。如果有人赐我使死人复活的能力，我不会选择那能力，而是选择镣铐。如果我没有教会的事务缠身，且我身体强健，我将不会拒绝进行如此遥远的旅程，仅仅为了瞻仰保罗的镣铐以及他被囚禁的监狱。尽管到处都有他施行神迹的纪念，但它们所带来的感动，不及他伤痕的纪念。在圣经中，他施行神迹时不及他遭受苦难、被殴打、被拖拽时更能使我欢欣。那些使神迹得以成就的手帕和围裙，理当受人尊崇──它们也值得惊叹，但不及（使徒的苦难）那样。经上记着说：他们鞭打他，并且「打了许多棍，便将他们下在监里」（使徒行传 16:23）；又说：「众囚犯……歌颂上帝」（使徒行传 16:25）；又说：「用石头打他，以为他死了，就拖到城外。」（使徒行传 14:19）。
  - type: paragraph
    text:
      ru: 'Если хотите узнать, как много значат оковы, ради Христа налагаемые на тело (Его) раба, – послушайте, что сам Христос говорит:«Блаженны вы». Когда? Когда будете воскрешать мертвых? Нет. Когда же? Когда будете врачевать слепых? И не в этом случае. А когда?«Когда будут поносить вас и гнать и всячески неправедно злословить за Меня»(Мф. 5:11). Если же одно поношение доставляет столько блаженства, то чего не сделает злострадание? Послушай, что говорит сам блаженный (Павел) в другом месте:«а теперь готовится мне венец правды»(2Тим. 4:8). Но узы славнее этого венца. Только бы их мне удостоиться, о другом же я и не рассуждаю. Без всякого воздаяния мне довольно одного страдания ради Христа. Пусть только мне дана будет возможность сказать, что я исполняю«недостаток в плоти моей скорбей Христовых»(Кол. 1:24), и мне ничего более не нужно. И Петр удостоился таких оков. Он, сказано,«спал между двумя воинами, скованный двумя цепями»(Деян. 12:6). Он так был спокоен в узах и так мало скорбел об этом, что мог уснуть: не овладел бы им глубокий сон, если бы он находился в большом беспокойстве. Он спал между воинами, –«И вот, Ангел Господень предстал, и свет осиял темницу.Ангел, толкнув Петра в бок, пробудил его»(Деян. 12:7). Если бы кто мне сказал: чем хочешь ты быть – ангелом ли, толкнувшим Петра, или спасенным Петром? Я предпочел бы быть Петром, для которого приходил и ангел. Мне были бы сладостны эти узы. А зачем же, скажет кто-нибудь, он молился (по освобождении из темницы), как будто он освободился от величайшей беды? Не дивись этому. Он молился потому, что боялся умереть. Умереть же боялся потому, что хотел еще жить для страданий. Послушай, что говорит об этом и сам блаженный Павел:«имею желание разрешиться и быть со Христом, потому что это несравненно лучше, а оставаться во плоти нужнее для вас»(Фил. 1:23–24). Это же далее он назвал и даром:«потому что вам дано ради Христа не только веровать в Него, но и страдать за Него»(Фил. 1:29). Таким образом последнее больше первого, – потому что"вам дано". Поистине это величайший дар, и больший всех (других даров), – и дара остановить солнце и луну, и дара подвигнуть мир. Это больше власти над демонами, или силы изгонять демонов. Они не столько страдают, когда мы изгоняем их верой, сколько тогда, когда видят, что мы ради Христа терпим бедствия и бываем в узах. Это дает нам большее дерзновение (к Христу). Хорошо быть в узах ради Христа не потому, что они доставляют нам царство, а потому, что это бывает ради Христа. Не потому я ублажаю узы, что они (как бы) наперед открывают путь к небу, а потому, что они претерпеваются ради Владыки неба.'
      cn: '倘若您想知道，为了基督，加诸祂仆人身体上的枷锁意义何等重大，请听基督亲自说了什么：


        「福哉你们！」何时？当你们使死人复活之时吗？不。又何时？当你们医治瞎眼的人之时吗？也不是这样。那是何时呢？「人若因我的缘故辱骂你们，逼迫你们，捏造各样坏话毁谤你们，福哉你们！」（马太福音 5:11）。倘若单单的辱骂就能带来如此大的福分，那么受苦又能带来什么呢？


        请听蒙福的（保罗）在另一处说了什么：「从此以后，有公义的冠冕为我存留。」（提摩太后书 4:8）。但枷锁比这冠冕更荣耀。只愿我能蒙受这些（枷锁），其他我毫不考虑。无需任何回报，单单为基督受苦就已足够。只愿我能有机会说我补满了「基督患难的缺欠，在我肉身中补满」（歌罗西书 1:24），我便别无所求。


        彼得也蒙受了这样的枷锁。经上说他「睡在两个兵丁当中，被两条铁链捆锁」（使徒行传 12:6）。他在枷锁中如此平静，对此几乎不感到悲伤，以至于他能入睡：倘若他处于极度不安中，深沉的睡眠是不会临到他的。他睡在兵丁当中——「忽然，上主的使者显现，光照亮了监牢。使者推彼得的肋旁，唤醒了他。」（使徒行传 12:7）。倘若有人对我说：你想成为什么——是那推彼得的使者，还是蒙拯救的彼得？我宁愿成为彼得，因为连使者也为他而来。这些枷锁对我而言将是甘甜的。然而有人会说，他（从监牢获释后）为何祈祷，仿佛他从极大的灾祸中得以解脱一样？对此不必惊讶。他祈祷是因为他害怕死亡。他害怕死亡，是因为他渴望继续活着受苦。请听蒙福的保罗对此说了什么：「我情愿离世与基督同在，因为这是好得无比的；然而，留在肉身中，对你们更是需要的。」（腓立比书 1:23-24）。他接着将此称为恩赐：「因为你们蒙恩，不但在基督里信祂，而且要为祂受苦。」（腓立比书 1:29）。


        如此一来，后者大于前者——因为「你们蒙恩」。这确实是最大的恩赐，比一切（其他恩赐）都大——比停止日月运行的恩赐，比撼动世界的恩赐都大。这比辖制邪魔的权柄，或赶逐邪魔的力量更大。当我们凭着信心赶逐它们时，它们所受的苦，远不如看到我们为了基督忍受苦难、身陷枷锁之时所受的苦。这赐予我们更大的（向着基督的）坦然无惧。为了基督身陷枷锁是好的，并非因为它们为我们带来国度，而是因为这是为了基督的缘故。我称枷锁为福，并非因为它们（仿佛）预先开启了通往天堂的道路，而是因为它们是为了天堂的君主而忍受的。'
  - type: paragraph
    text:
      ru: 'Знать (апостолу), что он претерпевал узы ради Христа, – сколько в этом утешения для него! Сколько радости! Сколько чести! Сколько славы! Я сам желал бы всегда говорить об этом, желал бы хотя прикоснуться к этим оковам; но как я лишен этого счастья на деле, то по крайней мере мысленно, через искреннее желание заключаю в них свою душу. Вследствие землетрясения, сказано, поколебалась темница со связанным Павлом,«и у всех узы ослабели»(Деян. 16:26). Видишь ли свойство уз разрешать узы? Как смерть Господа умертвила смерть, так и Павловы узы разрешили узников, поколебали темницу, отворили двери. Впрочем естественная сила уз не такая, а (совершенно) противоположная – крепко содержать узника и не расторгать пред ним стен (темницы). А то свойство, (о котором мы говорим), принадлежит не простым узам, но узам ради Христа.«Страж... в трепете припал к Павлу и Силе»(Деян. 16:27, 29). Этого не делают обыкновенные узы, связавших не приводят к ногам связанных, а напротив подчиняют последних первым. А теперь свободный был у ног узника; связавший просил связанного, чтобы этот освободил его от страха. Скажи мне, не ты ли связал его? Не ты ли заключил его во внутреннюю темницу? Не ты ли наложил на ноги его колодку? Что же трепещешь? Что смущаешься? Что плачешь? Зачем обнажил меч? Никогда, говорит, не случалось мне вязать таких (людей); я не знал, что такова сила узников Христовых. Что говоришь ты? Они получили власть отверзать небеса: ужели они не отворят темницы? Они разрешали связанных демонами: ужели железо будет сильнее их? Ты не знал этих мужей, потому и достоин извинения. Связанный – Павел, которого чтут все ангелы, – Павел, платки и убрусы которого прогоняли демонов и исцеляли болезни. А демонские узы много крепче и неразрывнее железных, потому что первыми оковывается душа, а последними – тело. Итак, освобождающий связанные души неужели не мог освободить своего тела? Расторгавший узы демонов ужели не расторг бы железных уз? Разрешавший тех узников и освобождавший от власти демонов посредством своих одежд разве не освободился бы сам собою? Он был прежде связан; потом разрешил связанных, чтобы показать тебе, что рабы Христовы связанные имеют гораздо более силы, чем свободные от уз. Не было бы так удивительно, если бы он это сделал, будучи свободным от уз. Значит, узы были причиной не слабости, а большей силы. Так сила святого блистательнее открывается тогда, когда, и связанный, он повелевает свободными от уз, когда – сам узник – он освобождает не только себя, но и других узников. Какая польза от стен? Какая (польза) от того, что он был ввергнут во внутреннюю темницу, когда отворил и наружную? Но почему это совершилось ночью и с землетрясением? Впрочем я уклонился от апостольских слов, слишком много занялся апостольскими делами; но будьте несколько снисходительны ко мне, и позвольте мне усладиться Павловыми узами, – позвольте еще долее остановиться на них. Я взялся за узы, и – никто меня не отогнет от них. Я теперь крепче связан любовью, чем он тогда оковами. Этих уз никто не разорвет, потому что они – от любви Христовой. Их не могут разрешить ни ангелы, ни царство небесное. Послушаем, что говорит об этом сам Павел:«ни Ангелы, ни Начала, ни Силы, ни настоящее, ни будущее, ни высота, ни глубина, ни другая какая тварь не может отлучить нас от любви... Христовой» (Рим. 8:38–39).'
      cn: '对这位使徒而言，得知他为基督的缘故忍受了捆锁——这对他来说是何等大的安慰！何等大的喜乐！何等大的尊荣！何等大的荣耀！我自己也渴望常谈论此事，渴望哪怕只是触摸这些铁链；但因我实际上无此福分，那么至少在心神中，藉着真诚的渴望，我将我的灵魂囚禁其中。


        圣经记载，因着地震，囚禁着保罗的监牢震动了，「众人的锁链都松开了」（使徒行传 16:26）。你看见了吗，捆锁解开捆锁的本性？正如上主的死亡使死亡归于死寂，同样，保罗的捆锁也解开了囚犯，震动了监牢，敞开了牢门。然而，捆锁的自然力量并非如此，而是（完全）相反的——它们是牢牢地束缚囚犯，而不应在他面前破裂（监牢的）墙壁。而我们所谈论的这种本性，并非属于普通的捆锁，而是属于为基督缘故的捆锁。「禁卒……战战兢兢地俯伏在保罗和西拉面前」（使徒行传 16:27，29）。普通捆锁做不到这一点，它们不会把捆绑人的人带到被捆绑者的脚下，相反，它们是使后者顺从前者。然而此刻，那自由的却在囚犯的脚下；那捆绑人的恳求被捆绑的，好让他从恐惧中得到释放。


        告诉我，难道不是你捆绑了他吗？难道不是你把他关押在内层监牢里吗？难道不是你给他戴上脚镣吗？为何战兢？为何惊慌？为何哭泣？为何拔出剑来？他说，我从未捆绑过这样的人；我不知道基督的囚犯竟有如此的力量。你说什么？他们得到了开启天堂的权柄：难道他们还不能打开监牢吗？他们曾解开被邪魔捆绑的人：难道铁会比他们更强大吗？你不认识这些人，因此值得宽恕。


        那被捆绑的是保罗，他是为众天使所敬奉的——保罗，他的手帕和围裙曾驱逐邪魔，治愈疾病。而邪魔的捆锁远比铁链更坚固，更不可断裂，因为前者是束缚灵魂的，而后者是束缚身体的。那么，那能释放被捆绑灵魂的人，难道不能释放自己的身体吗？那能解开邪魔捆锁的人，难道不能解开铁链的捆锁吗？那能藉着自己的衣物解开那些囚犯，使他们脱离邪魔权势的人，难道不能靠自己得到自由吗？他是先被捆绑，然后才解开了被捆绑的人，好向你表明，基督的仆人即使被捆绑，也比没有捆绑的更具力量。如果他是在没有捆绑的情况下做到这一点，那就不足为奇了。因此，捆锁并非软弱的原因，而是更大力量的原因。如此，圣者的力量就更显赫地展现出来，当他即便被捆绑，却能命令那些没有捆绑的人时；当他——身为囚犯——不仅释放了自己，也释放了其他囚犯时。墙壁有何益处？当他连外面的（监牢）也打开时，他被投入内层监牢又有何益处呢？


        但为何此事发生于夜间并伴随着地震呢？然而，我已偏离了使徒的教导，过多地沉湎于使徒的事迹了；但请对我稍加宽容，允许我陶醉于保罗的捆锁之中——允许我再多停留片刻。我抓住了这捆锁，没有人能将我从它们身边拉开。我现在被爱捆绑得比他那时被铁链捆绑得更紧。这些捆锁没有人能挣断，因为它们源自基督的爱。无论是天使，还是天国，都不能解开它们。让我们听听保罗自己对此说了什么：「无论是天使，是掌权的，是有能的，是现在的事，是将来的事，是高处的，是深处的，是别的受造之物，都不能叫我们与基督的爱隔绝」（罗马书 8:38-39）。'
  - type: paragraph
    text:
      ru: 'Для чего же это совершилось среди ночи, для чего с землетрясением? Внимайте Божью домостроительству и дивитесь. Узы ослабли у всех и отворились двери. Но это было сделано только для темничного стража, не для того, чтобы показать (ему силу уз), а для его спасения. Узники не знали, что они разрешены, как это видно из Павлова восклицания. Что именно говорится?«Но Павел возгласил громким голосом, говоря: не делай себе никакого зла, ибо все мы здесь»(Деян. 16:28). Не были бы все (в темнице), если бы знали, что двери отворены, и сами они освобождены от уз. Те, которые разламывают стены, проникают через кровли и заборы, и решаются на все, будучи в оковах, не остались бы, когда и узы были разрешены, и двери отворены, и сам темничный страж спал. Но вместо уз железных на них были узы сна. Так устроено было для того, чтобы и дело совершилось, и от чуда не произошло никакого вреда для темничного стража, который должен был спастись. Притом узники особенно крепко связываются ночью, а не днем. Поэтому можно было их видеть опять связанными с большим старанием и погруженными в сон. Если же бы это совершилось днем, то произошло бы большое смятение. Для чего же было потрясено здание? Для того, чтобы темничный страж пробудился и увидел совершившееся, так как он один был достоин спасения.'
      cn: 这事为何发生在夜间，又为何伴随着地震呢？你们当留心上帝的救世计划，并为此惊叹吧。所有人的锁链都松脱了，门也开了。但这事发生仅仅是为了那个狱卒，不是为了向他展示（锁链的力量），而是为了他的救恩。囚犯们并不知道他们已得解脱，正如从保罗的呼喊中可见。具体说了什么呢？「不，保罗大声喊着说：不要伤害自己，因为我们都在这里。」（使徒行传 16:28）如果他们知道门已开，且他们自己已从锁链中被释放，他们就不会全部（留在狱中）了。那些在被镣铐束缚的情况下，尚且能打破墙壁，穿过屋顶和围栏，敢于做任何事的人，当锁链已被解开，门也已敞开，并且狱卒自己也睡着了的时候，他们是不会留下来的。但取代了铁链的，是睡意将他们束缚。如此安排，是为了使这事得以成就，并且这神迹不会对理当得救的狱卒造成任何伤害。再者，囚犯们在夜间会特别牢固地被捆绑，而不是在白天。因此，可以看到他们再次被格外仔细地捆绑着，并沉浸在睡梦中。如果这事发生在白天，就会发生大骚乱。那么，建筑物为何被震动呢？是为了让狱卒醒来，并看到所发生的事，因为他是唯一配得救恩的人。
  - type: paragraph
    text:
      ru: 'Здесь, прошу тебя, посмотри на обилие благодати Христовой. Говоря о Павловых узах, благовременно вспомнить о благодати Христовой, тем более, что самые узы составляют дело благодати Божьей. Некоторые осуждают за то, что спасен был темничный страж, тогда как в этом случае и должно бы подивиться человеколюбию Божьему. И неудивительно. Таково свойство (людей) немощных, что они порицают даже питательность пищи, которую следовало бы хвалить, и мед называют горьким. (Людей) больных глазами ослепляет свет, который должен бы был светить им, хотя это зависит не от естественного свойства света, но от немощи тех, которые неспособны пользоваться им, как должно. Что же они говорят? Тогда как следовало бы удивляться, что он (апостол) спас человека, впавшего в крайнее бедствие, и сделал его лучшим, – они говорят: каким образом (страж) не счел этого делом волшебства и чародейства, и еще более не стерег их и закричал на них? Но он при этом многое сообразил: во-первых, то, что слышал, как они воспевали Бога, – чародеи не стали бы петь таких песнопений, а он, сказано, слышал их воспевающих Бога (Деян. 16:25); во-вторых, то, что он не только не убежали, но и не допустили его убить себя. Если бы они для самих себя сделали это, то не оставались бы в темнице, но первые освободились бы сами. Велико и человеколюбие их: они воспрепятствовали умертвить себя тому, кто связал их, как бы так говоря ему: ты весьма крепко стерег нас, заключивши во внутреннюю темницу и связавши тяжкими оковами, – для того, чтобы самому тебе освободиться от тягчайших уз. Каждый (человек) связан узами своих грехов. Эти последние узы достойны проклятий, а те (узы) – блаженные и заслуживающие того, чтобы их испрашивать великими молитвами. Апостол чувственным образом показал, как последние (вещественные) узы освобождают от первых (уз духовных). Ты видел, как они освободились от железных уз, которыми были связаны? Увидишь, что и ты сам разрешен от других тяжких уз. Эти узы, – разумею не Павловы, а узников, – происходят от греховных уз. В темнице были двоякого рода узники, и сам страж был узником. Те были связаны железом и грехами, а он – только грехами. Павел освободил их в удостоврение его, – так как узы были видимы. И Христос поступил также, или лучше – наоборот. Там было двоякое расслабление. Какое именно? Греховное и телесное. Что же он делает?"Дерзай, – говорит, –чадо! прощаются тебе грехи твои»(Мф.9:2). Сначала исцелил от расслабления душу, потом переходит и к телу. А именно, когда«некоторые из книжников сказали сами в себе: Он богохульствует. Иисус же, видя помышления их, сказал: для чего вы мыслите худое в сердцах ваших? ибо что легче сказать: прощаются тебе грехи, или сказать: встань и ходи? Но чтобы вы знали, что Сын Человеческий имеет власть на земле прощать грехи, – тогда говорит расслабленному: встав, возьми постель твою, и иди в дом твой»(Мф.9:3–6). Он подтвердил умственное чувственным, телесным доказал то, что относилось к душе. Для чего Он поступил так? Чтобы исполнилось сказанное:«твоими устами буду судить тебя, лукавый раб!»(Лк. 19:22). Что же (говорят) они? «Никто кроме Бога не имеет власти прощать грехи», т. е. ни ангел, ни архангел, ни другая сотворенная сила. Вы сами признали это. Что же Ему должно было сказать? Если будет показано, что Я отпускаю грехи, то ясно, что Я – Бог? Но Он не сказал этого, а что?«Но чтобы вы знали, что Сын Человеческий имеет власть на земле прощать грехи, – тогда говорит расслабленному: встань, возьми постель твою, и иди в дом твой». Итак, когда Я, говорит, сделаю более трудное, тогда, очевидно, уже не должно оставаться никакого неверия и спора о том, что гораздо легче. Потому-то и совершил Он прежде духовное исцеление, что много было противоречивших. А здесь (апостол) к чувственному пришел от умственного. Итак, вера (темничного стража) была не легкомысленна. Он видел узников и ничего не видел и не слышал худого от них. Он видел, что дело было совершено не посредством волшебства, – так как они воспевали Бога; видел в происходившем дело их великого человеколюбия, – так как они не мстили ему, хотя и могли. Они могли бы уйти (из темницы), освободив как самих себя, так и других узников, и если не узников, то, по крайней мере, самих себя; но не сделали этого. Итак он почувствовал уважение (к апостолу) не за чудо только, но и за самое его поведение. Как он (Павел) воскликнул?«Не делай себе никакого зла, ибо все мы здесь». Видишь ли, как он, в самом деле, чужд тщеславия и гордости и какой исполнен любовью? Не сказал, что это случилось для нас, но точно один из узников говорит:«ибо все мы здесь». Между тем, если бы они (Павел и Сила) не прежде этого и не посредством чуда освободились, им надлежало бы молчать и освободить всех узников. А если бы они молчали и не остановили его рук громким воззванием, то (страж) пересек бы себе горло мечем. (Апостол) и потому сделал это воззвание, что был заключен в самое дальнее отделение темницы. Ты, говорит, поступил во вред себе, ввергнув во внутреннюю темницу тех, которые освободят тебя от опасности. Но они не подражали тому, что он делал. И если бы он умертвил себя, то все узники разбежались бы.'
      cn: 此处，我请你看基督丰盛的恩典。谈及保罗的锁链时，正当回想起基督的恩典，更何况这些锁链本身就是上帝恩典的作为。有些人谴责说狱卒被拯救了，而在此情况中，本应惊叹于上帝的仁慈。这并不奇怪。软弱之人的本性如此：他们甚至非议本应赞扬的食物营养，并称蜜糖为苦涩的。眼疾之人被本应照亮他们的光蒙蔽了，尽管这不取决于光的自然属性，而是取决于那些无法正确使用光之人的软弱。那么他们说什么呢？既然本应惊叹于他（使徒）拯救了一个身陷极度困境之人，并使他变得更好，他们却说：狱卒怎么没有将这视为巫术和魔法的作为呢，并且为何他反而没有更加看守他们，反而向他们大喊呢？但他同时想通了许多事：首先，他听见他们颂赞上帝——巫师是不会唱这种颂歌的；并且，经上说，他听见他们颂赞上帝（使徒行传 16:25）；其次，他们不仅没有逃跑，而且也没有允许他自杀。如果他们是为了自己这样做，那么他们就不会留在监狱里，而是首先自行解脱了。他们的仁慈也十分伟大：他们阻止了捆绑他们的人自杀，仿佛在对他说：你把我们看守得非常严密，把我们关在内监，用重镣捆绑——为的是让你自己从更沉重的锁链中解脱出来。每个人都被自己的罪的锁链捆绑着。这后一种锁链是可咒诅的，而那些（锁链）却是蒙福的，并值得以虔诚的祷告祈求的。使徒以可感知的方式表明，后来的（物质的）锁链如何从最初的（属灵的）锁链中解脱。你看到了吗，他们是如何从捆绑他们的铁链中解脱出来的？你将看到，你自己也从其他沉重的锁链中被释放了。这些锁链——我指的是并非保罗的，而是囚犯的——源于罪的锁链。监狱里有两种囚犯，狱卒本人也是囚犯。那些人被铁链和罪捆绑着，而他——只被罪捆绑着。保罗释放了他们，以证实他（的说法/能力），因为锁链是可见的。基督也这样行了，或者说，更好的是——恰恰相反。那里有两种瘫痪。究竟是哪两种？罪的（瘫痪）和身体的（瘫痪）。那么他做了什么呢？「孩子，放心吧！你的罪赦了。」（马太福音 9:2）。首先医治了灵魂的瘫痪，然后也转向了身体。确切地说，当「有些文士心里说：这个人说僭妄的话了。耶稣知道他们的心意，就说：你们心里为什么存着恶念呢？或说：你的罪赦了，或说：起来行走，哪一样容易呢？但要叫你们知道，人子在地上有赦罪的权柄——就对瘫痪的人说：起来，拿起你的床，回家去吧！」（马太福音 9:3-6）。他以可感知的事物证实了智性的（事物），以身体的（痊愈）证明了属灵的（痊愈）。他为何这样做呢？为了成就经上所说：「我要凭你的口定你的罪，你这恶仆！」（路加福音 19:22）。那么他们（文士）说什么呢？「除了上帝，没有人有赦罪的权柄」，即，天使、天使长或其他受造之物都没有。你们自己承认了这一点。那么他本该说什么呢？如果证明我赦免罪孽，那么就很清楚我就是上帝了吗？但他没有这样说，而是说了什么呢？「但要叫你们知道，人子在地上有赦罪的权柄——就对瘫痪的人说：起来，拿起你的床，回家去吧！」因此，他说，当我做更难的事时，那么，显然，对于那更容易的事就不应再有任何不信和争议了。正因如此，他才先进行了属灵的医治，因为有许多人反对。而在此处（使徒）则是从智性的（事物）转向了可感知的（事物）。因此，（狱卒的）信仰并非轻率。他看见了囚犯，却没有从他们那里看见或听见任何坏事。他看见这事并非借由巫术完成——因为他们颂赞上帝；他在所发生的事中看见了他们极大的仁慈——因为他们没有报复他，尽管他们本可以。他们本可以离开（监狱），释放自己以及其他囚犯，如果不是囚犯，那么至少是他们自己；但他们没有这样做。因此他（对使徒）产生了敬意，不仅是因着神迹，更是因着他（使徒）的行为本身。他（保罗）是如何呼喊的呢？「不要伤害自己，因为我们都在这里。」你看，他确实远离虚荣和骄傲，并且充满了何等的爱？他没有说这事是为我们而发生的，而是仿佛其中一个囚犯在说：「因为我们都在这里。」然而，如果他们（保罗和西拉）不是在这之前，也不是借由神迹而获得自由，他们本该保持沉默，并释放所有囚犯。而如果他们保持沉默，没有用响亮的呼喊阻止他（狱卒）的手，那么（狱卒）就会用刀剑割断自己的喉咙。（使徒）发出这呼喊也是因为他被关在监狱最深处。他说，你损害了自己，把那些将要从危险中解救你的人投入内监。但他们并没有模仿他（狱卒）所做的事。如果他自杀了，那么所有囚犯都会逃散。
