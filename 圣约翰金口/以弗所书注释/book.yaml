      cn: '1.'
    text:
      ru: 'В этих словах открыта для нас великая и более (всяких) отличий блистательная сила Павловых уз. И (Павел) не напрасно, как кажется, и не без цели показывает эту силу, но чтобы ею более пристыдить их. Что он говорит?«Итак, я, узник в Господе, умоляю вас поступать достойно звания, в которое вы призваны». Как (ходить)?«Со всяким смиренномудрием и кротостью и долготерпением, снисходя друг ко другу любовью». Значит, хорошо быть узником, но не просто, а ради Христа; потому он и сказал:«узник в Господе», т. е. ради Христа. С этим ничто не может сравниться! Но узы (Павла), отвлекая нас от настоящего предмета речи, привлекают (к себе), и, будучи не в силах противиться этому влечению, мы говорим о них как бы невольно, а вернее – и с охотой и с молитвой. О, если бы всегда можно было беседовать об этих узах! Но будьте терпеливы: я хочу сказать еще о том, что бывает предметом внимания у многих, и о чем говорят так: если скорби благое дело, то как же он, защищаясь пред Агриппою, сказал:«молил бы я Бога, чтобы мало ли, много ли, не только ты, но и все, слушающие меня сегодня, сделались такими, как я, кроме этих уз»(Деян. 26:29)? Он так говорил не потому, что считал скорби унизительным для себя делом, – нет; если бы это было так, если бы в самом деле они были унизительны, то он не похвалился бы ни узами, ни заключением под стражу, ни другими бедствиями, и не сказал бы:«я гораздо охотнее буду хвалиться своими немощами»(2Кор. 12:9). Что же это значит? То, что он считал великим делом узничество. Но как к Коринфянам писал:«Я питал вас молоком, а нетвердойпищей, ибо вы были еще не в силах, да и теперь не в силах»(1Кор. 3:2), так и здесь (случилось, что) не могли слушать его учения о красоте, величии и пользе узничества: потому он и сказал:«кроме этих уз». Напротив, к Евреям он писал не так, а советовал им разделять узы с узниками. Поэтому и сам радовался за узы, отдавался в оковы и с узниками был отводим под стражу. Велика сила Павловых уз! Вместо всех зрелищ довольно одного этого – видеть Павла связанным и ведомым из темницы. Что может быть выше удовольствия видеть его в узах и сидящим в темнице? Как оценить мне это удовольствие?'
      cn: '在这些话语中，向我们揭示了保罗捆锁那伟大且超越一切卓越的光辉灿烂的力量。而（保罗）似乎并非徒然，也并非漫无目的地展现这力量，而是为了借此更深地使他们蒙羞。他说了什么？「所以，我这在主里的囚犯，恳求你们行事为人与你们蒙召的召叫相称。」如何（行走）？「凡事谦卑柔和，恒久忍耐，在爱中彼此宽容。」这就意味着，作囚犯是好的，但并非普通的囚犯，而是为基督的缘故；因此他才说：「在主里的囚犯」，亦即是为基督的缘故。与此相比，世上无物能及！但保罗的捆锁，把我们从当前的论题上引开，吸引着（我们），而且，我们无力抗拒这种吸引，我们谈论它们仿佛是不由自主的，但更准确地说——是带着甘心乐意和祷告的。啊，但愿我们能永远谈论这些捆锁！


        但请耐心：我想再说说许多人关注的问题，并且他们这样说：如果苦难是件好事，那么他向亚基帕王申辩时，为何会说：「我向上帝祈求，无论是少是多，不但你一人，而且今天所有听我说话的人，都像我一样，除了这些捆锁以外。」（使徒行传 26:29）？他这样说，并非因为他认为苦难是对自己的一种羞辱——不；如果真是这样，如果它们当真是一种羞辱，那么他就不会夸耀自己的捆锁，也不会夸耀被监禁，以及其他的苦难，也不会说：「我更情愿夸耀自己的软弱。」（哥林多后书 12:9）。那么，这意味着什么呢？这意味着他认为作囚犯是件伟大的事。但正如他写信给哥林多人说：「我给你们喝的是奶，而不是硬的食物，因为那时你们还不能承受，如今还是不能。」（哥林多前书 3:2），同样，在这里（也发生了）他们不能听从他关于作囚犯之美、伟大和益处教导的事：因此他才说：「除了这些捆锁以外。」相反，他写信给希伯来人时却不是这样，而是建议他们与囚犯一同分担捆锁。因此他自己也为捆锁而欢喜，投入镣铐之中，并与囚犯一同被押送监禁。


        保罗捆锁的力量是何等巨大！胜过一切奇观，只要看到保罗被捆绑着从监狱中带出来，就已足够了。有什么能比看到他身受捆锁，坐在监狱里所带来的喜悦更伟大呢？我该如何评价这种喜悦呢？'
  - type: paragraph
    text:
      ru: 'Не видите ли вы царей и консулов, едущих на колесницах, убранных в золото, и их телохранителей, также имеющих на себе все золотое, – золотые копья, золотые щиты, золотом убранную одежду, в золотых попонах коней? Но сколько первое зрелище приятнее последнего! Я бы желал лучше однажды взглянуть на Павла, с узниками выходящего из темницы, нежели тысячи раз видеть этих людей в сопровождении их копьеносцев. Сколько ангелов, думаете вы, предшествовало (Павлу), когда таким образом выводили его? Что я не лгу, это может подтвердить вам пример из древней истории. Елисей пророк, которого вы, быть может, знаете, во время войны сирийского царя с израильским, сидя дома, открывал придворные совещания царя сирийского со своими советниками и делал безуспешными его действия, наперед высказывая его тайные намерения, и таким образом не допускал (израильтян) впадать в те сети, которые расставлял им этот царь. Это беспокоило и устрашало последнего, и он был в большом недоумении оттого, что не знал, кто обнаруживает все его мысли, следит за ним и делает безуспешными его замыслы. Но когда царь находился в этом неведении и старался узнать причину (неуспешности своих предприятий), один из телохранителей сказал ему, что в Самарии живет пророк, по имени Елисей, и что он-то и разрушает планы царя тем, что открывает их. Царь думал, что он все узнал, но на самом деле ничто не могло быть печальнее его положения. Смотри в самом деле: вместо того, чтобы почтить этого человека, удивляться ему и устрашиться той силы, по которой он, находясь на таком большом расстоянии, знает, без чьей бы то ни было передачи, все тайные планы царя, – вместо этого он приходит в раздражение и, увлекаясь только гневом, собирает всадников и воинов и посылает их схватить пророка. У Елисея был ученик, который находился еще, так сказать, в преддверии пророчества и не удостоился таких откровений (какие получал его учитель). Явились воины царя, чтобы связать пророка. Опять встречаемся с узами! Что мне делать? Отовсюду они вплетаются в нашу речь. Увидев множество войска, ученик испугался и, дрожа от страха, прибежал к учителю с известием об этом, по его мнению, несчастии и говорил, что им угрожает неизбежная опасность. Пророк усмехнулся тому, что (ученик его) устрашился того, что не было страшно, и советовал ему ободриться; но последний, как еще несовершенный, не убедился его словами и пораженный тем, что видел, все еще трепетал. Что же пророк?"Господи!– говорит он, –открой ему глаза, чтоб он увидел», что на нашей стороне больше, чем на их. И вдруг видит он: вся гора, на которой жил пророк, наполнена огненными конями и колесницами (4Цар. 6:17). А это было не что иное, как воинство ангельское.'
      cn: '你们岂不见君王与执政官，乘坐着黄金装饰的战车，以及他们的护卫，也都身披黄金之物——黄金长矛、黄金盾牌、以黄金装饰的衣裳，以及披戴黄金马饰的骏马？然而，前者之景象比后者更令人愉悦啊！我宁愿只看一次保罗与囚犯一同走出监牢，也不愿千百次地看见这些人在他们的矛兵护卫下出现。你们认为，当保罗如此被带出时，有多少天使走在他前面呢？我并非虚言，这可以由一个古代历史的例子向你们证实。你们或许认识的先知以利沙，在叙利亚王与以色列王交战时，坐在家中，却能揭示叙利亚王与谋士们在朝廷上的会议内容，预先说出他秘密的意图，使其行动归于徒劳，从而让（以色列人）没有落入那王为他们所设的网罗。这令那王感到困扰和恐惧，他深感困惑，不知是谁揭示了他所有的思想，监视他，并使他的计谋归于徒劳。然而，当那王处于这种无知之中，并试图找出（他计划失败的）原因时，一位护卫告诉他，在撒马利亚住着一位名叫以利沙的先知，正是他通过揭示王的计划来破坏王的计谋。


        那王以为他已经洞悉一切，但实际上，没有什么比他的处境更悲惨的了。且看：他非但不尊敬这个人，不惊叹他，不敬畏那使他在如此遥远的距离之外，无需任何传达，便能知晓王所有秘密计划的能力——相反，他却勃然大怒，只被愤怒所驱使，召集骑兵和步兵，派他们去抓捕这位先知。以利沙有一位门徒，他可以说尚处于预言的门槛，并未蒙受他老师那样的启示。王的兵士出现了，要捆绑这位先知。我们又一次遇到了桎梏！我该怎么办呢？它们无处不在地交织在我们的言谈中。门徒看见了众多的军队，他吓坏了，因恐惧而颤抖，跑到老师那里，告知他（在他看来）的这一不幸，并说，他们正面临着不可避免的危险。先知对他（的门徒）因不应恐惧之事而恐惧感到会心一笑，并建议他振作起来；但门徒，作为一个尚未完全成熟的人，并未被他的话语说服，被他所见的一切所震慑，仍在颤抖。先知又做了什么呢？他说：「上主啊！求祢开他的眼睛，使他能看见，我们这边的比他们那边的更多。」忽然，他看见：先知所住的整座山，都充满了火车火马（列王纪下 6:17）。而这，正是天使的军队。'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Если Елисея, для такого только случая, окружало воинство ангельское, то что сказать о Павле? Пророк Давид говорит:«Ангел Господень ополчается вокруг боящихся Его»(Пс. 33:8), и еще:«на руках понесут тебя, да не преткнешься о камень ногойтвоей» (Пс. 90:12). Но что я говорю об ангелах? Сам Владыка был с ним, когда он выходил (из темницы). Его не видал и Авраам. Он не был и с Авраамом; но (теперь) Он сам дал обетование:«Я с вами во все дни до скончания века»(Мф.28:20). Явившись Павлу, сказал:«не бойся, но говори и не умолкай, ибо Я с тобою, и никто не сделает тебе зла»(Деян. 18:9–10). И во сне Он явился ему и сказал:«поспеши и выйди скорее из Иерусалима, потому чтоздесьне примут твоего свидетельства обоМне"(Деян. 22:18). Так дивные святые и всегда исполнены великой благодати, а особенно тогда, когда подвергаются опасности за Христа, когда делаются узниками (за Него). Как на доблестного воина приятно смотреть и во всякое время, а особенно, когда он стоит и сражается подле самого царя, так представляй себе и Павла, которого можно было видеть учащим и в узах. Здесь расскажу то, что, между прочим, пришло теперь мне на мысль. И блаженный мученик Вавила был в узах за то же, за что и Иоанн, – за обличение царя в беззаконии, и, умирая, приказал положить эти узы вместе со своим телом, похоронить себя в узах, и теперь оковы лежат вместе с прахом: такова была любовь его к узам ради Христа!«В железо вошла душа его»(Пс. 104:18), – сказал пророк об Иосифе. Да и женщинам случалось испытать узничество. А мы не хотим связать самих себя! Я советую принять не это (узничество Павлово), – так как теперь не такое время, – но ты, не связывая рук, свяжи свой ум. Есть и еще узы, и кто не носит одних, понесет другие. Слушай, что говорит Христос:«связав ему руки и ноги»(Мф. 22:13). Чтобы не подвергнуться этому узничеству, возложим на себя те узы. Потому (Павел) и сказал:«Итак, я, узник в Господе, умоляю вас поступать достойно звания, в которое вы призваны». И опять: глава у нас Христос. Он совоскресил и спосадил нас на небесных, несмотря на то, что мы так враждебны Ему и сделали столько зла. Велико это звание и к великому (направлено оно)! Велико не потому только, что (Он призвал нас) из такого состояния, но и потому, что призвал на такие дела и таким образом.'
      cn: 如果天使的军旅仅仅为了那样一个场合就围绕着以利沙，那么保罗又当如何说呢？先知大卫说：「上主的使者安营在敬畏祂的人周围」（诗篇 33:8），又说：「他们要用手托着你，免得你的脚碰在石头上」（诗篇 90:12）。但我为何要谈论天使呢？当他出来（从监牢）的时候，主宰亲自与他同在。亚伯拉罕也未曾见过祂。祂也未曾与亚伯拉罕同在；但（现在）祂亲自应许：「我常与你们同在，直到世界的末了」（马太福音 28:20）。祂向保罗显现，说：「不要惧怕，只管讲，不要闭口，因为我与你同在，没有人会加害于你」（使徒行传 18:9-10）。祂又在梦中向他显现，说：「赶紧离开耶路撒冷，因为这里的人必不领受你为我作的见证」（使徒行传 22:18）。因此，奇妙的圣徒们总是充满着莫大的恩典，尤其是在他们为基督身陷危难，为祂成为囚徒的时候。观看一位勇敢的战士，无论何时都令人欣喜，尤其当他站在君王身边作战时更是如此。你也要这样想象保罗：即使身陷捆锁，他仍旧教导。在此，我要顺便讲述我现在想到的一件事。福哉殉道者瓦维拉也因与约翰同样的原因——指责君王的不法之事——而身陷捆锁。他在临终时吩咐将这些捆锁与他的身体一同安放，将自己埋葬在捆锁之中。如今，这些镣铐仍与尘土同在：这就是他为基督之故对捆锁的爱！「他的魂入了铁中」（诗篇 104:18），先知如此论及约瑟。甚至也有妇女经历过囚禁。而我们却不愿束缚自己！我建议不要接受这种（保罗式的囚禁）——因为现在不是那样的时代——但你，不必捆绑双手，却要捆绑你的心思意念。还有别的捆锁，谁若不承担一种，就必承担另一种。听基督所说：「把他手脚都捆起来」（马太福音 22:13）。为了不遭受这种囚禁，我们就要将那些捆锁加于自身。因此（保罗）说：「所以，我这在主里的受捆者恳求你们，行事为人要与你们蒙召的恩召相称。」又说：我们的元首是基督。尽管我们是如此与祂为敌，犯下了诸多罪恶，祂却使我们与祂一同复活，一同坐在天上。这恩召是伟大的，并且指向伟大的目标！它之所以伟大，不仅在于（祂召我们）脱离了如此的光景，更在于祂召我们去行这样的事，并以这样的方式。
  - type: paragraph
    text:
      ru: 'Как же достойно ходить (этого звания)?«Со всяким смиренномудрием». Кто таков, тот достойно проходит (это звание): смиренномудрие есть основание всякой добродетели. Если ты имеешь смирение и помнишь, кто ты и как спасен, то воспоминание об этом служит для тебя побуждением к добродетели. Ты не станешь гордиться ни узами, ни даже тем, что я сказал; но, зная, что все у тебя есть дар благодати, будешь смиряться. Смиренный человек может быть слугой, помнящим благодеяния и признательным за них.«Что ты имеешь, – говорит, –чего бы не получил?»(1Кор. 4:7)? Послушай и еще, что он говорит:«но я более всех их потрудился: не я, впрочем, а благодать Божия, которая со мною»(1Кор. 15:10)."Со всяким, – говорит, –смиренномудрием», – т. е., не в словах и не в делах только, но и в наружных приемах и в тоне речи. Не обращайся с одним смиренно, а с другим дерзко; сохраняй смирение со всяким, друг ли он твой, или враг, знатный, или ничтожный человек: в этом состоит смирение. Также и в других делах наблюдай смирение, потому что Христос говорит:«Блаженны нищие духом», – и это (блаженство) ставит прежде других. Потому-то (апостол) и сказал:«со всяким смиренномудрием и кротостью и долготерпением». В ином есть смирение, но он горяч и раздражителен: тогда смирение не приносит ему пользы; часто, под влиянием гнева, он все теряет."Снисходя, – говорит, –друг ко другу любовью». Как можно терпеть тому, кто раздражителен и клеветник? (Апостол) указал способ:"любовью", – говорит он. Если у тебя нет терпения по отношению к твоему ближнему, то как будет терпеть тебя Бог? Если ты нетерпелив пред своим сорабом, то как потерпит тебя Владыка? Где есть любовь, там все можно перенести."стараясь, – говорит, –сохранять единство духа в союзе мира». Свяжи свои руки узами кротости. Так светлое слово – узы – опять нас озарило; мы оставили его, а оно опять пришло к нам. Хороши и те узы, хороши и эти; но первые – плод последних. Соедини себя с братом: все легко для людей, связанных между собою узами любви. Привяжи себя к нему и его к себе: тогда ты будешь господином не над собою только, но и над другим, сможешь сделать другом своим всякого, кого захочешь. Благодушно"стараясь": дает разуметь, что это дело не простое и не случайное."Стараясь, – говорит, –сохранять единство духа».'
      cn: 如何才能配得上（这称谓）呢？「要以凡事谦卑的心。」凡是这样的人，便能配得上（这称谓）：谦卑是一切美德的根基。假如你心怀谦卑，并且记得你是谁，以及如何得救的，那么，这记忆对你而言，便成了向善的激励。你既不会因锁链而自夸，甚至也不会因我所说的而自夸；而是明白你所有的一切都是恩典的赐予，便会谦卑自己。谦卑的人能成为一个仆人，记念并感恩所领受的恩惠。「你有什么不是领受的呢？」（哥林多前书 4:7）再听听他说的：「我比他们众人更是劳苦；其实不是我，乃是与我同在的上帝的恩典。」（哥林多前书 15:10）「以凡事谦卑的心，」——他说——也就是说，不仅在言语和行为上，也在外在举止和说话语气上。不要对一个人谦卑，却对另一个人傲慢；对待任何人都要保持谦卑，无论是你的朋友，你的仇敌，是显赫之人，还是微不足道之人：这就是谦卑的真谛。在其他事情上，也要谨守谦卑，因为基督说：「虚心的人福哉」，——并将此（福乐）置于其他福乐之上。因此（使徒）也说：「以凡事谦卑、温柔和恒久忍耐的心。」有些人有谦卑之心，但他性情急躁、易怒：这样一来，谦卑对他无益；常常，在怒气的影响下，他会失去一切。「以爱心彼此宽容。」——他说。一个人怎能忍受一个易怒和诽谤的人呢？（使徒）指出了方法：「要凭着爱心。」——他说。假如你对你的近人没有耐心，那么，上帝怎会忍耐你呢？假如你对你的同工不耐烦，那么，上主怎会忍耐你呢？凡有爱之处，一切皆可承受。「竭力」——他说——「以和平为纽带，保守圣灵所赐的合一。」用温柔的锁链束缚你的双手。如此，那光明的词——「锁链」——再次照亮了我们；我们离开了它，它又再次来到我们身边。那些锁链是好的，这些锁链也是好的；然而，前者是后者的果实。与你的弟兄联合：对于那些被爱之锁链彼此相系的人来说，一切都变得轻省。将自己与他连结，将他与你连结：那么你将不只掌管自己，也掌管他人，你将能使任何你愿意的人成为你的朋友。欣然「竭力」：这意味着此事并非简单或偶然。「竭力」——他说——「保守圣灵所赐的合一。」
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Что такое единение духа? Как в теле душа все объемлет и сообщает какое-то единство разнообразию, происходящему от различия членов телесных, так и здесь. Но душа дана еще и для того, чтобы объединять (людей), неодинаковых между собою по происхождению и по образу жизни. Старец и юноша, бедный и богатый, отрок и взрослый, муж и жена, и всякое существо, одаренное душой, есть что-то единое и – это единство более единства телесного. Первое сродство выше последнего, (духовное) единство совершеннее. Союз духовный тем совершеннее, чем проще и однообразнее. А как он сохраняется?«в союзе мира». Его нет там, где вражда и разделение.«Ибо если между вами зависть, споры и разногласия, то не плотские ли вы? и не по человеческому лиобычаюпоступаете?»(1Кор. 3:3)? Как огонь, попадая на сухие деревья, обращает их в один горящий костер, а над влажными не оказывает никакого действия и не соединяет их между собою, – так бывает и здесь: холодность душевная не способствует к соединению, а большей частью теплота. Отсюда происходит и теплота любви. (Апостол) хочет соединить всех нас узами любви. Подобно тому, – говорит он, – как, желая привязать самого себя к другому человеку, ты не иначе можешь сделать это, как, привязав его к себе самому, и если желаешь сделать этот союз взаимным, нужна его привязанность к тебе, – так и здесь, он хочет того, чтобы мы связаны были между собою не одним миром, но одной любовью, но чтобы у всех была одна душа. Это – прекрасные узы: этими узами мы соединяемся и между собою и с Богом. Эти узы не обременяют и не стесняют связанных ими рук, напротив дают им большую свободу, открывают им большее пространство для деятельности и делают узников веселее, чем бывают не связанные. Сильный, находясь в союзе со слабым, укрепляет его и не допускает до погибели, а беззаботного он возбуждает к деятельности.«Брат от брата помогаем,– говорит (Премудрый), –яко град тверд»(Притч.18:19).  Этого союза не может нарушить ни расстояние, ни небо, ни земля, ни смерть, ни что другое; он выше и сильнее всего. Проистекая из единства души, он в одно и то же время может обнимать многих. Слушай, что говорит Павел:«Вам не тесно в нас; но в сердцах ваших тесно. В равное возмездие, – говорю, как детям, – распространитесь и вы»(2Кор. 6:12–13). Что разрушает этот союз? Сребролюбие, властолюбие, честолюбие и многое другое ослабляет и разделяет членов этого союза. Как же устранить этот разрыв? Если не будет этих (страстей), не будет и препятствий для любви.'
      cn: '何为灵性合一？如同在身体里，灵魂包罗万象，并将某种合一赋予由肢体差异所产生的多样性，灵性合一亦然。但灵魂的赐予，亦是为了结合那些出身与生活方式各异的人们。老者与少年，贫者与富者，孩童与成人，丈夫与妻子，以及一切赋有灵魂的生命，都具有某种合一——这合一甚至超越肉身的合一。前者（指灵性合一）的亲近超越后者（指肉身合一），属灵的合一更为完善。属灵的结合越是简朴、越是单一，就越是完善。


        那么，它如何得以维系呢？「在和平的结合中」。凡有仇恨与分裂之处，就无此合一。「因为在你们中间若有嫉妒、纷争和不和睦，你们岂不是属肉体的吗？岂不是照着世人的习性行事吗？」（哥林多前书 3:3）犹如火焰落在干柴上，使它们化作一堆燃着的篝火，而落在湿木上则毫无作用，亦不能将它们彼此联结——此情此景亦然：心灵的冰冷无助于结合，而更多的是热情。由此而生的是爱的热忱。（使徒）愿以爱的纽带将我们所有人联结。他说：「这就像，你若想将自己与另一个人紧密相连，除非将对方也与你自己相连，否则无法做到；而如果你希望这种结合是相互的，就需要对方对你的依恋。此情此景亦然，他希望我们彼此相系，不仅是藉着和平，更是藉着一种爱，更希望我们所有人拥有同一个灵魂。」


        这是美好的纽带：藉着这些纽带，我们彼此相连，也与上帝相连。这些纽带不加重负担，也不束缚被其捆绑的双手；相反地，它们给予更大的自由，为活动开启更广阔的空间，并使被捆绑者比未被捆绑者更喜乐。强者与弱者结合，能坚固弱者，不致使其沉沦；对于懈怠者，他则能激励其投入活动。「弟兄互相扶助，如同坚固的城。」（箴言 18:19）——智者如是说。任何距离、天空、大地、死亡或其他事物，都无法破坏这种结合；它超越并胜过一切。它源于灵魂的合一，能同时容纳许多人。听听保罗怎么说：「你们在我们里面并不狭窄，但在你们心里却狭窄了。你们也要扩张心胸，如同报答我一样——我这话是对待孩子们说的。」（哥林多后书 6:12-13）


        是什么破坏了这种结合呢？贪财、恋权、野心以及许多其他事物削弱并分裂了这种结合的成员。那么，如何消除这种裂痕呢？若无这些（情欲），爱便无障碍。'
  - type: paragraph
    text:
      ru: 'Вот что говорит Христос: когда"умножитсябеззаконие,во многих охладеет любовь»(Мф.24:12). Ничто столько не противодействует любви, как грех, – я разумею не только любовь к Богу, но и к ближнему. Как же, спросят, разбойники живут между собой мирно? Но, скажи мне, когда? Во всяком случае, когда они не ведут разбойнической жизни. Но если они не соблюдают справедливости в разделе добычи и не отдают каждому законной части, то и их видишь во вражде и войне между собою. Так нельзя найти мира там, где злодеяние; но всегда можно найти его там, где живут справедливо и добродетельно. Что еще? Соперники живут ли между собою мирно? Вовсе нет! На кого же прикажешь указать мне? Скупой со скупым никогда не могут иметь мирных отношений. Если бы они были справедливы и уступчивы и не оказывали несправедливости друг другу, то и не было бы этого рода людей. Как два диких голодных зверя, за недостатком добычи, пожирают друг друга, так бывает в обществе (людей) скупых и злых. Таким образом, без добродетели не может быть мира. Составим, если угодно, целое общество из людей любостяжательных, пусть будут все они пользоваться равенством чести, никто не будет их обижать, а они сами будут несправедливы друг к другу: может ли существовать такое общество? Совсем нет! Живут ли мирно любодейцы? Не найдешь и двух согласных между собою. И причина опять та же – охлаждение, а охлаждение любви – следствие умножения беззакония. Оно ведет к себялюбию, оно разрывает и рассекает тело, ослабляет и разрушает его. Напротив, от добродетели происходят совершенно противные действия. Добродетельный человек выше денег. Если бы бесчисленное множество (людей) жило в бедности, они могли бы оставаться в мире между собою. А скупцов, хотя бы сошлось только двое, они никогда не могут сохранять мирных отношений друг к другу.'
      cn: 基督如此说：「当不法的事增多，许多人的爱心才渐渐冷淡了。」(马太福音 24:12) 没有什么比罪更能抵挡爱了，——我所指的不仅是对上帝的爱，也是对邻人的爱。那么，有人会问：强盗们彼此之间岂能平安相处？但是，请告诉我，是何时？无论如何，当他们没有过着强盗生活的时候。但是，如果他们瓜分赃物时不遵守公义，并且不将合法的份额分给每人，那么你就会看见他们彼此之间充满敌意和争战。如此，在邪恶之地找不到平安；但在那些生活公义和有德行之处，总能找到平安。还有什么呢？竞争者们彼此之间能平安相处吗？绝不能！那么，我该指出谁呢？贪婪之人与贪婪之人绝不能有平安的关系。如果他们是公义且互相迁就的，并且不彼此施加不义，那么就不会有这类人了。就像两只饥饿的野兽，由于猎物不足而互相吞噬一样，贪婪和邪恶之人的社会（群体）中也是如此。如此，没有德行便没有平安。如果愿意，让我们建立一个完全由贪财之人组成的社会，让他们都享有平等的尊荣，没有人会冒犯他们，但他们自己却彼此不公：这样的社会能存在吗？绝不能！淫乱之人能平安相处吗？你甚至找不到两个人是彼此一致的。原因又是一样的——冷淡；而爱心的冷淡是不法之事增多的结果。它导致私爱，它撕裂并分离身体，削弱并摧毁它。相反地，从德行却产生截然相反的作用。有德之人超越金钱。即使无数人生活在贫困中，他们也能彼此保持平安。但是贪婪之人，即使只有两个人聚在一起，他们也绝不能彼此保持平安的关系。
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Итак, если в нас есть добродетель, то любовь не погибнет, потому что добродетель от любви, а любовь от добродетели. Объясню – каким образом. Добродетельный человек не предпочитает денег дружбе, он не помнит зла, не оказывает несправедливости ближнему, не наносит ему обид и сам все переносит великодушно. Из этого состоит любовь. Опять, кто любит, тот имеет все эти (качества). Таким образом, одно созидается другим. Отсюда видно, что любовь от добродетели, – на что и указывал (Господь), когда говорил: когда умножится беззаконие,«во многих охладеет любовь». А что добродетель от любви, об этом говорит (апостол):«любящий другого исполнил закон»(Рим. 13:8). Потому необходимо быть одному из двух: или сильно любить и быть любимым, или быть в высшей степени добродетельным. Кто имеет одно, у того необходимо есть и другое; и наоборот, не имеющий любви делает зло, и делающий зло не знает любви. Будем же стремиться приобрести любовь: она предохранит нас от зла. Свяжем себя (узами любви). Пусть не будет у нас ни обмана, ни лукавства. Ничего этого нет там, где есть дружба. Об этом так сказал некий мудрец:«Если ты на друга извлек меч, не отчаивайся, ибо возможно возвращение дружбы. Если ты открыл уста против друга, не бойся, ибо возможно примирение. Только поношение, гордость, обнаружение тайны и коварное злодейство могут отогнать всякого друга»(Сир. 22:23–25). Раскрытие тайны, говорит, удаляет его. Впрочем, если все мы будем дружно жить между собою, то не будет нужды и в тайнах. Как никто не имеет тайны от себя и ничего не может скрывать от самого себя, так – и от друзей. А когда не будет тайн, не возможен будет и разрыв из-за них. Тайны у нас – следствие того, что мы не можем положиться на верность каждого; тайны – плод охлаждения любви. В самом деле, какая может быть у тебя тайна? Хочешь несправедливо поступить со своим ближним? Или – воспрепятствовать ему в получении какого-нибудь блага, и потому скрываешься от него? Или этого ничего нет, но ты стыдишься (высказаться)? А это не признак ли того, что ты не доверяешь ему? При любви не будет ни измены тайне, ни порицания ее. В самом деле, скажи мне, кто и когда поносит сам себя? А если это и бывает, то для пользы. Мы делаем выговоры и детям для того, чтоб исправить их. И когда Христос укорял города (Хоразин и Вифсаиду), говоря:«Горе тебе, Хоразин! горе тебе, Вифсаидо!»(Мф.11:21,Лк.10:13), – то (делал это для того), чтоб избавить их от бесславия. Ничто ведь не имеет такого влияния на душу, ничто столько не способно восстановить ее и исправить ее непостоянство (как обличение). И мы не без намерения обличаем друг друга. В самом деле, за что ты станешь укорять ближнего? За деньги? Не станешь, если свое собственное считаешь общим достоянием. За грехи? Но это не укор, а скорее исправление.«Коварное злодейство», – сказано. Что же, станет ли кто губить и уязвлять себя самого? Никто.'
      cn: '所以，如果我们里面有美德，爱就不会消逝，因为美德源于爱，而爱源于美德。我来解释——是怎样一个道理。有美德的人不看重金钱胜过友谊，他不记仇，不对邻人施加不公，不伤害他，并且自己慷慨地承受一切。爱就由这些构成。反过来，爱人者就拥有所有这些（品质）。如此，一者由另一者建立。由此可见，爱源于美德——这正是上主所指明的，祂曾说：「当不法之事增多时，许多人的爱心会冷却下来。」 而至于美德源于爱，使徒这样说：「爱人的，就完全了律法。」 (罗马书 13:8) 因此，以下两者必居其一：要么强烈地爱并被爱，要么拥有至高的美德。拥有其中一者的人，必然拥有另一者；反之，没有爱的人作恶，作恶的人不认识爱。


        那么，让我们努力获得爱吧：它将保护我们免于邪恶。让我们以爱的纽带束缚自己。愿我们之间没有欺骗，也没有诡诈。在友谊所在之处，所有这些都不存在。某位智者曾这样说：「你若拔刀刺友，不要绝望，因为友谊可能复原。你若开口辱骂朋友，不要害怕，因为和解可能实现。只有诽谤、傲慢、泄露秘密和奸诈的恶行，才能赶走任何朋友。」 (德训篇 22:23-25) 泄露秘密，他说，会使朋友远离。然而，如果我们彼此和睦相处，就不需要有秘密了。正如没有人对自己有秘密，也无法对自己隐瞒任何事，同样——也不能对朋友有秘密。当没有秘密时，也不会因秘密而产生破裂。我们有秘密——是我们无法信赖彼此忠诚的结果；秘密——是爱冷却的果实。


        事实上，你会有什么秘密呢？是想对你的邻人行不公之事吗？还是——想阻止他获得某种益处，所以向他隐瞒？还是这一切都没有，但你感到羞耻（说出来）？而这不正是你不信任他的迹象吗？在爱之中，既不会有秘密的背叛，也不会有对秘密的谴责。事实上，告诉我，谁会何时谴责自己呢？而如果这确实发生，那也是为了益处。我们也责备孩子，是为了纠正他们。当基督斥责哥拉汛和伯赛大两城，说：「祸哉，你哥拉汛！祸哉，你伯赛大！」 (马太福音 11:21，路加福音 10:13) 时，祂（这样做），是为了使它们免于耻辱。没有任何事物能对灵魂产生如此大的影响，没有任何事物能如此有效地恢复它并纠正其反复无常（如同责备）。我们责备彼此，也并非没有意图。事实上，你会为何事斥责邻人呢？为了钱财？你不会的，如果你将自己的财产视为共同所有。为了罪恶？但那不是斥责，而更像是纠正。「奸诈的恶行，」——经文如此说。那么，谁会毁灭和伤害自己呢？没有人。'
  - type: paragraph
    text:
      ru: 'Итак, будем стремиться к любви. Не просто сказано: возлюбим, но будем гнаться (за любовью), т. е. должно употребить большие усилия. (Любовь) скоро исчезает, быстро уходит от нас: так много препятствий встречает она для себя в этой жизни. Если мы гонимся за ней, то она не будет так поспешно оставлять нас, и мы скоро ее привлечем. Любовь Божья соединила небо с землей; любовь Божья посадила человека на царский престол; любовь Божья явила Бога на земле; любовь Божья сделала Владыку рабом; любовь Божья предала Возлюбленного за врагов, Сына за ненавистников, Владыку за рабов, Бога за людей, Свободного за невольников. Но и этим она не ограничилась, а призвала нас ещё к большему. Не только освободила нас от прежнего зла, но и обетовала нам даровать гораздо большее благо. Возблагодарив за все это Бога, постараемся стяжать всякую добродетель, а более всего будем преуспевать в любви, чтоб удостоиться обетованных благ благодатью и человеколюбием Господа нашего Иисуса Христа, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.'
      cn: '那么，我们要追求爱。并非仅仅说：我们要爱，而是要追逐（爱），也就是说，必须付出巨大的努力。（爱）很快就会消失，迅速离开我们，因为它今生遭遇了如此多的障碍。如果我们追逐它，它就不会如此仓促地离开我们，我们也会很快吸引它。


        上帝之爱将天与地连接起来；上帝之爱使人登上王座；上帝之爱在地上彰显了上帝；上帝之爱使主宰者成为仆人；上帝之爱为仇敌舍弃了蒙爱者，为憎恨者舍弃了圣子，为奴仆舍弃了主宰者，为世人舍弃了上帝，为不自由者舍弃了自由者。然而，它并未止步于此，而是召叫我们去追求更大的事。它不仅将我们从往日的罪恶中解救出来，而且应许要赐予我们远超其上的福祉。


        为这一切感谢上帝之后，我们要努力获取一切美德，尤要以爱德为首要追求，以期能蒙受所应许的福祉，这都是借着我们的主耶稣基督的恩典和人慈。祂与父及圣灵，同受荣耀、权能、尊崇，从今时直到永远，世世代代。阿们。'
