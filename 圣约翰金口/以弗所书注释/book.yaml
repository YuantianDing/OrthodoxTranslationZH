  - type: paragraph
    text:
      ru: Предисловие к посланию к Ефесянам
      cn: 以弗所书序言
  - type: paragraph
    text:
      ru: Эфес – главный город (Малой) Азии. Он был посвящен Артемиде, где она и пользовалась особенным уважением, как высшая богиня. И благоговение пред ней её почитателей было так велико, что они не хотели обнаружить имени того, кто сжег храм её; а он был сожжен. Здесь долгое время жил блаженный Иоанн Евангелист, который сюда был сослан (в заточение), здесь и скончался. Апостол Павел здесь оставил, после себя, Тимофея, о чем он говорит в послании к нему:«я просил тебя пребыть в Ефесе»(1Тим.1:3). Здесь были и многие философы, особенно из славившихся в Азии. Говорят, что здесь был и Пифагор, потому что Самос, откуда он происходил, был остров Ионийский. Тоже можно сказать о Пармениде, Зеноне и Демокрите; да и теперь ещё можно найти там многих философов. Об этом мы замечаем не без цели, но чтобы показать, что много нужно было (апостолу) Павлу тщания, когда он писал к ним (ефесянам) своё послание. Говорят, что он, когда ещё (изустно) оглашал их, уже доверил им глубочайшие истины (веры). По крайней мере, само послание исполнено возвышенных созерцаний и догматов. Писано оно из Рима, где (Павел) находился в узах, как он и сам говорит:«молитесь... обомне, дабы мне дано было слово – устами моими открыто с дерзновением возвещать тайну благовествования, для которого я исполняю посольство в узах»(Еф.6:18–20). Оно исполнено весьма возвышенных и необъятных созерцаний; в нем он объясняет то, о чем почти нигде не говорил, например, когда говорит:«дабы ныне сделалась известною черезЦерковьначальствам и властям на небесах многоразличная премудрость Божия»(Еф.3:10); и в другом месте:«и  воскреси с Ним, и посади на небесах ...нас»(Еф.2:5–6); и еще:«которая  не была возвещена прежним поколениям сынов человеческих, как ныне открыта святым Апостолам Его и пророкам Духом Святым, чтобы и язычникам быть сонаследниками, составляющими одно тело, и сопричастниками обетования Его во Христе Иисусе»(Еф.3:5–6).
      cn: 以弗所是（小）亚细亚的主要城市，献给亚底米女神，她在那里备受尊崇，被奉为最高女神。她的敬拜者对她怀有如此深厚的敬畏之心，以至于他们不愿透露焚烧她殿宇之人的姓名；然而，她的殿宇确实已被焚毁。蒙福的圣使徒约翰曾在这里长久居住，他被流放（受监禁）到此地，并在此离世。圣使徒保罗在此地留下了提摩太，正如他在写给提摩太的书信中所说：「我曾请求你留在以弗所」（提摩太前书 1:3）。这里也曾有许多哲学家，尤其是那些在亚细亚享誉盛名者。据说毕达哥拉斯也曾在此，因为他出身的撒摩斯是爱奥尼亚的一个岛屿。巴门尼德、芝诺和德谟克里特亦是如此；甚至直到现在，在那里仍可找到许多哲学家。我们并非无目的地提及此事，而是为了表明（圣使徒）保罗在写信给他们（以弗所人）时，需要付出何等多的心力。据说，当他（口头）教导他们时，就已将最深奥的（信仰）真理托付给他们。至少，这封书信本身就充满了崇高的默观和教义。它写于罗马，当时（保罗）身系囹圄，正如他自己所说：「也要为我祷告，使我得着口才，能以坦然无惧地开讲，将福音的奥秘显明出来，我为这福音的奥秘作了带锁链的使者。」（以弗所书 6:18-20）。这封书信充满了极其崇高而广阔的默观；在其中，他解释了几乎在其他任何地方都未曾提及之事，例如当他说：「为要借着教会使天上执政的、掌权的，现在得知上帝百般的智慧。」（以弗所书 3:10）；以及在另一处说：「又使我们与祂一同复活，一同坐在天上……」（以弗所书 2:5-6）；还有：「这奥秘在以前的世代没有告知世人，如同如今借着圣灵向祂的圣使徒和先知显明一样，就是外邦人在基督耶稣里，借着福音，得以和犹太人同为后嗣，同为一体，同蒙应许。」（以弗所书 3:5-6）。
