  text:
    ru: Беседа 4
    cn: 第 4 讲
  children:
  - type: paragraph
    text:
      ru: Еф.2:1–3.И вас, мертвых по преступлениям и грехам вашим,
      cn: (以弗所书 2:1) 而你们，死在你们的过犯和罪恶之中，
  - type: paragraph
    text:
      ru: в которых вы некогда жили, по обычаю мира сего, поволекнязя, господствующего в воздухе, духа, действующего ныне в сынах противления,
      cn: 你们昔日所活在其中的，随从今世的风俗，随从那掌管空中权柄之君王的旨意，就是那现今运行在悖逆之子心中的灵，
  - type: paragraph
    text:
      ru: между которыми и мы все жили некогда по нашим плотским похотям, исполняя желания плоти и помыслов, и были по природе чадами гнева, как и прочие.
      cn: 我们从前也都生活在他们当中，随从我们肉体的私欲，遵行肉体和心思的意愿，并本为可怒之子，如同其余的人。
  - type: paragraph
    text:
      ru: Опровержение манихеев. – Без милосердия нельзя войти в царство небесное.
      cn: 驳斥摩尼教。— 若无怜悯，便不能进入天国。
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Есть смерть телесная, есть и духовная. Подвергнуться первой – не грешно и не страшно, потому что это – дело природы, а не доброй воли; явившись вследствие первого грехопадения, смерть телесная потом сделалась необходимой для нашей природы, хотя и она скоро упразднится. Другая же смерть – духовная, – так как происходит от доброй воли, подвергает ответственности и не имеет никакого извинения. Но посмотри, как Павел, – показав прежде самым ясным и убедительным образом, что исцелить умерщвленную (грехами) душу гораздо труднее, чем воскресить мертвого, – теперь опять говорит об этом великом (деле человеколюбия Божьего), и излагает его следующим образом."И вас, – говорит он, –мертвых по преступлениям и грехам вашим, в которых вы некогда жили, по обычаю мира сего, поволекнязя, господствующего в воздухе, духа, действующего ныне в сынах противления». Замечаешь ли ты кротость Павла, с какой он увещевает слушателя, нисколько не устрашая его? Сказавши, что вы дошли до крайней степени зла (а быть мертвым это именно и значит), он затем, чтобы не слишком опечалить их (так как люди обыкновенно смущаются, если им выставляют на вид их прежние преступления, будь это преступления гибельные, или не заключающие в себе ничего особенно опасного), указывает им на помощника (который содействовал им дойти до такой степени зла), и на помощника сильного; и это делает с той целью, чтобы они не подумали, будто они одни во всем виноваты. Кто же этот помощник? Дьявол. Подобным же образом (апостол) поступает и в послании к Коринфянам. Сказав:«Не обманывайтесь: ни блудники, ни идолослужители», и затем перечислив и других грешников и прибавив:«Царства Божьего не наследуют», потом говорит:«И такими были некоторые из вас»(1Кор.6:9–11). Не сказал просто:"были", но:«были некоторые», т. е. такими когда-то и вы были.'
      cn: '有身体的死亡，也有灵性的死亡。遭受前者并无罪过，也无需恐惧，因为它乃是自然之事，而非出于人的自由意志；身体的死亡是因着最初的堕落而出现，之后对我们的本性而言变得不可或缺，尽管它也将很快被废除。而另一种死亡，即灵性的死亡，因为它出于人的自由意志，故令人负有责任，并且没有任何借口。


        但你看，保罗——他首先以最清晰和最具说服力的方式表明，医治被（罪恶）致死的灵魂比使死人复活要困难得多——现在又论及这伟大的（上帝施予人类的仁慈之举），并以下列方式阐述：


        「你们这些因过犯和罪恶而死的人，」他说，「你们曾活在其中，随从这世界的风俗，顺从空中掌权者的首领，就是现今在悖逆之子心中运行的邪灵。」


        你注意到保罗的温柔吗，他以此劝慰听众，丝毫不恐吓他们？说你们已达到罪恶的极致（而死就是这个意思）后，他为了不使他们过分忧伤（因为当人们被指出他们过去的罪行时，无论这些罪行是毁灭性的，还是其中不包含任何特别危险的东西，他们通常都会感到困扰），他向他们指明一个帮凶（正是这个帮凶促使他们达到如此罪恶的程度），而且是一个强有力的帮凶；他这样做是为了让他们不要以为自己是所有罪过的唯一责任人。那么这个帮凶是谁呢？魔鬼。使徒在致哥林多人的书信中也以同样的方式行事。他说：「不要受骗：无论是淫乱的，是拜偶像的，」然后列举了其他罪人，并补充说：「都不能承受上帝的国」，接着说：「你们中有些人从前也是这样」（哥林多前书 6:9-11）。他没有简单地说「是」，而是说「有些人是」，也就是说，你们曾经也是这样的人。'
  - type: paragraph
    text:
      ru: 'Тут сильно восстают на нас еретики, которые утверждают, что все это должно быть приписано Богу, и, не удерживая необузданного своего языка, усваивают Богу то, что составляет дело одного дьявола. Чем же мы заградим их уста? Их же словами. Вы признаете же (скажем мы), что Бог правосуден; если же Он это сделал, то это не только не свидетельствует о Его правосудии, а, напротив, показывает крайнюю несправедливость и беззаконие. А беззаконным, без сомнения, Бог никогда не мог быть. Почему (апостол) называет дьявола князем этого века? Потому, что природа человеческая почти всецело предалась ему и все служат ему добровольно и намеренно. Христу, хотя Он обещает бесчисленные блага, никто не внимает; а ему, – хотя он ничего подобного не обещает, а, напротив, препровождает в геенну, – повинуются все. Он властвует в этом веке, у него слуг больше, нежели у Бога, и ему, за исключением немногих, охотнее повинуются, чем Богу; и все это происходит от нашей беспечности."Поволекнязя, – говорит, –господствующего в воздухе, духа». Это говорит (апостол) с тем, чтобы показать, что (дьявол) обитает в поднебесной, что духи воздушные суть бестелесные силы, которые и помогают ему в его действиях. А что власть его (дьявола) есть власть временная (ή αρχή αιώνιος), т. е. что она прекратится вместе с настоящим веком, – послушай, что говорит об этом (апостол) в конце послания:«потому что наша брань не против крови и плоти, но против начальств, против властей, против мироправителей тьмы века сего»(Еф.6:12). Для того же, чтобы, услышав, как (апостол) именует (дьяволов) миродержителями, ты не почел их несотворенными, он прибавляет:"тьмы века". Также и в другом месте, где вовсе нет и речи о творениях, он называет развращенное время«лукавого века»(Гал. 1:4). Мне кажется, что, будучи начальником в поднебесной (прежде, до падения), дьявол не лишился этого начальства и по падении.«Действующего, – говорит, –ныне в сынах противления». Видишь ли, что не насильно, не тирански как-нибудь, но чрез убеждение он привлекает к себе? Указывая на«противление»(απείθεια), (апостол) как бы хочет сказать, что (дьявол) увлекает всех лестью и убеждением. И не этим только (апостол) ободряет, что указывает на сообщника их, но и тем, что самого себя поставляет вместе с ними.«Между которыми, – говорит, –и мы все жили некогда»;"все", потому что нельзя сказать, чтобы хоть кто-нибудь составлял исключение.«По нашим плотским похотям, исполняя желания плоти и помыслов, и были по природе чадами гнева, как и прочие», т. е. не помышляя ни о чем духовном. Но чтобы кто-нибудь не стал подозревать, что это говорится с намерением клеветать на плоть и чтобы не подумал, что вина её в этом слишком уже велика, смотри, как (апостол) предупреждает:"исполняя, – говорит, –желания плоти и помыслов», т. е. увлекаясь похотями и удовольствиями. Раздражили, говорит затем (апостол), мы Бога, прогневали Его, – стали только предметом гнева (Божьего), и ничем другим. Как дитя человеческое, уже по своей природе, бывает человеком, точно так же и мы были чадами гнева.«Как и прочие». Значит, никто не был свободен (от гнева), но все мы, по делам своим, были достойны гнева.«Бог, богатый милостью»(Еф.2:4); не просто говорит: милостив, но:"богатый"; подобным образом и в другом месте говорится:«по множеству милости Твоей»(Пс. 5:8), и еще:«Помилуй меня ...по великой милости Твоей»(Пс. 50:3).«По Своей великой любви, которою возлюбил нас»(Еф.2:4).  Здесь указывает (апостол) на источник любви (Божьей) к нам. Все наши дела были достойны не любви, а гнева и жесточайшего наказания; значит: (если Он возлюбил нас, то единственно) по великой своей милости.«И нас, мертвых по преступлениям, оживотворил с Христом»(Еф.2:5); опять посредник – Христос, и следовательно дело это вполне верно. Если начаток жив, – и мы (будем живы); если Бог Его оживотворил, – (оживотворит) и нас.'
      cn: 在这里，那些异端者们猛烈地攻击我们，他们声称这一切都应归于上帝，并且不约束他们那放肆的舌头，将仅属魔鬼的作为归于上帝。我们将如何堵住他们的口呢？用他们自己的话。你们承认（我们会说）上帝是公义的；若是祂做了这事，那这不仅不能证明祂的公义，反而显明了极端的非义与不法。毫无疑问，上帝绝不可能是不法的。为何（使徒）称魔鬼为这世代的君王呢？因为人性几乎完全向它屈服，所有人都自愿且故意地侍奉它。基督虽然应许无数的福分，却无人理会；而魔鬼——虽然它不应许任何类似之物，反倒引人入地狱——所有人却都顺从它。它掌权于这世代，它的仆役比上帝的更多，除了少数人，众人更乐意顺从它，而非顺从上帝；而这一切都源于我们的疏忽。他（使徒）说：「那掌管空中的君王，就是那灵。」（使徒）如此说，是为了表明（魔鬼）居住在空中世界，空中的灵是无形的力量，它们协助魔鬼的行动。至于它（魔鬼）的权柄是暂时的（希腊文原文为 ή αρχή αιώνιος），也就是说，它将随着这世代一同结束，——请听（使徒）在书信末尾对此的论述：「因为我们争战的对象不是属血肉的，而是对抗执政的、对抗掌权的、对抗这世代幽暗的掌管者。」（以弗所书 6:12）同样，为了让你在听到（使徒）将（魔鬼们）称为「世界的掌管者」时，不至于认为它们是未受造的，他补充说：「这世代的幽暗。」同样在另一处，完全没有提及受造物，他将败坏的时代称为「邪恶的世代」（加拉太书 1:4）。我认为，魔鬼在堕落之前曾是空中世界的首领，堕落之后也未失去这一权柄。他说：「现今在悖逆之子心中运行的。」你看，它并非强迫，也非暴虐地，而是通过说服来吸引人归向它。（使徒）指出「悖逆」（希腊文原文为 απείθεια），似乎是想说（魔鬼）以谄媚和说服来诱惑所有人。（使徒）不仅通过指出他们的同伙来鼓励，也通过将他自己置于他们之中来鼓励。他说：「我们所有人都曾生活在他们当中；」「所有」，因为不能说有任何人是例外。「按照我们肉体的私欲，实行肉体和意念的意愿，并且本为可怒之子，如同其他人一样，」也就是说，不思念任何属灵之事。然而，为免有人怀疑此话是蓄意诽谤肉体，或认为肉体的过错在此过于重大，请看（使徒）如何预先说明：「实行（他所说）肉体和意念的意愿」，也就是说，被情欲和享乐所诱惑。（使徒）接着说，我们惹怒了上帝，激怒了祂，只成了（上帝）愤怒的对象，别无他物。正如人类的孩子，按照其本性，就是人，照样，我们也是可怒之子。「如同其他人一样。」这意味着没有人能免于（愤怒），我们所有人，按照我们的行为，都配受愤怒。「上帝，富于怜悯的」（以弗所书 2:4）；这里不是简单地说：祂是怜悯的，而是说：「富于」；同样在另一处说：「按祢丰盛的怜悯」（诗篇 5:8），又说：「可怜我……按祢浩大的怜悯」（诗篇 50:3）。「因祂用祂那浩大的爱来爱我们」（以弗所书 2:4）。这里（使徒）指出（上帝）对我们之爱的源头。我们所有的行为都配受的不是爱，而是愤怒与最严酷的惩罚；所以：（如果祂爱我们，那也唯独是）因着祂浩大的怜悯。「又使我们这些因过犯而死的人，与基督一同活过来」（以弗所书 2:5）；再次，中保是基督，因此这事是完全真实的。如果初熟之果是活的，——我们（也将是活的）；如果上帝使祂活过来，——（祂也将使）我们活过来。
