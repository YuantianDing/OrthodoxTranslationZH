      ru: 'О чем молился (апостол) вначале, о том и теперь. О чем же он говорил вначале?«чтобы Бог Господа нашего Иисуса Христа, Отец славы, дал вам Духа премудрости и откровения к познанию Его, и просветил очи сердца вашего, дабы вы познали, в чем состоит надежда призвания Его, и какое богатство славного наследия Его для святых, и как безмерно величие могущества Его в нас, верующих по действию державной силы Его»(Еф.1:17–19). И теперь говорит тоже самое:«чтобы вы ...могли постигнуть со всеми святыми, что широта и долгота, и глубина и высота», т. е. (да возможете) с точностью познать тайну домостроительства нашего спасения. Широтой и долготой и глубиной и высотой он называет познание богатства любви Божьей, – того, как она повсюду распространилась. Описывает же ее телесными чертами, приспособляясь к понятиям человеческим; (для того и говорит) что она обняла и верхнее и нижнее и находящееся по сторонам. Мы сказали, говорит, что этому может научить не наше слово, а Святой Дух. Ним"крепко, – говорит, –утвердиться»против искушений и обольщений, – потому что не иначе можно утвердиться в добре, как через испытания и при помощи благодати Божьей. А о том, каким образом Христос обитает в сердцах, послушай, что говорит Он сам: Я«и Отец Мой возлюбит его, и Мы придем к нему и обитель у него сотворим»(Иоан. 14:23). Обитает же не просто, но в сердцах верующих, которые утверждены и не колеблются в любви к Нему.«чтобы вы могли», – говорит, – т. е. нужно много силы. А для чего нужна эта сила, объясняя это, прибавляет:«чтобы вы, укорененные и утвержденные в любви, могли постигнуть со всеми святыми, что широта и долгота, и глубина и высота, и уразуметь превосходящую разумение любовь Христову, дабы вам исполниться всей полнотою Божиею»(Еф.3:18–19). Это значит: хотя любовь Христова и выше всякого человеческого познания, однако вы познаете ее, если в вас будет обитать Христос, – и не только познаете, но«дабы вам исполниться всей полнотою Божиею». Под исполнением же Божьим он или разумеет познание того, как во Отце и Сыне и Св. Духе воздается поклонение Богу, или побуждает к тем подвигам, через которые можно было бы исполниться таких добродетелей, какими исполнен Бог.«А Тому, Кто действующею в нас силою может сделать несравненно больше всего, чего мы просим, или о чем помышляем»(Еф.3:20). Хорошо сказал:"силою", потому что силе свойственно получать то, чего мы никогда и не ожидали. А что (Бог) делает для нас более, чем мы«просим или ...помышляем», это видно из написанного самим (апостолом). Я, – говорит он, – молюсь; а Он и без моей молитвы сделает больше наших прошений, – и не просто только больше или обильнее, но«несравненно больше всего», – выражение, которое показывает особенную великость дара. Откуда же это видно? Из силы, говорит, действуемой в нас, – потому что мы никогда этого не просили и не ожидали.«Тому слава в Церкви во Христе Иисусе во все роды, от века до века. Аминь»(Еф.3:21). Хорошо сделал (апостол), что заключил свое слово молитвой и славословием: должно прославлять и благословлять Даровавшего нам такие блага. Достойно удивления также и то, что за дары, полученные нами от Бога, славит (Его) во Христе Иисусе. Хорошо сказано и это:«Тому слава в Церкви», – потому что известно, чтоЦерковьбудет существовать всегда. А так как она всегда пребывает, то (апостол) хочет, чтобы и мы прославляли Бога до окончания мира, – что и объяснил он, сказавши:«во все роды». Необходимо сказать еще, что такое – отечествия (πατριαί)? Здесь (на земле) под словом отечествия (поколения) разумеются роды; но каким образом будут роды на небе, где никто не родится один от другого? Вероятно (апостол) называет здесь отечествиями небесные сонмы, так как и в Писании поколение Мерарино называется сонмом (Числ. 4:33). Не всего (апостол) просит от Бога, но требует и от них веры и любви, и не просто любви, но любви, вкоренившейся в нас и твердой, такой любви, которой бы и ветры не поколебали, и иное что не разрушило. (Апостол) сказал, что скорби составляют славу; если же таковы мои скорби, тем более таковы ваши собственные.'
      cn: '（使徒）起初所祷告的，如今也如此。那么他起初说了什么呢？

        「愿我们主耶稣基督的上帝，荣耀之父，赐给你们智慧和启示的圣灵，使你们真知道祂；并且照明你们心中的眼睛，使你们知道祂呼召的盼望是何等，祂在圣徒中所得基业的荣耀是何等丰盛；并知道祂向我们这信的人所显的能力，是何等浩大，是照着祂大能的作为运行的。」(以弗所书 1:17-19)

        如今他也说同样的话：

        「好使你们……能与众圣徒一同领悟，何为那阔、长、深、高」，即是（愿你们能够）精确地认识我们救赎的奥秘。他称阔、长、深、高为认识上帝之爱的丰盛——即它的爱如何遍及万方。他以物质的特征来描绘它，以适应人类的理解；（因此他说）它包容了上部、下部和四周。他说，我们曾说过，能教导这一切的不是我们的话语，而是圣灵。他说，藉着圣灵，要「坚固地建立」自己，以抵挡试探和诱惑，——因为唯有通过考验和藉着上帝的恩典，才能在善中得以坚固。至于基督如何住在心中，请听祂自己所说的：「我父必爱他，我们也要到他那里去，并且要在他那里造一个居所。」(约翰福音 14:23) 祂的居住并非简单，而是在那些坚固不移、对祂的爱毫不动摇的信徒心中。「使你们能够」，他说，这意味着需要极大的力量。至于为何需要这力量，他解释道，并补充说：

        「使你们在爱中生根立基，能与众圣徒一同领悟，何为那阔、长、深、高，并认识那超越知识的基督的爱，使你们被上帝一切的丰盛所充满。」(以弗所书 3:18-19)

        这意味着：虽然基督的爱超越一切人类的知识，但如果基督住在你们里面，你们就能认识它，——不仅能认识，而且「使你们被上帝一切的丰盛所充满」。至于上帝的充满，他或是指认识如何在父、子和圣灵中向上帝献上崇拜，或是激励我们去实践那些能使我们充满像上帝所充满的德行。

        「而那位能照着运行在我们里面的大能，成就一切，远超过我们所求所想的。」(以弗所书 3:20) 他说「大能」说得好，因为大能的特质就是能获得我们从未期待过的事物。至于（上帝）为我们所做的超过我们「所求或……所想」的，这从（使徒）自己所写的内容中可见一斑。他说，我祷告；而祂甚至不需要我的祷告，就会成就比我们所求的更多，——而且不仅仅是更多或更丰盛，而是「远超过一切」，——这个表达显示了恩赐的特别伟大。那么，这从何可见呢？他说，从运行在我们里面的大能中可见，——因为我们从未祈求或期待过这些。

        「愿荣耀在教会中，在基督耶稣里，归于祂，直到世世代代，永永远远。阿们。」(以弗所书 3:21) （使徒）做得很好，他以祷告和颂赞结束了他的话语：应当颂扬和称颂那位赐给我们如此恩惠的。同样值得惊奇的是，他为了我们从上帝那里得到的恩赐，在基督耶稣里赞美（祂）。这一句也说得很好：「愿荣耀在教会中归于祂」，——因为众所周知，教会将永远存在。既然教会永远长存，那么（使徒）就希望我们也赞美上帝直到世界的末了，——他通过说「直到世世代代」来解释了这一点。

        还需要说的是，什么是「列族」（πατριαί）呢？在这里（地上），「列族」（后裔）一词指的是世系；但在天上，无人彼此生养，又何来世系呢？也许（使徒）在这里将「列族」称为天上的众群，因为在圣经中，米拉利族也被称为「一群」（民数记 4:33）。（使徒）并非向上帝祈求所有的一切，而是也要求他们有信心和爱，而且不是简单的爱，而是扎根于我们心中并坚固的爱，那种风不能动摇、他物也不能摧毁的爱。（使徒）说，苦难构成了荣耀；如果我的苦难是这样，那么你们自己的苦难就更是如此了。'
  - type: paragraph
    text:
      ru: 'Итак, скорби еще не служат признаком того, будто мы оставлены (Богом): явивший к нам такую благость, конечно, не оставит нас. Если же (апостолу) Павлу нужна была молитва и помощь Духа для того, чтобы он мог узнать любовь Божью, то кто после этого познает существо Христово, руководясь одними умствованиями? А разве, в самом деле, так трудно познать, что Бог любит нас? Очень трудно, возлюбленный! Одни не знают даже и этого – отчего, как говорят, и случаются в мире тысячи зол, – а другие не знают меры (этой любви). Павел не отыскивает этой меры и не хочет измерять ее (любовь); да и как бы он мог это сделать? Но говорит, что превосходное и великое дело познать (богатство любви), и что он это самое может доказать познанием, которого мы удостоились. Что выше того, чтобы"крепко"и«утвердиться»иметь в себе Христа? Многого, говорит, мы и просим (у Бога); но Он может сделать для нас гораздо больше, нежели сколько мы просим, – чтобы мы не только любили Его, но и сильно любили. Постараемся же, возлюбленные, познать любовь Божью. Это важно для нас: ничто другое не приносит нам столько пользы, ничто столько не возвышает нас. Познание этой любви может действовать на души более, чем страх геенны. Откуда же мы ее узнаем? И из сказанного, и из того, что каждодневно совершается. Для чего, в самом деле, сотворено все это? Для какой нужды? Ни для какой. Причина бытия и горних и дольних существ – одна любовь (Божья). Но особенно эта любовь видна из того, что Он благотворит людям, сам наперед ничего не получив от них. Потому, в подражание Ему, будем и мы благотворить врагам, – не отвергнем тех, кто ненавидит нас и отвращается от нас. Это уподобляет нас Богу. Если, сказано, ты любишь любящего, какая польза? Это и язычники делают (Мф.5:46–47). Но, что служит признаком истинной любви? Любовь к ненавидящему. Я хочу привести пример, и, – простите мне, – не находя его в области предметов духовных, заимствую его из плотской жизни. Не видите ли вы любовников? Сколько они терпят от любовниц обид, сколько коварства, сколько вреда, как бывают мучимы и иссушаемы ими, – и, тем не менее, они любят их более своей души, проводя ночи у дверей их. Научимся этим примером, конечно, не тому, чтобы любить этих распутных женщин, но чтобы так любить врагов. В самом деле, скажи мне, не хуже ли всех врагов поступают (любовницы с пристрастившимися к ним)? Не расточают ли он их имущества, не наносят ли им личных оскорблений и не повелевают ли ими с большей властью, чем своими рабами? Однако (любовники) не отстают от них. И никто не имеет такого врага, какого имеет любовник в своей любовнице, потому что любовница и гордится им, и бесчестит его, и часто злоупотребляет им, и поступает с ним тем презрительнее, чем более бывает любима им. Что звероподобнее души с таким настроением? Однако любят (любовники своих любовниц). Впрочем, сейчас найдем такую любовь и у духовных (людей), – не нынешних, потому что ныне она охладела, – а у древних, великих и дивных мужей.'
      cn: 所以，苦难尚不作为我们被（上帝）遗弃的标志：那向我们显明如此恩慈的，当然不会遗弃我们。如果（使徒）保罗需要祷告和圣灵的帮助，以便他能认识上帝的爱，那么在此之后，谁能单凭思辨来认识基督的本质呢？难道，事实上，认识上帝爱我们是如此困难吗？非常困难，亲爱的！有些人甚至连这个都不知道——正因此，正如人们所说，世上才发生千般恶事——而另一些人则不知道（这爱）的尺度。保罗不寻求这尺度，也不想衡量它（爱）；他又怎能做到呢？但他说，认识（爱的丰富）是件卓越而伟大的事，而且他能以我们所蒙受的认识来证明这一点。什么比在自己里面「牢固地」和「坚定地」拥有基督更崇高呢？我们求（上帝）许多事，他说；但祂能为我们做更多的事，远超过我们所求的——不仅要我们爱祂，而且要我们深深地爱祂。那么，亲爱的们，让我们努力认识上帝的爱。这对我们很重要：没有别的什么能给我们带来如此多的益处，没有什么能如此提升我们。认识这份爱能对灵魂产生更大的作用，甚于地狱的恐惧。那么我们从何处认识它呢？从所说的，也从每日所发生的事。事实上，这一切都是为了什么而受造的呢？为了什么需要呢？完全不需要。天上地下一切受造之物存在的缘由——唯有（上帝的）爱。但这份爱尤其可见于：祂施恩于人，自己事先并未从他们那里得到任何回报。因此，效法祂，我们也要施恩于敌人——不抛弃那些憎恨我们并厌弃我们的人。这使我们与上帝相似。经上说，你若爱那爱你的，有什么益处呢？这连外邦人也做（马太福音 5:46-47）。但，什么才是真爱的标志呢？爱那憎恨你的。我想举一个例子——请原谅我——由于未在属灵的事物领域找到它，我将它借用自肉体的生活。你们难道没看到恋人们吗？他们从情妇那里承受了多少羞辱，多少诡计，多少伤害，如何被她们折磨和耗尽——然而，他们却爱她们胜过爱自己的灵魂，夜宿她们门外。我们当然要从这个例子中学习，不是要爱这些放荡的女人，而是要这样去爱敌人。事实上，请告诉我，（情妇对待那些沉迷于她们的人）难道不比所有的敌人都更糟糕吗？她们难道没有挥霍他们的财产吗？难道没有对他们进行人身侮辱吗？难道没有以比对待自己的奴隶更大的权力来支配他们吗？然而（恋人们）却不离弃她们。而且没有人有这样的敌人，像恋人在其情妇那里所拥有的那样，因为情妇既以他为傲，又羞辱他，又常常利用他，并且对他表现出更轻蔑的态度，他越是爱她。还有什么比怀有这种心情的灵魂更像野兽呢？然而（恋人们仍爱着他们的情妇）。然而，我们现在也能在属灵（之人）那里找到这样的爱——不是指今天的人，因为现今它已冷淡——而是指古代的，伟大而奇妙的圣徒们。
  - type: paragraph
    text:
      ru: 'Блаженный Моисей превзошел и тех, которые имеют страстную любовь. Как и каким образом? Во-первых, покинув царский двор с его роскошью, почести и славу, он предпочел лучше быть с израильтянами. А этого другой не только не сделал бы, напротив покраснел бы, если бы кто уличил его в родстве не только с рабами, но и с людьми, которых считают за преступников. Он же не только не устыдился родства, но и показал себя самым ревностным защитником (израильтян) и за них сам подвергся опасности. Как? Видя, сказано, что один обижает другого, он защитил обижаемого и убил обидчика. Но это еще он сделал не для врагов. Правда, велик и этот поступок, но не так, как то, что после случилось. На другой день он увидел тоже самое, и видя, что обижает тот, за которого он отомстил (вчера), убеждал его не делать обиды. А этот человек, по своей крайней непризнательности, и говорит (ему):«кто поставил тебя начальником и судьей над нами?»(Исх. 2:14)? Кого не раздражили бы  такие слова? Если бы прежнее дело было совершено под влиянием гнева и безрассудной раздражительности, то и этого человека (Моисей) убил бы. Тот, для которого это было бы сделано, не донес бы на него. Но он, – говорит (Писание), – сказал так потому, что они были в родстве между собою; напротив, будучи сам обижаем, не говорит ничего такого:«кто поставил тебя начальником и судьей над нами?»Почему же ты не говорил так вчера? Обида, нанесенная тобою, и твоя жестокость и поставили меня князем и судьей. Но, заметь, ныне некоторые говорят это и Богу. Они желают, чтобы (Бог) был жесток к тем, которые их обижают, и обвиняют Его в долготерпении к ним, – хотя сами, обижая других, этого не делают. Что оскорбительнее таких слов? Однако, и после этого, когда был посылаем к непризнательным и неблагодарным, (Моисей) пошел и не отказался. Мало того; когда после знамений и чудес, совершенных им, намеревались побить его камнями, и он избегал рук их, – оставаясь однако же, предметом постоянного их ропота, – (пророк) любил их такой любовью, что, после совершения народом известного тяжкого греха, говорил Богу:«прости им грех их, а если нет, то изгладь и меня из книги Твоей, в которую Ты вписал»(Исх. 32:32). Лучше желаю, говорит, с ними погибнуть, чем без них спастись. Вот поистине – не рассуждающая, какая-то страстная любовь! И что ты говоришь? Ты не дорожишь небом? Не дорожу, говорит, потому что люблю согрешивших. Хочешь быть изглаженным? Как же и быть иначе? Я люблю, говорит. Между тем, что последовало далее? Послушай, что говорит Писание в другом месте: и озлоблен быть Моисей их ради«и Моисей потерпел за них»(Пс. 105:32). Сколько раз они оскорбляли его! Сколько раз оставляли и его и его брата! Сколько раз хотели возвратиться в Египет! И после всего этого он горел и пламенел (любовью), и готов был пострадать за них. Так должно любить врагов! Подвергаясь их нападениям, мучениям, терпя от них лишения, должно желать им спасения. Да и Павел, скажи мне, не желал ли быть ввергнутым в геенну, вместо них (израильтян)? Но нельзя при этом не привести в пример и самого Владыку, – как Он поступил, когда сказал:«Он повелевает солнцу Своему восходить над злыми и добрыми»(Мф.5:45). Он (Спаситель наш) приводит в пример Отца; а мы приведем Его – Христа. Он пришел к нам, – разумею Его домостроительство, – сделался рабом ради нас, смирил Себя, истощил, принял зрак раба; придя (на землю), хотя сам не пошел на путь языков, но повелел это ученикам, и не только это сделал, но и обходил (различные места), врачуя всякую болезнь и всякую немощь.'
      cn: '蒙福的摩西甚至超越了那些拥有炽热情爱的人。祂是怎样超越的呢？首先，祂离开了王宫，舍弃了那里的奢华、尊荣与荣耀，宁愿与以色列人同在。换作旁人，不仅不会这样做，反而会因为被人揭发与奴隶、甚至被视为罪犯的人有亲属关系而感到羞愧。而祂不仅不以这亲属关系为耻，反而表现出自己是（以色列人）最热忱的捍卫者，并为了他们而甘冒危险。祂是怎样冒的险呢？经上说，祂看见一人欺凌另一人，便保护了受欺凌者，并杀死了欺凌者。


        然而，这事祂做得并非为了敌人。诚然，这事迹也很伟大，但不及后来发生的事。次日，祂又看见同样的事，见那昨日蒙祂伸冤之人又在欺凌他人，便劝告他不要再欺凌。然而，这人因其极度的忘恩负义，竟（对摩西）说：「谁立你作我们的官长和审判官呢？」(出埃及记 2:14) 谁不会被这样的话语激怒呢？倘若此前的事情是受怒气和不理智的激愤所驱动，摩西也会杀了这个人（第二天的欺凌者）。那个因此而得帮助的人是不会告发摩西的。但那人——经上说——那样说，是因为他们（争斗的双方）彼此有亲属关系；相反地，当摩西自己受欺凌时，却没有说这样的话：「谁立你作我们的官长和审判官呢？」为何你昨日不这样说呢？你所施加的欺凌和你的残忍，才立我作了首领和审判官。但请留意，如今有些人也这样对上帝说。他们希望（上帝）对那些欺凌他们的人残忍，并抱怨上帝对他们长期忍耐——尽管他们自己在欺凌他人时，却不会这样做。还有什么比这样的话语更具侮辱性呢？然而，即便在此之后，当摩西被差遣到那些忘恩负义、不知感恩的人那里时，祂也去了，没有拒绝。


        不仅如此；当摩西施行了神迹奇事之后，他们（百姓）却打算用石头打死祂，而祂也躲避了他们的手——然而，祂始终是他们持续抱怨的对象——这位先知爱他们，是以这样一种爱，以至于在百姓犯下那桩众所周知的严重罪行之后，祂对上帝说：「求祢赦免他们的罪；不然，求祢从祢所写的册上涂抹我的名。」(出埃及记 32:32) 祂说：「我宁愿与他们一同灭亡，也不愿在没有他们的情况下得救。」这真是——一种不计较的，何等炽热的爱啊！「你还说什么呢？你不珍惜天国吗？」祂说：「我不珍惜，因为我爱那些犯罪的人。」「你愿意被涂抹吗？」「怎能不呢？我爱他们啊！」祂说。那么，接下来发生了什么呢？请听经上在别处所说的：摩西因他们而受苦，「摩西也为他们受苦」(诗篇 105:32)。他们多少次侮辱祂！多少次离弃祂和祂的兄弟！多少次想回到埃及！而这一切之后，祂仍然（因爱而）炽热燃烧，并准备为他们受苦。就当这样去爱敌人！即使遭受他们的攻击、折磨，忍受他们的剥夺，也当祝愿他们得救。


        那么，保罗难道不也曾希望为他们（以色列人）的缘故被投入地狱吗？但在此之时，我们也绝不能不提及主本身，——祂是怎样行事的呢，当祂说：「祂叫日头上升，照恶人，也照善人」时。(马太福音 5:45) 祂（我们的救主）以父为榜样；而我们则以祂——基督为榜样。祂来到我们中间——我指的是祂的救赎计划——为我们成为仆役，谦卑自己，倾尽所有，取了奴仆的形象；祂来到（地上），虽然祂自己没有走外邦人的道路，却命令门徒如此行，祂不仅如此行了，还四处游行，医治各样的疾病和各样的软弱。'
  - type: paragraph
    text:
      ru: 'Что же? Все дивились, и в недоумении говорили:«откуда же у Него все это?»(Мф. 13:56)? А те, которые получили от Него благодеяния, говорили:«Он одержим бесом»(Иоан. 10:20), Он хульник, безумец и обманщик (Мф.9:3, 27:63). Что же, отогнал ли Он их от Себя? Нет; напротив, слыша это, благотворил еще более, шел к тем, которые намерены были распять Его, как будто им-то Он и должен был послужить во спасение. И будучи распят, что Он говорил?«Отче! прости им, ибо не знают, что делают»(Лк. 23:34). И прежде, и после того терпя зло, Он до последнего издыхания все делал для них и молился за них. И после распятия чего не совершил для них? Не послал ли апостолов? Не явил ли знамений? Не поколебал ли и земли, для них? Так должно любить врагов из подражания Христу! Так поступал и Павел: побиваемый камнями, претерпевая тысячи страданий, все делал для них (врагов своих). Послушай, что он говорит:«желание моего сердца и молитва к Богу ...во спасение»(Рим.10:1); и еще:«Ибо свидетельствую им, что имеют ревность по Боге»(Рим. 10:2); и опять:«Если ...ты, дикая маслина, привился на место их и стал общником корня и сока маслины»(Рим. 11:17). С какой нежной любовью говорит он эти слова, с каким благорасположением? Этого невозможно и высказать, поистине невозможно! Так должно любить врагов. Любовь к врагам есть любовь к Богу, даровавшему заповеди и законы, есть подражание Ему. Знай же, что, оказывая благодеяния врагам, ты благотворишь не им, а себе, не их любишь, а повинуешься Богу. Итак, зная это, утвердимся во взаимной любви, чтобы, в точности выполнив ее, получить обетованные блага о Христе Иисусе, Господе нашем, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.'
      cn: '那么呢？众人惊奇，不解地说道：「祂这一切是从哪里来的呢？」(马太福音 13:56) 而那些从祂那里领受恩惠的人，却说：「祂是被鬼附着了！」(约翰福音 10:20) 祂是个亵渎者，是个疯子，是个骗子。(马太福音 9:3，27:63) 那么呢，祂是否将他们从自己身边赶走呢？没有；相反地，祂听了这些话，反而施与更多的恩惠，走向那些意图将祂钉死在十字架上的人，仿佛祂就是为了拯救他们而必须事奉他们。当祂被钉在十字架上时，祂说了什么呢？「父啊！赦免他们，因为他们所做的，他们不知道。」(路加福音 23:34) 在此之前和之后，祂忍受着恶行，直到祂咽下最后一口气，祂仍为他们做了一切，并为他们祈祷。在被钉十字架之后，祂又为他们成就了什么呢？岂不是差遣了使徒吗？岂不是显现了神迹吗？岂不是甚至为他们震动了大地吗？我们应当如此效法基督去爱仇敌！


        保罗也是如此行事：即便被石头击打，忍受着千万般的苦难，他仍然为他们（他的仇敌）做了一切。请听他说的话：「我心中所愿的，并向 上帝的祷告……是为了他们的得救。」(罗马书 10:1) 又说：「我向他们作证，他们对 上帝有热心。」(罗马书 10:2) 再次说：「若你这野橄榄，接在他们身上，一同得着橄榄根的肥汁。」(罗马书 11:17) 他是以何等温柔的爱，何等良善的心情，说出这些话的呢？这真是无法言喻，实在无法言喻！我们应当如此爱仇敌。爱仇敌就是爱 上帝，祂赐下了诫命和律法，爱仇敌就是效法祂。你当知道，当你施恩惠给仇敌时，你施恩惠的不是他们，而是你自己，你爱的不是他们，而是顺服 上帝。因此，我们知道这一点，就当坚固彼此相爱的心，以便我们能准确地遵行，在我们的主耶稣基督里领受所应许的福祉，祂与圣父和圣灵同受荣耀、权柄、尊贵，从今时直到永远，世世代代。阿们。'
