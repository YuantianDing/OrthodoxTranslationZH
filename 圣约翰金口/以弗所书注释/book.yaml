    text:
      ru: Еф.6:5–8.Рабы, повинуйтесь господам своим по плоти со страхом и трепетом, в простоте сердца вашего, как Христу,
      cn: (以弗所书 6:5-8) 仆人啊，要存敬畏战兢的心，以诚实的心顺从你们肉身的主人，如同顺从基督一般，
  - type: paragraph
