      ru: '3.'
      cn: '3.'
    text:
      ru: '«Не говори в сердце твоем: кто взойдет на небо?.. Или кто сойдет в бездну? то есть Христа из мертвых возвести»(Рим. 10:6–7). Вместо жизни Он ввел веру, чтобы не пропало даром дело спасения; сам принял наказание, а от них требует веры в догматы.«Дабы из двух создать в Себе Самом одного нового человека»(Еф.2:15). Видишь, язычник не сделался иудеем, но тот и другой пришли в новое состояние. Не для того Он упразднил закон, чтобы одного преобразовать в другого, а для того, чтобы воссоздать обоих. И хорошо (апостол) употребляет слово –«дабы создать»; он не сказал: переменить, – чтобы показать особенную силу этого действия, и то, что хотя это созидание совершалось видимым образом, но все же оно не меньше первого творения и наконец то, что нам не должно уклоняться от предметов естественных.«Дабы из двух, – говорит, –создать в Себе Самом», т. е. через Себя. Не поручил кому-нибудь иному; но сам Собою, предварительно как бы расплавив того и другого (т. е. эллина и иудея), создал одного дивного (т. е. христианина), сам сделавшись и первым творением этого рода, которое гораздо выше прежнего творения.«В Себе Самом»может значить также и то, что Он первый представил нам образец и пример (новой твари). При этом занимая сам средину, Он одной рукой привлекает иудея, другой – эллина, и, смешав их, и уничтожив все, что отчуждало их между собою, преобразил свыше огнем и водой, не водой и землей, но водой и огнем. Преобразил и иудея, который был обрезан и находился под проклятием, и эллина, который находился вне закона,«в одного нового человека», высшего обоих – и иудея и эллина."Устраивая мир"(Еф.2:15) и в отношении к Богу и в отношении друг к другу. Оставаясь иудеи иудеями, эллины эллинами, они никогда не соединились бы между собою; не оставляя своего собственного положения, как каждый из них мог бы придти в лучшее состояние? Иудей тогда лишь сближается с эллином, когда делается и верным. (Это походит на то), как если двое занимают внизу два отдельных помещения и вверху имеют одно общее, прекрасное и обширное: они до тех пор не могут видеться между собою, пока не поднимутся наверх.'
      cn: 「你心里不要说：谁要升到天上呢？……或说：谁要下到无底坑呢？就是要把基督从死里领上来。」（罗马书 10:6-7）祂以信德取代了律法（生命），以免救赎之事徒然归于无有；祂亲自承受了刑罚，却要求他们对教义怀有信德。「好在祂自己里面，将两者创造成一个新人。」（以弗所书 2:15）你看，外邦人并未变成犹太人，而是两者都进入了一种新的状态。祂废除律法并非为了将一方改变成另一方，而是为了重新创造双方。（使徒）用词「好……创造成」真是恰当；他没有说：改变，——以显示此行动的独特能力，以及表明这创造虽然以可见的方式进行，但其重要性绝不亚于最初的创造；最后，这也指出我们不应偏离自然之物。祂说：「好在祂自己里面，将两者创造成」，也就是说，是藉着祂自己。祂并未委托给他人；而是祂自己，预先仿佛熔炼了两者（即希腊人和犹太人），创造了一个奇妙的（即基督徒），祂自己也成了这类第一个受造物，远超以往的受造物。「在祂自己里面」也可以意味着，祂首先向我们呈现了（新受造物的）榜样和典范。在此过程中，祂亲自居于中间，一只手吸引犹太人，另一只手吸引希腊人，将他们融合，并消除了所有使他们彼此疏远的事物，藉着水与火，而非水与土，将他们从上而下地改变更新。祂改变更新了犹太人（曾受割礼且在律法咒诅之下），以及希腊人（曾处于律法之外），使他们「成为一个新人」，超越两者——犹太人和希腊人。「成就和平」（以弗所书 2:15），无论是在与上帝的关系上，还是在彼此之间的关系上。若犹太人仍是犹太人，希腊人仍是希腊人，他们就永远不会彼此联合；若不放弃各自原有的地位，他们又怎能达到更佳的状态呢？犹太人唯有在成为信徒时，才能与希腊人亲近。（这就像是）如果两个人各自占据下方两个独立的房间，而在上方则有一个共同的、美好而宽敞的场所：他们在此之前无法彼此相见，除非他们向上攀登。
  - type: paragraph
    text:
      ru: '"Устраивая мир"– преимущественно с Богом, как это видно из последующего. Что именно он говорит далее?«И в одном теле примирить обоих с Богом посредством креста»(Еф.2:16). Не сказал: умирить (χαταλλάξη), но –«примирить»(άποχαταλλάξη), т. е. снова«примирить», показывая через это, что и прежде человеческое естество было способно к примирению (с Богом), как у святых еще до закона.«В одном теле», – говорит, – Своем"с Богом". Каким образом Он совершил это? Сам, говорит, понесши на кресте должное наказание.«Убив вражду на нем»(Еф.2:16); внушительнее и точнее этих выражений быть не может. Смерть Его, говорит (апостол), убила, пронзила и уничтожила вражду; не другому кому Он поручил это дело, и не только сам действовал, но и страдал. Не сказал: разрешив, не сказал также: отняв, но употребил самое сильное выражение –"Убив", так что (вражда) никогда уже не восстанет. Да и как бы она могла восстать? Разве благодаря великой нашей злобе. А доколь мы пребудем в теле Христовом, доколь будем находиться в соединении с Ним, – она не восстанет, но будет лежать мертва. Собственно же говоря, она никогда не восстанет, и мы можем лишь произвести другую (вражду), но отнюдь уже не прежнюю, которая убита и умерщвлена. И значит – ты уже породишь эту другую (вражду).«Плотские помышления, – сказано, –суть вражда против Бога»(Рим.8:7). Если мы не будем мудрствовать ничего плотского, то этой новой (вражды) никогда не родится, а всегда будет"мир"(Еф.2:15).'
      cn: 「成就和平」——主要地是与上帝，正如从接下来的内容所可见的。他接下来究竟说了什么？「并使二者在一个身体里，借着十字架与上帝和好」（以弗所书 2:16）。他没有说：使和睦 (χαταλλάξη)，而是说：「使和好」(άποχαταλλάξη)，即「再次使和好」，借此表明，甚至在此之前，人性的本质也能够与上帝和好，正如那些在律法之前就已成圣之人一样。「在一个身体里」，他说，是祂自己的身体，「与上帝和好」。祂是如何成就此事的呢？祂说，是祂自己，在十字架上承受了应得的惩罚。「在十字架上消灭了仇恨」（以弗所书 2:16）；没有比这些表达方式更令人深思且更准确的了。祂的死亡，使徒说，杀灭了、刺穿了并彻底消灭了仇恨；祂没有把这事委托给别人，并且祂不仅亲自行动，而且也受苦了。祂没有说：解除了，也没有说：夺走了，而是用了最强烈的表达方式——「杀灭了」，以至于（仇恨）再也不会复活。它又怎能复活呢？除非是由于我们极大的邪恶。然而，只要我们居住在基督的身体里，只要我们与祂联合，它就不会复活，而是会躺卧着，如同已死。实际上，它永不会复活，我们只能产生另一种（仇恨），但绝不再是那已被杀灭和致死的旧仇恨了。这就意味着——你将会生出这另一种（仇恨）。「属肉体的意念，——经上说，——乃是与上帝为仇」（罗马书 8:7）。如果我们不思念任何属肉体的事，那么这种新的（仇恨）就永远不会产生，而将永远是「和平」（以弗所书 2:15）。
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: Подумай только, как ужасно снова вступить нам во вражду с Богом после того, как Он так много сделал для нашего примирения, и действительно примирил нас! Эту (вражду) ожидает уже не купель крещения, но геенна, не прощение, но наказание.«Плотские помышления», это – невоздержание, объедение;«плотские помышления», это – лихоимство и всякий вообще грех. Почему называется плотским мудрованием? Ведь тело ничего не может сделать без души? (Апостол) не клевещет на плоть, как он не клевещет и на душу, когда говорит:«Душевный человек»(1Кор.2:14); но (он показывает этим), что ни тело, ни душа сами по себе, – если не получат помощи свыше, – не в состоянии совершить ничего великого и доблестного. Потому он называет душевным то, что душа сама собою делает; и плотским называет то, что тело само собою делает, – не потому впрочем, что все это – по природе (φυσικά), но потому, что, не получив охраны свыше, погибшим. Так и хорошие глаза, но без света, причиняют много бед; зависит же это не от природы их, а от слабости. Если бы все естественное было злом, тогда мы не должны бы были употреблять его даже на должное. Напротив, нет зла естественного. Что же именно называется мудрованиями плоти? Грехи. Когда она (плоть), возомнив о себе, захватывает власть над возницей, тогда производит бесчисленное множество зол. Добродетель плоти – повиноваться душе, напротив порок – властвовать над душой. Как хороший и крепконогий конь не обнаруживает достоинства, когда не повинуется вознице, так и плоть тогда лишь хороша, когда мы обуздываем ее порывы. Впрочем, и возница должен обладать знанием своего дела; а без знания и он наделает много бед. Знание везде необходимо. Дух, научающий этому, делая возницу сильнее, тем и душу, и тело украшает. Как душа, доколь она в теле, придает ему красоту, а когда душа перестает животворить тело и отлетает, тогда (происходит зрелище) подобное тому, какое бывает, когда какой-либо живописец перемешивает свои краски, – именно является великое безобразие, каждый член стремится к тлению и разрушению, – точно такое же, иди еще худшее и большее бывает безобразие, когда дух оставляет впусте душу и тело.
      cn: '想想看，我们再次与上帝为敌是何等可怕，在祂为我们的和好做了如此之多，并真正使我们与祂和好之后！这（仇恨）所等待的不再是洗礼之池，而是欣嫩子谷，不是赦免，而是惩罚。


        「肉体的思虑」，这是放纵，是贪食；「肉体的思虑」，这是贪婪和一切的罪。为何称为肉体的意念呢？难道身体没有灵魂就什么都做不了吗？（使徒）并非诽谤肉体，就像他说到「属魂的人」（哥林多前书 2:14）时也并非诽谤灵魂一样；但（他以此表明），无论是身体还是灵魂，如果自身不获得来自上方的帮助，都无法成就任何伟大和尊贵之事。因此，他称灵魂自身所做之事为属魂的；称身体自身所做之事为属肉的——并非因为这一切都是出于本性（φυσικά），而是因为，在未获得来自上方的看护时，它们是败坏的。就像好的眼睛，若没有光，也会带来许多祸患；这并非源于它们的本性，而是源于它们的软弱。倘若一切自然之物都是邪恶的，那么我们甚至不应该将它用于正当之事。相反，没有什么是自然而然的邪恶。


        那么，究竟何为肉体的意念呢？罪过。当它（肉体）自以为是，夺取了对驾车者的掌控权时，便会产生无数的邪恶。肉体的美德在于顺从灵魂，而其恶行则在于凌驾于灵魂之上。就像一匹良驹，即便健壮有力，若不顺从驾车者，也无法展现其价值，同样，肉体唯有当我们驾驭其冲动时，才是良善的。然而，驾车者也必须具备其技艺的知识；若无知识，他同样会制造许多祸患。知识在任何地方都是必不可少的。那教导此道的圣灵，使驾车者更强大，从而也使灵魂和身体都得到美化。


        正如灵魂在身体内时，赋予身体以美丽，而当灵魂停止赋予身体生命并离去时，所呈现的景象，就如同某个画家搅乱其颜料时所发生的情形——那时便会出现巨大的丑陋，每个肢体都趋向于腐朽和毁灭——同样，当圣灵使灵魂和身体变得空虚并离去时，所产生的丑陋，正是如此，甚至更为严重和巨大。'
  - type: paragraph
    text:
      ru: 'Итак, если тело ниже души, – ты не порочь его за это. Ведь и я берегусь, чтобы не порочить душу за то только, что она без духа ничего не может. Но если что нужно сказать, так это то, что душа достойна еще большего обвинения. Тело без души ничего не в состоянии было бы сделать дурного, а душа и без тела многое может сделать. Она многое делает и тогда, когда тело бывает истощено и кровь в нем уже не кипит. Это видим мы на чародеях, волхвах, на составителях зелий и на завистниках, у которых тело большей частью бывает истощено. Даже и объедение бывает не по нужде тела, а вследствие невнимательности души; для тела нужна пища, а не объедение. Если хочу крепче править лошадью, то взнуздываю ее; тело же не может принудить душу вдаться в пороки. Почему же (апостол) называет (грех) мудрованием плоти? Потому что он всецело принадлежит плоти. Когда она берет себе власть, когда пренебрегает внушениями ума и властью души, тогда грешит. И, значит, добродетель тела заключается именно в повиновении его душе, потому что само по себе тело ни хорошо, ни худо. Но может ли тело сделать что-нибудь само собою? По связи (доводов), тело если хорошо, то хорошо только в отношении к подчинению (душе); а само по себе оно ни хорошо, ни худо, способно и к тому и к другому, может склонится и на ту, и на другую сторону. Тело желает, но не блуда, или прелюбодеяния, а совокупления; тело желает, но не сластолюбия и обжорства, а пищи, не пьянства, а питья. Что пьянство не составляет пожелания тела, смотри: оно лишнего не удерживает (т. е. извергает назад), когда ты преступаешь меру и переходишь за границу тела. Подлинно, все остальное (кроме необходимых потребностей тела) принадлежит душе; особенно когда она делается плотской, и так сказать, одебелевает. Правда, и хорошее тело все же значительно ниже души; но, с другой стороны, как олово, хотя оно и ниже золота, все же нужно для спайки (последнего), так точно и для души нужно тело. Или как дитя самое благородное нуждается однако же в воспитателе, так и душа нуждается в теле. Не удивляйся, что мы приводим такие примеры, говорим детские вещи, не применяясь к возрасту (слушателей): так именно о теле и должно говорить. Но можно, если захотим, и не быть в теле, – как можно не быть и на земле, – а пребывать на небе и в духе. «Быть где» – это выражение может быть употребляемо для означения не одного местопребывания, а также и состояния (душевного). О многих людях, бывших в известном месте, мы говорим, что они не были, выражаясь: такой-то не сюда приходил. И что я говорю это? Часто мы выражаемся: ты вне себя, или: я вне себя. Что для каждого может быть ближе и нераздельнее его самого? Между тем мы говорим, что он вне себя. Будем же в себе самих, в небе, в духе; пребудем в мире и в благодати Божьей, – чтобы, оставив все плотское, мы смогли достигнуть обещанных благ во Христе Иисусе, Господе нашем, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.'
      cn: '那么，如果身体低于灵魂，你不要因此而贬损它。因为我也会小心，不因灵魂离了灵就一无所能而贬损它。但若有话要说，那就是灵魂更当受责。身体没有灵魂，就无法行恶；而灵魂即便没有身体，也能做许多事。即便身体衰弱，血液不再沸腾，它也能做许多事。我们在巫师、术士、制药剂者和嫉妒者身上看到这一点，他们大部分时间身体都是虚弱的。甚至饕餮也不是身体的需要，而是灵魂疏忽的结果；身体需要的是食物，而非暴饮暴食。


        若我想更好地驾驭一匹马，就会给它上辔头；而身体却无法强迫灵魂陷入邪恶。那么，为何（使徒）称（罪）为肉体的思虑呢？因为这完全属于肉体。当它僭取权力，当它漠视理智的教诲和灵魂的权柄时，便会犯罪。因此，身体的美德正在于它对灵魂的顺从，因为身体本身既非善也非恶。但身体能自行做任何事吗？根据（论证的）关联，身体若为善，则唯独在其顺从（灵魂）时为善；而其本身既非善也非恶，既能倾向于此，亦能倾向于彼。


        身体有所欲求，但并非淫乱或奸淫，而是交合；身体有所欲求，但并非贪食和暴饮，而是食物；并非醉酒，而是饮水。至于醉酒并非身体的欲望，请看：当你逾越分寸，超越身体的界限时，它会将多余之物吐出。确实，所有其余的（除了身体的必要需求）都属于灵魂；尤其是当灵魂变得肉体化，可以说，变得迟钝愚拙之时。诚然，即便健康的身体也远低于灵魂；但另一方面，就像锡虽然低于黄金，却仍用于（后者）的焊接，身体对于灵魂也正是如此。又如最尊贵的孩童仍需要教导者，灵魂也同样需要身体。


        不要惊讶我们举出这样的例子，说些孩童般的话，不顾（听众的）年龄：因为正是应当如此谈论身体。但若我们愿意，也可以不在身体中——就像可以不在地上一样——而是住在天上和灵里。「身处何处」——这个表达不仅可以指代一个所在之处，也可以指代一种（灵魂的）状态。对于许多身处特定地方的人，我们说他们不在此，会这样说：「某某人没有来这里。」我为何要说这些呢？我们常说：「你疯了」或「我心神不定。」对每个人而言，有何能比他自身更亲近、更不可分离呢？然而我们却说他心神不定。愿我们活在自身之中，在天上，在灵里；愿我们常存平安与上帝的恩典之中——如此，我们便能舍弃一切属肉体之物，得以在我们的主基督耶稣里，达成所应许的福祉。与祂，以及父和圣灵，同享荣耀、权能、尊贵，从今时直到永远，世世代代。阿们。'
