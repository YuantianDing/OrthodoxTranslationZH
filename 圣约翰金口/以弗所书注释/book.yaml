      ru: 'Что такое лукавство дня? Порочность дня должна быть свойственна дню. Если ты узнаешь, что такое порочность в окружающем нас, узнаешь и то, что такое порочность дня. Что такое порочность тела? Болезнь. А что – порочность души? Злоба. Что – порочность воды? Горечь. И всякого рода порочность есть неустройство в природе того предмета, которому порочность приписывается. Итак, если и день может иметь порочность, то она заключается в самом дне, в часах, в свете. Так и Христос говорит:«довольно длякаждогодня своей заботы»(Мф.6:34). Через это мы можем понять и то. Итак, в каком же смысле он называет дни лукавыми? В каком – время лукавым? Не сущность, не создание (так называет он), а то, что в продолжение их делается. Подобно тому и у нас есть обычай говорить: «тяжелый день провел я, дурной». Между тем, каким бы образом он мог быть тяжелым, как не в зависимости от того, что случилось в течение его? А то, что в течение его случается, – доброе от Бога, злое же от порочных людей. Следовательно, люди творцы того, что бывает порочного во времени, и потому говорят: «злые времена». Так и мы называем времена порочными."Итак, – говорит, –не будьте нерассудительны, но познавайте, что есть воляГосподня.И не упивайтесь вином, от которого бывает распутство»(Еф.5:17–18), – так как невоздержание и в этом делает нас вспыльчивыми и дерзкими и стремительными, раздражительными и несносными. Вино дано для веселья, а не для пьянства. А ныне не напиваться – считается делом женоподобным и смешным. Какая же надежда на спасение? Смешно, говоришь ты, не напиваться, тогда как пьянство более всего должно быть осмеяно. Весьма хорошо и частному человеку быть чуждым пьянства; а гораздо более – воину, который имеет дело с оружием, с кровью, со смертоубийствами; гораздо более – военачальнику, когда, и без того, гнев его воспламеняется от власти, от управления, от того, что он постоянно живет среди засад и битв. Хочешь знать, где вино хорошо? Послушай слов Писания:«Дайте секиру погибающему и вино огорченному душею»(Притч. 31:6). И справедливо: оно ведь имеет силу смягчать огорчение и тоску и удалять печаль.«Вино... веселит сердце человека»(Пс. 103:15). Как же от вина происходит пьянство? Ничто не может производить противоположных действий. Значит, пьянство не от вина, но от неумеренности. Вино дано нам не для чего-нибудь другого, как для здоровья тела; но и этому препятствует невоздержание. Послушай же и того блаженного, который пишет и говорит Тимофею:«употребляй немного вина, ради желудка твоего и частых твоих недугов»(1Тим. 5:23).'
      cn: 一日的恶是什么？日子的败坏必然属于日子本身。倘若你认识环绕我们之物中的败坏是什么，你也就认识了一日的败坏是什么。身体的败坏是什么？疾病。而灵魂的败坏又是什么？恶毒。水的败坏是什么？苦涩。各种败坏都是所归之物本性中的失序。因此，倘若日子也能有败坏，那么它就存在于日子本身，存在于时辰中，存在于光亮中。正如基督所说：「一天的难处一天当就够了」（马太福音 6:34）。借此我们也能理解这一点。那么，他是在何种意义上称日子为邪恶的呢？又是在何种意义上称时间为邪恶的呢？并非本质，亦非受造之物（他如此称呼），而是指在它们持续期间所发生之事。同样，我们也有这样的习惯说法：「我过了一个沉重、糟糕的日子。」然而，它怎会沉重，若非取决于在它当中发生之事呢？而在它当中所发生之事，良善的来自上帝，邪恶的则来自败坏之人。因此，人们是那些在时间中发生败坏之事的制造者，故此他们说：「邪恶的时代」。我们也如此称时代为败坏的。「所以，」他说，「不要作愚昧人，却要明白上主的旨意是什么。不要醉酒，酒能使人放荡」（以弗所书 5:17-18），——因为在这方面的不节制使我们变得暴躁、鲁莽、冲动、易怒和令人难以忍受。酒是为欢愉而赐予的，而非为醉酒。而如今，不醉酒竟被视为柔弱且可笑之事。那么，还有什么得救的盼望呢？你说，不醉酒是可笑的，然而醉酒才最应该被嘲笑。普通人远离醉酒是极好的事；更何况是军人，他们与武器、鲜血、杀戮打交道；更何况是将领，他的怒气本就因权力、统御以及他常年生活在埋伏和争战之中而被煽动。你想知道酒在何处是好的吗？请听圣经的话语：「将斧头给予将亡之人，将酒给予灵魂忧伤之人」（箴言 31:6）。这也是公允的：它确实有减轻忧伤和愁苦、驱散悲伤的力量。「酒……能使人心里欢畅」（诗篇 103:15）。那么，醉酒怎会源于酒呢？没有任何事物能产生相反的作用。这意味着，醉酒并非源于酒，而是源于不节制。酒赐予我们并非为了其他，而是为了身体的健康；然而不节制却连这一点也阻碍了。那么，请听那位蒙福者所写并对提摩太所说的话：「你以后不要单喝水，要稍微用点酒，因为你的胃和常常患病」（提摩太前书 5:23）。
