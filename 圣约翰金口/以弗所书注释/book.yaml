    text:
      ru: Еф.4:32.Будьте друг ко другу добры,  сострадательны, прощайте друг друга, как и Бог во Христе простил вас.
      cn: (以弗所书 4:32) 你们要彼此和善，满怀怜悯，彼此饶恕，正如上帝在基督里饶恕了你们一样。
  - type: paragraph
    text:
      ru: Еф.5:1–2.Итак, подражайте Богу, как чада возлюбленные,
      cn: 以弗所书 5:1-2. 所以，你们要效法上帝，如同蒙爱的儿女，
  - type: paragraph
    text:
      ru: и живите в любви, как и Христос возлюбил нас и предал Себя за нас  в приношение и жертву Богу, в благоухание приятное.
      cn: 你们要活在爱中，正如基督爱了我们，并为我们舍了自己，作献给上帝的供物和祭牲，作为蒙悦纳的馨香。
  - type: paragraph
    text:
      ru: Сладострастие – меньшее зло, чем гнев.
      cn: 淫欲比怒气是较轻的罪恶。
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'То, что прошло, имеет большую силу и представляется более дивным и вероятным, чем то, что имеет случиться. Потому-то и Павел делает увещание на основании того, что было, – так как оно имеет большую силу, по причине Христа. Сказать: отпусти, и отпустится тебе, и: если не отпущаете, не отпустится и вам, – такие слова много могут значить для людей любомудрых и верующих в будущее. Но Павел усовещивает не только этим (будущим), но и тем, что уже случилось, потому что (убеждаться) тем значит бегать наказания, а этим – быть причастником какого-либо блага. Подражай, говорит, Христу: этого одного достаточно для увещания к добродетели, т. е. для того, чтобы подражать Богу. Это убедительнее тех слов:«Он повелевает солнцу Своему восходить над злыми и добрыми и посылает дождь на праведных и неправедных»(Мф.5:45). Он не просто сказал, чтобы мы подражали Богу, но выражает желание, чтобы в отношении к тому, чем мы наслаждаемся, мы выказывали друг к другу отеческое расположение. Расположением же этим называется милосердие и соболезнование. И так как людям невозможно не огорчать и не огорчаться, то он нашел другое лекарство – чтобы мы прощали друг другу:"прощайте, – говорит, –друг друга». Но в этом нет ничего похожего (на прощение Божье), потому что если ты кому простишь, то и он тебе простит, а Богу ты ничего простить не можешь. При том ты (прощаешь) сорабу, а Бог – рабу и врагу и ненавидящему Его."Как и Бог, – говорит, –во Христе простил вас». И эти слова весьма загадочны; впрочем, вот что он говорит. Не просто, говорит, без всякой опасности простил, но – с опасностью для Сына, потому что, для помилования тебя, принес в жертву Сына. А ты, хотя тебе и часто представляется безопасное и ничего нестоящее помилование, не делаешь его.'
      cn: '过去之事，具有更大的力量，并且显得比将要发生之事更奇妙、更真实可信。因此，保罗也是基于已发生之事发出劝诫——因为藉着基督，这些事具有更大的力量。


        「赦免吧，你就必蒙赦免」，以及「你们若不赦免人，你们也必不得赦免」——这样的话对于那些爱智慧并相信未来的人而言，意义深远。但保罗不仅以这（未来之事）劝诫，也以那已经发生之事劝诫，因为被那（未来之事）说服，意味着逃避惩罚，而被这（已发生之事）说服，则意味着有份于某种益处。他说：「效法基督」：单凭这一点，就足以劝诫人行美德，即效法上帝。这比那些话更具说服力：「祂叫日头照好人，也照歹人；降雨给义人，也给不义的人」（马太福音 5:45）。


        祂并非只是简单地说要我们效法上帝，而是表达了这样的愿望：在我们所享受的一切事上，我们彼此之间要表现出父爱般的仁慈。这种仁慈，就是怜悯和同情。既然人不可能不冒犯人、也不可能不被冒犯，他就找到了另一种良药——要我们彼此饶恕：他说：「彼此饶恕。」但这与（上帝的赦免）没有任何相似之处，因为你若赦免了某人，那人也会赦免你，而你却不能赦免上帝任何事。此外，你（赦免）的是同作奴仆的，而上帝（赦免）的却是奴仆、仇敌以及恨祂的人。


        他说：「正如上帝在基督里赦免了你们一样。」这些话语极其奥秘；然而，他所言如下。他说，并非简单地毫无危险地赦免，而是以子所面临的危险来赦免，因为为了饶恕你，祂将子献为祭物。而你，尽管常常有机会行安全且不值一提的饶恕，却不肯这样做。'
  - type: paragraph
    text:
      ru: '«Итак, подражайте Богу, как чада возлюбленные, и живите в любви, как и Христос возлюбил нас и предал Себя за нас в приношение и жертву Богу, в благоухание приятное». Чтобы ты не подумал, что это было делом необходимости, послушай, что не просто он сказал, но:«предал Себя», как бы говоря: Владыка возлюбил тебя, когда ты был врагом; люби же ты друга; а если ты не можешь этого, делай, по крайней мере, что можешь. О, что может быть благостнее этих слов? Назовешь ли ты царство, или другое что-либо, – ничто не будет равняться с ними. Ты подражаешь Богу, ты уподобляешься Богу, когда вместе с Ним прощаешь. Грехи нужно прощать скорее, чем долги денежные, потому что если ты простишь деньги, ты этим не будешь подражать Богу, а если будешь прощать грехи, ты будешь подражать Богу. Во всяком случае, как ты можешь говорить: я беден и не могу простить, – когда не прощаешь и того, что можешь? Если же и прощение грехов ты будешь почитать для себя делом убыточным, то что ж произойдет, когда дело коснется твоего богатства, имущества, пожитков?«Итак, подражайте Богу». А вот и еще прекраснейшее увещание:"как, – говорит, –чада возлюбленные». У вас есть и другая необходимость подражать Ему, – не только потому, что вы Им облагодетельствованы, но и потому, что сделались чадами.«как чада возлюбленные». Так как не все сыновья подражают отцам, но только возлюбленные, то и говорит:«как чада возлюбленные, и живите в любви». Вот и основание всего: если будет любовь, то не будет ни ярости, ни гнева, ни крика, ни брани, – все это будет уничтожено. Потому он и поставляет главнейшее на конце. Почему ты сделался чадом? Потому, что тебе прощено. На том же основании, на каком удостоен ты столь высокой чести, и сам ты прощай ближнему. Скажи мне: если бы кто-нибудь тебя, узника и виновного в бесчисленных злодеяниях, возвел на царство... А лучше, оставим это. Если бы кто тебе, когда ты был в горячке и боролся со смертью, помог каким-нибудь лекарством, – не превознес ли бы ты выше всего этого человека и даже самое название лекарства? Если к временам и местам, с которыми связано получение пользы, мы тяготеем как к собственной душе, – то тем более – к самым действиям. Будь привержен к любви, потому что через нее ты спасен, через нее сделался сыном (Божьим); и если в состоянии будешь спасти другого, то ужели ты не воспользуешься тем же лекарством и не станешь всех увещевать: отпустите, чтобы отпущено было вам (Лк. 6:37)? Так поступать – дело душ признательных, свободных и благородных.«Как и Христос, – говорит, –возлюбил нас». Ты милуешь друзей, а Он – врагов; следовательно, то, что сделал Владыка, гораздо важнее. Да и как иначе слово –"как и"удержит свой смысл? Не ясно ли, что (в таком только случае), если мы будем благотворить врагам?«И предал Себя за нас в приношение и жертву Богу, в благоухание приятное». Видишь ли, что страдание за врагов есть благоухание приятное и жертва угодная? Хотя бы ты и умер, и тогда будет жертва: вот что значит подражать Богу.'
      cn: 「所以，你们当效法上帝，如同蒙爱的儿女，并在爱中生活，正如基督爱我们，并为我们舍弃自己，作馨香的供献与祭物献给上帝，成为蒙悦纳的馨香之气。」免得你以为这是出于必然，请听他所说的，不只是，而是：「舍弃自己」，仿佛在说：主宰在你是仇敌时便已爱了你；那么你当爱朋友；若你不能如此，至少当做你所能做的。哦，有何言语能比这些话更美好？无论你提及国度，还是其他任何事物，都不能与它们相提并论。当你与祂一同宽恕时，你便效法上帝，你便得以肖似上帝。罪过当比金钱债务更快地宽恕，因为若你宽恕金钱，你并不能以此效法上帝，而若你宽恕罪过，你便效法上帝。无论如何，当你连你所能宽恕的都不去宽恕时，你怎能说：我贫穷，不能宽恕？若你连宽恕罪过也视为对自己有损之事，那么当事情涉及到你的财富、财产、家当时，又将发生什么呢？「所以，你们当效法上帝。」而这里还有一个极美的劝诫，他说：「如同蒙爱的儿女。」你们还有另一重必要去效法祂，不仅因为你们蒙祂施恩，更因为你们已成为儿女。「如同蒙爱的儿女。」既然并非所有儿子都效法父亲，唯有蒙爱的儿子如此，所以他才说：「如同蒙爱的儿女，并在爱中生活。」这就是一切的基础：若有爱存在，就不会有暴怒，不会有愤怒，不会有叫骂，不会有争吵——这一切都将被消灭。因此他将最主要的内容置于末尾。你为何成为儿女？因为你蒙受宽恕。基于你蒙受如此高贵殊荣的同一理由，你自己也当宽恕你的近人。告诉我：若有人将你，一个囚犯，一个犯下无数恶行之人，提升至王位……不，最好还是别提这个了。若有人在你发高烧与死亡搏斗时，施以某种药物帮助了你，你岂不会将这个人甚至连药物的名称都高举于一切之上吗？若我们对那些与获得益处相关的时日和地点，怀着如同对自身灵魂一般的眷恋，那么对于行动本身就更是如此了。当执着于爱，因为藉着爱你蒙受拯救，藉着爱你成为（上帝的）儿子；若你能够拯救他人，难道你不会使用同样的良药，并劝诫众人说：你们饶恕人，就必蒙饶恕（路加福音 6:37）？如此行事，是感恩、自由而高贵之灵魂所为。他说：「正如基督爱我们。」你怜悯朋友，而祂则怜悯仇敌；因此，主宰所做的远为更重要。此外，不然「正如」一词又怎能保持其意义呢？难道不清楚吗，（只有在这种情况下），当我们善待仇敌时，才算是「正如」？「并为我们舍弃自己，作馨香的供献与祭物献给上帝，成为蒙悦纳的馨香之气。」你看到了吗，为仇敌受苦是蒙悦纳的馨香之气和蒙喜悦的祭物？即使你死了，那也仍是祭物：这就是效法上帝的意义。
  - type: paragraph
    text:
      ru: «А блуд и всякая нечистота и любостяжание не должны даже именоваться у вас, как прилично святым»(Еф.5:3). Сказав о грубой страсти – о гневе, (апостол) переходит к меньшему злу. А что сладострастие есть меньшее зло, послушай, как и Моисей в законе говорит сначала:"не убей", – что относится к гневу, – а потом:«не прелюбодействуй», – что относится к сладострастию. Как горечь, и крик, и всякое зло, и злоречие и все подобное происходят от гневливости, так блуд, нечистота, любостяжание – от (сладострастного) пожелания, потому что и любовь к деньгам, и любовь плотская – одна и та же страсть. И как там он уничтожил крик, эту колесницу гнева, так теперь отсекает сквернословие и шутки, колесницу распутства.«Также сквернословие, – говорит, –и пустословие и смехотворство не приличнывам, а, напротив, благодарение»(Еф.5:4).  Не произноси слов ни шутливых, ни постыдных, и не приводи их в действие, и ты угасишь пламя.«не должны даже именоваться, – говорит, –у вас", т. е., чтобы отнюдь даже не казалось (будто это есть у вас). То же говорил он, и пиша к Коринфянам:«Есть верный слух, что у васпоявилосьблудодеяние»(1Кор. 5:1), т. е., будьте все чисты, потому что слова ведут к делам. Потом, чтобы не показаться тяжелым и суровым, и пресекая наклонность к шуткам, присовокупил и причину, говоря:«не приличнывам", т. е. они нисколько (неприличны) для нас,«а, напротив, благодарение».
      cn: 「至于淫乱、各样污秽和贪婪，在你们中间连提都不可提，方合圣徒的体统」（以弗所书 5:3）。（使徒）在讲到粗暴的激情——怒气之后，转而谈论较小的恶。至于纵欲是较小的恶，试听，摩西在律法中首先说道：「不可杀人」——这指的是怒气——然后：「不可奸淫」——这指的是纵欲。正如苦毒、嚷闹、一切邪恶、毁谤及所有类似之事皆源于恼怒，同样，淫乱、污秽、贪婪——源于（纵欲的）私欲，因为爱财之心与肉欲之爱，是同一回事的激情。正如他在那里废止了嚷闹，这怒气的战车，同样，他现在斩断了污言秽语和戏谑，这放荡的战车。「污言、妄语和戏笑，也不合宜，倒要说感谢的话」（以弗所书 5:4）。勿说戏谑或羞耻的话语，也不付诸行动，你便熄灭了火焰。「连提都不可提，在你们中间」——他说道，也就是说，绝不可有任何迹象（表明这些在你们中间存在）。他写信给哥林多人时也说了同样的话：「风闻在你们中间有淫乱的事」（哥林多前书 5:1），也就是说，你们都要洁净，因为言语通向行为。随后，为了不显得严苛和刻板，并为了杜绝开玩笑的倾向，他又加上了原因，说道：「不合宜」，也就是说，它们对我们来说，丝毫不合宜，「倒要说感谢的话。」
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: Что пользы сказать шутку? Только возбудишь ею смех. Скажи мне, сапожник возьмется ли за какое-нибудь дело, не принадлежащее к ремеслу его, или станет ли приобретать какой-нибудь (ненадлежащий) инструмент? Никак, – потому что чего мы не употребляем, то ничего для нас не стоит. Пусть не будет ни одного слова праздного, так как от празднословия можно перейти к неприличному (разговору). Теперь время не увеселения, но плача, скорбей и рыданий. А ты шутишь? Какой боец, вышедши на арену, оставляет борьбу с противником и произносит шутки? Близ тебя дьявол ходит вокруг, рыкая, чтобы поглотить тебя, все воздвигает и все обращает на твою голову, замышляет, как бы выгнать тебя из твоего убежища, скрежещет зубами, воет, раздувает огонь против твоего спасения, – а ты сидишь и произносишь шутки, пустословишь и говоришь неприличные речи? Можешь ли же ты успешно одолеть его? Мы забавляемся по-детски, возлюбленные! Хочешь узнать образ жизни святых? Послушай, что говорит Павел:«я три года день и ночь непрестанно со слезами учил каждого из вас»(Деян. 20:31). Если же он употреблял такое попечение о милетянах и ефесянах, – не шутки говорил, а со слезами преподавал учение, – то что ты скажешь о других? Послушай, что он говорит и к Коринфянам:«От великой скорби и стесненного сердца я писал вам со многими слезами»(2Кор. 2:4); и еще:«Кто изнемогает, с кем бы и я не изнемогал? Кто соблазняется, за кого бы я не воспламенялся?»(2Кор.11:29). Послушай, что он говорит еще в другом месте, ежедневно, так сказать, желая переселиться из мира:«Ибо мы, находясь вхрамине,воздыхаем"(2Кор.5:4). А ты смеешься и забавляешься? Время войны, – а ты занимаешься тем, что свойственно плясунам? Не видишь ли ты лиц людей воюющих, как они суровы, как строги, как брови их страшны и полны ужаса? У них ты видишь лице суровое, сердце бодрое, ум отважный, быстрый, сдержанный, осторожный и беспокойный, большое благочиние, большую стройность и великое молчание в рядах; не говорю уже, что они не произносят постыдного слова; они вовсе ничего не говорят. Если же они, сражаясь с врагами чувственными и не будучи в опасности потерпеть какой-либо вред от слов, наблюдают столь великое молчание, то ты, который должен вести войну и за слова, и даже большую часть войны, – как ты допускаешь этой твоей части оставаться обнаженной? Разве ты не знаешь, что мы здесь подвергаемся многим наветам? Шутишь и забавляешься, говоришь остроты, возбуждаешь смех, и нисколько не думаешь о деле? Сколько от шуток происходит клятвопреступлений, сколько вреда, сколько сквернословия! Но, говорят, эти шутки не таковы. Однако, послушай, – (апостол) изгоняет всякие шутки.
      cn: 讲笑话有何益处？只会引人发笑罢了。告诉我，鞋匠会去处理不属于他本行的事情，抑或会去购置某种（不合宜的）工具呢？绝不会，因为我们不用的东西，对我们毫无价值。不可有一句闲言，因为从闲谈可以转为不雅（言谈）。现在不是欢愉的时候，而是哭泣、忧愁和哀嚎的时候。而你却在开玩笑？哪个斗士登上竞技场，会放弃与对手的搏斗，转而讲起笑话呢？魔鬼在你身边吼叫着四处游走，企图吞噬你，将一切都树立起来，将一切都引向你的头上，密谋如何将你逐出你的避难所，咬牙切齿，嚎叫着，煽动火焰对抗你的救恩——而你却坐着讲笑话、说空话、言辞不雅？你还能成功战胜它吗？蒙爱者们，我们像孩子一样玩乐啊！想了解圣徒们的生活方式吗？请听保罗所说：「我三年之久，昼夜不住地流泪劝戒你们各人。」(使徒行传 20:31)。既然他对米利都人和以弗所人倾注了如此的关怀——没有讲笑话，而是流泪教导道理——那么你对其他人会怎么说呢？请听他还对哥林多人说什么：「我曾极其忧愁痛苦，心绪烦乱，流着许多眼泪写信给你们。」(哥林多后书 2:4)；还有：「有谁软弱，我不软弱呢？有谁跌倒，我不心焦如焚呢？」(哥林多后书 11:29)。请听他还在别处所说，每日都可说是在渴望从世上迁徙：「因为我们这在帐篷里的人，就叹息劳苦。」(哥林多后书 5:4)。而你却在欢笑和玩乐？现在是战争时期——而你却在做舞者所为之事？你难道没看见交战之人的面容，他们是何等严峻、何等严厉，他们的眉宇之间是何等充满恐惧和威慑吗？在他们身上，你看到的是严峻的面容、振奋的心、勇敢、敏捷、克制、谨慎、警觉的头脑、大大的严谨、大大的整齐和队伍中极大的寂静；更不必说他们不讲任何可耻的言语；他们根本什么也不说。既然他们与有形的仇敌作战，言语上并无遭受任何伤害的危险，尚且保持如此大的寂静，那么你，却必须为言语，甚至为大部分战争而战——你又怎能让你的这一部分暴露无遗呢？难道你不知道我们在这里要遭受许多诽谤吗？你开玩笑和玩乐，讲俏皮话，引人发笑，却丝毫不在意正事吗？多少违誓、多少损害、多少污言秽语都是因笑话而生！但有人说，这些笑话并非如此。然而，请听——（使徒）摒弃一切笑话。
  - type: paragraph
    text:
      ru: Ныне время войны и битвы, бдения и бодрствования, вооружения и приготовления к борьбе. В теперешнее время вовсе не может быть места смеху, потому что это – время мира. Послушай, что говорит Христос:«мир возрадуется; вы печальны будете»(Иоан. 16:20). Христос распялся на кресте из-за твоих злодеяний, а ты смеешься? Он потерпел заушения и столько пострадал из-за твоих бедствий и объявшей тебя бури, а ты веселишься? И разве не тем более ты этим Его раздражаешь? Но так как иным это дело кажется безразличным и таким, от которого трудно уберечься, то рассудим немного об этом и покажем, насколько велико это зло. Это дело дьявола – нерадеть о безразличных (поступках). И, во-первых, если бы это было и безразлично, и в таком случае не должно этим пренебрегать, зная, что от этого происходит много зол, которые возрастают и часто оканчиваются любодеянием. А что это не безразлично, видно из следующего. Посмотрим, откуда (этот порок) происходит. Или лучше, посмотрим, каков должен быть святой. Он должен быть тихим, кротким, скорбящим, плачущим, сокрушенным. Следовательно, кто говорит шутки, тот не святой, какой, будь он хотя и эллин, смешон. Это позволительно только играющим на сцене, где гнусность, там и шутки; где безвременный смех, там и остроты. Послушай, что говорит пророк:«Служите Господу со страхом и радуйтесь [пред Ним] с трепетом»(Пс. 2:11). Шутливость делает душу слабой, ленивой, вялой; она возбуждает часто ссоры и порождает войны.
      cn: 现今是争战和战斗、警醒和守候、武装和预备争战之时。在现今，绝无欢笑之地，因为这是世人欢庆之时。听基督所言：「世人将欢庆；你们却要忧愁」（约翰福音 16:20）。基督为你的恶行被钉死在十字架上，你却在欢笑？祂忍受了掴打，并遭受如此多的苦难，只因你的祸患和笼罩你的暴风雨，你却在作乐？难道你不是因此更使祂恼怒吗？但既然有人认为此事无伤大雅，且难以避免，那么让我们对此略作论述，并揭示此恶之深重。疏忽对待无伤大雅（的行为），是魔鬼的伎俩。首先，即使此事无伤大雅，也不应因此而轻忽，因深知由此会生出许多祸患，这些祸患会滋长，并常以淫乱告终。而此事并非无伤大雅，从以下可见。让我们看看此（恶习）从何而来。或不如说，让我们看看圣人当是何样。他当是安静的、温顺的、悲伤的、哭泣的、痛悔的。因此，讲笑话的人就不是圣人；这样的人，即便他是希腊人，也显得可笑。这只允许在舞台上表演的人；有污秽之处，就有笑话；有不合时宜的欢笑之处，就有讥讽。听先知所言：「当以敬畏事奉上主，又当[在祂面前]战兢欢喜。」（诗篇 2:11）。戏谑使灵魂变得软弱、怠惰、迟钝；它常挑起争吵，并酿成争战。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Что же? Разве ты принадлежишь не к числу мужей? Оставь же то, что свойственно детям. Тебе не нравится, если твой раб говорит на площади что-либо бесполезное; а ты, называя себя рабом Бога, произносишь на площади шутки? Прекрасно, если душа трезвенная, – ее нельзя увлечь; а рассеянной кто не увлечет? Она будет обманута сама собою и не нужно ей будет козней и нападений дьявола. А чтобы тебе лучше узнать (дело), обрати внимание на самое название. Шутником (ευτράπελος) называется человек непостоянный, на все готовый, нетвердый, изменчивый, бывающий всем. Но это – несвойственно тем, которые служат Камню. Такой человек легко изворачивается и переменяется, потому что он должен подражать и изменению лица, и словам, и смеху, и походке (других) и всему; при том ему нужно выдумывать остроты, потому что для него и это необходимо. Но играть комедии несвойственно христианину. При том охотнику до шуток необходимо терпеть сильную вражду со стороны осмеиваемых им, присутствуют ли они при этом, или услышать со стороны. Если это дело хорошее, то зачем оно предоставляется мимическим актерам? Ты делаешься таким актером, и не стыдишься? Для чего вы не позволяете этого свободным вашим (женщинам)? Разве этим вы не свидетельствуете, что это нечестный обычай и неблагопристойное дело? Много зол гнездится в пристрастной до шуток душе, большая рассеянность и пустота: расстраивается порядок, ослабляется благоустройство, исчезает страх, отсутствует благочестие. У тебя язык не для того, чтобы передразнивать другого, а чтобы благодарить Бога. Разве ты не видишь, так называемых, смехотворов, клоунов? Вот они – шутники. Изгоните, умоляю вас, из душ своих это непривлекательное удовольствие: это дело паразитов, мимических актеров, плясунов и публичных женщин. Пусть будет оно далеко от души свободной и благородной, даже и от рабов. Если кто бесчестен, если кто мерзок, тот и охотник шутить. Многим это дело кажется даже добродетелью, и это достойно слез. Как похоть мало-помалу доводит до любодеяния, так и наклонность к шуткам кажется привлекательной, а между тем менее всего привлекательна. Послушай, что говорит Писание:«Грому предшествует молния, а стыдливого предваряет благорасположение»(Сир. 32:12). Но ничего нет бесстыднее шутника; потому уста его исполнены не приятности, а горечи. Изгоним этот обычай из-за трапез. Есть некоторые, которые учат этому даже бедняков. О, нелепость! Шутами делают тех, которые окружены горестями! Где нет этой болезни? Она вошла и вЦерковь, она уже коснулась и Писаний.'
      cn: '那么呢？难道你不属于成年男子之列吗？那就抛弃那些孩子气的东西吧。你的奴仆若在广场上说些无益之事，你尚且不悦；而你，自称是上帝的奴仆，竟在广场上说笑话？灵魂若清醒，是多么美好啊——它就不会被引诱；而涣散的灵魂，谁又不会将其引诱呢？它会自欺，无需魔鬼的诡计和攻击。


        为了让你更好地理解此事，请注意其名称本身。弄臣（ευτράπελος）所指之人是变幻无常、见风使舵、不坚定、易变、逢场作戏之人。然而，这与那些侍奉磐石的人格格不入。这样的人轻易就闪躲和改变，因为他必须模仿他人的表情、言语、笑声、步态以及一切；此外，他还需要编造俏皮话，因为对他而言，这也是必需的。但扮演喜剧角色不符合基督徒的身份。此外，喜爱开玩笑的人必然会遭受被他嘲笑之人的强烈憎恨，无论他们当时在场，还是事后听说。如果此事是好的，那为何只留给哑剧演员去做？你竟成了这样的演员，还不羞耻吗？你们为何不允许你们的自由妇女做此事？难道你们不是以此证明，这是一种不光彩的习俗和不合宜的行为吗？


        喜爱说笑话的灵魂中，滋生着诸多邪恶，极大的涣散和空虚：秩序被扰乱，美德被削弱，敬畏心消失，虔诚不复存在。你的舌头不是用来模仿他人，而是用来感谢上帝的。难道你没看到那些所谓的弄臣、小丑吗？他们就是弄臣。我恳求你们，将这种毫无吸引力的乐趣从你们的灵魂中驱逐出去：这是寄生虫、哑剧演员、舞者和妓女的行径。让它远离自由高贵的灵魂，甚至也远离奴仆。若有人不光彩，若有人卑劣，他便是爱开玩笑之人。许多人甚至认为此事是美德，这实在令人泪下。正如情欲渐渐导致淫乱，喜爱开玩笑的倾向也看似迷人，然而它却最不迷人。请听圣经所言：「闪电先于雷声，恩惠先于谦卑的人。」（德训篇 32:12）但没有什么比弄臣更无耻的了；因此，他的口中充满的不是愉悦，而是苦涩。


        让我们把这种习俗从宴席上驱逐出去。有些人甚至教导穷人这样做。哦，多么荒谬！他们竟让那些被痛苦环绕的人成为弄臣！这种病痛何处没有呢？它甚至已进入教会，它也已触及圣经。'
  - type: paragraph
    text:
      ru: 'Сказать ли нечто, чтобы показать чрезмерность зла? Стыжусь, а все-таки скажу. Я хочу показать, до чего дошло зло, чтобы не подумали, что я занимаюсь мелочами и рассуждаю с вами о чем-нибудь маловажном, чтобы, хотя этим способом мне можно было отвлечь вас от заблуждения. Пусть никто не полагает, что я выдумываю: я скажу то, что слышал. Случилось кому-то быть у одного из тех, которые тщеславятся ученостью, – я знаю, что возбужу смех, а все же скажу; поставивши стол, этот сказал: «хватайте, дети, чтобы не распалился желудок». Равным образом иные говорят: «горе тебе, мамона, и тому, у кого нет тебя». И много таких нелепостей привнесла шутливость, как, например, когда говорят: «теперь нет рождения». Я говорю это, показывая нелепость постыдного обычая, потому что подобные выражения (происходят из) души, чуждой благочестия. Не достойны ли такие (слова) молний? Можно бы найти много и других подобных выражений. Потому, умоляю, изгнавши отовсюду этот обычай, будем говорить то, что нам прилично, и пусть святые уста не произносят слов, свойственных устам бесчестным и позорным.«Какое общение праведности с беззаконием? Что общего у света с тьмой?»(2Кор. 6:14)? Лучше, если мы, удалившись от всего неприличного, в состоянии будем воспользоваться обещанными благами, чем если, занимаясь этим, погубим через то трезвенность ума. Человек шутливый скоро делается злоречивым; а злоречивый способен к бесчисленному множеству и других пороков. Итак, упорядочивши эти два душевные состояния и подчинивши их разуму, как послушных коней, – я разумею похоть и гнев, – поставим над ними возницей ум, чтобы получить награду вышнего звания, которой да сподобимся все мы во Христе Иисусе Господе нашем, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.'
      cn: '难道我该说些什么，来表明邪恶的过分程度吗？我感到羞愧，但我仍然要说。我想表明邪恶已发展到何种地步，以免你们认为我只在讨论琐碎之事，和你们谈论一些不重要的事情，这样，或许我能以此方式将你们从迷误中拉回。愿没有人以为我在凭空捏造：我要说我所听到的。


        有人曾拜访过一位以学识自夸的人——我知道这会引人发笑，但我还是要说；那人摆上桌子后说：「孩子们，快抢吧，免得肚子着火。」同样地，还有些人说：「祸哉，玛门，以及没有你的人。」玩笑之语带来了许多这样的荒谬言论，例如，当他们说：「现在没有出生了。」我说这些，是为了表明这种可耻习俗的荒谬，因为类似的表达（源自）一颗远离虔敬的灵魂。难道这样的话语不配遭雷击吗？还可以找到许多其他类似的表达。因此，我恳求你们，从各处驱逐这种习俗，让我们说那些适合我们的话语，愿圣洁的口舌不要说出那些属于不诚实和可耻之人的话语。「公义与不法有何相交呢？光明与黑暗有何相通呢？」 (哥林多后书 6:14) 更好的是，如果我们远离一切不合宜的事，能够享用所应许的福益，而不是，如果沉溺于此，便因此丧失了心智的清醒。爱开玩笑的人很快就会变得好说闲话；而好说闲话的人则能够犯下无数其他罪恶。


        因此，整理好这两种心灵状态，并使它们服从理性，如同驯服的骏马——我指的是情欲和愤怒——让我们以心智为驾驭者来管理它们，以便获得至高召命的奖赏，愿我们所有人都能在我们的主基督耶稣里配得这份奖赏，与祂一同，愿荣耀、权能、尊贵归于父和圣灵，从今时直到永远，世世代代。阿们。'
