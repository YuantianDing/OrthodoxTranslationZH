      ru: '9.'
      cn: '9.'
    text:
      ru: 'Молитвы у вас пусть будут общие; каждый пусть ходит вцерковь, и муж пусть спрашивает на дому у жены отчет в том, что там говорилось и читалось, а она – у мужа. Когда постигнет бедность, припомни святых мужей – Павла, Петра, которые прославились более всех царей и богачей, а жили как? – в голоде и жажде. Учи свою жену, что ничто так не страшно в жизни, как оскорбить Бога. Если кто женится, так и для этой цели, то он не многим меньше монахов, и женившийся – не женившихся. Если же хочешь сделать обед или устроить пиршество, то не зови никого бесчестного, никого неприличного, но если найдешь какого-нибудь святого бедняка, который может благословить дом ваш, может, ступя к вам ногою, принести всякое благословение Божье; призови его. Скажу еще нечто другое. Никто из вас пусть не старается жениться на такой, которая богаче вас, но лучше на такой, которая беднее. Вошедши с деньгами, она принесет не столько удовольствия, сколько скорби своими упреками, своими излишними требованиями, своей бранью, расточительностью, грубостью. Она, может быть, будет говорить: ты еще ничего не истратил на меня; я одеваюсь на свои деньги, которыми наградили меня родители. Но что ты говоришь, женщина, будто ты одеваешься еще в свое? Что несмысленнее таких слов? Не имеешь своего тела, а имеешь свои деньги? После брака вы уже не две плоти, но сделались«одна плоть», а имений два, а не одно? О, сребролюбие! Оба вы сделались одним человеком, одним живым существом, а ты все говоришь: это мое? От дьявола привнесено это проклятое и пагубное слово. Все, что гораздо необходимее этого, Бог сотворил общим для нас, а это – не общее? Нельзя сказать: мой свет, мое солнце моя вода; все важнейшее – у нас общее, а деньги – не общие? Тысячекратно пусть погибнут деньги, или лучше не деньги, а душевные расположения, которые мешают разумно пользоваться деньгами, и побуждают предпочитать их всему. Между прочим, учи свою жену и этому, только с великой любовью. Так как увещание к добродетели само по себе заключает много тягостного, особенно для нежной и молодой девицы, то, когда будут разговоры о любомудрии, придумывай больше ласковых выражений, и в особенности исторгни из души ее понятия: «мое, твое». Если она скажет: мое, то скажи ей: что ты называешь своим? Я не знаю, я не имею ничего своего. Как ты говоришь: мое, когда все твое? Приласкай ее этими словами. Не видишь ли, что мы так поступаем в отношении к детям? Когда дитя схватит что-нибудь, что мы держим, и захочет еще взять что-нибудь другое, мы ему уступаем и говорим: да, это и то твое. Также станем поступать с женой, – так как разум ее скорее детский, – и когда скажет: мое, говори: все твое и я твой. Эти слова – слова не лести, но великого благоразумия. Этим ты можешь угасить гнев ее и потушить досаду. Лесть состоит в том, когда кто поступает неблагородно по злому расположению; а это – величайшее любомудрие. Итак, говори: и я твой, детушка. В этом меня убедил Павел, который сказал:«муж не властен над своим телом, но жена»(1Кор. 7:4). Если же я не имею власти над собственным телом, но – ты, то тем более – над деньгами. Говоря так, ты успокоишь ее, угасишь огонь, посрамишь дьявола, сделаешь ее рабой, покорной более, чем купленная за деньги; этими словами свяжешь ее.'
      cn: '你们的祷告应当是共同的；每个人都当去教会，丈夫在家中当向妻子询问教会所讲所读的内容，妻子也当向丈夫询问。当贫困来临之时，当思想圣徒保罗和彼得，他们比所有的君王和富人更加闻名，然而他们是如何生活的呢？——在饥渴之中。教导你的妻子，在生活中没有什么比得罪上帝更可怕的了。若有人结婚是为了这个目的，那么他就不比修士们逊色多少，结婚的人也不比未婚的人逊色。倘若你想要设宴或举办盛筵，就不要邀请任何不诚实的人，任何不合适的人，而要寻找一个圣洁的穷人，他能够祝福你的家，或许他一踏入你的家门，就能带来上帝各种的祝福；邀请他。


        我还要再说一些别的。你们中没有人当试图娶比自己富有的女子为妻，而是娶一个更贫穷的为好。她带着金钱进来，带来的不是喜悦，而是悲伤，因着她的指责，她的过度要求，她的谩骂，她的挥霍，她的粗鲁。她或许会说：你还没有为我花过钱；我穿的衣服都是我父母给我的钱买的。但是，妇人，你怎能说你穿的还是你自己的呢？还有什么比这样的话更愚蠢的呢？你的身体都不属于自己了，钱财还属于自己吗？婚姻之后，你们不再是两具身体，而是成为「一体」，难道财产却是两份，而不是一份吗？哦，贪爱金钱之心！你们二人都已成为一个人，一个活生生的存在，你却仍说：这是我的？这句可诅咒又有害的话语，乃是魔鬼所带来。所有比这更必不可少的东西，上帝都为我们创造为共同所有，难道唯独这个不是共同的吗？我们不能说：我的光，我的太阳，我的水；所有最重要的东西我们都是共同拥有，难道金钱不是共同的吗？金钱千次万次地毁灭吧，或者更准确地说，毁灭的不是金钱，而是那些阻碍人合理使用金钱，并促使人将金钱置于一切之上的心灵倾向。


        顺带一提，也要教导你的妻子这些，但要怀着极大的爱。因为劝勉人行善本身就包含许多令人感到沉重之处，尤其是对于柔弱年轻的女子，所以当谈论智慧之道时，要想出更多温柔的言辞，特别是要从她的心中根除「我的、你的」这些观念。如果她说：这是我的，你就对她说：你称为什么是你的？我不知道，我没有任何属于自己的东西。你怎能说「我的」，明明一切都是你的呢？用这些话语来宠爱她。你没看到我们对待孩子时就是这样做的吗？当孩子抓住我们手中的东西，又想要拿别的什么时，我们会顺从他，并且说：是的，这个和那个都是你的。我们也当这样对待妻子，——因为她的心智更像孩子——当她说：我的，你就说：一切都是你的，我也是你的。这些话语不是奉承，而是极大的明智。借此你可以平息她的怒气，熄灭她的怨恨。奉承是指一个人出于恶意而做出不光彩的行为；而这却是最伟大的智慧。所以，你说：我也是你的，亲爱的。保罗在这方面说服了我，他说：「丈夫在自己的身体上没有权柄，妻子才有权柄」（哥林多前书 7:4）。既然我对自己的身体都没有权柄，而是你才有，那么对于钱财就更是如此了。这样说，你会使她平静，熄灭怒火，使魔鬼蒙羞，使她成为仆役，比用钱买来的更顺服；你会用这些话语束缚她。'
  - type: paragraph
    text:
      ru: 'Таким образом, посредством того, что ты говоришь, научи ее никогда не говорить: мое, твое. И не просто зови ее, но с лаской, с честью, с большой любовью. Уважай ее, и она не будет нуждаться в уважении от других, не будет нуждаться в одобрении других, если будет пользоваться твоим (уважением и одобрением). Предпочитай ее всем, во всех отношениях, и в отношении красоты, и благоразумия, хвали ее. Таким образом, ты убедишь ее не внимать никому постороннему, но пренебрегать всеми чужими. Учи ее страху Божию, и все потечет к тебе, как из источника, и дом твой будет исполнен многочисленных благ. Если станем искать нетленного, то придет и это тленное:"Ищите же, – сказано, –прежде Царства Божия и правды Его, и это все приложится вам»(Мф. 6:33). Каковы будут дети от таких родителей? Каковы слуги у таких господ? Каковы все приближенные к ним? Не будут ли и они исполнены бесчисленных благ? Ведь и слуги, по большей части, воспринимают обычаи своих господ и подражают их стремлениям: то же любят, что и они; говорят о том, что узнали от них; тем же и занимаются. Итак, если подобным образом будем направлять самих себя и внимать Писанию, то многому от него научимся, и через это сможем угодить Богу, и всю настоящую жизнь провести в добродетели, и получить блага, обещанные любящим Его, которых да сподобимся все мы благодатно и человеколюбием Господа нашего Иисуса Христа, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.'
      cn: 这样一来，借着你所说的话，教导她永不提及：「我的」、「你的」。并且不要只唤她的名字，而要以温存、尊敬和深挚的爱意。尊重她，她就不再需要他人的尊重，不再需要他人的认可，只要她享有你的（尊重和认可）。在一切事上都偏爱她胜过众人，在各方面，无论是在美貌上，还是在明智上，都要赞美她。这样一来，你就会使她相信，不去理会任何外人，而是轻忽一切陌生人。教导她敬畏上帝，一切都会如源泉般涌向你，你的家将充满无数的福分。倘若我们寻求不朽坏的，那么这朽坏的也必随之而来：「你们要先求上帝的国和祂的义，这一切就都要加给你们了。」（马太福音 6:33）。这样的父母，他们的孩子将是怎样的呢？这样的主人，他们的仆役将是怎样的呢？凡与他们亲近的人，又将是怎样的呢？他们难道不也会充满数不清的福分吗？因为仆役大多会沾染他们主人的习性，效法他们的志向：喜爱他们所喜爱的；谈论他们从主人那里所学到的；并且做着同样的事情。那么，倘若我们以同样的方式引导自己，并留心圣经，就能从中学习到许多，并借此得以取悦上帝，在今生尽行美德，并获得上帝应许给爱祂之人的福分，愿我们所有人都蒙我们主耶稣基督的恩典和仁爱，得享这些福分，愿荣耀、权能、尊贵归于与祂同在的父和圣灵，从今时直到永远，世世代代。阿们。
- type: heading1
  text:
    ru: Беседа 21
    cn: 第 21 讲
  children:
  - type: paragraph
    text:
      ru: Еф.6:1–3.Дети, повинуйтесь своим родителям в Господе, ибо сеготребуетсправедливость.
      cn: (以弗所书 6:1-3) 你们作儿女的，要在主里顺从你们的父母，因为这乃是公义所要求的。
  - type: paragraph
    text:
      ru: 'Почитай отца твоего и мать, это первая заповедь с обетованием:'
      cn: 尊敬你的父亲和母亲，这是第一条带着应许的诫命： (以弗所书 6:2)
  - type: paragraph
    text:
      ru: да будет тебе благо, и будешь долголетен на земле.
      cn: 愿你蒙福，并在这地上得享长寿。
  - type: paragraph
    text:
      ru: Пороки при царском дворе. – Восхваление монаха Юлиана. – При каких условиях богатство наносит вред.
      cn: 宫廷罪恶。– 颂扬修士尤利安。– 在何种条件下财富会带来危害。
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: Как художники, изображая тела, начинают с головы, потом переходят к шее, и наконец к ногам, – точно так поступает блаженный Павел в своих речах. Сказав прежде о муже, потом о жене, второй власти, наконец последовательно приступает к третьей, – говорит о детях, – потому что над женой господствует муж, а над детьми муж и жена. Итак, слушай, что он говорит:«Дети, повинуйтесь своим родителям в Господе,.. это первая заповедь с обетованием». Здесь не беседует ни о Христе, ни о (других) возвышенных предметах, потому что умы, к которым обращает свою речь, еще нежны; поэтому же и увещание делает краткое, так как дети не могут следить за длинным словом. По этой же причине и о царствии (Божьем) не говорит, – не такому возрасту слушать об этом, – но чего больше всего и особенно желает слышать младенческая душа, о том и говорит, именно, что она будет долголетна. Если же кто станет доискиваться, отчего (апостол) не говорит детям о царствии, а предлагает заповедь из закона (Моисеева), – тем мы скажем, что (он поступил так с ними потому, что) они еще очень молоды, и потому еще, что весьма хорошо понимал, что если муж и жена верны будут тому закону, который он им изложил, то для них не будет стоить большего труда подчинить и детей тому же закону. Когда дело получает доброе начало и имеет верное и прочное основание, тогда оно идет и направляется весьма легко. Но положить основание и поставить опору – в этом-то и заключается немаловажная трудность."Дети, – говорит он, –повинуйтесь своим родителям в Господе», т. е. по воле Господа, – Бог, говорит, повелел так. Но как поступать, если бы приказания были непристойные? Правда, едва ли какой-нибудь отец, даже самый бесчестный, станет приказывать своим детям что-либо непристойное. Однако ж и для подобного случая (апостол) дает наставление, сказав:"в Господе", т. е. так, чтобы (исполнением воли родителей) тебе не оскорбить Бога. Например, если отец будет язычник, или еретик, то уже не следует слушаться его, потому что это не"в Господе".
      cn: '艺术家们在描绘人体时，先从头部开始，然后转到颈部，最后到双腿，——蒙福的保罗在他的训言中也正是如此。他先论及丈夫，然后论及妻子（这第二重权柄），最后循序渐进地论及第三重权柄——孩子们，——因为丈夫管辖妻子，而丈夫和妻子共同管辖孩子们。


        那么，请听他说：


        「孩子们，你们要在主里顺从父母，……这是第一条带着应许的诫命。」


        在这里，他既不谈论基督，也不谈论（其他）高深的事物，因为他所谈及的心智尚且稚嫩；因此，他也将劝勉说得很简短，因为孩子们无法理解冗长的言语。出于同样的原因，他也不谈论（上帝的）国度，——那样的年龄尚不适合听闻此事，——相反，他所谈论的，正是稚嫩的灵魂最渴望、最特别想听到的事，即它将得以长寿。如果有人探究，为何（使徒）不向孩子们谈论国度，却提出（摩西的）律法中的诫命？——对此，我们要说，（他这样做是因为）他们尚且年幼，并且还因为他非常清楚，如果丈夫和妻子忠于他所阐述的律法，那么让他们使孩子也顺从同一律法，将不会费太大的力气。当事情有了一个良好的开端，并拥有真实而坚固的基础时，它就会进展并导向得非常顺利。然而，奠定基础并树立支撑，这本身就蕴含着不小的难度。


        「孩子们，」他说，「你们要在主里顺从父母。」意思是：按照上主的旨意——上帝说，他命令如此。然而，如果父母的命令是不合宜的，该如何做呢？诚然，几乎没有任何父亲，即使是最不正直的，会命令自己的孩子做任何不合宜的事。然而，即使对于类似的情况，（使徒）也给出了指导，他说：「在主里」，也就是说，（通过遵行父母的意愿）你不会触犯上帝。例如，如果父亲是异教徒或异端，那么就不应再听从他，因为这并非「在主里」。'
  - type: paragraph
    text:
      ru: Но в каком смысле сказано:«это первая заповедь»? Первыми следовало бы назвать:«Не убей, не прелюбодействуй». (Апостол) называет эту заповедь первой не в отношении к порядку, а в отношении к обетованию. Одни заповеди, как направленные против зла и в отвращение зла, не соединены с наградой, а к другим, как руководящим к совершению добра, прилагается и обетование. Заметь, какое удивительное основание для добродетели полагает (апостол), – и справедливо, – в почитании и уважении родителей! Запретив худые поступки и намереваясь приступить (к учению) о добрых делах, он заповедует, прежде всего, почтение к родителям, так как они для нас после Бога главные виновники жизни; поэтому справедливо они же первые имеют право вкусить от нас добрых (плодов), а потом и все прочие люди. Если же кто непочтителен к родителям, тот будет ли когда-нибудь таковым в отношении к сторонним лицам?
      cn: 但在何种意义上，经文说：「这是第一条诫命」呢？首先应该提及的诫命是：「不可杀人，不可奸淫。」（使徒）称这条诫命为首要的，并非按着次序，而是按着应许。有些诫命，作为对抗罪恶和拒绝罪恶的指引，并不伴随着奖赏；而另一些作为引导人行善的诫命，则附带着应许。请注意，（使徒）在孝敬和尊敬父母一事上，为德行奠定了何等奇妙且公义的基础！在禁止了恶行之后，并在意欲着手教导善行之时，他首先吩咐孝敬父母，因为他们对我们而言，在上帝之后是生命的主要源头；因此，公义地，他们最先有权从我们这里领受善果，然后才是所有其他的人。然而若有人不孝敬父母，那他是否会对待外人如此（孝敬）呢？
  - type: paragraph
    text:
      ru: 'Сделав увещание, какое нужно было, детям, (апостол) переходит к отцам, говоря:«И вы, отцы, не раздражайте детей ваших, но воспитывайте их в учении и наставлении Господнем»(Еф.6:4). Не сказал: любите их; к этому влечет их, хотя бы они этого не хотели, самая природа, а потому излишне было полагать закон касательно этого предмета. Но что говорит?«не раздражайте детей ваших», как это делают многие родители, лишая детей своих наследства, оставляя их без призрения, обращаясь с ними жестоко, как с рабами, а не как со свободными. Поэтому говорит:«не раздражайте детей ваших». Затем, что самое главное, указывает, как сделать их послушными, и говорит, что это всецело зависит от главы и начальника. Как причину послушания жены он указал в ее муже, с которым потому и говорит о многом, умоляя его, между прочим, привлекать к себе жену силою любви, так и в настоящем случае в нем же полагает причину (послушания детей), когда говорит:«но воспитывайте их в учении и наставлении Господнем». Видишь ли, что, когда есть духовное (добро), за ним явится и плотское? Хочешь ли, чтобы сын твой был послушен? С детства воспитывай его«в учении и наставлении Господнем». Не думай, чтобы слушание Божественных Писаний было для него делом излишним. Там он услышит прежде всего:«Почитай отца твоего и мать»– слова, направленные к твоей пользе. Не говори: это (слушание Писаний) дело монахов; ужели мне сделать его монахом? Нет надобности быть ему монахом! Что это в тебе за страх, – боишься того, что преисполнено многих выгод? Сделай его христианином. И мирянам весьма нужно внимать учению, заключающемуся здесь (в Писании), а особенно детям. Дети в этом возрасте многого не знают, к незнанию же присоединяется еще то, что они узнают нечто из сочинений языческих, изучая в них жизнь дивных, по их понятиям, героев, которые служили страстям и боялись смерти, каков, например, Ахиллес, безутешный и умирающий за наложницу, или другой, предающийся пьянству, и прочее в этом роде. Итак, он (сын твой) нуждается в этих лекарствах.'
      cn: '在对孩子们作了必要的劝诫之后，（使徒）转而对父亲们说：「你们作父亲的，不要惹儿女的气，却要在主的教训和劝诫中养育他们」（以弗所书 6:4）。他没有说：要爱他们；因为即使他们不愿意，天性也会驱使他们这样做，所以就没有必要就此颁布律法。但他说什么呢？「不要惹儿女的气」，许多父母就是这样做的，他们剥夺子女的继承权，任凭他们无人照管，像对待奴隶一样残酷地对待他们，而不是像对待自由人一样。因此他说：「不要惹儿女的气。」接着，他指出最重要的事，即如何使他们顺从，并说这完全取决于一家之主和当家人。正如他将妻子顺从的原因归结于她的丈夫，所以他也与丈夫说了许多话，恳求他，除其他事项外，要以爱之力吸引妻子归向自己，同样，在当前的情况下，他也将（子女顺从的）原因归结于父亲，当他说：「却要在主的教训和劝诫中养育他们」时。


        你看到了吗？当有属灵（之善）时，属肉体（之善）也会随之而来。你希望你的儿子顺从吗？从小就「在主的教训和劝诫中」养育他。不要以为听闻神圣的《圣经》对他来说是多余的。在那里，他首先会听到：「要孝敬你的父亲和母亲」——这些话语都是为了你的益处。不要说：这是修士们的事；难道我要让他成为修士吗？他没有必要成为修士！你为何如此害怕——害怕那充满诸多益处的事物呢？让他成为基督徒吧。平信徒们也极其需要留意这（圣经中）的教训，尤其是孩子们。孩子们在这个年纪有许多不明白的事，除了无知之外，他们还会从异教作品中了解到一些事物，在其中学习他们心目中那些「了不起的」英雄生平，这些英雄服从于情欲并惧怕死亡，例如阿喀琉斯，因一个妾而悲痛欲绝并丧命，又如另一个沉溺于醉酒，以及诸如此类的事。因此，他（你的儿子）需要这些良药。'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Не безрассудно ли учить детей искусствам, посылать их для этого в училище, ничего не жалеть для этого, а о воспитании их«в учении и наставлении Господнем»не заботиться? Сами же мы первые и пожинаем плоды такого воспитания детей своих, видя их дерзкими, невоздержанными, непослушными, развратными. Не будем же поступать таким образом и послушаем увещания блаженного (Павла): станем воспитывать их«в учении и наставлении Господнем», подадим им пример, заставим их с раннего возраста упражняться в чтении Писаний. Увы! Я постоянно говорю это, только, мне думается, понапрасну. Но, при всем том, я не перестану исполнять свой долг. Отчего, скажите мне, вы не подражаете древним? Особенно вы, женщины, должны бы ревновать дивным древним женам. Родилось у тебя дитя, – подражай Анне. Послушай, как поступила она: она тотчас привела его в храм. Кто из вас не пожелал бы, чтобы его сын лучше был однажды Самуилом, чем тысячу раз царем всей вселенной? Скажете: как это можно? А почему же невозможно? Потому только невозможно, что ты не желаешь и не поручаешь его Тому, кто может сделать его таковым. Кто же, спросите, может это сделать? Бог. Потому она (Анна) Ему и поручила (своего сына) (1Цар.1). Сам Илий не очень был способен к тому, чтобы образовать его; да и как он мог это сделать, когда не в силах был (управиться) со своими собственными детьми? Но вера женщины и ее усердие всего достигли. Родив первенца, одного, и еще не зная, будут ли у нее другие дети, она не говорила: подожду; вот вырастет ребенок; пусть насладится жизнью; позволю ему у себя провести отроческие годы. Нисколько не думая об этом, она помышляет об одном, как бы посвятить от начатков этот образ духовный Богу. Устыдимся мы, мужчины, такого любомудрия женщины: она представила его Богу, и там его оставила. Это прославило и супружеский союз ее, потому что, принесши первый плод (Богу, она этим показала, что) искала, прежде всего, духовного; поэтому-то и чрево ее сделалось благоплодным, и она имела потом других детей; поэтому же она видела, каким почетом в мире пользовался (сын ее). Если и люди за почтение платят почтением, то не гораздо ли более Бог, Который впрочем нередко делает это, и не будучи сам почитаем? Доколь же мы будем оставаться плотскими? Доколь будем пресмыкаться по земле? Все у нас должно быть второстепенным в сравнении с заботой о детях и с тем, чтобы воспитывать их«в учении и наставлении Господнем».'
      cn: 这岂不是不明智的吗？教导孩子们艺术，为此把他们送到学堂，为此不惜任何代价，然而却不关心他们「在上主的教训和训诲中」的教养？我们自己首先就尝到了这样教养孩子们的苦果，看见他们变得傲慢、放纵、不顺服、败坏。我们就不要再这样做，听从蒙福者（保罗）的劝勉：我们要「在上主的教训和训诲中」教养他们，给他们树立榜样，让他们从小就勤于阅读圣经。唉！我常常这样说，但我想，这恐怕是徒劳无功。然而，尽管如此，我也不会停止履行我的职责。告诉我，为什么你们不效法古人呢？尤其是你们，妇女们，应该效法那些奇妙的古时妇女。你生了一个孩子，就效法安娜。听听她怎么做的：她立刻把他带到了圣殿。你们当中有谁不希望自己的儿子宁可一次做撒母耳，也不愿一千次做全宇宙的君王呢？你们会说：这怎么可能呢？为什么不可能呢？之所以不可能，仅仅是因为你不情愿，也不将他托付给那位能使他成为如此的祂。你们会问，谁能做到这一点呢？上帝。因此她（安娜）将她的儿子托付给了祂（撒母耳记上 1章）。以利自己并不是很能造就他；当他连自己的孩子都管教不好时，他又怎能做到呢？但这位妇女的信心和她的热心成就了一切。生了头生子，这一个，并且还不知道她是否会有其他孩子，她没有说：我再等等；等这孩子长大了；让他享受一下生活；让他先在我身边度过童年岁月。她丝毫没有考虑这些，她只想着一件事，如何将这属灵的样式从起初就献给上帝。我们男人啊，应该为这位妇女的智慧感到羞愧：她将他呈献给上帝，并在那里将他留下。这也荣耀了她的婚姻，因为，她将头生之子献给上帝，以此表明她首先寻求的是属灵的事；因此她的子宫变得蒙福多产，她后来也生了其他孩子；因此她也看见她的儿子在世上享有多大的尊荣。如果人尚且以尊崇回报尊崇，那么上帝岂不更是如此吗？何况祂常常这样做，即便祂自己不受尊崇时也是如此？我们还要在肉体中滞留多久呢？我们还要在地上匍匐多久呢？对我们而言，一切都应次于对子女的关怀，以及在「上主的教训和训诲中」教养他们。
  - type: paragraph
    text:
      ru: 'Кто, прежде всего, научится быть любомудрым, тот через это приобретет богатство, превосходящее всякое богатство, и величайшую славу. Не так полезно образовать сына, преподавая ему искусство и внешнее знание, посредством которых он станет приобретать деньги, как научить его искусству презирать деньги. Если хочешь сделать его богатым, поступай таким образом. Богат не тот, кто нуждается в большом имуществе и владеет многим, а тот, кто ни в чем не имеет нужды. Это внушай твоему сыну, этому учи его; в этом – величайшее богатство. Не заботься о том, чтобы сделать его известным по внешней учености и доставить ему славу, но старайся, чтобы научить его презирать славу настоящей жизни; от этого он будет славнее и знаменитее. Это возможно сделать и богатому и бедному; этому научаются не от учителей и не при пособии наук, а из Божественных Писаний. Не заботься, чтобы сын твой здесь пожил долго, но чтобы там удостоился жизни беспредельной и нескончаемой. Давай ему великое, а не малое. Внимай словам Павла:«воспитывайте их в учении и наставлении Господнем». Не ритором старайся сделать его, но научи его любомудрствовать. Если он не будет ритором, отсюда не произойдет еще никакого вреда; а при отсутствии любомудрия, самое обильное риторство не принесет никакой пользы. Нужно благоповедение, а не остроумие, нравственность, а не сила речи, дела, а не слова: вот что доставляет царство, дарует действительные блага. Не язык изощряй, но душу очищай. Говорю это не с тем, чтобы запретить образование, но – чтобы не привязывались к нему исключительно. Не думай, будто одним монахам нужны наставления от Писаний; весьма многие из этих наставлений потребны и для тех детей, которые должны вступить в эту (мирскую) жизнь. Как при снаряжении корабля нужен бывает кормчий и полное число пловцов не тому, кто всегда стоит на пристани, но тому, кто постоянно занимается мореходством, точно то же (должно сказать) и относительно монаха и мирского человека. Первый, как бы находясь на необуреваемой Пристани, проводит жизнь беззаботную и огражденную от всякого волнения; а последний постоянно обуревается и плывет среди моря, сражаясь со множеством треволнений. Хотя бы он сам (мирской человек) и не имел нужды (в наставлении), но ему оно может быть нужно, чтобы, если случится, он был в состоянии заградить уста других.'
      cn: 凡是首先学会爱慕智慧的人，将因此获得超越一切的财富和至高无上的荣耀。教导儿子技艺和外在知识，使其能赚取金钱，不如教导他蔑视金钱的技艺那样有益。如果你想使他富有，就如此行。富有之人并非需要大量财产且拥有许多之人，而是那万事不缺之人。将此灌输给你的儿子，以此教导他；这便是至大的财富。不要致力于使他以外在学识著称并带给他荣耀，而要努力教导他蔑视今生的荣耀；如此，他将更蒙荣耀、更加著名。富人与穷人都能做到这一点；这不是从教师那里，也不是借由学问的帮助学到的，而是从神圣经文中学到的。不要关心你的儿子在此地长寿，而要关心他能在彼处蒙受无限且永无止尽的生命。给他伟大的，而非微小的。留意保罗的话语：「用上主的教导和训诲来教养他们。」不要努力使他成为一名演说家，而要教导他爱慕智慧。如果他不成演说家，也不会因此带来任何损害；但若缺乏智慧，最丰富的修辞术也毫无益处。所需要的是良好品行而非机智，是品德而非雄辩之才，是行动而非言语：这才能带来国度，赐予真正的美善。不要磨砺口舌，而要洁净灵魂。我说这话并非为了禁止教育，而是为了不让人们完全依附于它。不要以为只有修士才需要来自经文的训诲；这些训诲中，有许多也为那些将要进入这（世俗）生活的孩子们所需要。正如装备船只时，舵手和足够多的水手并非为那总是停靠在码头的人所需，而是为那持续航海的人所需，关于修士和世俗之人，也同样如此。前者，如同身处不受风暴侵袭的港湾，过着无忧无虑、远离一切风浪的生活；而后者则持续受到风暴侵袭，在海上航行，与众多波涛搏斗。即使他自己（世俗之人）不需要（训诲），但他也可能需要它，以便在情况发生时，他能堵住他人的口。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Поэтому, кто, чем большим пользуется почетом в настоящей жизни, тем более, нужно для него такое образование. Вращается ли кто в царском дворце, – там много эллинов, философов, людей надутых временной славой, – здесь точно место, наполненное страдающими водянкой. Таков именно царский двор. Там все напыщены и надуты, а кто нет, те стараются сделаться такими. Каково же, подумай, если сын твой, вступивши туда, входит, как самый лучший врач, с инструментами, которые в состоянии укротить надменность каждого, подходит к каждому и разговаривает, врачует больное тело, прикладывает лекарство из Писаний, расточает любомудрые речи. Инок с кем будет говорить? Со стеной (своей кельи) или с кровлей? С пустыней или дебрями? С горами или деревьями? Итак, для него не очень необходимо подобное учение; несмотря на то, он старается усовершить себя в нем, не с тем, чтобы других наставлять, а самого себя. Что же касается людей, живущих в этой (мирской) жизни, то им весьма нужно такое учение, потому что мирскому человеку более представляется соблазнов к греху, нежели монаху. И, если тебе угодно, знай, что он (с таким образованием) и в свете будет самым приятным человеком. Все станут уважать его за такие речи, когда увидят, что он не вспыльчив и не домогается власти; впрочем, он получит власть и не домогаясь ее, и у царя будет в большом почете. Ведь такому нельзя укрыться: здоровый среди множества здоровых может остаться незамеченным; но если между множеством больных найдется один здоровый, то слух о нем скоро достигнет ушей царских, и ему будет поручено начальство над многими народами. Зная это,«воспитывайте их в учении и наставлении Господнем». А если кто-нибудь беден? Пусть останется бедным. Что он не будет находиться при дворе, этим он нисколько не будет ниже того, кто служит при дворе; напротив может сделаться предметом удивления, и скоро получить власть, какую ему угодно, а не ту, какая достается по назначению. Если эллины, люди, стоящие не более трех оболов, циники (κύνες– собаки), принявши такую же, стоящую не более трех оболов, философию (подлинно такова эллинская философия), или вернее – не самую философию, а только ее имя, облекшись в мантию и отрастивши волосы, посрамляют многих, – то не к большему ли способен истинный философ. Если ложная личина, только кажущаяся тень философии так возвышает, то что, когда мы полюбим истинную светлую философию? Не все ли станут уважать ее? Не поручать ли таким (философам), без всякого опасения, и дома, и жен, и детей? Но нет, нет ныне таких философов! А потому нельзя найти и примера. Есть, впрочем, между монахами, между мирянами же нет. Что между монахами находятся такие примеры, в доказательство можно привести многих; но я укажу на одного из многих.'
      cn: 因此，凡是今生越受尊崇之人，就越是需要这样的教养。倘若有人身处王宫之中——那里有许多希腊人、哲学家，以及那些因世俗荣耀而自命不凡之人——此地正是充满患水肿病者之处。王宫正是如此。众人皆骄傲自大、狂妄自负，而那些不如此之人，也竭力使自己变得如此。试想，若你的儿子进入其中，如同最好的医生，带着能制服每个人的傲慢的工具，走到每个人身边与他们交谈，医治病体，敷上源自圣经的良药，倾洒智慧之言，那该是何等光景！隐修士将与谁交谈？与他（隐修室）的墙壁还是屋顶？与旷野还是荒原？与高山还是树木？因此，对他而言，这样的学问并非非常必要；尽管如此，他仍努力于其中完善自我，并非为了教导他人，而是为了自己。至于那些生活在这（世俗）尘世中的人，他们极其需要这样的学问，因为世俗之人所面临的犯罪诱惑远多于修士。并且，若你愿意，须知他（拥有如此教养）在世人眼中也将是最令人喜爱之人。众人皆会因他此等言谈而敬重他，当他们看到他不暴躁、不觊觎权力之时；况且，他会不求自得地获得权力，并在君王面前大受尊崇。盖因此等之人无法隐藏：一个健康之人置于众多健康之人中或可不为人所察觉；但若在众多病患之中寻得一位健康之人，则关于他的消息很快便会传至君王耳中，他将被委以统领众多民族的重任。须知此理，「当照着上主的教训和告诫养育他们。」若有人贫穷呢？就让他保持贫穷吧。他不身处朝廷之事，绝不会使他逊色于在朝廷供职之人；相反，他反而能成为令人惊叹的对象，很快就能获得他所乐意的权柄，而非按任命所授予的。如果希腊人，那些身价不超过三个奥波尔之人，犬儒派（κύνες——犬），接受了同样身价不超过三个奥波尔的哲学（诚然，希腊哲学正是如此），或者更确切地说，并非哲学本身，而只是其名，披上长袍，蓄留长发，便能使许多人蒙羞——那么，真正的哲学家难道不能成就更大的事吗？如果这虚假的伪装，这仅仅是哲学的表象和影子，尚能如此提升人，那么，当我们热爱那真实、光明的哲学时，又会如何呢？岂不是人人都会敬重它吗？难道不会毫无顾虑地将家室、妻儿都托付给这样（的哲学家）吗？然而，不，如今没有这样的哲学家！因此也找不到榜样。然而，在修士中却有，而在平信徒中则无。至于修士中存在这样的榜样，可以举出许多证据；但我将从众多榜样中指出一位。
  - type: paragraph
    text:
      ru: 'Вероятно, вы знаете, слыхали, а некоторые, конечно, и видали человека, о котором я намерен говорить теперь: я разумею дивного Юлиана. Это был человек простого звания, смиренный; родился он в незнатном месте и вовсе несведущ был в светской мудрости, но преисполнен истинного любомудрия. Когда он являлся в городе, – что случалось редко, – то около него столько стекалось народа, что ни около риторов, ни около софистов, ни около другого кого не бывало подобного стечения. Что же сказать об этом? Не более ли всех царей прославляется имя его и поныне? Итак, если столько (возвышены истинные любомудры) в этом мире, где Владыка не обещал нам никакого блага, – в мире, в котором, по Его словам, мы чужие, – то размыслим, какие блага уготованы для них на небесах? Если здесь, где они пришельцы, такая им честь, то какой славой они будут наслаждаться там, где они – граждане? Если здесь, где обещана скорбь, таков им почет, то каково будет успокоение их там, где общаются действительные почести? Хотите ли, чтобы мы указали и на (любомудрствующих) мирян? Но теперь их нет у нас. Правда, и между мирянами есть люди благоговейные, но они не восходят на высоту любомудрия. А потому, представлю вам примеры из древних святых. Сколь многие из тех, которые имели жен и воспитывали детей, были ничуть не хуже, повторяю, ничуть не хуже упомянутых нами! Но теперь их уже нет, вследствие наступившей нужды, как говорит этот блаженный. О ком же, хотите, чтобы я вам сказал? О Ное, или об Аврааме? О сыне последнего, или о сыне первого? Или об Иосифе? Или вы хотите послушать о пророках – Моисее, или Исайи?'
      cn: '你们大概知道，听说过，而有些人，当然，也亲眼见过我打算现在谈论的这个人：我指的是奇妙的尤利安。他出身卑微，为人谦卑；生于无名之地，完全不通世俗智慧，却充满真正的爱智。当他出现在城里时——这种情况很少发生——如此多的人们聚集在他身边，以至于无论是修辞学家，还是诡辩家，抑或是其他任何人，都未曾有过如此这般的聚集。对此我们能说什么呢？他的名声至今不是比所有君王都更受赞颂吗？


        那么，如果在这个世界上——上主并未应许我们任何福乐，按祂的话说，我们是客旅——真正的爱智者如此受人尊崇，那么，我们想一想，天国为他们预备了怎样的福乐呢？如果在此地，他们是寄居者，尚且拥有如此的尊荣，那么在彼地，他们是公民，又将享有何等的荣耀呢？如果在此地，应许的是苦难，他们却得到如此的敬重，那么在彼地，分享的是真实的尊荣，他们的安息又将是怎样的呢？你们是否希望我们也指出（秉持真智慧的）平信徒呢？但如今我们这里没有这样的人了。的确，平信徒中也有虔敬的人，但他们未能达到爱智的崇高境界。因此，我将给你们举出古代圣徒的例子。那些有妻室、抚养子女的人中，有多少位，我重复一遍，丝毫不逊于我们所提及的人！但如今他们已不在了，正如这位蒙福者所言，这是由于时世的需要。


        那么，你们希望我向你们谈论谁呢？挪亚，还是亚伯拉罕？后者的儿子，还是前者的儿子？抑或是约瑟？抑或是你们想听听关于先知——摩西，还是以赛亚呢？'
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Но, если угодно, остановим слово на Аврааме, на которого особенно все указывают нам постоянно. Не имел ли он жены? Не было ли у него детей? Скажу вам и сам то же самое, что вы говорите нам. Он имел жену, но не это сделало его знаменитым, что у него была жена. Имел богатство, но не через богатство сделался угодным Богу. Родил детей, но и не за то был ублажаем, что имел детей. Приобрел триста восемнадцать домочадцев, но и не поэтому сделался предметом удивления. Хочешь ли знать, что (его прославило)? То, что он любил странников, презирал богатство, был скромен. Скажи мне, какое свойство философа? Не презирать ли богатство и славу? Не стоять ли выше зависти и всякой страсти? Теперь поставим на средину Авраама, разоблачим его и посмотрим, каков он был философ? Во-первых, он не дорожил отечеством:"пойди, – сказал ему (Господь), –из земли твоей, от родства твоего»(Быт. 12:1), – и он тотчас вышел. Его не удержал в этом случае ни родительский дом, ни узы дружбы, и ничто другое, – иначе он бы не вышел. Потом, он нисколько не дорожил ни славой, ни богатством; так, когда на войне он обратил в бегство неприятелей, и ему предлагали взять добычу, он с презрением отверг ее. Равным образом и сын его не через богатство свое сделался достойным удивления, но за страннолюбие, не потому, что имел детей, но потому, что был послушен, и не потому, что имел жену, а потому, что жена его была неплодная. (Оба они, Авраам и Исаак) считали за ничто настоящую жизнь, не искали богатства и всем пренебрегали. Скажи мне, какие из растений самые лучшие? Не те ли, которые сами в себе содержат силу, и ни от дождя, ни от града, ни от стремления ветров, ни от других каких-нибудь подобных причин не терпят вреда, но стоят открыто, и не имея нужды ни в кровле, ни в ограждении, как бы все презирают? Таков истинный философ, таково его богатство! Он ничего не имеет, и все имеет; все имеет, и ничего у него нет. Стена не внутри, а извне, и ограда не от природы, а отвне воздвигается. Еще, скажи мне также, какое тело бывает особенно крепко? То ли, которое здорово, которое удобно переносит голод, не требует пресыщения, не терпит от стужи, равно как и от жара, – или то, которое неспособно переносить всего этого, и, кроме того, для своего здоровья нуждается в поварах, ткачах, охотниках и врачах? Подлинно, только истинный философ, который не нуждается ни в чем подобном, есть богач. Поэтому-то блаженный (Павел) и говорил:«воспитывайте их в учении и наставлении Господнем». Итак, не во внешних благах ищите ограждения (для детей своих): в этом богатство, в этом слава. Когда (временная слава и богатство) пройдут, – а они непостоянны, – то (люди, обладавшие ими) бывают подобны беспомощному, поврежденному растению, которое не только не приносило никакой прибыли в прошедшем, но еще производило убыток. Так защита, которая должна была ограждать от стремления ветров, теперь вдруг произвела падение.'
      cn: '然而，如果愿意的话，让我们把话停留在亚伯拉罕身上，他是众人一直特别向我们指出的。他不是有妻子吗？他不是有孩子吗？你们对我们说的，我自己也对你们说同样的话。他有妻子，但使他闻名的并非他有妻子这件事。他有财富，但并非通过财富而蒙上帝喜悦。他生了孩子，但也并非因此而蒙福，因为他有孩子。他得了三百一十八个家仆，但也并非因此而成为众人惊叹的对象。你想知道是什么使他得荣耀的吗？那就是，他爱慕客旅，蔑视财富，且为人谦卑。


        告诉我，哲人的特质是什么？不就是蔑视财富和虚名吗？不就是超乎嫉妒和一切情欲之上吗？现在，让我们把亚伯拉罕放在中间，审视他，看看他是一个怎样的哲人？首先，他不眷恋故土：「去吧，」上主对他说，「离开你的本地和你的亲族」（创世记 12:1），他就立刻离开了。在这种情况下，无论是父母的家，还是友谊的羁绊，或任何其他事物，都无法留住他——否则他就不会离开了。其次，他丝毫不看重虚名和财富；比如，当他在战争中击溃敌人时，人们提议他拿取战利品，他却轻蔑地拒绝了。同样，他的儿子（以撒）并非因其财富而变得值得惊叹，而是因为他的好客；并非因为他有孩子，而是因为他顺从；并非因为他有妻子，而是因为他的妻子不育。（亚伯拉罕和以撒二人都）视今生为无物，不追求财富，并轻视一切。


        告诉我，哪种植物是最好的？难道不是那些自身蕴含力量的植物吗？它们既不受雨水、冰雹、强风之害，也不受任何其他类似原因的损害，而是坦然矗立，既不需要屋顶，也不需要围护，仿佛蔑视一切？这就是真正的哲人，这就是他的财富！他一无所有，却拥有一切；他拥有一切，却一无所有。墙垣不是在里面，而是在外面；围栏不是来自天然，而是从外部竖立起来的。此外，也请告诉我，什么样的身体才特别强健？是那种健康的、能轻易忍受饥饿、不需要饱足、不受严寒或酷热之苦的身体吗？还是那种无法忍受这一切的身体，而且，为了自己的健康，还需要厨师、织工、猎人和医生？确实，只有真正的哲人，他不需要任何类似之物，才是富足之人。


        因此，福哉的（保罗）曾说：「按着上主的教训和警戒养育他们。」所以，不要在外在的财富中为（你们的孩子）寻求护卫：财富和荣耀都在于此。当（世俗的虚名和财富）过去时——而它们是不稳定的——那么（拥有它们的人）就如同无助的、受损的植物，这种植物不仅在过去没有带来任何收益，反而造成了损失。如此一来，那本应抵御强风的保护，如今却突然导致了倾覆。'
  - type: paragraph
    text:
      ru: Значит, богатство скорее вредит, если делает нас неподготовленными к перенесению превратностей жизни. Итак, образуем детей так, чтобы они могли переносить все, и знали, как должно поступать среди несчастий, воспитаем их«в учении и наставлении Господнем», – и нам воздастся великая награда. В самом деле, если люди, делающие изваяния царей и пишущие их портреты, пользуются большим почетом, то мы, которые украшаем образ Царя небесного (потому что человек есть образ Божий), не будем ли наслаждаться гораздо большими благами за то, что восстановляем Божье подобие? Именно с этим может сравниться добродетель души, когда научим детей быть добрыми, нераздражительными, непамятозлобными, готовыми на благодеяния, человеколюбивыми (что все свойственно Богу), и когда наставим их не дорожить земными благами. Итак, образовать и упорядочить себя и их – вот наша обязанность! Иначе, как мы дерзнем предстать престолу Христову? Ежели тот, у кого дети необузданны, недостоин епископства, то тем более (он недостоин) царства небесного. Но что ты говоришь? Ужели, если наши жены и дети будут беспорядочны, то мы будем подлежать за них ответу? Да, если (это случится) от непринятия нами строгих мер, потому что для спасения недостаточно нам собственной добродетели. Если не употребивший в дело одного таланта не только не получил никакой награды, но еще наказывается известным образом, то ясно, что собственной добродетели недостаточно для спасения, а требуется еще (добродетель) другого. Итак, позаботимся о женах, будем особенно предусмотрительны в отношении к детям, домашним и к себе самим; когда же начнем приводить в порядок и себя и их, то станем молить Бога, чтобы Он помог нам в трудах наших. И Он поможет, когда увидит, что мы об этом стараемся, к этому прилагаем свои заботы; если же мы ничем не заняты, то и Он не подаст нам Своей помощи. Ведь не тогда Бог дарует нам помощь, когда мы спим, но когда и сами мы трудимся. Помощник помогает не праздному, а тому, кто и сам работает. Впрочем, благой Бог силен сам Собою совершить дело, чтобы все мы сподобились наследовать обетованные блага, благодатью и человеколюбием Господа нашего Иисуса Христа, Которому с Отцом и Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.
      cn: 如此看来，财富反而有害，如果它使我们没有预备好去承受生命的变故。那么，我们当如此教养子女，使他们能够承受一切，并懂得在不幸之中如何行事，在「主的教训和训诲中」养育他们，我们就必得到莫大的赏报。事实上，如果那些制作君王塑像、描绘君王肖像的人能享有极大的尊荣，那么我们这些美化天国君王形像的人（因为人是上帝的形像），岂不是要因着恢复上帝的样式，而享有远为更大的福祉吗？唯有灵魂的德行可与此相比，当我们教导子女成为良善的、不暴躁的、不记仇的、乐善好施的、爱人的（这一切都是上帝所固有的特性），并劝导他们不要珍爱属世的财富。那么，教养并整饬我们自己和他们——这就是我们的责任！否则，我们又怎敢面见基督的宝座呢？如果一个子女不服管教的人不配担任主教职分，那么他就更不配得享天国了。但你说了什么？难道如果我们的妻儿混乱无序，我们就要为他们承担责任吗？是的，如果这是由于我们没有采取严厉的措施，因为我们自身的德行不足以使我们得救。如果那只领受一个他连得却未加运用的人，不仅没有得到任何赏报，反而还以某种方式受到惩罚，那么显然，自身的德行不足以得救，还需要他人的（德行）。那么，我们要关心妻子，对子女、家人以及我们自己，都要特别谨慎周全；当我们开始整饬自己和他们时，就要向上帝祈祷，求祂帮助我们完成我们的工作。祂就会帮助，当祂看见我们为此努力，为此付出心力时；如果我们无所事事，祂也不会施予我们祂的帮助。上帝并非在我们沉睡时赐予我们帮助，而是在我们自己也劳作时。帮助者帮助的并非是懒惰的人，而是那些自己也工作的人。然而，良善的上帝能凭祂自己成就这事，使我们所有人都配得承受所应许的福祉，借着我们主耶稣基督的恩典与仁慈；愿荣耀、权能、尊贵归于祂，与父和圣灵，从今直到永远，世世代代。阿们。
