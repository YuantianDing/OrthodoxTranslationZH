    text:
      ru: Видишь ли, что все это (апостол) говорил о Христе во плоти? Видишь ли переизбыточествующее«величие могущества Его в нас, верующих»(Еф.1:19)? Он оживил тех, которые были мертвы, которые были чадами гнева. Видишь ли«надежда призвания»(Еф.1:18)?«Воскресил с Ним, и посадил на небесах»(Еф.2:6). Видишь ли славу достояния Его? Да, скажешь ты; что Он воскресил нас, это ясно; а чем доказывает (апостол) то, что Он«посадил нас на небесах во Христе Иисусе»(Еф.2:6)?  Тем же, чем (доказывает то, что Он) воскресил. Никто бы и никогда бы не восстал, если бы не воскресла Глава; а когда Глава наша воскресла, воскрешены и мы, – подобно тому, как, когда кланялся Иосифу Иаков, кланялась и жена. Точно таким же образом Он нас и посадил. Когда Глава сидит, сидит вместе и тело. Потому-то (апостол) и прибавил:«во Христе Иисусе». Или, – если посмотреть на это с другой стороны, – Он воскресил нас чрез купель крещения; как же после этого Он посадил?«Если терпим, – говорит (апостол), –то с Ним и царствовать будем»(2Тим. 2:12). Если вместе умерли, вместе и оживем. Подлинно, нужен дар Духа и откровения, чтобы уразуметь глубину этих тайн! Потом, чтобы ты не остался неверующим, смотри, что он присоединяет:«дабы явить в грядущих веках преизобильное богатство благодати Своей в благости к нам во Христе Иисусе»(Еф.2:7). Так как прежде он говорил все о Христе, и во всем сказанном прямо относящегося к нам не было ничего, – что, скажешь ты, в самом деле, нам оттого, что Христос воскрес? – то, показав предварительно, что это должно относиться и к нам, – потому что Спаситель соединен с нами, – теперь Он говорит о том, что собственно к нам относится:«и нас, мертвых по преступлениям ...воскресил с Ним, и посадил». Итак, как я говорил, веруй (что Он посадил нас с Собою), убеждаясь в этой истине тем, что сказано было прежде, тем, что сказано о Главе, и тем еще, что Он хочет проявить к нам свою благость. Как, в самом деле, Он проявит ее, если этого нет (т. е., если Он не посадил нас с Собою)? И«дабы явить в грядущих веках». Что же явить? Что блага, уготованные Им, и велики и совершенно достойны веры. Теперь эти блага кажутся для неверных несбыточными; а тогда все их узнают. Если желаешь узнать и то, как Он посадил нас, послушай, что сам Христос говорит ученикам:«сядете и вы на двенадцати престолах судить двенадцать колен Израилевых»(Мф. 19:28); и в другом месте:«но дать сесть у Меня по правую сторону и по левую – не от Менязависит, но кому уготовано Отцом Моим»(Мф. 20:23). Итак, это уже уготовано. И хорошо сказал (апостол):«в благости к нам во Христе Иисусе».
      cn: '你是否明白这一切（使徒）所说的，是关乎道成肉身的基督吗？你是否看见那极其丰盛的「祂在我们信的人身上所显的能力之浩大」(以弗所书 1:19)？祂使那些原是可怒之子、死了的人活过来。你是否明白「蒙召的指望」(以弗所书 1:18)？「使我们与祂一同复活，一同坐在天上」(以弗所书 2:6)。你是否明白祂基业的荣耀？是的，你会说；祂使我们复活，这很清楚；但使徒如何证明祂「把我们安置在天上，在基督耶稣里」(以弗所书 2:6)呢？


        祂以证明复活的方式来证明。若非元首复活，无人能得复活；但当我们的元首复活时，我们也一同复活了——正如雅各向约瑟下拜时，他的妻子也下拜一样。完全照样，祂也使我们一同坐下。当元首坐下时，身体也一同坐下。所以使徒也补充道：「在基督耶稣里」。或者，如果从另一个角度来看，祂藉着洗礼之池使我们复活；那么在此之后祂又如何使我们坐下呢？「使徒说：『我们若能忍耐，也必和祂一同作王。』」(提摩太后书 2:12)。如果我们与祂一同死了，也必与祂一同活过来。确实地，需要圣灵的恩赐和启示，才能明白这些奥秘的深邃！


        接着，为了使你不再存疑，看他如何补充道：「为要在将来的世代，显明祂那极其丰盛的恩典之丰富，并祂在基督耶稣里向我们所施的恩慈」(以弗所书 2:7)。因为在此之前，他所说的都是关于基督的，在他所说的一切中，没有直接关乎我们自己的——你会说，基督复活对我们而言究竟有何益处呢？——因此，他预先指出这一切也必须与我们相关——因为救主与我们联合——祂现在所说的才是真正与我们相关的：「又使我们这些因过犯而死的人……与祂一同复活，一同坐下。」


        因此，正如我所说的，相信（祂使我们与祂一同坐下），你要藉着先前所说的话语来确信这真理，藉着关于元首所说的话语，以及藉着祂要向我们显明祂的恩慈这一点。事实上，如果并非如此（即，如果祂没有使我们与祂一同坐下），祂又如何显明祂的恩慈呢？并且「为要在将来的世代显明」。那么要显明什么呢？就是祂所预备的福分，既是伟大的，也完全值得相信。现在这些福分对不信的人来说似乎是不可实现的；但那时所有人都将明白。


        如果你还想知道祂如何使我们坐下，请听基督亲自对门徒所说的话：「你们也要坐在十二个宝座上，审判以色列的十二个支派」(马太福音 19:28)；又在另一处：「只是坐在我的右边和左边，这不是我可以赐的，乃是为我父所预备的」(马太福音 20:23)。因此，这已是预备好的了。而使徒说得好：「祂在基督耶稣里向我们所施的恩慈」。'
  - type: paragraph
    text:
      ru: 'Воссестьодесную– это честь высшая всякой чести, за которой нет уже другой. Говоря это (т. е.«в благости к нам»), (апостол) показывает, что и мы воссядем. Сидеть с Христом – это поистине невыразимое богатство, это подлинно преизобилующее величие силы Его! Если бы ты имел тысячи душ, неужели ты не положил бы их за это? Если бы потребовалось идти в огонь, не следовало ли бы быть совершенно готовым и на это испытание? Сам (Христос) говорит:«которых Ты дал Мне, хочу, чтобы там, где Я, и они были со Мною»(Иоан. 17:24). За такую честь если бы каждый день приходилось быть рассекаему, то не должно ли было бы и это переносить с радостью? Подумай, где восседает Он? «Превыше всякого Начальства, и Власти». А с кем вместе ты воссядешь? С Ним. Но кто же ты? Мертвый, – по естеству чадо гнева. Что ты сделал правого? Ничего. Теперь, поистине, благовременно воскликнуть:«О, бездна богатства и премудрости и ведения Божьего!»(Рим. 11:33)!«Ибо благодатью, – говорит (апостол), –вы спасены»(Еф.2:8). Чтобы величие благодеяний не надмило тебя, смотри, как он тебя смиряет, говоря:«благодатью вы спасены». Но чтобы не уничтожить и твоего участия, он прибавляет и то, что требуется от нас («через веру»). Потом снова как бы уничтожает это наше свободное участие, когда говорит:«и сие не от вас». И вера, говорит он, не от нас; если бы (Христос) не пришел, если бы Он не призвал нас, как бы мы могли уверовать?«как вероватьв Того, – сказано, –о Ком не слыхали?»(Рим. 10:14)? Таким образом, и вера – не наше достояние:"Божий, – говорит, –дар не от дел»(Еф.2:8–9). Вера, говорит (апостол), недостаточна для спасения; но чтобы не спасать нас без всякого нашего участия, Бог требует её от нас. Сказал, что вера спасает, но (не сама собою, а) через Бога; Бог хочет, и вера спасает. Скажи мне: как спасет тебя вера без дел? Она сама – дар Божий,«чтобы никто не хвалился»(Еф.2:9), а всякий напротив сделается благодарным к благодати. Итак, спросишь ты, (апостол) сам запретил снискивать оправдание делами? Вовсе нет! Он говорит только, что дела никого не оправдают, и говорит это для того, чтобы показать благодать и человеколюбие Божье. Имеющих за собою дела (Бог) не отвергает от Себя, но тех, которые погибли бы и с делами, Он спасает благодатью, так что после этого решительно никто не имеет права хвалиться.'
      cn: 坐在右边——这是超越一切的荣耀，再没有比这更高的了。使徒说这话时（即指『对我们施予恩惠』），指出我们也将一同坐着。与基督同坐——这确实是无法言喻的财富，这真是祂力量极其丰盛的威严！假若你拥有千万条灵魂，难道你不会为之舍弃它们吗？假若需要进入火中，难道不应当完全准备好承受这考验吗？基督自己说：「祢所赐给我的人，我愿他们在我所在之处，也同我在一起」（约翰福音 17:24）。为了如此的荣耀，纵使每天被肢解，难道不也应当欢喜地承受吗？试想，祂高居何处？「超乎一切执政的和掌权的」。而你将与谁一同坐着呢？与祂。但你又是谁呢？一个死人，——按本性是可怒之子。你做过什幺正确的事吗？什么都没有。如今，确实是时候呼喊了：「深哉，上帝丰富的智慧和知识！」（罗马书 11:33）！「因为你们得救是本乎恩」，使徒说（以弗所书 2:8）。为免恩惠的伟大使你骄傲自大，看他如何使你谦卑，说：「你们是本乎恩得救的」。但为不抹煞你的参与，他加上了我们所需做的（「藉着信」）。然后他又仿佛抹煞了我们这自由的参与，当他说：「这也不是出于你们」时。他说，信心也不是出于我们；若非基督降临，若非祂呼召我们，我们又怎能信呢？「人未曾听见祂，怎能信祂呢？」（罗马书 10:14）？如此一来，信心也不是我们自己的产业：「这是上帝的恩赐，不是出于行为」，他说（以弗所书 2:8-9）。使徒说，信心不足以得救；但为了不让我们在毫无参与的情况下得救，上帝要求我们有信心。（他）说，信心能使人得救，但（并非凭其本身，而是）通过上帝；上帝愿意，信心便能使人得救。告诉我：没有行为的信心如何能拯救你？信心本身就是上帝的恩赐，「免得有人自夸」（以弗所书 2:9），相反地，人人反而会感恩于恩典。那么，你会问，使徒是否禁止通过行为寻求称义？绝非如此！他只是说，行为不能使任何人称义，他这样说，是为了显明上帝的恩典和对世人的慈爱。有行为的人，上帝不会将他们弃绝，但那些即使有行为也必灭亡的人，祂却以恩典拯救他们，因此，在此之后，绝没有人有权自夸。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Затем, чтобы, услышав, что"не от дел", но верой совершается (наше спасение), ты не остался беспечен, посмотри, что далее говорит (апостол):«Ибо мы – Его творение, созданы во Христе Иисусе на добрые дела, которые Бог предназначил нам исполнять»(Еф.2:10). Заметь, что сам он проповедует: он намекает здесь на воссоздание. Действительно, (наше спасение есть) второе творение: (через искупление) мы точно из небытия приведены к бытию. В том состоянии, в каком мы были прежде, т. е. в состоянии ветхого человека, мы были мертвы; теперь же сделались тем, чем прежде не были. Значит, это дело есть действительно творение, и притом творение, гораздо превосходнейшее первого. Тем творением мы призваны к жизни, этим же сделаны способными к жизни доброй.«На добрые дела, которые Бог предназначил нам исполнять», – т. е. от нас требуется добродетель постоянная, продолжающаяся до последнего часа жизни. Если бы мы, предприняв путешествие в царскую столицу и совершив большую его часть, вдруг потом разленились и остановились, не окончив пути, то такое путешествие не принесло бы нам никакой пользы. Точно также«надежда призвания»не может доставить нам, участвующим в этом уповании, какой-либо пользы, если мы не станем ходить достойно Призвавшего. Мы, призванные на дела благая, должны и пребыть в них, доколь не совершим всех их. Не для того, без сомнения, мы призваны, чтобы совершить одно какое-либо доброе дело, но чтобы (совершить) все. Подобно тому, как у нас есть пять чувств и всеми ими мы должны пользоваться надлежащим образом, так точно должны совершать и все добродетели. Если кто целомудрен, но не милостив, или милостив, но лихоимец, или хоть и не берет чужого, но не раздает и своего, – для такого все напрасно. Одна какая-нибудь добродетель не даст нам права с дерзновением предстать престолу Христову; для этого нужны многие, разнообразные и разнородные добродетели, или вернее, все добродетели. Послушай, что Христос сказал ученикам своим:«Итак идите, научите все народы, ...уча их соблюдать все, что Я повелел вам»(Мф. 28:19–20); и в другом месте:«Итак, кто нарушит одну из заповедей сих малейших, тот малейшим наречется в Царстве Небесном»(Мф. 5:19), т. е. в воскресении. Значит, такой не войдет в царство, – потому что Он обыкновенно время воскресения называет царством.«Итак, кто нарушит, – говорит, –одну из заповедей, ...тот малейшим наречется». Следовательно, нам нужно соблюдать все (заповеди).'
      cn: '接着，为的是当你听到「不是出于行为」，而是借着信心成就（我们的救赎）时，你不要因此变得漫不经心，请看（使徒）接着说什么：「我们原是祂的工作，在基督耶稣里造成的，为要叫我们行善，就是上帝预备叫我们行的。」（以弗所书 2:10）。请注意，他自己在此宣讲：他在此暗示的是再造。确实，(我们的救赎是)第二次的创造：（借着救赎）我们确实是从虚无被带入存在。在我们原先所处的状态，即在旧人的状态中，我们是死的；而如今我们已成为以前所不是的。这就意味着，这事确实是创造，并且是远比第一次创造更为优越的创造。借着那第一次创造，我们被召至生命；借着这第二次创造，我们被赋能过善的生活。


        「为要叫我们行善，就是上帝预备叫我们行的。」——这意味着：我们被要求持续不断的德行，一直延续到生命的最后一刻。倘若我们踏上前往京城的旅途，并完成了大部分路程，却突然懒惰停滞，未能走完全程，那么这样的旅程对我们毫无益处。同样地，「蒙召的盼望」若我们不按着配得上那召我们者的样式行事为人，便无法给我们，这些参与这盼望之人，带来任何益处。我们这些被召行善之人，也必须恒久住在这些善行中，直到我们完全行完所有的善行。毫无疑问，我们受召并非只为行某一件善事，而是为要（行）所有的善事。正如我们有五种感官，并且我们必须妥善运用所有这些感官，同样地，我们也必须实践所有的德行。如果有人贞洁，却不怜悯人；或是怜悯人，却是高利贷者；或是虽不侵占他人的财物，却也不分施自己的财物——对这样的人而言，一切都将是徒劳的。仅仅某一种德行并不能使我们有权坦然无惧地站立在基督的宝座前；为此，需要许多、各种各样且不同类型的德行，或者更确切地说，是所有的德行。请听基督对祂门徒所说的话：「所以，你们要去，使万民作我的门徒，……凡我所吩咐你们的，都教训他们遵守。」（马太福音 28:19-20）；又在另一处：「所以，无论何人废掉这诫命中最小的一条，又教训人这样做，他在天国里要称为最小的。」（马太福音 5:19），即在复活中。这就意味着，这样的人不能进入天国——因为祂通常把复活的时间称为天国。「所以，祂说，谁若废掉诫命中最小的一条，……他就要被称为最小的。」因此，我们必须遵守所有的（诫命）。'
  - type: paragraph
    text:
      ru: 'Смотри: без милосердия нельзя войти (в царствие небесное), и мы отойдем в огонь, если у нас не будет доставать хоть одной этой добродетели.«Идите от Меня, – скажет (Спаситель), –проклятые, в огонь вечный, уготованный дьяволу и ангелам его»(Мф. 25:41). Почему же и за что это?«Ибо алкал Я, и вы не дали Мне есть; жаждал, и вы не напоили Меня»(Мф. 25:42). Видишь ли, Он ни в чем другом не обвиняет их, и за одно только это (отсутствие милосердия) они погибают? И (юродивые) девы за одно только это были изгнаны из чертога; хотя они имели целомудрие, но так как у них недоставало милосердия, то они и не были допущены в чертог.«Старайтесь иметь мир, – заповедуется, –со всеми и святость, без которой никто не увидит Господа»(Евр. 12:14). Итак, помни же, что без целомудрия нельзя узреть Господа, хотя не всегда это можно и при целомудрии, потому что другое что-нибудь может воспрепятствовать. Но (вы скажете): мы все исполнили, только не оказывали помощи ближнему; неужели же за одно это мы не войдем в царствие? Откуда это видно? (Из притчи) о рабах, которым вверены были таланты. Они выполняли все добродетели, не опускали ни одной; но так как (один) был ленив, и не заботился о преумножении, то за это справедливо был изгнан. Есть указание и на то, что за одно только злословие будут ввергнуты в геенну.«Кто скажет, – сказано, –своему брату: «безумный», подлежит геенне огненной»(Мф. 5:22). Пусть иной сохранил все заповеди, но был только досадителем, и такой не войдет (в царствие Божье). И пусть никто не обвиняет Бога в строгости за то, что Он так согрешающих лишает небесного царствия. Ведь и у людей, если кто совершит что-нибудь противозаконное, то уже царю на глаза не допускается, хотя бы он преступил одно какое-нибудь постановление, – например, если произнесет несправедливый приговор на кого-либо в суде, он теряет власть свою; если сблудит и будет взят на месте преступления, он уже обесчещен и, хотя бы совершил тысячу дел законных, погибает; если совершит убийство и будет уличен в этом, и этого одного вполне достаточно, чтобы подвергнуть его строгому наказанию. Если же человеческие законы охраняются так строго, то не гораздо ли больше (должны охраняться) законы Божьи? Но Бог благ, скажешь ты. О, до каких пор мы будем произносить эти безрассудные слова? Безрассудным я называю здесь не то, что мы веруем в благость Божью; но то, что мы дозволяем себе злоупотреблять этой верой, – несмотря на то, что мы уже тысячи раз говорили против этого. Послушай, что говорится в Писании:«не говори: «милосердие Его велико, Он простит множество грехов моих»(Сир. 5:6). (Писание) не запрещает нам говорить, что«милосердие Его велико», – вовсе нет, – не к этому оно побуждает, напротив оно советует нам постоянно говорить об этом, – к этому и Павел направляет все свои речи; но, как видно из последующего, (Писание) порицает, когда удивляются человеколюбию Божьему для того, чтобы грешить и говорить при этом:«милосердие Его велико, Он простит множество грехов моих».'
      cn: '看哪，若无怜悯，便不能进入（天国），如果我们缺少哪怕这一种美德，我们必将被扔进火里。

        「你们这蒙咒诅的人，离开我吧，进入那为魔鬼和它的使者所预备的永火里去吧。」（马太福音 25:41）

        这又是为何？因何如此呢？

        「因为我饿了，你们却没有给我吃；我渴了，你们却没有给我喝。」（马太福音 25:42）

        你看，祂没有在任何其他事上指责他们，并且仅仅因为这一点（缺少怜悯），他们就灭亡了？而（愚拙的）童女们仅仅因此就被逐出婚宴的厅堂；尽管她们守着贞洁，但由于她们缺少怜悯，她们也就没有被允许进入那厅堂。

        「务要追求与众人和睦，并要追求圣洁；非圣洁没有人能见上主。」（希伯来书 12:14）——圣经如此教导——

        所以，你务必记住，若无贞洁，便不能得见上主，尽管即便有了贞洁也并非总能如此，因为可能还有其他事情阻碍。但（你们或会说）：我们已遵行了一切，只是没有帮助近人；难道就因为这一点，我们便不能进入天国吗？这从何处可见呢？（从）那关于受托银钱的仆人（的比喻可见）。他们遵行了一切美德，没有遗漏任何一项；但由于（其中一个）懒惰，且不致力于增值，因此他被公正地逐出。还有指示指出，仅仅因为一句毁谤的话，就会被投入欣嫩子谷。

        「凡向他弟兄说：『你这傻瓜』的，必受火的欣嫩子谷的惩罚。」（马太福音 5:22）——经文如此说——

        即使有人守全了所有诫命，却只是一个使人恼怒者，这样的人也无法进入（上帝的国）。愿无人指责上帝过于严厉，因为祂如此剥夺了犯罪之人的天国。因为即便在人间，如果有人做了任何不法之事，他便不再被允许觐见君王，即使他仅仅违犯了一条法令，——例如，如果他在法庭上对某人作出了不公正的判决，他就会失去自己的权柄；如果他犯了奸淫，并当场被捕，他便已蒙羞受辱，即使他曾行过千件合法之事，也必灭亡；如果他犯了谋杀罪并被指证，仅仅这一点，就足以使他遭受严厉的惩罚。如果世间的律法尚且如此严格地受护卫，那么上帝的律法岂不更应如此（受护卫）吗？但上帝是美善的，你会说。哦，我们还要说出这些愚昧无知的话语到几时呢？我在此所称的愚昧无知，并非指我们相信上帝的美善；而是指我们允许自己滥用这份信仰，——尽管我们已经成千上万次地反对过这一点。请听圣经是如何说的：

        「不要说：『祂的怜悯何等大，祂必赦免我众多的罪。』」（德训篇 5:6）

        （圣经）并未禁止我们说「祂的怜悯何等大」，——绝非如此——它并非鼓励我们这样做，相反，它建议我们不断地谈论此事，——保罗所有的教导也都导向这一点；然而，正如后文所示，（圣经）所谴责的是，当人因着上帝的爱世之心而惊叹，其目的却是为了犯罪，并同时说出：「祂的怜悯何等大，祂必赦免我众多的罪。」'
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: И мы так часто и много беседуем о благости не для того, чтобы, надеясь на нее, делать (что угодно), – потому что в таком случае благость будет причиной утраты нашего спасения, – а для того, чтобы мы не отчаивались в грехах и приносили покаяние.«Благость Божья ведет тебя к покаянию»(Рим. 2:4), а не на большее закоснение во зле. Если ты пребудешь злым ради благости, то через это ты оклевещешь ее пред людьми, – а многих я вижу подобным образом клевещущих на Божье долготерпение! – и дашь ответ за то, что воспользовался (благодатью) не надлежащим образом. Бог человеколюбив, но Он и правосуден; прощает грехи, но воздает каждому по делам его; превосходит неправды, отъемлет беззакония, но творит и суд. Не противоречит ли это одно другому? Нисколько, если только мы будем обращать внимание на времена. Он отъемлет беззакония здесь и через купель крещения и через покаяние, – и накажет за все беззакония там огнем и муками.
      cn: 我们如此频繁且大量地谈论恩慈，并非为了寄望于它，就任意妄为——因为在这种情况下，恩慈将成为我们丧失救恩的原因——而是为了使我们不因罪孽而绝望，并带来悔改。「上帝的恩慈引你悔改」(罗马书 2:4)，而非使你在邪恶中更加顽固。如果你因着恩慈而继续作恶，那么通过此举你将在人前诽谤它——而我看到许多人以同样的方式诽谤上帝的恒忍！——并将为你滥用（恩典）而付出代价。上帝是爱人的，但祂也是公义的；祂赦免罪孽，但按各人所行的报应各人；祂超越不义，除去不法，但也施行审判。这难道不是自相矛盾吗？绝非如此，只要我们留意不同的时期。祂在此处藉着洗礼之池和藉着悔改除去不法，而祂将在那里以烈火和刑罚惩治一切不法。
  - type: paragraph
    text:
      ru: 'Итак, может быть, ты скажешь после этого: если и за малое зло, если даже за один грех я буду извержен и лишен царствия, то почему же мне не делать в таком случае зол всякого рода? Речи эти – речи неблагоразумного раба! Но, впрочем, рассмотрим их. Не твори зла, если хочешь спасти себя. Все мы (если сотворим зло) одинаково лишимся царствия; но наказание в геенне потерпим не все одно и тоже; а одни – большее, другие – меньшее. Если ты или кто-нибудь другой презирали заповеди Божьи, и один презрел больше заповедей, другой меньше, – оба вы равно не войдете в царствие. Но если не одинаково презирали, а один больше, другой меньше, то и в геенне ощутите различие. Что это значит, – спросишь ты, – за что такие прещения на не оказавших милосердия, – за что они отсылаются в огонь, и притом не просто в огонь, но«в огонь вечный, уготованный дьяволу и ангелам его»(Мф. 25:41)? За что это и почему? Потому что ничто столько не оскорбляет Бога, как обида, делаемая друзьям. Мы должны любить и врагов; поэтому отвращающийся любящих его и являющийся таким образом хуже самих язычников какого не будет достоин наказания? Итак, по важности греха, такой справедливо должен отойти (в геенну) с дьяволом. Горе, сказано, не творящему милостыни. Если в ветхом завете так было, то тем более (так должно быть) в новом; если там, где позволено было приобретать, наслаждаться, заботиться (о земном), так много обращали внимания на помощь бедным, то не тем ли более (должно поступать так) здесь, где заповедуется оставлять все? В самом деле, чего не делали израильтяне? Отдавали десятины; потом предоставляли еще другие десятины на вспомоществование сиротам, вдовам и прозелитам. Мне некто с удивлением говорил: такой-то дает десятины. Как нам не стыдно! Мы – христиане удивляемся тому, что не было удивительным у иудеев? Тогда опасно было не раздавать десятины: представь же, каково это (т. е. не гораздо ли опаснее) теперь! Пьянство также не наследит царствия. Но при этом, что, обыкновенно, говорит большая часть людей? (Они говорят): что же, если и я и он вместе будем терпеть одно и тоже, то в этом уже не малое утешение. Что нам сказать на это? Прежде всего должно сказать, что ты и он понесете наказание не одно и тоже; а кроме того (должно прибавить, что) здесь ровно никакого нет утешения, потому что одинаковость страданий в том только случае может быть утешением, когда беды еще не превосходят меры, но когда он превосходят ее, когда повергают нас в ужас, тогда уже (никакое сравнение своих бед с бедами других) не доставит утешения. В самом деле, скажи осужденному на сожжение, – в то время, когда он стоит уже в огне, – что вот и такой-то терпит тоже: ты этим не доставишь ему ровно никакого утешения. Не все ли вместе погибали израильтяне? Однако какое утешение принесло им это? Напротив не более ли это печалило их? Потому-то они и восклицали: погибли, убиты, умерщвлены мы. Итак, есть ли в этом какое-нибудь утешение? Напрасно же мы утешаем себя подобными надеждами. Одно только и есть утешение, это – чтобы не впасть в этот неугасимый огонь; а впавшему уже нельзя получить никакого утешения там, где скрежет зубов, где плач, где неусыпающий червь, где неугасающий огонь. Притом, находясь в такой скорби и тесноте, способен ли ты будешь понять какое-нибудь утешение? Останется ли в тебе хоть сколько-нибудь присутствия духа?'
      cn: 所以，你或许会在此之后说：如果即使是小恶，即使只是一个罪过，我就会被逐出并失去天国，那么在这种情况下，我为何不作各样的恶呢？这些言论是不明智之仆的言论！但是，我们姑且来审视它们。如果你想拯救自己，就不要作恶。我们所有的人（如果作恶）都会同样失去天国；但在地狱里的惩罚，我们所受的却不尽相同；有的人会受更大的，有的人会受更小的。如果你或其他人轻蔑上帝的诫命，一个人轻蔑更多诫命，另一个人轻蔑较少，你们二者都同样不能进入天国。但是，如果轻蔑的程度不同，一个人更多，另一个人更少，那么在地狱里你们也会感受到差异。你会问，这是什么意思？为什么那些没有施予怜悯的人会受到如此严厉的惩罚？为什么他们被送入火中，而且不仅仅是火，而是「为魔鬼和他的使者所预备的永火」（马太福音 25:41）？这是为什么？因为没有什么比伤害朋友更得罪上帝的了。我们甚至应当爱仇敌；所以，一个厌恶爱他之人，从而比异教徒本身更差的人，将不配受何种惩罚呢？因此，根据罪的严重性，这样的人理应与魔鬼一同进入（地狱）。经上说，祸哉，不施怜悯之人。如果旧约中是这样，那么在新约中更是如此；如果在那允许获取、享乐、关注（世俗之事）的时代，人们如此重视帮助穷人，那么在这里，被命令要舍弃一切的地方，岂不是更应当如此行吗？事实上，以色列人没有做什么呢？他们缴纳什一奉献；之后还提供其他的什一奉献，以帮助孤儿、寡妇和归信者。有人曾惊讶地对我说：某某人缴纳什一奉献。我们怎能不感到羞愧呢！我们基督徒竟对犹太人而言并不稀奇的事情感到惊讶？那时不缴纳什一奉献是危险的：那么请想象，现在这又如何（即难道不是更加危险吗）！醉酒同样不能承受天国。但对此，大多数人通常会说什么呢？（他们说）：既然如此，如果我和他一起忍受同样的苦难，那其中就不是小小的安慰了。我们对此该说什么呢？首先应当说，你和他所受的惩罚并非相同；此外（还应当补充），这里根本没有任何安慰，因为苦难的相同之处，只有在灾祸尚未超出限度时，才可能成为安慰，但当灾祸超出限度，使我们感到恐惧时，那时（任何将自己的苦难与他人苦难的比较）都不会带来安慰。事实上，你对一个被判处火刑的人说——当他已经置身火中时——「看哪，某某人也正在忍受同样的痛苦」：你这样做并不会给他带来丝毫安慰。以色列人不都是一同灭亡的吗？然而这给他们带来了什么安慰呢？相反，这难道不是更使他们悲伤吗？正因为如此，他们才呼喊道：我们灭亡了，我们被杀了，我们被处死了。那么，这其中有任何安慰吗？我们徒劳地用这样的希望来安慰自己。唯一的安慰就是不坠入那不灭的火中；而已经坠入的人，在那里是无法得到任何安慰的，在那里有咬牙切齿，有哀哭，有不死的虫，有不灭的火。此外，身处如此忧患和困境之中，你还能理解任何安慰吗？你还能剩下哪怕一丝一毫的心神吗？
  - type: paragraph
    text:
      ru: 'Прошу и умоляю, не будем обольщать себя понапрасну, не будем утешать себя подобного рода рассуждениями, но будем делать то, что сможет спасти нас. Тебе предлежит воссесть с Христом, а ты между тем предаешься подобному любопрению. Если бы не было никакого другого греха, то за одни эти речи какому наказанию следует подвергнуть нас? Мы так нерадивы, так ленивы, так беспечны, что говорим подобные речи тогда, когда нам предлагается столь великая честь. О, как горько возстенаешь ты, когда услышишь, что жившие благочестиво будут с честью призываться в царствие Божье; когда увидишь, что в царстве славы будут возлежать и рабы и люди низкого происхождения, – люди, которые здесь о малом заботились, а там между тем будут участвовать в царском престоле! Подобное (зрелище) не хуже ли будет всякого наказания? Если и теперь, когда видишь, что кто-нибудь блаженствует, – хотя сам и не терпишь ничего худого, – считаешь это хуже всякого наказания и от этого одного приходишь в расстройство, страдаешь, плачешь, и думаешь, что это стоит тысячи смертей, – то, скажи, что ты тогда должен будешь вытерпеть? Пусть не будет геенны: одна мысль о царстве (которого ты лишился и которым другие наслаждаются) разве не может поразить тебя и расстроить окончательно? А что действительно будет так, в этом могут достаточно убедить тебя жизнь и опыт. Итак, перестанем же попусту утешать себя подобными рассуждениями; будем лучше внимательны и усердны к нашему спасению; поревнуем о добродетели и возбудим себя к деланию добрых дел, чтобы удостоиться столь высокой чести во Христе Иисусе, Господе нашем.'
      cn: 我恳求并祈愿，我们不要徒劳地欺骗自己，不要用这类思辩来安慰自己，而是要去做那能拯救我们的事。你将与基督一同坐席，然而你却沉溺于这种争辩之中。倘若没有其他的罪，仅凭这些言论，我们又该受何种惩罚呢？我们是如此懈怠，如此懒惰，如此漫不经心，以至于当如此巨大的尊荣摆在我们面前时，我们竟说出这种话来。哦，当你多么痛苦地哀叹啊！当你听到那些虔诚生活的人将蒙召带着尊荣进入上帝的国度时；当你看到在那荣耀的国度里，奴仆和出身低微的人也将安享坐席时——这些人在此世只关心微小之事，然而在那里却将与君王一同分享宝座！这样的景象难道不比任何惩罚更糟糕吗？倘若现今，当你看到有人蒙福享乐时——尽管你自己并未遭受任何不幸——你就认为这比任何惩罚都更糟，并且因此而心烦意乱，痛苦流泪，甚至觉得这等同于千百次死亡——那么，请说，那时你又将要承受什么呢？就算没有地狱：单单想到那国度（你已失去而他人正在享受的），难道还不足以彻底击溃你，使你心神崩溃吗？而这确实会如此，生活和经验便能充分地说服你。因此，我们不要再徒劳地用这类思辩来安慰自己了；倒不如对我们的救恩保持警醒和热忱；积极追求美德，并激励自己行善，好在我们的主耶稣基督里，配得如此崇高的尊荣。
- type: heading1
  text:
    ru: Беседа 5
    cn: 第 5 讲
  children:
  - type: paragraph
    text:
      ru: Еф.2:11–12.Итак помните, что вы, некогда язычники по плоти, которых называли необрезанными так называемые обрезанные плотскимобрезанием, совершаемым руками,
      cn: '(以弗所书 2:11-12)

        所以，你们当记念，你们从前按肉体是外邦人，就是那些被称为「受割礼」之人——这「受割礼」是凭肉体用手行的——所称为「未受割礼」的；'
  - type: paragraph
    text:
      ru: что вы  были в то время без Христа, отчуждены от общества Израильского, чужды заветов обетования, не имели надежды и были безбожники в мире.
      cn: 那时你们是没有基督的，与以色列国民隔绝，是应许诸约的陌生人，没有希望，并且在世上没有上帝。
  - type: paragraph
    text:
      ru: Что значит мудрование плотское.
      cn: '肉体的心思（мудрование плотское）是指一种以堕落的人性、私欲、情欲、属世的渴望以及自我意志为导向的心态或思维方式。在基督教神学中，「肉体」不仅指身体，更指脱离上帝恩典、受罪性影响的人类本性。


        肉体的心思与属灵的心思（мудрование духовное）相对立。它无法顺服上帝的律法，也无法取悦上帝，因为它本身是与上帝为敌的。


        正如使徒保罗在（罗马书 8:6-7）中所说：


        「因为体贴肉体的心思就是死亡，体贴圣灵的心思却是生命与平安。因为肉体的心思是与上帝为仇的，它不服上帝的律法，也确实不能服从。」'
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Много есть доказательств человеколюбия Божьего к нам: во-первых, Он сам Собою Спас нас, и Спас столь дивным образом; во-вторых, Он Спас нас, когда мы были в таком состоянии (уже мертвы и чада гнева по естеству); в-третьих, Он возвел нас (на необыкновенную высоту). Все это заключает в себе величайшее доказательство человеколюбия Божьего, и все это Павел изображает в настоящем послании. Выше он сказал, что нас,«мертвых по преступлениям и чад гнева»(Еф.2:1, 3), (Бог) спас; теперь показывает, кому равными Он сделал нас."Итак, – говорит, –помните". Когда от великой бедности мы переходим в противоположное состояние, или сподобляемся какой-нибудь еще большей чести, то, наслаждаясь славой своего нового положения, о прежнем обыкновенно все мы и не вспоминаем. Имея это в виду, (апостол) и говорит:«Итак, помните». Что же должно помнить? Что мы созданы на дела благая. Этого достаточно для того, чтобы побудить нас заботиться о добродетели."Помните", – потому что такое памятование может сделать нас благодарными к Благодетелю.«Что вы, некогда язычники». Заметь, как (апостол) низлагает те преимущества, которыми гордились иудеи, и удивляется недостаткам язычников, – которые однако не были недостатками (делающими для них невозможным спасение во Христе), – и для тех и других извлекает увещания из образа их поведения и жизни.«Которых называли необрезанными». Честь была только на словах и преимущество (от обрезания) относилось только к плоти, потому что ни необрезание, ни обрезание ничего не значат.«Так называемые, – продолжает (апостол), –обрезанные плотскимобрезанием, совершаемым руками, что вы были в то время без Христа, отчуждены от общества Израильского, чужды заветов обетования, не имели надежды и были безбожники в мире». Вас так – необрезанием – называют только иудеи. Но почему же, намереваясь показать, что в приобщении язычников к иудеям первым оказано благодеяние, (апостол) не унижает достоинства последних, а напротив возвышает его? Те качества (иудеев), которые остались необходимы (для них и для христиан из язычников), возвышает, а те, которых (язычники, обратившиеся в христианство) могли не иметь, унижает. Потому-то он далее говорит:«сограждане святым и свои Богу»(Еф.2:19). Смотри, как не унижает. Это, говорит, безразлично. Не думайте, говорит, что есть какая-нибудь разница в том, что вы не получили обрезания и находитесь в необрезании; страшно (не это, а) вот что: быть без Христа, быть отчужденными от жития Израилева, – а первое к житию не относится, – быть вне завета обетования, не иметь надежды на будущее и быть в этом мире безбожными, каковы именно и были язычники. (Прежде апостол) говорил о вещах небесных; (теперь) говорит о земных, так как иудеи очень высоко ценили их.'
      cn: 上帝对我们有许多仁爱的证明：首先，祂亲自拯救了我们，而且以如此奇妙的方式施行了救赎；其次，当我们在那样的境况中（已然死亡，且按本性是可怒之子）时，祂拯救了我们；第三，祂提升了我们（达到非凡的高度）。所有这一切都蕴含着上帝仁爱最伟大的证明，保罗在本封书信中描绘了所有这一切。他在前面提到，上帝拯救了我们这些「因过犯而死，又按本性是可怒之子」（以弗所书 2:1，3）的人；现在他展示了上帝使我们与谁平等。「于是，」他说，「你们要记念。」当我们从极大的贫困转变为相反的境况，或蒙受某种更大的尊荣时，我们通常都会沉浸于新地位的荣耀中，而对过去的一切毫不记念。有鉴于此，（使徒）便说：「所以，你们要记念。」那么，应该记念什么呢？我们是为行善而受造的。这足以激励我们致力于美德。你们要「记念」，因为这样的记念能使我们对施恩者心怀感恩。「你们从前是外邦人。」请注意，（使徒）是如何贬抑犹太人所夸耀的那些优势的，并感叹外邦人的不足——然而这些不足（并没有使他们无法在基督里得救）；他从双方的行为和生活方式中，为他们提炼出劝诫。「那些被称为未受割礼的人。」这项尊荣仅是言语上的，而（割礼的）优势也只关乎肉体，因为无论是未受割礼，还是受割礼，都毫无意义。（使徒）继续说：「那些被称为在肉体上由人手所行的割礼的人，你们那时没有基督，与以色列的公民权隔绝，在所应许的诸约上是局外人，没有指望，在世上没有上帝。」只有犹太人这样称呼你们——未受割礼的人。但为何（使徒）在意图表明外邦人加入犹太人并从中蒙受恩惠时，不贬低后者的尊严，反而提升它呢？那些（犹太人）仍然必不可少（对他们而言，也对外邦基督徒而言）的特质，他予以提升；而那些（归信基督的外邦人）可能没有的特质，他则予以贬抑。正因如此，他接下来才说：「与圣徒同国，是上帝的家人」（以弗所书 2:19）。看，他并未贬低。他说，这无关紧要。祂说，不要以为你们未曾受割礼，处于未受割礼的状态有什么不同；可怕的（并非这一点，而是）以下几点：没有基督，与以色列的生命隔绝——而前者（指割礼/未割礼）与生命无关——身处应许之约之外，对未来没有指望，并在这世上没有上帝，而外邦人正是如此。（之前使徒）谈论的是属天之事；（现在）谈论的是属地之事，因为犹太人对此极为看重。
  - type: paragraph
    text:
      ru: 'Так и Христос, утешая учеников, после того как сказал:«Блаженны изгнанные за правду, ибо их есть Царство Небесное»(Мф. 5:10), присоединяет меньшее (утешение) и говорит:"так гналиипророков, бывших прежде вас»(Мф. 5:12). Последнее ободрение в сущности менее велико; но в отношении приведения (к спасению), в отношении веры оно и достаточно, и велико, и заключает в себе большую силу, так как взято из жизни и опыта. Не сказал (апостол): отлученные (χεχωριομένοι), но: отчужденные (άπηλλοτριωνοι) жития; не сказал также: не держащиеся обетований (ου προέχοντες), но: не имеющие (ουδέ μετέχοντες) и чуждые (ξένοι). Великое различие в значении этих слов, указывающее и на великое расстояние (язычников от иудеев). И израильтяне не вели жизни истинно доброй, но не потому, что были отчуждены (т. е. неспособны), а потому, что были беспечны; и от обетований они ниспали, но не как чуждые им. Какие же были заветы обетования? Тебе, – сказано, – и«потомству твоему отдам Я землю сию»(Быт. 12:7), а также и нечто другое было им обещано.«Не имели надежды, – говорит (апостол), –и были безбожники». Хотя язычники и поклонялись богам, но были, однако же, безбожии, потому что идолы ничего не значат.«А теперь во Христе Иисусе вы, бывшие некогда далеко, стали близки Кровию Христовою. Ибо Он есть мир наш, сделавший из обоих одно и разрушивший стоявшую посреди преграду, упразднив вражду Плотию Своею»(Еф.2:13–15). Важно уже и то, говорит (апостол), что мы пришли к иудейскому житию. Как это? Он возглавил все на небе и на земле, а ты еще говоришь о израильтянах? Но, говорит, подлинно так! То нужно принимать верой; а это оправдывать делами.«А теперь во Христе Иисусе вы, бывшие некогда далеко, – говорит, –стали близки»по жизни, – потому что быть далеко или близко зависит единственно от свободы.«Ибо Он есть мир наш, сделавший из обоих одно».'
      cn: 基督亦然，在安慰门徒时，说了「福哉，为义受逼迫的人，因为天国是他们的。」（马太福音 5:10）之后，又加上一个较小的（安慰），说：「在你们以前的众先知，人也是这样逼迫他们。」（马太福音 5:12）这后一个鼓励，实质上不那么伟大；但在论及引向（救恩）和论及信仰方面，它既足够又伟大，且蕴含着巨大的力量，因为它取自生活和经验。（使徒）没有说：被隔绝的（χεχωριομένοι），而是说：被疏远于（άπηλλοτριωνοι）生命；也没有说：不持守应许的（ου προέχοντες），而是说：没有份（ουδέ μετέχοντες）且陌生的（ξένοι）。这些词语的意义有极大的区别，也指示着（外邦人与犹太人之间）巨大的距离。以色列人也没有过着真正良善的生活，但这并非因为他们被疏远（即无能），而是因为他们怠惰；他们也从应许中坠落，但并非如同与应许陌生的人。那么，应许之约是什么呢？经上说：「我必将这地赐给祢和「你的后裔。」（创世记 12:7） 此外，还有其他一些东西应许给了他们。（使徒）说：「没有指望，并且没有上帝。」尽管外邦人崇拜诸神，然而却是无神的，因为偶像毫无意义。「但如今在基督耶稣里，你们这从前远离的人，借着基督的血，已经亲近了。因为祂是我们的和睦，使二者合而为一，并且拆毁了中间隔断的墙，借着祂的肉身废掉了冤仇。」（以弗所书 2:13-15）（使徒）说，即使我们达到了犹太人的生活，这已经很重要了。这是怎么回事？祂已使天上地下一切都归于一，而你却还在谈论以色列人吗？但（使徒）说，确实如此！那要借着信心接受；而这要借着行为来证实。「但如今在基督耶稣里，你们这从前远离的人，」 （使徒）说，「已经亲近了」在生活上，——因为远离或亲近，唯独取决于自由意志。「因为祂是我们的和睦，使二者合而为一。」
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Что значит:«из обоих одно»? (Апостол) этим показывает не то, что Бог даровал нам с иудеями одинаковое благородство; но то, что и нас и их Он возвел в лучшее (состояние). Впрочем благодеяния (Божьи) к нам даже выше; тем (иудеям) дарованы были обетования и они были к Богу ближе нас, нам же не дано было никаких обетований и мы отстояли дальше. Потому-то и сказано:«а для язычников – из милости, чтобы славили Бога»(Рим. 15:9). Израильтяне получили обетования, но оказались недостойными их; нам же ничего не было обещано, мы были чужды обетований; ничего общего у нас с ними не было, и Он соединил нас воедино, не так, впрочем, чтобы нас присоединил к ним, но нас и их совокупил воедино. Представим пример: вообразим две статуи, одна серебряная, другая оловянная; эти две статуи расплавлены и из них образовались две золотые: вот эти две стали одинаковы. Или возьмем иной пример: пусть один будет раб, другой – усыновленный; оба они долженствовали служить Ему (т. е. Богу); но один объявлен был лишенным наследства, другой бежал прочь и не знал Отца, а потом оба сделаны наследниками и законными детьми. Они удостоились одинаковой чести, два сделались едино, с тем только различием, что один пришел издалека, другой изблизи, и что ближайший прежде прибыл к Отцу.«Разрушивший, – говорит, –стоявшую посреди преграду». Что должно разуметь под«стоявшей посреди преградой», он сам объясняет это, когда говорит:«упразднив вражду Плотью Своей, а закон заповедей учением».'
      cn: '「二者合一」是什么意思？（使徒）借此并非表明上帝赐予了我们与犹太人同等的尊贵；而是表明祂将我们和他们都提升到了更佳的境地。然而，上帝对我们的恩惠甚至更高；那些（犹太人）曾被赐予应许，他们比我们更亲近上帝，而我们却未曾被赐予任何应许，我们与上帝相距更远。因此经上说：「外邦人因着怜悯荣耀上帝」（罗马书 15:9）。以色列人领受了应许，却不配得这些应许；而我们却未曾被应许任何事物，我们与应许无份；我们与他们毫无共通之处，但祂将我们结合为一，并非将我们附属于他们，而是将我们和他们一同联合为一。


        让我们设想一个例子：假想有两尊雕像，一尊是银的，另一尊是锡的；这两尊雕像被熔化，并从中形成了两尊金像：看，这两尊（雕像）变得一模一样了。或者我们举另一个例子：假设一人是奴仆，另一人是被收养的；他们二者都理当事奉祂（即上帝）；然而，一人被宣告剥夺继承权，另一人则逃跑在外，不认识父亲，但后来二者都被立为继承人，并成为合法的儿女。他们获得了同等的荣耀，二者合而为一，唯一的区别在于，一人从远方而来，另一人从近处而来，并且那近处的人先抵达了父亲那里。


        「祂（使徒）说，『拆毁了居间的墙』。」什么是「居间的墙」？他自己解释道，当他说：「以自己的肉身废除了仇恨，即律法上的诫命。」'
  - type: paragraph
    text:
      ru: 'Некоторые говорят, что средостением был закон, который не дозволял иудеям смешиваться с язычниками. А я думаю, что он разумел под средостением (не закон, но) вражду плоти, которая была как бы промежуточной стеной, отделявшей нас от Бога, как и пророк говорит:«Но беззакония ваши произвели разделение между вами и Богом вашим»(Ис. 59:2)? И справедливо. Такая преграда, как вражда плоти, была преградой к Богу, как для язычников, так равно и для иудеев, потому что закон не только не уничтожал, а напротив увеличивал (вражду):"ибо закон, – говорит (апостол), –производит гнев»(Рим. 4:15). И как в словах:«ибо закон производит гнев»апостол не закон собственно поставляет причиной (гнева), но наше неповиновение ему и преступление его, так и здесь называет закон средостением, потому что преступающий его вступает во вражду (с Богом). Закон был и оградой, – оградой для утверждения (в добре), – оградой же он назван потому, что мог ограждать (от зла). Послушай, что говорит пророк:«Он обнес его оградою»(Ис. 5:2); и еще:«разрушил Ты ограды ее, так что обрывают ее все, проходящие по пути»(Пс. 79:13), – здесь говорит об утверждении; и еще:«отниму у него ограду, и будет он опустошаем»(Ис. 5:5); и еще:"Обращайтеськ закону"(Ис. 8:20); и в другом месте:«Господь творит правду и суд... Он сынам Израилевым – показал дела Свои»(Пс. 102:6–7). А средостение существовало не для того, чтобы охранять, а для того, чтобы отделять их от Бога. Таково различие средостения от ограды. Показывая же, каково оно, и прибавляет:«упразднив вражду Плотью Своей, а закон заповедей учением»(Еф.2:15). Каким образом? (Упразднил), прекратив и разрушив вражду (с Богом). И не этим только образом Он упразднил (закон), но и тем, что Сам сохранил его. Что же, спросишь ты, лишь только мы избавились от первого преступления, как снова принуждены сохранять закон? Это конечно и было бы опять, (но дело в том, что Он) и самый закон уничтожил.«Упразднив ...закон заповедей, – говорит, –учением". О, человеколюбие! Он дал нам закон, чтобы мы сохранили его; потом, когда мы не сохранили его и за это должны были быть наказаны, Он и закон упразднил. (Это походит на то), как если бы кто, вверив своего ребенка воспитателю и потом заметив, что он не слушается, освободил и увел его от воспитателя. О, какое великое человеколюбие! Что значит:«упразднив ...учением»? (Апостол) полагает большое различие между заповедью (εντολή), ученьми (δόγματα). Учением он называет здесь или веру, потому что мы спасаемся только Верой, или определения (Божьего), подобные тому, о которых Христос изрек:«Ибо истинно говорю вам»: не гневайтесь совершенно (Мф. 5:18, 22). Значит: если веруешь, что Бог воздвиг его из мертвых, – спасешься. И еще:«Близко к тебе слово, в устах твоих и в сердце твоем»(Рим. 10:8).'
      cn: 有些人说，那隔墙就是律法，它不允许犹太人与外邦人混杂。而我则认为，他所指的是那隔墙（不是律法，而是）肉体的仇恨，它仿佛是一堵中间的墙，将我们与上帝隔开，正如先知所说：「你们的罪孽使你们与你们的上帝隔绝了」（以赛亚书 59:2）？此言不虚。这样的障碍，即肉体的仇恨，对于外邦人和犹太人而言，都是通往上帝的障碍，因为律法不仅没有消除，反而加增了（仇恨）：「律法，」使徒说，「惹动忿怒」（罗马书 4:15）。正如在「律法惹动忿怒」这番话中，使徒并非将律法本身视为（忿怒的）原因，而是我们对律法的不服从和违犯，同样，他在这里称律法为隔墙，因为凡是违犯律法的人，就是与上帝为敌。律法也是一道篱笆墙——一道为了坚固（在善中）的篱笆墙——它被称为篱笆墙，是因为它能够抵御（邪恶）。请听先知所说：「他用篱笆把它围起来」（以赛亚书 5:2）；又说：「祢拆毁了它的篱笆，以致路上过往的人都可以采摘」（诗篇 79:13）——这里说的是坚固；又说：「我必撤去它的篱笆，任它被吞吃」（以赛亚书 5:5）；又说：「当求告律法」（以赛亚书 8:20）；在另一个地方又说：「上主施行公义和审判……祂向以色列子民彰显了自己的作为」（诗篇 102:6-7）。而隔墙的存在不是为了守护，而是为了将他们与上帝隔开。这就是隔墙与篱笆墙的区别。他揭示了它（隔墙）的性质，并补充说：「藉着祂自己的肉体废除了仇恨，又藉着教义废除了诫命的律法」（以弗所书 2:15）。采用何种方式呢？（他废除了），藉着终止并摧毁了（与上帝的）仇恨。他不仅以这种方式废除了（律法），还以自己遵守了律法的方式废除了它。那么，你或许会问，我们才刚摆脱了最初的罪行，难道又再次被迫遵守律法了吗？这当然会再次发生，（但事实是，他）甚至连律法本身也废除了。「藉着……教义废除了诫命的律法，」使徒说。哦，何等的慈爱！他赐给我们律法，是要我们遵守它；后来，当我们没有遵守它，并且因此理当受罚时，他甚至将律法也废除了。（这好比）有人将自己的孩子托付给一位管教者，后来发现孩子不听话，便将他从管教者那里解救出来，带走了。哦，何等伟大的慈爱！「藉着……教义废除」是什么意思呢？（使徒）将诫命（εντολή）与教义（δόγματα）作了很大的区分。在这里，他称教义为信仰，因为我们唯独藉着信仰得救，或是（上帝的）定规，类似基督所说的那些：「我实在告诉你们，你们绝不可动怒」（马太福音 5:18，22）。这意味着：如果你相信上帝使他从死人中复活，你就会得救。又说：「这道离你不远，就在你口里，在你心里」（罗马书 10:8）。
  - type: paragraph
