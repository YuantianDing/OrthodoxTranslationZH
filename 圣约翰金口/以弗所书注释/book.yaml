    text:
      ru: 'Для того Бог и сотворил тела наши соразмерными, требующими немногого для своего насыщения, чтобы отсюда уже научить нас, что мы созданы для другой жизни. Такую жизнь Он и хотел даровать нам сначала; но так как мы сами сделались недостойными ее, то Он отсрочил ее и во время отсрочки не позволяет нам наслаждаться без меры. Небольшого стакана вина и одного хлеба достаточно для наполнения желудка человеческого. Владыку всех бессловесных (Бог) создал нуждающимся гораздо менее сравнительно с ними, и дал небольшое тело, указывая этим не иное что, как то, чтобы мы стремились к другой жизни.«Не упивайтесь, – говорит, –вином, от которого бывает распутство». Оно не спасает, а губит не только тело, но и душу.«Но исполняйтесь Духом, назидая самих себя псалмами и славословиями и песнопениями духовными, поя и воспевая в сердцах ваших Господу, благодаря всегда за все Бога и Отца, во имя Господа нашего Иисуса Христа, повинуясь друг другу в страхе»Христовом (Еф.5:18–21). Хочешь, говорит, веселиться? Хочешь провести день? Я даю тебе питье духовное. Пьянство уничтожает благозвучие речи, заставляя наш язык заикаться; равным образом извращает и глаза, и все. Учись петь псалмы, и увидишь сладость этого дела, – потому что поющие псалмы исполняются Духа Святого, а поющие сатанинские песни – духа нечистого. Что означают слова:«в сердцах ваших Господу»? Это значит – со вниманием приступай к этому делу, потому что невнимательные поют без пользы, произнося только слова, тогда как сердце их блуждает в другом месте.«Благодаря всегда за все Бога и Отца, во имя Господа нашего Иисуса Христа, повинуясь друг другу в страхе»Христовом. Т.е., пусть восходят к Богу прошения ваши с благодарением; ничто так не радует Бога, как то, когда кто-нибудь благодарит Его. Преимущественно же мы можем выражать свою благодарность удалением нашей души от вышесказанного, очищением ее от того, о чем сказал (апостол).«но исполняйтесь, – говорит, –Духом". В нашей ли это власти? Да, в нашей. Когда будем очищать душу свою от лжи, жестокости, блуда, нечистоты и любостяжания, когда сделаемся добродушны, сострадательны, заботливы о себе, когда не будет в нас кощунства, когда сделаем себя достойными, – тогда что воспретит Св. Духу приблизиться и прилететь к нам? И Он не просто приблизится, но наполнит сердце наше. Когда же внутри нас будет такой свет, то после того добродетель не будет уже нам трудна, но – легка и приятна."благодаря, – говорит, –всегда за все». Как же? Должно благодарить за все, что ни случится? Подлинно так, – хотя бы то была болезнь, хотя бы бедность. Если и в ветхом завете некоторый мудрец советовал, говоря:«Все, что ни приключится тебе, принимайрадостно,и в превратностях твоего уничижения будь долготерпелив»(Сир. 2:4), то тем более это должно быть в новом. Хотя бы ты и не понимал причины чего-нибудь, благодари: в том-то и заключается благодарность. Ничего нет важного, ни удивительного в том, если ты благодаришь, когда облагодетельствован, здоров, все тебе удается и ты счастлив. Нужно, чтобы ты благодарил в несчастьях и скорбях. Не говори ничего, кроме слов: благодарю Тебя, Владыка! Но что я говорю о бедствиях, которые случаются здесь (на земле)? За самую геенну, за наказания, за муки, которые будут там (за гробом), должно благодарить Бога. Если мы будем внимательны, – это дело принесет нам великую пользу, когда именно страх геенны будет налагать узду на сердца наши. И не только за явные благодеяния, но и за тайные, посылаемые против желания, мы должны благодарить. (Бог) много благодетельствует нам, когда мы не хотим или не видим этого. Если не верите, я вам разъясню это дело. Подумай, не все ли приписывают солнцу и идолам своим беззаконные и безбожные эллины? Что ж? Разве Он не посылает благодеяний и им? Не Его ли промыслу обязаны они жизнью, здоровьем, детьми и другим подобным? А так называемые маркиониты? А манихеи? Разве не хулят Его? Что же? Разве не благодетельствует Он и им каждый день? Если же тем, без их ведома, благодетельствует, то тем более нам. И что другое свойственно Богу, как не благодетельствовать человеческому роду и в наказаниях и в благодеяниях?'
      cn: '上帝创造我们的身体适度，仅需少量即可饱足，正是为了借此教导我们，我们是为另一种生命而受造的。祂起初就愿赐予我们这样的生命；然而，因我们自己变得不配得它，祂便推迟了它，并在推迟期间不容许我们无节制地享乐。一小杯酒和一片面包就足以使人的胃饱足。上帝创造了万物无言生灵之主（人），使他所需远比它们少，并赐予他一个微小的身体，借此所指无非是，我们当渴慕另一种生命。「不要醉酒，酒能使人放荡。」祂说。它不能拯救，反而毁灭身体和灵魂。「却要被圣灵充满；当用诗章、颂词、灵歌彼此对说，心中向着上主歌唱颂赞；凡事要奉我们主耶稣基督的名，常常感谢父上帝；又要存敬畏基督的心，彼此顺服。」（以弗所书 5:18-21）。祂说，你想要欢愉吗？想要度过这一天吗？我赐予你属灵的饮品。醉酒摧毁言语的悦耳，使我们的舌头结巴；同样扭曲眼睛和一切。学习歌唱诗篇，你将看到此事中的甘甜——因为歌唱诗篇的人被圣灵充满，而歌唱撒旦之歌的人则被不洁之灵充满。「心中向着上主」这些话语是什么意思？这意味着——要用心行此，因为不用心的人徒然歌唱，口中只发出言语，而他们的心却流荡在别处。「凡事要奉我们主耶稣基督的名，常常感谢父上帝；又要存敬畏基督的心，彼此顺服。」也就是说，愿你们的祈求带着感恩升达上帝；没有什么比有人感谢祂更令上帝喜悦的了。然而，我们尤其可以通过使我们的灵魂远离上述所言，洁净它，脱离（使徒）所说的一切，来表达我们的感恩。「却要被圣灵充满。」祂说。这是否在我们掌握之中？是的，在我们掌握之中。当我们洁净自己的灵魂，远离谎言、残忍、淫乱、不洁和贪婪之时；当我们变得心存善意、富有同情心、并关顾自己之时；当我们心中没有亵渎之时；当我们使自己配得之时——那时，什么能阻止圣灵接近并飞向我们呢？祂不仅会接近，更会充满我们的心。当我们内心有这样的光时，德行就不再是我们的重担，而是轻省和愉悦的了。


        「凡事……常常感谢。」祂说。怎样？难道凡事都应当感恩吗？确实如此——即便那是疾病，即便那是贫困。如果在旧约中，有位智者建议说：「凡临到你的一切，你都要欢喜接受，并在你受屈辱的变故中忍耐。」（西拉书 2:4），那么在新约中就更应如此。即便你不明白某事的原因，也要感谢：这才是感恩的真谛。当你蒙受恩惠、身体健康、诸事顺利、并且幸福之时，你的感恩就没什么重要，也没什么稀奇的了。你需要在苦难和忧伤中感恩。除此言语之外，不要再说什么：「我感谢祢，主宰啊！」但我为何谈论这里（地上）所遭遇的灾难呢？即使是为了地狱本身、为了彼处（阴间）的刑罚、为了那些折磨，也应当感谢上帝。如果我们留意，这事会给我们带来极大的益处，正当地狱的恐惧勒住我们的心之时。我们不仅要为明显的恩惠感谢，也要为那些隐秘的、甚至违背我们意愿而降临的（恩惠）感谢。（上帝）在我们不愿或没有看到之时，仍赐予我们许多恩惠。如果你们不相信，我将为你们解释此事。试想，那些悖逆不敬神的希腊人，不都把一切归因于太阳和他们的偶像吗？那么呢？难道祂不也赐恩于他们吗？他们的生命、健康、儿女以及其他类似的一切，难道不是归因于祂的护理吗？那些所谓的马吉安派信徒呢？摩尼教徒呢？难道他们不亵渎祂吗？那么呢？难道祂不也每天赐恩于他们吗？如果祂在他们不知情的情况下，仍赐恩于他们，那更何况是我们呢？施恩于人类，无论是在刑罚中还是在恩惠中，这不正是上帝的本性吗？'
  - type: paragraph
    text:
      ru: Итак, не в счастии только мы должны благодарить, потому что тут нет ничего важного. Это знал и дьявол; потому и говорил:«разве даром богобоязнен Иов? Не Ты ли кругом оградил его и дом его и все, что у него? ...но простри руку Твою и коснись всего, что у него, – благословит ли он Тебя?»(Иов. 1:9–11). Но злодею этому (дьяволу) не было от того никакой пользы, и пусть не случится, чтобы и относительно нас было ему что-нибудь большее. Когда постигают нас бедность, болезни, несчастья, тогда-то и должно сильнее благодарить. Я разумею благодарность не на словах, не на языке, а в поступках, делах, мысли и сердце. Всей душой будем благодарить Его. Ведь Он любит нас более, нежели наши родители, и любовь Божья настолько различна от любви родительской, насколько благость отстоит от лукавства.
      cn: 所以，我们不应仅仅在幸福中感恩，因为这其中没有什么重要的。连魔鬼也知道这一点；所以它才说：「约伯敬畏上帝，岂是无故呢？祢岂不是四面圈上篱笆，围护他和他的家，以及他一切所有的吗？……但祢若伸手加害他一切所有的，他岂不祝福祢吗？」(约伯记 1:9-11)。然而，这恶者（魔鬼）并未从中得到任何益处，愿它在我们身上也得不到更多。当贫困、疾病、不幸降临我们之时，那时才更应加倍感谢。我所指的感谢，并非言语上的、口头上的，而是行动、作为、思想和心灵中的。我们要全心全灵地感谢祂。因为祂爱我们，甚至胜过我们的父母，而上帝的爱与父母的爱截然不同，其区别之大，如同良善与诡诈的距离。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Это не мои слова, но любящего нас Христа. Послушай, что говорит Он:«Есть ли между вами такой человек, который, когда сын его попросит у него хлеба, подал бы ему камень? и когда попросит рыбы, подал бы ему змею? Итак если вы, будучи злы, умеете даяния благие давать детям вашим, тем более Отец ваш Небесный даст блага просящим у Него»(Мф.7:9–11)? И опять послушай, что говорит Он в другом месте:«Забудет ли женщина грудное дитя свое, чтобы не пожалеть сына чрева своего? но если бы и она забыла, то Я не забуду тебя», – говорит Господь (Ис. 49:15). Если он не любит нас, то для чего сотворил? Разве это Ему было необходимо? Разве мы делаем что-нибудь Ему полезное и нужное? Разве Он нуждается в ком-либо из нас? Послушай слов пророка:«Ты – Господь мой; блага мои Тебе не нужны»(Пс. 15:2). Но не понимающие и не чувствующие этого говорят: при благости Божьей должно быть равенство для всех. Но скажи мне, неблагодарный человек, в чем ты видишь отсутствие благости Божьей, и что называешь равенством? Один, говорят, с детства калека, другой безумствует и одержим демоном, иной всю жизнь до глубокой старости провел в бедности, иной в жестоких болезнях. Таковы ли дела Промысла? Один глух, другой нем, третий беден, иной же зол и беззаконен, исполнен бесчисленных пороков, а имеет деньги, содержит блудниц и нахлебников, приобрел великолепный дом, ведет беззаботную жизнь.'
      cn: '这不是我的话，而是爱我们的基督所说。请听祂说：

        「你们中间有谁，当儿子求饼，反给他石头呢？求鱼，反给他蛇呢？你们虽然不好，尚且知道把好东西给你们的儿女，何况你们在天上的父，岂不更要把好东西赐给求祂的人吗？」(马太福音 7:9-11) 再听祂在另一个地方所说：

        「妇人焉能忘记她吃奶的婴孩，不怜恤她所生的儿子？即便有忘记的，我却不忘记你。」——这是上主说的 (以赛亚书 49:15)。如果祂不爱我们，那祂为何创造我们？难道祂需要这样做吗？难道我们做了什么对祂有用和必须的事情吗？难道祂需要我们中的任何人吗？请听先知的话：

        「祢是我的上主；我的好处对祢无益。」(诗篇 15:2) 但不理解和不体察此事的人会说：既然有上帝的良善，就应该人人平等。但请告诉我，你这不知感恩的人，你在何处看到上帝缺乏良善，你又把什么称为平等呢？有人说，有人自幼残疾，有人疯癫且被魔鬼附身，另有人终其一生至耄耋之年都在贫困中度过，另有人身患重疾。这就是上主护理之工吗？有人耳聋，有人口哑，有人贫穷，另有人却邪恶且不法，满身无数的罪愆，却拥有钱财，供养娼妓和食客，购置了华丽的房屋，过着无忧无虑的生活。'
  - type: paragraph
    text:
      ru: 'И много говорят подобного, сплетая длинное слово осуждения на Промысл Божественный. Что же? Нет, стало быть, Промысла? Что нам сказать против них? Если бы это были эллины и сказали нам: кем управляется мир? – мы спросили бы их в свою очередь: что же? нет Промысла? Зачем же вы почитаете богов, поклоняетесь демонам и героям? Ведь если есть Промысл, то он бодрствует над всеми. Если между христианами и эллинами найдутся отчаивающиеся и сомневающиеся, – что им сказать? Скажи мне, ужели от случая произошло столько благ: ежедневный свет, благоустройство в существующем, хор звёзд, равномерное течение дней и ночей, последовательность природы в растениях, животных и людях? Кто, скажи мне, управляет этим? Если нет никого пекущегося, а все поддерживается случайно, то кто над землей и водами, опрокинувши, распростер такой прекрасный, такой величественный шатер, – я разумею небо? Кто дал плодоносящие времена? Кто вложил такую силу в семена и растения? Все случайное бывает совершенно беспорядочно, между тем как все благоустроенное художественно. Что у нас из случайного, скажи мне, бывает свободно от великой неурядицы, великого замешательства, беспорядка? Я уже не говорю о том, что происходит без причины, но даже о том, кто делает, но берется за дело без умения. Пусть, например, будет дерево, камни и известь; пусть возьмет их человек, не знающий домоустройства, и начнет строить и трудиться. Не все ли он погубит и испортит? Опять же, пусть будет корабль без кормчего со всем, что нужно иметь кораблю, кроме кормчего, не говорю – не оснащенный, но даже оснащенный: он не в состоянии будет плыть. Эта земля, стоящая на воде, могла ли бы, скажи мне, простоять столько времени без поддерживающей силы? И есть в этом смысл? И мнение такого рода не стоит осмеять тысячи раз? Если при этом (вода) носит и небо – вот другая тяжесть. Но на воде ли держится небо – другой вопрос. Все это – дело Промысла. Все, носящееся на воде, не должно быть вогнутым, но выпуклым. Почему? Потому что тело выпуклое, как например в корабле, остается наружу и стремится вверх, а тело вогнутое все погружается в воду. Итак, для него (неба) нужно тело упругое, твердое, способное выдержать напор и вынести наложенную тяжесть. Не воздух ли поддерживает небо? Но он гораздо жиже, рыхлее воды и вещам, даже самым легким, не может противопоставлять достаточного сопротивления, а тем более такой громаде. Целого века нам недостаточно было бы, если бы мы стали рассматривать все дела Промысла, как в общем, так и в частностях. Спрошу настоящего совопросника: от Промысла все это произошло, или случайно? – и, если бы он сказал: нет Промысла, – опять спрошу: как же это произошло? И не найдется он указать ни на одну причину. Отсюда уже, тем более, ты не должен разузнавать и усиливаться разгадывать вопросы, касающиеся жизни человека. Почему? Потому что человек превосходнее всего этого и все это произошло для человека, а не человек для этого.'
      cn: 他们也说了许多类似的话，编织出长篇大论的谴责，针对神圣的普照。那又怎样？难道说，就没有普照了吗？我们该如何反驳他们呢？如果是希腊人，问我们说：「世界是由谁管理的？」我们就会反问他们：「那又怎样？难道没有普照吗？你们为何要敬拜诸神，崇拜鬼魔和英雄呢？」因为如果真有普照，那么它就看顾着万物。如果在基督徒和希腊人中，有绝望和疑惑的人，该对他们说什么呢？请告诉我，难道这么多美善的事物是偶然发生的吗：每日的光明，现有秩序的完善，众星的队列，日夜的均匀更替，以及植物、动物和人类自然界的秩序井然？请告诉我，是谁管理着这一切呢？如果没有人看顾，而万物皆由偶然维系，那么是谁在大地和水之上，展开了如此美丽、如此宏伟的帐幕——我指的是天空呢？是谁赐予了丰收的季节？是谁将如此巨大的力量注入种子和植物之中？所有偶然发生的事物都是完全混乱的，然而所有井然有序的事物都体现着匠心。请告诉我，我们这里有什么偶然的事物，是能免于巨大的混乱、巨大的困惑和无序的呢？我甚至不提那些无故发生的事，更别提那些做事却没有技能的人。比如，有木材、石块和石灰；让一个不懂建筑的人拿去，开始建造和劳作。难道他不会毁坏并糟蹋一切吗？再者，若有一艘没有舵手的船，具备船所需的一切，唯独没有舵手——我不是说它未装备，而是即便装备齐全：它也无法航行。这片立于水上的大地，请告诉我，它能没有支撑之力而维系如此之久吗？这有道理吗？这种观点难道不值得被嘲笑千次吗？如果水同时承载着天空——这就是另一份重担了。但天空是否依仗水而立，这是另一个问题。所有这一切都是普照之工。所有漂浮在水上的东西，不应该是凹陷的，而应该是凸起的。为什么呢？因为凸起的物体，就像船一样，浮在水面并向上趋动，而凹陷的物体则完全沉入水中。所以，对于它（天空）而言，需要一个有弹性、坚固的物体，能够承受压力并承载其上的重负。难道是空气支撑着天空吗？但它比水稀薄得多，松散得多，甚至连最轻的物体都无法提供足够的抵抗力，更何况是如此庞大的身躯。即使一个世纪也不足以，如果我们开始审视普照的一切作为，无论从整体还是细节上。我会问真正的辩论者：「这一切是来自普照，还是偶然发生的？」而如果他回答：「没有普照。」我将再次问：「那这又是如何发生的呢？」他将无法指出任何一个原因。从此，你更不应查究并竭力解答那些涉及人类生命的问题。为什么呢？因为人超越这一切，而所有这一切都是为了人而存在，而人并非为此而存在。
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: Итак, если ты не понимаешь премудрости и порядка, заключающихся в промышлении о нем (человек), как можешь постигнуть причины, заключающиеся (в Боге)? Да, скажи мне, почему (человек) сотворен столь малым, до того удаленным от высот небесных, что сомневается в являющемся свыше? Почему северные и южные страны необитаемы? Почему, скажи мне, зимой ночь бывает больше, летом – меньше? К чему стужи, жар, почему тело смертно? Я предложу тебе бездну и других вопросов, даже, если хочешь, не перестану спрашивать, и во всем ты будешь безответен предо мной. В том-то, главным образом, и состоит Промысел, что причины для нас непостижимы. Если бы это не превышало нашего разумения, то, пожалуй, кто-нибудь и в самом деле счел бы человека причиной всего. Такой-то, говорит, беден, а бедность есть зло. Что такое также болезнь, или слепота? Все это – ничто, человек! Одно только несчастье – грешить, и об этом одном нам и должно рассуждать. Оставивши исследования относительно причин действительных бедствий, мы слишком много хлопочем о постороннем. Отчего никто из нас никогда не старается узнать, почему он грешил? В моей ли власти грешить, или не в моей? Нет нужды тут много говорить, поищу ответа в самом себе. Не победил ли я когда-нибудь страстных влечений, не восторжествовал ли над гневом из стыда, или из страха пред людьми? Когда найду такие случаи, то заключу отсюда, что грешить в моей власти. Никто об этом не любопытствует, никто не берет на себя труда это узнать; но без размышления, по словам Иова, смертный«пустой ...мудрствует»(Иов. 11:12). Что тебе за нужда до того, что один слеп, другой беден? Не об этом Бог повелевает рассуждать тебе, а о том, что сам ты делаешь. Если ты сомневаешься, промышляет ли какая-нибудь сила о мире, ты самый безрассудный человек; если же ты убежден в этом, то зачем сомневаешься, что должно угождать Богу?«Благодаря всегда, – говорит, –за все Бога»(Еф.5:20). Войди в лечебницу и, когда там бывает раненый, посмотри, как врач режет и жжет его. Впрочем, я говорю это не по отношению к тебе, – ты войди в мастерскую плотника. И не добьешься ты смысла, ничего почти не поймешь из того, что там делается; многое покажется тебе бестолковым, когда, например, он сверлит, или стругает дерево. Если я приведу тебя к другому, более простому искусству, например к живописи, то и здесь ты растеряешься. Скажи мне, не напрасным ли тебе покажется делать то, что делает (живописец)? К чему, для него служат начертания и переплетения линий? Когда же он положит краски, тогда бросится тебе в глаза красота искусства и все-таки, и после этого, ты не в состоянии будешь ничего понять в точности. Но зачем я говорю о плотниках, живописцах, таких же рабах, как и мы? Расскажи мне, как пчела делает соты, и тогда говори о Боге. Изучи искусство муравьев, паука, ласточки, и после этого говори о Боге. Объясни мне это, если ты умен; но ты не в состоянии.
      cn: 那么，如果你无法理解蕴含在对人（他）的眷顾中的智慧与秩序，你又怎能领悟蕴含在上帝之中的缘由呢？是的，告诉我，为什么人被造得如此渺小，如此远离天堂之高处，以至于怀疑那从上方显现之物？为什么北方和南方之地无人居住？为什么，告诉我，冬天的夜晚更长，夏天更短？何以有严寒，有酷热，为什么身体是必死的？我将向你提出无数其他问题，甚至，如果你愿意，我将不停地问，而你在所有这一切面前都将无言以对。这正是天意之所在，主要在于对我们而言，那些缘由是不可理解的。如果这不超出我们的理解范围，那么，也许有人会真的认为人是万物之因。有人说：『某人贫穷，而贫穷就是邪恶。』那么疾病或失明又是什么呢？所有这些——都微不足道，人啊！唯一的祸患是犯罪，而我们只应思考这一点。我们放弃了探究关于真正祸患的缘由，却在无关紧要的事情上操劳过多。为何我们当中无人曾努力去了解他为何犯罪？犯罪是在我的权能之内，还是不在我的权能之内？无需在此多言，我将在我自己身上寻找答案。我难道从未战胜过情欲的诱惑吗？难道从未因羞耻，或是惧怕世人而克制怒气吗？当我找到这样的事例时，我便会由此得出结论，犯罪是在我的权能之内。无人对此感到好奇，无人费心去了解这一点；但未经思考，依照约伯的话，凡人却「虚妄地……自以为有智慧」（约伯记 11:12）。你何必关心一个人失明，另一个人贫穷呢？上帝并非命你思考这些，而是关于你自己所行的。如果你怀疑是否有某种力量在眷顾世界，你就是最无知的人；但如果你对此深信不疑，那为何又怀疑应该取悦上帝呢？「凡事要常常感谢上帝」（以弗所书 5:20）。走进一间医馆，当那里有受伤之人时，看看医生如何切割和烧灼他。不过，我说的这话并非针对你——你走进木匠的作坊。你将无法领会其意义，几乎不明白那里所做的一切；许多事情在你看来会是毫无道理的，例如，当他钻孔，或是刨木头时。如果我带你到另一个更简单的技艺，例如绘画，那么在这里你也会不知所措。告诉我，你是否会觉得做画家所做之事毫无意义？对他而言，那些勾勒和交织的线条是做什么用的？而当他铺上颜料时，那时艺术之美才会映入你眼帘，然而即便如此，在此之后，你也无法精确地理解任何事情。但我为何要谈论木匠、画家，那些与我们一样是奴仆的人呢？告诉我，蜜蜂如何筑巢，然后再谈论上帝。研究蚂蚁的技艺，蜘蛛，燕子，然后你再谈论上帝。如果你聪明，就给我解释这些；但你办不到。
  - type: paragraph
    text:
      ru: 'Итак, ужели не перестанешь ты, человек, искать излишнего, – а это поистине излишне, – не перестанешь безрассудно любопытствовать? Нет ничего мудрее такого незнания, и признающиеся в полном незнании в этом случае оказываются умнее всех, а суемудрствующие неразумнее всех. Таким образом, заявление о своем знании не всегда показывает мудрость, а иногда и глупость. Скажи мне, если бы из двух человек один объявил, что измерит протянутыми веревками воздух, простирающийся от земли до неба, а другой, осмеивая первого, признавался бы, что он этого не знает, – кого мы, скажи, осмеяли бы: называющего себя знающим, или незнающего? Очевидно, – именуемого знатока. Итак, незнающий мудрее того, кто выдает себя за знающего. Еще: если бы кто объявил, что знает, сколько стаканов (воды) содержит в себе море, а другой – что не знает, – здесь опять незнание не мудрее ли знания? Конечно. А почему? Потому что это незнание шире (чем знание). Признающийся в незнании знает кое-что. Именно что? То, что нечто сокрыто от человека; а это немаловажно. Тот же, кто говорит, что знает, в особенности не понимает того, о чем говорит, будто знает; потому-то он и заслуживает осмеяния. Увы, сколько мы имеем побуждений обуздывать неуместную пытливость и любопытство, – и все же не удерживаемся, но вмешиваемся в жизнь других (и спрашиваем): почему тот беден, почему этот слеп? С такими вопросами мы впадем и в другие бредни, – почему, например, это женщина, почему не все мужчины, почему это осел, почему бык, почему собака, почему волк, почему камень, почему дерево, – и вопросы продлятся в бесконечность. Поэтому-то Бог и положил меру нашему знанию и (положил основание ей) в нашей природе. Посмотри со мной на весьма любопытное явление. Когда мы смотрим с земли на небо, на такую высоту, то ничего тяжелого не чувствуем, а когда взойдем на какую-нибудь высокую башню и захотим, несколько наклонясь, посмотреть вниз, то вдруг ощущаем кружение и помрачение головы. Скажи мне причину этого; но ты не найдешь, почему глаз имеет большую силу (чем другие чувства), и перестает действовать на значительнейших расстояниях'
      cn: 那么，你这个人，难道还不停止寻求那过度的东西，——这确实是过度的——难道还不停止愚昧地好奇吗？没有比这种无知更智慧的了，在此情况下，承认自己全然无知的人，反倒比所有人都更聪明，而那些自作聪明者却比所有人都更愚昧。如此看来，宣称自己有知识并不总是显明智慧，有时反倒显明愚昧。你告诉我，如果有两个人，其中一个宣称他要用绳索量度从地到天际的空气，而另一个人嘲笑前者，承认自己不知道如何量度，——你告诉我，我们会嘲笑谁呢：是那个自称有知识的人，还是那个无知的人呢？显然是那个所谓通晓之人。那么，无知的人比那个自诩有知识的人更智慧。再者：如果有人宣称他知道大海容纳了多少杯水，而另一个人说他不知道，——在这里，无知岂不比有知更智慧吗？当然。为什么呢？因为这种无知比（那种）有知更宽广。承认自己无知的人，其实知道一些事。究竟是什么呢？就是有些事是人所不能领会的；而这并非小事。而那个说自己知道的人，尤其不明白他所声称知道的事；正因如此，他才值得被嘲笑。唉，我们有多少理由要遏制不合宜的探究和好奇心，然而我们仍不能自制，却干预他人的生活（并问道）：为什么那个人贫穷，为什么这个人失明？带着这样的问题，我们也会陷入其他的妄想，——例如，为什么这是个女人，为什么不是所有都是男人，为什么这是驴子，为什么是公牛，为什么是狗，为什么是狼，为什么是石头，为什么是树木，——而问题将无休止地延续下去。正因如此，上帝为我们的知识设定了限度，并（在我们的本性中）奠定了这限度的基础。请与我一同看看一个非常奇特的现象。当我们从地上仰望高空，仰望那般高度时，丝毫感觉不到沉重，而当我们登上某座高塔，稍微倾身向下看时，突然感到头晕目眩。你告诉我其中的原因；但你不会找到，为何眼睛（比其他感官）具有更大的力量，却在极远的距离上便停止作用。
  - type: paragraph
    initial:
      ru: '5.'
      cn: '5.'
    text:
      ru: И в отношении слуха можно видеть подобное. Никто не сможет наполнить криком весь воздух, окидываемый глазом, или слышать на таком расстоянии. Почему не все члены имеют одинаковую честь, не отправляют одинакового назначения и не занимают одного места? И Павел любопытствовал об этом, или лучше, не любопытствовал, – потому что он был мудр, – но, пришедши к этому вопросу, сказал:«Но Бог расположил члены, каждый всоставетела, как Ему было угодно»(1Кор. 12:18). Все он приписал воле Божьей. Прекративши изыскания, будем же и мы только благодарить за все. Потому, говорит,«благодаря всегда за все». Это свойственно рабу мудрому, благоразумному и рачительному, а то (пустое любопытство) – болтливому, ленивому, мешающемуся не в свое дело. Не знаешь ли, что между слугами самые пустые и ни к чему негодные бывают говорливы, болтливы и стараются разузнать тайны, скрываемые господами, а благоразумные, усердные только и смотрят, как бы выполнить свою службу? Кто много говорит, тот ничего не делает; кто много делает, тот ничего не говорит неуместного. Поэтому и Павел говорил, пиша о вдовах:«приучаются ...не только праздны, но и болтливы»(1Тим. 5:13).
      cn: 同样，在听觉方面也能看到类似的情形。没有人能用呼喊声充满目光所及的整个空间，也无法听到如此遥远的距离。为何不是所有肢体都享有同样的尊荣，履行同样的功用，占据同样的位置呢？保罗曾对此感到好奇，或者更确切地说，他并没有感到好奇——因为他满有智慧——但他面对这个问题时，说道：「但上帝随己意把肢体安放在身体里，各得其所。」(哥林多前书 12:18) 他将一切都归于上帝的旨意。停止探究吧，让我们也只为一切献上感谢。因此，经上说，「常常为一切感谢。」这是一位智慧、明智而勤勉的仆人所具备的特质，而那（空洞的好奇心）则属于那些多嘴、懒惰、干涉不相干事务的人。难道你不知道，在仆人中，那些最空虚、最无用的人往往多言、饶舌，并试图打探主人所隐藏的秘密吗？而那些明智、殷勤的人，则只关注如何履行自己的职责。多言者无所作为；多作者不会说不合宜的话。因此，保罗在写到寡妇时曾说：「她们……不只惯于懒惰，而且说长道短。」(提摩太前书 5:13)
  - type: paragraph
    text:
      ru: 'Скажи мне, где больше различия: между возрастом нашим и детским, или между Богом и людьми? Между нами и комарами, или между нами и Богом? Очевидно, между нами и Богом. Итак, зачем же ты такой любопытный? Благодари за все. Но скажешь: что я буду отвечать, если меня спросит эллин и захочет от меня узнать, есть ли промысел, а сам он говорит, что нет никого промышляющего? Спроси и ты его в свою очередь. Но он говорит, что нет никого промышляющего? Что промысел есть, это ясно из сказанного; относительно же непостижимого (укажи на то), что мы не понимаем его значения. Если в делах человеческих мы многого не понимаем, как что делается, и хотя многое нам кажется неуместным, однако уступаем, – то тем более (должно так поступать) по отношении к Богу. В Боге для верующих и не кажется и нет ничего неуместного. Поэтому, будем благодарить за все, за все будем прославлять Его."Повинуясь, – говорит, –друг другу в страхе Божьем»(Еф.5:21). Если ты повинуешься из-за подчинения, из-за денег, или из-за стыда, то тем более (повинуйся) из-за страха Божьего. Пусть будет взаимное воздаяние за рабство и подчинение; тогда уже не будет рабства. Пусть не занимает исключительно один место свободного, другой – раба, но лучше, если господа и слуги взаимно служат друг другу. Гораздо лучше так быть рабом, нежели иным образом быть свободным. Вот доказательство: пусть кто-нибудь имеет сто слуг и никто из них ему не служит; пусть, с другой стороны, будет сто друзей, взаимно служащих друг другу. Кто из них будет лучше жить, у кого будет больше радости, больше веселья? Там нет ни гнева, ни досады, ни раздражения, ничего подобного, здесь – страх и рабство; здесь все по необходимости, там все по свободному избранию; здесь служат по принуждению, там – по любви друг к другу. Так восхотел и Бог, – поэтому омыл ноги учеников. Еще более: и господа, если хочешь рассудить тщательно, обязаны вознаграждать друг друга взаимным служением. Что произошло бы, если бы гордость не допустила оказывать взаимных воздаяний? Когда кто отправляет плотское служение, ты питаешь его тело, заботишься о пище, одежде, обуви, и это есть один из видов служения. Если ты не выполняешь своего служения, то он не будет выполнять и своего; никакой закон не заставит его служить, если ты не кормишь его. Если так бывает по отношению к рабам, то что неуместного, если также случится и со свободными?"В страхеХристовом, – говорит, –повинуясь". Что же это за милость, когда (за службу) имеем и воздаяние? Но он не хочет тебе подчиняться? Подчиняйся ты ему, и не просто повинуйся, но подчиняйся. Служи всем, как господам, и скоро ты будешь иметь их слугами, порабощенными властью, сильнейшею власти суровейшего тирана. Еще более ты приобретешь их, если, не получая от них ничего, будешь отдавать им свое.«Повинуясь друг другу в страхе»Христовом – значит, чтобы мы обуздывали все страсти, служили Богу, питали любовь друг к другу, и тогда мы сможем удостоиться человеколюбия Божьего, благодатью и щедротами (Господа нашего Иисуса Христа, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь).'
      cn: 请告诉我，哪里有更大的差异：是在我们的年龄与儿童的年龄之间，还是在上帝与人之间？是在我们与蚊子之间，还是在我们与上帝之间？显然，是在我们与上帝之间。那么，你为何如此好奇呢？为一切感恩吧。但你会说：如果一个希腊人问我，并想从我这里知道是否有神意，而他自己却说没有掌管万物的，我将如何回答呢？你也反问他。但他（仍）说没有掌管万物的？有神意一事，从已说的话中可见一斑；至于那不可理解之处（你要指出），我们不明白它的意义。如果我们对人的事务尚有许多不明白它们是如何运作的，并且尽管许多事我们看来不合宜，然而我们仍会顺从，那么对于上帝，就更应该如此行。在上帝里，对于信徒来说，既没有不合宜之处，也不存在任何不合宜。因此，我们要为一切感恩，我们要为一切颂赞祂。「他说：『当存敬畏上帝的心，彼此顺服』」（以弗所书 5:21）。如果你顺服是出于服从，出于金钱，或出于羞耻，那么更应（顺服）出于敬畏上帝的心。愿为奴役和服从有相互的回报；那时便不再有奴役了。不要让一个人独占自由人的位置，另一个人独占奴仆的位置，而是，如果主人和仆人相互服侍，那会更好。如此为奴要好得多，胜过以其他方式成为自由人。这就是证据：假设某人有一百个仆人，但他们中没有一人服侍他；另一方面，假设有一百个朋友，他们相互服侍。他们中谁会生活得更好，谁会有更多的喜乐，更多的欢愉？在那里（朋友之间）没有愤怒，没有恼怒，没有烦躁，也没有类似的情绪；在这里（主人与不服侍的仆人之间）是恐惧和奴役；在这里一切都是出于必要，在那里一切都是出于自由选择；在这里服侍是出于强迫，在那里服侍是出于彼此相爱。上帝也是如此期望，因此祂洗了门徒的脚。更进一步的是：如果你愿仔细思考，连主人也有义务以相互的服侍来回报彼此。如果傲慢不允许相互的回报，那会发生什么呢？当有人履行属肉体的服侍时，你供养他的身体，照顾他的饮食、衣着、鞋履，而这正是一种服侍。如果你不履行你的服侍，那么他也不会履行他的；如果你不喂养他，没有任何法律会强迫他服侍。如果对奴仆是如此，那么对自由人也如此，又有什么不合宜的呢？「他说：『当存敬畏基督的心，彼此顺服』。」当（为着服侍）我们也有回报时，这又是何等恩典呢？但他不愿意服从你吗？你就服从他，不只是简单的顺服，而是要服从。服侍所有人，如同服侍主人，很快你就会拥有他们作为仆人，被一种比最严酷的暴君之权势更强大的权势所奴役。如果你一无所取于他们，却将你的给予他们，你会更加赢得他们。「在敬畏基督的心里彼此顺服」——这意味着我们要抑制所有的情欲，服侍上帝，培养彼此的爱，那么我们就能蒙受上帝的慈爱，借着（我们的主耶稣基督）的恩典和丰盛慈爱，祂与父和圣灵同享荣耀、权柄、尊贵，从今时直到永远，世世代代。阿们。
- type: heading1
  text:
    ru: Беседа 20
    cn: 第 20 讲
  children:
  - type: paragraph
    text:
      ru: Еф.5:22–24.Жены, повинуйтесь своим мужьям, как Господу,
      cn: (以弗所书 5:22-24) 妻子们，要顺从自己的丈夫，如同顺从主，
  - type: paragraph
    text:
      ru: потому что муж есть глава жены, как и Христос глава Церкви, и Он же Спаситель тела.
      cn: 因为丈夫是妻子的头，正如基督是教会的头，祂也是身体的救主。
  - type: paragraph
    text:
      ru: Но какЦерковьповинуется Христу, так и жены своим мужьям во всем.
      cn: 但正如教会顺服基督，妻子也当凡事顺服自己的丈夫。
  - type: paragraph
    text:
      ru: Счастливы муж и жена, друг друга любящие. – Сила любви. – Чего нужно искать в жене. – Добрые качества жены. – Супружеский союз – символ нашего единения с Христом. – Нужна снисходительность к недостаткам жены. – Как должен поступать муж в отношении к жене. – Советы бедным супругам. – Как нужно устраивать дом и семью. – Истинные достоинства молодой девушки. – Каких нужно выбирать жен и как относиться к ним.
      cn: '蒙福的丈夫与妻子，彼此相爱。

        ——爱的力量。

        ——在妻子身上应寻找什么。

        ——妻子的美德。

        ——婚姻结合——我们与基督合一的象征。

        ——需要对妻子的缺点予以宽容。

        ——丈夫应如何对待妻子。

        ——给贫困夫妻的建议。

        ——应如何建立家室。

        ——年轻女子的真正美德。

        ——应选择何种妻子，以及应如何对待她们。'
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Некоторый мудрый муж, перечислив многие блага, поставил в числе их и согласие (между мужем и женой):«и жена и муж, – сказал он, –согласно живущие между собою»(Сир. 25:2). Подобным образом, и в другом месте, в числе же благ он поставляет единомыслие между мужем и женой (Сир.25:11). При том известно, что и изначала Бог прилагал особенное попечение об этом союзе, и, говоря об обоих, Он выражается как об одном:«Бог мужчину и женщину сотворил»(Мк. 10:6); и еще:«нет мужеского пола, ни женского»(Гал. 3:28). В самом деле, не может быть такой близости у мужа с мужем, какая у жены с мужем, если только кто законно сочетался с нею. Потому-то один блаженный муж, выражая чрезмерную любовь и оплакивая одного из любимых им и сердечно ему преданных, берет для этого в пример любовь не отца или матери, ни дитяти или брата, ни друга, – но чью? Падет«любовь твоянаменя, – говорил он, – каклюбовьженская» (2Цар. 1:26). Поистине, любовь эта насильственнее всякой тирании. Сильны и другие (страсти); но эта страсть имеет такую силу, которая никогда не ослабевает. В самой природе нашей есть какое-то страстное влечение, непонятное для нас, которое соединяет эти тела (мужа и жены). Вот и вначале жена произошла от мужа, а после от жены и мужа муж и жена. Замечаешь ли союз и единство? Почему (Бог) не попустил превзойти сюда другой сущности отвне? И смотри, как Он устроил: Он дозволил человеку иметь женой сестру, еще более – не только сестру, но и дочь, и не только дочь, но нечто, ближе дочери, – собственную плоть. Все же это Он устроил изначала, соединяя их в одно, как бы на каменном основании. Не от вне Он жену сотворил, для того, чтобы муж не смотрел на нее, как на чуждую; а, с другой стороны, не ограничил брачного сожития только ею, чтобы он, стесняя и принуждая себя, не отделился вовсе от других. И как между растениями те особенно красивы, которые имеют один ствол, разветвляющийся на многие ветви, а те, которых ветви разветвляются беспорядочно, каждая вырастая от особенного корня, не представляются красивыми, так и здесь, Бог из одного Адама произрастил весь род (человеческий), поставивши его через то в совершенную невозможность разъединиться или разделиться. Потом, для большего также единения, запретил вступать в брак с сестрами и дочерьми, чтобы через это мы не сосредоточивали всей любви своей на одном (роде), и тем не отделялись от других. Потому и сказал (Христос):«Сотворивший вначале мужчину и женщину сотворил их»(Мф.19:4).'
      cn: '某位智者在列举了诸多福益之后，将（夫妻间的）和睦置于其中。他说：「妻与夫彼此和睦相处。」（德训篇 25:2）。同样地，在另一个地方，他也将夫妻间的同心合意列为福益之一（德训篇 25:11）。此外众所周知，并且从起初，上帝对这种结合倾注了特别的关怀，在论及两者时，祂言明其为一体：「上帝创造了男和女」（马可福音 10:6）；又说：「不分男或女」（加拉太书 3:28）。


        事实上，丈夫与丈夫之间，不能有妻子与丈夫之间那样的亲密无间，除非有人合法地与她结合。正因为如此，一位蒙福的男子，在表达其深切的爱，并哀悼一位他所爱且对他忠心耿耿之人时，他引为爱的范例的，既非父亲或母亲，也非儿女或兄弟，更非朋友——那又是谁的爱呢？他说：「你对我的爱，如同妇人的爱」（撒母耳记下 1:26）。诚然，这种爱比任何暴政都更加强烈。其他（激情）也很有力；但这种激情所拥有的力量，是永不衰竭的。在我们自身的天性中，存在着一种我们无法理解的、充满激情的引力，将这些身体（丈夫和妻子）结合在一起。


        这就是为何起初妻子源于丈夫，而此后，丈夫和妻子则都源于妻子和丈夫。你可曾注意到这结合与合一？为何（上帝）不容许另一种外来实体在此介入？你看，祂是如何安排的：祂允许人以姊妹为妻，甚至——不只是姊妹，还有女儿；不仅是女儿，而且是比女儿更亲近之物——他自身的骨肉。这一切祂都从起初就安排妥当，将他们合为一体，如同建立在磐石之上。祂并非从外部创造了妻子，以免丈夫视她为异己；但另一方面，祂也并未将婚姻的结合仅限于此，以免丈夫感到拘束与强迫时，完全与他人隔绝。


        就像植物中，那些只有一根主干却分生出许多枝条的尤为美丽；而那些枝条各自从不同的根茎随意生长出来的，则不甚美观。同样地，在这里，上帝从一个亚当繁衍出整个人类，从而使人类完全不可能分裂或隔绝。接着，为了更大的合一，祂禁止与姊妹和女儿结婚，旨在避免我们因此将所有的爱都集中于一个（家族），从而与他人隔绝。因此（基督）也曾说：「那起初造人的，是造男造女」（马太福音 19:4）。'
  - type: paragraph
    text:
      ru: 'Много от этого бывает зла, много и добра и для семейств, и для обществ. Ничто так не укрепляет нашу жизнь, как любовь мужа и жены. Ради ее многие берутся за оружие, а иные не щадят и своей жизни. Итак, не просто и не напрасно Павел выказал великую заботливость об этом деле, когда сказал:«Жены, повинуйтесь своим мужьям, как Господу». Почему? Потому что, если они единомысленны, то и дети их воспитываются хорошо, и слуги благоустроены, и соседи, и друзья, и сродники, как бы насаждаются их благовонием. Если же где бывает напротив, то там во всем беспорядок и замешательство. И как, если военачальники в мире друг с другом, то все идет, как следует, а если между ними возникнет распря, то там уже не бывает порядка, – так и здесь. Потому и говорит:«Жены, повинуйтесь своим мужьям, как Господу». Увы! А как же в другом месте сказано: если кто не оставит жены или мужа, не может следовать за Мной (Лк.14:26,Мф.10:36–37)? Если (жена) должна повиноваться (мужу), как Господу, то как же говорится, что ей должно оставить его ради Господа? И подлинно, должно. Впрочем, слово:"как"не везде означает совершенное равенство. (Апостол) или разумеет следующее:"как"знающие, что служите Господу, как и в другом месте говорит, что (они должны повиноваться) если не ради мужа, то, в особенности, ради"Господа"(Кол. 3:18); или: если повинуешься мужу, то думай, что ты повинуешься, как работающая Господу. Если противящийся даже внешним общественным властям противится«повелению Божию»(Рим. 13:2), то тем более – не повинующаяся мужу. Этого Бог требовал от начала. Итак, поставим мужа в качестве главы, а жену в качестве тела. Потом, доказывая умозаключениями, что муж есть глава жены, (апостол) говорит:«как и Христос глава Церкви, и Он же Спаситель тела. Но какЦерковьповинуется Христу, так и жены своим мужьям во всем». Сказав, что муж есть глава жены,«как и Христос глава Церкви», он затем присовокупил:«и Он же Спаситель тела», – потому что от головы зависит благосостояние тела. Таким образом, он предложил мужу и жене, как основание их счастья, взаимную любовь и заботливость, указав каждому подобающую область, – ему начальство и попечение, а ей – повиновение.'
      cn: '此中生出许多恶，也生出许多善，无论对家庭或对社会。没有什么能像夫妻之爱那样坚固我们的生活。为了它，许多人拿起武器，另一些人甚至不惜牺牲自己的生命。因此，保罗在此事上表现出极大的关切并非毫无缘由，也并非徒然，因为他说：「妻子们，要顺服自己的丈夫，如同顺服主。」为什么呢？因为如果他们同心合意，他们的孩子就能得到良好教养，仆役也能得到妥善安排，邻里、朋友和亲戚，也仿佛因他们的芳香而被栽种。反之，若在任何地方出现相反的情况，那里就一切混乱和迷惘。正如，如果将帅们彼此和睦，一切便井然有序；反之，若他们之间发生纷争，便再无秩序可言——此情况亦是如此。因此他又说：「妻子们，要顺服自己的丈夫，如同顺服主。」


        哎！那么在别处又怎么说：「人若不撇下自己的妻子或丈夫，就不能作我的门徒」（路加福音 14:26，马太福音 10:36-37）呢？如果（妻子）应该顺服（丈夫），如同顺服主，那么又怎么说她应该为了主而撇下丈夫呢？而且，确实应该如此。然而，「如同」一词并非处处都意味着完全的平等。（使徒）或许是这样理解的：「如同」是说，知道自己是在服侍主，如同在别处所说，（她们应该顺服）如果不是为了丈夫，那么尤其要为了「主」（歌罗西书 3:18）；或者说：如果你顺服丈夫，就当思想你是在顺服，如同为主做工。如果连抵挡世俗公权的人都是抵挡「上帝的命令」（罗马书 13:2），那么不顺服丈夫的人就更是如此了。这是上帝从起初就要求的。因此，我们将丈夫视为头，妻子视为身体。然后，（使徒）通过推理证明丈夫是妻子的头，他说：「正如基督是教会的头，祂又是这身体的救主。但如同教会顺服基督，妻子也要在凡事上顺服自己的丈夫。」说了丈夫是妻子的头，「正如基督是教会的头」之后，他又补充说：「祂又是这身体的救主」——因为身体的康泰取决于头。这样，他为丈夫和妻子提出了彼此的爱和关怀，作为他们幸福的基础，并指明了各人应有的领域——丈夫是领导和照顾，而妻子是顺服。'
