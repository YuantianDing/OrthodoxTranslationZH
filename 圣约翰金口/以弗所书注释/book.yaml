      cn: 知道每个人都将从上主那里，按照他所行的善得到，无论是奴仆，是自由人。
  - type: paragraph
    text:
      ru: Об обязанностях слуг. – Разделение на господ и рабов произошло вследствие греха. – Греховные деяния в Писании называются иногда миром. – Богатство и почести составляют оружие дьявола.
      cn: '论仆役之职责。

        主人与奴仆之划分，乃因着罪而发生。

        罪恶行径于圣经中，有时被称为世界。

        财富与尊荣，构成魔鬼之武器。'
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Итак, не муж только, не жена, не дети, но и слуги со своими добродетелями входят в состав дома и обусловливают его благоустройство. Поэтому блаженный Павел и этой части не оставил без внимания, но напоследок приступает к ней, так как и по достоинству она занимает последнее место. И с ними (рабами) много рассуждает он, и уже не как с детьми, но гораздо возвышеннее. Он не дает им здесь обетования, а указывает на последствия:"зная, – говорит он, –что каждый получит от Господа по мере добра, которое он сделал». Учит даже любомудрствовать, потому что хотя они по достоинству ниже детей, но смысла имеют больше их."Рабы, – говорит он, –повинуйтесь господам своим по плоти». Тотчас ободрил опечаленную душу, тотчас утешил ее. Не скорби, как бы так он говорит, что твоя доля ниже положения жены и детей: это рабство только по имени, и господство по плоти, следовательно, господство временное и непродолжительное, потому что все плотское скоропреходяще.«Со страхом, – говорит, –и трепетом». Видишь ли, что неодинакового страха требует от жены и от рабов. Там просто сказал:«жена да боится своего мужа»(Еф.5:33), а здесь, усиливая речь, говорит:«со страхом и трепетом, в простоте сердца вашего, как Христу». Часто он повторяет это. Но что говоришь ты, блаженный Павел? Он (раб) – брат (своему господину); он получил одинаковые с ним блага, одинаковое тело, а что всего важнее – сделался братом не только своего господина, но самого Сына Божьего, наслаждается равными с ним благами, и ты говоришь:«повинуйтесь господам своим по плоти со страхом и трепетом»? Но поэтому-то я и говорю так, отвечает (апостол). Если свободным повелеваю подчиняться друг другу ради страха Божьего, как выше сказано:«повинуясь друг другу в страхе Божьем»(Еф.5:21), если жене приказываю бояться своего мужа, хотя она имеет равную с ним честь, то тем более слуге. В этом нет бесчестия, напротив, это высокое благородство – уметь уничижаться, вести себя скромно, уступать ближнему. И свободные служили свободным с большим страхом и трепетом.«В простоте сердца», – говорит. Хорошо сказано, так как можно служить со страхом и трепетом, однако ж, не с добрым расположением, но кое-как. Есть много таких, которые втайне весьма много делают зла господам своим. Такое-то худое поведение (апостол) и старается устранить, говоря:«в простоте сердца вашего, как Христу, не с видимой только услужливостью, как человекоугодники, но как рабы Христовы, исполняя волю Божию от души, служа с усердием, как Господу, а не как человекам». Видишь ли, как много требовал (Павел), когда внушал добро словами: «с благоразумиеми от души"?'
      cn: '所以，不仅是丈夫、妻子、儿女，还有带着他们的美德的仆役，构成了家庭的一部分，并决定着它的安康。因此，蒙福的保罗对这部分人也没有忽视，而是在最后才论及他们，因为按其身份，他们也的确居于末位。他与他们（仆人）进行了许多论述，不再是像对儿女那样，而是更加高尚。他在这里没有赐予他们应许，而是指出了后果：「知道，」他说，「各人所行的善，都必从主那里得着。」他甚至教导他们去爱慕智慧，因为虽然他们身份低于儿女，但在心智上却比他们更有悟性。「你们这些仆役，」他说，「要顺从你们肉身的主人。」他立刻鼓舞了那忧伤的灵魂，立刻安慰了它。「不要悲伤，」他似乎在说，「因为你的地位低于妻子和儿女：这只是名义上的奴役，也是肉身的主宰，因此，这是一种暂时的、不长久的主宰，因为所有属肉体的事物都转瞬即逝。」


        「存着恐惧，」他说，「与战兢。」你是否看到，他对妻子和仆役所要求的恐惧是不同的。在那里他只是说：「妻子当敬畏自己的丈夫」（以弗所书 5:33），而在这里，他加强了语气，说：「存着恐惧和战兢，用诚实的心，如同服事基督。」他常常重复这一点。但是，蒙福的保罗，你说了什么？他（仆人）是他（主人）的弟兄；他与他得了相同的恩惠，相同的身体，而最重要的是，他不仅成了他主人的弟兄，更是上帝之子的弟兄，享有与他同等的恩惠，你却说：「要存着恐惧和战兢，顺从你们肉身的主人」？「正因为如此，我才这样说，」使徒回答道。如果我命令自由人因敬畏上帝而彼此顺服，正如前面所说：「存敬畏上帝的心，彼此顺服」（以弗所书 5:21），如果我吩咐妻子敬畏她的丈夫，即使她与他享有同等的尊荣，那么对于仆役，就更当如此了。这其中没有羞辱，相反，这是一种崇高的美德——懂得谦卑，行为谨慎，顺从邻人。甚至自由人也曾怀着更大的恐惧和战兢服事自由人。


        「用诚实的心，」他说。说得好，因为人可以存着恐惧和战兢服事，然而却不是带着良善的心意，而是敷衍了事。有许多这样的人，他们暗中对自己的主人做出了许多恶事。使徒正是要消除这种恶劣行为，他说：「用你们诚实的心，如同服事基督，不只是在外表上的顺从，如同讨人喜欢的人，而是作为基督的仆役，从灵魂深处遵行上帝的旨意，殷勤服事，如同服事主，而不是服事人。」你看，保罗要求了多少，当他用「带着明智并从灵魂深处」这些话语劝勉行善时？'
  - type: paragraph
    text:
      ru: 'Мы видим, что многие служат своим господам«со страхом и трепетом», и к этому много побуждает строгость господина. Но покажи, говорит он, что ты служишь как раб Христов, а не как раб человека; сделай так, чтобы (твои служебные занятия) были у тебя добродетелью, а не следствием необходимости. Как того, кто терпит обиды от другого, (Христос) убеждает и научает, как увидим ниже, принимать обиду, как благо для себя, и терпеть ее по собственному изволению, точно так же и рабов (учит апостол). Ударивший в ланиту решился на такой поступок не по мыслям того, кого он ударил, а по собственной злобе, – и, однако ж, что сказано?«Обрати к нему и другую»(Мф. 5:39), чтобы ты мог показать, что и первая не против воли тобой подставлена. Решившийся потерпеть лишний раз удар, обратил и то, что было не его делом, в свое дело, когда дал поразить и другую ланиту, а не ограничился одним перенесением обиды: последнее, пожалуй, можно счесть за следствие страха, но в первом много любомудрия. Итак, ты показал бы (тогда), что перенес это ради любомудрия. Так и теперь, ты покажи в свою очередь, что несешь это рабство добровольно, а не как человекоугодник. Человекоугодник – не раб Христов, и раб Христов – не человекоугодник. Кто в самом деле, будучи рабом Божьим, захочет угождать людям? Напротив, кто, угождая людям, может быть рабом Божьим?"От души, – говорит, –служа с усердием». Хорошо это сказано, так как можно служить в простоте и без злобы, однако ж, не всеми силами, а только выполняя долг. Поэтому говорит: по усердию, а не по необходимости, по доброй воле, а не по принуждению. Если будешь служить, таким образом, именно: по доброй воле, с благоразумием, от души, ради Христа, – то ты не раб. Такое рабство несет и Павел, человек свободный, когда, взывая, говорит:«Ибо мы не себя проповедуем, но Христа Иисуса, Господа; а мы – рабы ваши для Иисуса»(2Кор.4:5).'
      cn: 我们看到许多人「存着恐惧与战兢」地事奉他们的主人，主人的严厉也大大地促成了这一点。但祂说，你要表明你是作基督的仆人来事奉，而不是作人的仆人；要使（你的服事）成为你的美德，而非出于必然。基督劝说并教导那受人侮辱的（正如我们下文将看到的），要将侮辱视为于己有益之事，并出于自己的意愿忍受侮辱，使徒也同样教导仆人。打你脸颊之人，作出此举并非出于被打者的意愿，而是出于他自己的恶意，然而，经上怎么说？「连另一边也转给他」（马太福音 5:39），好叫你表明，连第一个耳光也不是你违心而献上的。那决心再受一次打击的人，当他让另一边脸颊也被击打时，就把那不关他事的事，也变成了他自己的事，而不限于仅仅承受侮辱：后者，也许可以被视为出于恐惧的结果，但前者则充满了爱智。这样，你就会（那时）表明，你承受这一切是为了爱智。同样，现在你也要表明，你是甘心乐意地承受这奴役，而不是作为取悦于人者。取悦于人者不是基督的仆人，基督的仆人也不是取悦于人者。实际上，谁身为上帝的仆人，会愿意取悦于人呢？反之，谁取悦于人，又能成为上帝的仆人呢？祂说：「从心里殷勤地事奉」。这话说得真好，因为人可以以单纯无邪的心事奉，然而却并非竭尽全力，而只是尽本分而已。因此他说：出于殷勤，而非出于必然；出于甘心，而非出于强迫。如果你如此事奉，即：出于甘心、怀着明智、从心里、为了基督，那么你就不是奴仆。这种奴役，自由人保罗也承受着，当他呼喊着说：「我们原不是传自己，乃是传基督耶稣为主；并且我们自己，因耶稣的缘故，作你们的仆人」（哥林多后书 4:5）。
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Видишь ли, как у твоего рабства отнимается бесчестие? Подобно тому, как если бы какой-нибудь человек, после того, как у него отняты деньги, прибавил бы еще от себя своему похитителю, не может почитаться обнищавшим, но достаточным, не может быть причислен к потерпевшим зло, но к делающим добро, и таким благодеянием он покрыл бы (своего грабителя) еще большим позором, нежели какой он навлек на себя своим грабительством, – так точно и в настоящем случае: если раб в самых изнурительных трудах ведет себя великодушно, показывая, что он не чувствует насилия, то от этого больший стыд для его господина. Итак, будем служить господам ради Христа."Зная, – говорит (апостол), –что каждый получит от Господа по мере добра, которое он сделал, раб ли, или свободный». Так как, вероятно, между господами было много неверующих, которым этот стыд был неизвестен, и которые потому не воздавали своим слугам за послушание, то вот (апостол) утешает рабов, чтобы они не отчаивались в воздаянии, но ободряли себя (ожиданием высшей) награды. Как люди облагодетельствованные, и не воздающие благодарности своим благодетелям, тем самым обязывают воздавать им за себя самого Бога, так точно и господа, пользующиеся твоими услугами, если не награждают тебя, то тем самым доставляют тебе большую награду, делая должником твоим Бога.«И вы, господа, – говорит, –поступайте с ними так же»(Еф.6:9). Что такое –"так же"? Благосклонно служите. Хотя (апостол) не сказал: «Служите», но словом:"так же"он выразил эту мысль, потому что и господин служит.«Не как человекоугодники, – говорит, –...со страхом и трепетом», т. е. со страхом Божьим, опасаясь, как бы когда-нибудь Он не осудил нас за нерадение о рабах.«Умеряя строгость».  Не будьте, говорит, жестокими и строптивыми.«зная, что и над вами самими и над ними есть на небесах Господь»(Еф.6:9). Увы! Какой намек! Как сильно устрашил! Т. е.: «Какой мерой меришь, отмерится и тебе». Чтобы тебе не услышать:«злой раб! весь долг тот я простил тебе»(Мф.18:32).«У Которого нет лицеприятия»(Еф.6:9). Не подумай, говорит, что за обиду, причиняемую рабу, (Бог) простит потому, что она причинена рабу. Внешние законы, как законы человеческие, допускают еще различие по происхождению, но закон общего Владыки не знает никакого различия, так как благодетельствует всем вообще и наделяет всех одним и тем же.'
      cn: '你可看到你的奴役身份是如何被除去羞辱的吗？这就像：若有人钱财被夺走后，还从自己这里加添给那劫掠他的人，他不能被视为贫困，而是富足的；不能被归为受害者，而是行善者；并且借着这样的善行，他会使（他的抢劫者）蒙受更大的羞辱，甚至超过那抢劫者因抢劫而自招的羞辱——如今的情形也正是如此：若奴仆在最劳累的苦役中举止宽宏大量，显明他并未感受到强迫，那么，这反倒会使他的主人感到更大的羞耻。所以，让我们为基督的缘故服侍主人。（使徒）说：「因为知道，每个人，无论是奴仆，是自由人，都会从上主那里，按照他所行的善得到赏赐。」既然主人中可能有许多不信者，他们对这份羞耻一无所知，因此也不为奴仆的顺服而报答他们，所以（使徒）就此安慰奴仆们，使他们不致对回报感到绝望，反而因（期待那更高的）奖赏而振作起来。正如那些蒙受恩惠却不向其施恩者表示感谢的人，这反倒迫使上帝亲自为他们偿还恩惠；同样，你的主人若享受你的服侍却不奖赏你，那么，这反倒会为你带来更大的奖赏，使上帝成为你的债主。


        「你们作主人的，也要这样待他们，」（以弗所书 6:9）


        「这样」是什么意思？要仁慈地服侍。尽管（使徒）没有说：「你们要服侍」，但他用「这样」这个词表达了此意，因为主人也是在服侍。（使徒）说：「不是为了取悦于人……要存着恐惧战兢的心」，也就是对上帝的敬畏，担心祂将来会因我们对奴仆的疏忽而定我们的罪。「收敛威吓。」（使徒）说：「不要严酷和固执。」「因为知道，你们和他们都有一位上主在天上」（以弗所书 6:9）。唉！多么含蓄的提示！多么强烈的警诫啊！也就是说：「你用什么量器量给人，也必用什么量器量给你。」免得你听到：「你这恶仆！我已免了你全部的债」（马太福音 18:32）。「祂不偏待人」（以弗所书 6:9）。（使徒）说，不要以为上帝会因为伤害是施加在奴仆身上而赦免这种伤害。世俗的律法，作为人的律法，或许还允许根据出身而有所区别，但那位共同的主宰（上主）的律法，却不容许任何区别，因为祂普施恩惠于所有人，并赋予所有人同样的事物。'
  - type: paragraph
    text:
      ru: 'А если кто станет спрашивать: откуда же рабство, и зачем оно явилось в жизни человеческой, – как многие, я знаю, с любопытством спрашивают об этом, и желают знать это, – то я вам скажу: от любостяжания произошло рабство, а также от зависти, от ненасытной алчности. Ной не имел рабов, ни Авель, ни Сиф, ни другие после них. Это состояние произвел грех, состоящий в неуважении к родителям. Пусть знают дети, что они достойны быть рабами за непочтение к родителям! (Кто не почитает своих родителей) тот лишается своего благородства, потому что презирающий отца своего более уже не сын его. Если же презирающий (земного) родителя уже перестает быть его сыном, то как останется сыном Отца нашего (небесного) тот, кто Его презирает? Он исключен из благородного сословия, он оскорбил свою природу. Потом (к появлениею рабского состояния) способствовали войны, сражения, где стали брать пленных. Но, скажут, и Авраам имел рабов? Да, имел; но известно, что он обращался с ними не так, как с рабами. Так (апостол) все направляет к главе: жену, чтобы муж, как сказано, любил ее, – детей, чтобы воспитывал их«в учении и наставлении Господнем»(Еф.6:4), – рабов,«зная, что и над вами самими и над ними есть на небесах Господь». Этим как бы так говорит: так как и сами вы тоже рабы, то будьте человеколюбивы и снисходительны. Далее, если вам угодно будет выслушать, мы и о слугах скажем то же самое, что прежде сказали о детях: учите их быть благоговейными, и они сделаются такими. Но ныне иной, отправляясь в театр или идя в баню, тащит с собою туда же и всех детей, а вцерковьне берет их, – не заставляет их ходить туда, чтоб слушать христианское учение. Как же раб услышит, когда ты, господин, прислушиваешься совсем к другому? Ты приобрел, купил раба? Приказывай ему прежде всего жить по воле Божьей, чтобы он был кроток в отношении к своим товарищам, чтобы особенно заботился о добродетели. Дом каждого есть как бы город, и каждый хозяин есть начальник над собственным домом. Что действительно так, это хорошо видно при взгляде на дом людей богатых, где есть и поля, и управители, и начальники над начальниками. Впрочем, и дом бедного я уподобляю также городу. И здесь есть власти, именно: муж управляет женой, жена – слугами, слуги – своими женами, а мужья и жены – своими детьми. Итак, не представляется ли тебе, что (глава семейства) есть как бы некий царь, у которого находится в подчинении столько начальников? И не следует ли ему быть всех искуснее и опытнее в управлении домом? Кто отлично сведущ в этом деле, тот сумеет выбрать для себя способных начальников, и точно – выберет блистательных. А жена все-таки останется другим царем в доме, хотя без диадемы, и кто умеет избирать этого царя, тот и остальное все хорошо устроит.«Наконец, братия мои, укрепляйтесь Господом»(Еф.6:10). (Апостол) когда намеревается окончить речь, всегда употребляет это выражение.'
      cn: '若有人问：奴役从何而来，为何出现在人类生活中——我知道许多人对此好奇，并渴望了解——那么我告诉你们：奴役源于贪求，也源于嫉妒，源于永不满足的贪欲。挪亚没有奴仆，亚伯没有，塞特也没有，他们之后的人也没有。这种境况是由不敬双亲的罪恶所产生的。愿孩子们知道，他们因不孝父母而理当成为奴仆！（不敬爱自己父母的人）便丧失其高贵品德，因为藐视自己父亲的人，就已不再是他的儿子了。若连藐视（地上的）父母的人都不再是其子女，那么藐视我们（在天）之父的人，又怎能仍是祂的儿子呢？他被逐出高贵阶层，他侮辱了自己的本性。之后，战争和搏斗也促成了（奴役状态的出现），在其中人们开始抓取俘虏。但有人会说，亚伯拉罕也有奴仆吗？是的，他有；但众所周知，他待他们不似奴仆。故此，（使徒）将一切都归结于首领：妻子，丈夫当爱她，如经上所言；子女，当「用上主的教训和训诫」养育他们（以弗所书 6:4）；奴仆，「知道你们和他们都有在天上的上主」。这仿佛在说：既然你们自己也是奴仆，就当仁爱且宽容。


        其次，如果你们愿意听，我们也要对仆人说同样的话，就像我们之前对孩子们所说的：教导他们要敬虔，他们就会变得如此。但如今，有些人去剧院或澡堂时，会把所有的孩子都带上，却不带他们去教会，不强迫他们去那里聆听基督信仰的教义。当你这主人倾听的却是全然不同的事物时，奴仆又怎会聆听呢？你获得了，买下了奴仆？首先要命令他按照上帝的旨意生活，使他对同伴温和，尤其要注重美德。


        每个人的家都仿佛一座城，每个主人都是自己家中的官长。事实确是如此，这一点从富人家庭中可见一斑，那里有田地，有管家，还有官长之上的官长。此外，我也将穷人的家比作城市。这里也有掌权者：丈夫管理妻子，妻子管理仆人，仆人管理自己的妻子，而丈夫和妻子则管理他们的孩子。那么，你难道不认为（一家之主）仿佛是某位君王，手下管辖着如此众多的官长吗？他难道不应当在治理家务方面比所有人都更有技巧和经验吗？谁若精通此道，便能为自己选拔有能力的官长，且确实能选出杰出的人才。而妻子，虽无冠冕，却依然是家中另一位君王，谁若善于选择这位君王，谁就能把其余的一切也都安排得妥善。


        「末了，我的弟兄们，你们要在上主里刚强」（以弗所书 6:10）。（使徒）每当要结束讲话时，总是使用这个表达。'
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Не хорошо ли я сказал в начале, что дом каждого есть целое войско? Кто поставил всех начальников, тот же в свою очередь вооружает их и ведет на войну. Если никто не похищает власти у другого, а каждый остается на своем месте, тогда все будет в хорошем состоянии.«Укрепляйтесь, – говорит, –Господом и могуществом силы Его», т. е. в надежде на Него, через Его помощь. Так как он повелел многое и при том должное, то и говорит: не бойтесь, возложите надежду на Господа, и Он все облегчит для вас.«Облекитесь во всеоружие Божие, чтобы вам можно было стать против козней дьявольских»(Еф.6:11). Не сказал: против сражений, против войн, но:«против козней». Враг наш не просто и не открыто воюет с нами, но с коварством. Что такое – козни (μεδοδεία)? Строить козни (μεδοδεϋσαι) значит обольстить и одолеть хитростью: это бывает и в искусствах, и в словах, и в делах, и в борьбе, когда нам случается иметь дела с обманщиками. Скажу для примера: (враг) никогда не предлагает явных грехов, не называет идолослужения, но, по своему коварству, устраивает это иначе, именно: пользуется предлогами, выставляет уважительную причину. Итак, (апостол) уже и этим ободрил воинов и заставил их трезвиться, когда научил и убедил, что у нас борьба с врагом опытным в воинских делах, что эта война против нас производится не просто и не открыто, но с великой хитростью. Сначала указанием на свойства и многочисленность врага – он побуждает учеников своих к осторожности. Он хочет не ослабить воинов, которые противостоят врагу (дьяволу), но ободрить их и подвинуть их против него. Сказав об ухищрениях врага, этим он научает трезвенности. Если бы он указал им только на силу врагов и на этом и остановился, то привел бы их в уныние. Напротив, он и прежде и после этого показывает, что возможно одолеть врага, и тем самым особенно ободряет их. Чем более мы разъясняем своим сообщникам силу наших неприятелей, тем более побуждаем их к осторожности.«Потому что наша брань, – говорит, –не против крови и плоти, но против начальств, против властей, против мироправителей тьмы века сего, против духов злобы поднебесных»(Еф.6:12). Представив им побуждение к особенной бдительности от свойства брани, потом внушает им бодрость указанием предстоящих подвигов. Каким образом? Сказав, что враги сильны, он навел на мысль, что и многого мы от них лишаемся. Чего же? Борьба происходит в поднебесной, и не из-за денег, не из-за славы, но из-за пленения в рабство. Стало быть, вражда становится непримиримой. Соперничество и борьба бывают сильнее, когда они происходят из-за предметов важных. В поднебесной (έν τοΐς έπουρανίοις) – это то же, что за (υπέρ) небесное. (Враги наши воюют с нами) не для того, чтобы, после победы, чем-нибудь воспользоваться, но для того, чтобы нас лишить (неба). Так, если бы кто-нибудь сказал:ή συνδήχη εvτινι χει(договор заключается в чем-нибудь), то здесь:έν(в) соответствовало бы:υπέρ(за) илиδιά(для). Заметь, какую бдительность возбуждает в нас сила врага, и какая трезвенность происходит от того, что мы узнаем, что действительная опасность предстоит нашему великому благу, и что также мы должны заботиться о победе из-за великого блага, – потому что враг наш старается свергнуть нас с неба. Кого это называет (Павел)«против начальств, против властей, против мироправителей тьмы века сего»? И какой тьмы? Не ночной ли? Нет, – греховной. Мы были, говорит он, некогда тьмой, – называя так грех в настоящей жизни, потому что он уже больше не будет иметь места ни на небе, ни в грядущем веке.'
      cn: '我在开头说，每个人的家都是一支完整的军队，难道说得不好吗？设立所有首领的，也依次武装他们，带领他们上战场。如果没有人窃取他人的权柄，每个人都坚守自己的岗位，那么一切都将井然有序。「你们要靠着上主，倚赖祂力量的权能，得以刚强。」意思是，要仰望祂，借着祂的帮助。既然他命令了许多且是当行的事，所以说：不要惧怕，将希望寄托于上主，祂必为你们减轻一切。


        「要穿戴上帝的全副军装，使你们能抵挡魔鬼的诡计。」（以弗所书 6:11）他没有说：抵挡战役，抵挡战争，而是说：「抵挡诡计。」我们的仇敌并非简单公开地与我们争战，而是以诡诈。什么是诡计（μεθοδεία）？设下诡计（μεθοδεϋσαι）意味着以狡诈诱惑并战胜：这发生在技艺中，言语中，行动中，以及争斗中，当我们不得不与欺骗者打交道时。举例来说：（仇敌）从不提供明显的罪，不称呼偶像崇拜，而是凭借其狡猾，以另一种方式安排，即：利用借口，提出一个貌似正当的理由。因此，（使徒）通过这一点，已经鼓励了战士们，并使他们保持警醒，因为他教导并确信我们是在与一个在军事事务上有经验的仇敌搏斗，这场针对我们的战争并非简单公开地进行，而是以极大的狡猾。


        首先，通过指出仇敌的性质和众多，他促使他的门徒保持谨慎。他不想削弱那些对抗仇敌（魔鬼）的战士，而是要鼓励他们，推动他们对抗他。通过讲述仇敌的诡计，他以此教导警醒。如果他只向他们指出仇敌的力量并就此打住，那就会使他们灰心丧志。相反，他在这之前和之后都表明，战胜仇敌是可能的，从而特别鼓励他们。我们越是向同伴阐明我们敌人的力量，就越能促使他们保持谨慎。


        「因为我们争战的对象，不是属血肉的，而是对抗执政的，对抗掌权的，对抗这现世黑暗的世界统治者，对抗天上恶魔的。」（以弗所书 6:12）在向他们呈现了因争战性质而生的特别警惕的动机之后，他接着通过指出即将到来的功绩来激励他们。如何呢？他说仇敌强大，这使人想到我们也因此失去了许多。失去了什么呢？这争斗发生在天上，不是为了金钱，不是为了荣耀，而是为了被掳掠为奴。于是，仇恨变得不可调和。当竞争和争斗是为了重要的事物而发生时，它们会变得更加激烈。在天上（έν τοΐς έπουρανίοις）——这与为了（υπέρ）天上的，是同一个意思。（我们的仇敌与我们作战）不是为了在胜利后得到什么好处，而是为了剥夺我们（的天国）。就像有人说：ή συνδήχη εvτινι χει（协议是在某事中达成），那么这里的：έν（在）就相当于：υπέρ（为了）或 διά（为了）。请注意，仇敌的力量在我们心中激发出何等的警惕，当我们得知我们的巨大福祉面临着真正的危险，并且我们也必须为这巨大福祉而努力争取胜利时，会产生何等的警醒——因为我们的仇敌正试图将我们从天国推下。


        保罗称「对抗执政的，对抗掌权的，对抗这现世黑暗的世界统治者」是指谁呢？又是指哪种黑暗呢？不是指黑夜吗？不，是指罪恶的黑暗。他说，我们曾一度是黑暗——他如此称呼今生中的罪，因为这罪在天上和未来的世代都将不再存在。'
  - type: paragraph
    text:
      ru: 'Миродержителями же называет (дьяволов) не потому, чтобы они держали мир, но потому, что они настоящие виновники злых дел. Греховные дела Писание обыкновенно называет миром, например, в изречении Христа:«потому чтовыне от мира, как и Я не от мира»(Иоан. 17:14). Разве, в самом деле, (апостолы) были не от мира? Не были ли они облечены плотью? Не принадлежали ли к находящимся в мире? И в другом месте:«мир... Меня ненавидит, а вас не может ненавидеть»(Ин.7:7): и здесь также миром называет злые действия. Или, быть может, здесь под миром он разумеет самих злых людей, потому что демоны на них преимущественно простирают власть свою.«Против начальств, против властей, – говорит, –против духов злобы поднебесных»."Началами"и"властями"называет их, по подобно того, как и между небесными (духами) есть престолы, господства, начала, власти.«Для сего приимите всеоружие Божие, дабы вы могли противостать в день злой и, все преодолев, устоять»(Еф.6:13). Днем лютым и этим лукавым веком называет настоящую жизнь, по причине зол, в ней бывающих, и требующих, чтобы мы постоянно были вооружены."И, все, – говорит, –преодолев", – т. е. победив и страсти, и непристойные пожелания, и все, что причиняет нам зло. Не просто употребил:έργάοασδαι(делать), но:χατεργάααβеαι(содевать, совершенно сделать, покончить), так чтобы не только одолеть, но и одолевши стоять; а то случалось, что многие, одержавши победу, тотчас падали."все, – говорит, –преодолев", а не так, чтобы одно что-нибудь исполнить, а другого нет. При том после победы потребна бодрость; иначе то, что тебе удалось низложить, снова может подняться. Если мы не стоим, восстает то, что нами низложено. Когда же мы стоим, то оно не поднимается от падения. Пока мы бодрствуем, побежденный нами враг не воскресает.«Примите всеоружие Божие».'
      cn: 将（魔鬼）称为「世界的统治者」，并非因为他们掌管世界，而是因为他们是恶行的真正肇事者。圣经通常将罪恶的行为称为「世界」，例如基督的言论：「因为你们不属世界，正如我也不属世界」（约翰福音 17:14）。难道，（使徒们）真的不属世界吗？难道他们不是披戴着肉身吗？难道他们不属于这世上的人吗？又在另一处：「世界……恨我，却不能恨你们」（约翰福音 7:7）：此处也同样将「世界」称为邪恶的行为。或者，或许此处他所指的「世界」是邪恶的人本身，因为魔鬼主要是在他们身上施展其权柄。「他说：『对抗执政的，对抗掌权的，对抗空中属灵气的恶魔』。」他称他们为「执政的」和「掌权的」，正如在天上的（灵）中也有宝座、主权、执政的和掌权的。「所以要拿起上帝的全副军装，使你们在邪恶的日子得以抵挡，并且成就了一切，还能站立得稳」（以弗所书 6:13）。他将此「邪恶的日子」和这「狡诈的世代」称为今生，因其中所发生的邪恶，这些邪恶要求我们时刻武装自己。他说：「并且成就了一切」，即是说，战胜了情欲、不合宜的私欲，以及一切对我们造成伤害的事物。他并非简单地使用了：έργάοασδαι（做），而是使用了：χατεργάααβеαι（成就，彻底完成，了结），如此一来，不仅要战胜，而且战胜之后仍要站立得稳；因为曾有许多人，在取得胜利之后立刻跌倒。他说：「成就了一切」，而非只做成其中一件事而另一件却没有。此外，胜利之后仍需保持警醒；否则，你所成功击败的，可能再次崛起。如果我们不能站立得稳，我们所击败的就会重新站起来。而当我们站立得稳时，它就不会从跌倒中再起来。只要我们保持警醒，我们所战胜的仇敌就不会复活。「拿起上帝的全副军装。」
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Видишь ли, как (апостол) отогнал страх? Если есть возможность одержать победу и стать, то зачем избегаешь борьбы? Стой бодро, по окончании борьбы, и ты – победитель. Не удивляйся и тому, что так много сказано о силе врагов. Знание об этом должно производить не страх и робость, но может предохранять от беспечности.«Дабы вы могли, – говорит, –противостать в день злой», – напоминанием о времени побуждает (к бодрствованию). Непродолжительно время, как бы так говорит, а потому надобно стоять бодро во время брани; не должно ослабевать и после победы. В самом деле, если у нас идет война; если против нас составляются такие ополчения; если они состоят из бесплотных начал и миродержителей и духов злобы, – то, скажи мне, как можно предаваться неге? Как можно быть рассеянным? Можно ли победить, не будучи вооруженным? Пусть каждый размышляет об этом всякий день, когда им овладевает гнев, одолевает похоть, когда он пожелает этой изнеженной и беспорядочной жизни. Пусть каждый внимает словам блаженного Павла:«наша брань не против крови и плоти, но против начальств, против властей». Эта война тяжелее войны с врагами видимыми; это борьба чрезвычайно сильная. Подумай, сколько времени он (дьявол) ведет свою борьбу, из-за чего он бьется, – веди себя осторожнее. Так, говорят; но надобно бы было изгнать дьявола из среды себя, и тогда бы все спасались. Это говорят, конечно, какие-нибудь нерадивые, старающиеся отыскать извинение своему нерадению. Тебе, человек, следует быть благодарным за то, что можешь, если захочешь, одолеть такого врага; а ты, напротив, еще досадуешь и говоришь слова, свойственные какому-нибудь беспечному и сонливому воину. Ты, впрочем, если захочешь, можешь понять и причины, почему ты так поступаешь. Но будь осторожен, ограждай себя со всех сторон: не с одним дьяволом у нас брань, но и с его силами. Как же, говорят еще, мы будем бороться со тьмой, – мы, которые сделались светом? Как нам сражаться со злыми духами, когда мы сделались благими? Злоба противоположна добру, и свет отгоняет тьму; если же мы сами стали тьмой, то мы совершенно будем побеждены. Итак, каким же образом мы победим их? Если мы постараемся быть по произволению тем, что они – по природе, т. е., если мы постараемся стать выше плоти и крови; таким образом, мы одолеем их. Так как они (ефесяне), вероятно, гонимы были многими, то не думайте, как бы так говорил (Павел), чтобы те сами по себе воевали против нас. В них действуют демоны: они-то ведут войну, и с ними у нас брань. Всем сказанным производит двоякое действие: и делает их более смелыми в отношении к воюющим на них, и ободряет их дух против врагов. И почему у нас происходит брань с ними? Потому, что мы имеем непобедимого союзника – благодать Духа; потому что мы научены такому искусству, что можем ратоборствовать не с людьми только, но и с демонами.'
      cn: 你看，（使徒）是如何驱散恐惧的？如果有可能取得胜利并站稳脚跟，你为何要逃避争战呢？警醒站立，待争战结束后，你就是胜利者了。对于仇敌的力量有如此多的论述，你也不要感到惊奇。对此的认知不应产生恐惧和怯懦，反而能够使人免于懈怠。「使你们能够，——他说，——在邪恶的日子抵挡仇敌。」——以对时间的提醒来催促（人警醒）。时间不长久，仿佛是在说，因此在争战之时必须警醒站立；胜利之后也不应松懈。事实上，如果我们正在进行一场战争；如果对抗我们的军队正如此集结；如果它们是由无形的执政者、管辖这世界的和那恶灵组成，——那么，告诉我，怎能沉溺于安逸享乐呢？怎能心不在焉呢？没有武装，怎能得胜呢？愿每个人每天都思考此事，当他被愤怒掌控，被情欲胜过之时，当他渴望这种放纵而无序的生活之时。愿每个人都留心蒙福的保罗的话：「我们的争战不是对抗血肉之躯，而是对抗执政的，对抗掌权的。」这场战争比与可见的仇敌作战更为艰巨；这是一场极其强大的争战。想一想，他（魔鬼）争战了多久，他为何而战，——你就当更加谨慎行事。有人说，是这样；但本应将魔鬼从我们中间驱逐出去，那样所有人就都会得救了。这话当然是一些懒惰的人说的，他们试图为自己的懒惰寻找借口。你啊，人哪，应当为此感恩，就是你若愿意，就能战胜这样的仇敌；你反而还在恼怒，说出一些懈怠困倦的士兵才会说的话。不过，你若愿意，也能明白你为何如此行事的原因。但要谨慎，四面八方地守护自己：我们的争战不单是与魔鬼，也是与它的势力。那么，他们又说，我们怎能与黑暗争战呢？——我们这些已成为光的人？当我们已成为良善的，我们怎能与恶灵争战呢？邪恶与良善相对立，光驱散黑暗；如果我们自己成了黑暗，我们就会完全被击败。那么，我们究竟要如何战胜它们呢？如果我们努力凭着意志成为它们凭着本性所是的那样，也就是说，如果我们努力超越血肉之躯；通过这种方式，我们就能战胜它们。因为他们（以弗所人）可能受到许多人的逼迫，所以不要认为，仿佛（保罗）是在说，那些人是凭着自己与我们争战的。是魔鬼在他们里面作祟：是它们在进行战争，我们与它们争战。所有这些话产生了双重作用：使他们在面对那些攻击他们的人时更加勇敢，并鼓舞他们对抗仇敌的精神。我们为何与它们争战呢？因为我们拥有不可战胜的盟友——圣灵的恩典；因为我们被教导了这样的技巧，使我们不仅能与人争斗，也能与魔鬼争斗。
  - type: paragraph
    text:
      ru: 'Впрочем, если мы захотим, то можем и не бороться: брань поскольку брань, поскольку мы ее хотим. Такова именно сила живущего в нас (Св. Духа), согласно словам:«се, даю вам власть наступать на змей и скорпионов и на всю силу вражью»(Лк. 10:19). Он дал нам всякую власть и бороться и не бороться. Но так как мы ленивы, то и боремся с ними? А что Павел не боролся, об этом послушай его собственных слов:«Кто отлучит нас от любви Божией: скорбь, или теснота, или гонение, или голод, или нагота, или опасность, или меч?»(Рим. 8:35)? И в другом месте, слушай, что он говорит:«Бог ...сокрушит сатану под ноги ваши скоро»(Рим. 16:20). Он имел власть (над сатаной), потому и сказал:«именем Иисуса Христа повелеваю тебе выйти из нее»(Деян. 16:18). Но это уже не значит бороться; кто борется, тот еще не одержал победы, и кто победил врага, тот уже не ведет борьбы. Потому что такой подчинил его себе, пленил. Равным образом и Петр не боролся с дьяволом; но его дела были таковы, что превышали борьбу. Из числа верующих, слушающих, оглашенных многие преизбытком одерживали победу над ним (дьяволом). Потому и блаженный Павел сказал:«ибо нам не безызвестны его умыслы»(2Кор. 2:11), – вследствие чего в особенности и брал над ними верх. И в другом месте, послушай, что он говорит:«И неудивительно: потому что сам сатана принимает вид Ангела света»(2Кор. 11:14). Так он вполне знал борьбу, и ничто не укрывалось от него. И:"Ибо тайна, – говорит, –беззакония уже в действии»(2Сол. 2:7). Но в отношении к нам дело требует борьбы. Затем, слушай, что говорит он в другом месте:«Ибо я уверен, что ни смерть, ни жизнь, ни Ангелы, ни Начала, ни Силы, ни настоящее, ни будущее, ни высота, ни глубина, ни другая какая тварь не может отлучить нас от любви Божией во Христе Иисусе, Господе нашем»(Рим. 8:38–39). Не сказал просто: от Христа, но:«от любви ...Христовой». Многие ведь, хотя присоединены к Христу, но не любят Его. Не только, как бы так говорит (Павел), не убедишь меня отречься Его, но и не уменьшишь во мне любви к Нему. Если и вышние силы не могли бы этого сделать, то кто другой был бы в состоянии сделать это? Говорит же это не потому, будто бы в самом деле вышние силы решились на подобное, но по предположению. Потому и сказал:«Ибо я уверен»(πέπεισμαι). Итак, он не боролся (с дьяволом): несмотря на то, боится его лукавства. Выслушай собственные слова его:«Но боюсь, чтобы, как змий хитростью своей прельстил Еву, так и ваши умы не повредились,уклонившисьот простоты во Христе»(2Кор. 11:3). Мало того, и о самом себе так выражается:«но усмиряю и порабощаю тело мое, дабы, проповедуя другим, самому не остаться недостойным»(1Кор. 9:27). Как же ты можешь быть уверен, что тебя никто не отлучит (от любви Божьей)?'
      cn: 然而，若我们愿意，也可以不争战；争战之所以为争战，仅在于我们愿与之为战。这正是居住在我们内（圣灵）的力量，正如圣言所说：「看哪，我已赐给你们权柄，可以践踏蛇和蝎子，并胜过仇敌的一切势力」（路加福音 10:19）。祂赐予了我们一切权柄，可以去争战，也可以不去争战。但既然我们是怠惰的，那么我们才与他们争战吗？至于保罗不曾争战，关于这一点，请听他自己的话：「谁能使我们与上帝的爱隔绝呢？难道是患难吗？是困苦吗？是逼迫吗？是饥饿吗？是赤身露体吗？是危险吗？是刀剑吗？」（罗马书 8:35）。在另一处，请听他所说：「上帝…必要快将撒旦践踏在你们脚下」（罗马书 16:20）。他拥有权柄（胜过撒旦），所以他说道：「我奉耶稣基督的名，命令你从她身上出来！」（使徒行传 16:18）。但这已不再是争战；争战者尚未得胜，而得胜仇敌者，便不再争战了。因为这样的人已将他制服，掳获了他。同样，彼得也没有与魔鬼争战；但他的行事已超越争战。在信者、听道者、慕道者之中，许多人以丰盛之姿胜过了他（魔鬼）。因此，蒙福的保罗说道：「因我们并非不晓得他的诡计」（哥林多后书 2:11），——正因如此，他尤其胜过了他们。在另一处，请听他所说：「这也不足为奇，因为撒旦自己也装作光明的天使」（哥林多后书 11:14）。因此他完全了解争战，没有任何事能向他隐藏。并且：「因为那不法的奥秘，——他说，——已经发动」（帖撒罗尼迦后书 2:7）。但对我们而言，这事仍需要争战。接着，请听他在另一处所说：「因为我深信，无论是死，是生，是天使，是掌权的，是有能的，是现在的事，是将来的事，是高处的，是深处的，是别的受造之物，都不能使我们与上帝的爱隔绝，这爱是在我们的主基督耶稣里的」（罗马书 8:38-39）。他没有简单地说：与基督隔绝，而是说：「与基督的爱隔绝」。因为有许多人，尽管已与基督联合，却不爱祂。他（保罗）仿佛是说，不仅如此，你不会说服我否认祂，也不会减少我里面对祂的爱。既然连至高的权能都无法做到这点，那么还有谁能够做到呢？他说这话并非因为至高的权能果真会决意如此行事，而是基于假设。因此他说道：「因为我深信」（πέπεισμαι）。所以，他没有争战（与魔鬼）：尽管如此，他仍惧怕它的狡诈。请听他自己的话：「我只怕你们的心或被引诱，偏离了那向基督所存的纯一清洁的心，就像蛇用诡诈诱惑了夏娃一样」（哥林多后书 11:3）。不仅如此，他也如此谈论自己：「我是攻克己身，叫身服我，恐怕我传福音给别人，自己反被弃绝了」（哥林多前书 9:27）。那么你怎能确信没有人能使你与（上帝的爱）隔绝呢？
  - type: paragraph
    initial:
      ru: '5.'
      cn: '5.'
    text:
      ru: 'Видишь ли, что (апостол) говорил так по смиренномудрию и скромности? Он обитал уже на небе, почему и сам он говорил:"Ибохотяя ничего не знаю за собою»(1Кор. 4:4); и в другом месте:«течение совершил»(2Тим. 4:7). Итак, дьявол не ему собственно полагал претыкание, а его ученикам. Почему же так? Потому, что они руководствовались не его наставлениями только, но вместе и собственным намерением. В этом отношении (дьявол) одерживал верх: но и здесь он одерживал верх собственно не над ним, а над беспечностью невнимательных (людей). Когда они не исполняли приказаний (апостола), по лености или по чему другому, то он (дьявол) одерживал над ними победу. Если же апостол со своей стороны все делал, но те не слушались, то, значит, (дьявол) побеждал не его, но их непослушание. Так болезнь имеет силу не над врачом, а над невоздержностью больного. Когда тот, со своей стороны, представляет все нужное для излечения, а этот все расстраивает, то последний терпит поражение, а не первый. Итак, над Павлом (дьявол) не одержал ни малейшей победы. Впрочем, к нашему благу служит то, что нам предоставляется возможность борьбы. Что касается римлян, то им не этого желает, – а чего?«Сокрушит сатану под ногами вашими вскоре»(Рим. 16:20). Но этим (ефесянам) желает вот чего: «Которыйможетвсетворить, Егопросим и разумеем»(Еф.3:20). Кто борется, тот еще встречает препятствия; зато как он счастлив, если не падет! Победа бывает блистательнее тогда, когда была борьба. Например: если тобой овладело какое-нибудь злое пожелание, то весьма славное дело ты сделаешь, если не поддашься, а погасишь его. Но хотя бы этого совершенно нельзя было сделать, все-таки мы должны бороться и всегда укрощать себя. Если мы не падем во время этой борьбы, то мы будем победителями. Здесь не так, как у атлетов. Там до тех пор не сделаешься победителем, пока не повергнешь на землю другого; а здесь только сам не будь повергнут и ты победитель, ты уже одолел, если тебя не опрокинули. И это правильно! Там оба бьются о победе, и если один упадет, другой получает венец. Здесь же не так: здесь дьявол старается поразить нас. Итак, если я лишу его того, о чем он заботится, то я победил. Он усиливается не низринуть только, но низринуть вместе с собою; стало быть, он уже побежден, так как он уже свергнут и находится в состоянии погибели; он заботится о победе не с тем, чтобы потом получить венец, но с той целью, чтобы погубить меня. Итак, я победитель в том случае, когда не буду опрокинут (дьяволом), хотя бы сам я не опрокинул его. В чем же состоит блистательная победа? В том, чтобы с крайним презрением попирать его, как поступал Павел, считая за ничто блага настоящей жизни. Будем и мы подражать (апостолу), постараемся возвыситься над земными благами, не будем ни с какой стороны доставлять ему (врагу своему) случаев к торжеству над нами.'
      cn: '难道你没看到吗，（使徒）那样说乃是出于谦卑和克制？他已经居于天上，因此他自己也说：「我虽不自觉有何不当」（哥林多前书 4:4）；又在另一处说：「当跑的路我已跑尽」（提摩太后书 4:7）。因此，魔鬼并不是真正绊倒他，而是他的门徒。为什么会这样呢？因为他们不仅遵循他的教导，同时也遵循自己的意愿。在这方面，（魔鬼）占了上风：但即便在此，他也不是真正胜过使徒，而是胜过那些粗心大意之人的疏忽。当他们因懒惰或其他原因不遵从（使徒的）吩咐时，（魔鬼）就胜过了他们。但若使徒尽其所能做了一切，而那些人不听从，那么，（魔鬼）所胜过的就不是他，而是他们的不顺从。就像疾病并非对医生有权势，而是对病人的放纵不节制有权势。当医生尽其所能提供一切治疗所需，而病人却将其完全破坏，那么是后者遭受失败，而非前者。


        因此，（魔鬼）丝毫未能胜过保罗。然而，对我们有益的是，我们获得了争战的机会。至于罗马人，他所愿望的不是这个，——而是什么呢？「平安的上帝快要将撒旦践踏在你们脚下」（罗马书 16:20）。但对于这些（以弗所人）他所愿望的却是：「那能成就万事的，我们向祂祈求并理解祂」（以弗所书 3:20）。凡争战的，仍然会遇到障碍；但若他不跌倒，他该是何等蒙福啊！当有过争战的时候，胜利会更加辉煌。例如：若你被某个邪恶的欲望所掌控，你若不屈服，反而将其熄灭，你所做的就是一件极荣耀的事。但即便这完全无法做到，我们仍然必须争战，并且常常制服自己。若我们在这场争战中不跌倒，我们就是得胜者。在这里，这不像运动员那样。在那里，除非你将对方摔倒在地，否则你不会成为得胜者；而在这里，只要你自己不被摔倒，你就是得胜者，若你没有被击倒，你就已经得胜了。这也是理所当然的！在那里，双方都为胜利而搏斗，若一方跌倒，另一方就获得桂冠。但在这里并非如此：在这里魔鬼试图击败我们。因此，若我让他无法得逞，那么我就胜利了。他不仅竭力将我打倒，而且要与他一同打倒；因此，他已然被击败，因为他已被打倒，处于灭亡之中；他关心的胜利并非为了之后获得桂冠，而是为了毁灭我。因此，即便我自己没有击倒他，当我没有被（魔鬼）击倒的时候，我就是得胜者。那么，辉煌的胜利在于何处呢？在于极其轻蔑地践踏他，正如保罗所行的，将今生的福乐视为虚无。愿我们也效法（使徒），努力超越属世的福乐，绝不从任何方面让我们的（仇敌）有机会在我们身上得胜。'
  - type: paragraph
    text:
      ru: 'Богатство дает ему к этому случай, а также – деньги, почести. Все это нередко восстановляло его и делало свирепым. Но что за надобность в борьбе? Какая нужда в сражении? Сражающийся не знает, когда конец сражения, и может думать еще – не быть бы самому побежденным и раненым. А кто уже попирает врага своего, тот очевидно одержал победу. Итак, будем попирать силу дьявола, будем попирать грехи, все житейское, как-то: гнев, похоть, высокомерие и все страсти, чтобы, по отшествии нашем туда, не оказалось, что мы отказались от власти, какую получили от Бога. За это удостоимся наследовать и будущие блага. Если же в этом окажемся худыми, то кто доверит нам большее? Если того, кто оскорбил (Бога), кто сам обесчещен, презрен, повержен к ногам, мы не сможем попрать, то как Отец даст нам Свое достояние? Если не победим столько униженного, то как будем иметь дерзновение войти в дом отчий? Скажи мне: если бы ты имел какого-нибудь сына, и он, оставивши честных слуг своих, вошел в сношение с теми, которые за оскорбление тебя изгнаны из дома и делают против тебя разные ухищрения, и если бы он до конца упорствовал в таком поведении, – не был ли бы он лишен за это наследства? Очевидно, что так. Подобно тому и мы, если, оставивши послушных (Богу) ангелов, которые начальствуют над нами, станем жить согласно с желаниями дьявола, то совершенно будем лишены наследства. Но да не постигнет это никого из нас; лучше же, решившись воевать против него и победивши его, при помощи Божьей, да сделаемся наследниками царства небесного. Имеет ли кто недруга, терпит ли кто обиду, питает ли кто злобу, пусть он соберет и изольет всю эту ярость и гнев на главу дьявола. В этом случае гнев будет делом добрым, негодование – полезно, злопамятство – похвально. Как в сношениях с посторонними злопамятство составляет зло, так здесь оно есть благо. Итак, если у тебя есть недостатки, – исправь их здесь; если же не можешь сам этого сделать, то делай с сочленами твоими. Тебя ударил кто-нибудь, – имей зло против дьявола и никогда не прекращай вражды с ним. Если и не ударил, – и в таком случае злобствуй против дьявола за то, что он восстал против твоего Владыки, оскорбил Его, а также за то, что вредит братьям твоим и воюет на них. Всегда будь врагом, всегда гневным, всегда непримиримым с ним. От этого он сделается смиренным, неопасным, таким, что его можно будет одолеть. Если мы сильно разъяримся против него, он не будет нам страшен. А когда станем благосклонны, тогда он сделается жестоким, – не так (мы должны обращаться с ним), как с нашими братьями. Он враг и гонитель жизни и спасения нашего и своего собственного. Коли он не любит самого себя, то как может любить нас? Итак, ополчимся и повергнем его, имея союзником великого Господа Иисуса Христа, Который возможет сделать и нас неуловимыми для его сетей и удостоить вечных благ, которых да сподобимся все мы благодатью и человеколюбием Господа нашего Иисуса Христа, с Которым Отцу со Святым Духом слава, держава, честь, ныне, и присно и во веки веков. Аминь.'
      cn: '财富给了他这样做的机会，以及金钱和尊荣。这一切常常使他恢复元气，并变得凶猛。可是，争战有什么必要呢？争战有什么需要呢？争战的人不知道争战何时结束，并且可能还在想自己会不会被击败和受伤。而那已经践踏自己敌人的人，显然已经获得了胜利。因此，我们要践踏魔鬼的力量，践踏罪恶，践踏所有世俗之事，诸如愤怒、淫欲、傲慢以及所有的情欲，以便我们去到那里之后，不至于发现我们放弃了从上帝那里领受的权柄。为此，我们将蒙受资格继承未来的福益。然而，如果在这方面我们表现不佳，那么谁会信任我们，把更大的事交给我们呢？如果那个侮辱了（上帝）的人，他自己已经蒙羞、被蔑视、被践踏在脚下，我们却不能践踏他，那么天父又怎会将祂的产业赐给我们呢？如果我们连这样被贬低的人都不能战胜，那么我们又怎会有胆量进入父家呢？你告诉我：如果你有一个儿子，而他抛弃了你忠实的仆人，却与那些因侮辱你而被逐出家门、并对你百般诡计的人来往，并且他若始终坚持这种行为，难道不会因此被剥夺继承权吗？显然会的。与此类似，如果我们抛弃了顺服（上帝）的、治理我们的天使，却按照魔鬼的意愿生活，那么我们就必完全被剥夺继承权。但愿这事绝不降临在我们任何人身上；倒不如，决意与他争战，并靠着上帝的帮助战胜他，让我们成为天国的继承人。


        若有人有仇敌，若有人遭受委屈，若有人心怀恶意，就让他将所有这些狂怒和愤怒倾泻在魔鬼的头上。在这种情况下，愤怒将是善行，愤慨将是有益的，记仇将是值得称赞的。就像在与外人交往时记仇构成邪恶，同样在这里它却是良善。因此，如果你有缺点，——就在这里改正它们；如果你自己无法做到，那么就与你的肢体一同做。若有人打了你，——你就对魔鬼心怀恶意，并且永远不要停止与它的敌对。即便没有打你，——在这种情况下，你也要对魔鬼心怀恶意，因为它反叛了你的主宰，侮辱了祂，以及因为它伤害你的弟兄，并与他们争战。永远是它的敌人，永远怀着愤怒，永远与它不共戴天。由此它将变得谦卑，不再危险，变得可以被战胜。如果我们强烈地对他发怒，它就不会令我们恐惧。而当我们变得友善时，那时它就会变得残忍，——不像（我们对待）我们的弟兄那样。它是敌人，是我们生命和救恩的迫害者，也是它自己生命和救恩的迫害者。如果它不爱它自己，那么它又怎能爱我们呢？


        因此，让我们披挂整齐，将它击倒，拥有伟大的主耶稣基督作为盟友，祂能够使我们不被它的罗网所捕获，并使我们配得永恒的福益，愿我们所有人都能靠着我们主耶稣基督的恩典和仁爱而蒙受这些福益。天父与圣灵与祂同享荣耀、权能、尊贵，从现在直到永远，世世代代。阿们。'
