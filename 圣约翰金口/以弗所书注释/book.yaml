    ru: Беседа 1
    cn: 第 1 讲
  children:
  - type: paragraph
    text:
      ru: 'Еф.1:1–2.Павел, волею Божиею(δία δελήματος θεού)Апостол Иисуса Христа, находящимся в Ефесе святым и верным во Христе Иисусе:'
      cn: (以弗所书 1:1-2) 保罗，按上帝的旨意作耶稣基督的使徒，写信给在以弗所的圣徒，以及在耶稣基督里忠信的人：
  - type: paragraph
    text:
      ru: благодать вам и мир от Бога Отца нашего и Господа Иисуса Христа.
      cn: 恩典和平安从我们的父上帝和主耶稣基督临到你们。
  - type: paragraph
    text:
      ru: Что требуется для святости. – Благость  – источник благодати.
      cn: 成圣需要什么。– 恩慈——恩宠之源。
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Вот, (апостол) и к (Богу) Отцу прилагает:δια(через). Что же? Назовем ли мы Его меньшим? Нисколько."святым, – пишет он, –находящимся в Ефесе и верным во Христе Иисусе». Вот, святыми называет мужей, которые имеют и детей, и жен, и слуг. А что он их разумеет здесь, видно из конца послания, где он говорит:«Жены, повинуйтесь своим мужьям»(Еф.5:22), и в другом месте:«Дети, повинуйтесь своим родителям»(Еф.6:1), и еще:«Рабы, повинуйтесь господам своим»(Еф.6:5). Подумаем же, какая теперь царит беспечность, как сильно ослабела ревность к добродетели, и как было много добродетельных тогда, если и миряне назывались святыми и верными!«Благодать вам и мир от Бога Отца нашего и Господа Иисуса Христа». Сказал о благодати и призвал Бога Отца, потому что это (призывание) есть знак (преподания) благодати. Каким образом? Послушай, что он говорит в другом месте:«А как вы – сыны, то Бог послал в сердца ваши Духа Сына Своего, вопиющего: «Авва, Отче!»(Гал. 4:6).«И Господа Иисуса Христа», – потому что для нас Христос родился и явился во плоти.«Благословен, – пишет он, –Бог и Отец Господа нашего Иисуса Христа». Вот, Он – Бог воплотившегося, или иначе: Отец Бога Слова.«Благословивший нас во Христе всяким духовным благословением в небесах»(Еф.1:3). (Апостол) намекает здесь на благословение Иудеев, потому что и это – благословение, но не духовное. Что в самом деле было сказано им?«Благословит тебяБог...благословит плод чрева твоего»(Втор.7:13), и благословит вход твой и исход твой. Здесь же не так. Как же?«Всяким духовным благословением». Чего же еще тебе недостает? Ты стал бессмертным, свободным, сыном, праведным, братом, сонаследником; будешь вместе царствовать, вместе прославишься; все тебе даровано:"как с Ним, – говорит, –не дарует нам и всего?»(Рим. 8:32). Величие твое прославляется ангелами, херувимами и серафимами. Чего еще недостает?«Всяким духовным благословением»: о телесном здесь (не говорится) ничего. Напротив, для того, чтобы отклонить от всего телесного, и направить нас к духовному, (еще Спаситель) говорил:«В мире будете иметь скорбь»(Иоан. 16:33). Как владеющие телесным не могут слышать о духовном, так точно ищущие духовного не могут его достигнуть, пока наперед не оставят телесного.'
      cn: '瞧，（使徒）也将 δια (藉着) 应用于上帝父。那么，我们能称祂为次要的吗？绝不能。

        「写给他『在以弗所的圣徒，和在基督耶稣里有忠信的人。』」瞧，他称那些有儿女、妻子和仆役的人为圣徒。而他在此指的就是这些人，这从书信的末尾便可看出，他在那里说：「妻子们，你们要顺服自己的丈夫」（以弗所书 5:22），又在另一处说：「儿女们，你们要顺从自己的父母」（以弗所书 6:1），还有：「仆役们，你们要顺服自己的主人」（以弗所书 6:5）。那么，让我们想想，如今何等疏忽大意盛行，对美德的热忱是何等衰弱，以及当时有多少有德行的人，倘若连平信徒都曾被称为圣徒和忠信的人！

        「愿恩宠与平安从我们的上帝父和主耶稣基督归于你们。」他提到了恩宠，并呼求上帝父，因为这（呼求）是（赐予）恩宠的记号。方式为何？听他在另一处如何说：「既然你们是儿子，上帝就差遣祂儿子的圣灵进入你们的心，呼喊：『阿爸，父！』」（加拉太书 4:6）。「『和主耶稣基督』——因为基督为我们而诞生，并以肉身显现。」

        「福哉！」他写道，「愿颂赞归于我们主耶稣基督的上帝和父。」瞧，祂是那位道成肉身者的上帝，或者说：圣言上帝的父。「祂曾在基督里，在诸天界中，以各样属灵的祝福祝福了我们。」（以弗所书 1:3）。（使徒）在此暗示了犹太人的祝福，因为那也是祝福，但不是属灵的。对他们究竟说了什么呢？「上主必祝福你……祝福你身所生的」（申命记 7:13），并祝福你的出与入。而这里却不是这样。是怎样呢？「以各样属灵的祝福。」你还缺少什么呢？你已变得不朽，自由，是儿子，是义人，是弟兄，是同为后嗣；你将一同为王，一同得荣耀；一切都已赐予你：「祂既然连自己的儿子都舍了，」他说，「岂不也把万物和祂一同赐给我们吗？」（罗马书 8:32）。你的尊荣被天使、革鲁冰和色辣芬所颂扬。还缺少什么呢？「以各样属灵的祝福」：在此并未提及任何关于身体的事。相反地，为了使我们远离一切身体之物，并引导我们归向属灵之事，（救主）曾说：「在世上你们有苦难」（约翰福音 16:33）。正如拥有身体之物的人无法听闻属灵之事，同样，寻求属灵之事的人也无法达到，除非他们首先舍弃身体之物。'
  - type: paragraph
    text:
      ru: 'Что значит:«духовным благословением в небесах»? Значит то, что не земные (обещаются им блага), как иудеям (которым обещано было), что благая земли снедут, что наследят землю, кипящую медом и молоком, и что благословит Бог землю их (Ис. 1:19;Исх. 33:3;Пс. 84:13;Втор. 15:4). Здесь (не обещается) ничего такого. Что же?«кто любит Меня, тот соблюдет слово Мое, и Я и Отецпридем к нему и обитель у него сотворим»(Иоан. 14:23).«Итак всякого, кто слушает слова Мои сии и исполняет их, уподоблю мужу благоразумному, который построил дом свой на камне; и пошел дождь, и разлились реки, и подули ветры, и устремились на дом тот, и он не упал, потому что основан был на камне»(Мф. 7:24–25). Что другое означает этот камень, как не небесные предметы, не подлежащие никакому изменению?«Итак всякого, – говорит (Спаситель), –кто исповедает Меня пред людьми, того исповедаю и Я  пред Отцом Моим Небесным;икто отречется от Меня... отрекусь от того и Я»(Мф. 10:32–33); и в другом месте:«Блаженны чистые сердцем, ибо они Бога узрят»; и еще:«Блаженны нищие духом, ибо их есть Царство Небесное»; и опять:«Блаженны изгнанные за правду, ...ибо велика ваша награда на небесах»(Мф. 5:8, 3, 10, 12). Видишь ли, везде небеса, и нигде ни земли, ни того, что на земле? И опять:«Наше же жительство – на небесах, откуда мы ожидаем и Спасителя, Господа нашего Иисуса Христа»(Фил. 3:20); и еще:«о горнем помышляйте, а не о земном»(Кол. 3:2).«Об Иисусе Христе», т. е. чрез Христа Иисуса, а не чрез Моисея это благословение; а потому не только качеством, но и посредником (благословения) мы превосходим иудеев, о чем он говорит и в послании к Евреям:«И Моисей верен во всем доме Его, как служитель, для засвидетельствования того, что надлежало возвестить; а Христос – как Сын в доме Его; дом же Его – мы»(Евр. 3:5–6)."так как, – говорит, –Он избрал нас в Нем прежде создания мира, чтобы мы были святы и непорочны пред Ним»(Еф.1:4). Слова эти значат: чрез кого Он благословил нас, чрез того и избрал. Итак, сам Он здесь дарует нам все это; сам будет судьей и скажет:«приидите, благословенные Отца Моего, наследуйте Царство, уготованное вам от создания мира»(Мф. 25:34); и в другом месте:«хочу, чтобы там, где Я, и они были со Мною»(Иоан. 17:24).'
      cn: 「在天上的属灵的祝福」是什么意思？它的意思是，应许给他们的福乐并非属地的，不像犹太人（曾蒙应许），他们将吃地上的美物，承受流淌着奶与蜜的土地，且上帝将祝福他们的土地（以赛亚书 1:19，出埃及记 33:3，诗篇 84:13，申命记 15:4）。在这里，（并没有）应许任何这类事物。那么，是什么呢？「谁爱我，谁就遵守我的话语，我和父必到他那里去，在他里面造一个居所」（约翰福音 14:23）。「所以，凡听见我这些话语并去实行的人，我将他比作一个有见识的人，他把自己的房屋建在磐石上；雨降下，河水泛滥，风吹袭，冲击那房屋，它却不倒塌，因为它的根基是立在磐石上的」（马太福音 7:24-25）。这个磐石除了意味着那些不承受任何改变的天上之物，还能意味着什么呢？「所以，——（救主）说，——凡在世人面前认我的，我必在我的天父面前也认他；凡若不认我的……我也必不认他」（马太福音 10:32-33）；又在另一处说：「福哉心灵清洁的人，因为他们必得见上帝」；还有：「福哉心灵贫乏的人，因为天国是他们的」；又说：「福哉为义受逼迫的人，……因为你们在天上的赏赐是大的」（马太福音 5:8，3，10，12）。祢看见了吗，处处都是天，而没有一处提及地或地上之物？又说：「我们的居所在天上，我们从那里也等候救主，我们的上主耶稣基督」（腓立比书 3:20）；还有：「要思念那上面的事，不要思念属地的事」（歌罗西书 3:2）。「关于耶稣基督」，也就是说，这祝福是藉着耶稣基督，而不是藉着摩西；因此，我们不仅在素质上，也在（这祝福的）中保上超越犹太人，关于这一点，他在致希伯来人的书信中也提到：「摩西在他全家中是忠心的，如同仆役，为要证明那将要宣扬的事；而基督作为儿子在他家中；他的家就是我们」（希伯来书 3:5-6）。「正如，——他说，——他在创世以前，就在祂里面拣选了我们，使我们在他面前成为圣洁，无可指摘」（以弗所书 1:4）。这些话语的意思是：他藉着谁祝福了我们，也藉着谁拣选了我们。所以，他自己在此将这一切赐予我们；他自己将作审判者并说：「你们这些蒙我父祝福的人，来承受那从创世以来就为你们预备好的国度吧！」（马太福音 25:34）；又在另一处说：「我愿我在哪里，他们也在那里与我同在」（约翰福音 17:24）。
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'И во всех почти посланиях (апостол) старается показать, что не новость какая-нибудь сделанное для нас; но что издревле так было предызображено, и не по причине изменения намерения (Божьего это случилось), но так именно было предустроено и предопределено. И это – дело великого попечения (Божьего). Что значит:«избрал в Нем»? Значит – Христос чрез веру в Него совершил это прежде, чем мы родились, или лучше – прежде, чем мир сложен. И прекрасно назвал (апостол сотворение мира) сложением (καταβολή– низвержение с высоты), показывая этим, что мир как бы низвержен с какой-то великой высоты. Подлинно, велика и неизреченна высота Божья, – не в отношении к месту, но в отношении к безграничности природы (Божественной), – и велико расстояние между тварью и Творцом. Да посрамятся еретики, слыша это! Для чего избрал? Для того, чтобы быть нам святыми и непорочными пред Ним. А чтобы ты, услышав, что Он избрал, не подумал, что достаточно одной веры, (апостол) указывает и на жизнь: для того, говорит он, избрал нас, и на то, чтобы мы были святы и непорочны. Избрал Он некогда и иудеев. Каким образом? Народ этот, сказано, избрал Я из народов (Втор. 7:6, 14:2). Если же люди, при выборе, избирают лучшее, то тем более Бог.'
      cn: '并且在几乎所有的书信中，（使徒）竭力表明，为我们所成就的并非某种新事；而是自古以来就如此被预先描绘，并非因上帝旨意的改变而发生，而是如此被预先安排和预定。这便是上帝大能看顾的作为。


        「在祂里面拣选」意味着什么？这意味着，基督借着对祂的信仰，在我们出生之前就成就了此事，或者更确切地说，在世界被奠定之前。使徒巧妙地将（世界的创造）称为「奠基」（καταβολή——从高处倾泻而下），借此表明世界仿佛是从某种崇高之处倾泻而下。确实，上帝的崇高是伟大且无可言喻的——并非指空间的距离，而是指（神圣）本性的无限性——并且受造物与造物主之间的距离是巨大的。愿异端分子听闻此言而蒙羞！


        为何拣选？为要使我们在祂面前成为圣洁无瑕的。而为了避免你，在听到祂拣选了你之后，便以为单单有信心就已足够，（使徒）也指明了生活（的重要性）：他说，拣选我们，正是为了使我们圣洁无瑕。


        祂也曾拣选过犹太人。如何拣选的呢？经文记载：「这百姓是我从万民中拣选出来的。」（申命记 7:6，14:2）。如果人们在拣选时选择最好的，那么上帝更是如此。'
  - type: paragraph
    text:
      ru: 'И избрание служит свидетельством, с одной стороны, человеколюбия Божьего, с другой – добродетели избранных. Без сомнения, Он избрал тех, которые заслуживают этого; Он сделал нас святыми, но нужно, чтобы и мы были достойны быть святыми. Свят всякий, приобщающийся вере; непорочен же тот, кто проводит жизнь непорочно. И не простой святости, не простой непорочности Он требует, а такой, которая бы и пред Ним показалась именно такой. Есть ведь святые и непорочные, почитаемые за таковых людьми, на самом же деле уподобляющиеся гробам поваленным, или (волкам) ходящим в одежде овечьей. Но не таковых Он избирает, а тех, о которых говорит пророк:«и по чистоте рук моих»(Пс. 17:25). Какой (святости Он ищет)? Святости«пред очами Его», т. е. такой, которую видит око Божье. Сказав о добродетелях их (избираемых), потом опять переходит к благодати и говорит:«в любви предопределив усыновить нас»(Еф.1:4–5), потому что не за добрые только дела бывает это (избрание), но по любви (к нам), и не по одной любви, но и за нашу добродетель. Если бы достаточно было одной любви, тогда все должны были бы быть спасены; если же с другой стороны достаточно нашей добродетели, то излишне было бы явление Его (Сына Божьего) в мире и (излишне было бы) все домостроительство Его. Итак, это делается и не по одной любви и не за нашу только добродетель, но под условием той и другой вместе.«Избрал нас», – говорит (апостол); избирающий же знает, что Он избирает."в любви, – говорит, –предопределив усыновить нас». Не будь любви (Божьей), добродетель никого бы не спасла. Скажи мне: много ли бы пользы получил Павел, много ли бы он совершил, если бы не был призван свыше, и если бы Возлюбивший его не привлек его к Себе? Или, другими словами: дарование столь великих благ есть плод любви (Божьей к нам), а не нашей (только) добродетели. Быть добродетельным, веровать и приближаться (к Богу) – это хоть дело и Призвавшего, но, однако, и наше. А приблизившихся удостоить стольких почестей, чтобы из состояния вражды перевести их в состояние усыновления, – это подлинно дело преизобилующей любви."В любви, – говорит, –предопределив усыновить нас Себе чрез Иисуса Христа»(Еф.1:4–5). Замечаешь ли, как ничего – без Христа и ничего – без Отца? Этот преднарек, Тот приводит. И это он утверждает, возвышая бывшее, как и в другом месте говорит:«И не довольно сего, но и хвалимся Богом чрез Господа нашего Иисуса Христа»(Рим. 5:11). Великие, конечно, дарованы блага, но они становятся гораздо многоценнее вследствие того, что дарованы чрез Христа, потому что к нам – рабам Бог послал не кого-нибудь из рабов, но своего Единородного.«По благоволению, – говорит, –воли Своей»(Еф.1:5) (κατά την εϋδοκίαν τού θελήματος αυτοΰ), т. е. потому, что имел сильное желание, или – если угодно – потому, что это составляло Его главное стремление.Εύδοχία(благоволение) везде означает главное желание (основу других желаний). Есть и другие желания, – первое, напр., чтобы не погибли грешники; второе, чтобы сделавшиеся грешниками погибли, потому что мучиться будут они не по необходимости, а по воле (Божьей). Это можно видеть и у Павла, напр., когда он говорит:«Ибо желаю, чтобы все люди были, как и я»(1Кор. 7:7); и в другом месте:«я желаю, чтобы молодые вступали в брак, рождали детей»(1Тим. 5:14). Таким образом, подύδοχίαон разумеет первое желание, сильное желание, желание с вожделением, повадку. Я не откажусь употребить, даже вульгарное выражение, лишь бы уяснить это для простецов; так мы, означая непреодолимое желание, говорим –κατά τό πείσμα ημών(по нашей повадке). Таким образом, сказанное (т. е. по благоволению хотения своего) значит, что Он сильно желает, сильно хочет нашего спасения.'
      cn: 拣选一方面证明了上帝的仁爱，另一方面也证明了被拣选者的美德。毫无疑问，祂拣选了那些配得之人；祂使我们成为圣洁，但我们自身也需配得圣洁。凡是领受信仰的，皆为圣洁；而那活出纯洁生命的人，便是纯洁无瑕的。祂所要求的，并非简单的圣洁，并非简单的纯洁无瑕，而是那种在祂面前也显为如此的圣洁与纯洁。确实有些人被世人视为圣洁无瑕，但实际上却如同倒塌的坟墓，或如披着羊皮的狼。但祂所拣选的并非此类，而是先知所说之人：「我手洁净」（诗篇 17:25）。（祂寻找的是）何种圣洁？是在祂眼前的圣洁，即上帝之眼所能看见的圣洁。在谈及被拣选者的美德之后，随即又转向恩典，说道：「在爱中预定我们藉着耶稣基督得儿子的名分」（以弗所书 1:4-5），因为这拣选并非单单因着善行，而是因着（祂对我们的）爱，且并非仅仅因着爱，也因着我们的美德。若单有爱便已足够，那么所有人都会得救；反之，若单有我们的美德便已足够，那么祂（上帝之子）降世便属多余，祂的一切救赎大工也便属多余。因此，这事成全，既非单凭爱，也非单凭我们的美德，而是以上述两者兼备为条件。「拣选了我们，」使徒说；拣选者必知祂所拣选的是什么。「在爱中，」他说，「预定我们得儿子的名分。」若无（上帝的）爱，美德无法拯救任何人。请告诉我：若非保罗被从上呼召，若非那爱他者不将他吸引到自己那里，他会获得多少益处，又能成就多少呢？换言之：赐予如此丰盛的福祉，是（上帝对我们）爱之果实，而非（单单）我们美德的成果。行美德、信靠并亲近（上帝），这固然是那位呼召者所行的，但也是我们自身的作为。而使亲近祂者蒙受如此厚待，将他们从为敌之境提升至得儿子的名分之境，这确实是溢出之爱的作为。「在爱中，」他说，「预定我们藉着耶稣基督得儿子的名分归于祂」（以弗所书 1:4-5）。你可曾留意，基督之外一无所有，天父之外也一无所有？这位（天父）预先命定，那位（基督）引领成就。他如此申明，以彰显既有之事的尊荣，正如他在别处所说：「不但如此，我们还要藉着我们的主耶稣基督，以上帝为夸口」（罗马书 5:11）。确实，所赐的福祉是丰盛的，但因着是借由基督所赐，它们便显得更为宝贵，因为上帝差遣到我们这些为奴者这里的，并非别的仆人，而是祂自己的独生子。「按着自己意旨所喜悦的」（以弗所书 1:5）(κατά την εϋδοκίαν τού θελήματος αυτοΰ)，他说，即因为祂有强烈的愿望，或者——如果你愿意——因为这是祂主要的心意。Εύδοχία（喜悦）在任何地方都意味着主要的心意（其他愿望的基础）。也有其他愿望——例如，第一个是希望罪人不至灭亡；第二个是希望沦为罪人者灭亡，因为他们受苦并非出于必然，而是出于（上帝的）旨意。这在保罗那里也可以看到，例如，当他说：「我愿众人像我一样」（哥林多前书 7:7）；又在别处说：「我愿年轻的寡妇嫁人，生养儿女」（提摩太前书 5:14）。因此，他所理解的ύδοχία（喜悦）是指首要的愿望、强烈的愿望、带有渴慕的愿望、一种习性。我不介意使用，甚至粗俗的表达，只要能向平信徒阐明此意；比如，我们用κατά τό πείσμα ημών（按我们的习性）来表示不可遏制的愿望。因此，所说的（即按着自己意旨所喜悦的）意味着，祂强烈渴望，极力盼望我们的救赎。
  - type: paragraph
    text:
      ru: Для чего Он так любит нас, и где источник такой любви? (Источник) – единственно Его благость, потому что благодать от благости. Потому-то Он и предопределил нас во усыновление, желая и сильно желая, чтобы тем явить славу благодати Своей.«По благоволению, – пишет он, –воли Своей в похвалу славы благодати Своей, которою Он облагодатствовал нас в Возлюбленном»(Еф.1:5–6), т. е. чтобы показать славу благодати Своей, которою Он сделал нас любезными Себе в Возлюбленном.
      cn: 祂为何如此爱我们，这样的爱源自何处？(来源) – 唯独是祂的良善，因为恩典源于良善。正因如此，祂就预定我们得以被收养为子，愿意且切切地愿意以此显明祂恩典的荣耀。「按着祂所喜悦的旨意，——他写道，——使祂荣耀的恩典得着称赞，这恩典是祂在爱子里所白白赐给我们的」(以弗所书 1:5-6)，意即，为要显明祂恩典的荣耀，借此祂使我们在祂自己面前，在爱子里，蒙爱。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Итак, если Он«облагодатствовал ...в похвалу славы благодати Своей», чтобы, т. е. проявить благодать Свою, то и мы постараемся пребыть в ней.«В похвалу славы». Что это значит? То ли, чтобы кто восхвалял Его? Чтобы кто прославлял? Мы, ангелы, архангелы и вся тварь? Что же это? Нет! Божество ни в чем не нуждается. Итак, для чего же Он желает, чтобы мы восхваляли и прославляли Его? Для того, чтобы чрез это сделать теплее нашу любовь к Нему. Не требует Он от нас ни служения, ни прославления, ничего другого; Он желает одного – спасения нашего, и все делает для этого. В самом деле, славословящий и благоговеющий пред благодатью, явленной в Нем, будет внимательнее и рачительнее (к своему спасению).«Которою Он облагодатствовал нас», – не сказал: (благодать) которую даром дал (έχαφίσατο), но – которою облагодатил нас (έχαρίτωοεν ημάς), т. е. не только от грехов избавил, но и сделал любезными Себе. Представим себе: если бы кто, взявши чесоточного, покрытого язвами, удрученного болезнью, старостью, бедностью и голодом, вдруг преобразил его в благообразного юношу, красота которого привлекала бы к себе всех людей, щеки сияли бы, взоры, при каждом мановении, бросали бы солнечные лучи; потом, если бы оставил его навсегда в этом цветущем возрасте, а сверх того, облек его в багряницу, в диадему и во все царские украшения: вот так именно и преобразил (Бог) нашу душу, сделав ее и красивой, и привлекательной, и любезной, так что на такую душу желают взирать ангелы, архангелы и все другие (небесные) силы.'
      cn: '那么，既然祂「使我们蒙恩，为要颂赞祂恩典的荣耀」，也就是说，为要彰显祂的恩典，那么我们也当努力持守在这恩典中。「为着荣耀受称颂。」这是什么意思呢？是为了让谁颂赞祂吗？为了让谁荣耀祂吗？是我们，天使，众天使长和一切受造之物吗？这究竟是什么呢？不！神性在任何事上都无所欠缺。那么，祂为何愿我们颂赞和荣耀祂呢？为的是借此使我们对祂的爱更加炽热。祂不要求我们侍奉祂，不要求我们荣耀祂，也不要求任何其他；祂只愿一件事——就是我们的救赎，并且为着此事成就一切。确实如此，凡颂赞并敬畏那在祂身上所彰显之恩典的人，将会更加谨慎和勤勉（于自己的救赎）。


        「祂使我们蒙恩」，——祂并非说：(恩典) 是祂白白赐予的 (έχαφίσατο)，而是说：祂使我们蒙恩 (έχαρίτωοεν ημάς)，也就是说，祂不仅将我们从罪中拯救出来，而且使我们蒙祂悦纳。设想一下：如果有人，带走了一个患疥癣病、全身溃烂、饱受疾病、衰老、贫困和饥饿折磨的人，突然间将他变成了一个俊美的少年，其美貌能吸引所有的人，双颊闪耀，目光在每一次眨动间都发出太阳般的光芒；然后，如果让他在这个青春盛年永远停留，而且此外，还给他穿上紫袍，戴上冠冕，佩戴上所有王室的饰品：上帝正是如此地改变了我们的灵魂，使它既美丽，又动人，又可爱，以至于天使、众天使长以及所有其他的（天上）众能力都渴望瞻仰这样的灵魂。'
  - type: paragraph
    text:
      ru: 'Так Он сделал нас любезными и вожделенными Себе:«И возжелает, – сказано, –Царь красоты твоей»(Пс. 44:12). Заметь, какие горькие (речи) мы прежде высказывали, и какие благодатные теперь говорим! Мы дивимся не (земным) сокровищам, не тому, что здесь, а небесным, тому, что на небесах. О дитяти, которое, при красоте лица, умеет еще приятно говорить, не говорим ли мы: какой это милый ребенок! Таковы именно верные. Послушай, какие речи они говорят, когда приобщаются таинств. Что может быть вожделеннее тех уст, которые, произнося дивные речи, с великим блеском и дерзновением, с чистым сердцем и нескверными (губами) приобщаются таинственной трапезы? Что вожделеннее тех слов, которыми мы отрицаемся дьявола и сочетаемся Христу, того исповедания – пред купелью и после купели? Подумаем же, как многие растлили (благодать) крещения, и в покаянии вздохнем, чтобы нам опять воспринять ее.«В Возлюбленном, – говорит, –в Котором мы имеем искупление Кровью Его»(Еф.1:6–7). Не то только здесь удивительно, что предал Сына Своего, но и то, что Возлюбленный был заклан. Великое преизобилие (любви)! Предал Возлюбленного за ненавистных. Смотри, как Он ценит нас! Если же, когда мы Его ненавидели и были врагами, Он предал Возлюбленного, то чего же Он не сделает, когда мы удостоимся, чрез благодать, примирения с Ним?«Прощение грехов», – говорит (апостол). От высшего нисходит к низшему. Сказав наперед об усыновлении, святости и непорочности, потом уже говорит о страдании, не уменьшая и не низводя речи от предметов важных к малым, а от малых восходя к великим. В самом деле, нет ничего столько великого, как пролитие за нас крови Божьей; что Бог Сына Своего не пощадил, это важнее и усыновления и других даров. Великое, бесспорно, дело – отпущение грехов, но оно становится еще больше, когда совершается кровью Владычной. А что это далеко выше всего, смотри, как сильно выражается здесь (Павел), говоря:«по богатству благодати Его, каковую Он в преизбытке даровал нам»(Еф.1:7–8). И то богатство, но это гораздо большее.«Каковую Он в преизбытке даровал, – говорит, –нам". Богатство было, и Он его еще преумножил, т. е. излил неизреченно (обильно). Невозможно словом представить, что сделано для нас. Нам (даровано) богатство, богатство необъятное, богатство не человеческое, но божественное, так что слово совершенно бессильно выразить его. Желая же показать, как даровал (благодать) в преизобилии, прибавляет:«во всякой премудрости и разумении, открыв нам тайну Своей воли»(Еф.1:8–9), т. е., Он сделал нас мудрыми и разумными истинной мудростью и истинным разумом.'
      cn: 祂如此使我们蒙祂所爱，为祂所慕，因为「王也必羡慕你的美貌」（诗篇 44:12）。请注意，我们先前说出何等苦涩（言语），而如今我们说出何等恩典之语！我们所惊叹的，并非（地上）的财宝，并非此世之物，而是天上的，即在天国之物。对于一个孩子，若其面容俊美，又善于言谈，我们岂不说：这是何等可爱的孩子啊！忠信之人正是如此。请听，当他们领受诸圣事时，他们所说的是何等言语。有何能比那些口唇更可渴慕？它们发出奇妙之言，以极大的光辉与坦然无惧，以洁净之心与未被玷污之（唇），领受奥秘筵席的呢？有何能比那些言语更可渴慕？借以我们弃绝魔鬼，并与基督联合，还有那告白——在洗礼池前与洗礼池后的呢？那么，让我们思考，有多少人玷污了（洗礼的）恩典，并在忏悔中叹息，好使我们再次领受它。「在爱子（祂说）里，我们借着祂的血，得了救赎」（以弗所书 1:6-7）。这里并非仅仅祂交出祂的儿子这一点令人惊奇，而是那爱子竟被宰杀。（爱）的伟大丰盛！祂为那些可憎之人交出了爱子。看哪，祂何等珍视我们！倘若，当我们憎恨祂并为祂的仇敌时，祂交出了爱子，那么，当我们借着恩典，蒙受与祂和好之恩时，祂又会为我们做什么呢？「罪的赦免，」（使徒）说。从高处降至低处。祂先行谈及了领养、圣洁与纯全，然后才谈及苦难，并非将言语从重要的事物贬低至微小的，而是从微小的升至伟大的。事实上，没有什么比上帝为我们流血更伟大的了；上帝不惜祂的儿子，这比领养和所有其他恩赐都更为重要。赦免罪过无疑是伟大的事，但当它借由主宰者的宝血完成时，它便更加伟大了。而这远超乎一切，请看（保罗）在这里是如何有力地表达的，他说：「照着祂丰盛的恩典，这恩典是祂充充足足赏给我们的」（以弗所书 1:7-8）。那是富足，但这更为丰盛。「祂充充足足赏给，」（他）说，「我们的。」富足本已存在，祂又使其加倍增添，也就是说，祂以不可言喻的方式（丰盛地）倾泻出来。无法用言语来描述为我们所成就的一切。我们（被赐予）富足，浩瀚无垠的富足，非属人间，乃是神圣的富足，以至于言语完全无力表达它。祂愿显明祂是如何充充足足赏赐（恩典）的，便补充说：「在诸般智慧和见识中，向我们显明祂旨意的奥秘」（以弗所书 1:8-9），也就是说，祂使我们成为有智慧和有见识的，借着真实的智慧与真实的见识。
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: О, какая любовь! Сказал нам тайны Свои –«Своей воли»,  или, говоря другими словами, открыл нам то, что у Него в сердце. Такая тайна, в самом деле, исполнена всякой мудрости и разума. Что назовешь ты равным такой мудрости? Нас, ничего нестоящих, Он взыскал, чтобы возвести в богатство. Что сравнится с такой изобретательностью? Тот, кто был врагом, (существом) мерзким, вдруг возводится горе. И не в этом только премудрость,  но и в том, что совершается в такое время, и в том, что чрез крест. Долго нужно объяснять, сколько явлено в этом премудрости и как Он чрез это снова сделал нас  мудрыми.«По Своему благоволению, – продолжает (апостол),  –которое Он прежде положил в Нем»(Еф.1:9), т. е. это было сильное и сердечное желание Его – как-нибудь сказать нам тайну (воли Своей). Какую же? Ту, что Он желает человека посадить горе. Это (желание) исполнено.«в устроении полноты времен, дабы все небесное и земное соединить под главою Христом»(Еф.1:10).  Небесное и земное были отторгнуты одно от другого и не  имели одной главы. В отношении творения был один Бог, а в отношении объединения этого не было, потому что, когда разлилась языческая прелесть, люди отторглись от повиновения.«В устроении, – пишет, –полноты времен». Исполнением времен он назвал самое (домостроительство).  Заметь, как отчетливо он выражается. Показывая, что начало (спасения нашего), предложение, желание и первое стремление – в Отце, а исполнение его на деле – чрез Сына, он нигде, однако же, не называет Его (Сына) слугой."Избрал, – говорит, –нас в Нем прежде создания мира, ...предопределив усыновить нас Себе чрез Иисуса Христа ...в похвалу славы благодати Своей, ...в Котором мы имеем искупление Кровью Его, ...которое Он прежде положил в Нем, в устроении полноты времен, дабы все ...соединить под главою Христом»(Еф.1:4–7, 9–10), – и нигде не назвал Его слугой. Если скажешь, что частицыεν(в),δια(чрез) указывают на (звание) слуги, то заметь, как они здесь употребляются. В самом начале послания (апостол) сказал:«Волею Отца»(δια τοΰ δελήματος τοΰ Πατρός). Отец, говорит, восхотел, Сын (хотение) исполнил. Здесь нет того, чтобы Сын лишен был действования, потому что Отец восхотел, или чтобы Отец лишен был хотения, потому что Сын действовал; у Отца и Сына все общее.«И все Мое Твое, и Твое Мое», – говорит (Сын) (Иоан. 17:10). Исполнением времен было Его пришествие.
      cn: '哦，何等的爱！祂将祂的奥秘——「祂的旨意」——启示给我们，或者说，祂向我们敞开了祂的心。如此的奥秘，确实地，充满了一切智慧与悟性。你能称什么与这等智慧等同？我们这些一无是处的，祂却寻回了，为要将我们提升至丰盛之中。何物能与此等巧思相较？曾为仇敌，污秽可憎的（存在），竟骤然被提升。且智慧不仅于此，亦在于此事成就于此等时辰，以及乃藉着十字架而成就。要详细解说，此中显明了何等多的智慧，以及祂如何借此再次使我们有智慧，乃是需耗时甚久。


        「按着祂的美意，」（使徒继续说道，）「这美意是祂在爱子里预先定下的。」（以弗所书 1:9）意即，这是祂强烈而由衷的渴望——无论如何要将（祂旨意的）奥秘告诉我们。是何奥秘呢？就是祂渴望将人安置在高处。这（渴望）已然成就。


        「在日期满足的时候，要使天上地上的万有，都在基督里面同归于一。」（以弗所书 1:10）天上与地上的，原本彼此分离，且没有同一元首。论及创造，只有一位上帝；然而论及合一，此却不复存在，因当异教的迷惑蔓延开来时，人们便脱离了顺服。


        「在安排妥当，」使徒写道：「丰盛的时期里。」他称时期满足，即为这（救恩）的实现。请留意他是如何清晰地表达的。祂指出（我们救恩的）开端、提议、愿望和最初的渴望皆源于父，而其在事上的成就则藉着子，然而，他却从未称祂（子）为仆役。


        「就如上帝在创立世界以前，在祂里面拣选了我们……预定我们藉着耶稣基督归于祂为嗣子……使祂荣耀的恩典得着称颂……我们藉着祂的宝血得蒙救赎……这奥秘是祂在祂里面预先定下的，为要在日期满足之时，使天上地上的万有，都在基督这元首之下同归于一。」（以弗所书 1:4-7，9-10）——且（使徒）在任何地方都没有称祂为仆役。若有人说，介词 εν（在）, δια（藉着）指明（仆役的）身份，那么请留意它们在此是如何被使用的。在书信的开端，（使徒）说道：「按着父的旨意」（δια τοΰ δελήματος τοΰ Πατρός）。（使徒）说，父定意，子成就了（这旨意）。这并非说，因为父定意，子就缺乏行动，也并非说，因为子行动，父就缺乏定意；父与子一切所有都是共有的。「凡是我的都是你的，你的也是我的」，——（子）如此说。（约翰福音 17:10）祂的降临，便是那时期满足的成就。'
  - type: paragraph
    text:
      ru: 'Итак, когда Он все сделал чрез ангелов, пророков и закон, и нисколько не успел, напротив находился еще в опасности (раскаяться), что напрасно сотворил человека, что напрасно привел (к бытию) того, кто слишком (имел) преуспевать во зле; когда все без разбору погибали и погибали в большем количестве, чем при потопе, тогда Он нашел домостроительство посредством благодати, так что (оказалось) Он не безрассудно и не напрасно сотворил его. Это исполнение времен он называет и премудростью. Почему? Потому, что люди тогда были спасены, когда всего больше они могли погибать. Возглавить, пишет. Что это значит: возглавить (άνακεφαλαιώσασθαι)? Значит: соединить. Впрочем постараемся быть, как можно, ближе к самой истине. У нас оглавлением (άνακεφαλαίωσις) обыкновенно называется представление в кратких выражениях того, о чем надобно говорить долгое время, или сокращенное изложение всего, о чем было говорено пространно. Итак, слово это может значить и следующее: устраиваемое столь долгое время домостроительство (нашего спасения) возглавил в Себе, т.е. сократил, или, говоря кратко, – с соблюдением впрочем истины, – и то обнял и новое присоединил. Вот, что значит оглавление! Но есть нечто и другое, что также означается (этим словом). Что же это? В Христе по плоти Бог положил одну главу для всех, для ангелов и людей, т. е. одно дал (верховное) начало и ангелам и людям, одним – (Христа) по плоти, другим – Бога Слова. Как если бы кто сказал о доме, что одно в нем гнило, другое крепко, и возобновил бы дом, т. е. сделал бы крепче, подложив более крепкое основание, так и здесь всех привел под одну главу. Тогда только и возможно единение, тогда только и будет этот совершенный союз, когда все, имея некоторую необходимую связь горе, будет приведено под одну главу. Итак, сподобившись такого дара, такой чести, такого человеколюбия, не посрамим Благодетеля, не сделаем тщетной такую благодать, покажем ангельское житие, ангельскую добродетель и образец жизни. Я прошу и молю о том, чтобы все это не было нам в суд и осуждение, но в получение благ, которых да удостоимся все мы благодатью и человеколюбием Господа нашего Иисуса Христа, с Которым Отцу со Святым Духом слава, держава и (честь, ныне и присно, и во веки веков. Аминь).'
      cn: '那么，当祂藉着天使、先知和律法成就了一切，却丝毫没有成功，反而还在面临危险（悔恨），认为祂白白地创造了人，白白地使那在恶中过度长进的（人）得以存在；当所有人都漫无目的地灭亡，灭亡的人数比洪水时期更多的时候，祂便藉着恩典找到了一个神圣的计划（домостроительство），以致（结果）祂并非无知地、也并非徒然地创造了他。这「时期满足」祂称之为智慧。为何？因为人们正是在他们最可能灭亡的时候得蒙拯救。


        祂写道：「使之归于一首。」这「使之归于一首」（άνακεφαλαιώσασθαι）是什么意思？意思是：联合。然而，我们将尽力接近真理本身。在我们这里，「纲要」（άνακεφαλαίωσις）通常指的是用简短的语言来呈现需要长时间论述的内容，或是对已详细阐述过的一切进行精简的概述。那么，这个词语还可以意味着以下内容：祂将如此长久以来所安排的（我们救恩的）奥秘的安排归于祂自己，也就是说，祂将其浓缩了，或者，简而言之——然而要遵守真理——祂既囊括了旧有的一切，又加入了新的内容。这就是「纲要」的意思！然而，这个词语还包含着另外一层含义。那是什么呢？在道成肉身的基督里，上帝为所有人、为天使和人类设立了一个元首，也就是说，祂给天使和人类都赐予了一个（至高的）开端，给前者是道成肉身的基督，给后者是上帝圣言。


        就像有人谈论一座房子，说它一部分腐朽，另一部分坚固，并会翻新这座房子，也就是说，通过打下更坚固的基础来使其更牢固，同样，在这里，祂将所有人都归于一个元首之下。只有那时，合一才可能实现，只有那时，这种完美的结合才会出现，当所有的一切，借着某种必要的属天联系，都被归于一个元首之下。


        那么，我们既蒙受了如此的恩赐、如此的荣耀、如此的仁爱，就不要羞辱那施恩者，不要使如此的恩典归于徒然，要展现天使般的生活、天使般的德行和生活的榜样。我祈求并恳请，愿这一切不至于成为我们的审判和定罪，而是成为我们获得美善的途径，愿我们所有人都藉着我们的主耶稣基督的恩典和仁爱，得蒙这些美善，祂与父和圣灵同受荣耀、权柄和（尊贵，从今时直到永远，世世代代。阿们）。'
