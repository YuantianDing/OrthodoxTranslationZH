  children:
  - type: paragraph
    text:
      ru: Еф.4:17–18.Посему я говорю и заклинаю Господом, чтобы вы более не поступали, как поступают прочие народы, по суетности ума своего,
      cn: (以弗所书 4:17-18) 故此，我说，并靠着主嘱咐你们不要再像那些外邦人一样行事为人，他们行事为人是凭着他们心思的虚妄，
  - type: paragraph
    text:
      ru: будучи помрачены в разуме, отчуждены от жизни Божией, по причине их невежества и ожесточения сердца их.
      cn: 他们的心智昏暗，与上帝的生命隔绝，都因着他们的无知和他们心肠的刚硬。
  - type: paragraph
    text:
      ru: Деньги – суетны, когда их расточают на удовольствия. – Против огнепоклонников. – Против веры в судьбу и в переселение душ.
      cn: '钱财若挥霍于享乐，便是虚妄。

        —— 反对拜火教徒。

        —— 反对信仰命运和灵魂转世。'
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Учитель должен назидать и исправлять души учеников не только советом и вразумлением, но и страхом и напоминанием о Боге. Ведь когда слова человека, как такого же раба, не в состоянии подействовать на душу, тогда уже необходимо напомнить и о самом Господе. Так делает и Павел. Сказавши о смиренномудрии и единении, равно как и о том, что не должно восставать одному против другого, послушай, что (потом) он говорит:«Посему я говорю и заклинаю Господом, чтобы вы более не поступали, как поступают прочие народы». Не сказал:«чтобы вы более не поступали»как вы хотите, – так как это могло бы уязвить их, – но указал на других, хотя выразил то же самое. Также поступает он и в послании к Фессалоникийцам, когда говорит:«а не в страсти похотения, как ипрочиеязычники"(1Фес. 4:5). Вы оставили, говорит он, их (языческие) верования; но это всецело зависело от Бога; а я требую того, что зависит от вас, – именно: жизни и хождения по Богу. Это ваш долг; а я призываю Господа в свидетели своих слов, – что я не умолчал, но сказал, как вам должно вести себя.«По суетности, – говорит, –ума своего». Что такое суета ума? Занятие суетными предметами. А что суетно, как не все настоящее, о чем говорит Екклесиаст:«суета сует, – все суета!»(Еккл. 1:2)? Но скажет кто-нибудь: если (то или другое) суетно и ведет к суете, то для чего же оно существует? Если при том это – дело Божье, то как же оно может быть суетно? И много возражений касательно этого предмета. Но послушай, возлюбленный! Не дела Божий назвал (Екклесиаст) суетными, – нет; не небо суетно, не земля суетна, – нет; не солнце, не луна, не звезды, не тело наше. Все это –«очень хорошо». Что же суетно? Послушаем, что говорит сам Екклесиаст:«Посадил себе виноградники,.. сделал себе водоемы,.. приобрел себе крупного и мелкого скота,.. собрал себе серебра и золота,.. завел у себя певцов и певиц... И сказал я в сердце моем, что и это – суета»(Еккл. 2:4, 6–8, 15); опять:«суета сует, – все суета!». Послушай, что говорит и пророк:"Собираетчеловеки не знает, кому достанется то»(Пс. 38:7). Поэтому«суета сует»– великолепные здания, обилие и избыток золота, толпы слуг, шумно бегущих по площади, гордость и тщеславие, высокомерие и надменность. Все это – суета, потому что произошло не от Бога, но произведено людьми. Почему, однако ж, это суетно? Потому, что не имеет никакой доброй цели.'
      cn: 教师不仅要藉着建议和劝诫，更要藉着对上帝的敬畏和提醒来训诲并修正门徒的灵魂。因为当一个同是仆人的人的话语无力感动灵魂时，那时就有必要提醒关于上主本身了。保罗也是如此行。论及谦卑和合一，以及不可彼此相争之后，请听他（随后）所言：「所以我说，并奉主的名嘱咐你们，不要再像外邦人那样行事了。」他没有说：「不要再按你们所愿的行事了」——因为这可能会伤害他们——而是指出了别人，尽管表达的是同一个意思。他在致帖撒罗尼迦人的书信中也是如此，当他说：「不放纵私欲的邪情，像不认识上帝的其他外邦人一样」(帖撒罗尼迦前书 4:5)。他说，你们已经离弃了他们（异教的）信仰；但这完全取决于上帝；而我要求的是取决于你们的事情——即：生命和按上帝旨意行事的生活。这是你们的义务；而我呼求上主作我话语的见证——就是我没有缄默，而是告诉了你们应当如何行事。他说：「因他们心思的虚妄。」什么是心思的虚妄？忙于虚妄之事。除了这世上的一切，还有什么不是虚妄的呢？正如传道者所说：「虚空的虚空，一切都是虚空！」(传道书 1:2)。但或许有人会说：既然（这样或那样）是虚妄的并导向虚妄，那它为何存在呢？再者，如果这是上帝的作为，那它又怎能是虚妄的呢？关于此事有许多反驳。但请听，亲爱的！传道者并没有称上帝的作为是虚妄的——不；天空不是虚妄的，大地不是虚妄的——不；太阳、月亮、星辰、我们的身体都不是虚妄的。这一切都是「甚好」。那么什么才是虚妄的呢？让我们听听传道者自己是怎么说的：「我为自己栽种葡萄园……为自己挖造水池……我购置了许多牛群羊群……我为自己积蓄了金银……我又为自己得了歌唱的男女……我心里说：『这也是虚空。』」(传道书 2:4，6-8，15)；又说：「虚空的虚空，一切都是虚空！」听听先知还说了什么：「世人积聚财宝，却不知将来谁要收取。」(诗篇 38:7)因此，「虚空的虚空」指的是华美的建筑、大量富余的金银、在广场上喧闹奔跑的成群仆役、骄傲和虚荣、傲慢与狂妄。这一切都是虚妄，因为它们并非源自上帝，而是由人所造。然而，为何这是虚妄的呢？因为它没有任何良善的目的。
  - type: paragraph
    text:
      ru: 'Суетны деньги, когда их расточают на удовольствия; но не суетны они, когда их употребляют на вспомоществования бедным. Когда ты тратишь их на удовольствия, – посмотрим, какое отсюда происходит следствие. Тучность тела, отрыжки, ветры, обилие кала, головная боль, телесное расслабление, жар и изнеможение. Как тот, кто стал бы наливать воду в просверленный сосуд, трудился бы напрасно, так и человек, предающийся удовольствиям, наливает воду в просверленный сосуд. Еще суетными называют несбыточные честолюбивые замыслы: они действительно суетны, ненадежны, тщетны; вообще суетным называют то, что ни к чему не пригодно. Посмотрим же, не таковы ли (дела) человеческие?«Станем есть и пить, ибо завтра умрем!»(1Кор. 15:32). Какое же отсюда последствие, скажи мне? Тление. Мы облекаемся в дорогие одежды и наряды: а что пользы от этого? Никакой. Так умствовали и некоторые из эллинов, но вотще. Они вели строгую жизнь, но по-пустому, не имея в виду никакой полезной цели, поступая так из тщеславия, для снискания почета от толпы. Но что такое честь, которую нам оказывает толпа? Ничто. Если и сами, воздающие нам честь, погибают, то тем более – эта честь. Кто воздает честь другому, должен наперед прибрести ее сам. Если же он не прибрел ее для себя, то как же доставить ее другому? А между тем мы домогаемся чести от бесславных и презренных людей, бесчестных и позорных: что же это за честь?'
      cn: 金钱是虚妄的，当它们被浪费在享乐上时；但它们并非虚妄，当它们被用来济助穷人时。当你将它们花费在享乐上时——让我们来看看由此会产生什么后果。身体的肥胖，呃逆，肠气，粪便过多，头痛，身体的松弛，发热与衰竭。就像那将水倒入有孔器皿的人，是徒劳无功的，同样，那沉湎于享乐的人，也是将水倒入有孔的器皿。此外，人们也将无法实现的雄心壮志称为虚妄的：它们确实是虚妄的，不可靠的，徒然的；一般而言，凡是无益之物，都可称为虚妄的。那么，让我们来看看人类的作为是否也是如此呢？「让我们吃喝吧，因为我们明日将死！」(哥林多前书 15:32)。那么由此带来的后果是什么，请告诉我？是腐朽。我们身着华贵的衣裳和服饰：但这有什么益处呢？毫无益处。某些希腊人也曾如此思想，但却徒劳。他们过着严谨的生活，但却是虚空的，并没有任何有益的目标，这样做是出于虚荣，为了从人群中赢得尊荣。然而，人群给予我们的尊荣又是什么呢？算不得什么。如果那些施予我们尊荣的人本身也要朽坏，那么这份尊荣就更不必说了。一个人若要施予他人尊荣，他自己首先必须拥有它。倘若他自己都未曾拥有它，又怎能将它给予他人呢？然而，我们却向那些毫无荣耀、受人蔑视之人，那些毫无品格、蒙受羞辱之人求取尊荣：那这又算是什么尊荣呢？
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Видишь ли, что все суета сует? Поэтому и сказал (апостол о язычниках):«по суетности ума своего». Но не такова ли у них и вера? В самом деле, не кланяются ли они деревьям и камням? (Бог) создал солнце, чтобы оно служило нам вместо светильника. Кто же поклоняется своему светильнику? Солнце дает от себя свет; когда же оно не может светить, тогда светит светильник. Итак, почему же ты не поклоняешься светильнику? Да, скажет иной, я поклоняюсь огню. Нельзя удержаться от смеха, слыша о таком бесчестии; и ты не стыдишься? Опять же: для чего ты гасишь то, чему поклоняешься? Для чего губишь, для чего умерщвляешь своего бога? Почему ты не даешь ему наполнить собою всего твоего дома? Если огонь – бог, то поднеси к нему свое тело, а не подкладывай бога подобно горшка или котла. Внеси его в твою кладовую, внеси туда, где твои шелковые одежды. Но ты не только не вносишь его, напротив, если он куда-нибудь случайно проникнет, ты гонишь его отовсюду, созываешь всех, плачешь, стенаешь, как будто зашел к тебе какой-нибудь зверь; и когда, таким образом, твой бог посетит тебя, ты называешь это величайшим несчастьем. Я имею Бога, и делаю все для того, чтобы воспринять Его на свою грудь, и считаю блаженством для себя не только то, когда Он посетит мой дом, но и то, когда я привлеку Его в свое сердце. Вовлеки же и ты огонь в свое сердце. Смешно это и суетно! Огонь хорош для употребления, а не для поклонения, для служения и рабского повиновения мне, а не для господства надо мною. Он создан для меня, а не я для него. Если ты поклоняешься огню, для чего же сам почиваешь на ложе, а своего повара заставляешь предстоять пред твоим богом? Сам займись поварством, сделайся пекарем или, если угодно, кузнецом, – для тебя ничего не должно быть почетнее этих занятий; так как за ними наблюдает сам твой бог. Почему ты почитаешь бесчестным то занятие, где так много твоего бога? Для чего поручаешь его рабам и не оставляешь за собою этой чести? Огонь – хорошая вещь, так как сотворен благим Творцом, но он – не бог. Он называется делом Божьим, но не богом. Разве ты не видишь, как он неукротим, как он, охвативши дом, не останавливается нигде? Если ему попадает непрерывный ряд каких-нибудь предметов, он уничтожает все, пока руки плотников или других людей не уймут его неистовства; он не знает ни друзей, ни врагов, но одинаково поступает со всеми. Итак, такой-то твой бог, – и ты не стыдишься? Подлинно, хорошо сказал (апостол):«по суетности ума своего».'
      cn: 你难道没看见，一切都是虚空中的虚空吗？因此（使徒论及异教徒时）说：「按他们心思的虚妄。」他们的信仰不也是这样吗？事实上，他们难道不敬拜树木和石头吗？（上帝）创造太阳，使它作为灯服侍我们。那么，谁会敬拜自己的灯呢？太阳发出自身的光芒；当它不能发光时，灯就发光。那么，你为什么不敬拜灯呢？是的，有人会说：「我敬拜火。」听到这样的羞辱，人不禁发笑；你难道不感到羞耻吗？再者：你为何熄灭你所敬拜的呢？你为何摧毁，为何置你的神于死地呢？你为何不让它充满你的整个房屋呢？如果火是神，那么请把你的身体带到它面前，而不是像锅或壶一样把神放在下面。把他带进你的储藏室，带到你存放丝绸衣物的地方。然而你不仅不把它带进去，相反，如果它不慎渗入某处，你便把它从各处驱赶出去，召集所有人，哭泣、哀叹，仿佛有某种野兽闯入了你家；当你的神这样造访你时，你却称之为最大的不幸。我有上帝，我竭尽所能将祂接纳到我胸怀中，并认为这不仅是祂造访我家之时，更是我将祂吸引到我心中之时，是我的福气。那么你也把火带进你心中吧。这既可笑又虚妄！火适合使用，而非敬拜；它适合服侍我并奴役般地顺从我，而非辖制我。它为我而造，而非我为它而造。如果你敬拜火，你自己为何躺在床上安歇，却让你的厨师站在你的神面前服侍呢？你自己去烹饪吧，成为一名面包师，或者，如果你愿意，成为一名铁匠——对你而言，没有比这些职业更光荣的了；因为你的神亲自监督着它们。你的神如此密切相关的职业，你为何认为不光彩呢？你为何把这事托付给奴仆，而不为自己保留这份荣誉呢？火是好事物，因为它是由良善的造物主所创造，但它不是神。它被称为上帝的作为，但不是神。你难道没看见吗，它如何狂暴难驯，如何一旦吞噬房屋，便不停止于任何地方？如果它遇到一连串的物品，它便摧毁一切，直到木匠或其他人的手制止它的狂怒；它不分朋友或敌人，而是平等对待所有人。那么，这就是你的神——你难道不感到羞耻吗？的确，（使徒）说得好：「按他们心思的虚妄。」
  - type: paragraph
    text:
      ru: 'Но, говорят, наш бог – солнце. А скажи мне, почему это и из-за чего? Что оно много дает от себя свету? Но разве ты не видишь, как его побеждают облака, как оно подчинено закону естественной необходимости, подвержено затмениям, закрывается луной и облаками? Хотя облако бессильнее его, однако ж часто берет перевес; и это также дело премудрости Божьей. Бог должен быть вседоволен, солнце же имеет нужду во многом; а это несвойственно Богу. Так (солнце) нуждается в воздухе для того, чтобы светить, и при том в тонком воздухе, потому что слишком густой воздух не пропускает лучей сквозь себя. Нуждается и в воде или в чем-нибудь другом, что ограничивало бы его действие, чтобы ему не произвести пожара. Если бы не было источников, ни озер, ни рек, ни морей, которые посредством испарений, выходящих из них, производят некоторую влажность, то солнце могло бы все попалить. Итак, видишь ли, что это за бог? Какое безумие! Какой смех! Так как, говорят, оно может вредить, то оно – бог. Напротив, потому-то оно и не бог, что для того, чтобы произвести вред, не нуждается ни в чьем содействии, а чтобы быть полезным, имеет нужду во многом другом. Богу несвойственно производить вред, – отнюдь, – Ему свойственно благотворить. Если же о солнце надобно сказать противное, то как же оно будет богом? Не видишь ли, что ядовитые лекарства производят вред, и (для этого) им не нужно больше ничего; но для того, чтобы доставить пользу, им нужно многое (другое)? Для тебя солнце создано и прекрасным и вместе бессильным: прекрасным, чтобы (по нему) ты познал Владыку, бессильным, чтобы ты не называл его своим владыкой. Но оно, говорят, питает растения и семена. Что же: ужели поэтому и навоз – бог? Ведь и он также питает растения. Для чего же уж не присоединить к этому серпа и рук земледельца? Укажи мне, где бы солнце одно произрастило (растения), не нуждаясь для этого ни в земле, ни в воде, ни в трудах земледельца; пусть оно само посеет семена и, согрев их лучом своим, произведет нам колосья. Если же это зависит не от него одного, а и от дождя, то почему же вода – не бог? Но пока не об этом речь. Почему земля – не бог? Почему навоз и заступ – не боги? Уже ли ж, скажи мне, всему этому должно поклоняться? Какое безумие! А между тем колос скорее вырастет без солнца, чем без земли и воды, равно как и деревья и все другое. Без земли не может быть ни одного (растения). Если же кто-нибудь, всыпав земли в глиняный сосуд, – как это делают дети и женщины, – и прибавив туда нужное количество навоза, становит этот сосуд под кровлей, то вырастают растения, хотя и слабые. Таким образом, существенное значение имеют земля и навоз, и их надобно почитать больше, чем солнце. Для того, чтобы солнце не производило вреда, нужно небо, нужен воздух, нужно столько вод, которые бы обуздывали его дикую силу и не позволяли лучу его, точно какому неукротимому коню, проникать всюду. Но, скажи мне еще, где бывает солнце ночью? Куда скрывается этот твой бог? Богу не свойственно подлежать стеснению и ограниченно; это именно свойственно только телам. Но, говорят, в нем есть какая-то сила и она движется. Что же, скажи мне, эта сила – бог? Отчего же она является недостаточной и не сдерживает огня? Я опять повторяю прежнее. Что это за сила? Есть ли это сила светящая, или она светит посредством солнца, сама не принимая в этом никакого участия? В таком случае солнце превосходнее ее. Впрочем довольно нам вращаться в этом лабиринте.'
      cn: '但是，他们说，我们的神是太阳。那么请告诉我，这是为什么，是出于什么原因呢？是因为它发出许多光吗？但难道你没有看到它如何被云层遮蔽，如何受制于自然必然性的法则，如何经历日食，被月亮和云层遮挡吗？尽管云层比它无力，却常常占据上风；这同样是上帝智慧的作为。上帝应当是全然自足的，而太阳却需要许多事物；这与上帝的本性不符。例如（太阳）需要空气才能发光，而且是稀薄的空气，因为过于浓密的空气无法让光线穿透。它也需要水或其它一些能限制其作用的东西，以免引发火灾。如果没有泉水、湖泊、河流和海洋，它们通过蒸发产生一定的湿气，那么太阳可能会将一切烧毁殆尽。


        那么，你看到了吗，这是怎样的神？何等荒谬！何等可笑！他们说，因为它能造成损害，所以它是神。恰恰相反，它之所以不是神，正是因为它造成损害时不需要任何协助，而要产生益处却需要许多其他事物。伤害绝非上帝的本性，祂的本性是施恩于人。如果对太阳必须说出相反的话，那它怎能是神呢？难道你没看到，有毒的药物会造成损害，（为此）它们不需要任何额外的东西；但若要提供益处，它们就需要许多（其他）东西吗？太阳被创造出来，既美丽又无力，是为了你：美丽，以便你借此认识主宰；无力，以便你不会称它为你的主宰。


        但是，他们说，它滋养植物和种子。那么：难道因此连粪肥也是神吗？因为它也滋养植物啊。为什么不把镰刀和农夫的双手也加进去呢？请你指出，在何处太阳能独自使（植物）生长，而不需要泥土、水分，也不需要农夫的辛劳；让它自己播种，然后用它的光线温暖种子，为我们结出麦穗吧。如果这不仅仅依赖于它，也依赖于雨水，那为什么水不是神呢？但现在我们不谈这个。为什么大地不是神？为什么粪肥和铲子不是神呢？难道，请你告诉我，所有这些都应该被崇拜吗？何等荒谬！


        然而，麦穗宁可在没有太阳的情况下生长，也不能没有泥土和水，树木和所有其他植物也是如此。没有土地，任何（植物）都无法存在。如果有人将泥土装入一个陶罐中——就像孩童和妇女所做的那样——并加入适量的粪肥，然后将这个罐子放在屋檐下，植物也会生长，尽管它们会很弱小。因此，泥土和粪肥具有更重要的意义，它们比太阳更值得尊敬。为了使太阳不造成损害，需要天空，需要空气，需要如此多的水分来遏制其野性的力量，不让它的光线如同脱缰的野马般无处不透。


        但是，你再告诉我，太阳在夜间去了哪里？你这个神藏匿到何处去了？上帝的本性是不受束缚和限制的；这恰恰只是身体的特性。但是，他们说，它里面有一种力量，而且这力量在运动。那么，请你告诉我，这种力量是神吗？为什么它却显得不足，无法抑制火焰呢？我再次重申之前的观点。这是怎样的力量？这是一种发光的力量吗，还是它通过太阳发光，自己却不参与其中？如果是这样，那么太阳就比它更优秀了。话虽如此，我们已无需在这个迷宫中继续打转了。'
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'А вода, говорят, ужели и она не бог? Вот и еще спор, подлинно достойный смеха! Как же не бог, говорят, вода, когда мы имеем в ней нужду в столь многих случаях? То же самое говорят и о земле. Вот уж именно говорящие это –«по суетности ума своего, помрачены в разуме». Впрочем, здесь (апостол) так выразился об их жизни. Язычники предаются блуду и прелюбодеянию. И понятно: изобретая себе таких богов, они согласно с этим поступают и во всем. Если только они могут скрыть (свои поступки) от взоров людей, то нет уже ничего, что могло бы удерживать их (от худых дел). Может ли, в самом деле, иметь для них какую-нибудь силу учение о воскресении, когда они считают его басней? А о мучениях в аду? Для них и это – басни; и, заметь, здесь внушение сатанинское. Когда им рассказывают о распутстве их богов, они не называют этого баснями, но верят. А когда им говорят о наказаниях, то они возражают: все это поэты выдумывают для того, чтобы повсюду расстроить счастливый порядок жизни.'
      cn: 他们说，难道水就不是神吗？这又是另一场争论，着实令人发笑！他们说，我们有这么多时候都需要水，水怎会不是神呢？他们对大地也这样说。那些说这话的人，真是「因着他们心思的虚妄，在悟性上昏暗了」。然而，在此（使徒）如此论及他们的生活。异教徒沉溺于淫乱和奸淫。这可以理解：他们为自己创造了这样的神，在一切事上便也照此行事。如果他们能把（自己的行为）隐藏起来，不被人看见，便再也没有什么能阻止他们（作恶）了。当他们认为复活的教导是无稽之谈时，它又怎能对他们有任何力量呢？至于地狱的苦楚呢？对他们来说，这也都是无稽之谈；而且，请注意，这是撒旦的诱导。当有人告诉他们关于他们神的放荡之事时，他们不称之为无稽之谈，反而相信。而当有人对他们提起惩罚时，他们却反驳说：「所有这些都是诗人编造出来的，目的是要到处扰乱幸福的生活秩序。」
  - type: paragraph
    text:
      ru: 'Но философы, говорят они, изобрели нечто, вполне заслуживающее внимания и лучшее этих (басней). Какие же это философы? Ужели те, которые выдумали судьбу и утверждают, что все существует без Провидения, нет зиждительного Промысла, все сложилось из атомов? Но, говорят, другие признали Бога действительным бытием (οώμα). Какие же это, скажи мне? Те, которые производят души человеческие от душ собак и уверяют людей, что в известное время тот или другой из них был собакой, львом, рыбой? Доколь не перестанете пустословить,«помрачены в разуме»? И подлинно они как в рассуждении догматов, так и касательно жизни, все говорят и делают так, как бы находились в темноте; человек, окруженный мраком, не видит ничего пред собой, он веревку принимает за ползущего змея, или, зашедши в тесное место, думает, что его схватил человек или демон. И сколько тут страха и беспокойства! Подобных же вещей боятся (и язычники).«Там убоятся они страха, – сказано, –[где нет страха]»(Пс. 13:5), а чего бы следовало страшиться, того они не страшатся. Подобно тому, как дети, находясь на руках у своих кормилиц, неразумно протягивают руки к огню, и смело порываются к зажженному светильнику, а между тем боятся человека в одежде из козьей шерсти, так и эти эллины – настоящие младенцы, как и сказал об них некто: «эллины – всегда дети». Того, что не составляет греха, они боятся, как-то: телесной неопрятности, похорон, катафалков, тяжелых дней и тому подобного. А того, что составляет настоящий грех, как-то: сладострастной любви к отрокам, прелюбодеяния, блуда, – они и не думают считать за грех. Ты можешь видеть, как (язычник) обмывается после мертвеца, но от мертвых дел он не омывается никогда. Он много прилагает старания о приобретении денег, и в то же время думает, что одно пение петуха может разрешить всякое (недоумение). Так они помрачены разумом. Душа их преисполнена множества примет. Например, такой-то, говорят, первый встретился со мной, когда я выходил из дому: непременно случится тысяча неприятностей для меня. Сегодня ненавистный слуга, подавая мне обувь, поднес наперед левую: быть большим бедам и напастям. Сам я, выходя из дому, ступил за порог левой ногой: и это предвещает несчастья. Это – домашние неудачи. Когда же я вышел из дому, у меня правый глаз мигнул: быть слезам. Равным образом и женщины, – когда тростниковые прутья, ударившись о ткальное древко, издадут звук, или сами они оцарапают себя гребнем, – принимают это за худое предзнаменование; опять, когда они заденут основой о гребень и очень сильно, потом верхние прутья, ударившись о древко, от напряженного удара издадут звук, то и это считают за предвестие несчастья, и тысячи других у них достойных смеха (суеверий). Закричит ли осел, или петух, чихнет ли кто, и вообще, что бы ни случилось, все их тревожит, так что они, – как я сказал, – точно скованы тысячами уз, точно находятся во мраке, во всем подозревают (худое) и гораздо больше порабощены, чем тысячи невольников. Но не будем мы такими; напротив, осмеявши все такие (суеверия), – как живущие в свете, как небесные граждане, не имеющие ничего общего с землей, – будем считать для себя страшным один только грех и оскорбление Бога. Если все это пустяки, то и посмеемся над этим, равно как и над первым виновником этого – дьяволом. Возблагодарим Бога и будем стараться, чтобы нам самим никогда не впасть в такое рабство, а если кто из наших друзей будет пленен, разорвем его узы, освободим его от этого несносного и постыдного заключения, сделаем его способным для восхождения к небу, выпрямим его опустившиеся крылья и научим его любомудрию касательно жизни и веры. Возблагодарим Бога за все и будем умолять Его, чтобы нам не оказаться недостойными врученного нам дара; с тем вместе, позаботимся и о том, что от нас зависит, именно, чтобы нам поучать других не только словами, но и делами. От этого мы сможем получить бесчисленные блага, которых и да сподобимся все мы, благодатью и человеколюбием Господа нашего Иисуса Христа, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.'
      cn: '然而，他们说，哲学家们发明了某种完全值得关注且胜于这些（寓言）的东西。这些都是些什么哲学家呢？难道是那些虚构了命运，并宣称万物皆无神佑，没有创造性的神旨，一切都由原子构成的人吗？然而，他们说，另一些人则承认上帝为实在的实体（οώμα）。告诉我，这些人又是谁呢？是那些将人的灵魂源自狗的灵魂，并向人们保证，在某个特定时间，他们中某人曾是狗、狮子或鱼的人吗？你们这些「心智昏昧」的人，要到几时才肯停止这空洞的言语呢？


        确实，他们在教义上和生活方面，言行举止都如同身处黑暗之中；被黑暗包围的人，眼前一无所见，他会把绳索当作爬行的蛇，或者，进入狭窄之处，以为自己被某人或邪魔抓住了。这里有多少恐惧和不安啊！ （异教徒）也害怕类似的事物。「他们在那地必大大惧怕，[那里没有可惧怕的]」（诗篇 13:5），经上说，而他们本该惧怕的，却毫不惧怕。就像孩童在乳母怀中，不理智地伸出手去触火，大胆地扑向燃着的灯，然而却害怕身穿山羊毛衣的人；同样，这些希腊人——真正的婴孩，正如某人论及他们时所说：「希腊人永远是孩童。」


        他们惧怕那些并非罪恶之事，例如：身体的不洁、葬礼、灵柩、不祥之日等等。而那些构成真正罪恶之事，例如：对少年人的淫爱、奸淫、淫乱——他们却根本不认为那是罪。你可以看到（异教徒）在接触死者后沐浴，但他却从不洗去他的「死行」。他费尽心力去赚钱，同时却认为一声鸡鸣就能化解所有的（困惑）。他们就是这样心智昏昧。他们的灵魂充满了各种预兆。例如，他们说，某某人是我出门时第一个遇到的人：我必将遭遇千般不顺。今天，那个可恨的仆人给我递鞋时，先递了左脚的鞋：将会有大祸临头。我自己出门时，左脚先迈过门槛：这也预示着不幸。这是家中的不顺。当我出门时，我的右眼跳动：将会有泪水。同样，妇女们——当苇秆撞击织布机轴发出声音，或者她们自己用梳子划伤身体时——都将此视为不祥的预兆；再次，当她们用经线非常用力地刮擦梳子，接着上方的秆子因强力撞击织布机轴而发出声响时，这也都被她们视为不幸的预兆，以及其他成千上万可笑的（迷信）。


        驴子叫，或公鸡啼，或有人打喷嚏，总之，无论发生什么，都让他们感到不安，以至于他们——正如我所说——仿佛被千条绳索捆绑，仿佛身处黑暗之中，对一切都疑心（不祥），且比千万奴隶受更深的奴役。但我们不应如此；相反，我们作为生活在光明中、作为与尘世毫无瓜葛的天上公民，应当嘲笑所有这类（迷信），只将罪和冒犯上帝视为可怕之事。如果所有这些都是无稽之谈，我们就当嘲笑它们，以及这一切的始作俑者——魔鬼。我们要感谢上帝，并努力使自己永不陷入这样的奴役；若有朋友被囚禁，我们就当撕裂他的枷锁，将他从这种难以忍受且可耻的囚禁中解救出来，使他有能力升向天堂，扶正他下垂的翅膀，教导他有关生命与信仰的智慧。我们要为这一切感谢上帝，并恳求祂，使我们不致辜负祂所赐予我们的恩赐；与此同时，也要尽我们所能，即不仅以言语，更要以行为教导他人。由此，我们便能获得无数的福祉，愿我们众人，借由我们的主耶稣基督的恩典和爱人之心，都能蒙受这些福祉，并与父及圣灵一同享有荣耀、权柄、尊贵，从今时直到永远，世世代代。阿们。'
