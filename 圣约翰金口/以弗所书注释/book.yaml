  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Устроив такое войско, пробудив в нем воинственный дух (а нужно было и то и другое, т. е. – не только воины, но и воинственный дух в них) и, ободрив его (а это также было нужно), наконец (Павел) и вооружает это войско. Ведь никакой пользы не будет от оружия, если прежде не будут собраны воины и в душах их не будет возбуждено мужество. Сначала надлежит вооружить их изнутри, а потом уже извне. Если так бывает в отношении к воинам, сражающимся против внешних врагов, то тем более так должно быть в отношении к воинам духовным, которым свойственно вооружаться не с внешней стороны, но всецело с внутренней. И (апостол) пробудил и воспламенил храбрость, придал смелости, поставил их в добром порядке, – и затем вооружает их. Но смотри, как облекает их в самое оружие.«Итак станьте», – говорит он. Первое дело строевых – уметь хорошо стоять: от этого зависит многое. Потому (и апостол) нередко беседует о том, что должно стоять. Так, и в другом месте он говорит:«Бодрствуйте, стойте»(1Кор. 16:13); и опять:«стойте так в Господе»(Фил. 4:1); или еще:«кто думает, что он стоит, берегись, чтобы не упасть»(1Кор. 10:12): а также:«чтобы вы могли перенестивсе» (1Кор. 10:13). И заметь: не о простом каком-нибудь стоянии он говорит, но о стоянии стройном. Опытные в воинских делах понимают, что значит умение стоять. Если кулачникам и борцам учитель прежде всего другого преподает искусство стоять, то гораздо более нужно это в сражениях, вообще в воинских делах. Кто прямо стоит, тот стоит, не развлекаясь и ни к чему не наклоняясь. В стоянии видна строгая прямота. Итак, действительно прямые стоят. А кто не стоит, те не сохраняют прямого положения, развлекаются и предаются рассеянности. Тот, кто ищет удовольствий, находится не в прямом, а в наклонном положении, равным образом и человек сладострастный, и сребролюбец. Умеющему стоять самое стояние может служить как бы некоторой опорой, и все, касающееся борьбы, ему представится легким.'
      cn: '组织了这样一支军队，唤醒了其中的战士精神（这两者都是必需的，即——不仅要有士兵，而且要有他们内部的战士精神），并鼓舞了他们（这同样是必需的），最后（保罗）武装了这支军队。须知，如果士兵未曾集结，并且他们心中未曾激发勇气，那么武器将毫无益处。首先，应当从内部武装他们，然后才是从外部。如果对付外敌的士兵尚且如此，那么对于属灵的战士就更应如此，他们理应不从外部，而是全然从内部武装自己。而（使徒）唤醒并燃起了他们的勇气，赋予了他们胆量，使他们站立得井然有序，——然后武装了他们。但请看，他是如何将他们披上武器的。


        他说：「所以要站稳了。」对列队者来说，首要之事是懂得如何站稳：许多事情都取决于此。因此（使徒）经常谈论关于站稳的事。比如，他在另一处说：「你们要警醒，在信德上站稳了」（哥林多前书 16:13）；又说：「你们在主里要这样站稳了」（腓立比书 4:1）；或又说：「所以自己以为站得稳的，要谨慎，免得跌倒」（哥林多前书 10:12）；以及：「使你们能忍受一切」（哥林多前书 10:13）。并且请注意：他所说的并非某种简单的站立，而是指规整的站立。军事事务经验丰富的人懂得站立的技巧意味着什么。如果连教拳击手和摔跤手的老师，都首先教导他们站立的艺术，那么在战役中，总而言之在军事事务中，这更是无比需要。笔直站立的人，他站着，不分心，也不向任何事物倾斜。在站立中可见严格的正直。因此，真正正直的人是站立的。而那些不站立的人，他们不保持正直的姿态，心神分散，沉溺于散漫。寻求享乐之人，处于不直立而倾斜的姿态，纵欲者和贪财者亦然。对懂得站立的人来说，站立本身就可以成为某种支撑，所有与争战相关的事，对他而言都会显得轻而易举。'
  - type: paragraph
    text:
      ru: '«Итак, станьте,– говорит, –препоясав чресла ваши истиною». Не о чувственном препоясании говорит (апостол); в этом месте он выражается иносказательно. И заметь, как он поступает: сначала облекает воина поясом. Что это значит? Человека рассеянного и преданного пожеланиям, у которого помыслы устремлены долу, он обуздывает посредством опоясания, не допуская его таким образом терпеть препятствие от одежд, покрывающих его голени, и давая ногам его полную свободу бежать.«Итак станьте, – говорит, –препоясав чресла ваши». Говорит здесь о чреслах, потому что как для кораблей киль, так для нас чресла: они – опора всего тела. По словам врачей, они составляют основание, и на этом-то основании строится все (тело). Когда же он опоясывает чресла, то тем самым укрепляет нашу душу, – потому что он разумеет не телесные чресла, но чресла в смысле духовном. И как (телесные) чресла служат основанием для нижних и верхних частей тела, так точно и духовные чресла. Часто больные, опуская на них, как на какую подпору, свои руки, тем самым подкрепляют себя. Равно и пояс для того и употребляется на войне, чтобы сберечь и охранить наше основание. Чтобы нам было удобнее бежать, мы опоясываем себя: это обеспечивает нашу силу. Пусть то же, говорит (апостол), наблюдается и в отношении к душе, и тогда во всех делах своих мы будем иметь более силы. Особенно это прилично воинам. Да, скажут, но телесные чресла мы опоясываем кожаным поясом; а здесь чем опояшемся? Главой наших помыслов, т. е., истиной."Препоясав, – говорит, –чресла ваши истиною». Итак, оставим всякую ложь, будем поступать во всем по истине, не будем обманывать друг друга. Славы ли станем искать, – славы истинной, жизни ли желать, – жизни истинной. Если мы оградим себя этим, если опояшемся истиной, то никто нас не одолеет. Кто ищет истины, тот не пристращается к земле, потому что все неистинное – от земли. Это видно из того, что все внешние (язычники) служат страстям, следуя собственным мудрованиям. А потому, если мы будем трезвиться, то не будем нуждаться в учении, заключающемся в сочинениях эллинов. Видишь ли, как они были слабы и бессильны, как не могли принять ни одного здравого и превышающего ум человеческий понятия о Боге? Они не были препоясаны истиной. Потому-то и ослабли их чресла этот приемник родотворных семян, это укрепление помыслов. Нет ничего бессильнее их.'
      cn: '「因此，你们要站稳了，」他说，「用真理束上你们的腰。」使徒所说的，并非感官上的束腰；在此处他是用寓言的方式表达的。你看他是如何做的：首先用腰带将战士武装起来。这意味着什么呢？对于一个心神涣散、沉溺于欲望、思想低垂的人，他通过束腰的方式加以约束，使他不致因衣袍遮蔽小腿而受阻碍，让他的双脚得以完全自由地奔跑。「因此你们要站稳了，」他说，「束上你们的腰。」他在此处所说的腰，因为腰对我们而言，就如同龙骨之于船只：它们是整个身体的支撑。据医生们说，它们构成基础，整个身体就是建立在这个基础上的。


        当他束上腰时，那便借此坚固我们的灵魂——因为他所指的并非肉身的腰，而是灵性意义上的腰。正如（肉身的）腰是身体上下各部分的基础，灵性的腰也正是如此。病患常将手放在腰上，以此作为支撑，借此强固自身。同样，腰带在战争中也是为此目的而使用的，以保存和保护我们的基础。为了让我们更方便奔跑，我们束上腰：这能确保我们的力量。使徒说，让同样的情况在灵魂方面也得以遵循，这样我们就会在一切行动中拥有更大的力量。这尤其适合战士。是的，他们会说，我们用皮带束上肉身的腰；但在此处，我们该用什么来束腰呢？用我们思想的纲领，亦即真理。「束上你们的腰，」他说，「用真理。」


        因此，让我们弃绝一切谎言，在一切事上按真理行事，不要彼此欺骗。若我们寻求荣耀——就寻求真正的荣耀；若我们渴望生命——就渴望真正的生命。若我们以此为自己设防，若我们用真理束腰，便无人能战胜我们。凡寻求真理者，便不依恋大地，因为一切不真实的都来自大地。这从以下事实可见：所有外邦人（异教徒）都服事情欲，遵从自己的私意。因此，若我们保持警醒，就不需要希腊人著作中所包含的学说。你看他们是多么的软弱无力，多么不能接受一个关于上帝的健全而超越人类理智的观念？他们没有用真理束腰。因此他们的腰就软弱了——那生育种子之所，那思想的坚固之处。没有什么比他们更软弱无力的了。'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Не видишь ли, с другой стороны, как манихеи дерзко говорят обо всем по своим собственным мудрованиям? Невозможно было, говорят они, чтобы Бог без материи сотворил мир. Откуда это видно? Так говорят они, пресмыкаясь долу, – от земли заимствуя это и от того, что нам (людям) свойственно. Ведь человек, говорят они, не может иначе делать. Затем послушай, что еще говорит Маркион: Бог, воспринявши плоть, не мог остаться чистым. Из чего это видно? Из того, что не бывает этого у людей. Валентин, в свою очередь, имея обращенные к земле помыслы, тоже рассуждает по земному; подобным же образом учат и Павел самосатский и Aрий. Что, например, говорит (последний)? Рождающийся Бог не мог родиться бесстрастно. Почему ты осмелился сказать это, Арий? Потому, что (о Боге стал рассуждать) по-человечески. Итак, замечаешь, что у всех помыслы обращены долу, что у всех они ослаблены и дышат землей? Таковы (еретики) в отношении к учению веры. Что же касается деятельности, то они любодеи, сребролюбцы, они привязаны к земле, к славе и всему прочему. У них нет крепких чресл, – таких, чтобы, в случае болезни, можно было в них найти опору. Когда же они сделаются больными, они не кладут на них рук своих, и не стоят прямо, а ослабевают. Напротив, препоясанный истиной, во-первых, никогда не почувствует изнеможения; во-вторых, хотя бы он и утомился, все же получит подкрепление в той же истине. В самом деле, скажи мне, заставит ли страдать его бедность? Нисколько. Мысль об истинном богатстве успокоит его, а бедность напомнит ему об истинной нищете (духовной). Не покажется ли ему тяжким рабство? Ни мало, потому что он знает истинное рабство. Быть может, болезнь? И она – нет.'
      cn: 你难道没有看到吗，另一方面，摩尼教徒是如何僭越地依据他们自己的思辨谈论万事万物的呢？他们说，上帝在没有物质的情况下创造世界是不可能的。这从何看出呢？他们如此说，是匍匐在地，从大地借取此理，并从我们（人类）的本性中获取此理。他们说，因为人不能以其他方式行事。接着请听马吉安又说了什么：上帝一旦取了肉身，就无法保持纯洁。这从何看出呢？从人类不会发生此事看出。瓦伦廷，反过来，思想转向尘世，也依循尘世的方式推理；萨摩撒他的保罗和亚略也以同样的方式教导。例如，（后者）说了什么？诞生的上帝无法以无情欲的方式诞生。亚略，你为何胆敢说这话？因为（他开始用）人的方式（讨论上帝）。那么，你注意到吗，他们的思想都转向了尘世，他们的思想都软弱无力并沾染着尘土的气息？对于信仰的教义，这些（异端）就是如此。至于他们的行为，他们是淫乱者，贪爱钱财者，他们依恋尘世，依恋荣耀以及所有其他事物。他们没有坚固的腰肢，无法在疾病之时，在其中找到支撑。当他们生病时，他们不自我扶持，也不站立笔直，而是衰弱下去。相反地，被真理束腰之人，首先，永远不会感到虚弱；其次，即使他疲惫不堪，仍然会在同一真理中获得力量。确实，请告诉我，贫困会让他受苦吗？丝毫不会。对真正财富的思索会使他平安，而贫困会提醒他真正的贫乏（精神上的）。奴役会让他感到沉重吗？丝毫不会，因为他知晓真正的奴役。也许是疾病呢？它也不会。
  - type: paragraph
    text:
      ru: '«Да будут чресла ваши, – говорит Христос, –препоясаны и светильники горящи»(Лк. 12:35), чтобы иметь вам свет неугасимый. Это заповедано было делать и при исходе из Египта, – препоясанные ели тогда пасху. Для чего, спрашивают, так было? Хотите знать основание этому из истории, или из соображений? Я скажу и то и другое, а вы запомните. Я не просто делаю это, чтобы только ответить на вопрос, но имея в виду, чтобы слова наши обратились у вас в дело. Были, повествуется, препоясаны, имея жезлы в руках своих и сапоги на ногах, и так ели пасху (Исх. 12:11). Страшное и ужасное таинство, и к тому же заключающее в себе много глубины. Если же в прообразе таинство так страшно, то тем более в самой истине. Выходят из Египта и едят пасху. Внимай: это образ странников. Иметь сапоги на ногах и жезлы в руках и есть стоя – не что другое значит, как именно это. Что вы хотите прежде выслушать – историю или соображения? Лучше историю. Итак, что говорит история? Иудеи были неблагодарны и постоянно забывали благодеяния Божьи. Потому, желая хоть насильно приводить им на память (благодеяния), (Бог) узаконивает такой способ вкушения пасхи. Для чего? Для того, чтобы каждый год, по необходимости, соблюдая это узаконение, также необходимо воспоминали изведшего их Бога. Не одним временем (пасхи) Бог хотел напоминать им Свои благодеяния, но и самым образом вкушения ее. Для того и едят они, опоясанные и обутые, чтобы, когда спросят их об этом, отвечали, что мы готовы были к путешествию и намеревались выйти из Египта в землю обетованную. Таково значение образа согласно истории; но вот истина: и мы также вкушаем пасху, т. е. Христа,«Пасха наша, – как сказано, –Христос, заклан за нас»(1Кор. 5:7). Стало быть, и мы вкушаем пасху, которая гораздо превосходнее пасхи законной. Поэтому и мы должны вкушать ее также обутые и препоясанные. Для чего? Для того, чтобы и нам быть готовыми к путешествию, к исходу отсюда. Никто из вкушающих эту пасху не должен помышлять о Египте, напротив должен стремиться к небу, к вышнему Иерусалиму. Для того ты и вкушаешь опоясанный и обутый, чтобы ты помнил, что, начиная вкушать пасху, ты обязываешься идти в дорогу, путешествовать. Это обозначает две обязанности: во-первых, обязанность – оставить Египет и (на земле) жить так, как бы это была для нас чуждая страна, потому что сказано:«Наше же жительство – на небесах»(Фил. 3:20); во-вторых, обязанность – всегда, во всю жизнь быть готовыми к тому, чтобы, когда станут звать нас, немедленно сказать:«Готово сердце»наше (Пс. 107:2). Впрочем, так мог говорит Павел, которого совесть ничем не была запятнана. Что же касается до меня, то я не могу сказать так, потому что мне много нужно времени для покаяния. А что быть препоясанным значит – иметь бодрствующую душу, об этом послушай, как говорит Бог одному праведнику:«Препояшь ныне чресла твои, как муж: Я буду спрашивать тебя, и ты объясняй Мне»(Иов. 38:3). То же говорит Он ко всем святым, то же и к Моисею. Даже сам является препоясанным у Иезекииля. Ангелы также являются нам опоясанными, как бы они были настоящие воины. Чтобы стоять мужественно, для этого нужно опоясаться. Но, с другой стороны, опоясать себя можно не иначе, как стоя.'
      cn: 基督说：「你们的腰当束上，灯也当点着」（路加福音 12:35），为要使你们有不灭的光。这在出埃及时也曾被吩咐要这样行，那时他们是束着腰吃逾越节的筵席的。人们问道：为何会如此？你们是想从历史中，还是从理据中，了解其缘由呢？我将两者都告诉你们，而你们要记在心里。我这样做并非只是为了回答问题，而是为了让我们的言语在你们那里化为行动。据记载，他们束着腰，手里拿着杖，脚上穿着鞋，就这样吃逾越节的筵席（出埃及记 12:11）。这是一个令人敬畏且深奥的奥秘，其中蕴含着许多深度。如果作为预象的奥秘都如此可畏，那么在真理本身中就更是如此了。他们走出埃及，吃逾越节的筵席。请留意：这是客旅的形象。脚上穿着鞋，手里拿着杖，站着吃，其意义无非正是如此。你们想先听什么——历史还是理据？还是先听历史吧。那么，历史说了些什么呢？犹太人忘恩负义，常常忘记上帝的恩典。因此，上帝为了即使是强迫他们铭记（恩典），便制定了这种吃逾越节筵席的方式。为何呢？为要使他们每年必须遵守这项律法，也必须记念领他们出来的上帝。上帝不仅想通过（逾越节）的时间来提醒他们祂的恩典，也通过吃逾越节的方式来提醒。因此，他们束着腰，穿着鞋吃，是为了当有人问及此事时，他们会回答说，我们已经为旅行做好了准备，并打算从埃及前往应许之地。这就是根据历史的预象之意义；然而真理是：我们也吃逾越节的羔羊，即基督，正如所说的：「我们逾越节的羔羊基督，已经被杀献祭了」（哥林多前书 5:7）。因此，我们也吃逾越节的羔羊，这羔羊远比律法上的逾越节羔羊更优越。所以，我们也当穿着鞋，束着腰来吃它。为何呢？为要使我们也为旅程，为从这里离开做好准备。凡是吃这逾越节的羔羊的人，都不可思想埃及，反而当渴望天国，渴望那在上的耶路撒冷。你束着腰，穿着鞋吃，是为了要你记住，当你开始吃这逾越节的羔羊时，你便有责任踏上旅途，去旅行。这表示两项义务：第一，义务是离开埃及，（在地上）生活得如同这里是我们的异乡，因为经上说：「我们的家乡是在天上」（腓立比书 3:20）；第二，义务是——一生一世随时做好准备，以便当呼唤我们时，我们能立刻说：「我心坚定」（诗篇 107:2）。然而，这样的话只有保罗能说，因为他的良心毫无瑕疵。至于我，我不能这样说，因为我需要很多时间悔改。至于束腰意味着拥有警醒的灵魂，请听上帝如何对一位义人说：「你要如勇士束腰；我问你，你可以告诉我」（约伯记 38:3）。祂也对所有的圣徒这样说，也对摩西这样说。甚至祂自己也在以西结书中显现为束着腰的形象。天使也向我们显现为束着腰的样子，仿佛他们是真正的战士。为了勇敢地站立，为此就需要束腰。然而，另一方面，一个人只有在站立的时候才能束上腰。
  - type: paragraph
    text:
      ru: Препояшем же и мы себя. И нам также предстоит выйти, и много потом придется нам испытать трудностей. Когда мы проходим через эту область, тотчас является дьявол, начинает хитрить, употреблять все меры к тому, чтобы людей, которые избавились от Египта, перешли Чермное море, освободились от демонов и неисчислимых бед, – взять и погубить. Но, если будем бодрствовать, то и у нас будет столп огненный, – благодать Духа, Который освещает нас и осеняет, – будет манна, или лучше сказать, не манна, а то, что превосходнее манны, – будет духовное питие, а не вода, истекающая из камня, будет и станет для нас живущих и теперь в пустыне. Да! Земля, в настоящее время – совершенная пустыня, по недостатку добродетели, даже более пустыня, чем та. По какой причине бегали той пустыни? Не по той ли, что она имела и до сих пор имеет скорпионов? По ней, говорят, не проходил человек. При всем том пустыня та все же не так была бесплодна, как человеческая природа.
      cn: '我们也要束上自己的腰。我们也面临着要走出去，之后将不得不经历许多艰难。当我们穿过这个区域时，魔鬼立刻出现，开始施展诡计，用尽一切手段，来掳掠和毁灭那些已经脱离埃及、渡过红海、摆脱了魔鬼和无数灾祸的人。


        但是，如果我们警醒，那么我们也将有火柱，——圣灵的恩典，祂光照并荫蔽我们，——将会有吗哪，或者说，不是吗哪，而是比吗哪更优越的东西，——将会有属灵的饮品，而不是从磐石流出的水，这将为我们这些现今活在旷野中的人而存在，并成为我们的供应。是的！这大地，现今因缺少美德而成为一片彻底的旷野，甚至比那片旷野更加荒芜。人们为何要逃离那片旷野呢？难道不是因为它曾经有，并且直到现在仍然有蝎子吗？据说，没有人穿过它。尽管如此，那片旷野仍然不像人类本性那般贫瘠。'
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Ныне в этой пустыне сколько скорпионов, сколько змей, сколько порождений эхиднинных, – о чем мы уже говорили! Впрочем, это не должно устрашать нас. Нашим исходом (из Египта) предводительствует не Моисей, а Иисус. Но, опять, под каким условием мы этого избегнем? Под тем, чтоб мы не делали того же, – тогда и не подвергнемся той же участи. Те роптали, были неблагодарны. Поэтому нам этого дозволять себе не следует. За что те все пали? За то, что вознерадели о земле, которой так сильно желали. Отчего вознерадели? Ведь они пред ней благоговели? Оттого, что вышли изнеженными и не хотели ради нее переносить неудобств (странствования). Поэтому не будем пренебрегать небом: это и есть пренебрежение. С неба нам принесен плод – не такой плод, как виноградная кисть, которую носят в корзинах, но – обручение Духа, правило небесной жизни, которому учили Павел и весь лик апостольский, эти чудные земледельцы. Не Халев, сын Иефонии, и не Иисус, сын Навина, принес эти плоды; но Иисус, Сын Отца щедрот, Сын истинного Бога, принес с Собой всякое благополучие и ниспослал нам свыше все плоды, – разумею небесные песни. То самое, что херувимы вещают горе, – и нам заповедано говорить: «Свят, свят, свят». Он принес нам житие ангельское. Ангелы ни женятся, ни посягают: то же благо насаждено и здесь. Ангелы не любят денег и ничего подобного: и это посеяно у нас. Ангелы не умирают: и оно нам даровано; смерть ныне перестала быть смертью, по сделалась сном. Послушай, что говорит (Господь):«Лазарь, друг наш, уснул»(Иоан. 11:11). Видишь ли плоды горнего Иерусалима? И что особенно удивительно – даровал нам (Господь) все это до обетования, прежде окончания войны. Израильтянам, по вступлении в обетованную землю, предстояли воинские труды, хотя, впрочем, они могли бы и не трудиться; им стоило только повиноваться Богу, – и они без орудия и полков взяли бы все города; например, Иерихон они завоевали, имея вид более праздничный, нежели воинский. А когда мы вступим в землю обетования, т. е. на небо, то нам не нужно будет вести войны. Она продолжается только до тех пор, пока находимся в пустыне, т. е. в настоящей жизни.«Ибо, кто вошел в покой Его, тот и сам успокоился от дел своих, как и Бог от Своих»(Евр. 4:10).«Делая добро, да не унываем»(Гал. 6:9). И мы пожнем в свое время, если не ослабнем. Видишь ли, что каким путем вел Господь их (израильтян), тем же ведет и нас? О манне в пустыне сказано:«и у того, кто собрал много, не было лишнего, и у того, кто мало, не было недостатка»(Исх. 16:18). А нам заповедано – не собирать сокровищ на земле.'
      cn: '现今在这旷野中，有多少蝎子，多少毒蛇，多少蝰蛇的孽种——对此我们已有所论及！然而，这不应使我们恐惧。引领我们出离（埃及）的，不是摩西，而是耶稣。但是，我们又当在何种条件下才能避免这一切呢？条件就是我们不做同样的事——如此便不会遭受同样的结局。他们发怨言，心存不感恩。所以我们不应容许自己如此。他们为何都倒毙了？因为他们轻忽了那片他们如此渴望的土地。为何轻忽了呢？他们不是曾对它心存敬畏吗？因为他们出来时过于娇惯，不愿为了它而忍受（漂泊的）不便。所以，我们不要轻蔑天国：这正是轻蔑的行为。


        从天上赐给我们一个果实——这果实不像人以篮子盛装的葡萄串，而是圣灵的订婚之约，是天国生活的法则，是保罗和全体使徒群体、这些奇妙的农夫所教导的。带来这些果实的，不是耶孚尼的儿子迦勒，也不是嫩的儿子约书亚；而是耶稣，那充满丰盛慈爱的天父的儿子，真上帝的儿子，祂带着一切福乐而来，并从上天赐予我们所有的果实——我指的是天上的颂歌。基路伯在天上所宣扬的，——我们也蒙命如此宣讲：「圣哉，圣哉，圣哉」。祂赐给我们天使般的生活。天使不嫁娶：同样的福祉也在此处被栽植。天使不爱金钱和诸如此类的事物：这也已播种在我们心中。天使不死：这恩赐也已赐予我们；死亡如今已不再是死亡，而是化作了睡眠。请听（上主）所言：「我们的朋友拉撒路睡着了」（约翰福音 11:11）。你可曾看到那属天耶路撒冷的果实？尤其令人惊奇的是——（上主）在应许之先，在战争结束之前，就将这一切赐予了我们。


        以色列人进入应许之地后，面临着征战的劳苦，然而，实际上他们本可以不必劳苦；他们只需顺服上帝，——便可不靠兵器和军队攻取所有城邑；例如，他们攻占耶利哥时，其情景与其说是战事，不如说是节庆。当我们进入应许之地，亦即天国时，我们便不再需要进行战争。战争只持续到我们身处旷野之时，亦即在今生之中。「因为那进入安息的，也就在他的工作上安息了，正如上帝在祂自己的工作上安息一样」（希伯来书 4:10）。「我们行善，不可丧志」（加拉太书 6:9）。我们若不灰心丧志，就必在适当时候收割。你可曾看到，上主如何引导他们（以色列人），也如何引导我们吗？关于旷野中的吗哪，经上说：「多收的没有余，少收的也没有缺」（出埃及记 16:18）。而我们则蒙命——不要在地上积攒财宝。'
  - type: paragraph
    text:
      ru: Если же собираем, то уже не чувственный червь будет истреблять их, как это было с манной, а совечный огню. Итак, употребим все меры к тому, чтобы не приготовить пищи червям.«И у того, кто собрал много, не было лишнего», – сказано. Это явление может повторяться и между нами каждый день. Все мы, конечно, обязаны наблюдать одну, определенную меру, при насыщении желудка, а излишнее будет только прибавлением безумных хлопот. Это именно (и Господь) хотел внушить словами:«довольно длякаждогодня своей заботы»(Мф.6:34). Тому же учил Он выше. И, однако ж, Его правило не усвоено (людьми). Но мы не будем ненасытны, неблагодарны, не станем сооружать великолепных домов. У нас нет здесь постоянного жилища, мы находимся в пути. И кто помнит, что настоящая жизнь есть как бы странствование и воинская служба, что это – как некоторые выражаются – яма, тот не станет наживать себе великолепных палат. Да и в самом деле, кто, скажи мне, решится строить блестящие дома в яме, хотя бы он был страшный богач? Никто. Это было бы смешно, значило бы строить для врагов и тем больше привлекать их к себе. Если у нас есть рассудок, то и нам нужно поступать таким образом. Настоящая жизнь ничем не отлична от воинской службы и похожа на яму. Итак, умоляю вас, употребим все меры к тому, чтобы не собирать здесь сокровищ. Тогда, если и вор придет, нам легче будет уйти.«Итак, бодрствуйте, – говорит (Господь), –потому что не знаете, в который час...татьпридет"(Мф. 24:42–43), – татем Он называет смерть. Поэтому лучше до ее прихода отправить нам все (свои пожитки) в наше отечество. Здесь же будем ходить хорошо препоясанные, чтоб одолеть врагов и за это сподобиться в тот день венцов нетленной славы, благодатью и человеколюбием Господа нашего Иисуса Христа, с Которым Отцу со Св. Духом (слава, держава, честь, ныне и присно, и во веки веков. Аминь).
      cn: 如果我们积攒，那么毁灭它们的将不再是感官的虫子，就像吗哪所遭遇的那样，而是那与火同在、永恒的虫子。因此，让我们竭尽全力，不要为虫子预备食物。「和那多收的，也没有余溢，」——经上说。这种现象每天都可能在我们中间重演。我们所有人当然都有义务在饱足胃口时遵守一个确定的限度，而过剩的只会徒增无谓的烦恼。这正是（主）想要用话语教导的：「一天的难处一天当就够了」（马太福音 6:34）。祂在上面也教导了同样的事情。然而，祂的教诲并未被人领会。但我们不要贪得无厌，不要忘恩负义，不要去建造华丽的房屋。我们在这里没有长存的居所，我们正行在旅途上。并且谁若记得，现世生命不过是客旅和军役，如某些人所言，它是个深坑，那人就不会为自己积攒华美的殿宇。况且，实实在在地，告诉我，谁会胆敢在深坑里建造辉煌的房屋，即便他富甲天下？没有人。那将是可笑的，这意味着为敌人建造，从而更吸引他们前来。如果我们有理性，那么我们也当如此行事。现世生命与军役毫无二致，且像一个深坑。因此，我恳求你们，让我们竭尽全力，不要在此积攒财宝。那么，即使有贼前来，我们也能更容易地离开。「所以，你们要警醒，因为不知在什么时候……贼要来」（马太福音 24:42-43），——主说，祂称那贼为死亡。因此最好在它到来之前，将我们所有的（财物）送往我们的家乡。在此，我们当束好腰带行走，为要战胜仇敌，并因此在那日，蒙恩配得不朽荣耀的冠冕，借着我们主耶稣基督的恩典与慈爱，祂与父及圣灵（同享荣耀、权能、尊贵，从今时直到永远，世世代代。阿们）。
