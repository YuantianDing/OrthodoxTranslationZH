  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Павел везде, сколько мог, старался показать неизреченное человеколюбие к нам Божие. Что он не в состоянии был показать во всей полноте, об этом послушай, как сам он говорит:«О, бездна богатства и премудрости и ведения Божия! Как непостижимы судьбы Его и неисследимы пути Его!»(Рим. 11:33)! Впрочем, сколько мог, показывает. Что же говорит он?«В Нем мы и сделались наследниками, быв предназначенык тому". Выше сказал:«Избрал нас»; здесь же говорит:«сделались наследниками»(έχληρώδημενотχληρόωполучаю наследство по жребию). Но так как жребий есть дело случая, а не свободной воли или заслуг, не может быть предусмотрен и зависит от стечения обстоятельств, так что нередко не удостаиваются его и люди добродетельные, напротив люди, не заслуживающие никакого внимания, выводятся на сцену, – то заметь, как (апостол) дополняет это:«быв предназначенык тому, – говорит, –по определению Совершающего», т. е. не просто мы«сделались наследниками», как не просто и избрал Он нас. Так как избравший есть Бог, то не случаю, значит, обязаны мы избранием; так как сотворивший нас наследниками – Бог, то, значит, (не случайно) мы получили наследство, а по прозрению. И в послании к Римлянам, рассуждая об этом, он говорит:«Ибо кого Он предузнал, тем и предопределил... А кого Он предопределил, тех и призвал, а кого призвал, тех и оправдал; а кого оправдал, тех и прославил»(Рим. 8:29–30). Сказавши прежде о том, что есть званные по предуведению, и между тем желая относительно других показать нечто большее, он говорит также и о наследстве по жребию, чтобы не отнять (от Бога) самовластия. Таким образом, он утверждает то, что в особенности доставляет блаженство: ведь наследство по жребию не есть (награда) за добродетель, а, так сказать, дело случая, – как если бы кто-нибудь сказал: Он избрал нас, бросивши жребий. В самом же деле здесь все сделано преднамеренно, т. е., избрав пред нареченных (по прозрению), Он отделил их Себе самому, потому что Он усмотрел нас прежде, чем сделал наследниками. Изумительно божественное предвидение, усматривающее все прежде исполнения! Кроме того, обрати внимание и на то, как (апостол) везде старается объяснить, что все эти дела (устроились) не по причине раскаяния, но что так именно они были предопределены издревле, и что все совершено Им согласно с этим (предопределением), так что мы, в этом случае, ничем не меньше иудеев. Но как же, скажешь, сам Христос говорит:«Я послан только к погибшим овцам дома Израилева»(Мф. 15:24); и еще апостолам Он говорил:«на путь к язычникам не ходите, и в город Самарянский не входите»(Мф. 10:5); и сам Павел опять говорил:«вам первым надлежало быть проповедану слову Божьему, но как вы отвергаете его и сами себя делаете недостойными вечной жизни, то вот, мы обращаемся к язычникам»(Деян. 13:46)? Все это сказано для того, чтобы кто-нибудь не подумал, что это сделано в виде ненужной прибавки.«По определению, – говорит, –Совершающего все по изволению воли Своей»(Еф.1:11), т. е. Он все предопределил искони, и кроме этого не сделал ничего. Таким образом, Он действовал до конца по совету воли Своей. И значит, Он призвал язычников вовсе не потому, что иудеи не послушались Его; Он не был к этому приведен или вынужден последними.«Дабы послужить, – говорит, –к похвале славы Его нам, которые ранее уповали на Христа. В Нем», т. е. через Него,«и вы, услышав слово истины, благовествование вашего спасения»(Еф.1:12–13). Заметь: везде он представляет Христа истинным виновником всего, и нигде не называет Его подчиненным или слугой. Подобно этому, он и в другом месте говорит, именно в послании к Евреям:«Бог, многократно и многообразно говоривший издревле отцам в пророках, в последние дни сии говорил нам в Сыне»(Евр.1:1–2), т. е. чрез Сына.«Слово истины», – говорит, но не (слово) образа или подобия.'
      cn: '保罗在各处尽其所能地努力表明上帝对我们那不可言喻的仁爱。至于他无法完全显明之处，请听他自己所言：

        「深哉，上帝的丰富、智慧和知识！祂的判断何其难测！祂的道路何其难寻！」（罗马书 11:33）

        然而，他尽其所能地表明了。他说了什么呢？「我们也在他里面成了后嗣，被预定如此。」他前面说：「拣选了我们」；此处又说：「成了后嗣」（έχληρώδημεν，源自χληρόω，意为「凭抽签获得遗产」）。但既然抽签是偶然之事，而非自由意志或功绩所致，无法预见，且取决于各种情况的凑合，因此，有德之人常常未能得到，反而那些不值一提的人却被带到台前——那么请注意，（使徒）是如何补充的：「被预定如此，——他说——是按着那照自己旨意行万事者的预定，」也就是说，我们并非简单地「成了后嗣」，正如他拣选我们也不是简单随意。既然拣选我们的是上帝，那么我们的蒙选就不是出于偶然；既然使我们成为后嗣的是上帝，那么我们获得产业（就不是偶然），而是凭着预见。在罗马书，当他论及此事时，他说：「因为他预先所知道的人，就预先定下……他预先所定下的人，又召他们来；所召来的人，又称他们为义；所称为义的人，又叫他们得荣耀。」（罗马书 8:29-30）他先说了那些因预知而被召者，同时又想就其他人表明更深层的事，因此他也提到按签得的产业，以免剥夺（上帝的）全权。如此，他肯定了那特别带来福份的：因为按签得的产业并非因美德（而得的赏赐），而是，可以说，出于偶然之事——如同有人说：他拣选了我们，是凭着抽签。实际上，这里的一切都是有意而为的，也就是说，在拣选了那些预先被定下（凭着预见）的人之后，他将他们归为自己所有，因为他在使我们成为后嗣之前，就已经预见了我们。上帝的预见何其奇妙，在万事成就之前就已洞察一切！


        此外，请注意（使徒）在各处如何努力解释，所有这些事并非出于悔改，而是它们就是如此从古时就被预定，且一切都是他按照这（预定）而成就的，因此在此事上，我们绝不比犹太人差。但你会说，基督自己不是说：「我奉差遣，不过是到以色列家迷失的羊那里去。」（马太福音 15:24）吗？他又曾对使徒们说：「外邦人的路你们不要走，撒玛利亚人的城你们不要进。」（马太福音 10:5）保罗自己也曾说：「上帝的道先讲给你们是应当的，只因你们弃绝这道，又断定自己不配得永生，我们就转向外邦人去。」（使徒行传 13:46）所有这一切都是为了防止有人认为，这是一种不必要的附加。「是按着那照自己旨意行万事者的预定，——他说——」（以弗所书 1:11），也就是说，他从起初就预定了一切，除此之外，没有再做什么。如此，他始终都按照自己旨意的筹划行事。这就意味着，他召集外邦人绝不是因为犹太人不顺从他；他并未因此被后者引导或强迫。「使他的荣耀得着称赞，就是我们这首先在基督里有盼望的人。你们在他里面，——他说——（也就是藉着他），「也听见了真理的道，就是那叫你们得救的福音。」（以弗所书 1:12-13）


        注意：在各处，他都将基督呈现为万事的真正肇始者，从未称他为下属或仆役。同样，他在另一处，即希伯来书，也说：「上帝既在古时藉着众先知，多次多方地晓谕列祖，就在这末世，藉着子晓谕了我们。」（希伯来书 1:1-2），也就是说，藉着子。「真理的道」，——他说——但不是（道）的形象或样式。'
  - type: paragraph
    text:
      ru: «Благовествование вашего спасения». И хорошо называет это благовествование (благовествованием) спасения нашего, указывая этим с одной стороны на закон, с другой на будущее наказание. Что в самом деле другое означает проповедь, как не благовествование спасения, т. е. что достойных погибели Он уже не погубляет?«И уверовав в Него, запечатлены обетованным Святым Духом, Который есть залог наследия нашего». Опять великое промышление показывает это запечатление, – не отделение, не наследие только, но именно – запечатление. Как если бы кто доставшихся ему по жребию отметил (известным знаком), чтобы после узнавать их, так точно и Бог отделил для принятия веры в Него, и запечатлел в наследие будущих (благ).
      cn: '「你们得救的福音。」祂很好地称这福音为我们得救的福音，以此一方面指出律法，另一方面指出未来的惩罚。传讲的，实际上除了救恩的福音，还能是什么呢？意思是说，祂不再毁灭那些本该灭亡的人？


        「你们信了祂，就被应许的圣灵盖上了印记，这圣灵是我们产业的凭据。」这印记再次显明了伟大的神圣护理——不仅仅是分离，不仅仅是产业，而是——盖上印记本身。就好像有人将那些按抽签分给他的人，用（某种记号）标记出来，以便日后辨认；同样，上帝也将那些接受信靠祂的人分别出来，并为承受未来的（福祉）而盖上印记。'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Видишь ли, как (Бог) с течением времени делает их дивными? Доколь они были только в предвидении, до тех пор никому не были известны; а когда получили запечатление, сделались известными, но не как мы, потому что они будут известны, выключая немногих. Получали запечатление и израильтяне, но чрез обрезание, подобно скотам и бессловесным; запечатлены и мы, но как сыны, Духом. Что значит:«обетованным Святым Духом»? Значит, что мы приняли Его по обетованию. Обетований было два: одно – чрез пророков, другое – от Сына. (Я сказал): чрез пророков; послушай, что говорит Иоиль:«Излию от Духа Моего на всякую плоть, и будут пророчествовать сыны ваши и дочери ваши; старцам вашим будут сниться сны, и юноши ваши будут видеть видения»(Иоил. 2:28). Послушай затем, что и Христос говорит:«примете силу, когда сойдет на вас Дух Святый; и будете Мне свидетелями в Иерусалиме и во всей Иудее и Самарии и даже до края земли»(Деян. 1:8). Хотя следовало верить Ему, как Богу, но Он на этом очень не настаивает, а производит исследование, как бы (он говорил) о человеке. Как в послании к Евреям он говорит:«Дабы в двух непреложных вещах, в которых невозможно Богу солгать, твердое утешение имели мы»(Евр.6:18), так и здесь то, что уже было даровано, представляет в доказательство исполнения обетования о будущих (благах). Потому то он и называет (Духа Святого)"залогом"(залогом нашего спасения). Залог бывает обеспечением для всего. Он купил нам наше спасение, и пока дал только залог. Почему же не даровал всего тотчас же? Потому что мы, с своей стороны, еще не исполнили всего. Мы уверовали, это лишь начало, и Он даровал залог. А когда веру покажем в делах, тогда представит нам и все. Он отличил нас и другим образом, даровав нам собственную кровь, и обещал еще другую честь. Как во время войны народы дают друг другу заложников, так точно Бог даровал нам Своего Сына – залог мира и примирения, и из Него (τό εξ αυτού) Святого Духа. Приобщившиеся (благодати) Духа, без сомнения, знают, что это залог наследия нашего. Таков был Павел, который здесь еще предвкушал то, что там (т. е. на небе), который стремился и желал оставить здешний мир, и вздыхал, потому что он, весь ум свой переселив туда, смотрел уже другими глазами. Ты не оправдываешь (веры) делами, – этим сам себя исключаешь из слов (обетований). Если бы мы все приобщились Духа, как следует приобщиться, то и небо узрели бы и свое будущее там состояние."Залог"чего?«Искупления удела»(Еф.1:14). Совершенное избавление совершится в будущей жизни, потому что теперь мы живем среди мира и много человеческого привходит в нас, и с нечестивыми обращаемся. Когда же не будет ни грехов, ни человеческих страстей, когда мы не будем вперемешку со всеми (нечестивые вместе со святыми), – тогда уже наступит совершенное избавление; а теперь (дан только) залог.'
      cn: 你可曾看见（上帝）随着时间的流逝，如何使他们变得奇妙？当他们仅在预见之中时，那时无人知晓他们；而当他们受印时，便为人所知，但并非如我们一般，因为他们将为人所知，除了少数之外。以色列人也受印，但借着割礼，如同牲畜和无言之物；而我们受印，却是作为儿子，借着圣灵。 「借着所应许的圣灵」是什么意思？意思是，我们是按着应许领受了祂。应许有二：其一——借着先知，其二——来自上帝之子。（我说）：借着先知；且听约珥书所言：「我要将我的灵浇灌凡有血气的。你们的儿女要说预言；你们的老年人要做异梦，少年人要见异象。」（约珥书 2:28）再听基督所言：「但圣灵降临在你们身上，你们就必得着能力；并要在耶路撒冷、犹太全地和撒玛利亚，直到地极，作我的见证。」（使徒行传 1:8）尽管本应将祂视为上帝而相信，但祂在此并未极力坚持，而是进行探究，仿佛（祂在谈论）一个人。正如他在致希伯来人书信中说：「以便在两件不能改变的事上，就是上帝不可能说谎的事上，我们能有坚固的安慰。」（希伯来书 6:18）同样在此，祂将那已被赐予的，作为未来（诸福）应许实现之证据。因此他便称（圣灵）为「凭据」（我们得救的凭据）。凭据乃是一切的保证。祂已为我们买赎了我们的救恩，而目前仅赐予了凭据。那么为何不立刻赐予全部呢？乃因我们这边，尚未完全成就一切。我们已信，这仅是开始，而祂赐予了凭据。待我们以行为显明信心之时，祂便会将全部呈现在我们面前。祂还以另一种方式区别我们，赐予我们祂自己的血，并应许了另一份尊荣。正如在战争时期，各国彼此互赠人质，照样，上帝将祂的上帝之子赐予我们——作为和平与和解的凭据，并从祂（τό εξ αυτού）那里赐下圣灵。凡领受圣灵（恩典）者，无疑知晓这是我们基业的凭据。保罗便是如此，他在此地便已预尝到彼处（即天上）之物，他切望并渴望离开此世，且叹息，因为他将自己的心智完全迁往彼处，已用不同的眼光去看待了。你若不以行为称义（信心），——便因此将自己排除在（应许之）言语之外。倘若我们都如理当领受那般领受圣灵，那么我们便会得见天堂，并知晓我们在彼处的未来境况。「凭据」为何物？「为我们所买赎的基业」（以弗所书 1:14）。完全的救赎将在来世成就，因为现今我们生活在世间，许多属人的事物进入我们之中，且我们与不虔敬者为伍。待到那时既无罪恶，亦无属人的情欲，待到我们不再与所有（不虔敬者和圣者）混杂之时，——那时完全的救赎便会到来；而现今（所赐予的）仅是凭据。
  - type: paragraph
    text:
      ru: 'Впрочем, нам и теперь должно удаляться земного, потому что наше отечество не на земле; и теперь мы должны быть свободны от того, что здесь, потому что мы еще странники.«К похвале славы Его», – это он постоянно повторяет; для чего же? Для того чтобы вполне убедить слушателей. Если бы Он искупил нас для нас же, как бы так говорит (апостол), то искупление наше не было бы еще несомненно. Если же Он сделал это для Себя, т. е., чтобы показать Свою благость, то это служит уже основанием, или как бы ручательством, что обещанное так и случится, как обещано. Мы видим, что и у израильтян часто встречаются подобные выражения:«Со мною же ...твори ради имени Твоего»(Пс. 108:21). В другом месте сам Бог говорит:«Ради Себя Самого делаю это»(Ис. 48:11). И Моисей (взывает): «Сотвори ради Твоего имени», если не ради чего другого. Итак он самым действительным образом убеждает и обнадеживает слушателей, научая их, что (Бог) ради Своей собственной благости исполнит все, что обещает. Но не будем из-за этого предаваться беспечности. Конечно, Он все делает ради самого Себя; но, однако же, и от нас требует (соответствующих действий). Если Он говорит, что«Я прославлю прославляющих Меня, а бесславящие Меня будут посрамлены»(1Цар. 2:30), то мы должны понять, что и с нашей стороны нечто требуется. Похвала славы Его – в том, чтобы спасти врагов, но эти враги после того, как они сделались друзьями, должны и пребыть друзьями; если же они опять возвратятся в прежнее состояние вражды, то все для них будет бесполезно и тщетно.'
      cn: 况且，我们即便现在也当远离世俗之物，因为我们的家园不在此地；且我们现在就当摆脱此地的一切，因为我们仍是客旅。「归于祂荣耀的颂赞」，这是他（指使徒）不断重复的；究竟是为了什么？为了要完全说服听者。如果祂是为我们自己而救赎我们，使徒似乎是这样说的，那么我们的救赎便尚未确定。然而，如果祂是为了自己而做这事，也就是为了彰显祂的良善，那么这便是一个基础，或者说是一种保证，所应许的必会如所应许的发生。我们看到，在以色列人中也常有类似的表达：「祢要因祢名的缘故，如此待我」（诗篇 108:21）。在另一处，上帝亲自说道：「我为我自己的缘故行这事」（以赛亚书 48:11）。摩西也（呼求）：「为祢名的缘故而行」，若非为其他缘故。如此，他以最有效的方式说服并鼓励听者，教导他们，上帝必因着祂自己的良善，成就祂所应许的一切。但我们不可因此而变得松懈。当然，祂所做的一切都是为了祂自己；但，祂也要求我们（作出相应的行动）。如果祂说：「凡尊崇我的，我必尊荣他；凡藐视我的，他必被轻贱」（撒母耳记上 2:30），那么我们便当明白，我们也需要有所付出。祂荣耀的颂赞，在于拯救仇敌；但这些仇敌在成为朋友之后，也当常存朋友的身份；如果他们又再次回到从前的仇视状态，那么对他们而言，一切都将是无益和徒然的。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: Другой бани пакибытия нет; нет и вторичного приведения; но есть«некое страшное ожидание суда и ярость огня, готового пожрать противников»(Евр. 10:27). Это именно ожидает и нас, если мы, всегда враждовавшие с Ним, будучи удостоены прощения, и после этого не перестанем еще враждовать, будем продолжать предаваться похотям и делаться хуже прежнего; если останемся слепыми и по пришествию Солнца правды. Хочешь воспринять луч, просвещающий твои очи? Сделай их чистыми, здравыми и зоркими. Он показал тебе свет истинный; но если ты, убегая света, устремишься к тьме, – какое тогда обретешь ты оправдание, какое прощение? Подлинно, никакого, потому что это обнаружит в тебе невыразимую ненависть. Когда бы ты, еще не познав Бога, враждовал с Ним, тогда ты имел бы еще некоторое извинение. А теперь, когда ты вкусил благоволения и сладости (божественной), и, оставляя их, возвращаешься на свою блевотину, то этим обнаруживаешь не что иное, как только знаки великой ненависти и презрения. Не правда, – скажешь, – природа принуждает меня (к греху); я люблю Христа, но природа поставляет меня в необходимость (грешить). Если бы в самом деле ты грешил по принуждению и против воли, – для тебя было бы еще снисхождение; если же ты падаешь от нерадения, тогда не может быть никакого.
      cn: 没有另一个重生的洗礼；也没有第二次的引回；却有「某种可怖的审判的期待，和烈火的狂怒，预备吞噬敌对者」(希伯来书 10:27)。这正是等待着我们的，如果我们这些总是与祂为敌的人，在蒙受了赦免之后，此后仍不停止与祂为敌，继续沉溺于私欲，变得比从前更坏；如果我们甚至在公义之日头临到之后，仍旧盲目。你可愿领受那光照你眼目的光芒？使它们洁净、健康、敏锐。祂已向你显明真光；但若你，逃避光，奔向黑暗——那时你将寻得何种辩白，何种赦免呢？确实，毫无，因为这将在你里面显露出无法言喻的憎恨。当你尚未认识上帝之时便与祂为敌，那时你或许还有某种借口。但如今，你既已尝过祂的恩宠和（神圣的）甘甜，却离弃它们，又返回到自己的呕吐物上，借此所显露的，无非是极大憎恨与轻蔑的标记。 「并非如此，」你会说，「是本性强迫我（去犯罪）；我爱基督，但本性使我不得不（犯罪）。」如果你的确是受强迫且违背己愿而犯罪，你或许还能得到一些宽容；但若你因懈怠而跌倒，那时便毫无宽容可言。
  - type: paragraph
    text:
      ru: 'Впрочем, рассмотрим это самое, т. е., что бывает причиной грехов нужда ли и неволя, или леность и совершенная беспечность? Сказано, например:"не убей"(Исх.20:13;Втор.5:17).  Какая необходимость, какое насилие делать это? Напротив, чтобы убить, нужно употребить (над собой) насилие. Кто в самом деле из нас (без насилия над собой) решится вонзить меч в гортань ближнего и обагрить кровью свою руку? Никто. Не видишь ли, что, напротив, чтобы совершить этот грех, нужно много принуждения и насилия над собою. Бог вложил в нашу природу силу, побуждающую любить других.«Всякое животное, – сказано, –любит подобное себе, и всякий человек – ближнего своего»(Сир. 13:19). Смотри, для добродетели сама природа дала семена; пороки же противны природе, так что, если они более господствуют над нами, то это самое служит признаком большой с нашей стороны лености. А что блуд? К нему какая влечет необходимость? Конечно, скажут, тиранство похоти. Как так, скажи мне? Разве нельзя иметь собственную жену, и этим уничтожить это тиранство? Но какая-то (страстная) любовь, скажет кто-нибудь, обуяла меня к жене ближнего. Это еще не есть необходимость, потому что любовь не есть дело необходимости; никто не любит по необходимости, а по своему произволению и доброй воле. Иметь совокупление – это, может быть, и необходимость; но любить ту или другую – это уже не есть дело необходимости. И (прелюбодеяние) не есть следствие стремления к совокуплению, следствие тщеславия, чувственного раздражения и чрезмерного сладострастия. Что, скажи мне, сообразнее с разумом: иметь ли свою жену – общницу рождения детей, или искать какой-нибудь неизвестной? Разве не знаете вы, что привычка порождает дружбу? Итак, блуд не есть дело природы. Я не обвиняю вожделения, но вожделение дано нам для брака и для деторождения, а не для распутства и растления. И законы гражданства, как известно, снисходительно относятся к невольным преступлениям. Но греха собственно нет ни одного,  который бы проистекал из необходимости, – все они зависят от испорченной воли. Бог не так создал природу, чтобы необходимо должно было грешить; если бы это было так, тогда нет и речи, и Бог не взыщет за это, потому что Он человеколюбив и благ. Что же? Уж и воровство не есть ли дело необходимости? Да, скажут, к нему понуждает бедность. Нет, бедность скорее заставляет трудиться, а не красть. Таким образом, бедность производит противное; воровство происходит от лености; а бедность порождает обыкновенно не леность, а трудолюбие. Итак, оно (воровство) есть следствие нерадения. Заметь это! Притом, скажи мне, что труднее, что неприятнее, – проводить ли ночи без сна, проламывать стены, бродить во тьме, постоянно тревожиться и готовиться к убийству, дрожать и умирать со страху, или ежедневно посвящать себя труду, и вместе с довольством наслаждаться безопасностью? Конечно, последнее легче. А так как оно легче, то большая часть людей и решается лучше на него, чем на первое.'
      cn: '然而，让我们审视这一点，即：是什么导致了罪恶——是贫乏和非自愿，还是懒惰和彻底的疏忽？例如，经上说：「不可杀人」（出埃及记 20:13，申命记 5:17）。做这事有什么必要，有什么强迫呢？相反，为了杀人，需要对自己施加暴力。我们当中究竟有谁（不对自己施加暴力）会决心将刀剑刺入邻舍的喉咙，并用鲜血染红自己的手呢？没有人。你难道没看到吗，相反，为了犯下这个罪，需要对自己施加大量的强迫和暴力。上帝将一种促使我们爱他人的力量植入我们的本性中。经上说：「各样走兽，都爱同类，人也爱邻舍」（德训篇 13:19）。看啊，对于美德，本性自身已赐予种子；而邪恶则与本性相悖，所以，如果它们更多地支配我们，这就表明我们是极其懒惰的。


        那么淫乱呢？是什么必要性引诱人去犯它？当然，他们会说，是情欲的暴政。怎么会这样，告诉我？难道不能拥有自己的妻子，并以此消除这种暴政吗？但有人会说，某种（炽热的）爱掌控了我，让我爱上了邻舍的妻子。这还不是必要性，因为爱并非出于必要；没有人是出于必要而爱，而是出于自己的意愿和善意。发生结合——这或许是一种必要性；但爱上这个或那个，这就不是必要性了。而（奸淫）并非是结合欲望的结果，而是虚荣心、感官刺激和过度纵欲的结果。告诉我，什么更符合理性：是拥有自己的妻子——生儿育女的伴侣，还是去寻求某个不知名的女人？难道你们不知道，习惯会产生亲近感吗？因此，淫乱并非出于本性。我不指责情欲，但情欲是赐予我们用于婚姻和生育的，而非用于放荡和败坏。


        众所周知，世俗法律对非自愿的罪行采取宽容态度。但实际上没有一个罪是源于必要性的——它们都取决于败坏的意志。上帝创造本性并非如此，以致人必然犯罪；如果是这样，那就没有什么可说的了，上帝也不会因此追究，因为祂是爱人且良善的。那么呢？难道连偷窃也不是出于必要吗？是的，他们会说，贫困迫使人去偷窃。不，贫困反而促使人劳动，而不是偷窃。如此一来，贫困产生了相反的结果；偷窃源于懒惰；而贫困通常产生的不是懒惰，而是勤劳。因此，它（偷窃）是怠惰的结果。注意这一点！再者，告诉我，什么更困难，什么更令人不快——是夜不能寐，破墙而入，在黑暗中游荡，不断忧虑并准备杀人，颤抖并死于恐惧，还是每天辛勤劳作，并与满足感一同享受安全？当然，后者更容易。而因为它更容易，那么大部分人便更愿意选择后者，而非前者。'
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Видишь ли, что добродетель сообразна с природой, а порок противен ей, как (противны между собою) болезнь и здоровье. Еще: какая, например, необходимость заставляет лгать и божиться? Никакой нет необходимости, никакой неволи; но мы это делаем по доброй воле. Нам не верят, – скажете вы. Не верят, потому что мы того желаем; ведь нам следовало бы приобретать доверие более своим поведением, чем клятвами. Отчего, скажи мне, одним мы не верим и тогда, когда они клянутся, а других считаем людьми, заслуживающими доверия и без клятвы? Значит, в клятвах нет никакой необходимости. Словам такого-то, говоришь, я верю и без клятв, тебе же не верю, несмотря на твои клятвы. Значит, клятвы излишни, и более свидетельствуют о недоверии, чем о доверии. Кто склонен к клятвам, тот, нельзя сказать, чтобы делал честь своему благородству. И кто решительно при всяком случае употребляет клятву, тот никогда не имеет в ней настоятельной нужды; между тем, кто никогда не прибегает к клятве, тот может извлечь из нее пользу. Может быть, клятва нужна для уверения (других)? Нисколько! Мы видим, что не клянущиеся пользуются большим доверием. Еще: есть ли какая-нибудь необходимость досаждать другим? Конечно, скажешь. Внутренний жар возбуждается, воспламеняется и не дает душе покоя. Нет, человек, не от внутреннего жара происходит досада, а от малодушия. Если бы (досада происходила) от сердечной горячности, то все бы люди досаждали (друг другу), и непрестанно бы досаждали. Мы имеем горячность (ревность) в сердце не для того, чтобы досаждать ближним, но чтобы обращать согрешающих, чтобы восставать самим (по падении), чтобы не быть ленивыми. Внутренний жар вложен в нас, как некоторое жало, чтобы мы скрежетали зубами против дьявола, чтобы устремлялись на него, а не чтобы восставали друг против друга. Мы имеем орудие, не для того, чтобы воевать с самими собой, а чтобы употреблять его в войне с неприятелем. Ты гневлив? Будь таков по отношению к своим грехам, бей свою душу, бичуй свою совесть, будь строгим судьей и грозным карателем своих собственным грехов. Вот польза гнева; для этого Бог и вложил его в нас. Еще: лихоимства бывает ли следствием необходимости? Нет! Какая нужда, какая сила, скажи, понуждает грабить? Бедность заставляет, – скажешь ты, – и страх (не иметь) самого необходимого. Но поэтому-то тебе и не должно быть лихоимцем; такого рода богатство не прочно. Ты делаешь тоже самое, как если бы кто-нибудь, будучи спрошен, для чего он на песке полагает основание дома, отвечал: (чтобы укрываться) от холода и от дождя, но для этого-то, именно, и не следовало бы ставить (дома) на песке, потому что дождь, бури и ветер скоро разрушат его. Поэтому, если ты хочешь разбогатеть, то не лихоимствуй; если хочешь оставить детям богатство, приобретай (богатство) честное, – если только таковое бывает. Такое богатство твердо и прочно; иное же скоро погибает и уничтожается. Скажи мне: ты желаешь разбогатеть, и для этого берешь принадлежащее другим? Но ведь это не богатство; богат тот, кто пользуется собственным, у кого же в руках чужое, тот не богат. Иначе, продающие шелковые одежды, берущие на время одежды других почитались бы богаче и изобильнее всех. Однако, несмотря на то, что вещи в их руках, мы не называем их богатыми. Почему? Потому что у них чужое. Если даже одежды принадлежат им, все-таки деньги, которых стоят одежды, не их, а если и деньги их, то и это не составляет еще их богатства. Итак, если полученное в займы не делает богатыми, так как скоро может быть потребовано назад, то каким образом от лихоимства можно быть богатым? Если ты желаешь разбогатеть во что бы то ни стало (потому что это не есть дело необходимости), то чем особенно ты хотел бы пользоваться? Не более ли продолжительной жизнью? Но таковые (грабители) большей частью бывают недолговечны; они часто получают, в наказание за хищение и лихоимство, преждевременную смерть, и таким образом мало того, что не наслаждаются богатством, но отходят (от мира), чтобы воспринять геенну; нередко также они погибают, получая болезни или от сладострастия, или от трудов, или от излишних забот.'
      cn: '你看到美德是与本性相符的，而罪恶是与本性相悖的，如同疾病与健康彼此对立一样。再者：比方说，有什么必要迫使人撒谎和起誓呢？没有任何必要，没有任何强迫；但我们是出于自愿这样做的。你们会说：「他们不相信我们。」 他们不相信，是因为我们希望如此；因为我们本应通过自己的行为而非誓言来赢得信任。告诉我，为什么有些人即使起誓了我们也不相信，而另一些人即使没有起誓，我们却认为他们值得信赖呢？这就意味着，誓言没有任何必要。你说：「我无需誓言就相信某个人的话，而你即使起誓，我也不相信。」 所以，誓言是多余的，它们更多地表明不信任而非信任。一个倾向于起誓的人，不能说是在荣耀自己的高尚品格。并且，凡是果断地在任何情况下都使用誓言的人，从未真正地需要它；然而，从未诉诸誓言的人，却可以从中受益。也许，誓言是为了让（他人）确信而必需的？绝非如此！我们看到，那些不起誓的人反而享有更大的信任。


        再者：是否有任何必要去恼怒他人呢？「当然有，」你会说。「内在的火热被激起，燃炽，让灵魂不得安宁。」不，世人啊，恼怒并非来自内在的火热，而是来自懦弱。如果（恼怒）是源于内心的热忱，那么所有人都会（彼此）恼怒，并会不停地恼怒。我们心中怀有热忱（热情），并非为了恼怒近人，而是为了转化罪人，为了（跌倒后）自己重新站起来，为了不懈怠。内在的火热被置入我们里面，如同某种刺棒，是为了让我们向魔鬼咬牙切齿，向它猛扑过去，而不是让我们彼此对抗。我们拥有武器，并非为了与自己作战，而是为了在与敌人的战争中使用它。你易怒吗？那么就对你的罪恶如此吧，击打你的灵魂，鞭笞你的良心，成为你自身罪恶的严厉审判者和可畏的惩罚者。这就是愤怒的益处；为此，上帝也将其置入我们之中。


        再者：贪婪是出于必然的吗？不！告诉我，有什么需求，有什么力量，迫使人去掠夺呢？「贫穷迫使人如此，」你会说，「以及对（没有）最必需之物的恐惧。」但正因如此，你更不应该贪婪；这种财富是不牢固的。你所做之事，就如同有人被问及为何将房屋地基建在沙上时，回答说：「（为了躲避）寒冷和雨水，」但正因如此，恰恰不应该将（房屋）建在沙上，因为雨水、风暴和风很快就会将其摧毁。因此，如果你想致富，就不要贪婪；如果你想给孩子们留下财富，就获取诚实的（财富）——如果这种财富确实存在的话。这样的财富坚固而持久；而其他的财富则很快消亡和毁灭。


        告诉我：你渴望致富，为此而拿取属于他人的东西吗？但这并非财富；富足的是享用自己所有的人，而手中持有他人之物的人，则不算富足。否则，那些出售丝绸衣物、暂时借用他人衣物的人，就会被视为比所有人更富有、更丰盛。然而，尽管这些物品在他们手中，我们却不称他们为富人。为什么？因为他们拥有的是他人的东西。即使衣物属于他们，衣物所值的钱也并非他们的，而即使钱是他们的，这也不构成他们的财富。那么，如果借来的东西不会使人富足，因为它很快就可能被要求归还，那么通过贪婪又怎能变得富足呢？如果你不惜一切代价地渴望致富（因为这不是出于必然），那么你特别想享用什么呢？难道不是更长的寿命吗？但这样的人（掠夺者）大多是短命的；他们常常因着偷窃和贪婪的惩罚，而遭受过早的死亡，如此一来，他们不仅未能享用财富，反而（离开世界）去承受地狱的刑罚；他们也常常因放纵情欲、过度劳作或过多的忧虑而患病死亡。'
  - type: paragraph
    text:
      ru: 'Хотел бы я знать при этом, для чего люди так много заботятся о богатстве? Ведь Бог назначил природе меру и границы, чтобы мы не имели никакой необходимости искать богатства. Он повелел, например, одевать тело одной или двумя одеждами, а затем лишняя не нужна для защиты (тела). Для чего же тысячи одежд, эта молеедина? Положена также мера и в принятии пищи, и употребленное более этой меры необходимо вредит всякому живому существу: для чего же эти стада, пастбища и скопление мяса? Нам нужен только один кров: для чего же эти хоромы, эти многоценные жилища? Чтобы в них обитали коршуны и галки в то время, как бедные люди лишены всякого крова? Какой геенны не заслуживает это? Многие нередко в местах, которых никогда не видали, воздвигают из гранитных столбов и дорогого мрамора великолепные здания (чего только не выдумают?); но ни сами, ни кто другой не пользуются ими. Пустынность места не дозволяет жить в этих зданиях, которые таким образом остаются без употребления. Видишь ли, что не по необходимости они воздвигаются? Но причиной всего этого – безумие, глупость и тщеславие, которых, умоляю, будем избегать, чтобы мы смогли избегнуть и других зол, и удостоиться благ, обещанных любящим Его во Христе Иисусе, Господе нашем.'
      cn: 我为此想要知道的是，为何人们如此费心追求财富？因为上帝为万物设定了尺度与界限，为的是我们根本没有必要去寻求财富。祂曾吩咐，例如，用一件或两件衣服遮蔽身体，而多余的衣服则无需用来保护（身体）。那为何要有成千上万的衣服，这些被虫蛀的衣物呢？食物的摄取也同样有其尺度，凡是食用超过此尺度的，必然会伤害所有活物：那为何要有这些群畜、牧场和肉类的堆积呢？我们只需要一个居所：那为何要有这些华屋、这些昂贵的宅邸呢？难道是为了让秃鹫和寒鸦栖息其间，而贫苦之人却一无栖身之所吗？这难道不配下到何等的火狱（革痕拿）中吗？许多人常常在他们从未见过的地方，用花岗岩石柱和昂贵的大理石建造宏伟的建筑（他们还能想出什么呢？）；然而，他们自己或其他人却无人使用这些建筑。地点的荒凉不允许人们居住在这些建筑中，这些建筑因此便无人使用，闲置着。你看，这些建筑的建造并非出于必要，不是吗？但这一切的根源是：愚妄、愚钝和虚荣，我恳求，让我们务必规避这些，以便我们能够避开其他罪恶，并蒙受在我们的主基督耶稣里，祂所应许给爱祂之人的福分。
