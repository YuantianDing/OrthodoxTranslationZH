    text:
      ru: 'Ты видишь, что (апостолы) лучше захотели оставаться в узах, чем видеть погибель темничного стража. Потому он и размышлял сам с собою: если бы они были чародеи, то выпустили бы всех (других узников), и сами бы освободились от уз. Вероятно, многие и из таких (людей) бывали ввергаемы в темницу. А удивился он потому, что хотя и часто принимал (к себе) чародеев, но не видел ничего подобного. Чародей не потряс бы оснований (темницы): этим можно разбудить стража и более затруднить для себя бегство. Но обратим, наконец, внимание на веру темничного стража.«Он потребовал, – сказано, –огня, вбежалв темницуи в трепете припал к Павлу и Силе, и, выведя их вон, сказал: государимои!что мне делать, чтобы спастись?»(Деян. 16:29–30)? Он имел в руках огонь и меч и говорил:«государи мои! что мне делать, чтобы спастись? Они же сказали: веруй в Господа Иисуса Христа, и спасешься ты и весь дом твой»(Деян. 16:31). Чародеям несвойственно, говорит он, преподавать такое учение; в их словах нет и помину о демонах. Видишь ли, как был он достоин спасения? Увидевши чудо и освободившись от страха, он не забыл самого важного и при такой опасности, заботился о спасении души и приступил к учителям так, как должно было приступить, – припал к их ногам.«И проповедали слово Господнее ему и всем, бывшим в доме его. И, взяв их в тот час ночи, он омыл раны их и немедленно крестился сам и вседомашниеего"(Деян. 16:32–33). Видишь ли пламенное рвение этого человека? Не отложил дела до времени, не сказал: «вот придет день, тогда увидим, подумаем», но с истинным усердием крестился сам и весь дом его. Он поступил не так, как поступают многие ныне, не обращая внимания на то, что и рабы, и жены, и дети их еще не освящены (крещением). Подражайте, молю вас, темничному стражу. Говорю это, не приказывая, а выражая свое желание. Что пользы в приказании, когда и желание не имеет силы? Да, – человек грубый, жестокий, живший вместе с тысячами злодеев, всегда имевший их пред глазами, вдруг сделался так сострадателен, так попечителен!«он омыл раны»их, – сказано. Обрати опять внимание и на пламенную ревность Павла: после уз и бичевания он благоветвует. О, блаженные оковы! Какие порождения породили они в эту ночь! Каких чад родили! И о них можно сказать: их"которыхродил я в узах моих»(Флм. 1:10). Видишь ли, как он (апостол) радуется, и как хочет этими (узами) придать больше достоинства рожденным чадам? Видишь ли, как велика слава уз, когда она озаряет своим Сиянием не только узника, но и рожденных им в это время? Рожденные Павлом в узах имеют нечто большее, не в отношении, говорю, к благодати, – благодать одна и та же, – и не в отношении к отпущению грехов, – и отпущение для всех одно и то же, – но в том отношении, что с самого начала научаются радоваться и увеселяться такими подвигами."И, взяв их, – сказано, –в тот час ночи, он омыл раны их и немедленно крестился сам». Обрати внимание, наконец, и на плод. Он тотчас воздал им (за духовные блага) видимыми.«И, приведя их в дом свой, предложил трапезу и возрадовался со всем домом своим, что уверовал в Бога»(Деян. 16:34). И чего бы не сделал он, когда отворенные двери темницы отверзали ему небо? Он обмыл учителя, предложил ему трапезу и радовался сам. Оковы Павловы вошли в темницу и все находящееся здесь превратили вцерковь, всех сделали телом Христовым, предложили духовную трапезу, и родили чад, которым радуются ангелы. Итак не правду ли я говорил, называя темницу светлее неба? Она ведь была причиной радости и для неба. Если о едином кающемся грешнике бывает радость на небесах, если где собраны двое во имя Христа, там и Он посреди их, – то тем более все это было здесь, где были и Павел, и Сила, и темничный страж, и весь его дом, и такая вера. Посмотри, в самом деле, какая твердость веры! Но эта темница напомнила мне другую темницу. Какую же? Ту, в которой был Петр. Но здесь не было ничего такого, – он«приказал четырем четверицам воинов стеречь его»(Деян. 12:4), и не пел, не бодрствовал, но спал, и хотя не терпел ударов, однако опасность была более. Там уже все было сделано, – они уже потерпели наказание, – а здесь еще нет. Потому здесь, хотя удары не причиняли боли, зато устрашало ожидание будущего. Но посмотри на чудо и здесь."И вот, – сказано, –Ангел Господень предстал, и свет осиял темницу.Ангел,толкнув Петра в бок, пробудил его и сказал: встань скорее. И цепи упали с рук его»(Деян. 12:7). Чтобы Петр не подумал, что совершившееся есть только действие света, (ангел) толкнул его. Никто не видел света, а только он, и считал это привидением. Так спящие не чувствуют благодеяний Божьих!«И сказал ему, – сказано, –Ангел: опояшься и обуйся. Он сделал так. Потом говорит ему: надень одежду твою и иди за мною.Петрвышел и следовал за ним, не зная, что делаемое Ангелом было действительно, а думая, что видит видение. Пройдя первую и вторую стражу, они пришли к железным воротам, ведущим в город, которые сами собою отворились им: они вышли, и прошли одну улицу, и вдруг Ангела не стало с ним»(Деян. 12:8–10).'
      cn: '你看到，（使徒们）宁愿留在锁链中，也不愿看到狱卒灭亡。因此他自思自忖：如果他们是术士，就会释放所有（其他囚犯），并且自己也从锁链中得释。或许，许多这类（人）也曾被投入监狱。而他之所以惊讶，是因为他虽然常常接待术士，却从未见过如此之事。术士是不会动摇（监狱）根基的：这会惊醒狱卒，并使自己更难逃脱。


        然而，我们最终将注意力转向狱卒的信仰。


        「他『要了火，跳进去，战战兢兢地俯伏在保罗、西拉面前，又领他们出来，说：诸位大人，我当怎样行才可以得救？』（使徒行传 16:29-30）」他手中拿着火和剑，却说：「诸位大人，我当怎样行才可以得救？」他们说：「『当信主耶稣，你和你一家都必得救。』（使徒行传 16:31）」他说，术士是不可能传授这种教导的；他们的话语中丝毫没有提及邪魔。你看到他多么配得救恩吗？当他看见奇迹并从恐惧中解脱后，他并没有忘记最重要的事情，在这种危险之中，他关心灵魂的救赎，并以当有的方式亲近老师们——他俯伏在他们脚下。


        「『他们就把上主的道讲给他和一切在他家里的人听。当下，就在那夜，他把他们带去，洗了他们的伤；他和所有他家里的人随即受了洗。』（使徒行传 16:32-33）」你看到这个人炽热的热忱了吗？他没有把这事拖延到以后，没有说：「等日子来了，我们再看，再考虑」，而是带着真正的虔诚，自己和全家都受了洗。他不像如今许多人那样行事，不顾他们的奴仆、妻子和孩子尚未（借着洗礼）蒙圣化。我恳求你们，效法这位狱卒。我说这话，不是命令，而是表达我的愿望。当愿望都没有力量时，命令又有何益处呢？是的，——一个粗鲁、残忍的人，与成千上万的恶徒为伍，总是目睹他们的行径，却突然变得如此富有同情心，如此关怀备至！「他『洗了他们的伤』」，经上如此说。请再次注意保罗炽热的热忱：在受尽锁链和鞭打之后，他仍然传扬福音。哦，福哉的锁链！那一夜它们生出了何等样的后代！孕育了何等样的儿女！论到他们，可以说：「『就是我在捆锁中所生的』（腓利门书 1:10）。」你看到他（使徒）如何欢喜，以及他如何想通过这些（锁链）赋予这些所生的儿女更大的尊荣吗？你看到锁链的荣耀何等伟大吗，当它不仅以其光辉照亮囚犯，也照亮他当时所生的儿女时？保罗在锁链中所生的儿女拥有某种更大的东西，我不是说在恩典方面——恩典是独一无二的——也不是在罪的赦免方面——赦免对所有人都是一样的——而是在于他们从一开始就学会了为这样的苦修而欢喜和快乐。


        「『当下，就在那夜，他把他们带去，洗了他们的伤；他自己随即受了洗。』」最后，请注意所结的果实。他立刻以可见的（物质）回报了他们（所赐的属灵恩惠）。「『于是领他们上自己家里去，给他们摆上饭。他全家都因信了上帝，就大大喜乐。』（使徒行传 16:34）」当敞开的监狱大门为他敞开天堂时，他又会做些什么呢？他为老师洗了澡，为他设了宴席，并且自己也欢喜不已。保罗的锁链进入了监狱，将那里的一切都变成了教会，使所有人成为基督的身体，摆上了属灵的宴席，并生养了让天使欢喜的儿女。那么，我说监狱比天堂更光明，难道不对吗？因为它也曾是天堂喜乐的原因。如果为着一个悔改的罪人，天上都会有喜乐；如果奉基督之名聚集的两个人，基督也就在他们中间——那么在这里就更是如此了，因为这里有保罗和西拉，有狱卒，有他全家，还有如此的信仰。


        真的，看看这信仰何等坚定！然而，这座监狱让我想起了另一座监狱。是哪一座呢？就是彼得曾被囚禁的那一座。但这里却不是那样——他「『派了四队兵丁看守他』（使徒行传 12:4）」，他没有歌唱，也没有警醒，而是在睡觉，虽然没有遭受鞭打，然而危险却更大。在那里，一切都已完成——他们已经受了刑罚——而在这里还没有。因此在这里，虽然鞭打没有造成痛苦，但对未来的期待却令人恐惧。然而，在这里也要看看这奇迹。


        「『忽然，有上主的使者显现，有光照耀在监牢里。天使拍彼得的肋旁，把他唤醒，说：快快起来！那铁链就从他手上掉了下来。』（使徒行传 12:7）」为了不让彼得以为所发生的一切只是光的作用，（天使）拍打了他。除了他，没有人看见那光，他自己也认为是幻象。沉睡之人就是这样感受不到上帝的恩惠啊！「『天使又对他说：束上你的腰，穿上你的鞋。他就那样做了。天使又说：披上你的外衣，跟我来。彼得就出来跟着他，不知道天使所做的是真的，还以为是见了异象。过了第一层和第二层看守，他们来到通向城的铁门，这门就自动为他们开了。他们出来，走过一条街，天使立刻就离开了彼得。』（使徒行传 12:8-10）」'
