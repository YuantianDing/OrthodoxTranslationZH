    text:
      ru: 'Были, как кажется, и у наших предков такие, которые дозволяли народу своевольствовать, приводили в исполнение дела, упомянутые у Иезекииля, даже делали то, что свойственно лжепророкам, – которые"бесславят Богапред народомЕгоза горсти ячменя»(Иез. 13:19). То же, я думаю, и теперь иные делают. Так, когда мы говорим, что назвавший брата уродом подлежит геенне, некоторые спрашивают: ужели назвавший брата уродом подлежит геене? Нет! – отвечают. И когда говорим, что лихоимец есть идолослужитель, – и над этим опять смеются, говоря, что это выражение преувеличено; и все заповеди унижают подобным образом. Их-то имея в виду, и писал тогда к Ефесянам блаженный Павел, говоря:«ибо знайте, что никакой блудник, или нечистый, или любостяжатель, который есть идолослужитель, не имеет наследия в Царстве Христа и Бога». Потом присовокупляет:«Никто да не обольщает вас пустыми словами». Суетные слова – те, которые имеют временную прелесть, но никогда не выказываются в делах, потому что дело их – обман.«Ибо за это приходит гнев Божий на сынов противления». За прелюбодеяние, говорит, за любостяжание, за нечистоту, или и за это и за обман, так как они недобросовестны. Непокорливыми сынами называет весьма упорных, которые не слушают (Бога).'
      cn: 似乎，我们的祖先中也有这样的人，他们任凭百姓自行其是，实行了以西结书中所提及的事，甚至做了假先知所固有的事——就是那些「在祂的子民中，为了几把大麦……亵渎上帝名声的」（以西结书 13:19）。我想，现在也有人做同样的事。例如，当我们说，称呼弟兄为丑陋者当受地狱火刑时，有些人会问：称呼弟兄为丑陋者真的当受地狱火刑吗？「不！」他们回答。当我们说，高利贷者就是拜偶像者时，他们对此又嘲笑说，这种说法过于夸张了；他们以类似的方式贬低所有的诫命。圣保罗当时正是针对这些人，写信给以弗所人说：「因为你们确实知道，任何淫乱的、污秽的，或贪婪的，这贪婪者就是拜偶像者，都不能在基督和上帝的国度里承受产业。」接着他又补充道：「不要让任何人用空洞的话欺骗你们。」虚妄的话语——指的是那些具有短暂诱惑力，却从未在行为中体现出来的话语，因为其本质是欺骗。「因为这些事，上帝的愤怒必临到悖逆之子。」他说，为了淫乱、贪婪、污秽，或者说，既是为了这些，也是为了欺骗，因为他们不诚实。他称那些极其顽固、不听从（上帝）的人为悖逆之子。
  - type: paragraph
    text:
      ru: '«Итак, не будьте сообщниками их. Вы были некогда тьма, а теперь – свет в Господе»(Еф.5:7–8). Смотри, как мудро сделал увещание, – сперва Христом, т. е. любите друг друга, и никого не обижайте; потом опять – наказанием и геенной.«Вы были некогда тьма, – говорит, –а теперь – свет в Господе». Это же говорит и в послании к Римлянам:«Какой же плод вы имели тогда?Такие дела,каких ныне сами стыдитесь»(Рим.6:21)? И напоминает им прежние пороки, т.е.: размыслите, говорит, что некогда вы были, и что теперь; не обращайтесь к прежнему нечестию, и не пренебрегайте Божьей благодатью.«Вы были некогда тьма, а теперь – свет в Господе». Не за вашу, говорит, добродетель, но по благодати Божьей это с вами произошло, т.е.:  и вы некогда были того достойны, но более уже нет. Потому«поступайте, как чада света»(Еф.5:8).  А что значит:«чада света», – он объясняет, непосредственно за этим прибавляя:«потому что плод Духа состоит во всякой благости, праведности и истине. Испытывайте, что благоугодно»Господу (Еф.5:9–10)."Во всякой, – говорит, –благости": это против гневливых и жестоких."И истине": это против любостяжательных."И истине": это против ложного удовольствия. Не о том, говорит, заботьтесь, о чем я сказал, но о противоположном."Во всякой", – т.е., плод духовный должен обнаруживаться во всем.«Испытывайте, что благоугодно»Господу. Следовательно то свойственно детскому и несовершенному разумению.«И не участвуйте, – говорит, –в бесплодных делах тьмы, но и обличайте. Ибо о том, что они делают тайно, стыдно и говорить. Все же обнаруживаемое делается явным от света, ибо все, делающееся явным, свет есть»(Еф.5:11–13). Сказал, что вы – свет; свет же открывает все то, что бывает во тьме; так что, если вы, говорит, будете добродетельны и достойны удивления, – нечестивые не будут иметь возможности таиться. Подобно тому, как в то время, когда стоит светильник, освещаются все, и разбойник не можете приблизиться, так, при сиянии света от вас, обличаемые нечестивцы будут поражены. Следовательно, должно изобличать. Но каким же образом говорит (Христос):«Не судите, да не судимы будете»(Мф.7:1)? Обличать, сказал (апостол), т. е. вразумлять, а не осуждать. И, кроме того:«Не судите, да не судимы будете»– сказано о самых незначительных грехах. Сообразно с этим и присовокупил (Христос):«И что ты смотришь на сучок в глазе брата твоего, а бревна в твоем глазе не чувствуешь?»(Мф.7:3). А слова (апостола) означают следующее: как рана телесная до того времени, пока таится, будучи прикрыта снаружи, и пока углубляется далее, не пользуется никаким лечением, так и грех, доколь скрывается как бы во мраке, до тех пор продолжает действовать весьма смело; но как скоро будет обнаружен, – делается светом; не самый грех, – как это возможно? – но тот, кто сделал его. Если он будет выведен на средину (собрания), если будет вразумлен, если покается, если получит отпущение, то не разогнал ли ты тьмы его? Не исцелил ли тогда его раны? Не вызвал ли плод вместо бесплодия? Или это он говорит, или то, что ваша жизнь, будучи открытой, есть свет, – потому что никто не скрывает безукоризненной жизни все же то, что скрывается, скрывается потому, что помрачено.«Посему сказано: «встань, спящий, и воскресни из мертвых, и осветит тебя Христос»(Еф.5:14). О спящем и мертвом говорит – таком, который в грехах, потому что и он издает дурной запах, как мертвец, и он неподвижен, как спящий, и он подобно спящему ничего не видит, но бредит и мечтает. Иные читают:«И прикоснёшься»(έπιψαόσεις)"к Христу"; другие:«осветит тебя»(έπιψαόσει σοι)"Христос". Но это последнее, лучше. Восстань от греха, и сможешь увидеть Христа.«Ибо всякий, делающий злое, ненавидит свет и не идет к свету»(Иоан. 3:20). Итак, кто не делает (зла), тот приходит (к свету).'
      cn: '「所以，不要与他们同伙。你们从前是黑暗，但如今在主里是光」(以弗所书 5:7-8)。


        看哪，祂多么智慧地给予告诫——首先是借着基督，即要彼此相爱，不伤害任何人；然后又是借着惩罚和地狱的火。


        「你们从前是黑暗，」祂说，「但如今在主里是光。」同样的话在致罗马人的书信中也提到：「你们在那时有什么果实呢？如今你们自己也以那些事为耻」(罗马书 6:21)？祂提醒他们从前的罪恶，即：祂说，你们要反思，你们从前是怎样的，如今又是怎样的；不要回到从前的邪恶中，也不要轻忽上帝的恩典。


        「你们从前是黑暗，但如今在主里是光。」祂说，这并非因着你们的德行，而是因着上帝的恩典临到你们，即：你们从前曾是配得那样的，但如今不再是了。所以，「你们行事为人要像光的儿女」(以弗所书 5:8)。至于「光的儿女」是什么意思，他紧接着解释道：「因为圣灵的果实在于一切的良善、公义和真理之中。你们要察验何为蒙主悦纳的」(以弗所书 5:9-10)。


        「在于一切的良善，」祂说：「」这针对的是那些暴怒和残忍的人。「和真理」：这针对的是那些贪财的人。「和真理」：这针对的是那些虚假的享乐。祂说，不要为我所说的那些事忧虑，而是要为与此相反的事忧虑。「在于一切的，」即是说，属灵的果实应当在一切事上显现出来。「你们要察验何为蒙主悦纳的。」由此可见，这属于孩子气和不完全的理解。


        祂说：「不要与那些无益的黑暗作为有份，反要责备它们。因为他们暗中所行的事，就是提起来也是可耻的。凡被显露出来的，都是借着光显明的；因为一切被显明出来的，都是光」(以弗所书 5:11-13)。祂说你们是光；光能显明一切在黑暗中的事；所以，祂说，如果你们是品德高尚且令人敬佩的，那么那些邪恶的人就无法隐藏。就像当灯台立在那里时，所有的一切都被照亮，盗贼无法靠近一样，当光从你们身上照耀出来时，那些被责备的邪恶之人将会被击败。因此，必须加以责备。


        但基督又是如何说：「你们不要论断人，免得你们被论断」(马太福音 7:1)呢？使徒说，责备，即是教导，而不是论断。此外，「你们不要论断人，免得你们被论断」是针对那些最微小的罪过而言的。基督也因此补充道：「为什么看见你弟兄眼中有刺，却不察觉自己眼中有梁木呢？」(马太福音 7:3)。而使徒的话意谓着：就像身体上的伤口，只要它隐藏着，从外面被遮盖着，并且不断加深，就得不到任何医治；同样，罪恶只要像在黑暗中一样隐藏着，就会非常大胆地继续作祟；但一旦被揭露出来，就变成了光；不是罪恶本身——这怎么可能呢？——而是犯下罪恶的那个人。如果他被带到（众人）面前，如果他被教导，如果他悔改，如果他获得赦免，那么你岂不是驱散了他的黑暗吗？你岂不是医治了他的伤口吗？你岂不是使他结出果实，而不是荒芜吗？


        要么他是在说这个，要么他是在说，你们的生活，若公开透明，便是光——因为没有人会隐藏无可指责的生活；所有被隐藏的，都是因为它们是黑暗的。


        「所以经上说：『你这睡着的人当醒过来，从死人中复活，基督就要光照你了』」(以弗所书 5:14)。祂所说的睡着的人和死人——是指那些身陷罪恶的人，因为他也像死尸一样发出恶臭，他也像睡着的人一样一动不动，他也像睡着的人一样什么都看不见，却胡言乱语，作着白日梦。有些人读作：「你将触碰」(έπιψαόσεις)「基督」；另一些人读作：「基督将光照」(έπιψαόσει σοι)「你」。但后者更好。从罪中起来，你就能看见基督。


        「因为凡作恶的，都恨恶光，也不来就光」(约翰福音 3:20)。因此，那不做（恶事）的，就来到（光中）。'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Но не о неверных только он это говорит, потому что многие и из верных нисколько не менее неверующих привязаны к нечестию; есть даже те, которые и гораздо более. Потому-то и к ним необходимо сказать:«встань, спящий, и воскресни из мертвых, и осветит тебя Христос». Прилично сказать к ним и это:«Бог не есть Бог мертвых, но живых»(Мф. 22:32). Итак, если не мертвых, то будем жить. Некоторые говорят, что выражение: лихоимец есть идолослужитель – преувеличено. Но оно не преувеличено, напротив – совершенно верно. Как и каким образом? Таким, что лихоимец отдаляется от Бога, подобно тому, как идолослужитель. А чтобы ты не подумал, что это сказано неосновательно, – вот Христово изречение, которое гласит:«Не можете служить Богу и маммоне»(Мф.6:24). Те, которые работают маммоне, удалили себя от служения Богу; те же, которые отреклись Его владычества и служат бездушному золоту, явно идолослужители. Но я не делал, говорит (любостяжатель), идола, не ставил жертвенника, не приносил в жертву овец, не возливал вина, – я ходил вцерковь, и руки воздевал к Единородному Сыну Божьему, и в таинствах участвую, и имею общение в молитве и во всем другом, что прилично xpистианину. Итак, каким образом я поклоняюсь, говорит, идолам? Это-то самое и удивительно, что ты, испытавши и вкусивши Божьего человеколюбия, и увидевши, что Господь благ, – оставил Благого и принял на себя (владычество) жестокого тирана; говоришь, будто не работаешь ему, а на самом деле подверг самого себя жестокому и невыносимому игу сребролюбия. Ты мне не сказал о каком-либо своем добром деле, но только – о дарах Владыки. Скажи мне, спрашиваю я, на основании чего судим о воине? На основании того ли, что он служит телохранителем царя, от него получает содержание и украшается его именем, – или того, что он не думает о делах его, но показывает только вид, что держит его сторону и заботится о его делах, сам же способствует успеху его неприятелей? Явно – того, что он телохранитель царя. Поэтому и достоин он более жестокого наказания, нежели в том случае, если бы отвергся явно служения царю и передался врагам. Потому и ты дерзко восстаешь против Бога, как идолослужитель, не одними твоими устами, но обидой бесчисленного множества людей. Но (лихоимец) не есть, говорят, идолослужитель. А когда эллины говорят: христианин – лихоимец, тогда уже не один он себя посрамляет делами, но и обиженных заставляет часто это говорить. Если же не говорят, так это должно считать следствием их осторожности. Разве не видим мы, что дело бывает именно таким образом?'
      cn: 但他所说的，不仅是关于不信者，因为许多信徒对不虔诚之事，其依恋程度丝毫不亚于不信者；甚至有比他们更甚者。正因如此，也必须对他们说：「你这睡着的人哪，醒过来，从死人中复活吧，基督的光必照耀你。」对他们说这句话也很合适：「上帝不是死人的上帝，而是活人的上帝」(马太福音 22:32)。既然如此，若不是死人，我们就当活着。有些人说，这句话：「贪婪者是偶像崇拜者」——言过其实了。但它并非言过其实，相反，是完全真实的。如何及以何种方式？如此，即贪婪者远离上帝，正如偶像崇拜者一般。为了使你不会认为这话是毫无根据的，请看基督的教诲，它如此说：「你们不能又事奉上帝，又事奉玛门」(马太福音 6:24)。那些事奉玛门的人，就将自己从事奉上帝中移开；而那些舍弃祂的权柄，事奉无生命的黄金的人，显然是偶像崇拜者。但我没有制造偶像，(贪婪者)说，没有设立祭坛，没有献祭绵羊，没有奠酒——我去教堂，向着上帝的独生子举手祈祷，我也参与圣事，在祷告和一切基督徒应有的事上都有份。那么，我怎么会敬拜偶像呢？他说。这正是令人惊奇之处，你曾体验并尝到了上帝的仁爱，也曾看见上主是美善的，却舍弃了那美善者，反而将自己置于残暴暴君的统治之下；你说你没有事奉他，实际上却将自己置于贪财的残酷且难以承受的轭下。你没有告诉我你自己的任何善行，而只是提到了主宰的恩赐。我问你，告诉我，我们根据什么来判断一个士兵？是根据他作为国王的侍卫，从国王那里获得俸禄并以国王的名义而受尊荣吗？还是根据他并不关心国王的事，而只是表面上显得站在国王一边并关心国王的事，实际上却帮助国王的敌人获得成功呢？显然——是根据他作为国王侍卫的身份来判断的。因此，他配得更严厉的惩罚，甚至甚于他公然拒绝效忠国王并投靠敌人之时。所以你，也如偶像崇拜者一般，胆敢反抗上帝，不仅是凭你的口舌，更是凭你对无数人的伤害。但(贪婪者)并非偶像崇拜者，他们说。而当希腊人说：基督徒是贪婪者——那时他就不只是独自以行为羞辱自己，还会让受他伤害的人也常常说出这话。倘若他们不说，那也应归因于他们的谨慎。难道我们没有看到事情确实如此吗？
  - type: paragraph
    text:
      ru: 'Что такое идолослужитель? Разве не тот, кто поклоняется страстям, вместо того, чтобы владеть страстью? Например: когда мы говорим, что такой-то поклоняется идолам, он говорит: нет – не им, но Афродите и Аресу. И если мы скажем: кто сама Афродита? – более знающие из них говорят: удовольствие. А кто Арес? Гнев. Так и ты (отвечаешь) о маммоне. Если скажем: что такое маммона? Любостяжание, – и ты ему поклоняешься. Не поклоняюсь, говоришь. Почему? Потому что себя не сгибаешь? Но ты гораздо более воздаешь поклонения делами и поступками, потому что такое поклонение важнее. И чтобы ты убедился в этом, смотри, по отношению к Богу, кто достойнее Ему поклоняется, – те ли, которые просто стоят на молитве, или те, которые исполняют Его волю? Явно, что последние. Так и по отношению к маммоне, – те, которые творят его волю, более поклоняются ему. При том же поклоняющиеся страстям (олицетворенным) часто бывают свободны от (собственных) страстей. Так, посмотри на почитателя Ареса – он часто владеет гневом. В тебе же не то – ты сам себя делаешь невольником страсти. Но ты не закалаешь овец? Зато – людей и души разумные, иные – голодом, другие – клеветой. Ничего нет неистовее подобной жертвы! Кто видел, чтобы когда-нибудь души заколались? Проклят жертвенник любостяжания! Если придешь к жертвеннику идолов, почувствуешь от него запах крови козьей и крови быков; если же подойдешь к жертвеннику любостяжания, почувствуешь тяжелый запах человеческой крови. А если остановишься здесь, то не заметишь сжигаемых крыльев птиц, ни запаха от того и поднимающегося дыма, но – умерщвленные человеческие тела. Иные бросились с крутизны, другие накинули на себя петлю, иные перерезали ножом горло. Ты видел жертвы грубые и бесчеловечные? Хочешь ли посмотреть еще на более жестокие, сравнительно с этими? Я покажу тебе не только человеческие тела, но и души человеческие, которые там закалаются. Ведь и душу закалать можно закланием, соответствующим душ, потому что как для тела есть смерть, так и для души.«Душа согрешающая, – говорит (Писание), –та умрет"(Иез. 18:4). Смерть души не такова, какова смерть тела, но гораздо тяжелее. Та смерть – телесная, разлучивши душу и тело друг от друга, одно избавляет от многих забот и трудов, другую же препровождает в известное место; а потом (тело), разлученное на время и удаленное, опять соединяется с нетлением, и снова получает свою душу.'
      cn: 偶像崇拜者是什么？难道不是那崇拜情欲，而非掌控情欲的人吗？例如：当我们说某某崇拜偶像时，他说：不——不是它们，而是阿芙洛狄忒和阿瑞斯。如果我们问：阿芙洛狄忒本身是谁呢？——他们中更知情的人会说：快乐。阿瑞斯是谁？愤怒。你也如此回应（关于）玛门。如果我们说：玛门是什么？贪婪，——而你却崇拜它。你说，我不崇拜。为什么？因为你不弯腰吗？但你更多地是通过言行举止来献上崇拜，因为这样的崇拜更为重要。为了让你对此深信不疑，请看，关于上帝，谁更配得祂的崇拜，——是那些仅仅站着祷告的人，还是那些遵行祂旨意的人？显然是后者。同样，对于玛门，——那些行其旨意的人，更是在崇拜它。此外，那些崇拜（拟人化）情欲的人，往往能免于（自身的）情欲。例如，看看阿瑞斯的崇拜者——他常常能掌控愤怒。而你却不是这样——你把自己变成了情欲的奴隶。但你没有宰杀绵羊吗？然而——你宰杀了人，和有理性的灵魂，有些是用饥饿，另一些是用诽谤。没有比这样的祭献更狂暴的了！谁曾见过灵魂被宰杀呢？贪婪的祭坛是可咒诅的！如果你来到偶像的祭坛前，你会闻到山羊血和公牛血的味道；但如果你走近贪婪的祭坛，你会闻到浓重的人血腥味。如果你停在那里，你不会看到被焚烧的鸟翼，也不会闻到焚烧产生的烟味，而是——被残杀的人体。有些人从悬崖坠下，另一些人上吊自缢，还有些人则用刀割喉。你见过粗野且不人道的祭献吗？你想看看比这些更残酷的吗？我将展示给你的，不只是人的身体，还有在那里被宰杀的人类灵魂。毕竟，灵魂也能被以适合灵魂的方式宰杀，因为正如身体有死亡，灵魂也有死亡。《圣经》说：「犯罪的灵魂，它必死亡」（以西结书 18:4）。灵魂的死亡不像身体的死亡，而是远为沉重。身体的死亡，使灵魂和身体彼此分离，一方面，它使身体摆脱了许多烦恼和劳苦，另一方面，它将灵魂送往一个已知之处；而后（身体），虽然暂时分离和被移开，却将再次与不朽结合，并重新获得自己的灵魂。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: Такова эта смерть; смерть же души страшна и ужасна. Она не переводит души (в известное место), как бывает с телом, по разлучении ее с ним, но связанную опять нетленным телом ввергает в огонь неугасимый. Такова-то смерть души! Итак, подобно тому, как есть смерть души, есть и заклание души. В чем состоит заклание тела? В умерщвлении и в отнятии силы душевной. В чем – заклание души? И это – тоже умерщвление. В чем же умерщвление души? Как тело тогда умирает, когда душа оставляет его лишенным своей силы, так и душа тогда умерщвляется, когда Дух Святой оставляет ее без Своей силы. Эти заклания особенно и совершаются на жертвеннике любостяжания. Не удовлетворяются они, не останавливаются на крови человеческой, но если вы не принесете самой души, жертвенник любостяжания не насыщается, – если не примет душ обоих, души приносящего жертву и приносимого. Ведь необходимо прежде быть принесенным в жертву тому, кто ее приносит, и, таким образом, он совершает жертвоприношение и, будучи мертвым, приносит в жертву живого. Если ты клевещешь, поносишь и негодуешь, не есть ли это раны души неисцелимые? Видишь, что выражение не преувеличено?
      cn: 这是这样的死亡；而灵魂的死亡是可怖且可憎的。它不像肉体那样，在灵魂与肉体分离之后，会转移灵魂（到某个特定的地方），而是将再次与不朽之体结合的灵魂投入不灭的火中。这就是灵魂的死亡！因此，正如存在灵魂的死亡，也存在灵魂的献祭。肉体的献祭在于何处？在于使其死亡，并夺去灵魂的力量。那么，灵魂的献祭又在于何处？这同样是使其死亡。那么，灵魂的死亡在于何处？正如肉体在灵魂离弃它、使其失去自己的力量时死亡，灵魂也同样在圣灵离弃它、使其失去自身的力量时死亡。这些献祭尤其是在贪婪的祭坛上完成的。它们不满足于此，不止于人血，但若你未献上灵魂本身，贪婪的祭坛便永不满足，除非它收纳施祭者与被献者两者的灵魂。因为施祭者本身必须首先被献为祭品，如此，他方能施行献祭，并以死者之身献祭生者。若你诽谤、辱骂并心怀怨愤，这岂不是灵魂无法治愈的创伤吗？你看，这措辞并非夸大其词吧？
  - type: paragraph
    text:
      ru: Хочешь и еще послушать и узнать, каким образом любостяжание есть идолослужение, – и тяжелее идолослужения? Идолослужители кланяются творению Божьему.«И поклонялись, – говорит (апостол), –и служили твари вместо Творца»(Рим. 1:25); ты же поклоняешься своему собственному творенью. Бог не сотворил любостяжания, но изобрела его твоя безмерная ненасытность. И смотри, как это безумно и достойно смеха. Те, которые поклоняются идолам, чтут тех, которым кланяются, и если кто скажет об этих идолах худо, если будет над ними смеяться, они защищают их. Ты же, как бы в каком опьянении, поклоняешься предмету, который не только не свободен от порицания, но и полон нечестия. Итак, ты гораздо хуже их, потому что не можешь сказать в свою защиту, что это не зло. Если и те весьма неизвинительны, то ты еще более, как несчетное число раз порицающий любостяжание и осмеивающий тех, которые служат ему, раболепствуют пред ним, предаются ему. Но не угодно ли, – мы исследуем, откуда явилось идолослужение? Один мудрый муж говорит, что некто богатый человек, снедаемый преждевременной потерей сына, и, не имея никакого утешения в скорби, хотел утолить страдание тем, что, сделав бездушное изображение умершего, и затем смотря на него, думал изображение принимать за самого умершего  (Прем. 14:15). Некоторые же льстивые люди, которым бог –  чрево, служа в его честь пред изображением, ввели обычай  идолослужения. Итак, оно введено слабостью души, неразумным  обычаем, невоздержанием. Любостяжание же не так. И оно от слабой души, но только от худшей. Не потерял кто-либо сына, не ищет утешения в скорби, не понуждается льстецами. Но как? Я вам скажу. Каин обманул Бога, потому что-то, что следовало дать Ему, удержал у себя, а то, что следовало оставить себе, принес Ему, и начал зло с Бога. Если сами мы – Божьи, то тем более – первые плоды наших стяжаний. От любостяжания, в свою очередь, родилось стремление к женщинам. Увидели дщерей человеческих, и предались похотению (Быт. 6:4). От них – опять к деньгам, так как желание иметь средств к жизни больше, нежели сколько у ближнего, происходит не от иного чего, как от того, что любовь охладела. Желание иметь больше бывает не от чего другого, а только от безумия, человеконенавистничества и высокомерия. Разве не видишь, как велика земля? Как несравненно больше, чем нужно, воздуха, неба? Бог устроил творение в таком объеме для того, чтобы погасить твое любостяжание. Но ты и при всем том грабишь и, слыша, что любостяжание есть идолослужение, не ужасаешься даже пред этим? Хочешь овладеть землей? Но разве нет на небе наследства, которого ты себя через то лишаешь?
      cn: '你是否还想聆听并了解，贪爱钱财如何是偶像事奉，并且比偶像事奉更甚呢？偶像事奉者敬拜上帝的受造物。使徒说：「他们敬拜事奉受造之物，代替了造物主」（罗马书 1:25）；而你却敬拜你自己所创造的。上帝并未创造贪爱钱财，而是你无止境的贪得无厌创造了它。看哪，这是何等疯狂可笑！那些敬拜偶像的人，尊崇他们所敬拜的对象；如果有人说这些偶像的坏话，如果嘲笑它们，他们就会维护它们。而你却如同醉酒一般，敬拜一个不仅无法免于指责，而且充满不虔敬的事物。因此，你远比他们更糟，因为你无法为自己辩护说，这不是邪恶。即使他们是极其不可原谅的，你更是如此，因为你无数次地指责贪爱钱财，并嘲笑那些事奉它、屈从于它、委身于它的人。然而，我们何不探究偶像事奉从何而来呢？


        一位智者说，曾有一位富人，因过早失去儿子而饱受煎熬，在悲伤中毫无慰藉，便想通过制作逝者无生气的塑像来平息痛苦，然后看着它，以为那塑像就是逝者本人（智慧篇 14:15）。而另一些谄媚之人，他们以肚腹为神，在塑像前为尊崇（逝者）而事奉，便引入了偶像事奉的习俗。因此，偶像事奉是由灵魂的软弱、不理智的习俗和无节制所引入的。而贪爱钱财则不然。它也源于软弱的灵魂，但却是源于更糟的灵魂。并非有人丧失了儿子，并非在悲伤中寻求慰藉，并非受谄媚之人所迫。那么它是如何产生的呢？我将告诉你们。


        该隐欺骗了上帝，因为他本应献给祂的，却私自留下；而他本应留给自己的，却献给了祂，并从上帝那里开始了邪恶。如果我们自己都属于上帝，那么我们所得之物的初熟果子就更应当如此了。反之，贪爱钱财又生发了对女人的欲望。他们看见人的女子，就沉溺于情欲（创世记 6:4）。从情欲，又转向金钱，因为渴望拥有的生计多于邻人，这并非源于别的，而是因为爱心冷淡了。渴望拥有更多，并非源于别的，而只源于疯狂、仇视人类和傲慢。难道你没看见大地何其辽阔？空气、天空何等浩瀚，远超所需？上帝以如此广阔的规模安排了受造物，是为了熄灭你的贪爱钱财。然而，你即便如此，仍在掠夺，并且听闻贪爱钱财是偶像事奉，甚至不为此惊惧吗？你想占有大地吗？然而，天上岂没有一份产业，你正因此而剥夺了自己获得它的权利吗？'
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: Скажи мне, если бы кто предоставил тебе право взять все, – разве ты не захотел бы? А можно, если хочешь. Некоторые говорят, что они скорбят, если наследство переводят на других, хотели бы лучше истребить его, нежели видеть других его владетелями. Я тебя не извиняю и в этой слабости, потому что и это свойственно немощной душе. Но пусть будет так. Поставь же в завещании наследником Христа. Ведь (наследнику) должно быть живому; это будет свидетельствовать и о прекрасно направленной воле, к тому же ты, хотя по необходимости, станешь щедрее. Христос повелел давать нищим для того, чтобы нас живых сделать любомудрыми, чтобы убедить презирать деньги, чтобы научить не уважать земного. Не в этом состоит презрение денег, что, умирая и не будучи господином, ты предоставляешь их то тому, то другому. Не добровольно даешь остаток, но по крайней необходимости. Смерти – благодарность, не тебе! Это не есть дело нежной любви, но – нужды. Впрочем пусть будет и так, но освободись же хоть тогда от страсти. Подумай, сколько ты похитил, сколько приобрел обманом? Все возврати четверицею, и, таким образом, оправдаешь себя пред Богом. Но некоторые дошли до такого безумия и испорченности, что даже и тогда (пред смертью) не понимают должного, а поступают так, как будто бы старались сделать тяжелее для себя суд Божий. Потому-то блаженный тот (Павел) говорит в послании:«поступайте, как чада света». Любостяжатель же преимущественно живет во тьме, и на всех распространяет великий мрак.«Не участвуйте, – говорит, –в бесплодных делах тьмы, но и обличайте. Ибо о том, что они делают тайно, стыдно и говорить. Все же обнаруживаемое делается явным от света, ибо все, делающееся явным, свет есть».
      cn: 请告诉我，假若有人赋予你尽取一切的权利，难道你不会想要吗？而你若愿意，就可以如此行。有些人说，若将遗产转给他人，他们就会忧伤，宁愿毁掉它，也不愿看到其他人拥有它。我并不为你这种软弱辩护，因为这同样属于软弱的灵魂所固有的。但即便如此吧。那么，就在遗嘱中将基督立为继承人吧。因为（继承人）必须是活着的；这也将证明你的意志导向是美善的，再者，你虽是出于不得已，却会变得更加慷慨。基督命令施舍给穷人，是为了使我们这些活着的人成为爱智慧的，是为了劝服我们轻视金钱，是为了教导我们不看重世俗之物。轻视金钱并非在于你死亡时，不再是主人，而将其分给这个或那个。你不是自愿地给出剩余之物，而是出于极度的必要。应感谢的是死亡，而非你！这并非温柔之爱的事工，而是出于需要。罢了，即便如此吧，但至少在那时摆脱情欲吧。想想看，你掠夺了多少，又欺诈获得了多少？将一切四倍偿还，如此，你便在上帝面前称义。但有些人已达致如此的疯狂和败坏，以至于即便在那时（临终前）也不明白应做之事，反而行事如同刻意使上帝的审判于己更加沉重。正因此，那位蒙福的（保罗）在书信中说：「行事为人要像光明的子女」。而贪爱财物者主要活在黑暗中，并将巨大的黑暗散播给所有人。「不要参与——他说——黑暗无益的事，反倒要责备这些事。因为他们暗中所行的事，就是说出来也是可耻的。然而，一切被光显露的，都成为显明，因为一切被显明的，就是光。」
  - type: paragraph
    text:
      ru: Послушайте, увещеваю всех, кто не хочет напрасно негодовать. Он похищает, и ты не обличаешь? Ты опасаешься гнева? Хотя не напрасно негодование, хотя ты обличаешь справедливо, а все же боишься гнева? Обличи брата, выкажи вражду, по любви ко Христу, по любви к нему самому; останови его, если он идет в пропасть. Общение в трапезе, в добрых речах, приветливость и нежность – небольшое дело любви. Мы даем друзьям такие дары, которые избавили бы душу их от гнева Божьего. Восставим их, видя повергнутыми в печь нечестия. Но, говоришь, он не исправляется? А ты сделай свое, и будешь прав пред Богом. Не скрывай таланта. Для того ты имеешь разум, для того – язык и уста, чтобы исправлять ближнего. Одни бессловесные не заботятся о ближнем и не имеют никакого понятия о других. Ты же, называя Бога Отцом, и ближнего – братом, видя его совершающим множество зол, предпочитаешь расположенность к нему его пользе? Да не будет этого, умоляю вас. Нет больше доказательств любви, как не презирать заблуждающих братьев. Увидел враждующих? Помири. Увидел обманом приобретающих имущества? Помешай. Увидел обижаемых? Защити. Этим ты к себе первому выкажешь любовь, а не к ним. Для того мы и друзья, чтобы друг другу приносили пользу. Друг иначе слушает друга, иначе кого-нибудь постороннего. Постороннему он, быть может, не будет и доверять, равно как и учителю, а другу не так.«Ибо о том, что они делают тайно, стыдно и говорить. Все же обнаруживаемое делается явным от света». Что он хочет этим сказать? Говорит это потому, что одни из грехов совершаются здесь тайно, а другие явно. Там же будет не так, потому что нет никого, кто бы не сознавал за собою греха. Потому говорит:«Все же обнаруживаемое делается явным от света». Что же, не о идолослужении ли, скажешь, говорится и здесь? Нет; речь здесь о жизни и грехах. Все являемое, говорит, свет есть. Потому, умоляю, не отказывайтесь ни других обличать, ни сами досадуйте, будучи обличаемы. Доколь что совершается во мраке, совершается с большей смелостью; но как скоро имеет многих свидетелей происходящего, тогда освещается. Потому будем делать все наиболее для того, чтобы удалить мертвость от братьев своих, чтобы рассеять мрак, чтобы приблизить Солнце правды. Если много будет светочей, то и для нас будет удобен путь добродетели, да и те, которые во мраке, лучше будут обличены, так как свет, распространяясь, прогоняет и мрак. А если не будем так поступать, то можно опасаться, что они угаснут от преобладания над светом мрачной и греховной тьмы, которая отгоняет блеск света. Итак, будем стараться и о других, как о самих себе, чтобы всеми (делами своими) воссылать славу человеколюбивому Богу, благодатью и человеколюбием (Господа нашего Иисуса Христа, Которому с Отцом и Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь).
      cn: '请听，我恳请所有不愿徒然恼怒之人。他行偷窃，而你却不斥责？你惧怕愤怒吗？纵然恼怒并非徒然，纵然你的斥责公义，但你仍惧怕愤怒吗？斥责你的弟兄，显明你的敌意，出于对基督的爱，出于对他本身的爱；若他走向深渊，就阻止他。饭食中的团契，善言，亲切与温柔——这并非微小的爱之举。我们给予朋友这样的恩赐，能够将他们的灵魂从上帝的愤怒中解救出来。当我们看见他们被抛入不虔的火炉中时，我们就要扶起他们。但是，你说，他不改正？而你当尽你的本分，且在上帝面前蒙称义。不要隐藏你的恩赐。为此你拥有理性，为此你拥有舌头和口唇，以便纠正你的近人。唯独无理性的受造物不关心近人，且对他人毫无概念。而你，称上帝为父，称近人为弟兄，却看见他作恶多端，难道你宁愿得到他的好感，而不顾他的益处吗？愿这事永不发生，我恳求你们。没有比这更大的爱的明证，莫过于不轻视迷途的弟兄。看见彼此为敌之人？就使他们和解。看见以欺诈手段获取财物之人？就阻止他们。看见受欺压之人？就保护他们。借此，你首先是向自己显明爱，而非向他们。我们之所以是朋友，就是为了彼此带来益处。朋友倾听朋友的方式不同，倾听陌生人的方式也不同。对于陌生人，他或许不会信任，也不会信任老师，但对于朋友则不然。


        「因为他们暗中所行的事，就是说出来也是可耻的。(以弗所书 5:12) 凡被显露出来的，都借着光显明出来。」(以弗所书 5:13) 他想借此说什么呢？之所以这样说，是因为有些罪在这里是秘密进行的，而另一些则是公开的。然而在那里将并非如此，因为没有人不会意识到自己的罪。因此他说：「凡被显露出来的，都借着光显明出来。」那么，你或许会说，这里难道不是在谈论偶像崇拜吗？不；这里谈论的是生命与罪。他说，所有显明出来的，都是光。因此，我恳求你们，不要拒绝斥责他人，也不要自己因被斥责而恼怒。凡在黑暗中进行的，便会以更大的胆量进行；但一旦有许多见证人看见所发生的事，它就会被照亮。因此，我们更要尽一切努力，为要除去我们弟兄身上的死寂，为要驱散黑暗，为要使公义的日头临近。若有许多光照者，那么，美德之路对我们来说也将更为平坦，那些在黑暗中的人也将更好地被揭露，因为光在扩散时，也能驱散黑暗。而如果我们不这样做，那么就值得担心，他们会因黑暗和罪恶的阴影胜过光而熄灭，这阴影驱散了光的辉煌。


        所以，我们也要像关心自己一样关心他人，好让所有（我们的行为）都向上帝——仁爱上帝——归送荣耀，借着我们主耶稣基督的恩典和仁爱，（祂与父及圣灵同享荣耀、权能、尊贵，从今时直到永远，世世代代。阿们）。'
