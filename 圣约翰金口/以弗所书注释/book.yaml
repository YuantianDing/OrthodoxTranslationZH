  text:
    ru: Беседа 24
    cn: 第 24 讲
  children:
  - type: paragraph
    text:
      ru: Еф.6:14–17.Итак, станьте, препоясав чресла ваши  истиною и облекшись в броню праведности,
      cn: (以弗所书 6:14-17) 所以要站稳了，用真理束上你们的腰，并且穿上公义的护心镜，
  - type: paragraph
    text:
      ru: и обув ноги в готовность благовествовать мир;
      cn: 和穿上脚，准备妥当以传扬和平的福音；
  - type: paragraph
    text:
      ru: а паче всего возьмите щит веры, которым возможете угасить все раскаленные стрелы лукавого;
      cn: 然而，最重要的是，拿起信德的盾牌，以此你们方能熄灭那恶者一切炽热的箭矢；
  - type: paragraph
    text:
      ru: и шлем спасения возьмите, и меч духовный, который есть Слово Божие.
      cn: 并戴上救恩的头盔，佩带圣灵的宝剑，就是上帝之道。
  - type: paragraph
    text:
      ru: В чем состоит оружие христианина и с кем он должен бороться. – Об Анне, матери Самуила.
      cn: 基督徒的兵器是什么，以及他当与谁争战。– 论撒母耳之母亚拿。
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: '"Препоясав, – говорит (Павел), –чресла ваши истиною». Какое значение этих слов, об этом сказано в предыдущей беседе. Именно: мы должны сделаться столь легкими, чтобы ничто не мешало нашему странствованию.«Облекшись в броню праведности». Как броня хранит от ранений, так и правда (спасает нас). Правдой же называет здесь всю вообще добродетельную жизнь. Конечно, многие наносят ей раны; но поразить и низвергнуть ее никто и никогда не может, даже сам дьявол. Как бы так было сказано: внедривши в свою грудь праведные дела. О таких людях и Христос говорит:«Блаженны алчущие и жаждущие правды, ибо они насытятся»(Мф.5:6). Кто оградил свое сердце правдой, тот так же крепок, как и броня; такой человек никогда не увлечется гневом.«И обув ноги в готовность благовествовать мир». Выражение, не совсем понятное. Что оно значит? Приготовлением благовествования он обувает нас как бы в прекрасные сандалии. Разумеет же здесь или готовность к благовестию, так что этому делу должны служить ноги, равно как предустроение и ограждение евангельского пути, или, если это объяснение неверно, то он хочет сказать, чтобы они (ефесяне) готовились к походу.'
      cn: '「束上你们的腰，用真理当作带子，——(保罗) 说——这些话语的意义，已在先前的讲论中提及。确切地说：我们应当变得如此轻省，以致没有任何事物能阻碍我们的客旅生涯。


        「穿上公义的护心镜」。正如护心镜能抵御创伤，公义也同样（拯救我们）。而他在此处所称的公义，是指整个德行的生命。当然，许多人会给她造成创伤；但没有人，也永远没有人能击倒她、推翻她，甚至魔鬼也不能。这话仿佛是说：将公义的善行深植于心。对于这样的人，基督也说：「福哉那些饥渴慕义的人，因为他们必得饱足！」（马太福音 5:6）凡以公义护卫其心者，就如护心镜般坚固；这样的人绝不会被愤怒所牵引。


        「又用平安的福音预备好了的鞋，穿在脚上」。这表达不太容易理解。它意味着什么？借着福音的预备，他仿佛为我们穿上了美丽的凉鞋。他在此处所指的，或是指为传福音所作的准备，以致双脚应当为此事效劳，如同福音道路的预备与护卫；或者，如果这种解释不正确，他想说的是，他们（以弗所人）应当为行军作好准备。'
  - type: paragraph
    text:
      ru: 'Как бы то ни было, но под«готовностьюблаговествовать»разумеется не что иное, как самый лучший образ жизни. Об этом еще пророк сказал:"готовности[4]сердца их внялоухо твое"(Пс. 9:38), т. е. сердца, которое было хорошо настроено.«благовествовать мир», – сказано. И правильно. Выше он упомянул о войне и сражениях, а теперь указывает на то, с кем должно вести сражения, именно – с демонами. Поэтому-то благовествование и делается благовествованием мира. Война с дьяволом прекращает другую войну – против Бога. Враждуем с дьяволом: это значит – находимся в мире с Богом. Потому, возлюбленный, не опасайся (этой войны); благовествование мира уже показывает победу.«А паче всего возьмите щит веры». Говорит здесь о вере, а не о знании. Да, если б и не упомянул о вере, все-таки не преминул бы сказать о благодати, силою которой совершаются знамения. И справедливо называет веру щитом. Подобно тому, как щит заслоняет собой все тело, делаясь как бы стеной, – так точно и вера, потому что все ей уступает.«Которым возможете угасить все раскаленные стрелы лукавого». Ничто не в силах рассечь этого щита. Послушай, что говорит Христос своим ученикам:«если вы будете иметь веру с горчичное зерно, и скажете горе сей: «перейди отсюда туда», и она перейдет»(Мф. 17:20). Но каким образом мы можем приобрести такую веру? Если будем выполнять это (угашать разожженные стрелы лукавого). Стрелами же лукавого он называет как искушения, так и непристойные пожелания. Кстати прибавил он еще:"разожженныя". Таково именно свойство страстей; но если вера повелевает и демонами, то тем легче ей управиться с душевными страстями.«И шлем спасения возьмите». Т. е. вашего спасения. Предохраняет их, как бы ведя на войну.«И меч духовный, который есть Слово Божие». Или он говорит здесь о Духе, или же разумеет меч, понимаемый в духовном смысле, – меч, которым, действительно, все посекается, все раздробляется, – которым можем отсечь даже голову дракона.'
      cn: '无论如何，所谓「预备好传扬福音」，意谓的无非是最美好的生活方式。关于此，先知曾说：「祢的耳朵垂听了他们内心的[4]预备」（诗篇 9:38），亦即一颗已然得到良好调整的心。


        又说：「传扬和平的福音。」如此说，是正确的。在此之前，他提到了战争与战斗，而现在则指出当与谁作战，正是与邪魔。正因此，福音才成为和平的福音。与魔鬼的战争终止了另一场战争——对抗上帝的战争。我们与魔鬼为敌：这意味着——我们与上帝处于和平之中。所以，蒙爱者，不要惧怕（这场战争）；和平的福音已然预示着胜利。


        「最重要的是，要拿起信德的盾牌。」这里所说的是信德，而非知识。是的，即使他没有提到信德，他也绝不会不提及恩宠，借着恩宠之力，神迹得以实现。他把信德称为盾牌是公正的。正如盾牌遮蔽全身，如同成为一堵墙——信德也正是如此，因为一切都顺从于它。「借着它，你们将能熄灭那恶者一切炽热的箭。」没有任何力量能穿透这盾牌。听听基督对祂的门徒说了什么：「倘若你们有信德如一粒芥菜种，对这座山说：『从这里移到那里去！』它也必移去」（马太福音 17:20）。但我们如何能获得这样的信德呢？如果我们能履行此（熄灭那恶者炽热的箭）。那恶者的箭，他指的是诱惑以及不合宜的欲望。他还恰当地补充了「炽热的」。这正是情欲的特质；但倘若信德能驾驭邪魔，那么它就更容易驾驭灵魂的情欲了。


        「也要戴上救恩的头盔。」亦即你们的救恩。守护他们，如同将他们引向战场。


        「并要拿起圣灵的宝剑，那就是上帝的道。」他这里要么是指圣灵，要么是指在属灵意义上所理解的宝剑——这宝剑，确实能斩断一切，粉碎一切——借着它，我们甚至可以斩断巨龙的头颅。'
  - type: paragraph
    text:
      ru: '"Всякоймолитвойи прошением молитесь во всякое время духом, и старайтесь о сем самом со всяким постоянством и молением о всех святых и о мне, дабы мне дано было слово – устами моими открыто с дерзновением возвещать тайну благовествования, для которого я исполняю посольство в узах, дабы я смело проповедовал, как мне должно»(Еф.6– 20). Имеющий духовное дарование, т. е. глагол Божий, так же силен, как самый этот глагол, о котором сказано:«Ибо слово Божие живо и действенно и острее всякого меча обоюдоострого»(Евр. 4:12). Но заметь мудрость блаженного (Павла). Он вооружал их (ефесян) со всякой предосторожностью; в заключение же всего, научает, как нужно обращаться к Царю и просить, чтобы Он простер им руку (помощи), – говоря:"Всякоймолитвойи прошением молитесь во всякое время духом». Можно молиться и не духом, например, когда кто молится о суетном.«И старайтесь о сем самом». Иначе: трезвясь. Именно таким, т. е. неусыпным и трезвенным должно быть тому, кто вооружен и стоит при Царе.«Со всяким постоянством и молением о всех святых и о мне, дабы мне дано было слово – устами моими». Что говоришь ты, блаженный Павел? Ужели ты имеешь нужду в учениках? И хорошо сказано:«устами моими открыто». Без всякого сомнения, он не учился долго тому, что ему говорить; но как сказал Христос:«Когда же будут предавать вас, не заботьтесь, как или что сказать; ибо в тот час дано будет вам, что сказать»(Мф.10:19),  – так он и совершал все, по вере и при содействии благодати.«С дерзновением возвещать тайну благовествования», т. е. чтобы, как следует, защитить мне ее. Ты окован узами: не потому ли и нуждаешься в других? Да, – отвечает он. Но и когда Петр заключен был в оковы, о нем также была и при том непрестанная молитва.«Для которого я исполняю посольство в узах, дабы я смело проповедовал, как мне должно»(Еф.6:20). Другими словами: чтобы я мог отвечать смело, мужественно и с большим благоразумием.«А дабы и вы знали о моих обстоятельствах и делах, обо всем известит вас Тихик, возлюбленный брат и верный в Господе служитель»(Еф.6:21).'
      cn: '「藉着各样的祷告和祈求，随时在灵里祷告，并为此恒切警醒，为众圣徒和为我祈求，使我得着话语，可以在我口中坦然无惧地宣扬福音的奥秘；我为这福音的奥秘作了带锁链的使者，使我能放胆讲论，正如我所当讲论的。（以弗所书 6:18-20）」


        凡有属灵恩赐，即拥有上帝之言的人，其力量犹如这言语本身，论及这言语，经上说：「因为上帝的道是活泼的，是有功效的，比一切两刃的剑更快。」（希伯来书 4:12）


        然而，请留意蒙福的（保罗）的智慧。他以万般谨慎武装了他们（以弗所人）；最后，他教导他们如何向君王祈求，请祂伸出援手，说：「藉着各样的祷告和祈求，随时在灵里祷告。」人也可以不藉着灵祷告，例如，当人祈求虚妄之事时。「并为此恒切警醒」这句，换言之：要清醒警醒。凡受武装并侍立在君王面前的人，就当如此，即不懈怠并清醒警醒。


        「要恒切警醒，为众圣徒和为我祈求，使我得着话语——在我口中」这句。蒙福的保罗，你这话何意？难道你还需要门徒的帮助吗？而「在我口中坦然无惧地」说得很好。毫无疑问，他并非长期学习应说什么；而是正如基督所说：「当人把你们交出来的时候，不要为怎样说话或说什么话而忧虑；因为在那时刻，你们必蒙赐予当说的话。」（马太福音 10:19）——他就是这样，凭着信心并在恩典的帮助下，完成了这一切。


        「坦然无惧地宣扬福音的奥秘」这句，意思是：为了能适当地捍卫它。你被捆锁在锁链中：难道不是因此才需要他人的帮助吗？是的，——他答道。然而，当彼得被囚在锁链中时，也有人为他不断地祷告。


        「我为这福音的奥秘作了带锁链的使者，使我能放胆讲论，正如我所当讲论的。」（以弗所书 6:20）换言之：使我能勇敢、有智慧地应答。


        「又为叫你们知道我的景况，并我的事情，一切事都必有我所亲爱、在主里忠心的弟兄推基古告诉你们。」（以弗所书 6:21）'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: (Апостол сам только) упомянул о том, что он – в узах; в подробности же рассказать о своем положении поручает Тихику. Он изъяснил в своем послании все, что относится к догматам и утешению, что же касается собственно известий – это предоставил тому, кто доставит послание. Потому и прибавил:«дабы и вы знали», т. е. чтоб осведомились вы,"обомне». А через это и показал к ним свою любовь и дал случай обнаружиться их любви к нему.«которого я и послал к вам для того самого, чтобы вы узнали о нас и чтобы он утешил сердца ваши»(Еф.6:22). И это не просто говорит, не сказавши наперед:«облекшись», и:«препоясав», – что именно служит знаком всегдашней и непрерывной готовности к выходу (на бой). Послушай, что говорит пророк:«да будет оно ему, как одежда, в которую он одевается, и как пояс, которым всегда опоясывается»(Пс. 108:19). Пророк говорит, что сам Бог облекался в броню правды, и тем дает понять, что нам уже не на короткое время, а навсегда должно облечь себя в нее, так как и потребность войны у нас всегдашняя. И другой в ином месте говорит:«праведник смел, как лев»(Притч. 28:1). Кто облечен в такую броню, тому нечего бояться вражеских полчищ. Напротив, он смело может идти в самую средину неприятелей. А Исайя говорит:«Как прекрасны ...ноги благовестника»(Ис. 52:7). Кто же после этого не решится, кто не поспешить послужить такому делу, каково благовестие мира, при том мира Божьего с людьми, – мира, который дарован нам без всяких усилий со стороны человека, а по милости содеявшего Бога? Чтобы понять, какое значение имеют слова:«в готовность благовествовать», послушаем еще слов Иоанна:«приготовьте путь Господу, прямыми сделайте стези Ему»(Мф.3:3). Правда, он говорил это (приготовляя людей) к крещению; но ведь и после крещения требуется другое приготовление. На последнее указывает (Павел), когда говорит:«в готовность благовествовать мир», и тем внушает, что нам вовсе не следует делать ничего такого, что не согласно с условиями мира. Так как именем ног нередко обозначается образ жизни, то (Павел), часто говоря о жизни и делая увещание, употребляет выражения, в роде следующего:«Итак, смотрите, поступайте осторожно»(Еф.5:15).
      cn: '使徒只是提及他身陷囹圄；至于详细叙述自己的境况，则委托提希库去做。他在自己的书信中阐明了一切关乎教义与安慰的事宜，至于具体消息，他则留给送信者传达。因此他添上：「好叫你们也知道」，也就是说，好叫你们知晓「关于我的事」。借此，他向他们显明了自己的爱，也让他们有机会显露他们对他的爱。「我打发他到你们那里去，正是为此，好叫你们了解我们，也叫他安慰你们的心。」(以弗所书 6:22)


        他这样说并非空泛，而是事先说过：「穿戴上」，以及：「束上腰带」——这正是随时随地准备出战（迎敌）的标志。请听先知所言：「愿它像他所穿的衣裳披在他身上，又像他常束的腰带束在他身上。」(诗篇 108:19) 先知说，上帝自己也曾披戴公义的铠甲，借此启示我们，我们不应只短暂地，而应永远地将自己披戴于其中，因为我们作战的需求是永恒的。另有一处也说：「义人胆壮，如狮子一般。」(箴言 28:1) 凡披戴这等铠甲之人，无须惧怕敌军的兵团。相反地，他可以大胆地深入敌阵。而以赛亚则说：「……报好消息之人的脚踪何等佳美！」(以赛亚书 52:7) 在此之后，谁还会不立定心志，谁还会不急速事奉这等事业，即平安的福音呢？更确切地说，是上帝与人之间的平安——这平安并非借由人的任何努力，而是借由施行作为的上帝之仁慈所赐予我们的？为要明白「在准备好传扬平安的福音上」这句话的意义，我们再听约翰的话：「预备上主的道，修直祂的路径！」(马太福音 3:3) 诚然，他是在预备人们受洗时说了这话；但受洗之后，也需要另一种预备。保罗在说「在准备好传扬平安的福音上」时，正指出了这后者，借此告诫我们，我们根本不应做任何不符合平安条件的事。由于「脚」这个词语常常象征着生活方式，因此保罗在屡次谈及生活并进行劝勉时，常使用类似以下这样的表述：「所以你们要谨慎行事。」(以弗所书 5:15)'
  - type: paragraph
    text:
      ru: 'Итак, будем вести себя достойно Евангелия, будем поступать так, чтобы жизнь и дела наши были чисты в течение всего нашего земного поприща. В Евангелии возвещен мир: идите же путем, устроенным по этому благовестию. Если же вы опять сделаетесь врагами, в таком случае не будет«в готовность благовествовать мир». Будьте же готовы и не отступайте от мира. И какую готовность вы показали относительно мира и веры, с такой же и пребывайте в них. Вера есть щит, а щит первый принимает вражеские удары, и сохраняет в целости оружие. Значит, если будет вера правая и жизнь добродетельная, то оружие останется неприкосновенным. О вере, равно как и о надежде, много рассуждает (Павел) и в других местах, особенно в послании к Евреям. Веруйте, говорит он там, в грядущие блага, и ни одного из благ настоящей жизни вы не потеряете. И действительно: руководись в несчастьях и трудных обстоятельствах верой и надеждой, и ты удержишь за собой (означенные блага) целыми, неприкосновенными.«Надобно, чтобы приходящий к Богу веровал, что Он есть, и ищущим Его воздает»(Евр.11:6). Вера есть щит, покрывающий тех, которые веруют не испытывая. Когда же кто станет вдаваться в мудрования, начнешь обо всем умствовать и судить по-своему, для такого вера не составляет собой щита. Напротив, тогда мы об нее только претыкаемся. Вера все укрывает и осеняет: таково должно быть ее свойство. А потому нельзя ее укоротить; в противном случае ноги или другая какая-нибудь часть тела останутся открытыми. Нет; щит должен быть соразмерной величины. Разожженные. Много помыслов, волнующих душу, много сомнений и неразрешимых вопросов; но истинная вера на все дает успокоительный ответ. Много внушений, которыми дьявол, воспламеняя нашу душу, повергнет ее в разного рода недоумения. Например, некоторые говорят: есть ли воскресение? Есть ли суд? Есть ли воздаяние? Имей только щит веры, и ты угасишь им стрелы дьявола. Возникло ли в тебе какое-нибудь неистовое желание, запылали ль внутри тебя огнем лукавые помыслы, покажи ему веру в грядущие блага, и он более не явится, мало того – погибнет.«Все ...стрелы», а не так, чтобы одни – угасить, а другие – нет. Послушай, что говорит Павел:«Ибо думаю, что нынешние временные страдания ничего не стоят в сравнении с тойславой, которая откроется в нас»(Рим. 8:18).'
      cn: '故此，我们的行为要配得上福音，我们的生活和行为务要保持清洁，在我们整个尘世的旅程中。福音宣扬了和平：你们当走这条按照这好消息所铺设的道路。若是你们再次成为仇敌，在那种情况下，就不能有「传扬和平福音的预备」。你们当预备好，并且不要偏离和平。你们在和平与信仰上显出怎样的预备，你们就当以怎样的预备持守在这两者之中。信仰是盾牌，而盾牌首先承受敌人的攻击，并使兵器保持完好无损。这就意味着，如果信仰正直且生活良善，那么兵器就会保持毫发无损。


        关于信仰，以及关于希望，保罗在其他地方也多有论述，特别是在致希伯来人的书信中。他在那里说：「你们当信那将要来的福益，你们就不会失去现世生活中的任何一样福益。」确实如此：在不幸和艰难的环境中，若以信仰和希望为指引，那么你就能将（上述的福益）完好无损地保有。「凡来到上帝面前的人，必须信祂是实在的，且信祂必赏赐那些寻求祂的人」（希伯来书 11:6）。信仰是盾牌，遮蔽那些不加试探而信的人。而当有人开始陷入智力思辨，凡事都按自己的理智去思考和判断时，对这样的人而言，信仰就不能成为盾牌。相反地，那时我们只会因它而跌倒。信仰遮蔽和荫庇一切：这正是它应有的特性。因此不能将其截短；否则，腿部或身体的任何其他部分都会暴露在外。不；盾牌必须尺寸合宜。


        被点燃的。许多搅扰灵魂的意念，许多疑虑和无法解决的问题；但真实的信仰能对所有这些给出令人安心的答案。许多魔鬼的暗示，借此点燃我们的灵魂，使其陷入各种困惑。例如，有些人说：是否有复活？是否有审判？是否有报应？只要有信仰的盾牌，你就能用它熄灭魔鬼的箭。你的心中是否升起了任何狂热的欲望？邪恶的意念是否在你内心如火般燃烧？向它展现对将来福益的信仰，它就不会再出现，不仅如此——它还会消亡。「所有的……箭」，而不是只熄灭一些，不熄灭另一些。听听保罗怎么说：「因为我思量，现今的苦楚，与将来要在我们身上显出的荣耀，是无法相比的」（罗马书 8:18）。'
  - type: paragraph
    text:
      ru: Видишь ли, сколько стрел угасили некогда праведники? Или ты думаешь, что это не разожженная стрела, когда патриарх, сгорая внутренним огнем, приносит в жертву сына? И другие праведники тоже могли угасить все стрелы (лукавого). Воюют ли в нас помыслы, – двинем вперед веру. Обуревают ли нас неистовые пожелания, – призовем на помощь веру; находимся ли мы в трудных обстоятельствах и несчастии, – будем искать утешения в вере. Вера есть то, чем оберегается всякое оружие; если ее нет, то и оружие тотчас сокрушится.«А паче всего, – сказано, –возьмите щит веры». Что значит –«а паче всего»? И над истиной, и над правдой, и«в готовность благовествовать». Иначе сказать, все это нуждается в вере. Поэтому он прибавил:«и шлем спасения возьмите», т. е. вы не иначе можете достигнуть окончательной безопасности и избежать всякой беды, как посредством веры. Как шлем охраняет голову от всякой опасности, потому что укрывает ее тщательно со всех сторон, так и вера, кроме того, что служит вместо щита, заменяет еще собой шлем спасения. А когда стрелы (лукавого) будут угашены, то сейчас же мы получим помыслы, которые станут охранять владычествующее в нас начало (ум) и не допустят, чтоб оно пострадало в чем-либо. В самом деле, когда угасают противные помыслы, то взамен их возникают в нас другие, которые, не так, как те, охраняют нас и внушают надежду. И как шлем голову, так они будут укрывать владычествующее в нас начало.
      cn: 你看，昔日的义人曾熄灭了多少箭矢？难道你认为，当族长内心燃着烈火献祭自己的儿子时，这（他所面对的）不是一支被点燃的箭矢吗？其他的义人也同样能熄灭（那恶者的）所有箭矢。意念在我们心中争战时，——我们当将信心推向前去。当狂暴的欲望袭击我们时，——我们当呼求信心来帮助；当我们身处艰难困苦与不幸之中时，——我们当在信心之中寻求慰藉。信心是保守一切兵器之物；若没有它，那么兵器便会立刻破碎。「再者，最重要的是，——经上说，当拿起信心的盾牌。」「再者，最重要的是」——这又意味着什么呢？凌驾于真理、公义之上，也凌驾于「传扬福音的准备」之上。换句话说，所有这些都需要信心。因此他又补充道：「并戴上救恩的头盔」——也就是说，你们除了借着信心，别无他法能达到最终的安全并避免一切灾祸。正如头盔能保护头部免受一切危险，因为它将头部从四面八方严密遮盖，信心亦是如此，它不仅作为盾牌，还能充当救恩的头盔。而当（那恶者的）箭矢被熄灭时，我们便会立刻获得意念，这些意念将开始守护我们内在的主宰（理智），并且不容许它在任何事上受苦。事实上，当对抗性的意念熄灭时，就会有其他的意念在我们心中兴起，取而代之，这些意念不像那些，它们守护我们并带来希望。正如头盔守护头部，它们也将如此遮盖我们内在的主宰。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'И не это только (щит и шлем) нам нужно взять, но также и меч Духа, чтобы не только обезопасить себя от (стрел), бросаемых в нас дьяволом, но поразить и его самого. Действительно, владея этим мечом, душа, будучи при этом еще ограждена от разожженных стрел, может с полной смелостью стать против врага; она в силах будет этим мечом сокрушить броню неприятеля, убить дракона и отсечь ему голову. И сам Павел тем же (мечем) разрушил и пленил умыслы дьявола.«Который есть Слово Божие». Глаголом Божьим он называет здесь заповедь или учение, которое завещал Иисус Христос апостолам и которое они повсюду проповедовали, совершая во имя Его чудеса. Будем же и мы наблюдать одно – как бы сохранить во всем заповеди Божьи. Исполнение их поведет нас к тому, что таким образом мы низложим и умертвим дракона – этого хитрого змия. И заметь при этом благоразумие Павла. Выше он сказал:«возможете угасить все раскаленные стрелы лукавого»; теперь же, чтобы не сделать их надменными, указывает на то, что в этом деле они более всего имеют нужду в помощи Божьей. Что именно он говорит?"Всякоймолитвойи прошением». Как бы так сказал: вы этого достигнете, и все можете совершить, если станете молиться; а того никогда не будет, чтобы ты, во время молитвы, имея в виду одного себя, таким образом, привлек к себе милость Божью.'
      cn: 不仅是这些（盾牌和头盔）我们需要拿取，而且是圣灵的宝剑，不只是为了保护我们自己免受魔鬼射向我们的（箭矢），更是为了击败他自己。确实，当灵魂握有这柄宝剑，同时又被保护免受燃着之箭的攻击时，就能满怀勇气地对抗仇敌；它将能够用这柄宝剑粉碎敌人的盔甲，杀死恶龙并砍下它的头。保罗自己也用那同一（宝剑）摧毁并俘虏了魔鬼的计谋：「这剑就是上帝的圣言。」他在此将上帝的圣言称为诫命或教义，这是耶稣基督所传授给使徒的，并且是他们奉祂的名四处宣扬、行奇迹的。那么我们也要留意一件事——如何在一切事上遵守上帝的诫命。遵行这些诫命将带领我们，借此我们将能制伏并置死那条恶龙——那条狡猾的蛇。此外，请留意保罗的明智。他前面说过：「你们就能灭尽那恶者一切的火箭」；而现在，为了不使他们傲慢，他指出，在此事上他们最需要上帝的帮助。他究竟说了什么？「借着各样的祷告和祈求。」他仿佛是这样说的：你们若肯祷告，就能成就这一切，也能做成万事；但决不会出现这样的情况：你在祷告时，只顾自己，就能以此吸引上帝的怜悯。
  - type: paragraph
    text:
      ru: '"Всякой, – говорит, –молитвойи прошением молитесь во всякое время духом, и старайтесь о сем самом со всяким постоянством и молением обовсех святых». Не ограничивайся одним известным временем дня. Слышишь, что говорит? Во всяко время приступай к молитве. Беспрестанно, говорит, молитесь. Не слышал ли ты о вдовице, как она победила (судью), благодаря своей настойчивости? Не слышал ли, как один друг в самую полночь крепко молил и умолил (своего друга)? Не слышал ли и о хананеянке, как она своей неотступной просьбой возбудила к себе участие Владыки? Эти люди достигли цели настойчивостью.«Молитесь во всякое время духом». Это значит, что мы должны просить себе отнюдь не мирских или житейских вещей, а того, что угодно Богу. Нужно молиться непрестанно, мало того – с бодростью духа:«и старайтесь о сем самом», – сказано. Что бы ни разумел здесь (Павел) – всенощные ли бдения или трезвость души, – я принимаю то и другое. Видишь ли, как бодрствовала хананеянка, когда, несмотря на невнимание Господа, Который не только отверг ее (сначала), но еще назвал псом, говорила:«так, Господи! но и псы едят крохи, которые падают со стола господ их»(Мф.15:27)? И не отступала от Него до тех пор, пока не получила просимого. Как поступила вдовица, не перестававшая умолять судью, который ни Бога не боялся, ни людей не стыдился, пока усовестила его? Как хлопотал друг, который, в глухую полночь, пришел (к своему другу) и настаивал, пока не разбудил его и своей неотступной просьбой не пристыдил? Таковы плоды бодрствования! Хочешь ли и ты приучить свою душу к бодрствованию? Ступай к Анне и слушай, что она говорит:«Господи [Всемогущий Боже] Саваоф!»(1Цар. 1:11). Особенно послушай, что происходило, прежде чем произнесены были эти слова. И встали, сказано, все из-за трапезы, и она тотчас пошла, не ко сну и не на покой. Поэтому мне думается, что и за трапезой она ничего не вкушала и не обременяла себя какими-либо яствами. Иначе не пролила бы столько слез. Если мы и во время поста едва ли, или, лучше сказать, никогда не молимся так, как молилась Анна, то ей после трапезы вовсе не совершить бы подобной молитвы, если б она за трапезой не подражала обычаю постников. Устыдимся мы, мужчины, этой женщины! Она молилась о даровании ей сына и плакала, а мы просим о царстве (небесном), и делаем это с небрежностью."И стала, – сказано, –пред Господом»(1Цар. 1:9). Что же говорит она?«Господи [Всемогущий Боже] Саваоф!»– слова, которые в объяснении значат: «Господи, Боже сил». Но слезы лились, прежде чем она могла что-нибудь выговорить. Ими она и надеялась преклонить к себе милость Божью. Где слезы, там полное сокрушение; а где сокрушение, там много любомудрия и осмотрительности.«Если Ты призришь на скорбь рабы Твоей ...и дашьмне сына,то я отдам его [в дар] Господу на все»время (1Цар. 1:11). Не сказала: на один год или на два, как делаем мы, и не говорила так: «Если дашь мне ребенка, я дам денег», но: «Когда родится у меня первенец, сын молитвы, я всецело отдам его вместо дара». Это поистине была дочь Авраама. У того потребовал (Бог сына), и он отдал; эта же отдает еще прежде, чем исполнилась ее просьба. Затем смотри, какое благоговение и в том, что"уста ее, – как сказано, –только двигались, и не было слышно голоса ее»(1Цар. 1:13). С таким расположением приступает к Богу человек, искренно желающий получить просимое, у которого леность, невнимательность, рассеянность, пренебрежение, беспечность не имеют места. А без молитвы (скажет кто-нибудь) разве Бог не мог даровать (Анне сына)? Ужели в самом деле, Он не знал о желании этой женщины еще прежде, чем она стала молиться? Но если б Он даровал (ей сына) без прошения, то не открылось бы усердие жены, не сделалась бы явно добродетель ее, и она нее получила бы такой награды. Таким образом, не зависть или ненависть была причиной долгого неплодия, а (Божественная) благопопечительность.'
      cn: '「他说：『用各样的祷告和祈求，随时在灵里祷告，并且为此常常警醒，持之以恒，为众圣徒祈求。』」不要局限于一天中某个特定的时间。你听见他怎么说吗？在任何时候都要亲近祷告。他说：「不住地祷告。」你没听说过那寡妇吗？她如何藉着她的坚持不懈战胜了（那位法官）？你没听说过一个朋友在深夜恳切地恳求并说服了（他的朋友）吗？也没听说过那个迦南妇人吗？她如何藉着她不懈的请求唤起了上主的垂怜？这些人都是藉着坚持不懈达到了目的。


        「随时在灵里祷告。」这意味着我们应该祈求的绝不是世俗或属世的事物，而是那蒙上帝悦纳的事物。我们需要不住地祷告，不仅如此，还要怀着警醒的心灵：「并且为此常常警醒，」——经上如此说。无论（保罗）在此处意指什么——无论是彻夜的守夜祷告还是灵魂的警醒清醒——我都接受这二者。你看见迦南妇人是多么警醒吗？当她不顾上主的漠视时，祂不仅（起初）拒绝了她，甚至称她为狗，她却说：「主啊，是的！但狗也吃主人桌上掉下来的碎渣儿啊！」（马太福音 15:27）她没有离开祂，直到她得到所求的。那寡妇又是如何做的呢？她不住地恳求那位法官，一个既不怕上帝也不尊重人的人，直到她使他良心发现？那位朋友又是如何费力恳求的呢？他在深夜来到（他的朋友那里），并且坚持不懈，直到他唤醒了他，并用他不懈的请求使他羞愧？这些就是警醒的果实！你难道不想也让自己的灵魂习惯于警醒吗？去听听安娜怎么说吧：「[万军之上主啊]！」（撒母耳记上 1:11）特别要注意听，在这些话语被说出之前发生了什么。经上说，众人从宴席上起来，她立刻动身，不是为了睡觉，也不是为了安息。因此我认为，她在宴席上也没有吃什么，也没有让任何食物使她自己沉重。否则她就不会流那么多泪了。如果我们即使在禁食期间也几乎没有，或者更确切地说，从未像安娜那样祷告，那么她在宴席之后根本不可能进行这样的祷告，如果她在宴席上没有效法禁食者的习俗的话。我们男人啊，应该为这位妇人感到羞愧！她为求得一个儿子而祷告，并流泪哭泣，而我们为（天）国祈求，却以疏忽大意为之。


        「经上说：『她站在上主面前。』」（撒母耳记上 1:9）那么她说了什么呢？「[万军之上主啊]！」——这些话语在解释上意味着：「主啊，万军的上帝啊。」但泪水已经流淌，在她能说出任何话之前。她就藉着它们希望赢得上帝的怜悯。哪里有泪水，哪里就有完全的痛悔；而哪里有痛悔，哪里就有极大的智慧和谨慎。「祢若垂顾婢女的苦情……并赐我一个儿子，我必将他[作为礼物]一生献给上主。」（撒母耳记上 1:11）她没有说：一年或两年，像我们所做的那样，也没有这样说：「如果你赐我一个孩子，我就给你钱」，而是：「当我生下我的头胎，一个藉祷告所得的儿子，我必将他全然献上作为礼物。」这确实是亚伯拉罕的女儿。上帝向他（亚伯拉罕）要求（儿子），他就给了；而这位妇人甚至在她所求的尚未成就之前就献上了。接着，请看那份敬畏，也在于：「经上说：『她的嘴唇只动着，她的声音却听不见。』」（撒母耳记上 1:13）怀着这样的心志，人才能亲近上帝，一个真心渴望得到所求之物的人，在他那里，懒惰、漫不经心、心不在焉、轻忽、疏忽大意都无处容身。那么，没有祷告（有人会说），难道上帝就不能赐予（安娜一个儿子）吗？难道祂真的在她开始祷告之前，就不知道这位妇人的愿望吗？但是，如果祂没有祈求就赐予（她儿子），那这位妇人的热心就不会显明，她的美德就不会显露出来，她也就不会得到如此大的赏赐。因此，长期不生育的原因不是嫉妒或仇恨，而是（上帝的）美善眷顾。'
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Итак, когда услышишь слова Писания, что (Бог) заключил ее утробу, и что она терпела досаду от своей соперницы, то знай, что этим (Бог) хотел показать любомудрие жены. Смотри в самом деле: (у Анны) был муж, совершенно ей покорный, говоривший ей:«не лучше ли я для тебя десяти сыновей?»(1Цар. 1:8)? Между тем ее соперница выводила ее из терпения своими упреками и нападками. И, однако ж, (Анна) не грозила ой, не ругалась с нею, не говорила (мужу): «так как моя соперница обижает меня, то взыщи с нее за это». У той были дети. Но ведь и эта пользовалась любовью мужа. Потому-то он и утешал ее, говоря:«не лучше ли я для тебя десяти сыновей?»Но обратимся опять к любомудрию жены.«То Илий счел ее, – сказано, –пьяною"(1Цар. 1:13). Смотри же, что говорит она ему:«не считай рабы твоей негоднойженщиной, ибо от великой печали моей и от скорби моей я говорила доселе»(1Цар. 1:16). Оставить гнев и не досадовать на людей, которые укоряют нас, не огорчаться, даже не оправдывать себя пред ними – так поступать может только человек с истинно сокрушенным сердцем. Ничто столько не располагает души к любомудрию, как сокрушение. Нет ничего сладостнее, как плач по Боге.«Ибо от великой печали моей и от скорби моей я говорила доселе». Будем подражать ей все.'
      cn: 那么，当你听到圣经的记载说，（上帝）使她的子宫闭塞，她又忍受着她情敌的恼恨时，你就当知道，（上帝）以此是想显明这位妇人的智慧。你看，事实上：（哈拿）有一个丈夫，完全顺从她，对她说：「难道我待你比十个儿子更好吗？」（撒母耳记上 1:8）。然而，她的情敌却用自己的讥讽和攻击，使她忍无可忍。可是，（哈拿）没有威胁她，没有和她吵骂，也没有对（丈夫）说：「既然我的情敌欺负我，你就为这事惩罚她。」那个情敌有孩子。但这位妇人也享有丈夫的爱。正因为如此，他安慰她，说：「难道我待你比十个儿子更好吗？」但我们再回到这位妇人的智慧。圣经说：「那时以利认为她是醉酒了。」（撒母耳记上 1:13）。你看，她对他说什么：「不要以为你的婢女是个卑劣的妇人，因为我因极大的忧伤和愁苦，才这样说话。」（撒母耳记上 1:16）。放下愤怒，不恼恨那些责备我们的人，不悲伤，甚至不在他们面前为自己辩解——只有内心真正痛悔的人才能如此行。没有什么能像痛悔一样，如此使灵魂倾向智慧。没有什么比为着上帝而哭泣更甜美了。「因为我因极大的忧伤和愁苦，才这样说话。」愿我们都效法她。
  - type: paragraph
    text:
      ru: Внимайте неплодные! Внимайте нежно любящие детей своих! Внимайте мужья и жены! Ведь и мужья нередко помогали в этом случае. Послушай, что говорит Писание:«И молился Исаак Господу о [Ревекке] жене своей, потому что она была неплодна»(Быт. 25:21). И в самом деле, вера может производить великие дела.«со всяким постоянством и молением обовсех святых», – себя ставить напоследок. Чего же ты хочешь, блаженный Павел, в заключение ставя себя самого? Вот чего, отвечает он:"и обомне, дабы мне дано было слово – устами моими открыто с дерзновением возвещать тайну благовествования, для которого я исполняю посольство в узах». К кому ты посольствуешь? К людям, отвечает. Какое человеколюбие со стороны Бога! Он послал с небес посланников с вестью о себе и о мире. А люди между тем взяли их и связали, не уважив даже всеобщего закона, по которому посланник во всяком случае освобождается от какой бы то ни было неприятности. Но и в узах посольствую. Узы угрожают мне лишением свободы говорить; за то молитва ваша отверзает мои уста,«дабы открыто с дерзновением возвещать», т. е. чтобы сказать все, что я послан возвестить.
      cn: '你们这些不育的，请听！你们这些温柔爱自己孩子的，请听！你们这些作丈夫和妻子的，请听！因为丈夫们在这种情况下也常常提供帮助。请听圣经所言：「以撒为他的妻子[利百加]向上主祷告，因为她不育。」(创世记 25:21) 确实，信心能成就伟大的事。


        「用各样的坚忍和祈求，为众圣徒祷告」——把自己放在最后。蒙福的保罗啊，你把自己放在最后，究竟想表达什么呢？他回答说：「就是这个：也为我祷告，使我得着口才，能以坦然无惧地开口，宣扬福音的奥秘；我为这福音的奥秘作了带锁链的使者。」你向谁作使者呢？他回答：向人。上帝何等仁爱世人！祂从天上差派使者，带来祂自己和关于和平的信息。然而，人们却抓捕并捆绑了他们，甚至不尊重普世的律法，按此律法，使者在任何情况下都免受任何伤害。


        但我即使在锁链之中，也执行使者使命。锁链威胁着我言说的自由；然而，你们的祷告却开启我的口，「使我能以坦然无惧地宣扬」，也就是，把我受差遣去宣扬的一切都说出来。'
  - type: paragraph
    text:
      ru: '«А дабы и вы знали о моих обстоятельствах и делах, обо всем известит вас Тихик, возлюбленный брат и верный в Господе служитель». Верен, значит – ни в чем не солжет, напротив, все расскажет по истине.«которого я и послал к вам для того самого, чтобы вы узнали о нас и чтобы он утешил сердца ваши». О, сколько тут любви! Чтобы не было, говорит, повода, кому только и чем вздумается, устрашать вас. По всей вероятности, они находились в каком-нибудь несчастии, так как и выражение:«чтобы он утешил сердца ваши»– значит: чтобы он (Тихик) не допустил вас до падения.«Мир братьям и любовь с верою от Бога Отца и Господа Иисуса Христа»(Еф.6:23). (Павел) желает им (ефесянам) мира и любви с верой. И не без цели так выразился. Он хочет, чтоб они не просто содержали слово любви, (но разумно), и не смешивались с иноверцами. Или это он имеет в виду, или то, что бы они содержали веру, чтобы ободряли себя надеждой на будущее."МирсБогоми любовь". Если есть мир, то будет и любовь. И наоборот, где любовь, там явится и мир."с верою". Никакой нет пользы от любви без веры, или, лучше сказать, без веры любовь вовсе и существовать не может.«Благодать со всеми, неизменно любящими Господа нашего Иисуса Христа. Аминь»(Еф.6:24). Здесь он допустил разделение, мир поместив особо, и благодать тоже. Сказано:«неизменно... Аминь». Что значит:«неизменно»? Или: прилично, как следует, или же: с нетленными, т. е. такими, которые живут не для славы и богатства, а для благ нетленных.Ἐν(в) стоит вместо:διά(посредством). Итак – посредством нетления; все равно, как сказать: посредством добродетели, – потому что тлением называются все вообще грехи. Как о девах употребляем выражение: «такая-то подверглась растлению», так говорится и относительно души. Потому и Павел сказал:«так и ваши умы не повредились»(2Кор. 11:3). И в другом месте говорит:«в учительстве ...неповрежденность»(Тит. 2:7).'
      cn: '「这样你们也能知道我的境况和事务，关于这一切，我所爱的弟兄，在主里忠信的执事提希古将向你们通报。」忠信，意味着他在任何事上都不会说谎，相反，他将按着真理讲述一切。「我打发他到你们那里去，正是为了这个目的，好让你们知道我们的消息，并让他安慰你们的心。」哦，这里蕴含着多少爱啊！他说，为的是不给任何人任何借口，用他们想到的任何方式来恐吓你们。很可能他们正处于某种不幸之中，因为「让他安慰你们的心」这句话的意思是：让（提希古）不让你们跌倒。


        「愿平安归与弟兄们，并愿爱与信心，从上帝父和主耶稣基督而来」（以弗所书 6:23）。（保罗）愿他们（以弗所人）得享平安，并拥有带着信心的爱。他这样表达并非没有目的。他希望他们不只是简单地持守爱的言语，（而是有智慧地），并且不与异教徒混杂。或者他指的是这个，或者是指他们要持守信仰，以便用对未来的盼望来鼓励自己。


        「平安与爱」。如果有平安，就会有爱。反之，哪里有爱，哪里就会显现平安。「带着信心」。离开了信心，爱毫无益处，或者更确切地说，离开了信心，爱根本无法存在。


        「愿恩典与所有以不朽的爱爱我们主耶稣基督的人同在。阿们」（以弗所书 6:24）。在这里他做了区分，将平安单独列出，恩典也同样。经文说：「不朽地……阿们」。这「不朽地」是什么意思呢？或者是指：合宜地，如其所是地；或者是指：带着不朽的，也就是说，那些不是为荣耀和财富而活，而是为不朽之善而活的人。希腊文的Ἐν（俄语的 ''в''，意为 ''在……里''）替代了 διά（俄语的 ''посредством''，意为 ''藉着''）。因此，就是藉着不朽；这与说「藉着美德」是同一个意思，因为「朽坏」泛指所有的罪。就像我们谈到童女时使用「某某被败坏了」这样的表达，同样也用来指灵魂。因此保罗说：「这样你们的心思才不至于被败坏」（哥林多后书 11:3）。在另一个地方他说：「在教导上……正直无伪」（提多书 2:7）。'
  - type: paragraph
    initial:
      ru: '5.'
      cn: '5.'
    text:
      ru: В самом деле, скажи мне, в чем состоит тление тела? Не в том ли, когда все оно разлагается и состав его распадается на части? Так бывает и с душой, когда в ней воцарится грех. Целомудрие и правда – вот красота души, а мужество и благоразумие – это здоровье для нее. Итак, тому угрожает опасность, кто гнусен и безобразен, кто предан корыстолюбию и лукавству, кто обнаруживает малодушие, боязливость и слабость. Что грехи производят тление, – это видно прямо из того, что они делают людей срамными и слабосильными, и причиняют недуги. Когда говорим, что девство подверглось растлению, то имеем в виду не одно растление тела, но главным образом то, что подобное дело соединено бывает с нарушением закона. Самый поступок при этом состоит в совокуплении. Но если б совокупление называлось растлением, то и брак был бы тем же. Значит, не в совокуплении растление, а в грехе – в нарушении закона; он-то и делает первое постыдным.
      cn: 实在地，请告诉我，身体的败坏在于什么？难道不就是当它整体分解，其构成部分也四分五裂的时候吗？灵魂也是如此，当罪恶在其中掌权时。贞洁与真理——这就是灵魂的美丽，而勇气与明智——这是它的健康。因此，危险就威胁着那卑劣丑恶、沉溺于贪婪诡诈、显出怯懦、胆怯和软弱的人。罪恶产生败坏——这直接从它们使人蒙羞且软弱无力，并带来病痛中可见一斑。当我们说童贞遭受了玷污时，我们指的不仅仅是身体的玷污，但主要的是，类似的行为总是与违背律法联系在一起。行为本身在此在于交合。但如果交合被称为玷污，那么婚姻也同样如此。所以说，玷污不在于交合，而在于罪恶——在于违背律法；正是它使前者变得可耻。
  - type: paragraph
    text:
      ru: 'Возьмем другой пример. Тление какого-нибудь дома, в чем другом состояло бы, как не в гниении (составляющих его частей)? Да и везде тление есть та или другая перемена, но перемена к худшему; везде оно разрушает прежнее состояние вещей и повергает их в иное. Слушай, что говорит Писание:«всякая плоть извратила путь свой»(Быт. 6:12); и в другом месте: «В тлении невыносимом»; еще:«люди, развращенные умом»(2Тим. 3:8). Тело у нас тленно, а душа нетленна. Как бы нам и ее не подвергнуть тлению? Первородный грех сделал это (возможным). Он даже после крещения может растлить душу и сделать ее добычей неумирающих червей. Но, с другой стороны, (черви) не могут и прикоснуться к душе, когда найдут ее нетленной. Адаманта, например, червь не грызет; да если б и стал грызть, ничего бы не сделал. Смотри же, не растлевай души твоей, – ведь что тлеет, то полно зловония. Послушай, что говорит пророк:«смердят, гноятся раны мои от безумия моего»(Пс. 37:6). Впрочем, самое тление облечется в нетление, а не нетление (в теле), – потому, что где нетление, там нет тления. Таким образом, возможны тление нетленное, без конца, и смерть бессмертная. Это именно и будет, когда тела сделаются бессмертными. Потому, если отойдем туда с тлением в душе, то оно сделается для нас нетленным, и не будет иметь конца. Постоянно гореть и быть всегдашней пищей червей, это, конечно, есть тление нетленное. Подобное случилось с блаженным Иовом. Он истлевал, однако ж, не разрушался, – и так продолжалось много времени. Только и знал, что постоянно обливал:«Тело мое одето червями и пыльными струпами»(Иов. 7:5).'
      cn: 让我们看另一个例子。任何房屋的朽坏，除了其组成部分的腐烂之外，还能是什么呢？而且无论何处，朽坏都是这样或那样的变化，但却是向着更坏的变化；它在任何地方都破坏事物的原有状态，并使它们陷入另一种状态。请听圣经所言：「凡有血气的，在地上都败坏了行为」(创世记 6:12)；又在另一处说：「在难以忍受的朽坏中」；再者：「心智败坏的人」(提摩太后书 3:8)。我们的身体是会朽坏的，而灵魂则是不朽的。我们又怎能让它也遭受朽坏呢？原罪使这成为可能。它甚至在受洗之后，仍能败坏灵魂，使其成为不死之虫的猎物。然而，另一方面，当虫子发现灵魂是不朽的时候，它们甚至无法触及灵魂。举例来说，虫子不会啃噬金刚石；即便开始啃噬，也无济于事。所以，你看，不要败坏你的灵魂——因为凡是朽坏的，都充满了恶臭。请听先知所言：「我的愚昧使我的伤口腐烂发臭」(诗篇 37:6)。然而，朽坏本身将穿上不朽，而非（身体的）不朽，——因为凡有不朽之处，就没有朽坏。如此一来，就有可能出现无休无止、不朽的朽坏，以及不死的死亡。这正是身体变得不死之时所会发生的事。因此，如果我们带着灵魂中的朽坏离世到那里，那么这朽坏将为我们变得不朽，并且永无止尽。持续燃烧，并成为虫子永远的食物，这，无疑就是不朽的朽坏。类似的事情也发生在蒙福的约伯身上。他虽然朽坏，却没有被毁灭——并且持续了很长时间。他只知道不断地哭诉说：「我的身体披上虫子和尘土的痂皮」(约伯记 7:5)。
  - type: paragraph
    text:
      ru: 'Нечто, похожее на это, испытывает душа в то время, когда обступят ее черви и станут пожирать, не два года, не три, десять или сто, даже не тысячи лет, а бесконечно, так как сказано:«где червь их не умирает и огонь не угасает»(Мк. 9:44). Устрашимся же, умоляю вас, убоимся этих слов, чтобы не испытать нам того на самом деле. Корыстолюбие есть тление – и такое тление, которое ужаснее всех видов тления: оно ведет к идолослужению. Бросим же это тление и изберем то, что нетленно. Нажил ли ты богатство на счет кого-нибудь? Нажитое потратится, а корыстолюбие останется при тебе. Опять, тление служит поводом к нетлению. Удовольствие проходит, грех же остается, – потому что он не тлеет. Крайняя беда, если еще в настоящей жизни не совлечемся всего этого, – и кто отойдет туда, обремененный тяжестью грехов, тот подвергнется великому несчастью."В аду, – сказано, –кто исповедаетТебя?"(Пс. 6:6)[5]. Там место суда, – и каяться тогда уже будет не время. Как рыдал тогда богач? И все напрасно. Как оправдывали себя не питавшие Христа? Но и те пошли в огонь вечный. Как тогда говорили те, которые провели жизнь свою в беззаконии?«Господи! не от Твоего ли имени мы пророчествовали? и не Твоим ли именем бесов изгоняли?»(Мф.7:22)? Но их даже не признал (Господь Своими). Правда, все это будет по смерти; но ведь тогда и помощь не в помощь, если не поможем себе в настоящее время. Убоимся же, чтоб и нам не сказать тогда этих слов:«Тогда праведники скажут Ему в ответ: Господи! когда мы видели Тебя алчущим, и накормили?»(Мф.25:37)? Станем теперь питать Его – и не один день, не два или три. Ведь сказано:«Милость и истина да не оставляют тебя»(Притч. 3:3), а не говорится: «сделай (какое-либо добро) один раз или два». Девы имели елей, но его не достало. Поэтому нужно запасаться большим количеством елея, и для этого надобно самим сделаться как бы плодоносными маслинами в дому Божьем. Подумаем, сколько каждый из нас имеет у себя греховной тяжести, и в соответствие с тем, сколько мы сделали грехов, столько же, а еще лучше – гораздо больше постараемся совершить подвигов человеколюбия. Тогда не только изгладятся грехи, но еще явятся праведные дела, которые послужат к нашему оправданию. В противном случае, если, наши добродетели не в состоянии будут с одной стороны загладить преступлений, а с другой – сделаться для нас оправданием за опущенное, то никто не исхитит нас от мучений, от которых и да избавимся все мы благодатью и человеколюбием Господа нашего Иисуса Христа, с которым Отцу и Св. Духу (слава, держава, честь, ныне и присно, и во веки веков. Аминь).'
      cn: 灵魂所经历的，类似于此：当虫子围拢它并开始吞噬它时，不是两年、三年、十年或一百年，甚至不是数千年，而是无限地，因为经上说：「在那里，虫是不死的，火是不灭的」（马可福音 9:44）。我恳求你们，让我们畏惧这些话，以免我们真的经历那一切。贪婪是败坏——并且这种败坏比所有形式的败坏都更可怖：它 dẫn 向偶像崇拜。那么，让我们抛弃这种败坏，并选择那不朽坏的。你是否靠着损人利己积攒了财富？所积攒的会耗尽，而贪婪却会伴随着你。此外，败坏也作为不朽坏的因由。快乐转瞬即逝，而罪孽却存留下来——因为它是不朽坏的。如果我们在此生尚未摆脱这一切，那将是极大的祸患——而谁若带着罪孽的重担离世而去，他将遭受巨大的不幸。「在阴间，谁来称颂祢？」（诗篇 6:6）[5]。那里是审判之地，而那时忏悔已为时已晚。那时，财主如何哭泣？而一切都枉然。那些没有供养基督的人如何为自己辩护？然而，他们也进入了永火。那时，那些一生作恶的人会怎样说呢？「上主啊，我们不是奉祢的名传道，奉祢的名赶鬼吗？」（马太福音 7:22）？但上主甚至不认他们为祂的。确实，这一切都将在死后发生；但那时，如果现在我们不自救，帮助也就不再是帮助了。那么，让我们畏惧，以免那时我们也说出这些话：「那时，义人要回答祂说：上主啊，我们什么时候见祢饿了，给祢吃呢？」（马太福音 25:37）？现在，让我们供养祂——不只是一天、两天或三天。因为经上说：「慈爱和信实不可离开你」（箴言 3:3），而不是说：「只做（某种善事）一次或两次」。童女们有油，但油不够了。因此，需要储备大量的油，为此，我们自己必须成为上帝家中的结果累累的橄榄树。让我们想想，我们每个人身上有多少罪孽的重担，并且按照我们所犯的罪孽数量，努力去行同样多的，甚至更好是多得多的爱人之功。那时，罪孽不仅会被涂抹，而且还会显现出义行，这些义行将成为我们的称义之因。否则，如果我们的美德一方面无法遮盖罪行，另一方面也无法成为我们对所疏忽之事的辩护，那么，没有人能将我们从苦难中拯救出来，愿我们所有人都能藉着我们的上主耶稣基督的恩典和爱人之心而脱离这些苦难，与父和圣灵同受荣耀、权能、尊崇，从今时直到永远，世世代代。阿们。
