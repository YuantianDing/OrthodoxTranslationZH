  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Представив общее учение о ветхом человеке, (апостол) потом изображает его подробно, потому что учение о каком-либо предмете, изложенное в подробностях, бывает удобопонятнее. Что же говорит он?«Посему, отвергнув ложь». Какую ложь? Не разумеет ли он идолов? Нет. Хотя и идолы – ложь, но здесь речь не о них, так как (ефесяне) не имели никакого общения с идолами. Он говорит им о лжи по отношению друг к другу, т. е. о лукавстве и обманах:«говорите истину каждый ближнему своему», – и представляет сильное побуждение к этому:«потому что мы члены друг другу»; поэтому никто пусть не обманывает своего ближнего. Об этом и Псалмопевец повсюду говорит:«уста льстивы, говорят от сердца притворного»(Пс. 11:3). Ничто, решительно ничто столько не производит вражды, как ложь и обман! Заметь же, как везде (апостол) пристыжает их, указывая на (взаимную верность членов) тела. Глаз, говорит он, не обманывает ноги, ни нога – глаза. Если бы, например, случился глубокий ров, а поверх его положены были на земле прутья и закрыты землей, так что глазам обманчиво представлялась бы здесь твердая земля, не воспользуется ли (глаз) ногою, чтобы узнать, пустое ли пространство внизу, или же место твердое, на котором можно удержаться? Солжет ли при этом нога, не откроет ли того, что есть? А если глаз увидит змия, или зверя, обманет ли он ногу? Не даст ли тотчас знать ей об этом, чтобы она, узнавши это от него, шла осторожно? Точно также, когда ни глаз, ни нога не имеют средств узнать вредного яда, но все будет зависть от обоняния, ужели обоняние солжет устам? Никак. А почему? Потому что в таком случае оно погубит и себя. Напротив, как ему (обонянию) представится, так оно и говорит. А язык разве обманывает желудок? Не выбрасывает ли он того, что находит противным, и не глотает ли приятного? Вот каков взаимный обмен услуг (между членами тела). Замечай же, как верно, и при том, так сказать, чистосердечно производится это взаимное предостережение. Так и мы не будем лгать, если мы члены одного тела. Это будет знаком нашего дружества, а противное этому – вражды. Но как же быть, говорят, когда такой-то строит против меня ковы? Познавай истину: если он строит тебе ковы, то он уже не член (тела). А (апостол) сказал: не обманывайте член члена.'
      cn: '阐述了关于旧人的普遍教导后，使徒接着详细描绘了他，因为任何事物的教导，若以细节阐述，会更容易理解。那么他说了什么呢？「所以，你们既已弃绝谎言。」什么谎言呢？他是指偶像吗？不是。尽管偶像也是谎言，但这里所指的并非它们，因为（以弗所人）与偶像毫无瓜葛。他告诫他们关于彼此之间的谎言，即指诡诈和欺骗：「各人与邻舍说实话」，并为此提出了一个强烈的动机：「因为我们是互为肢体」；所以，没有人可以欺骗自己的邻舍。诗篇作者也到处论及此事：「说谎的嘴唇，口出虚伪言语。」（诗篇 11:3）没有任何事物，确实没有任何事物，能像谎言和欺骗那样制造仇恨！


        你们看，使徒如何处处使他们感到羞愧，指出身体各肢体之间的相互忠诚。眼睛，他说，不欺骗脚，脚也不欺骗眼睛。举例来说，如果有一个深沟，上面铺着树枝并用土覆盖，以致眼睛错误地以为那里是坚实的地面，眼睛难道不会利用脚去探知下面是空虚的，还是坚实可立足的地方吗？在这种情况下，脚会说谎吗？它难道不会揭示真实情况吗？如果眼睛看见了蛇或野兽，它会欺骗脚吗？它难道不会立刻告诉脚，让脚从它那里得知后小心行走吗？同样，当眼睛和脚都无法辨识有害毒物，而一切都依赖嗅觉时，嗅觉会欺骗嘴巴吗？绝不会。为什么呢？因为在这种情况下，它也会毁灭自己。相反，它（嗅觉）感知到什么，就说什么。舌头难道会欺骗胃吗？它难道不会吐出那些令人不适的东西，而吞下那些令人愉悦的吗？这就是身体各肢体之间相互服务的模式。你们看，这种相互的警示是多么真实，而且可以说，是多么真诚地进行着。同样，如果我们是同一身体的肢体，我们就不会说谎。这将是我们友谊的标志，反之则是仇恨的标志。


        但是，有人会说，如果某人正在对我设下诡计，该怎么办呢？认识真理：如果他对你设下诡计，那么他就已经不再是（身体的）肢体了。而（使徒）说：「肢体不可欺骗肢体。」'
  - type: paragraph
    text:
      ru: '«Гневаясь, не согрешайте».Заметь мудрость: он говорит о том, как нам не согрешать, потом не оставляет и не послушавших этого наставления: так он дорожит своим духовным порождением! Как врач, давши наставления больному касательно того, как ему должно вести себя, не оставляет его своим попечением и тогда, когда больной не исполнит его наставлений, но, убедивши его пользоваться данным наставлением, снова врачует его, – так точно поступает и Павел. Врач, заботящийся только о собственной славе, оскорбляется, когда (больные) пренебрегают его наставлениями; но кто всегда заботится о здоровье больного, тот имеет в виду одно только то, как бы поднять его с постели. Таков именно и Павел. Он сказал: не лгите. Если же случится, что ложь подвигнет кого-нибудь на гнев, то он и против этого предлагает врачество. Что же говорит он?«Гневаясь, не согрешайте». Хорошо не гневаться; но если кто впадет в эту страсть, то, по крайней мере, не на долгое время:"солнце, – говорит, –да не зайдет во гневе вашем». Ты не можешь удержаться от гнева? Гневайся час, два, три; но да не зайдет солнце, оставив нас врагами. Оно по благости (Господа) взошло, – да не зайдет же, сиявши на недостойных. Если Владыка послал его по многой своей благости и сам оставил тебе согрешения, а ты не оставляешь их своему ближнему, то подумай, какое это большое зло. При том от него может происходить и другое зло. Блаженный Павел опасается, чтобы ночь, захвативши в уединении человека, потерпевшего обиду и еще пламенеющего (гневом), не разожгла огня еще более. Днем, пока еще многое раздражает тебя, тебе позволительно дать в себе место гневу; но когда наступает вечер, примирись и погаси возникшее зло. Если ночь застанет тебя (во гневе), то следующего дня уже не довольно будет для погашения зла, которое может возрасти в тебе в продолжение ночи. Если даже большую часть его ты и уничтожишь, то не в состоянии будешь уничтожить всего, и в следующую ночь дашь возможность более усилиться оставшемуся огню. Как солнце, если дневной теплоты его не довольно бывает для осушения и очищения воздуха, наполнившегося облаками и испарениями в продолжение ночи, дает этим повод быть грозе, когда ночь, захвативши остаток этих паров, прибавляет к ним еще новые испарения, – так точно бывает и в гневе.«И не давайте места диаволу». Итак, враждовать друг против друга  – значит давать место дьяволу. Тогда как должно нам соединиться вместе и восстать против него, мы, оставивши вражду против него, позволяем себе обратиться друг на друга. Подлинно, ничто так не способствует дьяволу находить место среди нас, как вражда.'
      cn: '「动怒，却不要犯罪。」 (以弗所书 4:26)


        注意其中的智慧：他教导我们如何不犯罪，之后也不放弃那些不听从这训诲的人：他如此珍视自己的属灵后裔！正如医生，给病人指示其应如何行事之后，即便病人未能遵从其指示，也仍不放弃对其的照护，反而劝说他使用所给的指示，再次医治他——保罗的行事亦是如此。只顾自身荣耀的医生，当病人忽视其指示时，会感到被冒犯；但那些始终关怀病人健康的人，心里只有一个念头，就是如何使病人康复下床。这正是保罗的为人。他曾说：不要说谎。如果碰巧谎言激怒了某人，那么他对此也提供了医治之法。他又说了什么呢？「动怒，却不要犯罪。」 (以弗所书 4:26)


        不动怒是好的；但若有人陷入此情欲，至少不要长久：「他说，不可含怒到日落。」 (以弗所书 4:26) 你不能克制怒气吗？那就发怒一小时，两小时，三小时吧；但不可含怒到日落，使我们仍是仇敌。它因上主的美善而升起，——愿它不要落下，因为它曾照耀不配之人。如果上主因其浩瀚的美善而差遣它，并且亲自赦免了你的罪过，而你却不赦免你的邻人，那么想想看，这是多么大的罪恶啊。此外，由此还会产生其他罪恶。蒙福的保罗担心，夜晚在独处中抓住一个受过冒犯且仍怒火中烧的人，会使怒火燃烧得更炽烈。白天，当许多事物仍让你感到恼怒时，你或许可以给自己一些发怒的空间；但当夜晚降临，就当和解并熄灭那已生发的罪恶。如果夜晚发现你（仍在怒中），那么次日将不足以熄灭那可能在你心中滋长一夜的罪恶。即使你消灭了大部分怒火，也无法完全将其消除，而在接下来的夜晚，你将让残余的火焰有机会更加炽盛。正如太阳，如果白日的温暖不足以烘干和净化夜间充满云雾和水汽的空气，就会导致雷雨，因为夜晚会抓住这些残留的水汽，并增添新的蒸气——动怒的情况也正是如此。


        「也不可给魔鬼留地步。」 (以弗所书 4:27) 如此看来，彼此为敌——就意味着给魔鬼留地步。本应我们团结起来一同对抗它，我们却放弃了对它的敌对，反而彼此相向。确实，没有什么比仇恨更能帮助魔鬼在我们中间找到立足之地了。'
