    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Потому-то и блаженный Павел, отвлекая нас от неправды, ведет к добродетели. Да и что пользы, скажи мне, в том, если будут вырваны все терния, но не будут посеяны полезные семена? Труд опять послужит нам к такому же вреду, если останется недовершенным. Потому-то и Павел, усильно заботясь о нас, дает нам заповеди не только об отсечении и удалении злых дел, но и побуждает в скором времени показать насаждение дел добрых. Сказавши:«Всякое раздражение и ярость, и гнев, и крик, и злоречие со всякойзлобойда будут удалены от вас», он присовокупил:«но будьте друг ко другу добры, сострадательны, прощайте друг друга», – потому что это – навыки и расположения, и недостаточно удалиться от одного навыка, чтобы вместо него приобрести другой (противоположный), но нужно снова некоторое движение и стремление, не меньшее, чем при удалении от злых дел, для того, чтобы стяжать дела добрые. И в отношении к телу, черный, освободившись от этого качества, еще не вдруг делается белым. Впрочем, не станем говорить о предметах физических, но приведем пример из мира нравственного. Тот, кто не враг, не есть и полный друг: есть нечто среднее между враждой и дружбой, в каковых отношениях к нам большая часть людей преимущественно и находится. Тот, кто не плачет, еще не всегда смеется, но есть состояние среднее. Так и здесь, кто не досадителен, тот еще не совершенно добр, и кто не гневлив, тот не совсем участлив. Но нужно еще особое старание, чтобы стяжать такое благо. И смотри, как по требованиям лучшего земледелия блаженный Павел очищает и возделывает землю, вверенную ему Земледельцем: он выбросил гнилые смена, потом увещевает приобрести надлежащие растения.«Будьте ...добры», – говорит он. Если после того, как терния будут вырваны, земля будет оставаться праздной, то снова возрастит бесполезные травы. Поэтому, нужно наперед отдых и праздное состояние ее сменить посевом добрых семян и растений. (Апостол) уничтожил гнев, – положил доброту; уничтожил досаду, – положил сострадательность; вырвал злобу и злоречие, – насадил помилование. Слова:«прощайте друг друга»– это именно и означают. Будьте, говорит он, склонны к прощению (обид), потому что такая милость больше (той, какая оказывается) в делах денежных. Тот, кто прощает деньги сделавшему у него заем, делает прекрасное и достойное удивления дело; но такая милость (касается) тела, хотя он и приемлет себе воздаяние сокровищами духовными и относящимися к душе. Но тот, кто простил грехи, принес пользу душе – и своей собственной, и того, кто получил прощение, потому что таким образом действий он сделал более кротким не только себя, но и его.'
      cn: '因此，蒙福的保罗引导我们远离不义，并引向美德。况且，请你告诉我，如果所有的荆棘都被拔除，却没有播下有益的种子，那有什么益处呢？如果这项努力仍然未完成，它仍将对我们造成同样的损害。因此，保罗殷切地关怀我们，不仅赐予我们关于砍除和除去恶行的诫命，而且敦促我们尽快展现善行的栽植。


        他说：「一切的苦毒、恼恨、愤怒、嚷闹、毁谤，连同一切的恶毒，都当从你们中间除掉。」他接着说：「然而你们要彼此和善，心存怜悯，互相宽恕。」——因为这些是习惯和性情，仅仅远离一种习惯，不足以代替它获得另一种（相反的）习惯；但需要再次付出某种努力和追求，其程度不亚于远离恶行，以便获取善行。就身体而言，黑色一旦摆脱其自身的这种特质，并不能立刻就变成白色。然而，我们不谈论物质层面，而是举一个道德层面的例子。不作仇敌的人，也并非就是完全的朋友：仇敌与友谊之间存在某种中间状态，而大部分人对我们主要就处于这种关系之中。不哭泣的人，也并非总是欢笑，而是存在一种中间状态。同样地，不惹人恼怒的人，也还未完全善良；不易怒的人，也并非全然富有同情心。但还需要特别的努力，才能获取这种美善。


        而且请看，按照更优良的耕作要求，蒙福的保罗如何洁净和耕耘那由那位栽种者托付给他的土地：他扔掉了腐烂的种子，然后劝诫（我们）获取适当的植物。他说：「你们要……和善」。如果荆棘被拔除后，土地仍然荒芜，那么它将再次长出无用的杂草。因此，需要事先用播种善的种子和植物来取代它的休歇和荒芜状态。使徒消除了愤怒，——代之以和善；消除了恼怒，——代之以怜悯；拔除了恶毒和毁谤，——栽植了宽恕。「互相宽恕」这句话正是这个意思。他说，你们要乐于宽恕（冒犯），因为这种怜悯胜过在金钱事务上所施予的怜悯。饶恕欠他钱财之人的人，所做的乃是一件美好而令人称奇的事；但这种怜悯（关乎）身体，尽管他自己也领受了属灵和关乎灵魂的宝藏作为报偿。但饶恕罪过的人，对灵魂——包括他自己的和那蒙受宽恕之人的——都带来了益处，因为以这样的行事方式，他不仅使自己，也使对方变得更加温柔。'
  - type: paragraph
    text:
      ru: Мы не столько, преследуя обидевших нас, уязвляем их души, сколько, прощая их, приводим их в смущение и стыд. Между тем (поступая мстительно) мы не приносим пользы ни самим себе, ни им, а, напротив, и им, и себе вредим, теряя"мзду» (Ис. 1:23), подобно начальникам иудейским, и возжигая гнев во врагах. Если же за несправедливость мы заплатим кротостью, то, утоливши весь гнев его (врага), мы через это при нем самом как бы воссели на судилище, решающее дело в нашу пользу и сильнее осуждающее его, чем нас. Он сам обвинит себя и осудит, и будет искать всякого случая, чтобы отплатить за оказанную ему долю великодушия еще большей мерой, зная, что если он отплатить равной, то окажется ниже, потому что не первый начал, но получил пример от нас, и потом принес меньше (нас). Итак, он будет стараться превысить меру, чтобы недостаток, какой потерпел он оттого, что вторым пришел к отплате, уничтожить чрезмерностью отплаты, и чтобы ущерб, который от времени потерпел тот, кто прежде подвергся страданиям (от обиды), сделать общим посредством чрезвычайной кротости. Люди, если они благодарны, не столько сетуют о зле, сколько о добре, которое получают от обиженных ими, потому что и нечестиво, позорно и смешно, получая благодеяния, не воздавать тем же. Когда потерпевший зло не воздает тем же, это привлекает ему похвалы, рукоплескания и одобрение от всех; потому-то в особенности (получающие такие благодеяния) и уязвляются этим. Итак, если хочешь мстить, мсти этим способом; воздавай добром за зло, чтобы сделать его (врага) должником и одержать дивную победу. Потерпел ты зло? Делай добро, и таким образом мсти врагу. Если ты его преследуешь, то все порицают равно и тебя, и его; если же ты перенесешь (обиду), то, наоборот, тебе будут рукоплескать и удивляться, а его обвинять.
      cn: 与其说我们借着追究那些冒犯我们的人来刺伤他们的灵魂，不如说我们借着饶恕他们更能使他们感到困惑和羞愧。同时（以报复的方式行事），我们于自己和他们都无益处，反而对他们和我们自己都有害，失去「报酬」（以赛亚书 1:23），就像犹太人的首领一样，并激起仇敌的怒气。然而，若我们以温柔来偿还不公，那么，在平息了（仇敌）他一切的怒气之后，我们便借此在他面前如同坐上审判席，裁决案件对我们有利，并且更强烈地定他的罪，而非定我们的罪。他会自我谴责和定罪，并且会寻求一切机会，以更大的方式回报施予他的那份宽宏大量，他知道，如果他以同等的程度回报，他就会显得低下，因为他不是第一个开始的，而是从我们这里得了榜样，而后所付出的更少。因此，他会努力超越其限度，通过过度的回报来消除他因第二次才来报答所遭受的不足，并使那首先遭受痛苦（因冒犯）之人，其随时间而承受的损害，借着非凡的温柔得以共同消弭。人们，如果他们心怀感恩，不那么为恶行而悲叹，反倒是更多地为他们从被他们冒犯者那里所得到的善行而感到羞愧，因为蒙受恩惠而不以同样的方式回报，是亵渎不敬的，是可耻的，也是可笑的。当受害者不以同样的方式回报恶行时，这会为他赢得所有人的赞扬、鼓掌和认可；正因如此，那些（接受这类恩惠的人）尤其因此感到被刺伤。因此，如果你想报复，就用这种方式报复：以善报恶，好使他（仇敌）成为你的债务人，并赢得一场奇妙的胜利。你受了恶待吗？那就行善，并以此方式报复仇敌。如果你追究他，那么所有人都会同样地谴责你和他；然而，如果你忍受（冒犯），那么，相反地，所有人都会为你鼓掌并感到惊奇，而他则会被谴责。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Что может быть неприятнее для врага, как видеть, что сопернику его все удивляются и рукоплещут? Что горче для врага, как видеть, что его все осуждают в глазах его неприятеля? Если ты ему отомстишь и, может быть, обвинишь его, ты отомстишь один; а если простишь ему, то все отомстят ему за тебя, а это (т. е.)  – иметь врагу стольких мстителей – тягостнее, чем терпеть зло. Если ты откроешь уста, замолчат они; если же замолчишь ты, то поразишь его не одними устами, но тысячами других, и так отомстишь гораздо более. Когда ты станешь порицать (врага), то многие тебя осудят, именно скажут, что это – слова страсти; а когда ничем не обиженный станет осыпать его порицаниями, тогда мщение совершенно чисто от всякого подозрения. И, действительно, когда те, которые не потерпели ничего неприятного, по причине чрезмерной твоей кротости, вместе с тобою скорбят, как обиженные, то это мщение свободно от всякого подозрения. Что же, скажут, неужели никто не мстит? Быть не может, чтобы люди были каменные, так что не удивились бы, при виде такого любомудрия. И хотя бы в то время они и не отомстили, но впоследствии, будучи в состоянии (это сделать), сделают: насмеются над ним и охулят его. Да если и никто другой не удивится тебе, он сам вполне удивится, хотя и не скажет этого. Ведь понятие о добре, хотя бы мы впали в самую бездну зла, остается у нас невредимым и несокрушимым. Почему, думаешь ты, Господь наш Христос говорит:«Но кто ударит тебя в правую щеку твою, обрати к нему и другую»(Мф.5:39)? Не потому ли, что чем более кто будет великодушен, тем более и себе и ему принесет великой пользы? Для того повелел Он обратить и другую (ланиту), чтобы исполнить пожелание разъяренного. Кто такой зверь, чтобы не пришел наконец в себя? Говорят, что и собаки так поступают: когда они залают и нападут на кого-нибудь, то стоит тому упасть навзничь, и они ничего не сделают, и это потушает всю их ярость. Итак, если и они стыдятся того, кто выказывает готовность потерпеть от них зло, то тем более – род человеческий, который разумнее.'
      cn: 对仇敌来说，还有什么比看到他的对手受到所有人的惊叹和喝彩更令人不快的呢？对仇敌来说，还有什么比看到所有人在他敌人的面前谴责他更痛苦的呢？如果你报复他，或许指责他，那你只是独自报复；但如果你宽恕他，所有人都会替你向他复仇。而这（即，让仇敌面对如此众多的复仇者）比忍受恶行更令人难以承受。如果你开口说话，他们就会沉默；但如果你沉默，你将不只用一张嘴，而是用成千上万张嘴打击他，如此一来，你的复仇将更加彻底。当你开始指责（仇敌）时，许多人会谴责你，他们会说，这些是出于激情的言语；但当一个未受任何冒犯的人开始对他进行指责时，这种复仇就完全没有任何嫌疑。确实，那些未曾遭遇任何不快的人，因着你极度的温柔，与你一同哀伤，如同受了冒犯一般，那么，这种复仇便没有任何嫌疑。那么，他们会说，难道就没有人复仇吗？人不可能是石头做的，以至于看到这种美德而无动于衷。即便当时他们没有复仇，但之后，一旦有机会（这样做），他们就会：嘲笑他，并贬损他。即使没有其他人惊叹于你，他自己也会完全惊叹，尽管他不会说出来。因为关于善的观念，即便我们堕入罪恶的深渊，在我们心中依然完好无损，坚不可摧。你认为，为什么我们的主基督说：「有人打你的右脸，连左脸也转过来由他打」（马太福音 5:39）？难道不是因为一个人越是宽宏大量，就越能给自己和对方带来巨大的益处吗？他吩咐我们转过另一边（脸颊），是为了满足那狂怒之人的愿望。谁是那样的野兽，最终不会清醒过来呢？据说狗也是这样：当它们吠叫并攻击某人时，只要那人仰面倒下，它们就不会再做什么，这便熄灭了它们所有的狂怒。那么，如果连它们都羞于攻击那些表现出甘愿忍受其伤害的人，那么，更何况是更具理性的全人类呢。
  - type: paragraph
    text:
      ru: 'Но стоит упомянуть о том, что пришло на память мне много прежде и приведено было в доказательство. Что же это? Мы говорили о иудеях и их начальниках, что они обвиняются (Богом), как гонящие мзду (Ис. 1:23). Хотя им и дозволял это закон:«Око за око, зуб за зуб»(Лев. 24:20), но не для того, чтобы они выкалывали друг другу глаза, а чтобы по страху потерпеть (тоже взаимно) удерживали дерзость, не делали ничего худого другим и сами не терпели того же от других. (Слова):«Око за око»сказаны для того, чтобы связать руки его, а не для того, чтобы направить против него твои, – и не для того, чтобы обезопасить от вреда только твои глаза, но и для того, чтобы сохранить целыми и его глаза. Но, как я уже спрашивал, для чего, если мщение было позволено, те, которые употребляли его на деле, подвергались обвинению? Что это значит? Это направлено против злопамятства. Потерпевшему зло позволялось тотчас действовать (сообразно с ним), для того, как я сказал, чтобы удержать обидчика; но отнюдь не позволялось помнить зла. 3лопамятство есть дело не гнева и не пылкого увлечения, но обдуманной злобы. Бог снисходит тем, кто внезапно подвергся оскорблению и устремился на мщение; потому и говорится:«Око за око». А в другом месте: «Напути... зла –...смерть"(Притч. 12:28). Если же, несмотря на то, что дозволено вырвать око на око, полагается такое наказание злопамятным, то не тем ли большее (потерпят) те, которым повелено быть готовыми к перенесению зла? Итак не будем злопамятны, но погасим гнев, чтобы сподобиться милости от Бога."Какоймероймерите, – говорит Он, –такоюи вам будут мерить»(Мф.7:2). Будем же человеколюбивы, и сострадательны к сорабам, чтобы и в настоящей жизни избежать сетей, и в день будущий получить от Него прощение, благодарю и человеколюбием (Господа нашего Иисуса Христа, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь).'
      cn: 不过，值得一提的是，我多年前便记忆犹新、并曾援引为证的那个说法。那是什么呢？我们曾谈到犹太人和他们的首领，他们被上帝指控为图谋贿赂之人（以赛亚书 1:23）。虽然律法允许他们这样做：「以眼还眼，以牙还牙」（利未记 24:20），但这并非为了让他们互相挖眼，而是为了让他们因惧怕遭受同样的报复而抑制胆大妄为，不做恶事于人，也不受他人之害。（这句）「以眼还眼」是为了束缚他的手，而不是为了引导你的手去攻击他——这不仅是为了保护你的眼睛免受伤害，也是为了保全他的眼睛完好无损。但是，正如我之前所问，如果报复是被允许的，那些实际施行报复的人为何会受到指控呢？这意味着什么？这是针对怀恨而言的。受害者被允许立即采取行动（以眼还眼），正如我所说，是为了制止施害者；但绝不允许怀恨。怀恨不是愤怒或一时冲动之举，而是深思熟虑的恶意。上帝宽恕那些突然受辱而立即寻求报复的人；因此才有「以眼还眼」之说。而在另一处则说：「恶人的道路引向死亡」（箴言 12:28）。然而，即使被允许以眼还眼，怀恨者仍会受到这样的惩罚，那么那些被命令准备好忍受恶行的人，难道不会遭受更大的（惩罚）吗？因此，我们不要怀恨，而要平息怒气，以便蒙受上帝的怜悯。祂说：「你们用什么量器量给人，也必用什么量器量给你们」（马太福音 7:2）。所以，我们要心怀仁爱，怜悯我们的同仆，以便在今生避免罗网，并在未来的日子里从祂那里得到赦免，这都因着我们主耶稣基督的感恩和仁爱（与父和圣灵一同，归于祂荣耀、权柄、尊贵，从今时直到永远。阿们）。
