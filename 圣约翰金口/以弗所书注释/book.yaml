    text:
      ru: 'Когда блаженный Павел желает расположить (христиан) к чему-нибудь особенно высокому, то, будучи исполнен мудрости и духовности, он побуждает к этому предметами небесными – примером самого Господа. Так в одном месте он говорит:«и живите в любви, как и Христос возлюбил нас и предал Себя за нас»(Еф.5:2), и еще:«Ибо в вас должны быть те же чувствования, какие и во Христе Иисусе: Он, будучи образом Божиим, не почитал хищением быть равным Богу»(Фил. 2:5–6). Точно также поступает и здесь. Когда бывают указаны великие примеры, у человека рождается сильная ревность и желание (подражать им). Итак, что же он говорит, побуждая нас к единению?«Одно тело и один дух, как вы и призваны к одной надежде вашего звания; один Господь, одна вера, одно крещение»(Еф.4:4–5). Что же такое"Одно тело"? Верные всех мест вселенной, живущие, жившие и имеющие жить. Угодившие (Богу) до пришествия Христова тоже составляют одно тело. Почему? Потому, что и они познали Христа. Откуда это видно?«Авраам, отец ваш, – сказано, –рад был увидеть день Мой; и увидел и возрадовался»(Иоан. 8:56); еще:«Ибо если бы вы верили Моисею, то поверили бы и Мне, потому что он писал обоМне"(Иоан. 5:46). Действительно, не стали бы писать о том, о ком не знали, что сказать. Если же знали, то без сомнения и почитали. Потому-то и они составляют одно тело. Тело не отделяется от духа, иначе оно не было бы телом, – потому что у нас о предметах, соединяемых между собою и имеющих большую связь, обыкновенно говорится: одно тело. Так точно и сами мы в соединении составляем одно тело, при одной главе. При единстве же того и другого, тело хотя состоит и из разных членов, важных и неважных, однако ни лучший из них не вооружается против члена ничтожного, ни первый не подвергается зависти со стороны последнего. И хотя не все (члены) имеют одинаковое отправление, а каждый подчиняется определенному требованию необходимости, однако, поэтому самому, – что все совершается ими по необходимости, или по требованию различных нужд, – все они равно достойны уважения. Впрочем есть между ними одни высшие, а другие низшие, как например, голова господствует над всем телом, в ней заключаются все чувства и самое господство души, – вследствие чего без головы никому нельзя жить, тогда как, по отсечении ног, многие надолго еще остаются в живых. Таким образом, голова лучше прочих (членов) не только по своему положению, но и по своей деятельности и значению. Но для чего я говорю об этом? И в Церкви много есть таких, которые достигли такой же высоты, как и голова, созерцают небесное, как глаза в голове, весьма удалены от земли и не имеют ничего общего с ней. Иные же занимают место ног, попирая землю, – ног, впрочем, здоровых. Ведь ногам вменяется в преступление не то, что они попирают землю, а то, что они уклоняются на путь нечестия, что"Ноги их, – как сказано, –бегут ко злу»(Ис. 59:7).'
      cn: 当蒙福的保罗想要引导（基督徒）去追求某种特别崇高之物时，他便以天上的事物——以上主自身的榜样——来促使他们，因他充满了智慧和属灵性。如此，他在一处说：「并且要活在爱中，正如基督爱了我们，为我们舍弃了自己」（以弗所书 5:2），又说：「你们当有与基督耶稣相同的意念：祂本有上帝的形象，却不以自己与上帝同等为强夺」（腓立比书 2:5-6）。他在这里也同样如此行。当伟大的榜样被指明时，人便会生出强烈的热忱和效法（它们）的愿望。那么，他敦促我们合一之时说了什么呢？「一具身体和一位圣灵，正如你们蒙召，是为着你们所蒙召的同一希望；一位上主，一种信仰，一次洗礼」（以弗所书 4:4-5）。那么，「一具身体」是什么呢？普世各地的信实之人，现今活着、曾活过并将要活着的人。在基督降临前取悦（上帝）的人也构成一具身体。为何呢？因为他们也认识了基督。这从何而知呢？「你们的父亚伯拉罕，——经文说，——欢喜地盼望看见我的日子；他看见了，就欢喜了」（约翰福音 8:56）；又说：「因为你们若信摩西，也必信我，因为他写过关于我的事」（约翰福音 5:46）。确实，他们不会去写那些他们不知如何提及之人。既然他们知晓，那么毫无疑问也必尊崇。正因如此，他们也构成一具身体。身体不与灵分离，否则它就不成其为身体——因为对于相互连接并具有紧密关联的事物，我们通常称之为：一具身体。同样，我们自身在联合中也构成一具身体，并以同一位元首为头。而当这两者合一时，身体虽由不同成员构成，有重要者亦有不重要者，然而，其中最好的成员不攻击微不足道的成员，最好的也不受最末的成员嫉妒。并且尽管并非所有（成员）都承担相同的功能，而每个都服从于特定的必要要求，然而，正因如此——因为一切皆由他们按必要性或按各种需求的要求而完成——他们都同样值得尊敬。然而，在它们之中有高等级的，也有低等级的，比如，头支配着整个身体，所有的感觉和灵魂的主宰都在其中——因此，没有人可以在没有头的情况下生存，然而，在双腿被截去之后，许多人仍能活很长时间。如此，头不仅因其位置，也因其活动和重要性而优于其他（成员）。但我为何提及这些呢？在教会中也有许多人达到了与头同样的高度，如头部的眼睛般默观天上的事，远离尘世，与尘世毫无瓜葛。另一些人则占据了双脚的位置，践踏着大地——不过，是健康的双脚。因为双脚被视为犯罪，并非因为它们践踏大地，而是因为它们偏离了不敬虔的道路，因为「它们的脚，——如经文所说，——奔向邪恶」（以赛亚书 59:7）。
  - type: paragraph
    text:
      ru: 'Итак, ни глаза не должны презирать ног, ни ноги завидовать глазам. В противном случае, каждый член теряет собственное достоинство, и надлежащее употребление его бывает затруднительно. И справедливо: злоумышляющий на ближнего своего тем самым, прежде всего, злоумышляет на себя самого. Так, если ноги не захотят носить головы, когда нужно бывает передвижение с одного места на другое, то своей недеятельностью и неподвижностью они вредят и себе самим. Равным образом, если бы и голова не захотела иметь никакого попечения о ногах, то этим она, прежде всего, повредила бы себе самой. Но они (т. е. голова и ноги), как и следует, не враждебны друг другу, потому что так устроены природой. Каким же образом человеку можно не восставать против человека? Никто (скажешь) не восстает против ангелов, так как и они не восстают против архангелов; животные также не могут одержать верх надо мной; а где природа одинакового достоинства, где одинаковые дарования и никто не имеет более другого, – почему же нельзя восставать одному против другого? Но это-то самое и не дает тебе права восставать против ближнего. Если все общее, и ни один против другого не имеет ничего большого, то на каком основании можно превозноситься одному пред другим? Мы наделены одинаковой природой, сходны по душе и по телу, дышим одним и тем же воздухом и употребляем одинаковую пищу: почему же будем восставать (друг против друга)? Правда, возможность через добродетельную жизнь стать выше бесплотных сил может вести к высокому мнению о себе; но это еще не было бы высокомерием. Ведь я по праву ставлю себя высоко и очень высоко в сравнении с демоном. Смотри, каким образом и Павел ставил себя выше демона. Когда много удивительного говорил о нем демон, то он заставлял его молчать, не поддаваясь обольстителю. Так, когда отроковица, имевшая дух пытлив, говорила:«cии человеки – рабы Бога Всевышнего, которые возвещают нам путь спасения»(Деян. 16:17), – он, после строгого воспрещения, связал ему его бесстыдный язык. И еще, в другом месте, он же пишет следующие слова:«Бог же мира сокрушит сатану под ногами вашими вскоре»(Рим. 16:20). Не следствие ли это различия природы?'
      cn: '因此，眼睛不应藐视双脚，双脚也不应嫉妒眼睛。否则，每个肢体就失去了自身的尊严，并且其恰当的功用也会变得困难。这是公正的：恶意攻击自己邻人者，首先就是恶意攻击自己。如此，若双脚不愿承载头部，当需要从一处移动到另一处时，那么它们的无为和静止，也会伤害到它们自身。同样，倘若头部也不愿对双脚有任何关顾，那么它首先就会伤害到它自己。但它们（即头部和双脚），正如所应有的，彼此之间并无敌意，因为它们是自然如此构造的。


        那么，人如何才能不反抗人呢？没人（你会说）会反抗天使，因为天使也不会反抗总领天使；动物也无法胜过我；然而，在本质同等尊贵，禀赋相同，且无人比他人拥有更多之处，为何就不能彼此反抗呢？然而，恰恰是这一点，并不能赋予你权利去反抗你的邻人。既然一切都是共通的，且无人比他人拥有更多，那么，凭什么理由能彼此自高呢？我们被赋予了相同的本性，灵魂与身体都相似，呼吸着相同的空气，享用着相同的食物：那么，我们为何要彼此反抗呢？诚然，通过虔敬的生活超越无形之力的可能性，可能会导致对自身的高度评价；但这还不算是傲慢。因为我理应将自己置于高位，甚至非常高的位置，相较于魔鬼而言。你看，保罗是如何将自己置于魔鬼之上的。当魔鬼对他说了许多奇妙的话语时，他便令其缄默，不被这诱惑者所迷惑。如此，当那拥有占卜之灵的使女说道：「这些人是至高上帝的仆人，他们向我们宣扬救赎之道」（使徒行传 16:17），他在严厉禁止之后，就捆绑了它那无耻的舌头。此外，在另一处，他也写下了以下的话语：「愿赐平安的上帝快将撒但践踏在你们脚下」（罗马书 16:20）。这难道不是本性差异的结果吗？'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: Разве ты не видишь, что значение имеет не различие природы, а свободная воля? Следовательно, по свободной воле они (демоны) хуже всех. Но против ангела, ты говоришь, я не восстаю, потому что между мною и им большое расстояние.
      cn: 你难道不明白吗，重要的不是本性的差异，而是自由意志？因此，就自由意志而言，他们（指魔鬼）比所有一切都更恶劣。但你又说，我不会反抗天使，因为在我与他之间有着很大的距离。
  - type: paragraph
    text:
      ru: 'Но также ты не должен восставать и против человека, как и против ангела. Как ангел отличен от тебя по природе, что, впрочем, не должно служить для него ни похвалою, ни осуждением, так и человек отличается от другого человека не по природе, но по внутреннему настроению и делается между людьми ангелом. Поэтому, если не вооружаешься против ангелов, то тем более (ты не должен вооружаться) против людей, которые в человеческой природе делаются ангелами. При этом, человек так же добродетельный, как ангел, для тебя гораздо лучше ангела. Почему? Потому, что он собственной волей исправил свою природу, и еще потому, что ангел удален от тебя местом и обитает на небе, а тот живет с тобой и возбуждает в тебе соревнование. Впрочем, и он далек от тебя – даже более, чем тот:«Наше же жительство, – говорит, –на небесах»(Фил. 3:20). А (чтобы убедиться тебе) что он, действительно, далек от тебя, – выслушай, где обитает его глава: на троне царственном, говорит он. Но чем дальше от нас этот трон, тем далее и он от нас. Но ты говоришь: я вижу, что он пользуется честью и это производит во мне зависть. Зависть-то и была причиной бесчисленных беспорядков во всем творении и горнем и дольнем, и не только на земле, но и в самой Церкви. Как бурный и противный ветер, устремляясь к спокойной пристани, делает ее опаснее всякой скалы и всякого плавания на море, так точно и любовь к славе, овладевая (человеком), все разрушает и приводит в беспорядок.'
      cn: 此外，你也不当对抗人，如同对抗天使。正如天使在本质上与你不同——这一点，然而，不应成为对它的赞扬，也不应成为对它的谴责——同样，人与人之间的不同不是在本质上，而是在内在性情上，并且在人中成为天使。因此，倘若你不与天使为敌，就更不应与那些在人的本性中成为天使的人为敌。此外，一个人若如同天使般有德行，对你而言，远胜过天使。为何？因为他凭着自己的意志修正了自己的本性；又因为天使在空间上远离你，居于天上，而那人却与你同住，并在你心中激起效法之心。尽管如此，他也远离你——甚至比天使更远：「我们的家乡，」他说，「在天上。」(腓立比书 3:20)。而（为了让你确信）他确实远离你——请听，他的元首居于何处：他说，在君王的宝座上。但这个宝座离我们越远，他也就离我们越远。但你却说：我看到他享有尊荣，这使我心生嫉妒。嫉妒正是天上和地下一切受造物中无数混乱的原因，不仅在地上，甚至在教会中也是如此。正如猛烈逆风冲向宁静的港湾，使其比任何礁石和海上航行都更为危险；同样，对荣耀的贪爱，一旦掌控人心，便会摧毁一切，并使之陷入混乱。
  - type: paragraph
    text:
      ru: 'Вы часто бывали при пожаре больших домов. Видали, как дым поднимается к небу, и как огонь, мало-помалу, истребляет все, потому что никто не заботится о том, как бы прекратить несчастье, а каждый думает только о себе. Нередко сходится целый город, собирается множество народа посмотреть на бедствие; но защиты и помощи нет ни от кого. Можно при этом видеть, как собравшиеся ничего не делают; каждый из них только протягивает руку, чтобы указать вновь туда пришедшему или на то, как пламя постоянно исторгается из окон, или как обваливаются потолки, и целые стены падают со своих оснований на землю. Бывает, впрочем, много людей смелых и не боящихся опасности, которые не страшатся ближе подходить к горящим зданиям, но не для того, чтобы содействовать прекращению бедствия, а чтобы более насладиться зрелищем, и вблизи рассмотреть все, чего издали часто не видно. Если же это бедствие постигло дом знаменитый и великолепный, то, кажется, зрелище достойно особенного сожаления и больших слез. В самом деле, печальное зрелище – видеть, как главы колонн превращаются в пепел, как многие из них разбиваются вдребезги, иные от действия огня, а другие собственными руками своих строителей (делающих это для того), чтобы не дать большей пищи огню; (печальное зрелище) – видеть статуи, служившие, под защитой кровли, украшением здания, после падения кровли, без защиты, стоящими под открытым небом, в крайне безобразном виде. Еще что? Кто исчислит богатство, заключавшееся в этих зданиях, – золотые одежды и серебряные сосуды? И куда входил только один господин с своей супругой, где была кладовая для многочисленных одежды и ароматов, где было хранилище драгоценных камней, – всюду, как скоро начался пожар, проникают банщики, мусорщики, бродяги и все другие им подобные. И вот все, что ни находилось внутри, превратилось в воду, огонь, грязь, пыль и обожженные бревна. Но зачем я так широко раскинул пред вами эту картину? Не просто пожар дома хочу я описывать, – что мне за нужда в этом? – а хочу представить вашему взору, насколько возможно, бедствия Церкви. В самом деле, точно пожар какой, или молния, несясь с высоты, ринулась на самый кров Церкви, и между тем это никого не трогает! Когда горит отцовский дом, мы спим глубоким и непробудным сном. Кого не коснулся этот пламень? Каких изображений, стоявших в Церкви, не тронул он? И подлинно,Церковьесть не что иное, как дом, выстроенный для наших душ. Впрочем не все, что вошло в состав этого здания, одинаково по своему достоинству: из составных его камней иные блестящие и великолепны, иные же хуже и темнее, хотя все-таки гораздо лучше остальных. Можно видеть здесь много из них и таких, которые занимают место золота, – золота, украшающего кровлю: иные, как видно, служат таким же украшением, как статуи в домах; а многие стоят на подобие колон. Принято ведь и людей называть колоннами не только за их силу, но и потому, что, имея золотой головной убор, они своим красивым видом украшают (свое место). А в многочисленности народа можно видеть как бы большое и пространное протяжение стен: множество народа занимает место камней, из которых сооружаются стены.'
      cn: '你们常常目睹大宅失火。你们见过浓烟冲天，火焰如何一点点地吞噬一切，因为无人关心如何制止这场灾祸，每个人都只顾自己。往往，全城的人都聚集起来，大批民众汇集围观这场灾祸；但无人提供保护与帮助。在此情形下，可以看到聚集的人们一无所为；他们每个人都只是伸出手，指给新来者看，或指着火焰如何不断从窗户喷涌而出，或指着天花板如何坍塌，整面墙壁如何从地基上倒向地面。


        然而，也有许多大胆无畏之人，他们不惧危险，敢于靠近燃烧的建筑物，但并非是为了帮助制止灾祸，而是为了更尽情地欣赏这番景象，近距离审视所有远距离常看不清的事物。如果这场灾祸降临在一所闻名遐迩、富丽堂皇的宅邸，那么，这景象似乎就格外值得惋惜，令人泪流满面。的确，这是一幅悲哀的景象：看到柱头化为灰烬，其中许多粉碎瓦解，有些是因火焰的作用，另一些则是其建造者亲手为之（这样做是为了）不让火焰有更多可燃之物；（悲哀的景象）——看到原本在屋顶保护下作为建筑装饰的雕像，在屋顶坍塌之后，毫无遮蔽，丑陋不堪地暴露在露天之下。


        还有什么呢？谁能数尽这些建筑物中所藏的财富——那些金衣银器？还有那些原本只有主人和其妻子方能进入，藏有无数衣物香料，以及存放珍宝之处——一旦火灾发生，沐浴者、拾荒者、流浪汉以及所有类似之人，便无孔不入。于是，里面所有的一切，都化为水、火、污垢、尘土和烧焦的木梁。


        然而，我为何在你们面前如此详尽地铺陈这幅景象呢？我并非只想描述一场房屋火灾——我又何必如此？——而是想尽可能地，将教会的灾祸呈现在你们眼前。的确，就好像有火灾，或闪电，从高空疾驰而下，直扑教会的屋顶，然而这竟无人动容！当父辈的家宅焚烧时，我们却沉睡不醒。这火焰不曾触及谁呢？它不曾触及教会中竖立的哪些圣像呢？且实实在在地，教会不正是为我们的灵魂所建造的房屋吗？


        然而，构成这建筑的一切，并非都拥有同等的价值：组成它的石头中，有些光辉灿烂、富丽堂皇，另一些则较差、更晦暗，尽管如此，它们仍然远胜于其余的。在此可以看到，它们中有许多占据着黄金的位置——那装饰屋顶的黄金：有些，显然是如同房屋中的雕像一般作为装饰；而许多则如同柱子一般矗立。毕竟，人们习惯将人称作柱子，不仅是因为他们的力量，更是因为他们头戴金色冠冕，以其优美的外表装饰着（其所在之处）。而众多民众，可见其仿佛广阔绵长的墙壁延伸：众多的民众占据着构成墙壁的石头之位。'
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Но нужно перейти к более блестящей картине. ЭтаЦерковьсооружается не из (простых) камней, но из золота, серебра, драгоценных камней, оправленных в золото. Но, увы, какая жалость! Все это сожжено господством тщеславия, – этим всепожирающим пламенем, – и никто не пересилил его действия. Мы стоим и удивляемся пожару, но не имеем сил потушить зло. Да хотя бы и потушили его на короткое время, – пройдет два, три дня, и тлящаяся в золе искра низвращает все, чего прежде и не касалась. Так и здесь, делается то же самое, что случается, обыкновенно, на пожаре. Причина этого заключается в том, что когда у нас не стало опор для самых церковных колонн, то огонь объял (эти колонны), поддерживавшие кров и сообщавшие крепость всему зданию; а через это ему открылся удобный доступ и к стенам. Если пламень истребит в здании деревянные части, то он устремляется на каменные. Но когда им разрушены и низвергнуты колонны, тогда он не имеет нужды истреблять остальное, – потому что, как скоро ниспадают столпы и подпоры верхних частей (здания), остальное само собою, без всякого препятствия, подвергается той же участи. Так точно ныне случилось и с Церковью: огонь объял всех. Ищем почестей у людей, воспламеняемся славолюбием и не слушаем слов Иова:«то я боялся бы большого общества, и презрение одноплеменников страшило бы меня»(Иов 31:34). Видишь ли, добродетельную душу? Я не устыдился, говорит, пред множеством народа рассказать невольные грехи. Если же он не устыдился, то тем более нам следовало поступать так.«Припомни Мне, – говорит (пророк), –говори ты, чтоб оправдаться»(Ис. 43:26). Велика была сила этого зла: все она низвратила и истребила. Мы сделались рабами почести, оставив Бога. Мы не можем воспрещать этого своим подчиненным, будучи сами одержимы той же горячкой. Мы сами нуждаемся во врачестве, хотя и поставлены Богом для врачевания других. Какая же остается надежда на спасение, когда и сами врачи имеют нужду в помощи других? Это я сказал не без причины и не напрасно выражаю сетование, но для того, чтобы все мы вместе с женами и детьми, посыпавшись пеплом и облекшись во вретище, наложили на себя пост и просили Бога явить нам помощь и удалить от нас опасность. Подлинно наша помощь в Его великой и дивной деснице. От нас требуется больше, чем от ниневитян.«Еще сорок дней, – сказано, –и Ниневия будет разрушена»(Ион. 3:4). Страшное и весьма грозное объявление! И как было не (устрашиться ниневитянам) в ожидании того, что, по прошествии трех дней, их город для них же сделается гробом, и они все погибнут от одинакового наказания? Если когда случалось в одно время и в одном доме погибнуть двум детям, то это было бедствием невыносимым. И если Иову казалась самым невыносимым бедствием – погибель всех (его детей) вследствие того, что над ними обрушилась кровля, то каково же было бы видеть не один дом, не двух детей, но целый народ, в количестве ста двадцати тысяч, погребенным под обрушившимися кровлями? Видите, какое бедствие! Подобная же угроза недавно была направлена и против нас не голосом пророка, – мы не достойны слышать такой голос, – но некоторым горним вещанием, огласившим нас громче всякой трубы. Опять повторяю сказанное:«еще сорок дней и Ниневия будет разрушена».'
      cn: 然而，我们必须转向一幅更为辉煌的景象。这教会并非由（普通的）石头建造，而是用黄金、白银和镶嵌着黄金的宝石所筑成。然而，唉，何其可惜！这一切都被虚荣的主宰所焚毁——这吞噬一切的火焰——并且无人能胜过它的作用。我们站着，惊叹于这场火灾，却无力扑灭这邪恶。即使我们能在短时间内将其扑灭——两三天过去后，灰烬中燃着的余烬便会倾覆一切，甚至那些它之前从未触及之物。在这里也是如此，所发生之事与寻常火灾无异。其原因在于，当我们失去了教会支柱的支撑时，火焰便吞噬了（这些）支撑屋顶并赋予整个建筑坚固性的（柱子）；由此，它也轻易地侵入了墙壁。如果火焰烧毁了建筑中的木质部分，它便会扑向石质部分。但是，一旦柱子被其摧毁并倾覆，它便无需再焚毁其余部分——因为，一旦（建筑）上部的支柱和支撑倒塌，其余部分便会自行，毫无阻碍地，遭受同样的命运。如今，教会也正是如此：火焰吞噬了所有人。我们向人寻求尊荣，因好名而燃起，不听约伯的话说：「那么我就会惧怕众多的会众，同族人的藐视会使我惊恐」（约伯记 31:34）。你看见了吗，这有德的灵魂？他说，我未曾在众人面前羞于讲述非自愿的罪。既然他未曾羞愧，我们更应如此行。「你当提醒我，——（先知）说，——你当说明，好使你自己得称为义」（以赛亚书 43:26）。这邪恶的力量是何等强大：它倾覆并毁灭了一切。我们离弃了上帝，成了尊荣的奴隶。我们自己也受着同样的狂热所困，故无法禁止我们的下属如此行。我们自己需要医治，尽管我们蒙上帝设立，是为了医治他人。当医生自己也需要他人帮助时，还有何得救的希望呢？我说这话并非无故，亦非徒然发出哀叹，而是为了让我们所有的人，与妻儿一同，披麻蒙灰，守斋禁食，并恳求上帝向我们施予帮助，使我们远离危险。我们的帮助，确确实实是在祂那伟大而奇妙的右手中。对我们的要求比对尼尼微人更高。「再等四十天，——经上说，——尼尼微城必被倾覆」（约拿书 3:4）。这是一个可怕而极度严峻的宣告！尼尼微人怎能不（恐惧）呢？在等待三天过后，他们的城市就会变成他们的坟墓，他们都将因同样的惩罚而灭亡。如果有时一个家中，同时有两名孩童丧生，那便是难以承受的灾祸。假如约伯认为最难以承受的灾祸是所有（他的）孩童因屋顶坍塌而丧命，那么，看到并非一间房屋，并非两名孩童，而是一个民族，总共十二万人，被埋葬在坍塌的屋顶之下，又将是怎样的情形呢？你们看，这是何等大的灾祸！同样严峻的威胁最近也临到了我们，并非借由先知的声音——我们不配听到那样的声音——而是借由某种来自上天的宣告，其声响比任何号角都更洪亮地传遍我们。我再次重复所说的话：「再等四十天，尼尼微城必被倾覆」。
  - type: paragraph
    text:
      ru: Поистине страшная угроза! Но ныне – совсем не то. Уже не три дня прошло и не погибель Ниневии угрожает нам, а много дней протекло с того времени, как на землеЦерковьразрушена и повержена долу, как все одинаково рабствуют греху, а особенно те, на которых лежит ответственность управления. Чем сильнее зло, тем больше настоит нужда. Поэтому не удивляйтесь, если я убеждаю вас сделать в некотором отношении больше, чем сделали ниневитяне. Я проповедую вам не только пост, но и показываю то врачество, которое предохранило от падения этот город. Почему так? Потому, что когда Господь увидел (дела ниневитян),«они обратились от злого пути своего, и пожалел Бог о бедствии, о котором сказал, что наведет на них, и не навел»(Ион. 3:10). Сделаем это и мы с вами. Будем удаляться от корыстолюбия и славолюбия, прося Бога явить нам Свою помощь и восстановить падших наших братий. Мы не того должны страшиться (что угрожало Ниневии). Тогда имели ниспадать камни и бревна, и погибать тела; но нет ничего такого, но зато души имеют быть преданы огню гееннскому. Призовем же (Бога), прославим Его; за прошедшее испросим у Него прощение, а на будущее будем молить Его, чтобы, освободившись от этого лютого и сильного врага (греха), нам быть достойными воссылать хвалу человеколюбивому Богу и Отцу, с Которым Сыну со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.
      cn: 确实是可怕的威胁！但如今——完全不是那样了。已经不是三天过去了，也不是尼尼微的毁灭威胁着我们，而是许多日子已经流逝，自从世上的教会遭受毁坏，被倾覆在地；自从所有人同样地作了罪的奴仆，尤其是那些肩负管理责任的人。恶越是强大，需要就越是迫切。所以，你们不要感到惊讶，如果我建议你们在某些方面做得比尼尼微人更多。我向你们宣讲的不仅是禁食，更是向你们指明那使这个城市免于倾覆的医治之法。为什么如此？因为当上主看到（尼尼微人的行为）时，「他们离弃了恶道，上帝就后悔，不把所说的灾祸降与他们了」（约拿书 3:10）。我们也与你们一同如此行吧。我们要远离贪婪和虚荣，恳求上帝向我们显明祂的帮助，并恢复我们那些堕落的弟兄们。我们不应当惧怕那个（威胁尼尼微的）。当时，石头和木材会落下，身体会灭亡；但现在没有那样的事情，然而，灵魂却将被交付于地狱之火。那么，让我们呼求（上帝），赞美祂；为已逝的恳求祂的宽恕，而为将来，我们将祈求祂，好让我们从这凶恶而强大的仇敌（罪）中解脱出来，能够配得上向仁慈的上帝和父献上赞美，愿荣耀、权能、尊贵与圣子、圣灵一同归于祂，从今时直到永远，世世代代。阿们。
- type: heading1
  text:
    ru: Беседа 11
    cn: 第 11 讲
  children:
  - type: paragraph
    text:
      ru: Еф.4:4–7.Одно тело и один дух, как вы и призваны к одной надежде вашего звания;
      cn: 以弗所书 4:4-7. 一个身体，一个圣灵，正如你们蒙召，也是为了你们蒙召的同一希望；
  - type: paragraph
    text:
      ru: один Господь, одна вера, одно крещение,
      cn: 一主，一信，一洗。
  - type: paragraph
    text:
      ru: один Бог и Отец всех, Который над всеми, и через всех, и во всех нас.
      cn: 一位上帝，也是众人的父，祂在万有之上，借着万有，也在我们众人之中。
  - type: paragraph
    text:
      ru: Каждому же из нас дана благодать по мере дара Христова.
      cn: 我们各人得了恩典，是按照基督恩赐的尺度。
  - type: paragraph
    text:
      ru: Почему в церкви один получает больше, а другой – меньше. – Смирение необходимо для единства тела церкви. – Епископ поставлен для научения словом. – Производить разделения в церкви – не меньшее зло, чем впадать в ереси.
      cn: 为什么在教会中，一人领受更多，而另一人领受更少。——谦卑是教会身体合一所必需的。——主教被设立是为了以言语教导。——在教会中制造分裂，其恶不亚于陷入异端。
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Павел требует от нас такой любви, которая бы связывала нас между собою, делая неразлучными друг от друга, и – такого совершенного единения, как бы мы были членами  одного тела, потому что только такая любовь производит великое добро. Словами:"Одно тело"он требует, чтобы мы сострадали друг другу, не желали благ ближнего своего и участвовали в радостях один другого; все это он выразил вместе. Потом весьма кстати прибавил:«и один дух», – научая, чтобы при одном теле был у нас один дух, так как может быть одно тело, но не один дух, – когда, например, кто-нибудь будет другом еретиков. Или этими словами ("один дух") он хотел побудить к взаимному согласию, как бы так говоря: так как вы получили одного Духа и пили от одного источника, то между вами не должно быть раздоров. Или, может быть, под словом – дух – он разумеет здесь расположение, (προδυμίαν). Далее говорит (апостол):«как вы и призваны к одной надежде вашего звания». Т. е., Бог призвал всех нас к одному и тому же; никому ничего не предоставил больше против другого; всем даровал бессмертие, всем жизнь вечную, всем неувядаемую славу, всем братство, всем наследие, для всех сделался общей главой, всех совоскресил и спосадил.'
      cn: 保罗要求我们拥有这样一种爱，使我们彼此联结，彼此不能分离；并要求我们有如此完全的合一，仿佛我们是同一身体的肢体，因为唯有这样的爱才能产生伟大的善。他用「一个身体」这几个字，要求我们彼此同情，不觊觎邻人的福乐，并分享彼此的喜乐；所有这些他都一并表达了。随后他又非常恰当地补充道：「并一个灵」——教导我们，既有一个身体，就当有一个灵，因为可能只有一个身体，却没有一个灵——例如，当有人成为异端分子的朋友时。或者，他想通过这几个字（「一个灵」）来鼓励彼此和睦，仿佛在说：既然你们领受了同一位圣灵，并饮于同一源头，那么在你们中间就不应当有纷争。或者，也许他在这里所说的「灵」是指心志（προδυμίαν）。接下来使徒说：「正如你们蒙召是为着你们所蒙召的同一个盼望。」也就是说，上帝召叫我们所有人都归于同一件事；对任何人都没有比对另一个人给予更多；赐予所有人不朽，赐予所有人永生，赐予所有人不朽的荣耀，赐予所有人弟兄情谊，赐予所有人产业；为所有人成为共同的元首，使所有人都一同复活，一同坐下。
  - type: paragraph
    text:
      ru: 'Итак, имея такое равночестие в духовном, для чего высокомудрствуете? Потому ли, что такой-то из вас богат, а такой-то силен? Но не смешно ли это? Скажи мне, в самом деле, если бы царь, избрав десять человек, облек их всех в порфиру, посадил на царском престоле и всем им даровал одну и ту же честь, – посмел ли бы кто-нибудь из них поносить другого – потому, что был бы богаче его и знаменитее? Отнюдь нет! Но этим сравнением я еще не все высказал, так как расстояние здесь не так еще велико. Итак, ужели мы, будучи равны на небе, будем превозноситься друг пред другом земными (отличиями)?«Один Господь, одна вера, одно крещение». Вот упование (нашего) звания.«Один Бог и Отец всех, Который над всеми, и через всех, и во всех нас», – один и тот же. Или Он для тебя наименовался большим, а для того – меньшим? Ты спасся от веры, а тот – от дел? Тебе отпущены (грехи) в крещении, а тому – нет? Прочь (с такими мыслями)!«Один Бог и Отец всех, Который над всеми, и через всех, и во всех нас».«Который над всеми», т. е., выше всего;«и через всех», т. е., обо всем промышляет, всем управляет;«и во всех нас», т. е., во всех обитает. Это же приписывается (в Писании) и Сыну: следовательно, это не означает меньшинства Сына: иначе того же не было бы сказано и об Отце.«Каждому же из нас дана благодать». Для чего же, говорят, и почему дарования различны? Это именно всегда приводило, как их самих (ефесян), так и коринфян и многих других, то к гордости, то к малодушию и зависти. Потому-то (апостол) и указывает нам везде на пример тела. Потому и теперь он предложил этот (пример), что хотел говорить о различных дарованиях. Впрочем, подробнее он исследует это в послании к Коринфянам, так как там особенно господствовал этот недуг. А здесь он теперь сделал на это только намек, – и смотри, что он говорит. Не сказал – по вере каждого, – чтобы не повергнуть в печаль тех, которые не получили великих (даров); но – что?«По мере дара Христова». Что, говорит, всего главнее, то общее всем, как-то: крещение, спасение через веру, (право) иметь Бога Отцом и всем иметь причастие в Том же Духе. Если же иной имеет нечто большее в (своем) даровании, то ты этим не огорчайся, потому что и трудов у него больше; помни и то, что с получившего пять талантов пять и взыскано было, а тот, кто получил два, два и принес, и отнюдь не получил за то воздаяния меньше первого. Потому и здесь от того же доказательства он заимствует утешение для слушателя:«к совершению, – говорит, –святых, на дело служения, для созидания Тела Христова»(Еф.4:12). Потому и сам он говорил:"горе мне", – как и всякому, кто получил дар апостольства, –«если не благовествую!»(1Кор. 9:16). Но потому и горе ему, что он получил; а ты свободен от подобной опасности."В меру". Что такое –"в меру"? Т. е., не за наши заслуги, так как (за заслуги) никто не получил бы того, что получил; но все мы (что получили, то) получили как дар.'
      cn: '那么，既然在灵性上拥有如此平等的尊荣，你们为何还心存高傲呢？难道是因为你们中某人富有，某人有权势吗？这岂不是可笑的吗？告诉我，说实在的，倘若一位君王，拣选了十个人，将他们都披上紫袍，让他们坐在君王的宝座上，并赐予他们所有人同样的尊荣，他们中间岂会有人胆敢贬损他人，只因自己比他更富有、更有名望吗？绝不会！然而，通过这个比较，我尚未尽述，因为此处的差距尚未如此之大。那么，难道我们这些在天上本是平等的，还要因属世（的差异）而彼此自高吗？


        「一主，一信，一洗。」这就是我们蒙召的盼望。


        「一上帝，就是众人的父，祂超乎万人之上，藉着万人，也住在万人之中」——是同一位。难道祂对你而言，被称作是更大的，而对那人而言，却是更小的吗？你因信得救，而他却因行为得救吗？你的罪在洗礼中得到赦免，而他却不然吗？休得如此妄想！「一上帝，就是众人的父，祂超乎万人之上，藉着万人，也住在万人之中。」


        「祂超乎万人之上」，亦即，超乎万有之上；

        「藉着万人」，亦即，关照万有，治理万有；

        「也住在万人之中」，亦即，居于众人之中。


        这在圣经中也归于上帝之子；因此，这并非指上帝之子的次等地位：否则，同样的话语就不会也论及父了。


        「我们各人蒙恩。」那么，他们说，为何恩赐有所不同呢？这正是常常导致无论是他们自身（以弗所人），还是哥林多人以及许多其他人，要么是骄傲，要么是灰心和嫉妒。因此（使徒）才处处以身体为喻指给我们。因此，他现在也提出了这个（例子），因为他想要谈论各种不同的恩赐。然而，他在致哥林多人的书信中对此进行了更详细的探讨，因为那种弊病在那里尤为盛行。而在这里，他现在只是对此略作提示——你看，他说些什么。他没有说——照各人的信心——以免使那些未获得大（恩赐）的人陷入悲伤；而是——什么呢？「照基督恩赐的尺度。」他说，最主要的事，是所有人都共有的，例如：洗礼，藉着信而得救，拥有上帝为父（的权利），以及所有人在同一位圣灵里有份。倘若有人在（其）恩赐上拥有更多，你也不要因此而忧伤，因为他也有更多的劳苦；也要记住，那领受五千银子的人，也被要求了五千，而那领受两千的人，也带来了两千，绝没有因此而得到比前者少的赏赐。因此，在这里他也是从同样的论证中为听者带来慰藉：「为要成全圣徒，」他说，「各尽其职，建立基督的身体」（以弗所书 4:12）。因此他自己也曾说：「祸哉于我，若我不传福音！」——正如任何蒙受使徒恩赐之人（哥林多前书 9:16）。但也正因此，他得了（这恩赐）便有祸了；而你则免于类似的危险。


        「照着尺度」。 「照着尺度」是什么意思呢？亦即，并非因我们的功德，因为（若凭功德）没有人能得到他所得到的；但我们所有人（所得到的）都是作为恩赐而领受的。'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Для чего же один (получил) больше, а другой – меньше? Это, говорит он, не имеет никакого значения, но дело безразличное: каждый (из получивших) способствует к созиданию. И потому показывает, что не ради собственного достоинства один получил больше, а другой меньше, но – для других, сколько кому сам (Христос) распределил. Так и в другом месте он говорит:«Но Бог расположил члены, каждый всоставетела, как Ему было угодно»(1Кор. 12:18). И не говорит о причине (такого распределения), чтобы не смутить мысли слушателей.«Посему и сказано: восшед на высоту, пленил плен и дал дары человекам»(Еф.4:8). Как бы так говорил он: что ты высокомудрствуешь? Все было делом Божьим. Пророк говорит в псалме:«принял дары для человеков»(Пс. 67:19); а он говорит:«дал дары человекам». Последнее тождественно с первым. Таково же и следующее затем:«А «восшел» что означает, как не то, что Он и нисходил прежде в преисподние места земли? Нисшедший, Он же есть и восшедший превыше всех небес, дабы наполнить все»(Еф.4:9–10). Когда слышишь это, то не разумей (под этим) перехождения. Здесь он делает то же самое, что и в послании к Филиппийцам. Как там, убеждая к смиренномудрию, он указывает на пример Христа (Фил. 2:5–9), так точно и здесь, говоря:«нисходил прежде в преисподние места земли». Иначе, излишни были бы слова его:«быв послушным даже до смерти»(Флп.2:8). От понятия о восхождении приводит к мысли о нисхождении. А дольнейшими странами земли он называет смерть согласно с понятиями человеческими, как и Иаков говорил:«сведете вы седину мою с горестью во гроб»(Быт. 44:29); как еще в псалме сказано:«уподобился нисходящим в могилу»(Пс. 142:7), т. е., умершим. Для чего упоминается здесь об этой (дольней) стране? И о каком он говорит плене? О плене дьявола. Господь пленил этого тирана, разумею дьявола, и смерть, и клятву, и грех. Видишь ли добычу и корысти?«А «восшел» что означает, как не то, что Он и нисходил прежде?»Это направлено против последователей Павла самосатского.«Нисшедший, Он же есть и восшедший превыше всех небес, дабы наполнить все». Нисшел, говорит, в самые дольние отделения земли, за которыми уже нет других. И восшел превыше всего, далее чего уже нет ничего другого. Это означает Его силу и власть, потому что и прежде все Им наполнялось.«И Он поставил одних Апостолами, других пророками, иных Евангелистами, иных пастырями и учителями, к совершению святых, на дело служения, для созидания Тела Христова»(Еф.4:11–12). Что говорит он в другом месте:«Посему и Бог превознес Его»(Фил. 2:9), то же высказывает и здесь словами:«Нисшедший, Он же есть и восшедший». Ни мало не повредило Ему нисшествие в дольнейшие страны земли и отнюдь не воспрепятствовало Ему быть превыше небес.'
      cn: '那么为何有人得着更多，有人得着更少呢？他说，这毫无意义，而是无关紧要之事：每个得着的人都为建立作出贡献。因此他指出，并非因着自身的价值，有人得着更多，有人得着更少，而是为了他人，按着基督自己所分派的量。正如他在别处所说：「但上帝在身体上安置了各肢体，正如祂所喜悦的」（哥林多前书 12:18）。他并未说明（此等分配的）原因，以免搅扰听者的思绪。


        「故此经上说：祂升上高天，掳掠了仇敌，将恩赐赐予世人」（以弗所书 4:8）。他仿佛这样说：你为何心存高傲？一切都是上帝的作为。先知在诗篇中说：「为世人领受了恩赐」（诗篇 67:19）；而他说：「将恩赐赐予世人」。后者与前者同义。接下来亦是如此：「而『升上』又是什么意思呢？岂不是说祂也曾先降到大地的最低之处吗？那曾降下的，祂也是那曾升到诸天之上的，为要充满万有」（以弗所书 4:9-10）。当你听到此言时，切勿将其理解为迁徙。在此他所做的，与在致腓立比人书信中所做的相同。正如在那里，他劝人谦卑，指出了基督的榜样（腓立比书 2:5-9），同样在此，他说道：「祂曾先降到大地的最低之处」。否则，他的话「存心顺服，以至于死」（腓立比书 2:8）就多余了。从升上的概念引申出降下的思想。他称大地的最低之处为死亡，是依照人的观念，正如雅各曾说：「你们必使我白发苍苍，悲悲惨惨地下到坟墓」（创世记 44:29）；又如诗篇中所说：「我如同下到墓穴的人」（诗篇 142:7），意即，已死之人。在此为何提到这（最低的）之处？他所说的俘虏是指什么？是指魔鬼的俘虏。上主俘虏了这位暴君，我指的是魔鬼，以及死亡、咒诅和罪。你可曾看到战利品和所得的利益？


        「而『升上』又是什么意思呢？岂不是说祂也曾先降下吗？」这乃是针对撒摩撒他之保罗的追随者而发。「那曾降下的，祂也是那曾升到诸天之上的，为要充满万有」。他说，祂降到大地的最深之处，其下已无他处。而祂升到万有之上，其上已无他物。这表明了祂的力量和权柄，因为在此之前，一切都已被祂充满。「祂所赐的，有的是使徒，有的是先知，有的是传福音的，有的是牧者和教师，为要成全圣徒，各尽其职，建立基督的身体」（以弗所书 4:11-12）。他在别处所说：「所以上帝将祂升为至高」（腓立比书 2:9），在此也以「那曾降下的，祂也是那曾升上的」这番话表达了同样的意思。祂降到大地的最低之处，丝毫未曾损害祂，也绝未曾阻碍祂升到诸天之上。'
  - type: paragraph
    text:
      ru: 'Таким образом, чем более кто смиряется, тем более тот возвышается. Как на воде – чем кто глубже погрузится в нее, тем сильнее она поднимает его наверх, и чем с (близшего) расстояния будет пущена стрела, тем вернее попадает в цель, так бывает и в смирении. Впрочем, когда мы говорим о восхождении Бога, необходимо прежде представлять Его нисшествие; а по отношению к человеку этого не нужно. Далее (апостол) указывает нам на (божественное) промышление и премудрость и говорит: Тот, Кто сделал столь многое, и показал такую силу, и не отказался низойти ради нас даже в дольнейшие страны, не сделал бы без причины такого разделения дарований. В другом месте он говорит, что это сделал Дух, именно:«в котором Дух Святый, – говорит он, –поставил вас блюстителями, пастиЦерковьГоспода»(Деян. 20:28). И тогда как здесь он говорит, что (сделал это) Сын, в другом месте говорит, что – Бог. И опять:«И Он поставил одних Апостолами, других пророками», а в послании к Коринфянам говорит:«Я насадил, Аполлос поливал, но возрастил Бог»(1Кор. 3:6). И опять:«Насаждающий же и поливающий суть одно; но каждый получит свою награду по своему труду»(1Кор. 3:8). Так и здесь: что в том, что ты меньше приносишь (плодов)? Столько получил ты (и даров). Первое (поставил Бог) апостолов, так как они имели все. Второе – пророков, так как некоторые не были апостолами, но были пророками, например Агав. Третье – благовестников: это – те, которые не обходили всех стран, а только проповедовали, как Прискилла и Акила. Потом – пастырей и учителей, которым был вверен весь народ. Что же? Ужели пастыри и учители меньше прочих? Конечно так: по сравнении с теми, которые обходили землю и проповедовали, те были меньше, которые сидели (дома) и имели занятие в одном месте, как Тимофей, Тит. Впрочем, из этого места нельзя вывести такого подчинения и предпочтения (одних по отношению к другим), но (это видно) из другого послания (1Кор. 12:28)."Он, – говорит, –поставил": не противоречь же. А может быть, благовестниками он называет и написавших евангелие.«К совершению святых, на дело служения, для созидания Тела Христова».'
      cn: '如此一来，一个人越是谦卑，他就越被高举。就像在水里，一个人沉入水底越深，水就越有力地将他托起；箭射出的距离越近，就越准确地命中靶心，谦卑也是如此。然而，当我们谈论上帝的上升时，必须首先思考祂的降下；而对于人来说，则无需如此。


        接着，（使徒）向我们指出（神圣的）眷顾与智慧，并说：那位行了如此多事，显明了如此大能，甚至不拒绝为我们降到较低之地的主，绝不会无缘无故地做出恩赐的这种区分。在另一处，他说这是圣灵所做的，即：「其中圣灵立你们作监督，牧养上主的教会。」（使徒行传 20:28）而在此处他说（此事）是圣子所为，在另一处则说——是上帝所为。又：「祂设立了一些人作使徒，又设立了一些人作先知。」而在致哥林多人的书信中说：「我栽种了，亚波罗浇灌了，但上帝使之生长。」（哥林多前书 3:6）又：「那栽种的和那浇灌的都是一样；但各人要照自己的劳苦得到自己的赏赐。」（哥林多前书 3:8）在这里也是如此：你结的果子少又如何呢？你也得到了如此多的（恩赐）。


        首先，（上帝设立了）使徒，因为他们拥有一切。其次是先知，因为有些人不是使徒，却是先知，例如亚迦布。第三是传福音者：他们是那些没有走遍所有国家，而只是传讲福音的人，像百基拉和亚居拉一样。然后是牧者和教师，他们被托付管理全体民众。那么呢？难道牧者和教师比其他人更小吗？当然如此：与那些周游各地传道的人相比，那些安居一地并在一处工作的人，是更小的，比如提摩太、提多。然而，从此处无法推断出（某人相对于他人）的这种从属和偏爱，但（这可以从）另一封书信中看出（哥林多前书 12:28）。「祂设立了，」——他说，那么就不要反驳了。也许，他也称那些撰写福音书的人为传福音者。「为要成全圣徒，各尽其职，建立基督的身体。」'
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Видишь ли достоинство (каждого)? Каждый созидает, каждый устраивает, каждый служит."Доколе, – говорит, –все придем в единство веры и познания Сына Божия, в мужа совершенного, в меру полного возраста Христова»(Еф.4:13). Возрастом он называет здесь совершенное познание. Как человек в зрелом возрасте бывает тверд и постоянен в мыслях, а дети непостоянны, так точно и между верующими.«В единство, – говорит, –веры", т. е., пока окажемся все имеющими одну веру. Единение веры то и означает, когда мы все будем одно, когда все одинаково будем понимать этот союз. До тех пор должно тебе трудиться, если ты получил дар назидать других. Смотри, не совратись сам, завидуя другому. Бог почтил тебя и поставил на то, чтобы ты руководил к совершенству другого. Для этого был поставлен и апостол, для этого и пророк, который пророчествует и увещевает, для этого и благовестник, который проповедует, для этого и пастырь, и учитель: всем поручено было одно дело. Не говори же мне о различии дарований: все они имели одно дело. Когда мы все веруем одинаково, это и есть единение (веры). Ясно, что он это называет (возрастом) совершенного мужа. Впрочем, в другом месте он называет нас детьми и в том случае, если бы мы были совершенны; но там он имеет в виду иное. Там он назвал нас детьми по отношению к будущему нашему знанию. Сказав именно, что мы«теперь знаю я отчасти», присовокупил:«гадательно»(1Кор. 13:12), и тому подобное. А здесь он говорит не об этом, а о постоянстве. Вот и в другом месте он говорит:«твердая же пища свойственна совершенным»(Евр. 5:14). Видишь ли, как и там назвал он совершенных? Посмотри и здесь, как он назвал их прикровенно, говоря:«дабы мы не были более младенцами»(Еф.4:14). Он говорит о той небольшой мере (дарования), которую мы получили, чтобы мы сохраняли ее со всем усердием, твердосию и постоянством.«Дабы мы не были более». Этим выражением указывает на то, что некогда они были такими, и даже самого себя подчиняет условию исправления, исправляя других. Для того, говорит, и было столько строителей, чтобы здание было непоколебимо и защищено отовсюду, чтобы камни были сложены плотно. Волноваться, увлекаться и колебаться свойственно детям.«Дабы мы не были более, – говорит, –младенцами, колеблющимися и увлекающимися всяким ветром учения, по лукавству человеков, по хитрому искусству обольщения»(Еф.4:14).«Увлекающимися, – говорит, –всяким ветром». Он употребил это подобие, желая показать, в какой опасности находится всякая душа, преданная сомнению."Всяким, – говорит, –ветром учения, по лукавству:(κοβεία)человеков, по хитрому искусству обольщения».Κυβευταί– так называются занимающиеся шахматной игрой. Это бывают люди хитрые, так как они обыкновенно выбирают для себя людей простых. И они-то все передвигают и переставляют. (Апостол) коснулся здесь мирских обычаев.'
      cn: 你可曾看到（每个人）的尊严？每个人都在建造，每个人都在安排，每个人都在服事。「直到我们众人在信仰上和对上帝之子的认识上合而为一，达到成熟的人的境界，达到基督丰满身量的尺度。」（以弗所书 4:13）在这里，他把「身量」称作完全的认识。正如一个成熟的人在思想上坚定不移、始终如一，而孩童则变化无常，信徒之间也正是如此。他说：「在信仰上合而为一」，也就是说，直到我们所有人都有相同的信仰。信仰上的合一，正是指当我们所有人都成为一体，当我们所有人都同样理解这个联合之时。如果你蒙受了造就他人的恩赐，你就应当为此劳苦，直到那时。当心，不要因为嫉妒他人而自己误入歧途。上帝尊荣了你，并安置你来引导他人臻于完善。为此，使徒蒙受安置，为此，先知蒙受安置，他预言并劝戒，为此，传福音者蒙受安置，他传讲福音，为此，牧者和教师蒙受安置：所有人受托的都是同一项工作。所以不要对我谈论恩赐的差异：他们所有人都只有一项工作。当我们所有人都以同样的方式相信时，这便是（信仰上的）合一。显然，他将此称作（身量）完全的人。然而，在另一个地方，即使我们已经完善，他仍然称我们为孩童；但他在那里指的是别的事情。在那里，他称我们为孩童，是就我们未来的知识而言。经文确切地说「我们现在所知道的有限」，接着补充说：「模糊不清」（哥林多前书 13:12），等等。而在这里，他谈论的不是这个，而是恒久不变。又如在另一个地方他说：「干粮是给那些成熟的人吃的。」（希伯来书 5:14）你可曾看到他在那里是如何称呼成熟的人的？再看这里，他如何隐晦地称呼他们，说：「使我们不再作小孩子」（以弗所书 4:14）。他谈到我们所领受的那微小的（恩赐）量，为要我们以全然的热忱、坚韧和恒久来持守它。「使我们不再。」 这个表达表明他们曾经是那样的，并且他甚至在纠正他人的同时，也将自己置于纠正的条件之下。他说，正因为如此，才会有如此多的建造者，以使建筑物坚不可摧，四面受护，使石头紧密地叠放。焦虑、被诱惑和摇摆不定是孩童的特性。「使我们不再作小孩子，随波逐流，被各样教义之风摇动，中了人的诡计，和那引人入错的奸诈手段所诱惑。」（以弗所书 4:14）他说：「被各样之风摇动。」他使用这个比喻，是为了表明任何陷入怀疑的灵魂所处的危险境地。他说：「被各样教义之风，中了人的诡计（κοβεία），和那引人入错的奸诈手段所诱惑。」Κυβευταί——是那些下棋的人的称谓。这些人通常很狡猾，因为他们惯常选择单纯的人为对手。他们会移动和重新布置所有棋子。在这里，（使徒）触及了世俗的习俗。
  - type: paragraph
    text:
      ru: '«Но истинною любовью все возращали в Того, Который есть глава Христос, из Которого, т.е. Христа,все тело, составляемое и совокупляемое посредством всяких взаимно скрепляющих связей, при действии в свою меру каждого члена, получает приращение для созидания самого себя в любви»(Еф.4:15–16). Довольно неясно он изложил свои мысли – оттого, что хотел высказать все вдруг. Вот что означают слова его: как дух, выходя из головного мозга, не просто сообщает, посредством нервов, чувствительность всем членам, но – сообразно с каждым из них – тому, который способен принять больше, и сообщает больше, а который меньше, тому меньше (потому что дух есть корень жизни), так и Христос. Так как наши души так же зависимы от Него, как члены (от духа), то Его промышление и раздаяние даров, сообразно с мерой того или другого члена, производят возращение каждого. Но что такое –«посредством всяких взаимно скрепляющих связей»? Т. е., посредством ощущения (αίσδηοιως). Этот дух, распределяющийся по членам от головы, прикасаясь к каждому из них, таким образом производит на них свое действие. Можно и так сказать: тело, воспринимая это воздействие (духа) соразмерно своим членам, возрастает таким образом. Или иначе: члены, получая соразмерное себе воздействие (духа), так возрастают. Или и еще: дух, изливаясь обильно сверху, прикасаясь ко всем членам и распределяясь по ним, сколько каждый из них может принять в себя, так возращает. Но почему он прибавил слово –"в любви"? Потому, что этот дух иначе не может сообщиться. В самом деле, если бы случилось руке отделиться от тела, дух, (истекающий) из головного мозга, ища продолжения и не находя его там, не срывается с тела и не переходит на отнятую руку, но если не найдет ее там, то и не сообщается ей. То же бывает и здесь, если мы не связаны между собою любовью.'
      cn: «唯借着爱心，在凡事上长进，归于那作元首的基督；从祂（即基督）那里，全身借着各样的筋络彼此联络，结合在一起，照着各肢体所发挥的功用，便叫身体渐渐增长，在爱中建立自己»（以弗所书 4:15-16）。他将自己的思想阐述得相当不清楚——这是因为他想一下子把所有的事情都说出来。他的话语意味着：就像生命之灵从大脑发出，并非仅仅通过神经将知觉传给所有的肢体，而是依照各个肢体——能够接受更多的就传达更多，而接受较少的就传达较少（因为生命之灵是生命的根源），基督也是如此。正如我们的灵魂像肢体（依赖于生命之灵）一样依赖于祂，那么，祂的护理和恩赐的分发，根据各个肢体的尺度，便使每个肢体都得以增长。但「借着各样的筋络彼此联络」是什么意思呢？也就是说，通过感觉（αίσδηοιως）。这生命之灵从头部分布到各肢体，触及每个肢体，如此便在它们身上产生其作用。也可以这样说：身体按其肢体的比例接受这（生命之灵的）作用，从而得以增长。或者换句话说：肢体接受与自身相称的（生命之灵的）作用，如此便得以增长。或者还可以说：生命之灵从上方丰盛地倾泻而下，触及所有肢体并按着每个肢体所能接受的程度分布于它们，如此便使它们增长。但他为何加上「在爱中」这个词呢？因为这生命之灵若非如此便无法被传达。事实上，如果一只手从身体上分离，从大脑（流出）的生命之灵，寻求延续但又在那里找不到，它并不会从身体上脱离并转移到那只被切除的手上，如果它在那里找不到，就不会被传达给它。在这里也是如此，如果我们彼此不以爱心相连。
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Все это сказано им для того, чтобы внушить смирение. Что, говорит, в том, что такой-то получил больше? Он получил Того же самого Духа, ниспосылаемого от той же самой главы, одинаково действующего, одинаково прикасающегося,«составляемое и совокупляемое»(со всем телом), т. е. имеющего о нем великое попечение. Не как-нибудь, но очень искусно должно быть расположено тело, так что, если в нем что-нибудь не на своем месте, то оно уже расположено не так. Таким образом, должно не только быть соединенным с телом, но и занимать там свое место, – иначе, если ты нарушишь это, то не будешь соединен с ним и не получишь Духа. Не видишь ли ты, что бывает при перемещении костей, происходящем от какого-нибудь несчастного случая, когда (одна кость) оставит свое место и займет другое, – как это вредит всему телу и часто бывает причиной смерти? А бывает и так, что (кость) оказывается негодной, чтобы еще удерживать ее (в теле): в таких случаях многие вырезывают ее и оставляют ее место пустым, потому что излишество во всем есть зло. И элементы (тела), когда они, потерявши свою пропорциональность, делаются изобильными до излишества, вредят целому. Вот что значит:«составляемое и совокупляемое посредством всяких взаимно скрепляющих связей», т.е.,  чтобы все (в теле) занимало свое место и не вторгалось в другое, ему несвойственное. Размысли об этом, сколько возможно. Ты соединяешь члены, а Он свыше всем распоряжается. И как в теле есть известные воспринимающие органы, так и у духа, который всецело есть небесный корень (жизни). Именно сердце (есть корень) духа, печень – крови, селезенка – желчи, и другие органы – других элементов; но все они зависимы от головного мозга. Согласно с этим и Бог поступил, удостаивая человека особенной почести: не желая покинуть его, сам Он сделался для него (конечной) виною всего, учредив в то же время сотрудников для Себя и одним из них поручив то, другим – иное. Так, апостол есть самый удобный сосуд тела (т. е. Церкви Христовой), принимающий от него все. Как бы посредством жил и артерий, он посредством слова способствует к сообщению всем жизни вечной. Пророк предсказывает будущее: и он (апостол) делает то же самое. Тот соединяет кости, а этот сообщает им жизнь –«к совершению святых, на дело служения». Любовь воссоздает, соединяет, сближает и сопрягает нас между собою.'
      cn: '这一切都是为了灌输谦卑而说的。他说，某人得到了更多，这有什么呢？他得到了同一位圣灵，来自同一位元首所差遣的，同等运行，同等触及，「被构成并联结在一起」（与整个身体），意即，对此有极大的关顾。身体的配置不应是随意为之，而应是极其精巧的，以至于，如果其中有任何部分不在其位，那么它的配置就不正确了。因此，不应仅仅与身体相联结，还应在那里占据自己的位置——否则，如果你破坏了这一点，你就不会与它相联结，也不会领受圣灵。你难道没看到，当因某种不幸事故而导致骨骼移位时，会发生什么吗？当（一块骨头）离开其位而占据另一处时——这会如何损害整个身体，并常常成为死亡的原因？也可能发生这样的情况，即（一块骨头）变得无用，无法再将其（在体内）保持住：在这种情况下，许多人会将其切除，并将其位置空置，因为凡事过度都是恶。当身体的元素失去其比例，变得过剩乃至过度时，它们就会损害整体。这就是「藉着各样互相紧密联结的纽带，得以构成并联结在一起」的意思，意即，身体中的一切都应各归其位，而不应侵入其他不属于它的地方。尽可能地思考这一点。你联结肢体，而祂从高处支配着一切。


        正如身体中有已知的感应器官，同样，对于全然是天上（生命）根源的灵也是如此。心脏正是灵的（根源），肝脏是血液的，脾脏是胆汁的，其他器官是其他元素的；但它们都依赖于大脑。上帝也照此行事，赐予人类特殊的尊荣：不愿离弃他，祂自己成为了他一切（最终）的原因，同时为自己设立了合作者，并将某些事务托付给其中一些人，另一些则托付给另一些人。因此，使徒是身体（即基督的教会）最便利的器皿，从中领受一切的。仿佛藉着血管和动脉，他藉着言语，促进将永生传达给众人。先知预言未来；而他（使徒）也做同样的事。那位联结骨骼，而这位赋予它们生命——「为要成全圣徒，为着事奉的职事」。爱重建、联结、使我们彼此亲近并结合。'
  - type: paragraph
    text:
      ru: 'Итак, если хотим получить Духа от Главы, будем в союзе друг с другом. Есть два рода отделения от Церкви: один, когда мы охладеваем в любви, а другой, когда осмеливаемся совершить что-нибудь недостойное по отношению к этому телу (Церкви). В том и другом случае мы отделяемся от целого. Если же еще нам поручено созидать и других, и мы не созидаем, но сами первые производим разделения, то чего не придется потерпеть за это? Ничто не может столько производить разделений в Церкви, как любоначалие; ничто так не оскорбляет Бога, как разделения в Церкви. Хотя бы мы совершили тысячу добрых дел, подвергнемся осуждению не меньше тех, которые терзали тело Его, если будем расторгать целость Церкви. Первое совершено было для пользы всего мира, хотя и не с тем намерением; а последнее не доставляет никому никакой пользы, напротив составляет великий вред. Сказанное мною относится не к начальствующим только, но и к подчиненным. Один святой муж сказал нечто такое, что могло бы показаться дерзким, если бы не им было сказано. Что же именно? Он сказал, что такого греха не может загладить даже кровь мученическая. В самом деле, скажи мне, для чего ты принимаешь мучения? Не для славы ли Христовой? Итак, будучи готов положить свою душу за Христа, как решаешься ты разорятьЦерковь, за которую положил душу Христос? Послушай, что говорит о себе Павел:«недостоин называться Апостолом, потому что гналцерковьБожию»(1Кор. 15:9). Вред (от разделений) не меньше того, какой причиняют враги, а гораздо больше. Там доставляется (Церкви) еще больший блеск, между тем как тут она сама себя роняет в главах врагов, когда против нее воюют ее собственные дети. А это потому, что у них (врагов) считается за сильное доказательство обмана, когда те, которые родились в Церкви, в ней воспитаны, хорошо узнали ее тайны, – вдруг, изменившись, восстают против нее, как враги.'
      cn: 所以，如果我们想从元首那里领受圣灵，我们就当彼此相合。有两种与教会分离的方式：一种是我们爱心冷淡，另一种是我们竟敢对这个身体（教会）做出任何不配的事。在这两种情况下，我们都与整体分离了。如果我们还被托付去造就他人，而我们没有去造就，反而我们自己率先制造分裂，那么为此我们将要承受怎样的苦难呢？没有什么比爱慕权位更能使教会在其中产生分裂；没有什么比教会在其中产生分裂更得罪上帝的了。即使我们行了上千件善事，如果我们撕裂教会的合一，我们所受的定罪也不会少于那些折磨祂身体的人。前者（指折磨祂的身体）是为了全世界的益处而成就的，尽管并非出于此意；而后者（指撕裂教会合一）对任何人都没有益处，反而造成巨大的伤害。我所说的不仅适用于那些作首领的，也适用于那些服从的。有一位圣人说过这样一件事，这件事本可能被视为大胆无礼的，如果不是出自他口。那具体是什么呢？他说，即使是殉道者的血也无法赎清这样的罪。确实如此，请告诉我，你为何受苦？难道不是为了基督的荣耀吗？所以，你既然预备好为基督舍弃自己的生命，你怎敢摧毁教会，就是基督为她舍弃了生命的教会呢？请听保罗如何论及自己：「我本不配称为使徒，因为我曾逼迫上帝的教会」（哥林多前书 15:9）。（分裂所造成的）危害不亚于仇敌所造成的，反而更大。在那里（指仇敌造成的伤害），（教会）反而更显辉煌，然而在这里（指自身分裂），当她自己的儿女起来攻击她的时候，她却在仇敌眼中自贬身价。而这是因为在他们（仇敌）看来，当那些在教会中出生、在其中受教、深谙其奥秘的人，突然变节，如仇敌般起来攻击她时，这被视为欺骗的有力证据。
  - type: paragraph
    initial:
      ru: '5.'
      cn: '5.'
    text:
      ru: 'Сказанное мною направлено против тех, которые без разбора пристают к людям, отделяющимся от Церкви. Если эти последние содержат противные (нам) догматы, то потому самому не должно с ними иметь общения; если же они мыслят одинаково с нами, то еще больше (должно избегать их). Почему так? Потому, что это недуг любоначалия. Не знаете разве, что случилось с Кореем, Дафаном и Авироном? Но одни ли они потерпели? Не вместе ли с ними (погибли) и их сообщники (Чис.16:32)? Что говоришь ты? «У них та же самая вера, и они также православны». Если так, отчего же они не с нами?«Один Господь, одна вера, одно крещение». Если у них хорошо, то у нас худо; а если у нас хорошо, то у них худо.«младенцами, – говорит, –колеблющимися и увлекающимися всяким ветром». Скажи мне: ужели вы считаете достаточным то, что их называют православными, тогда как у них оскудела и погибла благодать рукоположения? Что же пользы во всем прочем, если у них не соблюдена эта последняя? Надобно одинаково стоять как за веру, так и за нее (благодать священства). А если всякому позволительно, по древней пословице, наполнять свои руки, быть священником, то пусть приступят все, и напрасно устроен этот жертвенник, напрасно (установлен) церковный чин, напрасно лик иереев: ниспровергнем и уничтожим это. Этого, говорят, не должно быть. Но не вы ли делаете это, а потом говорите: так не должно быть? Что еще говоришь ты: не должно быть, когда так на самом деле? Я говорю это и свидетельствую, имея в виду не свою выгоду, но ваше спасение. Если кто смотрит на это дело безразлично, такой пусть бы (внимательнее) взглянул. Если же ему нет об этом заботы, то нам она есть."Я насадил, – говорит (апостол), –Аполлос поливал, но возрастил Бог». Как перенесем мы насмешки язычников? Если они укоряют нас за ереси, то чего не скажут по поводу их (расколов)? Если, говорят, одни у них догматы, одни таинства, то ради чего у них один предстоятель (церкви) нападает на другуюцерковь? Смотрите, говорят, у христиан все исполнено тщеславия. У них и любоначалие, у них и обман. Отнимите у них народ, пресеките болезнь, т.е.,  развращение народа, – и они останутся ничем. Хотите ли, я скажу вам, что говорят они о нашем городе, как они укоряют нас в легкомыслии? У них, говорят, всякому, кто только пожелает, можно найти людей без твердых правил, и никогда у них в таких людях не было недостатка. Какое посмеяние! Какой стыд! Но вот и еще – достойное посмеяния и служащее к нашему стыду. Если у нас кто-нибудь будет обличен в самых постыдных делах и на него захотят наложить какую-нибудь епитимью, то все весьма беспокоятся и боятся, как бы, говорят, он не отделился от нас и не пристал к другим. Пусть отделяется хоть тысячу раз, и пусть пристает к ним; я говорю не о согрешивших только, но хотя бы кто и вовсе был безгрешен, – если хочет отложиться, пусть отложится. Хотя я печалюсь и страдаю, огорчаюсь и мучусь внутренне, лишаясь в таком как бы собственного члена, но огорчаюсь не так, чтобы опасение всего этого могло принудить меня сделать что-нибудь недолжное.'
      cn: 我所说的，是针对那些不加分辨地接近离开教会之人的人。如果后者持守与（我们）相反的教义，那么就更不应与他们有交通；如果他们与我们思想相同，那么就更应（避免他们）。为何如此？因为这是恋权之疾。难道你们不知道科雷、大坍和亚比兰遭遇了什么吗？但难道只有他们受苦了吗？难道他们的同党没有与他们一同（灭亡）吗？（民数记 16:32）你说什么？「他们有同样的信仰，他们也是正教徒。」如果是这样，那么他们为何不与我们同在呢？「一主，一信，一洗。」如果他们那里是好的，那么我们这里就是坏的；反之，如果我们这里是好的，那么他们那里就是坏的。「如同婴孩 —（使徒）说 — 漂来漂去，被各样的教训之风吹动。」告诉我：难道你们认为仅仅因为他们被称为正教徒就足够了吗，然而他们却失去了、且毁坏了圣秩的恩典？如果他们没有持守这最后的（恩典），那么其余的一切有什么用处呢？必须同样地坚守，既为了信仰，也为了它（圣秩的恩典）。而如果每个人都被允许，依照古老的谚语，自立为祭司，担任祭司，那么就让所有人前来吧；并且这个祭坛就是徒然设立的，教会的秩序是徒然（设立的），众祭司是徒然存在的：让我们推翻并废除这一切吧。「这不应该发生，」他们说。但难道不是你们在做这事吗，然后又说：「这不应该发生」吗？当事实如此之时，你还说什么「不应该发生」？我说这话并作证，不是为了自己的利益，而是为了你们的救恩。如果有人对此事漠不关心，那么他应该（更仔细地）审视一下。但如果他对此没有顾虑，那么我们却有顾虑。「我栽种了 —（使徒）说 — 亚波罗浇灌了，但使之生长的是上帝。」我们如何忍受异教徒的嘲笑呢？如果他们因异端而责备我们，那么他们会就着他们的（分裂）说什么呢？「如果，」他们说，「他们有相同的教义，相同的圣事，那么他们一个（教会）的首牧为何攻击另一个教会呢？」 「看啊，」他们说，「基督徒的一切都充满了虚荣。在他们那里有恋权，在他们那里也有欺骗。把人民从他们那里夺走，根除这疾病，即人民的腐败 — 那么他们就一无所有了。」你们愿意吗，我告诉你们，他们如何谈论我们的城市，他们如何责备我们轻浮？「在他们那里，」他们说，「任何只要愿意的人，都能找到没有坚定原则的人，而且他们从未缺少过这样的人。」多么可笑！多么羞耻！但还有一事 — 同样可笑，并使我们蒙羞。如果在我们当中，有人被揭发犯下最可耻的行为，并且有人想要对他施加某种圣罚，那么所有人都非常担忧和害怕，生怕 — 他们说 — 他会离开我们，并投靠他人。」让他分离一千次吧，让他投靠他们吧；我说的不仅是那些犯了罪的人，而是即使有人全然无罪 — 如果他想背弃，就让他背弃吧。尽管我感到悲伤和痛苦，内心忧伤和煎熬，仿佛失去了一个自己的肢体，但我的忧伤并非如此，以至于对这一切的担忧能强迫我做任何不当之事。
  - type: paragraph
    text:
      ru: 'Мы не повелеваем, возлюбленные, вашей вере, не деспотически приказываем вам это. Мы поставлены для поучения вас словом, а не для начальствования и самовластия над вами; наше дело советовать вам и увещевать. Советник говорит, что ему должно, но не принуждает слушателя, предоставляя ему полную свободу – принять или не принять совет. Он будет виновен только в том, если не скажет того, что ему поручено. Потому-то и мы говорим все это, обо всем этом напоминаем, чтобы вам уже нельзя было сказать в тот (последний) день: никто нам этого не говорил, никто не объяснил, мы этого не знали и вовсе не считали грехом. Итак, я говорю и свидетельствую, что производить разделения в Церкви не меньшее зло, как и впадать в ереси. Скажи мне: если бы подданный какого-нибудь царя, не переходя к другому царю и не передаваясь во власть другого, взял в свои руки порфиру своего царя и, спустивши ее всю от застежки, разорвал на несколько частей, – меньше ли бы он был наказан, чем и тот, кто передался бы другому (царю)? Но что, если бы после этого он схватил за горло своего царя, заколол его и разрубил на части его тело, – какому бы наказанию следовало подвергнуть его, чтобы отплатить по достоинству? Если же тот, кто так поступит с царем, таким же рабом (по отношению к Богу), как и он сам, совершит преступление, превосходящее всякое наказание, – то какой геенны заслуживает тот, кто закалает самого Христа и рассекает на части? Ужели – этой, какой грозят нам? Мне кажется, что какой-нибудь другой, еще более ужасной. Расскажите же вы (женщины), какие находитесь здесь, – ведь этот порок большей частью замечается в женщинах, – расскажите этот пример отсутствующим и возбудите в них страх. Если же кто думает огорчить нас и мстит нам таким образом, то такой пусть знает, что он напрасно делает это. Если тебе хочется мстить нам, то я покажу тебе способ, как ты можешь мстить без вреда для себя, или лучше, не без вреда, а с меньшим, по крайней мере, вредом: ударь меня по лицу, оплюй публично, нанеси мне раны.'
      cn: 我们不命令，挚爱的弟兄姊妹，你们的信仰，也不专横地命令你们做这事。我们被设立，是要用言语教导你们，而不是要作你们的掌权者，对你们专权；我们的职责是建议你们并劝诫你们。建议者只说他当说的话，却不强迫听者，给他完全的自由——接受或不接受建议。他只会在没有说出所受托付的话时才有罪。因此，我们才说这一切，提醒这一切，好使你们在那（末日）到来时，再也不能说：没有人对我们说过这事，没有人解释过，我们不知道这事，也根本不认为这是罪。因此，我宣告并作证，在教会中制造分裂，与陷入异端是同样大的恶行。请告诉我：如果某个君王的臣民，既没有投奔别的君王，也没有归顺他人的权势，却将自己君王的紫袍拿到手中，从搭扣处将其完全解开，撕成数片——他受到的惩罚会比投奔另一位（君王）的人轻吗？但是，如果他在此之后扼住君王的喉咙，刺杀他，并将其身体肢解——他应该遭受怎样的惩罚才能罪有应得呢？如果一个如此对待君王的人——这个君王本身也是（在上帝面前的）一个奴仆——所犯的罪行超越一切惩罚，那么，那个刺杀基督本体并将其肢解的人，又配得怎样的火狱（Gehenna）呢？难道是——我们被警告过的那个吗？在我看来，是某种别的、更加可怕的。那么，你们（女人们），在场的各位，请讲述——因为这种罪恶大多出现在女人身上——请将这个例子讲述给不在场的人，并在他们心中激起恐惧。如果有人认为这样可以使我们忧伤，并以这种方式报复我们，那么这样的人应当知道，他这样做是徒劳的。如果你想报复我们，我将向你展示一种方式，你可以报复而不会伤害自己，或者说，并非毫无伤害，至少是伤害较小的方式：掴我的脸，当众唾弃我，伤害我。
  - type: paragraph
    initial:
      ru: '6.'
      cn: '6.'
    text:
      ru: 'Ты содрогаешься, слыша это? Когда я говорю: ударь меня, то ты содрогаешься, – и между тем ты терзаешь своего Владыку без содрогания? Разрываешь Владычни члены и не трепещешь?Церковь– это отчий дом:«Одно тело и один дух». Но если ты хочешь мстить мне, то против меня и восставай. Зачем же, вместо меня, мстишь Христу? Или лучше: зачем ты наносишь удары по гвоздям? И вообще мстить ни в каком случае неодобрительно; но, вместо виновного, нанести обиду другому – гораздо хуже. Ты потерпел от нас обиду? Для чего же, в таком случае, огорчаешь того, кто тебе не сделал никакого зла? Это крайне безрассудно. Вот что я скажу на этот счет, и не шутя, не просто, но как думаю и как чувствую. Именно, я желал бы, чтобы всякий из тех, кто вместе с вами питает к нам неприязнь и ради этого вредит себе самому, удаляясь от нас к другим, нанес нам удар в самое лицо и, обнажив нас, стал бичевать без жалости, справедливо ли бы или несправедливо мы были обвинены, и лучше на нас выместил свой гнев, чем решался на то, на что решается теперь. Если бы это случилось, то не было бы в том никакой важности, потому что пострадал бы в этом случае ничтожный человек, нестоящий никакой цены. С другой стороны, потерпев от вас обиду и бесчестие, я помолился бы за вас Богу и Он простил бы вам ваши грехи, – не потому, что я имею такое дерзновение, по потому что, когда человек, которому сделана обида, молится за обидевшего, то получает великое дерзновение."Есликтосогрешит против человека, – сказано, –помолятся о нем»(1Цар. 2:25). Если же бы я сам не мог (этого сделать), то поискал бы других святых мужей и упросил бы их, и они сделали бы это. А теперь кого и просить нам, когда мы оскорбили Бога?'
      cn: 你听到这话会颤抖吗？当我说：「打我！」时，你就会颤抖，——然而你却毫无颤抖地折磨着你的主宰？你撕裂着主宰的肢体却不战栗？教会是父家：「一体一灵。」但如果你想报复我，那就起来对抗我。你为何不报复我，却要报复基督呢？或者更确切地说：你为何要对着钉子施加打击呢？况且，报复无论如何都是不可取的；但代替有罪者去伤害他人——那就更糟了。你是否受到了我们的伤害？那么，你为何要令那未曾伤害你的人忧伤呢？这是极其不明智的。关于这一点，我要说的是，我并非开玩笑，也并非随意而言，而是如我所思所感。具体来说，我希望你们中所有对我们心怀敌意的人，并因此远离我们投奔他人，从而伤害自己的人，能直接打我们的脸，并且剥去我们的衣服，毫不留情地鞭打我们，无论我们是被公正地指控还是不公正地指控，他们最好是将怒气发泄在我们身上，而非去做他们现在所决断的事。如果这发生了，那也没有任何重要性，因为在这种情况下，受苦的不过是一个微不足道的人，不值任何代价。另一方面，即使我蒙受了你们的伤害和羞辱，我也会为你们向上帝祷告，祂就会赦免你们的罪，——这并非因为我拥有如此的胆量，而是因为当一个受伤害的人为伤害他的人祷告时，他就会获得极大的胆量。「若有人得罪人，」经上说，「就有人为他祷告」（撒母耳记上 2:25）。即使我自己无法做到（这一点），我也会去寻找其他圣洁的男士们，并恳求他们，他们就会代为完成。然而现在，我们又能去恳求谁呢？当我们已经冒犯了上帝的时候？
  - type: paragraph
    text:
      ru: Посмотри, какая у них (производящих расколы) несообразность. Из тех, которые так поступают по отношению к Церкви, одни вовсе никогда не приходят сюда, или же однажды в год и то без порядка и как случится; другие приходят чаще, но также беспорядочно для пустых разговоров и ничтожной болтовни. Иные представляются усердными, это – те, которые производят такие бедствия (в Церкви). Итак, если и вы ради этого обнаруживаете такое усердие, то лучше бы вам быть в числе нерадивых; а еще гораздо лучше, если бы те не были нерадивы, а вы не были такими. Я говорю не о вас, находящихся здесь, но о тех отступниках. Такое дело есть как бы прелюбодеяние. Если же тебе не хочется слышать этого об них, то (не слушай и того, что они говорят) об нас, – так как здесь что-нибудь одно из двух должно быть противозаконно. Если вы нас подозреваете в этом, то мы готовы уступить свою власть, кому вы хотите, – только пусть будетЦерковьедина. Если же мы поставлены законно, то убедите низложить тех, которые противозаконно заняли кафедру. Говорю это, не приказывая вам, но предохраняя и предостерегая вас. Так как каждый из вас имеет возраст и дает отчет в своих поступках, то я прошу вас о том, чтобы вы, все слагая на нас, не считали невинными самих себя и, таким образом, в обольщении не повредили напрасно самим себе. Мы дадим ответ за ваши души, но только тогда, когда что-нибудь будет опущено с нашей стороны, когда мы не будем упрашивать вас, не будем увещевать, не будем свидетельствовать против вас. После этого, позвольте и мне сказать:«чист я от крови всех»(Деян. 20:26), и:"избавит"Бог душу мою (2Тим. 4:18). Скажите, чего вы хотите, укажите справедливую причину, по которой вы отступаете, и я буду оправдываться. Но вы не говорите. Поэтому я прошу вас и самим твердо основаться здесь, и отложившихся привести, чтобы нам воспослать единодушную благодарность Богу, Которому слава во веки. Аминь.
      cn: 你们看，这些（制造分裂者）是何等的不合宜。在那些如此对待教会的人中，有些人根本不来这里，或者一年只来一次，而且没有规矩，随心所欲；另一些人来得更频繁，但也同样杂乱无章，只为闲言碎语和无意义的闲聊。还有一些人则显得热心，这些就是那些（在教会中）制造如此灾祸的人。那么，如果你们也因此表现出这样的热心，那你们还不如与那些不热心的人为伍；而更好得多的，是那些人不要不热心，而你们也不要那样。我所说的并非你们这些在此的人，而是那些背道者。这样的事如同奸淫。如果你不想听到这些关于他们的话，那么（也别听他们说的）关于我们的话，——因为在此二者必有一者是违法的。如果你们因此怀疑我们，那么我们准备将我们的权柄让给你们所愿的人，——只求教会合一。如果我们是合法设立的，那么就请说服（你们去）废黜那些非法占据主教座的人。我说这些，并非命令你们，而是保护并警告你们。既然你们每个人都有判断能力，并要为自己的行为负责，那么我恳求你们不要将一切责任都推给我们，从而自认为无辜，如此在受迷惑中无益地伤害了自己。我们将为你们的灵魂负责，但这仅限于我们有所疏忽，我们不恳求你们，不规劝你们，不为你们作证之时。此后，也请允许我说：「我于众人的血是清洁的」（使徒行传 20:26），以及：「上帝必救我的灵魂」（提摩太后书 4:18）。请说出你们想要什么，指出你们背弃的正当理由，我就会为自己辩白。但你们不说话。因此我恳求你们，既要自己坚定地在此扎根，也要将那些离弃者带回来，以便我们能向那直到永远得荣耀的上帝，同心合意地献上感谢。阿们。
