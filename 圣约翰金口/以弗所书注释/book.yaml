  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Нет ничего, с чем бы можно было сравнить апостольское благорасположение, – что было бы подобно тому сочувствию и той нежной любви, которыми был исполнен блаженный Павел, во всех своих молитвах поминавший целые города и народы.«Благодарю за васБога, вспоминая о вас в молитвах моих», – так он обыкновенно писал всем. Представьте же, сколь многих он имел в мыслях своих! Даже и помнить было трудно, – так много было людей, о которых он молился, благодаря Бога за всех, как будто те величайшие благодеяния (какие они получили) получил он сам. «Ради этого», – говорит, т. е. ради будущих благ, которые ожидают право верующих и живущих. Впрочем, должно благодарить Бога за все, что Он сделал для рода человеческого и до этого и после того,  должно благодарить Его и за веру верующих."Услышав, – говорит, –о вашей вере во Христа Иисуса и о любви ко всем святым». Везде он соединяет и сближает веру и любовь, как некую дивную двоицу; о любви же их говорит не к туземцам только, но ко всем (христианам).«Непрестанно благодарю за васБога, вспоминая о вас в молитвах моих». О чем же он просит, о чем молит? О том,«чтобы Бог Господа нашего Иисуса Христа, Отец славы, дал вам Духа премудрости и откровения». Двум истинам Он хочет научить их, как следует: к чему они призваны, и каким образом избавлены от исконных (зол). Между тем сам говорит, что этих (истин) три. Каким же образом их три?'
      cn: 使徒的恩慈无可比拟——没有什么能像蒙福的保罗那样充满同情和温柔的爱，他在所有的祷告中都记念着整个城市和民族。「我为你们感谢上帝，在我的祷告中记念你们，」他通常这样写信给所有人。那么请想象一下，他心中记挂着多少人啊！甚至很难记住所有人——他为如此多的人祷告，为所有人感谢上帝，仿佛他们所获得的那些最伟大的恩惠是他自己获得的一样。他说：「为此」，也就是说，为了那等待着正信和正行之人的未来福益。此外，我们应当为上帝在此之前和之后为人类所做的一切感谢祂，也应当为信徒的信仰感谢祂。他说：「我听见了你们对基督耶稣的信心，以及对所有圣徒的爱。」他处处将信心和爱连接并拉近，如同某种奇妙的一对；至于他们的爱，他所说的不仅仅是对本地人，而是对所有（基督徒）。「我不断地为你们感谢上帝，在我的祷告中记念你们。」那么他祈求什么，祷告什么呢？他祈求「愿我们主耶稣基督的上帝，荣耀之父，赐给你们智慧和启示的圣灵。」祂想正确地教导他们两项真理：他们被召是为何事，以及他们是如何从原初的（罪恶）中被救赎的。然而，他自己却说这些（真理）有三项。那么它们怎么会有三项呢？
  - type: paragraph
    text:
      ru: 'Начнем с будущего. Из уготованных благ мы узнаем неизреченное и переизбыточествующее богатство Его. А из знания о том, каковы мы и как уверовали, узнаем силу и могущество Его – обратить к Богу бывших столь долгое время в отчуждении.«Немощное Божие сильнее людей»(1Кор. 1:25). Той же самой силою, которою воскресил Христа, Он и нас привлек к Себе. И сила Его выказалась не только в воскресении, но и в гораздо большем:«и посадиводеснуюСебя на небесах, превыше всякого Начальства, и Власти, и Силы, и Господства, и всякого имени, именуемого не только в сем веке, но и в будущем, и все покорил под ноги Его, и поставил Его выше всего, главою Церкви, которая есть Тело Его, полнота Наполняющего все во всем»(Еф.1:20–23). Подлинно великих и неизреченных таинств сделал Он нас участниками, – таинств, которые понимать могут только приобщившиеся Святого Духа и удостоившиеся великой благодати. Потому-то и Павел начинает свою молитву словами:«Отец славы», т. е. (Отец), даровавший нам великие блага. Он всегда называет Его сообразно предмету (о котором говорится), как, например, когда говорит:«Отец милосердия и Бог всякого утешения»(2Кор. 1:3), и как еще пророк (сказал):«Господь – твердыня моя и прибежище мое»(Пс. 17:3).«Отец славы». (Апостол) не находит такого слова (которым бы мог вполне изобразить уготованные Богом блага), и везде называет их славой, как словом, обозначающим для нас всякого рода величие. Смотри: (Бога Отца апостол называет) Отцом славы и Богом Христа. Что же? Разве Сын имеет меньше славы? Нет, никто, даже безумный, этого не скажет."Дал вам"(духа премудрости), т. е. возвысить и воскрылить ваш ум, потому что иначе нельзя познать этого.«Душевный человек не принимает того, что от Духа Божья, потому что он почитает это безумием»(1Кор. 2:14). Значит, чтобы понимать духовное, видеть сокровенное, – нужна и мудрость духовная. Дух открывает все и разъясняет самыя тайны Божьи. Знание тайн Божьих принадлежит одному Духу, который«проницает и глубины Божии»(1Кор. 2:10), и ни ангел, ни архангел, ни иная какая сотворенная сила не подаст, т. е. не доставит вам этого дарования. Если же это есть плод откровения, в таком случае излишни все умствования, потому что углубившийся в (созерцание) Бога и познавший Его ни в чем не усомнится, не будет говорить: вот это возможно, а это невозможно; не будет рассуждать, каким образом то или другое могло случиться. Если бы и мы познали Бога, как должно, если бы познали от того, от кого следует познавать, от самого Духа, то мы уже ни в чем более не сомневались бы. Потому-то (апостол) и говорит:«к познанию Его, и просветил очи сердца вашего». Наученный, что есть Бог ни в обетованиях не усомнится, ни обнаружит неверия в то, что уже было. Вот почему он и молится о даровании им духа премудрости и откровения. Впрочем, сам (апостол), что можно, доказывает и посредством умозаключений, (заимствуя основания для них) от того что уже совершено. Так как он намерен говорить с одной стороны уже о совершившемся, а с другой – еще о не совершившемся, то тем, что совершено, он утверждает веру в то, что еще не совершено, как это видно из следующего:«дабы вы познали, – говорит, –в чем состоит надежда призвания Его», – (надежда) пока еще неизвестная, говорит, но не для верных, –«и какое богатство славного наследия Его для святых», – тоже пока еще неизвестное. Что же известно? То, что мы веруем, что Он «Своей силой» воскресил Христа. Возбудить веру в душах гораздо удивительнее, чем воскресить мертвого. Как так? Постараюсь сделать это ясным. Послушай, в самом деле: Христос сказал мертвому:«Лазарь! иди вон»(Иоан. 11:43), и (мертвец) тотчас повиновался. Сказал Петр Тавифе:«Тавифа! встань»(Деян. 9:40), и та не противоречила. Скажет Господь в последний день – и все восстанут, притом с такой быстротой, что остающиеся еще в живых не предупредят умерших, и все это совершится и окончится в самое краткое время, – в одно мгновение ока.'
      cn: '我们从未来开始。从预备好的福益中，我们得以认识祂那不可言喻、极其丰盛的财富。而从我们是怎样的人以及我们如何信靠的认知中，我们得以认识祂的权能和威严——祂能使那些长期与祂疏离的人归向上帝。「上帝的软弱强于世人」(哥林多前书 1:25)。祂以那使基督复活的同一能力，也将我们吸引到祂自己身边。祂的能力不仅显明在复活上，更显明在远超乎此的事上：「使祂在天上坐在自己的右边，远超过一切执政的、掌权的、有能的、主治的，以及一切有名无名的，不但在今世，也在来世。又将万有服在祂的脚下，使祂为教会的元首，这教会就是祂的身体，是那充满万有者在万有里所充满的丰盛」(以弗所书 1:20-23)。祂确实使我们成为伟大且不可言喻之奥秘的参与者——这些奥秘唯有领受了圣灵并蒙受了巨大恩典的人才能领悟。


        因此，保罗以「荣耀的父」为祷告的开端，即是（父）将伟大的福益赐予我们。他总是根据所谈论的事物来称呼祂，例如，当他说：「怜悯的父，和赐各样安慰的上帝」(哥林多后书 1:3)，又如先知所说：「上主是我的磐石，我的避难所」(诗篇 17:3)。「荣耀的父」。这位使徒找不到一个词（能完全描绘上帝所预备的福益），于是到处都称它们为「荣耀」，因为这个词对我们来说代表着各种伟大的事物。看哪：（使徒称上帝圣父为）荣耀的父和基督的上帝。那么呢？难道圣子拥有较少的荣耀吗？不，没有人，即使是疯子，也不会这么说。


        「赐给你们」（智慧的灵），即是提升和振奋你们的心思，因为若非如此，就无法认识这些事。「属血气的人不领受上帝之灵的事，反倒以为愚拙」(哥林多前书 2:14)。因此，要理解属灵的事物，看见隐藏的奥秘，就需要属灵的智慧。圣灵揭示一切并阐明上帝最深的奥秘。认识上帝的奥秘唯独属于圣灵，祂「洞察上帝的深奥」(哥林多前书 2:10)，并且无论是天使、大天使，还是其他任何受造的权能，都不能赐予，即不能带给你们这恩赐。如果这确实是启示的果实，那么一切的智力推敲都是多余的，因为深入（默观）上帝并认识祂的人，将不会怀疑任何事，不会说：这可能，那不可能；也不会思忖，这或那如何可能发生。如果我们也能按着当有的方式认识上帝，如果能从应当认识的来源——从圣灵本身——认识祂，那么我们就不会再有任何疑惑了。因此（使徒）说：「好叫你们认识祂，并照明你们心中的眼睛」。被教导何谓上帝的人，既不会怀疑祂的应许，也不会对已成就的事表现出不信。这就是为什么他为他们祈求赐予智慧和启示的灵。


        然而，这位使徒自己也通过推理，（从已成就的事中汲取依据），来证明力所能及的。因为他一方面打算谈论已成就的事，另一方面打算谈论尚未成就的事，所以他藉着已成就的事来坚定对尚未成就之事的信心，正如以下所见：「好叫你们明白，——他说，——祂呼召的盼望是什么」，——（这盼望）他说，目前还是未知的，但对信徒而言并非如此——「以及祂在圣徒中荣耀基业的财富何等丰盛」，——这同样目前还是未知的。那么，已知的是什么呢？是我们相信祂「以祂自己的能力」使基督复活。在人的灵魂中激发起信心，比使死人复活更令人惊叹。何以如此？我将努力阐明这一点。请听，实际上是这样：基督对死人说：「拉撒路！出来！」(约翰福音 11:43)，那（死人）立刻就服从了。彼得对多加说：「多加！起来！」(使徒行传 9:40)，她也没有反驳。上主在末日将会发话——那时所有人都会复活，而且速度之快，以至于仍在世上的活人甚至来不及预先知晓已逝者，这一切都将在最短的时间内完成和结束——就在一眨眼之间。'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Но не так бывает в деле обращения к вере. А как же? Послушай опять, что говорит (Господь):«многие поищут войти, и не возмогут»(Лк. 13:24). Теперь понимаешь, что труднее? Потому-то (апостол верой) и доказывает все. В самом деле, гораздо труднее, – даже по человеческим соображениям, – убедить свободу человека, чем создать природу. Причина же заключается в том, что Бог желает, чтобы мы сами добровольно делались добрыми. Таким образом (апостол) совершенно справедливо видит«и как безмерно величие могущества Его в нас, верующих». Когда пророки ничего не помогли, когда (не помогли) ангелы и архангелы, вся видимая и невидимая тварь, – видимая, будучи выведена на сцену, не смогла руководить, а невидимая во многом успела, – тогда благоволил явиться сам (Бог), показывая этим, что в деле (обращения к вере) нужна сила Божественная.«Богатство славного», т. е. славу неизреченную. В самом деле, чье слово в состоянии представить ту славу, которой сподобятся некогда святые? Конечно, ничье. Чтобы уразуметь это, поистине нужна благодать, – нужно воспринять хоть малый луч (духовного света). Было известно нечто (из Божественных истин) и прежде; но ныне Он восхотел научить большему и совершеннейшему ведению. Видишь ли, что Он совершил? Воскресил Христа; и это уже немаловажное дело; но смотри, что и еще (Он сделал): посадил ЕгоодеснуюСебя. Какое слово может изобразить это? Сущего от земли, того, кто был безгласнее рыб, кто был игрушкой (подвергался искушениям) демонов, – вдруг возвел на высоту. Поистине, преизобильно величие силы Его!'
      cn: 但在归信的事务上，事情并非如此。那么是怎样的呢？再次听（上主）所说：「许多人将寻求进入，却不能够。」（路加福音 13:24）。现在你明白什么更难了吗？正因如此，（使徒藉着信心）便证明了这一切。事实上，说服人的自由意志，比创造自然要困难得多 — 甚至按人的考虑来说亦然。原因则在于，上帝愿我们自己甘愿地变得良善。因此，（使徒）完全公允地看见「祂在我们这些信者身上能力的浩大，是何等无可限量」。当先知们毫无助益之时，当天使和总领天使（亦无助益之时），所有的可见与不可见的受造物 — 可见的，被带到场景中，却无法引导，而不可见的，则在许多方面有所成就 — 那时（上帝）便乐意亲自显现，借此表明在（归信的）事务上，需要神圣的力量。「荣耀的丰富」，亦即那不可言喻的荣耀。事实上，谁的言语能够描绘那圣徒们有朝一日将蒙受的荣耀呢？当然，没有。为了领悟这一点，确实需要恩典 — 需要领受哪怕一丝（属灵之光）的微光。从前也曾知晓一些（神圣的真理）；但如今祂乐意教导更大且更完善的知识。你看见了吗，祂成就了什么？使基督复活；这已非小事；但看祂还（做了）什么：使祂坐在自己的右边。怎样的言语能描绘这一切？本属尘土的，那比鱼更无声的，那曾是魔鬼的玩物（曾遭受魔鬼的试探） — 竟突然高升。确实，祂力量的浩大是何等丰盛！
  - type: paragraph
    text:
      ru: 'И смотри, куда Он возвел Его. Посадил Его«на небесах»превыше всякого сотворенного естества, превыше всякого начальства и власти."Превыше, – говорит, –всякого Начальства»(Еф.1:21). Потому, поистине, нужен Дух (благодати), нужен ум просвещенный, чтобы познать Его, – словом, для этого нужно откровение. Представь, как велико расстояние между человеческой и божественной природой; между тем, Он от этого (человеческого) ничтожества возвел Его в ту (Божественную) честь. Не одну, не две, не три степени нужно перейти для этого. Потому-то и (апостол) не просто сказал: выше, но – превыше. Превыше вышних сил – один Бог. И туда-то Он возвел сущего от нас, – от крайнего уничижения Он возвел на крайнюю степень власти, за которою уже нет другого (высшего) достоинства.«Всякого Начальства», – говорит, т. е. (превыше) не того или другого, но всякого«Начальства, и Власти, и Силы, и Господства, и всякого имени, именуемого»(Еф.1:21); что бы ни было на небе, Он сделался превыше всего. Все это (говорил апостол) о Воскресшем из мертвых, и все это достойно удивления, а никак не о Боге-Слове. Ведь, что комары в сравнении с человеком, то вся тварь в сравнении с Богом. И что я говорю: комары? Если все люди пред Богом не более, как капля и как пылинка на весовой чашке (Ис. 40:15), то с комарами (в этом случае) можешь сравнивать невидимые силы. Итак, не о Боге-Слове говорил так (апостол), а о Том, Кто от нас. Это подлинно велико и чудно, – что Он из преисподних земли возвел Его. Если все народы (пред Богом) как капля, то один человек лишь малейшая частичка капли. И между тем Бог сделал Его выше всех«не только в сем веке, но и в будущем», – значит, имена некоторых сил (небесных) нам не объявлены еще и неизвестны, –«и все покорил под ноги Его»(Еф.1:22). Не просто сказал; сделал"Его выше"(всего), чтобы предпочесть им, – не в смысле сравнения употребил это слово; но поставил его как бы господином над рабами. О, подлинно дивные дела! Через то, что Бог Слово вселился (в наше естество), человеку вся сотворенная сила сделалась рабыней. Но, может быть, есть кто-нибудь выше (Его), у кого, хотя нет подчиненных, но кто обладает большим достоинством? Здесь и это неприложимо:«и все покорил под ноги Его», не просто покорил, но покорил до совершенного подчинения, так что большего подчинения быть не может. Потому-то (апостол) и сказал:«под ноги Его, и поставил Его выше всего, главою Церкви».'
      cn: 且看祂将祂提升到何处。使祂安坐在「天上」，超越一切被造的本性，超越一切的执政和掌权。「超越，——他说，——一切执政的。」（以弗所书 1:21）因此，确实需要（恩典的）圣灵，需要被光照的理智，才能认识祂——简言之，为此需要启示。试想，人类与神性本性之间的距离何其遥远；然而，祂却将祂从这（人类的）卑微提升到那（神性的）尊荣。为此，并非只需跨越一个、两个或三个阶梯。正因如此，（使徒）才不单单说：之上，而是——超越。超越至高诸力——唯独上帝。而祂将那出自我们的人提升到那地步——祂将祂从极度的卑微提升到极高的权柄，再无其他（更高）的尊贵在其之上了。「一切执政的，」——他说，也就是说，（超越）并非这个或那个，而是超越「一切执政的、掌权的、有能的、主治的和一切有名的名」（以弗所书 1:21）；凡天上所有的，祂都超越了。这一切（使徒所言）都是关于从死者中复活的祂，这一切都值得惊叹，绝非关于上帝圣言（道）而言。因为，蚊蚋与人相比如何，万有受造物与上帝相比亦然。我何出此言：蚊蚋？如果所有人在上帝面前不过如同一滴水和秤盘上的一粒微尘（以赛亚书 40:15），那么（在这种情况下）你就可以用蚊蚋来比喻那些无形的力量。所以，（使徒）并非如此论及上帝圣言，而是论及那出自我们的人。这确是伟大而奇妙的——祂将祂从地的深处提升上来。如果所有民族（在上帝面前）如同一滴水，那么一个人只是那一滴水中最小的部分。然而上帝使祂超越万有，「不但在今世，也在来世」——这意味着，某些（天上）力量的名号尚未向我们宣告，也仍是未知——「并使万有服在祂的脚下」（以弗所书 1:22）。并非仅仅说；使「祂超越」（万有），以示对祂的偏爱——并非在比较的意义上使用这个词；而是将祂安置如同奴仆之上的主宰。哦，确实是奇妙的作为！借着上帝圣言（道）住进（我们的人性），一切被造的力量都成了人类的奴仆。但是，或许有谁超越（祂），虽无下属，却拥有更高的尊贵？在这里，此言亦不适用：「并使万有服在祂的脚下」，并非仅仅使其顺服，而是使其完全顺服，以至于再无更大的顺服可言。正因如此，（使徒）才说：「服在祂的脚下，并使祂超越万有，作教会的元首。」
  - type: paragraph
    text:
      ru: 'О, иЦерковь, куда Он возвел! Как бы некоторой машиной поднявши ее, Он возвел ее на высоту великую, и посадил ее на том же престоле, потому что где глава, там и тело, нет никакого перерыва между главой и телом, и если бы (связь между ними) прерывалась, то не было бы ни тела, ни главы.«Выше всего», – говорит. Что значит –«выше всего»? Или – что Христос выше всего видимого и созерцаемого умом, или – что высшее из всех благодеяний, оказанных Им, то, что Сына Своего сделал главою, не оставив при этом никого выше – ни ангела, ни архангела, ни другого кого-нибудь. Не одним только тем (преимуществом Бог) почтил нас, что сущего от нас возвел горе, но еще и тем, что предуготовил то, чтобы весь вообще человеческий род последовал за Ним, имел тоже, что Он и наследовал Его (славу).«Которая есть Тело Его»(Еф.1:23). Чтобы ты, услышав слово «главу», не принял его в значении только власти, но в смысле собственном, не счел Его только начальником, но видел в Нем как бы телесную (действительную) главу, (апостол) прибавляет:«полнота Наполняющего все во всем». Он считает как бы недостаточным (название главы для того), чтобы показать родство и близость (Церкви ко Христу), и что говорит?Церковьесть исполнение Христа, точно так же, как голову дополняет тело и тело дополняется головой. Видишь, каким оружием пользуется апостол, как он не останавливается ни пред каким оборотом речи, чтобы представить Божью славу."Полнота", – говорит, т. е. как глава пополняется телом, потому что тело составляется из всех (своих) членов, и каждый член необходим для другого. Видишь, как (апостол) представляет, что (для Христа, как главы) нужны все вообще члены, потому что если бы многие из нас не были – один рукой, другой ногой, третий иным каким-либо членом, то тело Его было бы не полно. Итак, тело Его составляется из всех (членов). И значит: тогда только исполнится глава, тогда устроится совершенное тело, когда мы все вместе будем соединены и скреплены самым прочным образом.'
      cn: '哦，祂将圣教会提升至何等境地！祂仿佛用某种机械将其托起，高高提升至伟大之处，并使之与祂同坐宝座，因为首在哪里，身体也在哪里，首与身体之间毫无间隔，若彼此间的连系中断，便无身体，也无首。


        经上说：「远超一切。」这「远超一切」意味着什么呢？其一，基督远超一切可见之物与心智所能思量之物；其二，在上帝所施予的一切恩惠中，至高无上的便是祂使圣子成为首，且未留下任何超越祂之物——无论是天使、大天使，抑或任何其他存有。上帝不仅以将我们人类之中的祂提升到高处来荣耀我们，更以祂预备了全体人类都将追随祂、拥有祂所有、并继承祂的荣耀而荣耀我们。


        「教会是祂的身体」(以弗所书 1:23)。为免你听到「首」这个词，只将其理解为权力，而非其本义，亦不将其仅视为一位领袖，而是视作身体上（真实的）首，（使徒）又补充道：「是那充满万有者所充满的丰盛。」（使徒）似乎认为单称其为「首」不足以表明（教会与基督的）亲缘与亲密，那么他说了什么呢？教会是基督的圆满，正如身体补足了首，首也补足了身体一般。你看，使徒运用了何等有力的工具，他不惜使用任何言辞修饰，以呈现上帝的荣耀。


        经上说：「丰盛」——也就是说，首借由身体而得以补足，因为身体由所有肢体组成，且每一肢体都互为必要。你看，（使徒）如何阐明，（对于基督，即首而言，）所有肢体都不可或缺，因为若我们当中有许多人——或为手，或为脚，或为其他任何肢体——有所缺失，那么祂的身体便无法完整。因此，祂的身体由所有肢体组成。这意味着：唯有届时，首方能圆满，届时，完整的身体方能形成，当我们所有人都以最牢固的方式联结并结合在一起之时。'
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Видишь ли«богатство славного наследия»? Видишь ли«безмерно величие могущества Его в нас, верующих»? Видишь ли«надежда призвания»? Почтим же нашу Главу; подумаем о том, какой Главы мы тело, – которой все покорено. Сообразно с этим образцом мы должны быть лучше самих ангелов и выше архангелов, как удостоенные большей чести, нежели все они.«Не Ангелов»Бог принял естество, как говорит (апостол) в послании к Евреям, но«семя Авраамово»(Евр. 2:16). Не власти, не начала, не господства, не другой какой силы, а наше принял Он естество и посадил горе. И что я говорю: посадил? Сделал Своею одеждой, и не это только, но и«все покорил под ноги Его»(Евр.2:8). Сколько бы раз сам ты ни умирал, сколько бы, – хотя бы тысячи и более, – раз ты ни полагал душу свою, но ты не скажешь, чтобы сделал, хотя что-нибудь равное (тому, что Христос сделал). Он совершил два великих дела: сам снизошел до последней степени уничижения, и человека возвел на великую высоту. (Апостол) прежде сказал о Его уничижении; здесь же говорит о деле еще высшем, истинно великом и главном. Если бы мы и не были превознесены (чрез Его уничижение), было бы довольно (того, что Он сделал для нас); или если бы и были удостоены (столь высокой чести), но без Его жертвы (то этого тоже было бы довольно). Но когда Он совершил и то и другое, то, для изображения всего этого, самое богатое слово остается недостаточным и бессильным. Самое воскресение представляется уже не столь великим, когда подумаю об этом. Не о Боге-Слове, а о Нем (Христе уничиженном) говорит:«Бог Господа нашего Иисуса Христа». Почтим же близость родства; убоимся, чтобы не отсекся кто от этого тела, чтобы не ниспал, кто и не явился недостойным. Если бы кто-нибудь на нашу голову надел диадему, золотой венец, – скажите, чего бы мы не сделали, чтобы показать себя достойными этих бездушных камней? Здесь же не диадема покрывает нашу голову, а сам Христос сделался нашей Главой, что гораздо выше, – а между тем мы не придаем этому никакой цены. Ангелы, архангелы и все (небесные) силы благоговеют пред нашей Главой, а мы – тело Её ужели не почтим, но ни за Её уничижение, ни за наше возвышение? Какая же после этого останется у нас надежда на спасение?'
      cn: 你可曾看见「荣耀基业的丰盛」？你可曾看见「祂在我们这信的人身上，其权能无限的宏伟」？你可曾看见「蒙召的指望」？所以，我们当敬重我们的元首；思量我们是属何等元首的肢体——万物都服从祂。按照这榜样，我们理当超越众天使，甚至高过众天使长，因我们已蒙受比他们更大的尊荣。上帝所取受的，不是「天使的本性」，正如使徒在《致希伯来人书》中所说，而是「亚伯拉罕的后裔」（希伯来书 2:16）。祂未曾取受那些执政的、掌权的、有权势的，或任何别的能力，而是取受了我们的本性，并使之升上高天，坐于高处。我何止说「使之坐于高处」呢？祂甚至使之成为祂的衣裳；不仅如此，祂更「使万物都服在祂的脚下」（希伯来书 2:8）。无论你亲身死多少次，无论你舍弃自己的生命——哪怕千次万次，甚至更多，你也不能说自己做到了哪怕与（基督所做）相等的事。祂成就了两件伟大的事：祂亲自降至极度的卑微，并把人提升到极高之处。使徒先前论及祂的卑微；此处则谈论一件更超越、真实伟大且首要的事。即便我们没有（因祂的卑微）而被提升，祂为我们所做的一切也已足够；又或者，即便我们有幸蒙受（如此高的尊荣），却没有祂的牺牲（那也已足够）。然而，当祂同时成就了这两件事时，要描绘这一切，最丰富的言语也显得不足和无力。当我思及此事，连复活本身也显得不再那么伟大了。此处所论及的，不是圣言上帝，而是祂（那受卑微的基督）：乃是「我们主耶稣基督的上帝」。所以，我们当敬重这亲密的血缘关系；当心，免得有人被这肢体斩断，免得有人堕落，显得不配。倘若有人在我们头上戴上冠冕，戴上金制的华冠——请问，我们岂会不竭尽所能，以示自己配得上这些无生命的宝石吗？然而，在此并非冠冕覆盖我们的头颅，而是基督自己成了我们的元首，这远比前者更尊贵——可我们却对此不以为然，不加珍视。众天使、众天使长和天上一切权能者，都对我们的元首心存敬畏，而我们——祂的肢体，难道竟不敬重祂吗？既不为祂的卑微，也不为我们的高升吗？这样一来，我们还有什么得救的指望呢？
  - type: paragraph
    text:
      ru: 'Напечатлей в уме своем этот царский трон, помни всегда преизбыточество чести. Это, можно сказать, больше геенны должно устрашать нас. Если бы и не было геенны, то для нас, – удостоенных столь великой чести, и потом оказавшихся недостойными её и злыми, – (лишение этой чести) какое было бы наказание, какое мучение? Представь, близ кого восседит твоя Глава, – одного этого совершенно довольно для всего, –одеснуюкого она находится? Она восседит превыше всякого начальства, и власти и силы: а тело Её и бесы попирают? Но да не будет! Если бы было так, то не было бы уже и тела. От Главы твоей в благоговении отступают самые почетнейшие из рабов: неужели же тело ты отдашь на поругание? Какого наказания не будешь ты достоин в таком случае? Если бы кто ноги царя заковал в цепи, и надел на них кандалы, разве такой не был бы повинен самому жестокому наказанию? А ты все тело Его отдаешь лютым зверям и не содрогаешься? Но так как у нас зашла речь о теле Господнем, то вот вспомним и то тело, которое было распято, пригвождено, и приносится в жертву. Если ты – тело Христово, то неси крест, потому что Он нес; перенеси оплевания, заушения, прободение гвоздями; таково было Его тело, хотя оно было безгрешно:«не сделал греха, – сказано, –и не было лжи в устах Его»(Ис. 53:9). Руки Его действовали только для благодетельствования нуждающихся. Уста Его не произнесли ничего неприличного;«не бес ли в Тебе?», – говорили Ему, а Он и здесь не сказал ничего вопреки (Иоан. 7:20). И так как мы говорим о теле Его, то приобщающиеся тела и пьющие кровь Его – помните, что мы приобщаемся тела нисколько не различного от того тела, которое восседит горе, которому покланяются ангелы, которое находится близ нетленной Силы, – это именно (тело) мы вкушаем. О, сколько открыто нам путей ко спасению! Он сделал нас Своим телом, дал нам Свое тело, – и все это не отвлекает нас от зла. О, омрачение! О, великое унижение! О, бесстыдство!«Ищите горнего, – сказано, –где Христос сидитодеснуюБога»(Кол. 3:1); а между тем одни заботятся о богатстве, другие пленяются страстями.'
      cn: '请在你的心中铭刻这君王的宝座，永远牢记这至高的荣耀。这可以说，比地狱更应令我们恐惧。即便没有地狱，对于我们这些蒙受如此大恩、却又被发现不配且邪恶的人来说，（剥夺这份荣耀）将是何等的惩罚，何等的折磨？试想，你的头（指基督）与谁同坐——仅此一点就已全然足够——祂坐在谁的右边？祂坐在一切执政的、掌权的、有能的之上：难道祂的身体还要任由邪魔践踏吗？断乎不可！如果真是这样，那也就不会再有身体了。从你的头上，最尊贵的仆役也必敬畏地退避：难道你竟要把身体交给羞辱吗？在这种情况下，你将不配受何等的惩罚？如果有人用链条锁住君王的双脚，给他戴上手铐，难道这样的人不该受最严酷的惩罚吗？而你竟将祂的整个身体交给凶残的野兽，却不颤栗？


        既然我们谈到了主（指基督）的身体，那么现在也让我们回想那个被钉死、被刺穿、被献为祭物的身体。如果你是基督的身体，那么就背起十字架，因为祂背负过；忍受唾弃、掌掴、被钉子刺穿；祂的身体就是这样，尽管它是无罪的：「祂没有犯过罪，」经上说，「祂口中也没有诡诈」（以赛亚书 53:9）。祂的双手只为施惠于贫困之人而行动。祂的口从未说出任何不合宜的话；人们对祂说：「你不是有鬼附着吗？」（约翰福音 7:20），而祂在此也未反驳什么。


        因此，当我们谈论祂的身体时，凡是领受祂身体和饮祂宝血的人——请记住，我们所领受的身体，与那坐在高天之上、为众天使所敬拜、与那不朽之能同在的身体，毫无二致——我们所领受的正是这个身体。哦，祂为我们开启了多少得救的途径！祂使我们成为祂的身体，将祂的身体赐予我们——而这一切竟仍不能使我们脱离邪恶。哦，何等的昏昧！哦，何等的堕落！哦，何等的无耻！「要寻求在上面的事，」经上说，「那里有基督坐在上帝的右边」（歌罗西书 3:1）；而与此同时，有些人却专注于财富，另一些人则被情欲所俘虏。'
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Разве вы не видите, что если у нас на теле появляются лишние и ненужные наросты, то мы их срезаем и отнимаем прочь? В особенности бесполезны для тела наросты безобразные, омертвенные, или сгнившие, от которых, между тем, может заразиться и все тело. Но мы не решимся утверждать, чтобы существо наше состояло из одного тела. Если же тело, несмотря на то, что оно вещественно, подвергается, однако, отсечению, то какие ужасы должно будет испытать нам, если духовная наша сторона не пребудет здравой? Когда тело наше не принимает пищи, когда проходы закрыты, – оно умирает; когда засорены каналы, – оно повреждается. Так точно бывает и с душой: когда мы закрываем уши (к слушанию слова Божьего), – она повреждается. Когда мы не воспринимаем духовной пищи, когда некоторые худые наклонности, подобно испорченным жидкостям, наполняют нас и начинают вредить нам, – тогда все это производит болезнь, болезнь жестокую, оканчивающуюся совершенным изнурением. В этом случае, для спасения нужно прибегнуть или к прижиганию, или же к отсечению, потому что Христос никому с таким (испорченным) телом не дозволит войти в чертог Свой. Если Он вывел и изгнал вон одевшихся в нечистые одежды, то чего Он не сделает, каких мер не употребит против того, кто допустит нечистоту в теле?'
      cn: '难道你们没有看见吗？如果我们的身体上长出多余而无用的赘生物，我们就会将它们切除，并移除掉。尤其对身体无益的，是那些丑陋、坏死或腐烂的赘生物，因为它们可能使整个身体受到感染。但我们不敢断言，我们的存在仅由一个身体组成。既然身体，尽管是物质的，仍然会遭受切除，那么如果我们的属灵层面不保持健全，我们将要经历何等的可怕？


        当我们的身体不摄取食物，当通道被堵塞时，它就会死亡；当管道阻塞时，它就会受损。灵魂也正是如此：当我们塞住耳朵（不听上帝的话语）时，它就会受损。当我们不领受属灵的食物，当一些邪恶的倾向，如同腐败的液体一般，充满我们并开始伤害我们时，——所有这一切就会产生疾病，一种残酷的疾病，最终导致彻底的枯竭。在这种情况下，为了得救，就必须求助于烧灼或切除，因为基督不会允许任何人带着这样的（败坏的）身体进入祂的殿堂。如果祂将那些身穿不洁衣服的人带出并驱逐出去，那么对于那些让不洁在身体中滋生的人，祂又会采取何等样的措施呢？'
  - type: paragraph
    text:
      ru: 'Замечаю, что многие просто, как случится, больше по обычаю и заведенному порядку, чем с рассуждением и сознательно, приобщаются тела Христова. Настало, говорят они, время св. четыредесятницы, или день Богоявления, всем, – каков бы кто ни был (по внутреннему расположению), – должно приобщиться тайн. Но время не дает права приступать (к таинству), потому что не праздник Богоявления и не четыредесятница делают приступающих достойными, но светлость и чистота души. С этими качествами приступай всегда; без них – никогда.«Ибо всякий раз, – говорит (апостол), –когда вы едите хлеб сей и пьете чашу сию, смерть Господню возвещаете»(1Кор. 11:26), т. е., совершаете воспоминание о своем спасении и о Моем благодеянии. Припомни, с каким страхом приступали к участию в древних жертвоприношениях. Чего не делали, чего не совершали предварительно? Они всегда наперед очищались; ты же, приступая к жертве, которой ангелы трепещут, определяешь совершение этого дела известным временем? Как предстанешь ты после того пред судилище Христово, ты, который нечистыми устами и руками осмеливаешься принимать тело Его? Ты и царя не осмелишься облобызать, когда изо рта у тебя дурной запах: как же ты со зловонной душой дерзаешь лобызать Царя небесного? Такой поступок – оскорбление для Него. Скажи мне, дерзнул ли бы ты с немытыми руками приступить к жертве? Не думаю. Напротив, ты скорее решишься вовсе не приступать. Чем (приступить) с нечистыми руками. А между тем, в малом показывая такую осмотрительность, ты приступаешь и дерзаешь касаться (великой жертвы), имея нечистую душу? Ведь в руках она бывает только временно, а душу совершенно проникает. Притом, разве ты не видишь, как чисто вымыты и как ярко блистают (священные) сосуды? Души же наши должны быть еще чище, святее и светлее. Почему так? Потому, что сосуды так (вымываются и очищаются) для нас; они не впитывают в себя, не чувствуют того, что в них; мы же – напротив. Как же после этого ты, который наверно не захотел бы (при богослужении) употребить неочищенный сосуд, приступаешь (к таинству) с неочищенного душой? Великую вижу здесь несообразность.'
      cn: '我注意到许多人领受基督的身体，只是随意地，更多是出于习俗和既定规矩，而非出于深思熟虑和有意识的。他们说，圣大斋期到了，或是主显节到了，所有人——无论其（内在心境）如何——都应当领受这奥秘。但时间并不赋予领受（这奥秘）的权利，因为使领受者配得的，不是主显节，也不是大斋期，而是灵魂的光明与纯洁。具备这些品质时，你总可以领受；若没有这些，就绝不可领受。


        因为（使徒）说：「你们每逢吃这饼，喝这杯，是宣扬主的死」（哥林多前书 11:26），也就是说，你们是在纪念自己的得救和我的恩惠。回想一下，在古老的献祭中，人们是带着怎样的敬畏领受的。他们事前有何事未曾做，有何事未曾完成呢？他们总是事先洁净自己；而你，在领受这连天使都为之战栗的祭献时，竟限定这事只能在特定时间完成吗？在此之后，你将如何站在基督的审判台前呢，你竟敢用不洁的口和手来领受祂的身体？当你口中有异味时，你连亲吻君王都不敢；那么你又怎敢用污秽的灵魂去亲吻天上的君王呢？这样的举动是对祂的冒犯。


        告诉我，你敢用未洗净的手去接近献祭吗？我想你不敢。相反，你宁愿完全不接近，也绝不用不洁净的手去接近。然而，在小事上表现出如此的谨慎，你却用不洁的灵魂去接近并敢于触碰（这伟大的祭献）吗？因为在手中，它只是暂时停留，但却完全渗透灵魂。再者，你难道没看见吗，那些（神圣的）器皿是何等地洁净，何等地光亮耀眼？而我们的灵魂，则应当更加纯洁、更加圣洁、更加光明。为何如此呢？因为器皿如此（被洗净和洁净）是为了我们；它们不吸收，也不感受其中的圣物；而我们却正好相反。那么在此之后，你，一个肯定不愿意（在神圣礼仪中）使用未洁净器皿的人，竟用未洁净的灵魂去接近（这奥秘）吗？我在此看到了极大的不相称。'
  - type: paragraph
    text:
      ru: 'В другие времена, бывая (в душе) чище, вы однако не приобщаетесь; в Пасху же, хотя бы на вас лежало преступление, вы приобщаетесь. О, обычай! О, предрассудок! Напрасно приносится ежедневная жертва, напрасно предстоим мы пред алтарем Господним, – никто не приобщается! Впрочем это я говорю не с тем, чтобы вы только приобщились; но с тем, чтобы вы приготовляли себя самих к достойному приобщению. Если ты не достоин приобщения, то не достоин и участия (в литургии верных), и значит – в молитвах. Ты слышишь, как диакон (χύρυξ) возглашает: елицы в покаянии (όσοι εν μετάνοία), изыдите все. Которые не приобщаются, те в покаянии; если и ты в покаянии, то ты не должен приобщаться, потому что не приобщающийся бывает из числа кающихся. Для чего после этого (диакон) говорит: изыдите немогущие молиться, а ты продолжаешь бесстыдно стоять? Но ты ведь из числа не их (кающихся), а могущих приобщаться? И однако не обращаешь на это никакого внимания и как бы считаешь это Дело ничтожным?'
      cn: 在其他时候，你们（心灵）更为纯洁，却不领圣体；但在逾越节，即使你们身负罪过，你们也领圣体。哦，这习俗！哦，这偏见！每日的献祭是徒然的，我们站在上主的祭坛前也是徒然的——竟无人领圣体！然而，我说这些话，并非为了让你们仅仅领受圣体；而是为了让你们预备自己，以配得地领受圣体。如果你不配领受圣体，那么你也不配参与（信友礼仪），也就是说，不配参与祷告。你听到辅祭（χύρυξ）宣告说：凡在忏悔中的（όσοι εν μετάνοία），全部离开。那些不领圣体的人，便是在忏悔中；如果你也在忏悔中，那么你就不应领受圣体，因为不领受圣体的人，就属于忏悔者之列。在这之后，（辅祭）为何说：凡不能祷告的，离开，而你却继续无耻地站着？但你难道不是不属于他们（忏悔者）之列，而是那些能够领受圣体的人吗？然而你却对此毫不留意，并且似乎认为这件圣事是微不足道的？
  - type: paragraph
    initial:
      ru: '5.'
      cn: '5.'
    text:
      ru: 'Посмотри, умоляю тебя: вот стоит царская трапеза; ангелы служат трапезе; сам Царь здесь присутствует. А ты стоишь небрежно, нет у тебя никакой мысли, и к тому же – в нечистых одеждах. Но одежды твои чисты? В таком случае приступи и приобщись. Сам (Царь) каждый раз приходит видеть присутствующих здесь; со всеми беседует; вот и теперь в вашей совести говорит вам: други, как вы здесь стоите, не имея брачного одеяния? Не сказал (Господь не имевшему брачной одежды) (Мф. 22:12): для чего ты возлег? – но сказал, что он не достоин был приглашения и (значит) входа; не сказал же: для чего тебя пригласили, но – для чего ты вошел? То же самое говорит Он теперь, обращаясь и ко всем нам, бесстыдно и дерзко стоящим. Всякий, кто не приобщается св. тайн, стоит бесстыдно и дерзко; потому-то, прежде всего, изгоняются те, которые – во грехах (кающиеся). Как во время трапезы в присутствии господина низшим слугам не позволяется участвовать в ней, и они высылаются вон, так должно быть и здесь. Когда износится жертва и в жертву предлагается Христос – это Владычное овча; когда слышишь: помолимся все вместе; когда видишь, что поднимается завеса, – то представляй себе, что разверзаются небеса, и свыше нисходят ангелы. Как никому из непросвещенных нельзя бывает присутствовать, так равно нельзя присутствовать и нечистым, хотя бы и просвещенным. Если бы кто, будучи позван на пир, изъявил на это согласие, явился, и уже приступил бы к трапезе, но потом не стал бы участвовать в ней, то – скажи мне – не оскорбил ли бы он этим звавшего его? И не лучше ли было бы таковому вовсе не приходить? Точно так и ты пришел, пел песнь, как бы признавая себя вместе со всеми достойными (св. тайн), потому что не вышел с недостойными. Почему же ты остался, а между тем не участвуешь в трапезе? Я не достоин, говоришь ты. Значит: ты не достоин общения и в молитвах, потому что Дух нисходит не только тогда, когда предложены (дары), но и когда поются (священные) песни. Разве ты не видел, как наши слуги сначала обмывают губкой стол, очищают дом, и потом уже ставят блюда? (В храмах) это самое совершается молитвами, возносимыми диаконом (χύρυξ), которыми, как губкой, мы омываемцерковь, чтобы совершить предложение в чистой церкви, чтобы не было здесь ни одного пятна, ни одной пылинки. А, действительно, бывают в церкви такие, которых глаза недостойны видеть (то, что здесь представляется взорам), которых уши недостойны слышать (то, что здесь возглашается). Если скот прикоснется к горе, сказал (некогда Господь), будет побит каменьями (Исх. 19:13). И (израильтяне) не удостоены были и восхода (на гору), хотя после они восходили и видели, где стоял Господь; им можно было после приходить и видеть. Удались и ты, когда (Бог) здесь присутствует, тебе еще более непозволительно быть здесь, чем оглашаемому. Ведь не все равно – никогда не приобщаться тайн, и после того, как удостоился их, пренебрегать ими, оскорблять их и делать себя недостойным их. Можно было бы сказать и еще большее и страшнейшее; но, чтобы не отяготить вашего ума, довольно и этого. Если это не образумит вас, то и большее (не будет иметь успеха).'
      cn: 请看，我恳求你：看哪，皇家筵席摆设在此；天使们侍奉筵席；君王亲自在此显现。而你却漫不经心地站立着，心无所思，况且身穿不洁的衣裳。可是你的衣裳洁净吗？若是如此，就请上前领受吧。君王（他自己）每次都来察看在场的人；与所有人交谈；如今在你们的良心中对你们说：「朋友们，你们怎么穿着没有婚宴礼服的衣裳站在这里呢？」（上主没有对那没有婚宴礼服的人）说（马太福音 22:12）：「你为何在此坐席？」——而是说他不配受邀，也（因此）不配进入；他并没有说：「你为何被邀请来？」而是说：「你为何进来？」同样的话，他如今也对我们所有厚颜无耻、胆大妄为地站立在此的人说。凡不领受圣事的人，都是厚颜无耻、胆大妄为地站立着；因此，首先被驱逐的是那些身陷罪中（悔罪者）的人。正如在筵席上，主人在场时，下等仆役不允许参与其中，他们会被逐出门外；在此也当如此。当圣祭被献上，基督——这主宰的羔羊——被奉献为祭时；当你听到：「我们大家一同祷告！」时；当你看见帷幕升起时，就当想象天门洞开，天使们从高天降临。正如未受光照（慕道者）之人不得在场，同样，不洁净之人，即使已受光照（受洗者），也不得在场。假如有人受邀赴宴，表示同意，前来赴宴，并已来到筵席前，却又不愿参与其中，那么——请告诉我——他岂不是以此冒犯了邀请他的人吗？对于这样的人，岂不是完全不来更好吗？同样地，你也来了，唱着赞美诗，仿佛承认自己与所有人一同配领（圣事），因为你没有与不配者一同离去。那么，你为何留下，却又不参与筵席呢？「我不配。」你这样说。这意味着：你也不配在祷告中相通，因为圣灵降临，不仅是在（圣物）被摆上之时，亦在（神圣）诗歌被咏唱之际。难道你没有看到，我们的仆役们是先用海绵擦洗桌子，清洁房屋，然后才摆上菜肴吗？（在圣堂里）这同样的事工是藉着执事（χύρυξ）所献上的祷告来完成的，我们借此祷告，如同用海绵般洁净圣堂，以便在洁净的圣堂中献上圣祭，使这里没有一丝斑点，没有一粒尘埃。而实际上，在圣堂里确实有些人，他们的眼睛不配看见（在此呈现在眼前的），他们的耳朵不配听闻（在此宣扬的）。「若有牲畜触碰这山，必用石头打死它，」上主（曾一度）说（出埃及记 19:13）。（以色列人）甚至不蒙准许登上（那座山），尽管后来他们登了上去，看见上主所在之处；他们后来被允许前来观看。当（上帝）在此显现时，你也当退去；你在此处比慕道者更不被允许。毕竟，从未领受圣事，与蒙准领受圣事后却又轻忽、冒犯圣事并使自己不配领受，是截然不同的两回事。本可说更多更可畏之事；然而，为免加重你们心神的负担，这些就已足够。若这些无法使你们醒悟，那么更多的言辞（也无济于事）。
  - type: paragraph
    text:
      ru: 'Итак, чтобы не постигло вас большее осуждение, умоляю вас не о том, чтобы вы не приходили сюда, – нет, – но о том, чтобы вы вели себя так, чтобы быть достойными входить сюда и присутствовать здесь. Если бы какой-нибудь царь приказал следующее: кто сделает то или другое, тот не будет удостоен моей трапезы, то, – скажи мне, – ради этого не сделали ли бы вы тогда всего? (Бог же) призвал нас на небеса, к трапезе Царя великого и дивного, – а мы отказываемся, медлим, не спешим воспользоваться этим призывом? Какая после этого у нас надежда на спасение? Нельзя в этом обвинять немощь, – нельзя обвинять природу. Беспечность – вот что делает нас недостойными, как это и было сказано нами. Умиляющий сердца и подающий дух умиления пусть умилит и ваши сердца и насадит в них глубоко семена (благочестия), чтобы вам принять их в душу свою со страхом, возродить в себе дух спасения и иметь дерзновение приступать (к таинству причащения).«Сыновья твои, – сказано, –как масличные ветви, вокруг трапезы твоей»(Пс. 127:3). Пусть не будет в нас ничего ветхого, ничего дикого и грубого, ничего недозрелого! Такие только новонасаждения способны дать плод, плод дивный, разумею – масличный, и могут присутствовать окрест трапезы, и притом не просто и не как попало собираться сюда, но со страхом и трепетом. Тогда и там мы будем взирать на самого Христа с дерзновением, и удостоимся небесного царствия, которое и да получим все мы благодатью и человеколюбием Господа нашего Иисуса Христа, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.'
      cn: '因此，为了不让更大的定罪临到你们，我恳求你们，并非是不要你们到这里来——不，并非如此——而是要你们行事为人，配得上进入这里并在此在场。如果某位君王下令说：凡做这事或那事的人，就不配享用我的筵席，那么——请告诉我——你们岂不为此而竭尽全力吗？（而）上帝却召叫我们到天上来，到伟大而奇妙的君王的筵席前——我们却拒绝、迟延，不急于响应这召叫？此后我们还有什么得救的盼望呢？不能将此归咎于软弱，也不能归咎于本性。疏忽懈怠——正是这使得我们不配，正如我们所说的。愿那感动人心并赐予痛悔之灵的（主），也感动你们的心，将（敬虔的）种子深深地栽植在其中，使你们以敬畏之心将它们领受在你们的灵魂里，在自己里面重燃救恩之灵，并有坦然无惧的心领受（圣餐奥迹）。


        「你的众子，」经上说，「如同橄榄枝，环绕你的筵席」（诗篇 127:3）。愿我们里面没有任何陈旧的、任何野蛮粗陋的、任何不成熟的事物！唯有这样的新栽之物才能结出果实，结出奇妙的果实，我指的是橄榄果，并能围绕着筵席在场，而且并非随意或草率地聚集于此，而是要怀着恐惧和战兢。那时，在那里，我们也将带着坦然无惧的心仰望基督本身，并蒙受天国，愿我们所有人都借着我们主耶稣基督的恩典和仁爱获得天国，祂与圣父、圣灵同受荣耀、权能、尊贵，从今时直到永远，世世代代。阿们。'
