      cn: '1.'
    text:
      ru: 'Снова (апостол) искореняет горечь, снова отсекает повод к гневу. Что в самом деле говорит он?«Смотрите, поступайте осторожно». Он знал Учителя своего, что Он, посылая учеников, как овец среди волков, заповедовал им еще быть подобными голубям.«Будьте... просты, – говорит, –как голуби»(Мф.10:16). Так как, с одной стороны, (христиане) были среди волков, а с другой – были наставлены не мстить за себя, но переносить обиды, то поэтому они и нуждались в подобном наставлении. И прежнего уже достаточно было к тому, чтобы сделать их мужественнее; а когда к двум сделано прибавление, то пойми, что (наставление дано) уже чрезмерное. Смотри же, с каким тщанием он их предостерегает, говоря:«смотрите, поступайте осторожно». Целые города вели войну против них (апостолов); эта война перешла и в дома. Отец вооружался на сына, сын на отца, мать на дочь, дочь на мать. Что же? Откуда эти разделения? Они слышали, что Христос говорил:«Кто любит отца или мать более, нежели Меня, не достоин Меня»(Мф.10:37). Итак, чтобы не подумали, что Он напрасно вводит войны и распри, так как могла произойти великая вражда, если бы они и сами вздумали вооружаться, для этого (апостол) и говорит:«смотрите, поступайте осторожно», т. е. исключая проповеди, ничем другим не давайте себе повода к вражде против вас, – одна она пусть будет основанием вражды. Пусть никто не обвиняет вас в чем-нибудь другом, оказывайте почтение и всякое повиновение, если ничто не вредит проповеди, если ничто не препятствует благочестию, – потому что«Итак отдавайте, – сказано, –всякому должное: кому подать, подать; кому оброк, оброк; кому страх, страх; кому честь, честь»(Рим. 13:7). А когда увидят вас покорными другим, то сами устыдятся.«не как неразумные, но как мудрые, дорожа временем». Увещевает так, желая не того, чтобы мы были изворотливыми и ловкими, но слова его означают следующее: время не ваше; ныне вы странники и пришельцы, чужеземцы и посторонние; не ищите почестей, не ищите славы, не ищите могущества, не будьте и мстительны; все переносите, и этим искупайте время; много платите, все, чего бы от вас ни захотели. Это сказано темно: попытаюсь уяснить примером. Представим, что кто-нибудь имеет великолепный дом, потом, что некоторые приходят, чтоб его разорить, и он много им раздает и тем избавляет себя: тогда говорим, что он искупил себя. Подобным образом и у тебя великий дом и истинная вера; приходят, чтобы взять все; отдай же все, кто бы что от тебя ни потребовал, только, главное, спаси веру.«Потому что, – говорит, –дни лукавы».'
      cn: '使徒再次根除苦毒，再次斩断忿怒的缘由。他究竟说了什么？「你们要谨慎行事。」他认识祂的导师，知道祂差遣门徒，如同羊进入狼群，又吩咐他们要像鸽子一样。「你们要……纯全，」他说，「如同鸽子」（马太福音 10:16）。


        一方面，基督徒身处狼群之中；另一方面，他们受教不要为自己报仇，乃要忍受凌辱，因此他们也需要这样的教导。旧有的教导已然足够使他们更加勇敢；当在此二者之上再加添时，就当明白，这教导已是超越寻常的了。看，他是何等谨慎地警诫他们，说：「你们要谨慎行事。」整个城邑都与他们（使徒）为敌；这场战争甚至蔓延到家庭之中。父亲起来攻击儿子，儿子攻击父亲，母亲攻击女儿，女儿攻击母亲。这是怎么回事？这些分裂从何而来？他们曾听基督说：「爱父母过于爱我的，不配得我」（马太福音 10:37）。因此，为了不让人以为祂枉然引致战争与争端，因为如果他们自己也心生武装对抗的念头，便可能爆发巨大的仇恨，为此，使徒才说：「你们要谨慎行事」，即是说，除了宣讲之外，不要因任何其他事情给自己制造仇敌——惟愿宣讲本身成为仇恨的缘由。愿无人因任何其他事情指责你们，要表示尊敬和一切顺从，如果没有任何事妨碍宣讲，如果没有任何事阻碍虔敬——因为所说的：「所以，你们要将应得的归给众人：当得税的，给他纳税；当得贡的，给他上贡；当惧怕的，惧怕他；当尊敬的，尊敬他」（罗马书 13:7）。当他们看到你们顺服他人时，他们自己就会感到羞愧。「不要像愚昧人，倒要像智慧人，要爱惜光阴。」


        他这样劝诫，并非是希望我们变得狡猾诡诈，而是他的话语意指：现在不是你们的时代；如今你们是客旅和寄居的，是异乡人与外邦人；不要寻求尊荣，不要寻求荣耀，不要寻求权势，也不要怀恨报复；忍受一切，并以此赎回光阴；要付出许多，凡是他们向你们所要求的，都要付出。这话说得隐晦：我将尝试用一个例子来阐明。设想某人拥有一座华丽的宅邸，然后，有些人前来企图毁坏它，于是他慷慨地分发给他们许多，从而解救了自己：那时我们说，他救赎了自己。同样地，你也有宏伟的家园和真实的信仰；他们前来，企图夺走一切；那么，凡是向你索求的，尽管都给他们，惟独最重要的是要保全信仰。「因为，」他说，「日子邪恶。」'
