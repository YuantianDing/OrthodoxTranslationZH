      ru: 'Почему же здесь не было того, что было с Павлом и Силою? Потому что их намеревались разрешить от уз, – поэтому Бог и не восхотел освободить их так же, как Петра. Что же касается блаженного Петра, то ему назначена была смертная казнь. Что же, говорят, не большее ли было бы чудо, если бы он, взятый из темницы и преданный в руки царя, здесь без всякого вреда был избавлен от великих опасностей? В таком случае не погибли бы и воины. Здесь много непонятного. Каким образом, говорят, Бог спас Своего раба с наказанием и погибелью других? Что же нам отвечать на это? Во-первых, что (Бог) не желал погибели других; во-вторых, что это (гибель их) произошла не от того, что так было предопределено, а от жестокости судьи. Как? Бог расположил обстоятельства так, чтобы не только не погибли стражи, но и Петр спасся, – что видим мы и здесь в отношении к темничному стражу; но судья не воспользовался обстоятельствами, как следует.«По наступлении дня, – сказано, –между воинами сделалась большая тревога о том, что сделалось с Петром»(Деян. 12:18). Что же потом? Ирод делает исследование о случившемся и, допросивши стражей,«велел казнить их»(Деян. 12:19). Если бы он не допросил их, то имел бы некоторое извинение. Теперь же он потребовал их к суду, допросил, узнал, что (Петр) был в узах, что темница была крепка, что стражи стояли у дверей, стена не проломлена, дверь не отворена, и нет никакого другого признака злодеяния. После этого ему ничего более не оставалось, как удивляться силе Божьей, которая похитила (Петра) из среды этих опасностей, и поклоняться Тому, Кто мог совершить такое дело. Он же«велел казнить их». Как же после этого винить Бога? Если бы Он расторг стены и таким образом освободил (апостола), то можно было бы почесть это делом их небрежности. Если же, по устроению (Божьему), в случившемся было видно не человеческое злодеяние, а божественное чудотворение, то для чего он (судья) поступил так? Если бы (Петр) хотел убежать, то убежал бы, как был, – в оковах. Если бы хотел бежать от страха, то не показал бы такой предусмотрительности, не взял бы сандалий, а оставил их. В настоящем же случай и ангел говорит ему:"обуйся", чтобы было известно, что, не как задумавший убежать, а очень спокойно он поступил здесь. Находясь в узах и между двумя воинами, он не имел бы столько досуга, чтобы разрешить узы, и будучи при том во внутреннем отделении темницы. Таким образом, стражи наказаны по несправедливости судьи. Почему этого не сделали иудеи? Здесь я припоминаю другую темницу, – первую в Риме, вторую в Кесарии, настоящая же была в Иерусалиме. Почему архиереи и фарисеи, когда услышали от посланных ими в темницу, чтобы вывести из нее Петра, что«не нашли их в темнице», но что двери заперты, и стражи стоят перед дверьми – не умертвили стражей, а«недоумевали, что бы это значило»(Деян. 5:24)? Если они, при всем желании умертвить их, не додумались ни до чего такого, то тем более должен был бы так поступить ты, – ты, который все делаешь в угоду им (фарисеям и книжникам). За это скоро и постигло его (судью) наказание. Если ты после того порицаешь (Бога), то порицай Его и за убийства на дорогах, за тысячи других несправедливых лишений жизни, и даже за детей, избитых ради Христа. Ведь и в их избиении, по твоим словам, должен быть виновен Христос. Но, на самом деле, (виною их смерти был) не Христос, а скорее безумие и жестокость Иродова отца. Если ты скажешь: почему же (Бог) не исхитил его из рук Ирода? – то и это Он мог сделать, но не было бы от того никакой пользы. Сколько раз и Христос уходил от их рук? Но принесло ли это какую-нибудь пользу неблагодарным? А здесь от совершившегося происходит большая польза верным. Когда при существовании памятников о каком-нибудь событии, оно подтверждается и врагами, тогда свидетельство не подлежит никакому сомнению. И вот как там, так и здесь уста врагов заграждены ничем иным, как рассказом пришельцев о случившемся. Почему же темничный страж не сделал ничего такого, между тем как виденное им ничем не меньше того, что видел Ирод? Если обращать внимание на поразительность случившегося, то узнать, что узник вышел, когда двери были заперты, нисколько не меньше, чем видеть отворенные двери. Последнее скорее может показаться видением, а первое – нет, если о нем точно будет рассказано. Поэтому и он (страж), если бы был злой, убил бы Павла, как Ирод – воинов. Но он не был таков. Если бы мы захотели опровергнуть и тех, которые говорят: зачем Бог дозволил избить детей? – то наше к вам слово вышло бы из пределов, назначенных ему сначала. Теперь, воздавши великую благодарность узам Павловым за то, что они были для нас причиной стольких благ, в заключение нашего слова, просим вас не только не скорбеть, если кому придется потерпеть за Христа, но и радоваться, подобно апостолам, и хвалиться, подобно Павлу:«И потому я гораздо охотнее, – говорил он, –буду хвалиться своими немощами». За это и сказано было ему:«довольно для тебя благодати Моей»(2Кор. 12:9). Павел хвалится узами, – а ты превозносишься своим богатством? Апостолы радовались тому, что сподобились принять раны, – а ты ищешь неги и роскоши? Как же ты хочешь получить одинаковые с ними (блага), когда идешь совсем иным с ними путем?«И вот, ныне, – говорит (апостол), –я, по влечению Духа, иду в Иерусалим, не зная, что там встретится со мною; только Дух Святый по всем городам свидетельствует, говоря, что узы и скорби ждут меня»(Деян. 20:22–23).  Для чего же идёшь, если тебя ожидают yзы и скорби? Именно для того, говорит, чтобы быть связанным за Христа, чтобы умереть за Него. Я готов принять не только узы, но и смерть за имя Господа нашего Иисуса Христа.'
      cn: '为何这里没有像保罗和西拉那样的事呢？因为他们原打算要被解除捆锁，所以上帝不愿像解救彼得那样解救他们。至于蒙福的彼得，他已被判处死刑。


        于是人们说，难道他若从监狱中被带出，并交在君王手中，在这里毫发无损地脱离了巨大的危险，不是一个更大的神迹吗？这样，士兵们也不会丧命。这里有许多难以理解之处。人们说，上帝如何以惩罚和毁灭他人为代价，来拯救祂的仆人呢？我们当如何回应呢？首先，（上帝）不愿其他人丧命；其次，这（他们的丧命）并非出于预定，而是出于审判官的残忍。怎会如此？上帝安排了这样的境况，不仅守卫们不致丧命，彼得也能获救——我们在监狱的看守身上也看到了这一点；然而审判官没有善用这些境况，就像理所当然的那样。「到了天亮，——经文说，——士兵们之间因彼得的遭遇发生了极大的骚乱」（使徒行传 12:18）。那后来呢？希律对所发生的事进行调查，并审问了守卫们，「下令处死他们」（使徒行传 12:19）。如果他没有审问他们，他或许会有些借口。然而他却将他们传唤到法庭，审问他们，得知（彼得）曾被捆锁，监狱坚固，守卫们站在门前，墙壁未被凿穿，门也未被打开，且没有其他任何罪行的迹象。在此之后，他别无他事可做，只能惊叹于上帝的能力，祂将（彼得）从这些危险中解救出来，并敬拜那位能成就此事的上帝。他却「下令处死他们」。


        既然如此，又怎能归咎于上帝呢？如果祂冲破墙壁，从而解救了（使徒），那或许可以被视为他们的疏忽。然而，既然按照（上帝的）安排，所发生的事明显不是人类的恶行，而是神圣的奇迹，那么他（审判官）为何要那样做呢？如果（彼得）想逃跑，他就会就这样带着镣铐逃走。如果他想因恐惧而逃跑，他就不会表现出如此的深思熟虑，不会拿起凉鞋，而是会把它们留下。然而在此情形中，天使甚至对他说：「穿上你的鞋」，好让人们知道，他在这里的表现并非像一个打算逃跑的人，而是非常平静。他处于捆锁之中，在两名士兵之间，他没有足够的时间来解除捆锁，况且他还身处监狱的内室。因此，守卫们是因审判官的不公而受罚。


        为何犹太人没有这样做呢？这里我回想起另一座监狱——第一座在罗马，第二座在凯撒利亚，而现在这座在耶路撒冷。为何当祭司长和法利赛人从他们派到监狱去把彼得带出来的人那里听说「没有在监狱里找到他们」，却发现门已上锁，守卫们站在门前时——他们没有处死守卫们，反倒「疑惑这会是什么意思」（使徒行传 5:24）？如果他们，尽管极力想要处死他们，却未曾想到要这样做，那么你，你所做的一切都是为了取悦他们（法利赛人和文士），就更应该这样做才是。为此，惩罚很快就降临到他（审判官）身上。


        如果你在此之后斥责（上帝），那么你也当为道路上的杀戮、为其他数千起不公正的夺去生命之事，甚至为那些为基督而被杀害的婴孩而斥责祂。因为照你所说，即使是他们的被杀，基督也应该有罪。但实际上，（他们死亡的原因是）并非基督，而更是希律王的父亲的疯狂与残忍。如果你要问：为何（上帝）没有将他从希律手中解救出来呢？——那祂本也可以这样做，但那不会有任何益处。基督多少次从他们手中脱身呢？但这给那些忘恩负义的人带来了任何益处吗？然而在此，所发生的事给信徒带来了巨大的益处。当某个事件的记载存在，并且也得到敌人的证实时，那么见证便毫无疑问。就这样，无论是在那里，还是在这里，敌人的口都被堵住，唯有借着那些前来之人的叙述，关于所发生的事。为何监狱看守没有做出那样的事呢，尽管他所见的，与希律所见的同样令人震惊？如果关注所发生事件的惊人之处，那么得知囚犯在门上锁的情况下离开，这绝不比看到门被打开更不惊人。后者更像是幻象，而前者——如果准确地被讲述——则不是。因此，他（看守）如果他是邪恶的，他就会像希律杀害士兵那样杀害保罗。但他并非那样的人。


        如果我们想要驳斥那些说「上帝为何允许杀害婴孩？」的人，那么我们对你们所说的话就会超出最初设定的界限。现在，在我们言语的结尾，我们对保罗的捆锁献上巨大的感谢，因为它们为我们带来了如此多的益处，我们请求你们，若有人为基督受苦，不仅不要悲伤，反而要像使徒们一样欢喜，像保罗一样夸口：「因此，我更乐意，——他说，——夸耀我的软弱。」 为此，也对他说：「我的恩典足够你用了」（哥林多后书 12:9）。保罗夸耀捆锁，而你却以自己的财富自夸？使徒们为配得受鞭打而欢喜，而你却追求安逸奢华？你怎能指望得到与他们相同的（益处），当你走的是一条与他们截然不同的道路呢？


        「看哪，现在，——（使徒）说，——我凭着圣灵的催促，往耶路撒冷去，不知道在那里会遭遇什么事；只知道圣灵在各城里向我作证，说捆锁和患难在等待着我」（使徒行传 20:22-23）。既然捆锁和患难在等待着你，你为何还要去呢？他说，正是为了被基督捆绑，为了祂而死。我乐意不仅为我们主耶稣基督的名忍受捆锁，甚至忍受死亡。'
  - type: paragraph
    text:
      ru: Нет ничего блаженнее этой души! Чем он хвалится? Узами, скорбями, цепями, ранами."Я, – говорит, –ношу язвы Господа Иисуса, как какой великий трофей,на теле моем»(Гал. 6:17); и еще:«ибо за надежду Израилеву, – говорит, –обложен я этими узами»(Деян. 28:20); еще:«для которого я исполняю посольство в узах»(Еф.6:20). Что же это значит? Как тебе не стыдно? Как ты не боялся, – после того, как претерпел узы, – обходить вселенную? Как не боялся того, что кто-нибудь назовет бессильным твоего Бога? Что поэтому иные не захотят иметь с тобою общения? Не таковы, отвечает он, мои узы. Они могут блистать даже в царских чертогах.«Так что узы мои, – говорит, –о Христе сделались известными всей претории и всем прочим, и большая часть из братьев в Господе, ободрившись узами моими, начали с большей смелостью, безбоязненно проповедывать слово Божие»(Фил. 1:13–14). Видишь ли, что узы имеют более силы, чем воскресение мертвых? Они видели (апостола) в узах и получили еще более дерзновения. Ведь где узы, там должно совершиться нечто великое. Где скорбь, там непременно и спасение, там непременно успокоениe, там наверное и великие дела. Так дьявол, когда хочет нанести удар, сам бывает поражен; когда связывает рабов Божьих, тогда еще более распространяется слово (Божье). И смотри, – это везде так бывает. Он был в узах, и вот что сделал в темнице:"всамыхузах, – говорит, –моих"(Фил. 1:7). Был скован в Риме, и там весьма многих обратил к вере. Это оттого, что не только сам он имел дерзновение, но и многие другие получали дерзновение через него. Он был в узах в Иерусалиме, и проповедь узника изумила царя и привела в страх начальника. Устрашившись же, сказано, отпустил его, и связавший не устыдился принять от связанного учение о грядущем. В узах он совершал плавание, не погиб во время кораблекрушения и укротил бурю. Когда он был в узах, его коснулось ядовитое животное и, не причинив ему никакого вреда, отстало от него. Он был узником в Риме и, проповедуя в узах, привлек к себе тысячи, вместо всего предлагая (своим слушателям) это самое, т. е. узы.
      cn: 没有比这灵魂更蒙福的了！他夸耀什么呢？是镣铐、苦难、锁链、伤痕。他说：「我身上带着主耶稣的伤痕，如同巨大的战利品一般。」(加拉太书 6:17)又说：「我因以色列的指望，被这些锁链捆绑。」(使徒行传 28:20)又说：「我为这福音作了带锁链的使者。」(以弗所书 6:20)这究竟意味着什么呢？你岂不羞愧吗？你怎能不怕呢——在忍受了镣铐之后，仍周游世界？你怎能不怕有人称你的上帝是无能的呢？因此，有些人会不愿与你相交呢？他回答说，我的镣铐并非如此。它们甚至能在君王的宫殿中闪耀。他说：「以致我的镣铐在基督里已传遍了整个御营和所有其他人；并且，在主里的大多数弟兄，因我的镣铐得了勇气，便越发放胆，无所畏惧地宣讲上帝的圣言。」(腓立比书 1:13-14)你看，镣铐竟比使死人复活更有能力吗？他们看到（使徒）身陷镣铐之中，反而获得了更大的胆量。因为哪里有镣铐，哪里就必有伟大的事发生。哪里有苦难，哪里就必然有救恩，必然有安宁，必然有伟大的作为。因此，魔鬼想施加打击时，反被自己所伤；当它捆绑上帝的仆人时，上帝的圣言反而传播得更广。你看，这在各地都是如此。他身陷镣铐，而在监狱中他做了这些事：「在我的镣铐中，」他说。(腓立比书 1:7)他在罗马被捆绑，却在那里使极多的人归信。这是因为他不仅自己有胆量，而且许多其他人也因他而获得了胆量。他在耶路撒冷身陷镣铐，而这囚犯的宣讲使君王惊奇，并使总督心生惧怕。经上说，总督因惧怕而释放了他，捆绑者竟不以从被捆绑者那里领受关于未来的教导为耻。在镣铐中，他航行，在海难中没有丧命，并平息了风暴。当他身陷镣铐时，一只毒物触碰了他，却没有对他造成任何伤害，便离开了。他在罗马是一名囚犯，在镣铐中宣讲，吸引了成千上万的人，他所提供给（听众）的一切，就是这镣铐本身。
  - type: paragraph
    text:
      ru: 'Ныне нет случаев быть заключенным в оковы, но есть другого рода оковы, если того желаем. Какие же? Это – сдерживать руки, чтобы не быть склонным к любостяжанию. Свяжем себя этими оковами. Вместо железа пусть послужит нам страх Божий. Разрешим связанных бедностью и скорбью. Не одно и то же – отворить двери темницы и дать свободу душе человека, стесненного нуждой. Не одно и то же – разрешить оковы узников и«отпустить измученных на свободу»(Лк. 4:18). Последнее больше первого, потому что за то нет награды, а за это – бесчисленные. Длинны были Павловы оковы и долго задержали нас. И на самом деле они длинны, и прекраснее всякой золотой цепи. Эти оковы, наподобие какой-то машины, влекут узников своих на небо, и как бы какая золотая цепь, простирающаяся (до неба), увлекают на небо. И удивительно то, что, связывая узников долу, они влекут их горе. Не таково, впрочем, их естественное свойство. Потому, если Бог устраивает так, (как мы видели теперь), то здесь не на естественное свойство и порядок вещей обращай внимание, а на то, что выше и того и другого. Научимся же отсюда в скорбях не падать духом и не печалиться. Посмотри, в самом деле, на этого блаженного. Он потерпел удары, и удары сильные:"дав им, – сказано, –много ударов»(Деян. 16:23). Он был заключен в узы, и в узы крепкие: (страж)"ввергнулегово внутреннюю темницу»(Деян. 16:24), и в темницу весьма прочную. Однако и в таких обстоятельствах, в полночь, – когда, под влиянием сна, этих сильнейших уз, спят даже те, которых усиленно будят, – они (Павел и Сила) пели и хвалили Господа. Что может быть тверже этих душ? Они знали, что и отроки пели в огне и в пещи. Быть может, они (Павел и Сила) думали: мы еще не потерпели ничего такого. Но слово, правильно развиваясь, привело нас еще и к другим узам, в другую темницу.'
      cn: '现今没有机会被镣铐捆绑，但如果我们愿意，却有另一种镣铐。是何种呢？那就是约束我们的手，使其不倾向于贪恋财物。让我们用这些镣铐捆绑自己。愿敬畏上帝成为我们的锁链，代替铁链。让我们释放那些被贫困与忧伤捆绑的人。打开牢狱的门，与给予被贫乏所困扰之人的灵魂自由，并非同一回事。解开囚犯的镣铐，与『使受压制者得自由』（路加福音 4:18），并非同一回事。后者比前者更为重要，因为前者没有赏赐，而后者却有无数的赏赐。


        保罗的镣铐是漫长的，并长久地拘留了我们。它们确实漫长，并且比任何金链都更美好。这些镣铐，如同某种机器，将自己的囚犯牵引向天堂；并且如同某种伸展（至天堂）的金链，将人引向上天。令人惊奇的是，它们在下方捆绑着囚犯，却将他们牵引向上。然而，这不是它们的自然属性。因此，如果上帝如此安排（正如我们现在所见的），那么在此处，就不要关注事物的自然属性和秩序，而是要关注那超越这两者的一切。那么让我们由此学会，在忧患中不要气馁，也不要忧愁。


        请看，确实如此，这位蒙福者。他遭受了击打，并且是沉重的击打：『他们施以多次重击』（使徒行传 16:23）。他被囚禁于锁链之中，并且是坚固的锁链：（狱卒）『将他投入内监』（使徒行传 16:24），并且是极其坚固的监牢。然而，在这样的境况下，在午夜时分——当时，即使那些被极力唤醒的人，也在睡眠——这种最强烈的束缚——的影响下睡着了——他们（保罗和西拉）却歌唱赞美主。有什么能比这些灵魂更坚定呢？他们知道，即便是少年们也在火中和火炉中歌唱。或许他们（保罗和西拉）想道：我们尚未遭受如此的苦难。但话语，正确地展开着，将我们带到了其他锁链之中，另一个监牢里。'
  - type: paragraph
    text:
      ru: Что же делать? И хотелось бы умолкнуть, но не могу. Я нашел другую темницу, которая более удивляет и изумляет, чем эта. А вы воспряньте, как бы теперь только начиналось слово, и приникните к нему с оживленным вниманием. Хочу прервать слово, но не удается. Как пьющий человек не отрывается от чаши, что бы ему ни говорили, так и я, взявшись за чудную темничную чашу узников Христовых, не могу перестать, не могу умолкнуть. Если в самом деле он и в темнице, и ночью, и в ранах не молчал, – умолкну ли я, сидя днем, пользуясь для собеседования полным спокойствием, – умолкну ли, когда не дозволили себе молчать находившиеся в узах, битые палками, в полночь?
      cn: 该怎么办呢？我本愿噤声，却无法做到。我找到了另一座牢狱，比这处更加令人惊奇和惊叹。而你们，请振作起来，仿佛言语现在才刚刚开始一般，并以鲜活的专注投入其中。我想要中断言语，却无法做到。如同饮者不肯离杯，无论他人对他说什么，我也一样，既然握住了基督囚徒们奇妙的牢狱之杯，就无法停止，无法噤声。如果他确实身陷牢狱、身处黑夜、身带伤痕却仍未沉默——我岂能白昼安坐，尽享对话的完全平静而沉默呢？我岂能，当那些身系桎梏、被棍棒殴打之人，在午夜时分都不允许自己沉默时，而沉默呢？
  - type: paragraph
    text:
      ru: 'Отроки не молчали в пещи и в огне: не стыдно ли будет нам молчать? Итак, посмотрим и эту темницу. И здесь были заключены в узы, но тотчас в самом начале oказалось, что они должны не сгореть, а как бы войти в темницу. Для чего (иначе) ты и связываешь тех, которые должны быть сожжены? Они были связаны, как Павел, и по рукам и по ногам, связаны с такой же жестокостью; и он (Навуходоносор) вверг их во внутреннюю темницу и потом повелел сильно разжечь печь. Но посмотрим на последовавшее за тем. Когда пели те (Павел и Сила), поколебалась темница и отворились двери. Когда пели и эти (отроки), оковы спали с их рук и ног, отворилась темница, и открылись отверстия печи, – потому что шумно врывалась роса духа (Дан. 3:19–93). Но мне представляется такое множество предметов, что я не знаю, о чем говорить прежде, о чем – после: потому прошу не требовать от меня порядка. И в том и другом событии много сродного между собою. Те, которые были вместе с ними (Павлом и Силою) в узах, освободились от уз и, однако, спали. Здесь же вместо этого было нечто другое: сгорели ввергнувшие их в печь. Но я хотел сказать, что царь увидел их свободными от уз и поклонился им (Дан. 3:95); услышал их пение, увидел четырех ходящих и позвал их. Итак, подобно Павлу, который мог, но не вышел из темницы, пока не позвал и не вывел его тот, кто заключил в нее, и три отрока не вышли, пока царь не повелел им выйти. Чему же мы научаемся отсюда? Не спешить на страдания, не торопиться принимать скорби и не оставаться в них; когда нас освобождают от них. Царь поклонился им; мог бы и войти туда, где были святые, но, подошедши к отверстию, остановился: он не осмелился войти внутрь темницы, в которой приготовил для них сожжение. И замечай слова. Тот сказал: «Господи,что мне делать, чтобы спастись?»Этот, хотя не с таким смиренномудрием, однако сказал не менее приятные слова:«Седрах, Мисах и Авденаго, рабы Бога Всевышнего! выйдите и подойдите!». Великая честь!«Рабы Бога Всевышнего! выйдите и подойдите!»(Дан. 3:93). Как они выйдут, царь, когда ты бросил их связанными в огонь, когда они уже столько времени находятся в огне? Даже если бы они были адамантовыми, если бы состояли из металла, и тогда не погибли ли бы в продолжение того времени, как пели весь свой гимн? Но потому они и спаслись, что пели. Огонь убоялся их радости, убоялся и их удивительной песни, их гимна. Как же ты зовешь их? «Я предварительно сказал:«рабы Бога Всевышнего!», потому что рабам Божьим все возможно. Если бывают и у людей такие слуги, которые в делах своих господ не меньше имеют силы и власти, не меньше распоряжаются, чем сами господа, то тем более это возможно для рабов Божьих». Это – приятнейшие для них слова. Царь знал, что этими словами он доставит им особенное удовольствие. В самом деле, если они пошли в огонь для того, чтобы остаться рабами Божьими, то для них никакие другие слова не были приятнее этих. Если бы он назвал их царями, владыками вселенной, то не обрадовал бы так, как обрадовал, сказавши:«выйдите и подойдите». И что удивительного? Павел, когда писал к великому городу, владевшему вселенной, и гордившемуся своими достоинствами, противопоставил это (достоинство раба Божия), как равное его достоинству, даже как много, несравненно большее и консульства, и царства, и владычества над вселенной: он написал:«Павел, раб Иисуса Христа»(Рим. 1:1).«Рабы Бога Всевышнего!». Если они, говорит (царь), столько стараются о том, чтобы быть рабами, то убедим их в этом вполне. Теперь посмотри на благодушие отроков. Они не вознегодовали, не прогневались, не противоречили, а вышли. Если бы они считали обидой то, что были брошены в печь, то негодовали бы на бросившего. Здесь же мы не видим ничего такого: они вышли (из печи) так, как бы сходили с самого неба. Не погрешит тот, кто сказал бы о них то же, что сказал пророк о солнце:«выходит, как жених из брачного чертога своего»(Пс. 18:6). Почему? Потому, что они исходили тогда с большей славой, чем исходит солнце. Солнце является для озарения земли чувственным светом, а они освещают ее иначе, т. е. духовно. Ради их царь тотчас послал предписание в таких словах:«Знамения и чудеса, какие совершил надо мною Всевышний Бог, угодно мне возвестить вам. Как велики ...и как могущественны!»(Дан. 3:99–100). Таким образом, они вышли (из огня), распространяя от себя самые светлые лучи, которыми озарились и самые страны, и которые должны были посредством царских указов распространиться везде и рассеять повсюдный мрак.«выйдите и подойдите». Не повелел он погасить пещи, – и такой уверенностью, что они могут не только ходить внутри ее, но и выйти из нее, несмотря на ее жгучий пламень, он сделал им особенную честь.'
      cn: 三少年在火炉和火焰中没有保持沉默：我们若保持沉默，岂不羞愧吗？那么，我们再看看这座监牢吧。这里他们也被捆绑监禁，但立刻，在起初就显明，他们并非是要被烧毁，而是仿佛进入监牢一般。不然，你为何要捆绑那些注定要被烧死的人呢？他们像保罗一样，手脚都被捆绑，以同样的残忍捆绑着；他（尼布甲尼撒）把他们投入内监，然后吩咐把火炉烧得极其炽热。但我们看看接下来发生了什么。当那些人（保罗和西拉）歌唱时，监牢摇动，门也开了。当这些（少年）也歌唱时，他们手脚上的镣铐脱落，监牢敞开，火炉的炉口也开了——因为圣灵的甘露喧哗着涌入（但以理书 3:19-93）。然而，在我面前呈现如此众多的事项，以至于我不知该先讲什么，后讲什么；因此，我请求你们不要要求我有条理。这两个事件之间有许多相似之处。那些与他们（保罗和西拉）一同被捆绑的人，都从捆绑中获得释放，然而他们却都睡着了。而这里，却发生了别的事：把他们投入火炉的人，自己却被烧死了。但我想要说的是，君王看见他们脱离捆绑，并向他们下拜（但以理书 3:95）；听见他们歌唱，看见有四个人在行走，便呼唤他们。因此，如同保罗，他本可以离开监牢，却直到把他囚禁的人呼唤他并带他出去，他才出来；那三少年也没有出来，直到君王吩咐他们出来。我们从中能学到什么呢？不要急于遭受苦难，不要匆忙地接受忧患，也不要在我们从中获得释放时，仍旧停留在其中。君王向他们下拜；他本可以也进入圣徒所在之处，但走近炉口时，他停了下来：他不敢进入那座他为他们预备了焚烧的监牢之内。并且留意这些话语。那位（狱卒）说：『上主，我该做什么才能得救？』这位（君王），虽然没有那样的谦卑，却说了同样令人欣悦的话语：『沙得拉、米煞、亚伯尼歌，至高上帝的仆人哪！出来，到这里来！』何等大的尊荣！『至高上帝的仆人哪！出来，到这里来！』（但以理书 3:93）。君王啊，你把他们捆绑着投入火中，他们已在火中这么长时间了，他们怎能出来呢？即便他们是金刚石造的，即便他们是金属铸成的，那么在他们唱完全部颂歌的这段时间里，难道他们不会毁灭吗？但他们之所以得救，正是因为他们歌唱。火焰惧怕他们的喜乐，惧怕他们奇妙的歌声，他们的颂歌。你如何称呼他们呢？『我事先说过：「至高上帝的仆人哪！」，因为对上帝的仆人而言，凡事都可能。如果世人中就有这样的仆役，在他们主人的事务上，所拥有的权柄和能力，所能支配的，都丝毫不亚于主人自己，那么对上帝的仆人而言，这更是可能的。』这些话语对他们而言，是再欣悦不过的了。君王知道，借着这些话语，他会赐予他们特别的喜悦。事实上，如果他们进入火中，正是为了要继续作上帝的仆人，那么对他们而言，没有任何其他话语能比这些更令他们欣悦了。如果他称他们为君王，为宇宙的统治者，也不会像他说了：『出来，到这里来』那样使他们感到喜悦。这又有什么可奇怪的呢？保罗写信给那统治着全宇宙，并以其尊荣自豪的伟大城市时，他将这（作上帝仆人的尊荣）与之对比，视其与那城市的尊荣等同，甚至远超其执政官、王权，以及对全宇宙的统治：他写道：『耶稣基督的仆人保罗』（罗马书 1:1）。『至高上帝的仆人哪！』（君王）说，如果他们如此努力地要作仆人，那么就让我们完全地确证他们就是如此吧。现在，看看这些少年人的恬淡。他们没有愤恨，没有发怒，没有反驳，而是走了出来。如果他们认为被投入火炉是一种冒犯，他们就会对那投入他们的人感到愤恨。而在这里，我们什么也没有看到：他们（从火炉中）出来，仿佛是从天上降下一般。如果有人对他们说出先知论及太阳的话，那也不会有错：『如同新郎出离洞房』（诗篇 18:6）。为何如此呢？因为他们那时带着比太阳出现时更大的荣耀出来。太阳出现是为了以属世的光照耀大地，而他们则以另一种方式，即属灵的方式照亮大地。为了他们，君王立刻颁布了一道谕令，内容如下：『至高上帝在我身上所行的神迹奇事，我乐意传报给你们。何等伟大……又何等大能！』（但以理书 3:99-100）。就这样，他们（从火中）出来，从自己身上散发出最明亮的光芒，连各地都被这些光芒照亮了，这些光芒必将借着君王的谕旨传遍各地，驱散普世的黑暗。『出来，到这里来。』他没有下令熄灭火炉——他深信他们不仅能在火炉中行走，还能从其中出来，尽管火焰炽烈，他以此给予了他们特别的尊荣。
  - type: paragraph
    text:
      ru: 'Но посмотрим, если угодно, и на слова темничного стража. «Господи,что мне сделать, чтобы спастись?»Что приятнее этих слов? Они заставляют ликовать самих ангелов. Для того, чтобы услышать такие слова, сделался рабом Единородный (Сын) Божий. Эти же слова говорили Петру первые верующие: что нам делать, чтобы спастись? Что же он сказал?"Уверуйтеи креститесь» (Деян. 18:8). Из-за желания спасения и послушания иудеев, Павел охотно низринулся бы и в геенну, чтобы услышать от них такие слова. И смотри: ничего не требует себе, а все предоставляет им. Но посмотрим на последующее. Царь не говорит: да спасусь; но сильнее всяких слов то, что он учит (других). Он тотчас же делается проповедником. Не нуждается в оглашении, как темничный страж. Но что? Прославляет Бога и исповедует Его силу. «Я вполне вижу, что Бог ваш есть Бог богов и Господь господ, – что Он послал ангела своего и извлек вас из пещи». И что далее? Не один страж, но многие оглашаются царским посланием, зная совершившееся. Что царь не мог обманывать, это, конечно, очевидно для всякого. Он не захотел бы засвидетельствовать этого о пленниках и тем унизить образ своих действий. Он не захотел бы принять на себя бесславия за такое безумие, – так что если бы истина не была весьма очевидна, он не написал бы такого указа, тем более, что тут так много было свидетелей. Видите ли, какова сила уз? Какова сила песнопения во время скорби? Они от гонения не предались унынию, не упали духом, но тогда-то особенно и были бодры, тогда-то особенно и благодушествовали. И справедливо так поступали они. Остается еще одно: почему в темнице узники были освобождены, а в пещи сожжены служители казни, тогда как надлежало бы потерпеть это царю? Ведь не столько согрешили те, которые их заключали в оковы и ввергали в пещь, сколько тот, кто приказывал это сделать. Итак, почему же они погибли? Здесь нет надобности говорить много (чтобы объяснить дело). (Погибли) потому, что были нечестивы. Для того это так было устроено, чтобы очевидна была сила огня и большее было чудо. Если в самом деле огонь пожрал с такой силою тех, которые были вне пещи, то как он оставил невредимыми тех, которые находились в самой пещи? (Это произошло так для того) чтобы очевиднее была сила Божья. И пусть никто не удивляется, что я сопоставил царя с темничным стражем: он поступил одинаково с последним. Царь не был славнее стража: оба одинаково получили пользу. Но праведники, как я говорил, тогда-то особенно и бывают бодры духом, когда находятся в скорби, когда бывают в оковах, потому что страдать за Христа – приятнее всякого удовольствия. Хотите ли я напомню вам еще о другой темнице? Нам необходимо от этих уз перейти к другой темнице. К какой же вы хотите? К той ли, в которую заключен был Иеремия? Или к темнице Иосифа? Или – Иоанна? Благодарение узам Павловым: как много они указали нам темниц! Хотите ли слышать о темнице, в которую был заключен Иоанн? И он был некогда в узах за Христа и за Божественный закон. Что же он? Оставался ли в заключении праздным? Не отсюда ли из этого заключения, он послал учеников своих, сказав им: пойдите, скажите Христу:«Ты ли Тот, Который должен придти, или ожидать нам другого?»(Мф.11:3). И находясь там, он поучал других, не был нерадив. А Иеремия, исполняя свой долг, не предрек ли (в темнице) о вавилонском пленении? А Иосиф? Не был ли в заключении тринадцать лет? Однако ж, и тут (в темнице) не забыл о добродетели. Скажем еще об одних узах и окончим наше слово. Был в узах и Владыка наш, разрешивший вселенную от грехов; были связаны руки, сделавшия бесчисленное множество добра: связавше, сказано, –«отвели Его к Каиафе»(Мф.26:57).  Был в узах Тот, Кто совершил столько чудес. Размышляя об этом, не будем никогда скорбеть, но и в узах будем радоваться. Мы, и без оков, все же как бы связаны. Видишь ли, какое благо – узы? Зная все это, вознесем за все благодарение Богу, во Христе Иисусе, Господе нашем.'
      cn: '但若蒙允许，让我们也来看看狱卒所说的话：「上主啊，我当做什么才能得救？」有什么比这些话更令人喜悦的呢？它们令天使们自己也欢欣鼓舞。为了听到这样的话语，上帝的独生子降身为奴。同样的话，最初的信徒也曾对彼得说：「我们当做什么才能得救？」他说了什么呢？「当信并受洗」（使徒行传 18:8）。为了犹太人得救的渴望和他们的顺服，保罗也情愿坠入欣嫩谷（地狱），只为听到他们说出这样的话。看啊：他一无所求于己，而将一切赐予他们。但让我们看看接下来发生的事。君王不说：「愿我得救」；但比任何言语更有力的是，他教导（他人）。他立刻成了一位宣讲者。他不像狱卒那样需要慕道。但如何呢？他颂赞上帝并承认祂的力量。「我完全看见，你们的上帝是万神之神，万主之主——祂差遣了自己的天使，将你们从火窑中救拔出来。」那么接下来呢？不仅是一个狱卒，许多人因着君王的宣告而慕道，因为他们知道所发生的事。君王不可能欺骗，这对于任何人来说，当然都是显而易见的。他不会愿意为那些囚犯作此见证，从而贬低他自己的行事方式。他不会愿意为如此的愚行蒙受羞辱，——所以如果真相不是非常显而易见，他绝不会颁布这样的谕旨，更何况当时有如此多的见证人。你们看到了吗，锁链的力量何其大？患难中歌颂的力量何其大？


        他们没有因迫害而沮丧，没有灰心丧志，而是在那时特别振奋，那时特别心境良好。他们如此行是理所当然的。还剩下一件事：为什么在狱中，囚犯们被释放了，而在火窑里，行刑的仆役却被烧死了，而本应是君王遭受此劫呢？毕竟，那些将他们囚禁在锁链中并投入火窑的人，其罪过不如那个下令如此行的人。那么，他们为何灭亡了呢？这里无需多言（来解释此事）。（他们灭亡）是因为他们是不虔敬的。这样安排是为了让火焰的力量显而易见，并且是一个更大的神迹。如果火焰以如此巨大的力量吞噬了那些在火窑外的人，那么它又是如何让那些在火窑里面的人毫发无损的呢？（之所以如此发生）是为了让上帝的力量更加彰显。


        愿没有人惊讶我将君王与狱卒相提并论：他与后者以同样的方式行事。君王并不比狱卒更有荣耀：他们两人都同样蒙受了益处。然而义人，正如我所说，正是在患难之中，正是在锁链之中，才特别精神抖擞，因为为基督受苦——比任何快乐都更令人喜悦。你们希望我再提醒你们关于另一座监狱吗？我们需要从这些锁链转到另一座监狱。你们想听哪一个呢？是耶利米被囚禁的那座吗？还是约瑟的监狱？抑或是约翰的？感恩保罗的锁链：它们向我们指明了何其多的监狱！你们想听约翰被囚禁的监狱吗？他也曾一度因基督和神圣的律法而被囚。那么他呢？他是否在监禁中无所事事？难道不是从这监禁之中，他差遣他的门徒，告诉他们：「你们去，告诉基督：『祢是那位将要来的，还是我们要等候另一位？』」（马太福音 11:3）？他在那里也教导他人，并没有懈怠。


        那么耶利米呢？他难道不是在狱中履行自己的职责，预言了巴比伦的囚禁吗？那么约瑟呢？他不是被囚禁了十三年吗？然而，即使在这里（在狱中），他也没有忘记美德。让我们再讲一个关于锁链的例子，就结束我们的讲道。我们的主宰也曾被囚，祂是解除了全宇宙罪恶的那一位；祂那行了无数善事的手曾被捆绑：经上说，捆绑了祂，「就把祂带到该亚法那里」（马太福音 26:57）。那位行了如此多神迹的，曾被囚。默想这些，我们永远不要悲伤，即使在锁链中也要喜乐。我们，即使没有锁链，也仿佛被捆绑着。你看到了吗，锁链是何等的美善？知道了这一切，让我们在我们的主耶稣基督里，为一切向着上帝献上感谢。'
