      cn: 当如何理解不洁。– 谁可被视为义人。– 关于将自己献给基督的修士和童贞女。– 妇女的美德和恶习。
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Это сказано не ефесянам только, но теперь говорится также вам, и не нами, но Павлом, или лучше, ни нами, ни Павлом, но благодатью Духа. Итак, нам должно внимать словам этим, как словам Духа. Что же сказано? Послушай:«Посему я говорю и заклинаю Господом, чтобы вы более не поступали, как поступают прочие народы, по суетности ума своего, будучи помрачены в разуме, отчуждены от жизни Божией, по причине их невежества и ожесточения сердца их». Итак, если (такое их состояние было следствием) невежества и окаменения, то за что же обвинять их? Несведущего должно научить тому, чего он не знает, но несправедливо подвергать его упреку и взысканию. Но смотри, как (апостол) тотчас же лишает их такого извинения:"Они, – говорит, –дойдя до бесчувствия, предались распутству так, что делают всякую нечистоту с ненасытимостью. Но вы не так познали Христа»(Еф.4:19–20). Здесь он показывает, что причиной их окаменения была их жизнь; жизнь же их была такой по их собственной беспечности и небрежению."Они, – говорит, –дойдя до бесчувствия, предались распутству». Итак, когда ты услышишь, что«предал их Бог превратному уму»(Рим. 1:28), то припомни и настоящее изречение, что они сами«предались распутству». Как же предал их Бог, когда они сами предали себя? Если же предал их Бог, то как они сами себя предали? Тебе кажется, что здесь есть противоречие? Но слово –"предал"значит здесь – «попустил». Видишь ли, что где нечистая жизнь, там такого же рода придумываются и догматы.«Ибо всякий, делающий злое, – сказано, –ненавидит свет и не идет к свету»(Иоан. 3:20). В самом деле, каким бы образом человек нечистый, валяющийся среди тел всяких женщин, гораздо больше, чем сколько свиньи валяются в грязи, жадный до денег и нисколько не любящий целомудрия, мог решиться на такую (добродетельную) жизнь? У них, говорит (апостол), такой образ действий обратился как бы в правило. От этого-то (и происходит) их окаменение, от этого – помрачение ума. И при сиянии света для нас может быть темно, если наши глаза больны; больными же они бывают от прилива дурных соков и излишнего накопления мокрот. Так и здесь: когда многочисленное стечение житейских дел помрачает ясность нашего ума, мы находимся в темноте. И, подобно тому, как, погрузившись глубоко в воду, мы не можем видеть солнца оттого, что над нами изобильная вода составляет как бы какую стену, – так и в мысленных очах происходит окаменение сердца, когда никакой страх не тревожит души."Нет, – говорит, –страха Божия пред глазами его»(Пс. 35:2). И еще:«Сказал безумец в сердце своем: «нет Бога»(Пс. 13:1). Окаменение происходит не от иного чего, как от бесчувственности; при этом заграждаются поры. Так, когда сгустившиеся мокроты сосредоточатся в одном месте, тот член мертвеет и делается бесчувственным; хотя бы ты стал его жечь или резать, что бы ни делал с ним, он (ничего) не чувствует. Так и они (язычники), после того, как раз навсегда впали в беспечность, что им ни говори, грози им хотя бы огнем или мечем, – на них ничто не подействует, ничто не убедит их. У них раз навсегда омертвел член (сердце). И пока ты не уничтожишь в нем этого бесчувствия, пока твое прикосновение к нему не будет так же ощутительно, как к здоровым членам, до тех пор все твои усилия будут тщетны.«с ненасытимостью», – говорит: этим словом (апостол), преимущественно, устраняет от них возможность оправдания. Ведь им можно было бы, если бы они захотели, не предаваться корыстолюбию, не быть беспечными, не служить чреву и не вести изнеженной жизни; можно было бы пользоваться умеренно и деньгами, и удовольствиями, и отдохновением. Но так как они не соблюдали в этом умеренности, то и испортили все."Делают, – говорит, –всякую нечистоту». Видишь ли, как (апостол) лишает их извинения, сказавши о делании нечистоты? Не по случайному, говорит, увлечению они грешили, но совершали все эти преступные действия, сами заботясь об них.«Делают всякую нечистоту».'
      cn: '这话不仅是对以弗所人说的，如今也是对你们说的，不是由我们，而是由保罗，或者说，不是由我们，也不是由保罗，而是由圣灵的恩典所说。因此，我们应当留心这些话语，将它们视作圣灵的话语。究竟说了什么？请听：

        「所以，我奉主之名，郑重地说并恳请，你们行事为人，不要再像外邦人那样，随从他们心思的虚妄，在悟性上被蒙蔽，与上帝的生命隔绝，这都因着他们无知和心里的刚硬。」

        那么，如果（他们这样的状态是）无知与心硬的后果，又为何要指责他们呢？对于无知的人，应当教导他所不认识的，但不应不公正地加以责备与惩戒。然而，你看（使徒）如何立即剥夺了他们这样的借口：

        「他们既已麻木不仁，就放纵自己，沉溺于淫荡，以至于贪婪地行各样污秽之事。但你们认识基督却不是这样。」(以弗所书 4:19-20)

        在这里他指出，他们心硬的原因是他们的生活；而他们的生活之所以如此，是由于他们自己的漫不经心和疏忽。

        「他们既已麻木不仁，就放纵自己，沉溺于淫荡。」因此，当你听到「上帝任凭他们存邪僻的心」（罗马书 1:28）时，也请记住当前的这句话，即他们自己「沉溺于淫荡」。上帝既然任凭他们，他们又怎会是自己放纵了自己呢？如果上帝任凭了他们，那么他们又怎会是自己放纵了自己呢？你是否觉得这里有矛盾？但「任凭」这个词在这里的意思是「允许/容许」。

        你看到了吗，凡有不洁生活的地方，就会捏造出同样性质的教义。「因为凡作恶的，都恨光，不来就光。」(约翰福音 3:20) 实际上，一个不洁净的人，像猪在泥泞中打滚一样，沉溺于各种女人之中，贪婪金钱，丝毫不爱贞洁，他怎能下决心过那样的（德行的）生活呢？（使徒）说，在他们那里，这样的行为方式仿佛已经变成了一条准则。正因为如此，他们的心才变得刚硬，由此而来的是心智的蒙蔽。

        即使在光芒照耀之下，如果我们的眼睛有病，我们仍可能处于黑暗之中；而眼睛之所以有病，是由于不良体液的涌入和过多痰涎的积聚。在此亦然：当众多世俗事务的汇集蒙蔽了我们心智的清明时，我们便身处黑暗之中。同样，就像我们深潜入水中，因头顶上丰沛的水形成一道墙壁，使我们无法看见太阳一样，同样，在心智的眼中，当灵魂没有任何敬畏不安时，就会发生心硬。

        「他说，在他眼前没有敬畏上帝的心。」(诗篇 35:2) 又说：「愚顽人心里说：『没有上帝』。」(诗篇 13:1)

        心硬并非由别的原因造成，而是源于麻木不仁；在这种情况下，毛孔被堵塞。同样，当浓稠的痰涎聚集在一处时，那个肢体就会坏死并变得麻木不仁；即便你烧灼它或切割它，无论你对它做什么，它（什么）也感觉不到。同样，他们（外邦人）一旦彻底陷入漫不经心之中，无论你对他们说什么，即便用火或刀剑威胁他们，也无济于事，什么都无法说服他们。他们心中的那个肢体（心）已彻底坏死。除非你消除其中这种麻木不仁，除非你触碰它能像触碰健康的肢体一样有所感觉，否则你所有的努力都将是徒劳。

        「以贪婪」，他说：借着这个词，（使徒）主要剥夺了他们为自己辩解的可能性。因为如果他们愿意，本可以不沉溺于贪婪，不漫不经心，不服侍肚腹，也不过奢靡的生活；本可以适度地使用金钱、享受娱乐和休息。但由于他们在这方面没有保持节制，于是就败坏了一切。

        「他们行各样污秽之事。」他说。你看，（使徒）是如何通过提及他们「行污秽之事」来剥夺他们的借口？他说，他们犯罪并非偶然的一时冲动，而是自己刻意为之，去行所有这些罪恶的行为。「他们行各样污秽之事。」'
  - type: paragraph
    text:
      ru: 'Нечистота всякая – это любодеяние, блуд, сладострастная любовь к отрокам, зависть, всякая страсть и невоздержание.«Но вы не так познали Христа; потому что вы слышали о Нем и в Нем научились, – так как истина во Иисусе»(Еф.4:20–21). Выражение:«потому что вы слышали о Нем»– не означает, будто он говорит с сомнением, напротив показывает полную его уверенность: подобным образом он и в другом месте выражается:«Ибо праведно пред Богом – оскорбляющим вас воздать скорбью»(2Фес. 1:6). Т. е., вы не для таких дел познали Христа.«Потому что вы слышали о Нем и в Нем научились, – так как истина во Иисусе, – отложить прежний образ жизни ветхого человека»(Еф.4:21–22). Познание Христа в том и состоит, чтобы вести праведную жизнь. Кто ведет дурную жизнь, тот не знает Бога и Бог его не знает. Послушай, как об этом (апостол) говорит в другом месте:«Они говорят, что знают Бога, а делами отрекаются»(Тит. 1:16).«Так как истина во Иисусе, – отложить прежний образ жизни ветхого человека», – т.е., вы не на таких условиях заключили договор (чтоб оставаться при прежней жизни). То, что мы имеем, не есть суета, но истина; как наши догматы, так и наша жизнь – истинны. Суета – грех и заблуждения, а праведная жизнь – истина. Она и цель имеет высокую, беспорядочная же жизнь приводит к ничтожному концу.«истлевающего, – говорит, –в обольстительных похотях»(Еф.4:22) обольщения его. Как пожелания его истлевают, так и сам он.'
      cn: 各样的不洁——这是淫乱、奸淫、贪恋少年、嫉妒、各样的情欲和不节制。「但你们认识基督，却不是这样；因为你们听过祂，并在祂里面受了教导——正如真理在耶稣里」（以弗所书 4:20-21）。这句话：「因为你们听过祂」——并非暗示他带着疑问来说，反而表明他完全确信。他也在别处以类似的方式表达：「因为在上帝面前，把患难报应那些加患难给你们的人是公义的」（帖撒罗尼迦后书 1:6）。也就是说，你们认识基督，不是为了行这样的事。「因为你们听过祂，并在祂里面受了教导——正如真理在耶稣里——要脱去你们从前行为上的旧人」（以弗所书 4:21-22）。认识基督，正是在于过公义的生活。凡是过着败坏生活的人，他不认识上帝，上帝也不认识他。听啊，使徒在别处是怎样论及此的：「他们声称认识上帝，却在行为上否认祂」（提多书 1:16）。「正如真理在耶稣里——要脱去你们从前行为上的旧人」，——也就是说，你们并不是在这样的条件下立的约（以继续从前的生活）。我们所拥有的，不是虚妄，而是真理；无论是我们的教义，还是我们的生活，都是真实的。虚妄是罪和谬误，而公义的生活则是真理。它也有崇高的目的，而杂乱无章的生活却引向虚无的结局。「渐渐败坏的——他说——在迷惑人的私欲中」（以弗所书 4:22），正是这旧人的迷惑。正如它的欲念渐渐败坏，它自身也如此。
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Каким же образом истлевают его пожелания? Смерть все разрушает. Так пророк говорит:«в тот день исчезают [все] помышления его»(Пс. 145:4). Впрочем, не одна только смерть, много есть и других причин (этого изменения). Так красота изменяется, увядает и пропадает от болезни и с наступлением старости. От тех же (причин) погибает и сила телесная. Чувственные удовольствия в старости уже не так привлекательны. На это мы имеем указание и в примере Верзеллия, – без сомнения, вы знаете эту историю (2Цар. 19:32 – 35). А с другой стороны, похоть растлевает и губит самое существо человека. Как шерсть от чего рождается, от того же и погибает, так точно и ветхий человек. Пагубно для него славолюбие, многих погубили удовольствия, обманула похоть. Впрочем, все это не составляет удовольствия в собственном смысле, но есть горечь, обман, подлог и тень. Наружная сторона этих предметов приманчива, но сами по себе они – не что иное, как тяжелое бремя, влекущее за собою великую нищету, пустоту и бедность. И если ты снимешь с них эту личину, откроешь их настоящее лицо, то увидишь обман. В том ведь и состоит обман, когда что-нибудь показывается нам не тем, что оно есть, но представляется тем, чего в нем нет. Отсюда проистекают и ложные суждения (о том или другом предмете). (Апостол) изображает нам четырех человек и, если хотите, я вам представлю это изображение. В настоящем послании (он изображает) двух, когда говорит:"отложившись...ветхого человека,.. обновитесьдухом ума вашего и облекитесьв нового человека»(Еф.4:22–24); а в послании к Римлянам – других двух, когда говорит:«но в членах моих вижу иной закон, противоборствующий закону ума моего и делающий меня пленником закона греховного, находящегося в членах моих»(Рим. 7:23). Эти последние имеют сродство с теми первыми, именно с внутренним – новый человек, а с внешним – ветхий; но трое из них растлились. Или лучше, и теперь их трое: новый, ветхий и этот существенный (ουσιώδης) или естественный.«Обновиться, – говорит, –духом ума вашего»(Еф.4:23). Чтобы кто не подумал, будто он измышляет иного человека, когда говорит о ветхом и новом человеке, смотри, что он говорит:«обновиться». Обновление происходит тогда, когда обветшавшее молодеет, принимает другой вид, так что предмет остается один и тот же, но происходит перемена в его случайных свойствах. Как тело остается тем же, хотя происходит перемена в случайных его свойствах, так и здесь. Как же должно произойти это обновление?"Духом, – говорит, –ума вашего». Поэтому, кто станет совершать что-либо ветхое, тот не сделает ничего: дух не потерпит ветхих деяний."Духом, – говорит, –ума вашего», т. е.,  духом, который в вашем уме.«И облечься в нового человека». Видишь ли, что предмет один, а одежды две: одна, которая совлекается, и другая, в которую облекаются?"В нового, – говорит, –человека, созданного по Богу, в праведности и святости истины»(Еф.4:24). Почему он представляет человека под именем добродетели, и почему под именем порока? Потому, что нельзя определить (свойство) человека, не указав на его деятельность. Таким образом, (действия человека) не меньше, чем естественные его свойства, показывают, добр он, или не добр. Как легко раздеть человека, так же легко по добродетели или пороку видеть (свойства его). Человек новый (т. е. молодой) силен. Будем же и мы сильны в делании добрых дел. Он не имеет морщин: не будем иметь их и мы. Он не подвержен и нелегко поддается болезням: не будем и мы.«Созданного». Смотри, как он называет здесь осуществление (οΰσίωσιν) добродетели созданием, т. е. приведением из небытия в бытие. Что же? А тот (порок) не есть создание по Богу? Никак, но по дьяволу, который есть виновник греха. Почему? Потому что (новый) человек создан не из воды, не из земли, но в правде и преподобии истины. Что значит это? То, говорит, что (Бог) тотчас же – во время крещения, которое существенно необходимо для нашего возрождения, сделал его Своим сыном. Хорошо сказал (апостол):«в праведности и святости истины». Была некогда правда, было и преподобие у иудеев, но – не истины; то была праведность прообразовательная. Так, телесная чистота была образом чистоты, а не истинной чистотой; был образ праведности, а не истинная праведность.«В праведности, – говорит, –и святости истины». Может быть, это сказано и касательно ложной праведности, потому что многие у неверующих считают себя праведными, но они обманываются.'
      cn: '他的愿望是怎样朽坏的呢？死亡摧毁一切。正如先知所说：「在他死的那一天，他[一切]思想都消灭了」（诗篇 145:4）。然而，不只死亡，还有许多其他的原因（导致这变化）。例如，美貌因疾病和年老而改变、凋谢并消失。身体的力量也因同样的原因而消逝。感官的快乐在老年时已不再那么有吸引力。对此，我们有巴瑟莱的例子作为印证——毫无疑问，你们知道这个故事（撒母耳记下 19:32-35）。


        另一方面，私欲腐蚀并摧毁人的本质。正如羊毛从何而生，也从何而灭，旧人也是如此。贪图荣耀对他有害，许多人被享乐所毁，被私欲所欺骗。然而，所有这些并非严格意义上的快乐，而是一种苦涩、欺骗、伪造和幻影。这些事物的外表诱人，但其本身不过是沉重的负担，带来极大的贫困、空虚和匮乏。倘若你揭下它们的假面，显露它们的真实面貌，你就会看到欺骗。欺骗的本质在于，当某物呈现在我们面前时，它并非其本然，而是呈现出其中所没有的东西。由此也产生了（对某一事物的）虚假判断。


        （使徒）向我们描绘了四种人，如果你们愿意，我将向你们呈现这幅图景。在本封书信中（他描绘了）两种，当他说：「脱去……旧人……要在心志上改换一新，并且穿上新人」（以弗所书 4:22-24）；而在致罗马人的书信中，则描绘了另外两种，当他说：「但我肢体中另有个律，和我心中的律交战，把我掳去，叫我附从那肢体中犯罪的律」（罗马书 7:23）。后两种人与前两种人有亲缘关系，确切地说，内在的与新人相连，外在的与旧人相连；但这四种人中有三种被败坏了。或者更准确地说，现在共有三种：新人、旧人，以及这个本质性的（ουσιώδης）或自然的（人）。


        「要在心志上改换一新」（以弗所书 4:23）。为免有人以为，当使徒谈论旧人和新人时，他是在凭空创造另一个人，请看他说：「改换一新」。更新发生在事物陈旧后变得年轻，呈现出另一种面貌之时，因此本体仍是同一，只是其偶然属性发生了变化。正如身体虽其偶然属性发生变化，但仍是同一个身体，这里也是如此。那么，这更新当如何发生呢？使徒说：「在心志上」。因此，凡行旧事的人，将一事无成：心志不会容忍旧的行为。使徒说：「你们心意中的灵」，意思是，在你们的心意中的灵。「并且穿上新人。」你看到吗？本体是同一个，但有两件衣服：一件是脱去的，另一件是穿上的。使徒说：「穿上新人，这新人是照着上帝的形像造的，有真理的仁义和圣洁」（以弗所书 4:24）。他为何将人描绘为以美德之名，又为何以恶行之名？因为若不指出人的行为，就无法界定人的（本质）。因此，人的行为与他的自然属性一样，都能显示他是否良善。如同轻易剥去一个人的衣裳，也同样轻易地从他的美德或恶行中看出（他的本性）。新人（即年轻之人）是强壮的。愿我们也在行善上刚强。他没有皱纹：愿我们也没有。他不易患病，也不轻易屈服于疾病：愿我们也是如此。


        「造的」。你看，他在此将美德的实现（οΰσίωσιν）称为创造，即从无有带入存有。那么，那（恶行）不是按照上帝的创造吗？绝非如此，而是按照魔鬼，他是罪恶的肇始者。为什么呢？因为（新人）不是从水，也不是从地而造，而是在真理的仁义和圣洁中被造。这是什么意思？使徒说，意思就是（上帝）在洗礼之时——洗礼对我们的重生是本质上必需的——立他为自己的儿子。使徒说得好：「有真理的仁义和圣洁」。犹太人曾一度有仁义，也有圣洁，但那不是真理的；那是一种预表性的仁义。因此，身体的洁净是纯洁的象征，而非真正的洁净；那是公义的象征，而非真正的公义。「在真理的仁义和圣洁中」——使徒说。这或许也指虚假的公义，因为许多不信者自认为公义，但他们是受了欺骗。'
  - type: paragraph
    text:
      ru: 'Праведностью называется добродетель всеобъемлющая. Послушай, что говорит Христос:«если праведность ваша не превзойдет праведности книжников и фарисеев, то вы не войдете в Царство Небесное»(Мф.5:20);  и в другом месте праведным назван тот, кто греха нетворит (1Иоан. 3:9). Так и в судах мы называем правым того, кто терпит обиды, а сам не обижает. О, если бы и нам на страшном суде показаться правыми и получить некоторое снисхождение! Ведь пред Богом невозможно (оказаться совершенно праведным), какие бы мы ни представили оправдания: пред Ним всякая праведность несостоятельна, как и пророк говорил:"и победишь, когда будешьсудить" (Пс. 50:6)[1]. Но если мы не будем нарушать взаимных прав, то будем правы; если сможем доказать, что нам была сделана несправедливость, и в таком случае мы будем правы. Что это значит, что (апостол) говорит им:"облекитесь», когда они уже облеклись? Здесь он говорит о жизни и делах. Тогда они облеклись в крещении, а теперь (апостол повелеваете им облещись) в своей жизни и делах, чтобы уже не жить им больше по влечению обольстительных похотей, но по заповедям Божьим. Но что такое «преподобие»? Что чисто и согласно с требованием долга. Потому-то мы и употребляем это выражение (οσιον) о тех, которые освободились от суда, – т.е., (говорим): я уже больше ничего им не должен, я уже ничему не повинен. Так, у нас в обычае говорить: я отделался (άφωσιωσάμην), и тому подобное, т.е., я больше уже ничего не должен.'
      cn: 义德被称为一种包罗万象的德行。请听基督所言：「你们的义若不胜于经师和法利塞人的义，你们绝进不了天国。」(马太福音 5:20) 又在另一处，凡不犯罪的被称为义人（约翰一书 3:9）。同理，在审判中，我们称那忍受不公却不亏负他人者为正直。哦，若我们也能在末日审判中显得正直，并获得一些宽恕！因为在上帝面前，我们不可能（全然公义），无论我们提出何种辩解：在祂面前，一切的义德都站立不住，正如先知所言：「祢审判的时候，就必得胜。」(诗篇 50:6)[1] 但若我们不侵犯彼此的权利，我们就是正直的；若我们能证明我们曾蒙受不公，在这种情况下，我们也是正直的。这又是什么意思呢，（使徒）对他们说：「穿上」，而他们不是已经穿上了吗？这里，他指的是生命和行为。那时他们是藉着洗礼穿上了，而现在（使徒吩咐他们穿上）是在他们的生命和行为中，好使他们不再依循诱惑性的情欲而活，而是按照上帝的诫命。那么，「敬虔」又是什么呢？它是纯洁且符合责任要求的。正因如此，我们才对那些从审判中解脱出来的人使用这个词（οσιον），亦即（我们说）：我不再欠他们什么了，我已无需承担任何责任了。所以，我们习惯说：「我已履行职责」（άφωσιωσάμην），以及类似的话，也就是说，我不再欠任何东西了。
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Итак, наш долг – не совлекать с себя этой одежды оправдания, которую пророк называет одеждой спасения (Ис. 59:17), чтобы нам сделаться подобными Богу, Который облекся в правду. Облечемся же в эту одежду. А облечься значит не что иное, как то, чтобы уже не совлекаться. Послушай, что говорит пророк:«да облечется проклятием, как ризою, и да войдет оно»в него (Пс. 108:18). И еще:"оденься всвет, каквризу» (Пс. 103:2). И у нас в обычае говорить о людях: такой-то надел на себя (личину) такого-то. Таким образом, (апостол) хочет, чтобы мы не один день, не два, не три, но всегда пребыли в добродетели и никогда не снимали с себя этой одежды. Не так непристойно человеку быть нагим по телу, как быть обнаженным от добродетели. При телесной наготе его непристойное положение видят такие же (как он) рабы, а там – это видит Владыка и ангелы. Скажи мне, если бы ты увидел кого-нибудь идущего нагим по площади, не оскорбило ли бы это тебя? Что же сказать о тебе, когда ты ходишь без этой одежды? Не видал ли ты тех нищих, которых мы обыкновенно называем флейтщиками, как они расхаживают и возбуждают в нас жалость к себе? Однако ж и они не заслуживают никакого извинения. Мы не прощаем им того, что они проигрывают в кости свои одежды. Как же простит нас Бог, если мы погубим эту одежду? Когда дьявол видит кого-нибудь обнаженным от добродетели, тотчас марает и чернит его лице, наносит ему раны, делает и еще большие насилия. Обнажим себя от денег, чтобы не обнажиться от праведности. Облачение, состоящее в деньгах, повреждает эту одежду (оправдания): это – облачение из терний, и эти терния таковы, что чем больше мы покрываемся ими, тем более совлекаемся (истинной одежды). Чувственные наклонности также лишают нас этой одежды: он огонь, а такой огонь сжигает эту одежду. Богатство также есть моль: как моль поедает все и не щадит даже шелковых одежд, так и богатство. Итак, оставим все это, чтобы нам быть праведными, чтобы облечься в нового человека. Не оставим у себя ничего ветхого, ничего преходящего, ничего тленного. Добродетель не тяжела, не неудобоисполнима.'
      cn: 因此，我们的义务是不要脱去这件称义的衣裳，先知称之为救恩的衣裳（以赛亚书 59:17），好使我们变得像那位以公义为衣的上帝。那么，让我们穿上这件衣裳。而穿上它，无非意味着不再脱去它。听先知所言：「愿咒诅像衣裳披在他身上，愿它进入他内里」（诗篇 108:18）。还有：「祢披上亮光如外袍」（诗篇 103:2）。我们也常说起某人：某某人戴上某某人的面具。如此一来，（使徒）希望我们不是一天、两天、三天，而是永远安住于美德之中，并且永不脱去这件衣裳。一个人身体赤裸，并不像赤裸于美德那样不体面。身体赤裸时，他那不体面的境况，见到的是与他一样的仆役；而赤裸于美德时，见到的是上主和天使们。告诉我，如果你看到某人在广场上赤身裸体行走，这难道不会冒犯你吗？那么，当你没有穿这件衣裳时，又该说什么呢？你难道没有见过那些我们通常称之为吹笛者的乞丐吗，他们四处游荡，激起我们的怜悯？然而，他们也配不上任何原谅。我们不宽恕他们因赌博而输掉衣裳的行为。那么，如果我们毁掉这件衣裳，上帝又怎会宽恕我们呢？当魔鬼看见有人赤裸于美德时，立即玷污并抹黑他的脸，给他造成创伤，并且施加更大的暴力。让我们赤裸于金钱，以免赤裸于公义。金钱所构成的衣裳损害了这件（称义的）衣裳：这是一件荆棘之衣，而这些荆棘是如此，以至于我们越是被它们覆盖，就越是脱去（真正的衣裳）。感官的倾向也使我们失去这件衣裳：它是火，而这样的火会烧毁这件衣裳。财富也是蛀虫：就像蛀虫吞噬一切，甚至不放过丝绸衣裳一样，财富也是如此。因此，让我们放下这一切，好使我们成为义人，好使我们穿上新人。不在我们身上留下任何旧的、任何暂时的、任何腐朽的。美德并不沉重，也不难实践。
  - type: paragraph
    text:
      ru: 'Не видишь ли тех, которые проводят жизнь в горах? Они оставляют и свои дома, и жен, и детей, и все свои служебные занятия, и, удалившись из мира, облекаются во вретище, посыпаются пеплом, возлагают на шею вериги, заключают себя в тесной келье и, на этом не останавливаясь, изнуряют себя постом и постоянным голодом. Если бы теперь я вам предложил все это, не отказались ли бы все вы? Не назвали ль бы такого дела трудным? Но я не говорю, что вы непременно обязаны это делать. Я только желаю этого, но не узаконяю. Далее, что скажу еще? Пользуйся и банями, имей попечение и о теле, ходи и на площадь, имей у себя дом, имей и слуг, употребляй и яства и напитки, – изгони только отовсюду корыстолюбие, потому что оно составляет грех, когда выходит из надлежащих границ законного приобретения. Итак, корыстолюбие – не что иное, как грех. И смотри: когда наш дух возмутится больше надлежащего, тогда, выйдя из себя, мы начинаем злословить, тогда во всем поступаем несправедливо. (То же бывает) и с любовью к телу, к деньгам, к славе и ко всему другому. И не говори мне, что те (отшельники) имели особенные силы (к такой строгой жизни): многие гораздо тебя слабее и богаче и изнеженнее вступили в эту суровую и скорбную жизнь. И что говорю я о мужах? Девы, еще не достигшие двадцатилетнего возраста, проводившие все время в своих покоях, воспитанные в неге, почивавшие на мягком ложе, пропитанные благовониями и дорогими мазями, нежные по природе и еще более сделавшиеся изнеженными от этих усердных об них попечений, не знавшие в продолжение целого дня другого занятия, как только – украшать свою наружность, носить на себе золотые уборы и предаваться неге, не делавшие ничего даже сами для себя, но имевшие у себя множество приставленных к ним прислужниц, носившие на себе одежды еще более нежные, чем самое их тело, употреблявшие тонкие и мягкие покрывала, постоянно наслаждавшиеся запахом роз и подобных благовоний, – эти (девы), будучи внезапно объяты огнем Христовым, оставили всю эту роскошь и пышность и, забывши о своей изнеженности, о своем возрасте, расстались со всеми этими удовольствиями и, подобно храбрым борцам, вступили на поприще подвигов. И быть может, покажется невероятным, что я скажу, – однако же, это истинно. Именно я слышал, будто эти столь нежные девы достигли такой строгости в жизни, что надевали на свои нагие тела самые грубые власяницы, что ноги их оставались босыми; и они имели своим ложем тростниковые прутья; преимущественно же большую часть ночи они проводили без сна и уже не думали ни о благовонных мазях, ни о чем-либо другом из прежних прихотей, и даже оставляли в небрежении свою голову, обыкновенно составляющую особенный предмет их попечений, так что волоса заплетали просто и как-нибудь, лишь бы не нарушить благопристойности. Трапеза у них бывает только вечером, и на этой трапезе нет ни овощей, ни хлеба, а только мука, бобы, горох, елей и смоквы. Постоянно они заняты прядением шерсти и имеют еще занятия, гораздо труднейшие, чем какие (имеют) дома у них служанки. Именно они взяли на себя труд лечить тела больных, носить их постель, умывать им ноги. Многие из них занимаются и приготовлением пищи. Такую имеет силу огонь Христов! Так благое изволение превышает самую природу! Однако ж ничего такого я не требую от вас, потому что вы сами хотите, чтобы женщины опередили вас (на поприще благочестивой жизни).'
      cn: '难道你们没有看见那些在山中度日的人吗？他们撇弃了自己的家园、妻子和儿女，以及一切俗务，从世上隐退，穿上麻衣，头上撒灰，颈项戴着铁链，将自己关在狭窄的隐修室中，并且不止于此，他们还通过禁食和持久的饥饿来苦待自己。如果我现在向你们提出所有这些，你们难道不会都拒绝吗？难道你们不会称这样的事为困难的吗？但我并非说你们必须这样做。我只是期望如此，但并不将其定为律法。


        其次，我还要说什么呢？你们也可以使用浴室，照料身体，也可以上市场，拥有房屋，拥有仆人，享用佳肴美酒——只要将贪婪从一切事物中驱逐出去，因为它一旦超出合法获取的应有界限，就构成了罪。因此，贪婪无异于罪。你们看：当我们的灵性被搅扰超过应有的程度时，我们就会失去自我，开始毁谤，那时在一切事上都会行事不义。爱恋肉体、金钱、荣耀以及一切其他事物，也是如此。


        不要对我说，那些（隐修者）拥有特别的力量（来过这样严苛的生活）：许多比你软弱得多、富有得多、娇生惯养得多的人，都已进入了这种严峻而悲苦的生活。我为什么要提男人呢？那些尚未满二十岁的贞女们，她们终日在闺房中度过，养尊处优，睡在柔软的卧榻上，浑身浸透着香膏和名贵香料，天性娇弱，又因这些殷勤的照料而更加娇生惯养，她们一整天除了装扮容貌、佩戴金饰、尽情享乐之外，不知还有其他事务，她们甚至连自己的事也无需亲自动手，而是有许多侍女服侍左右；她们穿着比自己身体还要柔软的衣裳，使用轻薄柔软的盖头，时常沉醉于玫瑰和类似香料的芬芳之中——这些贞女，被基督之火突然点燃后，便舍弃了所有的奢华与浮夸，忘记了自己的娇弱和年龄，与所有这些享乐告别，像勇敢的斗士一样，踏上了苦修的征途。


        或许我接下来所言会令人难以置信——然而，这确实是真实的。我确实听说，这些如此娇弱的贞女，在生活中达到了如此的严苛，以至于她们在赤裸的身体上穿着最粗糙的苦修衣，赤着双脚；她们的卧榻是芦苇杆；她们尤其将大部分夜晚时间用于不眠守夜，不再思念香膏，也不再想念任何往日的奢靡，甚至连她们通常特别关注的头部也置之不顾，只是简单随意地编织头发，只要不失体面即可。她们只在晚上进餐，餐食中既无蔬菜也无面包，只有面粉、豆类、豌豆、油和无花果。她们持续不断地纺羊毛，并且从事着比她们家中的侍女所做的更艰巨的工作。她们主动承担了医治病患、搬运病床、为病人洗脚的劳苦。她们中许多人也负责准备食物。基督之火拥有如此大的力量！善的意愿竟能超越本性！然而，我并不向你们要求这些，因为你们自己希望妇女在（虔敬生活的道路上）超越你们。'
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'По крайней мере, делайте то, что нетрудно: удержите свою руку (от недозволенного) и глаза от бесстыдных (взглядов). Что в этом трудного, скажи мне, что тяжелого? Будьте справедливы, никому не делайте обиды – никто, ни бедный, ни богатый, ни продавец, ни наемник. Ведь и между бедными могут происходить взаимные обиды. Разве не видите, какие они производят между собой раздоры и все разрушают? Вступай в брак, имей детей; сам Павел давал наставления таковым (ведущим брачную жизнь) и писал к ним. Велик тот подвиг, высока та скала, так что высота ее близка к небу, и ты не в состоянии подняться до нее? Имей же, хотя меньшее, и достигни нижайшего. Ты не можешь раздать своих денег? Не похищай же хотя чужих и не обижай. Ты не можешь поститься? Не предавайся же, по крайней мере, излишеству. Ты не можешь лежать на тростниковом ложе? Не устраивай же, но крайней мере, себе постели, отделанной серебром, но употребляй постель простую и ложе, сделанное не на показ, а для отдохновения, равно не устраивай постели и из слоновой кости: ограничивай себя. Для чего наполняешь корабль своим несчетным имуществом? Если будешь вести скромную жизнь, то не будешь бояться ничего: ни зависти, ни воров, ни козней. Ты ведь богат не столько деньгами, сколько заботами; изобилуешь не столько стяжаниями, сколько беспокойствами и опасностями.«А желающие обогащаться, – сказано, –впадают в искушение и в сеть и во многие безрассудные и вредные похоти»(1Тим. 6:9). Вот что терпят те, которые желают обладать многим. Я не говорю (тебе): прислуживай больному; прикажи, по крайней мере, это своему слуге. Видишь ли, как это не тяжело? Иначе как могли бы так далеко превзойти нас в этом слабые девы? Устыдимся, прошу вас, того, что в мирских делах мы нигде им не уступаем, ни в войне, ни в боях; а в духовных подвигах они успевают больше нас; первые похищают награду и воспаряют на большую высоту, подобно орлам; мы же, подобно галкам, постоянно находимся внизу около дыму и чадных паров. Подлинно это свойственно галкам и жадным до лакомств псам – постоянно думать о поварах и приготовлении кушаний. Послушай о древних женах: то были великие жены, великие и достойные удивления, каковы: Сарра, Ревекка, Рахиль, Деввора, Анна и те, которые жили при Христе. Но они никогда не превосходили своих мужей, а занимали второе место за ними. А теперь, напротив: жены превосходят и затмевают нас. Какой смех! Какой стыд! Мы занимаем место главы, и ужели над нами должно одержать верх тело? Мы поставлены начальствовать над женами не для того только, чтобы пользоваться правами начальствования, но чтобы первенствовать и в добродетели. Начальствующий должен, главным образом, показывать свое преимущество в том, чтобы превосходить добродетелью. А если его самого превосходят, то он уже не начальник.'
      cn: '至少，做那不难之事：管住你的手（远离不被允许之事），和你的眼睛（远离无耻之瞥视）。这有何难，告诉我，这有何重？你们要公正，不要伤害任何人——无论是贫是富，是商人是雇工。因为甚至在穷人之间，也会发生互相的伤害。难道你们没看到，他们彼此之间制造了怎样的纷争，并且破坏了一切吗？你们当进入婚姻，生儿育女；保罗自己也曾对那些（过着婚姻生活的人）提出教导并写信给他们。那个苦修功德是伟大的，那块岩石是高耸的，它的高度几乎与天齐平，而你却无法攀登到它吗？那么，即使只拥有较小的，也要达到最低限度的。你不能施舍你的钱财吗？那么至少不要盗取别人的，也不要伤害别人。你不能禁食吗？那么至少不要沉溺于放纵。你不能睡在芦苇床铺上吗？那么至少不要给自己铺设镶银的床铺，而要使用简单的床铺和不是为了炫耀而是为了安息的床榻，同样也不要铺设象牙的床铺：要约束自己。为何你要用你数不清的财产装满船只呢？如果你过着简朴的生活，那么你将不会害怕任何事：无论是嫉妒，是盗贼，还是诡计。你富有的与其说是金钱，不如说是忧虑；你丰盛的与其说是财物，不如说是烦恼和危险。「但那些想要发财的人，」——经文如此说——「就陷在试探、罗网和许多无知有害的私欲里。」(提摩太前书 6:9)这就是那些渴望拥有许多的人所遭受的。


        我没有说（你）：去服侍病人；那么至少吩咐你的仆人去做这件事。你看，这不难吧？否则，那些柔弱的贞女又怎能在这方面远远超越我们呢？我恳请你们，让我们为以下事实感到羞耻：在世俗事务中，无论是在战争还是战斗中，我们都不逊色于她们；然而在属灵的苦修功德中，她们却比我们更有成就；她们首先夺得奖赏，像鹰一样飞向更高的天空；而我们，却像寒鸦，总是低回在烟雾和浊气之中。这确实是寒鸦和贪图美味的犬类所特有的——总是想着厨师和菜肴的烹制。听一听关于古代的妇女们：她们是伟大的妇女，伟大而令人敬佩，例如：撒拉、利百加、拉结、底波拉、哈拿以及那些生活在基督时代的妇女。但她们从未超越过自己的丈夫，而是居于他们之下，处于次要地位。而现在，恰恰相反：妇女们超越并使我们黯然失色。何等可笑！何等可耻！我们占据着头的位置，难道身体应该凌驾于我们之上吗？我们被设立来作妇女的头，不仅是为了享受管辖的权利，更是为了在美德上居于首位。为首者应当，主要是在超越的美德上显明其优势。但如果他自己被超越了，那么他就不再是为首者了。'
  - type: paragraph
    text:
      ru: 'Видите ли, какова сила пришествия Христова? Как оно уничтожило клятву? Теперь между женщинами больше девственниц, больше у них целомудрия, больше вдовствующих между ними. Ныне женщина не скоро произнесет какое-нибудь непристойное слово. Для чего же, скажи мне, срамословишь ты? Женщины любят наряды, и это их слабость. Но вы, мужья, и в этом их превосходите, надмеваясь как их нарядом, так и своим. Мне кажется, что не столько жена тщеславится своими золотыми украшениями, сколько муж нарядом своей жены; не столько гордится он своим золотым поясом, сколько тем, что жена носит золотые уборы. Таким образом, вы виновны в этом, так как вы воспламеняете эту искру, вы разжигаете этот пламень. С другой стороны, такая страсть не столько грешна в женщине, сколько в мужчине. Ты поставлен распоряжаться ею; ты везде хочешь иметь пред нею первенство. Покажи же и здесь, своими действиями, что ты выше страсти к роскоши. Женщине более извинительно заниматься нарядами, чем мужчине. Итак, когда ты сам не избегаешь (этой страсти), то, как же будет избегать ее она? Правда, у женщин есть некоторое тщеславие; но тоже и у мужчин. Те склонны к гневливости; и эти также. А в чем женщины имеют преимущество, то уже не общее у них с мужчинами: я разумею – скромность, теплоту (души), стыдливость, любовь к Христу. Почему же, говорят, (апостол) возбранил им учительскую кафедру? И это знак того, что существует большое расстояние между ними и мужами и что (жены) были тогда велики. Следовало ли бы, скажи мне, приступать женам к этому делу в то время, как учили Павел и Петр, и те святые (мужи)? А ныне мы дошли до такого зла, что оказывается естественным вопрос, почему жены не занимаются учительством? Таким образом, мы снизошли на степень их слабой природы. Я сказал это не потому, чтобы желал возвысить их, но чтобы возбудить стыд в нас, и нас научить, нас побудить к тому, чтобы мы снова приняли принадлежащее нам начальство, не в смысле преобладания, но в смысле попечения и руководства, в смысле преуспеяния в добродетели. Таким образом, и тело будет иметь приличное благоустройство, когда будет иметь лучшего правителя над собой. Пусть же будет дано всем, как женам, так и мужам, пожить согласно с волей Божьей, чтобы всем нам сподобиться в тот страшный день милосердая Владыки и получить обетованные блага во Христе Иисусе Господе нашем.'
      cn: '你们看，基督降临的力量是何等之大？它如何废除了咒诅？如今，在女子中，有更多的童贞女，她们有更多的贞洁，其中有更多的寡妇。如今，女子不再轻易说出任何不雅之言。那么，请告诉我，你为何仍出言不逊？女子喜欢打扮，这是她们的弱点。然而，你们作丈夫的，在这方面甚至超越了她们，不仅因她们的打扮而自傲，也因自己的打扮而自傲。在我看来，妻子炫耀自己的金饰，不如说丈夫炫耀妻子的装扮；丈夫因自己的金腰带而骄傲，不如说他因妻子佩戴金饰而骄傲。如此，你们便有罪了，因为你们点燃了这火花，你们煽动了这火焰。另一方面，这种情欲在女子身上不如在男子身上那么有罪。你被立为她的管理者；你处处想要在她面前居首。那么，也在此处，以你的行为表明你超越了对奢华的情欲。女子讲究打扮，比男子更情有可原。


        那么，当你自己不规避（这种情欲）时，她又怎会规避呢？诚然，女子有一些虚荣心；但男子也同样如此。她们易怒；他们也一样。而在哪些方面女子具有优势，那便不再是她们与男子共有的了：我指的是——谦逊、心灵的温热、羞涩、对基督的爱。那么，他们为何说（使徒）禁止她们担任教导之职呢？而这正是一个迹象，表明她们与男子之间存在巨大差异，并且（妻子们）在当时是伟大的。那么，请告诉我，当保罗和彼得以及那些圣人（男子）在教导时，妻子们是否应该承担这项工作呢？而如今，我们已堕落到如此境地，以至于「为何妻子不从事教导工作」这样的问题都显得自然了。如此，我们便降到了她们软弱本性的地步。


        我说这些话，并非为了抬高她们，而是为了在我们心中激起羞愧，教导我们，激励我们，使我们重新承担起属于我们的领导地位，这并非压制之意，而是照料与引导之意，指在美德上的精进。如此，身体才能拥有适当的秩序与完善，当它有更好的管理者在其之上时。愿所有的人，无论是妻子还是丈夫，都能蒙恩，按照上帝的旨意生活，使我们所有人都能在那可畏之日，蒙受仁慈主宰的怜悯，并在我们的主基督耶稣里获得所应许的福祉。'
