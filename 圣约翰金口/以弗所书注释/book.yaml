  - type: paragraph
    text:
      ru: О доблестях ап. Павла.
      cn: 论使徒保罗的美德。
  - type: paragraph
    text:
      ru: 'Не через другого кого-либо, говорит (апостол), Бог возвестил нам это, но собственно сам. Не послал для этого ни ангела, ни архангела, потому что исправить столько зол и возвестить о сделанном мог только Он сам, явившись на земле, и никто другой. Владыка принял на Себя должность слуги и почти раба, пришел и возвестил, говорит (апостол),«мир вам, дальним и близким», т. е. иудеям, которые сравнительно с нами были ближе (к Богу), и язычникам, которых, как чуждых заветов обетования, он называет дальними.«Потому что через Него и те и другие имеем доступ к Отцу, в одном Духе... примирить обоих с Богом»(Еф.2:16, 18), – говорит, потому что (Христос) примирил нас (с Богом). Об этом сам Он говорил:«Мир оставляю вам, мир Мой даю вам»(Иоан. 14:27); и в другом месте:«мужайтесь: Я победил мир»(Иоан. 16:33); и еще:«Если чего попросите во имя Мое, Я то сделаю»(Иоан. 14:14); также:«ибо Сам Отец любит вас»(Иоан. 16:27). Все это признаки мира и для тех и для этих. Откуда же видно, что и для этих?«Потому что через Него(δί αυτού)и те и другие имеем доступ к Отцу, – сказано, –в одном Духе»(εν ένί Πνεύματι), не так, чтобы вы меньше, а они больше, но одной и той же благодати (удостоены). Вражду разрушил Он смертью, а любезными нас сделал Отцу через Духа. Вот, смотри, опять частицы:εν(в),δια(через). Через Себя самого и через Духа Он привел нас к Богу.«Итак, вы уже не чужие и не пришельцы, но сограждане святым». Видишь ли, что мы приписаны к городу не просто иудеев, но мужей великих своей святостью, каковы Авраам, Моисей и Илья, и в этом городе некогда явимся?«Ибо те, которые так говорят»(т. е. называвшие себя странниками и пришельцами), – сказано, –«показывают, что они ищут отечества»(Евр. 11:14); а вы уже сограждане святых, а не странники и не пришельцы. Пришельцы – те, которые не имеют получить небесных благ."Сын, – сказано, –пребывает вечно»(Иоан. 8:35).«И свои Богу», – говорит (апостол). Что древние приобретали за столько трудов, то вам дарует благодать Божья.«Быв утверждены на основании Апостолов и пророков»: вот на чем утверждается упование (нашего) звания! Смотри, как (апостол) смешивает всех вместе: язычников, иудеев, апостолов, пророков, Христа; и, чтобы показать тесную связь между всеми ими, представляет их всех то телом, то зданием.«Быв утверждены, – говорит, –на основании Апостолов и пророков», т. е. апостолы и пророки служат основанием здания. Апостолов же ставит прежде, – хотя они были после пророков, – чтобы показать этим, что и те и другие одинаково служат основанием, что все составляет одно здание и имеет один корень. Но помни, что и язычники своим основанием имели патриархов. Представляя это под образом здания, апостол гораздо определеннее выражает (мысль о соединении язычников и иудеев), чем если бы подставил это под образом привития. Затем (апостол) присовокупляет:«имея Самого Иисуса Христа краеугольнымкамнем", показывая, что Христос все содержит, так как краеугольным камнем называется то, что поддерживает и стены и основания.«На Котором все здание». Заметь, как апостол соединяет это: иногда представляет Его свыше содержащим и властвующим над всем телом, иногда же снизу носящим на Себе все здание, – главным основанием. (Апостол) для того и сказал выше:«дабы ...создать ...одного нового человека»(Еф.2:15), чтобы показать, что Он Собою собственно соединил обе стены здания, и, с другой стороны, что в Нем все воссозданы."Рожденный, – сказано (о Нем), –прежде всякой твари»(Кол. 1:15), т. е. Он все носит.«На котором все здание, слагаясь»: таким образом, на что бы ты ни указал, на кровлю ли, на стены ли, или на что другое, Он все носит. В другом месте он называет (Христа) основанием:«Ибо никто не может положить другого основания, – говорит, –кроме положенного, которое есть Иисус Христос»(1Кор. 3:11).«На Котором(εν ψ), – говорит, –все здание, слагаясь». Здесь еще яснее оттеняет и показывает, что не иначе можно сделаться (храмом Божьим), как проводя жизнь со всем вниманием.«Возрастает, – говорит, –в святой храм в Господе, на котором и вы устрояетесь». Очень часто (апостол) говорит о созидании:«в святой храм,.. в жилище Божие Духом». Для чего же происходило это созидание? Для того, чтобы в этом храме обитал сам Бог. Каждый из вас, и все вы вместе, есть храм, и обитает как в теле Христовом, обитает как в храме духовном. Поэтому (апостол) не сказал: вход, но:«имеем доступ»(Еф.2:18), т. е. не сами собою мы пришли, но приведены Им."Никто, – сказал (Спаситель), –не приходит к Отцу, как только через Меня»; и в другом месте:«Я есмь путь и истина и жизнь»(Иоан. 14:6).«Слагаясь стройно, возрастает в святой храм».'
      cn: 使徒说，上帝不是通过别人，而是亲自将这事宣示给我们。祂为此没有派遣天使，也没有派遣天使长，因为只有祂亲自降临地上，才能纠正如此多的邪恶，并宣示所成就的一切，别无他人。主宰亲自担当了仆人乃至奴隶的职务，他来了，并宣示（使徒说）：「平安归于你们，归于远方的人和近处的人」，即归于犹太人（他们与我们相比，离上帝更近），也归于外邦人（使徒称他们为远方的人，因他们与应许的约隔绝）。「因为借着祂，我们双方都在一位圣灵里，得以进到父面前……使两者与上帝和睦」（以弗所书 2:16，18），使徒说，因为基督使我们与上帝和睦。祂自己论到这事曾说：「我留下平安给你们，我将我的平安赐给你们」（约翰福音 14:27）；在另一处又说：「你们要刚强，我已经胜了世界」（约翰福音 16:33）；又说：「你们若奉我的名求什么，我必成就」（约翰福音 14:14）；还有：「因为父自己爱你们」（约翰福音 16:27）。所有这些都是为那双方带来和平的标志。那么，如何看出也是为后者呢？「因为借着祂（δί αυτού），我们双方都在一位圣灵里（εν ένί Πνεύματι），得以进到父面前，」经上说，并非你们较少而他们较多，而是蒙受同一的恩典。祂借着死亡摧毁了仇恨，又借着圣灵使我们蒙父的喜爱。看，这里又出现了介词：εν（在），δια（借着）。祂借着自己，又借着圣灵，将我们引到上帝面前。「如此，你们不再是外人和客旅，乃是圣徒的同国之民了。」你可曾看见，我们不只是被归入犹太人的城，而是被归入那些以其圣洁而伟大的圣徒之城，如同亚伯拉罕、摩西和以利亚，并且我们有朝一日将在这城中显现？「因为说这样话的人（即自称是客旅和寄居的），」经上说，「是表明他们寻求一个家乡」（希伯来书 11:14）；而你们已经是圣徒的同国之民，不再是客旅，也不再是寄居的。寄居者，是指那些不能获得天上福乐的人。「子，」经上说，「是永远住在家里的」（约翰福音 8:35）。「并且是上帝家里的人了，」使徒说。古人费尽千辛万苦所获得的，上帝的恩典却要赐予你们。「被建造在使徒和先知的根基上」：看哪，这就是我们蒙召之盼望所立足的根基！看哪，使徒如何将所有人融合在一起：外邦人、犹太人、使徒、先知、基督；为了显示他们之间紧密的联系，他将他们全部描绘成身体，又描绘成建筑。「被建造，」使徒说，「在使徒和先知的根基上」，即使徒和先知是建筑的根基。他将使徒置于先知之前——尽管使徒们在先知之后——以此表明两者都同样是根基，表明这一切构成了一座建筑，并且拥有一个根源。但请记住，外邦人也有列祖作为他们的根基。使徒以建筑的形象来呈现此事，比将其描绘为嫁接的形象，更明确地表达了（外邦人和犹太人联合的）思想。接着使徒补充道：「有基督耶稣自己为房角石」，表明基督维系着一切，因为房角石是指那支撑墙壁和根基之物。「在祂上面，整座建筑。」请注意使徒是如何将此连结起来的：有时将祂描绘成从上方维系和掌管整个身体，有时又描绘成从下方承载整座建筑——作为主要的根基。使徒之所以在上面说：「为要……创造……一个新人」（以弗所书 2:15），是为了表明祂亲自连结了建筑的两堵墙，并且另一方面，万物都在祂里面被重新创造。「祂是，」经上说（论及祂），「一切受造物中首先的」（歌罗西书 1:15），即祂承载着一切。「在祂上面，整座建筑，相互联结着」：如此，无论你指向屋顶、墙壁，还是其他任何部分，祂都承载着一切。在另一处，他称基督为根基：「因为除了那已经立好的根基，没有人能立别的根基，这根基就是耶稣基督」（哥林多前书 3:11），使徒说。「在祂上面（εν ψ），」使徒说，「整座建筑，相互联结着。」这里更加清晰地强调并指出，除非以全心全意的态度度过此生，否则无法成为（上帝的殿）。「成长为，」使徒说，「在主里的圣殿，你们也在其上被建造。」使徒经常谈论建造：「成为圣殿……成为上帝借着圣灵居住的所在。」那么，这建造是为了什么呢？是为了上帝自己能住在这殿中。你们每一个人，以及你们所有的人合在一起，都是圣殿，上帝居住其中，如同在基督的身体里，如同在属灵的殿中。因此，使徒没有说「进入」，而是说：「得以进到」（以弗所书 2:18），即我们并非凭自己而来，乃是蒙祂引至。「没有人，」救主说，「能到父那里去，除非借着我」；在另一处又说：「我就是道路、真理、生命」（约翰福音 14:6）。「彼此联结，渐渐增长，成为圣殿。」
  - type: paragraph
    text:
      ru: '(Апостол) опять возвращается к прежде приведенному им примеру и соединяет их с (ветхозаветными) святыми, и (самих святых в свою очередь) не допускает разъединяться с Христом. Значит, домостроительство спасения нашего началось еще до пришествия (Христа); значит, имея это в виду, Павел и сказал:«как мудрый строитель, положил основание»(1Кор. 3:10), и в другом месте:«Ибо никто не может положить другого основания, кроме положенного, которое есть Иисус Христос»(1Кор. 3:11). Видишь ли, что примеры нужно понимать не просто, но должно отыскивать в них подразумеваемое? (Апостол) говорит здесь при помощи примеров, как и Христос, когда представлял Отца земледельцем, а Себя корнем.«Для сего-то я, Павел,сделалсяузником Иисуса Христа за вас язычников»(Еф.3:1). Прежде (апостол) говорил о великом промышлении Христовом, теперь же говорит о своем усердии, малом и ничтожном в сравнении с Его (промышлением), которое само по себе достаточно для приведения (к спасению).«Для сего-то я», – говорит, нахожусь в узах, потому что если Владыка мой претерпел за вас распятие, то тем более я должен потерпеть узы. Не только сам Он был связан, но благоволил, чтобы и рабы Его потерпели за вас – язычников – узы. Великий смысл (заключается в этих словах): не только мы не отвращаемся вас, говорит он, а еще терпим за вас узы, и я, между прочим, удостоился такой милости.«Как вы слышали о домостроительстве благодати Божией, данной мне для вас»(Еф.3:2). Здесь (апостол) намекает на предсказание, возвещенное о нем Анании в Дамаске, когда (Господь) сказал:«иди, ибо он есть Мой избранный сосуд, чтобы возвещать имя Мое перед народами и царями»(Деян. 9:15). Смотрением благодати Он называет именно это откровение. Смысл следующий: не от человека я узнал; Он удостоил меня, когда я был один, откровения относительно вас, потому что сам Он сказал мне:«иди; Я пошлю тебя далеко к язычникам»(Деян. 22:21). И справедливо (апостол) назвал это смотрением; подлинно, великое было смотрение, когда тот, кого нельзя было убедить никаким образом, призывается свыше, словами:«Савл, Савл! что ты гонишь Меня?»(Деян. 9:4), и при этом теряет зрение от неизреченного света.«Потому что, – говорит, –мне через откровение возвещена тайна (о чем я и выше писал кратко)»(Еф.3:3). Может быть, он объявил им об этом через кого-нибудь, а может быть немного прежде и сам писал им. Здесь показывает он, что все от Бога, что мы от себя ничего не привносим. В самом деле, скажи мне, сам Павел, – великий и дивный Павел, сведущий в законе, воспитанный со тщанием при ногах Гамалиила, – разве не благодатью спасен? Справедливо (апостол) называет это и тайной; подлинно тайна, каким образом язычники вдруг приведены в большее благородство, чем каково было благородство иудеев.«О чем я и выше, – говорит, –писал кратко», т. е. кратко,«то вы, читая, можете усмотреть»(Еф.3:3–4); итак – увы – он не обо всем писал и не обо всем том даже, о чем нужно было писать. Впрочем здесь это зависело от свойства обстоятельств, тогда как в других случаях, как например, в отношении к евреям, к коринфянам, это зависело от их пороков.«То вы, читая, – говорит, –можете усмотреть мое разумение тайны Христовой»(Еф.3:4), т. е. (можете узнать) как я понял и как уразумел, или вообще откровение Божье, или собственно ту истину, что Он (Сын) сидитодесную(Отца). Потом (апостол) указывает на особое преимущество, говоря, что не со всяким народом Бог так поступал. Какой же это народ, для которого Бог сделал так много? (Апостол) показывает это, говоря:«которая не была возвещена прежним поколениям сынов человеческих, как ныне открыта святым Апостолам Его и пророкам Духом Святым»(Еф.3:5).'
      cn: '使徒再次回到他之前引用的例子，并将它们与（旧约的）圣徒连接起来，（反过来）也不允许圣徒与基督分离。这意味着，我们救恩的经纶甚至在基督降临之前就开始了；这意味着，保罗就是考虑到这一点才说：「我如同一个智慧的工头，立好了根基」（哥林多前书 3:10），并在另一处说：「因为除了那已经立好的根基，就是耶稣基督以外，没有人能另立根基」（哥林多前书 3:11）。你可曾看到，例子不能简单地理解，而应在其中寻找隐含的意义？使徒在这里通过例子来说话，就像基督将父上帝比作农夫，将自己比作根一样。


        「因此，我保罗为你们外邦人的缘故，成了耶稣基督的囚徒」（以弗所书 3:1）。此前，使徒谈到了基督伟大的神圣护理，现在则谈到他自己的热忱，这热忱与祂（的护理）相比是微小和不值一提的，而祂（的护理）本身就足以引人（得救）。「因此我」，他说，「正身陷囹圄，因为如果我的主宰为你们忍受了十字架的苦刑，那么我更应当忍受牢狱之苦。」不仅祂自己被捆绑，而且祂也乐意让祂的仆人为你们——外邦人——忍受捆绑。（这些话语中蕴含着）伟大的意义：他说，我们不仅不憎恶你们，而且还为你们忍受捆绑，而我，在其中，蒙受了如此的恩惠。


        「正如你们听见上帝恩典的经纶，这恩典是为你们赐给我的」（以弗所书 3:2）。这里，使徒暗示了亚拿尼亚在大马士革时向他宣告的预言，当上主说：「你去吧！因为这人是我所拣选的器皿，要在外邦人、君王和以色列人面前宣扬我的名」（使徒行传 9:15）。他将这启示称为恩典的眷顾。意义如下：我不是从人那里得知的；当我独自一人时，祂使我配得了关于你们的启示，因为祂亲自对我说：「你去吧！我要差遣你远远地往外邦人那里去」（使徒行传 22:21）。使徒称其为眷顾，是恰当的；确实，这是一个伟大的眷顾，当一个无论如何都无法被说服的人，从天上被呼召，话语是：「扫罗，扫罗！你为什么逼迫我？」（使徒行传 9:4），并且因此在难以言喻的光中失去了视力。


        「因为，他说，那奥秘是借着启示向我阐明了（我先前也略略写过）」（以弗所书 3:3）。也许他通过某人向他们宣告了这件事，也许他自己也曾在此之前不久写信给他们。在这里他表明，一切都来自上帝，我们自己并没有带来任何东西。事实上，告诉我，保罗本人——那伟大而奇妙的保罗，精通律法，在迦玛列门下受过悉心教导——难道不是借着恩典得救的吗？使徒称其为奥秘也是恰当的；确实是一个奥秘，外邦人怎能突然被提升到比犹太人更高的尊贵地位。「我先前也略略写过」，他说，也就是简要地写过，「你们念了，就能明白」（以弗所书 3:3-4）；因此——唉——他并非写了所有的事情，甚至没有写所有必须写的事情。然而，这里这取决于当时情况的性质，而在其他情况下，例如对希伯来人或哥林多人，这取决于他们的罪恶。「你们念了，他说，就能明白我对基督奥秘的领悟」（以弗所书 3:4），也就是说，（你们可以知道）我是如何理解和领悟的，或者说是普遍的上帝启示，或者说是祂（圣子）坐在（父上帝）右边的这一特定真理。


        接着，使徒指出了一个特殊的优势，他说，上帝并非对所有民族都如此行事。那么，上帝为之做了如此之多的，是哪个民族呢？使徒通过说以下的话来表明这一点：「这奥秘在以前的世代中没有向人类的子孙显明，像如今借着圣灵向祂的圣使徒和先知们显明一样」（以弗所书 3:5）。'
  - type: paragraph
    text:
      ru: 'Итак, скажи мне, неужели чего-нибудь не знали пророки? Каким же образом после этого Христос сказал, что Моисей и пророки писали это обо Мне? И в другом месте:«Ибо если бы вы верили Моисею, то поверили бы и Мне»(Иоан. 5:46). И еще:«Исследуйте Писания, ибо вы думаете через них иметь жизнь вечную; а они свидетельствуют обоМне"(Иоан. 5:39). (Апостол) говоря это, указывает или на то, что не всем людям было открыто, потому что прибавляет:«Которая не была возвещена прежним поколениям сынов человеческих, как ныне открыта», или на то, что это не так обнаружилось в их делах и поступках:«которая не была возвещена прежним поколениям сынов человеческих, как ныне открыта». Подумай и в самом деле: Петр не пошел бы к язычникам, если бы не услышал указания от Духа. Вот послушай, что он говорит:«Итак, если Бог дал им»Духа Святого,"как и нам"(Деян. 11:17). Слова (апостола Павла):«Духом Святым»(εν Πνεύματι) значат то, что Бог через Св. Духа удостоил их участия в благодати. Говорили об этом и пророки, но (люди) никогда бы с такой ясностью не узнали этого, как узнали, услышав апостолов, которые превзошли всякий человеческий ум и общие ожидания.«Чтобы и язычникам быть сонаследниками, составляющими одно тело, и сопричастниками»(Еф.3:6).'
      cn: 那么，请告诉我，难道先知们一无所知吗？如此一来，基督又怎会说，摩西和众先知所写的都是关于我的呢？又在另一处说：「你们如果信摩西，也会信我。」（约翰福音 5:46）还有：「你们查考圣经，因你们以为内中有永生；但圣经正是为我作见证的。」（约翰福音 5:39）（使徒）说这话，是在指明，或者这并非向所有人显明，因为他又补充说：「这奥秘在以前的世代中没有向人类的子孙显明，如同现在向他圣使徒和先知，藉着圣灵启示了一样。」，或者是指这事在他们的言行中未如此彰显：「这奥秘在以前的世代中没有向人类的子孙显明，如同现在向他圣使徒和先知，藉着圣灵启示了一样。」仔细想想：若不是听从圣灵的指示，彼得断不会去到外邦人那里。听他说：「这样，上帝若将圣灵恩赐给他们，如同恩赐给我们一样，」。（使徒行传 11:17）（使徒保罗）的话：「藉着圣灵」（εν Πνεύματι）意指上帝藉着圣灵使他们有份于恩典。众先知也曾论及此事，但（世人）绝不会像听了使徒的宣讲那样清晰地明了这事，因为使徒的宣讲超越了一切人类的理解和普遍的期望。「叫外邦人与犹太人同为后嗣，同为一体，同蒙应许。」（以弗所书 3:6）
  - type: paragraph
    text:
      ru: 'Что значит – быть сонаследниками, сопричастниками обетования и стелесниками? Значение этих слов высоко: они означают то, что (язычники и иудеи) соединены в одно тело, в тесный союз. Что (язычники) будут призваны, это известно было и прежде; но что к этому именно они будут призваны, никто не знал. Потому-то (апостол) и называет это «тайной обетования». Израильтяне и прежде были причастниками обетования Божьи; теперь сопричастниками сделаны и язычники.«Во Христе Иисусе посредством благовествования»(Еф.3:6), т. е. (язычники сделались сопричастниками обетования) через то, что к ним посланы были (благовестники), и они им поверили. Итак, не просто (сделались сопричастниками обетования), но через благовествование. Впрочем, это еще не велико и не важно; (апостол) открывает нам большее и важнейшее, именно, что не только люди, но ни ангелы, ни архангелы, ни иная какая сотворенная сила не знали этого. Это было вполне тайной, никому неизвестной."Усмотреть, – говорит, –мое разумение»(Еф.3:4). Быть может, этими словами (апостол) намекает на то, о чем сказал им в Деяниях, на некоторое его убеждение в том, что и язычники должны быть призваны; такое разумение тайны он выразил выше, сказав, что (Христос)«дабы из двух создать ...одного нового человека»(Еф.2:15). И он, и Петр через откровение были научены, что не должно отвращаться язычников; (об откровении же) он говорит с целью защитить себя.«Которого служителем сделался я по дару благодати Божией, данной мне действием силы Его»(Еф.3:7). Сказав, что он (за язычников) терпит узы, (апостол) снова относит все к Богу, говоря:«по дару благодати Божией», – так как по силе этого дара он удостоен этой чести. Но дар был бы недостаточен, если бы вместе с ним не влагалась и сила (Божья).'
      cn: 共同承受产业的、共同分享应许的、共同成为一体的，这究竟是什么意思呢？这些词语的意义深远：它们意味着（外邦人和犹太人）联合成为一个身体，形成紧密的联合。（外邦人）将被召，这一点以前就已为人所知；但他们被召的正是此，这一点无人知晓。正因如此，（使徒）才称之为「应许的奥秘」。以色列人以前就是分享上帝应许的；如今，外邦人也被造就成为共同分享者。「在基督耶稣里，藉着福音宣讲」（以弗所书 3:6），也就是说，（外邦人之所以成为应许的共同分享者）是通过福音使者被差遣到他们那里，并且他们相信了。因此，他们并非仅仅是（成为应许的共同分享者），而是通过福音宣讲。然而，这还并不算伟大或重要；（使徒）向我们揭示了更大、更重要的事，那就是，不仅是世人，就连天使、天使长，以及任何其他受造的能力，都不知道此事。这完全是个奥秘，无人知晓。「就能明白我所领悟的」（以弗所书 3:4）。或许，（使徒）用这些话暗示了他在《使徒行传》中对他们所说的事，即他坚信外邦人也当被召；他对这奥秘的领悟，在前面已有所表达，他说（基督）「使二者合为……一个新人」（以弗所书 2:15）。他和彼得都通过启示受教，不当排斥外邦人；（而关于这启示）他提及是为了为自己辩护。「我作了这福音的服事者，是照上帝恩典的恩赐，这恩赐是藉祂能力的工作赐予我的」（以弗所书 3:7）。在说了他（为外邦人）忍受捆锁之后，（使徒）再次将一切归于上帝，他说：「照上帝恩典的恩赐」，因为藉着这恩赐的力量，他才蒙此殊荣。然而，如果上帝的能力若未同时倾注其中，这恩赐本身就不足够了。
  - type: paragraph
    text:
      ru: 'Поистине (для благовествования) недостаточно одного человеческого усердия, а нужна высшая сила. (Апостол) внес в дело своего благовестия следующие три качества: пылкую и неустрашимую ревность, душу, готовую претерпеть решительно все, разум и мудрость. Но недостаточно было бы отваги, недостаточно было бы безукоризненной жизни, если бы он не получил силы Духа. Для этого посмотри на него самого, или лучше послушай, что он пишет:«чтобы не было порицаемонашеслужение"(2Кор. 6:3); еще:«Ибо в учении нашем нет ни заблуждения, ни нечистыхпобуждений, ни лукавства; ни видов корысти»(1Фес. 2:3, 5). Видишь ли, как беспорочно (служение апостольское)? И еще:«пекитесь о добром перед всеми»людьми, а не пред лицом только Господа (Рим. 12:17). Затем обрати внимание на следующие слова:«Я каждый день умираю: свидетельствуюсь в том похвалою вашей, братия, которую я имею во Христе Иисусе»(1Кор. 15:31); и еще:«Кто отлучит нас от любвиХристовой?скорбь, или теснота, или гонение»(Рим. 8:35)? еще:«в великом терпении, в бедствиях, в гонениях,в нуждах, в тесных обстоятельствах»(2Кор. 6:4). Потом касательно своего благоразумия он говорит:«для Иудеев я был как Иудей,.. для подзаконных был как подзаконный,.. для чуждых закона – как чуждый закона»(1Кор. 9:20–21). Подвергает себя опасностям и творит бесчисленные (подвиги). Но, что самое главное, в нем всегда действовала сила святого Духа.«Ибо не осмелюсь, – говорит он, –сказать что-нибудь такое, чего не совершил Христос через меня»(Рим. 15:18); еще:«Ибо чего у вас недостает перед прочими церквами?»(2Кор. 12:13) Еще:«ибо у меня ни в чем нет недостатка против высших Апостолов, хотя я и ничто»(2Кор. 12:11). Без этих качеств он не мог бы (иметь успеха). Итак, не через знамение он обращал к вере, не чудеса его были причиной того, и не ими он хвалился, и другими (своими качествами). (Благовестник) должен быть безукоризненным по жизни, и мудрым, и готовым на все опасности, и учительным; эти качества преимущественно и отличали его действия. Если бы и у нас были они, то не нужно было бы и чудес. Вот мы видим, что он прежде, чем совершил какое-либо знамение, уже сделал бесчисленные подвиги этого рода. А мы теперь, не имея ни одного из этих качеств, хотим между тем, чтобы все нам повиновалось. Впрочем, если бы даже и были в нас эти качества, но не все, то нам они не принесли бы пользы. Что, в самом деле, пользы в твоей готовности терпеть опасности, если жизнь твоя подает повод к нареканиям?«Итак, если свет, который в тебе, тьма, – сказал (Спаситель), –то какова же тьма?»(Мф. 6:23). Какую пользу принесет жизнь самая безукоризненная, если ты беспечен и сонлив?«И кто не берет креста своего и следует за Мною, – говорит (Спаситель), –тот не достоин Меня»(Мф. 10:38). (Тот не добрый пастырь) кто не положит душу свою за овцы (Иоан. 10:11). Какая будет польза от обоих этих качеств, если не будет при них мудрости, чтобы знать, как ответить каждому? Если знамений и нет в наше время, то эти качества должны быть. Впрочем (апостол), показавши эти свои качества, все приписывает благодати: это признак благодарного раба. И мы никогда бы не узнали о его подвигах, если бы обстоятельства не поставили его в необходимость (говорить о них). После этого достойны ли мы хоть вспоминать Павла? Он, имея благодать, споспешествовавшую ему, не думал однако же, что этого уже и достаточно, но сам себя подвергал тысячам опасностей; мы же, не имеющие такого дерзновения, из какого, скажи мне, источника почерпнем надежды, что сохраним души, вверенные нашему попечению, и что привлечем не вошедших еще (вЦерковь)? (Каким образом можем надеяться на это мы) люди, которые заботимся только об удовольствиях, ищем всегда одного только – покоя, не можем, или лучше, не хотим подвергаться опасностям даже во сне, которые по мудрости так же далеко отстоим (от Павла), как небо от земли? Потому-то и пасомые нами так много ниже тогдашних. Тогдашние ученики были лучше теперешних учителей: среди народа и тиранов им грозили, у них везде были враги, и, однако, ничто не могло преклонить и поколебать их хотя бы на короткое время.'
      cn: '确实，(为着宣讲福音)仅凭人的热心是不够的，而需要更高的能力。(使徒)将以下三种品质带入了祂的福音事工中：炽热而无畏的热忱，一颗预备好忍受一切的灵魂，以及理智与智慧。然而，若没有勇毅是不够的，若没有无可指责的生命也是不够的，除非祂获得了圣灵的能力。为此，请看祂自己，或者更好地，请听祂所写：「叫我们的职事不被毁谤」（哥林多后书 6:3）；又说：「因为我们的劝戒，不是出于错误，不是出于污秽，也不是用诡诈；我们也没有用过贪婪的借口」（帖撒罗尼迦前书 2:3，5）。你看到了吗，(使徒的事工)是何等无可指摘？又说：「要为众人作美善的事」，而不单单在主面前（罗马书 12:17）。然后，请注意以下的话语：「我天天冒死，弟兄们，这是我指着我在我们的主基督耶稣里所夸的，向你们确实地说」（哥林多前书 15:31）；又说：「谁能使我们与基督的爱隔绝呢？是患难吗？是困苦吗？是逼迫吗？」（罗马书 8:35）；又说：「在极大的忍耐中，在患难中，在穷乏中，在困苦中，在逼迫中，在窘迫中」（哥林多后书 6:4）。之后，关于祂的明智，祂说：「对犹太人，我作了犹太人；…对在律法之下的人，我作了在律法之下的人；…对没有律法的人，我作了没有律法的人」（哥林多前书 9:20-21）。祂使自己置身于危险之中，并成就了无数的(功德)。然而，最重要的是，圣灵的能力总是在祂里面运行。「因为我不敢说基督没有借着我成就的事」（罗马书 15:18）；又说：「因为你们在何事上不如别的教会呢？」（哥林多后书 12:13）又说：「其实我并没有在任何事上逊于那些至高的使徒，虽然我算不得什么」（哥林多后书 12:11）。若没有这些品质，祂就不可能(成功)。


        因此，祂并非通过神迹使人归信，也并非祂的奇迹是其原因，祂也没有以此夸耀，也没有以其他(祂的品质)夸耀。(宣讲福音者)在生命上应当无可指责，且有智慧，且预备好面对一切危险，且善于教导；这些品质主要地也区分了祂的行动。即使我们也有这些品质，那么就不需要奇迹了。看哪，我们看到，祂在行任何神迹之前，就已经成就了无数此类功德。而我们现在，没有这些品质中的任何一个，却想让一切都服从我们。况且，即使我们有这些品质，但若不具备全部，它们对我们也没有益处。你的预备好忍受危险，究竟有什么益处呢，如果你的生命招致指责？(救主)说：「那么，你里面的光若是黑暗的，那黑暗是何等大呢？」(马太福音 6:23)。最无可指责的生命将带来什么益处呢，如果你漫不经心又沉睡不醒？(救主)说：「凡不背着自己的十字架跟从我的，也不配作我的门徒」（马太福音 10:38）。(那人不是好牧人)谁不为羊舍命（约翰福音 10:11）。这两种品质将有什么益处呢，如果没有智慧来知道如何回应每一个人？即使在我们的时代没有神迹，这些品质也应当存在。


        况且，(使徒)展示了祂的这些品质后，却将一切归因于恩典：这是感恩的仆人的标记。我们也绝不会知晓祂的功德，除非环境迫使祂有必要(谈论它们)。在此之后，我们配得上哪怕是纪念保罗吗？祂拥有恩典来帮助祂，却不认为这就足够了，而是亲自将自己置于千百种危险之中；而我们，没有这样的勇气，请告诉我，我们将从何处汲取希望，认为我们将能保守那些托付于我们看顾的灵魂，并能吸引那些尚未进入(教会)的人呢？(我们怎能希望如此呢)我们这些人，只关心享乐，总是只寻求安逸，甚至在睡梦中都不能，或者说，不愿，置身于危险之中，我们在智慧上(与保罗)相距遥远，如同天壤之别？正是因此，我们所牧养的信徒才远远不如当时的人。那时的门徒比现在的教师更好：在百姓和暴君中，他们受到威胁，他们四处都有敌人，然而，没有任何事物能在哪怕是短时间内使他们屈服或动摇。'
  - type: paragraph
    text:
      ru: 'Послушай, что говорит (апостол) в послании к Филипийцам:«потому что вам дано ради Христа не только веровать в Него, но и страдать за Него»(Флп.1:29). И еще в послании к Фессалоникийцам:«Ибо... вы сделались подражателями церквам Божиим во Христе Иисусе, находящимся в Иудее»(1Сол.2:14). И в послании к Евреям он пишет:«и расхищение имения вашего приняли с радостью»(Евр.10:34). О колоссянах в послании к ним свидетельствует следующее:«Ибо вы умерли, и жизнь ваша сокрыта со Христом в Боге»(Кол.3:3); и о других многих опасностях, которым они подвергались, он оставил свидетельство. К галатам писал он:«Столь многое потерпели вы неужели без пользы? О, если бы только без пользы!»(Гал.3:4). Видишь ли, тогда все о том только и думали, чтобы совершать доброе. Потому-то тогда и благодать действовала с такой силою; потому-то тогда и жизнь проводили в подвигах. Но послушай, что он пишет к коринфянам, которых он обвинял в бесчисленных преступлениях. Не с похвалою ли он отзывается и о них, говоря об их"усердиии желании» (2Кор. 7:11)? Между тем, и того, что он хвалит в коринфянах, никто не заметит даже в учителях настоящего времени. Итак, все погибло и пропало. Причина же этого в том, что охладела любовь, и что согрешающие не несут должного наказания. Послушай, что он писал к Тимофею:«Согрешающих обличай перед всеми»(1Тим. 5:20), – а ныне (грехами) страдают начальники. А когда голова нездорова, может ли быть здоровым остальное тело? Притом посмотри, какой теперь неестественный порядок в деле. Правильно живущие и как-нибудь сохранившие еще дерзновение (к Богу) занимают вершины гор, – они удалились из среды нас, как общества чуждого им и враждебного, а не родственного. Беззаконники же, обремененные тысячей преступлений, вторглись вЦерковь; откупщики сделались настоятелями. Отсюда происходят тысячи зол, и нет никого, кто бы исправил, кто бы вразумил. Напротив, это бесчиние получило некоторый законный вид и свободно распространяется. Согрешил ли кто и обвиняется? Таковой не о том старается, чтобы доказать свою невинность, а о том, как бы найти сообщников для своих преступлений. О, с каким ужасом представляю себе, что угрожает нам геенна! Поверьте мне, если бы Бог не готовил нам наказания там, мы видели бы каждый день страшные зрелища, ужаснее бед, перенесенных иудейским народом. Что в самом деле творится у нас? Впрочем, никто не сердись: я никого не назову по имени. Если бы кто-нибудь, придя вцерковьи став посреди вас, находящихся теперь с нами, произвел испытание, или даже не теперь это сделал, а в день св. пасхи, – захотел бы тщательно испытать всех, пришедших сюда и приготовившихся приступить к тайнам, – захотел, говорю, испытать для того, чтобы узнать подробно все, содеянное ними, – то сколько бы он нашел зол, гораздо более тяжких, чем беззакония иудеев? Он нашел бы гадающих по полету и крику птиц, прибегающих к чарам, к наговорам и припевам, нашел бы блудников, прелюбодеев, пьяниц и хулителей. Я не хочу уже упоминать о любостяжателях, чтобы не коснуться кого-либо из здесь стоящих. Что же после этого, если бы кто-нибудь исследовал всех, приходящих в храмы целой вселенной, – какого преступления он не встретил бы? Он увидел бы начальников жадных до денег, увидел бы, что должности приобретены ими через куплю, увидел бы между ними много завистливых, склонных к клевете, тщеславных, преданных ненасытному корыстолюбию, раболепствующих деньгам. При столь великом нечестии можно ожидать всякого зла. И чтобы вам узнать, какого наказания заслуживают преданные этим грехам, припомните древние события.'
      cn: '请听（使徒）在致腓立比人书中的话：

        「因为你们蒙恩，不但在基督里信祂，也为祂受苦。」（腓立比书 1:29）

        又在致帖撒罗尼迦人书说：

        「因为……你们效法了在犹太，在基督耶稣里上帝的众教会。」（帖撒罗尼迦前书 2:14）

        他在致希伯来人书写道：

        「并且你们的家产被抢夺，也欣然忍受。」（希伯来书 10:34）

        他在致歌罗西人书中为歌罗西人作证如下：

        「因为你们已经死了，你们的生命与基督一同藏在上帝里面。」（歌罗西书 3:3）

        并且对于他们所遭遇的许多其他危险，他也留下了见证。他致加拉太人书写道：

        「你们受了这么多的苦，难道是徒然的吗？但愿不是徒然的！」（加拉太书 3:4）

        你看，那时所有人都只想着行善。正因如此，那时恩典才以如此强大的力量运行；正因如此，那时人们才在苦修中度日。但请听他写给哥林多人的书信，他曾指责他们犯下无数罪行。他不也称赞他们，谈论他们的「热心和愿望」吗？(哥林多后书 7:11) 然而，即使是哥林多人身上他所称赞的那些优点，在现今的教师们身上也无人能察觉。因此，一切都毁坏殆尽了。其原因在于爱心冷淡了，以及犯罪者未受应得的惩罚。请听他致提摩太书写道：

        「犯罪的人，要在众人面前责备他。」（提摩太前书 5:20）

        而如今（因罪）受苦的却是首领们。若头不健康，身体其他部分岂能健康呢？再者，看看如今事务中何等反常的秩序。那些生活正直、某种程度上仍保留着（对上帝的）坦然无惧之心的人，占据着山顶——他们从我们中间退隐，视我们为一个陌生且充满敌意、而非亲近的社群。而那些被千般罪行重压的恶人，却侵入了教会；包税人成了掌院。由此产生了千万种罪恶，却无人纠正，无人劝诫。相反，这种无序竟然获得了某种合法的表象，并自由蔓延。若有人犯了罪并受指控？这样的人并不努力证明自己的清白，而是想着如何为自己的罪行寻找同谋。噢，我怀着何等的恐惧设想那威胁着我们的欣嫩子谷！请相信我，若非上帝在那边为我们预备了惩罚，我们每天都会看到比犹太民族所遭受的灾难更可怕的景象。究竟在我们中间发生了什么？话虽如此，请各位不要生气：我不会点名道姓。若有人来到教会，站在你们这些现今与我们同在的人中间进行一番查验，或者即使不是现在，而是在圣逾越节那天进行，——他若想仔细查验所有来到这里并预备领受圣奥秘的人，——我再说一遍，他若想查验，以详细了解他们所做的一切，——那么他会发现多少比犹太人的不法行为更严重的罪恶呢？他会发现占卜观鸟鸣者，诉诸符咒、咒语和歌谣者，他还会发现淫乱者、奸淫者、醉酒者和亵渎者。我不再提及贪婪者了，以免触及在场诸位中的任何一人。在此之后，若有人调查那些来到普世各地圣殿的所有人，——他怎会不遇到各种罪行呢？他会看到那些贪爱钱财的首领，看到他们的职位是靠买卖得来的，还会看到他们中间有许多嫉妒者、好诽谤者、虚荣者、沉溺于无止境贪婪者，以及钱财的奴隶。在如此巨大的不虔敬之下，一切罪恶皆可预料。为了让你们知道沉溺于这些罪行的人应受何种惩罚，请回想古老的事件。'
  - type: paragraph
    text:
      ru: 'Один воин украл часть священных сокровищ, – и стали погибать все. Вы знаете, без сомнения, эту историю? Я говорю об Хармии, укравшем часть военной добычи, посвященную Богу (Нав.7).  Некогда пророк говорил, что страна их исполнена волхований, как будто страна чужеземная (Ис. 2:6). Теперь же все и везде исполнено зла, и никто не страшится! Между тем следовало бы страшиться: Бог наказывает и праведных вместе с нечестивыми, как это было с Даниилом, с тремя отроками, как это было со многими другими, как, наконец, случается и ныне на войнах. Праведные через эти бедствия, ниспосылаемые на них свыше, свергают с себя ту тяжесть грехов, какую они имеют; нечестивые же – нет. Вследствие всего этого будем внимательны к самим себе. Не видите разве браней? Не слышите разве о бедствиях? Или вас ничто это уже не вразумляет? Народы и целые города погибли и разрушены; тысячи попались в рабство к варварам. Если геенна не вразумляет вас, вразумитесь хоть этими бедствиями. Может быть, вы думаете, что это не прещения (Божьи), что это просто обыкновенные события? Погибшие понесли великое наказание; но мы понесем еще большее, если не образумимся при виде стольких бедствий. Знаю, жестоки мои слова; но если вы вникнете в них, они принесут пользу. Хотя сказанное, конечно, не преподает вам благодати, – этого никогда и ждать нельзя, – но оно всегда в состоянии смирить и вразумить душу. А это послужит залогом будущих благ, которых да удостоимся все мы благодатью и человеколюбием (Господа нашего Иисуса Христа, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь).'
      cn: 一名战士盗取了一部分圣物，于是所有人都开始灭亡。你们无疑知道这个故事吧？我说的是亚干，他盗取了一部分献给上帝的战利品（约书亚记 7章）。曾有先知说，他们的国家充满了邪术，仿佛一个异邦之国（以赛亚书 2:6）。如今，一切地方都充满了邪恶，却无人恐惧！然而，我们本应感到恐惧：上帝惩罚义人与恶人，一同受罚，就像对待但以理和那三位少年一样，就像对待许多其他人一样，就像，最终，如今在战争中发生的那样。义人通过这些从上而降的灾祸，卸下他们所背负的罪担；而恶人则不然。因此，我们当警醒自省。难道你们没有看见战乱吗？难道你们没有听说过灾祸吗？难道这一切都无法再使你们醒悟了吗？民族和整座城市都已灭亡、被摧毁；数千人被蛮族掳为奴隶。如果地狱不足以使你们醒悟，至少也当被这些灾祸所警醒。也许你们认为，这些并非（上帝的）惩罚，而仅仅是寻常的事件吗？那些灭亡的人承受了巨大的惩罚；但如果我们不因目睹如此多的灾祸而醒悟，我们将承受更大的惩罚。我知道，我的话语严厉；但如果你们深思这些话，它们将带来益处。尽管所说的当然不会赐予你们恩典——这一点绝不能期待——但它总能使灵魂谦卑并醒悟。而这将成为未来福祉的保证，愿我们所有人都蒙我们主耶稣基督的恩典和慈爱而得享这福祉（与祂，以及父和圣灵同享荣耀、权柄、尊贵，从今时直到永远，世世代代。阿们）。
- type: heading1
  text:
    ru: Беседа 7
    cn: 第 7 讲
  children:
  - type: paragraph
    text:
      ru: Еф.3:8–11.Мне, наименьшему из всех святых,  дана благодать сия  – благовествовать язычникам неисследимое  богатство Христово
      cn: (以弗所书 3:8-11) 我这在众圣徒中是最小的，蒙赐这恩典，得以向外邦人传扬基督那不可测度的丰盛。
  - type: paragraph
    text:
      ru: и открыть всем, в чем состоит домостроительство тайны, скрывавшейся от вечности в Боге, создавшем все Иисусом Христом,
      cn: 并向众人揭示，那自永世以来隐藏在借着耶稣基督创造万有的上帝里面的奥秘的经营，究竟是什么。
  - type: paragraph
    text:
      ru: дабы ныне сделалась известною черезЦерковьначальствам и властям на небесах многоразличная премудрость Божия,
      cn: 好使现在藉着教会，上帝多样的智慧，得以彰显给天上的执政者和掌权者，
  - type: paragraph
    text:
      ru: по предвечному определению, которое Он исполнил во Христе Иисусе, Господе нашем.
      cn: 按照永世的定旨，这定旨是祂在我们主基督耶稣里成就的。
  - type: paragraph
    text:
      ru: Обилие смиренномудрия ап. Павла. – Как должно любить врагов.
      cn: 使徒保罗丰盛的谦卑 – 当如何爱仇敌。
  - type: paragraph
    text:
      ru: 'Кто посещает лечебницу, посещает ее не просто, но с тем намерением, чтобы научиться врачеванию и употреблению лекарств. Так и мы, собравшись здесь, не просто собрались, но чтобы познать обилие смиренномудрия Павла. Что именно? Намереваясь сказать о величии благодати Божьей, послушай, что он говорит:«Мне, наименьшему из всех святых, дана благодать сия». Выказал он смиренномудрие и тем, что оплакивал прежние грехи, уже исправленные, помнил об них, и был скромен до того, что называл себя хульником, гонителем и обидчиком; но с тем (что он говорит теперь) ничего и сравнить нельзя. Прежде, говорит, я был таким-то, и называет себя извергом; но когда теперь, совершенно исправившись, все еще уничижает себя и называет себя меньше всех, – это подлинно великая и необыкновенная скромность.«Мне, наименьшему из всех святых». Не сказал: (меньшему) апостолов, – так что употребил выражение уничиженнее этого последнего. В ином месте он сказал:«и я недостоин называться Апостолом»(1Кор. 15:9); здесь же называет себя даже меньшим всех святых:"Мне, – говорит, –наименьшему из всех святых, дана благодать сия». Какая?«Благовествовать язычникам неисследимое богатство Христово и открыть всем, в чем состоит домостроительство тайны, скрывавшейся от вечности в Боге, создавшем все Иисусом Христом, дабы ныне сделалась известною черезЦерковьначальствам и властям на небесах многоразличная премудрость Божия». Пусть это не было открыто людям, – но неужели ты просвещаешь и ангелов, и архангелов, и начала, и власти? Просвещаю, говорит, потому что в Боге было это сокрыто, в Боге,«создавшем все Иисусом». И ты дерзаешь это сказать? Да, дерзаю, – говорит. Но как же это сделалось известным ангелам? ЧерезЦерковь. И притом не просто сказал: да (скажется) различная премудрость Божья, но –«многоразличная». Итак что же? В самом деле, ангелы не знали ее? Вовсе не знали: если начала не знали, то тем более ангелы не знали. Что же, не знали и архангелы? Не знали и они: откуда они могли узнать? Кто мог им открыть? Когда узнали мы, тогда узнали и они через нас. Послушай, что ангел говорит Иосифу:«наречешь Ему имя Иисус, ибо Он спасет людей Своих от грехов их»(Мф.1:21). Он (Павел) был послан к язычникам, а те (другие апостолы) – к обрезанным. Потому-то особенно удивительны и поразительны его слова:«Мне, наименьшему... дана». Но и это было делом благодати, что меньшему были поручены истины величайшие, что он был их благовестником, – ведь сделавшийся благовестником величайшего через это становится велик и сам.«Благовествовать язычникам неисследимое богатство Христово». Если богатство (Христа) остается неисследованным даже и после Его явления, то тем более неисследованно существо Его. Если и теперь еще есть здесь тайна, то тем более была она прежде, нежели узнали ее. Тайной же называете это (богатство любви Христовой) потому, что оно не было известно ни ангелам, ни кому другому.«И открыть всем, – говорит, –в чем состоит домостроительство тайны, сокрывавшейся от вечности в Боге, создавшем все Иисусом Христом». Ангелы знали только то, что«ибо часть Господа народ Его»(Втор. 32:9). Притом же в другом месте сказано:«князь царства Персидского стоял против меня»(Дан. 10:13). Потому неудивительно, если они не знали этого. Если не знали того, что касалось возвращения (израильтян), то тем более они не могли знать этого (богатства любви Христовой), так как оно открылось через евангелие. Он, – говорит, – спасет Своих людей Израиля. Здесь ничего не говорится о язычниках; но о них открывает Дух. О призвании их было известно, но что при этом они воссядут и на престоле Божьем, этого кто мог ожидать, кто мог этому поверить?«Сокрывавшейся, – говорит, –в Боге". Впрочем это«домостроительство»(о спасении язычников) яснее раскрывает в послании к Римлянам."в Боге, – говорит, –создавшем все Иисусом Христом». Хорошо он сделал, что, вспоминая о творении, сказал:«Иисусом Христом». Ведь сотворивший все через Него и это открывает через Него:"и без Него, – сказано, –ничто не начало быть»(Иоан. 1:3). Сказавши о началах и о властях, сказал и о горнем и о дольнем.«От вечности». Ныне, говорит, совершилось, но не ныне определено, а предначертано издревле.«от вечности в Боге, создавшем все Иисусом Христом», – т. е., по предведению веков, наперед зная будущее, грядущие века, потому что он знал, что будет, и согласно с тем определил.«от вечности», – конечно тех, которые сотворил Иисусом Христом, потому что через Христа«Все ...начало быть»(Иоан. 1:3).«В Котором мы имеем, – говорит, –дерзновение и надежный доступ через веру в Него»(Еф.3:12). Не как пленники, говорит, мы приведены, не как удостоенные прощения, не как согрешившие:"мы имеем, – говорит, –дерзновение и надежный доступ через веру», т. е. со смелостью (надеемся). Почему же так? По вере в Него.«Посему прошу вас не унывать при моих ради вас скорбях, которые суть ваша слава»(Еф.3:13). Почему же о них? И почему (скорби его) составляют их славу? Потому что Бог так возлюбил их, что отдал за них Сына, и предал на страдания Своих рабов (апостолов). В самом деле, и Павел был в узах для того, чтобы они получили такие блага. Так велика к ним любовь Божья! Тоже говорит Бог и о пророках:«бил их словами уст Моих»(Ос. 6:5). Как же они"унывали», когда другой скорбел? Это значит, что они приходили в страх, смущались. Об этом он пишет и Фессалоникийцам, говоря:«чтобы никто не поколебался в скорбях сих»(1Сол.3:3). Должно не только не скорбеть, но и радоваться. Впрочем, если вас может утешить предсказание, то предсказываем вам, что мы здесь испытаем скорби. Почему же? Потому что так повелел Владыка.«Для сего преклоняю колени мои пред Отцом Господа нашего Иисуса Христа, от Которого именуется всякое отечество на небесах и на земле»(Еф.3:14–15). Здесь (апостол) показывает отличительную черту своей молитвы за них. Не сказал просто: «молю», но сказал:«преклоняю колени мои», и тем выразил свое усиленное моление о них.«От Которого именуется всякое отечество». Уже не говорит (об отечестве, которое было разделено)«по числу сынов Израилевых»(Втор.32:8), но о Том, Кто сотворил и горние, и дольние колена, – не такие, каковы иудейские.«Да даст вам, по богатству славы Своей, крепко утвердиться Духом Его во внутреннем человеке, верой вселиться Христу в сердца ваши»(Еф.3:16–17). Смотри, с какой ненасытностью просит им благ для того, чтобы они не колебались. А каким образом это совершается?«Духом Его во внутреннем человекевашемверой вселиться Христу в сердца ваши». Как именно?«Чтобы вы, укорененные и утвержденные в любви, могли постигнуть со всеми святыми, что широта и долгота, и глубина и высота, и уразуметь превосходящую разумение любовь Христову»(Еф.3:18–19).'
      cn: 谁去医馆，不是随便去的，而是带着学习医术和用药的目的。照样，我们聚集于此，并非随意，而是为了认识保罗那丰盛的谦卑智慧。究竟是什么呢？他本打算述说上帝恩典的伟大，请听他说：「我，在众圣徒中是最小的，蒙受了这恩典。」他展现谦卑智慧，不仅因他哀悼过往已蒙修正的罪过，并牢记在心，而且谦逊到称自己为亵渎者、逼迫者和欺侮者；然而，与他现在所说的相比，这一切都无法企及。他说，从前我曾是那样的人，并称自己为污秽不堪者；但如今，当他已全然改正，却仍旧贬低自己，称自己为比所有人更小，——这确是伟大而非凡的谦逊。「我，在众圣徒中是最小的。」他没有说：（比）使徒们（更小），而是用了比后者更谦卑的表达。在另一处他曾说：「我也配不上称为使徒」（哥林多前书 15:9）；而在这里，他甚至称自己比所有圣徒都小：「他说，我，在众圣徒中是最小的，蒙受了这恩典。」什么恩典呢？「向外邦人传扬基督那测不透的丰盛，并向众人阐明那自永世以来隐藏在上帝——借着耶稣基督创造万有的上帝——里面的奥秘的治理，好使上帝百般的智慧，如今借着教会，得以让天上的执政者和掌权者知晓。」这就算没有向人启示，——但难道你也要启迪天使、大天使、以及执政者和掌权者吗？他说，我启迪他们，因为这在上帝里是隐藏的，在「借着耶稣创造万有」的上帝里。而你竟敢说这话？是的，我敢说，他说。但这又是如何让天使们知晓的呢？借着教会。并且他不是简单地说：愿上帝各样的智慧（得以知晓），而是说——「百般的智慧」。那么是什么呢？天使们真的不知道吗？他们全然不知：如果执政者都不知道，天使们就更不知道了。那么，大天使们也不知道吗？他们也不知道：他们从何得知呢？谁又能向他们显明呢？当我们知晓时，他们也借着我们知晓了。请听天使对约瑟说：「你要给他起名叫耶稣，因他要将自己的百姓从他们的罪恶里救出来」（马太福音 1:21）。他（保罗）是被差遣到外邦人那里的，而那些（其他使徒）——是到受割礼的人那里的。正因此，他的话语格外令人惊异和震撼：「我这最小的……蒙受了。」然而，这也是恩典的作为，将至大的真理托付给那最小的，使他成为这些真理的报喜者，——因为借着传扬至大之事的人，自己也变得伟大。「向外邦人传扬基督那测不透的丰盛。」如果基督的丰盛，甚至在祂显现之后仍是测不透的，那么祂的本体就更不可测度了。如果现在这里仍有奥秘，那么在人们知晓它之前，它就更是奥秘了。你们称此（基督之爱的丰盛）为奥秘，是因为它既未为天使所知，也未为其他任何人所知。「他说，并向众人阐明那自永世以来隐藏在上帝——借着耶稣基督创造万有的上帝——里面的奥秘的治理。」天使们只知道「因上主的分乃是他的百姓」（申命记 32:9）。此外，在另一处记载：「波斯国的君王与我作对」（但以理书 10:13）。所以他们不知道这事，并不足为奇。如果他们连那关于（以色列人）回归的事都不知晓，那么他们就更不可能知道这（基督之爱的丰盛）了，因为这乃是借着福音才得以显明。他说，祂要拯救祂的百姓以色列。这里并未提及外邦人；但圣灵向他们启示了这事。他们蒙召之事是已知的，但他们届时竟能与上帝同坐宝座，这事谁能预料，谁又能相信呢？「他说，隐藏在上帝里。」然而，这（关于外邦人得救的）「治理」，他在致罗马人的书信中阐述得更为清晰。「他说，在上帝——借着耶稣基督创造万有的上帝里。」他做得很好，在提及创造时，说道：「借着耶稣基督。」因为那借着祂创造万有者，也借着祂启示了这事：「经上说，凡被造的，没有一样不是借着祂造的」（约翰福音 1:3）。在谈到执政者和掌权者之后，他也谈及了天上和地下的事。「自永世以来。」他说，如今已成就，但并非如今才定下，而是自古即已预定。「自永世以来在上帝——借着耶稣基督创造万有的上帝——里」，即是说，按照世代的预知，预先知晓未来，即将来临的世代，因为祂知道将要发生的一切，并据此而定。「自永世以来」，当然是指那些借着耶稣基督所创造的，因为借着基督，「万有……都成了」（约翰福音 1:3）。「他说，我们因信祂，就在祂里面坦然无惧地，并满有确据地进入到上帝面前」（以弗所书 3:12）。他说，我们不是被当作俘虏带来，不是被赦免的，也不是犯了罪的：「他说，我们因信，就有坦然无惧和确切的进路」，也就是说，我们带着勇气（盼望）。为何如此？乃是因信祂。「所以我求你们，不要因我为你们所受的苦难而灰心，这苦难反是你们的荣耀」（以弗所书 3:13）。为何是关于他们？为何（他的苦难）构成了他们的荣耀？因为上帝如此爱他们，甚至为他们舍弃了自己的圣子，并使祂的仆人（使徒们）受苦。实际上，保罗也曾被囚，为的是让他们获得如此的福分。上帝对他们的爱何其伟大！上帝也同样论及先知们：「我用我口中的话击打他们」（何西阿书 6:5）。那么，当别人受苦时，他们如何「灰心」呢？这意味着他们陷入恐惧，感到困扰。关于此事，他也写信给帖撒罗尼迦人说：「好叫没有人在这苦难中动摇」（帖撒罗尼迦前书 3:3）。不应只是不悲伤，更应喜乐。然而，如果预言能安慰你们，那么我们预言你们将在此经历苦难。为何如此？因为主宰者如此吩咐。「为此，我屈膝在我们的主耶稣基督的父面前，天上和地上所有的家族都是从祂得名的」（以弗所书 3:14-15）。此处（使徒）显明了他为他们祷告的独特之处。他没有简单地说：「我祈求」，而是说：「我屈膝」，以此表达了他为他们恳切的祈祷。「天上和地上所有的家族都是从祂得名的。」他不再是说（那被划分的家族）「按着以色列子孙的数目」（申命记 32:8），而是说那创造了天上和地下的支派者——这些支派并非如犹太人的那般。「愿祂借着祂荣耀的丰盛，用祂的灵，使你们内心的力量刚强起来，使基督借着信住在你们心里」（以弗所书 3:16-17）。看哪，他是何等孜孜不倦地为他们求福，好使他们不致动摇。这又是如何成就的呢？「用祂的灵，使你们内心的力量刚强起来，使基督借着信住在你们心里。」究竟如何？「好叫你们在爱中生根立基，能够与众圣徒一同领悟基督的爱是何等长阔高深，并认识这过于人所能理解的基督的爱」（以弗所书 3:18-19）。
