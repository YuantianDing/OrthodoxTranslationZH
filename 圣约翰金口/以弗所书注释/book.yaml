  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Если нужно получить царство небесное, то недостаточно освободиться от греха, но нужно еще много упражняться и в добродетелях. От порочных действий нужно удерживаться для того, чтобы освободиться от геенны; а чтобы наследовать царство (небесное), необходимо стяжать добродетель. Разве вы не знаете, что так бывает и в светских судилищах, когда происходит исследование какого-либо дела и в собрание стекается весь город? И там был древний обычай – увенчивать золотым венцом не того, кто не сделал зла городу, – потому что за это он только не подвергается наказанию, – но того, кто оказал много благодеяний. Таков путь к этой почести! Но я не знаю, как случилось, что едва не ускользнуло от меня то, что преимущественно необходимо было сказать вам; я восстановлю первую часть этого отдела, сделав в нем небольшую поправку. Когда я говорил, что для того, чтобы не впасть в геенну, достаточно нам воздерживаться от худого, то, пока я говорил, мне пришла на мысль некоторая страшная угроза, обещающая наказание не тем, кто дерзнул (сделать) какое-либо зло, но тем, которые опустили (сделать) что-либо доброе. Что же это за угроза? Когда наступит, сказано, и придет страшный Господний день, то Судья, воссевши на седалище, и поставивши овец с правой стороны, а козлищ с левой, скажет овцам:«приидите, благословенные Отца Моего, наследуйте Царство, уготованное вам от создания мира: ибо алкал Я, и вы дали Мне есть»(Мф.25:34–35).  Это прекрасно, – потому что следовало им за такое великое милосердие получить такое воздаяние. Но когда те, которые не уделяют нуждающимся из того, что имеют сами, наказываются не только лишением благ, но и посылаются в огонь гееннский, – какой в этом смысл? Конечно, и здесь не менее благоприличный смысл, чем в предыдущем. Через это именно мы научаемся, что творящие благое насладятся благами на небесах; а те, которых нельзя обличить ни в чем худом, но которые (опустили) сделать что-либо доброе, повержены будут в огонь гееннский вместе с творившими злое. Можно сказать, что не делать добра – есть уже отчасти зло, потому что показывает леность, а леность есть (составная) часть зла, или вернее, не часть, а повод к злу и корень зла. Ведь всякому злу научила праздность. После этого, не безрассудно ли задаем мы вопросы, в роде того: какое займет место ничего не сделавший худого, и ничего доброго? Не делать добра значит – делать зло. Скажи мне, в самом деле, если есть у тебя какой-нибудь слуга, не вор, не наглец, не грубиян, к тому же воздерживающийся от пьянства и от всего прочего, но который постоянно сидит праздным и ничего не делает такого, что слуга обязан исполнять для господина, – разве ты его не подвергнешь бичеванию и истязаниям? Конечно, скажешь ты. А между тем он ничего не сделал дурного. Значит, это-то самое и худо (что он ничего не делал доброго). Но, если угодно, поведем речь и о другом образе жизни.'
      cn: '若要获得天国，仅脱离罪恶是不够的，还需要在诸德行上多多操练。必须禁绝邪恶行为，才能免于火狱（格黑纳）；而要承受（天）国，则必须获得德行。你们难道不知道，世俗法庭在审理某个案件时，当全城的人都聚集起来，不也是如此吗？在那里，曾有一个古老的习俗——不是给那些未曾对城邦作恶的人戴上金冠——因为这只意味着他不遭受惩罚——而是给那些作出诸多善行的人。这便是通往此尊荣的道路！


        但我不知怎的，几乎从我这里溜走了那尤其需要对你们说的事；我将恢复这一段的第一部分，并在其中作一个小的修正。当我说我们若要不堕入火狱（格黑纳），禁绝恶行就足够了的时候，在我说话期间，我想到一个可怕的威胁，它许诺惩罚的不是那些胆敢行恶的人，而是那些疏忽行善的人。这又是什么样的威胁呢？经上说，当那可怕的，上主的日子来临，审判者将坐上宝座，将绵羊置于右边，山羊置于左边，并对绵羊说：「你们这些蒙我父祝福的人，来吧，承受那创世以来为你们预备的国度：因为我饿了，你们给了我吃。」（马太福音 25:34-35）这是极好的，因为他们理应因如此大的仁慈而获得如此的回报。


        但是，当那些不将自己所有的分给贫困者的人，不仅被剥夺了福祉，还被送入火狱（格黑纳）的火中时，这有什么意义呢？当然，这里面也有同样恰当的意义，不亚于前述的。正是通过这，我们得以明白，行善者将在天上享受福祉；而那些无法被指责有任何恶行，但疏忽行善的人，将被与作恶者一同投入火狱（格黑纳）的火中。可以说，不行善，在某种程度上就是一种恶，因为它显露出怠惰，而怠惰是恶的一部分，或者更准确地说，不是一部分，而是通往恶的缘由和恶的根源。毕竟，一切恶都是由懒散所教唆的。在此之后，我们岂不是愚蠢地提出这样的问题，例如：一个既未作恶，也未行善之人，将占据何处？不行善即是作恶。告诉我，果真如此，如果你有一个仆人，不偷窃，不鲁莽，不粗野，且禁绝醉酒和所有其他恶行，但他却总是闲坐着，什么也不做仆人理应为主子做的事情，难道你不会鞭打和折磨他吗？当然，你会说。然而，他什么坏事也没做。这本身就是坏的（他什么善事也没做）。但如果你愿意，我们也可以谈谈另一种生活方式。'
  - type: paragraph
    text:
      ru: 'Возьмем в пример земледельца: пусть он нисколько не причиняет ущерба нашему имуществу, не клевещет, не ворует, а только, сложа руки, сидит дома, – не сеет, не проводит борозд, не запрягает волов, не ухаживает за виноградником, вообще не прилагает никакого попечения о земле. Разве мы не накажем такого? И, однако, он не сделал никакой неправды, и нам не в чем обвинить его. Но этим самым (бездействием) он и совершил неправду, потому что, по общему понятию, неправедно поступает тот, кто не принимает со своей стороны участия в общем деле. Что, скажи мне, если бы каждый из художников и ремесленников нисколько не делал вреда ни тому, кто занимается отличным от него ремеслом, ни тому, кто – одинаковым, а только находился бы в бездействии, не была ли бы для вас погублена и утрачена таким образом целая жизнь его? Если угодно, мы распространим свою речь и на тело: так, пусть рука не бьет головы, не вырывает языка, не выкалывает глаза и вообще не делает никакого подобного зла, а только остается праздной и не исполняет своей службы всему телу: разве несправедливо будет отсечь ее, вместо того, чтобы носить ее праздной и вредной для всего тела? Или, если рот не съедает рук, не кусает груди, а только не делает ничего, что ему следовало бы делать, – не гораздо ли лучше зажать его? Итак, если и по отношению к рабочим, и по отношению к художникам, и по отношению ко всему телу большая несправедливость – не только совершение какого-либо зла, но даже и бездействие в добре, – то тем более это бывает (несправедливо) со стороны (членов) тела Христова.'
      cn: '让我们以农夫为例：假设他丝毫没有损害我们的财产，不诽谤，不偷窃，而只是袖手旁观，安坐家中——不播种，不耕作，不套牛，不照料葡萄园，根本不对土地施加任何照管。难道我们不惩罚这样的人吗？然而，他并没有行任何不义之事，我们也无从指责他。但他正是通过这种（不作为）而行了不义，因为，根据普遍的观念，凡不尽其本分参与共同事务之人，即是行不义。


        告诉我，倘若每一位艺术家和手艺人，丝毫没有伤害那些从事与他不同行业的人，也没有伤害那些从事相同行业的人，而只是处于不作为的状态，难道他的一生不会因此而对你们而言变得虚度并失去价值吗？


        若蒙允许，我们将此论述延伸至身体：假设手不击打头部，不撕扯舌头，不挖出眼睛，并且根本不做任何类似的恶事，而只是闲置着，不履行其对整个身体的职责：难道将它砍掉，而不是让它闲置并对整个身体有害，会是不公的吗？又或者，倘若口不吞食双手，不啃噬胸膛，而只是什么它该做的事情也不做——难道堵住它不是好得多吗？


        如此说来，倘若就工人、艺术家以及整个身体而言，极大的不义不仅是行某种恶，甚至也是在善事上的不作为，那么，这种不义在基督之身体的肢体方面就更是如此了。'
