          cn: '5.'
        text:
          ru: 'Хочешь ли знать, что апостолы имели власть и прощать долги? И здесь ты увидишь великое различие: они прощали не денежные долги, а долги грехов.«Кому простите грехи, – сказал Господь, –тому  простятся; на ком оставите, на том останутся»(Ин.20:23). Нужно ли после этого доказывать, что они осуждали и на смерть, и возвращали от смерти, не от приговора только освобождая и ведения на смерть, но и умерших и уже подвергшихся тлению восстановляя от смерти? Когда же они осуждали на смерть? Когда освобождали от смерти? Анания и Сапфира были обличены в святотатстве; хотя они украли собственные деньги, но, несмотря на то, вина их была святотатством, потому что после обещания эти деньги уже не принадлежали им. Что же апостол? Послушай, как он, как бы сидя в судилище, приводит на суд святотатца, делает допрос, как судья, и потом произносит приговор, не прежде допроса произносит приговор, хотя грех был очевиден, но что бы нас, стоящих вне, убедить, что он справедливо произносит такой приговор, для этого он делает допрос и говорит так:«Для чеготы допустилсатане вложить в сердце твоемысльсолгать Духу Святому и утаить из цены земли? Чем ты владел, не твое ли было, и приобретенное продажей не в твоей ли власти находилось? Для чего ты положил это в сердце твоем? Ты солгал не человекам, а Богу»(Деян.5:3–4). Что же тот, услышав эти слова?«Пал бездыханен»(Деян.5:5). Видишь ли, что апостолы имеют и меч? Когда ты услышишь слова Павла:«Меч духовный, который есть Слово Божие»(Еф.6:17), то вспомни об этом приговоре, при котором меча не было, но словом пораженный святотатец пал. Видишь ли меч изощренный и обнаженный? Здесь не было ни железа, ни рукояти, ни рук; но вместо руки язык, извлекающий слова вместо меча, тотчас умертвил святотатца. После него вошла жена, и апостол хотел дать ей случай к оправданию и повод к прощению, почему опять спрашивает:«Скажи мне, за столько ли продали вы землю»(Деян.5:8)? Хотя он знал, что не за столько, но чтобы вопросом довести ее до раскаяния и признания во грехах, и чтобы даровать ей прощение, он спрашивает ее; она же и после этого осталась бесстыдной, почему и понесла общее с мужем наказание. Видишь ли силу – ввергать в узы? Видишь ли, как они властны посылать на смерть?'
          cn: '你想知道使徒们也有赦免债务的权柄吗？在此，你将看到一个巨大的区别：他们赦免的并非金钱之债，而是罪孽之债。「你们赦免谁的罪，谁的罪就得了赦免；你们留下谁的罪，谁的罪就留下了。」（约翰福音 20:23）此后，还需要证明他们有定人死罪、并从死亡中挽回的权柄吗？这并非仅仅是免除判决和免于被处死，而是使已故的、甚至已朽坏之人从死亡中复活。那么，他们何时定人死罪？又何时从死亡中施以解救呢？


            亚拿尼亚和撒非喇被控犯有亵渎圣物之罪；尽管他们窃取的是自己的钱财，但其罪过仍是亵渎圣物，因为在许诺之后，这些钱财便已不属于他们。那么使徒做了什么？请听，他如何如同坐在审判席上，将亵渎圣物者带到审判台前，像审判官一样进行审问，然后宣判；他并非在审问前就宣判，尽管罪行昭然若揭，但他为了使我们这些局外之人确信他所宣判是公正的，为此他进行审问并如此说道：「为什么你容许撒旦将这念头放入你心里，使你欺哄圣灵，又私藏田地的价银呢？田地还没有卖出，不是你自己的吗？既卖了，价银不也是由你作主吗？你为什么存这心事呢？你不是欺哄人，乃是欺哄上帝了。」（使徒行传 5:3-4）那么，那人听到这些话后如何？「就仆倒，气绝了。」（使徒行传 5:5）


            你可看到使徒们也拥有刀剑吗？当你听到保罗的这番话：「圣灵的宝剑，就是上帝的道」（以弗所书 6:17）时，请回忆起这个判决，其中并无刀剑，但那亵渎圣物者却因言语的击打而仆倒。你可看到这把锋利出鞘的刀剑吗？这里没有铁器，没有剑柄，也没有手；但代替手的却是舌头，以言语代替刀剑，立刻置那亵渎圣物者于死地。


            他之后，妻子进来了，使徒想要给她一个辩白的机会和蒙赦的由头，因此又问道：「你告诉我，你们卖田地就是这么多银钱吗？」（使徒行传 5:8）尽管他知道并非如此，但他为了藉着提问引导她悔改并承认罪过，并为了赐予她赦免，他才询问她；然而她在此之后仍旧不知羞耻，因此也承受了与丈夫同样的惩罚。你可看到这使人陷入捆绑的权能吗？你可看到他们如何有权柄定人死罪吗？'
      - type: paragraph
        text:
          ru: 'Посмотрим и на лучшее: как они освобождают от смерти. Умерла Тавифа, ученица, отличавшаяся многими делами милосердия, и тотчас бегут к апостолам, потому что знали, что они имели власть над смертью и над жизнью, видели в них горнюю власть, нисшедшую долу. Что же сделал Петр, пришедши туда?«Тавифа, –  сказал он, –встань»(Деян.9:40). Он не имел нужды ни в чем, ни в исполнителях, ни в служителях, но достаточно было слов его для воскрешения; смерть услышала его голос – и не могла удержать мертвую. Видишь ли, каковы были слова этих судей? А слова внешних судей слабы: хотя бы кто-нибудь из них и отдал приказание, но если служитель не приведет этого в исполнение, то приказание остается тщетным. А здесь нет нужды в служителях: он сказал – и тотчас исполнилось. Видишь их узы, которые служат знаком власти; видишь, как они отпускают грехи, как разрешают смерть, как возвращают к жизни. Хочешь ли узнать пояс их? Христос послал их препоясанными, не кожей, но истиной; это – пояс святой и духовный, почему и сказано:«препоясав чресла ваши истиною»(Еф.6:14); это – власть духовная, и потому она не требует ничего чувственного:«Вся слава дщери Царя внутри»(Пс.44:14). Но что? Не хочешь ли видеть и палачей их? Палачи суть те, которые мучат виновных, привешивают к дереву, строгают ребра, наказывают, терзают. Хочешь ли видеть их? У апостолов этим были не люди, а сам дьявол и бесы; облеченные телом и плотью, они имели служащими бесплотные силы. Послушай, с какой властью повелевал им Павел. Говоря о блуднике, он писал: предайте«сатане во измождение плоти»(1Кор.5:5). То же самое сделал он и с другими богохульниками:«Которых я предал, – говорит, –сатане, чтобы они научились  не богохульствовать»(1Тим.1:20).'
          cn: '让我们看看更好的方面：他们如何从死亡中解脱。门徒大比大，她以许多慈悲善行而著称，死了，人们立刻跑去找使徒们，因为他们知道使徒们有掌管死亡和生命的能力，他们看到使徒们身上那从高天降临地上的权柄。那么，彼得来到那里后做了什么呢？「大比大，」他说，「起来吧！」(使徒行传 9:40)。他不需要任何东西，不需要执行者，也不需要仆人，但他的话语足以使人复活；死亡听从了他的声音——无法 удержи死者。你看，这些审判者的话语是何等有力？而世俗审判者的话语是软弱的：即使他们中有人下达命令，但如果仆人不将其付诸执行，那么命令就归于徒然。而在这里，不需要仆人：他一开口——事情就立刻成就了。你看到他们施予的捆绑，它们是权柄的标志；你看他们如何赦免罪过，如何解开死亡的束缚，如何使人复生。


            你想知道他们的腰带吗？基督差遣他们时，并非以皮革，而是以真理束腰；这是一条神圣而属灵的腰带，所以经上说：「用真理束你们的腰」（以弗所书 6:14）；这是属灵的权柄，因此它不需要任何感官上的东西：「王的女儿，她的荣耀全在内里」（诗篇 44:14）。然而，又是什么呢？你不想看看他们的行刑者吗？行刑者是那些折磨罪犯、把他们吊在树上、刮他们的肋骨、惩罚、折磨他们的人。你想看看他们吗？在使徒们这里，这些并非人类，而是魔鬼本身和邪灵；他们虽然身披血肉之躯，却使无形的力量服侍他们。听着，保罗是以何等权柄命令他们的。谈到那淫乱的人，他写道：将他「交给撒但，败坏他的肉体」（哥林多前书 5:5）。他对其他亵渎者也做了同样的事：「我已把他们交给撒但，」他说，「使他们学习不再亵渎」（提摩太前书 1:20）。'
      - type: paragraph
        text:
          ru: 'Что еще остается показать? То ли, что они имели и колесницы? И на это у нас есть доказательства. Так, когда Филипп крестил евнуха и наставил его в священных тайнах, и когда нужно было ему возвратиться, то«восхитил Ангел Господень»его, и из пустыни«оказался в Азоте»(Деян.8:39–40). Видишь ли колесницу окрыленную? Видишь ли колесницу, быстрейшую ветра? Еще: нужно было апостолу отправится в Рай; путь слишком длинный и расстояние безмерное; и он также вдруг был восхищен и перенесен туда без труда и в краткое мгновение времени. Таковы апостольские колесницы! Был и голос глашатая, и также достойный этой власти. Им предшествовал не человек, провозглашая о них, а благодать Духа; и явление чудес возвещало о них громогласнее всякой трубы, и таким образом повсюду предшествовало им. И как начальники бывают окружены большим великолепием, причем частные люди не смеют просто обращаться с ними, так было и с апостолами.«Из посторонних же, – говорит Писание, –никто не смел пристать к ним, а народ прославлял их»(Деян.5:13). Видишь ли, что они имели силу ввергать в узы и власть прощать долги, имели и меч, и были препоясаны поясом, и шествовали на колеснице, и предшествовал им возглас, громогласнейший всякой трубы, и были окружены они большим великолепием?'
          cn: 还有什么需要展示的呢？难道是他们也有车辇吗？对此，我们也有证据。因此，当腓利为太监施洗，并教导他圣洁的奥秘时，当他需要返回时，便有「主的使者提去」了他，他便「从旷野里被带到亚实突」。（使徒行传 8:39-40）你可曾见过长着翅膀的车辇？你可曾见过比风还快的车辇？还有：使徒需要前往乐园；道路何其漫长，距离何其遥远；而他也突然被提去，不费吹灰之力，于短暂片刻之间就被转移到那里。这就是使徒们的车辇！也有宣告者的声音，这声音也与他们的权柄相称。不是人，而是圣灵的恩典在他们前面宣告他们；奇迹的显现比任何号角声都更洪亮地宣扬着他们，以这种方式在各处先行于他们。正如首领们被极大的辉煌所环绕，而且平民百姓不敢轻易与他们接触，使徒们也是如此。「至于其余的人，」——圣经说——「没有人敢与他们接近，百姓却尊荣他们。」（使徒行传 5:13）你可曾见过，他们拥有将人投入囹圄的权能，以及赦免债务的权柄，他们也有宝剑，且束有腰带，且乘坐车辇而行，在他们前方有呼喊声，比任何号角声都更洪亮，他们被极大的辉煌所环绕？
      - type: paragraph
        initial:
          ru: '6.'
          cn: '6.'
        text:
          ru: Теперь нужно было бы показать и все доблестные дела их и те благодеяния, которые они совершили для вселенной, потому что и то свойственно начальникам, чтобы не только пользоваться честью, но и оказывать великое попечение и покровительство подчиненным. Впрочем, уже сказано больше надлежащего. Поэтому, отложив это до другой беседы, постараюсь предложить увещание новопросвещенным. Никто пусть не считает этого совета несвоевременным. Я прежде сказал, что не только через десять и двадцать дней, но и через десять и двадцать лет можно посвященных в тайны называть новопросвещенными, если они остаются невнимательными. Какое же было бы для них самое лучшее увещание? То, когда бы мы напомнили им об образе рождения, и первом и втором, естественном и духовном, и показали, какое различие между тем и другим рождением. Впрочем, им не нужно учиться этому от нас; сам сын грома, возлюбленный Христу Иоанн, скажет им об этом. Что же говорит он?«А тем, которые приняли Его, верующим во имя Его, дал власть быть чадами Божиими»(Ин.1:12). Потом, напоминая им о первом рождении, и по сравнению с ним объясняя важность настоящей благодати, он говорит так:«Которые ни от крови, ни от хотения плоти, ни от хотения мужа, но от Бога родились»(Ин.1:13). Одним словом он выразил их благородство. О, чистое чревоношение! О, духовное рождение! О, новое чадородие, без утробы зачатие, без чрева рождение, без плоти плод, плод духовный, плод благодати и человеколюбия Божия, плод исполненный радости и веселия! Но не таково первое рождение; оно начинается слезами. Как только дитя выходит из утробы и вынимается из чрева, то первый крик его сопровождается слезами, как сказал некто:«Первый голос обнаружил плачем одинаково со всеми»(Прем.7:3). С плачем бывает вступление в жизнь, со слезами, начало ее, которыми природа предвозвещает будущие страдания. Почему плачет дитя, выходя на свет? Потому, что прежде грехопадения Бог сказал:«Плодитесь и размножайтесь»(Быт.1:28), что было благословением; а после грехопадения сказал:«в болезни будешь рождать детей»(Быт.3:16), что было наказанием. И не слезы только бывают при рождении, но и пелены и повязки; слезы при рождении, слезы и при смерти; пелены при рождении, пелены и при смерти, чтобы ты знал, что эта жизнь оканчивается смертью и стремится к этому концу.
          cn: '现在，也应该展示他们所有卓越的功绩以及他们为普世所施的恩惠，因为领袖们不仅享有尊荣，也应该对下属们施以极大的关怀和庇护，这正是他们的本分。然而，言之过当了。因此，姑且将此留待另一次谈话，我将努力向新受启者提出劝勉。愿无人认为此建议不合时宜。我曾说过，领受奥秘者，若他们仍不留心，不仅在十天二十天之后，即便在十年二十年之后，仍可称之为新受启者。那么，对他们而言，最好的劝勉会是什么呢？那便是当我们提醒他们关于诞生的样式，即第一次和第二次的诞生，肉身的和属灵的，并指出这两种诞生之间有何差异之时。然而，他们无需从我们这里学习这些；雷子，基督所爱的约翰，会亲自告诉他们。他说了什么呢？「凡接待祂的，就是信祂名的人，祂就赐他们权柄，作上帝的儿女。」（约翰福音 1:12）接着，他提醒他们关于第一次的诞生，并与之比较来阐释现有恩典的重要性，他这样说：「这等人不是从血气生的，不是从肉体的意思生的，也不是从人的意思生的，乃是从上帝生的。」（约翰福音 1:13）他以一言道出了他们的尊贵。哦，纯洁的怀胎！哦，属灵的诞生！哦，新的生育，无子宫的受孕，无腹部的诞生，无肉身的果实，属灵的果实，上帝的恩典和仁爱之果，充满喜乐和欢欣的果实！


            然而，第一次的诞生并非如此；它始于眼泪。孩童刚一离开母腹，被取出时，它的第一声啼哭便伴随着眼泪，正如某人所言：「人初出声，便用哭泣表明与众人相同。」（智慧篇 7:3）伴随着哭泣进入生命，伴随着眼泪开始生命，自然以此预示着未来的苦难。孩童降生于世时为何哭泣？因为在堕落之前，上帝曾说：「要生养众多，遍满地面。」（创世记 1:28），这是祝福；而在堕落之后，祂又说：「你必在痛苦中生产儿女。」（创世记 3:16），这是刑罚。诞生之时不仅有眼泪，也有襁褓和裹布；诞生之时有眼泪，死亡之时也有眼泪；诞生之时有襁褓，死亡之时也有裹布，好让你知晓，这生命以死亡告终，并趋向这个结局。'
      - type: paragraph
        text:
          ru: Но не таково духовное рождение. Здесь нет ни слез, ни пелен; но родившийся бывает свободен и приготовлен к подвигам; у него свободны и руки и ноги, чтобы он мог и бегать, и вступать в ратоборство; здесь нет плача, нет слез, но приветствия, лобзания и объятия братий, признающих в родившемся собственный член и принимающих его как бы после продолжительного отсутствия. Так как он прежде просвещения был врагом, а после просвещения стал другом общего всем нам Владыки, то все мы сорадуемся ему, почему это лобзание и называется «миром», чтобы мы знали, что Бог прекратил вражду и приблизил нас к Себе. Будем же постоянно соблюдать, будем сохранять этот мир, будем продолжать это дружество, чтобы нам достигнуть и вечных обителей, благодатью и человеколюбием Господа нашего Иисуса Христа, через Которого и с Которым слава, честь и держава Отцу, со Святым и Животворящим Духом, ныне и присно, и во веки веков. Аминь.
          cn: 但属灵的诞生并非如此。这里没有眼泪，也没有襁褓；但那诞生的人是自由的，并已预备好去进行苦修；他的手和脚都是自由的，使他能够奔跑，并投入争战；这里没有哀哭，没有眼泪，而是弟兄们的欢迎、亲吻和拥抱，他们认出这诞生的人是他们自己的肢体，并接纳他，如同久别重逢一般。由于他在蒙受光照之前是仇敌，而在蒙受光照之后，他成了我们大家共同的主宰的朋友，所以我们大家都与他一同喜乐，因此这亲吻也被称为「和平」，为使我们知道，上帝已止息了仇恨，并使我们亲近祂。愿我们恒常遵守，愿我们保守这和平，愿我们延续这友爱，为使我们也能抵达永恒的居所，借着我们的主耶稣基督的恩典和仁爱，借着祂并与祂一同，将荣耀、尊贵和权柄归于父，与圣而赐生命之灵同归，从今时直到永远，世世无尽。阿们。
  - type: heading2
    text:
      ru: Беседа 4-я
      cn: 第 4 讲
    children:
    - type: heading3
      text:
        ru: О том, что не безопасно для слушателей молчать о сказанном в церкви, и для чего Деяния читаются в Пятидесятницу, и почему Христос по Воскресении являлся не всем, и о том, что яснее лицезрения Он представил доказательства Воскресения посредством знамений апостолов.
        cn: 关于对听众而言，对在教会中所说的保持沉默是不安全的；以及为何使徒行传在五旬节被诵读；以及为何基督在复活之后显现并非向所有人；以及关于祂借着使徒们的表记，呈现了比亲眼所见更清楚的复活证据。
      children:
      - type: paragraph
        text:
          ru: Обязанность тех, кто слушают святое слово в церкви, распространять его среди других людей. – Всякий христианин может и должен быть учителем, по крайней мере, в своем доме. – Чудесное снисхождение апостолов и особенно апостола Павла, когда он делался всем для всех, чтобы всех привести к Иисусу Христу. – Апостолы начали проповедовать и творить чудеса только уже после Пятидесятницы; поэтому и чтение книги Деяний более всего полезно в это время. – Книгу Деяний Апостольских читают и непосредственно после Воскресения, потому что чудеса, совершенные апостолами во имя Иисуса Христа, составляют лучшее доказательство Воскресения. – Пространные и красноречивые доказательства того, что чудеса, совершенные апостолами, суть непреоборимые доказательства Воскресения их Учителя.
          cn: 那些在教会中聆听圣言之人的职责，乃是将圣言传播予他人。——每一位基督徒都能够也应当是一位教师，至少在自己的家中如此。——使徒们，尤其是使徒保罗，奇妙的屈己俯就，为所有人成为所有人，为要领所有人归向耶稣基督。——使徒们乃是在五旬节之后才开始宣讲并施行神迹；因此，在此刻阅读《使徒行传》最为有益。——《使徒行传》也在复活节之后立即诵读，因为使徒们奉耶稣基督之名所施行的神迹，构成了复活的最佳证据。——详尽而雄辩的证据表明，使徒们所施行的神迹，乃是他们导师复活不可驳倒的证据。
      - type: paragraph
        initial:
          ru: '1.'
          cn: '1.'
        text:
          ru: Большую часть долга, который мы приняли на себя по надписанию Деяний Апостольских, мы уплатили вам в предшествовавшие дни; но так как еще остался от него небольшой остаток, то я решился уплатить вам и его сегодня. А тщательно ли вы храните сказанное и с великой ли ревностью соблюдаете, об этом знаете вы, получившие серебро и имеющие отдать в этом серебре отчет Господу в тот день, когда те, которым вверены таланты, будут призваны и станут давать отчет, – когда Христос, пришедши, потребует это серебро от торговцев с приращением.«Посему надлежало тебе, – сказал  Господь, –отдать серебро мое торгующим, и я, придя, получил бы мое с прибылью»(Мф.25:27). О, великое и неизреченное человеколюбие Владыки! Запрещая людям брать лихву, Он сам требует лихвы. Почему? Потому, что та лихва неодобрительна и достойна осуждения, а эта похвальна и достойна великого одобрения. То приращение, разумею денежное, причиняет вред и получающему, и дающему, губит душу получающего и увеличивает бедность дающего.
          cn: 大部分我们因解说《使徒行传》而承担的债务，我们已在过去的日子里向你们偿清了；但由于还剩下一点点余款，我决定今天也把它偿清给你们。至于你们是否认真保存所说的话，又是否以极大的热忱遵守，这一点你们自己知道，你们这些领受了银子并要在那银子上向上主交账的人，当那些受托管理他连得的人被召集并开始交账时，——当基督降临，要向商贩们索取这笔带着利息的银子时。「所以，你本该把我的银子交给兑换银钱的人，这样我来的时候，就可以连本带利收回我的钱」（马太福音 25:27）。哦，主宰者那伟大而不可言喻的慈爱！祂禁止人们收取高利贷，祂自己却要求利息。为什么？因为那种高利贷是不可取且应受谴责的，而这种利息是值得称赞并应受到极大赞许的。那种（我指的是金钱上的）增益，会同时伤害到收取者和给予者，败坏收取者的灵魂，并增加给予者的贫困。
      - type: paragraph
        text:
          ru: Подлинно, что может быть жесточе того, когда кто-нибудь извлекает для себя выгоду из бедности ближнего и пользуется несчастьями братий; когда кто-нибудь, показывая вид человеколюбия, оказывает всякое бесчеловечие, и, по-видимому, простирая руку, ввергает в пропасть нуждающегося в помощи? Что делаешь ты, человек? Не для того пришел к твоим дверям бедный, чтобы ты увеличил его бедность, но чтобы ты избавил его от бедности, а ты делаешь то же, что делают примешивающие яд к лекарствам. Как те, примешивая яд к обыкновенной пище, делают незаметным свой умысел, так и эти, под видом человеколюбия скрывая гибельное лихоимство, не дают заметить вред имеющим пить это смертоносное лекарство. Поэтому благовременно приложить сказанное о некотором грехе и к тем, которые отдают в рост и берут взаймы. Что же сказано об этом грехе? На время, сказано,«мед источают уста чужой жены, и мягче елея речь ее; но последствия от нее горьки, как полынь, остры, как меч обоюдоострый»(Притч.5:3–4). То же бывает и с теми, которые берут взаймы. Когда нуждающийся принимает деньги, то получает некоторое малое и временное утешение; но после, когда приращение увеличится и бремя сделается выше сил, то эта приятность, услаждавшая гортань, сделается горче желчи и острее меча обоюдоострого, когда он принужден будет вдруг лишиться всего отцовского достояния.
          cn: 诚然，有什么能比以下情况更残忍呢？当有人从邻人的贫困中为自己牟利，并利用弟兄们的苦难；当有人表面上表现出仁爱，却行尽一切不仁之事，表面上似乎伸出援手，却将需要帮助的人推入深渊？你在做什么，人啊？穷人来到你门前，不是为了让你增加他的贫困，而是为了让你解除他的贫困，你所做的，却与那些在药中掺毒的人无异。正如那些在普通食物中掺入毒药，使自己的企图不为人察觉的人一样，这些人也假借仁爱之名，隐藏着害人的高利贷行径，使那些将要饮用这致命药物的人无法察觉其害处。因此，正适时地可以把关于某种罪行所说的话，应用到那些放高利贷和借贷的人身上。那么，关于这种罪行说了些什么呢？经上说：「一时之间，外女的口滴下蜂蜜，她的言语比油更柔滑；但她的结局却苦似茵陈，快如两刃的利剑。」（箴言 5:3-4）。那些借贷的人也是如此。当困苦之人接受金钱时，他得到一些微小和暂时的慰藉；但之后，当利息增加，且重担超出了承受能力时，这曾经甘甜如饴的愉悦，将变得比胆汁更苦，比两刃的利剑更锋利，当他被迫突然失去全部祖传家产之时。
      - type: paragraph
        initial:
          ru: '2.'
          cn: '2.'
        text:
          ru: 'От чувственного обратим речь к духовному.«Посему надлежало тебе отдать серебро мое торгующим»(Мф.25:27), – сказал Господь, называя торговцами серебра вас, слушающих эти слова. Для чего же Бог назвал вас торговцами? Для того, чтобы научить всех прилагать такое же усердие к исследованию сказанного, какое те оказывают при рассматривании принимаемых монет. Как торговцы отвергают подложную и поддельную монету, а настоящую и истинную принимают, отличая неподлинную от подлинной, так поступай и ты: не всякое слово принимай, но неправильное и худое отвергай от себя, а здравое и спасительное слагай в душе. Есть, действительно есть и у тебя весы и безмен, сделанные не из меди и железа, но состоящие из чистоты и веры; при помощи их и исследуй всякое слово. Потому и сказано: будьте искусными торжниками, – не с тем, чтобы вы, стоя на площади, пересчитывали серебро, но чтобы вы исследовали слова со всяким тщанием. Потому и апостол Павел говорит:«Все искушайте, но хорошего только держитесь»(1Фес.5:21). И не потому только Он назвал вас торговцами, что вы должны исследовать, но и потому, что вы должны употреблять получаемое в дело. Если бы и торговцы, получив деньги, только заперли их дома и не передавали другим, то прекратилась бы вся их торговля; точно то же бывает и с слушателями. Если ты, приняв учение, удержишь его у себя и не передашь другим, то весь твой труд погибнет. Поэтому мы видим их на торжищах каждый день входящими и выходящими. То же пусть будет и с учением. Между торговцами мы видим, как одни отдают деньги, другие тотчас принимают и уходят, и это можно видеть всякий день; отчего, хотя иные и не имеют у себя собственных денег, но, пользуясь надлежащим образом чужими, приобретают для себя великую выгоду. Так поступай и ты. Эти изречения не твои, а Духа Святого; но если ты сделаешь из них доброе употребление, то получишь себе великую духовную пользу. Потому Бог и назвал вас торговцами. А почему учение Он назвал серебром? Потому что, как серебро имеет на себе отпечатанным царский образ, – если оно не имеет его, то не есть подлинное серебро, а называется поддельным, – так и учение веры должно иметь на себе отпечатленным образ Слова. С другой стороны, употребление серебра поддерживает всю нашу жизнь и служит основанием для всех договоров, и купить ли нужно что-нибудь или продать, все это мы делаем посредством него. То же бывает и с учением: это духовное серебро служит причиной и основанием духовных договоров. Так, хотим ли мы приобрести что-нибудь от Бога, мы наперед представляем слова молитвы, и потом получим то, чего просим; видим ли брата беспечного и погибающего, мы приобретем ему спасение и доставим жизнь, предложив слово учения.'
          cn: 让我们将言语从感官转向属灵。「就当把我的银子交给兑换银钱的人」(马太福音 25:27)，——上主说，称你们这些听着这些话语的人为银钱兑换者。上帝为何称你们为兑换银钱的人呢？是为了教导所有人，以同样的勤勉去查考所说的话，如同那些人检视所收取的钱币时所表现的勤勉一样。如同兑换银钱的人弃绝伪造和虚假的钱币，而收取真实与纯正的，辨别真伪，你们也当如此行：不要接受每一句话，而要弃绝错误与邪恶的，将健全与救赎的铭记在心。你们确实拥有天平与秤，不是用铜和铁制成的，而是由纯洁与信心构成；藉着它们来查考每一句话。所以有话说：要作精明的兑换银钱的人，——不是要你们站在市集上点算银钱，而是要你们以一切的谨慎查考话语。所以使徒保罗说：「凡事察验，善美的要持守」(帖撒罗尼迦前书 5:21)。他称你们为兑换银钱的人，不仅是因为你们应当查考，也是因为你们应当将所获得的付诸实行。倘若兑换银钱的人收到钱后，只是锁在家里而不转交给他人，那么他们所有的交易都会停止；听众也是如此。倘若你接受了教训，却将它保留在自己那里而不传给他人，那么你所有的劳苦都将白费。所以我们看到他们每日在市集上进进出出。教训也当如此。在兑换银钱的人当中，我们看到一些人付出钱，另一些人立刻接受并离开，并且这种情况每日可见；因此，尽管有些人没有自己的钱，但他们通过妥善运用他人的钱，为自己获得了巨大的益处。你们也当如此行。这些言论不是你们的，而是圣灵的；但倘若你们妥善运用它们，那么你们将获得巨大的属灵益处。因此上帝才称你们为兑换银钱的人。那么祂为何将教训称为银子呢？因为如同银子刻有君王的肖像，——倘若它没有，就不是真正的银子，而是被称为伪造的，——同样，信德的教训也应当刻有圣言的形象。另一方面，银子的使用维系着我们所有的生活，并作为所有契约的基础；无论是买卖任何东西，我们都是藉着它来完成。教训也是如此：这属灵的银子是属灵契约的原因与基础。譬如，我们若想从上帝那里获得什么，我们就先呈上祷告的话语，然后就会得到所求的；我们若看到疏忽并沉沦的弟兄，我们就能为他获得救恩，并赐予生命，藉着提出教训的话语。
      - type: paragraph
        text:
          ru: 'Итак, нужно со всем тщанием хранить и соблюдать все, чтобы сообщать это и другим, – потому что от нас требуется приращение и этого серебра. Будем же внимательно принимать его, чтобы мы могли сообщать это серебро и другим, – потому что каждый, если захочет, имеет возможность учить. Ты не можешь назидать столь великуюцерковь; но можешь вразумить свою жену. Ты не можешь беседовать с таким множеством людей; но можешь научить своего сына. Ты не можешь предлагать слова учения такому народу; но можешь исправить своего раба. Такое собрание учеников не превышает и твоих сил; такая мера учения не превосходит твоего разумения; но вы еще удобнее, нежели мы, можете исправлять всех их. Я беседую с вами однажды или иногда дважды в неделю; а ты постоянно в своем доме имеешь учеников: жену, детей, рабов – и вечером, и за трапезой, и во весь день можешь исправлять их. Кроме того, такое врачевание бывает и удобнее. Я, беседуя среди такого множества людей, не знаю, какая тревожит вас душевная страсть; поэтому и бываю принужден в каждом поучении предлагать все врачества; а вам нет нужды поступать так, но с меньшим трудом вам можно произвести большее исправление; вы хорошо знаете грехи живущих вместе с вами, и потому можете произвести скорейшее исцеление.'
          cn: 因此，当以一切谨慎保守并遵行一切，为要将此传达给他人，因为上帝向我们要求这银子的增益。那么，让我们留意领受它，好叫我们也能将这银子传达给他人，因为每个人，若他愿意，都有教导的能力。你不能训导如此宏伟的教会；但你可以开导你的妻子。你不能与如此众多的人交谈；但你可以教导你的儿子。你不能向这样的人民提供教导之言；但你可以纠正你的仆人。如此一批门徒并不超出你的能力范围；如此程度的教导也不会超越你的理解力；但你们比我们更便利地可以纠正他们所有人。我每周与你们交谈一次或有时两次；而你，在家中却常常有门徒：你的妻子、儿女、仆人——并且在晚上、在餐桌旁、在整天都可以纠正他们。除此之外，这样的医治也更为便利。我在如此众多的人群中交谈时，不知何种灵魂情欲困扰着你们；因此，我被迫在每一次教训中提供所有的药剂；而你们不必如此行，却可以用更少的努力带来更大的纠正；你们清楚了解与你们同住之人的罪过，并且因此可以带来更迅速的医治。
      - type: paragraph
        initial:
          ru: '3.'
          cn: '3.'
        text:
          ru: Итак, возлюбленные, не будем нерадеть о живущих вместе с нами, потому что величайшее наказание и невыразимое мучение предстоит тем, которые нерадят о своих домашних.«Если же кто, – говорит апостол, –о своих и особенно о домашних  не печется, тот отрекся от веры и хуже неверного»(1Тим.5:8). Видишь ли, как Павел поражает тех, которые нерадят о своих домашних? И весьма справедливо, потому что кто нерадит о своих, тот будет ли заботиться о чужих? Знаю, что я часто внушал вам это; но никогда не перестану повторять это внушение, хотя я сам уже не подлежу ответственности за беспечность других.«Посему надлежало тебе, – сказал Господь, –отдать серебро мое торгующим», и больше ничего не требовал. Я же отдал серебро, и потому не подлежу никакой ответственности; но хотя я невинен и свободен от наказания в этом отношении, однако, как будто виновный и подлежащий наказанию, страшусь и трепещу за ваше спасение.
          cn: 那么，亲爱的，我们不要疏忽与我们同住之人，因为最大的惩罚和无法言喻的苦难正等待着那些疏忽自己家人的人。「若有人，」 使徒说，「不照管自己的人，尤其是不照管自己家里的人，他就是背弃了信仰，比不信的人还坏。」（提摩太前书 5:8）你看，保罗是如何斥责那些疏忽自己家人的人吗？这非常公义，因为谁若疏忽自己的人，他岂会关心他人呢？我知道我经常如此教导你们；但我绝不会停止重复这个教导，尽管我本人已不再对其他人的疏忽承担责任。「所以，你本该把我的银子交给兑换银钱的人，」 主说，「再没有要求别的了。」而我却已交出银子，因此不负任何责任；但尽管我在这方面是无辜的，且免受惩罚，我却如同有罪且应受惩罚之人，为你们的救赎而感到恐惧和颤栗。
      - type: paragraph
        text:
          ru: 'Итак, пусть никто не слушает духовных бесед без внимания и с нерадением. Я не без причины и не напрасно делаю длинные вступления, но для того, чтобы сказанное лучше удерживалось в вашей памяти, чтобы вы не уходили домой, произведши только шум и рукоплескания тщетно и напрасно, потому что я не забочусь о ваших похвалах, но пекусь о вашем спасении. Подвизающиеся на зрелище, в награду за это, получают похвалу от народа; а мы не для этого выходим сюда, но для того, чтобы получить назначенную за это награду от Господа. Для того мы постоянно и внушаем вам это, чтобы сказанное проникло до глубины души вашей. Как из растений те, которые пустили корни в глубину, не колеблются от порывов ветра, так и мысли, чем глубже лежат в душе, тем труднее колеблются от влияния обстоятельств. Скажи мне, возлюбленный: если бы ты увидел своего сына томящимся от голода, то оставил ли бы его без внимания и не перенес ли бы все, чтобы утолить его голод? Если же ты не оставил бы без внимания того, кто алчет хлеба, то неужели можешь пренебрегать тем, кто томится голодом Божественного учения? Как мог бы ты тогда достойно называться отцом? Этот голод тем тяжелее того, чем важнейшей оканчивается смертью, почему здесь нужно употреблять и больше старания.«Воспитывайте, – говорит апостол, –их(детей)в учении и наставлении Господнем»(Еф.6:4). Вот самая лучшая забота отцов; вот истинное попечение родителей; там я признаю естественное родство, где оказывают большее попечение о духовном.'
          cn: 那么，愿无人漫不经心或疏忽大意地聆听属灵的教诲。我并非无故或徒劳地作冗长的开场白，而是为了所讲的能更好地留在你们的记忆中，让你们不至于徒然空耗地只制造了喧哗和鼓掌就回家，因为我不关心你们的赞扬，而是为你们的救赎忧虑。在竞技场上奋斗的人，作为回报，从民众那里获得赞扬；而我们来到这里并非为此，而是为了获得主为此命定的奖赏。为此，我们不断地将这些灌输给你们，愿所讲的能深入你们灵魂的深处。正如植物中那些根扎得深的，不被狂风所动摇，同样，思想在灵魂中扎根越深，就越难被环境的影响所动摇。告诉我，亲爱的：如果你看到你的儿子因饥饿而憔悴不堪，你会置之不理吗？难道你不会竭尽所能去满足他的饥饿吗？既然你不会对饥饿求饼的人置之不理，那么你怎能轻视那些渴望上帝教诲而饥饿的人呢？那时你又怎能配得上「父亲」的称呼呢？这种饥饿比那一种更严重，因为它导致的是更重要的死亡，因此在这里需要付出更多的努力。「你们要照着主的教训和警戒养育他们（儿女）」（使徒说）（以弗所书 6:4）。这就是父亲们最好的关怀；这就是父母们真正的照料；我承认，自然的亲属关系存在于那些对属灵事物表现出更大照料的地方。
      - type: paragraph
        text:
          ru: 'Впрочем, довольно сказано для вступления; теперь нужно и уплатить долг. Для того я и вел большую и длинную речь об этом, чтобы вы приняли предлагаемое со всем тщанием. Какой же тот долг, которым мы прежде остались должными? Может быть, вы забыли об этом? В таком случае нам нужно напомнить вам и наперед прочитать расписку, по которой мы прежде сделали уплату, и сказать, что было уплачено, чтобы из уплаченного видеть, что еще остается уплатить. Что же уплачено прежде? Тогда я сказал, кто писатель книги Деяний, кто сочинитель этого слова, или лучше – не сочинитель этого слова, а служитель, потому что не сам он произвел сказанное, но он послужил сказанному. Сказал я и о самих Деяниях, и что значит название Деяний; сказал и об имени апостолов; теперь нужно сказать, почему отцы наши установили читать книгу Деяний в Пятидесятницу. Вы, может быть, помните, что мы тогда обещали сказать и об этом. Не напрасно, в самом деле, и не без причины отцы назначили нам это время, но сделали так по некоторой мудрой причине; не для того, чтобы подчинить нашу свободу необходимости, но чтобы, снисходя к скудости немощных, возвести их к богатству познания. А что они действительно для этого соблюдали времена, не себя самих подчиняя необходимости соблюдения, но, стараясь снизойти к немощным, послушай, что говорит Павел:«Наблюдаете дни, месяцы, времена и годы. Боюсь за вас, не напрасно ли я трудился у вас»(Гал.4:10–11). А ты сам разве не соблюдал дней, времен и годов? Что же? Если мы видим, что тот, кто запрещает соблюдать дни, месяцы, времена и годы, сам соблюдал их, что скажем мы, отвечай мне? То ли, что он противоречит сам себе и опровергает сам себя? Да не будет; но то, что он, желая исправить слабость соблюдающих времена, сам снисходит к ним таким соблюдением. Так поступают и врачи: пищу, подаваемую больным, они сами отведывают прежде, не потому, чтобы сами нуждались в этой пище, но стараясь исцелить немощь их. Так поступал и Павел: не имея никакой нужды в соблюдении времен, он соблюдал времена, чтобы соблюдающих избавить от немощи этого соблюдения. Когда же Павел соблюдал времена? Слушайте со вниманием, увещеваю вас.«В следующий день, –  говорится в Писании, –прибыли в Милит, ибо Павлу рассудилось миновать Ефес, чтобы не замедлить ему в Асии; потому что он поспешал, если можно, в день Пятидесятницы быть в Иерусалиме»(Деян.20:15–16).'
          cn: '序言已说得够多了；现在是时候偿还债务了。为此，我才就此事讲了许多冗长的话，好让你们能以全然的谨慎来接受所要呈现的。我们先前欠下的债务究竟是什么？也许你们已经忘记了？既然如此，我们有必要提醒你们，并事先读出我们先前已偿付过的收据，告诉你们已偿付了什么，以便从已偿付的部分看出还有什么尚未偿付。那么，先前偿付了什么呢？当时我说了，使徒行传的作者是谁，这篇讲论的撰写者是谁，或者更确切地说，不是这篇讲论的撰写者，而是服侍者，因为他并非自己创作所说的，而是服侍了所说的。我也谈了使徒行传本身，以及「使徒行传」这个名称的含义；也谈了使徒的名称；现在需要说说，我们的教父们为何规定在五旬节诵读使徒行传。也许你们还记得，我们当时答应了也要谈及此事。我们的教父们确实并非无故或无缘无故地为我们指定这个时间，而是出于某种明智的原因；并非为了使我们的自由服从于必然性，而是为了体恤软弱者的贫乏，将他们提升至知识的丰盛。至于他们确实为此守节期，并非将自己服从于守节期的必然性，而是努力体恤软弱者，请听保罗怎么说：「你们遵守日子、月份、节期、年份。我为你们担心，恐怕我为你们所作的工是徒然的。」(加拉太书 4:10-11)


            难道你自己没有遵守日子、节期和年份吗？那么，如果我们看到那个禁止遵守日子、月份、节期和年份的人，自己却遵守了它们，我们该说什么呢，回答我？难道说他自相矛盾，自我驳斥吗？绝不是这样；而是他渴望纠正那些遵守节期者的软弱，便以这样的遵守来体恤他们。医生们也是如此行事：他们会先亲自品尝给病人吃的食物，并非因为他们自己需要这种食物，而是努力医治病人的软弱。保罗也是如此：他本不需要遵守节期，他却遵守了节期，以便使那些遵守者摆脱这种遵守的软弱。那么，保罗何时遵守了节期呢？我劝你们，请仔细聆听。「次日，」经上说，「他们抵达米利都，因为保罗决定要越过以弗所，以免他在亚细亚耽延；因为他赶着，若是可能，要在五旬节那天到达耶路撒冷。」(使徒行传 20:15-16)'
      - type: paragraph
        text:
          ru: Видишь ли, как тот, который говорит:«Для чего... наблюдаете дни, месяцы, времена и годы»(Гал.4:9–10), сам соблюдал день Пятидесятницы?
          cn: 你可看到，那位说这话的人：「为何...你们守着日子、月份、节期和年份呢？」 (加拉太书 4:9-10)，自己却守五旬节呢？
      - type: paragraph
        initial:
          ru: '4.'
          cn: '4.'
        text:
          ru: 'И не только день он соблюдал, но и место, потому что он спешил не только прибыть ко дню Пятидесятницы, но и провести его в Иерусалиме. Что делаешь ты, блаженный Павел? Иерусалим разрушен, Святое Святых опустошено по определению Божию, прежние учреждения прекратились, сам ты взываешь к галатам: «Вы, надеющиеся оправдатьсязаконом,... отпали от благодати»(Гал.5:4); для чего же ты опять ведешь нас в рабство закону? Не маловажное дело узнать, не противоречит ли Павел сам себе. И не дни только соблюдал Павел, но соблюдал и другие заповеди закона; а между тем он взывает к галатам:«Вот, я, Павел, говорю вам: если вы обрезываетесь, не будет вам никакой пользы от Христа»(Гал.5:2).'
          cn: 他不仅遵守日子，也遵守地方，因为他急切地不仅要赶到五旬节，也要在耶路撒冷度过这个节日。蒙福的保罗，你在做什么？耶路撒冷已被摧毁，圣中之圣已按上帝的旨意荒废，先前的规条已停止，你自己向加拉太人呼喊说：「你们这些靠律法称义的人啊，……已从恩典中堕落了」（加拉太书 5:4）；为何你又把我们带回律法的奴役之下呢？查明保罗是否自相矛盾，并非小事。保罗不仅遵守日子，还遵守律法的其他诫命；然而他却向加拉太人呼喊说：「看哪，我保罗告诉你们：若你们受割礼，基督对你们就毫无益处了」（加拉太书 5:2）。
      - type: paragraph
        text:
          ru: Так, тот самый Павел, который говорит:«Если вы обрезываетесь, не будет вам никакой пользы от Христа», сам обрезал, как известно, Тимофея. Нашел, говорится в Писании, Павел в Листрах некоторого юношу,«которого мать была Иудеянка уверовавшая, а отец Еллин,... и... обрезал его», потому что не хотел посылать необрезанного учителем (Деян.16:1, 3). Что делаешь ты, блаженный Павел? Словом уничтожаешь обрезание, а делом снова поддерживаешь его? Не поддерживаю, говорит он, но уничтожаю его делами. Тимофей был сын жены иудейской верной, а отцом имел эллина, из рода необрезанных. Но так как Павел намеревался послать его учителем к иудеям, то не хотел посылать его необрезанным, чтобы с самого начала не заградить дверей учению. Таким образом, пролагая путь к уничтожению обрезания и открывая путь учению Тимофея, он совершил над ним обрезание, чтобы уничтожить обрезание. Поэтому он и говорит:«Для Иудеев я был как Иудей»(1Кор.9:20). Не для того Павел сказал это, чтобы быть иудеем, а чтобы убедить остававшихся иудеями не быть больше иудеями. Потому он и обрезал Тимофея, чтобы уничтожить обрезание. Итак, обрезанием он воспользовался против обрезания. И Тимофей принял обрезание для того, чтобы он мог быть принят иудеями, и чтобы, пришедши, мало-помалу отклонить их от соблюдения обрезания. Видишь ли, для чего Павел соблюдал и Пятидесятницу, и обрезание? Хотите ли, я покажу вам, как он соблюдал и другие постановления закона? Слушайте внимательно.
          cn: 如此，那同一位保罗，他曾说：「如果你们受割礼，基督就于你们无益了」，他自己却为提摩太行了割礼，这众人皆知。经上说，保罗在路司得遇见一个少年人，「他母亲是信主的犹太妇人，他父亲却是希腊人……保罗就给他行了割礼」，因为他不愿差遣一个未受割礼的人作教师（使徒行传 16:1，3）。蒙福的保罗，祢在做什么呢？祢在言语上废除割礼，却在行动上又维护它吗？他说，我并非维护它，而是以行动废除它。提摩太的母亲是忠信的犹太妇人，而他的父亲却是希腊人，一个未受割礼之人。但由于保罗打算差遣他作犹太人的教师，就不愿差遣他一个未受割礼之人，以免从一开始就堵塞了教训的门路。如此一来，为了开辟废除割礼的道路，并为提摩太的教训开启门径，他就给他行了割礼，为的是要废除割礼。所以他才说：「向犹太人，我就作犹太人」（哥林多前书 9:20）。保罗说这话，并非为了自己要作犹太人，而是为了要说服那些仍是犹太人的人，不再作犹太人。正因为如此，他才给提摩太行了割礼，为的是要废除割礼。所以，他以割礼反击割礼。提摩太接受割礼，是为了能被犹太人接纳，并且，好让他到来之后，能一点点地使他们偏离遵守割礼。你们明白了吗，为何保罗既遵守五旬节，又遵守割礼？你们想，我给你们展示他如何遵守律法的其他规定吗？请仔细聆听。
      - type: paragraph
        text:
          ru: 'Пришел он некогда в Иерусалим, и апостолы, увидев его, сказали ему:«Видишь, братПавел,сколько тысяч уверовавших Иудеев сошедшихся: и все они ревнители закона. А о тебе наслышались они, что ты всех Иудеев, живущих между язычниками, учишь отступлению от Моисея, говоря, чтобы они не обрезывали детей своих и не поступали по обычаям. Итак что же?... Сделай же, что мы скажем тебе: есть у нас четыре человека, имеющие на себе обет. Взяв их, очистись с ними, и возьми на себя издержки на жертву за них, чтобы остригли себе голову, и узнают все, что слышанное ими о тебе несправедливо, но что и сам ты продолжаешь соблюдать закон»(Деян.21:20–24). Видите ли удивительное снисхождение? Он соблюдает времена, чтобы уничтожить соблюдение времен; совершает обрезание, чтобы прекратить обрезание; приносит жертву, чтобы уничтожить жертвоприношение. А что действительно для этого он так поступал, послушай его самого:«Для подзаконных был как подзаконный, чтобы приобрести подзаконных; будучи свободен от всех, я всем поработил себя, дабы больше приобрести»(1Кор.9:20, 19). А поступал так Павел, подражая своему Господу. Как Тот,«будучи образом Божиим, не почитал хищением быть равным Богу; но уничижил Себя Самого, приняв образ раба»(Флп.2:6–7); так и этот, быв свободен от всех, поработил себя всем, чтобы приобрести всех. Господь, принявши наше естество, сделался рабом, чтобы рабов сделать свободными:«Наклонил Он небеса и сошел»(Пс.17:10), чтобы пребывающих долу возвести на Небо.«Наклонил... небеса»; не сказано: «оставил небеса и сошел», но«наклонил», чтобы для тебя сделать более легким восход на небеса. Ему по возможности подражал и Павел, почему и говорил:«Подражайте мне, как я Христу»(1Кор.4:16). А как ты, блаженный Павел, сделался подражателем Христу? Как? Так, что я ни в чем не ищу своей пользы, но пользы многих, чтобы они спаслись, и«будучи свободен от всех, я всем поработил себя». Подлинно, нет ничего лучше этого порабощения, потому что оно доставляет свободу другим. Павел был духовный рыбарь:«Я сделаю вас, – сказал Господь, –ловцами человеков»(Мф.4:19), потому он и поступал так. И рыболовы, увидев, что рыба хватается за уду, не тотчас вытаскивают ее, но, ослабив, отпускают ее на некоторое расстояние, ожидая, пока крюк хорошо вонзится, чтобы таким образом вернее вытащить добычу; так поступали тогда и апостолы: они закидывали словесную уду учения в душу иудеев; эти напрасно противодействовали, держась обрезания, праздников, соблюдения времен, жертвоприношений, стрижений и прочего тому подобного; апостолы всюду следовали за ними и не отступали. Ты, говорит, требуешь обрезания, я не противлюсь, но последую тебе; ты хочешь жертвоприношения, я приношу жертву; ты желаешь, чтобы я, оставивши свой образ жизни, остригся, я готов исполнить это требование; ты повелеваешь мне соблюдать Пятидесятницу, и в этом я не противоречу; куда бы ты ни повел меня, я следую и уступаю, ожидая, пока уда слова углубится в тебя так, чтобы вернее можно было отвлечь весь народ ваш от древнего служения и образа жизни; для этого я и пришел из Ефеса в Иерусалим. Видишь ли, сколько Павел уступал в словесной ловле рыб? Видишь ли, как апостолы соблюдали времена, соглашались на обрезание и участвовали в жертвоприношениях не для того, чтобы возвратиться к древнему образу жизни, но чтобы привязанных к образам привести к истине? Сидящий на высоте, если постоянно будет оставаться на высоте, то никогда не может поднять лежащего внизу; но должно наперед тому спуститься, чтобы потом возвысился этот. Поэтому и апостолы нисходили с высоты евангельского образа жизни, чтобы возвести иудеев от низости иудейского образа жизни на эту высоту.'
          cn: '他曾一度来到耶路撒冷，门徒们看见他，就对他说：「保罗弟兄，你看，有多少成千上万的信主的犹太人聚集在这里；他们都对律法是热心的。而他们都听说，你教导一切住在外邦人中的犹太人背弃摩西，说他们不应给自己的孩子行割礼，也不应遵行（犹太人的）规矩。那么该怎么办呢？……你就照我们所说的去做吧：我们这里有四个人许了愿。你带他们一起去洁净，并承担他们献祭的费用，好叫他们剃头。这样众人就会知道，他们所听见的关于你的事都是不实的，你本人也仍在遵守律法。」(使徒行传 21:20-24) 你们看见这令人惊叹的迁就了吗？他遵守节期，是为了废除对节期的遵守；他行割礼，是为了终止割礼；他献祭，是为了废除献祭。而他确实是为此目的才如此行事，请听他自己所说的：「在律法之下的人，我就像在律法之下的人一样，为要赢得在律法之下的人；我虽是自由的，不受任何人的辖制，却自愿作了众人的仆人，为要多得人。」(哥林多前书 9:20，19)


            保罗如此行事，是效法他的主。正如祂，「虽具有上帝的形像，却不认为与上帝同等是强夺的；反倒虚己，取了奴仆的形像」(腓立比书 2:6-7)；同样，这位（保罗）虽不受任何人的辖制，却自愿作了众人的仆人，为要赢得所有人。主，祂取了我们的人性，成了奴仆，是为了使奴仆得以自由：「祂弯下诸天，降临」(诗篇 18:9)，为要将那些居于下界的人提升到天上。「祂弯下……诸天」；没有说「祂离开了诸天而降临」，而是说「祂弯下」，是为了使你升入诸天变得更容易。


            保罗也尽其可能地效法祂，因此也说：「你们效法我，如同我效法基督一样」(哥林多前书 4:16)。那么，你，蒙福的保罗啊，是如何成为基督的效法者的呢？如何呢？是这样：我凡事不求自己的益处，只求众人的益处，为使他们可以得救，并且「我虽是自由的，不受任何人的辖制，却自愿作了众人的仆人」。确实，没有比这种（自愿的）奴役更好的了，因为它为他人带来自由。保罗是属灵的渔夫：「我将使你们成为——主说——得人的渔夫」(马太福音 4:19)，因此他才如此行事。


            渔夫们看见鱼上钩后，不会立刻拉上来，而是松开线，让它游开一段距离，等待鱼钩牢固地刺入，以便更可靠地捕获猎物；当时使徒们也是如此行事：他们将教导这言语之钩投入犹太人的灵魂深处；这些人徒然地抵制，他们紧守割礼、节期、遵守时间、献祭、剃头以及其他类似的事物；使徒们则处处跟随他们，毫不退缩。他说，你要求割礼，我不反对，反而顺从你；你想要献祭，我就献祭；你希望我放弃自己的生活方式，剃头，我准备好满足这个要求；你命令我遵守五旬节，在这方面我也不抵触；无论你把我带到哪里，我都跟随并迁就，直到言语的钩在你心中扎得更深，这样才能更可靠地将你们整个民族从古老的敬拜和生活方式中引开；为此，我才从以弗所来到耶路撒冷。


            你看，保罗在言语的捕鱼中迁就了多少？你看，使徒们如何遵守节期，同意割礼，并参与献祭，这并不是为了回到古老的生活方式，而是为了将那些依恋（律法）表象的人引向真理？坐在高处的人，如果一直停留在高处，就永远无法举起躺在低处的人；而是坐在高处的人必须先下来，然后躺在低处的人才能被提升。因此，使徒们也从福音生活方式的高度降下，为要将犹太人从犹太生活方式的低处提升到这高度。'
      - type: paragraph
        initial:
          ru: '5.'
          cn: '5.'
        text:
          ru: 'Отсюда видно, что соблюдение времен и все прочее совершалось с пользой и во благо. Посмотрим же теперь, почему книга Деяний Апостольских читается во время Пятидесятницы. Все это мы предложили вам для того, чтобы вы, когда увидите соблюдение времен, не подумали, будто апостолы страдали иудейским образом мыслей. Но слушайте внимательно, увещеваю вас: то, о чем будет сказано, составляет немаловажный предмет исследования. В день Креста мы читаем все, относящееся ко Кресту; в Великую Субботу опять о том, что Господь наш был предан, распят, умер по плоти, погребен; почему же Деяния Апостольские мы читаем не после Пятидесятницы, когда они происходили и начались? Я знаю, что многие не знают этого; поэтому нужно подтвердить это из самой книги Деяний, дабы вы знали, что Деяния Апостольские начались не с Пятидесятницей, но во время, следовавшее за Пятидесятницей. Поэтому справедливо кто-нибудь может спросить: почему установлено читать о Кресте в день Креста и страдания, а Деяния Апостольские мы читаем не в те самые дни и не в то время, в которое они совершались, но предупреждаем это время? Не тотчас после того, как воскрес Христос, апостолы стали совершать чудеса, но сорок дней Он пребывал с ними на земле. Почему – сорок дней, это мы объясним в другое время; теперь же обратимся к предмету нашей речи и заметим, что Христос не тотчас по воскресении вознесся на Небо, но сорок дней пребывал с учениками на земле, и не просто пребывал, но и обращался с ними, принимал участие в их трапезе, беседовал с ними, и по прошествии сорока дней восшел к Отцу на небеса; но и не тогда они стали творить чудеса, а прошли еще другие десять дней, и уже по исполнении Пятидесятницы послан был им Дух Святой; тогда, приняв огненные языки, они и начали творить чудеса. Все это, возлюбленные, мы подтвердим вам из Писаний; именно, – что Он пребывал с ними сорок дней, что Дух Святой нисшел после Пятидесятницы, что тогда апостолы приняли огненные языки, что с того времени они и начали совершать знамения. Кто же говорит о всем этом? Ученик Павла, досточтимый и великий Лука, начавший речь свою так:«Первую книгу написал я к тебе, Феофил, о всем, что Иисус делал и чему учил от начала до того дня, в который Он вознесся, дав Святым Духом повеления Апостолам, которых Он избрал, которым и явил Себя живым, по страдании Своем, со многими верными доказательствами, в продолжение сорока дней являясь им и говоря о Царствии Божием. И, собрав их, Он повелел им: не отлучайтесь из Иерусалима»(Деян.1:1–4). Видишь ли, что Господь по Воскресении пребывал сорок дней на земле, говорил о Царстве Божием и общался с апостолами? Видишь ли, что Он принимал участие и в их трапезе?«И... повелел им, – говорит, –не отлучайтесь из Иерусалима, но ждите обещанного от Отца, о чем вы слышали от Меня, ибо Иоанн крестил водою, а вы, через несколько дней после сего, будете крещены Духом Святым»(Деян.1:4–5). Об этом говорил Спаситель в течение сорока дней.«Посему они, сойдясь, спрашивали Его, говоря: не в сие ли время, Господи, восстановляешь Ты царство Израилю? Он же сказал им: не ваше дело знать времена или сроки,  которые Отец положил в Своей власти, но вы примете силу, когда сойдет на вас Дух Святый; и будете Мне свидетелями в Иерусалиме и во всей Иудее и Самарии и даже до края земли. Сказав сие, Он поднялся в глазах их, и облако взяло Его из вида их»(Деян.1:6–9). Видишь, как Христос пребывал с ними на земле сорок дней и вознесся на небеса. Но посмотрим, в Пятидесятницу ли послан был Дух Святой.«При наступлении, –  говорится в Писании, –дня Пятидесятницы,... внезапно сделался шум с неба, как бы от несущегося сильного ветра, и... явились им разделяющиеся языки, как бы огненные, и почили по одному на каждом из них»(Деян.2:1–3). Видите ли точное указание на то, что Христос оставался на земле сорок дней и что апостолы еще не творили чудес? И как могли они творить чудеса, не получив еще благодати Святого и Животворящего Духа?'
          cn: '由此可见，遵守时节以及其他一切事都是有益且美好的。那么，我们现在来看看为何《使徒行传》会在五旬节期间诵读。我们向你们提出这一切，是为了让你们在看到遵守时节时，不要以为使徒们抱有犹太人的思想方式。但我劝诫你们仔细聆听：接下来要讲的，是一个非常重要的探讨主题。在十字架日，我们诵读一切与十字架有关的内容；在大周六，我们再次诵读关于我们的上主被出卖、被钉十字架、按肉身而死、被埋葬的事；那么，为何我们不是在五旬节之后，也就是它们发生并开始的时候，诵读《使徒行传》呢？我知道许多人不知道这一点；因此有必要从《使徒行传》本身来证实，好让你们知道《使徒行传》并非始于五旬节，而是在五旬节之后的一段时间。因此，有人可以合理地问：为何在十字架日和受难日诵读与十字架相关的内容是既定惯例，而《使徒行传》我们却不是在它们发生的那些日子和时间诵读，而是提前了这一时间呢？


            基督复活之后，使徒们并非立刻就开始行神迹，而是祂在地上与他们同住了四十天。为何是四十天，我们会在其他时候解释；现在，我们回到我们讲话的主题，并注意基督并非复活后立刻升天，而是祂在地上与门徒同住了四十天，并非只是简单地同住，祂还与他们来往，参与他们的筵席，与他们交谈，在四十天过后才升到天父那里；但他们也并非那时就开始行神迹，而是又过去了十天，待五旬节期满之后，圣灵才被差遣给他们；那时，他们领受了火一样的舌头，才开始行神迹。这一切，蒙爱的弟兄们，我们将从圣经中向你们证实；确切地说，祂与他们同住了四十天，圣灵在五旬节之后降临，那时使徒们领受了火一样的舌头，并从那时起开始行神迹。那么，这一切是谁说的呢？是保罗的门徒，可敬又伟大的路加，他这样开始自己的叙述：«提阿非罗啊，我已经作了前书，论到耶稣开头一切所行所教训的，直到祂借着圣灵吩咐所拣选的使徒，以后被接上升的日子为止。祂受害之后，用许多的凭据将自己活活地显给使徒看，四十天之久向他们显现，讲说上帝的国。耶稣和他们聚集的时候，嘱咐他们说：不要离开耶路撒冷»(使徒行传 1:1-4)。


            你是否看到，上主在复活后在地上停留了四十天，谈论上帝的国，并与使徒们交往？你是否看到，祂甚至参与了他们的筵席？«祂又说，不要离开耶路撒冷，但要等候父所应许的，就是你们听见我说过的。约翰是用水施洗，但过了不多几日，你们要受圣灵的洗»(使徒行传 1:4-5)。救主在四十天内谈论了这些事。«他们聚集的时候，问耶稣说：主啊，你复兴以色列国就在这时候吗？耶稣对他们说：父凭着自己的权柄所定的时候、日期，不是你们可以知道的。但圣灵降临在你们身上，你们就必得着能力；并要在耶路撒冷、犹太全地和撒马利亚，直到地极，作我的见证。说了这话，他们正看的时候，祂就被取上升，有一朵云彩把祂接去，他们就看不见祂了»(使徒行传 1:6-9)。你看，基督如何在地上与他们同住了四十天，并升到天上。但我们来看看，圣灵是否在五旬节被差遣。«五旬节到了，门徒都聚集在一处。忽然，从天上有响声下来，好像一阵大风吹过，充满了他们所坐的屋子；又有舌头如火焰显现出来，分开落在他们各人头上»(使徒行传 2:1-3)。你们是否看到明确的指示，表明基督在地上停留了四十天，而使徒们当时尚未行神迹？他们又怎能在尚未领受圣而施生命的圣灵之恩典时就行神迹呢？'
      - type: paragraph
        text:
          ru: 'Видите ли, что Иисус вознесся на Небо после сорока дней? Видите ли еще, что через десять дней после того апостолы стали творить чудеса? Потому что по исполнении дней Пятидесятницы ниспослан был Дух Святой. Теперь остается решить, почему Деяния Апостольские читаются в Пятидесятницу. Если бы апостолы тогда начали совершать знамения, т.е. по Воскресении Господа, то тогда и следовало бы читать эту книгу: как относящееся ко Кресту мы читаем в день Креста, равным образом относящееся к Воскресению – в день Воскресения, и в каждый праздник читаем относящееся к этому празднику, так следовало бы о чудесах апостольских читать в дни апостольских знамений.'
          cn: 你们难道没看到耶稣在四十天之后升天了吗？你们难道没看到，并且在那之后十天，使徒们开始行奇迹了吗？因为五旬节期满之时，圣灵被降下。现在需要解决的是，为何《使徒行传》在五旬节诵读。如果使徒们那时就开始施行神迹，即在主的复活之后，那么就应当诵读这本书：正如我们会在十字架日诵读与十字架相关的内容，同样地，在复活日诵读与复活相关的内容，在每一个节日，我们都会诵读与该节日相关的内容，同样地，关于使徒们的奇迹，也应当在使徒们施行神迹的日子诵读。
      - type: paragraph
        initial:
          ru: '6.'
          cn: '6.'
        text:
          ru: 'Почему же мы не тогда читаем о них, но тотчас после Креста и Воскресения? Всю причину этого выслушайте со вниманием. Тотчас после Креста мы возвещаем Воскресение Христово, а доказательством Воскресения служат знамения апостольские, знамения же апостольские излагаются в этой книге (Деяний). Таким образом, чем особенно подтверждается истина Воскресения Господня, то отцы установили читать тотчас после Креста и живоносного Воскресения. Итак, для того, возлюбленные, тотчас после Креста и Воскресения мы читаем о знамениях апостольских, чтобы нам иметь ясное и несомненное доказательство Воскресения. Ты не видел Самого Воскресшего глазами телесными, но видишь Его Воскресшего очами веры; этими глазами ты не видел Самого Воскресшего, но при помощи тех чудес увидишь Его Воскресшего. Явление знамений руководит тебя к созерцанию верой. И то, что именем Его совершались знамения, было лучшим и яснейшим доказательством (Воскресения), нежели явление Самого Воскресшего. Хочешь ли узнать, как это лучше подтверждает истину Воскресения, чем если бы Он Сам явился перед глазами всех людей? Слушайте внимательно, потому что многие спрашивают об этом и говорят: почему Господь, воскресши, не явился тотчас иудеям? Это вопрос излишний и напрасный. Если бы была надежда обратить иудеев к вере, то Он не преминул бы по Воскресении явиться всем. А что не было надежды, чтобы Он, явившись им по Воскресении, обратил их к вере, это видно из события с Лазарем. Воскресив этого четверодневного мертвеца, смердевшего и истлевавшего, и повелев ему, связанному повязками, выйти перед глазами всех, Он не только не обратил их к вере, но и возбудил ненависть, потому что, собравшись, они хотели даже убить Его за это (Ин.12:10). Если же тогда, когда Он воскресил другого, они не уверовали, то, если бы Он, воскресив Себя, явился им, не пришли ли бы они опять в неистовство против Него? И хотя они не могли бы иметь никакого успеха, но показали бы свое нечестие покушением.'
          cn: 为什么我们不是那时候读到它们，而是在十字架和复活之后立即读到它们呢？这全部的原因，请你们 внимательно 聆听。十字架之后，我们立即宣告基督的复活；而复活的证据就是使徒的神迹，这些使徒的神迹则记载在这本书（使徒行传）中。因此，教父们规定，凡是特别证实上主复活真理的，都在十字架和赐生命的复活之后立即诵读。那么，蒙爱者们，为了让我们拥有清晰而确凿的复活证据，我们在十字架和复活之后立即诵读使徒的神迹。你们没有用肉身的眼睛看见复活的祂本体，但却用信心的眼睛看见复活的祂；你们用这些眼睛没有看见复活的祂本体，但借着那些神迹，你们将看见复活的祂。神迹的显现引导你们以信心去默观。并且，奉祂的名所行的神迹，是比祂复活的本体显现，更好、更清楚的（复活）证据。你们想知道，这如何能比祂亲自显现在众人眼前，更好地证实复活的真理吗？请你们仔细聆听，因为许多人对此提出疑问并说：为什么上主复活后，没有立即向犹太人显现呢？这是一个多余且徒劳的问题。如果有希望使犹太人归信，祂复活后必不会错过向所有人显现。而祂复活后向他们显现，也无法使他们归信，这一无希望的情况，从拉撒路的事件中可见一斑。祂使这个死了四天、已经发臭腐烂的人复活，并吩咐那被裹布捆绑的人在众人眼前出来，祂不仅没有使他们归信，反而激起了他们的仇恨，因为他们聚集在一起，甚至想为此杀害祂（约翰福音 12:10）。如果那时，当祂使另一个人复活时，他们都没有相信，那么，如果祂使自己复活后向他们显现，他们难道不会再次对祂狂怒吗？即使他们不会有任何成功，但也会通过企图（杀害祂）来显露他们的不敬虔。
      - type: paragraph
        text:
          ru: 'Поэтому, желая избавить их от излишнего неистовства, Он сокрыл Себя, потому что сделал бы их еще более достойными наказания, если бы явился им после крестных страданий. Потому, щадя их, Он и сокрыл Себя от их взоров, а показал явлением знамений, потому что слышать слова Петра:«Во имя Иисуса Христа Назорея встань и ходи»(Деян.3:6), значило не меньше, как и видеть Самого Воскресшего. А что действительно это есть величайшее доказательство Воскресения и удобнее приводит к вере, чем последнее, и что явление знамений, совершаемых во имя Его, лучше могло убедить умы людей, нежели лицезрение Самого Воскресшего, это видно из следующего: Христос воскрес и явился ученикам; но и между ними нашелся некто неверующий, Фома называемый Дидим, и нужно было ему вложить руки в язвы гвоздиные, нужно было и осязать ребра Его (Ин.20:24–25). Если же ученик, обращавшийся с Ним три года, участвовавший в Трапезе Господней, видевший величайшие знамения и чудеса, слушавший беседы Господа, увидев Его Воскресшего, не прежде уверовал, как осмотрев язвы гвоздиные и раны от копья, то скажи мне, могла ли бы уверовать вселенная, если бы увидела Его Воскресшего? Кто может сказать это? И не только с этой, но и с другой стороны мы покажем, что знамения убеждали больше, чем лицезрение Воскресшего. Народ, услышав Петра, сказавшего хромому:«Во имя Иисуса Христа Назорея встань и ходи», уверовал во Христа в числе трех тысяч, а потом в числе пяти тысяч мужей; ученик же, увидев Воскресшего, не веровал. Видишь ли, как первое гораздо удобнее приводило к вере в Воскресение? Увидев Воскресшего, и собственный ученик Его не веровал, а увидев знамения, и враги уверовали. Так, последнее было действительнее и яснее первого, и более располагало и уверяло их в Воскресении.'
          cn: 因此，为了使他们免于过度的狂怒，他便隐藏了自己，因为如果在受难之后向他们显现，便会使他们更配受刑罚。因此，怜悯他们，他便隐藏了自己，不让他们看见，却藉着显明神迹来启示；因为听见彼得的话：「奉拿撒勒人耶稣基督的名，你起来行走！」（使徒行传 3:6），其意义不亚于亲眼看见复活者祂自己。至于这确实是复活最伟大的证据，比后者更容易引人相信，以及奉他的名所行神迹的显明，比亲眼看见复活者祂自己更能使人心信服，这可从以下的事实看出：基督复活并向门徒显现；但在他们当中仍有一位不信的人，称为低土马的多马，他需要把手伸进钉痕里，也需要触摸他的肋旁（约翰福音 20:24-25）。如果一个与他朝夕相处三年之久的门徒，曾参与主的晚餐，曾目睹最伟大的神迹奇事，曾聆听主的教诲，在看见他复活后，若非察看钉痕和枪伤，便不相信，那么请告诉我，若是世人看见他复活，他们能相信吗？谁能如此说呢？不仅如此，我们还将从另一方面指出，神迹比亲眼看见复活者更能使人信服。百姓听见彼得对瘸腿的人说：「奉拿撒勒人耶稣基督的名，你起来行走！」，便有三千人信了基督，后来又有五千人相信；而门徒看见复活者，却不相信。你看见了吗，前者是如何更容易地引人相信复活的？看见复活者，连他自己的门徒也不相信，而看见神迹，连仇敌也相信了。因此，后者比前者更有效、更清晰，并且更能使他们倾向并确信复活。
      - type: paragraph
        text:
          ru: 'Но что я говорю о Фоме? И прочие ученики не уверовали при первом видении. Выслушай об этом внимательно, но не осуждай их, возлюбленный: если Христос не осудил их, то не осуждай их и ты. Ученики увидели дело дивное и необычайное, увидели воскресшим Перворожденного из мертвых; а такие величайшие чудеса обыкновенно сначала поражают, пока со временем не утвердятся в душах верующих; то же было тогда и с учениками. Когда воскресший из мертвых Христос сказал им:«Мир вам», тогда«они, – говорит евангелист, –смутившись и испугавшись, подумали, что видят духа. Но Он сказал им: что смущаетесь?»И потом, показав им руки и ноги,«они от радости еще не верили и дивились, Он сказал им: есть ли у вас здесь какая пища?», желая через это уверить их в Воскресении (Лук.24:36–41). Тебя не убеждают, говорит Он, ни ребра, ни раны; пусть же по крайней мере убедит трапеза.'
          cn: 但我何必说多马呢？而其余的门徒在初次看见时也没有相信。关于此事，请你仔细聆听，但不要论断他们，挚爱的：如果基督没有论断他们，那么你也不要论断他们。门徒们看见了一件奇妙而超凡的事，他们看见了从死里首先复活的那一位；而这样最伟大的神迹通常一开始会使人震惊，直到随着时间在信者的灵魂中得以确立；那时门徒们也是如此。当从死里复活的基督对他们说：「愿你们平安！」那时，「他们，」福音书作者说，「惊慌害怕，以为所看见的是个魂。但祂对他们说：你们为什么愁烦？」接着，祂向他们展示了手和脚，而「他们因欢喜而仍不相信，并且稀奇，祂对他们说：你们这里有什么吃的没有？」，祂希望借此使他们相信复活（路加福音 24:36-41）。「肋骨和伤口都不能使你信服，」祂说，「那么至少让这餐饭来使你信服吧。」
      - type: paragraph
        initial:
          ru: '7.'
          cn: '7.'
        text:
          ru: 'А чтобы тебе вернее узнать, что Он для того сказал:«Есть ли у вас здесь какая пища», дабы они не подумали, что перед ними призрак, или дух, или привидение, но истинное и действительное Воскресение, послушай, как Петр этим доказывает Воскресение. Сказав:«Сего Бог воскресил,... дал Ему являться... нам, свидетелям, предъизбранным от Бога», он потом, приводя доказательство Воскресения, прибавил:«которые с Ним ели и пили»(Деян.10:40–41). Поэтому и в другом месте Христос, воскресив мертвую и желая уверить в воскресении, сказал:«Дадите ей есть»(Мк.5:43). Итак, когда ты услышишь, что Он«явил Себя живым,... в продолжении сорока дней являясь им, и... ел с ними»(Деян.1:3;Лк.24:43), то знай причину этого вкушения пищи, именно: Он вкушал пищу, не имея сам в ней нужды, но, желая исправить немощь учеников. Отсюда видно, что чудеса и знамения апостолов были величайшим доказательством Воскресения (Христова). Почему и сам Он говорит:«Истинно, истинно говорю вам: верующий в Меня, дела, которые творю Я, и он сотворит, и больше сих сотворит»(Ин.14:12). Так как предшествовавший Крест соблазнял весьма многих, то и нужны были после того большие знамения. Если бы умерший Христос остался в смерти и во гробе и не воскрес, – как говорят иудеи, – и не восшел на небеса, то не только не совершались бы большие знамения после Креста, но и прежде совершенные должны были бы потерять силу. Слушайте меня здесь со вниманием; то, что говорю я, служит доказательством несомненности Воскресения; поэтому я повторю сказанное. Христос прежде творил чудеса, воскрешал мертвых, очищал прокаженных, изгонял бесов; потом Он был распят и, как говорят беззаконные иудеи, не воскрес из мертвых. Что же мы скажем им? Следующее: если Он не воскрес, то как после того именем Его совершаемы были большие знамения? Никто из живущих, когда умирал, по смерти не совершал больших знамений, а здесь после этого были чудеса большие и по образу совершения, и по своему свойству. Были большие по свойству, потому что никогда тень Христова не воскрешала мертвых, а тени апостолов совершили много такого. Были знамения большие и по образу совершения, потому что тогда Он Сам повелением совершал чудеса, а после Креста служители Его, призывая досточтимое и святое имя Его, совершали большие и высшие дела, в которых больше и славнее проявилась сила Его. В самом деле, гораздо важнее, когда другой творил чудеса, призывая имя Его, чем когда Он Сам совершал то же Своим повелением. Видишь ли, возлюбленный, большие и по свойству, и по образу совершения знамения, совершенные апостолами после Воскресения Христова?'
          cn: 而为了让你更确切地知道，祂为此说：「你们这里有什么吃的没有？」，是为了免得他们以为在他们面前的是幽灵、魂或幻象，而是真实且实在的复活，请听彼得如何以此证明复活。他说：「这位上帝使祂复活，……使祂显现给……我们这些上帝预先拣选的见证人看，」他随后，在提出复活的证据时，又补充说：「我们与祂同吃同喝。」（使徒行传 10:40-41）因此，在另一个地方，基督在使一个死者复活并希望让人确信复活时，说：「给她吃的。」（马可福音 5:43）那么，当你听说祂「显明自己是活着的，……在四十天之久向他们显现，……并与他们同吃」时（使徒行传 1:3，路加福音 24:43），你便要知道祂进食的原因，即：祂进食并非自己有此需要，而是为了矫正门徒的软弱。从此可见，使徒们的奇迹和神迹是（基督）复活的最伟大证据。因此祂自己也说：「我实实在在地告诉你们：信我的人，我所做的事，他也要做，并且要做比这更大的事。」（约翰福音 14:12）由于之前的十字架使许多人跌倒，那么之后就需要更大的神迹。倘若已死的基督留在死亡和坟墓中，没有复活 — 就像犹太人所说的那样 — 也没有升天，那么十字架之后不仅不会有更大的神迹被施行，而且之前所行的也必将失去效力。在这里请注意听我讲；我所说的，是复活无疑的证据；因此我将重复之前所讲的。基督以前行奇迹，使死人复活，洁净麻风病人，赶逐魔鬼；后来祂被钉上十字架，而且，正如那些悖逆的犹太人所说，祂没有从死里复活。那么我们对他们说什么呢？以下这些：倘若祂没有复活，那么之后怎会凭着祂的名施行更大的神迹呢？活着的人中，没有人死了之后还能施行更大的神迹，而在这里，这之后却有了更大的奇迹，无论是在施行方式上，还是在其性质上。在性质上更大，因为基督的影儿从未使死人复活，而使徒们的影儿却成就了许多这样的事。神迹在施行方式上也更大，因为那时祂自己是凭着命令施行奇迹，而十字架之后，祂的仆役们，呼求祂可敬畏且神圣的名，施行了更大且更高的事迹，在其中祂的权能得到了更显著、更荣耀的彰显。事实上，当别人呼求祂的名行奇迹时，这要比祂自己凭着祂的命令施行同样的事重要得多。你看到了吗，亲爱的，基督复活之后，由使徒们所行的，那些无论在性质上还是在施行方式上都更大的神迹？
      - type: paragraph
        text:
          ru: 'Итак, они – несомненное доказательство Воскресения. Что говорил я, то опять повторю: если бы Христос, умерши, не воскрес, то и знамения должны были бы окончиться и прекратиться; а теперь они не только не прекратились, но и происходили после этого важнейшие и славнейшие. Если бы Христос не воскрес, то другие именем Его не совершали бы таких знамений, потому что одна и та же сила совершала чудеса и прежде Креста, и после Креста, только прежде Креста – через Самого (Христа), а после – через учеников Его. А чтобы доказательство Воскресения было яснее и славнее, для этого после Креста были знамения большие и высшие. Но откуда известно, – скажет неверный, – что тогда были знамения? А откуда известно, что Христос был распят? Из Божественных Писаний, скажешь. Точно, из Священных Писаний известно, что тогда были знамения и что Христос был распят; они повествуют о том и другом. Если же противник скажет, что апостолы не совершали знамений, то еще больше покажет их силу и Божественную благодать (тем), что они без знамений обратили к благочестию такую вселенную. Это – величайшее знамение и дивное чудо, что люди бедные, ничего не имевшие, незнатные, неученые, простые, презираемые и числом двенадцать, могли без знамений привлечь к себе столько городов, племен, народов, царей, властителей, философов, риторов и, так сказать, всю землю. Хочешь ли видеть знамения, совершающиеся и ныне? Я докажу тебе знамения еще большие прежних: не одного мертвого воскрешаемого, не одного слепого прозирающего, но всю землю, свергнувшую мрак заблуждения; не одного прокаженного очищаемого, но столько народов, исцелившихся от греховной проказы и очистившихся баней пакибытия. Чего еще больше этих знамений ищешь ты, человек, видя такую перемену вселенной, происшедшую внезапно?'
          cn: 所以，它们是复活无可置疑的证据。我曾说过的话，现在再重复一遍：如果基督死了而没有复活，那么神迹也必将终结和止息；然而如今它们不仅没有止息，反而在此之后发生了更重要、更荣耀的神迹。如果基督没有复活，那么其他人就无法奉祂的名行这样的神迹，因为是同一股力量在十字架之前和之后行了神迹，只是在十字架之前——是借着祂（基督）自己，而在之后——是借着祂的门徒们。为了使复活的证据更清晰、更荣耀，为此，在十字架之后出现了更大、更高的神迹。但从何而知——不信者会说——那时有神迹呢？那又从何而知基督曾被钉十字架呢？你会说，是从神圣的经典中得知的。确实，从神圣的经典中可知那时有神迹，并且基督曾被钉十字架；它们讲述了这两者。如果对手说门徒们没有行神迹，那反而更显明了他们的力量和神圣的恩典，因为他们没有借着神迹就使如此广阔的世人归于敬虔。这是一个最伟大的神迹和奇妙的奇迹，竟然有十二个贫穷、一无所有、出身卑微、不学无术、单纯、受人鄙视的人，能够在没有神迹的情况下，吸引如此多的城市、部落、民族、君王、统治者、哲学家、修辞学家，以及，可以说，整个世界归向他们。你是否希望看到如今仍在发生的神迹？我将向你证明比以往更伟大的神迹：不是只有一个死人复活，不是只有一个瞎子重见光明，而是整个世界都已摆脱了谬误的黑暗；不是只有一个麻风病人得洁净，而是如此多的民族，从罪恶的麻风病中痊愈，并借着重生之洗而得以洁净。人啊，当你看到世界如此突然的改变时，你还在寻求比这些神迹更伟大的什么呢？
      - type: paragraph
        initial:
          ru: '8.'
          cn: '8.'
        text:
          ru: 'Хочешь ли знать, как Христос даровал прозрение вселенной? Прежде люди не считали дерева и камня деревом и камнем, а называли бесчувственные вещи богами: так они были ослеплены; теперь же они узнали, что – дерево и что – камень, и уверовали что – Бог, потому что одной верой созерцается это Бессмертное и Блаженное Существо. Хочешь ли видеть и другое знамение Воскресения? Ты увидишь его в душе учеников; и это знамение сделалось большим после Воскресения. Всем известно, что и тот, кто хорошо расположен к человеку при его жизни, по смерти его, может быть, и не воспоминает о нем, а кто не хорошо расположен к живому человеку и оставил его при жизни, тот тем более забывает о нем после смерти. Поэтому, никто из людей, оставив и покинув друга-учителя, при его жизни, не станет дорожить им после его смерти, особенно если за привязанность к нему увидит угрожающие ему бесчисленные опасности. Но вот, чего ни с кем не бывает, то произошло со Христом и апостолами: те, которые отреклись и отстали от Него при Его жизни, оставили Его, когда Он был взят, и разбежались, те после бесчисленных поношений и Креста стали так высоко почитать Его, что и души свои положили за исповедание и веру в Него. Если бы Христос, умерши, не воскрес, то как объяснить, что те, которые при жизни Его разбежались от угрожавшей опасности, по смерти Его подвергли себя за Него бесчисленным опасностям? Прочие все разбежались, а Петр даже отрекся от Него с клятвою трижды; но тот, кто отрекся от Него с клятвою трижды и устрашился угрозы простой служанки, по смерти Его, желая убедить нас самим делом, что он видел Самого Воскресшего, внезапно переменился так, что не устрашился целого народа, вошел в собрание иудеев и сказал, что Распятый и Погребенный воскрес из мертвых в третий день и восшел на небеса, и что он сам не боится никакого бедствия. Откуда же у него явилась такая смелость? Откуда более, как не от уверенности в Воскресении? Так как он видел Его, беседовал с Ним, слышал Его предсказания о будущем, то и подвергал себя опасности за Него, как за живого, и с такой смелостью решался на все бедствия и получил столь великую силу и столь великое дерзновение, что умер за Него и распят на кресте вниз головой. Итак, когда ты видишь, что совершаются большие знамения, и что ученики, прежде оставившие Его, стали питать большую привязанность к Нему и оказывают большее дерзновение, и во всех отношениях произошла блистательнейшая перемена обстоятельств и все пришло в надежное и отрадное состояние, то убедись самим опытом, что дела Христовы не продолжались только до Его смерти, но за смертью последовало Воскресение, и что Распятый живет и пребывает постоянно Неизменным Богом. Если бы Он не воскрес и не ожил, то ученики не совершали бы после того знамений больших, чем какие совершаемы были прежде Креста. Тогда и ученики оставили Его; а теперь притекает к Нему вся вселенная, и не только Петр, но и тысячи других, и еще больше после Петра: таких, которые не видали Его, предали за Него души свои, отдали свои головы на отсечение и претерпели бесчисленное множество бедствий, чтобы умереть, сохранив целой и неприкосновенной веру в Него. Каким же образом мертвый и пребывающий во гробе, – как говоришь ты, иудей, – явил во всех, бывших и после апостолов, такую силу и могущество, убедив их покланяться Ему одному и решиться претерпеть все и пострадать, чтобы не потерять веру в Него? Видишь ли во всем этом ясное доказательство Воскресения: в знамениях тогдашних и нынешних, в расположении учеников тогдашних и нынешних, в опасностях, которым подвергались верующие?'
          cn: '你可愿知，基督如何赐予全宇宙洞察力？从前，人不明辨木石之为木石，竟称无知之物为诸神：他们是如此的盲目；如今，他们明白了何为木、何为石，并信了何为上帝，因这不朽而福哉的存有，唯藉着信德才能得以默观。你可愿见复活的另一明证？你必在门徒的灵魂中见到它；而这明证，在复活之后变得更加卓著。


            众所周知，即便有人在他人活着时对其怀有善意，在其死后，或许也不再记念他；而那在他人活着时对其不怀善意，并离弃了他的人，在其死后，就更会将其遗忘。因此，没有人会在其良师益友生前离弃并抛弃他之后，又在其死后珍重他，尤其是当他看到，仅仅因为对他怀有情谊，就面临无数威胁自身的危险之时。然而，这绝无仅有之事，却发生在基督和使徒身上：那些在祂生前否认并远离祂的人，在祂被捕时离弃祂，四散奔逃；他们在经历无数的凌辱和十字架之后，竟如此崇敬祂，以至于为着对祂的认信和信德，甚至舍弃了自己的生命。若基督死了而未复活，那么如何解释，那些在祂生前因威胁而来的危险四散奔逃的人，竟在祂死后，为祂承受了无数的危险？


            其余的人都四散奔逃了，而伯多禄甚至三次起誓否认祂；然而，那三次起誓否认祂，并因一个普通婢女的威胁而恐惧的人，在祂死后，为了以实际行动说服我们他亲眼看到了复活的主，他突然改变，竟不惧怕全体民众，进入犹太人的会众中，宣称那被钉十字架并埋葬的，已于第三日从死者中复活，并升入天上，而且他自己不惧怕任何灾祸。那么，他从何处生出如此的胆量？除了对复活的确信之外，还能从何处呢？因为他见到了祂，与祂交谈，听到了祂对未来的预言，于是他为祂，如同为一位活着的人一般，甘冒危险，并以如此的胆量，决心承受一切苦难，获得了如此巨大的力量和如此伟大的勇气，以至于为祂而死，并倒钉十字架。


            那么，当你看到有伟大的明证被行出，并且那些先前离弃祂的门徒，开始对祂怀有更大的情谊，并展现出更大的勇气，而且在所有方面都发生了辉煌的转变，一切都进入了可靠而令人欣慰的状态时，你就当亲自体验，确信基督的作为并非只持续到祂的死亡，而是死亡之后紧随复活，并且那被钉十字架的，是活着的，并永远作为不变的上帝而存在。若祂没有复活并活过来，那么门徒就不会在之后行出比十字架之前更大的明证了。当时连门徒都离弃了祂；而如今，整个宇宙都归向祂，不仅是伯多禄，还有成千上万的其他人，甚至在伯多禄之后还有更多的人：那些未曾见过祂，却为祂舍弃了灵魂，献上自己的头颅被斩，并忍受了无数苦难，以至于宁死也要完整无损地保守对祂的信德。一个已死并留在坟墓里的人，——正如你，犹太人所说——又如何能够，在所有使徒时代及之后的人身上，显出如此的力量与权能，说服他们唯独敬拜祂，并决心承受一切苦难与磨难，以期不失去对祂的信德呢？在这一切中，你是否看到了复活的清晰明证：在当时和现在的明证中，在当时和现在门徒的意向中，以及信徒所承受的危险中？'
      - type: paragraph
        text:
          ru: 'Хочешь ли видеть, что и сами враги боялись Его силы и могущества, и тревожились гораздо больше после Креста? Послушай и об этом со вниманием.«Видя, – говорится в Писании, – (иудеи)смелость Петра и Иоанна и приметив, что они люди некнижные и простые, они удивлялись»(Деян.4:13) и боялись, не потому, что они были неученые, но потому, что, будучи неучеными, они побеждали всех мудрецов;«видя же исцеленного человека, стоящего с ними, ничего не могли сказать вопреки»(Деян.4:14), тогда как прежде противоречили, видя совершаемые знамения. Почему же тогда они не противоречили? Их язык удержала невидимая сила Распятого; Он заградил им уста; Он обуздал их дерзость; поэтому они и стояли, не могши ничего сказать вопреки. А когда они и говорили, то, посмотри, как обнаруживали свой страх:«Хотите, – говорят они, –навести на нас кровь Того Человека»(Деян.5:28). Но если Он простой человек, то отчего ты боишься Крови Его? Скольких пророков убил ты, иудей, скольких праведников умертвил, и не страшился крови никого из них: отчего же здесь ты боишься? Поистине, потряс совесть их Распятый; и они, не будучи в силах скрыть своего смущения, невольно перед противниками и исповедают собственное бессилие. Когда они распинали Его на кресте, то кричали:«Кровь Его на нас и на детях наших»(Мф.27:25): так они презирали Кровь Его! А после Креста, увидев воссиявшую силу Его, они страшатся, смущаются и говорят:«Хотите навести на нас кровь Того Человека». Если Он был обманщик и богопротивник, как говорите вы, беззаконные иудеи, то отчего вы боитесь Его Крови? Напротив, следовало бы даже хвалиться этим убиением, если бы Он был действительно таков. Но так как Он был не таков, то они и трепещут.'
          cn: 你愿意见到连敌人自己都惧怕祂的力量和权能，并且在十字架之后更加忧虑不安吗？关于这一点，请你仔细聆听。圣经上说：「（犹太人）看见彼得和约翰的胆量，又看出他们原是没有学问的平民，就希奇。」（使徒行传 4:13）并且惧怕，不是因为他们没有学问，而是因为他们虽然没有学问，却能胜过所有的智者；「又看见那被医好的人和他们一同站着，就无可辩驳。」（使徒行传 4:14）而在此之前，当他们看见所行的神迹时，却曾加以反对。那么为何那时他们没有反对呢？那被钉十字架者的无形力量拘束了他们的舌头；祂堵住了他们的口；祂遏制了他们的鲁莽；因此他们才站着，无可辩驳。而当他们开口说话时，你看他们是如何显露出自己的恐惧：「你们想要把那人的血归到我们身上吗？」 （使徒行传 5:28）但如果祂只是一个凡人，那么你又为何惧怕祂的血呢？犹太人啊，你杀了多少先知，又置多少义人于死地，却从未惧怕他们任何一人的血：为何在这里你却惧怕了呢？的确，那被钉十字架者震动了他们的良心；他们无力掩饰自己的困窘，便不由自主地在敌人面前承认了自己的无能。当他们将祂钉在十字架上时，曾叫嚣说：「祂的血归到我们和我们的子孙身上！」（马太福音 27:25）他们竟然如此轻蔑祂的血！但在十字架之后，当他们看见祂所彰显的力量时，他们就惧怕、困窘，并说道：「你们想要把那人的血归到我们身上吗？」如果祂是一个骗子和抵挡上帝者，就像你们这些不法之犹太人所说的那样，那么你们又为何惧怕祂的血呢？相反地，你们甚至应该为此杀戮而夸耀，如果祂果真如此的话。但因为祂并非如此，所以他们才颤抖。
      - type: paragraph
        initial:
          ru: '9.'
          cn: '9.'
        text:
          ru: Видишь ли, как везде и сами враги смущаются и страшатся? Видишь ли их смущение? Узнай и человеколюбие Распятого. Они говорили:«Кровь Его на нас и на детях наших»(Мф.27:25), а Христос не так поступил, но, умоляя Отца, говорил:«Отче! прости им, ибо не знают, что делают»(Лк.23:34). Если бы Кровь Его была на них и на детях их, то из числа детей их не были бы апостолы, также не уверовали бы вдруг три тысячи и пять тысяч. Видишь ли, как они были жестоки и бесчеловечны к своим детям и отрекались от самой природы, а Бог был человеколюбивее всех отцов и любвеобильнее матерей? Кровь Его была на них и на детях их, но не на всех детях, а только на тех, которые подражали нечестию и беззаконию отцов, и только те, которые были сынами их не по преемству природы, а по произвольному безумию подверглись бедствиям.
          cn: 祢岂不见，仇敌自身各处都惊惶失措、感到惧怕吗？祢岂不见他们的惊惶失措吗？也要认识到被钉者的仁爱。他们曾说：「祂的血归到我们和我们的子孙身上。」（马太福音 27:25）但基督并非如此行事，而是恳求父，说：「父啊！赦免他们，因为他们所做的，他们不晓得。」（路加福音 23:34）倘若祂的血真的归到他们和他们的子孙身上，那么使徒就不会是他们的子孙中的一员了，三千和五千人也不会突然之间皈信了。祢岂不见他们对自己的子孙是何等残忍和不仁，甚至背弃了本性本身？而上帝比所有的父亲都更具仁爱，比所有的母亲都更充满慈爱吗？祂的血确实归到他们和他们的子孙身上，但并非归到所有的子孙身上，而仅仅归到那些效法父辈不虔敬和不法行为的人身上，并且，仅仅是那些并非因着本性的继承，而是因着自愿的疯狂而成为他们子孙的人，才遭遇了灾祸。
      - type: paragraph
        text:
          ru: Заметь еще благость и человеколюбие Божие и с другой стороны. Он не тотчас навел на них наказание и бедствия, но спустя сорок и более лет после Креста. Сам Спаситель был распят при Тиверии, а город их взят при Веспасиане и Тите. Почему же Он медлил столько времени? Он хотел дать им время для покаяния, чтобы они оставили свои грехи и загладили преступления. Но так как они, и получив время для покаяния, остались неисцельными, то Он, наконец, навел на них наказание и бедствия, и, разрушив город, изгнал и рассеял их по всей вселенной, впрочем, показав и в этом Свое человеколюбие. Он рассеял их для того, чтобы они видели, как распятому ими Христу поклоняются по всей вселенной, чтобы, видя поклонение, воздаваемое Ему от всех, и познав Его силу, они сознали чрезмерность собственного нечестия и, сознав, обратились к истине. Так самое изгнание было для них назиданием и наказание – вразумлением, потому что если бы они остались в земле Иудейской, то не убедились бы в истинности пророков. А что говорили пророки?«Проси у Меня, и дам народы в наследие Тебе и пределы земли во владение Тебе»(Пс.2:8).
          cn: 此外，从另一方面，再注意上帝的良善和仁爱。祂没有立刻降下惩罚和灾祸在他们身上，而是在十字架事件发生四十年或更久之后。救主自己是在提比略凯撒在位期间被钉十字架的，而他们的城则是在维斯帕西安和提图斯在位期间被攻陷的。那么祂为何迟延了这么长时间呢？祂想给他们时间悔改，好让他们舍弃自己的罪恶，并弥补其罪行。但既然他们即使获得了悔改的时间，仍然顽固不化，祂最终就降下惩罚和灾祸在他们身上，并毁灭了那城，将他们逐出并驱散到普世各地；然而，即使在此事上，祂也显明了祂的仁爱。祂驱散他们是为了让他们能看见，他们所钉的基督是如何在普世受人敬拜的；让他们看见万人所献给祂的敬拜，并认识到祂的力量，从而意识到自身不敬虔的过度，并在意识到之后，归向真理。因此，那放逐本身对他们而言是一种教诲，而惩罚则是一种警醒；因为如果他们留在犹太地，他们就不会信服先知们的真实性。那么先知们说了什么呢？「向我求告，我就将列国赐给祢为产业，并将地极赐给祢为领地。」(诗篇 2:8)
      - type: paragraph
        text:
          ru: Поэтому иудеям надлежало достигнуть пределов земли, чтобы увидеть собственными глазами, что Христос обладает и пределами земли. Также другой пророк говорит:«И Ему будут поклоняться, каждый со своего места, все острова народов»(Соф.2:11). Поэтому надлежало им рассеяться по всем местам земли, чтобы увидеть собственными глазами, что каждый поклоняется Ему с места своего. И еще другой сказал:«Ибо земля наполнится познанием славы Господа, как воды наполняют море»(Авв.2:14). Поэтому надлежало им разойтись по всей земле, чтобы увидеть ее исполненной ведения Господня, и моря, т.е. эти духовные церкви, исполненными благочестия. Для этого Бог рассеял их по всей земле, потому что, если бы они остались в Иудее, то не узнали бы этого. Он хочет, чтобы они сами собственными глазами удостоверились и в истинности пророков, и в Его силе, чтобы они, если вразумятся, были приведены через это к истине, а если останутся в нечестии, то не имели бы никакого оправдания в страшный день Суда. Для того Он и рассеял их по всей вселенной, чтобы и мы получили отсюда некоторую пользу, т.е. видя исполнение тех пророчеств о рассеянии их и о взятии Иерусалима, которые предсказали Даниил, когда он упоминал о«мерзости запустения»(Дан.9:27), и Малахия, когда он говорил, что«лучше кто-нибудь из вас запер бы двери»(Мал.1:10), и Давид, и Исаия и многие другие пророки, чтобы мы, видя прогневавших Господа так наказанными, лишенными отечественной свободы и всех собственных законов и отеческих преданий, познали Его силу, предсказавшую и исполнившую это, – чтобы враги из наших благ увидели силу Его, а мы из их наказаний познали неизреченное Его человеколюбие и могущество, и во всю свою жизнь прославляли Его, дабы нам получить и вечные и неизреченные блага, благодатью и человеколюбием Господа нашего Иисуса Христа, с Которым Отцу, вместе со Святым и Животворящим Духом, честь и держава, ныне и присно, и во веки веков. Аминь.
          cn: 因此，犹太人理当抵达地极，以便亲眼看见基督也拥有地极。此外，另一位先知说：「万民的众海岛，都要从各自的地方敬拜祂。」(西番雅书 2:11) 因此，他们理当分散到地上各处，以便亲眼看见每个人都从自己的地方敬拜祂。还有另一位说：「因为认识上主的荣耀必充满全地，如同水充满海洋一般。」(哈巴谷书 2:14) 因此，他们理当遍及全地，以便看见全地充满了对上主的认识，而海洋，即这些属灵的教会，也充满了虔敬。为此，上帝将他们分散到全地，因为如果他们留在犹大，就不会明白这一切。祂希望他们亲眼确信先知的真实性以及祂的大能，以便他们，如果能够醒悟，便借此被引向真理；而如果他们仍旧不虔，在审判的可怖之日，就毫无托辞。为此，祂将他们分散到全宇宙，以便我们也从中得到一些益处，即，看见关于他们分散和耶路撒冷被攻陷的那些预言应验了，那些预言是由但以理在提及「那行毁坏可憎的」(但以理书 9:27)时所预告的，还有玛拉基在说「你们中间倒不如有人把殿门关上」(玛拉基书 1:10)时所说的，以及达味、以赛亚和许多其他先知所预言的——好让我们，在看见那些触怒上主的人如此受罚时，他们被剥夺了故土的自由，以及所有自己的法律和父辈的传统，便能认识祂预言并成就这一切的大能——好让敌人从我们的恩泽中看见祂的大能，而我们则从他们的惩罚中认识祂那不可言喻的慈爱和权能，并在我们的一生中颂扬祂，以便我们也能获得永恒和不可言喻的福祉，借着我们主耶稣基督的恩典与慈爱，与祂同父，并同圣而活泼的圣灵，共享尊荣与权柄，从今时直到永远，世世代代。阿们。
