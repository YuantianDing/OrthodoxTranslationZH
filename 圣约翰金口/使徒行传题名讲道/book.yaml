  - type: paragraph
    text:
      ru: Этой беседой начинается ряд бесед, всего пять, по вопросу о надписании книги Деяний; в первой из них говорится о самом заглавии книги, во второй – об авторе, в третьей – о начале книги и о различии между действием и чудом, в четвертой – о пользе чтения Священного Писания, в пятой – о том, почему книга Деяний Апостольских читается в Пятидесятницу. Вторая из этих бесед дошла до нас лишь в недостаточном и даже искаженном виде, почему она и отнесена бенедиктинскими издателями к концу III тома.
      cn: 这篇讲论开启了一系列共五篇的讲论，旨在探讨《使徒行传》的题名问题；其中第一篇论及该书的题名本身，第二篇论及作者，第三篇论及该书的开端及行动与奇迹之间的区别，第四篇论及诵读《圣经》的益处，第五篇论及为何《使徒行传》在五旬节期间诵读。这些讲论中的第二篇流传至今，只是不完整，甚至是残缺不全的形式，因此它被本笃会编者归入第三卷的末尾。
