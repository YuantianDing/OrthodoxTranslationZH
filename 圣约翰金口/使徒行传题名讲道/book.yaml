    ru: Святитель Иоанн ЗлатоустБеседы о надписании книги Деяний
    cn: 圣约翰金口 论使徒行传书卷题名
  children:
  - type: heading2
    text:
      ru: Беседа 1-я[*]
      cn: 第一篇讲道[*]
    children:
    - type: heading3
      text:
        ru: О тех, которые не пришли в церковное собрание; о том, что не должно оставлять без внимания надписания Божественных Писаний; о надписи на жертвеннике и о новопросвещенных.
        cn: 关于那些未曾前来圣会的人；关于不应忽视神圣经文的题词；关于祭坛上的题字以及新受洗者。
      children:
      - type: paragraph
        text:
          ru: 'Проповедник жалуется на то, чтоцерковь, бывшая совершенно переполненной в предшествующее воскресенье, теперь была почти пустая, и особенно на то, что в церкви не видно богатых лиц. – Он, впрочем, предпочитает немногое число присутствующих бедных. – Обличение зрелищ. – Осуждению подлежит злоупотребление богатствами, а не сами богатства. – Те, которые не бывают за церковным служением, хуже иудеев. – Не нужно пренебрегать даже самыми заглавиями Священного Писания, так как апостол Павел, будучи в Афинах, пользовался даже надписью на языческом жертвеннике. – Что же значит: Деяния Апостолов? – Апостол Павел поборол язычество так же, как Давид поборол филистимского исполина. – Кто есть истинный неофит?'
          cn: 一位传道者抱怨说，前一个主日座无虚席的教堂，现在几乎空无一人，尤其看不到富裕之人的面孔。——然而，他宁愿有少数贫穷的人在场。——对各种表演的斥责。——应受谴责的是滥用财富，而非财富本身。——那些不参加教会礼拜的人，比犹太人更糟糕。——甚至不应轻忽圣经的标题，因为使徒保罗在雅典时，连异教祭坛上的铭文都加以利用了。——那么，「使徒行传」是什么意思？——使徒保罗战胜异教，正如大卫战胜非利士巨人一样。——谁是真正的慕道者？
      - type: paragraph
        initial:
          ru: '1.'
          cn: '1.'
        text:
          ru: 'Что это? Чем далее простираются у нас праздники, тем малочисленнее делаются собрания. Но не будем нерадивыми мы – присутствующие; собрания делаются меньшими по количеству, но не меньшими по усердию, меньшими по числу, но не меньшими по расположению. Они делаются меньшими,«дабы открылись между вами искусные»(1Кор.11:19), для того, чтобы мы узнали – кто приходит в годовой праздник по привычке, кто по расположению к Божественным изречениям, кто по желанию слушать о духовных предметах. В предыдущий воскресный день весь город был здесь, ограды были наполнены, народ уподоблялся волнам, приливавшим и отливавшим; но для меня ваша тишина вожделеннее тех волн, для меня ваше спокойствие достопочтеннее того шума и смятения. Тогда можно было считать присутствовавшие тела, а теперь – души, исполненные благочестия. Если бы это собрание, малочисленное и состоящее больше из бедных, и то собрание, многочисленное и составленное больше из богатых, – если бы оба эти собрания кто-нибудь захотел положить на весы для взвешивания, то нашел бы, что первое имеет перевес. Вы меньше по количеству, но, достопочтеннее по усердию. Так бывает и с взвешиваемыми вещами: если бы кто, взяв десять золотых статиров, положил их на одну чашку весов, а на другую чашку сто медных монет, то сто медных монет перетянули бы весы на свою сторону; но десять золотых по превосходнейшему свойству своему имеют перевес над ними, как важнейшие и драгоценнейшие по существу своему. Так немногие по числу бывают драгоценнее и полезнее многих. Но что я представляю вам примеры от обыкновенных предметов, когда нужно привести изречение Божие, свидетельствующее об этом? Что же говорится в нем?«Лучше один праведник, творящий волю Господню,нежели тысяча грешников»(Сир.16:3). Бывает, подлинно часто бывает один человек равноценен тысячам. И что я говорю: один человек бывает равноценен тысячам? Бывает важнее и достопочтеннее и самой вселенной. Свидетельство на это я представлю из слов Павла. Упомянув о людях бедных, гонимых, оскорбляемых, угнетаемых, он говорит так:«Cкитались в милотях и козьих кожах, терпя недостатки, скорби, озлобления; те, которых весь мир не был достоин»(Евр.11:37–38). Что говоришь ты? Ужели мир не стоил их, терпевших лишения и озлобления и не имевших отечества? Разве ты не видишь, сколь немногих ты противопоставляешь столь многим? Вижу, говорит, потому и сказал я, что«мир не был достоин»их. Я хорошо знаю свойства этих монет. Поставив землю и море, царей и правителей, и вообще весь род человеческий, и противопоставив им двух или трех бедных, я смело могу сказать, что эти бедные весят больше. Они были изгоняемы из отечества, но имели отечеством горний Иерусалим; они проводили жизнь в бедности, но были богаты благочестием; они были ненавистны людям, но любезны Богу. Кто же это были? Илия, Елисей и все подобные им. Не смотри на то, что они нуждались в необходимой пище, но на то, что уста Илии заключили и отверзли небо, а милоть его обратила назад Иордан.'
          cn: '这是什么呢？在我们这里，节期延续得越久，聚会的人就越少。但是，我们这些在场的人，不要懈怠；聚会的人数虽少，但热心不减；数量虽少，但心志不减。


            聚会人数变少，「为要叫那些蒙悦纳的人，在你们中间显明出来」(哥林多前书 11:19)，是为了让我们分辨出——谁是因习惯而在年节到来，谁是因喜爱圣言而来，谁是因渴望聆听属灵之事而来。在上一个主日，全城的人都在这里，围墙挤满了人，民众如同潮水般涌入涌出；但对我而言，你们的宁静比那些人潮更令人向往；你们的安详比那喧嚣与混乱更可敬。那时可以数算在场的身体，而现在则可数算充满虔敬的灵魂。


            如果有人将这个人数虽少、多由贫穷人组成的聚会，与那个人数众多、多由富裕人组成的聚会，若有人想将这两场聚会放在天平上称量，就会发现前者分量更重。你们人数虽少，但热心更可敬。称量之物亦是如此：若有人取十个金币，置于天平一端，而另端置一百枚铜币，那一百枚铜币会使天平倾向其一边；但十枚金币，因其卓越的品质，在其上占有优势，因其本质上更为重要和珍贵。因此，人数虽少者，往往比众多者更为珍贵和有益。


            但我为何要用寻常事物来举例呢？当务之急是引用见证此事的上帝圣言。其中怎么说呢？「一个义人行上主旨意，胜过一千个罪人」(德训篇 16:3)。确实如此，往往一个人便可抵得上千人。我说什么呢？一个人可以抵得上千人？他甚至可以比整个宇宙更重要、更可敬。我将从保罗的话语中引证此事。


            他提到那些贫穷的、受逼迫的、受凌辱的、受欺压的人，他这样说：「他们身穿羊皮、山羊皮，受着贫乏、苦难、虐待；世上不配有这样的人」(希伯来书 11:37-38)。你说什么呢？难道世上真不配拥有他们这些受苦受难、被虐待且无家可归的人吗？难道你没有看到你将如此少数的人与如此多数的人作对比吗？「我看见了，」他说，「所以我才说『世上不配有』他们。」我深知这些钱币的特质。若将天地、君王与统治者，以及整个人类摆在一边，而将两三个贫穷人置于另一边，我敢大胆地说，这些贫穷人的分量更重。他们被逐出家园，却以天上的耶路撒冷为家园；他们生活贫困，却富于虔敬；他们为人所憎恨，却是上帝所喜爱。他们是谁呢？以利亚、以利沙以及所有像他们一样的人。不要看他们缺乏必需的食物，而要看以利亚的口关闭又开启了天空，他的外衣使约旦河倒流。'
      - type: paragraph
        text:
          ru: 'Представляя это, я и радуюсь и скорблю: радуюсь о вас, присутствующих, а скорблю о тех, не присутствующих; очень скорблю, печалюсь и сокрушаюсь сердцем. И кто из людей самых нечувствительных не станет скорбеть, видя, что дела дьявола удостаиваются большей ревности? Между тем, если бы они удостаивались даже равной ревности (с делами благочестия), и тогда не было бы нам никакого прощения, никакого оправдания; а когда они удостаиваются гораздо большей, то какое остается нам оправдание? На зрелища приглашают каждый день, и никто не ленится, никто не отказывается, никто не ссылается на множество занятий; но, как готовые и свободные от всякой заботы, бегут все: ни старец не стыдится своей седины, ни юноша не боится пламени своей природной похоти, ни богатый не опасается унизить свое достоинство. А когда нужно идти вцерковь, тогда, как бы нисходя с какой-либо высокой степени и унижая свое достоинство, он медлит и идет лениво, и потом надмевается, как будто он сделал какое-нибудь одолжение Богу; в театр же, где он видит и слышит развратное, спешит, не думая унизить ни себя, ни свое богатство, ни благородство. Желал бы я знать, где теперь те, которые в тот день беспокоили нас, – потому что присутствие их было причиной беспокойства; желал бы знать, что они делают, какое дело, более необходимое, чем занимающее теперь нас, заняло их. Но никакого у них нет занятия, а одно только тщеславие. Что же может быть безумнее этого? Для чего ты, человек, высокомудрствуешь и думаешь, что делаешь нам одолжение, если, пришедши сюда, бываешь внимательным и слушаешь то, что относится к спасению твоей души? Для чего это, скажи мне? И чем ты превозносишься? Богатством? Шелковыми одеждами? А того не подумаешь, что они – пряди червей и изобретения иноплеменников, что их употребляют и блудницы, и развратники, и расхитители гробниц, и разбойники? Познай истинное богатство и оставь эту надменную и пустую гордость; размысли о тленности своей природы. Ты – земля и пыль, пепел и прах, дым и тень, трава и цвет травный. И такой природой, скажи мне, ты гордишься? Что может быть смешнее этого? Но ты начальствуешь над многими людьми? А что пользы в этом, когда ты, начальствуя над людьми, сам пленник и раб страстей? Как если бы кто-нибудь дома подвергался побоям и получал раны от рабов, а вне, по выходе на площадь, стал гордиться начальством над другими, – так и тебя бичует тщеславие, наносит тебе раны распутство, ты – раб всех страстей, и ты гордишься, что начальствуешь над своими соплеменниками? О, если бы ты действительно начальствовал над ними, был равным им по чести!'
          cn: '想到此处，我心又欢喜又忧伤：为你们这些在场之人欢喜，却为那些不在场之人忧伤；我心甚是悲恸，忧伤不已，破碎不堪。即使是最麻木不仁之人，谁能不忧伤，眼见魔鬼的作为竟得到更大的热心？况且，即使他们的热心与（敬虔之事）同等，那时我们亦无任何赦免，任何辩解；而当他们得到远超敬虔之事的热心时，我们还有何辩解可言？每天都有人被邀请去观看表演，没人懒惰，没人拒绝，没人以事务繁多为由推托；而是，如同已准备妥当，摆脱一切忧虑般，众人皆奔赴而去：老者不以其白发为耻，少年不惧其本性情欲之火，富者不恐有损其尊严。而当需要去教堂时，他便仿佛从某个高位降下，有损其尊严般，迟延且懒散地前往；之后还自命不凡，仿佛他对上帝做了什么恩惠般；而去往剧院，在那里他看到并听到淫邪之事，却疾驰而去，不以为有损自身，不以为有损其财富，不以为有损其高贵。


            我真想知道，那天烦扰我们之人现在何处——因为他们的在场即是烦扰之因；我真想知道，他们正在做什么，有什么事比我们现在所做之事更重要，竟占用了他们。然而他们并无任何事务，唯有虚荣作祟。还有什么比这更愚蠢的呢？人啊，你为何如此自恃清高，以为你是在对我们施恩惠，若你来到此处，留心聆听那些关乎你灵魂救赎之事？告诉我，这又是为何呢？你又以何自傲呢？是财富吗？是丝绸华服吗？你难道没想过，它们不过是虫豸之丝，是异族之人所发明，也被娼妓、淫荡之人、盗墓者和强盗所使用吗？认识真正的财富，放弃这傲慢而虚空的骄傲；深思你本性的朽坏。你是泥土和尘埃，灰烬和尘土，烟雾和阴影，青草和草上的花。告诉我，你竟以此等本性为傲吗？还有什么比这更可笑的呢？


            可是，你管辖着许多人吗？当你管辖着众人，自己却已成为情欲的俘虏和奴仆，这又有何益处呢？就像某人，在家中遭受奴仆殴打并受伤，而出门到广场上，却开始夸耀自己管辖着他人——同样，虚荣鞭挞着你，放荡给你带来创伤，你是所有情欲的奴仆，你竟还以管辖自己的同族人为傲吗？哦，若你果真管辖着他们，在尊荣上与他们平等！'
      - type: paragraph
        initial:
          ru: '2.'
          cn: '2.'
        text:
          ru: Я говорю это для обвинения не богатых, а худо пользующихся богатством. Богатство не зло, если мы захотим пользоваться им, как должно; а зло – гордость и тщеславие. Если бы богатство было злом, то мы все не молились бы войти в недра Авраама, который имел триста семнадцать рабов, рожденных в его доме. Богатство, следовательно – не зло, а зло – беззаконное употребление его. Как прежде, говоря о пьянстве, я не вино осуждал – потому что«всякое творение Божие хорошо, и ничто не предосудительно, если принимается с благодарением»(1Тим.4:4); – так и теперь я не богатых обвиняю и не богатство осуждаю, а худое употребление богатства, истрачиваемого на распутство. Потому оно и называется богатством (χρήματα), чтобы мы распоряжались (χρησώμεθα) им, а не оно нами; потому оно и называется стяжанием (κτήματα), чтобы мы владели (κτησώμεθα) им, а не оно нами. Для чего же раба ты делаешь своим господином? Для чего извращаешь порядок? Но я желал бы знать, что делают теперь не пришедшие в собрание и чем они занимаются. Они или играют в кости, или непременно занимаются житейскими делами, исполненными беспокойства. А если бы ты, человек, присутствовал здесь, то был бы в покое и в пристани; домоправитель не пришел бы беспокоить тебя, управитель не смущал бы, раб не тревожил бы житейскими делами, и никто другой не огорчал бы тебя; проводя время спокойно, ты наслаждался бы слушанием Божественного учения. Здесь нет никаких волнений, нет никакого смятения, но благословение, молитвы, духовное собеседование, преселение на Небо; отсюда вышел бы ты, получив залог Царства Небесного. Для чего же ты, оставив эту богатую трапезу, перешел к другой, неприятнейшей и, оставив пристань, променял тишину на беспокойство? Прискорбно, что нет здесь бедных, которые тогда присутствовали, но не так прискорбно, как то, что нет здесь богатых. Почему? Потому, что бедные, содержа себя трудами рук своих, имеют необходимые занятия, заботятся о ежедневной работе, пекутся о пропитании детей, наблюдают за женой, и если бы не трудились, то не могли бы поддерживать своей жизни. Говорю это не с тем, чтобы составить речь в защиту их, но чтобы показать, сколь большего осуждения достойны богатые. Чем большими пользуются они удобствами, тем большего достойны осуждения, потому что ничто подобное не удерживает их.
          cn: 我说这话，不是为了指责富人，而是为了指责那些不善用财富的人。财富并非恶事，如果我们愿意如其所当地使用它；而恶事乃是骄傲和虚荣。如果财富是恶事，那么我们所有人就不会祈祷进入亚伯拉罕的怀里，他有三百一十七名生在家中的奴仆。因此，财富并非恶事，而恶事乃是无度地使用它。正如从前我谈论醉酒时，我所谴责的不是酒本身——因为「凡上帝所造的都是好的，若怀着感恩的心领受，就没有一样是可弃绝的」（提摩太前书 4:4）；——同样，现在我指责的不是富人，也不是谴责财富，而是将财富耗费在放荡上的不正当使用。所以它被称为财富 (χρήματα)，是为了让我们支配 (χρησώμεθα) 它，而不是它支配我们；所以它被称为财物 (κτήματα)，是为了让我们拥有 (κτησώμεθα) 它，而不是它拥有我们。你为何将奴仆变为你的主人呢？你为何颠倒秩序呢？我倒想知道，那些现在没有来到聚会的人在做什么，他们又在忙些什么。他们不是在掷骰子，就是必然在忙碌着充满烦扰的世俗事务。然而，你这人啊，如果你在这里，你就会得到安宁和港湾；管家就不会来打扰你，管理人就不会搅扰你，奴仆就不会以世俗事务烦扰你，也没有其他人会使你忧伤；安静地度过时光，你就会享受聆听神圣教诲的乐趣。在这里，没有丝毫的动荡，也没有丝毫的混乱，只有祝福、祷告、属灵的交谈，以及迁居天国；从这里离开，你就会得到天国国度的凭据。你为何舍弃这丰盛的筵席，转而追求另一个更不愉快的；又舍弃港湾，将宁静换作烦扰呢？令人遗憾的是，这里没有贫穷人，他们那时本在场的；但这并不如富人不在场那样令人遗憾。为何？因为贫穷人靠双手劳作维持生计，他们有必须从事的事务，关心每日的工作，操心子女的口粮，照看妻子，如果他们不劳作，就无法维系自己的生命。我说这话，不是为了替他们辩护，而是为了表明富人更当受责备。他们所享用的便利越多，就越是当受责备，因为没有什么类似的事情能阻碍他们。
      - type: paragraph
        text:
          ru: 'Не видите ли вы иудеев, враждующих против Бога, противящихся Духу Святому, жестоковыйных? Но не пришедшие сюда хуже всех них. Если тем священники приказывают не делать ничего семь, десять, двадцать, тридцать дней, – они не противоречат, хотя, что может быть несноснее такого бездействия? Они запирают двери, не зажигают огня, не приносят воды и ничем другим из подобных нужд не позволяют себе заниматься; они бывают связаны бездействием, как бы цепью, и, однако, не противоречат. А я не говорю ничего такого, не говорю: не делай ничего семь дней или десять дней; но: удели мне два часа в день, а прочие оставь себе, – и ты не уделяешь мне и этой части. Лучше сказать: не мне удели эти два часа, а самому себе, чтобы тебе получить некоторое утешение от молитвы отцов, чтобы выйти отсюда исполненным благословений, чтобы отойти огражденным со всех сторон, чтобы, приняв духовное оружие, ты сделался непобедимым и неуловимым для дьявола. Что может быть приятнее, скажи мне, пребывания здесь? Если бы нужно было проводить здесь целые дни, что вожделеннее этого? Что безопаснее этого места, где столько братьев, где Дух Святой, где посреди стоит Иисус и Отец Его? Где найдешь ты другое такое общество, другое собрание, другой собор? Столько здесь благ на трапезе, в поучениях, в благословениях, в молитвах, в совещаниях, – и ты обращаешься к другим собеседованиям? Какое ты имеешь оправдание? Это сказал я не для того, чтобы слушали вы, – вы не имеете нужды в таких лекарствах, доказав делами свое здоровье, послушание, показав усердием свою любовь, – но я сказал это вам с тем, чтобы от вас услышали те, которых нет здесь. Не говорите им только, что осуждал непришедших сюда, но расскажите им всю речь мою с самого начала. Напомните им об иудеях, напомните им о житейских делах; скажите, сколько лучше здешнее собрание; скажите, какую оказывают они заботливость о делах мирских; скажите, какая последует награда тем, которые собираются сюда. Если вы скажете только, что я осуждал их, то возбудите в них гнев, нанесете рану, а лекарства не приложите; но если вы объясните им, что я осуждал их не как враг, а как сетующий друг, и убедите их, что«искренни укоризны от любящего, и лживы поцелуи ненавидящего»(Притч.27:6), то они примут осуждение с великим удовольствием, потому что обратят внимание не на слова, а на расположение говорящего. Так врачуйте братьев ваших. Мы отвечаем за спасение вас, присутствующих, а вы – за спасение непришедших. Сами мы не можем иметь сношения с ними; мы будем сноситься с ними через вас, через ваше наставление; ваша любовь пусть будет для нас некоторым мостом к ним; сделайте, чтобы наши слова через ваш язык достигли до их слуха. Впрочем, может быть, уже достаточно сказано о непришедших, и не нужно прибавлять ничего больше. Можно бы сказать и больше, но чтобы не потратить всего времени на такое осуждение, не доставляя никакой пользы вам присутствующим, мы теперь предложим и вам некоторую необыкновенную и новую пищу, – необыкновенную и новую, говорю, не по отношению к духовной трапезе, но необыкновенную для вашего слуха.'
          cn: '你们难道没有看见那些与上帝为敌，抵挡圣灵，硬着颈项的犹太人吗？然而，那些不来这里的人，比他们所有人都更糟糕。如果祭司们命令他们七天、十天、二十天、三十天什么都不做——他们也不反驳，虽然，还有什么比这种无所事事更令人难以忍受的呢？他们关上门，不点火，不取水，也不允许自己做任何其他类似必须之事；他们如同被锁链捆绑一般，受制于无所事事，然而，他们却不反驳。


            而我并没有说那样的话，我没有说：七天或十天什么都不要做；而是说：每天拨给我两个小时，其余的时间留给自己——你却连这一小部分都不给我。不如说：不是拨给我这两个小时，而是拨给你自己，好使你从教父们的祷告中获得一些慰藉，好使你从这里出去时充满祝福，好使你离去时四面受护佑，好使你领受属灵的兵器后，变得对魔鬼而言战无不胜、难以捉摸。


            告诉我，还有什么比留在这里更令人愉悦的呢？如果需要在这里度过整日，还有什么比这更可渴望的呢？还有什么地方比这里更安全呢？这里有如此多的弟兄，有圣灵，有耶稣和祂的父立于其中。你还能在哪里找到如此的社群，如此的聚会，如此的教会？这里有如此多的美善，在筵席中，在教导中，在祝福中，在祷告中，在商议中——你却转向其他的交谈？你有什么可以开脱的理由呢？


            我说这些话，并非为了让你们听——你们无需这些药方，你们已用行为证明了自己的康健、顺服，用热心显明了自己的爱——我告诉你们这些，是为了让那些不在这里的人，能从你们那里听到。不要只告诉他们，我谴责了那些不来这里的人，而是要把我从头到尾的整篇话语都讲给他们听。提醒他们关于犹太人的事，提醒他们关于世俗事务的事；告诉他们这里的聚会多么美好；告诉他们，他们为世俗事务付出了多少关注；告诉他们，那些聚集到这里的人，将会得到怎样的报偿。如果你们只说我谴责了他们，那么你们只会激起他们的愤怒，给予他们创伤，却没有施加药方；但如果你们向他们解释，我谴责他们并非作为敌人，而是作为一位忧伤的朋友，并说服他们：「爱者之责备出于真诚，恨者之亲吻皆是虚伪」（箴言 27:6），那么他们就会非常乐意地接受这谴责，因为他们不会留意言语，而是留意说话者的心意。如此医治你们的弟兄们。我们为你们在场者的救恩负责，而你们则为那些未到者的救恩负责。我们自己无法与他们接触；我们将通过你们，通过你们的教导与他们往来；愿你们的爱成为我们通往他们的一座桥梁；请使我们的言语通过你们的口舌传达到他们的耳中。


            然而，或许关于那些未到者的言论已经足够，无需再多说什么了。本可说得更多，但为了不将所有时间都耗费在这样的谴责上，以致于对你们在场者毫无益处，我们现在将向你们呈上一道非凡而新颖的食粮——我说，非凡而新颖，并非指属灵的筵席本身，而是对你们的听觉而言非凡。'
      - type: paragraph
        initial:
          ru: '3.'
          cn: '3.'
        text:
          ru: 'В прежние дни мы говорили вам об апостольских изречениях и евангельских, когда беседовали об Иуде, говорили вам и о пророческих; теперь хотим сказать из Деяний Апостольских. Потому я и называю эту пищу и необыкновенной, и вместе обыкновенной: обыкновенная она потому, что следует по порядку Божественных Писаний, а необыкновенная потому, что ваш слух, может быть, не привык слышать о таком предмете. Многим эта книга даже неизвестна, а многим кажется ясной, и потому оставляется без внимания, так что для одних знание, а для других незнание служит поводом к беспечности. Поэтому, чтобы и незнающие, и считающие себя хорошо знающими уразумели, что она содержит в себе много глубоких мыслей, необходимо сегодня исправить небрежность тех и других. Но, прежде всего, нужно узнать, кто написал эту книгу, потому что таков порядок лучшего исследования, – наперед узнать писателя, человек ли он или Бог. Если он человек, то мы отвергнем его, потому что Господь говорит:«Не называйтеучителемникого на земле»(Мф.23:9), а если Бог, то примем, потому что наше учение свыше, и таково достоинство этого зрелища – не учиться ничему от людей, но от Бога через людей.'
          cn: 在过去的日子里，我们曾对你们讲过关于使徒和福音的言论，当时我们谈论犹大，也曾对你们讲过先知的言论；现在我们想从《使徒行实》中说。因此，我将这食粮称为既不寻常，又寻常：它之所以寻常，是因为它遵循神圣经卷的次序；而它之所以不寻常，是因为你们的耳朵可能不习惯听到这样的主题。许多人甚至不知道这本书，而对许多人来说，它似乎很清晰，因此被忽视了，以至于对一些人来说，知识，对另一些人来说，无知，都成了疏忽的借口。因此，为了让那些不了解的，以及那些自认为很了解的人都能明白它包含了许多深刻的思想，今天有必要纠正这两类人的疏忽。但首先，需要知道是谁写了这本书，因为这是最佳研究的次序——首先了解作者，他是一个人还是上帝。如果他是一个人，那么我们就会拒绝他，因为上主说：「不要称呼地上任何人作师傅」（马太福音 23:9），而如果是上帝，我们就会接受，因为我们的教导是从上而来，而这个景象的尊严就在于此——不从人那里学习任何东西，而是通过人从上帝那里学习。
      - type: paragraph
        text:
          ru: 'Итак, нужно исследовать, кто писатель (этой книги), когда он написал, и о чем, и для чего постановлено читать ее в этот праздник, потому что, может быть, вы в течение всего года не слышите чтения этой книги. Подлинно, и это знать полезно, а затем нужно исследовать, почему она имеет такое надписание: «Деяния Апостольские», потому что надписаний не должно оставлять без внимания и не вдруг обращаться к началу сочинения, но, наперед, должно рассматривать название книги. Как у нас голова делает ведомым остальное тело, и лицо, находящееся наверху, служит к его открытию, так и надписание, поставленное наверху, перед сочинением в заглавии его, делает для нас более известным прочее, содержащееся в Писании. Не видите ли и на изображениях царских, как вверху начертывается изображение с надписью царя, а внизу в основании пишутся трофеи, победы, подвиги? То же можно видеть и в Писаниях. Вверху начертано царское изображение, а внизу написаны победы, трофеи, подвиги. Так мы поступаем и тогда, когда получаем письмо: не вдруг разрываем перевязку и не тотчас читаем находящееся внутри, но, наперед, обращаем внимание на внешнюю надпись и из нее узнаем, кто послал и кому следует получить. Как же, не безрассудно ли в делах житейских оказывать такое усердие, и не возмущаться, и не тревожиться, но делать каждое дело по порядку, а здесь негодовать и спешить скорее приступить к началу? Хотите ли знать, сколько силы в надписании, сколько важности, какое сокровище находится в заглавиях Писаний?'
          cn: 那么，需要考察谁是（这本书的）作者，他何时撰写，以及关于什么，以及为何规定在这一节期诵读此书，因为，或许你们全年都未曾听闻此书的诵读。诚然，了解这些是有益的；其次需要考察，为何此书有如此题名：《使徒行传》，因为不应忽略题名，也不应立即转向著作的开篇，而应首先审视书名。正如我们的头引领着身体的其他部分，并且居于上方的面容有助于揭示它，同样，题名置于上方，位于著作的标题之前，使我们对圣经中其余的内容更加了解。你们难道没在君王画像中看到，上方描绘着附有君王铭文的画像，而下方基座上则书写着战利品、胜利和功绩吗？同样的情形亦可见于圣经中。上方描绘着君王的形象，而下方则记载着胜利、战利品和功绩。我们收到信件时也是如此行事：不会立即撕开束带，也不立刻阅读里面的内容，而是首先留意外面的题写，并从中得知是谁寄出以及谁应收件。那么，难道在世俗事务中展现如此勤勉，且不心烦，不焦虑，而是按部就班地处理每件事，而在此处却抱怨并急于立刻开始阅读，这难道不是轻率之举吗？你们想知道题名蕴含多少力量，多少重要性，以及圣经的标题中蕴藏着怎样的宝藏吗？
      - type: paragraph
        text:
          ru: 'Послушайте, чтобы вам не пренебрегать надписанием Божественных книг. Некогда Павел пришел в Афины. В этой самой книге написано повествование об этом. Он нашел в городе не Божественную книгу, а идольский жертвенник; нашел и надпись следующую:«неведомому Богу», и не прошел мимо, но через надпись жертвенника ниспроверг сам жертвенник (Деян.17:23). Так святой Павел, имевший благодать Духа, не прошел мимо надписи жертвенника, а ты не обращаешь внимания на надписи Писаний? Он не оставил без внимания того, что написали афиняне-идолопоклонники, а ты не считаешь необходимым того, что написал Дух Святой? Какое же ты можешь иметь оправдание? Но посмотрим, сколь великая польза бывает от надписи. Когда ты увидишь, что такую силу оказала надпись, начертанная на жертвеннике, то поймешь, что гораздо больше могут значить надписи Божественных Писаний. Павел вошел в город и нашел жертвенник, на котором было написано:«неведомому Богу». Что нужно было делать? Жители все были язычники, все нечестивые. Что же следовало делать? Говорить из Евангелий? Но они стали бы насмехаться. Из пророческих писаний и из закона? Но они не поверили бы. Что же он сделал? Он прибегнул к жертвеннику и оружием врагов победил их самих. Здесь исполнилось то, что он говорит:«Всем поработил себя,... для Иудеев я был как Иудей,... для чуждых закона – как чуждый закона»(1Кор.9:19–21). Он увидел жертвенник, увидел надпись, и восстал духом. Такова благодать Духа: она производит то, что получившие ее отовсюду извлекают пользу; таково наше оружие духовное,«пленяем, – говорит он, –всякое помышление в послушание Христу»(2Кор.10:5). Итак, он увидел жертвенник и не устрашился, но обратил жертвенник в свою пользу, или лучше – оставив письмена, изменил их смысл. Как военачальник на войне, увидев в отряде неприятелей храброго воина, и потом, взяв этого воина за волосы, переставил бы его в свой отряд и заставил бы сражаться за себя, так сделал и Павел: нашедши надпись, начертанную на жертвеннике, как бы в отряде неприятелей, он перевел ее в свой отряд, чтобы она вместе с Павлом воевала против афинян, а не действовала вместе с афинянами против Павла, потому что эта надпись была мечом афинян, была копьем неприятелей, но этот самый меч отсек неприятелям голову. Не было бы так удивительно, если бы он победил собственным своим оружием, потому что это понятно; а то ново и необыкновенно, когда оружие неприятелей и их злоухищрения обращаются против неприятелей, когда меч, который они заносят на нас, наносит им самим смертельную рану.'
          cn: 请听，以免你们轻忽神圣典籍的题辞。有一次，保罗来到雅典。在这本书中记载着这件事的叙述。他在城里找到的不是神圣的典籍，而是一个偶像祭坛；他还找到以下铭文：「献给未识的上帝」，他并没有视而不见，而是通过祭坛上的这处铭文倾覆了祭坛本身（使徒行传 17:23）。如此，蒙圣灵恩典的圣保罗都没有忽视祭坛上的铭文，而你却不留意圣经的题辞吗？他都没有忽视雅典的偶像崇拜者所写的东西，而你却不认为圣灵所写的是必要的吗？你还能有什么辩解呢？但是，让我们来看看题辞会带来何等巨大的益处。当你看到刻在祭坛上的铭文能发挥出如此大的力量时，你就会明白神圣典籍的题辞会更具意义。保罗进入城里，找到一个祭坛，上面写着：「献给未识的上帝。」当时该怎么做呢？居民全都是外邦人，全都是不敬虔的。那他该怎么做呢？宣讲福音吗？但是他们会嘲笑的。从先知书和律法书中宣讲吗？但是他们不会相信的。那么他做了什么呢？他诉诸于祭坛，并用敌人的武器战胜了他们自己。在这里，应验了他所说的话：「我向众人作了众人的仆人，……向犹太人，我就作犹太人，……向没有律法的人，我就作没有律法的人」（哥林多前书 9:19-21）。他看见祭坛，看见铭文，并且灵里奋起。圣灵的恩典就是如此：它使得那些领受了它的人能从各处汲取益处；我们的属灵武器就是如此：「将各样的意念，」他说，「一概夺回，使它顺服基督」（哥林多后书 10:5）。于是，他看见祭坛并没有惧怕，而是将祭坛转为自己所用，或者更确切地说——他保留了文字，但改变了它们的含义。就像战场的将军，在敌军部队中看到一位骁勇的战士，然后，抓住这位战士的头发，将他转移到自己的部队中，并使他为自己而战，保罗也是这样做的：他发现刻在祭坛上的铭文，仿佛是敌军部队中的一员，他将其转移到自己的部队中，好让它与保罗一同对抗雅典人，而不是与雅典人一同对抗保罗，因为这铭文曾是雅典人的剑，曾是敌人的矛，但是这把剑反倒斩断了敌人的头颅。如果他用自己的武器取胜，那就不那么令人惊讶了，因为这是理所当然的；而当敌人的武器和他们的诡计反过来对付敌人时，这才是新奇而非凡的，当他们向我们挥舞的剑，却给他们自己造成致命伤时。
      - type: paragraph
        initial:
          ru: '4.'
          cn: '4.'
        text:
          ru: 'Такова сила Духа. Так поступил некогда и Давид. Он вышел без оружия, чтобы ясно открылась благодать Божия. Пусть, говорит, не будет ничего человеческого, когда за нас ратоборствует Бог. Итак, он вышел без оружия – и ниспроверг ту башню. Затем, так как не имел оружия, он подбежал и схватил меч Голиафа, и таким образом отсек голову иноплеменнику. Так поступил и Павел с этой надписью. А чтобы способ его победы сделался более ясным, я раскрою вам силу надписи. Итак, Павел нашел в Афинах жертвенник, на котором было написано:«неведомому Богу». Кто же был этот Неведомый, как не Христос? Видишь ли, как он«пленил»эту надпись, не во вред написавшим, а на спасение им и пользу? Что же, скажут, неужели афиняне написали ее для Христа? Если бы афиняне написали ее для Христа, то это не было бы так удивительно; а то удивительно, что они написали в одном смысле, а он мог дать тому же самому другой смысл. Прежде всего, необходимо сказать, почему афиняне написали:«неведомому Богу». Почему же они написали? Они имели много богов, или вернее – много бесов, потому что«все боги народов – идолы»(Пс.95:5). Они имели богов и отечественных, и чужеземных. Видите, как это смешно. Если Бог есть, то он не может быть чужеземным, потому что Он Владыка всей вселенной. Итак, одних из богов они приняли от отцов, других от соседних народов, как-то: от скифов, от фракийцев, от египтян, и если бы вы были сведущи во внешней науке, то я рассказал бы вам все эти повести. Поэтому, так как они не всех богов приняли с самого начала, но мало-помалу боги были вводимы у них, одни от предков, а другие при собственном их поколении, то, собравшись, они сказали друг другу: как этих мы не знали, а потом впоследствии приняли и признали, так может случиться, что есть иной неведомый, Бог Истинный, но неизвестный нам, Который по этому незнанию нашему пренебрегается нами и не почитается. Что же вышло? Они поставили жертвенник и написали;«неведомому Богу», выражая надписью следующее: если есть какой другой Бог, еще неизвестный нам, то мы будем почитать и Его. Посмотри на крайнее суеверие. Поэтому и Павел в начале речи сказал:«По всему вижу я, что вы как бы особенно набожны»(Деян.17:22), потому что вы почитаете не только известных вам богов, но и еще неизвестных вам. Они по сказанной причине написали:«неведомому Богу», а Павел так объяснил это. Они сказали это о других богах, а он обратил то же самое ко Христу, пленив смысл (надписи) и поставив ее с собою в свой отряд:«Сего-то, – говорит, –Которого вы, не зная, чтите, я проповедую вам»(Деян.17:23), потому что неведомый Бог есть никто другой, как Христос. И посмотри на его благоразумие духовное. Они могли обвинять его так: ты предлагаешь слуху нашему странное учение, вносишь новости, вводишь Бога, которого мы не знаем. Поэтому, желая отклонить подозрение в нововведении и показать, что он проповедует не нового Бога, но Того, Которого они еще прежде почитали служением, он прибавил:«Сего-то, Которого вы, не зная, чтите, я проповедую вам». Вы, говорит, предупредили меня; ваше богопочитание предварило мою проповедь. Не обвиняйте же, будто я ввожу нового Бога; я возвещаю Того, Которого вы, не зная почитаете, хотя недостойным Его образом, однако почитаете, потому что для Христа не такой ставится жертвенник, а одушевленный и духовный; но я могу возвести вас от этого и к тому. Так и иудеи некогда почитали Бога, но потом отстали от чувственного богопочитания и перешли к духовному, уверовав все. Видишь ли мудрость Павла? Видишь ли его благоразумие? Видишь ли, как он одержал над ними победу не посредством евангельских изречений или апостольских, но посредством надписи?'
          cn: '这就是圣灵的能力。古时大卫也曾如此行。他手无寸铁地出去，为要清晰显明上帝的恩典。他说，当上帝为我们争战时，愿没有人为的东西。于是，他手无寸铁地出去，倾覆了那座高塔。接着，因为他没有武器，他跑过去抓起歌利亚的剑，就这样砍下了那外邦人的头。保罗也同样对待这块碑文。为了让他的胜利方式更加清晰，我将向你们揭示这块碑文的力量。于是，保罗在雅典发现了一个祭坛，上面写着：「献给未识之神」。这位未识之神除了基督，还能是谁呢？你们看，他如何「俘获」了这块碑文，不是为了伤害那些书写者，而是为了他们的救赎和益处？那么，他们会说，难道雅典人是为了基督而写下它吗？如果雅典人是为了基督而写下它，那就不那么令人惊奇了；然而令人惊奇的是，他们以一种意义书写，而他却能赋予其另一种意义。


            首先，有必要说明雅典人为何写下：「献给未识之神」。他们为何书写？他们拥有许多神祇，或者更确切地说，是许多魔鬼，因为「万民的众神都是偶像」（诗篇 95:5）。他们既有本国的神，也有外来的神。你们看，这多么可笑。如果上帝存在，祂就不可能是外来的，因为祂是全宇宙的掌管者。于是，他们有些神祇是从祖先那里接受的，另一些则来自邻近的民族，例如：斯基泰人、色雷斯人、埃及人。如果你们精通世俗学问，我就会把所有这些故事都讲给你们听。因此，由于他们并非一开始就接受了所有的神祇，而是神祇在他们那里逐渐被引入，有些来自祖先，有些则在他们自己的世代中被引入，于是，他们聚集在一起，彼此说：既然我们不认识这些神祇，后来却接受并承认了它们，那么也可能存在另一位未识之神，是真神，但我们不认识祂，因着我们的无知，祂被我们所忽视和不敬拜。结果如何？他们竖立了一个祭坛，上面写着：「献给未识之神」，用这块碑文表达了以下的意思：如果还有其他我们尚未认识的神，我们也会敬拜祂。看看这极端的迷信。因此保罗在讲道之初就说：「众位雅典人，我看出你们凡事上非常敬虔」（使徒行传 17:22），因为你们不仅敬拜你们所认识的神，也敬拜你们尚未认识的神。


            他们因上述原因写下：「献给未识之神」，而保罗如此解释了它。他们指的是其他的神祇，而他却将其引向基督，俘获了（碑文的）意义，并使其归入自己的队伍：「他说道，你们所不认识而敬拜的这位神，我现在传给你们」（使徒行传 17:23），因为未识之神不是别人，正是基督。再看他属灵的明智。他们本可以这样控告他：你向我们宣讲异端邪说，引入新事物，介绍我们不认识的神。因此，为了消除对引入新事物的怀疑，并表明他所宣讲的并非一位新神，而是他们早已通过敬拜而尊崇的那一位，他补充道：「你们所不认识而敬拜的这位神，我现在传给你们。」他说，你们先我一步；你们对神的敬拜先于我的讲道。那么，就不要控告我引入新神；我所宣告的，是你们不认识却敬拜的那一位，尽管是以不配祂的方式，然而你们确实敬拜了，因为为基督设立的祭坛不应是这样的，而应是有灵的、属灵的；但我能将你们从前者提升到后者。同样，犹太人也曾敬拜上帝，但后来他们脱离了感官的敬拜，转变为属灵的敬拜，全然相信了。你们看到保罗的智慧了吗？你们看到他的明智了吗？你们看到他不是通过福音的言语或使徒的言论，而是通过这块碑文，取得了对他们的胜利吗？'
      - type: paragraph
        text:
          ru: 'Не оставляй же без внимания, возлюбленный, надписания Божественных изречений. Если ты будешь внимателен и осмотрителен, то и в постороннем найдешь нечто полезное; а если будешь нерадив и беспечен, то и от Божественных Писаний не будет тебе никакой пользы. Как умеющий извлекать выгоду отовсюду извлекает ее, так не умеющий, хотя бы нашел сокровище, остается ни с чем. Хотите ли, я представлю вам и другой подобный пример того, как некто говорил в ином смысле, а евангелист обратил силу сказанного в свою пользу? Слушайте же внимательно, чтобы вам уразуметь, как и он пленил смысл (речи) в послушание Христово, чтобы вам узнать, что, если мы можем пленять себе чужое, то тем более, трудясь над собственным, получим пользу. Первосвященником в тот год был Каиафа. И это было следствием нечестия иудеев, потому что они унизили достоинство священства, сделав первосвященников продажными. А прежде не было так, но только лишь со смертью оканчивалось священство первосвященника; тогда же и живые лишаемы были этой чести. Итак, первосвященником в тот год был Каиафа, который вооружал иудеев против Христа и говорил, что ему должно умереть, хотя не мог обвинить Его ни в чем, но был снедаем завистью. Такова зависть: так воздает она за благодеяния! Поэтому, приводя и причину злоумышления, он говорил:«Лучше нам, чтобы один человек умер за людей, нежели чтобы весь народ погиб»(Ин.11:50). Посмотри, как сила этого изречения была на нашей стороне, дабы тебе уразуметь, что, хотя это были слова священника, но смысл их мог сделаться духовным.«Лучше нам, чтобы один человек умер за людей, нежели чтобы весь народ погиб. Сие же он сказал не от себя», – говорит евангелист, а потому, что был архиерей,«будучи на тот год первосвященником, предсказал», что Христу должно умереть не только за иудеев, но и за все народы (Ин.11:50–51); поэтому он и сказал, что«лучше нам, чтобы один человек умер за людей, нежели чтобы весь народ погиб». Видишь ли силу Божию, как она заставляет язык врагов говорить за истину?'
          cn: '蒙爱者啊，切勿忽视神圣言语的旨趣。若你专注且审慎，甚至在世俗之事中也能发现益处；若你怠惰且漫不经心，甚至从神圣经卷中也得不到任何益处。善于获取益处之人能从任何地方获取益处，而不善此道之人，即使寻得宝藏，仍一无所有。你们可愿我再举一个相似的例子，说明某人说话的本意如何，而福音撰述者却将所说的话语力量转为己用？那么请仔细聆听，好让你们明白他如何将（言语的）意义「掳获」而顺服于基督，你们就会明白，如果我们能将他人的言语为己所用，那么，当我们努力于自己的事情时，所获益处就更大了。


            那一年大祭司是该亚法。这是犹太人不敬虔的结果，因为他们贬低了祭司职分的尊严，使大祭司可以买卖。以前并非如此，唯有大祭司去世，其祭司职分方才终止；而在那时，甚至活人也被剥夺了这项尊荣。因此，那一年大祭司是该亚法，他煽动犹太人反对基督，并说基督应该受死，尽管他无法在任何事上指控祂，却被嫉妒所吞噬。这就是嫉妒：它就是这样报答恩惠的！因此，他提出了邪恶阴谋的理由，他说：「独有一人替百姓死，免得通国灭亡，这是于你们有益的。」 (约翰福音 11:50)。


            看啊，这番言语的力量是如何在我们这一边，好让你们明白，尽管这是出自一位祭司之口的话，但其意义却能变得具有属灵的内涵。「独有一人替百姓死，免得通国灭亡，这是于你们有益的。他这话不是出于自己，」——福音撰述者说，而是因为他身为大祭司，「那一年作大祭司，就预言」基督不但为犹太人死，也要为所有的民族而死（约翰福音 11:50-51）；因此他说，「独有一人替百姓死，免得通国灭亡，这是于你们有益的。」 你看到上帝的力量了吗？祂如何使仇敌的舌头为真理发言？'
      - type: paragraph
        initial:
          ru: '5.'
          cn: '5.'
        text:
          ru: Итак, о том, чтобы не оставлять без внимания надписей Божественных Писаний, довольно сказано, если вы будете помнить. Еще хотел бы я сказать, кто писатель этой книги, когда и для чего он написал ее. Но пока удержим в памяти сказанное, а это отложим на следующий день, если Богу будет угодно. Я хочу, наконец, обратить речь к новопросвещенным. Новопросвещенными же я называю не тех только, которые крещены за два, за три или за десять дней, но и за год, и больше того, потому что и их можно так назвать. Если мы будем оказывать великое попечение о своей душе, то можно быть новопросвещенными и по прошествии десяти лет, если мы сохраним обновление, доставленное нам крещением, потому что не время делает новопросвещенным, а чистая жизнь. А невнимательный может и через два дня потерять достоинство этого названия. Я приведу вам и пример того, как новопросвещенный вскоре, через два дня, потерял и благодать, и честь новопросвещенного, а приведу пример для того, чтобы вы, видя падение, берегли собственное спасение, потому что примером не устоявших только, но и падших, вам нужно исправляться и назидаться. Симон волхв, говорится в Писании, обратился и, приняв крещение, оставался при Филиппе, взирая на знамения; но спустя немного дней, возвратился к своему нечестию и за деньги хотел купить спасение. Что же сказал Петр этому новопросвещенному?
          cn: 那么，关于不忽视神圣经文的题辞，如果你们铭记在心，就已经说得够多了。我还想说，这本书的作者是谁，他何时为何而写。但现在我们且将已说的铭记在心，至于这些，就留待他日吧，如果上帝愿意。最后，我想把我的话转向那些新受洗者。我所称的新受洗者，不仅指那些受洗两三天或十天的人，也包括受洗一年甚至更久的人，因为他们也可以这样称呼。如果我们极其关顾自己的灵魂，那么即使过了十年，我们也可以是新受洗者，如果我们保守住洗礼带给我们的更新，因为使人成为新受洗者的不是时间，而是纯洁的生命。而粗心大意的人，可能在两天之内就失去这个称谓的尊荣。我还要给你们举一个例子，说明一个新受洗者如何在短短两天之内就失去了新受洗者的恩典和尊荣，我举这个例子是为了让你们看到跌倒，从而保守自己的救恩，因为你们需要不仅借着那些站立不稳的，也借着那些跌倒的例子来纠正自己并受教导。圣经上说，西门行邪术的，他归信并受洗后，一直跟随腓利，注视着神迹；但没过几天，他就回到了自己的不敬虔中，并且想用钱财购买救恩。那么，彼得对这位新受洗者说了什么呢？
      - type: paragraph
        text:
          ru: '«Вижу тебя исполненного горькой желчи и в узах неправды... молись Богу: может быть, отпустится тебе»это нечестие (Деян.8:22–23). Еще не вышел он на подвиги, и уже пал непростительным падением. Итак, как через два дня можно пасть и потерять название и благодать новопросвещенного, так и спустя десять лет, и двадцать, и даже до последнего дня можно сохранить это светлое и почтенное имя и состояние. Свидетель этому апостол Павел, который в старости просиял еще более. Так как это обновление происходит не от природы, но в выборе того или другого состояния мы сами властны, то от нас зависит, и состарившись, остаться юными. Что касается тела, то хотя бы иной употреблял все усилия, хотя бы принимал все меры и не изнурял его, оставлял его дома, не обременял его трудами и постоянными работами, при всем том по закону природы непременно постигнет его старость; а с душой не так: если ты не будешь изнурять ее и истощать житейскими трудами и мирскими заботами, то она навсегда остается светлой, сохраняя юность. Не видите ли вы эти звезды на небесах? Уже шесть тысяч лет они светят нам, и ни одна из них не сделалась темнее. Если же там, где действует природа, столь долго остается свет непомраченным, то не гораздо ли более там, где действует воля, светлость может остаться такой же, как она сияла вначале? Или лучше – если мы захотим, то она не только останется такой, но и сделается еще светлее, так что сравнится с самими лучами солнечными. Хочешь ли знать, как можно быть новопросвещенным и спустя много времени? Послушай, что говорит Павел к людям, крещенным за много времени перед тем.«Вы сияете, как светила в мире, содержа слово жизни, к похвале моей»(Флп.2:15–16).'
          cn: '「我看见你充满苦胆，又被不义捆绑……祈求上帝吧：或许你所行的可以得蒙赦免」（使徒行传 8:22-23），这便是不虔敬。他尚未开始（属灵的）苦修，就已经堕入不可赦免的跌倒之中了。如此，正如在受洗两日后，人仍可能跌倒，失去新受洗者的名号和恩典；同样，在十年、二十年，乃至生命的最后一日，人也可能保守这光亮而尊贵的称谓和状态。使徒保罗就是这方面的见证，他在年迈之时反而愈发光芒四射。


            由于这种更新并非源于本性，而在于我们自己有权选择这种或那种状态，因此，即便我们年迈，仍能否保持青春，全取决于我们。至于身体，即使有人竭尽全力，采取一切措施，不使其劳累，将其留在家中，不使其承受劳作和持续的工作的重负，尽管如此，他仍将无可避免地依照自然法则走向衰老；而对灵魂而言则不然：假如你不以世俗的劳作和尘世的烦恼来耗竭和消耗它，它便能永远保持光亮，保有青春。


            你们难道没有看见天上的那些星星吗？它们已经照耀我们六千年了，却没有一颗变得黯淡。如果连那受制于自然法则之处，光亮都能如此长久地不被遮蔽，那么在意志发挥作用的地方，光明难道不会更长久地保持其最初的辉煌吗？或者更确切地说——如果我们愿意，它不仅能保持不变，甚至会变得更加明亮，以至于能与太阳的光芒相媲美。


            你想知道如何能在许多年后仍保持新受洗者的状态吗？请听保罗对那些早已受洗的人所说的话。


            「你们如同明光照耀在世上，持守生命之道，作我的夸耀」（腓立比书 2:15-16）。'
      - type: paragraph
        text:
          ru: Вы сняли с себя старую, разодранную одежду, помазались духовным миром, все сделались свободными; пусть же никто не возвращается к прежнему рабству; ваши дела – борьба и подвиг.
          cn: 你们脱去了陈旧破烂的衣服，受了属灵的圣油膏抹，都获得了自由；就愿没有人再回到从前的奴役；你们的事业是争战与苦修。
      - type: paragraph
        text:
          ru: 'Никто из рабов не подвизается, никто из слуг не ведет ратоборства; но если найден будет какой-нибудь раб, то с наказанием исключается из числа воинов. И не только в воинском деле, но и на Олимпийских играх господствует такой же обычай. Спустя тридцать дней, проведенных здесь, борцов выводят и обводят по предместьям города, и когда все зрители сядут на зрелище, то провозвестник возглашает: не может ли кто обвинить этого в чем-нибудь? Когда таким образом он будет избавлен от всякого подозрения в рабстве, тогда и выступает на подвиги. Если же дьявол не допускает рабов на свои подвиги, то как ты, будучи рабом греха, осмеливаешься выступать на подвиги Христовы? Там провозвестник говорит: не может ли кто обвинить этого в чем-нибудь; а здесь Христос не так говорит, но хотя бы все обвиняли человека прежде его крещения, Он говорит: Я приму его, освобожу от рабства и, сделав свободным, выведу на подвиги. Видишь человеколюбие Подвигоположника? Он не исследует прежнего, но требует отчета в последующем. Когда ты был рабом, то имел бесчисленное множество обвинителей: совесть, грехи, всех бесов; но никто из них, говорит Он, не возбудил Меня против тебя, и Я не признал тебя недостойным Моих подвигов, но допустил к борьбе – не за твое достоинство, а по Моему человеколюбию; не отступай же и подвизайся, хотя бы нужно было бегать, хотя бы вступать в рукопашный бой, хотя бы испытывать все виды ратоборства, – и не скрытно, не тщетно, не напрасно. Послушай, как поступил Павел: лишь только вышел из воды, тотчас после крещения он начал подвизаться, проповедовал, что«Сей есть Сын Божий»(Деян.9:20), и с первого же дня приводил иудеев в смущение. Но ты не можешь проповедовать, не имеешь дара учительства? Поучай делами и поведением, светом деяний.«Так да светит, – сказал Господь, –свет ваш пред людьми, чтобы они видели ваши добрые дела и прославляли Отца вашего Небесного»(Мф.5:16). Не можешь приводить иудеев в смущение словами? Сделай, чтобы они приходили в смущение от твоего поведения, сделай, чтобы и язычники пришли в смущение от твоей перемены. Когда они увидят, что тот, который прежде был распутным, порочным, беспечным, развратным, вдруг переменился, и после благодатного изменения показывает перемену в поведении, то не придут ли они в смущение и не скажут ли, как говорили некогда иудеи о слепом:«Не тот ли это,... это он, а иные: похож на него»(Ин.9:8–9)? Это – слова людей, приведенных в смущение, которые сомневаются в известном им, разногласят с самими собою, не верят собственному сознанию и собственным глазам. Тот избавился от слепоты телесной, а ты избавился от слепоты душевной; тот стал смотреть на это солнце, а ты взирай на Солнце правды. Ты познал Владыку: делай же достойное этого знания, чтобы тебе получить и Царство Небесное, благодатию и человеколюбием Господа нашего Иисуса Христа, через Которого и с Которым Отцу, со Святым и Животворящим Духом, слава, честь, держава, ныне и присно и во веки веков. Аминь.'
          cn: '奴隶无人参与角逐，仆役无人投入争战；若发现任何奴隶，他将受罚并被排除于战士之列。不仅在军事事务中如此，奥林匹克运动会也盛行着同样的习俗。在此度过三十天后，角逐者们被带出并绕城郊游行；当所有观众入座观看时，宣告者高声宣布：「难道有人能指控此人有任何不当之处吗？」当他以此方式免除了所有关于奴役的嫌疑时，便能参与角逐。如果魔鬼都不允许奴隶参与他的角逐，那么你，身为罪的奴隶，又怎敢参与基督的角逐呢？


            在那里，宣告者说：「难道有人能指控此人有任何不当之处吗？」但在这里，基督却不是这样说；即使所有人在他受洗前都指控他，祂说：「我必接纳他，释放他脱离奴役，使他获得自由，并带领他参与角逐。」你看到这位竞赛设立者的仁爱了吗？祂不追究过往，却要求对后续负责。当你是奴隶时，有无数的控告者：良心、罪孽、所有的邪魔；但祂说，他们中无人激起我反对你，我也没有认为你配不上我的角逐，却允许你参与争战——不是因为你的价值，而是出于我的仁爱；所以不要退缩，要奋力角逐，即使需要奔跑，即使要进行肉搏战，即使要经历各种争战——并且不是隐秘地，不是徒然地，不是白费力气地。


            听听保罗是如何做的：他刚从水中出来，受洗后立刻便开始投入属灵争战，宣讲「这人就是上帝之子」（使徒行传 9:20），并从第一天起就使犹太人感到困惑不安。但你不能宣讲，没有教导的恩赐吗？那么就以行为和品德来教导，以行为之光来教导。「你们的光也当这样照在人前，叫他们看见你们的好行为，便荣耀你们在天上的父。」（马太福音 5:16）——主说。你不能用言语使犹太人困惑不安吗？那么就使他们因你的品德而困惑不安，使外邦人也因你的改变而困惑不安。当他们看见那先前放荡、邪恶、轻率、败坏的人，突然改变了，并在恩典的改变之后表现出品德上的改变时，难道他们不会困惑不安并说，正如从前犹太人论及那个瞎子时所说的：「这不是那人吗？……这是他。另有人说：不，他只是像他。」（约翰福音 9:8-9）？这是那些感到困惑不安之人的话语，他们怀疑自己所知道的，与自己产生分歧，不相信自己的意识和自己的眼睛。


            那人脱离了身体的瞎眼，而你则脱离了灵魂的瞎眼；那人开始观看这太阳，而你当仰望公义的太阳。你已经认识了主宰者：那么就做与这知识相称的事，为要使你也能获得天国，这都是借着我们的主耶稣基督的恩典和仁爱，藉着祂和祂一起，愿荣耀、尊贵、权柄归于父，和圣而施生命的圣灵，从今直到永远，世世代代。阿们。'
  - type: heading2
    text:
      ru: Беседа 2-я
      cn: 第 2 讲
    children:
    - type: heading3
      text:
        ru: В собрании, бывшем через несколько времени в древней церкви, на надписание Деяний Апостольских, и о том, что добродетельная жизнь полезнее знамений и чудес, и чем отличается деятельность от знамений.
        cn: 在古代教会一次经过一段时间后举行的聚会中，讨论了《使徒行传》的命名，以及德行生活比神迹与奇事更有益，并阐明了功行与神迹有何区别。
      children:
      - type: paragraph
        text:
          ru: Объяснение слов:«На сем камне Я создамЦерковьМою, и врата ада не одолеют ее». – Таков оплот Церкви, против которого разбились все усилия язычества и ереси. –Церковьсоздана руками апостолов на основании пророков. – Почему книге Деяний Апостолов дано это именно название, а не другое какое? – Различие между деяниями и чудесами. – Деяния происходят от воли и благодати, чудеса – только от благодати; деяния именно, а не чудеса открывают Небо. – То, что делают апостолы, есть любовь, а не чудеса. – Доказательство этой мысли через объяснение чуда исцеления хромого ап. Петром у дверей храма. – Заключение и увещание.
          cn: '词语阐释：

            「在这磐石上，我要建立我的教会，阴间的门不能胜过她。」 （马太福音 16:18）——这便是教会的堡垒，异教和异端的全部努力都曾在此面前溃败。教会由使徒之手建立，在先知的基础上。——为什么《使徒行传》会得此名，而非其他名称？——行动与神迹之间的区别。——行动源于意志与恩典，神迹则仅源于恩典；正是行动，而非神迹，开启了天国。——使徒所行的，是爱，而非神迹。——这一观点的证明，借由阐释使徒彼得在圣殿门口医治瘸腿者的神迹。——结语与劝勉。'
      - type: paragraph
        initial:
          ru: '1.'
          cn: '1.'
        text:
          ru: 'После долгого времени опять мы возвратились к нашей матери, к этой вожделенной и любезной для всех церкви, к матери нашей всех и церквей. Подлинно, она – мать не только потому, что старше других по времени, но и потому, что основана руками апостольскими. Быв часто разрушаема за имя Христово, она опять была восстановляема силой Христовой, потому что не апостольские только руки основали ее, но и изречение Владыки апостолов оградило ее новым и необыкновенным способом ограждения. Не дерева и камни Он сложил, чтобы построить ее ограду; не проводил рва извне, не вколачивал свай и не воздвигал башен, чтобы обезопасить ее; но изрек только два простых слова – и этого достаточно было для нее вместо стены, башни, рва и всякого укрепления. Какие же это слова, в которых заключается такая сила?«На сем камне Я создамЦерковьМою, и врата ада не одолеют ее»(Мф.16:18). Вот стена, вот ограда, вот укрепление, вот пристань и прибежище! Несокрушимость этой стены ты можешь видеть из следующего. Христос не сказал, что только нападения людей не одолеют ее, но и самые злоухищрения ада:«Врата адова, – говорит, –не одолеют ее». Не сказал: «не будут нападать на нее», но:«не одолеют ее», – будут нападать, но не победят ее. А что значит:«врата адова»? Может быть, это выражение не ясно. Рассмотрим, что такое ворота города, и тогда узнаем, что такое«врата адова». Воротами города называется вход в город; следовательно, и«врата адова»есть опасность, ведущая в ад. Таким образом, смысл слов Его следующий: хотя бы устремились и напали такие опасности, которые в состоянии увлечь нас в сам ад,Церковьостанется непоколебимой. Он мог не допустить, чтобы Церковь испытывала бедствия: почему же допустил? Потому, что гораздо важнее допустить искушения и сделать, чтобы от них не происходило никакого зла, нежели не допускать их. Поэтому Он допустил все искушения, чтобы сделать ее опытнейшей, так как«от скорби происходит терпение, от терпения опытность»(Рим.5:3–4). А чтобы больше показать свою силу, Он исторгает ее из самих врат смерти. Для того Он и допустил быть буре, но не допустил, чтобы утопала ладья. Так и кормчему удивляемся мы не тогда, когда он спасает ладью, плывя с попутным ветром, или когда ветер дует против кормы корабля, но тогда, когда море бушует, волны ярятся, буря свирепствует, а он, противопоставив стремлению ветров свое искусство, избавляет корабль от этой бури. Так сделал и Христос. ПустивЦерковьноситься по вселенной, как корабль по морю, Он не уничтожил волнения, но избавил ее среди волнения, не утишил море, но обезопасил корабль; тогда как везде восставали народы, подобно яростным волнам, и злые духи нападали на нее, как буйные ветры, и со всех сторон поднималась буря, Он доставлял Церкви великую тишину; и, что поистине удивительно, не только буря не потопила корабля, но еще корабль укротил бурю: непрестанные гонения не только не потопили Церкви, но сами сокрушились оЦерковь. Как, каким образом и от чего? От того изречения, в котором сказано:«Врата адова не одолеют ее».'
          cn: '经过漫长的时间，我们再次回到了我们的母亲，这所有人都渴慕和亲爱的教会，这众教会之母，也是我们所有人的母亲。诚然，她是母亲，不仅因为她在时间上比其他教会更早，而且因为她是由使徒之手建立的。她曾因基督之名而屡遭毁坏，但又靠着基督的能力得以重建，因为不只是使徒的双手建立了她，而且使徒之主的话语以一种新的、非同寻常的方式护卫了她。祂没有用木头和石头来建造她的围墙；没有在外面挖壕沟，没有打桩，也没有筑起高塔来保障她的安全；但只说出了两个简单的话语——而这对于她来说，就足以代替城墙、高塔、壕沟和一切堡垒。这些话语究竟是什么，竟蕴含着如此大的能力呢？


            「我要把我的教会建造在这磐石上，阴间的门不能胜过她」（马太福音 16:18）。


            这就是城墙，这就是围墙，这就是堡垒，这就是港湾，这就是避难所！这堵城墙的坚不可摧性，你可以从以下内容看出。基督没有说，仅仅是人的攻击无法胜过她，而是说，连阴间最恶毒的诡计也无法胜过她。祂说：「阴间的门不能胜过她。」祂没有说：「它们不会攻击她」，而是：「不能胜过她」——它们会攻击，但不会战胜她。那么，「阴间的门」是什么意思呢？也许这个表达不清楚。让我们来思考一下城门是什么，那么我们就会明白「阴间的门」是什么了。城门被称为进入城市的入口；因此，「阴间的门」就是引人入阴间的危险。如此，祂这些话语的意思是：即使有那些足以将我们卷入阴间的危险猛扑而来并攻击教会，教会也将岿然不动。


            祂本可以不让教会经历苦难：但祂为何却允许了呢？因为允许试探发生，并使它们不造成任何恶果，比不让它们发生更为重要。因此祂允许所有的试探发生，以便使她更有经验，正如「患难生忍耐，忍耐生老练」（罗马书 5:3-4）。而为了更多地彰显祂的能力，祂将她从死亡之门中拯救出来。为此祂允许风暴发生，但没有让船只沉没。同样，我们惊叹于舵手，不是当他顺风航行拯救船只时，也不是当风从船尾吹来时，而是当大海狂暴、波涛汹涌、风暴肆虐之时，而他，以其技艺对抗狂风的冲击，使船只脱离这场风暴。


            基督也是如此行。祂让教会如同船只在海上航行般，在普世飘荡，祂没有消除波涛汹涌，却在波涛中拯救了她，祂没有平息大海，却使船只安稳；当各地民族如狂怒的波涛般兴起，邪恶的灵如狂风般攻击她，四面八方都刮起了风暴，祂却赐予教会极大的平静；而且，真正令人惊奇的是，风暴不仅没有使船只沉没，船只反而平息了风暴：不间断的迫害不仅没有使教会沉没，反而自身在教会面前瓦解了。怎样，以何种方式，又因何故？因着那句「阴间的门不能胜过她」的话语。'
      - type: paragraph
        text:
          ru: 'Сколько усилий употребляли язычники, чтобы упразднить это слово, чтобы сделать бессильным это изречение, и не могли уничтожить его? Потому что это – изречение Божие. Как на башню, построенную из адамантовых камней и твердо связанную железом, нападая со всех сторон, враги не могут ни пошатнуть здания, ни разрушить его связей, но удаляются, нисколько не повредив башни и не причинив никакого зла, а, только истощив собственные силы, так точно и на это изречение, как бы на высокую башню, крепко сооруженную среди вселенной, со всех сторон нападали язычники, но только обнаружили его крепость, а сами, истощив силы свои, умерли. Каких, в самом деле, злоумышлений не делали они против этого изречения? Выходили войска, поднималось оружие, вооружались цари, волновались народы, восставали города, раздражались судьи, придумывались всякого рода казни, не опущен ни один вид наказания: и огонь, и железо, и зубы зверей, и низвержение со скал, и потопление, и пучина, и дерево, и крест, и печь, и все, какие когда-либо виданные мучения, были употреблены в дело; невыразимое множество угроз, неисчислимые обещания почестей, чтобы первыми устрашить, а последними ослабить и обольстить. Не опущен был ни один вид обольщения и насилия. Отцы предавали детей, и дети отказывались от отцов, матери забывали о болезнях деторождения, и нарушались законы природы. Но основания Церкви и тогда не поколебались, и хотя война поднимаема была со стороны самых близких, однако не коснулась ее стен, по тому же изречению:«Врата адова не одолеют ее». Не смотри, что это – слова; но они – слова Божии. Словом Бог утвердил небо и словом основал землю на водах (Пс.32:6, 103:5), устроив так, что вещество твердое и тяжелое держится на легком и жидком, и море, неудержимое в ярости и поднимающееся такими волнами, словом оградил Он со всех сторон слабой стеной, – песком. Итак, чему ты удивляешься, если Тот, Кто словом утвердил небо, основал землю и положил предел морю, тем же словом оградилЦерковь, которая драгоценнее неба и земли, и моря?'
          cn: 异教徒曾付出多少努力，为了废除这个话语，为了使这句箴言失效，然而却未能将其毁灭？因为这是上帝的箴言。就像一座用金刚石建造、以铁坚固连接的塔楼，仇敌从四面八方攻击，却无法动摇其建筑，也无法破坏其连接，反而退去，丝毫未能损坏塔楼，也未造成任何伤害，仅仅耗尽了自己的力量；照样，对于这句箴言，它如同高耸的塔楼，坚固地矗立在宇宙之中，异教徒从四面八方攻击，但只是彰显了它的坚固，而他们自己，耗尽了力量，便灭亡了。他们究竟施行了何等恶毒的阴谋，反对这句箴言呢？军队出动，兵器举起，君王武装，万民骚动，城市反叛，审判官暴怒；各种各样的处决被设计出来，没有一种刑罚被遗漏：无论是火，是铁，是野兽的利齿，是坠下悬崖，是沉溺，是深渊，是木桩，是十字架，是火炉，以及所有一切曾经见过的苦刑，都被付诸实施；无法言喻的众多威胁，数不清的荣誉承诺，为了先以恐惧威吓，再以引诱削弱和迷惑。没有任何一种引诱和暴力被遗漏。父亲背弃儿女，儿女离弃父亲，母亲忘记了生产的痛苦，自然法则遭到破坏。然而，教会的根基即便在那时也未曾动摇，尽管战火是由最亲近之人挑起，却未能触及它的城墙，正如那句箴言所说：「阴间的权柄不能胜过她。」不要看这些只是言语，它们却是上帝的言语。上帝以话语坚立了诸天，又以话语将地建立在水上 (诗篇 32:6，103:5)，安排坚硬沉重的物质能够悬浮在轻盈流动的物质之上；又以话语，用一道软弱的墙——沙土——从四面围住了那在怒涛中无法抑制、汹涌澎湃的海洋。那么，你又何必惊奇呢，如果那位以话语坚立了诸天、奠定大地、划定海洋界限的上帝，竟也以同样的话语守护了教会——这比诸天、大地和海洋更为宝贵的存在呢？
