        text:
          ru: 'Но, когда здание столь непоколебимо, стена столь неразрушима, то посмотрим, как апостолы полагали основания, сколь глубокий выкапывали ров, чтобы здание было непоколебимо. Они не выкапывали в глубину; в таком труде они не имели нужды. Почему? Потому, что нашли прежнее, древнее основание, положенное пророками. Как человек, намеревающийся построить большой дом, нашедши старое основание, крепкое и непоколебимое, не разбирает этого основания, не трогает камней, но, оставив его неподвижным, на нем и воздвигает новое и позднейшее здание, так и апостолы, намереваясь созидать это великое здание, – основанную по всей вселеннойЦерковь, – не выкапывали в глубину, а нашедши древнее основание, положенное пророками, не разбирали его, не трогали их здания и учения, но оставив его неподвижным, на нем воздвигли свое учение, эту новую веру Церкви. А чтобы ты убедился, что они не трогали древнего основания, но на нем созидали, послушай самого премудрого строителя, Павла, который в точности объясняет нам это строение, потому что он есть премудрый строитель:«Как мудрый строитель, – говорит он, –положил основание»(1Кор.3:10). Посмотрим же, как полагал он основание. На другом, говорит он, древнем основании, положенном пророками. Откуда это видно?«Итак вы уже не чужие и не пришельцы, но сограждане святым..., быв утверждены на основании Апостолов и пророков»(Еф.2:19–20). Видишь ли, основание и основание, одно – от пророков, а другое – от апостолов, положенное сверху? И то удивительно, что апостолы пришли не тотчас после пророков, но спустя много времени. Почему? Потому, что так поступают отличнейшие из строителей: когда они положат основание, то не тотчас воздвигают на нем здание, чтобы не отвердевшее и недавно построенное основание не оказалось неспособным вынести тяжесть стен. Поэтому они дают много времени камням окрепнуть, и уже тогда, когда увидят, что камни хорошо скрепились, воздвигают на них и тяжелые стены. Так сделал и Христос: Он дал основанию пророческому окрепнуть в душах слушателей и учению их утвердиться, и когда увидел, что здание непоколебимо и священное учение внедрено так, что может выдержать новое любомудрие, тогда послал апостолов – воздвигнуть стены Церкви на основании пророков. Поэтому апостол не сказал: «построенные» (οικοδομηθέντες) на основании пророков, но «воздвигнутые» (εποικοδομηθέντες), построенные сверху. Построим же, как они были воздвигнуты.'
          cn: '然而，当房屋如此坚定不移，墙壁如此坚不可摧时，我们便要看看使徒们是怎样奠定根基的，他们挖了多深的沟，以使房屋坚定不移。他们并未深挖；在此类工程中，他们无此必要。为何？因为他们寻得了先前由先知们所奠定的古老根基。如同一个人，意欲建造一栋大屋，寻得坚固不移之旧根基后，不拆毁此根基，不动其石，而是任其不动，于其上建造新近之房屋；使徒们亦是如此，他们意欲建造此伟大之房屋——在普世建立的教会——并未深挖，而是寻得了先知们所奠定的古老根基，未拆毁，未动他们的房基与教诲，而是任其不动，于其上建立了他们的教义，即教会这新的信仰。为使你确信他们未动古老的根基，而是在其上建造，请听最有智慧的建筑师保罗所言，他精确地向我们解释此结构，因为他是有智慧的建筑师：他说：「我如同一个有智慧的工头，立好了根基」（哥林多前书 3:10）。那么，我们便来看看他是如何奠定根基的。他说，是建立在另一个，由先知们所奠定的古老根基之上。何以见得？「所以，你们不再是外人和客旅，乃是圣徒的同国之民，……被建造在使徒和先知的根基上」（以弗所书 2:19-20）。


            你可看见，根基与根基，一个来自先知，另一个则由使徒们在其上所奠定？令人称奇的是，使徒们并非紧随先知之后即来，而是经过了漫长的时间。为何？因为最卓越的建筑师们莫不如此行事：当他们奠定根基后，不立刻在其上建造房屋，以防尚未坚固且新近建造的根基，无力承受墙壁的重量。因此，他们给石头充分的时间使其坚固，待他们看到石头已牢固结合时，随即在其上建造沉重的墙壁。基督亦如是行：祂让先知的根基在听者的灵魂中坚固，让他们的教诲得以确立；当祂看到根基坚定不移，神圣的教诲已深植人心，能经受住新的智慧考验时，便差遣使徒们，在先知的根基上建造教会的墙壁。因此，使徒并未说在先知根基上「建造」(οικοδομηθέντες)，而是「竖立」(εποικοδομηθέντες)其上，即从上方建造。那么，我们便按照他们所竖立的方式来建造吧。'
      - type: paragraph
        text:
          ru: 'Но откуда мы узнаем это? Откуда, как не из книги Деяний, о которой мы и в предыдущие дни беседовали с вами? Кажется, тогда остался за нами небольшой долг, который нужно уплатить вам сегодня. Какой этот долг? Мы должны истолковать самое надписание книги, потому что оно не просто и не ясно, как думают многие, но требует истолкования. Какое же надписание книги? «Деяния Апостолов». Не кажется ли оно ясным? Не кажется ли известным и очевидным для всех? Но если вы вникнете в эти слова, то вы увидите, какая глубина в этом надписании. Почему писатель не сказал: «чудеса» апостолов? Почему не надписал: «знамения» апостолов или: «силы и чудотворения» апостолов, но: «Деяния Апостолов?» Не одно и то же – деяния и знамения; не одно и то же – деяния и чудеса; не одно и то же – деяния, чудотворения и силы; но великая разность между теми и другими. Деяние есть дело собственного усердия, а чудо есть дар Божественной благодати. Видишь ли, какое различие между деянием и чудом? Деяние есть плод человеческих трудов, а чудо есть знак Божественного дарования; деяние берет свое начало от нашего произволения, а чудо имеет своим источником благодать Божию; последнее – от горней помощи, а первое – от дольнего расположения. Деяние слагается из того и другого, и из нашего усердия, и из Божественной благодати, а чудо проявляет одну только вышнюю благодать, нисколько не имея нужды в наших трудах. Деяние состоит в том, чтобы быть кротким, целомудренным, умеренным, обуздывать гнев, побеждать похоть, подавать милостыню, являть человеколюбие, упражняться во всякой добродетели; это – деяние, труд, усилие наше. А чудо состоит в том, чтобы прогонять бесов, отверзать очи слепым, очищать тела прокаженных, укреплять расслабленные члены, воскрешать мертвых и совершать другие подобные чудотворения. Видишь ли, какое различие между деяниями и чудесами, деятельностью и знамениями, нашим усердием и Божиею благодатью?'
          cn: 但我们从何得知这一切呢？又怎能不是从《使徒行传》中得知呢？我们前些日子也曾与各位谈论过这卷书。看来，那时我们还欠着一个小小的债，今日需要向各位偿还。这债是什么呢？我们必须解释这本书的题名，因为它并非像许多人所想的那样简单明了，而是需要加以阐释。那么，这本书的题名是什么？《使徒行传》。难道它不清楚吗？难道它不是众所周知、显而易见的吗？但若各位深入探究这些词语，就会看到这题名蕴含着何等深邃的意义。为何作者没有说「使徒的奇迹」？为何没有题作「使徒的神迹」，或「使徒的能力和施行奇迹」，而是《使徒行传》呢？行为与神迹并非同一；行为与奇迹并非同一；行为、施行奇迹与能力亦非同一；它们之间存在着巨大的差异。行为是出于自身的殷勤努力，而奇迹则是出自神圣恩典的恩赐。各位看到了吗，行为与奇迹之间有何等不同？行为是人类劳动的果实，而奇迹是神圣赐予的标志；行为源于我们的自由意志，而奇迹的源头是上帝的恩典；后者（奇迹）来自于上天的助佑，而前者（行为）则来自于地上的意愿。行为由两者共同构成，即我们的殷勤努力和神圣的恩典，而奇迹则只显明上层的恩典，丝毫不需要我们的劳作。行为在于温顺、贞洁、节制，约束怒气、战胜私欲、施舍财物、展现仁爱、操练诸般美德；这便是我们的行为、劳作、努力。而奇迹则在于驱逐邪魔、开启盲者的眼睛、洁净麻风病人的身体、坚固瘫痪的肢体、使死者复活并施行其他类似的奇迹。各位看到了吗，行为与奇迹之间、德行与神迹之间、我们的殷勤努力与上帝的恩典之间，存在着何等不同？
      - type: paragraph
        initial:
          ru: '3.'
          cn: '3.'
        text:
          ru: 'Хочешь ли, я покажу тебе и другое различие? Ради вас я сегодня предлагаю это слово, чтобы вы узнали, что такое чудо и знамение. Чудо – больше и страшнее, и оно превосходит наше естество, а деяние и образ жизни, хотя меньше знамений, но полезнее и плодотворнее, потому что воздаяние бывает за труды и награда – за усердие. И чтобы тебе убедиться, что деяние плодотворнее и полезнее знамения, вспомни, что добрая деятельность и без знамений возводила совершавших ее на Небо, а чудеса и знамения без доброй жизни не могли довести даже до преддверия к нему. А как это, я покажу; вы же замечайте, как деяния имеют преимущество при раздаянии наград, как знамения сами по себе не спасают тех, которые совершают их, а деяние само по себе, без всего другого, доставляет спасение совершающим его.«Многие скажут Мне, – говорит Христос, –в тот день: Господи! Господи! не от Твоего ли имени мы пророчествовали?»Это – знамение и чудо.«Не Твоим ли именем бесов изгоняли? и не Твоим ли именем многие чудеса творили?»Видишь ли во всем этом знамения и чудеса? Посмотрим же, что говорит Бог. Так как здесь одни только чудеса, и никаких добрых дел, то«отойдите, –  говорит Он, –от Меня, делающие беззаконие»(Мф.7:22–23). Но если Ты не знаешь их, то как знаешь, что они делали беззаконие? Так сказал Он, дабы ты знал, что слова:«Я никогда не знал вас», означают не незнание, но отчуждение и отвращение.«Я никогда не знал вас». За что же, скажи мне?«Не Твоим ли именем бесов изгоняли?»За то, говорит Он, Я чуждаюсь и отвращаюсь от вас, что вы и при дарованиях не сделались лучшими, что вы, получив такую честь, остались при том же нечестии.'
          cn: '你愿意吗，我再给你看另一个区别？为了你们，我今日提出这番话，好让你们明白何谓神迹与奇事。神迹更大，也更可畏，且它超越了我们的本性；而行为和生活方式，虽然逊于奇事，但更有益、更硕果累累，因为回报是因辛劳而来，赏赐是因热忱而得。为让你确信行为比奇事更硕果累累、更有益处，请记住，良善的行动，即便没有奇事，也已将其行者带入了天国；而神迹与奇事，若无良善的生活，甚至无法引人进入天国门槛。这如何体现，我将展示；你们则请留意，在赏赐分发时，行为如何占优，奇事本身如何不能拯救其行者，而行为本身，不借助于其他一切，却能为行者带来救恩。


            基督说：「当那日，许多人要对我说：『主啊！主啊！我们不是奉祢的名说预言吗？』」这便是奇事与神迹。「我们不是奉祢的名赶鬼吗？不是奉祢的名行许多神迹吗？」在这一切中，你可曾看到奇事与神迹？那么，我们来看上帝说什么。由于这里只有神迹，而没有一件善行，祂便说：「你们这些作恶的人，离开我！」(马太福音 7:22-23)。但如果祢不认识他们，祢又怎会知道他们作了恶呢？祂如此说，是为了让你明白，「我从来不认识你们」这句话，所指的并非不知晓，而是疏远和厌弃。「我从来不认识你们。」那么，究竟是为了什么，请告诉我？「不是奉祢的名赶鬼吗？」祂说：正因为如此，我才疏远并厌弃你们，即便拥有恩赐，你们也未曾变得更好；你们蒙受如此尊荣，却依然停留在同样的不虔不义中。'
      - type: paragraph
        text:
          ru: «Отойдите от Меня... Я никогда не знал вас». Что же? Неужели в древности недостойные получали дарования, и развратные по жизни совершали знамения и удостаивались Божественных даров, не заботясь о добродетельной жизни? Получали по человеколюбию Божию, а не по собственному достоинству. Тогда нужно было, чтобы учение благочестия посеяно было везде, потому что было начало и первые опыты веры. Как превосходный земледелец прилагает великое попечение о новонасажденном дереве, которое недавно посадил он в недра земли и которое еще нежно, окапывая его со всех сторон, ограждая и камнями, и тернием, чтобы оно не было вырвано ветрами или испорчено животными, или не потерпело вреда от чего-нибудь другого, а когда увидит, что оно и укрепилось, и поднялось в высоту, то отнимает ограды, потому что само дерево уже в состоянии защитить себя от всякого подобного вреда, – так было и с верой. Когда она была новонасажденной, когда она была нежной, когда она еще недавно насаждена была в душах людей, то со всех сторон окружена была великими попечениями; а когда она укрепилась, укоренилась и поднялась в высоту, когда наполнила всю вселенную, тогда, наконец, Христос отнял ограды и уничтожил подпорки. Поэтому вначале и недостойным были подаваемы дарования, потому что в древности для веры нужна была эта помощь; теперь же и достойным они не даются, потому что сила веры уже не имеет нужды в такой помощи. А дабы тебе убедиться, что и те не ложно, но действительно совершали знамения, и что дарования были подаваемы и недостойным людям, для того, чтобы, кроме вышесказанного, достигалась и другая цель, чтобы они, устыдившись дара Божия, оставили свое нечестие, – вспомни об Иуде, одном из двенадцати апостолов. Все признают, что он совершал знамения, изгонял бесов, воскрешал мертвых, очищал прокаженных, и однако он лишился Царства Небесного. Знамения не могли спасти его, потому что он был разбойник, вор и предатель Господа. Это доказывает, что знамения, без доброго поведения, без жизни чистой и строгой, не могут спасти; а что добрая жизнь, не получающая утешения от знамений, и без их помощи, сама по себе, может с дерзновением вводить людей в Царство Небесное, о том послушай самого Христа, Который говорит:«Приидите, благословенные Отца Моего, наследуйте Царство, уготованное вам от создания мира»(Мф.25:34). За что? За то, что они воскрешали мертвых, очищали прокаженных, изгоняли бесов? Нет; а за что? Вы видели Меня, говорит Он,«ибо алкал Я, и вы дали Мне есть; жаждал, и вы напоили Меня; был странником, и вы приняли Меня; был наг, и вы одели Меня»(Мф.25:35–36).
          cn: '「离开我吧……我从来不认识你们。」那么呢？难道说，在古代，不配之人领受恩赐，生活放荡之人行奇迹并蒙受上帝的恩赐，却不顾及德行生活吗？他们领受，是因着上帝的慈爱，而非因着他们自己的配得。那时，需要将敬虔的教义播撒到各处，因为那是信心的开端和最初的萌芽。正如一位杰出的农夫，悉心照料一棵新栽的树，这树是他刚栽入地土之中，且尚稚嫩。他从四面为它挖土、用石头和荆棘围护它，以免它被风拔出，或被动物毁坏，或遭受其他任何损害。而当他看到这树已然坚固，并向上生长时，他便撤去围护，因为这树本身已能抵御任何此类损害——信心也是如此。当信心初次被栽种时，当它尚且稚嫩时，当它刚被栽入人们的灵魂之中时，它便受到来自四面八方的悉心照料；而当它坚固、扎根并向上生长时，当它充满整个宇宙时，那时，基督终于撤去围护，并移除了支柱。因此，起初，恩赐甚至赐予不配之人，因为在古代，信心需要这种帮助；而如今，它们甚至不赐予配得之人，因为信心的力量已不再需要这样的帮助。


            为使你确信，那些人并非虚假地，而是真实地行了奇迹，以及恩赐确曾赐予不配之人，除了上述目的之外，还为了达到另一个目的，即让他们因上帝的恩赐而羞愧，从而离弃他们的不敬虔——请回想十二使徒之一的犹大。所有人都承认，他曾行奇迹、驱逐鬼魔、使死人复活、洁净麻风病人，然而他却失去了天国。奇迹无法拯救他，因为他是个强盗、小偷和背叛上主之人。这证明，奇迹，若无良善的品行，若无圣洁而严谨的生活，是无法拯救的；而良善的生活，即使未曾从奇迹中获得慰藉，也无奇迹的帮助，其本身亦能坦然地引领人进入天国。关于这一点，请听基督亲口所言：「你们这蒙我父赐福的，来承受那创世以来为你们所预备的国吧」(马太福音 25:34)。为了什么呢？是为了他们使死人复活、洁净麻风病人、驱逐鬼魔吗？不；那又是为了什么呢？他说：你们看见了我，「因为我饿了，你们给我吃；我渴了，你们给我喝；我作客旅，你们留我住；我赤身露体，你们给我穿」(马太福音 25:35-36)。'
      - type: paragraph
        text:
          ru: 'Никаких чудес, а все добрые дела. Таким образом, как там одни только чудеса, и тотчас наказание, потому что чудеса были без добрых дел, так здесь одни только дела, а никаких чудес, и тотчас спасение, потому что добрые дела сами по себе могут спасти тех, которые имеют их. Вот почему и этот блаженный, доблестный и дивный Лука надписал свою книгу: «Деяния Апостолов», а не «чудеса апостолов», хотя они совершали и чудеса. Чудеса были в свое время и прошли, а деяния во всякое время должны оказывать все, желающие спастись. А так как мы должны соревновать не знамениям, но деяниям апостолов, то он так и надписал свою книгу. Чтобы ты не сказал, или лучше – чтобы не сказали ленивые, когда мы убеждаем их подражать апостолам, и говорим: подражай Петру, соревнуй Павлу, будь подобным Иоанну, последуй Иакову, – чтобы они не сказали: мы не можем, мы не в состоянии, потому что апостолы воскрешали мертвых, очищали прокаженных, – апостол, обуздывая бесстыдное наше оправдание, говорит: умолкни, не возражай; не чудеса, а добрая жизнь вводит в Царство Небесное.'
          cn: 没有任何神迹，只有一切的善行。如此说来，正如彼处只有神迹而无善行，故立即受罚；此处则只有善行而无神迹，故立即蒙受救赎，因为善行本身就能拯救那些拥有它们的人。这就是为什么这位蒙福的、尊贵的、奇妙的路加，给他的书题名为《使徒行传》，而非《使徒神迹》，尽管使徒们也曾施行神迹。神迹曾于特定时期显现并已逝去，而一切渴望蒙受救赎的人，则在任何时候都应当行出善行。既然我们应当效法使徒的不是神迹，而是他们的行事为人，所以他才如此题写了他的书。为免你说，或者说，为免怠惰的人说——当我们劝勉他们效法使徒，并说：「效法彼得，仿效保罗，像约翰一样，跟随雅各」时——为免他们说：「我们不能，我们办不到，因为使徒们曾使死人复活，洁净麻风病人」——使徒勒住我们无耻的托辞，说：「住口，不要争辩；不是神迹，而是良善的生活引人进入天国。」
      - type: paragraph
        text:
          ru: Итак, подражай жизни апостолов – и ты будешь иметь нисколько не меньше апостолов. Не знамения сделали их апостолами, но чистая жизнь. А что это составляет отличие апостольства и признак учеников Христовых, послушай, как сам Христос указывает на этот признак. Он, начертывая образ учеников своих и показывая, что составляет отличительный признак апостольства, сказал:«По тому узнают все, что вы Мои ученики».
          cn: 因此，要效法使徒们的生活——你所拥有的将丝毫不会少于使徒们。不是神迹使他们成为使徒，而是纯洁的生活。而这构成了使徒职分的特征，也是基督门徒的标志，请听基督自己如何指出这个标志。祂，在描绘祂门徒的形象并展示使徒职分的独特标志时，曾说：「凭此，众人就将知道你们是我的门徒。」
      - type: paragraph
        text:
          ru: '«По тому», – из чего? Из того ли, чтобы творить чудеса, воскрешать мертвых? Нет, говорит: а из чего?«По тому узнают все, что вы Мои ученики, если будете иметь любовь между собою»(Ин.13:35). Любовь же относится не к чудесам, а к деятельности, потому что«любовь есть исполнение закона»(Рим.13:10). Видишь ли признак учеников Христовых? Видишь ли отличие апостольства? Видишь ли образец? Видишь ли начертание? Не ищи же ничего более. Сам Владыка изрек, что любовь отличает учеников Его. Итак, если ты имеешь любовь, то ты стал апостолом и даже первым из апостолов.'
          cn: 「借此」，——藉着什么呢？难道是藉着行神迹，叫死人复活吗？不，祂说：那是藉着什么呢？「借此，众人就认出你们是我的门徒了，如果你们彼此相爱的话。」(约翰福音 13:35) 然而，爱不属于神迹，而属于行动，因为「爱是律法的成全。」(罗马书 13:10) 你看见基督门徒的标志了吗？你看见使徒职分的与众不同之处了吗？你看见榜样了吗？你看见描绘了吗？那么，就不要再寻求别的了。主宰亲自宣告，爱是祂门徒的与众不同之处。因此，如果你拥有爱，那么你就成了使徒，甚至是使徒之首了。
      - type: paragraph
        initial:
          ru: '4.'
          cn: '4.'
        text:
          ru: 'Хочешь ли узнать то же и из других мест? Христос, беседуя с Петром, сказал:«Симон Ионин! любишь ли ты Меня больше, нежели они?»(Ин.21:15). А для получения Царства Небесного ничто не может сравниться с тем, как если мы окажемся любящими Христа так, как должно любить Его. Потом Он показал и признак. Какой же именно? При каких делах мы можем любить Христа больше апостолов? Мертвых ли воскрешая, или совершая другие какие-либо чудеса? Нет; но что совершая? Послушаем самого предмета любви – Христа. Если ты, говорит Он,«любишь... Меня больше, нежели они..., паси агнцев Моих». Вот и здесь одобряется деятельность, потому что заботиться о других, сострадать, предстательствовать, не искать своего, но всего того, что должен иметь пастырь, все это относится к деятельности, а не к чудесам и не к знамениям. Но апостолы, скажешь, за чудеса сделались такими? Нет, не за чудеса, а за жизнь, и ею особенно они просияли. Поэтому Христос и говорил им:«Так да светит свет ваш пред людьми, чтобы... видели»люди не чудеса, но«ваши добрые дела и прославляли Отца вашего Небесного»(Мф.5:16). Видишь ли, как везде блистает деятельность, одобряется жизнь добродетельная? Хочешь ли, я покажу тебе, что и сам Петр, этот верховный из апостолов, который явил и высочайший образ жизни, и творил чудеса, превышающие естество человеческое, если сравнить то и другое – и чудеса, и жизнь его, удостоился чести более за жизнь, чем за знамения? Выслушай следующее событие.«Петр и Иоанн шли вместе в храм в час молитвы девятый»(Деян.3:1). Не читай без внимания этого повествования, но остановись тотчас на самом вступлении в него и заметь, какая была между ними любовь, согласие и единодушие, какое во всем имели они общение между собою, и как они соединены были союзом божественной дружбы во всех делах, и в трапезе, и в молитве, и в хождении, и во всем прочем являлись вместе друг с другом. Если же эти столпы, твердыни, имевшие великое дерзновение перед Богом, нуждались во взаимной помощи и совершали все при взаимном содействии, то не гораздо ли более мы, слабые, бедные и ничтожные, имеем нужду во взаимной помощи?«Брат от брата вспомоществуемый,– говорит Писание, –как город крепкий»(Притч.18:20). И еще:«Как хорошо и как приятно жить братьям вместе»(Пс.132:1)? Были только Петр и Иоанн, но они имели Иисуса посреди себя:«Где двое или трое собраны во имя Мое, – сказал Он, –там Я посреди них»(Мф.18:20). Видишь ли, как важно быть вместе? Но они не просто были вместе: и мы теперь все вместе; но должно быть вместе посредством союза любви, по расположению воли; и как тела наши теперь находятся близ друг друга и соединяются в одном месте, так должны соединяться и сердца.«Петр и Иоанн шли вместе в храм»(Деян.3:1). Но завеса раздралась, Святое Святых опустело, поклонение на одном месте прекращено; Павел взывает:«Желаю, чтобы на всяком месте произносили молитвы мужи, воздевая чистые руки»(1Тим.2:8).'
          cn: 你想从别处也了解同样的事吗？基督与彼得交谈时说：「西门，约翰的儿子，你爱我比这些更深吗？」（约翰福音 21:15）。而为获得天国，没有什么能与我们以当爱祂的方式爱基督相比。随后祂又显明了一个记号。究竟是什么呢？我们行何种事，能比使徒们更爱基督呢？是使死人复活，还是施行其他某种奇迹呢？不；那是行什么呢？让我们听听爱本身——基督所说的。祂说：「如果你爱我比他们更深……，就牧养我的羊羔。」此处亦认可行动，因为照顾他人、同情、代求、不求己益，而是拥有牧者当有的一切，所有这些都属于行动，而非奇迹或异兆。但你会说，使徒们是因为奇迹才成为那样吗？不，不是因为奇迹，而是因为他们的生命，他们尤其因此而发光。因此基督也对他们说：「你们的光也当这样照在人前，叫人看见你们的好行为，便荣耀你们在天上的父」（马太福音 5:16）。你可曾看到，行动如何处处闪耀，德行生活如何受到称赞？你愿我向你展示，甚至使徒之首彼得——他既展现了至高的生活榜样，也行了超越人性的奇迹——若比较两者，即他的奇迹和他的生命，他获得尊荣更多是因为生命，而非异兆吗？请听接下来的事迹。「彼得和约翰在申初祷告的时候，一同上圣殿去」（使徒行传 3:1）。切勿粗心大意地阅读这段记述，而要立刻停留在其开篇之处，并留意他们之间是何等的爱、和谐与同心合意，他们在凡事上彼此之间是何等的相交，以及他们如何在一切事务中——无论是在用膳、祷告、行走还是其他一切事上——都以神圣友谊的纽带彼此结合，相互陪伴。既然这些在上帝面前有极大坦然无惧的柱石和坚固台，尚且需要互相帮助，并且在互相协助下完成一切，那么我们这些软弱、贫乏、微不足道的人，岂不更需要互相帮助吗？「兄弟互相扶助，如同坚固的城」（箴言 18:20），圣经说。又说：「看哪，弟兄和睦同居，是何等地善，何等地美！」（诗篇 132:1）当时只有彼得和约翰，但他们有耶稣在他们中间：「因为无论在哪里，有两三个人奉我的名聚会，那里就有我在他们中间」（马太福音 18:20），祂说。你可曾看到，在一起是何等重要？但他们并非仅仅是在一起：我们现在也都在一起；然而，我们当借着爱的联盟，凭着意志的意愿而在一起；正如我们的身体现在彼此靠近，汇聚于一处，我们的心也当如此连合。「彼得和约翰一同上圣殿去」（使徒行传 3:1）。然而圣殿的幔子已经裂开，至圣所已然空置，在单一场所的敬拜已被废止；保罗呼吁说：「我愿男人在各处祷告，举手洁净」（提摩太前书 2:8）。
      - type: paragraph
        text:
          ru: Для чего же они идут в храм на молитву? Не возвратились ли они опять к иудейской немощи? Да не будет; но они снисходят к немощнейшим, исполняя изречение Павла, в котором говорится:«Для Иудеев я был как Иудей»(1Кор.9:20). Они снисходят к слабым, чтобы те не оставались слабыми. А с другой стороны, там собирался весь город. Как искусные рыболовы ставят свои сети в тех заливах рек, в которых собирается вся рыба, чтобы легче получить добычу, так точно и апостолы, эти духовные рыбари, спешили к тому заливу, где собирался весь город, чтобы там раскинуть сеть Евангелия и легче получить добычу. Так поступали они, подражая Учителю, потому что и Христос говорит:«Каждый день с вами... был  в храме»(Мф.26:55). Для чего«в храме»? Чтобы обратить к Себе находящихся в церкви. Так и апостолы пошли как бы на молитву, а намеревались сеять там учение.«В храм в час молитвы девятый». И час этот был избран ими не напрасно. Я часто говорил вам, что в этот час отверст Рай и разбойник вошел в него, что в этот час уничтожено проклятие, принесена Жертва за вселенную, рассеян мрак, воссиял свет и чувственный, и духовный.«В час... девятый». Когда другие спят глубоким сном после обеда и опьянения, тогда они, трезвые и бодрые, пламенея великой ревностью, спешили на молитву. Если же они имели нужду в молитве, в молитве столь напряженной, в молитве столь усердной, они, которые имели такое дерзновение пред Богом, то, что будем делать мы, страждущие бесчисленным множеством ран и не прилагающее к ним врачества молитвы? Великое оружие – молитва. Хочешь ли узнать, сколь великое оружие – молитва? Апостолы оставляли попечение о бедных для того, чтобы иметь более времени для упражнения в молитве.«Выберите, – говорили они, –из среды себя семь человек..., а мы постоянно пребудем в молитве»(Деян.6:3–4).
          cn: 他们为何进圣殿祷告呢？难道他们又回到了犹太人的软弱吗？断乎不是；但他们是俯就那最软弱的人，遵行保罗的教导，其中说：「对于犹太人，我就作犹太人」（1哥林多前书 9:20）。他们俯就软弱之人，为要使他们不再软弱。而另一方面，整个城市的人都聚集在那里。正如熟练的渔夫在河流的那些海湾中撒网，所有鱼类聚集之处，为要更容易捕获渔获；同样，使徒们，这些属灵的渔夫，也赶往那个海湾，整个城市的人都聚集在那里，为要在那里撒下福音的网，并更容易捕获渔获。他们如此行，是效法了导师，因为基督也说：「我天天同你们在圣殿里」（马太福音 26:55）。为何要「在圣殿里」呢？为要使在殿中的人归向祂。使徒们也是这样，他们前去如同为了祷告，而实则打算在那里撒下教导。「在祷告的第九时辰进殿」。他们选择这个时辰并非徒然。我常对你们说，在这时刻，乐园被开启，那强盗也进入了其中；在这时刻，咒诅被消除，为普世献上了祭物，黑暗被驱散，感官之光和属灵之光都已闪耀。「在……第九时辰」。当旁人在饭后和酒醉之后沉睡之时，彼时，他们清醒而警醒，怀着炽热的巨大热忱，赶往祷告。如果连他们都如此需要祷告，需要如此恳切的祷告，需要如此热切的祷告，他们这些在上帝面前拥有如此胆量的人，那么，我们这些身受无数创伤，却不将祷告的良药敷于其上的人，又将如何行呢？祷告是伟大的武器。你想知道祷告是多么伟大的武器吗？使徒们舍弃了对穷人的关顾，为要腾出更多时间用于祷告的操练。「你们从自己人中选出七位……，我们则要专心以祷告为事」（使徒行传 6:3-4）。
      - type: paragraph
        initial:
          ru: '5.'
          cn: '5.'
        text:
          ru: 'Но, как я сказал, – не будем уклоняться от предмета, именно, что Петр и показал деятельность, и творил чудеса, и более заслужил похвалу за дела, – он вошел во святилище помолиться; и вот там хромой от чрева матери своей, которого приносили к дверям храма (Деян.3:2). От самого рождения состав его был поврежден, и болезнь была выше врачебного искусства, чтобы тем более открылась благодать Божия. Итак, этот хромой лежал при дверях храма и, увидев входящих апостолов, обратился к ним, желая получить от них милостыню. Что же Петр?«Взгляни на нас», – говорит он (Деян.3:4). Достаточно взгляда, чтобы удостовериться в бедности: не нужно ни слов, ни доказательств, ни ответа, ни объяснения; одежда уже показывает тебе неимущего. Вот это всецело дело апостольства – говорить бедному так, чтобы не от бедности только избавить его, но и внушить ему: ты увидишь большее богатство.«Серебра, –  говорит, –и золота нет у меня; а что имею, то даю тебе: во имя Иисуса Христа Назорея встань и ходи»(Деян.3:6). Видишь ли бедность и богатство: бедность в деньгах и богатство в дарованиях? Он не избавил от нищеты в деньгах, но исправил нищету естества.'
          cn: 但如我所说，——我们不要偏离主题，即，彼得既彰显了作为，又施行了神迹，且因其行为更蒙赞扬——他进入圣所祷告；就在那里，有个生来瘸腿的，被带到圣殿门口（使徒行传 3:2）。从他出生起，他的肢体便已受损，且他的病症超乎医术，好让上帝的恩典更加彰显。于是，这瘸腿的躺卧在圣殿门口，见到使徒们进来，便转向他们，渴望从他们那里得到施舍。彼得怎么说呢？他说：「看我们！」（使徒行传 3:4）。仅仅一个眼神，足以确信其贫困：无需言语、证据、答复或解释；衣着便已向你显明其贫乏。这便是全然的使徒之工——如此对贫穷者说话，不仅是使其摆脱贫困，更是使其领悟：你将看到更大的财富。他说：「金银我都没有，但我所有的，我给你：奉拿撒勒人耶稣基督之名，起来行走吧！」（使徒行传 3:6）。你可曾看到贫乏与富足：钱财上的贫乏与恩赐上的富足？他并未使其摆脱金钱上的贫困，却纠正了其本性上的贫乏。
      - type: paragraph
        text:
          ru: 'Посмотри на кротость Петра.«Взгляни на нас». Он не стал укорять, не стал порицать, как часто делаем мы с приступающими к нам, упрекая их в лености. Разве это заповедано тебе, человек? Бог повелел тебе не упрекать в лености, а помогать бедности; не сделал тебя обличителем нечестия, а поставил врачом нечестия; не для того, чтобы ты порицал беспечность, но чтобы подавал руку лежащему; не для того, чтобы ты осуждал образ жизни, но чтобы утолял голод. А мы поступаем напротив: не думая утешить приступающих к нам подаянием денег, мы еще растравляем раны их, осыпая их укоризнами. Но (апостол) даже извиняется перед бедным и говорит кротко, по словам Писания:«Приклоняйбез огорченияухо твое к нищему и отвечай ему ласково, с кротостью»(Сир.4:8).«Серебра и золота нет у меня;  а что имею, то даю тебе: во имя Иисуса Христа Назорея встань  и ходи»(Деян.3:6).'
          cn: '看看彼得的谦和。


            「看着我们。」他没有责备，也没有斥责，不像我们对待前来求助的人时常做的那样，责怪他们懒惰。人啊，这难道是命令给你的吗？上帝命令你不是要责备懒惰，而是要帮助贫困；他没有使你成为不虔敬的指责者，而是将你立为不虔敬的医治者；他不是要你指责粗心大意，而是要你向跌倒的人伸出援手；他不是要你审判生活方式，而是要你平息饥饿。而我们却反其道而行之：不想用金钱施舍来安慰那些来到我们面前的人，我们反而加剧了他们的伤口，倾泻责备于他们。然而，那位使徒甚至向那贫穷的人道歉，并且谦和地说道，按照圣经的话语：


            「你当不带苦涩地侧耳倾听穷人的话，并且温柔、谦和地回答他。」（西拉书 4:8）


            「金银我都没有，我所拥有的，就给你：奉拿撒勒人耶稣基督的名，起来行走吧！」（使徒行传 3:6）'
      - type: paragraph
        text:
          ru: 'Здесь два обстоятельства: образ жизни и чудо. Образ жизни в словах:«серебра и золота нет у меня», потому что к жизни относится – не ставить ни во что земные предметы, отвергнуть имущество, презреть настоящую суетность; а чудо – восставить хромого, исцелить поврежденные члены. Итак, вот и образ жизни, и чудо. Посмотрим же, за что Петр удостаивается похвалы. Что говорил он? То ли, что он творил чудеса? Хотя и тогда он уже творил чудеса, однако не говорил этого, а что?«Вот, мы оставили всё и последовали за Тобою»(Мф.19:27). Видишь ли жизнь и чудо, но жизнь получающую венец? Что отвечал Христос? Он одобрил и похвалил это.«Истинно говорю вам, – сказал Он, –что вы», (оставившие дома свои и прочее), – не сказал: «вы, воскрешавшие мертвых», – но:«вы,оставившие имущество свое,сядете... на двенадцати престолах»; и всякий, кто откажется от всего имущества своего, удостоится этой чести (Мф. 19:28–29). Ты не можешь восставить хромого, как Петр? Но ты можешь сказать подобно ему:«серебра и золота нет у меня». Если скажешь это, то станешь близко к Петру; или лучше – если не скажешь, но сделаешь это. Ты не можешь уврачевать сухую руку? Но ты можешь свою руку, которая от бесчеловечия сделалась сухой, заставить протянуться из человеколюбия.«Да не будет, – говорит  Писание, –рука твоя распростертою к принятию и сжатою при отдании»(Сир.4:35). Видишь ли, что не сухость, а бесчеловечие сгибает руку? Выпрями же ее человеколюбием и милостыней. Ты не можешь изгнать беса? Но ты изгони грех – и получишь большую награду. Видишь ли, как всегда жизнь и добрые дела получают большую похвалу и большее воздаяние, нежели чудеса? Если хочешь, мы докажем это тебе и другим образом. Пришли к Нему, говорит евангелист,«семьдесят ученикови, радуясь,говорили: Господи! и бесы повинуются нам о имени Твоем». И говорит им:«Однакож тому не радуйтесь, что духи вам повинуются, но радуйтесь тому, что имена ваши написаны на небесах»(Лк.10:17, 20). Видишь ли, как всегда жизнь удостаивается похвалы?'
          cn: '这里有两种境况：一是生活方式，二是奇迹。


            生活方式体现在话语中：「我没有金银」，因为这生活之道在于不看重尘世万物，舍弃财产，轻视现世的虚妄；而奇迹则是使瘸子站立起来，医治受损的肢体。


            所以，这便是生活方式和奇迹。那么，我们来看看彼得为何蒙受赞扬。他说了什么？是说他行了奇迹吗？虽然那时他已经行了奇迹，然而他没有说这个，那说了什么呢？「看哪，我们已经撇下一切跟从祢了。」（马太福音 19:27）你看，生活方式与奇迹，但获得冠冕的是生活方式，你可看见了？基督如何回答？祂称许并赞扬了这一点。「我实在告诉你们，」祂说，「你们」（就是那些撇下房屋及一切的）——祂没有说：「你们这些使死人复活的」，而是说：「你们这些撇下自己财物的人，要坐在……十二个宝座上」；凡撇下自己一切财物的人，都必蒙受这尊荣。（马太福音 19:28-29）


            你不能像彼得那样使瘸子站立起来吗？但你却能像他一样说：「我没有金银。」如果你说了这话，你就与彼得很接近了；或者更好的是——如果你不只是说，而是去做了。你不能医治枯干的手吗？但你却能让你那因不仁而枯干的手，因着仁爱而伸展出去。「经上说：『愿你的手不要在接受时张开，而在施予时却紧握不放。』」（西拉书 4:35）你看，使手弯曲的不是枯干，而是不仁？那么，就用仁爱和施舍使它伸直吧。你不能驱逐魔鬼吗？但你却能驱逐罪恶——并且将获得更大的奖赏。你看，生活方式和善行总是比奇迹获得更大的赞扬和更大的赏报，不是吗？


            如果你愿意，我们可以用另一种方式向你证明这一点。传福音者说：有七十个门徒来到祂那里，他们欢喜地对祂说：「主啊！甚至连鬼魔也因祢的名服从我们。」祂就对他们说：「然而，不要为鬼魔服从你们而欢喜，却要为你们的名字记录在天上而欢喜。」（路加福音 10:17，20）你看，生活方式总是蒙受赞扬的，不是吗？'
      - type: paragraph
        initial:
          ru: '6.'
          cn: '6.'
        text:
          ru: 'Повторим теперь вышесказанное.«По тому узнают все, что вы Мои ученики, если будете иметь любовь между собою»(Ин.13:35). Вот в жизни, а не в чудесах указан признак учеников Христовых. Петр,«любишь... Меня больше, нежели они..., паси агнцев Моих»(Ин.21:15). Вот и другой признак, который также относится к жизни. Третий признак:«Однакож тому не радуйтесь, что духи вам повинуются, но радуйтесь тому, что имена ваши написаны на небесах»(Лк.10:20); и это опять дело жизни. Хочешь ли знать и четвертое доказательство на это?«Так да светит свет, –  cказал Господь, –ваш пред людьми, чтобы они видели ваши добрые дела и прославляли Отца вашего Небесного»(Мф.5:16). Вот и здесь являются дела. Также, когда Он говорит:«И всякий, кто оставит домы, или братьев, или сестер, или отца, или мать, или жену, или детей, или земли, ради имени Моего, получит во сто крат и наследует жизнь вечную»(Мф.19:29), то хвалит деятельность и строгую жизнь. Видишь, как ученики Христовы познаются из того, что любят друг друга; любящий Христа больше апостолов отличается тем, что пасет братию; имеющим радоваться повелевается радоваться не о том, что они изгоняют бесов, но что они написаны на Небе; прославляющими Бога оказываются сияющие делами, и получающие жизнь и стократное воздаяние получают этот дар за отвержение всего настоящего. Подражай всем им и ты; тогда можешь и сделаться учеником Христовым, и быть причислен к друзьям Божиим и прославлять Бога, и получить вечную жизнь, и нисколько не будет для тебя препятствием к получению всех благ то, что ты не творишь знамений, если ведешь строгую жизнь. И сам Петр получил это имя не за чудеса и знамения, но за ревность и искреннюю любовь: не за то, что воскрешал мертвых или исцелил хромого, он назван так, но за то, что показал искреннюю веру с исповеданием, он наследовал это имя:«Ты – Петр, и на сем камне Я создамЦерковьМою». За что? Не за то, что он творил чудеса, но за то, что сказал:«Ты – Христос, Сын Бога живого»(Мф.16:16, 18). Видишь, что и самое название Петра получило начало не от чудес, а от пламенной ревности.'
          cn: '让我们现在重复上述所言。

            「你们若有彼此相爱的心，众人因此就认出你们是我的门徒了。」(约翰福音 13:35) 可见，基督门徒的特征在于生命，而不在于神迹。彼得，「你爱我比这些更深吗？……你牧养我的羊羔。」(约翰福音 21:15) 这是另一个特征，它亦关乎生命。第三个特征：「然而，不要因邪灵顺服你们而欢喜，倒要因你们的名字记录在天上而欢喜。」(路加福音 10:20) 这又是一件生命之事。你想知道第四个证据吗？「你们的光也当这样照在人前，」上主说，「叫他们看见你们的善行，便颂扬你们在天上的父。」(马太福音 5:16) 在这里，行动再次显明。同样，当祂说：「凡为我的名缘故，撇下房屋，或是弟兄、姊妹、父亲、母亲、妻子、儿女、田地的，必得百倍，并承受永生。」(马太福音 19:29) 祂便赞许积极的行动和严谨的生活。你看，基督的门徒是借着彼此相爱而被认出的；比众使徒更爱基督的，显出其不同之处在于牧养弟兄；被吩咐要欢喜的，不是因他们驱逐邪灵而欢喜，而是因他们的名字记录在天上；荣耀上帝的，乃是那些以善行发光的人；承受永生并得百倍报偿的，是因他们舍弃了今世的一切而获得这恩赐。你也要效法他们所有人；这样你就能成为基督的门徒，被列入上帝的朋友之列，荣耀上帝，承受永生；倘若你不施行神迹，这一点绝不会成为你领受所有恩福的障碍，只要你过着严谨的生活。彼得自己得到这个名字，不是因为神迹和异能，而是因为他的热心和真诚的爱：不是因为他使死人复活或医治瘸腿的，他才被这样称呼，而是因为他借着认信显明了真诚的信仰，他才承受了这个名字：「你是彼得，我要在这磐石上建立我的教会。」为此？不是因为他施行神迹，而是因为他说：「祢是基督，永生上帝的儿子。」(马太福音 16:16，18) 你看，彼得这个名字本身得其源头，不是来自神迹，而是来自火热的热心。'
      - type: paragraph
        text:
          ru: 'Но когда я упомянул о Петре, то мне пришел на память и другой Петр, общий наш отец и учитель (т.е. епископ Антиохийский Флавиан), который, сделавшись преемником добродетелей того Петра, наследовал и кафедру его. Одно из преимуществ нашего города то, что вначале он имел учителем своим верховного из апостолов. Подлинно надлежало, чтобы город, прежде всей вселенной украсившийся именем христиан, имел пастырем своим первого из апостолов. Но, получив этого учителя, мы не удержали его до конца, а передали царствующему Риму; или лучше – и мы удержали его до конца, потому что хотя мы не имеем тела Петрова, но имеем веру Петрову, как бы Петра; имея веру Петрову, мы имеем самого Петра. Таким образом, и взирая на подражающего Петру, мы, по-видимому, взираем на самого Петра. И Христос ведь назвал Иоанна Илией не потому, чтобы Иоанн был действительно Илией, но потому, что он пришел в духе и силе Илии. Поэтому, как Иоанн назван Илией, потому, что пришел в духе и силе Илии, так и этот потому, что пришел с исповеданием и верой Петра, по справедливости может быть удостоен и такого названия: сродство по жизни производит общение и в названиях. Будем же все молиться, чтобы он достиг и старости Петровой, потому что апостол и окончил жизнь в старости:«Когдаже, – сказал ему Господь, –состаришься,... и другой препояшет тебя, и поведет, куда не хочешь»(Ин.21:18). Будем же испрашивать и ему долголетней жизни, потому что продолжающаяся старость его делает еще более цветущей нашу духовную юность, которая да сохранится навсегда цветущей молитвами и этого и того Петра, благодатию же и человеколюбием Господа нашего Иисуса Христа, Которому слава и держава со Святым Духом, ныне и присно, и во веки веков. Аминь.'
          cn: '然而，当我提到彼得时，我便想起了另一位彼得，我们共同的父和导师（即安提阿主教弗拉维安）。他既已成为那位彼得美德的继承者，也继承了他的主教座。我们城市的一项优势在于，最初它拥有使徒之首作为自己的导师。的的确确，这座在整个普世之前以基督徒之名蒙受荣光的城市，理当拥有使徒之首作为自己的牧者。然而，我们虽领受了这位导师，却未能将他保留到底，而是将他传给了掌权的罗马；或者更确切地说——我们也保留他到底了，因为我们虽没有彼得的身体，却拥有彼得的信仰，如同拥有彼得本人；拥有彼得的信仰，我们便拥有彼得本人。如此一来，当我们凝视那效法彼得之人时，我们仿佛也凝视着彼得本人。基督称若望为以利亚，并非因为若望确实是以利亚，而是因为他带着以利亚的精神与能力而来。所以，正如若望被称为以利亚，是因为他带着以利亚的精神与能力而来，这位（弗拉维安）也是因为他带着彼得的认信与信仰而来，便可理所当然地受此称谓：生命上的亲缘亦会带来称谓上的共通。


            让我们大家一同祈祷，愿他也能达到彼得的寿数，因为使徒也是在老年时结束了生命：上主对他说：「你年老的时候，……别人要把你束上，带你到你所不愿意去的地方。」（约翰福音 21:18）让我们也为他祈求长寿，因为他持续的寿数使我们的属灵青春更加繁盛。愿我们的属灵青春因这位彼得和那位彼得的祷告，并借由我们主耶稣基督的恩典与仁慈，永远保持繁盛，愿荣耀和权能归于祂与圣灵，从今时直到永远，世世无尽。阿们。'
  - type: heading2
    text:
      ru: Беседа 3-я
      cn: 第 3 讲
    children:
    - type: heading3
      text:
        ru: О том, что чтение Священных Писаний полезно и что оно делает внимательного недоступным для рабства и стеснительных обстоятельств; также о том, что название апостолов есть название многих достоинств и что апостолы получили силу и власть гораздо большую, чем внешние властители и сами цари, и наконец к новопросвещенным.
        cn: 关于阅读圣经的益处，以及它如何使留心的人免于奴役和窘迫的环境；又关于使徒的称谓蕴含着诸多美德，以及使徒们获得了远大于世俗的掌权者和君王们自身的能力和权柄；最后致新受启者。
      children:
      - type: paragraph
        text:
          ru: Вступление в беседу, в которой проповедник хвалит своих слушателей за их ревность в слушании Слова Божия и сравнивает Священное Писание с восхитительным лугом и с неиссякаемым источником. – Человек, повседневно читающий Священное Писание, есть«как дерево, посаженное при потоках вод». – Проповедник постепенно объясняет своим слушателям Священное Писание, чтобы оно, падая на их души, как приятный дождь, лучше проникало в них. – Обобщение предшествующих бесед и предмет настоящей беседы. – О том, что такое апостол. – Благодать апостольства обнимает в себе полноту всех даров благодати. – Апостол есть советник в духовной жизни. – Сравнение между апостолом и начальником. – Увещание к новокрещенным.
          cn: 讲道序言，讲道者在其中称赞听众对聆听上帝话语的热心，并将圣经比作一片令人愉悦的草地和一个永不枯竭的泉源。— 每日阅读圣经的人，乃是「像一棵树，栽在溪水旁」（诗篇 1:3）。— 讲道者循序渐进地向他的听众解释圣经，好让圣经如同甘霖降临他们的灵魂，更能渗透他们的内心。— 前几次讲道的总结和本次讲道的主题。— 关于何为使徒。— 使徒的恩典包含着所有恩赐的丰盛。— 使徒是属灵生活中的劝导者。— 使徒与长官之间的比较。— 对新受洗者的劝勉。
      - type: paragraph
        initial:
          ru: '1.'
          cn: '1.'
        text:
          ru: 'Когда я, будучи призываем к беседе перед таким множеством народа, посмотрю на бедность моего ума, то ужасаюсь и отступаю; но когда посмотрю на ваше усердие и ненасытное желание слушать, то ободряюсь, возбуждаюсь и охотно вступаю на поприще учения, потому что вы своим усердием и желанием слушать могли бы и каменную душу сделать легче всякого пера. Как животные, живущие в пещерах и в течение зимы скрывающиеся в скалах, увидев наступившее лето, оставляют убежища, собираются вместе с прочими животными и веселятся вместе с ними, так и душа моя, скрывавшаяся как бы в некоторой пещере сознания своей немощи, увидев усердие вашей любви, оставляет пещеру, вступает в ваше собрание и вместе с вами восторгается прекрасными восторгами Писаний, на духовном и божественном луге, в раю Писания. Подлинно, чтение Божественных Писаний есть духовный луг и рай сладости, рай сладости превосходнейший того Рая. Этот рай Бог насадил не на земле, а в душах верующих; этот рай Он поставил не в Эдеме и не ограничил одним местом на востоке, но распространил по всей земле и распростер до пределов вселенной. А что Он распространил Писания по всей вселенной, об этом послушай пророка, который говорит:«По всей земле проходит звук их, и до пределов вселенной слова их»(Пс.18:5). Хотя бы ты отправился к индейцам, которых первых озаряет восходящее солнце, хотя бы удалился на океан, или на британские острова, хотя бы приплыл в Евксинский понт, хотя бы достиг северных стран, везде услышишь, как все любомудрствуют о том, что содержится в Писании, другим языком, но не другой верой, различными наречиями, но одинаковым умом. Хотя звуки голоса различны, но образ благочестия не различен; хотя они остаются варварами по языку, но любомудрствуют по мыслям; хотя они странны по наречию, но благочестивы по жизни. Видишь ли обширность рая, распростертого до пределов вселенной? Здесь нет змея; это место свободно от диких зверей, и ограждается благодатию Духа. Этот рай, как тот, имеет и источник, – источник, из которого вытекает множество рек, а не четыре. Не Тигр, не Евфрат, не египетский Нил и не индийский Ганг, но бесчисленное множество рек изливает этот источник. Кто говорит это? Сам Бог, даровавший нам такие реки.«Кто верует в Меня, –  говорит Он, –у того, как сказано в Писании, из чрева потекут реки воды живой»(Ин.7:38). Видишь ли, как из этого источника вытекают не четыре реки, а бесчисленное множество? И не по множеству рек только, но и по естеству своему удивителен этот источник, потому что в нем не потоки воды, а дары Духа. Этот источник отделяется в каждую душу верующих, и не уменьшается; разделяется, и не истощается; распределяется, и не убавляется: во всех он находится всецело, и в каждом всецело. Таковы дары Духа. Хочешь ли узнать свойство этих вод, как они не похожи на те, но гораздо лучше и удивительнее тех? Послушай опять самого Христа, беседующего с самарянкой, чтобы тебе узнать обилие этого источника.«Вода, – говорит  Он, –которую Я дам ему, сделается в нем источником воды, текущей в жизнь вечную»(Ин.4:14). Не сказал: «выходящей»; не сказал: «изливающейся»; но:«текущей»(άλλομένου) – указывая нам потоками на ее изобилие. Ключевые воды обыкновенно исторгаются и вытекают отовсюду, где источники не могут удержать их в своих недрах, но, будучи преодолеваемы непрестанным притоком, извергают их отовсюду. Поэтому, желая показать обилие потоков, Он сказал:«текущей», а не: «выходящей». Хочешь ли узнать и свойство ее? Узнай из ее употребления: она полезна не для жизни настоящей, но для жизни вечной.'
          cn: '当我受召在如此众多的民众面前进行交谈时，若我审视自身心智的贫乏，我便惊恐退缩；但当我审视你们的热忱和永不满足的倾听渴望时，我便得到鼓励，受到激励，并欣然步入学道之途，因为你们凭着自己的热忱和倾听渴望，能使一颗如石般的心灵，比任何羽毛都更加轻盈。


            如同那些栖息于洞穴、在冬季藏匿于岩石间的动物，一旦看到夏季降临，它们便离开藏身之处，与其余的动物汇聚一处，并与它们一同欢欣；同样地，我的灵魂，如同藏匿于某种洞穴，深知自身之软弱，一旦看到你们爱心的热忱，便离开这洞穴，加入你们的聚会，与你们一同，在属灵而神圣的草地上，在《圣经》的乐园中，尽情领受《圣经》所带来的美妙狂喜。


            诚然，阅读圣经是属灵的草地和甘甜的乐园，一个比那个伊甸园更超越的甘甜乐园。这个乐园，上帝并非将其栽种于地上，而是植于信徒的灵魂之中；祂并非将其置于伊甸园中，亦未将其局限于东方一地，而是遍布全球，延伸至普世的边界。至于祂将圣经遍布于整个宇宙，请听先知所言：「祂的量带通遍天下，祂的言语传到地极。」(诗篇 18:5)。即便你前往印第安人之地，他们是首先被朝阳照耀的民族；即便你远涉重洋，或抵达不列颠群岛；即便你航行至欧克辛斯蓬特（黑海），即便你抵达北方诸国，你到处都会听到，众人以哲思探讨《圣经》所载之事，语言各异，信仰却无二致；方言不同，心智却同一。


            虽声音各异，敬虔的形式却无差异；虽在语言上仍属异族，思想上却富含哲理；虽在方言上显得陌生，生活却敬虔。你们看，这乐园的广阔，遍及宇宙的边界？这里没有蛇；此地没有野兽，并被圣灵的恩典所守护。


            这个乐园，如同彼乐园一般，也有一源泉——从这源泉中涌出无数河流，而非仅仅四条。不是底格里斯河，不是幼发拉底河，不是埃及的尼罗河，也不是印度的恒河，而是这源泉倾泻出无以计数的河流。谁说这话？正是上帝祂自己，祂赐予我们这样的河流。「信我的人，」祂说，「正如经上所说，从他腹中将流出活水的江河来。」(约翰福音 7:38)。你们看，这源泉涌出的并非四条河流，而是无以计数的河流？这源泉不仅因河流众多，更因其本质而令人惊叹，因为其中并非水流，而是圣灵的恩赐。


            这源泉分赐予每一个信徒的灵魂，却不减损；分裂开来，却不枯竭；分配出去，却不减少：它在所有（灵魂）中都完整无缺，在每一个（灵魂）中也都完整无缺。圣灵的恩赐便是如此。你们想了解这些水的特质吗？它们如何不同于那些（地上的水），却远比那些更美好、更奇妙？请再次聆听基督亲自与撒玛利亚妇人对话，好让你了解这源泉的丰盛。「我所赐的水，」祂说，「在他里头要成为泉源，直涌到永生。」(约翰福音 4:14)。祂未说「涌出」，未说「流出」，而说「涌流」（άλλομένου）——以此向我们指出其丰沛的泉涌。泉水通常会四处喷涌流出，泉眼无法将它们 удерживать 在深处，而是被持续不断的涌流所胜，将它们从四面八方喷射出来。因此，祂意欲彰显其丰沛的涌流，祂说「涌流」，而非「涌出」。你们想了解它的特性吗？从它的用途中便可得知：它并非有益于今生，而是有益于永生。'
      - type: paragraph
        text:
          ru: Будем же пребывать в этом раю, будем сидеть при этом источнике, чтобы нам не потерпеть того же, что потерпел Адам, и не лишиться Рая; не будем принимать пагубного совета, не допустим к себе обольщения от дьявола; будем пребывать внутри, потому что здесь великая безопасность, – будем пребывать в чтении Писаний. Как сидящие при источнике, наслаждающиеся его прохладой, и при наступлении жара часто погружавшие в него лицо свое устраняют удушливый жар потоками, и, если беспокоит их жажда, легко облегчают мучение, имея врачевство вблизи в источнике, так и находящийся при источнике Божественных Писаний, если почувствует беспокоящий его пламень непристойной похоти, легко потушит пламень, погрузив душу в эти воды; и если будет беспокоить его горячий гнев, воспламеняя сердце, как поджигаемый котел, то, покропив немного этой воды, он тотчас укротит бесстыдную страсть; и от всех порочных помыслов, как бы из среды пламени, избавляет душу чтение Божественных Писаний.
          cn: '让我们留在乐园中，安坐在这泉源旁，以免我们遭受亚当所遭受的，也不致失去乐园；我们不要听从有害的建议，不要容许自己被魔鬼引诱；让我们留在里面，因为这里有极大的安全——让我们恒常阅读圣经。


            就像那些坐在泉源旁，享受着其清凉的人，当酷热来临时，他们常常将脸浸入其中，用水流消除窒息的热气；如果口渴困扰他们，他们也轻易地缓解了痛苦，因为解药就在近旁的泉源中，同样，那些亲近神圣圣经泉源的人，如果感受到不洁情欲的火焰困扰他，就能轻易熄灭这火焰，将灵魂浸入这些水中；而且，如果炽热的怒火困扰他，如同被点燃的炉子般燃烧着他的心，那么，洒上一点这水，他就能立刻平息这无耻的激情；阅读神圣圣经，能将灵魂从所有邪恶的意念中，仿佛从火焰中解救出来。'
      - type: paragraph
        initial:
          ru: '2.'
          cn: '2.'
        text:
          ru: Поэтому и великий пророк Давид, зная пользу от чтения Писаний, уподобляет того, кто постоянно внимает Писаниям и наслаждается беседой с ними, растению, всегда цветущему, стоящему при потоках вод, когда говорит:«Блажен муж, который не ходит на совет нечестивых и не стоит на пути грешных и не сидит в собрании развратителей, но в законе Господа воля его, и о законе Его размышляет он день и ночь! И будет он как дерево, посаженное при потоках вод»(Пс.1:1–3).
          cn: '因此，伟大的先知达味，深知诵读圣经的益处，将那持续专注于圣经并享受与它们交谈的人，比作一棵永远盛开、栽在水流旁的植物，当他说：


            「福哉斯人，他不行不虔敬者的建议，不站在罪人的路上，也不坐在亵慢者的聚会中，唯他的意愿在于上主的法律，他昼夜思想上主的法律！他必像一棵树，栽在水流旁」（诗篇 1:1-3）。'
      - type: paragraph
        text:
          ru: Как дерево, посаженное при источниках вод, стоящее при самих потоках, получая постоянное орошение, бывает безопасно от всякой неблагоприятной погоды, не боится ни пламенных лучей, не страшится ни сухого воздуха, потому что, имея внутри себя самого достаточную влажность, скоро отражает и отстраняет приступающий отвне избыток всякой солнечной теплоты, так и душа, стоящая при потоках Божественных Писаний и постоянно напояемая ими, собирая в самой себе эти струи и росу Духа, бывает безопасной от всяких неблагоприятных обстоятельств; хотя бы болезнь, хотя бы порицание, хотя бы клевета, хотя бы злословие, хотя бы насмешки, хотя бы какая-нибудь леность, хотя бы все бедствия вселенной напали на такую душу, она легко отражает пламень страстей, находя достаточное утешение в чтении Писаний. Подлинно, ни величие славы, ни высота власти, ни присутствие друзей, и ничто другое из вещей человеческих не может утешать в скорби так, как чтение Божественных Писаний. Почему? Потому, что те вещи тленны и скоропреходящи, – почему и утешение от них скоропреходящее, – а чтение Писаний есть собеседование с Богом. Когда же Бог утешает находящегося в скорби, то какое из настоящих обстоятельств может повергнуть его в уныние?
          cn: '仿佛一棵树，栽在水泉旁，立在溪流边，得到持续的浇灌，就能免遭一切恶劣天气的影响，不惧怕炙热的阳光，也不畏惧干燥的空气。因为它本身有充足的水分，能迅速地反射并驱散从外部袭来的过剩日光热量。同样，灵魂若常立于上帝圣经的溪流旁，并不断被其滋润，将这些圣灵的水流和甘露汇集在自身之内，就能免受一切不利境况的侵害。无论是疾病，是责备，是诽谤，是恶言，是嘲讽，或是任何怠惰，甚至宇宙间一切的灾祸都攻击这样的灵魂，它都能轻易地抵御情欲的火焰，因为它在阅读圣经中找到了充足的慰藉。


            确实，无论是荣耀的伟大、权柄的高位、朋友的陪伴，还是人类的其他任何事物，都无法像阅读上帝圣经那样在悲伤中带来慰藉。为何如此？因为那些事物是朽坏且转瞬即逝的——所以它们所带来的慰藉也是转瞬即逝的——然而阅读圣经则是与上帝的对话。既然上帝安慰了处于悲伤中的人，那么现今的哪种境况又能使他陷入沮丧呢？'
      - type: paragraph
        text:
          ru: Итак, будем внимательно заниматься чтением, не два только эти часа, – потому что для безопасности нам недостаточно одного простого слушания, – но постоянно; и, пришедши домой, каждый пусть возьмет в руки Библию и вникает в смысл сказанного, если он хочет получать постоянную и достаточную пользу от Писания. И то дерево, которое стоит при потоках, не два или три часа сообщается с водами, но каждый день и каждую ночь. Потому это дерево и украшается листьями, потому и изобилует плодами, – хотя никто из людей не напояет его, – что оно стоит при потоках, привлекает к себе влагу корнями и как бы какими-нибудь проходами передает полезные соки всему своему составу. Так и читающий постоянно Божественные Писания и стоящий при их потоках, хотя бы не имел никакого толкователя, постоянным чтением, как бы некоторыми корнями, приобретает себе великую пользу. Потому и мы, зная ваши заботы, развлечения, множество занятий, медленно и мало-помалу ведем к уразумению Писаний, чтобы медленностью толкования крепче удержать сказанное в вашей памяти. Так и сильный дождь, проливаясь стремительно, омывает поверхность земли, но глубине ее не приносит никакой пользы; а нисходящий на лицо земли медленно и мало-помалу, подобно елею, проникает в глубину ее проходами, как бы некоторыми жилами, и, наполняя влагой недра ее, делает ее способнейшей к произведению плодов. Поэтому и мы вливаем в ваши души этот духовный дождь мало-помалу, – потому что Писания подобны духовным облакам, а слова и мысли их подобны дождю, который гораздо лучше обыкновенного дождя, – и вливаем в вас этот духовный дождь мало-помалу для того, чтобы слова наши проникли в самую глубину. Поэтому, уже четвертый день сегодня продолжая толкование, мы не могли пройти одного надписания, но еще вращаемся около него. Лучше раскопать малое поле и, проникнув в глубину, найти великое сокровище необходимого, нежели, изрыв по поверхности множество нив, трудиться без пользы, тщетно и напрасно. Знаю, что многие негодуют на такую медленность; но я не смотрю на их укоризны, а забочусь о вашей пользе. Те, которые могут ходить быстрее, пусть подождут медленнейших из братий; те могут подождать этих, а слабейшие не могут гнаться за теми. Поэтому и Павел говорит, что мы не должны преждевременно принуждать слабых, которые не могут сравняться с совершенством сильных, но должны мы сильные переносить немощи слабых (1Кор.8:9–13). Мы заботимся о вашей пользе, а не о пустой славе; поэтому и медленно излагаем мысли.
          cn: '所以，我们要专心致志地阅读，不仅仅是这两个小时，——因为仅仅是简单的听闻，不足以保障我们的安全，——而是要持之以恒；并且，回到家中，每个人都应拿起《圣经》，并深入体会所言之意，如果他渴望从圣经中获得持续且充足的益处。那生长在溪水旁的树，并非只与溪水接触两三个小时，而是日夜不辍。正因为如此，这棵树才枝繁叶茂，硕果累累，——尽管没有人为它浇灌，——因为它生长在溪水旁，用根系吸收水分，并仿佛通过某些通道，将有益的汁液输送到其整个植株。同样，那持续阅读圣经并停留于其溪流旁的人，即便没有任何释经者，通过持续的阅读，仿佛用某些根系，为自己获得巨大的益处。


            因此，我们也深知你们的忧虑、分心和诸多事务，便循序渐进地引导你们理解圣经，以便通过缓慢的讲解，使所言之语更牢固地铭刻在你们的记忆中。同样，倾盆大雨急促而下，冲刷着地表，但对深层土壤毫无益处；而那缓缓降落、细水长流般的雨水，如同膏油一般，通过通道，仿佛某些经脉，渗入土壤深处，并用水分充满其深层，使其更适于结出果实。因此，我们也循序渐进地将这属灵的甘霖倾注于你们的灵魂，——因为圣经如同属灵的云朵，其言语和思想如同雨水，远胜于普通的雨水，——我们循序渐进地将这属灵的甘霖倾注于你们，是为了让我们的言语能够深入你们心灵的最深处。


            因此，今天我们已是第四天继续讲解，但我们仍未能解完一个标题，仍围绕着它探究。宁可挖掘一小块田地，深入其中，寻得所需的巨大宝藏，也不愿在无数田地的表层耕耘，劳而无功，白费心力。我知道许多人对这种缓慢感到不满；但我并不理会他们的指责，而是关心你们的益处。那些能够走得更快的人，请等待较慢的弟兄们；前者可以等待后者，而弱者却无法追赶强者。因此保罗也说，我们不应过早地强迫那些无法与强者之完美相比的软弱者，而是我们这些刚强者理应担当软弱者的软弱（哥林多前书 8:9-13）。我们关心的是你们的益处，而非虚假的荣耀；因此我们才缓慢地阐述思想。'
      - type: paragraph
        initial:
          ru: '3.'
          cn: '3.'
        text:
          ru: Так, в первый день я говорил о том, что не должно оставлять без внимания надписания (священных книг), когда прочитал вам и надпись на жертвеннике, и показал мудрость Павла, который воина чужого и стоявшего в отряде неприятелей переставил в собственный отряд. Этим окончилось все учение в первый день. Затем во второй день мы исследовали, кто писатель книги (Деяний) и благодатью Божьей нашли, что это – евангелист Лука, и подтвердили исследование многими доказательствами как яснейшими, так и более глубокими. Я знаю, что многие из слушателей не следили за последними из упомянутых доказательств; но, несмотря на то, мы не перестанем касаться более тонких мыслей. Яснейшее будет полезно для людей простых, а глубочайшее для тех, которые смотрят более зорко. Эта трапеза должна быть различна и разнообразна, потому что различны вкусы званных. Итак, в первый день мы беседовали о надписании, во второй день о писателе книги, а в третий день вчера говорили присутствовавшим о начале этой книги и показали, как знают слушавшие, что такое деятельность и что такое чудо, что такое жизнь и что такое знамение, чудотворение и сила, и какое различие между тем и другим; как одно больше, а другое полезнее, и как одно само по себе доставляет Царство (Небесное), а другое, если не сопровождается деятельностью, оставляется вне его преддверия. Сегодня нужно сказать об остальной части надписания и объяснить, что значит имя«апостолов», потому что то имя не простое, но оно есть название власти, власти величайшей, власти духовнейшей, власти вышней. Но будьте внимательны. Как в житейских делах есть много властей, но не все они одинакового достоинства, а одни больше, другие меньше, например, – если начнем исчисление с низшей, – есть городской судья, есть выше его правитель народа, после него есть другой больший начальник, также есть военачальник, есть наместник, есть и выше их власть, власть консулов, и все они – власти, но не все одинакового достоинства, так и властей духовных много, но не все они одинакового достоинства, а всех их более – достоинство апостольства. Так от чувственного надобно руководить вас к духовному. Так поступил и Христос, когда в беседе о Духе упомянул о воде:«Всякий, пьющий воду сию, – сказал Он, –возжаждет опять, а кто будет пить воду, которую Я дам ему, тот не будет жаждать вовек»(Ин.4:13–14). Видишь ли, как Он руководил женщину от чувственного к духовному? Так делаем и мы, от низшего восходим к высшему, чтобы речь была яснее. Поэтому, беседуя о власти, мы упомянули о власти не духовной, а чувственной, чтобы от этой руководить вас к той. Вы слышали, сколько исчислили мы житейских властей, как одни из них больше, а другие меньше, и как власть консулов стоит выше всех, как бы вершина и глава их; посмотрим же и на власти духовные. Между властями духовными есть власть пророчества, есть другая власть – евангелиста, есть – пастыря, есть – учителя, есть – дарований, есть – исцелений, есть – толкования языков. Все это – названия даров, а на деле – степени начальства и власти. Пророк есть начальник; у нас же изгоняющий бесов есть начальник; у нас же пастырь и учитель есть начальник духовный; но всех их больше – власть апостольская. Из чего это видно? Из того, что превосходнее всех их апостол. Как между чувственными властями консул, так между духовными апостол занимает первое место. Послушаем самого Павла, который, исчисляя власти, на высшем месте ставит апостольскую. Что же говорит он?«И иных Бог поставил в Церкви, во-первых, Апостолами, во-вторых, пророками, в-третьих, учителями; далее, иным дал силы чудодейственные, также дары исцелений»(1Кор.12:28).
          cn: '这样，在第一天，我谈到不应忽视（圣书的）题记，当时我向你们宣读祭坛上的题字，并展示了保罗的智慧，他将一个异邦的、站在敌人队伍中的战士调入了自己的队伍。第一天的所有教导就此结束。接着在第二天，我们探讨了（使徒行传）这部书的作者是谁，借由上帝的恩典，我们发现那是福音传道者路加，并以许多或清晰或深奥的证据证实了这一探讨。我知道许多听众没有跟上后面提到的证据；但尽管如此，我们不会停止触及更精微的思想。最清晰的对简单之人有益，而最深奥的则对那些洞察力更敏锐之人有益。这筵席必须多样且丰富，因为被召之人的口味各不相同。因此，在第一天我们谈论了题记，在第二天谈论了书的作者，而在第三天，昨天我们向在场的听众谈论了这本书的开端，并向听众们揭示了什么是作为，什么是神迹；什么是生命，什么是征兆；什么是行异能和能力，以及两者之间有何区别；亦即一个更伟大，另一个更有益；一个本身就能带来（天国的）国度，而另一个若不伴随作为，则被留置于其门槛之外。


            今天需要讲述题记的其余部分，并解释「使徒」这个名字的含义，因为这个名字并非简单，它是一个权柄的称谓，是至大的权柄，是至灵的权柄，是至高的权柄。但请诸位留心。正如世俗事务中有许多权柄，但并非所有都具有相同的尊荣，有的更大，有的更小，例如，若我们从最低的开始列举：有城市法官，其上是人民的长官，之后有另一位更大的长官，还有军事统帅，有总督，以及在其上更高的权柄，执政官的权柄，他们都是权柄，但并非都具有相同的尊荣；同样，属灵的权柄也很多，但并非都具有相同的尊荣，而在所有这些之上，是使徒职分的尊荣。这样，我们必须引导你们从感官的转向属灵的。基督也是如此行，当祂在谈论圣灵时提及水：「凡喝这水的，」祂说，「还会再渴；但人若喝我所赐的水，就永远不渴。」（约翰福音 4:13-14）。你看，祂是如何引导那妇人从感官的转向属灵的吗？我们也如此行，从较低的上升到较高的，好使论述更清晰。因此，在谈论权柄时，我们提及的不是属灵的权柄，而是感官的权柄，好由此引导你们转向那属灵的权柄。你们听了我们列举了多少世俗的权柄，以及它们中有的更大，有的更小，以及执政官的权柄如何超越一切，如同它们的顶点和首领；那么，我们也来看看属灵的权柄。在属灵的权柄中，有先知职分的权柄，有另一种权柄——福音传道者的权柄，有牧者的权柄，有教师的权柄，有恩赐的权柄，有医治的权柄，有方言翻译的权柄。所有这些都是恩赐的名称，而实际上是职分和权柄的等级。先知是长官；在我们中间，驱逐邪魔者是长官；在我们中间，牧者和教师是属灵的长官；但所有这些之上，是使徒的权柄。这从何看出？从使徒超越所有这些人这一点看出。正如在感官的权柄中执政官，同样，在属灵的权柄中，使徒占据首位。让我们听听保罗本人，他在列举权柄时，将使徒的权柄置于最高之处。他说了什么呢？「上帝在教会里所设立的，第一是使徒，第二是先知，第三是教师；其次是行异能的，再其次是得恩赐医病的。」（哥林多前书 12:28）。'
      - type: paragraph
        text:
          ru: Видишь ли главную из властей? Видишь ли, что апостол стоит на высоте и никого нет прежде и выше его?«Во-первых, Апостолы, – говорит он, –во-вторых, пророки; в-третьих, учителя...и пастыри,иным дал силы  чудодейственные, также дары исцелений, вспоможения, управления, разные языки». И притом апостольство есть не только начало прочих властей, но и основание и корень. Как голова, находясь выше всего, не только есть начало и власть тела, но и корень, потому что нервы, управляющие телом, исходя из нее и произрастая из самого мозга, и оживляясь духом, таким образом, управляют всем животным составом, – так и апостольство не только стоит выше, как начало и власть прочих дарований, но и, сосредоточивая, содержит в себе корни всех их. Пророк не может быть и апостолом, и пророком; апостол же непременно есть и пророк, имеет и дары исцелений, и роды языков, и толкование языков, – поэтому (апостольство) есть начало и корень дарований.
          cn: 你看见那诸权柄之首了吗？你看见使徒高居其上，无人先于他，亦无人高于他了吗？「首先是使徒，」他说，「其次是先知，再次是教师……还有牧者，又赐给一些人行神迹的能力，还有医病、帮助、治理、说方言的恩赐。」而且，使徒职分不仅是其他权柄的开端，更是基础和根源。正如头部，居于一切之上，不仅是身体的开端和权柄，更是根源，因为支配身体的神经，从它发出，从脑髓中生出，并被灵所活化，从而管理着整个动物的构造——同样，使徒职分不仅高居其上，作为其他恩赐的开端和权柄，而且，它集中地包含了所有恩赐的根源。先知不能既是使徒又是先知；而使徒必然也是先知，也拥有医病的恩赐、说方言的恩赐和翻方言的恩赐——因此（使徒职分）是诸恩赐的开端和根源。
      - type: paragraph
        initial:
          ru: '4.'
          cn: '4.'
        text:
          ru: 'А что это так, я представлю вам во свидетели Павла. Впрочем, прежде нужно сказать, что такое«разные языки». Что же такое«разные языки»? В древности крестившийся и уверовавший тотчас начинал говорить разными языками для проявления Духа. Так как тогдашние люди находились в состоянии более немощном, и плотскими глазами своими не могли созерцать духовных дарований, то им и сообщаем был чувственный дар, чтобы духовное делалось явным: крестившийся тотчас начинал говорить и нашим языком, и языком персов, и языком индийцев, и языком скифов, так что и неверные могли узнать, что он сподобился Святого Духа. Это было чувственным знамением, т.е. такая речь, – потому что ее слышали чувством телесным, – но это чувственное знамение делало явной для всех духовную и невидимую благодать Духа. Такое знамение и называлось«разные языки», потому что человек, имевший от природы один язык, начинал говорить разными и инородными языками по благодати, и можно было видеть, как человек, один по числу, был разнообразным по дарованиям, и имел различные уста и различные языки. Посмотрим же, как апостол имел и это дарование, и все прочие. Об этом он сам говорит так:«Я более всех вас говорю языками»(1Кор.14:18). Видишь ли, что он имел роды языков, и не только имел, но и в большем изобилии, нежели все прочие верующие? Он не сказал только: я могу говорить языками, но и:«я более всех вас говорю языками». На пророчество, которое он имел, он указывает следующими словами:«Дух же, – говорит, –ясно говорит, что в последние дни наступят  времена тяжкие»(1Тим.4:1,2Тим.3:1); а что говорить о том, что будет в последние времена, значит пророчествовать, это всякому известно.«Знай же, что в последние дни наступят времена тяжкие»(2Тим.3:1). И еще:«Ибо сие говорим вам словом Господним, что мы живущие, оставшиеся до пришествия Господня, не предупредим умерших»(1Фес.4:15); и это – пророчество. Видишь ли, как он имел роды языков и пророчество? Хочешь ли знать, что он имел и дарования исцелений? Но, может быть, нет нужды доказывать это словами, когда мы знаем, что не только сами апостолы, но и одежда их имела дарование исцелений. А что он был и учителем народов, об этом он говорит во многих местах; он заботился о всей вселенной и управлял церквями. Таким образом, когда ты слышишь:«Во-первых, Апостолы; во-вторых, пророки; в-третьих, учителя...и пастыри;иным дал силы чудодейственные, также дары исцелений, вспоможения, управления, разные языки», то знай, что вся совокупность прочих дарований сосредоточивается в апостольстве, как в главе. Не думали ли вы прежде, что имя апостолов просто? Вот, теперь вы узнали, какой глубокой смысл заключает в себе это имя. Это сказали мы не для того, чтобы показать собственную свою силу; это – не наши слова, а благодати Духа, которая возбуждает от лености беспечных, чтобы они ничего не оставляли без внимания.'
          cn: '为了证明这是真的，我将保罗呈现在你们面前作为见证。此外，首先需要说明何谓「诸般方言」。那么何谓「诸般方言」呢？在古代，受洗并信主之人，立刻开始说诸般方言，以显明圣灵。因为那时的人们处于更软弱的状态，无法用他们属肉的眼睛默观属灵的恩赐，于是感官之恩赐就赐给了他们，使属灵之事得以显明：受洗之人立刻开始说我们的语言、波斯人的语言、印度人的语言，以及西徐亚人的语言，以致不信者也能认出他蒙受了圣灵。这是一种感官的标记，亦即如此的言语——因为人们是用身体的感官听见的——但这种感官的标记使圣灵那属灵而无形的恩典向所有人显明。这种标记就称为「诸般方言」，因为一个生来只有一种语言的人，因着恩典开始说出各种不同的异邦语言，人们可以看到一个人，虽然个体唯一，却在恩赐上是多样的，并拥有不同的口和不同的语言。


            那么，我们来看看这位使徒是如何拥有这种恩赐以及所有其他恩赐的。关于这一点，他自己这样说：「我比你们众人更说方言」（哥林多前书 14:18）。你看，他拥有诸般方言的恩赐，不仅拥有，而且比所有其他信徒更加丰盛，不是吗？他不仅说：我能说方言，而且说：「我比你们众人更说方言。」至于他所拥有的预言恩赐，他用以下的话来指出：「圣灵明说，在末后的日子，必有艰难的时期来到」（提摩太前书 4:1，提摩太后书 3:1）；而谈论末后时期将发生之事，即是预言，这是人尽皆知的。「你当知道，在末后的日子，必有艰难的时期来到」（提摩太后书 3:1）。还有：「我们凭着上主的话告诉你们这一点：我们这些活着存留到上主降临的人，绝不会先于已逝之人」（帖撒罗尼迦前书 4:15）；这也是一个预言。你看，他如何拥有诸般方言和预言的恩赐，不是吗？


            你想知道他也拥有医治的恩赐吗？但或许没有必要用言语来证明这一点，因为我们知道，不仅使徒们自己，甚至他们的衣物也拥有医治的恩赐。至于他也是万民的教师，他对此在许多地方都有提及；他关心整个普世教会，并管理着众教会。因此，当你听到：「首先是使徒；其次是先知；第三是教师……还有牧者；又赐给一些人行异能的恩赐，以及医治的恩赐、帮助人的恩赐、管理的恩赐、诸般方言」，你当知道，所有其他恩赐的总体都集中于使徒职分之中，如同归于元首。你们以前是不是以为使徒这个名称很简单呢？看哪，现在你们明白了这名称蕴含着多么深刻的意义。我们说这些话，并非为了彰显我们自己的能力；这些并非我们的话语，而是圣灵的恩典，它唤醒那些怠惰疏忽之人，使他们不至于对任何事都置之不理。'
      - type: paragraph
        text:
          ru: 'Итак, справедливо мы назвали апостольство духовным консульством. Апостолы суть начальники, рукоположенные от Бога; начальники, которые получили не разные народы и города, но которым всем вместе вверена вселенная. А что они были начальниками духовными, и это я постараюсь доказать, дабы после доказательства вы знали, что апостолы настолько выше начальников житейских, насколько сами житейские начальники выше играющих детей. Подлинно, это начальство гораздо выше того и больше сдерживает нашу жизнь, так что, если бы оно прекратилось, то все расстроилось бы и разрушилось. Какие знаки начальства и что должен иметь начальник? Власть над темницей, чтобы он был властен одних связывать, а других разрешать, одних выпускать, а других ввергать туда; также власть решать денежные долги, так чтобы он был властен – одних, бывших должными, освобождать, а другим приказывать уплатить долги; еще власть – осуждать на смерть и освобождать от смерти; или вернее, это – власть не начальника, а одного только царя, или даже и царю не принадлежит вполне этот дар, потому что он освобождает не от смерти уже умершего, а только от осуждения на смерть: приговор он может отменить, а возвратить к жизни от смерти не может; худшее в его власти, а лучшего он не имеет. Далее начальника мы отличаем по поясу, по голосу глашатая, по жезлоносцам, по колеснице, по мечу; все это – знаки власти. Посмотрим же, имеет ли и власть апостольская эти знаки. Имеет, и притом не такие, но гораздо лучшие. Дабы ты знал, что те суть только названия вещей, а эти – истина вещей, и дабы ты убедился, что между ними такое же различие, какое между детьми, играющими в начальники, и начальниками, действительно имеющими власть, я начну, если хотите, исчислять с власти ввергать в узы. Мы сказали, что начальник властен связывать и разрешать. Посмотри же: и апостолы имеют эту власть. «Коговы свяжете на земле, – сказал им Господь, –то будут связаны на небесах; и кого разрешите на земле... разрешены на небе»(Мф.18:18). Видишь узы, и власть над узами; но название одно и то же, а сущность дела не одна и та же. Узы там, узы и здесь; но одни на земле, а другие на Небе; Небо для них – место уз. Познай же величие этой власти. Находящиеся на земле произносят приговор, и сила этого приговора проходит небеса. Как цари, находясь в одном городе, изрекают приговоры и законы, а сила этих приговоров и законов обтекает всю вселенную, так и тогда апостолы, находясь на одном месте, изрекали законы, а сила этих законов и этих уз не только обтекала вселенную, но и восходила до самой высоты небес. Видишь узы и узы; но одни на земле, а другие на Небе, одни для тел, а другие для душ, или лучше – и для душ, и для тел, потому что (апостолы) связывали не только тела, но и души.'
          cn: '那么，我们恰当地称使徒职分为属灵的执政官职分。使徒是首领，由上帝按立的首领；这些首领所领受的并非是不同的民族和城市，而是整个宇宙，一同托付给他们。至于他们是属灵的首领，这一点我也将努力证明，好让你们在证明之后知晓，使徒们远高于世俗的首领，就如同世俗的首领远高于玩耍的孩童一样。确实地，这种权柄远超那世俗的权柄，并且更能约束我们的生命，因此，如果它终止了，一切都将混乱和毁灭。


            首领的标志是什么？首领必须拥有什么？对监狱的权柄，使他有权柄捆绑一些人，释放另一些人，让一些人出来，将另一些人投入其中；还有解决金钱债务的权柄，使他有权柄释放一些负债者，命令另一些人偿还债务；还有宣判死刑并从死亡中释放的权柄；或者更确切地说，这并非是首领的权柄，而仅仅是君王的权柄，甚至连君王也并非完全拥有这种恩赐，因为他所释放的并非是已死之人脱离死亡，而仅仅是从死刑宣判中释放：他可以撤销判决，却不能使人从死亡中复活；最坏的在他权下，而最好的他却不拥有。此外，我们通过腰带辨别首领，通过传令官的声音，通过杖卫，通过战车，通过佩剑；所有这些都是权柄的标志。


            那么，我们来看看使徒的权柄是否也拥有这些标志。有，而且不是这样的，而是远胜于此的。好让你知道，那些仅仅是事物的名称，而这些才是事物的真理，好让你确信，它们之间的区别，就如同玩扮演首领游戏的孩童与真正拥有权柄的首领之间的区别一样，如果你们愿意，我将从将人投入枷锁的权柄开始列举。我们说过，首领有权柄捆绑和释放。那么，请看：使徒也拥有这种权柄。「凡你们在地上所捆绑的，」——主对他们说——「在天上也要被捆绑；凡你们在地上所释放的……在天上也要被释放」（马太福音 18:18）。你看见了枷锁，以及掌管枷锁的权柄；但名称是相同的，而事情的本质却不相同。那里有枷锁，这里也有枷锁；但一种在地上，另一种在天上；天对他们而言，是枷锁之地。那么，请认识到这种权柄的伟大。那些在地上的人宣判，而这判决的力量却穿透诸天。正如君王们，身处一座城市，颁布判决和法律，而这些判决和法律的力量遍及整个宇宙，同样，那时的使徒们，身处一地，颁布法律，而这些法律和这些枷锁的力量，不仅遍及宇宙，甚至上升到诸天的最高之处。你看到了枷锁和枷锁；但一种在地上，另一种在天上，一种针对身体，另一种针对灵魂，或者更确切地说——既针对灵魂，也针对身体，因为（使徒们）不仅捆绑身体，也捆绑灵魂。'
