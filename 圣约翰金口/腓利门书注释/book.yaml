  text:
    ru: Беседа 2
    cn: 第 2 讲
  children:
  - type: paragraph
    text:
      ru: Флм. 1:4–6.Благодарю Бога моего, всегда вспоминая о тебе в молитвах моих, слыша о твоей любви и вере, которую имеешь к Господу Иисусу и ко всем святым, дабы общение веры твоей оказалось деятельным в познании всякого у вас добра во Христе Иисусе.
      cn: '(腓利门书 1:4-6)


        我感谢我的上帝，常常在我的祷告中记念你，听说你对主耶稣和对众圣徒所拥有的爱与信德，为要使你的信德的交通，藉着认识你们中间的一切美善，在基督耶稣里显出效用。'
  - type: paragraph
    text:
      ru: Господа не должны быть слишком взыскательными к слугам. – Побуждение к любви мы должны находить для себя в любви Христовой.
      cn: 主人不应对仆人过于严苛。——我们应当在基督之爱中为自己寻得爱的激励。
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Не вдруг и не в самом начале послания просит (Филимона) о милости, но сначала, выразив удивление к этому мужу и похвалив его за добродетели, представив немаловажное доказательство и своей любви к нему в том, что всегда вспоминает о нем в молитвах своих, и сказав, что многие находят у него покой и ко всем он оказывает кротость и веру, потом наконец (апостол) и начинает речь, и таким образом с особенною силою убеждает его. Действительно, если другие получают от него то, чего просят, то тем более (должен получить) Павел; если, пришедши прежде других, он достоин был бы получить, то тем более после других, и при том прося не для себя, а для другого. Далее, чтобы не показалось, что он пишет только поэтому, и чтобы кто-нибудь не сказал: если бы не было Онисима, то ты и не написал бы этого послания, – смотри, как он приводит и другие причины к написанию послания: во-первых, указывает на его любовь, а во-вторых, повелевает приготовить для себя гостинницу.'
      cn: 使徒并非立刻，也并非在书信的最开始，就请求（腓利门）施予恩慈，而是首先表达了对这位男子的惊叹，并称赞了他的美德；继而呈上他自己对腓利门的爱并非微不足道的证据，即总在自己的祷告中记念他；并且说了许多人都在他那里找到安息，而他向所有人显出温柔与信心；之后，使徒才终于开始陈述，并以这种方式，带着特殊的说服力劝请他。确实如此，如果其他人从他那里得到了所求的，那么保罗就更应该得到；如果他早于其他人前来，本就配得获得，那么在其他人之后前来，并且请求并非为自己，而是为他人，就更应该获得。其次，为了不让人觉得他写信仅仅是为此，也不让任何人说：「如果不是为了阿尼西母，你就不会写这封书信了，」请看，他是如何引述其他写这封书信的原因的：首先，他指出了腓利门的爱；其次，他吩咐为自己预备一间客房。
  - type: paragraph
    text:
      ru: '"Слыша, – говорит, –о любви твоей». Это достойно удивления и значит больше, нежели если бы он лично видел (эту любовь). Видно, она была чрезвычайно велика, если сделалась известною и достигла до его слуха, хотя расстояние между Римом и Фригиею было не малое, – а (Филимон) там находился, как я заключаю по имени Архиппа (упоминаемого здесь и в послании к Колоссянам). Колоссяне жили во Фригии, и в послании к ним (Павел) говорил:«Когда это послание прочитано будет у вас, то распорядитесь, чтобы оно было прочитано и в Лаодикийской церкви; а то, которое из Лаодикии, прочитайте и вы»(Кол.4:16). Лаокидия же – фригийский город. Молюсь, говорит,«дабы общение веры твоей оказалось деятельным»(Флм.1:6). Видишь, как он сам дает раньше, чем получает, и прежде, нежели испрашивает милость, предлагает ему от себя гораздо большее?'
      cn: 「他说：『听闻你的爱心。』这实在令人惊奇，并且意义远超过他亲自看到（这份爱心）。可见，这份爱心必定极其伟大，竟能闻名遐迩，传到他的耳中，尽管罗马与弗里吉亚之间的距离不近——而（腓利门）就身在那里，这是我根据亚基布（此处以及在写给歌罗西人的书信中都提到他）的名字所作的推断。歌罗西人住在弗里吉亚，保罗在致他们的书信中说：『这封信在你们当中念过之后，务要安排它也在老底嘉的教会中念诵；你们也要念诵那从老底嘉来的书信。』（歌罗西书 4:16）老底嘉则是一座弗里吉亚城市。他说：『我祷告，为要使你信心的分享显出果效』（腓利门书 1:6）。你看，他岂不是在有所得之前先行给予，并且在恳求恩惠之前，先向他献上远为丰厚的馈赠吗？」
  - type: paragraph
    text:
      ru: '«Дабы общение веры твоей, – говорит, –оказалось деятельным в познании всякого у вас добра во Христе Иисусе»,  т. е., чтобы ты достиг всякой добродетели, чтобы у тебя не было никакого недостатка. Вера бывает действенною тогда, когда сопровождается делами, потому что«вера без дел мертва»(Иак.2:26). Не сказал: вера твоя, но:«общение веры твоей»,  соединяя его с собою и внушая, что они – одно тело, и тем с особенною силою убеждая его. Если ты, говорит, сообщник мой в вере, то должен быть сообщником и в другом.«Ибо мы имеем великую радость и утешение в любви твоей, потому что тобою, брат, успокоены сердца святых»(Флм.1:7).  Ничто так не убеждает, как указание на благодеяния, сделанные другим, особенно если (просящий) почтеннее их. Впрочем, он не сказал: если ты делаешь для других, то тем более – для меня; но, выразив то же самое, употребил другой оборот речи, более кроткий.«Ибо мы имеем великую радость», т. е., ты дал мне дерзновение теми (благодеяниями), какие оказываешь другим.«И утешение»,  т. е., мы не только радуемся, но и утешаемся, потому что они – наши члены. Если же должно быть такое согласие, что находящиеся в скорбях, хотя бы сами ничего не получали, должны радоваться, видя успокоение других, так как облагодетельствовано одно тело, то тем более (мы будем радоваться), если ты успокоишь и нас. Не сказал: ты кроток, ты уступчив; но говорит сильнее и выразительнее:«сердца святых»,  как бы обращаясь к сыну, дорогому и возлюбленному для родителей. Такая любовь и привязанность доказывает, что (Филимон) был весьма любим ими.«Посему, имея великое во Христе дерзновение приказывать тебе, что должно»(Флм.1:8). Смотри, как он остерегается, чтобы и сказанное от сильной любви не поразило слушателя и не оскорбило его. Потому прежде, нежели сказал:«приказывать тебе», – а такое выражение было резко, хотя, сказанное от любви, весьма легко могло достигнуть цели,– он из осторожности делает оговорку:«имея дерзновение»,  и этим показывает, что Филимон был муж великий, т. е. (как бы говорит): ты сам дал нам дерзновение; при том прибавляет:"во Христе",  и этим показывает, что он говорит так не за его знатность или силу в мире, но за веру во Христа; а потом уже присовокупляет:«приказывать тебе», и не только это, но еще:«что должно»,  т. е. справедливое дело. Смотри, сколькими доводами он убеждает: ты оказываешь, говорит, благодеяния другим, окажи и мне, притом ради Христа, и потому, что это дело справедливо, и потому, что этого требует любовь. Поэтому и продолжает:«по любви лучше прошу»(Флм.1:9). Он как бы так говорит: из бывших примеров я знаю, что, и повелевая с великою властью, я получу успех; но так как я особенно забочусь об этом деле, то"молю". Здесь он вместе выражает и то и другое: и то, что надеется на него, – почему и«приказывает», – и то, что особенно заботится об этом деле, – почему и"молит".«Не иной кто, – говорит, –как я, Павел старец».'
      cn: '「使你信心的交通显出功效，在认识你们当中一切在基督耶稣里的善事上，」他说，「即是说，为使你达到一切美德，使你毫无欠缺。」信心唯有在伴随行为时，方能显出功效，因为「信心没有行为是死的」（雅各书 2:26）。他没有说：你的信心，而是说：「你信心的交通」，将他与自己联合，并启示他们是一个身体，并以此特别有力地劝服他。他说：如果你是我信心的伙伴，那么在其他方面也该是我的伙伴。


        「我们因你的爱心，大有喜乐和安慰，因为弟兄啊，众圣徒的心因你得着安息了。」（腓利门书 1:7）没有什么比指出（你）对他人所行的善事更能说服人的了，尤其是当恳求者比他们更受尊敬时。然而，他没有说：如果你为他人行事，那么更应该为我行事；而是表达了同样的意思，用了一种更温和的措辞。「因为我们有大喜乐」，即是说，你因你对他人所行的善事，给了我坦然无惧的心。「和安慰」，即是说，我们不仅喜乐，也得着安慰，因为他们是我们的肢体。如果理当有这样的合一，以至于身处苦难之人，即便自己一无所得，也应因看见他人的安息而喜乐，因为这使得一个身体蒙受恩惠，那么，如果你也使我们得享安息，我们就更会（喜乐）了。他没有说：你柔和，你顺从；而是更强有力、更富有表现力地说道：「众圣徒的心」，仿佛是对一个对父母而言既珍贵又挚爱的儿子说话。这样的爱与眷恋证明了（腓利门）深受他们爱戴。


        「因此，我在基督里大有坦然无惧的心，可以吩咐你当作的事」（腓利门书 1:8）。看，他何等谨慎，以免即便出自强烈的爱所说的话，也不会冲击听者或冒犯他。因此，在他开口说「吩咐你」之前——虽然这样的表达方式很生硬，但若出于爱而言说，便能轻易达到目的——他出于谨慎地加上了限定语：「我大有坦然无惧的心」，并以此表明腓利门是一位伟大的人，即是说（他仿佛在说）：你自己给了我们坦然无惧的心；此外他还加上了：「在基督里」，并以此表明他这样说并非因为腓利门在世上的显赫或势力，而是因为他在基督里的信心；然后才又接着说：「吩咐你」，不仅如此，还加上了：「当作的事」，即是说，公义的事。看，他用多少论据来劝服：他说：你对他人施以善行，也请对我施以善行，而且是为基督的缘故，并且因为这事是公义的，又因为爱要求如此。


        因此他接着说：「但宁可凭着爱心求你」（腓利门书 1:9）。他仿佛在说：从过去的例子我得知，即便我凭着极大的权柄吩咐，我也能成功；但我既特别关注此事，故此「求你」。在此他同时表达了两件事：其一是他对他抱有希望，——所以他「吩咐」；——其二是他特别关注此事，——所以他「求你」。他说：「不是别人，正是保罗，我这做长老的。」'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'О, сколько убедительных доказательств!"Павел", – это доказательство от достоинства лица;"старец", – от возраста;«узник Иисyca Христа», – от того, что он праведнее всех. Кто не принял бы с распростертыми объятиями ратоборца, увенчанного за подвиги? Кто, видя связанного за Христа, не оказал бы ему тысячи услуг? Смягчив таким образом душу, (Филимона), апостол не вдруг объявляет имя раба, но после такой просьбы еще медлит. Вы знаете, как велик бывает гнев господ на убежавших рабов, особенно если это сделано с покражею, как сильно раздражаются они, хотя бы были добрыми господами. Потому старается смягчить его всеми доводами; и когда наперед возбудил в нем готовность сделать все, что бы ни было, и приготовил душу его ко всякому послушанию, тогда уже и высказывает свою просьбу:«прошу тебя, – говорит, и при том с похвалами, –о сыне моем, которого родил я в узах моих»(Флм.1:10). Опять для убеждения – узы; и, наконец, называет самое имя (Онисима). Таким образом, не только укрощает гнев, но и возбуждает чувство благорасположения: я, говорит, не назвал бы его сыном, если бы он не был весьма благонадежным. Как я назвал Тимофея, так (называю) и его. И часто, для выражения своей любви, он указывает на время рождения:«которого родил я, – говорит, –в узах моих». Он значит достоин великой чести и потому, что рожден среди самых подвигов, среди искушений за Христа.«Онисима, он был некогда негоден для тебя»(Флм.1:11). Смотри, с каким благоразумием он объявляет грех его, и тем укрощает гнев (господина). Знаю, говорит, что он был непотребен;«а теперь годен тебе и мне». Не сказал: ныне же будет благопотребен тебе, чтобы он не стал противоречить; но присоединил и свое лицо, чтобы надежды (на слугу) были достовернее.«А теперь годен тебе, – говорит, –и мне". Если он полезен Павлу, требующему такой великой ревности, то тем более – господину.«Я возвращаю его». И тем еще укрощает гнев, что отдает его. Господа особенно гневаются тогда, когда ходатайство бывает за (рабов) отсутствующих, так что этим самым он еще более успокоил (Филимона).'
      cn: '哦，多少令人信服的证据！


        「保罗」——这是基于其人品尊严的证据；「长老」——这是基于其年龄的证据；「耶稣基督的囚犯」——这是基于他比众人更公义的证据。谁不会张开双臂，拥抱那位因其善工而被加冕的斗士呢？谁若看见一个为基督被捆绑的人，不会向他提供千般协助呢？


        使徒以这种方式柔和了（腓利门）的心灵后，并没有立刻说出那奴仆的名字，而是在提出了这样的请求后，又有所迟延。你们知道，主人对逃跑的奴仆会多么愤怒，特别是如果奴仆是带着盗窃而逃，他们会多么强烈地恼怒，即使他们是仁慈的主人。因此，（使徒）尝试用一切论据来平息他的怒气；当他预先激发了（腓利门）做任何事的意愿，并使他的心灵准备好接受一切顺服时，那时才说出自己的请求：


        「我为我的儿子向你请求，」他说道，并且带着赞美，「就是我在捆锁中所生的。」(腓利门书 1:10)


        再次，为了说服，是捆锁；最后，才说出那个名字（阿尼西母）。这样一来，不仅平息了怒气，也激起了友善之情：他说，若非他非常可靠，我不会称他为儿子。我如何称提摩太为儿子，也如此称呼他。并且，他常常为了表达自己的爱，指出诞生的时间：「我是在捆锁中生了他的。」这意味着他配得极大的尊荣，因为他是在善工之中，在为基督受试炼之中诞生的。


        「阿尼西母，他曾对你无益。」(腓利门书 1:11)


        看哪，他以何等明智的方式宣告他的罪过，从而平息了（主人）的怒气。他说，我知道他曾是无用的；「但现在对你我都有益处。」他没有说：现在他对你就有益处了，以免（腓利门）反驳；而是加上了他自己，以便（对这奴仆的）希望更可靠。「但现在对你，」他说道，「以及对我都有益处。」如果他对要求如此大热心的保罗都有用，那么对主人来说就更是如此了。「我将他送回给你。」通过将他送回，他进一步平息了怒气。主人们尤其在为不在场的（奴仆）求情时会发怒，因此通过此举，他进一步使（腓利门）平静下来。'
  - type: paragraph
    text:
      ru: '«Ты же прими его, как мое сердце»(Флм.1:12). Опять не просто употребляет его имя, но с прибавлением убедительного выражения, которое нежнее слова – сын. Таким образом, назвал его сыном, сказав:«которого родил я»,  и внушил, что его надобно любить особенно, потому что он рожден среди искушений. Известно, что мы питаем особенную любовь к детям, рожденным среди опасностей, которых мы избежали, как свидетельствует Писание, когда говорит:"Ихавод"(1Цар.4:21), и когда Рахиль называет Вениамина –«сын болезни моей»(Быт.35:18).«Ты же прими его, как мое сердце». Этим он выражает великую любовь свою к нему. Не сказал: возьми, не сказал: не гневайся, но:"приими",  т. е. он достоин не только прощения, но и чести. Почему? Потому, что он сделался сыном Павла.«Я хотел при себе удержать его, дабы он вместо тебя послужил мне в узах [за] благовествование»(Флм.1:13). Видишь, сколько он наперед употребляет доводов, чтобы потом внушить к нему уважение господина? Смотри, с какою мудростью он делает и это; смотри, как он обязывает одного и воздает честь другому. Ты видишь, говорит, что чрез него ты сам оказываешь мне услугу. Потом внушает, что он больше имел в виду его, нежели раба, – потому что оказывает ему великое уважение.«Но без твоего согласия, – говорит, –ничего не хотел сделать, чтобы доброе дело твое было не(как бы)[2]вынужденно, а добровольно»(Флм.1:14). Человек особенно тогда склоняется на просьбу, когда и самое дело полезно, и устрояется оно согласно с его волею; тогда именно бывают два блага: и дающий получает пользу, и принимающей находится в большей безопасности. Не сказал: было не вынужденно, но:«было не как бы вынужденно»; хотя я знал, говорит, что ты, если бы и не был уведомлен об этом деле, а получил об нем известиe нечаянно, не стал бы сердиться, но (поступил так) по особенной предосторожности,"не(как бы)вынужденно, а добровольно. Ибо, может быть, он для того на время отлучился, чтобы тебе принять его навсегда, не как уже раба»(Флм.1:15, 16). Хорошо сказал:«может быть», чтобы господин оказал снисхождение; а с другой стороны сказал:«может быть»потому, что бегство было совершено по самоуправству и извращенному рассуждению, а не с добрым намерением. Не сказал: ради сего убежал, но:«для того отлучился»,  чтобы более приличным выражением скорее склонить (господина) к милости. Также не сказал: сам отлучился, но:«разлучися,»был разлучен, т. е. не своим умыслом отлучился по той или другой причини. Так и Иосиф, оправдывая братьев, сказал:«Бог послал меня перед вами»(Быт.45:5), т. е. злой умысел их обратил в хорошую сторону."Для того, – говорит, –на время отлучился». Он и время сокращает и грех исповедует, и все приписывает устроению (Божию).«Чтобы тебе принять, –  говорит, –его навсегда», – не только в настоящее время, но и будущее, чтобы тебе иметь его всегда, уже не как раба, но выше раба; оставаясь рабом, он будет предан тебе более брата, и таким образом ты сделаешь приобретение и по времени и по свойству (отношений его к тебе); он более уже не убежит.«Чтобы тебе принять его навсегда»,  т. е. удержишь.«Не как уже раба, но выше раба, брата возлюбленного, особенно мне». Ты на короткое время лишился раба, и навсегда приобретаешь брата, не твоего только брата, но и моего. Здесь (указывает Павел) на великие добродетели (Онисима). Если же он мой брат, то не стыдись его и ты. Названием"сына"(апостол) выразил любовь к нему, а названием"брата"– великое благожелание и равенство.'
      cn: '「你就接纳他吧，如同我的心肝一样」(腓利门书 1:12)。再次，他并非仅仅提及他的名字，而是附加了一个富于说服力的表达，比「儿子」这个词更加温柔。如此，他称他为儿子，说：「我所生的」，并暗示应特别爱他，因为他是在试炼中诞生的。众所周知，我们对那些出生在我们所经历的危险之中、而我们已幸免于难的孩子怀有特殊的爱，正如圣经所见证的，当它说：「以迦博」(撒母耳记上 4:21)时，以及当拉结称本雅明为——「我悲伤之子」(创世记 35:18)时。「你就接纳他吧，如同我的心肝一样」。借此，他表达了自己对他深切的爱。他没有说：拿走他，也没有说：不要生气，而是：「接纳他」，也就是说，他不仅值得宽恕，更值得尊敬。为何如此？因为他已成为保罗的儿子。


        「我本想把他留在身边，好让他替你服事我，在为福音所受的捆锁中」(腓利门书 1:13)。你看，他预先运用了多少理由，以便日后使主人对他产生敬意？看，他以何等智慧行此；看，他如何使一人受恩，又使另一人得荣。他说，你看到，借着他，你自己是在服事我。然后他暗示，他更多考虑的是主人，而非仆人——因为他对他表现出极大的尊重。


        「但未经你的同意，」他说，「我什么也不愿做，为使你的善行不是出于勉强，而是出于自愿」[2](腓利门书 1:14)。人们尤其在以下情况会依从请求：当事情本身有益，并且是按照其意愿安排时；那时便有两重福益：施予者得益，接受者也更加稳妥。他没有说：不是被迫的，而是说：「不是好像被迫的」；他说，尽管我知道，即便你没有被告知此事，而是偶然得知，你也不会生气，但（我如此行）是出于特别的谨慎，「不是好像被迫的，而是出于自愿」。


        「因为，他暂时离开你，或许是为此，为要使你永远得着他，不再是作为奴仆」(腓利门书 1:15-16)。他说「或许」说得好，为使主人表现出宽容；另一方面，他说「或许」是因为，他的逃走是出于任性妄为和错误的判断，并非出于善意。他没有说：为此而逃跑，而是：「为此而离开了」，为以更得体的表达，更快地促使（主人）施予怜悯。同样，他没有说：他自己离开了，而是：「他被分离了」，他被分开了，也就是说，他并非出于自己的意图而因这样或那样的原因离开的。约瑟也如此，为他的弟兄们开脱时说：「上帝差遣我先于你们而来」(创世记 45:5)，也就是说，（上帝）将他们的恶意转化向了好的方面。「为此，」他说，「他暂时离开了」。他既缩短了时间，又承认了罪过，并将一切归于（上帝的）安排。


        「为要使你永远得着他，」他说，——不仅是现在，也是将来，为要使你永远拥有他，不再是作为奴仆，而是超越奴仆；即使仍是奴仆，他将比兄弟更忠于你，如此你将获得益处，无论从时间上还是从（他对你的）关系性质上；他将不再逃跑。「为要使你永远得着他」，也就是说，你将留住他。「不再是作为奴仆，而是超越奴仆，作蒙爱的弟兄，尤其对我来说」。你短暂地失去了一个奴仆，却永远获得了一个弟兄，不仅是你的弟兄，也是我的弟兄。在这里（保罗指明了）奥尼西姆的伟大美德。若他既是我的弟兄，你也不要羞于接纳他。借着「儿子」的称呼，（使徒）表达了他对奥尼西姆的爱，而借着「弟兄」的称呼，则表达了极大的善意和平等。'
