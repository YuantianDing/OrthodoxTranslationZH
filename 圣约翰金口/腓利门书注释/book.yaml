      cn: '1.'
    text:
      ru: 'Ничто так не убеждает (к исполнению просьбы), как то, чтобы не просить всего вдруг. Потому, смотри, после каких похвал, после какого приготовления, (апостол) высказал эту великую просьбу. Назвав (Онисима) сыном своим, участником благовествования, утробою, сказав: ты приобретаешь в нем брата, прими его, как брата, – он потом прибавляет:"как меня". Павел не постыдился сказать это. Если он не стыдился называться рабом верных, но даже сам признавал себя таким, то тем более он не мог чуждаться этого. А смысл слов его следующий: если ты мыслишь одинаково со мною, если ты стремишься к одинаковой цели, если считаешь (меня) другом,«то прими его как меня. Если же он чем обидел тебя». Смотри, как и когда упомянул он о проступке: на конце, после того как многое сказал о нем. Так как потеря имущества обыкновенно раздражает людей больше всего, то, чтобы (Филимон) не стал жаловаться на это, – а оно, вероятно, было у него похищено, – (апостол) упоминает теперь об этом и говорит:«Если же он чем обидел тебя». Не сказал: если украл что-нибудь, – а как?«Если же он чем обидел». Здесь он и признал проступок, и вместе представил его проступком не раба, но как бы друга в отношении к другу, выразив его названием, означающим более несправедливость, нежели воровство.«Считай это, – говорит, –на мне",  т. е., считай этот долг за мною; я заплачу.'
      cn: '没有什么比这更能说服人（以达成请求），莫过于不要一下子提出所有的请求。因此，你看，在何等赞美之后，在何等预备之后，（使徒）才提出这个重大的请求。称（奥尼西姆）为自己的儿子、福音的同工、心肝，又说：你藉着他得到了一位弟兄，接纳他如同接纳弟兄——他随后又加上一句：「如同接纳我。」保罗不以此为耻说出这句话。如果他不以被称为信徒的奴仆为耻，反倒承认自己是这样的人，那么他更不可能排斥这一点。


        而他话语的意思是：如果你与我心意相通，如果你与我志同道合，如果你视（我）为朋友，「就接纳他如同接纳我。他若在何事上得罪了你。」看，他是如何以及何时提及那过犯的：在最后，在他为他说了许多好话之后。鉴于财产的损失通常最能激怒人，为了不让（腓利门）为此抱怨——这财产，很可能就是被奥尼西姆偷走的——（使徒）现在提及此事并说：「他若在何事上得罪了你。」他没有说：如果他偷了什么东西——而是怎么说呢？「他若在何事上得罪了你。」在这里他既承认了过犯，又将其呈现为并非奴仆的过犯，而更像是朋友之间彼此的过失，借由所使用的称谓，此称谓所表达的与其说是偷窃，不如说是不公。「他说：『算在我账上』，」意即，将这笔债算在我名下；我来偿还。'
  - type: paragraph
    text:
      ru: Далее, с душевным радушием (говорит):«Я, Павел, написал моею рукою», – и радушно, и вместе обличительно, если бы тот отказался принять его, тогда как Павел не отказался даже написать о нем письмо. Этим весьма сильно и его тронул, и вместе избавил Онисима от опасения.«Моею рукою, – говорит, –я написал". Нет ничего пламеннее, ничего ревностнее, ничего деятельнее этой души. Об одном человеке, смотри, как он заботится.«Не говорю тебе о том, что ты и самим собою мне должен». Чтобы не показалось обидным для того, у кого просят, если бы (Павел) не решился просить за вора и не надеялся получить просимое, – он предусматривает и это:«Не говорю тебе, –  говорит, –что ты и самим собою мне должен»,  т. е. должен не только своею собственностью, но и самим собою. И это (сказал он) по любви, по дружбе и великому дерзновению. Смотри, как он везде заботится о том и другом, – и о том, чтобы просить с полною уверенностью, и о том, чтобы не показаться слишком дерзновенным.
      cn: 接着，他怀着由衷的盛情说：「我保罗亲笔写了这信。」——这既是盛情的，同时也是斥责的，如果那人拒绝接受他，既然保罗甚至没有拒绝为他写信。借此，他极其强烈地感动了他，同时使阿尼西谋免于担忧。「我亲笔写了这信，」他说。没有比这灵魂更热情、更热切、更积极活跃的了。看哪，为了一个人，他是多么地关怀啊。「我不必对你说，你连你自身都欠我的。」为了不使被请求之人觉得冒犯，如果（保罗）不敢为一个窃贼求情，并且不指望得到所求的，——他也预见到这一点：「我不必对你说，」他说，「你连你自身都欠我的。」也就是说，你所亏欠我的，不仅是你的财物，更是你这个人。而他如此说，是出于爱，出于友谊，以及极大的胆量。看哪，他在各方面是如何地顾虑周全——既要以完全的信心去请求，又要不显得过于冒昧。
  - type: paragraph
    text:
      ru: '"Так, брат"(Флм.1:20). Что значить:"Так, брат"? Т. е., прими его. Это нужно подразумевать здесь. Оставив задушевность, он опять обращается к прежнему, к делу, хотя и предыдущее также относилось к делу, – у святых бывает деловитым и то, чем они выражают свои душевные чувствования.«Так, брат, дай мне воспользоваться от тебя в Господе; успокой мое сердце в Господе», т. е. окажи милость Господу, а не мне."Сердце"т. е. (любовь мою) к тебе.«Надеясь на послушание твое, я написал к тебе»(Флм.1:21). Какой камень не смягчился бы от этих (слов)? Какой зверь не укротился бы от них и не оказал бы готовности к точному принятию (прошения)? Приписав ему такие добродетели, (апостол) не перестает еще оправдывать себя; и оправдывается не просто, не повелевая и не требуя со властью, но:"Надеясь, –  говорит, –на послушание твое». Как в начале послания он сказал:«дерзновение имея»(Флм.1:8), так и здесь говорит то же, запечатлевая послание.«Зная, что ты сделаешь и более, нежели говорю». Этими словами он сильно побуждает (Филимона), потому что хотя бы он и не сделал ничего другого, но, по крайней мере, устыдился бы не сделать просимого, заслужив (пред Павлом) такое о себе мнение, что он может сделать и более, нежели сказано.«А вместе приготовь для меня и помещение; ибо надеюсь, что по молитвам вашим я буду дарован вам»(Флм.1:22). И это сказано с великою надеждою, или лучше, и это в пользу Онисима, чтобы те не были беспечными, но, зная, что (Павел) придет и узнает все касательно его, отложили всякое злопамятство и скорее оказали ему милость. Великое ведь было благоговение и почтение к Павлу присутствующему, Павлу старцу, Павлу, претерпевшему узы. С другой стороны, эти слова свидетельствуют о любви их к нему, если он говорит, что они молятся за него, и сам предоставляет им такую честь, чтобы молиться за него: хотя, говорит, я теперь и в опасности, но вы увидите меня, если станете молиться.'
      cn: '「「是的，弟兄」(腓利门书 1:20)。「是的，弟兄」是什么意思？也就是说，接纳他。在这里需要如此理解。撇开心中的真挚情感，他又回到先前的事上，回到正事上，尽管前文也与正事相关——因为圣徒们即使在表达内心感受时，也常常是务实认真的。

        「「是的，弟兄，让我在主里从祢得益；在主里使我的心安宁」」，也就是说，向主，而非向我施恩。「心」，也就是说（我对你的爱）。

        「「我深信你必顺服，故此写信给你」(腓利门书 1:21)。」哪块石头听了这些（话）不会软化呢？哪只野兽听了这些（话）不会驯服，不准备好准确地接受（这请求）呢？赋予他如此的美德之后，（使徒）仍不停止为自己辩解；他的辩解并非简单地以命令或权威式的要求，而是说：「我深信你必顺服。」正如他在书信开头所说：「我本可以放胆」(腓利门书 1:8)，他在这里也说同样的话，以此为书信封缄。

        「「我知道你所行的，必过于我所说的。」」借着这些话，他强烈地激励（腓利门），因为即使他没有做其他任何事，至少也会因没有做所请求的事而感到羞愧，因为他（在保罗面前）赢得了这样的评价，即他能做得比所说的更多。

        「「此外，也要为我预备住处；因为我盼望借着你们的祷告，会蒙上帝赐予你们」(腓利门书 1:22)。」这话说得带着极大的盼望，或者更确切地说，这也有利于阿尼西母，好让他们不再粗心大意，而是知道（保罗）会来并了解关于他的一切，从而放下一切怨恨，更快地对他施以仁慈。毕竟，对在场的保罗，对这位年迈的保罗，对这位忍受了捆锁的保罗，人们怀有极大的敬畏和尊重。另一方面，这些话也证明了他们对他的爱，因为他说他们为他祷告，并且他自己也赋予他们如此的殊荣，让他们为他祷告：他说，虽然我现在身处危险，但如果你们持续祷告，你们就会见到我。'
  - type: paragraph
    text:
      ru: «Приветствует тебя Епафрас, узник вместе со мною ради Христа Иисуса»(Флм.1:23). Он был прислан колоссянами (Кол.1:7, 4:12), так что отсюда видно, что Филимон жил в Колоссах. Павел называет его«узником вместе со мной», выражая, что и он был в великой скорби. Таким образом, если не для самого (апостола), то для этого мужа (просьба) должна быть услышала, – тот, кто находится в скорби и, оставив свои дела, заботится о других, должен быть услышан. С другой стороны (апостол) здесь укоряет (Филимона) на случай, если бы он не оказал милости собственному своему рабу, тогда как согражданин его сделался«узником вместе со мной»« (Павла) и вместе с ним терпит страдания. И еще прибавляет:«узник вместе со мною ради Христа Иисуса,  т. е. за Христа.Марк, Аристарх, Димас, Лука, сотрудники мои»(Флм.1:24). Почему Луку он ставит последним, между тем как в другом месте говорит:«Только Лука один со мною»,  а Димас, говорит, был один из тех, которые оставили его и возлюбили нынешний век (2Тим.4:10)? Об этом, правда, уже сказано было в другом месте, но и здесь не следует ни оставлять без исследования, ни слушать просто и без разбора. Почему же он говорит, что приветствует их оставивший его?"Ераст, –  как говорит он, –остался в Коринфе»(2Тим.4:20). Епафраса приводит он, как известного им и происходившего оттуда, – Марка, как дивного мужа; а почему он причисляет к ним Димаса? Может быть, этот пал духом уже впоследствии, когда увидел многие опасности. А Лука, бывший последним, сделался первым. (Апостол) приветствует (Филимона) и от лица их, чтобы скорее склонить его к послушанию, и называет их споспешниками своими, чтобы таким образом сильнее убедить его к исполнению просьбы.«Господь Иисус Христос со духом твоим. Благодать с вами. Аминь»(Флм.1:25).
      cn: '「与我一同为基督耶稣作囚犯的以巴弗问候你」（腓利门书 1:23）。他是歌罗西人差来的（歌罗西书 1:7，4:12），由此可见腓利门是住在歌罗西的。保罗称他为「与我一同作囚犯的」，表明他也在极大的苦难中。因此，即使不是为（使徒）自己，也当为这人（的请求）而被听取——那身处苦难中，却又放下自己的事务，关顾他人的人，他的请求理当被听取。另一方面，（使徒）在此谴责（腓利门），以防他对自己的奴仆不施以怜悯，而他的同胞却与（保罗）「一同作囚犯」，并与他一同忍受苦难。又加上说：「与我一同为基督耶稣作囚犯的」，即是为基督的缘故。


        「马可、亚里达古、底马、路加，我的同工」（腓利门书 1:24）。他为何将路加放在最后，而在别处却说：「只有路加与我同在」，他说底马是那些离弃他、爱现今世界的人之一呢（提摩太后书 4:10）？关于这点，诚然已在别处论述过，但在此处也不应不加考察，或简单地不加分辨地听信。他为何还说离弃他的人也在问候他们呢？「以拉都，」他说，「他留在哥林多」（提摩太后书 4:20）。他提及以巴弗，是因他们认识他，且他来自那里——马可，是因他是个奇妙的人；但他为何将底马也列在其中呢？或许这人是在后来才灰心丧志的，当他看到许多危险时。而路加，原是末后的，却成了首先的。（使徒）也代他们向（腓利门）问安，以便更快地使他顺从，并称他们为自己的同工，以此更强烈地劝服他执行请求。


        「愿主耶稣基督与你的灵同在。恩典与你们同在。阿们」（腓利门书 1:25）。'
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Он заключил послание молитвою. Молитва есть великое и спасительное благо и ограждение душ наших; но она, бывает великим благом тогда, когда мы совершаем достойное ее, и когда не делаем самих себя недостойными ее. Поэтому, когда ты придешь к священнику и он скажет тебе: да помилует тебя Бог, чадо, – ты не полагайся только на слова, но приложи и дела, совершай то, что достойно милости. Бог благословит тебя, чадо, если ты будешь поступать достойно благословения, благословить, если ты будешь милостив к ближнему, – потому что чего мы хотим получить от Бога, то должны прежде дать ближним; а если мы лишаем этого ближних, то как хотим получить тоже от Бога?"Блаженны, –  говорит Он, –милостивые, ибо они помилованы будут»(Мф.5:7). Ведь если и люди милуют таких, то тем более – Бог, а немилосердых не помилует:«Ибо суд без милости не оказавшему милости»(Иак. 2:13). Милосердие есть доброе дело: почему же ты не оказываешь его другому? Ты хочешь получить прощение в грехах: почему же сам не прощаешь согрешившему? Ты приступаешь к Богу, испрашивая царствия небесного, а сам не подаешь серебра просящему! Потому мы и не получаем милости, что сами не милуем. Как же, скажешь, и это разве не дело милосердия, чтобы миловать немилующих? Но будет ли милосердым тот, кто стал бы миловать человека жестокого, свирепого и причиняющего бесчисленное множество зол ближнему? Как же, скажешь, купель (крещения) разве не спасла нас, соделавших бесчисленное множество зол? Но она избавила нас от них не для того, чтобы мы снова делали их, а для того, чтобы не делали.'
      cn: 他以祷告结束了这篇信息。祷告是巨大的、能带来救赎的恩惠，也是我们灵魂的屏障；但它唯有在我们行出配得上它的事，且不使我们自己配不上它的时候，方能成为巨大的恩惠。因此，当你来到司祭面前，他对你说：「上帝怜悯你，孩子，」——你不要单单依赖这些话语，也要付诸行动，行出配得上怜悯的事。孩子，若你行出配得上蒙福的事，上帝就会赐福于你；若你怜悯你的近人，祂就会赐福于你；——因为我们渴望从上帝那里得到什么，就必须首先给予近人；而如果我们剥夺了近人的这恩惠，又怎能奢望从上帝那里得到同样的恩惠呢？他说：「福哉，怜悯人的人，因为他们将蒙怜悯。」(马太福音 5:7) 既然世人也怜悯这样的人，上帝就更不用说了；祂不会怜悯那些不施怜悯的人：「因为那不施怜悯的人，将受无怜悯的审判。」(雅各书 2:13) 怜悯是一种善行：你为何不将其施予他人呢？你想要获得罪的赦免：为何你自己不赦免那得罪你的人呢？你来到上帝面前，祈求天国，然而你自己却不将银钱施予那向你求告的人！这就是我们不蒙怜悯的原因，因为我们自己不怜悯他人。你或许会说，那么怜悯那不施怜悯的人，这难道不是怜悯之举吗？然而，一个怜悯那残酷、凶猛、并对近人造成无数恶行之人，他会是仁慈的吗？你或许会说，那么洗礼的圣水（洗礼）难道没有拯救我们这些曾犯下无数恶行的人吗？但它将我们从那些恶行中解救出来，并非是为了让我们再次行恶，而是为了让我们不再行恶。
  - type: paragraph
    text:
      ru: «Мы умерли для греха:, – говорит апостол, –как же нам жить в нем? Что же? станем ли грешить, потому что мы не под законом, а под благодатью? Никак»(Рим.6:15). Для того она и избавила тебя от них, чтобы ты уже не возвращался к такому бесчестью. Так и врачи больных горячкою исцеляют от болезни не для того, чтобы они, злоупотребляя здоровьем, вновь заболевали и получали расстройство, – лучше ведь оставаться больным, нежели искать исцеления для того, чтобы опять повергнуть себя на одр болезни, – но для того, чтобы они, узнав страдания болезни, не впадали в то же самое, тщательнее берегли свое здоровье и делали все, служащее к его сохранению. Где же, скажешь, человеколюбие Божие, если Он не хочет спасать злых? Часто и от многих я слышу, что (Бог) человеколюбив и непременно спасет всех. Не станем обольщать себя напрасно. Я вспомнил одно обещание (данное вам некогда), – займемся теперь этим предметом.
      cn: 「我们对罪是死的，」使徒说，「怎能再活在罪中呢？那么，我们可以犯罪吗？因为我们不在律法之下，而是在恩典之下吗？绝不如此！」（罗马书 6:15）。恩典正是为此将你从罪中解救出来，使你不再回到那样的羞辱之中。正如医生治愈患热病的人，并非为了让他们滥用健康，再次生病和身体不适，——因为与其为了再次卧病在床而寻求治愈，不如一直生病，——而是为了让他们在了解疾病的痛苦后，不再重蹈覆辙，更仔细地爱护自己的健康，并尽一切努力去维护它。你也许会问，如果祂不愿拯救恶人，上帝的仁爱何在呢？我常从许多人那里听到，（上帝）仁爱世人，并且必然会拯救所有的人。我们不要徒然欺骗自己。我回想起一个（曾赐予你们的）应许，——现在就来探讨这个问题吧。
  - type: paragraph
    text:
      ru: 'Прежде я беседовал с вами о геенне и отложил речь о человеколюбии Божием; сегодня хорошо – исполнить это обещание. То, что будет геенна, кажется, мы достаточно доказали, представив потоп и другие прежние бедствия и сказав, что совершивший все это не может оставить ненаказанными и нынешних (грешников). Если Он так наказал тех, которые грешили прежде закона, то, конечно, не оставит без наказания тех, которые при благодати совершали гораздо большие преступления. Итак, предложен был вопрос: как же (Бог) благ, как человеколюбив, если Он наказывает? Мы отложили речь об этом, чтобы не обременить вашего внимания множеством (предметов). Вот, теперь отдадим этот долг и покажем, как Бог и наказывая остается благим. Эти слова могут быть у нас направлены и против еретиков, – потому слушайте внимательно. Бог создал нас, не имея в нас никакой нужды. А что Он не имел в нас никакой нужды, видно из того, что Он создал нас впоследствии (не от вечности). Если бы Он имел в нас нужду, то создал бы прежде. Если же Он существовал и без нас, а мы произошли в последующее время, то Он сотворил нас, не имея в нас нужды. Он сотворил небо, землю, море и все существующее для нас. Не есть ли это, скажи мне, дело Его благости? Много можно было бы сказать об этом, но для краткости скажем, что Он«повелевает солнцу Своему восходить над злыми и добрыми и посылает дождь на праведных и неправедных»(Мф.5:45). Ужели это не дело благости? Нет, скажешь. Так некогда спросил я одного маркионита: ужели это не дело благости? Он отвечал мне: если бы Бог не требовал отчета за грехи, то это было бы делом благости; а так как Он требует отчета, то – не дело благости. Его уже нет теперь, но мы повторим сказанное тогда, и даже скажем больше того. Я решительно доказываю, что, если бы Бог не требовал отчета, то Он не был бы благ; а так как Он требует отчета, то – благ. В самом деле, скажи мне, если бы Он не требовал от нас отчета, то могла ли бы продолжаться жизнь человеческая? Не обратились ли бы мы в диких зверей? Если и теперь, когда тяготеет над нами страх суда и наказания, мы превзошли рыб, пожирая друг друга, взяли перевес над львами и волками, грабя друг друга, то какого смятения и расстройства не исполнилась бы жизнь наша, если бы Он не требовал от нас отчета и мы были бы убеждены в этом? Что был бы баснословный лабиринт в сравнении с беспорядками в нашем мире? He увидел ли бы ты бесчисленного множества бесчинств и неурядиц? Кто стал бы, наконец, уважать отца? Кто не оскорблял бы матери? Кто не был бы предан всяким удовольствиям и всяким порокам? А что это так, я постараюсь убедить тебя, представив в пример один только дом. Каким образом? Вот каким: если бы у кого-нибудь из вас, спрашивающих об этом, были рабы, и я объявил бы им, что, сколько бы они ни противились власти господ, хотя бы наносили им оскорбления действием, хотя бы расхитили все их имущество, хотя бы все поставили вверх дном, и обращались с ними, как враги, (господа) не будут угрожать им, не будут наказывать, не будут мучить и даже не огорчать их неприятным словом, – то, как вы думаете, было ли бы это делом благости? Я, напротив, полагаю, что было бы делом крайней жестокости – предавать на поругание не только жену и детей таким неуместным снисхождением, но еще прежде того допускать до погибели самих виновных. Они ведь сделаются и пьяницами, и развратниками, и бесстыдными, и наглыми, и бессмысленнейшими всех зверей. Это ли, скажи мне, дело благости, чтобы попирать благородство души и губить их и друг друга? Видишь ли, что самое требование отчета есть дело великой благости? Но что я говорю о слугах, которые слишком склонны к этим порокам? Если бы кто, имея сыновей, позволил им делать все и не наказывал их, то, скажи мне, кого они не сделались бы хуже? Итак, если между людьми наказание есть дело благости, а безнаказанность – жестокости, то ужели не так у Бога? Следовательно, потому Он и уготовал геенну, что Он – благ. Хотите ли, я покажу вам благость Божию и с другой стороны? Кроме всего сказанного, (страх наказания) не позволяет и добрым сделаться злыми. Если бы все ожидали одного и того же, то все сделались бы злыми; а теперь добрые и в этом находят немалое утешение.'
      cn: '之前我曾与你们谈论过地狱，并搁置了关于上帝仁慈的论述；今天很好——来履行这个承诺。地狱的存在，我们似乎已经充分证明了，借着洪水和其它过去的灾难，并指出，施行所有这些（审判）的祂，不可能不惩罚现今的（罪人）。如果祂如此惩罚了那些在律法之前犯罪的人，那么祂当然不会不惩罚那些在恩典之中犯下更严重罪行的人。于是，有人提出疑问：如果祂要惩罚，祂又怎能是良善的，怎能是仁慈的呢？我们搁置了关于此事的论述，以免因事多而使你们的注意力过重。看哪，现在我们将履行这一义务，并展示上帝即使在惩罚时，也依然是良善的。这些话语也可以用来反驳异端，——因此请仔细聆听。


        上帝创造了我们，祂对我们没有任何需要。祂对我们没有任何需要，这一点从祂是后来（而非从永恒）创造我们就能看出。如果祂需要我们，祂就会更早创造我们。然而，如果祂可以没有我们而存在，而我们是在之后的时间才出现的，那么祂创造我们，就不是出于祂的需要。祂为我们创造了天、地、海和所有存在之物。告诉我，这难道不是祂良善的作为吗？关于这一点，本可多说，但为求简短，我们只说，祂「叫自己的太阳照好人，也照歹人；降雨给义人，也给不义的人」（马太福音 5:45）。难道这不是良善的作为吗？


        不，你会说。有一次我曾问一个马吉安派信徒：难道这不是良善的作为吗？他回答我：如果上帝不要求对罪负责，那这才是良善的作为；但既然祂要求负责，那就不是良善的作为。他现在已经不在了，但我们将重复那时所说的，甚至说得更多。我确凿地证明，如果上帝不要求负责，祂就不是良善的；正因为祂要求负责，祂才是良善的。


        事实上，告诉我，如果祂不要求我们负责，人类生活还能持续下去吗？我们难道不会变成野兽吗？如果现在，当审判和惩罚的恐惧依然悬在我们头上时，我们已经胜过了鱼类，互相吞噬，胜过了狮子和狼，互相抢夺，那么，如果祂不要求我们负责，并且我们对此深信不疑，我们的生活将不会充满怎样的混乱和失序呢？传说中的迷宫与我们世界的无序相比又算得了什么？难道你不会看到数不清的暴行和动乱吗？最终谁还会尊敬父亲？谁不会侮辱母亲？谁不会沉溺于各种享乐和罪恶之中？


        为了证明此言非虚，我将只以一个家庭为例来试图说服你。如何呢？是这样的：如果你们中任何一位提出疑问的人有奴仆，我向他们宣告，无论他们如何反抗主人的权柄，即使他们以行动侮辱主人，即使他们掠夺了主人所有的财产，即使他们将一切都颠倒过来，并像敌人一样对待主人，（主人）不会威胁他们，不会惩罚他们，不会折磨他们，甚至不会用不愉快的话语使他们不快，——那么，你们认为这会是良善的作为吗？相反，我认为这将是极度残忍的行为——以如此不合时宜的宽容，不仅任凭妻子和儿女受辱，更甚者，是允许那些作恶者自身走向灭亡。因为他们将成为酒徒、淫荡者、不知廉耻者、傲慢无礼者，比所有野兽都更加愚昧。告诉我，这是良善的作为吗？践踏灵魂的尊贵，并毁灭他们自己以及彼此？


        你看到了吗，要求负责本身就是极大的良善之举？但我为什么要谈论那些极易沾染这些罪恶的奴仆呢？如果有人有儿子，却任凭他们为所欲为而不加惩罚，那么，告诉我，他们难道不会变得比谁都更坏吗？因此，如果世人之间的惩罚是良善的作为，而免于惩罚是残忍的作为，那么在上帝那里难道不是如此吗？因此，祂预备地狱，正是因为祂是良善的。


        你们想让我从另一方面向你们展示上帝的良善吗？除了以上所说，（对惩罚的恐惧）也阻止了良善之人变为邪恶。如果所有人都期待同样的结果，那么所有人都将变为邪恶；而现在，良善之人也从中找到了不小的慰藉。'
  - type: paragraph
    text:
      ru: Послушай, что говорит пророк:«Возрадуется праведник, когда увидит отмщение; омоет стопы свои в крови нечестивого»(Псал.57:11); не радуясь этому, нет, но, страшась, чтобы самому не потерпеть того же, он будет заботиться о большей чистоте своей жизни. Таким образом, это (требование отчета) есть дело великого попечения. Так, скажешь; но следовало бы только угрожать, а не наказывать. Нет, если и тогда, когда Он полагает наказание, ты говоришь, что это одна угроза, и потому становишься более беспечным, то до какой не дошел бы ты беспечности, если бы это действительно было только угрозою? Если бы ниневитяне знали, что назначенное им наказание было одною угрозою, то не раскаялись бы; но так как они раскаялись, то угроза и осталась только на словах. Хочешь ли и ты, чтобы (назначенные грешникам наказания) были только угрозою? Это зависит от тебя самого; исправься, и они останутся только угрозою. Если же ты станешь презирать угрозу, – чего да не будет! – то испытаешь ее на деле. Жившие пред потопом, если бы побоялись угрозы, то не испытали бы ее на самом деле. Так и мы, если станем бояться угрозы, то не испытаем ее на деле. Да не будет этого с нами, но да подаст человеколюбивый Бог всем нам вразумиться этим и достигнуть неизреченных благ, которых да сподобимся все мы, благодатью и человеколюбием Господа нашего Иисуса Христа, с Которым Отцу со Святым Духом слава, держава, честь, ныне и присно, и во веки веков. Аминь.
      cn: '请听先知所言：「义人见仇报就欢喜，要在恶人的血中洗脚。」(诗篇 57:11) 他这样行，并非因此而欢喜，而是因惧怕自己也遭受同样的结局，他将更加谨慎地洁净自己的生命。因此，这（要求交账）是极大的关怀之举。


        这样，你会说；但应该只是威胁，而非惩罚。不，如果即便当祂施行惩罚时，你仍说这只是一种威胁，并因此变得更加漫不经心，那么，如果这真的只是一种威胁，你将变得何等漫不经心？如果尼尼微人知道所降给他们的惩罚只是一种威胁，他们就不会悔改了；但正因为他们悔改了，威胁才仅仅停留在言语上。你也希望（为罪人指定的惩罚）只是一种威胁吗？这取决于你自己；修正自己，它们就只会停留在威胁层面。如果你藐视这种威胁——愿这永不发生！——那么你将在实际中体验到它。洪水之前的人，如果他们惧怕那威胁，就不会在实际中体验到它了。同样，如果我们惧怕那威胁，就不会在实际中体验到它。


        愿这不发生在我们身上，愿仁慈的上帝赐予我们所有人由此获得启迪，并达到那不可言喻的美善，愿我们所有人蒙受此恩，借着我们的主耶稣基督的恩典和仁慈，与祂同父和圣灵，共享荣耀、权能、尊贵，从今时直到永远，世世无尽。阿们。'
