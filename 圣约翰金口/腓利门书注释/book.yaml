  text:
    ru: свт. Иоанн ЗлатоустТолкование на послание к Филимону
    cn: 圣约翰金口《腓利门书注释》
  children: []
- type: heading1
  text:
    ru: Беседа 1
    cn: 第 1 讲
  children:
  - type: paragraph
    text:
      ru: 'Флм. 1:1–3.Павел, узник Иисуса Христа, и Тимофей брат, Филимону возлюбленному и сотруднику нашему, и Апфии, (сестре) возлюбленной, и Архиппу, сподвижнику нашему, и домашней твоей церкви: благодать вам и мир от Бога Отца нашего и Господа Иисуса Христа.'
      cn: 保罗，耶稣基督的囚徒，和弟兄提摩太，写信给亲爱的腓利门和我们的同工，并亲爱的姊妹亚腓亚，和我们的同伴亚基布，以及你家里的教会：愿恩典与平安从我们的父上帝和主耶稣基督而来归于你们。(腓利门书 1:1-3)
  - type: paragraph
    text:
      ru: О милосердии и сострадании. – Некоторые обращают больше внимание на людей, нежели на Бога.
      cn: '论仁慈与怜悯。


        ——有些人更多地关注人，而非上帝。'
  - type: paragraph
    initial:
      ru: '1.'
      cn: '1.'
    text:
      ru: 'Это написано о рабе к господину. С самого начала (апостол) научает его не надмеваться и не стыдиться, укрощает его гнев, называя себя самого узником, смиряет и успокоивает его, внушая, что все настоящее ничтожно. И действительно, если узы за Христа – не стыд, а слава, то тем более не постыдно рабство. Он говорит это не с тем, чтобы превознести себя, но чтобы сделать полезное и внушить доверие к словам своим, – не для себя, но для того, чтобы скорее испросить милость (другому). Он как бы так говорит: для вас я обложен этими узами, подобно как говорит он и в других местах (Ефес.3:1;2Тим.2:9), впрочем, там выражая свое попечение, а здесь достоверность. Для него нет выше похвалы, как называться страдальцем Христовым:"я, –  говорит, –ношу язвы Господа Иисуса»(Гал.6:17).«Узник Иисуса Христа»,  потому что он связан был за Него. Слыша об узах Христовых, кто не устыдился бы, кто не преклонился бы, кто не отдал бы самой души своей, а не только одного раба?«И Тимофей брат»: присоединяет к себе и другого, чтобы (Филимон), слыша просьбу от многих, скорее склонился и оказал милость.«Филимону возлюбленному и сотруднику нашему». Если он возлюбленный, то надежда на него не есть дерзость или безрассудство, но знак великой дружбы; если он споспешник, то не только должен принимать такие просьбы, но и благодарить за них, так как чрез это он делает добро и себе самому, устрояя одно и то же дело. Таким образом, и без просьбы ты имеешь, говорит, еще другое побуждение оказать милость: если он полезен для евангелия, а ты обнаруживаешь усердие к евангелию, то тебе нужно не ожидать просьбы, а самому просить.'
      cn: 这是写给主人关于他仆人的。从一开始，（使徒）就教导他不要傲慢自大，也不要羞耻，平息他的怒气，称自己为囚徒，以此谦卑并安抚他，并告诫他，所有现世的事物都是微不足道的。确实，如果为基督所受的捆锁不是羞耻，而是荣耀，那么奴役就更不羞耻了。他说这些，并非为了抬高自己，而是为了有所助益，并使人对他的话语产生信任——不是为了他自己，而是为了能更快地为（他人）求得恩典。他仿佛是这样说：我为你们身负这些捆锁，如同他在其他地方所说的（以弗所书 3:1，提摩太后书 2:9），然而，在那里他表达的是他的关切，而在这里表达的则是可信度。对他而言，没有比被称为基督的受难者更高的赞扬了：「我，——他说，——身上带着上主耶稣的印记」（加拉太书 6:17）。「耶稣基督的囚徒」，因为他是为祂被捆绑的。听闻基督的捆锁，谁能不羞愧？谁能不谦卑？谁能不献出自己的灵魂，而不仅仅是一个仆人呢？「还有弟兄提摩太」：他将另一人也加进来，好让（腓利门）听见多人的请求后，能更快地顺从并施予恩典。「致我们所亲爱的腓利门和我们的同工」。如果他是所亲爱的，那么对他寄予希望就不是冒昧或轻率，而是伟大友谊的象征；如果他是协工，那么他不仅应该接受这样的请求，而且应该为此感谢，因为通过这事，他也是在为自己行善，成就同一项事工。如此，他说，即便没有请求，你还有另一个动机去施予恩典：如果他有益于福音，而你又显出对福音的热忱，那么你就不必等待请求，反而应该自己去请求。
  - type: paragraph
    text:
      ru: '«И Апфии возлюбленной». Она, кажется мне, была супругою Филимона. Посмотри на смирение Павла: он и Тимофея в своей просьбе присоединяет к себе, и просит не одного мужа, но и жену, и еще иного, вероятно, друга:"и Архиппу, –  говорит, –сподвижнику нашему». Он не приказанием хочет достигнуть этого и не обнаруживает негодования, если Филимон не тотчас послушается его повеления, но поступает как бы человек неизвестный, располагая и их сделать то же и подкрепить его просьбу, – потому что не только просьба от многих, но и просьба, обращенная ко многим, способствует к получению просимого.«И Архиппу, сподвижнику нашему». Если ты сподвижник, то должен принять участие и здесь. Это тот самый Архипп, о котором в послании к Колоссянам говорит:«Скажите Архиппу: смотри, чтобы тебе исполнить служение, которое ты принял в Господе»(Кол.4:17). Мне кажется, что он был в числе клира; потому (апостол) и к нему обращает просьбу и называет его сподвижником, чтобы всячески содействовать (достижению).«И домашней своей церкви». Здесь он не опустил из виду и рабов, потому что знал, что часто и речи рабов могут убедить господина, особенно когда просьба касается раба; при том, может быть, они особенно и возбудили гнев господина. Поэтому, не желая, чтобы они впали в зависть, он и их почтил приветствием вместе с господами. Впрочем, не подал и господину повода оскорбляться. Если бы он назвал (рабов) по имени, то, может быть, тот оскорбился бы; а если бы вовсе не упомянул о них, то остался бы недоволен; потому, смотри, как мудро, упомянув (о рабах), и их почтил своим воспоминанием, и его не раздражил. А название"Церкви"не допускает господам оскорбляться, когда они поставляются вместе с рабами. Подлинно,Церковьне знает различия между господином и рабом; она различает того и другого по добродетелям и порокам. Итак, если (дом твой) естьЦерковь, то не оскорбляйся, что раб поставляется вместе с тобою:«во Христе Иисусе нет раба, ни свободного»(Гал.3:28).'
      cn: '「及蒙爱的亚腓亚。」在我看来，她曾是腓利门的妻子。请看保罗的谦卑：他将提摩太也联于他自己的恳求之中，并且不仅恳求丈夫一人，也恳求妻子，还有另一人，很可能是朋友：「及亚基布，」他说，「我们的同工。」他不像以命令想要达成此事，若腓利门不立刻顺从他的命令，他也不表露愤怒，而是行事仿佛一个无名之人，促使他们也如此行并支持他的恳求，——因为不仅是来自众人的恳求，也是向众人发出的恳求，皆有助于所求之事的成就。


        「及亚基布，我们的同工。」倘若你是同工，那么在此你也当参与其中。这就是那位亚基布，在歌罗西书中提及他时说：「对亚基布说：务要留意，履行你所领受的职事，这职事是在上主里领受的。」（歌罗西书 4:17）我认为他是圣品人员之一；所以（使徒）也向他发出恳求，并称他为同工，为要竭力促成此事。


        「及他家中的教会。」在此他并未忽视甚至奴仆，因为他知道，常常奴仆的话语也能说服主人，尤其是当恳求涉及一个奴仆时；此外，也许他们正是激怒了主人。因此，不愿他们陷入嫉妒，他也以问候将他们与主人一同尊荣。然而，他也没有给主人冒犯的理由。倘若他直呼（奴仆）之名，那么，也许主人会感到被冒犯；而倘若他完全没有提及他们，那么（奴仆）就会不悦；所以，你看，是何等智慧，他既提及（奴仆），以他的忆念尊荣了他们，又未曾激怒主人。而「教会」这个称谓，不允许主人在与奴仆一同被列时感到被冒犯。确实，教会并不知晓主人与奴仆之间的区别；她依据美德与恶行来分辨两者。所以，倘若（你的家）是教会，就不要因为奴仆与你一同被列而感到被冒犯：「在基督耶稣里，没有为奴的，也没有自主的。」（加拉太书 3:28）'
  - type: paragraph
    text:
      ru: «Благодать вам и мир». Напомнив о благодати, (апостол) приводит ему на память собственные его грехи. Подумай, говорит, как много грехов простил тебе Бог, как ты спасен благодатью, и подражай Владыке. Испрашивает ему мира; и справедливо, потому что мир бывает тогда, когда мы подражаем Ему, когда благодать пребывает с нами. Так и тот раб, который оказался немилосердым к подобному себе рабу, пока не требовал от него ста динариев, дотоле пользовался милостью господина; а когда стал требовать, тогда был лишен ее и предан мучителям (Мф.18:34).
      cn: 「愿恩典与平安归于你们。」提醒了恩典之后，(使徒)使他想起他自己的罪过。他说，你想一想，上帝赦免了你多少罪过，你是如何靠恩典得救的，并效法主宰。为他祈求平安；这确实是理所当然的，因为平安只有在我们效法祂、当恩典与我们同在时才会临到。就像那个对同伴不仁慈的仆人一样，在他向同伴索要一百个银币之前，他都享受着主人的怜悯；但当他开始索要时，他就被剥夺了怜悯，并被交给拷打的人 (马太福音 18:34)。
  - type: paragraph
    initial:
      ru: '2.'
      cn: '2.'
    text:
      ru: 'Представляя это, будем и мы милосерды и сострадательны к согрешающим против нас. Сто динариев означают здесь грехи (других) в отношении к нам, а наши грехи в отношении к Богу – тысячи талантов. Вы знаете, что грехи против кого-нибудь судятся и по достоинству лиц. Например: оскорбивший частного человека согрешил, но не так, как оскорбивший начальника; более согрешил оскорбивший высшего начальника, а менее – оскорбивший низшего, но гораздо более оскорбивший царя. Хотя оскорбление одно и то же, но от превосходства лица оно становится больше. Если же оскорбляющий царя получает тяжкое наказание, по достоинству лица оскорбляемого, то сколькими талантами будет должен оскорбляющий Бога? Хотя бы грехи наши против Бога были те же самые, какие и против людей, но они не одинаковы; а сколько различия между Богом и человеком, столько же между теми и другими грехами. Впрочем, я нахожу много и таких грехов, которые бывают великими не только от превосходства лица, но и сами по себе. Страшны слова, которые я намереваюсь сказать, поистине страшны, но сказать их необходимо, чтобы, хотя таким образом тронуть и пробудить нашу душу, показав, что мы гораздо больше боимся людей, нежели Бога, и больше почитаем людей, нежели Бога. Вот смотри: прелюбодей знает, что Бог видит его, – и презирает Бога; а когда смотрит на него человек, то он удерживает свою похоть. Он не только предпочитает людей Богу, не только оскорбляет Бога, но, – что гораздо тяжелее, – боясь людей, презирает Бога, так как, если он видит людей, то удерживает пламень похоти. Впрочем, какой пламень? Это – не пламень, а бесчестие; если бы не было позволено иметь жену, то действительно это был бы пламень, а теперь это – бесчестие и разврат. Таким образом, если он видит людей, то укрощает свое бешенство, а о Божием долготерпении думает меньше всего. Другой, украв, сознает, что он похищает чужое, и старается обмануть людей, оправдывается против обвиняющих его и придает вид (правды) своему оправданию; а о Боге, Которого обмануть невозможно, не беспокоится, не стыдится и не почитает. Когда царь прикажет не брать чужого имущества, или даже отдать свое собственное, то мы все с готовностью приносим; а когда Бог повелевает не похищать и не брать чужого, то мы не повинуемся. Видишь, как мы предпочитаем людей Богу? Тяжелы и горьки эти слова; но докажите, что они тяжелы, воздержитесь от самого дела. Если же вы не боитесь самого дела, то как я могу поверить вам, когда вы говорите, что страшитесь наших слов и чувствуете их тяжесть? Вы сами себя обременяете своими делами, и нисколько не заботитесь; а когда я говорю о тех делах, которые вы делаете, то негодуете. Не безумно ли это? О, если бы ложно было сказанное мною! Я желал бы лучше сам быть обвиненным во лжи в тот (страшный) день, как укорявший вас несправедливо и напрасно, нежели видеть вас осужденными за это. Но вы не только сами предпочитаете людей Богу, а принуждаете к тому и других. Многие делали принуждение многим рабам и детям: одни заставляли их вступать в брак против воли, другие – служить своим постыдным желаниям, нечистой любви, хищничеству, любостяжанию, насилиям, так что вдвойне виновны и не могут оправдываться какою-нибудь необходимостью. В самом деле, если ты не можешь представить достаточного оправдания и тогда, когда делаешь зло невольно, по приказанию начальника, то грех бывает гораздо тяжелее, когда ты принуждаешь к тому и других. Какое может быть оправдание для такого человека? Говорю это не для того, чтобы осуждать вас, но чтобы показать, какие мы должники пред Богом. Если, почитая человека наравне с Богом, мы оскорбляем Бога, то гораздо более оскорбляем Его, когда людей предпочитаем Ему. Таким образом, если те же самые грехи, которые делаем мы против людей, бывают гораздо тяжелее, когда они относятся к Богу, то не гораздо ли хуже, когда грех и по свойству своему больше и тяжелее? Пусть испытает каждый самого себя, – и увидит, что для людей он делает все. Мы весьма блаженны были бы, если бы для Бога делали столько же, сколько делаем для людей из тщеславия, страха, или уважения. Итак, если мы сами виновны в столь многих грехах, то должны со всею готовностью прощать оскорбляющих и обманывающих нас, и не помнить зла. Для того, чтобы простить грехи, не нужно ни трудов, ни издержек и ничего другого, а нужно одно только желание; не нужно ни предпринимать путеществия, ни отправляться в чужие страны, ни подвергаться опасностям и трудам, а нужно только захотеть.'
      cn: '鉴于此，我们也当对得罪我们的人心存怜悯和慈悲。在此，一百第纳尔代表（他人）对我们的罪，而我们对上帝所犯的罪，则是千千万万他连得。你们知道，得罪人的罪，是根据当事人的身份尊贵来审判的。例如：侮辱一个平民是犯罪，但不及侮辱一个官长；侮辱高级官长的罪更重，侮辱低级官长的罪较轻，但侮辱君王的罪则重得多。尽管侮辱行为本身是相同的，但因被侮辱者的身份尊贵，罪过便更大了。既然侮辱君王的人，会因被侮辱者的身份尊贵而受重罚，那么侮辱上帝的人，又将负多少他连得的债呢？即使我们对上帝所犯的罪，与对人所犯的罪相同，但它们的性质并不一样；上帝与人之间有多少差异，这两种罪之间就有多少差异。此外，我还发现许多罪，其严重性不仅因被冒犯者的尊贵身份，更在于罪本身的性质。


        我将要说的话是可怕的，确实可怕，但有必要说，为的是以这种方式触动并唤醒我们的灵魂，显明我们怕人甚于怕上帝，敬人甚于敬上帝。请看：奸淫者知道上帝看见他，——他却藐视上帝；而当有人看着他时，他便克制自己的情欲。他不仅将人置于上帝之上，不仅冒犯上帝，而且——更严重的是——因惧怕人而藐视上帝，因为当他看见人时，他便抑制了情欲的火焰。然而，这算什么火焰？这不是火焰，而是羞耻；如果禁止人拥有妻子，那这确实是火焰，但如今这却是羞耻和放荡。如此，当他看见人时，便制止了自己的狂妄，而对上帝的恒忍却毫不思虑。另一个人，偷窃之后，明知自己窃取他人之物，却试图欺骗世人，对指控他的人百般辩解，并为自己的辩解披上（正义的）外衣；而对于那不可被欺骗的上帝，他却不以为意，不觉羞耻，也不敬畏。当君王命令不可夺取他人财物，甚至要我们献出自己的所有时，我们都乐意遵从；而当上帝吩咐不可偷盗、不可夺取他人之物时，我们却不顺从。你们看，我们是何等将人置于上帝之上啊？


        这些话语沉重而苦涩；但你们若要证明它们沉重，就请你们克制自己的行为。倘若你们连行为本身都不惧怕，那么当你们说惧怕我们的话语并感受到其沉重时，我怎能相信你们呢？你们自己以行为加重自身的负担，却毫不在意；而当我谈论你们所行的那些事时，你们却愤慨不已。这难道不是狂妄吗？唉，如果我所说的都是虚假的该多好啊！我宁愿在那（可怕的）日子里，自己被指控为不公且无谓地责备你们的谎言者，也不愿看到你们因此而被定罪。但你们不仅自己将人置于上帝之上，而且还强迫他人也如此行。许多人强迫许多奴仆和孩童：一些人强迫他们违心结婚，另一些人则强迫他们侍奉自己可耻的欲望、不洁的爱、掠夺、贪婪、暴力，以至于他们罪加一等，无法以任何必然性来为自己辩护。事实上，如果你即使在非自愿、受上级命令而作恶时，也无法提出充分的理由来辩解，那么当你强迫他人作恶时，这罪过就更加沉重了。这样的人能有什么辩解呢？我说这些，不是为了谴责你们，而是为了显明我们在上帝面前是何等负债累累。如果我们视人与上帝平等，就已经冒犯了上帝，那么当我们将人置于上帝之上时，就更是大大冒犯了祂。


        如此，如果我们对人所犯的那些罪，当它们涉及上帝时会沉重得多，那么当罪本身从其性质上就更大更重时，岂不更糟糕吗？让每个人省察自己，——他会发现他为了人做了所有的一切。如果我们为了上帝所做的，能像我们为了虚荣、恐惧或尊敬人而做的那么多，我们就会非常蒙福了。既然如此，如果我们自己有如此多的罪，就应当完全乐意地宽恕那些冒犯和欺骗我们的人，并且不记仇。要想赦免罪过，既不需要劳苦，也不需要花费，更不需要其他任何东西，而只需要一个意愿；不需要启程旅行，也不需要远赴异国他乡，更不需要冒着危险和劳苦，而只需要——有意愿。'
  - type: paragraph
    initial:
      ru: '3.'
      cn: '3.'
    text:
      ru: 'Какое, скажи мне, мы получим прощение за неисполнение дел, кажущихся трудными, когда не исполняем и дела легкого, столь полезного и плодотворного и не требующего никакого труда? Ты не можешь пренебречь богатства? Не можешь раздать имения нуждающимся? Но разве ты не можешь пожелать ничего доброго? Разве не можешь простить оскорбившему? Если бы ты сам и не был виновен в столь многих (грехах) и только получил бы от Бога повеление – прощать других, то не должен ли ты был бы (исполнять это)? Как же теперь, будучи сам виновен в столь многих (грехах), ты не прощаешь другим, при том зная, что Он требует от тебя того же, что ты получаешь от Него? Когда мы приходим к своему должнику, он, помня свой долг, услужливо и с честью принимает нас и всячески оказывает нам свое радушие, еще не получая от нас прощения долга, а только желая сделать нас снисходительными в требовании: как же ты, будучи столь великим должником пред Богом и получив от Него повеление – прощать, с тем, чтобы и самому получить прощение, не прощаешь? Почему так, спрашиваю тебя? Увы, какое человеколюбие оказывается нам, и какую оказываем мы злобу, какую сонливость, какую беспечность! Как легка и многополезна добродетель, и как тяжело зло! Но мы, оставляя легкое, избираем то, что тяжелее олова. Здесь не нужно ни силы телесной, ни богатства, ни денег, ни власти, ни дружбы и ничего другого, а довольно одного желания, – и все будет сделано. Оскорбил ли тебя кто-нибудь, обидел, осмеял? Вспомни, что и сам ты делаешь много подобного в отношении к другим, даже в отношении к самому Владыке, – и прости и извини его. Вспомни, что ты сам говоришь:«прости нам долги наши, как и мы прощаем должникам нашим»(Мф.6:12); подумай, что, если ты не прощаешь (другим), то не можешь с дерзновением говорить это; а если прощаешь, то как бы требуешь должного, хотя не по существу самого дела, а по человеколюбию Дарующего (нам прощение). Да и как можно равнять прощаемое нами подобным нам рабам с грехами против Владыки, в которых мы получаем от Него прощение? Мы удостоиваемся такого человеколюбия Его потому, что Он богат милостью и щедротами.'
      cn: '告诉我，当我们连那轻省、如此有益、硕果累累且不需任何劳苦的事也未能完成时，我们怎能奢望因未能完成那些看似艰难的事而获得赦免呢？你不能轻看财富吗？你不能将财产分给有需要的人吗？但难道你不能心生善念吗？难道你不能赦免那冒犯你的人吗？即使你自己没有犯下如此多的（罪过），仅仅是从上帝那里领受了赦免他人的命令，难道你不应该（遵行）吗？那么现在，你自己既犯下了如此多的（罪过），你却不赦免他人，况且你知道祂要求你做的事，正与你从祂那里领受的相同，这又如何说呢？当我们去见自己的债户时，他记着自己的债，殷勤恭敬地接待我们，并尽一切努力向我们表达他的热情，此时他尚未从我们这里得到债务的赦免，只是希望我们能宽厚地追讨；那么你呢，既是上帝面前如此巨大的债户，又从祂那里领受了赦免的命令，以便自己也能得到赦免，你为何不赦免呢？


        我问你，为什么会这样呢？唉，我们得到了何等的人爱啊，而我们却显露出何等的恶毒、何等的昏沉、何等的疏忽啊！美德是何等轻省而大有裨益，而恶行又是何等沉重啊！但我们却舍弃了轻省的，选择了比铅还沉重的东西。在此既不需要体力，也不需要财富、金钱、权势、友谊或任何其他，只需要一个意愿，一切就都将成就。


        是否有人冒犯了你，伤害了你，嘲笑了你？记住，你自己也对他人做了许多类似的事，甚至对至高的上主也是如此——所以要赦免他，原谅他。记住你亲口所说：「赦免我们的债，如同我们赦免了那些欠我们债的人」（马太福音 6:12）；想想看，如果你不赦免（他人），你就不能带着坦然无惧的心说这话；而如果你赦免了，那么你仿佛是要求理所当然的，尽管并非是凭着事情本身的实质，而是凭着赐予者（我们赦免的）的人爱。再说，我们赦免我们同类的仆人，又怎能与我们从上主那里得到赦免的、对抗上主的罪过相提并论呢？我们之所以配得祂如此的人爱，是因为祂有丰盛的怜悯和恩慈。'
  - type: paragraph
    text:
      ru: 'Впрочем, я докажу тебе, что и без этого, и без прощения грехов твоих, от одного прощения (другим) ты получаешь пользу. Представь, сколько такой человек имеет друзей, как везде и все превозносят его и говорят: он человек добрый, примирительный; незлопамятный; как скоро получает обиду, тотчас же и забывает ее. Если такой человек подвергнется какому-нибудь несчастью, то кто не пожалеет его? Кто не извинит его, если он погрешит в чем-нибудь? Кто не сделает ему одолжения, если он станет просить о чем-нибудь за других? Кто не захочет быть другом и даже рабом такой доброй души? Так, увещеваю, будем для этого делать все, не только в отношении к друзьям и родным, но и к слугам:"умеряя, – говорит (апостол), –строгость, зная, что и над вами самими и над ними есть на небесах Господь»(Еф.6:9). Если мы будем отпускать ближним согрешения, то отпустится и нам; также – если будем творить милостыню, если будем смиренны, потому что и это служит к отпущению грехов. Мытарь сказал только:«будь милостив ко мне грешнику»и вышел оправданным (Лук.18:13); тем более мы можем сподобиться великого человеколюбия (Божия), если будем смиренны и сокрушенны сердцем; и если мы будем исповедовать грехи свои и осуждать самих себя, то очистим множество нечистот, потому что много путей к очищению. Итак, будем всеми средствами бороться с диаволом. Я не сказал ничего трудного, ничего неприятного; прости оскорбившему, подай милостыню нуждающемуся, смири свою душу, – и, хотя бы ты был величайшим грешником, ты можешь достигнуть царствия (небесного), очищая таким образом грехи и омывая нечистоты. Да сподобимся же все мы, очистившись здесь от всякой нечистоты греховной исповеданием, получить там обещанные блага, во Христе Иисусе, Господе нашем, с Которым Отцу слава, держава (честь, ныне и присно, и во веки веков. Аминь).'
      cn: '然而，我要向你证明，即使没有这一点，即使没有你自身罪恶的赦免，仅仅从（对他人）的宽恕中，你也能获得益处。试想，这样的人拥有多少朋友，所有人都在各处称赞他，并说：他是个良善、和睦、不记仇的人；他一旦受到伤害，立刻就忘记了。如果这样的人遭遇任何不幸，谁能不怜悯他呢？如果他在某事上犯了错，谁能不宽恕他呢？如果他为他人请求什么，谁能不施恩惠于他呢？谁会不愿意成为这样良善灵魂的朋友，甚至仆役呢？


        因此，我劝勉你们，我们要为此做一切事情，不仅是对朋友和亲属，也是对仆人，正如（使徒）所说：『节制威吓，知道你们和他们同有一位主在天上。』（以弗所书 6:9）


        如果我们宽恕近人的过犯，那么我们的过犯也会得到宽恕；同样，如果我们施舍，如果我们谦卑，因为这些也有助于罪的赦免。税吏只说：『上帝啊，求祢怜悯我这个罪人！』就蒙称义了（路加福音 18:13）；如果我们谦卑和心碎，我们就更能够蒙受（上帝）伟大的仁慈；如果我们认自己的罪并谴责自己，那么我们就能洁净许多污秽，因为洁净之道甚多。因此，我们要用一切方法与魔鬼搏斗。


        我所说的并非难事，也非不悦之事；宽恕那冒犯你的人，施舍给那有需要的人，谦卑你的灵魂，——即使你是最大的罪人，你也能如此洁净罪恶、洗涤污秽，而达到（天）国。


        愿我们所有人都蒙受，在此藉着忏悔洁净了所有罪恶的污秽，在彼世藉着我们的主耶稣基督获得所应许的福祉，与祂（基督）同在，荣耀和权能（尊贵）归于父，从今时直到永远，世世代代。阿们。'
