    text:
      ru: 'Это написано не напрасно, но для того, чтобы мы – господа – не презирали своих слуг и не были слишком взыскательными к ним, чтобы научились прощать проступки слугам своим и не были всегда жестокими к ним, чтобы мы не стыдились рабов и имели общение с ними во всем, если они хороши. Если Павел не постыдился назвать раба сыном, утробою своею, братом и возлюбленным, то как будем стыдиться мы? Но что я говорю: Павел? Владыка Павла не стыдится называть рабов наших братьями Своими, – как же будем стыдиться мы? Смотри, какую Он оказывает нам честь: наших рабов Он называет Своими братьями, друзьями и сонаследниками. Вот как Он уничижил Себя! Что же делать нам, чтобы вполне достигнуть этого? Никогда мы не можем (достигнуть этого) вполне, но до какой бы степени смирения мы ни дошли, большей части его будет еще недоставать нам. Смотри: что бы ты ни делал, ты делаешь для подобного тебе раба, а Владыка твой сделал это для твоих рабов. Слушай и страшись! Никогда не превозносись своим смирением! Может быть, вам кажутся смешными слова мои, что смирение превозносится; но не удивляйтесь: оно превозносится, когда бывает неискренним. Как и каким образом? Когда оно бывает для того, чтобы показаться пред людьми, а не пред Богом, когда оно имеет в виду свое прославление и тщеславие; и тогда оно – дело диавола. Как многие тщеславятся тем, что они нетщеславны, так превозносятся и смирением по высокомерию. Например, пришел к тебе какой-нибудь брат, или слуга; ты принял его, омыл ему ноги, и тотчас же гордишься этим: я, говоришь ты, сделал то, чего не сделал никто другой, я совершил подвиг смирения.'
      cn: 这并非徒然写下，而是为了我们——作为主人——不轻视自己的仆人，不对他们过于苛刻，学会宽恕仆人的过犯，并且不要总是对他们残忍，不以奴隶为耻，若他们品行良好，便在一切事上与他们相交。若保罗不以称奴隶为儿子、自己的心肝、弟兄和蒙爱者为耻，那么我们又怎会羞于此呢？但我为何要说保罗呢？保罗的主宰不以称我们的奴隶为祂的弟兄为耻——那么我们又怎会羞于此呢？看啊，祂赐予我们何等尊荣：祂称我们的奴隶为祂的弟兄、朋友和同为后嗣的。祂就是这样谦卑了自己！那么我们该如何行，才能完全达到这一点呢？我们永远无法完全达到（这一点），但无论我们达到何等程度的谦卑，其大部分仍将是我们所欠缺的。看啊：无论你做什么，你都是为与你相似的奴隶而做，而你的主宰却为你的奴隶做了这些。听着，并心存敬畏！绝不要因自己的谦卑而自傲！也许你们会觉得我说的「谦卑也会自傲」这句话很可笑；但请不要惊奇：当谦卑不真诚时，它就会自傲。如何会如此，又是以何种方式呢？当它旨在示于人前而非上帝面前之时，当它意在自我荣耀和虚荣之时；那时，它便是魔鬼的作为。正如许多人因自己不虚荣而虚荣一样，同样，他们也因傲慢而以谦卑自傲。例如，有位弟兄或仆人来到你这里；你接待了他，并为他洗脚，而你立刻就为此感到骄傲：你说：「我做了别人都未曾做过的事，我完成了谦卑的壮举。」
  - type: paragraph
    text:
      ru: 'Каким же образом можно остаться смиренномудрым? Если будем помнить заповедь Христа, который говорит:«когда исполните все повеленное вам, говорите: мы рабы ничего не стоящие»(Лук.17:10); также слова учителя вселенной, который говорит:«я не почитаю себя достигшим»(Флп.3:13). Кто убежден, что он не сделал ничего великого, что бы он ни сделал, кто не считает себя достигшим конца, тот только может быть смиренным. Многие от смирения впали в гордость, – да не будет этого с нами! Совершил ли ты какое-нибудь дело смирения? Не превозносись, иначе погубишь все. Таков был фарисей: он стал превозноситься тем, что отдавал бедным десятину, и погубил все. Но не таков был мытарь. Послушай, что еще говорит Павел:«ничего не знаю за собою, но тем не оправдываюсь»(1Кор.4:4). Видишь ли, как он не превозносился, но всячески уничижал и смирял себя, и при том тогда, как достиг самой высоты добродетелей? И три отрока, будучи в огне, среди пламени, что говорили?«Ибо согрешили мы, и поступили беззаконно, отступив от Тебя, и во всем согрешили»(Дан.3:29). Это и значит иметь сердце сокрушенное. Поэтому они и могли сказать:«Но с сокрушенным сердцем и смиренным духом да будем приняты»(Дан.3:39). Так они были смиренны после ввержения в печь, даже более, нежели до ввержения. Когда они увидали совершившееся чудо, то, считая себя недостойными спасения, пришли в глубокое смирение, – потому что мы тогда особенно сокрушаемся духом, когда убеждаемся, что мы получили великие благодеяния не по заслугам. Между тем какие же они получили благодеяния не по заслугам? Они допустили ввергнуть себя в печь, были отведены в плен еще в своей молодости, тогда как согрешили другие, и не роптали, не досадовали и не говорили: какая нам польза от того, что мы служим Богу? Что приобрели мы, поклоняясь Ему? Человек нечестивый сделался нашим владыкою; с идолослужителями мы терпим мучение от идолослужителя; отведены в плен, лишены отечества, свободы и всего родного, стали пленниками и рабами и служим царю варвару! Ничего такого они не говорили, – но что?«Ибо согрешили мы, и поступили беззаконно»(говорили они) и возносили молитву не за себя, а за других:«И предал нас, – говорили они, –царю неправосудному и злейшему»(Дан.3:32). Также Даниил, будучи в другой раз брошен в ров, говорил:«вспомнил Ты обо мне, Боже»(Дан.14:38). Почему же (Бог) не помянул тебя, Даниил, когда ты прославил Его пред царем и говорил:«А мне тайна сия открыта не потому, чтобы я был мудрее всех живущих»(Дан.2:30)? Почему Он не помянул тебя тогда, когда ты ввержен был в львиный ров за неповиновение нечестивейшему повелению? По той же самой причине. Не за Него ли ты ввержен и теперь? Так, говорит он; это потому, что великий я должник пред Ним. Если же так говорил он при столь великих добродетелях своих, то что скажем мы? Послушай еще, что говорит Давид:«А если Он скажет так: «нет Моего благоволения к тебе», то вот я; пусть творит со мною, что Ему благоугодно»(2Цар.15:26), – хотя он мог указать на бесчисленные свои добродетели. Также Илий говорит:«Господь сам, еже благо пред ним, да сотворит»(1Цар.3:18).'
      cn: 那么，如何才能保持谦卑呢？如果我们谨记基督的诫命，祂说：「你们做完了一切所吩咐的，就说：我们是一无所值的仆人。」（路加福音 17:10）；也谨记普世的导师所说的话：「我不以为自己已经得着了。」（腓立比书 3:13）。无论他做了什么，若确信自己没有做成任何伟大的事，若不认为自己已经达到了终极，这样的人才能保持谦卑。许多人从谦卑跌入了骄傲——愿这事不要临到我们！你是否做了任何谦卑的行为？不要自高，否则你会毁坏一切。法利赛人就是如此：他因向穷人施舍什一奉献而自高，结果毁坏了一切。但税吏却不是如此。再听听保罗怎么说：「我虽不觉得自己有罪，但因此我仍不能称义。」（哥林多前书 4:4）。你看，他如何没有自高，反而千方百计地贬抑和谦卑自己，而且是在他达到德行最高峰的时候？还有那三个少年人，身在火中，置于火焰之中，他们说了什么？「因为我们犯了罪，行了不法的事，离开了祢，在一切事上都犯了罪。」（但以理书 3:29）。这就是拥有忧伤痛悔的心。因此他们才能说：「但愿我们带着忧伤痛悔的心和谦卑的灵蒙悦纳。」（但以理书 3:39）。这样，他们在被投入火炉之后，甚至比被投入之前更加谦卑。当他们看见所成就的神迹时，认为自己不配得救，于是进入了深深的谦卑——因为当我们确信自己领受了不配得的伟大恩惠时，我们的灵里便格外忧伤痛悔。那么，他们又领受了哪些不配得的恩惠呢？他们容许自己被投入火炉，在青年时期就被掳，那时却是别人犯了罪，他们却没有抱怨，没有恼怒，也没有说：「我们侍奉上帝有什么益处呢？敬拜祂，我们得到了什么？一个邪恶之人成了我们的主宰；我们与拜偶像的人一同忍受拜偶像者的苦难；被掳，被剥夺了祖国、自由和一切亲族，成了俘虏和奴隶，服侍一个野蛮的君王！」他们什么都没有说——反而是什么呢？「因为我们犯了罪，行了不法的事」（他们说），并且不为自己祷告，却为别人祷告：「祂将我们交给了不义且邪恶的君王」（但以理书 3:32）。同样，但以理在第二次被扔进坑里时说：「上帝啊，祢记念了我。」（但以理书 14:38）。那么，当你在君王面前荣耀了上帝，并说：「这奥秘显明给我，并不是因为我比所有活着的人更有智慧」（但以理书 2:30）时，祂为何没有记念你，但以理呢？当你因不顺从那极度邪恶的命令而被投入狮子坑时，祂为何没有记念你呢？正是出于同样的理由。难道你现在被投入，不是为了祂吗？是的，他说；这是因为我在祂面前是一个巨大的债务人。如果他拥有如此伟大的德行时都这样说，那么我们又该说什么呢？再听听大卫怎么说：「倘若祂这样说：『我并不喜悦你』，那么，我就在这里；任凭祂向我做祂看为好的事吧！」（撒母耳记下 15:26）——尽管他本可以指出他无数的德行。同样，以利说：「上主自己，愿祂做祂看为好的事。」（撒母耳记上 3:18）。
  - type: paragraph
    initial:
      ru: '4.'
      cn: '4.'
    text:
      ru: 'Признательным рабам надлежит не только в благодеяниях, но и в наказаниях и в искушениях все предоставлять Ему. И не безрассудно ли думать, что Бог не пощадит рабов своих в наказаниях, тогда как мы дозволяем господам наказывать рабов своих, зная, что они пощадят их, потому что они – их собственные? Это выражает и Павел, когда говорит:«живем ли; умираем ли, потомувсегдаГосподни"(Рим.14:8). Он не захочет, чтобы уменьшалось богатство Его; Он знает, как наказывать; Он наказывает собственных рабов. Никто не щадит нас более, чем Он, приведший нас из небытия в бытие, повелевающий восходить солнцу, подающий дожди, вдохнувший душу и предавши за нас Сына Своего. Будем же, – о чем я сказал и для чего все это сказал, – будем смиренномудрствовать, как должно, будем уничижать себя, как должно, чтобы смирение не послужило нам поводом к гордости. Ты смирен и даже смиреннее всех людей? Не превозносись же этим и не порицай других, чтобы не погубить тебе похвалы своей. Ты для того и смиренномудрствуешь, чтобы избежать высокомерия; а если чрез это ты впадаешь в высокомерие, то лучше тебе и не быть смиренным. Послушай, что говорит Павел:«посредством доброго причиняет мне смерть, так что грех становится крайне грешен посредством заповеди»(Рим.7:13). Когда придет тебе на мысль удивляться своему смирению, то представь себе Владыку своего, как Он уничижил Себя, – и ты не станешь больше удивляться себе самому, не станешь хвалить себя самого, но посмеешься над собою, как не сделавшим ничего. Признавай себя всегдашним должником и, что бы ты ни сделал, приводи себе на память ту притчу:«Кто из вас, имея раба по возвращении его, скажет ему: пойди, садись за стол? Напротив, не скажет ли ему: приготовь мне поужинать и, подпоясавшись, служи мне»(Лук.17:7, 8). Благодарим ли мы рабов своих за то, что они служат нам? Никогда. Бог же воздает благодарностью нам, которые служим не Ему, но делаем полезное для нас. Впрочем, не будем поступать так из-за того, чтобы Он воздал нам благодарностью, чтобы Он узнал об этом, но как исполняющие долг свой. Подлинно, всякое (доброе) дело есть долг наш, и все, что мы ни делаем, есть исполнение долга. Если и мы, купив рабов за деньги, хотим, чтобы они жили всецело для нас, чтобы мы обладали всем, что имеют они, – то не гораздо ли более это следует Тому, Кто привел нас из небытия в бытиe и потом искупил нас честною кровью? Он дал за нас цену, которой никто не дал бы за собственного ребенка, – пролил кровь Свою. Потому, если бы мы имели каждый по тысяче душ и пожертвовали бы всеми ими, то воздали ли бы Ему равное воздаяние? Нет. Почему? Потому, что Он сделал это для нас, не будучи обязан, но совершенно по милости Своей; а мы обязаны к тому. Он, будучи Богом, сделался рабом, будучи непричастным смерти, сделался причастным ей по плоти; а мы, если и не положим за Него душ своих, то по закону природы непременно должны будем положить, – спустя немного времени поневоле расстанемся с жизнью. Так и с деньгами: если мы не отдадим их для Него, то по необходимости отдадим при смерти. Так и со смирением: если мы не будем смиренными для Него, то смирят нас скорби, несчастия, притеснения. Видишь ли, как велика благодарность Его? Он не сказал: что важного сделали мученики? если бы они не умерли за Меня, то и без этого непременно умерли бы; но воздает им великою благодарностью, так как они добровольно отдали то, что впоследствии должны были бы отдать невольно, по закону природы. Он не сказал: что важного делают раздающие свое имение? они непременно отдадут и поневоле; но воздает и им великою благодарностью и не стыдится исповедывать пред всеми, что Владыка питаем был рабами. Подлинно, и это – слава Владыки, чтобы иметь признательных рабов, и это – слава Владыки, чтобы так любить рабов Своих, и это – слава Владыки, чтобы принадлежащее им усвоять самому Себе, и это – слава Владыки, чтобы не стыдиться исповедывать это пред всеми. Устыдимся же такой любви Христовой, и сами воспламенимся любовью. Когда мы слышим, что кто-нибудь любит нас, то, хотя бы он был незнатен и беден, мы воспламеняемся особенною любовью к нему и оказываем ему великое почтение, любим его сами; а Владыка наш любит нас так много, – и мы остаемся нечувствительными? Нет, увещеваю вас, не будем настолько беспечны к спасению наших душ, но возлюбим Его по мере сил своих, отдадим все из любви к Нему – и душу, и имущество и славу, и все прочее с радостью, с готовностью, с усердием, не считая этого полезным для Него, но для нас самих. Таков, действительно, закон любви: любящие считают счастьем для себя, когда страдают за любимых. Будем и мы так же преданы Владыке нашему, чтобы нам достигнуть и будущих благ, во Христе Иисусе, Господе нашем, с Которым Отцу со Святым Духом слава, ныне и присно, и во веки веков. Аминь.'
      cn: '蒙恩的仆人，应当不但在恩惠中，也在惩罚和试探中将一切都交托给祂。难道去想上帝在惩罚中不会怜惜祂的仆人，这不愚蠢吗？因为我们知道主人会怜惜他们自己的仆人，仍允许他们惩罚仆人。保罗也表达了这一点，当他说：「我们或活或死，总是主的人。」（罗马书 14:8）祂不愿祂的财富减少；祂知道如何惩罚；祂惩罚祂自己的仆人。没有人比祂更怜惜我们，祂将我们从虚无带入存在，命令太阳升起，赐下雨水，吹入灵魂，并为我们舍弃了祂的圣子。


        那么，——这就是我所说的，也是我为何说这一切的缘由——让我们按照应有的方式谦卑己心，贬低自己，以免谦卑成为我们骄傲的借口。你谦卑，甚至比所有人都谦卑吗？不要因此而自高自大，也不要责备他人，以免你失去你的称赞。你谦卑己心是为了避免傲慢；而如果因此你反而陷入傲慢，那么你最好不要谦卑。听听保罗怎么说：「那良善的借着我，竟造成我的死亡，以致罪借着诫命变得恶极了。」（罗马书 7:13）当你心中生出对自身谦卑感到惊奇的念头时，就想象你的主宰，祂是如何贬抑自己——你将不再对自己感到惊奇，也不再称赞自己，反而会嘲笑自己，如同什么也没做一般。承认自己永远是（上帝的）债务人，无论你做了什么，都要想起那个比喻：「你们中间谁有仆人，当他回来时，会对他说：你去坐下吃饭吧？反倒不会对他说：你给我预备晚餐，束上腰，伺候我吗？」（路加福音 17:7-8）我们会感谢我们的仆人，因为他们服侍我们吗？从不。上帝却回报我们以感谢，我们所服侍的并非祂，而是为我们自己做有益之事。话虽如此，我们不应为了祂回报我们以感谢，不应为了让祂知道此事而如此行，而应视作履行自己的职责。确实，每一件（善）事都是我们的职责，我们所做的一切都是在履行职责。


        如果我们用钱买来仆人，希望他们完全为我们而活，希望我们拥有他们所拥有的一切——那么，这岂不更应归于那将我们从虚无带入存在，而后又用宝贵的血救赎我们的祂吗？祂为我们付出了无人会为自己孩子付出的代价——祂流了自己的血。因此，如果我们每人拥有一千个灵魂并牺牲所有这些灵魂，那么我们能报答祂同等的报偿吗？不能。为什么？因为祂为我们做这一切，并非出于义务，而是完全出于祂的怜悯；而我们对此负有义务。祂，本是上帝，却成为仆人，本与死亡无份，却按肉身与死亡有份；而我们，即使不为祂舍弃自己的生命，也必将依照自然法则舍弃，——不久之后，我们终将被迫与生命告别。钱财也是如此：如果我们不为祂舍弃它们，那么在死亡来临时也必将无奈地舍弃。谦卑也是如此：如果我们不为祂而谦卑，那么痛苦、不幸和压迫会使我们谦卑。你看，祂的感谢是多么伟大吗？祂没有说：殉道者做了什么了不起的事呢？如果他们不为我而死，他们也无论如何都会死去；而是以极大的感谢回报他们，因为他们自愿舍弃了那些他们后来无论如何都将依据自然法则被迫舍弃的东西。祂没有说：那些分发自己财产的人做了什么了不起的事呢？他们无论如何都会被迫舍弃；而是同样以极大的感谢回报他们，并且不羞于在众人面前承认，主宰曾被祂的仆人所供养。确实，拥有蒙恩的仆人，也是主宰的荣耀；如此爱祂的仆人，也是主宰的荣耀；将属于他们的认作是自己的，也是主宰的荣耀；并且不羞于在众人面前承认这一点，也是主宰的荣耀。


        那么，让我们面对基督如此的爱而感到惭愧，并我们自己也燃起爱火。当我们听说有人爱我们时，即使他卑微贫穷，我们也会对他燃起特殊的爱，并对他致以极大的敬意，我们自己也会爱他；而我们的主宰如此深爱我们——我们却无动于衷吗？不，我劝告你们，不要对我们灵魂的救赎如此漫不经心，而是要尽我们所能地爱祂，出于对祂的爱而献上一切——献上生命、财产、荣耀，以及所有其他的一切，都带着喜乐、乐意和热忱，并非认为这对祂有益，而是对我们自己有益。确实，这就是爱的法则：爱人者认为，为所爱之人受苦是他们自己的幸福。愿我们也同样忠于我们的主宰，以使我们能获得未来的美善，在我们的主耶稣基督里，祂与父和圣灵同受荣耀，从今时直到永远，世世代代。阿们。'
