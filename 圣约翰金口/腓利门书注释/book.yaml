    text:
      ru: Предисловие[1]
      cn: 前言[1]
  - type: paragraph
    text:
      ru: Прежде всего, нужно сказать о поводе к написанию этого послания, а потом и о других вопросах. Какой же был повод? Некто Филимон, один из почтенных и благородных мужей, – а что он был муж почтенный, это видно из того, что весь дом его был верным и настолько верным, что называется даже церковью, как говорит (Павел), когда пишет:«и домашней твоей церкви!»(Флм. 1:2), также свидетельствует о великом его послушании и о том, что им«успокоены сердца святых»(Флм. 1:7), и заповедует в том же послании приготовить для себя гостинницу (Флм. 1:22), так как дом его, кажется мне, был пристанищем для всех святых, – этот почтенный муж имел раба Онисима. Онисим, украв что-то у господина своего, убежал; а что он действительно украл, о том, послушай, как говорит (Павел):«Если же он чем обидел тебя, или должен,.. я заплачу»(Флм. 1:18, 19). Потом, придя к Павлу в Рим, найдя его в темнице и будучи оглашен от него учением, он принял там крещение; а что он принял там дар крещения, видно из слов:«которого родил я в узах моих»(Флм. 1:10). Поэтому Павел пишет послание, в котором препоручает его господину, чтобы тот во всем простил его и принял, как уже возрожденного.
      cn: '首先，需阐明此书信写作之缘由，然后便可谈及其他问题。那么，缘由究竟为何？


        有一位名叫腓利门的人，他是尊贵而高尚的男子之一——他之所以尊贵，可从其全家皆为信徒，且信德如此之深，以至于被称为教会一事看出，正如（保罗）所说，当他写道：「以及在你家中的教会！」（腓利门书 1:2）；这也证明了他极大的顺从，并表明因他而「众圣徒的心都得了畅快」（腓利门书 1:7）；并且在同一封书信中命令他为自己预备客房（腓利门书 1:22），因为他的家，在我看来，曾是所有圣徒的避难所——这位尊贵的男子有一个奴仆，名叫阿尼西母。阿尼西母偷了他主人的一些东西后逃走了；至于他确实偷窃了，请听（保罗）是如何说的：「他若亏负了你，或欠你什么，我都算在我账上，我要偿还。」（腓利门书 1:18，19）。后来，他来到罗马找保罗，发现他身陷囹圄，并从保罗那里听闻教义并接受了慕道教导，他便在那里领受了洗礼；至于他是在那里领受了洗礼之恩典，可从以下话语看出：「就是我在捆锁中所生的儿子」（腓利门书 1:10）。因此，保罗写了这封书信，在其中将他托付给他的主人，好让他的主人完全赦免他，并接纳他，如同一个已蒙重生之人。'
  - type: paragraph
    text:
      ru: Некоторые говорят, что не нужно присоединять это послание (к канону священных книг), так как оно касается маловажного дела, только одного человека; но пусть узнают высказывающие такое неодобрение, что сами они достойны многих укоризн. Не только такие малые послания и написанные о таких обыкновенных предметах следовало принять (в канон); но желательно, чтобы кто-нибудь в состоянии был рассказать нам полную, историю апостолов, чтобы не только, о том, что они писали и говорили, но и о прочем их образе жизни, что они ели и когда ели, когда сидели и куда ходили, что делали каждый день, в каких странах бывали, в какой дом входили и где плавали, обо всем этом рассказал бы подробно, – такой великой пользы исполнено все, что они делали! Но многие не знают происходящей отсюда пользы, и потому высказывают неодобрение. Если мы, взирая только на места, где они сидели, или были связаны, на места бездушные, часто обращаемся к ним мыслью, представляем их добродетели, пробуждаемся от своей беспечности и становимся более ревностными, то тем более было бы так, если бы мы слышали их слова и другие их деяния. Если о друге всякий спрашивает, где он живет, что делает, куда идет, то неужели, скажи мне, нам не следует знать все это о всеобщих учителях вселенной? Кто живет духовно, того и одежда, и походка, и слова, и дела, вообще все приносит пользу слушающим, и никакого не встречается к тому препятствия и затруднения. Впрочем, вам полезно узнать, что это послание касается предметов необходимых. Смотри же, сколько доброго в нем заключается. Во-первых (мы научаемся), что нужно быть внимательным ко всему, потому что если Павел показывает столько заботливости о беглеце, разбойнике и воре, не отказывается и не стыдится отсылать его с такими похвалами, то тем более нам не следует быть небрежными в подобных случаях. Во-вторых, что не нужно считать сословие рабов отверженным, хотя бы дошли они до крайней степени зла, потому что если вор и беглец сделался настолько добродетельным, что Павел желал иметь с ним общение и писал:«дабы он вместо тебя послужил мне»(Флм. 1:13), то тем более не следует отчаиваться в людях свободных. В-третьих, что не нужно рабов отнимать от господ, потому что если Павел, будучи так уверен в благорасположении к нему Филимона, не хотел без воли господина удержать при себе Онисима, который был так нужен и полезен ему, то тем более не должны делать этого мы. Если раб – человек добродетельный, то он тем более должен оставаться в услужении и почитать власть господина, чтобы приносить пользу всем находящимся в доме. Для чего же снимать свечу со светильника«и ставить ее под сосудом»(Мф.5:15)? О, если бы и тех, которые находятся вне, можно было ввести внутрь города! Но что, скажешь, если он и тогда окажется негодным? Почему же, скажи мне? Потому ли, что он войдет в город? Но подумай, что, находясь вне, он будет еще хуже; если он, находясь внутри, окажется негодным, то тем более (будет таким), находясь вне; здесь, при попечительном господине, он будет свободен от неизбежных забот, а там эти заботы, может быть, отвлекут его от предметов более необходимых и духовных. Потому блаженный Павел и дает (рабам) такой прекрасный совет:"Рабом ли, – говорит, –ты призван, не смущайся; но если и можешь сделаться свободным, то лучшим воспользуйся»(1Кор.7:21), т. е. оставайся в рабстве. А необходимее всего то, чтобы не было хулимо слово Божие, как и сам он говорит в послании:«Рабы, под игом находящиеся, должны почитать господ своих достойными всякой чести, дабы не было хулы на имя Божие и учение»(1Тим.6:1). Даже и язычники скажут, что и раб может угодить Богу; иначе многие были бы поставлены в необходимость хулить и говорить, что христианство ниспровергает весь порядок жизни, отнимая рабов у господ и делая насилие. Сказать ли и еще нечто? (Это послание) научает нас не стыдиться рабов, если они добродетельны; если Павел, превосходнейший из всех людей, так отзывается о нем (Онисиме), то тем более мы должны (так поступать) со своими (рабами). После таких достоинств, хотя мы еще не все сказали, ужели кто-нибудь станет думать, что это послание напрасно включено (в канон)? Не будет ли это крайним безумием? Итак, прошу вас, выслушаем со вниманием послание, написанное апостолом; уже получив от него столько пользы, мы получим еще больше при последовательном чтении.
      cn: '有些人说不应将此书信纳入圣书正典，因为它所涉及的是一件无足轻重之事，仅关乎一个人；但愿那些提出这种不赞同意见的人明白，他们自己才应受诸多责备。不仅是这些短小书信以及那些论及寻常事物而写就的信件，都应被纳入（正典）；更期望有人能为我们讲述使徒们完整的生平史，不仅是他们所写所说，还有他们其余的生活方式：他们吃什么，何时吃；何时坐，去何处；每日所做之事，曾到何国，进入何家，又在哪里航行过——但愿有人能详细讲述这一切，因为他们所行的一切都充满如此巨大的益处！然而许多人并不知道由此而来的益处，因此才提出不赞同意见。如果我们单单看着那些无生命的地方——他们坐过或被捆绑过的地方，常常思念他们，描绘他们的美德，从而从自身的怠惰中警醒，变得更加热切，那么，如果我们听到他们的言语和其他作为，那又将何等地更加如此呢？如果人人都会询问朋友住在哪里，做什么，去往何处，那么，请告诉我，对于普世的导师们，我们难道不应知晓所有这些吗？凡活在灵里的人，其衣着、举止、言语、行为，总之，他的一切都会使听者受益，毫无阻碍与困难。


        然而，你们有益知晓，这封书信关乎必要之事。请看，其中包含多少善事。首先（我们从中学习），对一切都当留意，因为如果保罗对一个逃犯、强盗和窃贼都表现出如此多的关切，不拒绝也不羞于以如此赞美之词遣返他，那么我们在类似情况下更不应粗心大意。其次，不应将奴隶阶层视为被弃绝的，即使他们已达邪恶的极致，因为如果一个窃贼和逃犯变得如此有美德，以至于保罗希望与他相交，并写道：「使他替你服事我」（腓利门书 1:13），那么对自由人更不应绝望。第三，不应将奴隶从主人身边带走，因为如果保罗，如此确信腓利门对他的善意，却不愿未经主人同意便将阿尼西母留作己用——尽管阿尼西母对他如此需要且有益——那么我们更不应如此行。如果一个奴隶是有美德的人，那么他更应留在服事中，并尊重主人的权柄，以便使家中所有人受益。为何要将灯台上的灯取下，「放在斗底下」（马太福音 5:15）呢？哦，但愿那些在外之人也能被引入城内！但你会说，如果他那时仍然败坏怎么办？请告诉我，为何如此？是因为他进了城吗？但请想一想，他在外之时会更糟；如果他在内之时都败坏，那么他在外之时就更会如此；在这里，在一位细心照料的主人身边，他会免去无法避免的忧虑，而在那里，这些忧虑或许会使他偏离更必要和属灵的事物。因此，蒙福的保罗也给予（奴隶们）如此美好的建议：「你蒙召之时是奴隶吗？」他说，「不要忧虑；即使你能获得自由，也当利用那更好的」（哥林多前书 7:21），即留在奴役中。而最必要的莫过于使上帝的圣言不受亵渎，正如他自己在这封书信中所说：「凡在轭下的奴隶，当以自己的主人配受一切尊荣，免得上帝之名和教训受人亵渎」（提摩太前书 6:1）。甚至异教徒也会说，奴隶也能取悦上帝；否则，许多人将被迫亵渎，并说基督信仰颠覆了整个生活秩序，因为它将奴隶从主人身边夺走，并施行暴力。


        再多说一些吗？（这封书信）教导我们，如果奴隶有美德，就不应以他们为耻；如果保罗，所有人中最卓越的，都如此评价他（阿尼西母），那么我们对待我们自己的（奴隶）更应如此行。在拥有如此多的优点之后，尽管我们尚未说完所有，难道还有人会认为这封书信被无故纳入（正典）吗？这难道不是极端的愚蠢吗？因此，我请求你们，让我们留心聆听使徒所写的这封书信；我们已从中获得如此多的益处，在逐次阅读时，我们还将获得更多。'
