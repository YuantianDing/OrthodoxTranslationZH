    text:
      ru: 'Флм. 1:17–19.Итак, если ты имеешь общение со мною, то прими его, как меня. Если же он чем обидел тебя, или должен, считай это на мне. Я, Павел, написал моею рукою: я заплачу; не говорю тебе о том, что ты и самим собою мне должен.'
      cn: '(腓利门书 1:17-19)


        所以，如果你与我相通，就接纳他，如同接纳我一样。如果他有什么地方亏负了你，或欠你什么，就记在我的账上。我保罗亲手写下：我必偿还；更不用说你连自己也亏欠了我。'
  - type: paragraph
    text:
      ru: Молитва бывает великим благом тогда, когда мы совершаем дела, достойные ее. – Если Бог требует отчета и наказывает, то это не значит, что Он не есть благ.
      cn: 祷告是莫大的福祉，那时，我们所行的事配得上它。——如果上帝要求交账并施以惩罚，那并不意味着祂不是良善的。
