  - type: paragraph
    text:
      ru: 'Все село узнало, что я вернулся, и люди приходили на меня глянуть, – вспоминал старец Порфирий. – Я был молодым парнем. До своей болезни я был очень красивым и розовощеким. Но лицо мое было прекрасно не мирской красотой, а Божественной. И теперь, когда я вернулся в мир, все говорили обо мне и о моих волосах. Они отросли ниже пояса. В деревне поднялся большой шум. Поэтому я, чтобы не стричь их, вскипятил воду в кастрюле, сунул их туда и долго варил. Тогда волосы испортились и выпали. Образовалась лысина. Люди в деревне приходили, как я сказал, просто глянуть на меня. Разошлась молва, что сын Леонида Баирактариса, который пропал и которого считали умершим, вернулся с Афона, где подвизался. И народ от любопытства приходил на меня посмотреть. Я не разговаривал, еще очень стеснялся. Пошел я в деревенскую церковь. Все смеялись надо мной. Мать моя смущалась, плакала и рыдала. Она не хотела даже видеть меня и, бедная, выгнала меня из дома… Вначале меня взяла к себе моя тетка. В ее доме я начал хорошо питаться: ел сыр, яйца, мясо, молоко, чтобы поправиться от болезни. Но я не смог там жить, потому что желал другой обстановки. Что мне было делать дома? Да еще я смущался, что с тех пор, как уехал, ничем не помог своим родным... Как же тут желать, чтобы они ухаживали за мной? – Удивлялся старец Порфирий ...'
      cn: 所有村庄的人都知道我回来了，人们前来看我，长老彼罗菲里回忆说。那时我还是个年轻人。在我生病之前，我非常英俊，面色红润。但我的脸是圣洁的美丽，而不是世俗的美丽。因此，当我回到人间时，人们都谈论我以及我的头发。它们长到了腰间以下。村里掀起了一阵喧嚣。因此，我为了不剪掉它们，把一锅水烧开了，把头发放进去煮了很久。然后头发腐烂了，掉了下来。村里的人前来，正如我所说的，只是来看我。谣言四起，说莱昂尼德·巴伊拉卡塔里斯的儿子，他失踪了，人们认为他已经去世，从阿夫诺回来了，他在那里修行。因此，人们出于好奇前来看我。我没有说话，仍然非常拘谨。我去了村里的教堂。大家都笑话我。我的母亲感到难为情，哭泣着，哀求着。她不愿意看到我，可怜的她把我赶出了家门……起初，我被我姑妈收留。在她家，我开始吃得很好：吃奶酪、鸡蛋、肉、牛奶，以便从病中恢复。但我不能在那里住，因为我渴望另一种生活环境。我该怎么办在家里？而且我还感到羞愧，自从离开后，我什么都没有为我的亲人做……在这种情况下，怎么能希望他们照顾我呢？——长老彼罗菲里惊讶地说道……
- type: heading1
  text:
    ru: Как только я почувствовал себя лучше – сразу отправился на Святую Гору
    cn: 一旦我感觉好些了——就立刻前往圣山
  children:
  - type: paragraph
    text:
      ru: 'В четырех-пяти часах ходьбы от нашей деревни был монастырь Святого Харалампия, – вспоминал старец Порфирий. – Однажды я попросил отца, чтобы он проводил меня туда, но не для того, чтобы я там остался. Я не знал, как там и примут ли меня там. Между тем в Аливери случайно мы встретили отца Иоанна Папавасилиу. Он позвонил владыке — тогда была телефонная линия из Аливери в Кими — и сказал, что приехал один монах со Святой Горы. Владыка города Кими, Пантелеймон Фостинис, очень любил монахов и говорит ему: — Отец Иоанн, береги его, чтобы он не уехал от нас! Отец и я отправились в монастырь. На прощание я хотел поцеловать у матери руку, но она, бедная, отдернула ее, не дала мне поцеловать. Итак, мы с отцом пошли в монастырь Святого Харалампия. В монастыре игумен принял меня с радостью и любовью, поговорил со мной. Когда я рассказал ему о своих трудностях, он предложил мне: — Оставайся здесь. У нас есть и яйца, и молоко, и куры, – все есть. И я остался там. Игумен полюбил меня так сильно, что готовил для меня специально. Сначала у меня не было даже аппетита, но постепенно я пришел в себя. Вначале отец жил со мною, чтобы ухаживать за мной. Отец мой был псалтом и сподобился познакомиться со святым Нектарием. Он был очень верующий и благоговейный. Когда я почувствовал себя хорошо, тогда снова поспешил на Святую Гору. Приехал туда. Как обрадовались мои старцы! Но через десять-тринадцать дней все началось сначала. У меня пропал аппетит, я стал бледным, худым, отощал на вермишели и тому подобной пище. Представляете, как тяжело я был болен. Тогда я еще раз получил благословение на отъезд в монастырь Святого Харалампия. Там снова яйца, сыр, масло и прочее, как и прежде. Я снова приходил в себя, укреплялся. Через три месяца возвращался на Святую Гору. Три раза я уезжал и приезжал, но через десять-тринадцать дней все повторялось. В третий раз старцы говорят мне: — Мы ответственны за твое здоровье и не можем тебя оставить. Мы любим тебя, хотим, чтобы ты был здесь, но Бог показывает, что ты должен уехать, чтобы не умереть. Еще они добавили: — Мы любим тебя, и если когда-нибудь Бог сподобит тебя, а мы верим, что Он поможет, и ты станешь здоров, если захочешь приехать, найди такого же юношу, как ты, и приезжай. Мы хотим, чтобы ты был с нами.'
      cn: 在四至五小时步行距离之外，我们的村子有一座圣哈拉马修道院，长老彼罗菲里回忆说。有一天，我请求长老带我去那里，但不是为了留在那里。我不知道那里会怎么接待我。然而，在阿里维亚，我们偶然遇到了约翰·帕帕瓦西卢长老。他给卡米城的主教打电话，说有一个来自圣山的修士来到。卡米城的主教帕纳菲蒙·福斯蒂尼斯非常喜爱修士们，对约翰长老说：「约翰长老，要照顾好他，不要让他离开我们！」我和约翰长老一起去了圣哈拉马修道院。修道院的院长以极大的热情和爱心接待了我，和我交谈。当我向他讲述我的困难时，他建议我：「留下来吧。我们有鸡蛋、牛奶、母鸡，一切都有。」于是我就留下来了。院长对我如此喜爱，以至于为我准备了特别的食物。起初，我甚至没有食欲，但渐渐地，我恢复了健康。起初，我的修士和我一起生活，照顾我。我的修士是个诗经，他得以认识圣尼卡里乌。他非常虔诚，敬畏上帝。当我感觉好些时，我又一次回到了圣山。我一到那里，我的老修士们就多么高兴啊！但十天到十三天后，一切又开始重复。我失去了食欲，变得苍白、消瘦，靠干粮和类似的食品维持。你们想象一下，我多么痛苦。于是，我又一次得到了留在圣哈拉马修道院的许可。那里有鸡蛋、奶酪、黄油等等，和以前一样。我又恢复了健康，变得强壮。三个月后，我再次回到圣山。我三次离开，三次回来，但十天到十三天后，一切又重复。第三次，老修士们对我说：「我们对你负责，不能让你离开。我们爱你，希望你在这里，但上帝显示，你必须离开，否则你会死去。他们还补充说：「我们爱你，如果上帝赐福给你，我们相信他会帮助你，如果你愿意回来，找到和你一样的年轻人，你就可以回来。我们希望你在这里。」
  - type: paragraph
    text:
      ru: 'И, дав свое благословение, отослали, сказав на прощание: — Мы боимся, как бы братия не стала нас осуждать, если ты умрешь здесь в столь юном возрасте. Мы не хотим посылать тебя в мир, но иначе поступить не можем. Видишь, что и мы очень переживаем. Но мы сделали все, что от нас зависит, что только может сделать любящее сердце. Ты три раза уезжал и возвращался, но не смог удержаться здесь. Они дали мне на дорогу толстое шерстяное одеяло, которое я сохранил. Это мое лучшее одеяло. Оно было в моей келий, я лежал на нем. На этом одеяле я совершал все свои духовные подвиги. Я делал земные поклоны и спал, бодрствуя. Так я окончательно уехал со Святой Горы, – скорбно добавил старец Порфирий. – Приехал в монастырь Святого Харалампия. Там все ждали меня, любили и радовались моему возвращению. Я снова начал питаться молоком, маслом и яйцами. Я вспомнил одну важную деталь, и сейчас хочу дополнить: Один монах со Святой Горы, звали его отец Иоаким, — он жил на келий святого Нила, послушники его живы до сих пор — написал моей матери письмо, в котором сильно ее отругал, очень сильно. Он написал ей, что даже дикие звери любят своих детей… Он написал в этом письме много, много прекрасного, но и еще больше укоряющего и тяжелого. Тогда мать моя пришла в большое сокрушение. Бедная, позже она изменилась, и обратилась к Церкви. Когда я служил, она сидела напротив, складывала руки крестообразно и молилась. Все время смотрела на меня, не оставляла меня ни на минуту и с гордостью говорила; «Батюшка мой!» В одной деревне, в Цакеях, где я немного послужил после хиротонии, ее называли попадьей. Ей целовали руку, а она, бедняжка, гордилась. Она и умерла при мне. «Детка, надо было всех сделать монахами! — говорила она мне. — Сначала я неправильно понимала это. Вот бы все мои дети стали монахами!»'
      cn: 伊尔凡，赐予我祝福后，他们说了一些话：——我们害怕，怕兄弟会因为我在如此年轻的时候去世而谴责我们。我们不想把你看走，但我们别无选择。你看，我们也很痛苦。但我们已经尽力了，尽了我们所能，一个充满爱心的心所能做的。你三次离开，又三次回来，但还是没能留下。他们给了我一条厚羊毛毯，我一直保留着。这是我最好的毯子。它在我小屋子里，我躺在上面。在这条毯子上，我完成了所有的精神磨练。我做着地上的鞠躬礼，保持清醒。就这样，我最终离开了圣山，老修士波菲里耶补充道：——我来到圣哈拉马修道院。那里所有人都在等着我，爱我，为我的归来而高兴。我又开始喝牛奶、吃黄油和鸡蛋。我想起了一个重要的细节，现在我想补充一下：圣山上的一个修士，名叫雅各布，他住在尼尔修士的小屋子里，至今还有他的弟子们。他在信中严厉地批评了我母亲，批评得非常厉害。他在信中写了很多美好的东西，但也有更多的责备和沉重的内容。那时，我的母亲陷入了极大的悲痛。可怜的她，后来她改变了，转向了教会。当我做弥撒时，她坐在我的对面，双手合十，祈祷。她一直看着我，一刻也不离开我，并以自豪的口吻说：「我的牧师！」在扎卡耶村，我在受职后稍作停留，人们称她为修女。她会被人亲吻手，而她，这个可怜的女人，会感到自豪。她在我身边去世。她对我说：「孩子，应该让所有人都成为修士！——起初，我误解了这个意思。要是我的孩子们都成为修士该多好！」
- type: heading1
  text:
    ru: Епископ Порфирий рукоположил меня во священника
    cn: 牧首费奥法农祝我为神甫
  children:
  - type: paragraph
    text:
      ru: 'Я жил как монах в монастыре Святого Харалампия, а именно, хранил правило, – вспоминал старец Порфирий. – Мне очень нравилось читать жития святых, каноны и многое другое. Я наизусть выучил Новый Завет, различные молитвы. Псалтирь я за несколько лет до того выучил наизусть. Знал все псалмы и мог связывать по смыслу разные места из текстов Священного Писания. Псалтирь была пищей для моих размышлений. Повторюсь еще раз: в монастыре я жил как монах, ходил в старой рясе. Ночью я обычно выходил из монастыря и читал Псалтирь, которую в монастыре не читали. Помогал в монастырских работах. Бегал туда-сюда. Мне дали ключи от монастырской сыроварни, потому что в монастыре было два-три старых монаха, которые нуждались в помощи. Они, бедные, мне полностью доверяли... Но и на послушаниях я не оставлял своего ума праздным, а поучал его. То есть я не поучал его, а это было постоянное желание Бога. Ну как вам объяснить? Это как девушка, которая заболела, например, плевритом, но на уме у нее только возлюбленный. Понимаете? Любимый... Это было полное посвящение себя Возлюбленному, Христу. Там я и стал священником. Послушайте-ка, я вам расскажу об этом. Владыка Фостин привечал богословов, поддерживал их. Однажды приехал в село Кими к владыке один студент-богослов, чтобы подготовиться к выпускным экзаменам. Обычно после еды владыка проводил в трапезной беседу со всеми монахами на различные духовные темы. Например, владыка спрашивал; — Дети, скажите мне, какая самая великая добродетель? Монахи высказывали свое мнение. За столом сидело человек пятнадцать. Темы были различными: о Писании, о религии, о монашестве. Однажды вечером, когда речь зашла о монашестве, владыка воскликнул: — Ах, дайте мне монахов! Ничего другого и не хочу. Только это. Только монахов, хороших, верующих, терпеливых. Тогда многое можно будет сделать. В этот момент встал этот богослов — он был из Коклы, недалеко от Фив — и говорит ему: — Владыка, как тебе сказать? Ты восклицаешь о монахах, а в монастыре медленно умирает один монах со Святой Горы, а ты и не знаешь об этом. — Что ты говоришь! — взволновался владыка. — Да, приехал один юноша, бедняга, со Святой Горы. Он очень хороший, но худой, кожа да кости. А игумен еще ставит его на работы. — Сейчас же езжай и привези его мне сюда. Приезжает он к игумену с письмом, спрашивает Никиту — так меня тогда звали, это было мое монашеское имя. Он тут же отвез меня к владыке.'
      cn: 我像修士一样住在圣哈拉姆修道院，修士们回忆说，我遵守修士的规条。我非常喜欢阅读圣徒的生平、教规以及其他许多内容。我将新约圣经背得滚瓜烂熟，背诵了许多祷文。我用几年的时间将诗篇背得倒背如流。我熟悉所有的诗篇，并且能够将圣经的不同章节联系起来。诗篇成了我思考的食粮。我再次重复：我在修道院里像修士一样生活，穿着旧袍子。夜晚，我通常会离开修道院，读诗篇，修道院里没有读诗篇。我帮助修道院里的工作。我来回奔波。他们给了我修道院奶酪作坊的钥匙，因为修道院里有两个或三个老修士需要帮助。他们贫穷，完全信任我……但是在我守规矩的时候，我的心思也没有空闲，而是教导它。也就是说，不是教导它，而是这是上帝的意愿。怎么解释呢？就像一个得了肺病的女孩，她的心思只在她所爱的人身上。明白了吗？所爱的人……这是完全献身于所爱的人，献身于基督。在那里，我成为了修士。请听我说，弗斯蒂尼主教接待过许多神学家，支持他们。有一次，一个神学家学生来到弗斯蒂尼主教的村庄基米，准备毕业考试。通常，饭后，主教会在堂屋里与所有修士讨论各种灵性主题。例如，主教会问： ——孩子们，告诉我，什么是最大的美德？修士们提出自己的看法。在桌旁坐了十五个人。话题包括《圣经》、宗教、修道生活。有一天晚上，当话题转向修道生活时，主教说： ——啊，给我修士吧！我什么都不想要，只有修士，好的、信主的、忍耐的。那么，很多事情就可以做了。这时，一个神学家站了起来，他是从菲伊附近基米村来的，我叫他尼基塔。他立刻将我带到主教面前。
  - type: paragraph
    text:
      ru: 'Когда я приехал к нему, он положил свою руку мне на голову и говорит: — Как поживаешь, детка? Он провел меня к себе, и мы стали беседовать. — Откуда ты? Как сюда попал? Я вкратце ему рассказал, как я любил Христа и подвижническую жизнь, как в юном возрасте уехал на Святую Гору. Рассказал и о том, как заболел и старцы послали меня в мир, чтобы я выздоровел. Знаете, что тут началось? Он вызвал лучшего врача города. Врач пришел ко мне, осмотрел меня, дал мне целую кучу лекарств. Владыка хотел меня удержать. Но я стеснялся оставаться рядом с ним. Мне нравились лес, тишина, молчание. Я вернулся обратно в монастырь Святого Харалампия. Владыка часто посещал монастырь. Это был человек святейший. Я его узнал по его дарованиям. Как-то он приехал в монастырь Святого Харалампия. Я услышал, как он говорит, и мне понравились его слова. Я никогда не слышал священнопроповедника. Этот владыка создал одно учреждение недалеко от Кими, которое назвали «Священным братством Святого Пантелеймона». Владыка иногда приезжал в монастырь с ребятами из этого братства И вот, владыка приехал в монастырь с архиепископом горы Синайской Порфирием III. Они решили рукоположить меня во священники. Я не хотел этого, понимаете? Я знал, что правильно — желать стать монахом, а не добиваться сана священника или владыки. Нужно бежать этого. Я это точно знал! В конце концов, епископ Порфирий сделал меня священником и дал мне свое имя. Я его воодушевил. Я по благодати открыл ему нечто его личное, когда шел с ним в горах, и он сказал владыке: — Этого не теряй. Мне было тогда двадцать лет, – напомнил старец Порфирий. – Я не хотел становиться священником, но иначе быть не могло. Владыка очень настаивал, а владыка — образ Христов. Нельзя ему отказывать настойчиво. Нельзя разорвать своих отношений с епископом, потому что молитва твоя тогда не взойдет к небу, остается бесплодной. Так они рукоположили меня во диаконы в праздник святой Параскевы и во священники — в день праздника святого Пантелеймона.'
      cn: 当我去到他那里时，他把他的手放在我的头上，说：「你过得怎么样，宝贝？」然后他带我到他那里，我们开始交谈。「你从哪里来？你怎么来到这里的？」我简短地向他讲述了我爱慕基督和修道生活的经历，讲述了年轻时就去了圣山的事。我还讲述了自己生病，长老们让我离开人间以便我能康复的事。你知道，发生了什么？他请来了城里最好的医生。医生来看我，检查了我，给我开了许多药物。长老想留我在这里。但我不好意思待在他身边。我喜欢森林、宁静、沉默。我回到了圣哈拉米亚修道院。长老经常来这个修道院。他是一个圣洁的人。我认识他是因为他的恩赐。有一天，他来到圣哈拉米亚修道院。我听到了他说话的声音，觉得他的言语很吸引人。我从未听过如此的神甫讲道。这位长老创建了一个机构，距离基米不远，被称为「圣潘泰罗圣兄弟会」。长老有时会带着这个兄弟会的成员来这个修道院。最终，圣索菲亚大主教帕弗里里三世带着圣山大主教来到这个修道院。他们决定要给我举行圣职。我不愿意这样做，你知道？我知道，正确的事是成为一名修士，而不是追求主教或长老的职位。我必须逃离这一切！我对此非常确定！最后，大主教帕弗里里给我举行了圣职，给了我他的名字。我鼓励了他。在山上，当我和他一起行走时，我通过圣灵的恩赐向他揭示了一些他个人的事，他告诉长老：「不要失去这个。」那时我二十岁，长老帕弗里里提醒我：「我本不想成为神甫，但这是唯一的选择。」长老非常坚持，而他就像基督的形象。不能对他如此坚持，因为你的祈祷那时不会上升到天，会变得无用。就这样，他们在我圣帕拉斯凯节举行圣职仪式，我在圣潘泰罗节成为神甫。
- type: heading1
  text:
    ru: Я должен был проводить бесконечные исповеди!
    cn: 我必须进行无数的告解！
  children:
  - type: paragraph
    text:
      ru: 'Меня сделали духовником уже через два года, – вспоминал старец Порфирий. – На престольный праздник, когда собралось много народу, меня подвели к трону владыки и официально прочитали надо мною молитву духовника. Я был еще молод. Откуда у меня были знания! Глупеньким, бедный, был... Я был необразован, не знал правил духовника. Что сказать? Не все знал... Что делать? Преклонил в послушании голову. Теперь я понимаю. Тогда я толком не понимал. Как меня любили и монахи, и люди, которые приходили ко мне исповедоваться! Там я исповедовал день и ночь. То есть начинал я рано утром, продолжал целый день, следующую ночь, потом весь следующий день, а потом вторую ночь без перерыва. Двое суток без еды. К счастью, Бог позаботился обо мне, просветил мою сестру. Она приносила мне немного молока, чтобы я пил. К комнате, где я исповедовал, вела высокая лестница со многими ступеньками, по которой поднимались люди на исповедь. Всю ночь они ожидали своей очереди. Уходя, они говорили друг другу: «О, этот священник — сердцеведец!» Называли они меня так по-албански. Там я провел пятнадцать лет. Когда ко мне приходили, я обычно спрашивал: — Сколько тебе лет? С кем живешь? Один отвечал: «Со своей женой». Другой: «Со своими родителями». Третий: «Живу один». Я продолжал: «Где ты учился? Чем занимаешься? Как долго не исповедался? Как долго не причащался?» Как-то так. А потом, в зависимости от того, что они мне говорили, я немного беседовал с ними и, поскольку очередь ждала, спрашивал: — Брат, что ты вспоминаешь сейчас? Что, как ты чувствуешь, отягощает твою душу, твою совесть? Какие соделал прегрешения, в какие впал грехи? И человек начинал потихоньку исповедовать свои ошибки, я ему немного помогал, сказав прежде, что он должен вправду сказать, что он чувствует. Тех, кто приходил ко мне на исповедь, первое время бросало в жар. У меня лежала книга «Руководство к исповеди» преподобного Никодима Святогорца. Например, человек мне открывал какой-нибудь тяжкий грех. Я смотрел в книгу. Там было написано: «Восемнадцать лет не причащаться». Тогда у меня еще не было опыта. Я назначал епитимьи согласно правилам, и что было написано в книге, являлось для меня законом. Постепенно стали приходить и на следующий год. Приходили из разных мест, из разных деревень, и из далеких, и из близких. Но когда я спрашивал их: «Как давно не исповедовались?» — они мне отвечали: — Да – как, в прошлом году я тебе исповедовался. — И что я тебе сказал?'
      cn: 我被任命为神父是在两年后，长老普罗菲利耶回忆说。在圣职庆典那天，当有很多人聚集时，我被带到主教的宝座前，正式为我念诵了神父的祷告。那时我还很年轻。我从哪里获得的知识？我是个愚蠢的穷人……我无知，不懂神父的规矩。该怎么办？我低头服从。现在我明白了。当时我还不明白。我被修士们以及前来忏悔的人们深深地爱着！我在那里整日整夜忏悔。也就是说，我从早上开始，一直持续到整日，再接着到整夜，然后又连续度过第二天的白天，再接着是第二夜，没有休息。两天没有进食。幸好上帝照顾到了我，我的姐姐也开导了我。她给我带来一些牛奶，让我喝。通往我忏悔室的是一条高高的楼梯，上面有很多台阶，人们通过它来忏悔。整夜，人们都在等待着他们的轮到。离开时，他们互相说：「哦，这个神父真是个心灵医生！」他们这样称呼我，这是阿尔巴尼亚语。在那里，我度过了十五年。当他们来见我时，我通常会问：—— 你多大了？和谁生活？—— 一个回答说：「和我妻子生活。」—— 另一个回答说：「和我的父母生活。」—— 第三个回答说：「一个人生活。」我继续说：「你在哪里学习？你做什么？你多久没有忏悔？你多久没有受圣餐？」就这样。然后，根据他们向我讲述的内容，我会和他们进行一些交谈，因为轮到我的人还在等待。然后我会问：—— 兄弟，你现在在想什么？你现在在想什么，你感觉如何，你的良心在想什么？你犯了哪些罪，你犯了哪些罪？然后，这个人开始慢慢地忏悔自己的错误，我稍微帮助他，告诉他，他必须诚实地说出他所感受到的。那些前来我这里忏悔的人，一开始总是让我感到很紧张。我有一本《尼科底莫圣老方济各忏悔录》的书。例如，一个人向我揭露了一个严重的罪行。我看着书。上面写着：「十八年没有受圣餐。」那时我还没有经验。我根据规则为他们安排了处罚，而书上所写的对我来说就是法律。随着时间的推移，人们开始前来第二年。他们来自不同的地方，来自不同的村庄，来自遥远的地方，也来自近的地方。但当我问他们：「你多久没有忏悔了？」他们回答我：「哦，去年我来你这里忏悔了。」—— 我对你说什么了？
  - type: paragraph
    text:
      ru: '— Ты сказал мне делать по сто поклонов каждый вечер. — Ты делал их? – Нет. — А почему? — А потому что ты мне сказал «не причащаться восемнадцать лет». Я подумал, что если уж я все равно погиб и осужден на муки, то какой смысл все это выполнять. И не стал ничего делать. Понимаете? Потом приходит другой. То же самое. Тогда я подумал: «Что я здесь делаю?» И стал мудрее. Духовник имеет власть вязать и решить. Я помню наизусть правило Василия Великого. На него я положился и изменил тактику исповеди. А правило гласит: Приявший власть разрешати и связывати, не будет достоин осуждения, когда, видя крайне усердное исповедание согрешившего, соделается милостивее, и сократит епитимию. Поелику повествования Священного Писания показуют нам, яко с большим подвигом исповедающиеся скорее получают Божие милосердие. Тогда я стал побуждать людей читать Священное Писание, каноны святым, молитвочки, делать поклоны, – рассказал старец Порфирий. – Так они стали постепенно воцерковляться. Их сердца смягчились, они сами захотели поститься, подвизаться и желали познать Христа. Я одно понял, что, когда кто-либо познает Христа, возлюбит Его и будет возлюблен Им, тогда все становится прекрасным, святым, радостным и легким.'
      cn: — 你吩咐我每天要做一百个鞠躬。 — 你做了吗？ — 没有。 — 为什么？ — 因为你告诉我十八年不要受圣餐。我想既然我早晚都要被审判，受苦，那么还有什么必要去做这些呢。明白了吗？ — 然后又来了一个人，也是这样。于是我想：「我在这里做什么？」我变得聪明了。神父有权力捆绑和解开。我记得瓦西里大帝的教义。我依靠它改变了忏悔的策略。教义说：接受权柄的人有权决定赦免和捆绑，当他们看到一个极其虔诚的忏悔者时，会变得仁慈，减轻罪责。因为圣经的记载显示，那些极其虔诚地忏悔的人，往往能得到上帝的仁慈。于是我就开始鼓励人们读圣经，读圣人的教义，读祈祷文，做鞠躬，—— 老方济各说。—— 这样他们逐渐被教会化。他们的内心变得柔软，他们自己也想要禁食，修行，渴望认识基督。我明白了一件事，那就是，当有人认识了基督，就会爱他，也会被他所爱，那么一切都会变得美好、圣洁、快乐和轻松。
- type: heading1
  text:
    ru: «Давай-ка освятим воду!»
    cn: 让我们来圣化水吧！
  children:
  - type: paragraph
    text:
      ru: 'На некоторое время я был направлен в одну деревню на Эвбее. Из многих случаев расскажу вам один. Однажды в церковь, где я служил, приезжает верхом на осле одна женщина. Увидев меня, она спешилась, подошла ко мне и говорит: — Батюшка, у меня сын болеет. — Что с ним? — У него пропал голос. — Давно? — Да. Он совсем не говорит. Юноше было лет восемнадцать. Тогда я беру епитрахиль и иду с ней в деревню. Пришли к ней в дом. Я увидел юношу, который и вправду не говорил. Я обращаюсь к ней: — Давай освятим воду. Она поставила стул, на него — чашку с водой, постелила полотенце. Я начал читать. Юноша молчит. Закончив освящение, я начал кропить при пении Спаси Господи, люди Твоя... Когда я ударил его по лбу крестом и базиликом, он говорит мне: — Спасибо большое! Потом этот юноша меня сильно полюбил. Когда он впоследствии крестил своего ребенка, назвал его Порфирием. Приходит ко мне и говорит: — Я дал ему твое имя. Говорю ему: — А меня ты спросил? — Я, — отвечает, — люблю тебя и захотел дать ему твое имя. Послушайте рассказ и о другом подобном случае. Это также произошло на Эвбее. Однажды пришла ко мне женщина со своей дочерью. Дочь была немая. Мать жалуется мне: — Батюшка, у меня большое горе. Дочь вот уже как месяц не говорит. Я ее спрашиваю: — Как это случилось? — Мы оставили козу привязанной около реки. Там много кустов ежевики. Поздно вечером дочь пошла забирать ее оттуда. Когда вернулась домой, была уже немой. Я пришел к ней в дом и совершил освящение воды. Мать к тому же была еще и попадьей. Я спрашиваю ее: — Чья ты матушка? — Я жена священника из... — А, отца Христоса? — Да, батюшка. Я прочитал молитвы на освящение, и поповна стала здоровой. Конечно, по благодати'
      cn: 有一次，我被派往爱奥尼亚的一个村庄。从许多经历中，我将为您讲述一个。有一天，一位妇女骑着驴来到教堂，看到我后，她下驴，走到我面前说：「父啊，我的儿子生病了。」「他怎么了？」我问。「他失去了声音。」「多久了？」「已经很久了。他几乎不说话了。」他那时十八岁。于是，我拿起圣带，和她一起去了村庄。我们来到她的家。我看到那个男孩，他确实没有说话。我转向她：「让我们为水圣化吧。」她摆好凳子，凳子上放着盛水的杯子，铺上一条毛巾。我开始诵经。男孩沉默不语。圣化完成后，我开始用圣歌祝福：「主啊，求祢保佑，祢的百姓……」当我用十字架和基利斯都棒敲打他的额头时，他说：「非常感谢！」后来，这个男孩深深地爱上了我。当他后来为自己的孩子施洗时，他叫孩子的名字为保尔。他来见我，说：「我给你取了这个名字。」我说：「你问过我吗？」「我问过，」他回答说，「我非常爱你，所以我想给孩子取你的名字。」请听另一个类似的故事。这同样发生在爱奥尼亚。有一天，一位妇女带着她的女儿来到我这里。女孩是哑巴。母亲向我诉苦：「父啊，我非常痛苦。女儿已经一个月不说话了。」我问她：「这是怎么回事？」「我们把母羊拴在河边，那里有很多覆盆子丛。晚上，女儿去那里取羊。回来后，她就哑巴了。」我来到她家，为水进行了圣化。母亲也是神父。我问她：「你是谁的母亲？」「我是某某神父的妻子。」「哦，是主的神父？」「是的，父啊。」我诵读了祝福圣水的祷文，神父的母亲康复了。当然，这是出于圣神的恩典。
  - type: paragraph
    text:
      ru: Божией.
      cn: 上帝的
- type: heading1
  text:
    ru: И вот, я отправился в город Вафья, острова Евбея, в монастырь Святителя Николая
    cn: 于是，我前往了位于欧拜亚岛的瓦夫雅城，以及圣尼古拉修道院。
  children:
  - type: paragraph
    text:
      ru: 'После нескольких лет на Эвбее я стал искать другое место для сосредоточенного уединения, как гонимая птичка, которая желает при помощи умной молитвы достичь объятий Божиих. Я был один-одинешенек. Поехал я в местечко Вафья на Эвбее, в монастырь Святителя Николая, и пробыл там десять дней. Там были заброшенные келий, в которых жили крысы. И что же приключилось? Два дня была большая буря и шторм на море. Дождь лил без остановки. Он стучал по стенам, стеклам так, как будто это был град. Ветер в бешенстве рвал ветви платана, я слышал, как они шумели. Светопреставление в полной пустыне! Ревели все стихии, А я — в церквушке Святителя Николая, бедной, расписанной фресками, намоленной за многие годы до меня верующими душами, которых я видел и ощущал, как они склонялись пред святыми и открывали свои сердца. Там, в пустыне, я был похож на птичку небесную, гонимую холодным северным ветром. Представьте, что бы делала птичка среди такой бури? Разве не искала бы она себе какое-нибудь прибежище, гнездо или пещеру? Также поступил и я среди шума бури, напуганный стихиями. Прибежал найти прибежище, прибежал укрыться в объятиях моего Небесного Отца. Я ощущал теплую заботу Христову, свое единение с Богом. В Божественной благодати я чувствовал великую радость, веселие и успокоение. Буря и гроза этого мира были мне безразличны. Душа моя искала чего-то более высокого, более совершенного. Я ощущал себя в безопасности, утешенным и упокоенным. Это были золотые дни. Я использовал во благо страшное ненастье. Так мыслить мы должны всегда. Так мы должны переносить трудности и несчастья. Все это мы должны почитать благоприятным моментом для молитвы, для приближения к Богу. Это тайна: человек Божий все переведет в молитву. И апостол Павел именно это имеет в виду, когда говорит: «Радуюсь в страданиях моих» (Кол. 1:24), — во всех скорбях, которые приключились. Так приходит освящение, чего да сподобит нас Бог. Я этого очень прошу в своих молитвах. В Вафье, в монастыре Святителя Николая, я прожил достаточно долго, целых три года. Уехал оттуда перед самой войной с Италией'
      cn: 在几段在伊庇鲁斯之后，我开始寻找一个更安静的地方来集中修行，就像一只被驱赶的鸟儿，渴望通过智慧的祈祷找到上帝的怀抱。我独自一人。我前往伊庇鲁斯的瓦夫耶，前往圣尼古拉修道院，在那里待了十天。那里有一些废弃的修道院，里面住着老鼠。发生了什么？两天里，海上刮起了大风和暴风雨。雨一直不停地下着。雨水敲打着墙壁和窗户，就像冰雹一样。风狂怒地撕扯着银杏树的枝条，我听到它们在呼啸。全然的光景蒙蔽！风和大自然的咆哮！而我，却在圣尼古拉修道院的小教堂里，那座破旧的、用多年以前的信徒的灵魂祈祷过的壁画装饰着的小教堂里。我就像一只从北方寒风中被驱赶的天上的小鸟。想象一下，如果一只小鸟在这样的暴风雨中会做什么？它不会不找一个避风的地方、一个巢穴或一个洞穴吗？我也是在暴风雨中感到惊慌失措，四处寻找避难所。我来到这里，找到庇护，找到上帝的怀抱。我感受到基督的温暖关怀，感受到自己与上帝的合一。在神圣的恩典中，我感到极大的喜悦、欢乐和安宁。这世界的大风和雷雨对我来说无关紧要。我的心灵在寻找更高尚、更完美的东西。我感到自己是安全的、被安慰的、得到安宁的。这是黄金时期。我利用可怕的暴风雨来为善。我们必须这样思考。我们必须承受困难和不幸。这一切都是我们祈祷和接近上帝的良机。这是秘密：上帝的儿女能把一切都转化为祈祷。这是使徒保罗在说：「我在一切事上都满了患难」（腓立比书 1:24），——在所有我经历的痛苦中。这样，圣化就降临了，愿上帝赐予我们这样的恩典。我在瓦夫耶，圣尼古拉修道院，待了足够长的时间，整整三年。在战争爆发前，我离开了那里。
- type: heading1
  text:
    ru: Поликлиника города Афины (1940—1973)
    cn: 雅典市立医院（1940—1973）
  children:
  - type: paragraph
    text:
      ru: 'Там я прожил тридцать три года. Годы благословенные, годы, отданные больным и страждущим. Т ам я прожил тридцать три года, которые пролетели как один день Как только объявили войну, я прибыл в Афины. Я был назначен священником в церкви Святого Герасима при Афинской поликлинике, как раз когда началась война 1940 года. У меня было огромное желание трудиться в каком-нибудь учреждении. Бог исполнил это желание, и я, к великой моей радости, был назначен в часовню Афинской поликлиники. Поскольку я привык всегда рассказывать что-либо из своей жизни так, как я это пережил и прочувствовал, то послушайте эту историю с самого начала. Однажды, когда я был в скиту Кавсокаливии, то услышал в главном соборе чтение толкования Никифора Феотокиса на воскресное Евангелие. Феотока говорил там о том, какое великое добро может сделать человек, когда утешает страдающие души людей, которые болеют раком, проказой, туберкулезом. Услышав это, я пришел в умиление. Меня посетила ревность, потому что чтец читал очень живо, а я всегда воодушевлялся от чего бы то ни было. И начал я мечтать, что мог бы выучиться, научиться говорить и пойти в какое-нибудь учреждение! В больницу для прокаженных, санаторий для туберкулезников... Примерно так я думал. И когда я чего-то желал, то хотел это пережить в действительности. Сколько раз мне ни приходила ревность удалиться в пуcтыню, я, находясь на прежнем месте, жил уже как в пустыне. Все это было тщетой, суетой, но я этим жил. То есть я ощущал, что будто бы нахожусь там, наверху, на Кармиле, или в Керасье, или в скиту святого Василия — это самое пустынное место на Афоне. Я ощущал, что я будто бы уже пустынник, и говорил: «Вот то-то я буду читать, так буду зажигать свой светильник, так ночью буду творить Иисусову молитву, буду делать столько-то поклонов, буду есть сухари и траву». И моя мечта как бы уже сбывалась. Суета! Но я удовлетворялся этим, а потом это проходило. И в часы слабости, когда, как правило, человек принимает не очень-то хорошие помыслы, я думал о таких вещах, которых сильно желала и которыми жила моя душа. Так я мысленно пережил и тогда: поехал на остров, где были прокаженные, говорил с ними, служил там и ухаживал за ними, помогал им, особенно тем, кто был наиболее беспомощным. Я жил с ними лишь в фантазии. Потом я позабыл об этом. Но случилось так, что я заболел, и старцы три раза посылали меня в мир на лечение. Однако я не вылечился, и тогда, в конце концов, они дали мне свое благословение жить вне Афона, как я вам уже рассказывал, там, где есть молоко, яйца и мясо — все то, что необходимо было при моей болезни. По этой причине я приехал в монастырь Святого Харалампия на Эвбее и прожил там около пятнадцати лет.'
      cn: 那里我度过了三十三年。美好的年华，献给病痛和受苦的人们。在那里我度过了三十三年，仿佛只有一天。当战争爆发时，我来到雅典。我被任命为雅典公立医院圣加拉西亚教堂的神父，那时正是1940年战争爆发的时候。我总是习惯于从我亲身经历和感受中讲述一切，所以让我从头开始讲述这个故事。有一次，当我还在喀索卡利维亚隐修院时，我在主教堂听到了尼基法尔·费奥托基斯对主日福音的注释。费奥托基斯在那里谈到，当一个人安慰那些患有癌症、麻风病和肺结核的病人时，他可以做多么伟大的善行。听到这些话，我深受感动。我感到嫉妒，因为我总是被那些人所激励，而费奥托基斯的讲道非常生动。于是，我开始梦想自己能学习，学会说话，然后去某个机构工作！去麻风病院、肺结核疗养院……我就是这样想的。每当我想起什么时，我总是希望亲身经历。无论我多么渴望遁入荒漠，我都像在荒漠中一样生活着。这都是徒劳，都是虚幻，但我却沉浸其中。也就是说，我感觉仿佛自己就在那里，就像在卡米尔、克拉斯耶或圣瓦西里隐修院一样，这是阿波罗尼亚山上最荒凉的地方。我感觉仿佛自己已经是一个隐修者，我说：「好吧，我将在那里诵读，点燃我的灯盏，夜晚将我献给耶稣的祈祷，我将做那么多次祈祷，吃干面包和草。」我的梦想似乎已经实现了。虚幻！但我满足于这一切，然后它又消失了。在那些精神疲惫的时候，当人们通常会想到一些不那么好的念头时，我就会想到那些我内心渴望的东西。于是，我内心深处渴望的东西在我脑海中浮现：我想象自己去了一个有麻风病人生活的岛屿，与他们交谈，为他们服务，帮助最无助的人。我与他们生活在我想象中。然后我忘记了这一切。然而，后来我生病了，长老三次派我到人间去治病。然而我没有痊愈，于是他们最终给了我离开阿波罗尼亚山的许可，像我之前告诉你的那样，在那里有牛奶、鸡蛋和肉——这些都是我生病时需要的东西。因此，我去了埃维亚岛上的圣哈拉马教堂隐修院，在那里度过了大约十五年。
  - type: paragraph
    text:
      ru: 'Потом меня снова начали переполнять идеи, которые посещали меня на Святой Горе, то есть поехать трудиться в какой-нибудь санаторий. И я надумал уехать в Пендели, в санаторий Пендели, в котором в то время было много больных туберкулезом. Мой знакомый сказал, что там нужен иерей. Я приехал к заведующему санаторием, а он мне сказал: — Геронда, нам прислали уже священника, прислали. Я рассказал ему о своем желании, и он мне ответил: — Да, и у меня было такое желание, и Бог привел меня сюда! Потом я приехал в Афины. Там я нашел святогорца, служившего в Спатах, в Ставросе. Говорю ему: — Отец Матфей, у меня есть такое желание. Что мне делать? — А вот послушай, что я тебе скажу. Меня хотели поставить в Афинскую поликлинику, но я отказался. Я предпочел быть здесь, в Ставросе. Хочешь, я поговорю с господином Амилком Аливизатом, чтобы он взял тебя туда? Я отвечаю: — Пойдем посмотрим. Пошел, посмотрел. Ого! Столько народу, такой шум... — Отец Матфей, — говорю ему, — я здесь не смогу. — Почему не сможешь? — спрашивает он. Тогда мы пошли к господину Амнлку Аливизату и поговорили с ним. Отец Матфей ушел. Господин профессор Аливизат велел мне прийти на следующий день.'
      cn: 然后我又开始涌动起在圣山时涌动过的念头，那就是去某个疗养院工作。于是我想去 Pendeli 疗养院，那里的病人大多是肺结核患者。我的一个朋友告诉我，那里需要一名神父。我来到疗养院的负责人那里，他告诉我：「赫尔农德，我们已经派来了神父。」我将我的想法告诉了他，他回答说：「是的，我也曾有过这样的想法，上帝让我来到这里！」然后我去了雅典。在那里我找到了一位圣山的修士，他在斯巴达的斯塔菲斯教堂服务。我说：「马太修士，我有一个想法。我该怎么办？」他回答说：「你听我说。」他们想让我去雅典的诊所，但我拒绝了。我更愿意留在斯塔菲斯。你想不想让我去见阿米尔库·阿利维扎特教授，让他把我安排到那里？我说：「我们去看看。」我们去了。哇！这么多人，这么吵闹……「马太修士，」我说，「我在这里待不下去。」「为什么？」他问。于是我们去了阿米尔库·阿利维扎特教授那里，和他谈了谈。马太修士走了。阿米尔库·阿利维扎特教授教授让我第二天再来。
