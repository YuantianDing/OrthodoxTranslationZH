title:
  ru: Житие и слова
  cn: 被爱所伤
authors:
- ru: Преподобный Порфирий Кавсокаливит
  cn: 圣波尔费里·卡夫索卡利维特
document:
- type: heading4
  text:
    ru: Введение
    cn: 引言
  children:
  - type: paragraph
    text:
      ru: 'Содержание Предисловие Автобиография старца – уникальный текст, не вписывающийся ни в какие каноны. Это живое непосредственное изложение покоряет своей простотой, но и пугает своей живостью, к которой не привыкли в России. Именно простота является свидетельством подлинности. Поистине, это текст, который мгновенно покоряет самые твердые сердца! Автобиография старца на русском языке уже была издана не так давно… Существует русский перевод: «Старец Порфирий Кавсокаливит. Житие и слова». Переводчик – мирской человек и, естественно, он выражает свое мечтательное видение Афона. Автор книги «Старец Порфирий Кавсокаливит. Житие и слова» не понимает некоторых реалий, о которых пишет старец. Впрочем и его перевод весьма интересен. Например, Старец Порфирий Кавсокаливит пишет: — Жизнь на Святой Горе — это жизнь в непрестанном бдении по четкам… А автор книги «Старец Порфирий Кавсокаливит. Житие и слова» переводит тему на понятие «…всенощного бдения в храме…». Нет. Речь идет о бдении по четкам в каливах. Да и сам старец далее поясняет: «…На Святой Горе встают в два часа. В тот час я ощущал благоговейный трепет. Молитва сотрясала местность, сотрясала духовный мир. Вот какова любовь ко Христу….» Ведь в Кавсокаливии не служат суточный круг, в скитах другой устав: служба в храме правится всего лишь раз в неделю – в субботу ночью… Тем не менее, в скиту каждая ночь – всенощное бдение. Монахи скита садятся в стасидии в храме каждой кельи или в своей келье и по-очереди молятся по четкам... Паломники, к сожалению, этого увидеть не могут. Видите, одного желания правильно перевести мало. Нужно определенное знакомство с реальной жизнью. Впрочем, мы понимаем, что для русского сознания, а тем более для приходского батюшки, подобные вещи выглядят странно, ведь в России не заменяют четками церковные службы.Наконец, стиль перевода, бесспорно, слишком адаптирован к русскому менталитету. В этом главная ошибка… Это убивает живость, сеет сомнение в подлинности.Например, возьмем наугад отрывок из старого перевода (с 57): Я слушал как соловейчик заливается, как разрываетс от пения. Он так заливается, что от трелей надувалась его гортань. Эта малюсенькая пташка отводила назад свои крылья, чтобы иметь силы издавать такие сладчайшие звуки, петь таким прекрасным голосом, так надувать свою гортань. Была бы у меня чашечка с водою, чтобы он прилетел и мог утолил свою жажду! Правильный перевод: И вот, я стоял и слушал, как соловушка щебечет, как он просто разрывается от любви! От пения надувалось его горлышко и, как мы говорим, он, поистине, выбивался из сил (мальясе)! Эта маленькая птичка расправляла сзади свои крылышки (на кани ката писо та фтера ту), чтобы набраться силы, и издавала сладчайшую мелодию! Это был прекрасный звук. И горлышко птичье так надувалось... По – по — по! Ах! — Был бы у меня стаканчик воды, чтобы он подлетел и утолил бы свою жажду! Разница заметна. Тем не менее, можно понять совершенное несоответствие стиля в части диалогов и оправдать тем, что автор практически не знаком с живой Традицией Афона. Многие ошибки можно простить только за то, что автор дает кальку текста. Это правильно. Да и текст очень простой…Впрочем, все переводчики делают много ошибок, просто это не принято обсуждать. И мы не будем. Но мы совершенно не можем понять, например, зачем переводчик переименовывал главы? Это чем можно оправдать? Например, главу «Через два-три года я принял великую схиму» он переименовал в «Я хотел быть наедине с одним Богом». И т.д. Ведь такое небрежное отношение к тексту приводит к небрежности и в суждениях. Не вызывает сомнения, что именно эта небрежность провоцирует некоторых русских профессоров, не знающих ни греческого - ни афонской жизни, высказываться против старца. Поэтому давайте начнем с уважительного бережного отношения к рукописи! Мы считаем, что комментировать этот прекрасный текст любым образом пока преждевременно. Старец Порфирий Кавсокаливит – необычен как человек и его путь уникален. Путь старца слишком яркий и неповторимый. Должно пройти время, лишь тогда образ старца предстанет во всем величии… Пришлось местами сделать новый перевод, взяв за основу старый. Тем не менее, мы благодарны переводчику за старый перевод, он весьма пригодился. Надеемся, новый перевод дополнит старый, дойдет до сердца многих читателей, и не заденет самолюбие тех, кто хочет ухватить умом и понять все сразу...'
      cn: '内容 前言 老人自传 – 一位独特文本，不隶属于任何教规。


        这是一篇直接而鲜活的阐述，以其简朴吸引人，但其鲜活又让人感到畏惧，而这种鲜活在俄罗斯并不常见。


        正是简朴是真道的见证。


        的确，这文本能瞬间使最坚定的心灵为之动容！


        老父的自传最近已经用中文出版了……


        长老帕福里耶喀丝科拉利维特。生平与言语


        译者是一位世俗之人，当然，他表达了自己对阿夫诺的梦幻式愿景。


        《老父波菲里耶喀布斯卡利维特。生平与言语》这本书的作者未能理解书中提到的一些现实情况。


        然而他的翻译也颇为有趣。


        例如，长老费奥多西·喀夫拉利维茨写道：——圣山的生活就是以念珠为伴的不间断警醒的生活……


        基督之爱猎人：关于长老帕福里耶喀斯科瓦利维的生平与言语


        不。说的是在卡利瓦中按四钟经祈祷。而且老者自己后面也解释道：「……在圣山上，在两点钟的时候。」


        那时我感到敬畏的震动。祈祷震撼了大地，震撼了精神世界。


        基督之爱……在卡夫斯卡利维亚没有每日的轮班，在修道院里则有其他的规矩：礼拜在教堂里主导


        每周仅仅一次——在周六夜晚……然而，在避难所里，每晚都有夜祷守夜。


        修士们在每个小屋的祈祷室或自己的小屋轮流念经……


        朝圣者，不幸的是，无法看到这一点。你看，正确地翻译一个愿望并不多。


        需要一定的现实生活经验。


        然而，我们明白，对于俄罗斯的意识，尤其是对于牧师这样的普通信徒来说，这样的事情看起来很奇怪，


        在俄罗斯，祈祷简朴并不取代教堂的圣礼。最终，翻译风格无疑过于适应了俄罗斯的思维方式。


        在这一点上，这是主要的错误……


        我聆听简朴，播撒对真实性的怀疑。例如，拿任意一段旧译（如57）：


        溪流的溪莺欢快地歌唱，歌声如此嘹亮以至于它的喉咙都鼓了起来。


        这只小小的鸟儿将翅膀往后收，以便有足够的力量发出如此甜蜜的声音，歌唱如此美丽的话语。


        用简朴的声音，吹起你的喉咙。如果我有一杯水，他就能飞来，可以解他的渴！


        我站立聆听，听那知更鸟歌唱，听它如此因爱而颤抖！


        他喉结鼓动，正如我们所说，他真是累坏了！


        这只小鸟能够在身后展开它的翅膀（在它身后展开翅膀），以便积蓄力量，并发出叫声。


        最简单的旋律！这声音是多么美妙啊。而鸟儿的喉咙如此鼓胀……噗——噗——噗！啊！


        如果有杯水，他就能飞过来解解渴了！差别真大。


        然而，可以理解对话部分的风格与整体不完全一致，并且可以原谅这一点，因为作者几乎没有任何对话部分。


        与活的阿索传统相熟。许多错误只有当作者提供的是原文时才能原谅。这是正确的。


        但是文本也很简单……不过所有的译者都会犯很多错误，只是这不被提倡讨论。我们也不会。


        但我们也完全无法理解，例如，为什么翻译者还要改名章？这可以怎么解释呢？


        我想要与唯一的上帝独处


        而且，如此轻视对待文本，会导致在判断上也变得轻率。


        这不是有疑虑的事情，但确实这种疏忽会激怒一些不懂希腊文的俄罗斯教授，


        并且对于阿索斯山生活的修士，我们应该避免公开批评长老。因此，让我们从尊敬和谨慎对待手稿开始吧！


        我们认为，目前对这段美丽文字进行任何形式的评论还为时过早。


        长老帕福里耶喀夫提斯卡利维特——作为一个人他非常独特，他的道路也独一无二。长老的道路太过耀眼且不可复制。


        应当经过时间，唯有那时老者形象才能展现其全部伟大……


        不得不在某些地方重新翻译，以老版本为基础。


        然而，我们仍感谢译者提供了旧版的翻译，它非常有用。


        我们希望新的翻译能补充旧的，触动许多读者的心，而且不会伤害那些想要抓住自己自尊心的人。


        用智慧明白一切'
- type: heading1
  text:
    ru: Я происхожу из деревни Святой Иоанн
    cn: 我出身于神圣若翰村
  children:
  - type: paragraph
    text:
      ru: 'Порфирий Кавсокаливит (Баирактарис) Автобиография Это самое полное жизнеописание старца Я происхожу из деревни Святой Иоанн (Воспоминания старца Порфирия) Святой Иоанн – деревня на Эвбее. Оттуда я происхожу. Мои родители были бедняками, поэтому мой отец покинул деревню и уехал в Америку. Там он работал простым рабочим на строительстве Панамского канала. Мы, крестьянские дети, трудились с малых лет: поливали сад, огород, ухаживали за скотиной, бегали повсюду, куда нас посылали взрослые. Я с малого возраста пас животных в горах. Я был наивным и застенчивым. В школу я походил лишь в первый класс и почти ничему не научился, потому что учитель болел. Там, где я сторожил овец, я по слогам прочитал житие святого Иоанна Каливита. Тогда мной овладело пламенное желание уйти из мира и стать монахом. Хотя я никогда не видел ни монаха, ни монастыря, не знал ничего. Когда мне исполнилось семь лет, мать послала меня в Халкиду на работу в один магазин. В то время в магазинах продавали все: скобяные изделия, ключи, винты, замки, веревки, а также сахар, рис, кофе, перец и все то, что сейчас есть в лавке бакалейщика. Магазин был большой. Там уже работали два паренька. Когда я пришел, все стали мною распоряжаться, и я делал то, что мне говорили. Все отдавали мне приказания, и я носился повсюду. Между тем ребята устроились поливать цветы хозяйки на балконах. Они ходили по очереди через день. Когда'
      cn: '柏瑞菲里·喀瓦斯卡利维茨自传 我来自圣约翰村（巴伊拉卡提斯） 圣约翰村位于伊奥尼亚群岛的埃维亚岛。我来自那里。我的父母是穷人，因此我父亲离开了村庄，去了美国。他在巴拿马运河的建设工地做苦力。我们这些农家的孩子从小就劳动：浇灌花园、菜园，照顾牲畜，大人吩咐我们去哪里就去哪里。我从小就放牧山羊。我天真而害羞。我在一年级上学，几乎什么也没学到，因为老师生病了。我在看管羊群时，我拼读了圣约翰喀瓦斯卡利维茨的生平。那时，我内心充满了渴望离开世界，成为一名僧侣。尽管我从未见过僧侣，从未见过修道院，一无所知。


        当我七岁那年，母亲派我去哈里卡德工作，在一家商店里。当时商店里出售各种物品：五金制品、钥匙、螺栓、锁、绳索，以及糖、大米、咖啡、胡椒等现在杂货店有的商品。商店很大。里面已经有两个男孩在工作。我一来，他们就指挥我做事，我四处奔跑。与此同时，那两个男孩轮流去给店主家的阳台上浇花。他们每隔一天轮换一次。当'
  - type: paragraph
    text:
      ru: 'пришел я, они навалили на меня все — и уборку, и цветы. Однако я не подозревал ничего плохого. Все исполнял и ходил туда, куда меня посылали. Однажды, подметая магазин, я заметил на полу, около собранной мною кучи мусора, рассыпанный кофе. Там было штук пятнадцать немолотых зерен. Я наклонился, собрал их на ладошку и пошел, чтобы бросить их в мешок с кофе. Хозяин находился в своем кабинете, стены которого были из стекла, и увидел это. Он позвал меня: — Ангел, — так меня, маленького, все называли. — Поди сюда! Я подошел к нему. — Что у тебя в руке? — Кофе, — говорю. — Я нашел зерна на полу и собрал их. Он стал звать: — Тасос, Аристос, Яннис, Иоргос! ! ! Один был на складе, другой еще где-то. Но так как хозяин кричал, то пришли все. Тогда хозяин открыл мою руку, — Вы видите? — спросил их. — Что это? — Зерна кофе, — отвечают. — Где ты их нашел, Ангел? — Они были разбросаны по полу, — говорю я, — я собрал их и пошел бросить в мешок с кофе. Хозяин прочитал им целое нравоучение. Что там происходило! Там было мотовство и транжирство. Разбрасывали все то тут, то там... — С сегодняшнего дня вы установите очередь и на поливку цветов, и на все другое, — сказал хозяин. — Одну неделю — Аристос, другую — Тасос, третью — Ангел. Хозяева любили меня и хорошо ко мне относились. – вспоминал старец Порфирий. – Они приглашали меня наверх, к себе домой, чтобы я пел им те тропари, которые знал. Они по своей доброте часто брали меня туда. Они оценили тот мой поступок. Через два года я уехал в Ширей; чтобы работать в магазине одного из своих родственников. Магазин находился на холме, на улице Цамаду. Это была бакалея вместе с таверной. Каждый день туда приходило много народу за покупками, и часто клиенты оставались, чтобы перекусить и выпить в таверне. Ночевал я наверху, в мансарде.'
      cn: 我来了，他们把我塞满了——打扫和鲜花。然而，我并没有料到会有不好的事情发生。我全都做了，然后去到他们派我去的地方。有一天，我在打扫商店时，发现地上的垃圾堆里散落着一些咖啡豆。大约有十五颗未磨碎的豆子。我弯下腰，把它们捡到掌心，然后去丢进咖啡袋里。店主在自己的办公室里，办公室的墙壁是用玻璃制成的，他看到了这一幕。他喊道：「天使，」他这么叫我，因为我很小的时候就叫他「天使」。「过来！」我走过去。「你手里拿着什么？」我回答说：「咖啡。」「我在地上捡到的咖啡豆，」我说。「你从哪里找到的？」他喊道：「塔索斯、亚里士多德、扬尼斯、约瑟普！」「他们都在仓库里，」他喊道，「或者在别的什么地方。不过，既然你喊，他们都会来的。」于是，店主打开我的手，问道：「你们看见了吗？」「看见了，」他们回答。「这是什么？」「咖啡豆，」我说。「你从哪里找到的？」「它们散落在地上，」我说，「我捡起来，然后把它们丢进咖啡袋里。」店主给他们讲了一番道理。那情景真是令人震惊。那里有浪费和放纵。他们把东西乱扔，一会儿这里，一会儿那里……「从今天开始，你们要排好队，轮流负责浇花和所有其他的事情，」店主说。「一个星期塔索斯，一个星期亚里士多德，一个星期天使。」店主很喜欢我，对我很好。老修道士帕福里乌斯回忆说：「他们邀请我去他们家，让我唱他们知道的赞美诗。他们因为我的好行为经常邀请我去他们家。他们欣赏我的行为。两年后，我去了西里亚；为了在一位亲戚的商店里工作。商店位于塔马杜街的山顶上，是一家杂货店兼酒吧。每天都有很多人去购物，有时顾客会留下来在酒吧里吃点东西，喝点酒。我住在上面的阁楼里。
- type: heading1
  text:
    ru: В недра души моей я погрузил желание стать пустынником
    cn: 我在我的心灵深处埋下了成为隐修士的愿望
  children:
  - type: paragraph
    text:
      ru: 'В недра души моей я погрузил желание стать пустынником (Воспоминания старца Порфирия). Однажды в лавку зашли два старичка. Они попросили у меня две сардинки и половину ока 2 вина. Я им сразу принес. Один старик говорит другому: — Где найдешь то вино, которое я пил на Святой Горе! Такого вина я не находил нигде. — Ты был на Святой Горе? — спрашивает другой. — Да, однажды уехал со своей родины, с острова Митилини, из Каллони, и приехал на Святую Гору. Там мы и пили моноксилитское вино. Что это было за вино! Тот спрашивает его снова: — Ты уезжал туда, чтобы подвизаться? — Да, хотел стать монахом, но не смог, не выдержал. Как я раскаивался потом в том, что не остался там! Я слушал их разговор внимательно, потому что задолго до них заходили какие-то монахи и раздавали брошюрки. В одной из них было написано о жизни святого Иоанна Каливита, о котором я читал по слогам, когда пас овец в своей деревне, как я уже вам говорил. Его житие я прочитал снова на мансарде при свете карманного фонарика, прочитал с трудом, потому что был почти неграмотным. Жизнь святого так воодушевила меня, что я захотел подражать ему. Но о Святой Горе я не знал ничего. Между тем старичок продолжал: — Я хотел подвизаться и ушел. Как хорошо было там! Я видел подвижников, пустынников, святых людей, которые старались стяжать любовь к Богу, подвизались в пустыне в посте, злостраданиях и молитвах. Но я оставил все это и вернулся в мир, где впутался в тысячу мучений. Я всегда вспоминаю о том и жалею, что не остался там, а впал здесь в миру в такие муки, связанные с заботой о семье, детях, в такую суету, страдания, что трудности жизни поставили меня на колени. И я постоянно вспоминаю то время... Старики вскоре ушли, но мои мысли остались там, на Святой Горе, о которой рассказал один из них. С того момента мною овладело горячее желание уехать туда. Меня не оставляла мысль, что я смог бы осуществить свою мечту — подражать святому Иоанну Каливиту. Старец Порфирий вспоминал: Через два дня старик пришел вновь. Он жил по соседству. Я подхожу к нему и втайне от других спрашиваю: — Расскажи мне, кир Антоний, как хорошо там, вверху, на Святой Горе? — А-а, ты все слышал тогда? Нет. Сейчас я не могу тебе ничего рассказать…'
      cn: 在我的心灵深处，我埋下了成为隐修士的愿望（圣老楞佐的回忆录）。有一天，两个老者走进了我的店铺。他们向我要了两块萨尔多尼和半瓶酒。我立刻给他们拿来了。一个老者对另一个说：「你找到那种在圣山喝的葡萄酒吗？那种葡萄酒我再也没喝到了。」「你去过圣山吗？」另一个问道。「是的，我曾离开我的故乡，从米利迪尼岛的卡隆，前往圣山。在那里，我们喝的是莫诺克西利特的葡萄酒。那种酒是多么美妙啊！你又问了我一次：「你去那里是为了修行吗？」「是的，我想要成为一名修士，但没能坚持下来，没能经受住考验。我后来后悔极了，没能留在那里！」我认真地听着他们的对话，因为在此之前，一些修士已经来过，分发传单。其中一份传单上写着关于圣约翰·卡利瓦特的生活，我曾在放羊时，用拼音读过关于他的故事，正如我之前告诉过你的。我再次在阁楼的灯下读了他的生平，读得十分艰难，因为我几乎是个文盲。他的生活深深地鼓舞了我，于是我想要模仿他。然而，关于圣山，我一无所知。这时，那位老者继续说道：「我也想修行，于是就离开了。那里的生活多么美好啊！我看到了许多修行者、隐修士和圣人，他们努力追求对上帝的爱，在荒野中过着禁食、苦修和祈祷的生活。但后来，我放弃了这一切，回到了世俗生活，那里充满了千百种苦难。我总是回忆起那段时光，后悔没能留在那里，而是在世俗生活中陷入了种种苦难，包括对家庭和孩子的牵挂，以及生活的忙碌、痛苦，使我在生活中变得如此艰难。我经常回忆起那段时光……老者很快离开了，但我的思绪却停留在了圣山，那是他们提到的地方。从那时起，我内心燃起了强烈的愿望，想要前往那里。我无法忘记那个念头，那就是我能够实现自己的梦想——模仿圣约翰·卡利瓦特。圣老楞佐的回忆录中，老者帕福里乌斯回忆道：两天后，那位老者再次来到。他住在我的隔壁。我走近他，偷偷地问他：「阿纳托利神父，你可知道圣山那边的生活多么美好？」「啊，你当时都听到了吗？」「没有，我现在不能告诉你……」
  - type: paragraph
    text:
      ru: Кир — по-гречески господин, уважительное обращение к старшим. И ничего мне не сказал. Ушел. Я же не мог думать ни о чем другом. В глубине души я решил стать пустынником. Но как? Я не знал, как попасть на Святую Гору. У меня не было денег. Да я и не представлял, что сказать хозяину. Когда кир Антоний снова пришел в лавку, я тайно от других спросил его о Святой Горе, и тогда он рассказал мне все. Но как, однако, я мог бы туда удалиться? Что бы я сказал?
      cn: 基尔——希腊语中的尊称，用来称呼尊长。他什么也没对我说，就走了。我根本无法想别的事情。在心底，我决定成为一名隐修士。但如何做到？我不知道如何才能上圣山。我没有钱。而且，我也不知道该对主人说什么。当基尔·安提奥修斯再次来到店铺时，我偷偷地向他询问圣山的事情，于是他向我讲述了这一切。但，然而，我怎么能离开这里呢？我要对主人说什么？
- type: heading1
  text:
    ru: Охотник за Любовью Христовой
    cn: 基督之爱猎人
  children:
  - type: paragraph
    text:
      ru: 'Охотник за Любовью Христовой (Воспоминания старца Порфирия) Целыми днями я был унылый и задумчивый. Хозяин заметил это, подходит ко мне и спрашивает: — Почему ты такой? Что с тобой происходит? И тогда я вынужден был солгать! – сокрушался старец Порфирий. Я сказал, что узнал от одного моего земляка, когда выходил из лавки за продуктами, что мать моя больна, и я бы хотел поехать повидать ее. Хозяин поверил мне, дал денег на билет, продукты для матери и с сочувствием проводил меня. Я побежал на корабль и отправился на Святую Гору! Моя мечта начала сбываться. Корабль проходил через Халкиду, через Волос, а потом через Салоники. Но когда корабль отошел недалеко от берега, меня охватила печаль. Я хотел достичь своей цели, но боялся и жалел своих родителей, которые, не зная, где я, стали бы беспокоиться. Я не выдержал и, когда корабль пристал к Лимне Эвбейской, спустился с него и на другом корабле вернулся обратно в Пирей. Там я пришел к своим хозяевам и сказал, что мать моя выздоровела. Я продолжал работать, как и прежде. Но не совсем так, как раньше. Я был задумчив, все время молился, ел мало, делал поклоны. От такой жизни я похудел, изменился. — Что с тобой, Ангел, — спрашивали меня, — что с тобой? Мы видим, каким ты стал задумчивым и очень худым, дитя. Мы любим тебя и хотим, чтобы ты был здесь, но, может быть, ты хочешь поехать к родителям? — Да, — говорю я им, — хочу поехать. — Езжай, если хочешь, повидайся с ними и, когда приедешь, найди нам для магазина какого-нибудь хорошего юношу, такого, как ты. Они снова дали мне денег, продуктов, сладостей, какие-то бутылки с ликером «Пиперман», иного чего еще другого. Хозяин привел меня на корабль и купил мне билет до Халкиды. Это был корабль, который шел в Халкиду, затем — Эдипсо, Волос, Салоники, Святая Гора, Дафни. Корабль назывался «Афины». Я поднялся. Корабль отошел от пристани. Была ночь, когда мы отплывали. Шли всю ночь. Пришли в Халкиду. Когда корабль остановился, матросы закричали: — Кто в Халкиду? Кто в Халкиду? Я — молчок, не говорю ничего, притаился в углу и молчу. Корабль отчалил от халкидской пристани. Однако когда мы прибыли в Эдипсо, матросы нашли меня, потому что проверяли билеты.'
      cn: 基督之爱猎人（圣父若望·帕拉修斯的回忆录） 整日我都是郁郁寡欢，心事重重。主人察觉到了，走过来问我：「怎么了？你这是怎么了？」于是，我不得不撒了谎！圣父若望·帕拉修斯哀叹道。我说，我从一个同乡那里听说，我的母亲病了，我想去看望她。主人相信了我，给了我车票、食物给母亲，还满怀同情地送我上路。我立刻登上了轮船，前往圣山！我的梦想开始实现了。轮船经过哈里卡尼纳，经过沃洛斯，然后经过萨洛尼卡。但当轮船离开海岸不远时，我感到一阵忧郁。我想达到我的目标，但又害怕父母，他们不知道我在哪里，可能会担心。我无法忍受，当轮船停靠在莱姆诺斯海湾时，我跳下轮船，乘坐另一艘轮船回到了皮雷亚。在那里，我去找了主人，说我的母亲已经康复了。我继续像以前一样工作。不过，情况并非完全一样。我变得忧郁，经常祈祷，吃得少，鞠躬。由于这样的生活，我消瘦了，也变了模样。「你怎么了，天使？」他们问我，「你怎么了？我们看到你变得忧郁，变得瘦弱，孩子。我们爱你，希望你在这里，但也许你想要去看望父母？」「是的，」我说，「我想去看望他们。」「去吧，如果想的话，见见他们，」他们说，「然后，当你回来时，找一个像你这样的好小伙子给我们商店。」他们再次给了我钱、食物、糖果，还有一些「皮佩曼」酒的瓶子。主人带我登上了轮船，并为我买了一张去哈里卡尼纳的车票。这是一艘驶往哈里卡尼纳，然后是埃迪波斯，沃洛斯，萨洛尼卡，圣山，达菲尼的轮船。轮船叫「雅典娜」。我站了起来。轮船离开了码头。我们启航时是夜晚。我们整夜航行。我们抵达了哈里卡尼纳。当轮船停靠时，水手们喊道：「谁在哈里卡尼纳？」「我」——我一声不吭，躲在角落里，一言不发。轮船离开了哈里卡尼纳的码头。然而，当我们抵达埃迪波斯时，水手们发现了我，因为他们正在检查车票。
  - type: paragraph
    text:
      ru: '— Почему ты не сошел в Халкиде? — спросили меня. — Я спал, — отвечаю. — И что теперь? — спрашивают меня. — Ты должен заплатить. — У меня мало денег, — говорю им. — Ну, ладно, — согласились они. И оставили меня так, без денег. Тогда деньги-то были такие — пятаки да двугривенные. А у меня едва-едва набралась бы одна драхма. Когда в Волосе мы спустились на берег, меня охватила великая тоска. Я все плакал и плакал. Я думал, что навсегда уезжаю из мира, что родители меня потеряют и будут горевать. Думал о своих братьях и сестрах. Мне перехватило дыхание, и я решил вернуться обратно. В Волосе корабль простоял несколько часов и отошел от пристани, дал гудок и взял курс на Салоники. Я остался на причале, потому что хотел вернуться обратно. Ночью я поднялся в горы, плакал и молился. На другой день я нашел корабль, который шел по тому же направлению — на Салоники. Поднялся на него. Но так как деньги у меня закончились и потому не было билета, я спрятался на корме, чтобы меня не согнали на берег. И вот матросы спросили у меня билет. У меня его не было, и они стали ругаться на меня. Я сидел на лавочке по левому борту и смотрел на море. Я произносил один ирмос, которому научил меня отец, церковный певчий. Этот ирмос поют в родительскую субботу. В ирмосе этом сказано: Житейское море воздвизаемое зря напастей бурею, к тихому пристанищу Твоему притек, вопию Ти: возведи от тли живот мой, Многомилостивее. Я говорил: «Боже мой, жизнь — это бурное море, и я, путешественник по этому бурному морю, прошу Тебя, чтобы Божественный Твой промысел управил меня в пристань, где бы безмолвствовала душа моя, в пристань, где есть Ты, Мир». Я произносил эти слова, скорее же тихо-тихо пел и плакал, потому что у меня было глубокое чувство того, что я оставил мир, то есть своих родителей. Да и какое мне было дело до мира, он меня не волновал совершенно. Только родители. Я был маленьким и помнил лишь родителей и скорбел о том, что оставил их. Наступил полдень. Люди обедали на палубе. В то время было так. Сидели семьями. Напротив меня была женщина с мужем и тремя детьми. Я сидел и смотрел на море. В какой-то момент ко мне подходит женщина, потому что пришли матросы и спрашивали мой билет, которого у меня не было: увидев, что я — нищий ребенок, поворачивает меня за плечо и дает мне кусок хлеба, на котором три связки мелкой рыбешки — камсы. Раньше их связывали по три штучки такой травкой, веничной соргой, и поджаривали на сковороде. Рыбешки связывали, пропуская травку через глазки, обваливали в муке и жарили. Не знаю, делаете ли вы так. Я поблагодарил ее: — Спасибо, большое спасибо! Несколько других женщин, которые сидели рядом, похвалили ее: — Браво, очень хорошо! Как ты догадалась? А нам в голову не пришло. Но она, повернувшись к ним, говорит: — На таких детей, на беспризорников, не надо обращать внимания и что-нибудь давать им. Но что же делать? Мы же люди. Я, бедненький, услышав слово «беспризорник», в душе обрадовался, потому что подумал, что я и правда беспризорник. Я стал скитальцем ради любви Христовой и просил: — Христе мой, спаси меня, управи меня! Прибыли в Салоники. Сошли с корабля. Я не знал, куда идти. Пошел в храм Святого Димитрия, приложился. Встал на колени и плакал, прося святого помочь мне доехать и стать пустынником. Это было моей мечтой. Потом я поднялся высоко на холм и пришел к небольшой церковке — часовне. Она была закрыта, но снаружи стояла лавочка. Там я провел всю ночь. Я много плакал, хотел снова вернуться домой, к родителям. Для меня это было искушением. Три раза я возвращался назад. Когда я рыдал, я произносил и слова молебного канона к Богородице, которому меня научил мой отец. «Не презри моление мое, полезно сотвори», — повторял я и плакал. Так и заснул....'
      cn: 为什么你没有在哈基德登陆？——有人问我。——我睡了，——我回答。——那现在呢？——你必须付钱。——我没有多少钱，——我说。——好吧，——他们同意了。然后就让我留在这里，没有钱。那时的钱是五戈比和两戈比。我几乎连一个德拉克马都攒不起来。当我们来到沃洛斯时，我感到极大的忧伤。我一直在哭泣。我想我永远离开这个世界了，父母会失去我，会悲伤。我想起了我的兄弟姐妹。我喘不过气来，我决定回去。在沃洛斯，船停了几个小时，然后离开了码头，发出一声汽笛声，驶向萨洛尼卡。我留在码头上，因为我想要回去。夜晚，我爬上山，哭泣着祈祷。第二天，我找到了一艘同样方向的船——驶向萨洛尼卡。我上了船。但因为没有钱，也没有船票，我躲在船尾，以免被扔到岸上。于是，水手们问我有没有船票。我没有，他们开始对我发脾气。我坐在左舷的长凳上，看着大海。我唱我父亲教会唱诗班教会教我的一个祷词。这个祷词在父母的星期六唱。在这一祷词中说：我们这世上的大海被狂风掀起，来到你宁静的港湾，我呼喊你：拯救我脱离苦难，更仁慈的主啊。我唱着：「主啊，我的生命就像这狂风巨浪的大海，我，一个在大海中航行的旅人，向你祈求，愿你神圣的意旨引导我到达一个宁静的港湾，使我的灵魂在那里得以安息，到你那里去，那里有你，我的世界。」我唱着，低声哭泣，因为我深深地感到，我离开了这个世界，也就是我的父母。至于这个世界，它对我来说已经无关紧要。只有父母。我年纪小，只记得父母，为离开他们而悲伤。正午时分，人们在甲板上吃饭。那时的情况是这样的：人们成家而坐。在我对面坐着一个女人和她的丈夫以及三个孩子。我坐在那里看着大海。在
  - type: paragraph
    text:
      ru: Забыл сказать, что подарки, которые дали мне с собой хозяева, когда я отправлялся якобы домой, я раздал каким-то солдатам на корабле. Раздал шоколадки, бутылки с розовой водой и «Пиперманом» и таким образом разгрузился. Они недоумевали, почему я все это отдаю – ведь я был маленьким, — но взяли. Итак, как я вам уже сказал, я заснул возле часовенки. Проснулся утром, спустился к морю, сел на корабль — не выдержал искушения — и снова вернулся в Пирей. Что сказать, долгая история! - улыбался старец Порфирий.
      cn: 忘了说，我出发时，主人给我带的礼物，我给了船上的一些士兵。我分发巧克力、装有玫瑰水的瓶子和「派佩曼」糖果，以此来减轻负担。他们不明白我为何要将这些都送给他们——因为我年纪小——但他们还是接受了。因此，正如我已经告诉过你们的，我睡在小教堂附近。第二天早上醒来，我下到海边，坐上船——无法抗拒诱惑——再次回到比雷埃夫斯。要说这真是个漫长的故事！——老修士普罗菲利耶夫微笑着。
- type: heading1
  text:
    ru: Я решился бежать, сжигая мосты
    cn: 我决定逃离，烧毁桥梁
  children:
  - type: paragraph
    text:
      ru: 'Я решился бежать, сжигая мосты (Воспоминания старца Порфирия) После всех блужданий, отъездов и возвращений прошло немного времени, и я принял окончательное решение уехать и не возвращаться. Я решил больше не сходить с корабля. Снова уехал из Пирея на Святую Гору и больше не возвращался. Это был третий мой отъезд, последний после стольких бедствий. В Салоники мы прибыли в субботу к вечеру. Тогда в городе всем заправляли евреи, поэтому в субботу никто не работал. Стояла мертвая тишина, все было закрыто. Ни кораблей, ни рейсов. Все спустились на берег, чтобы купить что-нибудь поесть. Я остался на корабле, боясь искушения. Боялся, как бы со мной не приключилось чего-нибудь, что не позволит достигнуть моей цели. Я дал одному человеку пятнадцать лепт, он мне принес хлеб и скумбрию, и я поел. Все целый день прождали в порту, потому что, как я уже сказал, никто не работал. После обеда на корабль стали подниматься монахи. Я смотрел на них с восхищением. Впервые я видел монахов в рясах. Я стоял у трапа и оттуда видел всех, кто проходил. Вот стал подниматься высокий старец, почтенный, с длинной бородой, навьюченный котомками. Он подошел ко мне, сел на скамейку и велел мне сесть рядом с ним. — Куда едешь, чадо? — спросил он. — На Святую Гору, — ответил я. — И зачем ты туда едешь? Я скрыл правду и сказал: — Еду работать. — Приезжай в Кавсокаливию, — говорит он. — Я живу там со своим братом на каливе в пустыне. Приезжай, чадо, туда. Все вместе будем славить Христа. Читать умеешь, чадо? — спросил он меня. Старец Порфирий вспоминал: Тогда я ответил: — Послание Христа, послание Богородицы, житие святого Иоанна Каливита. Я не очень-то грамотный. Он ничего не сказал об этих книгах, хороши они или нет. — Поезжай со мной, — говорит он, — у нас есть там работа, будем тебе платить. А... может быть, и в монахи тебя пострижем! Заслышав это слово, я слегка улыбнулся. Тогда он говорит мне: — Послушай, чадо, не огорчайся тому, что я тебе скажу. На Святую Гору малолетних ребят не принимают. Ты мал, и таким запрещено давать разрешение на въезд. Мое лицо помрачнело. — Но не бойся, — говорит он. — Мы немножко обманем, и Бог простит нас. Перед Богом это будет не ложью, а правдой, потому что ты любишь Христа и хочешь поехать на Святую Гору'
      cn: 我决定离开，烧掉所有的桥梁（长老普罗菲里耶的回忆录） 经过所有的游荡、离开和返回之后，过了不久，我下定决心离开，不再回来。我决定不再上船了。我们再次从皮雷亚前往圣山，再也没有回来。这是我的第三次离开，也是在经历了如此多的灾难之后的最后一次离开。我们在星期六傍晚抵达萨洛尼卡。当时，城里的统治者是犹太人，因此在星期六，没有人工作。死一般的寂静，一切都关闭了。没有船只，也没有轮渡。所有人都下到岸边，去买点东西吃。我留在船上，害怕受到诱惑。我害怕会发生什么事情，让我无法达到我的目标。我给了一个人十五个勒特，他给我带来了面包和鲭鱼，我吃了。整整一天，我们在港口等待，因为正如我之前所说，没有人工作。下午，修道士开始上船。我以敬畏的目光看着他们。这是我第一次看到穿着僧袍的修道士。我站在跳板上，从那里可以看到所有经过的人。这时，一个高大的老修道士，他长着长长的胡须，背着背囊，走过来。他走到我面前，坐在我旁边的长凳上，命令我坐到他旁边。 ——你要去哪里，孩子？ ——去圣山， ——你去圣山干什么？ ——我来工作， ——你可以去卡斯凯利维乌， ——我住在那儿，和我兄弟一起，在沙漠里。 ——去吧，孩子，我们会给你工作，一起赞美基督。 ——你会读吗，孩子？ ——我读《基督的信》、《圣母的信》、《圣约翰卡斯凯利维乌的生平》。 ——我并不很聪明。 ——这些书好，还是不好？ ——去吧，孩子， ——我们那儿有工作，我们会付你工资。 ——也许，还会给你剃光头，成为修道士！ ——听到这个话，我微微一笑。 ——孩子，不要为我说的话感到难过， ——圣山不接受未成年孩子。 ——你太小了，不被允许上圣山。 ——但不要害怕， ——我们骗骗上帝，他会原谅我们的。 对上帝来说，这并不是谎言，而是真理，因为你爱基督，想上圣山。
  - type: paragraph
    text:
      ru: 'служить Ему. Так вот, если кто тебя спросит: «Кто тебе этот старец?» — ты отвечай: «Это мой дядя». А я буду говорить, что ты — мой племянник, сын моей сестры. На корабль поднялось много других монахов. Наступил вечер. Все монахи собрались вместе и достали еду. Сели и мы рядом. Старец дал мне хлеб, чтобы я поел. — Что за мальчик с тобой, святый отче? — спрашивали все. — Сын моей сестры, племянничек мой. Сестра моя умерла, а сиротку я взял с собой.'
      cn: 侍奉祂。所以，如果你有人问你：「这位老者是谁？」你就要回答：「他是我的叔叔。」而我会说你是我堂弟，是我姐姐的儿子。船上又来了许多其他修士。晚上来临了，所有的修士都聚集在一起，拿出了食物。我们坐下来一起吃。老者给了我一块面包，让我吃。——哎呀，圣父，这位小家伙是谁？——我的姐姐的儿子，我的堂弟。我的姐姐去世了，我带上了她留下的孤儿。
  - type: paragraph
    text:
      ru: 'Святая Гора Кавсокаливия(1918—1925) Моя жизнь на Святой Гope были молитвой, радостью и послушанием моим старцам. Когда я отправился на Святую Гору, я был еще совсем юным и не умел читать... Если я стану описывать вам свою жизнь на Святой Горе, о моей любви и преданности, «недостанет мне времени, чтобы повествовать» (Евр. 11:32), – говорил старец Порфирий. — Но любовь моя к вам побуждает рассказать, сколько помню. И вот, когда я приехал на Святую Гору, то был, как я уже пояснил, юным и неграмотным. Я читал по слогам. Старцы мои — родные братья старец Пантелеймон, духовник, и отец Иоанникий — спросили меня: — Сынок. Умеешь читать? — Э-эээ…. Так. Немного, — ответил я. Был вечер субботы. Меня поставили читать Псалтирь. Робко я начал читать первый псалом: — Бла-бла же-жен му-муж. – Читал я по слогам. — Хорошо, детка, дай-ка почитаю я, — говорит отец Иоанникий, — а в следующий раз будешь читать ты. — Он надел свои очки и начал: — Блажен муж, иже не иде... Представляете мой стыд? Это было мне уроком. «Я должен научиться читать», — решил я. И тут же начал учиться. Когда у меня было свободное время, я брал и читал Псалтирь, Новый Завет, каноны, чтобы язык мой привык. Поучался и ночью. Таким образом, прочитав много раз, я выучил Псалтирь наизусть.'
      cn: 圣凯瑟琳的高加索山(1918—1925) 我的生命在圣山，是我的祈祷、我的快乐和我的服从于我的长老们。当我来到圣山时，我还很年轻，不会读书……如果我要向您描述我在圣山上的生活、我对您的爱和我对您的忠诚，就像长老波菲里所说的：「我将没有时间去讲述」（希伯来书 11:32），——那么，我爱您的感情促使我讲述，我记住了多少。现在，当我来到圣山时，我像我之前解释的那样，还是个年轻人，不识字。我只能拼读。我的长老们——我的兄弟长老潘苔莱蒙和我的导师，我的父亲伊凡尼基，问我：「孩子，你会读吗？」——嗯嗯……是的，一点点。晚上是星期六。我被派去读《圣经》。我小心翼翼地开始读第一篇诗篇：「巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴-巴
- type: heading1
  text:
    ru: Я чувствовал себя так, как будто бы меня нет на земле, а нахожусь я – на небе!
    cn: 我感觉好像我没有在地上，而是在天上！
  children:
  - type: paragraph
    text:
      ru: Как-то ночью было всенощное бдение в кириаконе, соборном храме Святой Троицы, – рассказывал старец Порфирий – Был панигер — престольный праздник нашего скита. С вечера старцы мои ушли в церковь, а меня оставили в келии спать. Это было в первые дни после моего приезда. Я был мал, и они, наверное, подумали, что я не выдержу до утра, когда закончится бдение. После полуночи приходит отец, Иоанникий и будит меня. — Проснись, — говорит мне, — одевайся, пойдем в церковь. Я тут же собрался. Через три минуты мы подошли к церкви Святой Троицы. Он пропустил меня вперед. Я впервые вошел внутрь храма и растерялся! Церковь была полна монахов, молящихся с благоговением и вниманием. Паникадила освещали все — иконы на стенах, на аналоях. Все сияло. Горели лампадки, благоухал ладан, звучали умилительные псалмопения в неземной красоте ночи. Меня охватили благоговейный трепет и страх. У меня было ощущение, что я нахожусь не на земле, а на небе. Отец Иоанникий сделал мне знак, чтобы я прошел вперед и приложился к иконам. Но я не мог тронуться с места. — Держи меня, держи меня! — начал я взывать. — Я боюсь! Он взял меня за руку, и я, крепко схватившись за него, прошел вперед и приложился к иконам. Это был мой первый опыт, оставивший во мне глубокий след. Никогда не забуду этого!!! Впоследствии об этом старец Порфирий вспоминал часто.
      cn: 有一次夜间在基里亚克教堂，即圣三一教堂，举行晚祷——这是我们修道院的主显节。老修士们晚上就去了教堂，而我则留在小屋子里睡觉。这发生在我在那里刚到的第一天。那时我还很小，他们大概以为我会熬不过到半夜，因为晚祷要到天亮才结束。午夜过后，修士伊凡尼基雅来了，把我叫醒。——起来，——他说，——穿好衣服，我们去教堂。我立刻就收拾好了。三分钟后，我们来到了圣三一教堂。他让我走在前面。这是我第一次走进教堂，我感到很惶恐！教堂里挤满了修士们，他们虔诚地、专注地祈祷着。圣像龛里的灯都亮着——墙上、祭台上的圣像都亮着。一切都闪闪发光。蜡烛燃烧着，檀香飘散，优美的圣咏在夜晚的宁静中回荡。我感到敬畏和恐惧。我有一种置身于天堂的感觉。修士伊凡尼基雅做了个手势，让我走在前面，然后去亲吻圣像。但我无法动弹。——抓住我，抓住我！——我开始呼喊。——我害怕！他抓住我的手，我紧紧抓住他，然后跟着他走进圣像龛，亲吻了圣像。这是我第一次经历，给我留下了深刻的印象。我永远不会忘记这件事！！后来，老修士帕弗里里耶经常回忆起这件事。
- type: heading1
  text:
    ru: Немногое время мне понадобилось для того, чтобы миновать первое искушение
    cn: 少许时间便足以让我渡过第一次试探
  children:
  - type: paragraph
    text:
      ru: 'Я был очень радостным и воодушевленным от своей жизни на Святой Горе, – говорил старец Порфирий. – Но некоторое время, вначале, у меня было искушение. Я начал думать о своих родителях, начал болеть душой за них, жалеть их, так как они не знали, где я нахожусь. Думал и о своем двоюродном брате, ровеснике. Во мне родилось желание поехать ненадолго в свою деревню и привезти брата на Святую Гору, чтобы и он проводил здесь такую же прекрасную жизнь. Я чувствовал, что обязан привести его ко Христу. Я ничего не говорил своему старцу. Но стал тосковать, потерял аппетит, лицо мое пожелтело. Старец, заметил это. Как-то он подзывает меня и спрашивает с любовью: — Что за помыслы у тебя, детка? Что с тобой происходит? Тогда я ему просто все рассказал. Но этого было достаточно, я освободился! Искушение прошло. Снова появился аппетит и радостью переполнилось мое сердце. Я продолжал послушание своим старцам. Лицо мое просияло, я похорошел и стал более красивым. Тогда как раньше был худощавым. Теперь же лицо мое стало ангельским. Как я это увидел? Пошел как-то к старцу, а солнце било в его окно, и получилось зеркало. Когда я увидел свое лицо, то подумал про себя; «Ого! Как изменила меня благодать». Прежде я думал о родителях, и эти мысли мучили меня. Потом я перестал думать о них. Только молился, чтобы Господь спас их. Сначала я скучал по ним, а теперь стал скучать по своим старцам. Я помнил о родителях, но память эта стала другой, память единственно с любовью Христовой. Я начал больше поститься и больше подвизаться. Я был словно сумасшедший, весь горел духовной ревностью. Я хотел постоянно находиться в церкви и делать то, что желали старцы, чтобы доставить им радость. Вот что такое изменение, преображение, превращение, совершаемое благодатью Божией. – рассказывал отец Порфирий.'
      cn: 我非常快乐和充满激情地度过了在圣山上的一生，——长老彼罗菲里说。但我曾有过一些诱惑。起初，我开始思念我的父母，开始为他们感到难过，因为他们不知道我在哪里。我还开始思念我的堂兄，他是同龄人。在我心中萌生了想回去短暂地看望一下我的村庄，然后把我的堂兄也带来圣山，让他也能过上这样美好的生活。我感到自己有责任把他也带进基督的道路。我什么都没有告诉我的长老。但开始感到忧郁，食欲不振，脸色变得苍白。长老注意到了这一点。有一天，他叫住我，用充满爱意的语气问道：——你心里在想什么，孩子？你最近怎么样？——然后我简单地把一切都告诉了他。但这就足够了，我解脱了！诱惑消失了。食欲又回来了，我的心充满了快乐。我继续遵守我的长老们的教导。我的脸变得红润，我变得更健康，也变得更漂亮。以前我是个瘦弱的人。现在我的脸像天使一样美丽。我是怎么发现的？有一天，我去找我的长老，阳光正好照进他的窗户，形成一面镜子。当我看到自己的脸时，我心想：「天哪！圣恩改变了我。」以前我总是想着父母，这些想法折磨着我。后来我就不这么想了。我只祈祷上帝拯救他们。我以前是想念他们，现在则是想念我的长老们。我仍然记得父母，但这种记忆变得不同了，只与基督的爱有关。我开始更多地禁食，更多地修行。我就像个疯子，浑身燃烧着对圣灵的渴望。我总是想待在教堂里，按照长老们的意愿去做，以给他们带来快乐。这就是圣恩改变、净化、转化的奇妙过程。——长老彼罗菲里讲述。
- type: heading1
  text:
    ru: Старцев моих я очень любил
    cn: 我的老人们，我非常喜爱
  children:
  - type: paragraph
    text:
      ru: 'Как я уже сказал, моими старцами были отец Пантелеймон и его брат отец Иоанникий. Я любил их, – вспоминал старец Порфирий, - хотя они были очень строгими. Тогда я этого не замечал. Поскольку любил их, я думал, что они не относятся ко мне строго. Я питал к ним великое уважение, благоговение и любовь. Благоговение мое было таким же, с каким я смотрел на икону Христа. С таким благоговейным трепетом. Потому что после Бога были старцы. Они оба были священниками. Родом из Кардицы, высокогорного села. Как-то называлось это село? Достойно, чтобы это вспомнить... А – вспомнил! Это село Месениколас Кардицы. Оттуда было мое толстое шерстяное одеяло, под которым я спал до недавнего времени. Я был у старцев в полном послушании. Послушание! Как вам сказать, я знал, что это такое! Я предал себя послушанию с радостью, с любовью. Это полное послушание меня и спасло. За него Бог послал мне дар. Да, повторяю вам, я был в полном послушании у своих старцев. Послушание было не вынужденное, а с радостью и любовью. Я любил их истинно. И поскольку я любил их, эта любовь помогала мне чувствовать и понимать, чего хотели они. Прежде чем они скажут, я уже знал, чего они хотели и как хотели, чтобы я это сделал, и так в каждом деле. Я бегал повсюду и делал то, что меня благословляли. Я посвятил им себя. Поэтому душа моя рядом с ними летала от радости. Я не помышлял ни о ком. Где родственники, где знакомые, где друзья, где весь мир? Жизнь моя была молитвой, радостью и послушанием моим старцам. Мне достаточно было сказать всего один раз, чтобы я соблюдал их слово. Например, один раз старец сказал мне: — Детка, мой руки и перед едой, и всякий раз, когда мы собираемся идти в церковь, потому что входим в святое место и должно быть все чистым. Мы оба священники, оба совершаем литургию. У нас должны быть чистыми руки. Однако чистота должна быть во всем. Тогда я стал каждый раз мыть руки с мылом. Не нужно было говорить мне второй раз.'
      cn: 生平与言语，上主的仆人帕尼泰里乌斯回忆说：我敬爱的师傅是潘苔莱蒙长老和他的兄弟伊奥annis基长老。尽管他们非常严厉，我却爱他们。那时我还不知道。因为我爱他们，所以以为他们对我并不严厉。我尊敬他们，敬畏他们，爱他们。我的敬畏就像我面对基督的圣像时一样，怀着同样的敬畏和敬畏之情。因为他们是上帝之后的人。他们都是神父。他们来自卡迪茨，一个高高的山区村庄。这个村庄叫什么名字？值得回忆一下……我记得了！这个村庄叫梅森科拉斯卡迪茨。我的厚羊毛被子就是从那里来的，我直到不久前还在用它。我完全服从他们。服从！你该怎么说呢，我了解什么是服从！我以快乐和爱的心情把自己献给了服从。正是这种完全的服从救了我。因为这个，上帝赐给了我恩典。是的，我重复给你们听，我完全服从了我的师傅。服从不是被迫的，而是以快乐和爱的心情。我真诚地爱他们。因为我爱他们，这种爱帮助我理解他们想要什么。在他们说话之前，我已经知道他们想要什么，以及他们希望我怎么做，以及在每一件事上。我到处跑着，做他们祝福我做的事情。我把我的生命献给了他们。因此，我的灵魂与他们同在，充满了快乐。我心中没有其他人。我的亲戚，我的朋友，我的邻居，整个世界？我的生活就是祈祷、快乐和对师傅们的服从。我只需要说一次，我就会遵守他们的命令。例如，有一次师傅对我说：——孩子，我的手在吃饭前，以及每次我们准备去教堂的时候，因为我们要进入圣洁的地方，所以必须保持清洁。我们都是神父，我们都做礼拜。我们的手必须保持清洁。但是清洁应该在所有事情上。因此，我开始每次用肥皂洗手。不需要再说第二遍。
  - type: paragraph
    text:
      ru: 'Перед едой я мыл руки с мылом. По какой бы причине я ни собирался идти в церковь, мыл руки с мылом. При занятии рукоделием, если это была тонкая работа, я мыл их с мылом. Так я поступал во всем, не противодействуя внутренне. Заметьте, что у меня было два старца, и часто они требовали противоположных вещей. Однажды отец Иоанникий говорит мне: — Возьми отсюда эти камни и перенеси их туда… Я убрал их на указанное место. Приходит «старший» старец. Лишь только увидев их, он разгневался, отругал меня и сказал: — Э-эээ, кривой (страбос) человек! Зачем ты это сделал? Разве эти камни должны быть там? Неси-ка их снова туда, откуда взял! Вот, так – «кривой (страбос) человек» — так он меня ругал, когда гневался. На другой день проходит там отец Иоанникий. Видит камни на прежнем месте, приходит в гнев и говорит мне: — Разве я не велел тебе перенести эти камни туда? Я смутился, покраснел, положил ему поклон и говорю: — Батюшка, прости меня, я почти все перенес их, но старец увидел это и сказал: «Отнеси их опять туда же. Они нужны нам там». И я их отнес обратно. Отец Иоанникий не промолвил ни слова. Так старцы много меня тренировали. Но я ничего лукавого не подозревал, не говорил: «Они что, испытывают меня?» Мне на самом деле в голову не приходило, что они могут меня испытывать. А если они и испытывали, то делали это столь естественно, что догадаться было невозможно. В этом был глубокий смысл. Потому что когда человек знает, что его испытывают, то может исполнить даже самое трудное дело, чтобы показать, что он — послушный. Но если человек не знает, что его испытывают, да еще и видит гнев другого, тогда не может его не кольнуть внутри: «Ого! Что еще такое? Он столько лет монашествует и при этом гневается? Да разве такое возможно? Может ли монах быть гневливым и молиться? Не освободиться от гнева? Значит, эти люди далеки от совершенства...» Но я так не думал, да и не знал, испытывают ли меня. Напротив, я очень радовался этому, потому что любил их. Да и они очень любили меня, хотя и не показывали этого. Я любил обоих старцев, но особенно привязался к своему духовнику — старцу Пантелеймону. Как говорит Давид: «Прильпе душа моя по Тебе, мене же прият десница Твоя »(Пс. 62:9). Так и моя душа прилепилась к моему старцу. Истинно говорю вам! И сердце мое было вместе с его сердцем. Я видел его, чувствовал его. Он брал меня с собой, и мы шли сначала в собор, а оттуда вместе на работу. Да, да, да, я его ощущал! Это очень освятило меня. То, что я привязался к старцу, а сердце мое прилепилось к его сердцу, освятило меня, принесло мне огромную пользу. Это был великий святой! Однако старец ничего не говорил мне не только о том, откуда он родом, но и не называл мне даже своей фамилии, ничего, совсем ничего... Никогда он не говорил: «На моей родине» или «мои родители, мои братья» и так далее. Он всегда был молчалив, всегда молился, всегда был кроток. Если и гневался когда, то гнев его и все слова были только для вида. Я любил его и верю, что благодаря послушанию и любви, которую я питал к нему, благодать посетила и меня. Я наблюдал за ним, чтобы что-нибудь перенять у него, уподобиться ему. Я любил его, благоговел перед ним, смотрел на него и получал от этого пользу. Мне достаточно было лишь смотреть на него. Вот мы идем далеко. От самой Кавсокаливии вверх на гору, чтобы обрезать ветки каменного дуба. Всю дорогу молчим, не говорим ни слова. Помню, как старец показывает мне, какие дубы пилить. Едва спилив один, я кричу радостно:'
      cn: 在用餐前我总是用肥皂洗手。无论我打算做什么，只要我要去教堂，我都会用肥皂洗手。在做手工活时，如果那是一项精细的工作，我也会用肥皂洗手。总之，我总是这样做，不会违背内心。请注意，我有两个老父老，他们经常要求我做相反的事情。有一次，老父老伊凡尼基说：「拿这些石头过来，搬到那边……」我将它们搬到指定的地方。然后，另一位「老父老」来到这里。他一看到那些石头，就大发雷霆，责备我说：「哎呀，这根直的家伙！」为什么你把它们放那了？这些石头应该在那里吗？把它们再放回去！就是这样——「这根直的家伙」——他生气时就是这样责备我的。第二天，老父老伊凡尼基又来了。他看到那些石头还在原来的地方，就又大发雷霆，对我说：「我说过要把这些石头搬到那边去吗？你把它们放回去！」我感到很尴尬，脸红了，向他行礼并说：「老父老，求你原谅我，我几乎把它们都搬过去了，但老父老看到了，说：『把它们再放回去。它们在那里有用呢。』」于是，我将它们又放了回去。老父老伊凡尼基没有说什么。就这样，老父老们经常这样训练我。但我并没有怀疑他们是否在考验我，也没有想：「他们是不是在考验我？」我根本没想过他们要考验我。如果他们确实是在考验我，那么他们做起来如此自然，以至于根本无法察觉。这是因为其中蕴含着深刻的含义。因为一个人知道他正在被考验，他可以做任何艰难的事情，以证明自己是顺从的。但如果一个人不知道自己正在被考验，而且看到别人愤怒，那么他内心肯定会受到触动：「哦，这还了得！他这么长时间都在修道院里，却还这么生气？难道这可能吗？一个修道者能生气吗？他能摆脱愤怒吗？看来这些人离完美还很远……」但我并没有这样想，也不知道他们是否在考验我。相反，我非常高兴，因为我爱他们。他们也爱我，尽管他们并没有表现出来。我爱他们两个老父老，但我特别亲近我的精神导师——老父老潘苔莱莫诺。正如大卫所说：「我的心因祢而喜乐，我心因祢的救恩而欢喜」（诗篇 62:9）。我的心也与老父老潘苔莱莫诺的心紧紧相连。我看到他，感受到他。他带我一起去教堂，然后一起去做工。是的，是的，我感觉到了！这使我的心灵得到了极大的净化。我之所以与老父老潘苔莱莫诺如此亲近，我的心灵与他的心灵紧紧相连，这使我的
  - type: paragraph
    text:
      ru: '— Геронда, я его спилил! Он отвечает: — Пойди-ка с пилой вон туда. Я очищаю все вокруг, чтобы можно было работать пилой. А он идет, чтобы найти мне следующий дуб. Мы произносили одно слово «монофиси», то есть на одном дыхании. Я сразу кричал: — Геронда, я спилил и его! При этом испытывал огромную радость. Это было необыкновенно. Это была моя любовь, была благодать Божия, которая исходила от старца ко мне, смиренному. Я теперь понимаю, когда рассказывают: Однажды пришли монахи и окружили одного подвижника, спрашивая его о разном. Один из них сидел и не говорил ничего. Он смотрел на лицо старца. Все спрашивали, а он — никогда. Пустынник задал ему вопрос: — Почему ты, детка мое, не спрашиваешь ни о чем? У тебя нет никаких недоумений? А тот отвечает ему — Я не хочу ничего другого, мне достаточно лишь видеть тебя, Геронда. То есть он наслаждался благодатно, впитывал его, через него получал благодать Божию. И преподобный Симеон Новый Богослов говорил то же самое — что получил благодать от своего старца.'
      cn: '——葛尔农，我把他砍倒了！他回答说：「去那边拿锯吧。」我清理周围的一切，以便可以拿着锯工作。而他却去寻找我下一个需要砍倒的大橡树。我们说着同一个词「monoφis」，即「一气呵成」。我立刻喊道：「葛尔农，我把他砍倒了！」就在那一刻，我感到无比的喜悦。这真是不寻常。这正是我的爱，是上帝的恩典，它从长老传给了我，传给了我这个谦卑的人。我现在明白了，当人们讲述说：有一次，一些僧侣来到一位隐修者面前，向他询问各种问题。其中一个人坐着一言不发，他只是看着长老的脸。所有人都在提问，而他却从不回答。隐修者问他：「你这孩子，为什么你从不提问？你没有任何疑惑吗？」而他回答说：「我不想要别的东西，我只需要看到你，葛尔农。」


        这就是他享受着圣神，吸收着它，通过它获得着上帝的恩典。圣西蒙新约伯也说过同样的意思——他从他的师傅那里获得了恩典。'
- type: heading1
  text:
    ru: Все, что я делал, я делал с великой с радостью!
    cn: 我所做的，我都以极大的快乐去做！
  children:
  - type: paragraph
    text:
      ru: 'Старцы не посылали меня на тяжелую работу, – вспоминал старец Порфирий. - Я только поливал сад и занимался рукоделием, вырезал по дереву. Да и не поучали меня. Первое время я лишь ходил с ними на службы. Ничего более. По прошествии нескольких дней старец позвал меня, дал четки и сказал, чтобы каждую ночь я творил молитву: Господи Иисусе Христе, помилуй мя. Ничего более. Никакого поучения, никаких объяснений. Перед тем как дать мне четки, он сказал: — Смотри, положи поклон, поцелуй мне руку, поцелуй крест на четках, чтобы я благословил тебя, дабы помог тебе Бог. Так я научился молиться по четкам. Вне келий, то есть на работу за оградой келий, вначале старцы меня не посылали. Все работы, какие я делал, были только на келий. После я ходил в сад, копал, поливал, полол, делал все, что мог. Затем брался за рукоделие. После работы они ставили меня читать Псалтирь, а сами работали. Я все делал старательно и не хотел доставлять своим старцам никаких огорчений. Меня заботило лишь то, как послужить им, как упокоить их во всем. Я делал все, что мне говорили. Соблюдал все в точности. Чтобы быть уверенным, я запоминал то, что мне говорили, и заучивал, как урок, держал это в уме и выполнял. Например, моим рукоделием была резьба по дереву. Я внимательно смотрел, как делали это старцы, и вечером, когда ложился спать, в уме повторял «урок»: берем деревяшку, распиливаем ее и кладем в воду, чтобы она намокла. Потом вынимаем из воды и кладем сушить. Потом обтесываем топором, обрабатываем рубанком, зачищаем наждачной бумагой, берем рашпиль и обрабатываем им так... Потом берем морской камень, такой кристалл, который делает дерево глянцевым, его называли алмазным камнем. Затем делаем рисунок и так далее. Весь процесс работы я обдумывал в уме, чтобы не забыть и о самых малых деталях, чтобы делать именно так, как они хотели. Я боялся ошибиться и огорчить их. Поэтому все, что они говорили мне, я заучивал наизусть. Они объясняли мне, зачем учиться рукоделию: — Смотри, детка, учись рукоделию. Иначе не сможешь здесь остаться. Здесь тебе не'
      cn: 老修士们没有派我去做艰难的工作，老修士普罗菲利回忆说。我只是浇灌花园，做手工，雕刻木头。而且也没有教导我。最初，我只是和他们一起去祈祷。除此之外，没有其他的事情。几天后，老修士叫住了我，给了我念珠，让我每晚祈祷：上主耶稣基督，怜悯我。除此之外，没有其他的事情。没有教导，没有解释。在给他念珠之前，他告诉我：「看，你做合掌礼，亲吻我的手，亲吻念珠上的十字架，让我祝福你，这样上帝就会帮助你。」就这样，我学会了用念珠祈祷。在小屋之外，也就是在小屋围墙之外的工作中，起初老修士们没有派我去。我做的所有工作都只限于小屋。之后，我开始在花园里挖土、浇水、除草，做我能做的所有事情。然后，我开始做手工。做完工作后，他们让我念《诗篇》，而他们自己则继续工作。我总是尽力而为，不想给老修士们带来任何麻烦。我只关心如何服侍他们，如何让他们在一切事情上得到安息。我做了他们让我做的所有事情。我严格遵守所有规定。为了确保自己不会忘记他们告诉我的一切，我将这些内容牢记在心，并像背诵课文一样记住它们，然后执行。例如，我的手工是雕刻木头。我仔细观察老修士们是如何做的，晚上躺在床上时，我会在脑海中重复「课程」：取一根木头，用锯子锯开，然后把它放在水中，让它变湿。然后把它从水中取出，放在通风的地方晾干。然后用斧头打磨，用凿子处理，用砂纸打磨，然后用海石打磨，海石是一种被称为钻石的晶体。然后画出图案等等。整个工作过程我都仔细思考，以确保不会忘记任何小细节，以确保按照他们想要的方式去做。我害怕犯错，让他们失望。因此，我将他们告诉我的一切都背得滚瓜烂熟。他们解释给我听，为什么要做手工：看，孩子，你要学习手工。否则，你在这里无法生存。在这里，你无法生存。
  - type: paragraph
    text:
      ru: 'монастырь, то есть не киновия, где большие сады, виноградники, много фруктов. Здесь нужно трудиться, чтобы купить себе сухари… Они говорили это и учили меня рукоделию. Чтобы не огорчать их, я занимался рукоделием даже ночью, перед тем как лечь спать. Таким образом, угром я был готов к работе. Что бы я ни делал, делал с радостью. Я говорил: — «Я стану монахом! – решил будущий старец Порфирий . – Чтобы этому научиться, нужно постичь суть монашства!». Я был любознателен и хотел изучать углубленно и всесторонне каждую вещь, каждое дело. Я хотел выучиться всему. Не потому, что я думал, что стану проповедником и это мне пригодится, но по одной лишь любви Христовой. Я взял благословение у старца читать последование пострижения в монашество и за пятнадцать дней выучил его все наизусть.'
      cn: 修道院，即不是影院的地方，那里有广阔的花园、葡萄园和许多水果。在这里，我需要努力工作，才能买得起干果……他们这样教导我，并且让我学习手工艺。为了不让他们失望，我在睡觉前的夜晚也从事手工艺。因此，我总是准备好了工作。无论我做什么，我都带着快乐。我说：「我要成为修士！」这是未来的长老普罗菲利耶夫所决定的。「为了学会这一点，我必须深刻理解修道生活的本质。」我好奇心强，想要深入全面地学习每一件事，每一样工作。我想要学会一切。不是因为我认为自己会成为一名传教士，这对我会有用，而是出于对基督的爱。我从长老那里得到了准许，学习了修道生活的受戒仪式，并在十五天内将它全部背熟。
- type: heading1
  text:
    ru: 'Я выработал привычку: не оставлять свой ум праздным, чтобы иметь чистоту ума'
    cn: 我养成习惯：不让自己的心思闲着，以便保持心灵的清洁
  children:
  - type: paragraph
    text:
      ru: 'В комнате, где я занимался резьбой по дереву, было Священное Писание, – вспоминал старец Порфирий. – Я открывал его и читал. Евангелие я читал от начала, от Матфея: «Родословие Иисуса Христа, Сына Давидова, Сына Авраамова. Авраам родил Исаака; Исаак родил Иакова; Иаков родил Иуду и братьев его; Иуда родил Фареса и Зару от Фамари; Фарес родил Есрома; Есром родил Арама; Арам родил Аминадава; Аминадав родил Наассона; Наассон родил Салмона; Салмон родил Вооза от Рахавы; Вооз родил Овида от Руфи; Овид родил Иессея; Иессей родил Давида царя; Давид царь родил Соломона от бывшей за Уриею; Соломон родил Ровоама; Ровоам родил Авию; Авия родил Асу; Аса родил Иосафата; Иосафат родил Иорама; Иорам родил Озию; Озия родил Иоафама; Иоафам родил Ахаза; Ахаз родил Езекию; Езекия родил Манассию; Манассия родил Амона; Амон родил Иосию; Иосия родил Иоакима; Иоаким родил Иехонию и братьев его, перед переселением в Вавилон. По переселении же в Вавилон, Иехония родил Салафииля; Салафииль родил Зоровавеля…» (Мф.1:1—12). Прочитав, когда работал, я повторял это про себя. Я повторял слова Евангелия много раз и помню их даже и теперь. Меня очень занимало держать в уме святые слова. Меня не утомляло многократное повторение, так как я любил Божественные слова, чувствовал их, углублялся в них. Я повторял их целый день, но не мог насытиться. Я не уставал произносить их каждый день. Я испытывал великую жажду молиться. Старцы уходили утром, а приходили только вечером, и я, как только выдавалось свободное от занятий время, шел в церковку Святого Георгия и предавался молитве. Да... Что там происходило! Я пребывал в такой великой радости, что и не ел. Я не хотел прерываться. Понимаете? Я произносил молитву, пел, читал. Ходил туда один. У меня был хороший голос. Правду вам говорю, у меня был замечательный голос. Говорю это не для того, чтобы похвалиться, но потому, что я так чувствовал. У меня был очень хороший голос, и, когда я пел, мое пение было похоже на плач, причитание. Это были песни любви ко Христу, все, что хочешь... Понимаете? О-о! Что это были за проникновенные погребальные службы! И я переживал нечто такое, что невозможно передать словами. Понимаете? Когда прошло немного времени и я подрос и укрепился, то старцы начали посылать меня на работу вне келии. У нас на келий в Кавсокаливии было мало земли, гумуса, и приносили его издалека на плечах. Когда я, исполняя послушание, ходил за землей к пещере святого Нифонта, я привык не оставлять своего ума праздным, но наизусть заучивал Священное Писание,'
      cn: 在进行木雕工作的地方，老方济各回忆说，我房间里有《圣经》。——我打开它，开始阅读。我读《福音书》，从头开始，从马太福音：「耶稣基督，上帝之子，大卫之子，亚伯拉罕之子的后裔。亚伯拉罕生以撒，以撒生雅各，雅各生犹大和他的兄弟。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，阿玛力生亚米拿达，亚米拿达生拿弗他利，拿弗他利生便雅悯，便雅悯生西缅，西缅生犹大。犹大生法勒斯和谢拉，法勒斯生阿玛力，
  - type: paragraph
    text:
      ru: Псалтирь, каноны. Я делал это, чтобы иметь чистоту ума. У меня никогда и в мысли не было, что эти знания пригодятся мне, чтобы говорить затем народу, как обычно делают священнопроповедники во время бесед и проповедей. Я никогда и не думал, что выйду из пустыни. Никогда мне в голову это не приходило. У меня было такое чувство, что я проживу там всю жизнь, там же и умру! Но, вопреки моим желаниям, моим мыслям, я вынужден был уехать со Святой Горы... Старец Порфирий вынужден был уехать.
      cn: 诗篇，赞歌。我这样做，是为了使心灵保持纯洁。我从未有过这样的念头：这些知识会对我有用，让我像通常的牧师在谈话和布道时那样，向民众宣讲。我从未想过我会离开这个旷野。从未有过这样的念头。我有一种感觉，我会在那里度过我一生，也在那里死去！但违背了我的意愿，我的想法，我不得不离开圣山……长老帕弗里里也必须离开。
- type: heading1
  text:
    ru: Я простер свою руку и произнес проповедь
    cn: 我伸出我的手，宣告了教诲
  children:
  - type: paragraph
    text:
      ru: 'Однажды старцы послали меня принести землю в скит, – вспоминал старец Порфирий. – Когда я шел к пещере святого Нифонта, то, по своему обычаю, читал в уме Евангелие от Иоанна и смотрел на Эгейское море, которое простиралось, сливаясь с горизонтом. В одном месте я встал на скалу, вдыхая запах чабреца, и пришел в такой восторг от красоты природы, что начал кричать. Я даже простер свою руку и произнес проповедь. Да, я говорю вам правду! На скале я простер руку, оставив свой мешок для земли внизу. Громким голосом, выразительно я начал:« Суд же состоит в том, что свет пришел в мир; но люди более возлюбили тьму, нежели свет, потому что дела их были злы; ибо всякий, делающий злое, ненавидит свет и не идет к свету, чтобы не обличились дела его...» (Ин. 3:19—20). Я произнес это до конца. Кому я говорил эту проповедь? Пространству, морю, всему миру. Никто этого не мог услышать в пустыне Э, как бы вам сказать: я вам рассказываю то, что возлюбил и помню очень живо... — вспоминал старец Порфирий.'
      cn: 有一次长老派我去拿圣尼福特修道院的泥土，老修道者彼得回忆说。当我走向圣尼福特修道院的洞穴时，我按照自己的习惯，心里默念《约翰福音》，看着爱琴海，它与地平线融为一体。在一处，我站在一块岩石上，呼吸着迷迭香的香气，被大自然的美丽所陶醉，以至于开始高声喊叫。我甚至伸出我的手，开始布道。没错，我说的是实话！我在岩石上伸出我的手，留下我的包裹在下面。我用洪亮的声音，有力地开始说：「审判就是：光明来到世间，但世人更爱黑暗，胜过爱光明，因为他们的行为是邪恶的；凡作恶的，恨恶光明，不肯进去见光明。」（约翰福音 3:19-20）我讲完了这段话。我向谁讲这段话呢？向虚空、大海、整个世界。在埃地，就像您说的那样：我向您讲述我所爱和记忆非常深刻的事……
- type: heading1
  text:
    ru: Я носился, как угорелый... Я не мог ходить!
    cn: 我像只被惊吓的野兔般狂奔……我无法行走！
  children:
  - type: paragraph
    text:
      ru: 'Я совсем не мог сидеть! ! ! – вспоминал старец Порфирий. – Хотелось двигаться, идти то туда, то сюда, поливать огород, пилить дрова. И все это я всякий раз делал с поклоном. Я был полон радости и веселия. Меня переполняли чувства, и я бегал. Бегал, а не ходил! Смущался, однако, что старцы увидят, что я бегаю. Поэтому вначале шел потихоньку, а затем, отойдя немного, бежал. У меня как будто выросли крылья, чтобы быстро все делать и поскорее возвращаться к своим старцам. Это была благодатная — что я вам скажу... — поистине ангельская жизнь! Да и мой благословенный старец имел великую ревность. Он говорил мне: «Пойди туда, пойди сюда...» Но и работы у нас действительно было много. Мне поручили присматривать за келией. Дом у нас был аккуратно ухожен. У нас было немного оливковых деревьев, огород. Я ходил на многие работы. Часто поднимался в гору. От работы я, естественно, уставал. Нередко подкашивались ноги. Но откуда старцам моим было знать, как со мною, ребенком, обращаться? Я спускался с гор после трех часов дороги, а отец Иоанникий мне говорил: — Завтра будем печь хлеб. Поэтому собирайся-ка, насобирай веток. Я брал веревку и шел в горы за ветками. Шел по натоптанной, но крутой дорожке. Но помню не только это. Часто старцы посылали меня принести чурбачки или бревна. Я взваливал их на себя и нес их, как навьюченный осел. Когда у меня от тяжести начинала болеть поясница, я садился отдохнуть на камешек. Если ноша была очень тяжела, я говорил сам себе: — «Вот я тебе задам, старый осел!» Я не знал лени. Да, я действительно не жалел свое тело. Когда мои колени болели, я хотел им отомстить. То есть когда колени протестовали и болели, я брал груз еще больше и снова говорил: — «Вот я тебе задам, старый осел!» И я мстил, мстил злодею — самому себе. Невероятно, но я носил, хотя был юношей семнадцати лет, тяжесть в семьдесят ока на расстояние, к примеру, как от Омонии до вершины Ликавитоса. Лени не было совсем. Мне нравилось молиться, даже когда я был уставшим. В обессиленном состоянии я еще более искал Бога. Вы должны этому поверить и понять, что это действительно возможно. Это результат любви. Дело не в том, что ты быстро ходишь, делаешь одно дело, начинаешь другое, возвращаешься и следишь за тем, чтобы успеть закончить все: полить, прополоть, принести земли и дров, сходить в горы, принести деревяшки для рукоделия. Благодаря любви становишься неутомимым. И знаете, куда тогда деваются грехи? Они все спят. Слышите? Такова в действительности странническая жизнь, жизнь преподобническая, святая, жизнь райская. – утверждал старец Порфирий.'
      cn: 我完全不能坐着! ! ! —回忆起老方济各说。——我想动，一会儿到这儿，一会儿到那儿，浇浇园子，劈劈柴。每次我都是怀着敬拜的心去做。我充满了快乐和欢愉。我感到内心充满感情，我跑来跑去。我跑，而不是走！然而，我总是感到不好意思，因为老修士们会看到我跑。因此，起初我慢慢地走，然后退后一些，跑起来。好像长出了翅膀，以便能迅速地做每一件事，尽快回到我的老修士们身边。这是多么的恩典啊……——真是天使般的生活啊！我的受祝福的老修士也十分有热情。他总是说：「去那儿，去这儿……」然而，我们的工作确实很多。我被派去照看小堂。我们的房子整洁如新。我们有几棵橄榄树，菜园。我经常去干很多活。经常要爬山。由于劳累，我总是感到疲惫。我的腿经常抽筋。然而，我的老修士们又怎么能知道，他们怎么对待一个孩子呢？我从山下走回家，已经走了三个小时，而雅各尼科修士对我说：「明天我们要做面包了。」因此，你得去，把柴火准备一下。我拿着绳子，去山上砍柴。我走在一条既熟悉又陡峭的小路上。然而，我不仅记得这些。老修士们还常常派我去拿柴火或木头。我扛起它们，像一头负重的驴子一样扛着。当我因为负担太重而腰酸背痛时，我坐在一块石头上休息。如果负担很重，我会对自己说：「老驴子，我今天要让你吃点苦头！」我不知疲倦。是的，我确实不吝惜自己的身体。当我膝盖疼时，我想要报复它们。也就是说，当膝盖抗议和疼痛时，我会扛起更重的负担，然后说：「老驴子，我今天要让你吃点苦头！」我报复，报复那个恶人——我自己。不可思议的是，我带着一个十七岁少年的身体，扛着七十磅重的负担，从奥蒙罗到利卡维托斯山顶的距离。没有一点懒惰。我喜欢祈祷，即使我感到疲惫。在极度疲惫的情况下，我更渴望上帝。你必须相信这一点，理解这一点，这确实有可能。这源于爱。不是说你很快地做事，做一件事，开始另一件事，然后回来，确保能完成所有的事情：浇灌、除草、运土、运柴、去山上运木头。由于爱，你变得永无止境。那么，罪恶到哪里去了呢？它们全都睡着了。听见了吗？这就是真正意义上的朝圣生活，修道生活，圣洁的生活，天堂般的生活。——老方济各说。
