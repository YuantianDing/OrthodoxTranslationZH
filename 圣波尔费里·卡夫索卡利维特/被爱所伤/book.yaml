  - type: paragraph
    text:
      ru: 'Монастырь мне казался подобным Раю: службы и исповедь не прекращались бы круглые сутки, – мечтал старец Порфирий. – Духовники бы сменяли друг друга: новые заступали бы на дежурство и постоянно оказывали бы помощь больным… Это было бы в любое время дня и ночи. Чтобы был телефон, у которого бы день и ночь дежурили сестры, чтобы утешать стольких отчаявшихся в жизни по причине различных ран. Своими словами они приводили бы их к великому Утешителю — Христу, чтобы спасались их души и наполнялись небесным светом, который им будет подавать Божественная благодать. И я бы хотел исповедовать приходящих людей. Когда придет какой-нибудь больной, особенно после искушений, я бы его поисповедал. А потом приходят сестры и благоговейно поют для него молебен. То есть когда он стоял бы на коленях, сам бы я, сидя на стуле в епитрахили, читал над ним молитвы, а сестры благоговейно, едиными устами пели бы для него молебен. Верю, что за нашу любовь Бог бы творил много чудес. Много недужных по благодати Божией становились бы здоровыми. Приходит, например, один печальный отец и говорит: «У моего ребенка начинает кружиться голова, и он падает». Ты оставляешь ребенка в монастыре на некоторое время, все сестры преклоняют колена, как один дух, одна душа, одно сердце со старцем, и молитва всех изменяет состояние, совершает чудеса, поэтому я так этого ищу и пламенно желаю. Вот что я хочу сделать в монастыре. И вот что еще я хотел бы в монастыре. Я хотел бы выстроить большую и красивую церковь. Чтобы много людей могло прийти на исповедь, на причастие, прийти для молитвы, чтобы поучиться умной молитве. А еще у меня есть мечта, чтобы под храмом в подвал приходили афонские духовники, которые мощно, сильно занимаются мистическим богословием в пустыне, и учили умной молитве. Пусть они приезжают хотя бы на один день. Конечно, много таких, которые не хотят ни открываться, ни где-либо появляться. Мы можем и таких привозить на один день, а на другой они бы уезжали. Какое облегчение находили бы те души, которые страдают от страстей и других житейских невзгод! Монастырь должен со страхом Божиим принимать души и вдохновлять их не поучениями и проповедями, а молитвой, страхом Божиим и своим собственным примером. Это очень тонкая вещь. Например, приходит человек в монастырь. Мы его принимаем. Но вести длинные разговоры нет необходимости. Гостеприимство будет выражаться в церкви. Мы поведем гостя на молитву, на вечерню, на повечерие. Будем читать очень внятно, без ошибок, петь скромно, везде будет царствовать порядок и тишина.'
      cn: 修道院在我看来就像伊甸园：祈祷和受洗不会停止，老修道士皮奥菲里亚修士梦想着。神父们会轮班，新的会接替旧的，他们会不间断地为病人提供帮助……这将发生在一天中的任何时候，甚至在夜晚。为了确保有电话，夜以继日地有修女值班，以安慰那些因各种原因而生活绝望的人。用他们的话语，他们会将他们引向伟大的安慰者——基督，使他们的灵魂得到拯救，并充满来自上帝的恩典的天界之光。我想在修道院为来访者做受洗。当一个病人，尤其是经过考验之后，来到修道院时，我会为他受洗。然后，修女们会虔诚地为他唱赞美诗。也就是说，当他跪在地上时，我会坐在祈祷垫上，读经，而修女们会虔诚地，用同一口吻为他唱赞美诗。我相信，由于我们的爱，上帝会做许多奇迹。许多病人，由于上帝的恩典，会变得健康。例如，一个悲伤的父亲来到修道院，说：「我的孩子开始头晕，他摔倒了。」你把孩子留在修道院一段时间，所有的修女都会跪下，像一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，一个灵魂，
  - type: paragraph
    text:
      ru: Скажем и несколько назидательных слов, – прервал размышления старец Порфирий. – Предложим что-нибудь перекусить, горячий чай и тому подобное. Но везде будет царствовать молчание, а говорить будет пример. Больше всего гостя научит наш образ жизни. Не нужно изменять своего распорядка. Он больше получит пользы от него, чем от наших слов. Если у нас будет добрый порядок, а сами мы будем преданы Христу, то освятится весь монастырь. Это произойдет непринужденно, без какого-либо давления и усилий со стороны монахинь. Думаю, что это самая лучшая миссионерская работа. Очень скоро в монастырь начнут слетаться птицы. Они услышат звоночек и будут прилетать покушать. Будут сидеть во дворе и слушать вечерню. Это наши лесные друзья, которые будут прилетать, чтобы принять участие в нашей молитве.
      cn: 让我们再说几句劝诫的话——老方丈打断了沉思——可以准备一些小点心，热茶之类的东西。但到处都要保持安静，说话要以我们的行为为榜样。客人的生活态度会更多地从我们的生活方式中学到东西。不要改变自己的作息时间。他会从这种作息中得到更多的好处，而不是从我们的言语中。如果有良好的秩序，而我们自己又忠于基督，那么整个修道院都会被圣化。这会自然而然地发生，不需要任何压力或我们的努力。我认为，这可能是最好的传教工作。很快，修道院就会吸引来各种鸟类。它们会听到钟声，然后飞来觅食。它们会在院子里休息，聆听晚祷。这些是我们的森林朋友，它们会飞来，参与我们的祈祷。
- type: heading1
  text:
    ru: Христос Воскресе!
    cn: 基督复活！
  children:
  - type: paragraph
    text:
      ru: 'Сегодня ко мне в келию пришли несколько моих духовных чад, – как-то сказал отец Порфирий. – и мы три раза спели: Христос воскресе… Я пожелал им: «Желаю, чтобы Воскресение Господа нашего Иисуса Христа воскресило в ваших душах всякое благородное и прекрасное чувство. Чтобы оно привело нас к святости и победило ветхого человека «со страстьми и похотьми» (Гал. 5:24). Вот чего требует Господь. Поэтому мы желаем, чтобы Воскресение Его и благоволение Его помогло нам разгромить и умертвить ветхого нашего человека (Рим. 6:6) и стать достойными Его Церкви. Вот какой помощи Господней мы желаем. Величайшее чудо, сотворенное Христом, — это Его Воскресение. Никогда не будем забывать о нем. Многая лета!» Кто-то сказал, что сегодня все молится: земля, небо, звезды, благоухающие цветы, журчащие ручьи, прозрачные воды, поющие соловьи, порхающие бабочки — все поют Христос воскресе! Я настолько воодушевился, что громко кричал от радости: Христос воскресе! Такое пережил и я на Святой Горе. Была Пасха. Я в одиночестве поднялся на гору в сторону Афона на высоту около восьмисот метров. С собой у меня был Ветхий Завет. Я смотрел на голубое и чистое небо, на безбрежное море, конца которого не видно, на деревья, на птиц, на бабочек, на всю эту красоту, и в воодушевлении громко закричал: Христос воскресе! Произнося это, я, сам того не замечая, от жажды Божественного раскрыл руки. Так они и застыли. Я был как сумасшедший! Открыл Ветхий Завет и попал на следующие слова из Премудрости Соломона: «Боже отцов и Господи милости, сотворивший все словом Твоим и премудростию Твоею устроивший человека, чтобы он владычествовал над созданными Тобою тварями и управлял миром свято и справедливо, и в правоте души производил суд! Даруй мне приседящую престолу Твоему премудрость и не отринь меня от отроков Твоих, ибо я раб Твой и сын рабы Твоей, человек немощный и кратковременный и слабый в разумении суда и законов» (Прем.9:1—5). Вся моя душа погрузилась в эти Божественные слова. Я забыл о времени, меня потеряли... Послушайте дальше премудрого Соломона: «С Тобою премудрость, которая знает дела Твои и присуща была, когда Ты творил мир, и ведает, что угодно пред очами Твоими и что право по заповедям Твоим: ниспошли ее от святых небес и от престола славы Твоей ниспошли ее, чтобы она споспешествовала мне в трудах моих и чтобы я знал, что благоугодно пред Тобою; ибо она все знает и разумеет, и мудро будет руководить меня в делах моих, и сохранит меня в своей славе» (Прем.9:9—11). — Понимаете, какое значение имели для меня эти слова? – воскликнул старец Порфирий. – Что угодно пред очами Твоими и что благоугодно пред Тобою...'
      cn: '今天，几位我的精神儿女来到我的小屋，奥父彼罗菲里如此说道。我们三次唱诵：「基督复活了……」我祝愿他们：「愿基督复活的荣耀使你们的心灵中充满一切高贵和美好的情感。使它引导我们走向圣洁，并战胜『旧我』，『与激情和欲望为伍』（加拉太书 5:24）。这就是上帝的要求。因此，我们希望基督复活和祂的恩典能帮助我们摧毁『旧我』（罗马书 6:6），使我们配得上祂的教会。这就是我们所求的恩典。基督最大的奇迹就是祂的复活。永远不要忘记它。祝你们多寿！」


        有人说道，今天，大地、天空、星辰、散发着香气的花朵、潺潺的溪流、清澈的水、鸣叫的知更鸟、翩翩起舞的蝴蝶——它们都在唱：基督复活了！我如此激动，以至于大声喊道：基督复活了！我曾在圣山也经历过这样的时刻。那是复活节。我独自一人爬上山，前往阿芙洛狄特山，高度大约有八百米。我带着旧约圣经。我望着蔚蓝而纯净的天空，无垠的海洋，看不到尽头的树木，飞翔的鸟儿，翩翩起舞的蝴蝶，这一切的美丽，心中充满了激动，于是大声喊道：基督复活了！在喊这一句时，我无意中敞开了双手。它们就这样定格了。我像个疯子一样！我打开旧约圣经，读到箴言 9:1—5中的几句话：「上帝是造物主和赐福者，祂用言语创造了万物，并用智慧安排了人类，使人类统治祂所创造的万物，并在祂的圣洁和公正中治理世界，用智慧的判断来审判万物。赐给我坐在宝座上的上帝的智慧吧，不要抛弃我，因为我是祢的仆人和祢的童子，一个软弱、短暂且在理解审判和法律方面能力有限的人。」我的整个心灵沉浸在这神圣的话语中。我忘记了时间，我被遗忘了……请听箴言 9:9—11中智慧的所罗门的继续：「与你同在的是智慧，它知道你创造世界时所做的一切，知道你创造世界时所做的一切，知道你心中所想的一切，知道你通过诫命所要的。赐给我从圣洁的天空和你荣耀宝座上来的智慧吧，让我在劳作中得到帮助，让我知道你所喜悦的事物；因为智慧无所不知，无所不能，它会引导我做正确的事，保护我，使我在你的荣耀中得到保全。」——你们明白这些话语对我意味着什么吗？奥父彼罗菲里先生大声说道。——你知道这些话语对我意味着什么吗？——是的，我明白。——「你心中所想的一切，你心中所想的一切，你心中所想的一切，你心中所想的一切……」'
  - type: paragraph
    text:
      ru: Вот чего ищите, вот чем наслаждайтесь, вот чего жаждите. Сами того не заметив, вы полюбите Христа!
      cn: 寻找什么，享受什么，渴求什么，你们就将爱慕基督！
