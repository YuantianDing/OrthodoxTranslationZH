  text:
    ru: Я жаждал продолжить свой аскетический подвиг в любом месте, пусть даже в то время, когда я находился в центре Афин!
    cn: 我渴望在任何地方继续我的隐修圣德，在我身处雅典中心的时候也不例外！
  children:
  - type: paragraph
    text:
      ru: Но главным моим делом, с тех пор как я стал духовником, была исповедь. Я исповедовал бесконечными часами, днями и ночами, целыми сутками. Исповедовал либо в монастыре Святого Харалампия на Эвбее, либо в храме Святого Герасима, либо в монастыре Святого Николая, либо в Калисье, либо здесь, в монастыре. Даже когда болел, а болезней было много и были они продолжительные, хронические, я с любовью Христовой принимал те души, которые послал мне Бог. Я жаждал продолжить свой аскетический подвиг в любом месте, пусть даже в то время, когда я находился в центре Афин! Так, я не нашел ничего лучше, как спрятаться на холмах Турковунья. Там мы жили с родителями, с моей сестрой и племянницей в одном домишке из бетонных плит. Ночами мы работали в молчании и молитве. У нас были станки, на которых мы изготавливали на продажу футболки и свитера. На эти сбережения мы хотели построить монастырь. Еще мы делали ладан. Превосходный ладан, моего собственного изготовления, по моим рецептам, по моим пропорциям с пятьюдесятью ароматическими добавками. По запаху я различал и ладан, и остроту добавок. Своими пропорциями я исписал целую тетрадь. Целая тетрадь рецептов, которые я использовал, когда приготавливал для ладана ароматические вещества. Все ароматические вещества, которые у меня были, я выстроил по порядку. Около пятидесяти флаконов с различными веществами. Вот это была тайна! Все эти флаконы я знал. Я знал запах каждого флакона, его силу и остроту. Я знал, что из этого флакона нужно взять десять частей, из другого — две, или три, или одну часть, и приготовлял прекрасные составы, редкие. Все это я записывал в тетрадь, как уже говорил, но ее у меня украли. Я знаю, кто украл, но не хочу говорить, не нужно...
      cn: 但自从我成为神父之后，最重要的工作就是受洗。我连续数小时、数日数夜、甚至整夜地受洗。无论是圣哈拉姆普修道院的埃维亚岛、圣加拉西亚修道院、圣尼古拉修道院、卡利亚，还是这里，在阿提卡的修道院，我都受洗。即使生病，尤其是那些持续时间很长的疾病，我也怀着基督的爱继续接受受洗。我渴望无论在哪里，即使在雅典的中心，我也能找到继续我的隐修生活的方式。因此，我找到了一个更好的地方，那就是土耳其山丘。在那里，我和父母以及我的妹妹和侄女住在一个用混凝土板建造的小屋里。夜晚，我们在沉默和祈祷中工作。我们有机器，用以制作出售的T恤和毛衣。用这些积蓄，我们想建造一座修道院。我们还制作檀香。我自制的檀香，按照我的配方和比例，加上五十种芳香成分。通过气味，我可以辨别檀香和芳香成分的味道。我用这些配方在记事本上记录了整整一页。我用这些配方，当准备檀香的芳香成分时，我使用了整整一页的记事本。我将所有的芳香成分按照顺序排列。大约有五十个装有各种成分的瓶子。这就是秘密！我都知道这些瓶子的味道。我知道每个瓶子的力量和辛辣度。我知道从哪个瓶子里取十份，从哪个瓶子里取两份、三份或一份，然后制作出美妙的混合物，稀罕之物。我把这些记在记事本上，正如我所说的，但我的记事本被偷走了。我知道是谁偷走了，但我不想说，不需要……
- type: heading1
  text:
    ru: Поистине, я был простецом…
    cn: 果然，我原是个凡人……
  children:
  - type: paragraph
    text:
      ru: 'Я не знал ни мира, ни того, как нужно себя вести в обществе, был простым. О манерах общения я не имел никакого представления, потому что вырос в горах. Я пожил немного у своего крестного в Пирее, но и там сам себя обслуживал. Дочки его ставили мне пищу на стол, я кушал в одиночестве, спал на мансарде. Я не знал, как за столом держать вилку, ложку. Послушайте, я вам кое-что расскажу. Куда меня ни приглашали, я никуда не ходил. Но однажды меня пригласили послужить молебен у одной больной женщины, которая работала напротив поликлиники, недалеко от муниципалитета. Очень хорошая женщина, благочестивейшая. Но пока мы шли до ее дома, пока молились, прошло около часа, и мне настойчиво стали предлагать: — Садитесь за стол. — Нет, — отвечаю, — я не могу. Мне нужно идти. Ее муж говорит: — Мы понимаем это как знак пренебрежения к нам, потому что ты голоден. Батюшка, мы обидимся. Уважь нас. Вот и наша дочурка просит. У них была дочь. Они недавно поженились. Очень хорошая девочка. Тогда я принял предложение. Я прочитал молитву благословил стол, и мы сели есть. Маленькая дочурка увидела, как я ем, и говорит родителям: — Мам, он неправильно держит ложку. А они: — Молчи, молчи! Через несколько минут опять: — Он неправильно держит ложку. Ну что ты скажешь, что я, несчастный, испытал! Я посмотрел на них, как держат они, и исправился. Потом, не знаю, что мне положили, я стал есть вилкой. Малышка аж подскочила: — Он неправильно держит вилку. О, что я вынес! Я хочу вам просто привести пример, насколько я был тогда прост…'
      cn: 我不知道世界，也不知道如何在社会中举止得体，我是个普通人。关于社交礼仪，我一无所知，因为我是在山里长大的。我曾在我的教父家在皮雷住了些日子，但那里的我也都是自己照顾自己。他的女儿会把食物放在桌上，我独自用餐，睡在阁楼。我不知道如何使用餐叉和餐勺。听我说，我将给你讲讲。无论被邀请到哪里，我都不会去。但有一天，我被邀请去为一个生病的妇女做祈祷，她就在医院对面，离市政府不远。她是一个非常好的人，虔诚的人。但当我们走到她家的时候，祈祷的时候，已经过去了大约一个小时，他们不断地邀请我：「坐下吃饭吧。」「不，」我回答，「我不能。」我需要去。她的丈夫说：「这对我们来说是不尊重的，因为你饿了。牧师，我们会感到受伤的。尊重我们吧。她的女儿也这么说。她刚结婚不久。她是一个很好的女孩。于是我就接受了邀请。我诵读了祈祷文，祝福了餐桌，然后我们开始用餐。小女儿看到我用餐的样子，对父母说：「妈妈，他用餐叉的方式不对。」他们说：「别说了，别说了！」过了一会儿，又说：「他用餐叉的方式不对。」哎呀，我真是受够了！我只想给你们讲讲我当时是多么的简单……
- type: heading1
  text:
    ru: Трость преподобного Герасима
    cn: 托尔佐夫斯基修道院院长格里戈里·赫拉西莫维奇的修道生活与话语
  children:
  - type: paragraph
    text:
      ru: 'В районе Турковунья, где мы жили, местность изобиловала крутыми подъемами, – вспоминал старец Порфирий. – Я вставал очень рано, уходил в церковь Святого Герасима, а возвращался вечером. Дорога около нашего дома была очень трудной, очень обрывистой. Как-то утром я упал и сломал ногу. Было воскресное утро. Еще толком не рассвело, и вокруг стояла тишина. Мое оханье услышали какие-то люди, пошли и тотчас позвонили в «Скорую помощь». Приехала «Скорая помощь» и отвезла меня в больницу. Я сломал голень левой ноги. Все кости раскрошились. Боль была несносной. Когда мы приехали в поликлинику, меня из машины перенесли на кровать. Врачи решили наложить мне на ногу гипс. А народ ждал, когда я начну литургию. Им пришлось разойтись. Через пятнадцать дней, которые я провел в кровати, во время молитвы мой взгляд случайно упал на ногу. По благодати Божией вижу, что гипс был наложен криво. Тогда я стал просить врачей снять гипс Но профессор, узнав об этом, сказал в шутку: — Батюшка вместо того, чтобы смотреть за своим храмом, где он — компетентное лицо, хочет поправить нас. Хотя мы хорошо сделали свою работу и посмотрели ногу на рентгене. Что он, хочет помучить нас? Никто не предал этому значения. Я настаивал на том, чтобы они посмотрели мою ногу. Они не отзывались. Когда мне принесли обед, я не стал есть, сказав, что прошу отвезти меня на рентген. Я настаивал на этом потому, что если нога срастется неправильно, то останется такой навсегда. Профессор прислал мне ответ: — Пусть следит за своими священническими обязанностями! Его нога в порядке. Наступил вечер. Мне принесли ужин. Я снова не стал есть, настаивая на том, чтобы осмотрели мою ногу. На следующий день пришел профессор и стал говорить в сердцах: — Что это все значит, Геронда? Что это все значит, ты решил нас помучить? После долгих пререканий меня отвезли на рентген. Смотрят, действительно, гипс на ногу наложили криво, а нога к тому же уже срослась. Профессор стал смеяться. — Слышь, Геронда, — говорит, — ты слишком грешный. Теперь и я это понял. Сейчас увидишь, что тебе придется пережить! Мы должны сломать твою ногу и наложить гипс заново. И начали сильно бить по гипсу, чтобы он сломался. Я ничего не говорил, а только творил свою смиренную молитву. — А, так ты еще и замолчал? — говорит он мне. — Сейчас я отпущу тебе твои грехи. Наконец, они потянули и сняли гипс. Боль была страшная. Два врача держали мне ногу, а профессор кулаком стал сильно бить по голени, чтобы она сломалась. — Ну, батя, я отпущу тебе все твои грехи, а за это простятся грехи и мне.'
      cn: 在我们居住的图尔克维扬地区，那里地形多有陡峭的坡道——长老彼罗菲里回忆说——我常常很早就起床，前往圣加拉西亚教堂，晚上再回来。我家附近的小路非常陡峭。某天清晨，我摔了一跤，摔断了左腿。那是一个星期天的早晨，天刚蒙蒙亮，四周一片寂静。我的呻吟声被一些人听见了，他们立刻跑去叫了救护车。救护车来了，把我送到了医院。我摔断了左腿的脚踝。骨头全碎了，疼痛难忍。当我们到达诊所时，他们把我从车里抬到担架上。医生们决定给我包扎伤口。但人们却等着我开始做圣礼。于是他们只好散了。过了十五天，我在病床上度过了这段时间。在祈祷时，我的目光无意中落在了左腿上。在上帝的恩典中，我看见包扎的石膏包扎得不正。于是，我请求医生们取下石膏。那位教授开玩笑说：「神父，你不是应该关注教堂的事务，而是应该关注自己的职责。」尽管我们已经很好地完成了任务，并且已经通过X光检查了脚踝。他是不是想折磨我们？没有人对此表示重视。我坚持要求他们检查我的脚踝。他们没有回应。当他们给我送来了晚餐时，我没有吃，而是请求他们送我去X光检查。我坚持这样做，因为如果我的脚踝愈合不正确，那么它就会一直这样。教授回信说：「你应该关注你的圣职职责！」他的脚踝一切正常。到了傍晚，他们给我送来了晚餐。我又一次没有吃，坚持要求他们检查我的脚踝。第二天，教授来到我身边，开始大声责备我：「这是什么意思，赫罗纳德？这是什么意思，你打算折磨我们？」经过长时间的争论，他们把我送去了X光检查。他们发现，石膏确实包扎得不正，而且我的脚踝也已经愈合了。教授开始大笑：「赫罗纳德，」他说，「你太不虔诚了。现在我明白了。你将会经历这一切！」他们开始用力敲打石膏，试图让它断裂。我什么也没有说，只是默默地祈祷。他说：「你连说话都不肯说了？」「现在，」他说，「我将赦免你的所有罪孽。因为这个，我的罪孽也会被赦免。」
  - type: paragraph
    text:
      ru: 'Они ломали мне кость. Она срослась не до конца. Боль была несносная. Я стиснул зубы. Наконец, они сломали. Положили меня снова под рентген, вытянули ногу и поставили все прямо. Потом снова осторожно наложили гипс и отправили на свою кровать. Два-три месяца, не помню точно, я лежал ничком. Потом меня подняли и дали мне два костыля для ходьбы. А я не хотел их. Профессор говорит мне: — Возьми их, чтобы встать. Сколько можно в кровати валяться? Он не стал сильно настаивать на костылях, потому что я стал сам держать равновесие. Я боялся, что привыкну к костылям и потом не смогу без них ходить. Тогда профессор говорит мне: — Позаботься о том, чтобы купить себе трость. — Нет, — отвечаю, — она мне не нужна. — Ты — священник и не слушаешься? Послушайся, потому что иначе упадешь и поломаешь все свои кости. Тогда мне пришлось попросить свою сестру: — Купи мне трость. Мы — бедные, но мне нужно купить трость. Костыли я хочу бросить, они мне не нравятся. Было одиннадцать часов утра. Я при помощи костылей спустился в больничную церковь. Сестра моя собралась идти на улицу Эола покупать трость. Только она стала выходить, тут на тебе: одна женщина заходит в церковь, держа в руке трость. — Святой Герасим здесь? — спрашивает. — Да, детка, здесь, — отвечает ей церковница. — А где икона святого? — Да вот, здесь, — и показывает ей икону. Тогда эта незнакомая женщина падает у иконы и со слезами начинает так громко говорить, что мы все слышали: — Мой святой, я не знала тебя. И никогда не слышала о тебе. Я и имени твоего не слышала. Но ты сподобил меня своего посещения и попросил у меня ту трость, которую я купила в Иерусалиме, чтобы я принесла ее в твой дом. Вот она, я ее принесла, мой святой. Ты мне сказал: «Я хочу, чтобы ты завтра утром принесла мне трость!» Я не знала, где ты находишься, но расспросила и нашла. Мы с сестрой и церковницей сидели в стасидиях около свечного ящика. Она подошла к нам и сказала: — Что это было такое? Почему святой попросил у меня трость? Чего он хотел? И церковница отвечает: — Послушай, для чего святому трость. Ему самому она не нужна. Но и у святого тоже есть свой служитель, а служитель этот — вот этот священник, которого ты здесь видишь. Он сломал ногу и уже несколько месяцев тяжело страдает. Но сегодня он встал, и врачи велели ему взять трость. И вот сестра его уже готова была идти на улицу Эола за тростью. Так вот, бери трость у святого и неси ее его служителю. Женщина в умилении принесла трость и поцеловала мне руку. — Возьми ее, — говорит, — батюшка мой, и прости мне мои грехи. Я купила ее в Иерусалиме. Она — от Святого Гроба, Я приехала сюда из района Промбона, в конце улицы Патисьи. Там я живу. Там я увидела святого во сне. Я поблагодарил ее, взял трость и тут же стал ею пользоваться, отбросив костыли. Эту трость я сразу назвал тростью святого Герасима и очень ее полюбил. Я слежу, чтобы не потерять ее. Но она и чудотворна, потому что, когда у кого-нибудь болит где-то тело, я слегка хлопаю тростью по этому месту, и человек выздоравливает. Она и вправду чудотворная. Что за чудеса! Святой позаботился о мне, грешном, – удивлялся старец Порфирий. – Он как'
      cn: 他们打断了我的骨头。骨头没有完全愈合。疼痛难以忍受。我咬紧牙关。终于，他们打断了骨头。把我的腿重新放平，然后小心翼翼地包上石膏，然后送我回病房。大约两个月，我躺在病床上。然后他们把我扶起来，给了我两条拐杖以便行走。但我并不想用它们。教授对我说：「拿它们来，这样你才能站起来。你不能一直躺在床上。」他没有坚持让我用拐杖，因为我知道如何保持平衡。我害怕自己会习惯拐杖，然后无法在没有它们的情况下走路。于是教授对我说：「你得去买一根拐杖。」「不，」我回答说，「我不需要它。」「你是个神父，不听我的话吗？你得听我的，否则你会摔倒，然后会把所有的骨头都弄伤。」于是，我不得不向我的姐姐求助：「给我买一根拐杖吧。」我们虽然很穷，但我需要买一根拐杖。我想要的是拐杖，而不是那根我讨厌的拐杖。那时已是上午十一点。我用拐杖走下医院的教堂。我的姐姐准备去埃洛大街买拐杖。她刚一出门，就看到一个女人走进教堂，手里拿着拐杖。「圣葛拉西姆在这里吗？」她问道。「是的，孩子，他在这里。」教堂女执事回答道。「那么，圣人的雕像在哪里？」「就在那儿，」她指向雕像，「」于是，这位陌生的女人走到圣人的雕像前，跪下，哭着说：「我的圣人，我从未见过你。我从未听说过你。我甚至不知道你的名字。但你让我来见你，并让我从耶路撒冷买来这根拐杖。我把它带来了，我的圣人。你对我说：『明天早上，你得把拐杖带来！』我不知道你在哪里，但我还是找到了。我和我的姐姐以及教堂女执事坐在祈祷室里，围着蜡烛盒。她走到我们面前，问道：「发生了什么？为什么圣人要向我索要拐杖？圣人想要什么？」教堂女执事回答说：「你得知道，圣人为什么要拐杖。他不需要它。但他的仆人就是你，那位神父，你在这里看到的。」他因为骨折已经几个月躺在床上，痛苦不堪。但今天他站了起来，医生让他拿拐杖。我的姐姐已经准备好了去埃洛大街买拐杖。于是，这位女士带着圣人的祝福，把拐杖递给我，然后亲吻了我的手。「拿着它吧，」她说，「我的圣人，宽恕我的罪。」我是在耶路撒冷买的这根拐杖。它来自圣墓。我从普罗邦纳区的帕蒂西街来到这里。那里是我的家。在那里，我梦见了圣人。我感谢她，接过拐杖，立刻开始使用它，不再需要拐杖。我立刻给这根拐杖取名为圣葛拉西姆拐杖，并非常喜爱它。我总是小心地保管它，但它的确神奇。因为，当有人身体某个部位疼痛时，我轻轻用拐杖敲打那个部位，那人就会康复。它
  - type: paragraph
    text:
      ru: живой явился женщине, которая ни о святом не слышала, ни обо мне. Чудесные дела совершают святые, поэтому мы должны почитать их. И я почитаю святого Герасима, который исцеляет больных своею святостью и благодатью.
      cn: 上帝显现给一个从未听说过圣人，也从未听说过我的妇人。圣人行 miracles，因此我们应该尊敬他们。我尊敬圣格里沙莫，他通过圣洁和恩典治愈病人。
- type: heading1
  text:
    ru: « Господь дождит на праведных и неправедных…»
    cn: 上主降福于义人和不义的人…
  children:
  - type: paragraph
    text:
      ru: 'В церковь Святого Герасима при поликлинике приходило много людей поставить свечи, – вспоминал старец Порфирий. – Некоторые оставались на исповедь, другие просто просили молитвы, третьи ставили свечи, крестились и выходили. Приходили по разным причинам мужчины и женщины, юные и старые, образованные и простецы. Вокруг Омонии жили разного сословия люди. Раньше у нас был обычай: в праздник Богоявления ходить по домам и кропить их святой водой. В один год я тоже пошел освящать дома. Я стучал в двери квартир, мне открывали, я входил с пением: Во Иордане крещающуся Тебе, Господи... Придя на улицу Мезонос, вижу железную дверь. Открываю, захожу во двор, который был весь усажен мандариновыми, апельсиновыми и лимонными деревьями, и поднимаюсь по лестнице. Это была наружная лестница, которая вела наверх, а внизу был подвал. Поднимаюсь по лестнице, стучу в дверь, открывает женщина. Когда она открыла мне, я, как обычно, начал петь: Во Иордане крещающуся Тебе, Господи... Вдруг она меня резко останавливает. Между тем меня услышали другие, и справа и слева стали выходить из комнат девушки. «Понятно, попал я в дом терпимости», — подумал я. Женщина встала передо мною, чтобы не дать мне пройти. — Уходи, — говорит она мне. — Не подобает им целовать крест. Я поцелую крест, и ты уходи, пожалуйста. Тогда я принял суровый и грозный вид и говорю: — Я не могу уйти! Я — священник и уйти не могу! Я пришел все освящать, — Да, но им не подобает целовать крест. — Да мы и не знаем, кому подобает целовать крест: тебе или им. Потому что если бы Бог спросил меня и попросил Ему сказать, кто достоин целовать крест, девушки или ты, то, возможно, я бы ответил: «Девушки могут целовать крест, а ты — нет. Их души лучше твоей души». Тогда она немного покраснела. Я ей говорю: — Позволь девушкам поцеловать крест. Я подал им знак, чтобы они подходили. Я более мелодично, чем сначала, начал петь: Во Иордане крещаю-щуся Тебе, Господи... — потому что внутри меня была радость, что Бог устроил так, что я пошел и к этим душам. Все поцеловали крест. Все были ухожены, в разноцветных юбках, Я им говорю: — Чада мои, многая вам лета. Бог любит нас всех. Он — очень добрый и «посылает дождь на праведных и неправедных» (Мф. 5:45). Для всех нас Он — Отец, заботится Он обо всех. Мы только лишь должны позаботиться о том, чтобы познать Его, возлюбить Его и стать хорошими.'
      cn: 在位于诊所附近的圣加拉西亚教堂，很多人前来点蜡烛，长老波菲利耶回忆说。有些人留下来做忏悔，其他人只是请求祈祷，还有人点蜡烛、膜拜然后离开。男人和女人、年轻人和老人、受过教育的人和普通信徒都前来。奥莫尼亚周围住着不同阶层的人。以前我们有习俗：在圣诞节时挨家挨户走动，用圣水祝福房屋。我也有一次去祝福房屋。我敲门，唱道：在约旦河里受洗的你，主啊……我来到梅索诺斯街，看到一扇铁门。我开门走进院子，院子里种满了橙树、柚子树和柠檬树，然后我走上楼梯。这是外部楼梯，通往楼上，楼下是地下室。我走上楼梯，敲门，一个女人开了门。当她开门时，我像往常一样开始唱：在约旦河里受洗的你，主啊……突然她突然制止了我。这时，其他人也听到了，从右边和左边的房间里走出一些女孩。我想：「看来我走进了一个宽容之家。」我站在她面前，阻止她让我离开。——走吧，——她说。——他们不应当吻十字架。——我吻了十字架，你走吧。——不，我不能走！我是牧师，不能走！我来祝福所有房屋，——是的，但她们不应当吻十字架。——我们也不知道谁应当吻十字架：你还是她们。因为如果上帝问我，祂是否应当告诉我，谁值得吻十字架，是她们还是你，那么我可能会回答：「她们可以吻十字架，而你不能。她们的灵魂比你的灵魂好。」——好吧，让我让女孩吻十字架。我给他们一个手势，让他们过来。我比刚才更柔和地开始唱：在约旦河里受洗的你，主啊……因为我内心充满了对上帝的喜悦，祂安排我来到这些灵魂面前。所有人都吻了十字架。她们都打扮得漂漂亮亮，穿着五颜六色的裙子。我对他们说：——我的孩子们，你们有很多年了。上帝爱我们所有人。祂非常善良，祂「降下雨水给义人和不义的人」（马太福音 5:45）。对所有人来说，祂都是父亲，祂关心所有人。我们只需关心的是，要认识祂、爱祂并变得更好。
  - type: paragraph
    text:
      ru: Возлюбите Его и увидите, какими счастливыми вы станете. Они растерянно хлопали глазами. Их бедные души дрогнули. — Я очень рад, — говорю им в конце, — что Бог удостоил меня сегодня прийти сюда и окропить вас святой водой. С праздником! — С праздником! — ответили и они! Тогда я ушел. Это старец Порфирий рассказал с болью сердца.
      cn: 愿你爱他，然后你会看到自己有多么幸福。他们惊慌失措地眨着眼睛。他们可怜的灵魂颤抖了。——我非常高兴，——我以内心深处的喜悦对他们说，——今天上帝赐给了我来到这里的机会，用圣水浇灌你们的灵魂。圣诞快乐！——圣诞快乐！——他们也回答说！然后我离开了。这是长老彼罗菲里讲述时带着伤感的故事。
- type: heading1
  text:
    ru: Та молитва, которую я слышал, была величественна!
    cn: 那我听过的祈祷是多么庄严！
  children:
  - type: paragraph
    text:
      ru: 'Время от времени, не только в праздник Богоявления, люди по разным поводам приглашали меня домой совершить освящение воды, – вспоминал старец Порфирий. – Однажды со мной приключилось следующее. Была оккупация. Я находился в поликлинике. Пришел представитель Красного Креста, чтобы взять меня на освящение воды. — Вы должны, — говорю ему, — взять священника из церкви Святого Константина, это их приход. — Нет, пойдешь ты. На это есть причина, и хочешь ты или нет, а тебе придется идти на улицу Третьего Сентября! И мне, бедняге, не оставалось ничего иного, как только пойти за ним, прихватив с собой крест, наметку и рясу на выход. Когда мы пришли, я растерялся. Я оказался перед образованным народом, дамами, господами, перед ректором университета, преподававшим философию. Полагаю, что фамилия его Веис. Набравшись храбрости, я вошел внутрь и поздоровался. Но требник с собой я, неграмотный, не взял. — Будем совершать освящение воды, — говорю им. Меня пробрала дрожь, когда я увидел, как хорошо они одеты, что на подносах стоит десерт, и это во время оккупации! Я надел рясу, наметку, взял крест. Освящение начал без требника. Набрался мужества и все прочитал чисто, слово в слово. Потом стал произносить еще лучше, но смотрел лишь в чашу с водой. — Мир всем. Главы наша Господеви приклоним. Приклони, Господи, ухо Твое, и услыши ны, иже во Иордане креститися изволивый и освятивый воды; благослови всех нас, иже приклонением своея выи назнаменующих работное воображение; и сподоби нас исполнитися освящения Твоего причащением воды сея. И да будет нам, Господи, во здравие души и тела. Ты бо ecu освящение наше, и Тебе славу, и благодарение, и поклонение возсылаем, со Безначальным Твоим Отцем, и Пресвятым, и Благим, и Животворящим Твоим Духом... Я произнес это как архиерей. Совершив освящение, я не пошел их кропить — многие не любят этого, — а взял крест в руку и стал ждать, кто подойдет. Первым подошел министр, за ним — другие. Я сказал несколько пожеланий: «Бог да благословит, да просветит и да укрепит вас». Но я все время ощущал себя необразованным. Перед уходом я перекрестил их крестом, благословил и сказал: «Счастливо вам, чада!» А там были университетские профессора! — Эта молитва была величественна, — сказал господин ректор, — я получил большое удовлетворение. Я очень порадовался чину освящения воды, обрадовался тому, что ты прочитал молитвы правильно и к тому же наизусть. Ты богослов? Но ты сделал одну ошибку в Евангелии.'
      cn: 时间不时，不仅在圣诞节，人们出于各种缘由会邀请我到家中为水进行圣化，长老彼罗菲里回忆说。——有一次发生过这样的事情。当时正处于占领时期。我正在医院里。红十字会的一名代表来请我去为水进行圣化。——你必须，——我对他说，——去圣康斯坦丁教堂的神父，那是他们的牧师。——不，你必须去。有原因，无论你愿不愿意，你都得去第三街！而我，可怜的我，别无选择，只能跟着他去，带着十字架、记号和祭服。当我们来到时，我感到不知所措。我面前是受过教育的民众，女士们，先生们，大学校长，教授哲学。我想他的姓氏是韦伊斯。鼓起勇气，我走进去，打了招呼。但作为文盲，我没有带经书。——我们开始为水圣化，——我对他们说。当我看到他们穿着得多么体面，看到在托盘上摆着甜点，这在占领时期！我穿上祭服，记号，拿上十字架。圣化开始时，我没有经书。鼓起勇气，我完全正确地念诵了。然后，我念得更好了，但只看着托盘上的水。——愿你们所有人平安。我们的主啊，我们俯伏。主啊，垂听那些在约旦河受洗，为水圣化的，以及那些为圣化水而俯伏的人。愿你们所有人因你们的俯伏而被圣化。愿你们所有人因这圣水的圣化而得蒙圣化。愿主赐给你们健康的身体和灵魂。祢是我们的圣化，我们赞美祢，我们向祢致敬，我们向祢致敬，祢是无始无终的祢的父，祢的圣子，祢的善子，祢的活化子灵……我以主教的身份念诵了这段经文。圣化之后，我没有去给他们洒水——许多人不喜欢这样做，——我拿起十字架，等着谁会过来。第一个过来的是部长，然后是其他人。我对他们说了几句愿望：「愿上帝保佑你们，愿上帝指引你们，愿上帝加强你们。」但我一直觉得自己是个文盲。在离开时，我用十字架给他们祝福，祝福他们，并说：「愿你们幸福！」而他们中有大学教授！——这段祈祷是庄严的，——校长先生说，——我感到非常满意。我非常高兴为水圣化举行的仪式，高兴你正确地念诵了经文，而且是背诵的。你是神学家吗？但你犯了一个圣经中的错误。
  - type: paragraph
    text:
      ru: 'Ты прочитал «здрав стал», а там — «здрав бываше», то есть – выздоравливал…. — Благодарю, — говорю ему, — я необразован. Это Евангелие мы читаем в Неделю о расслабленном, когда мы вспоминаем о чуде у этой купальни. Евангелие там читается следующее: (В то время) «пришел Иисус в Иерусалим. Есть же в Иерусалиме у Овечьих ворот купальня, называемая по-еврейски Вифезда, при которой было пять крытых ходов. В них лежало великое множество больных, слепых, хромых, иссохших, ожидающих движения воды, ибо Ангел Господень по временам сходил в купальню и возмущал воду, и кто первый входил в нее по возмущении воды, тот выздоравливал, какою бы ни был одержим болезнью» (Ин.5:1—4). Я вам напомню и кондак этого праздника. Вот он: Душу мою, Господи,во гресех всяческих, и безместными деяньми люте разслаблену, воздвигни Божественным Твоим предстательством, якоже и разслабленнаго воздвигл еси древле, да зову Ти спасаемь: Щедрый, слава Христе державе Твоей... Хорошо бы этот кондак помнить и произносить как молитву, – закончил старец Порфирий.'
      cn: 你读了「健康安泰」，里面却有「健康过去」，也就是说，他曾经康复…… — 谢谢，——我对他说，——我文化不高。我们读的《圣经》是《怜悯者》周，那时我们想起在那温泉旁发生的奇迹。《圣经》里这样记载：（那时）「耶稣进了耶路撒冷。耶路撒冷城外，靠近羊门，有座名叫洗者打的澡，是按着犹太人之俗，用石头砌成的，里面可容纳五千人。里面有五口井。现在这些井都枯干了。从前这里有一个患水臌病的人，躺卧在井边，已经卧了三十一年。他听见许多人说：『耶稣从加利利来。』就喊着说：『耶稣啊，你若肯，必能叫我健康安泰。』耶稣听见他的话，就说：『你若愿意，就可以健康安泰。』他就说：『主啊，我把手放在你身上，我愿意了，叫我健康安泰吧。』耶稣说：『你立刻健康安泰了。』他就立刻健康安泰了。耶稣又说：『你的信救了你了。』他就起来，拿着拐杖走了。众人都看见了，就仰望耶稣。」——我再给你念念这个节日的赞歌。——这是它：主啊，拯救我的上帝，因一切罪恶，因无处可逃的罪孽，使我的灵魂恢复健康安泰，因你圣言的代祷，使我的灵魂恢复健康安泰，正如你从前使那患病的人恢复健康安泰一样，求你使我恢复健康安泰：慷慨的，基督的荣耀的……——老方济各，最好记住这个赞歌，把它当作祈祷来念，——老方济各总结道。
- type: heading1
  text:
    ru: Я созерцал Христа совсем как живого!
    cn: 我注视着基督完全像活的一样！
  children:
  - type: paragraph
    text:
      ru: 'Часто я приходил в великое умиление в церкви, я имею в виду церковь Святого Герасима, – вспоминал старец Порфирий. – Да, я слушал Евангелие и умилялся. Со мной это происходило по той причине, что я видел икону, Самого Христа. Был Великий Пяток. Мы совершали богослужение. Церковь была полна народу. Что там со мной случилось! Я читал Евангелие, и когда дошел до фразы: «Или, Или! лама савахфани? то есть: Боже Мой, Боже Мой! для чего Ты Меня оставил?» (Мф. 27:46) — то не мог закончить. Я не мог сказать: «Для чего Ты Меня оставил?» Меня наполнило умиление. Голос сорвался. Передо мною во всей своей полноте предстала трагическая сцена. Я увидел то Лицо, услышал Тот голос. Я вживую увидел Христа. Народ внизу стоял в ожидании. Я никак не мог продолжить. Оставляю Евангелие на аналое и возвращаюсь в алтарь, крещусь и целую святой Престол. Я вспомнил другой, более красивый образ. Нет, не красивее. Прекраснее Того образа нет. Я вспомнил Воскресение и тут же успокоился. Потом вышел Царскими вратами и сказал: — Простите меня, чада, я увлекся... Потом я взял Евангелие и прочитал его с начала. И в тот час вся церковь начала плакать. Это было нехорошо. Каждый может думать, о чем хочет. Но расслабляться нельзя, мы должны быть собранными.... – закончил старец Порфирий.'
      cn: 我常在圣加拉西亚大教堂感到极大的感动，老方济各回忆道。是的，我听福音书，感到感动。这发生在我的身上，是因为我看见了基督的圣像。那是伟大的星期五。我们正在做礼拜。教堂里挤满了人。那发生在我身上什么事！我读着福音书，读到：「或者，阿爸！父啊！为什么你离弃了我？」（马太福音 27:46）——我不能读完。我不能说：「为什么你离弃了我？」我感到极大的感动。声音哽咽了。在我面前，整个悲剧的场景展开了。我看见了那张脸，听到了那声音。我亲眼见了基督。教堂下面的人在等待。我无法继续。我把福音书放在讲台上，回到圣坛，受洗，亲吻圣主祭台。我记起了另一个更美丽的形象。不，不更美丽。没有比这更美的形象了。我记起了复活，顿时感到安慰。然后我从皇家大门出来，说：——请原谅我，孩子们，我走神了……然后我拿起福音书，从头开始读。就在那时，整个教堂的人都开始哭泣。这不太好。每个人都可以想什么就说什么。但放松是不行的，我们必须团结一致……老方济各结束了。
- type: heading1
  text:
    ru: О том, что делает любовь и Промысел Божий!
    cn: 基督之爱猎人：关于爱与上帝的旨意！
  children:
  - type: paragraph
    text:
      ru: 'Послевоенные годы были очень тяжелыми, и люди много трудились, чтобы выжить, – вспоминал старец Порфирий. – Я, как вам уже говорил, в те годы был в поликлинике. Из тех лет помню множество случаев. Послушайте об одном из них. Эсфирь было семнадцать лет. Она жила летом со своими родителями и братом в Бояти. У них был ухоженный сад, и они продавали овощи, фрукты. Как-то вечером мать послала Эсфирь неподалеку в один магазин купить керосина для светильника. Заметьте, что тогда не было электрического освещения. По пути домой Эсфирь встретила одного мальчика, своего одноклассника. Они разговорились об уроках. Стояли они за грузовиком. Мимо проходил брат Эсфирь и увидел, что они стоят, разговаривают. Он перетолковал это по-своему, потому что решил, что они говорят о чем-то плохом, и сказал об этом матери. — Эсфирь позорит нас, разговаривает на улице с мальчиком. Когда Эсфирь пришла домой, мать сильно отругала ее и побила. Нравы тогда были весьма строгими. Эсфирь сильно огорчилась. Она возмутилась такой несправедливостью и подозрениями брата. На другой день домой приехал отец, который был в отлучке. Он обошелся с ней по- другому, то есть с пониманием и по-хорошему. — Я этому не верю, — говорит он ей. — Пойдем-ка польем сад. Ты будешь сидеть и смотреть: где грядка будет уже полита, скажешь мне, и я стану поливать другую. Так и было. Но Эсфирь совсем не спала всю предыдущую ночь. Ее душили обида и несправедливость. Она дошла до отчаяния и решила покончить с жизнью. Когда они пошли с отцом в сад, у нее уже был план: взять какой-нибудь сельскохозяйственный яд и вечером после поливки тайком выпить его и умереть. Она думала: «Тогда я посмотрю, любят ли они меня?» Итак, она взяла яд, положила его себе в карман и стала ждать вечера, чтобы выпить его. Но трудный час не заставил себя ждать. Отец, ничего не подозревая, говорит ей: — Пойди-ка в конец сада и закрой воду. Она быстренько пошла. Ее не было видно. Вокруг не было никого. Отец был довольно далеко, и она, дрожа, сунула руку в карман. Вдруг она услышала шаги. Не успела и пошевельнуться, как видит, появляется перед ней какой-то незнакомый священник. Он здоровается с ней и говорит: — Эсфирь моя, знаешь ли ты, как прекрасен рай! Свет, радость, веселие. Христос — весь свет, Он всем источает радость и веселие. Он ожидает нас в иной жизни, чтобы подарить нам рай. Но есть и ад, который — весь тьма, горечь, тоска, мучение и стенание. Если возьмешь то, что у тебя в кармане, то пойдешь в ад. Так выбрось это сейчас же, чтобы не лишиться нам с'
      cn: 二战后的岁月非常艰难，人们努力生活，老修道士波菲里耶回忆道。——我像之前已经告诉过你们的，那时我在诊所工作。——我记起许多这样的事。——请听一个故事。——埃斯菲耶十七岁。她夏天和父母以及弟弟住在博雅特。他们有一个整洁的花园，卖蔬菜和水果。——有一次，母亲派埃斯菲耶到附近的一个商店买煤油灯的煤油。——当时没有电灯。——路上，埃斯菲耶遇到了一个同学，她的同班同学。他们聊起功课。——他们站在拖拉机旁边。——埃斯菲耶的弟弟看到了他们，认为他们在说些什么不好的事情，于是告诉了母亲。——埃斯菲耶侮辱了我们，和一个男孩在街上聊天。——当埃斯菲耶回到家时，母亲狠狠地责骂了她，并打了她。——那时的风气很严苛。——埃斯菲耶非常难过。——她对这种不公正和弟弟的怀疑感到愤怒。——第二天，父亲回来了，他当时在外出差。——他对待她的方式不同，即以理解和温柔的态度。——「我不相信，」她对他说，「我们去浇园子吧。——你坐在那里，告诉我哪个菜园已经浇好了，我再浇另一个。——就这样做了。——但埃斯菲耶整个晚上都没有睡觉。——她的心被怨恨和不公压抑着。——她达到了绝望的地步，决定结束自己的生命。——当他们去园子时，她已经有了计划：拿一些农用毒药，晚上在浇完之后偷偷喝下去，然后死去。——她想：「这样我就可以看看他们是否爱我。」——于是她拿了一些毒药，把它放在口袋里，等着晚上喝下去。——但困难的日子没有等来。——父亲什么也没怀疑，对她说：「去园子的尽头，关上水闸。」——她迅速地去了。——她看不见任何人。——园子很远，她颤抖着把一只手伸进口袋。——突然，她听到了脚步声。——还没来得及动一下，她就看到一个陌生的神父出现在她面前。——他向她打招呼，并说：「埃斯菲耶，你知道天堂是多么美丽吗？——光明、快乐、欢乐。——基督就是光明，他向我们所有人提供光明和欢乐。——他期待着在另一个世界中与我们相遇，以给我们天堂。——但也有地狱，那里是黑暗、痛苦、忧伤、折磨和哀号。——如果你拿你口袋里的东西，你就会去地狱。——所以现在把它扔掉吧，以免失去我们。」
  - type: paragraph
    text:
      ru: 'тобой радости рая. Сначала Эсфирь растерялась, но вскоре опомнилась. Когда уже, сама того не заметив, выбросила яд, говорит священнику: — Постойте, я позову отца, чтобы и он вас увидел. Она убежала в сад, чтобы найти отца, и скрылась в высокой кукурузе. Нашла его и говорит: — Отец, пойдем быстрее, ты увидишь священника, который пришел к краю нашего сада! Но когда они пришли на то место, где должен был ждать священник, там уже никого не было. Долгое время Эсфирь не могла понять того, что с ней произошло в тот вечер. Она не могла объяснить исчезновение священника и хотела его найти. Он спас ей жизнь. Каждую зиму вся их семья приезжала в Афины. Эсфирь часто ходила к своей крестной, которая была женщиной очень набожной, и жила у нее подолгу. У крестной был обычай привечать у себя дома богословов, священников и монахов. Однажды, когда Эсфирь пришла к своей крестной, в гостиной сидел гость. Эсфирь не знала, что это был за гость. В какой-то момент крестная приходит на кухню и говорит Эфи: — Эфи, приготовь десерт и кофе и принеси это в гостиную для гостя. Эсфирь приготовила. Но немного задержалась, и, когда уже понесла это в гостиную, крестная ее опередила и говорит ей: — Не этот поднос. Возьми серебряный, потому что встреча — официальная. Эсфирь вернулась на кухню, поменяла поднос и принесла его в гостиную. И что же она видит! Поднос выпал у нее из рук. Она видит того самого священника, который в тот трудный для нее вечер появился у них в саду. — Я — отец Порфирий, — говорю я ей с улыбкой. Так мы познакомились с Эсфирь и с тех пор стали большими друзьями. Она создала семью, и у нее было много детей. Бог благословил ее. Видите, какие способы использует Бог, чтобы спасти человека?'
      cn: 上帝是吾等的快乐和乐园。起初，以斯帖感到惊慌失措，但很快她就恢复了镇定。当她不知不觉中投毒时，她对祭司说：「等等，让我叫父亲过来，让他也看看你。」她逃到花园，去找父亲，然后躲进了高高的玉米地里。她找到父亲，说：「父亲，快点，你看到那个祭司，他站在我们花园的边缘！」但当他们到达祭司等待的地方时，那里已经没有人了。以斯帖很长一段时间都无法理解那天晚上发生了什么。她无法解释祭司的消失，想要找到他。他救了她的命。每年冬天，他们全家都会去雅典。以斯帖经常去她养母家，养母是一个非常虔诚的女人，她在那里住了很久。养母有一个习惯，就是在家招待神学家、祭司和修女。有一天，当以斯帖去她养母家时，客厅里坐着一位客人。以斯帖不知道他是谁。过了一会儿，养母走进厨房对以斯说：「以斯，去厨房准备甜点和咖啡，然后把这送到客人的房间。」以斯帖准备好了。但她耽搁了一会儿，当她正要把这送到客人的房间时，养母已经超过了她，并对她说：「不是这个托盘。拿那个银质的，因为这是正式的接待。」以斯帖回到厨房，换了托盘，然后把它送到客人的房间。她看到什么了！托盘从她的手中滑落。她看到那个在她困难的晚上出现在他们花园里的祭司。「我是波菲利修斯的父亲，」她笑着对她说。就这样，我们认识了以斯帖，从此成了好朋友。她建立了家庭，并有很多孩子。上帝用各种方式拯救了她。
- type: heading1
  text:
    ru: Храм Святителя Николая в Калисье (1955—1979)
    cn: 教堂圣尼古拉在卡斯莱（1955—1979）
  children:
  - type: paragraph
    text:
      ru: 'Какое-то большое горе, какие-то великие трудности вынуждали их идти проселочной дорогой к святителю Николаю. Больше двадцати лет мы наслаждались безмолвием! В конце концов, Бог исполнил мое желание потрудиться в учреждении, – рассказал старец Порфирий. – В поликлинике я провел тридцать три года. Но было у меня еще одно сокровенное желание — найти где-нибудь участок земли и построить монастырь. Я искал и, наконец, нашел церковь Святителя Николая в Пендели. Это было подворье Пендельского монастыря. И вот, однажды я по благодати Божией приехал туда. Церковка была видна издалека. Я подошел к ней и зашел внутрь. Она была умилительной, старинной, с немногими иконами. Во дворе — я увидел несколько маленьких закопченных келий. Начало смеркаться. Я был один. В Афины вернуться было уже невозможно. Я лег спать прямо в церкви. Скоро послышался характерный удар. Он исходил от стены, которая была у меня над головой. Там висела икона святителя Николая. Удар был от иконы. Я почувствовал, что святой желает, чтобы я поселился здесь. Будучи монахом, я понимал, что те монахи, которые жили в миру одни, погибали. Тогда привез сюда своих родителей, сестру и племянницу. Там у нас было безмолвие. Жили мы очень хорошо, пускай и в первобытных бытовых условиях. В пустыне мы поселились более чем на двадцать лет. Это была настоящая пустыня. Весь район вокруг Святителя Николая утопал в зелени. Сосны старые и молодые, платаны, кусты везде, чабрец благоухал на всю округу, из трещин в скалах прорывались цикламены, анемоны и другие дикие цветы, каждый из которых распускался в свое время. Это был рай, такая красота! Там я хотел построить монастырь, – вспоминал старец Порфирий. – Но Бог этого не позволил. Церковь Святителя Николая находится недалеко от Пендели, но тогда не было дороги. Нужно было идти пешком или трястись на ослике около часа по труднопроходимой дороге, а потом еще минут двадцать карабкаться по крутой козьей тропке, чтобы оказаться у церкви Святителя Николая, которая была построена на одном из скалистых холмов. Потихоньку мы протоптали тропинку, чтобы было удобнее передвигаться и носить все, что было необходимо для жизни, чего нам не давал огород. Мне очень понравился огород. Я купил ручной мотоблок, чтобы можно было лучше его обрабатывать. В огороде было все: помидоры, баклажаны, кабачки, лук, чеснок и многое другое. Моей великой любовью были деревья. Радостно было на них смотреть. Я посадил четыреста деревьев: грецкий орех, алычу, груши, яблони, персики, миндаль, фундук, мушмулу, гранатовые'
      cn: 如何巨大的忧伤和艰巨的困难驱使他们走上了通往圣尼古拉修道院的乡间小路。我们享受了长达二十多年的宁静！最后，上帝应允了我的愿望，去教会机构工作——长老普罗菲利耶夫讲述了。他在诊所工作了三十三年。但他还有一个隐秘的愿望——在某个地方找到一块土地，建造一座修道院。他寻找着，最终找到了圣尼古拉修道院的教堂。这是 Pendeli 教堂的附属修道院。于是，一次在圣灵的恩典中，他来到了那里。教堂从远处就能看见。他走近，走进去。教堂令人感到温馨，古老，只有几幅画像。在院子里，他看到了几间破旧的小茅屋。天色渐晚。返回阿提卡已经不可能。他就在教堂里睡下了。不久，传来熟悉的敲击声。它来自他头顶上方的墙壁。那幅圣尼古拉的画像在发出声音。他感到圣人希望他在这里定居。作为修道士，他明白，那些在世时独自生活的人会死去。于是，他把父母、妹妹和侄女带到了这里。这里很宁静。我们过得很好，尽管条件非常原始。我们在荒漠中住了超过二十年。那是一个真正的荒漠。周围圣尼古拉教堂的地区被绿意盎然的植被所覆盖。老树和幼树，棕榈树，灌木丛，百里香散发出香气，从岩石裂缝中冒出的风信子、风信子和其他野生花卉，每一种都在适当的时候绽放。那是一个乐园，如此的美丽！他想在这里建造一座修道院——长老普罗菲利耶夫回忆道。但上帝不允许。圣尼古拉教堂距离 Pendeli 不远，但那时没有道路。需要步行一小时或骑驴大约半小时，才能到达圣尼古拉教堂，那座建在岩石山丘上的教堂。我们慢慢地开辟了一条小路，以便更方便地移动和携带生活所需的一切，而这些在园子里是得不到的。我非常喜欢园子。我买了一台手扶拖拉机，以便更好地耕作它。园子里有各种蔬菜：西红柿、茄子、黄瓜、大蒜、洋葱和其他许多东西。我的最大爱好是树木。看着它们很高兴。我种了四百棵树：核桃、苹果、梨、苹果树、李子、杏仁、榛子、无花果、石榴。
  - type: paragraph
    text:
      ru: 'деревья. Я очень любил трудиться. Поэтому я всегда говорил, говорю и сейчас: «Трудись как бессмертный и живи как готовый к смерти». То есть будь тебе хоть девяносто лет, сажай ореховые деревья, инжир или маслины. Неужели не будет у тебя прыгать от радости сердце, когда будешь сажать! Даже если кто-нибудь, проходя мимо и думая, что ты устаешь, скажет: «О, несчастный!» Чтобы деревья не болели, мы окуривали их серой и обрабатывали медным купоросом. С мешком за плечами я приходил из пендельских питомников. Ухаживал за молодыми деревцами. Приходилось нанимать и рабочих, потому что времени у меня было мало: я еще работал в поликлинике. Моим долгом было рано утром уже находиться в церкви Святого Герасима, поэтому в Афины я уезжал с вечера. Но когда кто-нибудь приходил на беседу и мы засиживались допоздна, я уходил от церкви Святителя Николая среди ночи. Воды для сада у Святителя Николая было предостаточно. Внизу был овраг с источником. В овраге росло много платанов. Там я поставил насос, чтобы он поднимал воду на холм, где я соорудил резервуар, в который собирал воду. Вода к тому же была еще и питьевой. Летом, когда хотелось холодненькой водички, а холодильника у нас не было, я поехал на Эгину и купил там кувшинчик с длинным горлышком, чтобы кувшин сохранял воду холодной. Еще я разводил на продажу цыплят. Арендовал кусок земли у Пендельского монастыря, напротив обсерватории, и держал там около тысячи кур. Больше было нельзя, потому что земли было мало. У меня была мысль построить монастырь, как я вам говорил, поэтому искал способы заработать деньги. В Калисье мы были отрезаны от мира, поэтому хотели там, в пустыне, слушать какую- нибудь афинскую радиостанцию, которая транслировала службу или Божественную литургию, а также по временам новости, чтобы знать, что творится в мире, и молиться. Тогда я решил сделать радиоприемник своего собственного изобретения. Антенну я поместил на сосне, высота которой была пятнадцать метров, а провод прикрепил к стене церкви и обмотал вокруг дикой груши. У этого первобытного радио не было кнопки, чтобы выключить его. Работало оно круглые сутки без перерыва. Но я приглушил звук, чтобы он нам не мешал. Когда я не был обязан ехать в церковь Святого Герасима, тогда служил у Святителя Николая. Постепенно в церковь начали приходить люди, приходили и на исповедь. Все мы стали одной большой семьей, семьей из Калисьи.'
      cn: 树木。我非常热爱工作。因此，我总是说，现在仍然说：「作为不死者工作，作为即将死去者生活。」也就是说，即使你已经九十多岁了，也要种核桃树、无花果树或橄榄树。你的心会不会因为种树而欢腾呢？如果有人路过，看到我似乎疲惫不堪，便说：「可怜的人啊！」为了不让树木生病，我们会用硫磺熏它们，用漂白粉处理它们。我总是背着工具箱去潘德尔的苗圃。我会照顾那些幼苗。有时我还需要雇人，因为我没有太多时间：我还在诊所工作。我的职责是每天早晨就去圣加拉帕斯教堂，因此我晚上才会去阿提卡。但如果有人来参加聚会，我们聊得很久，我就会在圣尼古拉教堂的午夜离开。圣尼古拉教堂附近有充足的水源。下面有一个峡谷，有一个泉眼。峡谷里长满了棕榈树。我在峡谷里安装了一个水泵，将水抽到山顶，那里有一个储水罐，我收集了水。水还用作饮用水。夏天，当我想喝凉爽的水时，而我们没有冰箱，我就会去埃吉尼岛，买一个带长嘴的水壶，这样水壶就能保持水的凉爽。我还养了鸭子。我在潘德尔修道院附近租了一块地，靠近天文台，养了大约一千只鸡。因为土地有限，我有了建造修道院的想法，因此我一直在寻找赚钱的方法。我们在卡萨莱被世界隔绝，因此想在荒野中听一听来自阿提卡的广播电台，播放圣礼或圣神礼，以及偶尔的新闻，以便知道世界上的事情，并祈祷。于是，我决定自己制作一个收音机。我将天线安在一棵高十五米的棕榈树上，电线缠绕在野生李树上。这个原始的收音机没有开关，可以全天候不间断地工作。但我会降低音量，以免它打扰我们。当我不需要去圣加拉帕斯教堂时，我就会在圣尼古拉教堂做弥撒。慢慢地，人们开始来教堂，有些人还来忏悔。我们都成了卡萨莱大家庭的一部分。
- type: heading1
  text:
    ru: Все прославили Бога об этом чуде!
    cn: 众人赞美了上帝这奇迹！
  children:
  - type: paragraph
    text:
      ru: 'Время от времени по разным причинам приходили и другие люди, – вспоминал старец Порфирий. – Какое-то большое горе, какие-то трудности вынуждали их идти проселочной дорогой к Святителю Николаю. Наконец, однажды приходит женщина со своим мужем и четырьмя детками. Люди молодые, женаты недавно, и вначале они не хотели ребенка. Потом решились: «Сделаем». И при первых родах — двойня. Потом вторые роды, и снова двойня. Стало у них четверо детей. Итак, они пришли туда, и молодая женщина, ей было тридцать лет, говорит мне: — Батюшка, я сильно страдаю, я нездорова… Когда она говорила, я внимательно смотрел на нее, потом положил руку вниз шеи. — Здесь, — говорю ей, — чувствуешь уплотнение? — Да, — говорит она. — И тебя одолевает печаль, которая уже доводит свое дело до конца. То есть вначале ты ощущаешь какую-то зажатость, а потом к тебе приходит скорбь и ты не можешь даже пальцем пошевелить. Ты еле двигаешься, можешь даже смеяться, но внутри себя ты переживаешь это состояние? — Да, — подтвердила она. Итак, я все ей описал прекрасно! Она благодарила. Потом я снова положил ей руку на шею. — Не думай, — говорю, — что у тебя что-то есть. Ничего этого у тебя нет. Рука моя лежала там, и вдруг я ей говорю: — Вот, все у тебя прошло! Потому что я увидел. Я увидел, что в шее ничего у нее не было. Она мне говорит: — Все прошло! Какая радость! Я сказал ей: — Встань на колени… Одну руку я положил на шею, а вторую – на затылок. Я стал творить Иисусову молитву. Она воскликнула: — Ах! — Ну, наконец! – Говорю. – Иди, ладно, а то другие ждут…. Они с мужем искренне прославили Господа… Вот такую историю рассказл старец Порфирий.'
      cn: 有时候因为各种原因，其他一些人也会前来，——长老波菲里奥回忆道。——有些重大的忧伤，一些困难，驱使他们走小路去见尼古拉大司祭。终于有一天，一个女人带着她的丈夫和四个孩子前来。他们年轻，最近才结婚，起初他们并不想要孩子。后来他们决定：「我们来试试。」然后第一次分娩——双胞胎。接着第二次分娩，又是双胞胎。于是他们有了四个孩子。就这样，他们来到了那里，一个三十岁的年轻女子对我说：「父啊，我病得很厉害……」她说话的时候，我仔细地看着她，然后把手放在她的脖子上。「你感觉到有紧绷吗？」我问她。「是的，」她回答。「你感到一种压倒性的忧伤，它正将事情推向尾声。起初你会感觉到一种紧绷，然后忧伤会涌来，你甚至无法动一下手指。你勉强移动，甚至可以笑一笑，但内心你正经历这种状态？」她回答说：「是的。」于是，我详细地向她描述了这一切。她表示感谢。然后我又把手放在她的脖子上。「不要想，」我说，「你身上没有什么。我的手在那里，然后我告诉她：『看，一切都过去了！』因为我看到了。我看到了，她的脖子上并没有什么。她对我说：『一切都过去了！』多么的快乐！我说：「跪下……」我一只手放在她的脖子上，另一只手放在她的后脑勺上。我开始诵念耶稣的祷文。她喊道：「啊！」「好了，」我说，「现在你可以走了，否则其他人会等得不耐烦的……」他们夫妇真诚地赞美了上帝……这就是长老波菲里的一个故事。
- type: heading1
  text:
    ru: Чудесный улов
    cn: 奇妙的捕获
  children:
  - type: paragraph
    text:
      ru: 'Сай-Баба (мы сократили эту главу) Однажды в Ксилокастро ко мне пришли родители человека по имени Костас, – вспоминал старец Порфирий. – Он был последователем Сай-Бабы. Этот Баба создал новую религию. Люди верят, что он — новый Христос, который пришел в мир, чтобы спасти его и привести к истине. Говорят, что он — «новый бог». Сейчас Сай-Баба жив, он женат, у него жена и двое детей. Внизу фотографии видно много молодых людей, которые следуют за ним. Многие из них образованные. Как они, образованные люди, попали туда? На другой странице они целуют ему ноги. «Тот Христос — то есть истинный — теперь устарел» — так он говорит им. Он говорит, что теперь иное время. Все изменяется. Это похоже на миф. Может, Сай-Баба сумасшедший. Говорят, что он собрал много денег. Я вам расскажу и о другом похожем случае Однажды один капитан третьего ранга повез меня в Оропос, на побережье, – рассказал старец Порфирий. – Мы вышли на волнорез. Там рыбачил один мужчина. Я говорю капитану: — Пойди-ка принеси мне одну рыбу из тех, что поймал этот человек. Но рыбак отвечает: — Корзина пуста. С утра рыбачу, ничего не поймал. Уходите, оставьте меня в покое... Я ему говорю: — Закинь удочку в море. — Уходите! — говорит он огорченно. Мы собирались уже уходить. Как только рыбак закинул удочку в море, сразу почувствовал, что кто-то клюнул. Он вытянул большую рыбу, трепыхавшуюся на крючке, и стал звать нас: — Не уходите! Идите сюда, не уходите. Я поймал рыбу! Капитан сказал: — Я знаю, батюшка, как это произошло. Это произошло, чтобы я поверил, что вы — Божий, и чтобы в это поверил рыбак. До сих пор я верил в нового Христа — в индийского Сай-Бабу, а теперь верю в истинного.'
      cn: 生平与言语 有一次，我到克西洛卡斯特去，老修士波菲里乌斯回忆说，有个叫科斯托斯的人来找我，他是萨伊-巴的追随者。这个萨伊-巴创立了一种新的宗教。人们相信他是新基督，来到世间，拯救世人，引领他们归向真理。据说他就是「新神」。现在萨伊-巴还活着，他结婚了，还有妻子和两个孩子。照片下边可以看到很多年轻人追随他。他们当中很多人受过教育。这些受过教育的人是怎么被拉拢到他身边的？在另一页上，他们跪下来亲吻他的脚。他说：「那真正的基督已经过时了。」他声称现在是另一个时代，一切都在变化。这听起来像一个神话。也许萨伊-巴是个疯子。据说他聚敛了很多钱财。我还要告诉你另一个类似的情况。 有一次，一位三等海军上校带我去奥罗普斯，那里靠近海岸，老修士波菲里乌斯回忆说。我们来到一个波涛汹涌的海滩。那里有个渔民在捕鱼。我说：「去帮我拿一条鱼，那个渔民捕到的。」但渔民回答说：「鱼篓里空空的。」从早上开始，他一直在捕鱼，什么也没捕到。你们走吧，别烦我了……我说：「把鱼钩扔进海里。」他不耐烦地说：「走开！」我们正要离开。但渔民一扔鱼钩，立刻感觉到有人在咬钩。他拉出一条挣扎着的鱼，然后喊道：「别走！来吧，别走。」我捕到了鱼！海军上校说：「我知道，牧师，这是怎么回事。这是为了让我知道你是神的，也让渔民相信你是神的。」我以前一直相信印度的萨伊-巴是真正的基督，但现在我信真正的基督了。
- type: heading1
  text:
    ru: Мы видели Божественный свет долгое время!
    cn: 我们曾长时间看见上帝之光！
  children:
  - type: paragraph
    text:
      ru: 'Больше всего времени у меня занимала исповедь, когда я служил у Святителя Николая в Калисе, – рассказал старец Порфирий. – Но, конечно, и для молитвы было много времени, особенно вечером. Я вам об этом кое-что расскажу. Однажды, было это вечером, мы договорились вдвоем с сестрой пойти помолиться в церковь Святителя Николая. Договорились сначала поужинать и, когда все улягутся, пойти в церковь тайком. Прикрыли дверь и начали молитву. Господи Иисусе Христе... В скором времени нас залил свет, Божественный свет. Мы продолжали: Господи Иисусе Христе... — и чувствовали радость, такую неизреченную радость. Мы видели Божественный свет долгое время! — Несколько часов…А потом, когда он постепенно ушел, мы продолжили молитву: Господи Иисусе Христе, помилуй мя. Потом вернулись в келию. Мать не спала и ждала нас. Лишь только мы открыли дверь, она говорит: — Где вы были? Поэтому вы уложили меня спать? Думаете, я вас не видела? Я видела вас из окна. Я видела все. Видела свет, который спустился с неба и вошел в церковь. Я смотрела на него и плакала. Вот, мои глаза, мокрые от слез. Старушка была расстроена, но, благочестивейшая, она увидела свет, хотя дверь была и заперта. Свет этот наполнил церковь. В другой раз, – вспоминал старец Порфирий. – мы жили тогда в Пендели, был великий праздник, Пасха или Рождество, не помню, старушка поднялась и говорит: — Пойду-ка я в храм Святителя Николая. Кажется мне, что лампады там погасли. Полчаса ей ходьбы туда и столько же на обратную дорогу. Пришла и видит церковь, всю залитую светом, и лампады зажженные.'
      cn: 老父保尔西尔回忆说，在他在尼古拉大司祭的教堂服侍时，他花费了大量时间在祈祷上，尤其是在晚上。当然，为祈祷也留出了很多时间。他将要讲述一些事情。有一天，那是晚上，他和一位姐妹约定一起去圣尼古拉教堂祈祷。他们先去吃晚饭，然后等大家都睡下后，悄悄地去教堂。他们锁上了门，开始祈祷。主啊，耶稣基督……不久，他们被一种神圣的光芒包围了。他们继续祈祷：主啊，耶稣基督……他们感到一种无法言喻的喜悦。他们看到这种神圣的光芒持续了很长时间！——几个小时……然后，当这种光芒逐渐消失时，他们继续祈祷：主啊，耶稣基督，怜悯我吧。然后他们回到小屋。老太婆没有睡，她在等着他们。他们一开门，她就问：「你们去哪儿了？你们是不是把我一个人丢下睡觉了？」她从窗户里看到他们，看到从天而降的光芒进入了教堂。她看着那光芒，流下了眼泪。这就是我的眼睛，因为泪水而湿润。老太婆感到很伤心，但她是一个虔诚的人，她看到了那光芒，尽管门是锁着的。这种光芒充满了教堂。另一次，保尔西尔老父回忆道，那时他们住在潘德尔，那是伟大的节日，可能是复活节或圣诞节，他忘了。老太婆起床说：「我要去圣尼古拉教堂看看。」她觉得那里蜡烛已经熄灭了。她走了半小时去那里，又走了同样长的时间回来。她回来时，看到教堂被光芒照亮，蜡烛已经点燃了。
- type: heading1
  text:
    ru: Святая обитель Преображения в Милеси (1979—1991)
    cn: 圣母马利亚大修院（1979—1991）
  children:
  - type: paragraph
    text:
      ru: 'Я хотел, чтобы монастырь был таким прибежищем, куда бы приходили больные и страждущие, где они находили бы утешение, укрепление и исцеление. Я вынашивал план построить небольшой монастырь Построить небольшой монастырь — поистине это было моей давней мечтой, – смиренно сказал отец Порфирий. Причем такой монастырь, чтобы он стал духовной школой, где бы освящались и возделывались души, где бы непрестанно прославлялось имя Божие. Я хотел, чтобы это был такой центр, куда бы приходили больные и страждущие, где они находили бы утешение, укрепление и исцеление. Когда мы с сестрой и племянницей жили в районе Турковуньи, годами работали за станками. Да, шили футболки. Деньги мы собирали для этой цели. Мы очень экономили на пище, одежде, на всем. Первую недвижимость мы купили на эти деньги. Потом деньги стали приносить и приносят до сих пор прихожане, оценившие этот труд. Стали они принимать и личное участие. Годами я искал подходящее место. Я никогда не пользовался при приобретении недвижимости услугами посредников. Ездил в разные места. Я хотел, чтобы, с одной стороны, это место было защищено от ветра, а с другой — чтобы там был хороший вид. По своему обычаю, молился Богу, чтобы Он наставил меня. Я хотел, чтобы в этом меня удостоверила сама благодать Божия. Все время творил молитву Господи Иисусе Христе... И вот, Бог указал мне для постройки обители знакомое место в Милеси, на холме. Один пастух сказал мне, что место это называется Агиа-Сотира. Мне оно понравилось. Я спросил, не продается ли оно. — Да, — говорит он мне, — оно принадлежит Балоку из Милеси, который переписал это на своих дочерей Елену и Спиридулу. Ты должен пойти к ним. Тогда я пошел на участок и помолился. У меня было желание узнать, есть ли там вода. Смотрю, есть вода, да еще и неплохая. Это меня сильно обрадовало. Но воду я увидел глубоко под землей и подумал: «Как достать до этой воды?» Видел воду и в других местах, такую же воду. Ниже, в полутора километрах от вершины холма, вода была не так глубоко. Тогда я решил и там купить участок, пробурить скважину и поднимать воду на тот участок, где будет монастырь. Так при помощи Божественного просвещения я обеспечил монастырь водой. Потом внимательно осмотрел, можно ли там проложить дорогу, провести свет, телефон. Посмотрел, расположено ли оно на юг, защищено ли от холодного северного ветра, сыро ли там. Я хотел проследить за ходом солнца, чтобы зимой не было таких келий, куда бы солнце не'
      cn: 我想要这座修道院成为一处避难所，让病人和病患者前来，找到安慰、力量和治愈。我计划建造一座小型修道院。建造一座小型修道院——这真是我的一个长久以来的梦想，修道院院长彼得里乌斯谦逊地说道。这座修道院应该是一个精神的学校，灵魂在这里得以净化和培育，圣名在这里不断被颂扬。我想要它成为一处中心，让病人和病患者前来，找到安慰、力量和治愈。当我们和妹妹以及侄女住在图尔克维尼亚地区时，我们年复一年地在机床上工作。是的，我们缝制T恤。我们省吃俭用，为这个目标而努力。我们非常节俭，无论是食物、衣物还是其他方面。我们用这些钱买下了第一处房产。后来，信徒们继续捐赠，直到今天，他们仍然慷慨解囊。他们也开始参与其中。年复一年，我寻找合适的地点。我从不通过中介购买房产。我去了不同的地方。我祈祷上帝会指引我。我想要通过圣神的恩典来证明这一点。我总是祈祷啊，主耶稣基督……最终，上帝指引我，在米利塞的山上找到了一处熟悉的地点。一个牧羊人告诉我，这个地方叫阿伽索里。我对此感到很满意。我问，是否可以购买。——是的，——他说，——它属于米利塞的巴洛克，他把这处土地分给了他的女儿伊莲娜和斯皮鲁卢。你必须去见他们。于是，我去了那片土地，祈祷。我想要知道那里是否有水。我看到有水，而且水量不错。这让我非常高兴。但水深藏在地下，我心想：「如何才能挖到这水呢？」我看到其他地方也有这样的水，就在山脚下的半公里处，水位要浅得多。于是，我决定在那里购买土地，打一口井，把水抽到修道院的所在地。通过上帝的启示，我为修道院提供了水源。然后，我仔细检查了那里是否可以铺设道路，安装电力和电话。我检查了它是否面向南方，是否受到寒冷的北方风的侵袭，是否潮湿。我想要观察太阳的路径，以确保在冬天不会出现这样的情况：修道院的某个小屋，太阳永远不会照射到。
  - type: paragraph
    text:
      ru: светило. Месяцами я ходил туда и смотрел, как восходит солнце, где оно в полдень, где на закате, чтобы построить монастырь так, дабы был виден и восход, и закат, чтобы последний луч солнца освещал монастырь. Все эти условия оказались благоприятными, – заметил отец Порфирий. – Я тут же стал оформлять покупку. Мы купили место и стали строить….
      cn: 光明。我几个月来一直在那里，看着太阳升起，它在正午时分在哪里，傍晚时分在哪里，以便建造一座修道院，使人们可以看到日出和日落，让最后一缕阳光照亮修道院。所有这些条件都得到了实现，——父费奥多罗斯注意到——我立刻开始办理购买手续。我们买下了这块地，开始建造……
- type: heading1
  text:
    ru: Я приложился и отпил воды – духовно…
    cn: 我饮了水——精神上……
  children:
  - type: paragraph
    text:
      ru: 'Прежде всего, мы начали закладывать фундамент и строить без воды, – рассказал старец Порфирий. – Начинать без воды было нелегко. Для этих целей мы сделали большой резервуар, куда помещалось шестьсот сорок кубических метров дождевой воды. Несмотря на это, воды из резервуара нам не хватало, и около пяти-шести лет мы покупали воду в Кифисье. Каждый год тратили много денег на воду. Для поливки деревьев, которые посадили, воду мы покупали. Тогда мы встали перед необходимостью добраться до той воды, которую я видел на участке. Но нужно было много денег, потому что вода была глубоко под землей, и должен был найтись подходящий человек. Меня волновал этот вопрос. Необходимо было найти выход. Выход нашел Бог. Послушайте, что произошло. Как-то раз пришел ко мне за советом один мужчина. Христос открыл мне некоторые его семейные дела. Он удивился, пришел в умиление и говорит мне: — То, о чем ты говоришь, никто, кроме нас с женой, не знает. Это большая тайна. — И в воодушевлении говорит: — Что тебе принести, Геронда? — Ничего. — Есть у вас в монастыре вода? — спрашивает. — Нет, нет воды. — Тогда я проведу вам воду. У меня есть буровая вышка. — Сколько это будет стоить? — спрашиваю я. — Нисколько, — отвечает он. — Я возьму на себя все издержки бурения, привезу насос и все остальное. — Ну, ладно, хорошо, — говорю я ему, — ты это обещаешь Христу. И он ушел. Через несколько дней он привозит установку. Пробурил на глубину тридцати восьми метров, дошел до твердой скальной породы и остановился. Я попросил его, и он привез другую установку, получше, и пробурил до восьмидесяти метров. Воды нет. Снова скальные породы, и бур дальше не шел. В отчаянии он мне говорит: — Геронда, я не могу найти воду! Уезжаю. — Ты не должен уезжать, — отвечаю я. -— Я должен уехать, — повторяет он. Тогда я, поскольку был уже слеп, попросил сестру, и она провела меня вниз, за тем местом, где бурили, метрах в двадцати пяти, среди сплошных сосен, чтобы меня не видели. Там я помолился, пошел и нашел мысленно поток воды. Мысленно я измерил, как глубоко течет вода. Как-то раз, когда я был моложе, я также нашел воду людям, которые ее искали. И не только нашел, но и мысленно попробовал ее, хороша ли на вкус: соленая она, или сладкая, или'
      cn: 首先，我们开始打地基和建造，但没有水。——长老费奥季尔说。——开始时没有水确实很难。为此，我们建了一个巨大的蓄水池，可以容纳六百四拾立方米的雨水。尽管如此，池子里的水还是不够用，大约在五年到六年的时间里，我们还得从基菲斯购买水。每年都要花费大量的钱买水。为了给种植的树木浇水，我们不得不买水。于是，我们面临着一个难题：如何到达我看到的那处水源。但需要花费很多钱，因为水深埋在地下，需要找到合适的一个人。这个问题让我感到困扰。我们需要找到解决办法。上帝为我们提供了出路。请听我说。有一天，一个男人来找我寻求建议。基督向我透露了一些关于他家庭的事情。他感到惊讶，陷入沉思，然后对我说：「你所说的，除了我和妻子外，没有人知道。这是一个很大的秘密。」他满怀激情地说：「你有什么可以献给我的，赫罗尼莫？」「没有。」「你们寺院里有水吗？」「没有，没有水。」「那么，我可以给你们送水。」他回答说：「我有钻井设备。」「这要花多少钱？」「不花一分钱。」「我将承担钻井的所有费用，还会带来水泵和其他东西。」「好吧，好吧，」我说，「你答应基督了。」他走了。几天后，他带来了设备。他钻了三十点八米深，到达了坚硬的岩石层，然后停止了。我请他再带来一套更好的设备，他钻了八十米深。没有水。再次遇到岩石层，钻头不再前进。他绝望地对我说：「赫罗尼莫，我找不到水了！我要走了。」「你不能走，」我回答说，「——我必须走。」于是，因为我已经失明了，我请求妹妹，她带我下到钻井的地方，距离钻井地点大约二十米，位于一片密林之中，这样别人就不会看到我。在那里，我祈祷，然后心中想象着水流。我心中想象着水流有多深。有一次，当我年轻时，我也找到了一些人需要的水。不仅找到了，还想象着品尝了水的味道：咸的，甜的，苦的，涩的。
  - type: paragraph
    text:
      ru: 'солоноватая. Я взял метр и мерил вниз, мысленно, конечно. Стал мерить: «Один, два, три...» Вода была очень глубоко, поэтому я взял палку и представил, что она равняется десяти метрам, и стал измерять ею, снова мысленно: «Десять, двадцать, тридцать, сорок, пятьдесят, сто...» Я почувствовал великую радость. Я нашел воду, хотя она и была очень глубоко! Я почувствовал неизреченную радость. Тут же я решил ее попробовать, хороша ли она. Наклонился и мысленно отпил воды. Вода была очень хороша! Радостный и воодушевленный, я возвращаюсь в келию. Потом зову Николу Митаса, так звали того, чья была буровая вышка, и говорю ему: — Ты пробуришь очень глубоко. Он отвечает: — Там будет скала, отец Порфирий , там не будет воды. У меня нет столько труб, я уезжаю! — Ты не уедешь, — говорю ему, — поезжай, ищи трубы. Я не разрешаю тебе уезжать! На следующий день он привез трубы и стал бурить глубоко там, где я ему показал. И нашел источник, где полно было воды, хорошей воды, способствующей пищеварению. Он и сам обрадовался. Обрадовались и мы все. Это было благословение Господне, святая вода. Мы отслужили молебен Преображению Господню, чтобы отблагодарить Господа за великое чудо. Это было чудо Преображения Господня.'
      cn: 松软的。我拿起一米的尺子，心中默数，当然。开始测量：「一，二，三...」水非常深，所以我拿了一根棍子，想象它有十米长，然后心中默数：「十，二十，三十，四十，五十，一百...」我感到极大的喜悦。我找到了水，尽管它非常深！我感到无法言喻的喜悦。就在那时，我决定尝一尝，看看水质如何。我弯下腰，心中默饮了一口水。水非常好！我感到欣喜若狂。带着喜悦和振奋，我回到小屋。然后我叫来尼古拉·米塔斯，那是他那座钻井平台的名字，对他说：「你钻得非常深。」他回答说：「那里会有岩石，奥弗菲里乌斯神父，那里不会有水。」我拥有的管子不够多，我要走了！「你不能走，」我对他说，「去吧，找管子。」我不允许你离开！第二天，他带来了管子，开始在我说过的地方钻得非常深。他找到了一个水源，那里有充足的水，好喝的水，有助于消化。他自己也感到高兴。我们都感到高兴。这是上帝的恩典，圣水。我们为基督的显现祈祷，感谢上帝赐予了伟大的奇迹。这是基督显现的奇迹。
- type: heading1
  text:
    ru: Церковь – духовный Университет
    cn: 教会 – 灵魂的大学
  children:
  - type: paragraph
    text:
      ru: Когда я думал о постройке женского монастыря, мне приходило много мыслей, – вспоминал старец Порфирий. – Очень много... Самая главная мысль была собрать несколько сестер-монахинь, чтобы все они были рядом со мною, чтобы они любили меня во Христе и чтобы я любил их во Христе. Я хотел, чтобы все были подлинными монахинями, чтобы был у нас дух монашеской жизни, без ревности, без всего того, что, как правило, есть у женщин. Чтобы между ними была любовь и был порядок. Еще я хотел, чтобы мы занимались рукоделием, каким-нибудь искусством, которое бы занимало два-три часа в день, с утра. Но центр тяжести я хотел переместить на обучение богослужением, как говорят, Университет Церкви. То есть на песнопения, каноны, полунощницы, междочасия. Псалтирь, Октоих, Минею, Феотокарион, Постную и Цветную Триодь. Я хотел, чтобы мы читали все, если возможно, все, о чем написано в Типиконе. А Псалтирь читали бы перед обедом, для облегчения, чтобы не читать ее ночью и не утомлять сестер. Занятие песнопениями, чтением я считаю великим делом, очень великим, потому что так человек постепенно освящается, сам того не замечая. Приобретает и любовь, и смирение — всё, слыша слова святых, слова из Минеи, Октоиха и тому подобных книг. Этим мы должны заниматься постоянно и с усердием, посвящая себя этому. Это должно быть нашей ежедневной усладой в церкви. И снова каждый день, за час до обедни мы будем сидеть и читать отцов, – воодушевился старец Порфирий. – Понимаешь, как здорово?!
      cn: 当我考虑建立一个女修院时，我有很多想法——长老普罗菲利说道。非常非常多……最重要的想法是聚集一些修女，使她们都与我在一起，使她们在基督里爱我，我也爱她们在基督里。我想让她们都是真正的修女，使我们之间有修道生活的气息，没有嫉妒，没有通常女性所具有的所有东西。她们之间要有爱，要有秩序。我还想让我们的生活集中在学习礼拜上，正如他们所说的，教会大学。也就是说，集中在圣歌、赞歌、晚课、中间时辰的祈祷上。诗篇、奥拓伊、米奈、费奥托康里亚、斋期和花期三叠祷文。我想我们会读所有在类型书中所写的，如果可能的话，都会读。而诗篇会在中午前读，以减轻负担，不要在晚上读，也不要让修女感到疲惫。我将圣歌的阅读和诵读视为一项伟大的事业，非常伟大，因为这样的人渐渐被圣化，不知不觉中获得爱和谦卑，通过聆听圣人的言语，聆听米奈、奥拓伊等书籍中的言语。我们应该一直这样做，全心全意地投入其中。这应该是我们教堂的每日乐趣。再次，每天在午祷前一小时，我们会坐下来读先知们的言语——长老普罗菲利说道。你明白这有多好吗？
- type: heading1
  text:
    ru: Я уверен, что если бы мы, монахи, хранили любовь, то Бог бы творил множество чудес…
    cn: 我确信，如果我们修道者们保持爱，那么上帝将会创造许多奇迹……
