    ru: Эвбея (1925—1940)
    cn: 爱比雅 (1925—1940)
  children:
  - type: paragraph
    text:
      ru: 'Их сердца смягчились, они сами хотели поститься, подвизаться и желали познать Христа. Я даже в мыслях не допускал, что когда-либо вернусь в мир… Я даже в мыслях не допускал, что когда-либо вернусь в мир, – вспоминал старец Порфирий. – Моя родина была в Кавсокаливии. Я, конечно, просил Бога, чтобы Он дал мне болезнь. И Он дал мне болезнь. Но я говорил: — «Хорошо, Боже мой, Ты дал мне ее. Но не так же, чтобы высылать меня со Святой Горы…». Но Он выслал меня. Я уехал по болезни. То есть Господь выгнал меня. Бог услышал меня, но сделал не так, как я хотел. Он дал мне то, чего я просил, но и то, чего я не хотел. Потому что из-за болезни я уехал со Святой Горы. И таким образом после стольких лет вернулся в свой дом!.. На корабле время тянулось бесконечно. Все для меня было странным: дети, женщины, которых я не видел годами. В свою деревню я поехал через Халкиду. Проехал через Аливери, добрался до Святого Иоанна, своей деревни. Сначала пошел в сады. Встретил своего зятя, Николая, отца Елены. Я спрашиваю его: — Кто здесь есть еще? — Э, — говорит он, — вот там недалеко — Леонид Баирактарис(это был отец мой), — а там другие. — Он назвал их имена. С гулко бьющимся сердцем пошел я встречать своего отца. Я много лет не видел его. Как я уже сказал, он годами работал в Америке. Увидев его, я сразу его узнал. А ему куда было меня узнать! Монах, длинные волосы и очень длинная борода. Я стеснялся этого и спрятал все в подрясник. Из-за болезни остались только кожа да кости! Я поздоровался с ним. Он спрашивает: — Ты кто? И откуда? — Монах, — отвечаю. — Есть у тебя семья, дети? Сколько у тебя детей? — Было четверо, но один мой сын пропал много лет назад. Мы его потеряли. Он работал в Пирее и пропал. — В Пирее? Как его звали? — Евангел. — Евангел? Он был моим другом. — Скажи, ты знаешь, где он? — К сожалению, он умер... — Как, умер?'
      cn: 他们的内心变得柔软，他们自己也想禁食、祈祷，并渴望认识基督。我甚至在心中都不曾想过，自己会再次回到这个世界……老方济各回忆道：「我的故乡在卡夫斯卡利维。我当然祈祷，希望上帝能赐给我疾病。上帝赐给了我疾病。但我说道：『主啊，祢赐给了我疾病。但不要把我从圣山打发走……』但祢还是打发了我。我因疾病离开圣山。也就是说，主打发了我。上帝听到了我的祈祷，但没有按照我的意愿去做。祂赐给了我祈求的疾病，但同时也赐给了我没有祈求的疾病。因为我因疾病离开了圣山。因此，经过了如此漫长的岁月，我终于回到了我的家中！……在船上，时间显得异常漫长。对我来说，一切都变得陌生：那些孩子，我多年未见的妇女。我穿过哈里卡拉迪，回到了我的村庄。我经过阿里维，到达圣约翰，我的村庄。我先去果园。遇见了我的女婿尼古拉，他是爱琳的父亲。我问他：「这里还有谁？」他说：「嗯，就在那边不远的地方，有莱昂尼德·巴伊雅克塔里斯（那是我的父亲），还有其他人。」他列出了他们的名字。怀着沉重的心，我前往迎接我的父亲。我多年未见他了。正如我之前所说，他多年来在美国工作。看到他，我立刻认出了他。但他怎么能认出我呢？一个修道士，长着长长的头发和长长的胡须。我感到尴尬，把一切都藏在了内衣里。因为疾病，只剩下皮肤和骨头了！我向他打了招呼。他问道：「你是谁？你来自哪里？」我回答说：「修道士。」「你有家人，有孩子吗？你有几个孩子？」「我有四个孩子，但我的一个儿子多年前就失踪了。我们失去了他。他在皮雷工作，失踪了。」「在皮雷？他叫什么名字？」「以利亚。」「以利亚？他是我的朋友。」「告诉我，你知道他现在在哪里吗？」「很遗憾，他已经去世了……」「已经去世了？
  - type: paragraph
    text:
      ru: 'Сердце отца моего не выдержало. Он начал плакать. Тогда не выдержал и я. Я бы растаял, даже если бы был железным. Стал плакать и я. Сердце мое сильно билось. Я больше не мог видеть, как разрывается сердце моего отца, и я открылся ему: — Это я, отец! Евангел. Что тут произошло! Радость и слезы смешались. Мы обнялись и, растроганные, пошли домой, чтобы найти мою мать. Но мать у меня была суровой. Увидев меня, она стала сильно на меня ругаться. Она считала большим оскорблением для себя, что ее сын стал монахом.'
      cn: 父亲的心无法承受。他开始哭泣。然后，我也无法控制自己，开始哭泣。即使我是铁打的，也无法承受。我的心剧烈跳动。我再也无法忍受看到父亲的心被撕裂，于是对他说：「我是你啊，父亲！」《圣经》发生了什么？喜悦与泪水交织。我们紧紧拥抱，被感动得回家，去找我的母亲。但我的母亲很严厉。她看到我，开始严厉地责骂我。她认为，我成为修士是对自己极大的侮辱。
