  text:
    ru: Перед таким величием я, чувтствуя себя недостойным, упал на колени...
    cn: 在如此伟大的面前，我感到自己卑微，便跪倒在地……
  children:
  - type: paragraph
    text:
      ru: 'Из своей жизни в монастыре Святого Харалампия я помню много случаев, – вспоминал старец Порфирий. – Расскажу вам один чудесный случай. Я уже говорил, что мне очень нравится лес. Я привык к уединению, хотел быть один. Я хотел быть вне монастыря, особенно ночью. По этой причине я залез на дуб, высоко, выше двух с половиной метров. Там я из тростника устроил лежанку. Нарезал камыш и переплел его с ветвями дуба. Туда я принес одеяло, в которое заворачивался. Это было здорово. Я поднимался по лестнице, которую сделал сам, и, когда уже был наверху, убирал ее, чтобы меня никто не беспокоил. Лежанку мою оплел дикий виноград, цветы которого сильно благоухали. У подножия дуба было много камыша. Он рос от самых корней дерева, площадью метра два на три. Я забирался наверх на лежанку и предавался молитве. Я был святогорцем. Хотел лишь уединения и Псалтири. И еще Господи Иисусе Христе... Там на дубе я молился часами среди цветов дикого винограда на своей камышовой кровати. Однажды вечером, забравшись на эту постель, всю в цветах, я стал молиться. Была ночь, вокруг — пустыня. Луна освещала мир. Мне помогали соловьи, которые только проснулись и начали петь. Я прочитал много псалмов, но более всего молился Господи Иисусе Христе, помилуй мя. Потом встал и мысленно прочитал повечерие. Когда я начал читать молитву Божией Матери, то увидел Ее образ: на высоком, прекрасном и Божественном престоле — Пресвятая Богородица, вокруг нее чины ангелов, архангелов, херувимов, серафимов, мучеников, святых, преподобных, пророков. Перед таким величием я как недостойный упал на колени и начал молиться громко вслух: Нескверная, неблазная, нетленная. Пречистая Чистая Деве, Богоневесто Владычице... Меня охватил страх и трепет, когда луч света, исходящий от Богородицы, коснулся моей головы, которую я смиренно и низко преклонил по причине своего великого недостоинства. Когда я окончил молитву Божией Матери и умолк, слышу, как из-под дерева выходит человек. Это был мужчина. Он говорит мне: — Человек Божий, спускайся вниз, я хочу тебе что-то сказать. Я спустился и поздоровался с ним. Он мне говорит: — Я очень голоден… — Я сейчас тебе принесу, — отвечаю ему. — Послушай-ка, — говорит он мне, — я приехал из Америки и убил свою жену. Меня стали преследовать, и я убежал в горы, чтобы меня не поймали. Но я умираю от голода.'
      cn: 从我在圣哈拉姆修道院的生活回忆中，长老帕弗瑞乌斯回忆道。我将为您讲述一个奇迹般的故事。我非常喜欢森林。我习惯了独处，想要一个人。我想要离开修道院，尤其是在夜晚。因此，我爬上了橡树，爬到了高出两米半的地方。在那里，我用芦苇搭了一个床铺。我砍了一些蒲草，用蒲草和橡树枝编织在一起。我带了被子，用它裹着自己。这非常棒。我沿着自己做的梯子爬上去，爬到上面后，就把它收了起来，以免打扰到我。我的床铺用野生葡萄藤缠绕着，葡萄藤散发出浓郁的香气。在橡树下，有很多蒲草。它从树根处生长，面积有一平方米乘以三米。我爬上去，躺在我的蒲草床上，开始祈祷。我是一个圣戈尔斯修道者。我只想独处和诵读《圣经》。还有，主耶稣基督啊……在橡树上，我对着盛开的野生葡萄藤祈祷了很长时间。有一天晚上，我爬上了这个床铺，身上沾满了花香，开始祈祷。那是一个夜晚，四周是荒漠。月亮照亮了世界。我被知更鸟的歌声所唤醒。我读了许多诗篇，但最让我祈祷的是主耶稣基督啊，请怜悯我。然后，我想象自己念完了晚祷。当我开始祈祷圣母时，我看到她的形象：在高高的、美丽而神圣的宝座上，是圣母玛利亚，周围是天使、主教、天使长、基路伯、殉道者、圣徒、先知。面对如此的荣耀，我作为卑微的人，跪了下来，低下头，因为我的罪孽深重。当我结束祈祷圣母，沉默下来，我听到从树下传来一个人的声音。那是一个人。他说：「人子啊，下来吧，我要告诉你一些事情。」我下来，向他问候。他说：「我非常饿……」「我马上给你拿去，」我回答他。「听着，」他说，「我来自美国，杀了我妻子。我被追捕，逃到山上，以免被抓。但我饿死了。」
  - type: paragraph
    text:
      ru: 'Я принес ему три просфоры. Он рассказал мне, что жена его завела себе друга. Он, услышав об этом, приехал и совершил такое зло. Он уже в нем раскаялся, но сделанного не исправить. — Прошу тебя, человек Божий, никому ничего обо мне не рассказывай, — сказал он мне и скрылся во тьме. Когда рассвело, пришла полиция и искала его. Меня спросили, видел ли я кого-нибудь. Описали его. — Нет, — говорю, — я никого не видел. То, что этот человек мне исповедал, было по благодати Божией Матери. Я правду вам говорю: предо мною была Пресвятая Богородица, Она послала луч света мне, смиренному! Ведь был монашенком, уже священником, где-то двадцати одного года, – закончил старец Порфирий.'
      cn: 我给他带来了三块普斯福。他告诉我，他妻子又有了情人。他听了这话，就来了，做了这样的坏事。他已经悔过了，但已经做过的不能再挽回。——求你，人子啊，不要将我告诉任何人，——他对我说，然后就隐入了黑暗。天亮后，警察来找他。他们问我是否见过什么人。他们描述了他。——没有，——我说，——我没有见过什么人。那个向我忏悔的人，是上帝圣母的恩典。我诚实地告诉你：在我面前的，是圣母，她给我，一个卑微的人，带来了光明！他本是修士，已经成了神父，二十多岁的时候。——老方济各说。
- type: heading1
  text:
    ru: В шуме центральной площади Афин Омонии я жил как в пустыне Святой Горы
    cn: 在雅典奥蒙尼广场的喧嚣中，我仿佛生活在圣奥斯定的荒漠中
  children:
  - type: paragraph
    text:
      ru: Среди многолюдного круговращения и шума Омонии я возвышал свои руки к Богу и проводил такую внутреннюю жизнь, словно в пустыне Святой Горы. «Вот, — говорил я внутри себя, — я не для мира, а для пустыни. Там никто не знает, чем ты занимаешься». И так жил в миру. Жил там, куда меня привел Бог. Всех я любил, всем сострадал, все меня умиляло. Это мне дала Божественная благодать. Я видел медсестер в белых одеждах, смотрел на них, как на ангелов в белых ризах, спустившихся в церковь, и плакал, оттого что видел их. Я очень любил этих медсестер. И при виде сестры в белом я думал, что это сестра милости, сестра любви, которая идет, чтобы послужить в храме любви Божией, то есть в больнице, чтобы служить больным, служить братьям. Ангел, белый ангел. Сколько вещей у нас остаются незамеченными! Когда я видел, как мать кормит грудью своего ребенка, снова приходил в умиление. Когда видел беременную женщину, плакал. Видел учительниц, приводящих детей в школу, и плакал, так как это было дело любви. Самую большую радость я испытывал, конечно, во время Божественной литургии. Когда я читал, внизу все стояли затаив дыхание. Я был на подъеме. Я весь был в литургии, потому что мне нравилось совершать литургию. Да и люди воодушевлялись той простой литургией, которую я совершал. Поскольку я был необразован, то очень старался. В церковь Святого Герасима приходили и пели ученые люди. Многие из них были профессорами университета, такие, как братья Аливизаты, религиовед Леонид Филиппидис и другие. Там, напротив поликлиники, была Афинская музыкальная школа. Оттуда на службы тоже приходили преподаватели со своими семьями. Хор в церкви был из Императорского театра. Но мне было трудно петь на глас и тому подобное. Поэтому я решил походить в музыкальную школу. Часы, которые мне оставались на отдых, я тратил на то, что ходил и с упорством учился музыке, ревностно учился часами. Я делал это, чтобы облегчить жизнь псалтам. Я не хотел огорчать церковный хор. И хор, как я уже вам говорил, был официальным. Я хотел хорошо держать тон, чтобы не утомлять их и не огорчать. Я вынужден был ходить в музыкальную школу, чтобы научиться музыке. Но послушайте об одном моем безумном поступке. Я желал научиться играть и на фисгармонии. У меня были планы на будущее. Если бы я построил монастырь, то когда бы мы находились там и говорили бы разные поучения или говорили бы на какие-нибудь прекрасные темы, то брали бы фисгармонию и использовали бы ее для песнопений.
      cn: 在人群的旋转和喧嚣中，我举起双手向上帝祈祷，仿佛置身于圣母山上那片荒芜之地。我对自己说：「我并非为了世界而生，而是为了荒漠。在那里，没有人知道我在做什么。」就这样，在尘世中，我找到了属于自己的地方。我爱所有人，为所有人感到悲伤，所有的事物都让我感到怜悯。这是上帝的恩典所赐。我看到穿着白袍的护士，就像看到从圣殿中降临的天使，我为此感到悲伤。我非常喜爱这些护士。一看到穿着白袍的护士，我就想到那是仁爱的护士，那是爱的天使，她们来到教堂，为了服务上帝的爱，也就是来到医院，为了服务病人，服务兄弟姐妹。天使，白色的天使。我们生活中有多少事物被我们忽视了！当我看到母亲哺乳她的孩子时，我再次感到怜悯。当我看到怀孕的妇女时，我哭泣。看到那些带领孩子们去学校的教师时，我哭泣，因为这是爱的工作。在我内心深处，最深的快乐是在圣礼中体验到的。当我诵读经文时，人们会屏住呼吸。我正在上升。我全身心投入在圣礼中，因为我觉得诵读经文是一件乐事。而且，人们也随着我的简单圣礼而感到振奋。由于我并不受过良好的教育，所以我非常努力地学习。圣加拉特教堂的来访者中，有许多学者。他们中有许多是大学教授，比如阿里维萨兄弟、宗教研究学者列昂尼德·菲利皮德斯等人。就在医院对面，有一所阿芬音乐学校。他们也会带着家人来参加教堂的礼拜。教堂的合唱团来自帝国剧院。然而，我很难在唱诗班中唱歌，因此我决定去音乐学校学习。我剩下的休息时间，我用在学习音乐上，勤奋地学习。我这样做是为了减轻唱诗班的负担。我不想让他们感到疲劳，也不想让他们感到沮丧。我不得不去音乐学校学习音乐。但是，让我听听我一个疯狂的行为。我渴望学习弹奏风琴。我有未来计划。如果我建立了一个修道院，当我们在那里讲道，或者谈论一些美好的话题时，我们会拿起风琴，用它来唱赞美诗。
  - type: paragraph
    text:
      ru: 'Но в музыкальной школе не было фисгармонии, и меня посадили за пианино. Тогда я научился играть на пианино, но больше любил фисгармонию. Как только Бог все устроил! И что же вам сказать! В музыкальной школе меня полюбили и дали мне учительницу, которая была святейшим человеком. Однажды, когда я служил литургию, я взял замечательную большую просфору, которую мне принесли. И что могло быть самым лучшим подарком тогда, когда мы были под оккупацией и голодали? Я принес ее ей и с улыбкой говорю: — Мне принесли прекрасную просфору. — Нет, нет, — отвечает она, — не могу, не могу, я не буду ее есть! — Я прошу тебя, — настаиваю я. — Нет, — говорит, — так нельзя. И я смутился. Она дала мне урок игры на пианино, а в конце я признался ей, что огорчился. Тогда она, бедняжка, взяла просфору. Но и я не желал ее огорчать своими занятиями. О чем я думал? Вечером после своей смиренной молитвы, прежде чем лечь спать, я ставил свои руки так, как будто сижу за пианино, и повторял урок: до, си, ля, соль, соль, соль, ми. Делал это мысленно. И так я готовил уроки. Зачем я это делал? Чтобы не огорчать свою учительницу. Этому я научился на Святой Горе. То есть я не могу огорчать другого, потому что с юного возраста научился послушанию. Так я совершал и ошибки в своей жизни. То есть когда я вижу, что кто-нибудь огорчается, понуждает меня и просит, чтобы я сделал или сказал что-либо, я жалею его и делаю, даже если не хочу. Я видел смерть, которая косила людей ежедневно. Я делился с больными просфорами и всем, что мне приносили. Их душевная боль подталкивала меня к состраданию. Даром прозорливости я видел глубины их душ. Я молился о тех, кто приходил ко мне и рассказывал о своей телесной болезни. Это побуждало меня к изучению. Видя больной член тела, я хотел узнать его научное название и ту роль, которую играют все органы тела: печень, поджелудочная железа и другие члены. Поэтому я купил книги по медицине, анатомии, физиологии и тому подобном, чтобы изучить это и быть информированным. Для лучшего образования некоторое время я посещал аудиторные занятия на медицинском факультете. Такая любознательность у меня была ко всему. Я все хотел узнать во всей глубине и широте. Если я шел на какой-нибудь завод, я хотел узнать во всех подробностях о том, как он работает. Если посещал музей, то часами интересовался скульптурой. Я вам расскажу один случай.'
      cn: 但音乐学校没有风琴，我被安排在钢琴前。那时我学会了弹钢琴，但更喜欢风琴。上帝真是安排得完美！要说的还有哪些？在音乐学校，我遇到了一位圣洁的人。有一次，我正在主持弥撒，有人送来了一个精美的大圣餐饼。在被占领且饥荒肆虐的时期，还有什么比这更好的礼物呢？我把它送给她，微笑着说道：「他们送来了一个精美的圣餐饼。」她却回答：「不，不，我不能吃，我不能吃！」「求求你，」我坚持道，「不行，」她说，「这样不行。」我感到很尴尬。她教了我弹钢琴，而我却在结束时向她坦白，我感到很沮丧。可怜的她，她把圣餐饼给了我。但我也不愿意因为我的演奏让她感到沮丧。我在想什么？晚上，在我谦卑地祈祷之后，睡前我将双手放在钢琴上，一遍遍地重复着：do，si，la，sol，sol，sol，mi。我是在心中做这些练习。就这样，我准备着我的课程。我为什么要这样做？为了不让她感到沮丧。我在圣山学会了这一点。也就是说，我不能让别人感到沮丧，因为我从小就学会了顺从。因此，我在生活中犯了许多错误。也就是说，当我看到有人感到沮丧时，我会劝说他，请求他让我做或说些什么，我会感到内疚并去做，即使我不愿意。我目睹了每天都有人死去。我与病人分享圣餐饼和他们带来的其他东西。他们的内心痛苦促使我感到同情。我从他们身上看到了许多内心的深度。我为前来寻求帮助的人祈祷，这促使我学习。看到身体的某个部位生病，我想要了解它的科学名称以及身体的所有器官所起的作用：肝脏、胰腺和其他器官。因此，我买了一些医学、解剖学和生理学方面的书籍，以便学习并保持信息。为了更好地学习，我有时还参加了医学院的听课。我对所有事物都抱有这种好奇心。我想要在深度和广度上了解一切。如果我去了某个工厂，我想要了解它运作的每一个细节。如果参观了博物馆，我会花几个小时来研究雕塑。我将告诉你一个故事。
- type: heading1
  text:
    ru: В первое время моего назначения туда мне было суждено испытать искушение, которое мне тогда показалось очень большим…
    cn: 在初到那地的时候，我蒙召经历了一次很大的试探……
  children:
  - type: paragraph
    text:
      ru: 'Но я вам еще не рассказал о том, что в первое вермя моего назначения туда мне было суждено испытать великое искушение… Но Бог помог мне. В первое воскресенье я с большой радостью пошел служить литургию. Мое желание — трудиться в учреждении — исполнялось. Этот дар послал мне Бог. Но что же случилось! Когда я пошел к началу службы в церковь Святого Герасима, услышал звук граммофона с любовными песнями: «Я люблю тебя, я люблю тебя...» — и так далее. Продолжаю службу... Все то же самое. Я начинаю читать молитвы, служить Божественную литургию. А снаружи — песни. В церкви полно народу. Я выхожу Царскими вратами и говорю: «Мир всем», — но литургия вся кувырком. Когда я в унынии закончил, потребил Святые Тайны, взял свое облачение, сложил его и тотчас вышел из храма. Напротив церкви был магазин, в котором продавались граммофоны и пластинки к ним. Я вежливо подошел к хозяину магазина господину Курете, так его звали, и попросил его, если это возможно, хотя бы во время Божественной литургии выключать граммофон. Он мне отвечает: — Я тоже хочу зарабатывать свой хлеб. То, о чем ты просишь, невозможно. У меня дети, я должен платить аренду. — Я прошу тебя, — говорю ему, — я переживаю, потому что происходящее — грех. — Отец, ты занимайся своим делом! — отрезал он. И что мне было делать? Я думал о том, чтобы уйти из церкви и найти другую. Но я был связан обязательствами, и меня назначили на это место в то время, когда я не отвечал элементарным требованиям. То есть у меня не было аттестата об окончании начальной школы, даже табеля хотя бы за какой-нибудь класс. Что я скажу Блаженнейшему, который снизошел ко мне и поставил меня туда по любви? Что я скажу господину Аливизату, который сделал все, чтобы меня туда назначили? Я сильно расстроился. Сидел в алтаре и думал, что делать. Я говорил, что нужно уезжать, что больше оставаться я не могу. Как я буду здесь жить, как буду служить? А особенно, как жить человеку, который приехал из пустыни, из совершенного безмолвия, как ему жить в этом сатанинском шуме? По улице проносились автобусы из Никеи, из Перистери, из Пирея. Их маршрут проходил прямо за дверью церкви. Я постоянно слышал гудки проезжающих мимо автомобилей. И я решил уйти, но не знал, как об этом сказать. Печальный, я вернулся домой и не знал, как быть.'
      cn: 但还没有告诉你们，在我第一次被派往那里的时候，我曾经历了一次极大的试探……但上帝帮助了我。在第一次主日，我怀着极大的喜悦去主持圣礼。我的愿望——在机构里工作——实现了。这个恩典是上帝赐给我的。但发生了什么！当我走向圣加拉代教堂的圣坛，听到爱之歌的旋律：「我爱你，我爱你……」——然后是其他歌词。继续主持圣礼……同样的事情。我开始诵读祷文，主持圣礼。外面是歌曲。教堂里人很多。我走出城门，说：「愿你们平安」，但圣礼全乱了。当我沮丧地结束时，接受了圣礼，取下我的圣衣，立刻离开了教堂。教堂对面是一家商店，里面出售留声机和唱片。我礼貌地走到店主库特先生面前，请求他，如果可能的话，在圣礼期间关闭留声机。他回答说：「我也想赚钱。你要求的事办不到。我有孩子，我必须支付租金。」「先生，」我说，「我感到痛苦，因为这一切都是罪。——父亲，你去做你的工作吧！」他断然拒绝了我。我该怎么办？我想离开教堂，找一个别的地方。但我有义务，当时我并没有满足基本的要求。也就是说，我没有完成初等教育的证明，甚至没有完成一个班级的记录。我将向大主教解释，他俯就我，爱我，把我派到那里。我将向阿里维萨特先生解释，他做了所有努力把我派到那里。我感到非常沮丧。坐在圣坛上，不知道该怎么办。我说我要离开，我不能再待在这里。我将如何在这里生活，如何在这里服务？尤其是，一个从荒漠来的，从完全的沉默中来的，如何在这个魔鬼般的喧嚣中生活？汽车从尼科西亚、佩里斯特里、皮雷亚驶过。他们的路线直接经过教堂的门口。我经常听到从街上驶过的汽车的喇叭声。我决定离开，但不知道如何说。我感到非常悲伤，回到家里，不知道该怎么办。
  - type: paragraph
    text:
      ru: 'Я тогда жил у Ликавитоса на улице Доксапатри. Я вернулся домой и думал, думал... Мне даже есть не хотелось. Я переживал. Что делать? Я был рад, что меня направили служить в больницу, где я мог видеть больных, ухаживать за ними, разговаривать с ними, исповедовать их и причащать... Что же делать теперь? Лишь Бог мог вызволить меня из такого затруднительного положения. И в таком великом затруднении, в котором я находился, я решил про себя: «Что скажет Бог». Я попросил: — «Боже мой, я не хочу, чтобы Ты со мной говорил, не хочу, чтобы Ты показал мне знамение. Любовью Твоей покажи мне что-то простое, по чему я смогу понять, должен ли я уехать или остаться. Очень простое. Я не прошу чуда. Мне стыдно». Я решил поститься три дня, не вкушая даже воды, и эти три дня провести в совершенном молчании и молитве, ожидая ответа Божия. И ответ пришел. Когда я был в церкви Святого Герасима, приходили разные люди, чтобы поставить свечки. В какой-то момент входит женщина с ребенком. Ребенок был, вероятно, учеником первого класса гимназии. В руках у него были школьные учебники. Один из них был по физике. Я попросил у него учебник, чтобы посмотреть просто из любознательности. Это было моим обыкновением. Я листал книжку и открыл одну страницу, где был показан следующий физический опыт: ....в спокойную воду озера бросают маленький камень. Вода теряет свое спокойствие и покрывается рябью на небольшой площади. Если потом бросить камень побольше, то рябь будет больше и на большей площади. Новые волны заглушат прежние... В тот момент мне и пришел ответ на мою дилемму. Это было просвещение от Бога. Я подумал следующее: маленькая «рябь» песен за стенами церкви может быть поглощена большими «волнами» от усердных молитв, которые произносятся в церкви. В тот же миг в уме у меня явственно прозвучало: «Если ты служишь в церкви литургию и ум твой — в Боге, то кто может помешать тебе?» Я так и приготовился поступить. При служении литургии я предавался любви Христовой, с великой ревностью и большим духовным напряжением совершал драму Божественной литургии, страшную драму Голгофы. Радость моя была безмерна. Я поверил в то, что Бог разрешил мою проблему. Действительно, в воскресенье утром я пришел в церковь, исполненный надежды. Дал возглас: «Благословен Бог наш...» Ум мой был сосредоточен на одной службе, и только. Я ощущал себя на небе, а внизу и рядом со мною — молящиеся, словесные овцы Божии. В Божественной благодати я ощущал всех нас. Снаружи бешено орал граммофон. Я не слышал ничего. Впервые я пережил такую Божественную литургию. Это была самая прекрасная литургия во всей моей жизни. И с тех пор все Божественные литургии были такими.'
      cn: 我那时住在利卡沃提斯的多卡斯帕提街上。我回到家里，思绪万千……甚至不想吃饭。我感到很焦虑。该怎么办？我感到很高兴，被派往医院，可以在那里看到病人，照顾他们，和他们交谈，为他们做告解，给他们施圣礼……那么现在该怎么办？只有上帝才能救我脱离这种困境。在如此艰难的情况下，我决定：「上帝会怎么说？」我祈求说：「我的上帝，我不希望你和我说话，我不希望你给我显现奇迹。用你的爱告诉我，我应该离开还是留下。这很简单。我不求奇迹。我感到羞愧。」我决定三天不吃东西，甚至不喝水，专心致志地祈祷，等待上帝的回答。答案来了。当我来到圣加拉西亚教堂时，人们来点蜡烛。这时进来一个带着孩子的女人。那个孩子可能是一名小学一年级的学生。他手里拿着几本教科书。其中一本是物理书。我向他借了书，只是出于好奇。这是我常做的。我翻阅着书，翻到了一页，上面展示了一个物理实验：……在平静的湖面上投掷一个小石头。湖面失去了平静，表面出现了一圈圈波纹。如果再投掷一个更大的石头，波纹会更多，范围也会更大。新的波纹会淹没旧的……就在那时，我得到了上帝的回答。这是上帝的启示。我想到：小教堂里小小的波纹可以被大教堂里虔诚祈祷的波纹所淹没。就在那一刻，我的脑海中清晰地响起了：「如果你在教堂里做圣礼，你的灵魂在上帝那里，那么谁又能阻止你呢？」我这样准备好了。在圣礼中，我全身心投入基督之爱，用极大的热情和精神努力完成了圣礼，完成了可怕的十字架的戏剧。我的快乐是无与伦比的。我确信，上帝已经解决了我的问题。果然，星期天早晨，我怀着希望来到教堂。我高呼：「愿上帝受赞美……」我的心灵专注于一次圣礼，其他一切。我感觉自己在天堂，而在我周围是祈祷的人，上帝的言辞羊。在神圣的恩典中，我感受到我们所有人。外面，一台留声机狂叫。我什么也没听到。这是我第一次经历如此神圣的圣礼。这真是我一生中最美好的圣礼。从那以后，所有的神圣圣礼都是这样的。
- type: heading1
  text:
    ru: Тогда я все хотел постигнуть во всей полноте и до самой глубины
    cn: 那时我便一心想要彻底理解并深入体会
  children:
  - type: paragraph
    text:
      ru: 'Я много пережил в те годы, когда находился в Афинской поликлинике. Греция, особенно Афины, переносила испытания войны, оккупацию, голод и смерть, которая косила людей ежедневно. Я делился с больными просфорами и всем, что мне приносили. Их душевная боль подталкивала меня к состраданию. Даром прозорливости я видел глубины их душ. Я молился о тех, кто приходил ко мне и рассказывал о своей телесной болезни. Это побуждало меня к изучению. Видя больной член тела, я хотел узнать его научное название и ту роль, которую играют все органы тела: печень, поджелудочная железа и другие члены. Поэтому я купил книги по медицине, анатомии, физиологии и тому подобном, чтобы изучить это и быть информированным. Для лучшего образования некоторое время я посещал аудиторные занятия на медицинском факультете. Такая любознательность у меня была ко всему. Я все хотел узнать во всей глубине и широте. Если я шел на какой-нибудь завод, я хотел узнать во всех подробностях о том, как он работает. Если посещал музей, то часами интересовался скульптурой. Я вам расскажу один случай. Однажды в воскресенье в обеденное время я проходил мимо Археологического музея. У меня было немного времени, и я подумал, не зайти ли мне туда. Я ходил по залам, рассматривая статуи. В одном из залов была группа с экскурсоводом. Стояла полнейшая тишина. Я подошел поближе. Но когда экскурсовод меня завидела, она шепнула группе: — Подошел поп. Я попов не перевариваю. Но этот, мне кажется, не такой, как все. Я подошел еще ближе и сказал: — Добрый день. — Добрый день, — ответила экскурсовод. — Можно мне послушать то, о чем вы рассказываете? — Конечно. Мы ходили от одной скульптуры к другой. И вот мы встали перед статуей Зевса. Он восседал на своем престоле и метал в людей молнии. Экскурсовод, закончив свой рассказ, повернулась ко мне и спросила: — А вы, батюшка, что скажете? Как вам эта статуя? — Я не разбираюсь в статуях, — ответил я. — Я лишь смотрю и удивляюсь искусству скульптора и творению Божию, которое совершенно, и понимаю, что скульптор, создавший это произведение, имел обостренное чувство Божественного. Посмотрите на Зевса: хоть он мечет в людей молнии, лицо его спокойно. Он не разгневан. Он — бесстрастен.'
      cn: 我在这段时期在雅典综合医院度过了许多时光。希腊，尤其是雅典，经历了战争、占领、饥荒和每日的死亡。我与病人分享了圣餐饼和他们所给予的一切。他们的精神痛苦激发了我对他们的同情。凭借无价的洞察力，我看到了他们心灵的深度。我为前来求医的人祈祷，并了解他们的身体疾病。这促使我进行研究。看到身体的某个部位患病，我想要了解它的科学名称以及所有器官的作用：肝脏、胰腺以及其他身体部位。因此，我购买了医学、解剖学、生理学等书籍，以便学习并保持知识。为了更好地学习，我有时也参加了医学院的讲座。我对所有事物都抱有这种好奇心。我想要在深度和广度上全部了解。如果我前往某个工厂，我想要详细了解其运作方式。如果参观博物馆，我会花几个小时研究雕塑。我将讲述一个故事。有一次，在星期天中午，我经过考古博物馆。我有些时间，于是想进去看看。我漫步在展厅中，欣赏雕塑。在其中一个展厅里，有一群导游在讲解。四周一片寂静。我走近一些。但当导游注意到我时，她对那群人说：——来了个神父。我不喜欢神父。但我觉得这个神父似乎不是一般的神父。我走近一些，说：——早上好。——早上好，——导游回答。——可以让我听听你们在说什么吗？——当然可以。我们从一个雕塑走到另一个雕塑。然后我们站在宙斯的雕像前。他坐在宝座上，向人们发射闪电。导游讲完后，她转过身来问我：——神父先生，您怎么看？您觉得这个雕像怎么样？——我不懂雕塑，——我回答。——我只是看着，惊叹于雕塑家的艺术和上帝创造的奇迹，我明白雕塑家创作这件作品时一定有着敏锐的神性感知。看看宙斯：尽管他向人们发射闪电，但他的脸却平静如水。他没有生气。他——无动于衷。
  - type: paragraph
    text:
      ru: 'Экскурсоводу и всей группе мое объяснение очень понравилось. О чем это нам говорит? О чем? О том, что Бог не одержим страстью даже тогда, когда нас наказывает. Как-то я пошел учиться птицеводству. Я во всем был любознателен, как уже вам сказал. Как-то я пошел учиться птицеводству. Правду вам говорю! Потом я ходил к профессору, который преподавал пчеловодство. К тому же родом он был с острова Керкира. В классе были совершенно разные люди: юноши, девушки, молодежь и старики. Закончив урок, преподаватель подошел ко мне и говорит: — Геронда, знаешь, что я понял? То, что ты достигнешь больших успехов в пчеловодстве. Я спрашиваю: — Почему ты так решил? — По тому, как ты смотришь и с каким вниманием слушаешь, я сделал вывод, что ты годишься на пчеловода. Ты преуспеешь. Ты будешь находить с пчелами общий язык, разговаривать с ними, и они тоже будут с тобой говорить. Я ему отвечаю: — Да, это так. Я буду разговаривать с пчелами, пойду на пасеку, буду слушать их, понимать их и резвиться с ними. Тогда я «потеряю» и рясу, и камилавку!'
      cn: 导游和全组的人都觉得我的解释非常不错。这又在告诉我们什么呢？在告诉我们什么呢？在告诉我们，即便在上帝惩罚我们的时候，祂也不被激情所驱使。有一天，我去学习养蜂。我对于一切事物都充满了好奇，正如您之前已经告诉过您的。有一天，我去学习养蜂。我说的是真的！然后我去见教授，他教蜜蜂养殖。他出身于科斯科耶岛。课堂上坐满了各种各样的人：年轻人、女孩、年轻人和老人。下课后，教授走过来对我说：「赫罗纳德，你知道我明白了什么吗？你将在蜜蜂养殖方面取得很大的成就。」我问：「你为什么这么认为？」他说：「因为你看待问题的方式和你倾听的态度，让我得出结论，你适合做蜜蜂养殖。你会成功。你会和蜜蜂交流，它们也会和你交流。」我回答说：「是的，就是这样。我会和蜜蜂交流，我会去蜂场，我会倾听它们，理解它们，和它们嬉戏。那时，我会失去我的法衣和头巾！」
