  text:
    ru: Там я прожил тридцать три года. Годы благословенные Богом. Эти годы отданны больным и страждущим.
    cn: 我在地上度过了三十三年。上主赐予我这期间的岁月。在这期间，我将我的时光献给了病人和病痛中的人。
  children:
  - type: paragraph
    text:
      ru: 'Я пришел на следующий день в дом господина профессора. Служанка провела меня в гостиную, где я стал ждать его, потому что он вышел на улицу. Я достал Новый Завет, он у меня был маленького формата, и стал читать, чтобы зря не тратить время. Когда появился господин профессор, я закрыл его. Он подошел, я поздоровался, и он спрашивает: — Что это была за книга, Геронда? Я отвечаю: — Это Новый Завет, господин профессор. — Ты богослов? — Нет, — говорю. — Какое у тебя образование? — Первый класс начальной школы, да и там я толком не учился. Грамоте научился в пустыне Святой Горы, в Кавсокаливии. Было у меня два старца, вместе с которыми я жил. — Петь умеешь? — Умею. — У меня, — говорит, — есть церковь, но нет священника. Скольких я священников ни брал, все уходят. Я признался ему: — Господин профессор, я не знаю, воля ваша. У меня есть желание послужить в каком- нибудь учреждении. Это желание у меня с тех пор, как я жил в пустыне. Но тогда, когда у меня было такое желание, вовсе не было цели уехать со Святой Горы. Говорю это искренно! Я не думал об отъезде со Святой Горы, чтобы трудиться в каком-нибудь лепрозории. Мне только понравилась сама идея, о которой я услышал. Я хотел это пережить на опыте, но жил ею лишь в фантазиях. А Бог сподобил меня, и теперь я могу на деле воплотить свои мечты. Тогда профессор спрашивает меня: — К какому владыке ты относишься? Я отвечаю: — К владыке города Кими. Профессор пошел в кабинет и позвонил митрополиту Кими. И владыка, как я позже узнал от протосингела Спиридона, который работал в митрополии и находился там в тот момент, когда звонил профессор, сказал Аливизату обо мне: — Вот поликлиника и нашла своего священника! — И Амилк мне говорит: — Нам нужно послужить литургию. Я отвечаю: — Господин профессор, я не могу служить литургию, потому что боюсь. Я не могу'
      cn: 我第二天来到教授的家。女仆带我到客厅，我在那里等着他，因为他出去了。我拿出新约圣经，因为我怕浪费时间。当教授出现时，我合上了书。他走近，我向他打了招呼，然后他问道：「葛朗德，你读的是什么书？」我回答说：「这是新约，教授。」「你是神学家吗？」他问。「不，」我说，「我的教育是什么？——小学一年级，而且我并没有认真学习。我在圣山的荒野中学会了识字，也就是在卡夫斯卡利维亚。我有两个老者，和他们一起生活。——你会唱诗吗？」他问。「会。」我说。「我有一个教堂，但没有牧师。我请过多少牧师，他们全都离开了。我坦白地告诉他：「教授，我不知道您的意思。我有一个愿望，就是想在某个机构工作。这个愿望从我住在荒野的时候就有了。但那时，我并没有想到离开圣山。我说的是真心话！我并没有想过离开圣山，只是为了在某个疗养院工作。我只是对这个想法感到好奇。我只在幻想中体验过它，但上帝让我有机会在现实中实现我的梦想。教授问我：「你属于哪个主教？」我说：「属于基米主教。」教授走进办公室，给基米主教打了电话。据我后来从斯皮里多尼修士那里得知，他当时在主教座堂工作，当教授打电话时，主教座堂里正在打电话，主教对阿利维萨图说：「基米城找到了自己的牧师！」——阿米克对我说：「我们需要举行圣礼。」我说：「教授，我不能举行圣礼，因为我害怕。」我不能
  - type: paragraph
    text:
      ru: 'служить без разрешения архиепископии… Он говорит мне: — Это моя забота! Твое дело — служить. — У нас должно быть разрешение от архиепископии. — Нет, ты будешь служить без разрешения. Он огорчил меня, но, в конце концов, я решил послушаться. Меня поставили служить, и я каждый день совершал Божественную литургию в поликлинике, в церкви Святого Герасима. — Мы берем тебя, Отче, — сказал он, наконец. Так и произошло. Но что случилось! В церковь Святого Герасима хотел попасть служить один богослов, архимандрит, который отучился в Лондоне, но господин Амилк позаботился о том, чтобы поставили меня. Велетэас — у него была такая фамилия — рассердился. Еще раньше у него был разговор с протосингелом отцом Гервасием Параскевопулосом, и туда был назначен Велетзас. Но потом они узнали, что я там служил, и тогда отец Гервасий вызвал меня в архиепископию. Едва увидев меня, он начал кричать. — Я в ссылку тебя отправлю! Что это ты вытворяешь? Ты что, читать не умеешь? Ты что, не знаешь, что должен получить благословение предстоящей власти? Он меня сильно отругал. Я пошел к Амилку и говорю ему: — Протосингел меня сильно отругал. Он отвечает: — Иди сюда. Амилк берет меня и ведет наверх, к архиепископу. Тогда архиепископом был Трапезундский Хрисанф. Было это в 1940 году, когда началась албанская война. Блаженнейший меня спрашивает: — Какое у тебя образование? — Ваша светлость, у меня нет образования, — отвечаю. — Читать я научился в пустыне. — До которого класса ты учился в школе? — До первого класса начальной школы. Он посмотрел на профессора. — Да... Господин профессор, там рядом Омония, что же нам делать? Как бы люди не поняли нас неправильно. — Я хочу, чтобы был именно он, — настаивает Амилк. — Каким образом? Архиерей спрашивает меня: — Геронда мой, ты умеешь петь? — Умею, на практике. — Послушай, детка мое, — говорит мне, — мы хотим поставить туда образованного клирика, который бы проповедовал, потому что там — центр растления и там должен быть тот, кто будет беседовать, учить людей. Но господин профессор желает, чтобы был ты. Я бы мог сказать, что ты необразован, но твой облик, твои слова лучше доходят до сердца людей, чем проповедь какого-нибудь богослова, который использует ораторские приемы. Сохрани хотя бы этот добрый уровень. Я отвечаю: — Ваша светлость, вашими молитвами! На этом мы и расстались. Я положил ему поклон и ушел. Профессор остался с Блаженнейшим. На другой день у нас была литургия. Я снова нажил себе неприятностей, потому что совершил панихиду без письменного разрешения. Долгая история... Узнав об этом, отец Гервасий рассердился, Но я пережил это спокойно. Меня все это не беспокоило. Непреодолимой оказалась другая трудность, о которой я вам расскажу позже. Я очень полюбил святого Герасима, полюбил и больных. Действительно, я не оставлял'
      cn: 服务没有得到教会大主教的许可……他说给我听：「这关你什么事！你的事是服务。」「我们得得到教会大主教的许可。」「你不用得到许可，」他这样对我说，「你得服务。」他这样使我感到沮丧，但最后我还是决定听从。他们把我安置下来，我每天在诊所里做圣礼，圣格拉斯修道院教堂里做圣礼。——我们把你带来，父亲，——他终于说。就这样发生了。但发生了什么事！圣格拉斯修道院教堂里想来服务的有一个神父，他是从伦敦学成的，但阿米勒克先生却想让我来。韦莱塔斯——他的名字——很生气。他以前还和副主教格列高利·帕拉斯库洛斯谈过话，韦莱塔斯被安排了。但后来他们得知我在这里服务，于是副主教格列高利·帕拉斯库洛斯就把我叫到教会大主教那里。他一见到我就开始大喊大叫：「我要把你发配到流放地！你这是在干什么？你不会读书吗？你不知道要得到即将掌权者的祝福吗？」他狠狠地训斥了我。我去找阿米勒克，对他说：「副主教狠狠地训斥了我。」他回答说：「过来。」阿米勒克把我带到楼上，带到教会大主教那里。当时教会大主教是特拉布宗的希兰。这事发生在1940年，那时阿尔巴尼亚战争爆发了。大主教问我：「你的教育情况怎么样？」「主教大人，我没有受过教育。」「我在荒野里学会读写。」「你在学校里读了几年级？」「只读过一年级。」他看着教授。「嗯……教授先生，我们该怎么办？免得人们误会我们。」「我想让他来，」阿米勒克坚持说。「怎么让他来？」大主教问我：「我的赫农，你会唱歌吗？」「会，我在实践中学会的。」「听着，我的孩子，」他对我说，「我们想在这里安排一个受过教育的神父，他能讲道，因为这里是个堕落的中心，需要一个能与人交谈、教导人的。」但教授却想让我来。我可以说你没有受过教育，但你的外貌和你的言语比一个神父用演说技巧讲道更能打动人心。至少要保留这个良好的水平。我回答说：「主教大人，靠你的祈祷！」就这样我们分手了。我向他鞠躬，然后离开了。教授留在大主教身边。第二天我们举行圣礼。我又惹了麻烦，因为没有得到书面许可就做了追思礼。这是一段漫长的往事……得知此事，副主教格列高利·帕拉斯库洛斯很生气，但我对此很平静。这些事情都不再困扰我。最使我感到困扰的，是后来我将要告诉你的另一件事。我非常爱圣格拉斯修道院的圣格拉斯，也爱那些病人。的确，我从不放弃他们。
  - type: paragraph
    text:
      ru: 'никого, посещал всех. После Божественной литургии я обходил все палаты. Когда утром у меня не было Божественной литургии, я исповедовал тех, кто ожидал меня. Потом ходил по больным. Там я прожил тридцать три года, которые пролетели как один день. Жизнь была благодатная. В поликлинике я настолько был неизвестен и незаметен, что когда в обед, несмотря на сильную усталость, я оставался там и не уходил домой, так как до вечера было еще много работы, то никто не придавал этому никакого значения. Я прятался в одной комнатке, сдвигал стулья в ряд и падал ничком, чтобы не замерзнуть, и спал недолго. Никто меня не замечал. Я ни с кем не заводил знакомства, поэтому мною пренебрегали. Я был необразованным, неприметным и нищим. В церкви заправляли другие люди. Я не знал ничего. И, несмотря на это, я прожил там тридцать три года. Годы благословенные, годы, отданные больным и страждущим. Стали поговаривать о том, что я хороший духовник, и на исповедь стало приходить много народу. Много приходило раненых душ, чтобы там, у святого Герасима, пролить слезы. С какою верой они исповедовались! Как я уже вам говорил, я исповедую больше пятидесяти лет. Я разрешал исповедующемуся часами высказывать все, что он хотел, а в конце и сам кое-что говорил. Когда тот рассказывал много, и не только о себе, я смотрел, что это была за душа. Из всего его поведения я заключал о его состоянии и в конце кое-что советовал, чтобы помочь ему. И то, что он говорил не о себе, тоже было связано с ним, с его личностью, с его душой. Все меня любили за то, что не я поучал их, а они свободно говорили мне все, что хотели высказать. И если приходил человек, который не имел никакого отношения к религии, и говорил мне о своем каком-либо серьезном проступке, я не заострял на этом внимания. Когда заставляешь человека сильнее прочувствовать свой грех, он начинает противодействовать, чтобы иметь возможность потом не расставаться с этим грехом. В конце исповеди я говорил кое-что, что имело связь с его серьезным проступком, сказать о котором он принудил себя. Вот так я и поступал: с одной стороны. не проявлял равнодушия, с другой — не акцентировал на этом внимания. Все зависело от ситуации. Иногда приходилось не уделять этому внимания. А в конце я говорил: — Детка мое, все, о чем ты рассказал, Господь простил. Впредь будь внимателен и молись, чтобы Господь укрепил тебя, а после стольких-то дней иди причащаться. И не акцентировал особого внимания на чем-либо конкретном. Это было весьма ценно. Потому что не только сам человек ответствен за свою ошибку.'
      cn: 没有人，我却访问了所有人。在圣礼之后，我遍访所有病房。当我没有圣礼时，我为等候我的人进行告解。然后，我巡视病患。在那里，我度过了三十多年的时光，这仿佛只是一天。生活是充满恩典的。在诊所里，我如此不为人知，以至于即使在午后，尽管非常疲惫，我仍留在那里，因为还有许多工作要做，直到傍晚。因为没有人注意到我，我便躲在一个小房间里，把椅子排成一排，倒下，以防止冻着，然后很快就睡着了。没有人注意到我。我是个不识字的人，不显眼，而且贫穷。在教堂里，其他人掌权。我不知道任何事情。然而，我在那里度过了三十多年的时光。那些年是神圣的，是献给病患和痛苦者的年份。人们开始谈论我是好神父，因此前来告解的人越来越多。许多人带着受伤的灵魂来到圣费拉西斯，以在圣费拉西斯那里流泪。他们怀着多么虔诚的态度进行告解！正如我之前已经告诉过你的，我进行了超过五十年的告解。我允许告解者长时间地讲述他们想说的话，然后在我结束时，我也会说一些话。当他们讲述很多，不仅仅是关于自己时，我会观察他们，以了解他们的状态，并在最后给他们一些建议，以帮助他们。他们讲述的不仅仅是关于自己的事情，这些事情也与他们有关，与他们的个性和灵魂有关。所有人都因为我没有对他们进行教导，而是让他们自由地向我倾诉而爱我。如果有人来，与宗教毫无关系，却告诉我他的一些严重错误，我不会特别关注这一点。当你要求一个人更深刻地感受到自己的罪过时，他会开始反抗，以便能够在之后保留这个罪过。在告解结束时，我会说一些与他的严重错误有关的话，这是他强迫自己说出的。这就是我所做的一切：一方面，我不表现得冷漠，另一方面，我不特别关注这一点。这取决于情况。有时，我必须不关注这一点。然后，我会说：——我的孩子，你告诉我的所有事情，上帝都宽恕了。以后要更加警醒，要祈祷，让上帝加强你，然后在这样多天之后，去领圣餐。我不特别关注任何具体的事情。这非常有价值，因为不仅这个人对他的错误负责。
