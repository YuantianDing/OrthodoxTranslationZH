  - type: paragraph
    text:
      ru: 'Как-то раз был дождливый день, – вспоминал старец Порфирий. – Когда дождь прекратился, мы видели из мастерской, где работали, что много отцов из других келий идут в сторону пещеры святого Нифонта за улитками. Отец Иоанникий увидел проходивших мимо отцов и расстроился. Он хотел, чтобы и я пошел за улитками. Я говорю ему: — Старец сказал, чтобы я не ходил. Я уже собирался, но он вернул меня. Но если ты хочешь, чтобы я пошел, я окажу послушание и пойду. Тогда он говорит мне: — Сходи. Сегодня много улиток. Я взял торбу и убежал. Вначале я не бежал, чтобы старцы не видели меня. Но, отойдя поодаль, я пустился бегом. Я зашел высоко, на какие-то отвесные скалы, куда не забредают даже кабаны, когда в сырую погоду собираются стаей и идут есть улиток. Я собирал их три часа. Набрал много, полную торбу. Я очень сильно вспотел, и на спуске — а был вечер и воздух охладился — меня прохватил холодный ветер, спускавшийся с Афона к морю. Торба на плече вся промокла, а спина у меня замерзла от слюны, которую выделяли улитки. Спускаясь по непроходимым местам, я должен был перейти осыпь — это такой склон, усыпанный битыми камнями, щебнем. Когда я дошел до середины, вся осыпь, подобно реке, стала двигаться с вершины горы, увлекая за собой камни, глыбы и все остальное. Ширина ее была пятнадцать — двадцать метров. Ноги мои погрузились в камни до колен, я не мог идти. Я был с грузом и в этой смертельной опасности стал кричать: «Богородица моя!» Через секунду невидимая сила отбросила меня на двадцать метров, на противоположную сторону ущелья, на какие-то большие скалы, которые тоже вот-вот могли покатиться вниз. В эту минуту внизу проходили отцы, возвращавшиеся от святого Нифонта. Они тоже несли улиток. Они увидели осыпь, оценили опасность и стали кричать: «Э-эй! Может быть, там кто-то есть?» Я был уже вдали от опасности, целый и невредимый. Только башмаки мои остались в осыпи, а ноги были все в крови. Отцы снова начали кричать, но я не отвечал. Хотел ответить, но не мог. У меня был шок. Я их слышал, но не отвечал. Нетронутая торба висела у меня на плече. Там было больше восьмидесяти ока . Придя в себя, я начал карабкаться по одной скале, затем по другой, пока не спустился вниз. — Лишь только я спустился, столкнулся с другой опасностью. Я заметил змею, которую называют молочницей. Я очень испугался... Спасение Божие, вот что это было! Я пришел на келию, охваченный ужасом. Упал и рассказал старцам обо всем, что со мною случилось. Я был в шоке, – вспоминал старец'
      cn: 有一天下起了雨，长老彼罗菲里回忆道。当雨停了，我们从工作室里看到，许多修道者从其他小院里走过来，前往圣尼福特洞穴采集蜗牛。长老伊凡尼基耶维奇看到他们经过，感到很不高兴。他想让我也一起去。我说：「长老说我不应该去。」我正要走，但他又把我说回来了。但他又说：「如果你愿意，我可以去。」于是我说：「如果愿意，我会去的。」他才说：「去吧。今天有很多蜗牛。我拿了一个袋子，就跑出去了。开始时我没有跑，以免老修道者看到我。但走远后，我开始奔跑。我跑到了一些陡峭的悬崖上，连野猪在潮湿的天气里也不会去那里觅食。那里有蜗牛。我花了三个小时才收集到很多蜗牛，装满了袋子。我非常热，到了下山的时候，空气已经变凉了，冷风从阿波尼亚吹下来，直往海里吹。袋子湿透了，我的脊背因为蜗牛分泌的液体而冻僵了。下陡峭的山路时，我必须穿过一片乱石坡——那是满是碎石和沙子的斜坡。当我走到一半时，整片乱石坡就像一条河一样，从山顶上流下来，带着石头、巨石和一切其他东西一起滚下来。它的宽度有十五到二十米。我的脚陷入乱石中，无法行走。我带着沉重的袋子，处在生死攸关的危险中，开始大喊：「我的圣母！」只过了一秒钟，无形的力量就把我推到了二十米远的地方，到了另一边的悬崖上，那些悬崖随时可能滚下来。这时，在下面的修道者们正从圣尼福特洞穴回来。他们也带着蜗牛。他们看到了乱石坡，估算了危险，开始大喊：「喂！可能有人在那儿吧？」我已远离了危险，全身完好无损。只是我的靴子留在了乱石坡上，脚上全是血。修道者们又开始大喊，但我没有回应。我想回应，但无法说话。我处于震惊之中。我听见了他们，但没有回应。装满了蜗牛的袋子仍然挂在了我的肩膀上。里面装了八十多只蜗牛。恢复过来后，我开始沿着一块岩石爬，然后又爬到另一块岩石上，直到最后从山下爬了下来。——我刚从危险中下来，就遇到了另一个危险。我看到一条被称为乳头蛇的蛇。我非常害怕……天啊，这就是它！我来到小院，浑身发抖。跌倒在地，把发生的一切都告诉了修道者们。我处于震惊之中，——长老回忆道
  - type: paragraph
    text:
      ru: 'Порфирий. – Рассказал об осыпи, о башмаках, которые потерялись, о своих ногах, которые были все в крови, о змее. Старец очень огорчился и наказал отца Иоанникия. Он дал ему епитимью: не литургисать много месяцев, — а тот плакал обо всем, что случилось.'
      cn: 普罗菲里。——讲述关于沙尘暴、丢失的靴子、满是鲜血的双脚以及蛇的故事。长老非常难过，责罚了雅各伯修女。他给她施加了苦修：几个月内不要做弥撒，她为此哭诉了所有发生的事情。
- type: heading1
  text:
    ru: Он поцеловал меня в лоб, расстались, обливаясь слезами.
    cn: 他吻了我的额头，我们泪流满面地告别。
  children:
  - type: paragraph
    text:
      ru: 'По причине того самого переохлаждения у меня начался гнойный плеврит, и я жестоко мучился, – вспоминал старец Порфирий. – У меня не было аппетита, я не хотел есть. Старцы позвали высокого, святого подвижника — отца Антония. Церковь его келий была освящена в честь преподобных отцов, на Святой Горе Афонской подвизавшихся и в подвиге просиявших. Он немного лечил. Он пришел, осмотрел меня, сходил в свою каливу и принес вытяжной пластырь, налепил его мне на спину. Всю ночь пластырь вытягивал жидкость из моей спины. На другой день, часов в десять утра, он взял ножницы, продезинфицировал их спиртом и стал разрезать пластырь, который пропитался мокротами и стал похож вместе с моей кожей на подушку. Отрезал он вместе с кожей. Боль в тот момент была нестерпимой. Силы мои истощились, и я потерял сознание. Когда пришел в себя, то ощутил великую внутреннюю радость, потому что мог молиться. Тогда я начал петь: «От многих моих грехов немощствует тело, немощствует и душа». Услышав меня, отец Иоанникий подходит ко мне, целует меня в лоб и говорит: — Сынок, прости меня! Приходит старец и говорит ему сурово: — А – слепой человече! Видишь, что ты наделал?! У меня не было аппетита, я не хотел есть, ел совсем чуть-чуть, и с каждым днем мне становилось все хуже. Был близок к смерти. Старцы и сам отец Антоний, который лечил меня, испугались, что я умру. — Мальчик должен уехать, — сказал отец Антоний, — он не выдержит. Ему нужны лекарства, которых у нас нет. Он не ест, и чем дальше, тем хуже. Подумайте только, я сделал один глоток толченого миндаля, и мне стало плохо. Настолько ослабел мой желудок. Старцы очень хотели, чтобы я жил с ними, но оказались перед необходимостью отправить меня в мир, потому что на Святой Горе не было ни молока, ни мяса. Тогда они дали мне свое благословение, сделали бумаги от дикея скита, чтобы я около двух месяцев провел в деревне, пока не приду в себя. И я уехал. Отец Иоанникий взял меня и отвез в Дафни на лодке с веслами. Тогда моторных лодок совсем не было. Не было ни мулашек, ни техники. Если надо было что-либо отнести наверх, подвижники носили на своих плечах, на спине. Итак, мы приехали в Дафни. Я не мог стоять. Меня положили в комнате, где располагалась почта. Вскоре у меня страшно заболели почки. От боли я заплакал. Плакал и отец Иоанникий. Я же, несмотря на сильную боль, нашел в себе силы, чтобы утешать его: — Не плачь, Геронда. Я выздоровею, нет у меня ничего... А он, плача, утешал меня:'
      cn: 因为那个寒凉，我开始生了脓性肺结核，痛苦不堪，老方济各回忆道。我没有食欲，不想吃东西。长老们请来了高高在上、圣洁的隐修者——方济各长老。他的修道院教堂以圣徒们的名字命名，他们在圣山阿索斯山上修行，以圣德著称。他稍微治疗了一下。他来了，检查了一下，去了他的小屋，拿来了引流膏，贴在我的背上。整夜，膏药都在从我的背上引流液体。第二天，上午十点钟左右，他拿出了剪刀，用酒精消毒，然后开始剪掉那浸透了痰液的膏药，它和我的皮肤一起变得像枕头一样。他剪掉了膏药和皮肤。当时疼痛难忍。我的力气已经耗尽，我失去了知觉。当我醒来时，感到极大的内心喜悦，因为我可以祈祷了。于是，我唱道：「因为我的许多罪孽使我的身体软弱，我的灵魂也软弱。」听到我的歌声，方济各长老走过来，吻了我的额头，说：「孩子，我向你道歉！」然后，老方济各严厉地对他说：「你这个瞎子！你看，你做了什么！」我没有食欲，不想吃东西，只吃了一点，而且一天比一天更糟。我快要死了。长老们和方济各长老，他治疗我的人，都很担心我会死去。他说：「孩子必须离开，他承受不了。他不吃东西，情况会越来越糟。想一想，我只喝了一小口研磨的榛子，就感到不舒服。我的胃变得多么虚弱。长老们非常希望我留在他们身边，但不得不让我离开圣山，因为山上没有牛奶和肉。于是，他们给了我他们的祝福，签了修道院的文件，让我在村里待两个月，等我恢复过来。然后我离开了。方济各长老带我坐船到了达芬尼。那时还没有马达船。没有骡子和机械。如果需要把什么东西送到山上，隐修者们就用肩膀扛着，或者背在背上。于是，我们来到了达芬尼。我不能站立。我被放在了有邮局的房间里。不久，我的肾开始疼痛。我因疼痛而哭泣。方济各长老也哭着安慰我：「不要哭，赫尔农德。我会好的，我没有什么……」他哭着安慰我。
  - type: paragraph
    text:
      ru: — Не плачь, детка мое, ты выздоровеешь. Пришел корабль, он меня посадил, поцеловал в лоб.... Так старец Порфирий уехал с Афона.
      cn: — 不要哭，我的宝贝，你会好的。一艘船来了，它把我接走了，亲吻了我的额头……于是长老帕福里耶离开了阿芙洛斯。
