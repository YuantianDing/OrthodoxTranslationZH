  text:
    ru: Кавсокаливия 1991
    cn: 喀布斯卡利维亚 1991
  children:
  - type: paragraph
    text:
      ru: 'Прошу всех вас простить меня за все, чем я вас огорчил. Кавсокаливия, 417 июня 1991 года Возлюбленные мои духовные чада, сейчас, пока я еще нахожусь в здравом уме, я хочу дать вам важные советы. С малых лет я весь был в грехах, – смиренно сказал отец Порфирий. – И когда мать посылала меня пасти овец в горах, потому что отец мой, так как мы были бедняки, уехал работать в Америку, я там, на пастбище, по слогам читал житие святого Иоанна Каливита. Я сильно полюбил святого Иоанна и очень много по-детски молился. А было мне лет двенадцать — пятнадцать, не помню точно. Желая ему подражать, я с великим трудом тайно уехал от своих родителей и прибыл на Святую Гору в Кавсокаливию, где стал послушником у двух старцев, родных братьев, — Пантелеймона и Иоанникия. Мне повезло в том, что они были очень благочестивые и добродетельные. Я очень сильно полюбил их и потому, по их молитвам, был у них в полном послушании. Это принесло мне великую пользу. Я почувствовал и великую любовь к Богу и жил очень хорошо. Но по попущению Божию за грехи свои сильно заболел, и старцы сказали, чтобы я уехал к родителям в свою деревню Святого Иоанна на Эвбее. И хотя малым ребенком я наделал много грехов, вернувшись в мир, я снова стал грешить, и грехи мои доныне весьма многочисленны. Но люди приняли меня как хорошего, и все кричали, что я — святой. Я же чувствую, что я самый большой грешник на свете. Те грехи, которые я вспомнил, я, конечно, поисповедал и знаю, что Бог простил их мне. Но сейчас я чувствую, что у меня очень много духовных грехов, и прошу всех, кто знает меня, помолитесь обо мне, потому что и я, когда жил, очень смиренно молился о вас. Но теперь, когда пойду на небо, у меня такое чувство, что Бог скажет мне: «Что тебе здесь надо?» А я могу ему сказать только одно: «Господи, я недостоин быть здесь, но чего любовь Твоя пожелает, то пускай и сделает мне». Потом не знаю, что будет. Но желаю, чтобы подействовала любовь Божия. И всегда желаю, чтобы мои духовные чада возлюбили Бога, Который есть все, чтобы Он сподобил нас войти в Свою земную и нетварную Церковь. Потому что начинать нужно отсюда. Я всегда старался молиться и читать богослужебные тексты, Священное Писание и жития святых. Желаю, чтобы и вы поступали так же, – закончил отец Порфирий. – Прошу всех вас простить меня за все, чем я вас огорчил... Иеромонах Порфирий. Кавсокаливия, 417 июня 1991 года»'
      cn: 亲爱的信徒们，现在我虽然还清醒，我想给你们一些重要的建议。我父亲的门徒，奥弗瑞吉亚修道院院长，如是说：「从我小时候起，我就深陷罪恶之中。当我的母亲派我去山上放羊，因为我的父亲为了生计不得不离开这里去美国工作时，我便在羊群中，一个字一个字地读着圣约翰·卡利维特的生平。我深深地爱上了圣约翰，并且非常天真地祈祷。那时我大约十二岁或十五岁，我已经记不清了。为了模仿圣约翰，我偷偷地离开了父母，来到了卡瓦斯卡利维亚圣山，成为帕尼泰利蒙和伊奥尼基兄弟的修士。我幸运的是，他们都是非常虔诚和德行高尚的人。我非常爱他们，因此，通过他们的祈祷，我完全服从了他们。这对我产生了巨大的益处。我感受到了对上帝的极大爱，并且生活得很好。但因为上帝的旨意，我因罪过而生病，长老们让我回到我父亲的家乡，在伊奥尼的埃维亚岛。虽然我从小犯了无数的罪，但回到人间后我又开始犯罪，我的罪过至今仍然很多。然而人们却认为我是圣人。而我却感到自己是世上最大的罪人。我记起的那些罪过，我当然已经忏悔，并且知道上帝已经宽恕了它们。但现在我感到自己有很多精神上的罪过，希望你们中的任何人，如果认识我，都为我祈祷，因为当我活着的时候，我总是非常谦卑地为你们祈祷。但现在，当我将要升天时，我有一种感觉，仿佛上帝会说：『你在世上还需要什么？』而我所能说的只有：『主啊，我配不上在这里，但愿你的爱能为我做任何事情。』然后我不知道会发生什么。但愿上帝的爱能发挥作用。我总是希望我的精神儿女们能爱上帝，因为他是万物之源，这样他才能使我们进入他的地上和无朽的教会。因为这一切都从这里开始。我总是努力祈祷，阅读圣礼文本，读圣经，读圣徒的生平。我希望你们也能这样做，」奥弗瑞吉亚修道院院长奥弗瑞吉亚如是说。卡瓦斯卡利维亚，1991年6月417日。
