    text:
      ru: 'нее. Книга была высоко. Я, маленький, не мог до нее достать и размышлял, как лучше это сделать, все ходил кругом, ходил... - «Да ладно, — решил я, — хотя бы гляну, о чем она». Тогда я поставил скамейку, поднялся на нее, достал книгу и спустился вниз. Каково же было мое разочарование! Буквы были все спутаны, как будто она была написана на иностранном языке. Она был написана от руки. Большая книга, очень большая, толстая. Я не мог понять эти старые словечки: «чрез», «бо» и тому подобные, потом уже их выучил. И буквы были особенные... Какая-то «сигма», какая-то... Как бы вам объяснить, какая она была! Это была рукопись. Книга преподобного Симеона Нового Богослова. Но книга очень большая, с толстыми листами. Она была очень тяжелая, весила много килограммов. Я не смог читать ее и положил снова наверх. Но после этого на меня напали печаль, смущение, скорбь. Не шла ни работа, ни молитва. Ничего. Раньше, когда старцев не было, я ходил в церковь, приходил в умиление. К тому же у меня был прекрасный голос, поэтому я пел. Пел тропари, как бы причитал. Это было похоже на рыдание. Они были умилительными, нравились мне и глубоко меня затрагивали. Но в этот раз после преслушания я не пошел в церковь. Вышел наружу, сел на отмостку и с печалью стал смотреть на Эгейское море. Сидел и смотрел на море. Мне даже не хотелось говорить: Господи Иисусе Христе. Ох, вы меня понимаете? Полное уныние. Я даже не пошел в церковь, не произносил: Господи Иисусе Христе. На меня напала тоска, Я верил в Бога, но не хотел преступать заповеди старцев. Бога я ощущал, но не хотел огорчать и человека. Я не хотел быть причиной печали кого-нибудь. Но что делать! Ох... Итак, вечером пришли старцы. Что мне, бедному, делать? Решил им все рассказать, но не смог. Пошел в церковь лишь потому, что должен был идти со старцами. Прочитали вечерню, прочитали повечерие. Я не сказал им ничего. Поднялся в комнату, наверх, комнаты мы называли «кавья». Не стал ни поклоны делать, ни правила совершать, ни молиться по четкам. Я лег на постель и представил, как я буду лежать в гробу, когда умру. И меня охватила еще большая печаль. Утром зазвонил колокольчик. Мы спустились, я читал во время службы, мы закончили утреню, после отпуста вышли наружу. Ушли из церкви, чтобы пойти в трапезную. Больше я не мог терпеть. Я потянул за рукав старца, «старшего», духовника, и говорю ему: — Геронда, можно тебя на минутку? Он тут же повернулся, мы снова пошли в церковь, и я сказал ему: — Я расстроен... Я совершил преслушание. Ты сказал, чтобы я не прикасался к той книге, а я ее посмотрел и с тех пор не могу найти покоя. Не могу ни молиться, ни совершать свое правило, ни делать поклоны. — Детка мое, разве я не говорил тебе? Почему ты это сделал? — Геронда, прости меня. Это было искушение, и я в большом унынии. Прости меня, и по твоим молитвам я впредь буду внимателен и не ослушаюсь. Он прочитал надо мной молитву. И вы представляете?! – Все тут же ушло! У меня было одно качество: лишь только я исповедался старцу, то, слава Богу, все у меня тотчас проходило. И каждый раз после исповеди меня посещала великая радость и я с особым усердием предавался молитве. Я верил, что сказанное на исповеди сказано Богу, что я снова с Богом. Как явственно я ощущал это внутри себя. Это трудно представить! А теперь я вижу, как некоторые говорят: — «Смотри, чтобы об этом не узнал старец!» Понимаете?.. А у нас старец был в глубине сердца, – вздыхал старец Порфирий .'
      cn: 我看得很高。我，一个小孩子，无法触及它，思考如何才能做到，我绕着房间走来走去，走来走去……—「算了，」我心想，「哪怕看看她写了些什么也好。」于是，我搬来一张小板凳，爬上去，取下那本书，然后下来。我的失望之情何其强烈！那些字母都变得混乱不堪，仿佛是用一种外文写的。它们是用笔写的。那是一本大书，非常大，非常厚。我无法理解那些古老的文字：「穿越」、「因为」等等，后来我学会了它们。那些字母也特别……怎么形容它们呢？它们就像某种「西格玛」，某种……您能想象它们的样子吗？那是一本修道士西蒙新伯罗尼科的著作。但那本书非常大，厚实的纸张。它非常沉重，重了好几公斤。我无法阅读它，又把它放回原处。但之后，我感到忧伤、困惑、悲伤。工作和祈祷都无济于事。什么也解决不了。以前，当修道士不在时，我会去教堂，感到无比的感动。而且我有一个美妙的嗓音，所以我会唱歌。唱经文歌，仿佛在哭泣。它们是那么动人，我喜欢它们，深深地打动了我。但这次，经过祈祷后，我没有去教堂。我走出教堂，坐在台阶上，怀着忧伤的目光望着爱奥尼亚海。我甚至不想说：上主耶稣基督。哦，您明白吗？完全的忧伤。我甚至没有去教堂，没有说：上主耶稣基督。我感到忧郁，我信奉上帝，但我不愿意违背修道士的教诲。我感觉到上帝，但我不愿意伤害任何人。我不愿意成为任何人痛苦的原因。但该怎么办？哦……于是，晚上，修道士来了。我，可怜的我，该怎么办？决定把一切都告诉他们，但没能说出口。只是因为必须和修道士们一起去教堂，所以我才去了教堂。读了晚祷，读了晚课。我没有对他们说些什么。我回到房间，上到楼上，我们称之为「卡瓦耶」的房间。我没有做任何祈祷，没有做任何功课，也没有数着念珠祈祷。我躺在床上，想象着自己躺在棺材里，等死。我感到更大的忧伤。清晨，钟声敲响。我们下去了，我在祈祷时读经文，我们结束了早祷，然后走出教堂，去餐厅。我再也忍受不了了。我拉了拉修道士的衣袖，叫他「长老」，我的精神导师，然后对他说：「赫罗纳德，能和你聊一会儿吗？」他立刻转过身来，我们再次走进教堂，然后我说：「我感到很沮丧……我犯了罪……你让我不要碰
  - type: paragraph
    text:
      ru: Я сильно любил своих старцев, хотя в то время все послушники любили своих старцев. После Бога первым был старец. Если ты совершал что-нибудь против его воли, то из-за преслушания не мог ни причащаться, ни делать что-либо иное…
      cn: 我非常敬爱我的长老，尽管那时所有的门徒都敬爱他们的长老。上帝之前，是长老。如果你做了违背他意愿的事情，那么由于不听从，你就不能受圣餐，也不能做其他任何事情……
- type: heading1
  text:
    ru: Послушание – это Тайна духовной жизни
    cn: 听命 – 这是精神生活之密诀
  children:
  - type: paragraph
    text:
      ru: 'Многие на Святой Горе жили в безвестности, умирали, и никто о них не знал. И я хотел жить так же тайно, – вспоминал старец Порфирий. – Я не хотел стать ни священнопроповедником, ни кем-либо другим. И никогда я не допускал мысли уехать со Святой Горы. Юный мальчик в совершенной пустыне! Чтобы понять, как это жить в пустыне без посторонней помощи, я поднимался в горы и часами оставался там, чтобы быть как пустынник. Находил дикие травы и ел их, делал это ради подвига. Я хотел жить один, как тот святой, которого я любил с детства, как святой Иоанн Каливит. Это был мой любимый святой. Я ему подражал. Меня поразило, как он смог выдержать жить рядом с родителями, поставить свою каливу напротив их дома и не открыться им, а все время их укреплять. Так и в тропаре сказано: «От младенчества Господа возжелел ecи тепле, мир оставил ecи и яже в мире сладкая, и подвизался ecи добре; поставил ecи каливу пред вратами твоих родителей, разрушил ecи демонов козни, всеблаженне; сего ради тя, Иоанне, Христос достойно прославил есть». И в Ексапостилларии: «Нищий, яко иной Лазарь, пребыл ecи, преподобие, у врат родительских, печалуяся. Геронда, малою каливою, всемудре. Но обрел ecи ныне пространное со ангелы вселение и святыми всеми на небесах, Иоанне». Своему старцу я рассказывал все! – утверждал старец Порфирий. – Да, открывал все помыслы, и он иногда, когда видел крайности, предостерегал меня: — Это прелесть, детка. Вся моя жизнь была сплошным раем: молитва, служба, рукоделие, послушание моим старцам. Но послушание мое было плодом любви, оно не было вынужденным. Это благословенное послушание принесло мне огромную пользу. Оно изменило меня. Я стал сообразительным, энергичным, более крепким телом и душою. Оно привело меня к познанию всего. Я должен день и ночь благодарить Бога, что Он удостоил меня пожить этой жизнью. Я преклонился под иго послушания и углубился в изучение его. Все остальное, что Бог принес в мою жизнь, пришло само собою. И дар прозорливости дан был мне Богом за послушание. Послушание показывает любовь ко Христу. Христос особенно любит послушных. Поэтому Он говорит: «Любящих меня я люблю, и ищущие меня найдут меня» (Притч. 8:17). В Священном Писании все открыто, но прикровенно.'
      cn: 许多人在圣山上生活着默默无闻，死后无人知晓。老方济各也想这样生活——他回忆道——我想要像隐修士一样生活，既不成为牧师，也不成为其他任何人。我从未想过要离开圣山。一个在荒野中的年轻男孩！为了理解在没有旁人帮助的情况下在荒野中生活是什么感觉，我经常爬上山，一待就是好几个小时，以便让自己像隐修士一样。我采集野生草药，吃它们，这样做是为了做一番圣功。我想要独自生活，像我从小爱慕的圣人一样，像圣·若望·卡利维特一样。他是我最喜欢的圣人。我模仿他。我被他如何与父母同住，却在他们面前立下自己的卡利维特，却不泄露自己的秘密，同时又一直鼓励他们，所感动。这在赞歌中也有所体现：「从孩提时，主耶稣就喜爱和平，他离开世界，为了使世界和平，他使和平甜美，他努力不懈。他立下卡利维特在父母的门前，摧毁了魔鬼的阴谋，他真是光荣的。因此，主耶稣因你，若望，光荣地称你为光荣的。」在《使徒信经》中也有这样的记载：「贫穷，像另一个拉撒路，你作为圣徒，住在父母的门前，忧伤。你用小卡利维特，智慧地生活。但你如今已得到永恒的住所，与天使同在，在天上与圣徒同在，若望。」我将这一切都告诉我的老修士！——老方济各说——是的，我将一切想法都告诉他，而他有时，当我看到极端时，会警告我：「这真是诱惑。」我的一生都是天堂：祈祷、服务、手工艺、对我的老修士的服从。但我的服从是出于爱，而不是被迫。这种神圣的服从为我带来了巨大的益处。它改变了我。我变得聪明、精力充沛、身体更强壮、心灵更强大。它使我了解了所有事物。我必须日夜感谢上帝，感谢他赐给我这样的生活。我屈服于服从的轭，并深入研究它。其余的一切，上帝都自动赐予我。上帝也通过服从赐给我智慧的恩典。服从显示了对基督的爱。基督特别喜爱顺从的人。因此，他说：「我爱那些爱我的人，那些寻找我的人，我必遇见他们。」（箴言 8:17）在圣经中一切都是公开的，但都是秘密的。
