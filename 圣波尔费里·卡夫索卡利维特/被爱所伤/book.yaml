  text:
    ru: Я имел большую ревность к духовной жизни
    cn: 我对于精神生活有着极大的热忱
  children:
  - type: paragraph
    text:
      ru: 'Старцы никогда не указывали, что мне делать, – вспоминал старец Порфирий. – Они дали мне четки и сказали: — Говори молитву... Больше ничего... Они видели мою ревность и не говорили мне много, даже того, что мне читать. Они не позволяли мне читать ничего из великих отцов, где даны были слишком строгие правила. То есть они не позволяли мне читать преподобных Ефрема, Исаака, Иоанна Лествичника, Симеона Нового Богослова, читать Эвергетинос и многое другое. Мне это было запрещено. Поэтому, выполняя послушание, я читал лишь жития святых, Псалтирь, Октоих, Минею и таким образом хорошо научился читать, потому что раньше толком не умел. Но у меня была большая ревность к духовной жизни. Я часто ходил к церкви Святого Георгия, где помогал по строительству, и пел много песнопений. Больше всего мне нравились троичные каноны, а также те песнопения, где говорилось о Божественной любви. Это было рыдание, песнь любви — как хотите это называйте. Я плакал, обливаясь слезами. Но это были не слезы печали, а слезы радости, Божественной радости. Я приходил в умиление, прекрасно пел! Это была моя жизнь. Я жил благодатью Господней, а не своей силой. Все было от Божественной благодати. Причиной всего были не мои способности, не моя ученость, которой не было, ни то, ни другое, ни третье... Все было от благодати Божией. Но иногда меня заносило, – признавался старец Порфирий. – Не спрашивая старцев, я начинал самовольничать. Вот послушайте. Для чистоты ума я начал заучивать Священное Писание наизусть. Начал с начала, с Евангелиста Матфея. Однажды представился случай, и я рассказал старцам первую главу от Иоанна. Услышав это, они отругали меня за то, что я выучил без благословения.'
      cn: 老人们从未告诉我该做什么，老方济各回忆道。他们给了我念珠，然后说：「念经……」除此之外，什么也没有说。他们看到我的嫉妒，没有给我太多指示，甚至没有告诉我该读什么。他们不允许我读那些伟大的圣人著作，因为其中有很多严格的规则。比如，他们不允许我读埃弗莱姆、伊萨克、约翰·拉索提克、西蒙·新圣者等人的著作。他们不允许我读埃弗格里特诺斯等人的著作。因此，我只能读圣徒传、《圣经》、《奥一十经》、《米奴亚经》等，从而很好地学会了阅读，因为以前我并不擅长阅读。但我对精神生活有着强烈的渴望。我经常去圣乔治教堂帮忙修建，还经常唱赞美诗。我最喜欢的是三日经，以及那些赞美上帝之爱的赞美诗。这就像哭泣，赞美诗，你们怎么称呼都行。我哭泣，泪如雨下。但这不是悲伤的泪水，而是上帝之爱的喜悦，神圣的喜悦。我沉浸在赞美中，美妙地歌唱！这就是我的生活。我生活在上帝的恩典中，而不是依靠自己的力量。一切都是出于上帝的恩典。但有时我会失去自我控制，老方济各承认。我没有征求老人们的同意，就擅自行动了。你们可以听听。为了纯洁心灵，我开始背诵《圣经》。我从《马太福音》开始。有一次，我有机会向老人们讲述《约翰福音》的第一章。听到后，他们责备我，说我背诵了《约翰福音》第一章，但没有得到许可。
- type: heading1
  text:
    ru: Я ждал этого часа с великим вожделением!
    cn: 我期盼这一刻以极大的渴望！
  children:
  - type: paragraph
    text:
      ru: 'Чада, с чего начать вам рассказ о том, как я стал монахом? Это долгая история — моя жизнь на Святой Горе, – так начал рассказ старец Порфирий. – Когда мне было уже четырнадцать лет, старец подозвал меня и спросил: — Что ты собираешься делать, каковы твои планы? Останешься здесь? — Останусь! — ответил я, полный ликования и радости. — Положи поклон… Я сделал поклон. Тогда он принес мне свою рясу, старую, в которой он работал. Она была штопана-перештопана до такой степени, что уже не было видно первоначального материала, из которого она была сшита. От пота воротник был весь засаленный. В кириаконе я видел прекрасно одетых монахов и мечтал о такой же рясе. Да что там говорить! Я жаждал этого часа и по-детски думал тогда, что и ряса, которую на меня наденут, будет красивая и новая. Но когда наступил этот час, что я увидел? Какие-то заштопанные лохмотья! Я огорчился, правда ненадолго, всего на пять минут. Да я и был ребенком, четырнадцати лет. Но ничего не сказал, не стал жаловаться. Увидев рясу, я почувствовал смущение, как я вам сказал, но тотчас обратил его на доброе. — Благословите! — сказал я и взял ее. Больше я об этом не думал. Я думал о подвижниках, которые носили власяницы, никогда их не снимали и не стирали. Бог за это послал мне великое утешение. Я пошел на чтение Псалтири. Мне выпало читать Соборное послание Иоанна. И в тот же день, Боже мой, Ты говорил со мной! Боже мой, Ты сказал мне так много, – признался отец Порфирий.'
      cn: 孩子，你从哪里开始讲述我如何成为修士的故事？这是一段漫长的旅程——我的圣山生活，——修士帕夫里里长老这样开始讲述。——十四岁那年，长老叫住我，问道：「你打算做什么？你的计划是什么？留下来吗？」——留下来！——我回答，心中充满了喜悦和快乐。——请做一个礼拜……我做了礼拜。然后他递给我一件旧袍子，那是他工作的袍子。它已经被补了又补，以至于最初的材料已经看不出来了。领口因为汗水而变得发黄。在卡里亚克里，我看到穿着华丽的修士，心中充满了羡慕。更不用说，那时我还天真地以为，给我穿上的新袍子也会是漂亮的和崭新的。但当这一刻到来时，我看到了什么？一些补丁缝合的破布！我感到失望，但只持续了五分钟。我那时还是个孩子，十四岁。但我没有抱怨，也没有说什么。看到那件袍子，我感到羞愧，但我立刻把它转化为善行。——请祝福！——我说，然后接过了它。此后，我再也没为此事感到困扰。我心中想着那些戴着发冠的修道者，他们从不摘下，从不清洗。上帝因此赐给了我极大的安慰。我开始诵读《诗篇》。我被分配读《约翰书信集》。就在那一天，我的上帝，你与我说话了！我的上帝，你对我说了那么多，——长老帕夫里里回忆道。
- type: heading1
  text:
    ru: Через два-три года я принял великую схиму.
    cn: 经过两年三月，我接受了伟大的修道圣职。
  children:
  - type: paragraph
    text:
      ru: Через два-три года я принял великую схиму, – рассказывал старец Порфирий. – Накануне я получил еще одно особое благословение. С моим старцем мы должны были пойти в Великую лавру, чтобы взять благословение на постриг. Игумен, давший благословение, был очень святой человек. Там, где мы проходили через келию аскета, святого Нила Мироточивого на пути к лавре, я в первый раз почувствовал небесное благоухание. Благоухание переполнило меня всего, и я сказал об этом старцу. Тот выслушал меня в простоте, не сказал ничего и пошел дальше. Так и нам подобает смотреть на это просто. Во второй раз я ощутил небесное благоухание на мощах святого Харалампия. В ночь моего пострига все отцы собрались в церкви Святой Троицы, в кириаконе, отслужили всенощное бдение и пропели прекрасные умилительные песнопения. Я был в белых носках, разутый и исполненный умиления, – вспоминал старец Порфирий. – Я положил всем поклон, приложился к святым иконам, и предстоятель стал задавать мне специальные вопросы последования великой схимы. Глаза мои от умиления были полны слез. Когда бдение закончилось, мы пошли на келию. Я был в большой радости, но хранил молчание. Я хотел быть наедине с одним Богом. Когда находишься в таком состоянии, то не хочется ни петь, ни говорить. Ищешь молчания, чтобы ясно расслышать голос Христа.
      cn: 经过两年多，我接受了伟大的修道，老修道师普罗菲利耶夫讲述道。临行前，我得到了另一项特殊的祝福。我和我的老修道师将前往大修道院，以接受剃度的祝福。给予祝福的修道院院长是一位非常圣洁的人。当我们穿过尼尔·米罗陀克圣人修道院的修道室，前往修道院的路上，我第一次感受到了来自天上的芳香。芳香充满了我的全身，我将此告诉了修道师。修道师静静地听着，没有说什么，只是继续前行。我们应当像他一样，以简单的方式看待这一切。第二次，我在哈拉姆佩伊圣人的遗骨前感受到了来自天上的芳香。在我受戒之夜，所有的长老都聚集在圣三一教堂的礼拜堂里，为我举行了晚祷，并唱诵了优美的赞美诗。我穿着白袜子，赤脚，满怀哀伤，——普罗菲利耶夫修道师回忆道。我向所有的人行了三鞠躬，亲吻了圣像，然后主教开始询问我关于伟大修道誓言的一些特殊问题。我的眼睛因哀伤而充满了泪水。晚祷结束后，我们前往修道室。我感到非常高兴，但保持沉默。我想独自一人与上帝交谈。当处于这种状态时，既不想唱歌，也不想说话。我寻找沉默，以便清晰地听到基督的声音。
- type: heading1
  text:
    ru: На Святой Горе мне очень нравились именно бдения
    cn: 在圣山，我特别喜欢的就是祈祷守夜
  children:
  - type: paragraph
    text:
      ru: Жизнь на Святой Горе — это жизнь в непрестанном бдении, – вспоминал старец Порфирий. – Во время келейного бдения, когда оно совершается искренне, то есть когда все соединяются в общей молитве, создается такая духовная атмосфера, в которую все легко входят, и от этого бывает великая духовная польза. Душа утончается, создаются более удобные условия для духовного подъема и глубокого общения с Господом. На Святой Горе встают в два часа. В тот час я ощущал благоговейный трепет. Молитва сотрясала местность, сотрясала духовный мир. Вот какова любовь ко Христу. На Святой Горе мне очень нравились бдения. Я становился другим человеком. Я всегда был большим приверженцем ночной молитвы, у меня была великая любовь к тому, чтобы слушать слова. Мой ум ни на минуту не хотел, чтобы сон забирал у него время. Я не спал, – признался старец Порфирий. – С любовью молился на бдениях. Когда иногда я сидел в стасидии, то спиной не опирался на нее, чтобы не уснуть. И после Божественной литургии я тоже не хотел спать. Во мне царствовала любовь, поэтому я оставался в состоянии бодрствования.
      cn: 生命在圣山上，就是一种不间断的祈祷生活，长老费奥多西回忆说。在独房祈祷时，当它以真诚的方式进行，即当所有的人共同祈祷时，就会形成这样一种精神氛围，人们很容易融入其中，从而获得巨大的精神益处。灵魂变得细腻，为精神提升和与上主的深刻交流创造了更佳的条件。在圣山上，人们在凌晨两点起床。那时，费奥多西感到敬畏。祈祷震动着大地，震动着精神世界。这就是对基督的爱。在圣山上，费奥多西特别喜欢祈祷。他变成了一个完全不同的自己。他一直非常热爱夜间祈祷，非常渴望聆听话语。他的心灵从未让睡眠占据哪怕一秒钟的时间。他没有睡觉，而是怀着对上主的爱在祈祷中祈祷。有时，当他坐在斯塔西迪亚时，他不会靠在它上，以免睡着。甚至在圣礼之后，他也不愿意睡觉。爱主宰着他的心灵，所以他保持清醒的状态。
- type: heading1
  text:
    ru: Та самая Благодать, которую имел мой почитаемый подвижник, излучилась и на мою душу!
    cn: 那同样的圣恩，我的敬爱的修道者所拥有，也照射在我的心灵上！
  children:
  - type: paragraph
    text:
      ru: 'Божественный плен В кириаконе, куда я ходил на бдения и службы, я узнал святых людей, – рассказывал старец Порфирий. – Послушайте, я расскажу вам об одном неизвестном святом. Над нашей каливой, очень высоко, жил один русский, старец Димас, жил он один в какой- то первобытной каливе. Он был весьма благочестив. Старец Димас был практически не известен никому на протяжении всей своей жизни. Никто не говорил ни о его имени, ни о его дарах. Представляете, уехать из России, оставить все, чтобы приехать на край света! Кто знает, сколько дней добирался он в Кавсокаливию. Старец Димас провел там всю свою жизнь. И умер в безвестности…. Да и не было кого-либо рядом с ним, кому он мог бы сказать: «Сегодня я сделал пятьсот поклонов. Почувствовал то-то...» Это был тайный подвижник. Да, да. Это было совершенным, совершенным и бескорыстным. Бескорыстие, служение, святость, один на один с Ним, и при этом у меня не было никакого человекоугодия. Я служил ему как раб Владыке. Больше ничего другого. Ни игумен, ни «браво» тебе, ни вопросов: «Почему это так?» Я видел живого святого. Да, неизвестного святого. Его, бедного, презирали. Кто знает, когда он умер. Через сколько дней, а то и месяцев — если была зима — узнали об этом. Куда там человеку подняться к нему наверх, к его каливе, выложенной из камней! Никто его и не видел. Часто таких пустынников находили через месяц- два после их успения. Господь явил обильное излияние Благодати ко мне, смиренному, когда я увидел его, старца Димаса, в кириаконе делавшим поклоны и рыдавшим при молитве. При поклонах его посетила такая благодать, что она излучилась и на меня. Тогда излилось и на меня богатство благодати. То есть она была и прежде по любви, которую я питал к своему старцу. Но тогда и я почувствовал благодать очень сильно. Я расскажу вам, как это случилось. Однажды рано утром, около половины четвертого, я пришел в соборный храм Святой Троицы на службу. Было еще рано. В било еще не били. В церкви никого не было. Я сел в притворе под лестницей. Меня не было видно, я молился. Вдруг открывается дверь церкви и входит высокий пожилой монах. Это был старец Димас, Войдя, он посмотрел направо, налево и не увидел никого. Тогда, держа в руках большие четки, он начал класть земные поклоны, много и быстро, и все время говорил; «Господи Иисусе Христе, помилуй мя... Пресвятая Богородице, спаси нас». Вскоре он пришел в исступление. Я не могу, не нахожу слов, чтобы описать вам его поведение пред Богом: это движения любви,'
      cn: 上帝的恩典 在我的教堂，我去守夜和做弥撒，我认识了许多圣人，长老彼罗菲里说。 请听我说，我将向您讲述一个不为人知的圣人。 在我们的教堂上方，非常高，住着一位俄罗斯老修道士，迪马斯，他独自住在某个原始的教堂里。 他非常虔诚。 教堂里的老修道士迪马斯在他的一生中几乎没有人听说过他的名字，也没有人听说过他的恩赐。 想象一下，离开俄罗斯，放弃一切，去到世界的尽头！ 谁知道他花了多少天才到达卡西莫多。 教堂里的老修道士迪马斯在那里度过了他的一生，死后也没有人知道…… 更何况，也没有人能和他交谈，告诉他：「今天我做了五百个鞠躬，感受到了……」 这是一个秘密的圣人。 是的，是的。 这是完美、完美和无私的。 无私、服务、圣洁，与祂面对面，而我没有任何自我的欲望。 我为祂做仆人的工作。 只有这些。 没有院长，也没有「干得好」，也没有问题：「为什么这样？」 我看到一个活的圣人。 是的，一个不为人知的圣人。 他可怜的，被鄙视的。 谁知道他什么时候去世了。 有多少天，甚至几个月，如果那时是冬天，才知道他去世了。 有谁能爬上他教堂的台阶，一个用石头铺成的教堂？ 没有人见过他。 有时，几个月后，人们才发现这些孤独的修道士。 上帝在我谦卑的时候，当我看到他，迪马斯老修道士，在教堂里做鞠躬，哭泣着祈祷时，显露出丰富的恩典。 在鞠躬时，他显露出如此的恩典，以至于它也影响了我。 那时，恩典也在我身上显明。 我将向您讲述这发生的情况。 有一天，清晨，大约是上午四点，我来到圣三一教堂做弥撒。 教堂里还很安静，钟还没有敲响。 教堂里没有人。 我坐在教堂的门廊里。 我在祈祷。 突然，教堂的门开了，进来一位高大的老年修士。 这就是迪马斯老修道士。 进来后，他向右看，向左看，然后发现没有人。 然后，拿着大念珠，他开始鞠躬，鞠躬很多，很快，而且一直在说：「主耶稣基督，怜悯我…… 亲爱的圣母，救救我们。」 不久，他陷入了狂喜。 我无法用言语来形容他向神祈祷时的行为：那是爱的运动。
  - type: paragraph
    text:
      ru: благоговения, движения Божественной любви и всецелого посвящения себя. Я видел, как он стоит, как, стоя прямо, простирает свои руки в виде креста, как делал Моисей на море, и стенал... «…И простер Моисей руку свою на море, и гнал Господь море сильным восточным ветром всю ночь и сделал море сушею, и расступились воды…» (Исх 14:21) Что это было? Он был в благодати. Сиял во свете. Вот что было! Он тут же передал мне молитву. Я сразу вошел в его состояние. Он меня не видел. Поверьте мне! – воскликнул отец Порфирий. – Я пришел в умиление и начал плакать. И ко мне, смиренному и недостойному, пришла благодать Божия. Как это объяснить? Он передал мне благодать. То есть благодать, которая была у этого святого, засияла и в моей душе. Он передал мне свои духовные дары. Итак, старец Димас пребывал в исступлении. Он сделал это помимо своего желания. Он не мог скрыть своего духовного опыта. Хотя то, что я вам говорю, не совсем правильно. Не могу вам этого передать словами. Это был Божественный плен. Это необъяснимо. Это совершенно не подлежит объяснению, и если ты попытаешься это объяснить, то скажешь не то. Нет, такое не объяснить, не найти в книгах, не понять. Чтобы постичь, нужно быть достойным этого.
      cn: 敬畏、神爱的运动以及全心奉献。我看见他站立，像摩西在海中举起双手似地直立，伸出双手，像摩西在海中那样，哀求……「……摩西举手向海，上主使海水干了，海分裂，水成了深渊。」（出埃及记 14:21）这是什么？他处于恩典中。他在光中闪耀。这就是！他立即把祈祷传给了我。我立刻进入了他的状态。他没有看见我。相信我！——彼罗菲里长老喊道——我陷入沉思，开始哭泣。而我，谦卑而卑微的人，圣神的恩典降临了。如何解释？他把恩典传给了我。也就是说，那位圣人所拥有的恩典，闪耀在我的心灵中。他把他的精神恩赐传给了我。因此，德米斯长老处于狂喜中。他这样做并非出于自己的意愿。他无法掩饰自己的精神经验。尽管我所说的并非完全正确。我无法用言语表达这一切。这是神的俘虏。这是无法解释的。这是完全无法解释的，如果你试图解释，你就会说错。不，这是无法解释的，无法在书中找到，无法理解。要理解，需要具备相应的资格。
- type: heading1
  text:
    ru: Старец Димас передал мне дар молитвы и прозорливости
    cn: 长老迪马斯传给了我祈祷和先见的恩赐
  children:
  - type: paragraph
    text:
      ru: 'В четыре часа ударили колокола, – вспоминал старец Порфирий. – Старец Димас услышал их звон, сделал еще несколько поклонов и прекратил молиться. Он присел на каменную скамейку — думаю, что она была сделана еще до построения храма. Приходит Макарудас — так мы ласково называли отца Макария. Он был шустрым и сладкоречивым. Он был ангелочком. Как здорово он зажигал лампады! Как здорово он зажигал паникадило! А как красиво он гасил свечу за свечой! Как красиво он клал поклоны! Он просил прощения справа и слева, чтобы взять книги и канонарить. О-о, как я его любил! И он был достоин любви, потому что имел благодать Божию. Итак, Макарий, Макарудас, вошел в главный храм. За ним открыл дверь старец Димас и тоже вошел внутрь. Он встал в стасидию, чтобы перед службой привести себя в порядок, полагая, что его никто не видел. А я спрятался в тени лестницы и незаметно, робко зашел в главный храм. Я пошел и приложился к иконе Святой Троицы. Потом повернулся и стал поодаль. При возгласе со страхом Божиим много отцов причастилось. Я тоже положил поклон и причастился. И в тот момент, как я причастился, ко мне пришла чрезвычайная радость, необыкновенное воодушевление. После службы я уединился в лесу, исполненный радости и веселия. Безумие! Я в уме произносил слова благодарственных молитв, направляясь к каливе. Я с воодушевлением бегал по лесу, скакал от радости, в исступлении раскрывая руки, и громко кричал: «Слава Тебе, Бо-о- о-о-же! Слава Тебе, Бо-о-о-о-же!» Да, руки мои застыли, стали как кость, как дерево и раскрытые образовали вместе с телом крест. То есть если бы вы посмотрели на меня сзади, то увидели бы крест. Голова была поднята к небу, грудь с помощью рук стремилась ввысь. Место, где находилось сердце, порывалось вылететь. То, о чем я вам рассказываю, я и вправду пережил. Сколько времени я оставался в таком состоянии, не знаю. Когда пришел в себя, опустил руки и в молчании, со слезами на глазах пошел дальше. Пришел к келии Не стал завтракать, как обычно. И говорить не мог. Пришел в церковь, но петь по своей привычке умилительные тропари не стал. Сел в стасидии и стал молиться: Господи Иисусе Христе, помилуй мя. Я продолжал пребывать в том же состоянии, но более спокойно. Меня душило умиление. Я разразился слезами. Они сами по себе, без всякого принуждения катились из моих глаз. Я этого не хотел, но меня переполняло волнение от посещения Божия. Слезы не прекращались до вечера. Я не мог ни петь, ни думать, ни разговаривать. И если бы кто-нибудь был там, я бы не стал разговаривать, ушел бы, чтобы быть одному. С уверенностью можно сказать: старец Димас передал мне дар молитвы и прозорливости в'
      cn: 在四点钟时钟敲响，长老彼罗菲里回忆道。长老迪玛斯听到了钟声，做了几个鞠躬礼后结束了祈祷。他坐在一块石阶上——我想，这块石阶是在教堂建造之前就已存在了。这时，马卡鲁达斯来了——我们亲切地称呼他为马卡里长老。他机灵伶俐，善解人意。他就像天使一样。他多么熟练地点燃蜡烛啊！他多么熟练地点燃圣杯啊！他多么优雅地依次熄灭蜡烛啊！他多么优雅地鞠躬啊！他一边向左右鞠躬，一边请求原谅以便取书和唱赞美诗。哦，我多么爱他啊！他配得上爱，因为他拥有上帝的恩典。于是，马卡里长老马卡鲁达斯和长老迪玛斯一起走进了主堂。随后，长老迪玛斯打开门，也走进了主堂。他站在斯塔西迪亚，为了在祈祷前整理好自己的仪态，认为没有人会看到他。而我则躲在楼梯的阴影里，悄悄地、小心翼翼地走进了主堂。我走向圣三一圣像前，然后转身站在一旁。当恐惧之上的敬畏之声响起时，很多长老都受了圣餐。我也屈膝，接受了圣餐。就在我受圣餐的那一刻，一股突如其来的喜悦和不寻常的振奋感涌上心头。祈祷结束后，我独自一人在林中度过了一段时间，充满了喜悦和欢乐。疯狂！我内心念诵着感恩的祷文，走向圣杯。我以充满激情的步伐在林中奔跑，因极度的喜悦而跳跃，以狂喜的姿态张开双臂，大声喊道：「赞美你，上帝！赞美你，上帝！」啊，我的双手僵硬如骨，如同树木，张开的手与身体一起形成了十字架。也就是说，如果你从后面看我，就会看到十字架。我的头仰望天空，胸膛借助双手努力向上攀升。心脏所在的地方似乎想要飞出。我所讲述的一切，我确实亲身经历了。我不知道自己在那种状态中待了多久。当我恢复过来，放下双手，带着泪水默默地继续前行。我来到小屋，没有吃饭，就像往常一样。我无法说话。我来到教堂，但没有按照习惯吟唱优美的赞颂诗。我坐在斯塔西迪亚，开始祈祷：主啊，耶稣基督，饶恕我。我继续保持同样的状态，但更加平静。我内心充满了感动。我泪如泉涌。它们自然而然地从我的眼睛里涌出，我没有强迫它们流出。我并不想这样做，但我内心充满了因见到上帝而产生的激动。泪水持续了整个夜晚。我无法唱歌、思考或说话。如果有人在场，我不会说话，会离开，独自一人。可以肯定地说，长老迪玛斯将祈祷和先知性的恩赐传给了我。
  - type: paragraph
    text:
      ru: 'тот час, когда молился в притворе соборного храма Кавсокаливии во имя Святой Троицы. О том, что произошло со мной, я никогда не помышлял, никогда не желал, никогда не ожидал. Старцы никогда не говорили со мною о таких дарах. Такой у них был обычай. Они учили меня не словами, а своим примером, – вспоминал старец Порфирий. – Читая жития святых и преподобных, я видел дары, данные им Богом. Отцы не вымогали, не просили дарований, не стремились к знамениям. Поверьте мне, я никогда не просил у Бога даров. Никогда о том не думал. И то, о чем я никогда не думал, появилось внезапно, а я тому никогда не придавал значения. Вечером того же дня я вышел из церкви, сел на лавку и стал смотреть в сторону моря. Приближался тот час, когда старцы обычно возвращались домой. Я смотрел в ту сторону, откуда они приходили, в ожидании, что они вот-вот появятся, и увидел их. Я увидел, как они спускаются по мраморным ступенькам. Но место это было далеко, я не должен был его видеть. Увидел я их по благодати Божией. Я воодушевился. Такое случилось со мною впервые. Я срываюсь с места, бегу к ним и встречаю. Беру у них котомки. — Откуда ты узнал, что мы идем? — спрашивает старец. Я не ответил. Но когда мы пришли к келий, я подхожу к «старшему» старцу, отцу Пантелеймону, и втайне от отца Иоанникия говорю ему: — Геронда, не знаю даже, как это объяснить! Хотя вы были за горой, но я видел, как вы шли нагруженные, и побежал. Гора была как стекло, и я видел, что за ней… — Хорошо, хорошо, — говорит старец, — не придавай этому значения и не рассказывай никому, потому что лукавый ходит по пятам…'
      cn: 那时刻，我在喀沃尔卡利维亚大教堂的祈祷堂中祈祷。关于我所经历的事，我从未想过，也从未渴望，更从未期待。长老们从未与我谈论过这样的恩赐。这是他们的习惯。他们通过自己的榜样而不是言语来教导我——长老彼罗菲里回忆说。——阅读圣徒和隐修者的传记时，我看到上帝赐予他们恩赐。先贤们从未乞求恩赐，从未渴望奇迹。请相信我，我从未向上帝祈求恩赐。从未想过。而我从未想过的事，却突然发生了，而我对此从未给予重视。当天傍晚，我走出教堂，坐在长凳上，望着大海的方向。长老们通常这个时候回家。我望着他们回来的方向，期待着他们即将出现，然后我看到了他们。我看到了他们从大理石台阶上下来。但这个地方离我很远，我本不该看到。我却因上帝的恩典而看到了他们。我感到振奋。这在我身上第一次发生。我立刻起身，跑向他们，然后与他们相遇。他们给了我背筐。——你怎么知道我们正要出发？——长老帕尼法米诺斯问。我没有回答。但当我们来到小屋时，我悄悄地走到长老伊奥annis的面前，对长老帕尼法米诺斯说：——赫农德，我甚至不知道该怎么解释！虽然你们在山顶，但我看到你们背着背筐走来，于是我跑过去。山顶就像玻璃一样，我看到后面……——好吧，好吧，——长老说，——不要在意这件事，也不要告诉任何人，因为恶人总是在你身后……
- type: heading1
  text:
    ru: Тогда я жил среди звезд, в бесконечном пространстве, в духовном небе!
    cn: 那时我住在星辰之间，在无垠的空间，在精神的天空中！
  children:
  - type: paragraph
    text:
      ru: Все я видел через призму благодати Божией Дара прозорливости я никогда не желал, – вспоминал старец Порфирий. – И когда получил его, не старался его развивать. Я не придавал ему значения. Я никогда не просил и не прошу у Бога открыть мне что-нибудь, потому что полагаю, что это противно Его воле. Но после события со старцем Димасом я совершенно изменился. Жизнь моя стала сплошной радостью и ликованием. Тогда я жил среди звезд, в бесконечном пространстве, в духовном небе! А раньше я был не таким… После того как я ощутил благодать Божию, все дары преумножились. Я стал смышленым, выучил каноны Пресвятой Троице, канон Иисусу, другие каноны. Если их пели и читали в церкви, то я их заучивал наизусть. Псалтирь читал наизусть. На определенные псалмы, слова которых похожи, я обращал внимание, чтобы не путать их. Я действительно изменился. Много видел, но ни о чем не говорил, потому что не имел права говорить, не имел такого извещения. Все видел, на все обращал внимание, все знал. От радости не ходил по земле. Тогда открылось у меня обоняние, и я стал различать все запахи, Открылось зрение, открылся слух. Я стал издали все узнавать, распознавать животных и птиц. По пению я знал, что это за птица; дрозд ли, воробей, зяблик или соловей, скворец или клест. Всех птиц я различал по пению. В конце ночи, на рассвете, я радовался трелям соловьев, дроздов, всех, всех птиц... Я стал иным, другим, обновленным, – признавался старец Порфирий. – Все, что видел, переводил в молитву. Все обращал на себя. Почему птичка поет и славит Создателя? Так хотел делать и я. То же самое и с цветами. Цветы я различал по их аромату, а их благоухание слышал на расстоянии получаса ходьбы. Различал траву, деревья, воды, скалы. Да, я разговаривал даже со скалами! Как я смотрел на них'. Я спрашивал их, и они рассказывали мне все тайны Кавсокаливии. Это глубоко затрагивало меня, и я приходил в умиление. Все я видел через призму благодати Божией. Видел, но не говорил. Часто ходил в лес. Мне очень нравилось ходить меж камнями по высокой траве, между маленькими и большими деревьями.
      cn: 我所见的一切都通过上帝恩典的光芒显现在我眼前，我从未渴望过这种先知的洞察力——长老帕福里伊回忆道——当我获得这种洞察力时，我没有试图去发展它。我没有把它放在心上。我从未向上帝祈求过让他揭示什么，因为我相信这违背了他的意愿。但自从我遇见了德米斯长老之后，我彻底改变了。我的生活充满了快乐和欢欣。那时我生活在星辰之间，在无限的空间，在精神的天空中！而在此之前，我并非如此……自从我感受到上帝的恩典之后，所有的恩赐都得到了增长。我变得聪明起来，学会了三位一体的圣礼，耶稣的圣礼，其他圣礼。如果在教堂里唱诵或诵读这些圣礼，我都会背诵。我背诵了《圣经》。对于特定的诗篇，我注意到了它们的相似之处，以避免混淆。我确实发生了变化。我看到了许多事物，但从未谈论过，因为我不具备谈论它们的权利，也没有得到这样的启示。我关注着一切，注意着一切，了解着一切。由于喜悦，我甚至不会走下地面。那时，我的嗅觉得到了开启，我能够辨别出各种气味。我的视力也得到了开启，我的听力也得到了开启。我能够从远处辨认出各种动物和鸟类。根据它们的鸣叫，我知道这是哪种鸟：杜鹃、麻雀、知更鸟、布谷鸟、麻雀或云雀。我能够分辨出所有的鸟鸣。在深夜，黎明时分，我为杜鹃、知更鸟以及其他所有鸟类的鸣叫而感到喜悦……我变成了另一个，变成了另一个，被更新了——长老帕福里伊承认道。我将我所见的一切都转化为了祈祷。我关注着一切。为什么一只小鸟在歌唱，赞美创造者？我也是这样想的。同样的，对于花朵也是如此。我能够通过它们的香气辨别出各种花朵，而它们的香气则在半英里外就能被我闻到。我能够辨别出各种草本植物、树木、水和岩石。是的，我甚至与岩石交谈！我注视着它们。我向它们提问，它们向我讲述着喀尔喀利维亚的秘密。这深深地触动了我，使我陷入沉思。我所见的一切都通过上帝恩典的光芒显现在我眼前。我看到了，但没有谈论。我经常在森林里漫步。我非常喜欢在石头之间漫步，穿过高高的草丛，穿过小树和大树之间。
- type: heading1
  text:
    ru: Я полюбил соловья, и он в меня вселил вдохновение!
    cn: 我爱上了知更鸟，它在我心中播下了灵感！
  children:
  - type: paragraph
    text:
      ru: 'Однажды утром я один пошел в девственный лес, – вспоминал старец Порфирий. – Все было в утренней росе, сверкало на солнце. Я оказался в ущелье, перешел на другую сторону и сел на скале. Неподалеку ручей тихо нес свои холодные воды, а я творил молитву. Стояла полная тишина, не было слышно ни шороха. Скоро в тишине я услышал сладкий, упоительный голос, прославляющий, воспевающий Творца. Я посмотрел вокруг, однако ничего не увидел. Наконец, напротив себя на одной из веток различил микроскопическую, как мне показалось, птичку. Это был… соловей! И вот, я слушал, как соловушка щебечет, как он просто разрывается от любви! От пения надувалось его горлышко и, как мы говорим, он, поистине, выбивался из сил (мальясе)! Эта маленькая птичка расправляла сзади свои крылышки (на кани ката писо та фтера ту), чтобы набраться силы, и издавала сладчайшую мелодию! Это был прекрасный звук. И горлышко птичье так надувалось... По – по — по! Ах! — Был бы у меня стаканчик воды, чтобы он подлетел и утолил бы свою жажду! Я не могу передать вам то, что чувствовал тогда. Но я открыл вам тайну. Думал тогда: «Почему такой маленький соловейчик выдает такие трели? Почему так заливается? Почему поет такую прекрасную песню? Почему, почему, почему? Почему он так надрывается? Почему, ради чего? Может быть, ожидает чьей-то похвалы? Конечно нет, там никто его не похвалит». Сидел и философствовал. Это пришло ко мне после старца Димаса. Раньше я не философствовал. Чего мне только не рассказал этот соловей! И чего я ему только не наговорил в тишине: «Соловейчик мой, кто тебе сказал, что я буду проходить здесь? Здесь нет никого поблизости. Это место такое недоступное. Как здорово и без перерыва ты исполняешь свой долг, свою молитву к Богу! Сколько всего ты мне рассказал, соловей мой, сколькому научил! Боже мой, я прихожу в умиление. Соловейчик мой, своим пением ты показываешь мне, как нужно славить Бога, ты рассказываешь мне о многом, очень о многом...» Сейчас здоровье не позволяет мне описать это так, как я это чувствую. Можно было бы написать целую повесть. Я очень полюбил этого соловья. Я полюбил его, и он меня вдохновил. Я подумал: «Почему он, а не я? Почему он скрывается, а я — нет?» И мне пришла мысль, что нужно удалиться, пропасть, как бы перестать существовать. Я сказал: «Зачем? Разве люди слышат его? Разве он знал, что я буду здесь и услышу? Кто слышал, как он надрывался? Почему он прилетел в такие удаленные места? А те соловьи в зарослях кустарника, в овраге, которые поют днем и ночью, утром и вечером; кто слышит, как они разрываются? Почему они это делают? Почему они прилетали в такие удаленные места? Зачем надрывали свои связки? Цель — служба, пение своему Творцу, служение Богу». Я так объяснил это.'
      cn: 有一天清晨，我独自一人走进了荒原的森林，长老彼罗菲里回忆说。——一切都笼罩在清晨的露水中，阳光下闪闪发光。我来到了一个山谷，过了山谷，坐在一块岩石上。不远处，一条小溪静静地流淌着，带走了它冰冷的水。我开始祈祷。四周一片寂静，没有一丝声响。很快，我听到了一种甜蜜、迷人的声音，赞美着、歌唱着造物主。我四处张望，却什么也看不见。终于，在不远处的一根树枝上，我看到了一只几乎看不见的鸟儿。那是一只——知更鸟！于是，我听到知更鸟在歌唱，它简直被爱燃烧了！它的喉咙鼓胀着，就像我们说的那样，它几乎要撑破了！这只小鸟在身后扇动着翅膀（上翅膀下翅膀），积蓄力量，发出最甜美的旋律！这声音是多么美妙啊。它的喉咙鼓胀着……噗——噗——噗！啊！要是我有一杯水，让它飞过来，它就可以解渴了！我无法向你描述我当时的感觉。但我想告诉你一个秘密。当时我心想：「为什么这么小的知更鸟会发出这么动听的旋律？为什么它会如此激动？为什么它会唱出这么美妙的歌？为什么，为什么，为什么？为什么它这么卖力？为了什么？也许它在期待别人的赞美？当然不是，那里没有人会赞美它。」我坐在那里沉思。这个想法是在我听了德米斯长老的故事之后才出现的。以前我从不沉思。这只知更鸟向我讲述了那么多，教了我那么多！「我的知更鸟啊，是谁告诉你，我会经过这里？这里附近没有其他人。这个地方如此隐秘。你多么不间断地履行着你的职责，你的祈祷！你向我讲述了那么多，教了我那么多……」现在我的健康不允许我像我所感受到的那样来描述这一切。我可以写一本小说。我非常喜爱这只知更鸟。我爱它，它也激励了我。我心想：「为什么它，而不是我？为什么它隐藏起来，而我却没这么做？」于是，我想到，我应该隐退，消失，好像不存在一样。我说：「为什么？难道人们会听到它吗？它知道我会在这里听到吗？谁听到了它如何卖力？为什么它飞到这么偏远的地方？而那些在灌木丛中、在山谷里，白天和夜晚、清晨和傍晚歌唱的知更鸟，谁听到了它们的卖力？为什么它们这样做？为什么它们飞到这么偏远的地方？它们为什么要卖力？目的就是为了赞美造物主，为了向自己的造物主歌唱，为了侍奉上帝。」我这样解释了这一切。
  - type: paragraph
    text:
      ru: 'Всех птиц я видел ангелами Божиими, славящими Бога, Творца всяческих, которых не слышал никто. Да, они прятались, чтобы их никто не слышал, поверьте мне! Их не интересовало, слышали ли их, но они стремились к уединению, к тишине, в пустыню. Кто их услышит в тишине? Только Творец всяческих, Создатель всего, Тот, Кто даровал им и жизнь, и дыхание, и голос. Вы спросите: «Разве у них есть ум?» Что на это сказать? – удивлялся старец Порфирий. Не знаю, делали они это сознательно или нет. Не знаю. Потому что это птички. Сегодня они живы, а завтра их нет, как говорит Священное Писание. Мы не должны мыслить иначе, чем говорит Священное Писание. Бог может нам показать, что все они — ангелы Божии. Мы этого не знаем. Они всегда скрывались, чтобы никто не слышал их славословия. Так и у монахов жизнь там, на Святой Горе, проходит в безвестности. Живешь со старцем, любишь его. Поклоны, подвиги, все бывает, но ты их не помнишь и о тебе никто не говорит: — «Кто это такой?» Ты живешь Христом, ты — Христов. Живешь внутри всего, живешь Богом, в Котором все живет и движется, в Котором и чрез Которого — это мои собственные греческие выражения. Ты входишь в нетварную Церковь и живешь в ней как неизвестный.'
      cn: 所有的鸟我都看作是上帝的天使，赞美上帝，创造万物的上帝，没有人听见过它们。没错，它们躲起来，以免被听见，你相信我！它们不在乎别人是否听见，它们只追求宁静，追求荒野。谁会在寂静中听见它们？只有创造万物的上帝，创造一切的上帝，赐予它们生命、气息和声音的上帝。你可能会问：「它们有智慧吗？」我对此感到困惑。我不知道它们是否有意这样做。我不知道。因为它们是鸟。今天它们活着，明天就没了，正如圣经所说。我们不应该像圣经所说的那样思考。上帝可以向我们展示，所有的鸟都是上帝的天使。我们对此一无所知。它们总是隐藏起来，以免被听见。赞美上帝。同样，修道院里的生活，在圣山上的生活，也充满了默默无闻。你和老修道者生活在一起，爱他。鞠躬、修行，一切都有，但你不会记得，别人也不会说：「这是谁？」你活在基督里，你就是基督的。你活在基督里，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的内，活在基督的
- type: heading1
  text:
    ru: Я принял помысел, советующий удалиться в пустыню и жить вместе с Богом, один на один.
    cn: 我接受了住在荒野、与上帝同在的意愿，独自与上帝相处。
  children:
  - type: paragraph
    text:
      ru: 'Я весь был там! Ум мой уже убежал в пустыню, – вспоминал старец Порфирий. – Осталось лишь попросить у старца благословение, взять котомку с сухарями, скрыться, чтобы непрестанно воспевать и славить Бога. Но я думал: «Куда мне идти? Я и рукоделию толком не научился». Меня еще ему не обучили. Может быть, боялись, что я уйду. Подобный страх был нередким на Святой Горе. А именно, старцы не учили послушника рукоделию до конца, чтобы он не ушел. В то время для монаха рукоделие было как воздух, потому что с его помощью он мог заработать себе на сухари. И вот, в уме у меня укрепилась мысль уйти в пустыню, чтобы жить один на один с Богом, бескорыстно, без гордости, без эгоизма, без тщеславия, без этого, без того, без всего... Вы мне верите? От этого у меня родилось бескорыстие. Крайнего совершенства достигали те редкие аскеты, которые скрывались в пустыне. Они не стремились ни к людской славе, ни к чему, ни к чему, ни к чему... Они обливались слезами к Богу и молились все за Церковь. Все они труждались прежде всего ради мира и Церкви, а потом уже ради себя. Как бы то ни было, у меня в голове засел этот соловей, его цель жизни. Для чего он надрывается в пустыне? Это служба, песнопение, славословие Богу, Творцу. И почему же мне не пойти в пустыню, чтобы служить Богу в безмолвии, скрывшись от мира и общества? Разве может быть что-либо совершеннее этого? Все эти мысли у меня возникли благодаря соловью. О, какие я строил планы! Как я бы пошел в пустыню, пребывал бы в радости и умер! О, как я ел бы траву, делал то, се! Я бы оборвышем и неизвестным приходил в какой-нибудь монастырь, чтобы мне дали сухарей. Я бы их ел и не говорил, откуда я и кто я. Я составил целый план. Это было моей тайной. Я вернулся на келию весь в этих чувствах и мечтах, – вспоминал старец Порфирий. – Рассказал это старцу. Он улыбнулся. — Прелесть, — говорит мне, — выбрось это из головы. Даже не думай об этом, потому что эти вещи станут препятствовать твоей молитве. Я говорил вам уже много раз, что у меня было великое благо: все, что я исповедовал старцу, прекращалось в ту же минуту, и внутри себя я чувствовал великую радость. Это было, наверное, по молитвам старца. Так я послушником и жил в земном раю Святой Горы. Никогда я не желал уехать оттуда. Но планы Божии были иные…'
      cn: 我全都在那里！我的心灵已经逃到荒漠，老修道士波菲里回忆说。——我只须向老修道士祈求祝福，拿个干粮袋，然后隐居起来，不停地赞美和颂扬上帝。但我想：「我要去哪里？我连编织都学不会。」他还没有教我。也许他们害怕我会离开。在圣山，这样的恐惧是常见的。也就是说，修道士们不教修道士编织，直到他学会为止，以免他离开。那时，编织对修道士来说就像空气，因为通过它他可以赚取干粮。就这样，我心中萌生了逃离荒漠，独自一人与上帝亲近，无私无欲，不自尊，不自傲，不自恋，不贪图任何东西……你相信吗？正是这些想法使我变得无私。只有那些隐居在荒漠中的少数修道者才能达到极致的完美。他们既不追求世俗的荣耀，也不追求任何东西，任何东西……他们为上帝流泪，为教会祈祷。他们首先为世界和教会工作，然后才为自己。不管怎样，我心中始终有个知更鸟，那是我生命的使命。为了什么，我在荒漠中劳作？这是服务，是歌唱，是颂扬上帝，是创造者的颂扬。那么，我为什么不去荒漠隐居，以便在孤独中为上帝服务？难道还有什么比这更完美吗？所有这些想法都是由知更鸟引发的。哦，我曾构想了多么美妙的计划！我将如何去荒漠，如何在那儿快乐地生活，然后死去！哦，我将如何吃野草，做这，做那！我将像野人一样，不知名地来到某个修道院，请求给他们干粮。我将吃下它们，不说话，从哪里来，我是谁……我构想了整个计划。这是我心中的秘密。我回到修道院时，心中充满了这些想法和梦想，——老修道士波菲里回忆说。——我向他讲述了这一切。他笑了笑。——真是妙极了，——他说，——把这一切从脑子里赶出去。不要想这些，因为它们会妨碍你的祈祷。我已经多次告诉你，我有极大的好处：我向老修道士坦白的一切，立刻就会消失，而我内心会感到极大的快乐。这可能是由于祈祷。就这样，我作为修道士在尘世的乐园圣山度过了我的生活。我从未想过要离开这里。但上帝另有安排……
