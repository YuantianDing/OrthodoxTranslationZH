  text:
    ru: Я был подобен некому дикому животному в чаще леса!
    cn: 我犹如一头野兽，困在森林的密林中！
  children:
  - type: paragraph
    text:
      ru: 'Настоящее послушание! Безумие ради Бога! Не могу вам сейчас показать на примере, что такое настоящее послушание. – рассказывал старец Порфирий. – Если поговорить о послушании, а потом сказать: «Иди-ка, сделай кувырок» и ты выполнишь — это не послушание. Но когда ты далек от мысли о послушании и совсем не думаешь на эту тему, и тебя вдруг попросят сделать что-либо, и ты сделаешь это с радостью — будь ты хоть на работе, хоть сонным или неготовым, и тебя смирят, — вот тогда ты своим поведением и покажешь, выполняешь ты послушание или нет. Я буквально придерживался заповедей своих старцев. Мне говорили: — Не рассказывай о том, что мы делаем и какой у нас порядок на келий. Если встретишь на пути какого-нибудь монаха и он скажет тебе «благослови», с благоговением и любовью во Христе отвечай ему «благословите». Если это старец, то целуй ему руку. Если он спросит тебя: — «Как поживают твои старцы?» — отвечай: — «Хорошо, вашими молитвами». И тут же иди дальше, более не разговаривай. Если кто-то будет догонять сзади и о чем- нибудь спросит, не останавливайся и не отвечай, потому что не все монахи хорошие и нужно относиться к ним осторожно. На все, что спросят тебя, отвечай: «Не знаю, спросите старца». Говори «благословите» и уходи. Если тебе скажут: «Ваше рукоделие, ваша резьба по дереву не очень-то хорошие. Поучись-ка иконописи, пению и так далее», — не слушай ничего, иди свей дорогой. Однажды послали меня к пещере святого Нифонта. На пути я встретил трех мирян: так на Святой Горе называют тех, кто не монахи. По своему обычаю, я, приблизившись к ним, сказал «благословите» и пошел дальше. Поскольку я казался «диким», то один из компании посочувствовал: — Какой жалкий мальчонка, по-моему, он не в себе... Я уже обогнал их, но у меня был очень хороший слух. Услышав это, я порадовался такому уничижению и улыбнулся про себя. - «Он прав, — сказал я, — совершенно прав, но что он может знать о моем безумии!» За пределы келий я выходил нечасто. Старцы не брали меня даже на престольные праздники. То есть когда праздновали память какого-нибудь святого, они шли в храм, а меня оставляли дома. На Святой Горе старцы зажигали огонь. Я не хотел быть рядом с очагом. К огню я не подходил совсем. Старцы садились около огня, а я поодаль. Я боялся, боялся, что тепло испортит меня. Я говорил это старцам, и они, бедные, позволяли мне так поступать. Это дело'
      cn: 真正的祈祷！为上帝疯狂！我现在不能通过例子向你展示真正的祈祷。——长老普罗菲利说道——如果谈论祈祷，然后说：「去，做一个空翻」，你做了——这不算祈祷。但当你远离祈祷的想法，完全不考虑这个问题，突然有人要求你做某事，你以快乐的心情去做——无论是在工作中，还是在半睡半醒的状态，有人对你施以恩典——那么，通过你的行为，你就能证明你是否在祈祷。我确实遵循着我老一辈修士的诫命。他们告诉我：「不要谈论我们在小屋子里做的事情，以及我们的小屋子里的秩序。如果你在路上遇到一个修士，他向你问安，你要以敬重和爱戴基督的心回答他『祝福你』。如果你遇到的是一个长老，你要吻他的手。如果他问你：『你的老朋友们过得怎么样？』你要回答：『很好，因为你们的祈祷。』然后就走开，不要再说话。如果有人在后面追上来，向你问一些问题，不要停下来回答，因为并不是所有的修士都是好的，要小心对待他们。对于他们向你提出的任何问题，你要回答：『我不知道，去问长老吧。』说『祝福你』然后走开。如果有人告诉你：『你的手工艺、你的木雕不是很好，去学学画圣像、学唱圣歌等等，』你不要听，继续走你的路。有一次，我被派去见圣尼福特的洞穴。在路上，我遇到了三个世俗人：这就是圣山上的世俗人。按照惯例，我走近他们，说『祝福你』然后继续走。因为我觉得自己很『野』，所以其中一个人同情地说：『看来这孩子有点精神失常……』我已超过了他们，但我的耳朵很好。我听到这句话后，心里很高兴，暗自笑了。——『他说得对，——我想，——他说得对，但他是怎么知道我的疯狂的呢？』我很少走出小屋。老修士们甚至不让我在圣节上离开小屋。也就是说，当他们庆祝某个圣人的节日时，他们会去教堂，而我则留在家里。在圣山上，老修士们会生火。我不想去靠近火堆。我离火堆很远。老修士们坐在火堆旁，而我则离火堆很远。我害怕火会伤害我。我告诉他们这些，而他们可怜地允许我这样做。这是一件事情
  - type: paragraph
    text:
      ru: 'привычки. Если привыкнешь сидеть около огня, то потом не сможешь уже принудить себя к злостраданию. Когда у меня начинался насморк, я пил горячий чай, делал пятьсот-шестьсот поклонов, потел и менял одежду. Потом ложился в постель и бывал здоров. Я действительно был «диким». Я был подобен некому дикому животному в чаще леса! Искренно говорю вам. По снегу и скалам бегал босым. Видели бы вы, как краснели на снегу мои пятки, ноги! Старцы не принуждали меня ходить без обуви, да и сами не ходили босыми. Я этого хотел сам. А они не запрещали мне. Но в церковь, в кириакон, я надевал и носки, и ботинки, а не деревенские башмаки из грубой кожи. Вспоминаю один замечательный случай. Была весна. Старец послал меня сходить в Керасью… По дороге я снял свои башмаки, потому что хотел, чтобы мои ноги на снегу и льду огрубели и стали как подошвы. Старцы, глядя на меня, радовались, – вспоминал старец Порфирий. – Но в то же время они, бывало, меня и смиряли, и ругали. Даже если я делал доброе дело, они говорили мне, что я сделал плохо. Не всегда, конечно. Но они хотели застать меня врасплох. То есть поймать меня в тот момент, когда я не ожидал. Старцы мои были святейшими людьми. Они воспитывали меня разными способами, даже строгими. Никогда они не говорили мне «молодец» или даже «это у тебя хорошо получилось». Никогда не хвалили меня. Они всегда давали мне советы, как полюбить Бога и как смиряться, как просить Бога, чтобы Он укрепил мою душу в еще более сильной любви к Нему. Вот чему я учился. А похвалы с их стороны я никогда не слыхал, да и не искал ее. Дома тоже меня не приучали к похвалам, не говорили мне: — «Браво, это ты хорошо сделал». Мать ругала меня. Отца не было, он годами в Америке работал на Панамском канале. Это принесло мне большую пользу. Тот, кто учится смирению, привлекает благодать Божию. Если старцы не ругали меня, я огорчался и говорил себе: — «Как жаль, что старцы не достаточно строги ко мне». Я хотел, чтобы меня наказывали, чтобы ругали и обращались со мною строго. Теперь-то я понимаю, насколько строги они были. Но тогда я этого не понимал, потому что любил их. Я никогда не хотел разлучаться с ними.'
      cn: 习惯。如果你习惯了围着火炉坐着，那么之后就很难强迫自己进行苦修了。每当我的鼻塞开始时，我会喝热茶，做五到六百个祈祷，出汗，然后换衣服。然后躺在床上，就会恢复健康。我确实是个「野孩子」。我就像森林中的野兽一样！我诚实地告诉你们。你们见过我在雪地里赤脚奔跑的样子吗？我的脚后跟和脚趾是多么红啊！老人们没有强迫我赤脚走路，他们自己也从来不赤脚。我想要这样做。但他们也没有阻止我。但在教堂，在圣像前，我穿袜子和靴子，而不是穿粗糙的皮革拖鞋。我记得一个令人难忘的场景。春天来了，老修道士派我去卡拉斯耶夫……在去的路上，我脱下了我的靴子，因为我想让我的脚在雪地和冰上变得粗糙，就像靴子的鞋底一样。老修道士们看着我，感到高兴——老修道士彼得回忆道。但是他们有时也会责备我，有时甚至会责备我。即使我做了好事，他们也会告诉我，我做错了。当然，这并不总是如此。但他们想让我措手不及。也就是说，想在我不期望的情况下抓住我。我的修道士们都是圣洁的人。他们用各种方式教育我，甚至有时是严厉的。他们从未对我说「好孩子」或甚至「做得不错」。他们从未赞美过我。他们总是给我建议，如何爱上帝，如何谦卑，如何向上帝祈求，让他增强我对他的爱。这就是我学到的。从他们那里，我从未听到过赞美。在家里，他们也没有教我赞美，也没有对我说：「做得好，你做得很好。」母亲会责备我。父亲不在，他多年来在美国为巴拿马运河工作。这对我来说有很大的好处。一个学习谦卑的人会吸引上帝的恩典。如果修道士们不责备我，我会感到难过，对自己说：「真遗憾，修道士们不够严厉地对待我。」我渴望被责备，被责备和被严厉对待。现在我明白了他们有多么严厉。但那时我还不明白，因为我爱他们。我从不想和他们分开。
- type: heading1
  text:
    ru: Из-за моей великой ревности я не раз забывался но старец у меня был в глубине сердца!
    cn: 因我的极大嫉妒，我多次迷失了自己，但上主在我心中留下了修士！
  children:
  - type: paragraph
    text:
      ru: 'Из-за моей великой ревности я не раз забывался, – рассказывал старец Порфирий. – Ревность приводила меня к крайностям. И подвиги я совершал без благословения. Но это эгоизм. Вот я приведу вам один пример. Послушайте. Как-то раз, старцы на целый день ушли на работу, а меня оставили на келий одного. Я занимался рукоделием. Нашим рукоделием, как я уже вам говорил, была резьба по дереву. Однако они не открыли мне еще все секреты этой работы до конца. Может быть, боялись, что уйду. И вот однажды я взял хорошее белое дерево и набросал на него рисунок. Я вырезал черного дрозда, очень красивого, в движении, с отведенными назад крыльями, клюющего гроздь винограда. Гроздь свисала с лозы, на которой было два-три листа. Клюв у дрозда был внизу. Вышло очень красиво. По дереву я прошелся наждачной бумагой. Когда мои старцы вернулись, я положил им поклон. Взял свою деревяшку и говорю отцу Иоанникию: — Смотри, что я сделал! Как только он увидел мою работу, выпучил глаза и начал кричать: — Кто тебе сказал это сделать? Ты спросил кого-нибудь? Он взял у меня деревяшку, бросил ее на землю и разбил на множество кусочков. — А ну-ка иди-ка быстро и скажи старцу, — говорит он мне мне. Я очень расстроился и попросил прощения. Я не думал, что огорчу их. — Почему ты что-то делаешь без спроса? Иди быстро к старцу, покажи обломки и исповедуйся. Я тут же пришел к старцу и показал ему обломки. Он мне говорит: — Детка, не нужно было этого делать. Без благословения не бывает ничего хорошего. Так ты можешь впасть в прелесть и потерять благодать Божию. Я сделал поклон, в простоте и бесстрастии попросив прощения. Нарекание меня не только не огорчило. Но про себя я даже говорил: «Мои старцы должны обращаться со мной строже, должны меня наказывать». Однако в другой раз я сознательно сделал непослушание. Как-то старцы уходили на работу, и «старший» старец мне говорит: — Видишь там наверху, на полке, книгу? Не трогай ее, не надо, ты еще маленький. Потом, когда станешь лучше, более смиренным, то прочтешь ее. Это для меня было законом. Я даже не смотрел туда. Но однажды, когда старцы ушли в Керасью, меня разобрало любопытство. Я подошел, встал напротив полки и долго смотрел на'
      cn: 老修士波菲里耶讲述说。由于我的极大嫉妒，我多次迷失了方向，嫉妒使我陷入极端。我所做的善行都是未经允许的。这都是自私自利。我将给你举一个例子。听听。有一次，老修士们整整一天都外出工作，只留下我一个人在小屋里。我正在做手工。我们的手工，正如我之前告诉过你的，是木雕。然而，他们还没有完全教会我这个技艺的所有秘密。也许，他们害怕我会离开。于是有一天，我拿了一块洁白的木头，在上面画了一个图案。我雕刻了一只非常美丽的黑鸟，正在飞翔，翅膀向后展开，正啄着葡萄串。葡萄串悬挂在枝条上，枝条上长着两三个叶子。鸟的喙向下。做得非常漂亮。然后，我用砂纸打磨了这块木头。当我的老修士们回来时，我把他们请了进来。我拿出了我的木雕。我对伊奥尼基长老说：「你看，我做了什么！」他一看到我的作品，眼睛瞪得大大的，开始大喊大叫：「谁让你做的？你问过谁吗？」他接过我的木雕，把它扔在地上，打碎成许多碎片。「快去告诉长老，」他对我喊道。「我非常生气，请求了原谅。我没想到会让他们失望。「你为什么未经允许就做这些？快去告诉长老，展示碎片，忏悔。」我立刻去了长老那里，把碎片展示给他看。他对我说：「孩子，你这样做是不对的。未经允许，任何事情都不会好。因此，你可能会陷入罪恶，失去上帝的恩典。」我做了个祈祷，以简单和无畏的态度请求了原谅。我的忏悔并没有使他感到难过。相反，我自己心里甚至在想：「我的老修士应该对我更加严厉，应该惩罚我。」然而，后来我故意违背了命令。有一次，老修士们外出工作，那位「长老」对我说：「你看那边，上面的架子上有一本书？不要碰它，不要碰，你还太小。」然后，当我变得更好，更加谦逊时，我会读它。这对我来说是法律。我甚至没有看。但有一天，当老修士们去克拉斯耶时，好奇心驱使我。我走近，站在架子前，久久地盯着它。
