title:
  ru: Предисловие к главам блаженного Филофея Синайского
  cn: 至福者西奈山菲洛菲诸章序言
languages:
- ru
- cn
authors:
- ru: преподобный Василий Поляномерульский
  cn: 尊者 瓦西里·波利亚诺梅鲁斯基
document:
- type: heading1
  text:
    ru: преподобный Василий ПоляномерульскийПредисловие к главам блаженного Филофея Синайского
    cn: '圣瓦西里·波利亚诺梅鲁斯基

      《福者西奈山斐洛提各章》序言'
  children:
  - type: paragraph
    text:
      ru: «Несть наша брань к крови и плоти, но к началом, и ко властем, и к миродержителем тьмы века сего, к духовом злобы поднебесным»
      cn: 我们的争战并非对抗血肉之躯，乃是对抗执政的、掌权的、这黑暗世界的掌管者，以及天空属灵气的恶者。
  - type: paragraph
    text:
      ru: (Еф. 6, 12)
      cn: (以弗所书 6:12)
  - type: paragraph
    text:
      ru: 'Воины земного царя носят меч, будучи готовы и искусны на борьбу с врагами, носят же такой меч и не воины, по одному лишь обычаю, а не для приготовления к борьбе, и не зная даже, как должно противоборствовать врагам. Сказанное по всему есть совершенное подобие и нашей духовной брани, о которой ныне предлагается слово. Ибо всякий отрекающийся от мира и становящийся монахом принимает вместе с тем и меч духовный, как воин Христов, и выходит на брань против духов злобы. К нему-то и обращены слова в час пострижения: «Приими, брат, меч духовный, который есть слово Божие, нося его в устах твоих, уме и сердце, говори непрестанно: «Господи, Иисусе Христе, Сыне Божий, помилуй мя».'
      cn: 地上君王的战士佩剑，随时准备好与敌人争战，且精通此道；而那些并非战士者也佩戴此剑，仅仅是出于习俗，并非为备战，甚至不知该如何与敌人对抗。这段话完美地类比了我们的属灵争战，正也是我们今日所要论述的。因为凡弃绝世界并成为修士者，同时都领受了属灵的宝剑，作为基督的战士，出去与邪恶的灵争战。在受戒时，对他说的就是这些话：「弟兄，领受属灵的宝剑，这宝剑就是上帝的圣言，将其佩戴在你的口中、心思和心中，不断地说：『主耶稣基督，上帝之子，求祢怜悯我。』」
  - type: paragraph
    text:
      ru: Но о, время наше! Как многие, не говорю уже все, носят этот меч по одному только обычаю, а не как необходимый для брани! Не научившись как следует с ним обращаться пред лицом врагов и пожигать их, как пламенем, употребляют его просто, и грубо, и бездейственно, т. е. вычитывая за одну «Славу» Псалтири одну вервицу (одну сотню четок), а за кафизму вычитывая три, ограничивают этим внешнее моление. Многие же, совершенно отложив этот глагол Божий, лучше же сказать, пламенное оружие, охраняющее врата сердца, довольствуются одним псалмопением, канонами и тропарями, преданными Церковью, думая, что эта пятисловная молитва вменена за правило только простым и некнижным монахам. Опровергая и исправляя такое их неправильное мнение, св. Симеон, архиепископ Солунский, преподает и узаконивает всем архиереям, архимандритам, игуменам, иеромонахам, иереям, диаконам, монахам и мирским людям всякого звания и занятия, вместо всякого правила, как свое дыхание и жизнь, выполнять эту святую молитву Иисусову в уме и устах на каждый час и время, если даже они и не могут познавать ее художного действия, ибо то есть дело, по его словам, одних монахов, отрекшихся от мира. Если же и повелеваетВасилий Великийнеученому монаху сею молитвою Иисусовою совершать правило, ограничиваясь численным ее произношением, и не художно, то это следует понимать так, что он узаконивает это, как необученным, так и мирским с тем, чтобы и они все по мере своих сил славословили Бога, а не пребывали праздными.
      cn: '哦，然而，我们的时代啊！许多人，我甚至不说所有人，佩戴这把剑仅仅是出于习惯，而不是将其作为争战所必需的！他们没有学会如何在仇敌面前正确地运用它，像火焰一样焚烧他们，却只是简单地、粗率地、毫无功效地使用它——也就是说，为《诗篇》中的一个「荣耀颂」诵读一串念珠（一百颗珠子），而为一个「圣咏经」诵读三串，仅限于此等外在的祈祷。另有许多人，则完全抛弃了这上帝的圣言，或者更确切地说，这守护心门、如同火焰般的武器，仅满足于教会所传下的诗篇颂唱、圣颂和短颂，以为这五言祷文仅被规定为简单和不识字的修士的规矩。


        为了驳斥并纠正他们这种错误的观念，圣西缅，帖撒罗尼迦总主教，教导并规定所有主教、掌院、院长、神品修士、司祭、执事、修士以及各种身份和职业的平信徒，将这神圣的耶稣祷文，如同自己的呼吸和生命一般，在思想和口中，每时每刻、随时随地地履行，以代替一切规矩，即使他们无法领悟其精微的功效，因为根据他的说法，那是那些离弃世界的修士们专属的事。倘若大圣巴西略确实命令不识字的修士通过这耶稣祷文来履行规矩，仅限于计数其诵念次数，而非精微的运作，那么这应该理解为，他将此规定给予未受教育者和平信徒，以便他们所有人都能尽其所能地颂赞上帝，而不至于虚度光阴。'
  - type: paragraph
    text:
      ru: 'Кто носит меч свой, или слово, разумно, по внутреннему вниманию, тот знает время, когда обращать его на врага и молиться на прилоги злые, и страсти, и помыслы или за грехи свои. Если же иногда, по каким-либо обстоятельствам или по невниманию, поползнется словом или гневом, а иногда и похотию или тщеславием и мнением и т. п., и по этой причине будет укоряем своею совестию, то, не перенося ее обличения, обращается к Богу, каяся и моляся от сердца и ума, ища помилования. Все правило такового бывает в одном покаянии и внимании сердечном, по примеру той вдовицы, которая не отступала от судии день и ночь, прося отмщения своему сопернику. И это есть порядок умного делания, подобающего страстным: пусть никто не приходит в смущение от этого слова, что обуреваемым такими грехами можно при помощи Божией обучаться умному деланию.'
      cn: 凡是明智地、依照内在警醒佩带自己的剑或言语之人，他便知道何时将它转向敌人，并为恶毒的引诱、情欲和意念，或为自己的罪过而祈祷。如果有时，因某些情况或因不警醒，他言语或怒气上失足，而有时也因贪欲、或虚荣、和自负等等而失足，并因此受到自己良心的谴责，那么，他便不再忍受良心的谴责，转向上帝，从心智悔改并祈祷，寻求怜悯。这样的人的一切准则仅在于悔改和心的警醒之中，依照那寡妇的榜样，她日夜不停地求告审判官，请求为她的对头伸冤。而这便是适合于有情欲之人的理性操练的次序：愿无人因此话而感到困扰，认为那些受此类罪恶侵扰之人，借着上帝的帮助也可以学习理性操练。
  - type: paragraph
    text:
      ru: 'Представь себе пять состояний действующих по страсти: а) впадая в гнев и досаду, оставаться всегда злобствующим на оскорбившего; б) будучи опечаленным, помнить зло в течение многих дней; в) гневаться одну неделю; г) один только день помнить и д) враждуя, досаждая, смущая и смущаясь, в тот же час измениться. Вот сколько различных устроений, однако все они находятся под адом до тех пор, пока действует страсть, как сказал св. Дорофей, и таким не должно касаться умного делания, ибо они подобны человеку, который, будучи ранен стрелою от врага своего, берет ее собственными руками и вонзает в свое сердце; о них сказал Богослов: «Делающийгрех от диавола есть»(1Ин. 3, 8).'
      cn: '试设想因情欲而行的五种状态：


        (a) 陷入愤怒与恼恨，对冒犯者常怀恶意；

        (b) 心怀忧伤，多日记恨；

        (c) 发怒一周；

        (d) 只记恨一日；以及

        (e) 心怀敌意，恼恨他人，扰乱他人，亦被扰乱，却能随即改变。


        这便是如此多种不同的心境，然而，正如圣多罗斐所说，只要情欲仍在作祟，所有这些心境都处于地狱之下。这样的人不应触及理智祈祷，因为他们如同一个人，被敌人用箭射伤后，竟用自己的双手取出那箭，又把它插入自己的心中。关于他们，神学家说：「凡行罪恶的，便是出于魔鬼」（约翰一书 3:8）。'
  - type: paragraph
    text:
      ru: 'Возьми и пять других состояний: а) оскорбившегося и скорбящего не потому, что потерпел досаждение, но потому, что не перетерпел его; б) поучающегося всегда терпению, но в конце концов побеждающегося увлечением; в) не хотящего отвечать злом за зло, но увлекающегося силою привычки; г) старающегося отнюдь не произносить зла, но скорбящего о полученной обиде, упрекающего себя и кающегося в этом и д) не скорбящего о полученной обиде, но и не радующегося ей. Эти все суть сопротивляющиеся страсти, так как произволением борются со страстью и не хотят действовать по ней, но и скорбят, и подвизаются. Таковые подобны находящемуся под обстрелом врага, но облеченному в броню и неуязвимому, говорит тот же св. Дорофей. Им во всяком случае можно и должно обучаться умному деланию, потому что они очищаются вседневною благодатию Христовою, чрез умную молитву и ежечасное покаяние, и о них сказал тайновидец:«Если говорим, что не имеем греха, – обманываем самих себя... Если исповедуем грехи наши, то Он, будучи верен и праведен, простит нам грехи наши и очистит нас от всякой неправды» (1Ин. 1, 8–9).'
      cn: 请看另外五种境况：a) 被冒犯而忧伤的人，这并非因为他遭受了烦扰，而是因为他未能忍受它；b) 总是教导自己要忍耐，但最终却被情欲所胜过的人；c) 不想以恶报恶，但却被习惯的力量所牵引的人；d) 努力绝不口出恶言，但却为所受的冒犯而忧伤，并为此而自责并忏悔的人；以及 e) 为所受的冒犯不忧伤，但也不为此感到喜悦的人。所有这些都是抵制情欲的人，因为他们以自由意志与情欲搏斗，不愿按其行事，但他们也忧伤，也努力修行。这样的人就好比身处敌军炮火之下，却身披铠甲、毫发无损的人，同一位圣多萝西这样说。无论如何，他们可以也应该学习心祷修行，因为他们借着基督每日的恩典而得以洁净，通过心祷和每时每刻的忏悔。关于他们，那奥秘的见证者曾说：「如果我们说自己没有罪，便是欺骗自己...我们若认自己的罪，祂是信实的，是公义的，必要赦免我们的罪，洗净我们一切的不义。」（约翰一书 1:8-9）
  - type: paragraph
    text:
      ru: Известно и то, что эта священная молитва Иисусова для многих в древности и ныне являлась камнем преткновения и соблазна. И хотя многие, может быть, даже и все, молятся этой молитвой просто и внешне, и никто против этого не восстает, однако художного ее действия, т. е. блюдения сердца умом в молитве, мало кто знает. И самомуГригорию Синаитусопротивлялись сначала самые словеснейшие отцы горы Афонской, когда он начал учить их этому. И если эти отцы, удалившиеся из городов, так претыкались об это делание, то что же сказать о сдружившихся с миром монахах? Однако желающему спасти свою душу должно повиноваться Свящ. Писанию и учению св. отец, а не плотским человекам. Ведь не в каком-нибудь углу, но среди самого царствующего града процвело это священное умное делание и не у одних только простых монахов, но даже сами патриархи Константинопольские были делателями и учителями его. Имею в видуИоанна Златоуста, Фотия, Каллиста, бывших один за другим преемниками патриаршего престола, о которых пишет св.Симеон Солунский, что они сочинили целые книги об одном этом делании умной молитвы, проникнутые глубокой мудростью и искусством. Впрочем, не следует удивляться тому, что теперь об этом учении и писании даже и одного слова не произносится среди монахов. Каждый ведь может, если только пожелает, монах или мирянин, петь псалмы и каноны, преданные св. Церкви св. отцами для общего моления, Господа же Иисуса Христа никто не может умом назвать, как только Духом Святым, по апостолу. Поэтому св. отцы, будучи делателями и учителями умного делания, уподобляют внешнее пение малому отроку, молитву же умную – мужу совершенному. И как для отрока нет ничего укоризненного в том, что он по времени хочет быть мужем и старцем, так и внешнему пению и молению, по немощи младенчества нашего от Бога нам данному, нет укора и поношения, если кто-либо обращает все усердие на умную молитву и весьма мало поет псалмов, канонов и тропарей, надеясь чрез умную молитву обрести разумное пение, от которого опять востекает на зрительную молитву, по сравнению с которой пение ему кажется отроком перед мужем совершенным, и, опять уделив немного времени пению, больше уделяет молитве, да и не может снова таковой много петь, ибо внешне поющие и не постигающие чувством того, что поют, те могут петь много, говорит св. Григорий Синаит. По этой-то причине он уподобляет пение деннице (утренней звезде), молитву же умную – солнцу. И как денница видима бывает какой-нибудь час или два, солнце же весь день сияет, так должно разуметь и о пении и молитве. И не говори мне, что многие из святых придерживались многого пения, но разумей и веруй, что те же отцы предписывают нам непременно от пения восходить к молитве. Таковым был и св. Григорий Синаит, который сначала, по неведению лучшего, придерживался одного пения, будучи же наставлен одним критянином, заменил многое пение умною молитвою и, на опыте познав, что не бывает такого быстрого и легкого успеха от пения, как от молитвы, повелел всем иметь все старание о молитве, петь же немного из-за уныния.
      cn: 众所周知，这神圣的耶稣祷文对古今许多人而言，曾是绊脚石和诱惑。尽管许多人，甚至所有人，只是简单地、外在地诵念这祷文，且无人对此表示反对，然而其属技巧的功效，即在祷告中以心智看守心怀，却鲜有人知。甚至连西奈山格里高利本人，最初也曾遭到阿索斯山最具言辞智慧的教父们的反对，当他开始教导他们这一功课时。若这些远离尘嚣的教父们，对此操练尚且如此绊跌，那么对于那些与世俗为友的修士们，又当说些什么呢？然而，凡愿拯救自己灵魂者，必须顺从圣经和圣教父们的教导，而非属肉体之人。因为这神圣的心智操练并非盛行于某个偏僻角落，而是兴盛于君士坦丁堡这座帝都之中，且不单单是普通修士，甚至君士坦丁堡的宗主教们也曾是其实行者和教师。我指的是金口圣约翰、弗提乌和卡利斯图斯，他们曾先后继任宗主教宝座，索伦的圣西缅曾论及他们，说他们曾就这心智祷告的操练，撰写了整本书籍，这些书籍充满深奥的智慧和技巧。诚然，如今修道士中关于这教义和著作甚至只言片语也未曾提起，对此不应感到惊讶。因为每个人，无论是修士或平信徒，只要他愿意，都可以咏唱圣教父们为公共祷告而传予圣教会的诗篇和颂歌；然而，按照使徒的教导，若非借着圣灵，没有人能凭心智称耶稣基督为主。因此，圣教父们作为心智操练的实行者和教师，将外在的咏唱比作幼童，而将心智祷告比作完全人。正如幼童渴望随着时间成为成年人乃至长者并无何可指责之处，同样，对于因我们属灵婴孩的软弱而由上帝赐予我们的外在咏唱和祷告，也无任何责备和羞辱，如果有人将全部努力倾注于心智祷告，而极少咏唱诗篇、颂歌和短祷，期望通过心智祷告获得理智的咏唱，并由此再次升华至观想祷告，相较之下，咏唱在他看来如同完全人面前的幼童，并且，再次将少量时间分配给咏唱后，会更多地专注于祷告，事实上，这样的人也无法再多加咏唱，因为那些仅凭外在咏唱而未用心感受所咏唱内容的人，他们可以咏唱很多，圣西奈山格里高利如是说。正是因此，他将咏唱比作晨星，而将心智祷告比作太阳。正如晨星可见一两小时，而太阳整日普照，咏唱和祷告也应作如是理解。不要对我说，许多圣人坚持长时间的咏唱，而要理解并相信，正是这些教父们要求我们务必从咏唱升华到祷告。圣西奈山格里高利本人亦是如此，他起初因不识更优之法，曾坚持仅以咏唱为念；后经一位克里特人的教导，便以心智祷告取代了长时间的咏唱，并亲身体验到，咏唱无法像祷告那样带来如此迅速而轻易的成功，便命令所有人将全部精力投入祷告，而只少量咏唱，以免陷入忧郁。
  - type: paragraph
    text:
      ru: 'Впредь и ты без всякого сомнения поступай так же, чтобы и тебе не было сказано, за противление твое, словами апостола, который говорит:«Благоволение убо моего сердца и молитва, яже к Богу, по Исраили есть во спасение. Свидетельствую бо им, яко ревность Божию имут, но не по разуму; неразумеюще бо Божия правды и свою правду ищуще поставити, правде Божией не повинушася»(Рим. 10, 1–3). Что же говорит Писание? Близ тебя слово в устах твоих и в сердце твоем, если исповедуешь устами твоими Господа Иисуса, спасешься, ибо всякий, кто призывает имя Господне, спасется. Все же это: слово, исповедание и призывание – следует понимать как пребывание внутри тебя Христа, вселившегося чрез св. крещение. И ты должен непрестанно призывать, и говорить, и исповедывать Его, иногда сердцем, иногда же устами, говоря: «Господи, Иисусе Христе, Сыне Божий, помилуй мя».'
      cn: '从今以后，你也要毫无迟疑地照样行，以免你因你的悖逆，而被人用使徒的话语来说你：


        「我心中所切愿的，以及我向着上帝为以色列所献的祷告，都是为要他们得救。我可以为他们作见证，他们对上帝有热心，但不是按着真知；因为他们不认识上帝的义，反而想要建立自己的义，所以没有顺服上帝的义。」（罗马书 10:1-3）


        那么，圣经又说什么呢？这道离你很近，就在你的口中和你的心里；如果你口里认主耶稣，就必得救，因为凡求告上主之名的，就必得救。然而，所有这一切：这道、这认信和这呼求，都应被理解为基督藉着圣洗礼居住在你里面。而你必须不住地呼求祂，言说祂，并认信祂，有时用心，有时则用口说：「上主，耶稣基督，上帝之子，怜悯我。」'
  - type: paragraph
    text:
      ru: 'Будь же внимателен, человек, к себе и к твоему упорству, да не пошлет на тебя Бог за это дух ожесточения: очами не видеть и ушами не слышать, как свидетельствует против тебя Свящ. Писание, подобно тому, как свидетельствовал Илия на Израиля к Богу, Которому и ты сопротивляешься. Не надейся же и не верь, что успеешь достигнуть чего-либо духовного, если не покоришься призывать Иисуса Христа на каждый злой помысл и на всю силу вражию, как говорит св. Исихий: «Не найдешь крепчайшего оружия на врагов ни на небе, ни на земле, кроме имени Христова». И невозможно тебе избежать горького напоения злыми помыслами или перестать вкушать хлеб из отрубей до тех пор, пока не поревнуешь вкушать чистого хлеба, сшедшего с неба, вкушающие который не будут алкать во веки, получая веселие и радость, а не страх, или неразумное утешение или, что то же, радостное самомнение. Ибо как закон, не будучи в силах сам по себе сделать человека безгрешным, отсылал всех ко Христу и к Нему сам стремился, как бы умаляя тем свое значение, так и внешнее пение, сообщив делателю первоначальное обучение, передает его Христу, т. е. умной молитве Иисусовой, как не имеющий сил сам собою возвести его в духовное действо, хотя при этом самое то пение из-за молитвы сокращается и отходит на второе место. Если же и не все хотят обратиться от пения ко Христу, то нет в этом вины самого пения, как нет и вины закона в противлении иудеев, но виною тому один только их плотской ум и неведение силы, сокровенной в Свящ. Писании. Ибо они думают, что растягивать сладкие гласы и изливать языком красивые слова – это есть начало и конец молитвы. Они не поняли сказанного Господом: «Яковеруяй в Мя, ...реки от чрева его истекут воды живыя»(Ин. 7, 38). Всякий крещающийся принимает свыше эту воду таинственно в глубине своего сердца, и о ней пишется в житии св.Игнатия Богоносца, когда неверные разрезали сердце его, говоря: «Как он носит Бога своего в сердце своем?» И нашли внутри сердца золотом написанные слова: «Иисус Христос». Это же было знамением в посрамление неверных и для уверения всех верных в том, что всякий во св. крещении принимает внутрь себя Христа. Потому-то совершеннейшие и глубочайшие в дарованиях духовных св. отцы прежде всего повелевают нам очищаться от страстей умным и сердечным призыванием имени Иисуса Христа на всякий злой помысл, брань и прилог вражий, и это есть моление, произносимое с чувством, а не просто только по обычаю, каковое не грешно назвать и мертвым. Положивши нам твердое начало таковому разумному вниманию и молению, блаженные отцы поучают нас пребывать в нем до смерти, сражаясь с врагами и страстями своими, и, хотя бы и тысячу ран принимали бы мы каждый день, мы не должны никогда прекращать этого живоносного делания, т. е. призывания Иисуса Христа, живущего в сердцах наших, как уже и было об этом сказано выше.'
      cn: '人啊，要警醒于自身和你的固执，免得上帝因此向你发出刚硬的心灵：眼不能见，耳不能闻，正如圣经为你作证，就像以利亚向上帝指证以色列一样，而你也在抵挡这位上帝。因此，不要指望也不要相信你能获得任何属灵的成就，除非你顺服地在每个邪恶意念和所有仇敌的势力面前呼求耶稣基督之名。正如圣伊西基奥斯所说：「在天上或地上，你都找不到比基督之名更强大的对抗仇敌的武器。」你也无法避免被邪恶意念所苦苦灌注，或停止咀嚼糠秕之食，直到你热切地渴慕尝尝从天降下的纯净之粮，尝食这粮的人将永不饥饿，他们将获得欢愉与喜乐，而非恐惧，或不理智的安慰，或换言之，自得其乐的自负。


        因为律法本身不能使人无罪，它将所有人都引向基督，并自己渴望归向祂，仿佛借此减损了自身的意义。同样，外在的吟唱，在给予实践者初步的训练后，便将其交托给基督，即耶稣的心祷，因为它自身没有力量将其提升到属灵的境界，尽管如此，吟唱本身却因祷告而缩减并退居次位。如果并非所有人都愿意从吟唱转向基督，这并非吟唱本身的过失，正如律法在犹太人的抵挡中也没有过失一样，唯一的原因是他们肉体的悟性，以及对圣经中所隐藏力量的无知。因为他们认为，拉长优美的歌声，口中倾吐华丽的言辞，就是祷告的开始与结束。他们不明白上主所说：「凡信我的人，……从他腹中将流出活水的江河」（约翰福音 7:38）。凡受洗者，都在他内心深处奥秘地领受这从上而来的水。关于此，在圣伊格纳提乌斯·神带者的生平中记载，不信者剖开他的心时说：「他如何将他的上帝带在心里？」并在心内发现用金字写着「耶稣基督」的词语。这既是不信者的羞辱，也是为了让所有信徒确信，凡在圣洗中之人，都将基督接纳在自己里面。因此，那些在属灵恩赐上最完美、最深奥的圣教父们，首先吩咐我们，在每个邪恶意念、争战和仇敌的引诱面前，借着理智和发自内心地呼求耶稣基督之名，来洁净自身脱离情欲。这是一种带着情感发出的祷告，而非仅仅出于习惯，后者称之为死的祷告也不为过。圣福教父们为我们奠定了这种理智的警醒和祷告的坚固根基后，教导我们至死都当持守其中，与仇敌和自身的情欲争战。即使我们每日遭受千创百伤，也绝不可停止这赐生命的操练，即呼求居于我们心中的耶稣基督之名，正如上文已述。'
  - type: paragraph
    text:
      ru: И, таким образом, если усмотрит Бог в том пользу нашу, возводит, кого хочет и знает, чрез таковое доброе начало и на зрительную умную молитву. Некоторые же, которых следует назвать легкомысленными, слыша, что чрез эту делательную умную молитву достигается скорейшее преуспеяние, стремятся преждевременно достичь в зрительную молитву, полагая, что она находится в руках желающих. Другие же, узнав, что зрительной молитвы не все удостаиваются, но только немногие, ослабевают, а иногда и совершенно нерадят о делательной умной молитве, без которой никто не может избежать действия страстей и приятия лукавых помыслов, за которые будут истязаны в час смерти и дадут ответ на Страшном суде. Таковые должны понимать, что мы отнюдь не осудимся за зрительную молитву, если не удостоимся ее по немощи нашей, об умном же и сердечном хранении, каковым можно противостать диаволу и злым помыслам, побеждая их не своею силою, а страшным именем Христовым, должны будем воздать ответ Богу, ибо, нося Христа внутри себя по дару св. крещения, не умеем, вернее же сказать, не хотим научиться, как призывать Его на помощь в час брани, и за это именно укоряет нас апостол, говоря:«Невесте лияко Иисус Христос в вас есть?»(2Кор.13:5) Неужели еще не опытны, не обучены действовать умом в сердце имя Христово? И хотя многие из древних, а не только нынешние, умерли не сподобившись при жизни зрительной молитвы, это не должно вызывать сомнения, ибо нет места неправде у Бога, и Он во всяком случае за труды их, которыми они потрудились, идя истинным отеческим путем делательной молитвы, дает им в час смерти или по смерти действие зрительной молитвы, с которой они, как пламень огненный, проходят воздушные мытарства, по слову св. Исихия. И получают они жребий свой с теми святыми, которые, по апостолу, не приявши здесь обетования, трудились всю жизнь свою во уповании.
      cn: 于是，若上帝认为其中有益于我们，便藉着如此美好的开端，提拔祂所愿并所认识的人，达至观想的理智祷告。另有一些可称之为轻浮的人，听闻藉着这实践性的理智祷告能更快取得进步，便企图过早达到观想的祷告，以为它唾手可得。还有一些人，得知并非所有人都能蒙受观想祷告之恩，唯有少数人方能如此，便气馁，有时甚至完全怠忽了实践性的理智祷告，而没有它，无人能免于情欲的搅扰和邪恶意念的侵袭，他们将为此在死亡之时受审，并在大审判之日作出交代。这样的人应当明白，我们绝不会因着我们的软弱而未能蒙受观想祷告之恩便被定罪；然而，关于理智和内心的保守，借此方能抵御魔鬼和邪恶的意念，并非凭着自己的力量，而是凭着基督可敬畏的圣名来战胜它们——我们必须向上帝作出交代。因为我们藉着圣洗的恩赐，内里已承载基督，却不懂得，更确切地说，是不愿学习如何在争战之时呼求祂的帮助；圣使正是为此责备我们，说道：「岂不知耶稣基督在你们心里吗？」（哥林多后书 13:5）难道你们还不曾体验、不曾学习过在心中以理智运行基督的圣名吗？况且，许多古人，不独是今人，在生前未曾蒙受观想祷告之恩便已离世，这不应引起疑惑；因为在上帝那里没有不义之处，而祂无论如何，都会因着他们循着真正教父式的实践祷告之路所付出的劳苦，在死亡之时或死亡之后赐予他们观想祷告的功效，借此他们便能如火焰般，按着圣伊西基乌的教导，穿过空中关卡。他们与那些圣人同得福分，那些圣人，按着圣使所说，虽未在此世领受应许，却一生在盼望中劳作。
  - type: paragraph
    text:
      ru: Изложив все это, с указанием свидетельства Свящ. Писания, о единой делательной и подобающей еще страстным умной молитве, скажем по необходимости и о бывающей при этом прелести. Прежде всего, говорит св. патриарх Каллист, приходит теплота от почек, как бы опоясывая их, и она кажется прелестью, но это не прелесть, а естественное действие, порождаемое свойством подвига. Если же кто-нибудь думает, что эта теплота от благодати, то это воистину прелесть. Но какова бы она ни была, подвизающийся должен не принимать ее, но отгонять. Приходит и другая теплота от сердца, и, если ум снисходит в блудные помыслы, это несомненная прелесть. Если же все тело от сердца растепливается, ум же чист и бесстрастен и как бы прилепился во внутреннейшей глубине сердца, то это есть поистине действие благодати, а не прелести.
      cn: 阐明这一切，并引述圣经的见证，关于唯一合宜且仍为有情欲者所需的理智祷告，我们现在有必要谈谈随之而来的迷惑。首先，圣宗主教卡利斯托斯（Kallist）说，有一股热流从肾脏传来，似乎环绕着它们，这似乎是迷惑，但这并非迷惑，而是由苦修的特性所产生的自然作用。然而，如果有人认为这股热流来自恩典，那这确实是迷惑。但无论这热流如何，苦修者都不可接纳它，而应将其驱离。还有一股热流从心传出，如果理智堕入淫荡的思想，这无疑是迷惑。然而，如果全身都因心而温暖起来，而理智则洁净无情欲，并仿佛依附在内心最深处，那么这确实是恩典的作用，而非迷惑。
  - type: paragraph
    text:
      ru: 'Видя это, следует с самого начала обучать ум в час молитвы, чтобы он находился в верху сердца и зрел в глубину его, а не был бы на половине сбоку или на конце снизу. Причина же, по которой следует так поступать, такова: когда ум стоит сверху сердца и внутри его действует молитву, тогда, как царь, сидящий на высоте, взирает совершенно свободно на все пресмыкающиеся внизу злые помыслы и разбивает их о камень имени Христова, как вторых вавилонских младенцев. Притом же, будучи столь удален от чресл, может во всяком случае избежать похотного жжения, существующего в естестве нашем чрез преступление Адама. Если же кто начинает творить внимание в молитве на половине сердца от персей, то или от случающегося оскудения теплоты сердечной, или же по изнеможению ума и притуплению зрения под влиянием частого действия молитвы, или по причине воздвигнутой врагом брани, ум сам по себе ниспадает к чреслам и смешивается с похотною теплотою, хотя и невольно, по причине сближения с нею, при совершении молитвы на половине сердца.'
      cn: 鉴于此，应当从一开始就训练心智在祷告时，使其位于心之高处并洞察其深处，而非处于心之侧面或下端。而如此行之原因如下：当心智位于心之高处并在其中行使祷告时，便如同坐于高处的君王，能够全然自由地俯视所有在下方蠕动的邪恶思念，并将其摔碎在基督圣名之磐石上，如同摔碎第二次的巴比伦婴孩一般。除此之外，心智因如此远离腰腹，无论如何都能避免情欲的炽热，这情欲是因亚当的悖逆而存在于我们本性中的。但若有人开始在胸前之心半部进行祷告中的专注，那么，或因偶发的心中热力之匮乏，或因心智的疲惫和在频繁祷告作用下的视觉迟钝，或因仇敌所兴起的争战，心智会自行落向腰腹，并与情欲之热力混杂，尽管并非本意，但这乃是因在心之浅表处进行祷告时与情欲接近所致。
  - type: paragraph
    text:
      ru: Некоторые же, по наивной нерассудительности, или лучше сказать, не зная, что такое верх или средина сердца и что такое половина и конец его, начинают творить молитву снизу, на конце сердца, при чреслах, и, таким образом, касаясь умом частию сердца и частию чресл, по собственной вине вызывают прелесть, как обаятели змею, ибо невозможно избежать общения с врагом тем, кто таким образом держит внимание.
      cn: 有些人则，因着天真的不加省察，或者说，不知道心脏的顶端或中部为何物，也不知道心脏的半部和末端为何物，便开始从底部，在心脏的末端，在腰间作祷告，这样一来，他们的心神一部分触及心脏，一部分触及腰间，因着他们自己的过失招致迷惑，如同弄蛇人引蛇一般，因为那些以这种方式保持专注的人，不可能避免与仇敌交通。
  - type: paragraph
    text:
      ru: Другие же, страдая окончательным неразумием и грубостию, не знают даже самого места сердечного, находящегося под левым сосцом и боком, но, полагая его среди пупа чревного, дерзают – увы, их прелести! – там совершать умом молитву. Научаясь из этих примеров, следует, как сказано, совершать умом внимание и молитву внутри сердца сверху от сосца, а не на половине от персей и тем более не снизу от чресл.
      cn: 另一些人，却因着极度的愚昧与粗鄙，甚至不知心脏的真实位置，即位于左乳与左胁下方，反而误以为它在腹部肚脐中央，竟敢——哎呀，他们的妄想！——在那里用心灵进行祷告。从这些例子中学习，就应如前所述，在心脏内部，从乳房上方开始，用心灵进行专注与祷告，而不是在胸部中央，更不是在腰部下方。
  - type: paragraph
    text:
      ru: 'Также необходимо распознавать умным чувством и теплоту в молитве: какая изливается в сердце от Бога, как миро благовонное, чрез св. крещение, и какая привзошла к нам от преступления прародителей, и какая возбуждается диаволом.'
      cn: 此外，也有必要以明智的感受辨别祷告中的暖意：哪些是来自上帝、藉着圣洗倾注于心间，犹如芬芳香膏的；哪些是源自始祖的罪过临到我们的；以及哪些是被魔鬼激起的。
  - type: paragraph
    text:
      ru: Первая теплота только в самом сердце с молитвою начинается и в сердце же оканчивается с молитвою, подавая душе удостоверение и плоды духовные. Вторая же имеет начало и конец в почках, принося душе жесткость, студеность и смущение. Третья, возникая от смешения с похотным жжением, распаляет сердце и члены блудным сладострастием, пленяя ум в скверные помыслы и привлекая к блудному совокуплению, что каждый тщательный делатель может скоро заметить и распознать. И хотя враг, говорит Григорий Синаит, внутрь чресл и покушается по своему желанию призрачно представлять духовное, вместо теплоты духовной наводя свое жжение, вместо веселия возбуждая радость бессмысленную и сласть мокротную, и побуждает принимать обольщение как действительную благодать, но время, опыт и чувство научают его распознавать.
      cn: 第一种暖意唯独在心中伴随着祷告开始，也同样在心中伴随着祷告结束，赐予灵魂以确信和属灵的果实。而第二种则始于肾脏，也止于肾脏，给灵魂带来刚硬、冷淡和纷乱。第三种则源于情欲之火的掺杂，燃炽心与肢体，以淫乱的肉欲，将心思俘虏于污秽的念头中，并引诱人行淫乱的苟合，这是每个细心的修持者都能迅速察觉和辨别的。诚然，格里高利·西乃人说，虽然仇敌在腹中妄图按照其私欲，以幻象呈现属灵之事，并非带来属灵的温暖，反施以自身的炽热，并非激发喜乐，反煽动毫无意义的欢愉和黏腻的欲乐，并诱使人将这欺骗当作真正的恩典来接受，但时间、经验和感觉会教导人去辨别它。
  - type: paragraph
    text:
      ru: «Если же прелесть познается временем, опытом и чувством, то не следует страшиться или сомневаться, призывая Бога», – говорит тот же святой. Если же некоторые и совратились, повредившись в уме, то знай, что они потерпели это от высокоумия и самочиния. Не для устрашения или отогнания нашего от священного делания умной молитвы, написали св. отцы много о прелести, под различными видами и предлогами постигающей делателей, но в предостережение наше и для распознания прелести и лукавого действия сатаны, и ради этого и повелевают всем борющимся со страстями держаться непадательного пути царского, живя в пустыне вдвоем или втроем, где, имея брат брата добрым советником и исследуя день и ночь Свящ. Писание, могут, благодатию Христовою, непрестанно обучаться этому умному деланию.
      cn: 「如果迷惑能通过时间、经验和感觉来辨识，那么在呼求上帝时，就不应恐惧或怀疑，」—— 同一位圣者说。如果有些人确实误入歧途，心智受损，那么你当知道，他们之所以蒙受此苦，是因骄傲和自作主张。圣教父们写了许多关于迷惑的内容，以各种形式和借口困扰修行者，并非为了恐吓或使我们远离神圣的净心祷告之修行，而是为了警示我们，并为了辨识迷惑和撒旦的邪恶作为。因此，他们亦命令所有与情欲搏斗的人，要坚守永不跌落的王道，两人或三人一同在旷野生活时，在那里，弟兄之间互为良善的建议者，日夜研读圣经，就能借着基督的恩典，不断地学习这种净心修行。
  - type: paragraph
    text:
      ru: 'Некоторым же из многих неизвестно откуда пришло в голову, будто бы нынешним монахам уже не подаются действия Св. Духа, как прежним: уже прошли, говорят, те времена. Но это только преткновение так говорящих: ибо так сказали св. отцы о знамениях и чудесах, ради которых бывает некоторое умаление веры, по слову Христа, «блаженны не видевшие и веровавшие», а не о прекращении действий Св. Духа. Эти дары всякому верному несомненно подаются в св. крещении и неистребимо в нас пребывают, если даже мы и не чувствуем их, будучи умерщвлены грехами. И должны мы соблюдением заповедей и призыванием Иисуса Христа, живущего в сердцах наших, воспринять сие дарование и видеть умом сказанное нами прежде, что закон духовный мы носим написанным на скрижалях сердец наших, сподобляясь непосредственно, по образу херувимов, беседовать со Христом чистою сердечною молитвою.'
      cn: 然而，有许多人不知何故心中生出念头，认为现今的修士已不再像从前的修士那样获得圣灵的作为；他们说，那些时代已经过去了。但这只是如此说之人的绊脚石：因为圣教父们是如此论及神迹和奇事，因着它们会导致信仰的某种减损，正如基督所言：「福哉！那些没有看见而信的人。」而不是论及圣灵作为的停止。这些恩赐毫无疑问地在圣洗礼中赐予每一位信徒，并在我们里面不可磨灭地存留，即使我们因罪而被致死，感受不到它们。并且我们应当藉着遵守诫命和呼求活在我们心中的耶稣基督，领受这恩赐，并以心智领悟我们之前所说的，即我们将属灵的律法铭刻在我们的心版上，得以直接地，效法革鲁宾的样式，藉着纯洁的内心祷告与基督交谈。
  - type: paragraph
    text:
      ru: 'Поэтому несправедливо, выдумывая извинение грехам, обвинять время или Бога в оскудении действия Св. Духа. Но, возложив всю вину на трех злейших исполинов: неверие, леность и небрежение, – перестанем лгать и, держась истины, приступим без сомнения к обучению умного делания, отвергнув от себя и еще трех главнейших противников: самолюбие, сребролюбие и тщеславие, вместе с которыми и другие страсти можем истребить из наших душ.'
      cn: 因此，捏造借口为罪孽开脱，将圣灵行动的匮乏归咎于时间或上帝，是不义的。然而，我们将所有罪责都归于三个最邪恶的巨人——不信、怠惰和疏忽，便可停止说谎，持守真理，毫不疑惑地着手学习心祷的操练，同时摒弃我们自身另外三个主要对头：自爱、贪财和虚荣；与它们一同，我们便能将其他的恶欲从我们的灵魂中根除。
  - type: paragraph
    text:
      ru: 'Прежде же всех в теле подвизающегося и внимающего в молитве начинаются некоторые движения, как бы «взыграния» под кожей, и они некоторыми принимаются за прелесть. Появляется теплота от почек, как бы опоясывая, и она также принимается за прелесть, но это не прелесть, а естественное действие, порождаемое свойством подвига. Если же кто-нибудь прославляет эту теплоту как благодатную, а не естественную, то это несомненно прелесть. Но какова бы она ни была, подвизающийся не должен ее принимать, но отгонять и отметать. Приходит и другая теплота от сердца, и если ум при этом снисходит в блудные помыслы, это прелесть воистину. Когда же все тело от сердца растепливается, ум же остается чист и бесстрастен и как бы прилеплен во внутреннейшей глубине сердца, то это есть несомненно действие благодати, а не прелести. Иногда же у испытывающих такое состояние появляется и пот от обильной теплоты, бывающей в теле. И тогда подвижется от сердца святое действие, взимающее как бы лист некий от сердца и движущее ум от внутренних, как бы прильпнувший к самому тому Божественному действу, чтобы вопиять часто: «Иисусе мой, Иисусе мой». Так именно, во отверзении сердца только это вопиет ум: «Иисусе мой!» – и не может все произнести ум, то есть: «Господи, Иисусе Христе, Сыне Божий, помилуй мя», – от частых отверзений сердца, но только: «Иисусе мой». Те же, которые говорят, что в таком устроении совершают всю молитву, прельщаются. Ибо, когда ум прилепится, как уже сказано, Божественному действованию, войдя во внутреннейшее сердца, не может взывать больше, как только: «Иисусе мой!». Тогда, подлинно, от этой святой молитвы рождается в сердце и благоговейный страх, когда нисходит великое утешение в душу от святого действования. И тогда скачет, и истекает сладостная слеза от сердца, и сладостно течет из очей, и это есть радостопечалие. Вскипает же тогда сердце от многого оного священнодейства, и бывает все тело распалено, и ум в благоговейном страхе взывает: «Господи, помилуй». И, как елей в полном сосуде, сильно разогреваемый огнем, от многого кипения льется чрез край, так бывает и в сердце, когда оно возгреется от Божественного действия, изливает теплоту и на тело и делает его распаленным, и тогда переживающий это чувствует, как все внутренности его готовы выскочить вон. Совершаются и другие некоторые чудесные тайны с имеющим указанное устроение: бывает иногда и свет, с помощию которого делатель созерцает внутри себя просвещение, озаряющее его, как солнце, и источающее от сердца свет. Бывают внутри сердца и другие таинства, но не могу их описать: видит ум все творение и, ужасаемый движением святого действа и созерцанием Божественных таинств, воссылает из глубины сердца славословия, которых не могу изобразить писанием. Весь человек становится тогда обоженным этим Божественным движением, вне всего вещественного и чувственного, и как бы охваченным неудержимой радостью, подобно напоенному вином. И после ум восхищается в Божественное видение и видит страшные таинства, о которых не могу писать подробно. Видит ум видения Божественные, видит и наслаждение праведных, райские красоты. Еще выше ум видит на небе страшные и преславные таинства и, поскольку возвышается человек от прилогов бесовских, постольку видит еще больше из того, что дает ему Дух, Которому слава во веки. Аминь.'
      cn: '首先，在一切在身体中进行苦修并专心祷告之人身上，开始出现一些律动，如同皮肤下的「跳动」，有些人认为这些是「虚妄」。有一种暖意从肾部升起，如同环绕，这也被人当作「虚妄」，但这并非「虚妄」，而是一种自然的作用，由苦修的特质所生发。若有人将这暖意尊为恩典所赐而非自然作用，这无疑就是「虚妄」。无论如何，苦修者都不应接受它，而应将其驱逐并摒弃。


        还有另一种暖意从心升起，若此时心智堕入淫荡的念头，这便是真真切切的「虚妄」。当全身因心而温暖起来时，而心智却保持纯洁和无情欲，并且仿佛依附在内心最深处，那么这无疑是恩典的作用，而非「虚妄」。


        有时，经历这种状态的人，由于体内大量暖意，也会出汗。此时，圣洁的作用从心发出，仿佛从心中取走一片叶子，并将心智从内在深处推动，仿佛依附于那神圣的作用本身，从而常常呼喊：「我的耶稣啊，我的耶稣啊！」


        正是如此，在心敞开时，心智只呼喊这一句：「我的耶稣啊！」——心智无法完整地说出，即：「上主，耶稣基督，上帝之子，怜悯我！」——因心频繁地敞开，只能说：「我的耶稣啊！」那些声称在如此状态下能够完成整个祷告的人，则陷于「虚妄」。


        因为，正如已经说过的，当心智依附于神圣的作用，进入内心最深处时，就无法再呼求别的，只能是：「我的耶稣啊！」那时，确实地，从这圣洁的祷告中，心中生发出敬畏之情，当巨大的慰藉从圣洁的作用降临到灵魂中时。


        此时，甘甜的泪水从心涌出，溢流而出，并且甘甜地从眼中流出，这就是「悲喜交集」。此时，心因那诸多神圣的作用而沸腾，并且全身火热，心智在敬畏中呼求：「上主，怜悯！」


        并且，如同满满一容器的油，被火猛烈加热，因剧烈沸腾而溢出容器边缘，同样也发生在心中，当它被神圣的作用加热时，便将暖意倾泻到身体上，使其火热，此时，经历此番感受之人会觉得，他所有的内脏都似要冲出来。


        经历上述状态之人还会发生其他一些奇妙的奥秘：有时会出现一道光，借此，修行者在自己内在默观着一道光照，这光照如同太阳般照亮他，并从心中涌出光。心中还会发生其他奥秘，但我无法描述它们：心智看见一切受造之物，并且，因圣洁的作用之律动和对神圣奥秘的默观而感到敬畏，从心深处发出赞美之辞，这些赞美之辞我无法用文字描绘。


        此时，整个人因这神圣的律动而被「神化」，超越一切物质和感官的界限，并且仿佛被一种无法抑制的喜乐所笼罩，如同醉酒之人。之后，心智被提入神圣的异象，并且看见可畏的奥秘，我无法详细书写。


        心智看见神圣的异象，也看见义人的喜乐，乐园的美丽。更进一步，心智在天上看见可畏而荣耀的奥秘，并且，人越是摆脱魔鬼的诱惑，就越能看见圣灵所赐予的更多景象，愿荣耀归于祂，直到永远。阿们。'
