title:
  ru: Предисловие или предпутие, желающим читать книгу&#13; святого отца нашего Григория Синаита и не погрешать&#13; против ее смысла
  cn: 序言，或为前行导引，献给希冀阅读我等圣父格列高利·西奈特圣书，且不谬解其原意者。
languages:
- ru
- cn
authors:
- ru: преподобный Василий Поляномерульский
  cn: 尊者 瓦西里·波利亚诺梅鲁斯基
document:
- type: heading1
  text:
    ru: преподобный Василий ПоляномерульскийПредисловие или предпутие, желающим читать книгу святого отца нашего Григория Синаита и не погрешать против ее смысла
    cn: '圣瓦西里·波利亚诺梅鲁斯基


      序言或导引，为欲阅读我们圣父格列高利·西奈之书而不谬解其真义者'
  children:
  - type: paragraph
    text:
      ru: Многие, читая эту святую книгу св.Григория Синаитаи не зная опытно умного делания, погрешают против здравого разума, думая, что умное делание принадлежит одним бесстрастным и святым мужам.
      cn: 许多人，在阅读这本圣格里高利·西奈特所著的圣书时，由于没有亲身经验「心智的操练」，因而违背了健全的理性，认为「心智的操练」只属于那些没有情欲的圣洁圣徒们。
  - type: paragraph
    text:
      ru: По этой причине, держась, по внешнему обычаю, одного псалмопения, тропарей и канонов, препочивают в этом одном внешнем молении. Они не понимают того, что такое песненное моление предано нам отцами на время, по немощи и младенчеству ума нашего, чтобы мы, обучаясь мало-помалу, восходили на степень умного делания, а не до кончины нашей пребывали в песенном молении. Ибо что младенчественнее того (Григорий Синаит, гл. 19), когда мы, прочитав устами внешнее наше моление, увлекаемся радостным мнением, думая о себе, что творим нечто великое, потешая себя одним количеством и этим питая внутреннего фарисея.
      cn: 因此，他们按照外在的习俗，仅仅执着于咏唱诗篇、短颂和圣歌，满足于这种外在的祷告。他们不明白，这种歌颂式的祷告，是教父们因着我们心智的软弱和稚嫩，暂时地传授给我们的，为的是我们能循序渐进地学习，升进到心智的操练的境界，而不是直到我们离世，都停留在歌颂式的祷告中。因为有什么比这更幼稚的呢（西乃的格列高利，第19章），当我们用口舌诵读完外在的祷告后，便沉溺于自以为是的喜悦念头中，认为自己做了什么伟大的事，仅仅因数量而自娱自乐，并以此滋养了内在的法利赛人。
  - type: paragraph
    text:
      ru: 'Отводя нас от такой, подлинно младенческой, немощи, как младенцев от сосцов млекопитательных, св. отцы показывают нам грубость этого делания, сравнивая гласовое языком пение с пением язычников. Ибо надлежит, говорит св.Макарий Египетский(Гл. 6) по образу жизни нашей, ангельскому быть и пению нашему, а не плотскому, да не скажу языческому. Если же и дозволено нам петь голосом, то ради лености и неведения нашего – с тем, чтобы мы возводились к истинному молению. Какой же бывает плод такого внешнего моления, показал св.Симеон Новый Богослов, во втором образе внимания, говоря:'
      cn: 引导我们脱离这种真正婴儿般的软弱，如同使婴孩断离乳母的乳房，圣教父们向我们揭示了这种行为的粗糙，将口头上的歌唱与异教徒的歌唱相比较。因为，埃及的圣马卡里乌斯（第六章）说，理当我们的歌唱，应如同我们的生活方式，是天使般的，而非属肉体的，更不用说异教徒式的。倘若我们也蒙允许用声音歌唱，那是由于我们的怠惰和无知——以便我们能被提升至真实的祈祷。那么，这种外在祈祷会带来何种果实，新神学家圣西美翁在第二种注意方式中已经揭示，他说：
  - type: paragraph
    text:
      ru: '«Второй же образ внимания и молитвы таков: когда кто собирает ум свой в себе, отвлекая его от всего чувственного, и хранит чувства свои, и собирает все помыслы свои, чтоб не скитались в суетных вещах мира сего, и то исследует помыслы свои, то внимает словам произносимой им молитвы, в иной час собирает в себе все помыслы свои, плененные диаволом и превращенные в лукавые и суетные, в иной же час снова со многим трудом и усилием приходит в самого себя, быв охвачен и побежден какою-либо страстию.'
      cn: 第二种专注与祈祷的方式如下：当某人将自己的心智收敛于自身之内，使其脱离一切感官事物，并保守自己的感官，收敛自己所有的意念，以免其游荡于今世的虚妄之事中；有时省察自己的意念，有时则专注其所诵念的祈祷话语；在另一时刻，则将自身内所有被魔鬼掳获并转变为邪恶与虚妄的意念收敛起来；而在另一时刻，他则需带着许多的劳苦与努力，再次回到自身之内，因他曾被某种情欲所缠绕并制服。
  - type: paragraph
    text:
      ru: И имея этот подвиг и брань внутри себя, не может он никогда быть мирным или найти время заняться деланием добродетелей и получить венец правды. Ибо таковой подобен ведущему брань с врагами своими ночью в темноте. Он слышит голоса врагов и принимает раны от них, но не может ясно видеть, кто они такие, откуда пришли, как и почему одолевают его. Потому что тьма, которая находится в уме его, и буря, которую он имеет в помыслах, приносят ему сию тщету. И он никак не может освободиться от своих мысленных врагов, чтобы не сокрушали его. Он и труд подъемлет, награды же лишается, ибо окрадывается тщеславием, не сознавая того, думает о себе, что он внимателен, многократно от гордости презирает других, и охуждает их, и считает себя достойным, по своему мечтанию, быть пастырем овец и путеводительствовать их, уподобляясь слепцу, покушающемуся водить других слепцов».
      cn: 拥有这种内在的苦修与争战，他永远无法获得平安，或找到时间去行善并获得公义的冠冕。因为这样的人如同在黑夜里与仇敌争战。他听见仇敌的声音并受到他们的伤害，却无法清楚地看见他们是谁，从何而来，以及他们如何、为何战胜他。因为在他心智中的黑暗，以及他在意念中的风暴，给他带来这种虚妄。他根本无法摆脱自己意念上的仇敌，以防他们击垮他。他付出了劳苦，却失去了奖赏，因为他被虚荣所偷窃，却不自知，他自以为自己是警醒的，多次因着骄傲轻视他人，并谴责他们，且依凭自己的幻想，认为自己配作群羊的牧者并引导他们，如同一个企图带领其他盲人的盲人。
  - type: paragraph
    text:
      ru: 'Как же можно внешними чувствами хранить ум или собирать его от тех, кои по естеству сами собою растекаются и парят по чувственным вещам: зрение, рассматривая прекрасное или безобразное; слух, слушая приятное или противное; обоняние, обоняя благовонное или смрадное; вкус, вкушая сладкое или горькое; осязание, касаясь доброго или злого, и таковыми, подобно листьям от ветра, сотрясаясь и колеблясь; уму же, единому, всем этим смущающемуся и размышляющему об их действиях, можно ли когда-либо быть свободным от помыслов правых и левых? Никак и никогда.'
      cn: 怎能借着外在诸感官，保守心智，或将其从那些因本性而自行散漫、游荡于感官事物之中的思绪中收摄回来呢？视觉，察看美丽或丑陋之物；听觉，聆听悦耳或刺耳之声；嗅觉，嗅闻芬芳或恶臭之气；味觉，品尝甘甜或苦涩之味；触觉，触摸舒适或不适之物，如此这般，如同风中之叶，摇曳不定，颤动不已；而心智，唯独它，却被这一切所搅扰，并思虑着它们的运作，又怎能从左右思虑中解脱出来呢？绝不可能，永无可能。
  - type: paragraph
    text:
      ru: Если же внешние чувства не могут оградить ум от помыслов, то, конечно, возникает нужда бежать уму от чувств в час молитвы внутрь к сердцу и стоять там глухим и немым от всех помыслов. Ибо если кто внешним только образом удалится зрения, слуха и глаголания, получает некоторую тишину от страстей и помыслов злых, но в значительно большей степени он насладится покоем от злых помыслов, когда удалит ум свой от пяти внешних чувств, заключая его во внутренней и естественной клети, или пустыне, и вкусит духовной радости, приходящей от умной молитвы и сердечного внимания.
      cn: 如果外在感官无法抵御意念对心智的侵扰，那么，在祷告之时，心智当然就需要从感官中逃离，转向内心，归于心，并在那里对一切意念保持聋哑。因为倘若有人仅仅通过外在方式远离视觉、听觉和言语，便能获得某种程度的平静，免受情欲和邪恶意念的扰乱；然而，当他将自己的心智从五种外在感官中抽离，将其收束于其内在和天然的密室，或荒漠之中时，他将享受到远为greater的，免受邪恶意念侵扰的安宁，并品尝到由心智祷告和心的专注所带来的属灵喜乐。
  - type: paragraph
    text:
      ru: Как обоюдоострый меч, куда бывает обращаем, сечет своей остротой встретившееся, так и молитва Иисус-Христова, обращаемая иногда на злые помыслы и страсти, иногда же за грехи или памятию смерти, Суда и мук вечных действуется. Если же кто помимо умной молитвы песненным молением и внешними чувствами с прекословием захочет отразить прилог вражий и противостать какой-либо страсти и лукавому помыслу, тот скоро одолен бывает много раз, ибо бесы, одолевая его сопротивляющегося и снова добровольно ему покоряясь, как бы побеждаемые его сопротивлением, издеваются над ним и склоняют его мысли к тщеславию и гордости, называя его учителем и пастырем овец.
      cn: 就像双刃剑无论指向何方，都以其锋利斩断所遇之物，耶稣基督祷文也是如此，有时用于抵御邪恶的念头和情欲，有时则为罪，或借着对死亡、审判和永恒痛苦的忆念而发挥作用。若有人撇开心祷，仅凭口头祷告和外在感官，带着驳斥想要击退仇敌的诱惑，并抵挡任何情欲和邪恶的念头，他很快就会屡次被击败。因为恶魔在战胜抵抗中的他之后，又再次自愿地臣服于他，仿佛被他的抵抗所击败，以此嘲弄他，并使他的思想倾向于虚荣和骄傲，称他为教师和羊群的牧人。
  - type: paragraph
    text:
      ru: 'И, зная это, св. Исихий говорит: «Не может ум наш победить мечтание бесовское сам собою только и да не надеется когда-либо на это, ибо бесы, будучи коварными, лицемерно покоряются и притворяются побежденными, запиная тебя тщеславием с другой стороны. И не терпят, чтобы ты хотя бы даже на один час умудрился призыванием Иисуса Христа». И снова: «Берегись, да не вознесешься, по примеру древнего Израиля, и предан будешь и ты мысленным врагам. Тот, будучи избавлен Богом всяческих от египтян, задумал сделать себе помощником идола перстного. Под идолом же перстным разумей наш немощный ум, который, пока молит Иисуса Христа против лукавых духов, легко их отгоняет и художным искусством побеждает невидимые ратные силы врага. Когда же бессмысленно станет всячески надеяться на себя, тогда, подобно так называемому быстрокрылому, разбивается и падает дивным падением».'
      cn: '圣伊西基深知此理，故言曰：「我们的心智无法仅凭自身战胜魔鬼的幻想，也不可寄望于此，因为魔鬼诡诈狡猾，它们会假意顺从，装作被战胜，却从另一方面以虚荣绊倒你。它们甚至不能忍受你仅仅一个时辰，因呼求耶稣基督而得智慧。」


        他又说：「当心，莫要像古时的以色列人那样自高自大，以免你也被交于心魔。那（以色列人），蒙万有之上帝从埃及人手中拯救出来后，竟想为自己造一个土偶偶像作帮手。这土偶偶像，指的便是我们软弱的心智，当它向耶稣基督祷告以抵挡邪恶的灵时，便能轻易地将其驱逐，并以巧妙的技艺战胜那看不见的敌方军队。然而，一旦它愚蠢地凡事都寄望于自身，那时，它便会像那所谓的『快翼者』一般，遭受奇特的崩解与坠落。」'
  - type: paragraph
    text:
      ru: 'Из сказанного достаточно познается сила и мера умного делания, т. е. молитвы и пения. Не думай же того, благочестивый читатель, что св. отцы, отводя нас от многого внешнего пения и повелевая обучаться умному деланию, наносят ущерб псалмам и канонам. Да не будет, ибо от Духа Святого предано все это св. Церкви, в которой все священнодействия возглавляются хиротониею, и все таинство домостроительства Бога Слова, даже до второго Его пришествия, вместе же и нашего воскресения, в себе заключают. И нет ничего человеческого в чине церковном, но все – дело благодати Божией, не возрастающее от наших достоинств, не умаляющееся от наших грехов. Но у нас речь идет не о чинах св. Церкви, но об особом правиле и образе жизни каждого из монахов, т. е. об умной молитве, которая старанием и сердечною правотою обычно привлекает благодать Св. Духа, а не одними словами псаломскими, помимо умного внимания, устами только и языком поемыми. Как сказал апостол: «Хочу пять слов сказать умом моим, чем тьму языком». Ибо следует сначала этими пятичисленными словами очищать ум и сердце, говоря непрестанно в глубине сердечной: «Господи, Иисусе Христе, помилуй мя», – и таким образом восходить на разумное пение. Потому что всякий новоначальный и страстный может сию молитву разумно, в блюдении сердца, действовать, пения же никак, прежде чем не предочистится умною молитвою. Поэтому св. Григорий Синаит, всех святых жития, и, писания и искусство духовное более всех, живущим в нем Св. Духом до тонкости испытав и рассудив, установляет все старание иметь о молитве. Также и св. Симеон, Солунский архиепископ, имея тот же Дух и дар, заповедует и советует архиереям, священникам, монахам и всем мирским во всякое время и час произносить и дышать сию священную молитву, ибо нет, говорит он с апостолом, крепчайшего оружия ни на небе, ни на земле, больше имени Иисуса Христа.'
      cn: 从所说的，足可充分认识智性操练，亦即祷告与歌颂的力量与尺度。虔诚的读者，切勿认为圣教父们引导我们脱离过多的外在歌颂，并命令我们学习智性操练，便损害了圣咏和正典。绝无此事！因为这一切都是由圣灵传授给圣教会的，其中所有的神圣礼仪都由圣职按立所主持，并且圣言上帝救世计划的全部奥秘，甚至直到祂第二次降临，以及我们的复活，都包含在其中。教会规程中绝无任何属人的事物，但一切都是上帝恩典的作为，不因我们的功绩而增加，也不因我们的罪过而减少。但我们在此所谈论的，并非圣教会的规程，而是每位修士特有的规矩和生活方式，亦即智性祷告——这种祷告通常凭借勤勉和内心的正直吸引圣灵的恩典，而非仅仅是圣咏的言词，在缺乏智性专注的情况下，只由口唇和舌头所唱诵的。正如使徒所说：「我宁愿用我的心智说五句话，胜过用舌头说一万句。」（哥林多前书 14:19）因为首先当以这五句言语洁净心智和心灵，不停地在内心深处诵念：「主耶稣基督，求祢怜悯我」，如此方能升华至理性的歌颂。因为任何初学者和有情欲之人，都能在保守心怀中，有意识地施行这祷告；但歌颂却绝不能，除非先借由智性祷告得到洁净。因此，圣西乃山格列高利，借着住在他里面的圣灵，将所有圣人的生平、著作和属灵艺术都彻底考察并辨明后，规定要将全部努力集中在祷告上。同样，索伦大主教圣西缅，怀着同样的圣灵和恩赐，嘱咐并建议众主教、司祭、修士以及所有平信徒在任何时间、任何时刻念诵并呼吸这神圣祷告，因为他如同使徒一般说道，无论是天上还是地上，都没有比耶稣基督之名更强大的武器。
  - type: paragraph
    text:
      ru: 'Да будет же известно тебе, добрый ревнитель священного сего умного делания, и то, что не только в пустыне или в уединенном отшельничестве, но наиболее в самых тех великих лаврах, находившихся среди городов, были учители и многочисленные делатели сего умного священнодействия. И достойно удивления, как святейший патриарх Фотий, будучи взят на патриаршество от сенаторского звания, не монах, обучился на таком высоком посту этому умному деланию и настолько преуспел, что лицо его сияло, подобно второму Моисею, от пребывавшей в нем благодати Св. Духа, говорит св.Симеон Солунский. И свидетельствует о нем, что он и книгу написал всепремудрым философским искусством об этом умном делании. Говорит также, что иИоанн Златоуст, Игнатий же и Каллист, святейшие патриархи того же Цареграда, написали свои книги о том же внутреннем делании. И чего еще тебе недостает, христолюбивый читатель, чтобы, отложив всякое сомнение, приступить к обучению умного внимания? Если скажешь: не имею жития уединенного, – пример тебе – св. патриарх Каллист, который обучился умному деланию в великой Лавре Афонской, проходя поварскую службу. Если сомневаешься, что не находишься в глубокой пустыне, второй тебе пример – св. патриарх Фотий, обучившийся искусству сердечного внимания уже в патриаршем сане. Если под предлогом послушания ленишься приступить к умному трезвению, – за это посмеянию подлежишь, так как ни пустыня, ни уединенное житие не приносят в такой мере преуспеяние в этом делании, как послушание в разуме, говорит св. Григорий Синаит. Или еще с правой стороны окрадываешься, будто не имеешь учителя таковому деланию, – повелевает тебе Сам Господь учиться от Писания, говоря: «Испытайте Писания и в них обрящете живот вечный». Или от левой стороны увлекаешься, смущаясь, не находя места безмолвного, – и в этом тебя опровергаетПетр Дамаскин, говоря: «В том состоит начало спасения человеку, да оставит свои хотения и разумения, исполнит же Божии хотения и разумения, и тогда не найдется во всем мире вещи, или начинания, или места, которое могло бы воспрепятствовать ему». Наконец, если еще изобретая благословнейшую причину, претыкаешься неоднократными словами св. Григория Синаита, много говорящего о прелести, случающейся в сем делании, то исправляет тебя сам этот святой, говоря: «Мы не должны бояться или сомневаться, Бога призывая. Если же некоторые и совратились, будучи повреждены умом, то знай, что они потерпели это от самочиния и высокоумия». Кто же в послушании, с вопрошением и смиренномудрием ищет Бога, никогда не потерпит вреда благодатию Христа. Ибо кто право живет и непорочно жительствует и удаляется от самоугодия и высокоумия, тому весь бесовский полк, хотя бы и бесчисленные против него поднял искушения, не может повредить, как говорят отцы. Которые же самонадеянно и самовольно ходят, эти в прелесть впадают. Если же некоторые, претыкаясь о камень Свящ. Писания, принимают указания нам пути прелести поводом к возбранению умного делания, то таковые пусть знают, что они превращают «горняя долу и дольняя горе». Не на возбранение умного делания, но предостерегая нас от прелести, указывают нам св. отцы причины, по которым прелесть приходит.'
      cn: 愿你得知，贤善热忱于此神圣心神操练之人，不仅在沙漠或隐居的苦修中，更是在那些位于城市中的大型修道院里，有此心神圣事的教师和众多实践者。令人称奇的是，至圣宗主教福提乌斯，他本是元老院成员，并非修士，却被擢升为宗主教，在如此崇高的职位上学会了这种心神操练，并且成就非凡，以至于他的面容，因着居住在他里面的圣灵恩典，如同第二位摩西般闪耀，圣西美翁·索卢斯基如是说。他还为福提乌斯作证，说他以至智的哲学艺术写了一本关于这心神操练的书。他还说，约翰·金口、伊格纳提乌斯和卡利斯图斯，这几位同一君士坦丁堡的至圣宗主教，也写了关于同一内在操练的书。那么，蒙基督所爱的读者啊，你还缺少什么，以至于未能放下一切疑惑，开始学习心神专注呢？如果你说：我没有隐居的生活，那么，圣宗主教卡利斯图斯就是你的榜样，他在阿索斯圣山的大修道院里，在担任厨师职务时，学会了心神操练。如果你怀疑自己不在深邃的沙漠中，那么，圣宗主教福提乌斯是你的第二个榜样，他在已任宗主教职位后，才学会了心神专注的艺术。如果你以顺服为借口，懒于开始心神警醒，你就因此招致嘲笑，因为无论是沙漠，还是隐居生活，都无法像在理智上的顺服那样，在此操练中带来如此程度的成就，圣格列高利·西奈特如是说。又或者，你从右侧被窃夺了，仿佛没有此操练的老师——上主亲自吩咐你从《圣经》中学习，祂说：「你们查考《圣经》，因为你们以为内中有永生。」（约翰福音 5:39）又或者，你从左侧被引诱了，因找不到宁静之处而烦恼——圣彼得·大马士革在此方面驳斥你，他说：「人的救恩始于此：放弃自己的意愿和观念，而成就上帝的意愿和观念，届时在整个世上，任何事物，任何开端，任何地点都无法阻碍他。」最后，如果你还在编造更「合理」的理由，被圣格列高利·西奈特屡次提及的、关于在此操练中发生的「错觉」的话语所绊倒，那么，这位圣人亲自纠正你，他说：「我们不应在呼求上帝时感到恐惧或怀疑。如果有些人误入歧途，心智受损，那么你要知道，他们遭受此境是出于自作主张和骄傲自大。」然而，凡是在顺服中，以寻求和谦卑之心寻找上帝之人，绝不会因基督的恩典而遭受伤害。因为凡是正直生活，洁净无瑕地度日，并远离自我放纵和骄傲自大之人，即使整个魔鬼军团对他发起无数的试探，也无法伤害他，如教父们所言。而那些自以为是、恣意妄为之人，则会陷入「错觉」。然而，如果有些人，因圣经的磐石而跌倒，将（教父们）指示我们有关「错觉」途径的话语，当作是禁止心神操练的借口，那么这些人应该知道，他们是在颠倒「上者为下，下者为上」。圣教父们指示我们「错觉」产生的原因，并非为了禁止心神操练，而是为了告诫我们避免「错觉」。
  - type: paragraph
    text:
      ru: 'Подобным образом и сей св. Григорий Синаит, повелевая не бояться и не сомневаться обучающемуся в молитве, приводит две причины прелести: самочиние и высокоумие. И св. отцы, желая сохранить нас невредимыми от них, повелевают исследовать Свящ. Писание, научаясь от него, имея брат брата добрым советником, как говорит Петр Дамаскин. Если нельзя найти искусного делом и словом старца, по примеру св. отец, знающего хорошо отеческое писание, то, пребывая наедине, в безмолвии, всеми силами должно стараться иметь духовное наставление от учений и наставлений св. отец, вопрошая о всякой вещи и добродетели. Такую меру и порядок следует сохранять и нам, читая писания, а не уклоняться от их учения и наставления, подобно тому, как некоторые, не зная опыта умного делания и считая себя имеющими дар рассуждения, тремя причинами или доводами уклоняются, лучше бы сказать, отводят себя от обучения сему священному деланию. Во-первых, они считают, что это делание подобает лишь одним святым и бесстрастным мужам, а не и страстным. Во-вторых, указывают совершенное оскудение наставников и учителей таковому жительству и пути. В-третьих, последующую таковому деланию прелесть.'
      cn: 同样地，这位圣格列高利·西乃山人，在训示学习祷告之人不当惧怕和怀疑时，提出了两种「神魂颠倒」（прелесть）的原因：自作主张和心高气傲。并且众圣教父，为了使我们不受其害，训示我们研习圣经，从中学习，兄弟之间互为良善的建议者，正如大马士革的彼得所说。如果无法找到一位效法众圣教父、在言行上都娴熟并熟知教父著作的长老，那么，独自一人，在静默中，应当竭尽全力从众圣教父的教诲和训示中获取灵性指导，凡事和凡种美德都加以请教。我们也应当持守这样的标准和秩序，在阅读著作时，而不应当偏离他们的教诲和训示，就像有些人一样，他们不了解心祷的经验，且自以为拥有辨别之恩，以三个原因或论据规避——更准确地说，是使自己脱离这神圣操练的学习。首先，他们认为这种操练只适合圣洁无情欲的男子，而不适合有情欲之人。其次，他们指出，完全缺乏这种生活方式和道路的指导者和教师。第三，这种操练之后可能出现的「神魂颠倒」。
  - type: paragraph
    text:
      ru: Первая из этих причин, или доводов, никуда не годна и не справедлива, потому что первая степень для новоначальных монахов состоит в том, чтобы умалять страсти умным трезвением и сердечным блюдением, т. е. умною молитвою, подобающею деятельным. Вторая – безрассудна и неосновательна, потому что, за отсутствием наставника и учителя, Писание нам учитель, как сказано выше. Третья же самопрельстительна, ибо читая писание о прелести, этим же писанием сами себя запинают, криво рассуждая о нем. Вместо того, чтоб принимать писание как предостережение к познанию прелести, они придумывают и находят причину уклоняться от умного делания. Подобно тому, как полководец, получив известие, что неприятели устроили засаду на пути, намереваясь хитростью и тайным нападением одолеть его, не имея силы открыто с ним бороться, он же, будучи нерассудительным, вместо того, чтобы перехитрить врага и одержать победу нечаянным нападением на его тайную засаду, страшится страха, идеже не бе страх, и обращается в бегство, покрывая себя вечным позором пред царем и его вельможами.
      cn: 这些原因或论据中的第一个毫无价值且不公正，因为初入道院的修士的首要阶段在于借着心智的清醒和内心的守护，即心祷，减少情欲，这心祷是适合于实行灵修的人的。第二个是不智且毫无根据的，因为在没有导师和教导者的情况下，圣经是我们的老师，如上所述。而第三个则是自我迷惑的，因为他们阅读关于「迷惑」的著作时，却用这同一著作绊倒了自己，歪曲地解读它。他们非但没有将著作视为认识「迷惑」的警示，反而编造并找到了理由逃避心智的修行。犹如一位将领，接到情报，得知敌人在路上设下埋伏，企图以诡计和突袭战胜他，因为没有能力公开与他作战；而他却是不智的，非但没有智取敌人，并出其不意地袭击敌人的秘密埋伏而取得胜利，反而畏惧那本无恐惧之处的恐惧，并且转身逃跑，使自己蒙受永远的羞辱，在君王和他的大臣面前。
  - type: paragraph
    text:
      ru: 'Если же ты страшишься этого делания и обучения от одного благоговения и простоты сердца твоего, то и я еще больше вместе с тобою устрашаюсь, но не на основании пустых басен, по которым волка бояться – в лес не ходить. И Бога должно бояться, но не убегать и не отрекаться от Него по причине этого страха. Воистину, страха и трепета, сокрушения и смирения, и многого испытания Свящ. Писания, и совета единодушных братий требует это делание, но не бегства и отказа и тем более не дерзости и самочиния. Ибо дерзкий, сказано, и самонадеянный, порываясь к тому, что выше его достоинства и устроения, в гордости стремится достигнуть преждевременно зрительной молитвы. И еще: если кто мечтает мнением достигнуть высокого, будучи охвачен сатанинским, а не истинным желанием, такового сатана удобно опутывает своими сетями, как раба своего. И что нам стремиться к высокому преуспеянию в умной и священной молитве, которой, по слову св. Исаака, едва сподобляется один из тьмы?!'
      cn: '如果你因纯粹的虔敬与内心的纯朴而对此修持和学习深感恐惧，那么我与你一同更加恐惧。但这恐惧并非基于「因惧怕狼而不入林中」之类的虚妄传说。我们固然应当敬畏上帝，但绝不可因此恐惧而逃避祂或否认祂。


        诚然，此修持所需的是恐惧战兢、痛悔、谦卑、对圣经的深入查验，以及同心弟兄的建议，而非逃避与拒绝，更非鲁莽与擅作主张。因为，经上说，鲁莽自恃之人，急切地追求超越其尊严与受造本性的事，在骄傲中过早地企图达到观想的祷告。又者：若有人凭己意幻想达到高深之境，被撒旦的，而非真实的欲望所攫取，撒旦便轻易地以其罗网缠住此人，如同缠住自己的奴仆一般。我们又何必追求那在心祷与神圣祷告中的高深精进呢？圣以撒曾言，万中无一者方能蒙受此恩典？！'
  - type: paragraph
    text:
      ru: Довольно, довольно для нас, страстных и немощных, хотя след умного безмолвия познать, т. е. делательную умную молитву, при помощи которой прилоги вражии и злые помыслы прогонимы бывают от сердца и которая есть подлинное дело новоначальных и страстных монахов, каковым они востекают, аще Бог восхощет, в зрительную и духовную молитву.
      cn: 够了，够了，对我们这些有情欲和软弱的人而言，至少认识心神寂静的痕迹，也就是实行性的心神祷告，借着它，仇敌的诱惑和恶念得以从心中被驱逐，并且这是初学者和有情欲的修士们真正的功夫，他们借此升进，若上帝愿允，达到默观和灵性的祷告。
  - type: paragraph
    text:
      ru: И не следует нам унывать о том, что немногие сподобляются зрительной молитвы, ибо нет неправды у Бога. Только да не ленимся идти путем, ведущим к этой священной молитве, т. е. делательною молитвою сопротивляться прилогам, страстям и злым помыслам. И, таким образом, скончавшимся нам на пути святых, удостоимся и жребия их, хотя бы здесь и не достигли совершенства, говорит св. Исаак и многие святые.
      cn: 我们不应因鲜少人蒙受神视性祷告而灰心，因为在上帝那里没有不义。只要我们不懈怠地行走在这条通往此神圣祷告的道路上，亦即，借着实作祷告抵制引诱、情欲和恶念。如此这般，我们若在圣徒的道路上走完一生，便能蒙受他们的福分，即使我们在此世未能达到全然，圣以撒和许多圣徒如是说。
  - type: paragraph
    text:
      ru: 'И еще опять удивления и ужаса достойно и то, как некоторые, знающие Писание, не испытуют его, другие же, и не зная, и не вопрошая, дерзают своим разумом на сие умное внимание и притом еще и говорят, будто вниманием стоять и молитву творить должно в желательной части: «То бо, – глаголют, – есть среда чрева и сердца». Это есть первая и самоизвольная прелесть. Не только молитвы и внимания не следует в этой части действовать, но и самую ту теплоту, которая приходит от похотной части на сердце в час молитвы, ни в каком случае не принимать. Средою же чрева, по св. Феофилакту, называется самое то сердце, и она не при пупе, не посреди груди, но под левым сосцом имеет свое место. Ибо так распределяются три силы души: словесная в персях; яростная, или ревностная, в сердце; желательная же в чреслах при пупе, куда и диавол имеет удобный вход, по Иову, возмущая и разжигая ее, как пиявка и жабы в болотном озере, и имея пищей и наслаждением похотную сладость. Поэтому говорит Григорий Синаит: «Немалый труд постигнуть истину явственно и быть чисту от того, что противно благодати, ибо под видом истины диавол обычай имеет, особенно в новоначальных, показывать свою прелесть, преображает лукавое свое как бы в духовное: одно вместо другого изображая внутри естественных чресл, мечтательно преобразуя, как хочет, и вместо теплоты наводит свое жжение, вместо веселия приносит радость бессмысленную и сладость мокротную».'
      cn: 还有，令人惊奇和恐惧的是，有些熟知《圣经》的人，却不去考察它，而另一些人，既不了解也不询问，却敢于用自己的理性去从事这种灵性注意，并且还说，心神当专注于并作祷告于欲望部分：「因为，他们说，那是腹部和心脏的中间。」这是第一种也是自愿的妄想。不仅不应在这一部分进行祷告和注意，而且在祷告时，从情欲部分涌向心脏的那种温暖，也绝不能接受。至于腹部的中间，根据圣提奥非拉克（Theophylact）的说法，它指的是心脏本身，它不在肚脐旁，也不在胸部中央，而是在左乳头下方。因为灵魂的三种能力是这样分布的：理性的在胸中；激情的，或热心的，在心中；而欲望的则在肚脐旁的腰部，按照约伯的说法，魔鬼在那里有便捷的入口，它搅扰并煽动它，如同沼泽湖中的水蛭和蟾蜍，以情欲的甘甜为食物和享乐。因此，格里高利·西奈特（Gregory Sinait）说：「清楚地领悟真理，并洁净自己免于那与恩典相悖的事物，并非易事，因为魔鬼惯于披着真理的外衣，尤其是在初学者身上，展现其妄想，将其邪恶伪装成属灵的：在自然的腰部内部描绘一物取代另一物，随心所欲地幻觉式地改变，并以其灼烧取代温暖，以无意义的喜乐和湿润的甘甜取代欢愉。」
  - type: paragraph
    text:
      ru: 'Полезно же, думается, и о том знать делателю, что жжение, или теплота, исходит от чресл к сердцу иногда сама по себе, естественно, помимо помыслов блудных. И это не от прелести, а от естества, говорит св. Каллист Патриарх. Если же кто принимает и это за проявление благодати, а не естества, то это, несомненно, есть прелесть. Каково же все это есть, подвизающемуся не следует обрашать внимания, но отвергать. Иногда же диавол, смешавши свое жжение с похотию нашею, вовлекает ум в блудные помыслы. И это есть несомненная прелесть. Если же все тело растепливается и ум остается чистым и бесстрастным и, как бы прилепленый, покрывается во глубине сердца, начиная и кончая молитву в сердце, – это есть несомненно от благодати, а не от прелести. Бывает же некоторым подвижникам немалым препятствием к этому священному деланию и телесная немощь: не будучи в силах выдержать в должной мере и весе сверхъестественных трудов и постов, каковые имели святые, они полагают, что невозможно им помимо этого начать подвиг умного делания. И таковую их ошибку приводя в должную меру,Василий Великийтак учит: «Воздержание, – говорит он, – каждому по его телесной силе определяется. И потому, я думаю, прекрасно наблюдать за тем, чтобы, разрушивши безмерным воздержанием телесную силу, не сделать тело слабым и не способным к добрым делам. Ибо следует иметь тело деятельным, не расслабленным никакою безмерностью. Если бы хорошо было человеку быть расслабленным телом и лежать как бы мертвым, едва дышущим, то таковыми, конечно, с самого начала нас и сотворил бы Бог. Если же Он не сотворил нас такими, то погрешают те, кто добре сотворенное не хранят таким, как оно есть. И потому об одном подвижник благочестия пусть заботится: не злоба ли, по причине лености, нашла себе место в душе, не ослабло ли в чем-либо трезвение и прилежное восхождение мысли к Богу, не омрачилось ли как-либо освящение духовное и происходящее от него просвещение души? Ибо если сказанное доброе возрастает, то и телесные страсти не будут иметь времени восставать, когда душа упражняется в горнем и не оставляет телу времени обуреваться страстьми. При таком устроении души принимающий пищу ничем не различается от невкушающего: и не только пост, но и всегдашнее неядение таковой выполнил и имеет похвалу за особенное попечение о теле, ибо умеренное житие не распаляет похоти». И св. Исаак, согласно с этим, сказал: «Если понудишь немощное тело свыше силы его, то причиняешь душе смущение на смущение». И св.Иоанн Лествичникговорит: «Видел я враждебницу сию (утробу) упокоеваемую – и подающую уму бодрость». И еще: «Видел ее изнуряемую постом – и производящую истечение, дабы мы надеялись не на себя, но на Бога живого». С этим согласуется и история, о которой прп. Никон вспоминает, что в наши уже времена был найден в пустыне один старец, не видевший человека тридцать лет, не евший хлеба, кроме кореньев, и исповедавший, что все это время был обуреваем блудным бесом. И рассудили отцы, что не гордость, не пища были причиной такой брани, а то обстоятельство, что не научен был старец умному трезвению и противоборству вражеским искушениям. По этому поводу сказал св. Максим: «Дай телу твоему по силе его и весь подвиг твой обрати на умное делание». И еще св. Диадох говорит: «Пост имеет похвалу по себе, а не по Богу, ибо он есть орудие благоустрояющее к целомудрию желающих». Посему подвижникам благочестия не подобает высокоумствовать о нем, но в вере Божией ожидать конца нашей мысли. Ибо и мастера какого-либо искусства не от орудия хвалятся добрым окончанием дела, но ожидают исполнения, и оно уже обнаруживает достоинство искусства.'
      cn: '笔者认为，苦修者知晓以下之事亦属有益：有时，一股灼热或暖意会自然而然地，从腰间升腾至心间，并非出于淫秽思想。圣卡利斯特牧首言，这并非出于妄念，而是出于人的本性。倘若有人竟将其视为恩典的显现，而非本性的流露，那么这无疑是妄念。无论这一切是何等境况，苦修者都不应予以关注，而应将其摒弃。有时，魔鬼会将它自己的灼热与我们的贪欲混杂，将心神引入淫秽的思想。这无疑是妄念。倘若全身皆感温暖，而心神依然纯洁无欲，并且，仿佛被吸引般，沉浸于心底深处，始于心，终于心，进行祷告——这无疑是源于恩典，而非妄念。


        然而，对某些苦修者而言，肉体上的软弱却成为这项神圣修持的巨大障碍：他们无力以圣人所持的适当程度和分量，承受超乎寻常的劳苦和禁食，便认为，若无此等，他们便无法开始心思修持的苦行。为纠正此等错误，大圣巴西略教导说：「节制，」他言，「当根据各人肉体的力量而定。故而，我认为，当密切留意，勿要因无度的节制而摧毁肉体的力量，致使身体虚弱无力，无法行善。因为身体当保持活跃，不应因任何无度而松弛。倘若人身体松弛，如同死尸般躺卧，仅存微弱气息，乃是美善之事，那么，上帝必定从一开始便如此创造了我们。倘若祂并非如此创造我们，那么那些未能将美善受造之物保持原样的人，便犯了错。故而，敬虔的苦修者只当关注一件事：邪恶是否因懒惰而在灵魂中滋生，清醒警醒和思想殷勤向上帝的提升是否有所减弱，属灵的圣化和由此而来的灵魂启迪是否有所蒙蔽？因为倘若上述美善得以增长，那么肉体的私欲便无暇兴起，因灵魂在属天的事务中操练，不给身体留下被情欲困扰的时间。在此等灵魂状态下，进食者与不进食者并无二致：这样的人不仅完成了禁食，甚至可以说完成了恒常的不食，并因对身体的特别照护而获得赞扬，因为节制的生活不会煽动情欲。」


        圣以撒也与此相符地说道：「倘若你强迫软弱的身体超出其所能，你便会给灵魂带来重重困扰。」圣约翰·列维特尼克则言：「我曾见此仇敌（胃腹）得安息——却赋予心神警醒。」又言：「我曾见它因禁食而疲惫——却导致放纵，使我们不依靠自己，而是依靠永生的上帝。」普世圣尼孔忆及的一则故事亦与此相符：在我们这个时代，一位老者被发现在旷野中，他三十年未曾见人，除根茎外不食任何面包，却忏悔说，他一直被淫秽之魔所困扰。诸位教父裁定，并非骄傲，亦非食物是此等争战的根源，而是这位老者未曾习得心思上的清醒警醒和对抗仇敌诱惑的方法。鉴于此，圣马克西姆说：「当按其能力供养你的身体，并将你所有的苦修转向心思修持。」


        圣迪亚多赫又说：「禁食本身值得赞扬，而非在上帝面前受赞扬，因为它是一个有益的工具，引导渴望贞洁之人。」因此，敬虔的苦修者不应为此自高自大，而当在上帝的信仰中，静候我们思想的终结。因为即使是任何技艺的工匠，也并非因工具而夸耀工作的圆满完成，而是等待其成果的实现，唯有成果方能彰显技艺的价值。'
  - type: paragraph
    text:
      ru: 'Имея таковое установление о принятии пищи, не все усердие и надежду возлагай на один пост, но в меру и по силе своей постясь, стремись к умному деланию. И если имеешь в себе достаточно силы питаться хлебом и водой, добро есть. Ибо не укрепляют, сказано, прочие снеди тела так, как хлеб и вода. Однако не думай, что совершаешь добродетель тако постяся, но ожидай от поста приобретения целомудрия. И такой пост будет разумным, сказал св. Дорофей. Если же ты немощен, повелевает тебе св. Григорий Синаит, если хочешь иметь спасение, есть литр хлеба и воды или вина пить в день три или четыре чаши и от прочих снедей, какие прилучатся, вкусить от всех понемногу, не допуская насыщения, дабы вкушением от всего ты возмог избегнуть кичения и вместе с тем не возгнушался весьма добрых Божиих творений, за все благодаря Бога. Таково рассуждение благоразумных. Если же, вкушая всех случающихся брашен и пия мало вина, сомневаешься в твоем спасении, это есть неверие и немощь помысла. Мера принятия пищи безгрешно и по Богу на три чина полагается: воздержание, доволь и сытость. Воздержание есть когда при еде чувствуется еще алкание; доволь – когда нет ни алкания, ни отягощения; сытость – когда есть малое отягощение. А по насыщении и еще есть, дверь есть чревобесия, коею входит блуд. Ты же, сия рассмотрев, по силе твоей избери приличное, не преступая установленного: совершенным же свойственно и то, по апостолу, чтобы и насыщаться, и алкать, и во всем мощным быть.'
      cn: 既然有此关于饮食的规定，就不要将所有的热忱与希望都寄托于禁食本身，而是要量力而行，根据自己的能力禁食，并力求达到悟性修持。如果你有足够的力量仅以面包和水维生，那是好的。因为，有言道，其他食物并不能像面包和水那样强健身体。然而，不要以为如此禁食就是行了美德，而要期望通过禁食获得贞洁。圣多萝西（Dorotheus）说，如此的禁食方为明智的。但如果你身体虚弱，圣格里高利·西乃山人（Gregory of Sinai）命令你，如果你渴望获得救恩，每天吃一升面包，喝水或三到四杯葡萄酒，并从所有偶然遇到的其他食物中，每样少许品尝，不至于饱足，以便通过品尝所有食物，你能够避免自负，同时不厌弃上帝极其美好的创造物，并为此一切感谢上帝。这便是明智之人的见解。如果你品尝所有偶然遇见的食物，并饮少量葡萄酒，却怀疑你的救恩，这就是不信和意念的软弱。按照上帝旨意无罪地摄取食物的量可分为三等：节制、适度和饱足。节制是指进食时仍感到饥饿；适度是指既不饥饿也不沉重；饱足是指稍感沉重。若已饱足却仍进食，那便是贪食的门，淫欲由此而入。你啊，审慎思考这些后，按照你的能力选择合适的，不逾越既定的规定：而对完全之人而言，照使徒所说，能够饱足，也能忍饥，并能凡事都有能力。
  - type: paragraph
    text:
      ru: Все это тебе, о ревнитель умного внимания, от самых подлинных в великих и святых отцов показано, и в чем состоит мера воздержания и рассудительного поста, и как преуспевать во внимании.
      cn: 所有这一切都向你，哦，心智专注的殷勤者啊，已由最真切的伟大圣洁教父们揭示，节制与审慎斋戒的尺度如何，以及如何在心智专注中精进。
