- type: heading1
  text:
    ru: О воздержании от брашен[*], возбраненных монахам[**]
    cn: 论修士所禁饮食的斋戒[*][**]
  children:
  - type: heading2
    text:
      ru: Предисловие. О том, по какой причине собраны из Священного Писания эти ответы для разрешения вопросов о воздержании от брашен, возбраненных монашескому добровольному обещанию
      cn: 序言. 关于为何从圣经中汇集这些答复，以解答关于禁戒修道者自愿誓言所禁止之食物的疑问。
    children:
    - type: paragraph
      text:
        ru: Много нас говорящих, а творящих мало, но никто не должен утаивать слово Божие или удаляться от него по своему нерадению, а должно, исповедуя свою немощь, не скрывать Божией истины, чтобы не быть нам виновными, вместе с преступлением заповедей, и в перетолковании слова Божия, как сказал святой Максим[1]. Но поскольку и я, унылый и негодный, сподобился прочесть с прилежным усердием и несомненной верой Священное Писание Ветхого и Нового Завета, а также учительные и отеческие книги и научиться от их многих полезных слов, добрых же дел не имею, то обличает меня слово Господне:«Врачу, исцелися сам»(Лк.4:23). С другой стороны, ужасает меня участь того раба, который скрыл талант и лишен всякого оправдания, не только потому, что сам был праздным и бездельным, но и в особенности потому, что не передал слова другим слушающим, как считает и божественный Максим.
        cn: 我们中言说者甚多，行道者甚少，但无人应隐藏上帝的圣言，或因自己的怠惰而远离它。相反，我们当承认自己的软弱，不隐藏上帝的真理，以免我们除了违犯诫命外，又在曲解上帝的圣言上犯下罪过，正如圣马克西姆[1]所言。然而，既然我，这忧郁且无用之人，得蒙准许以勤勉的热忱和无疑的信仰阅读了旧约与新约圣经，以及教训性书籍和教父言行录，并从其中学习到许多有益的言语，却无有善行，那么，上主的话就谴责我：「医生，治好你自己吧」（路加福音 4:23）。另一方面，那隐藏了才干，且被剥夺了一切辩解的仆人的结局也令我惊惧，这不仅因为他自己懒惰且无所事事，更特别的是因为他没有将圣言传给其他听者，正如神圣的马克西姆所认为的。
    - type: paragraph
      text:
        ru: 'Видел я, что некие из моей братии, которым при монашеском постриге я, недостойный, был наречен восприемником, во время путешествия по иным землям, бывают убеждаемы некоторыми людьми, что якобы вкушение мяса монахами – не грех и не нарушение обета. «Ибо, – говорят такие, – есть или не есть мяса – это в воле каждого, и это не закон и не правило нерушимое. Некоторые из древних отцов ели мясо, некоторые же – нет, однако это было в их воле, ибо апостол сказал:«Ядый не ядущаго да не укоряет: и неядыйядущаго да не осуждает»(Рим.14:3)» и прочее. Некие же, во всех этих словах находя оправдание своему неведению, лишенному всякого прощения, начинают легкомысленно относиться к вкушению мяса.'
        cn: 我曾见到，我的一些弟兄，他们在修道受戒时，我不配之人曾是他们的灵父，在他们游历他乡之时，被一些人说服，他们声称修道者吃肉——不是罪，也不是违背誓愿。「因为，」这些人说，「吃肉与否——这在乎各人的意愿，这并非律法，也非不可打破的规矩。有些古代教父吃肉，有些则不吃，然而这在乎他们的意愿，因为使徒曾说：『吃的人不可轻看那不吃的人，不吃的人也不可论断那吃的人』（罗马书 14:3）」等等。而另一些人，在所有这些话语中，为他们那无可宽恕的无知找到借口，便开始轻率地对待吃肉之事。
    - type: paragraph
      text:
        ru: 'Объявшее меня многое недоумение об этом привело к тщательнейшему исследованию и, с Божией помощью, я нашел очень полезную древнюю историю в Чиновной книге[2]преподобного Никона Черногорца. Этот святой учитель, прочтя послание кир Петра, Патриарха Антиохийского, разрешающего употребление мяса монахам, никак не потерпел этого, но по божественной ревности, словно Финеес (см.Чис.25:7), пронзая это патриаршее писание мечом обличения, будто духовным копьем, объявил о прелести и выступил против порока, говоря: «Патриарх, по своей страстной воле, вверг в монашество страстное учение и привел в оправдание этому постнические правилаВасилия Великого. Но об этом не до́лжно молчать, ибо что значит эта древность теперь, когда монахам вовсе запрещено вкушение мяса? То было в начале христианства, ныне же недействительно», и прочее, о чем после будет сказано.'
        cn: 对此我心中产生的许多疑惑，促使我进行最细致的探究，并且，在上帝的帮助下，我找到了一段非常有益的古代记载，收录于可敬的黑山者尼孔的《秩制书》[2]中。这位圣洁的导师，在读了安提约基亚宗主教基尔·彼得允许修士吃肉的函件后，绝不容忍此事，而是出于神圣的义愤，如同非尼哈一般（参民数记 25:7），用责备的剑，仿佛属灵的长矛，刺穿这封宗主教的书信，宣告这是迷惑，并起来反对这罪恶，说道：「宗主教出于自己的情欲之意，将情欲的教义引入了修士制度，并以圣瓦西里大帝的斋戒规条作为此事（的）辩解。然而对此不应当保持沉默，因为如今这古老的规矩有何意义呢，当修士们被完全禁止吃肉的时候？那是在基督教初期的事情，如今已不奏效了。」等等，关于这些内容之后还会提及。
    - type: paragraph
      text:
        ru: В 1749 году я спрашивал об этом всеблаженнейшего Патриарха Антиохийского кир Сильвестра, при светлейшем лице Его величества господина Константина Николаевича, князя Угровлахийского. И тогда Его святительство дал худости моей благословение говорить и писать против тех, кто учит монахов вкушению мяса. Основываясь на этом, я дерзнул, хотя и лишен всякого дерзновения перед Богом, собрать из Священного Писания и из книг учителей церковных и из типиков великих монастырей, которые Святая СоборнаяЦерковьпринимает и которых придерживается, доказательства того, что ныне вовсе не подобает монахам, оглядываясь на древность, есть мясо. И не для того, чтобы обличать или осуждать других, собрал я это, но только для того, чтобы поучать братьев моих, уверяя, и укрепляя, и отводя их от такого попрания совести и боясь праведного суда и отмщения Божия, постигшего того древнего архиерея Илия из-за сыновей его Офни и Финееса (см.1Цар.1–4).
        cn: 1749年，在乌格罗瓦拉几亚公爵、殿下康斯坦丁·尼古拉耶维奇阁下面前，我曾就此询问全福的安提阿牧首基尔·西尔维斯特。那时，他的圣职赐予我这卑微之人祝福，去言说和著述，反对那些教导修士吃肉之人。基于此，我竟敢，尽管我在上帝面前毫无坦然，从圣经、教会教父们的著作以及圣公教会所接纳并持守的大修道院的规条中，收集证据，证明如今修士们，回溯古时，根本不应吃肉。我收集这些，并非为了指摘或定罪他人，而仅仅是为了教导我的弟兄们，藉着确证、坚固他们，并使他们远离此等良心的践踏，并且因畏惧那曾临到古代大祭司以利及其子何弗尼和非尼哈的公义审判和上帝的报应（参见撒母耳记上 1-4章）。
    - type: paragraph
      text:
        ru: Недостойный старец, Василий схимонах
        cn: 不配的长老，瓦西里大圣服僧
  - type: heading2
    text:
      ru: 'Исследование. О воздержании и невкушении монахами мяса: откуда пошло этому начало?'
      cn: 研究。关于修士们对肉食的节制与不食：其源自何处？
    children:
    - type: paragraph
      text:
        ru: 'Божественный апостол назвал все ветхозаветное тенью будущего и умопостигаемого (см.Кол.2:17;Евр.10:1), как говорит и священнейшийГригорий Богослов: «потому и три этих города, созданные людьми израильскими в Египте: Пифон, Рамессин и Он, прообразовали три главнейшие страсти: сластолюбие, сребролюбие и тщеславие, первую из которых, то есть сластолюбие, словно некую плату за свою работу, израильтяне вынесли с собой из Египта и из-за нее много раз, более же побуждаемые ею, пытались снова возвратиться в Египет, как показывается во второй и четвертой книгах Моисеевых, называемых Исход и Числа».'
        cn: 神圣的使徒将旧约的一切称为未来与可知之事的影儿（参见歌罗西书 2:17，希伯来书 10:1），正如至圣者格里高利神学家所言：「因此这三个由以色列人在埃及建造的城市：比东、兰塞与安，预表了三种最主要的恶习：纵欲、贪财与虚荣，其中第一个，即纵欲，仿佛某种作为他们劳作的酬报，以色列人将之带出埃及，并因此多次，甚至更多次受其驱使，试图重返埃及，如摩西五经中的第二卷和第四卷所示，即出埃及记和民数记。」
    - type: paragraph
      text:
        ru: '«Ибо возроптал, – говорит Писание, –весь сонм сынов Израилевых на Моисея и Аарона, говоря: О, лучше бы мы умерли, пораженные Господом в земле Египетской, когда сидели над котлами мясными»(см.Исх.16:2–3). И еще:«и сев, плакали сыны Израилевы и говорили: кто накормит нас мясом, ибо душа наша иссохла, ничего, кроме манны, нет пред очами нашими. И сказал Моисей: откуда у меня мясо, чтобы дать всем этим людям, ибо они плачут предо мной, говоря: дай нам есть мяса. И повелел Бог Моисею сказать им: очиститесь к утру, и будете есть мясо, ибо вы плакали пред Господом, говоря: кто накормит нас мясом? Как хорошо было нам в Египте! И даст вам Господь есть мяса, пока не пойдет оно из ноздрей ваших, и станет вам мерзостно»(см.Чис.11:4–20).'
        cn: '「因为，照经上所说，以色列的全体子民都向摩西和亚伦发怨言，说：『啊，我们宁愿在埃及地被上主击杀而死，那时我们坐在肉锅旁边。』」（出埃及记 16:2-3）


          又说：「以色列子民就坐下哭泣，说：『谁能给我们肉吃呢？因为我们的心都枯干了，除了吗哪以外，我们眼前什么也没有。』摩西说：『我从哪里有肉给这所有的人吃呢？因为他们在我面前哭泣，说：给我们肉吃吧！』上帝吩咐摩西对他们说：『你们要洁净自己，到早晨，你们就有肉吃。因为你们在上主面前哭泣，说：谁能给我们肉吃呢？我们在埃及是何等好啊！上主必给你们肉吃，直到肉从你们的鼻孔中出来，使你们厌恶。』」（民数记 11:4-20）'
    - type: paragraph
      text:
        ru: И в исходе древних из Египта боговиднейшие отцы видят образ ухода монахов от мира и отречения от него, снедь же или пища, из семян и плодов земных приготовляемая для них, может иметь образ и совершенное подобие манны небесной. Как свыше от Бога была посылаема израильтянам манна, а не мясо, так и изначально всем людям даны были в снедь Самим Богом семена земные и плоды с деревьев, а не мясо, восхотев однажды которого и презрев небесную манну древние израильтяне умерли в пустыне:«Ибо еще, – сказано, –мясо было в зубах их, и Господь разгневался сильно на людей, и поразил Господь людей язвой весьма великой, и назвали то место «Гробы прихоти», ибо там погребли прихотливых людей»(см.Чис.11:33–34). «Чьи кости, – говорит Василий Великий, – пали в пустыне? Не взыскующих ли мясоядения? Ибо пока они довольствовались манной, побеждали египтян и проходили сквозь море, когда же вспомнили мясо и котлы, не увидели земли обетованной».
        cn: '最蒙神启的教父们在古以色列人出埃及时，视之为修士们脱离世界并弃绝世界的写照，而那为他们预备的，由地上种子和果实制成的食物，可以是天上吗哪的预像和完美类比。正如吗哪从上帝那里从天而降赐予以色列人，而非肉食，照样，起初上帝亲自赐予所有人类作食物的，是地上的种子和树上的果实，而非肉食。古以色列人曾一度渴求肉食并藐视天上的吗哪，因而死于旷野：


          「因为肉在他们牙齿之间，尚未嚼烂，上主就向百姓大发烈怒，且以极大的瘟疫击杀他们，那地方便名叫基博罗哈他瓦（即『贪欲之墓』），因为他们把那些贪食的人埋葬在那里。」（民数记 11:33-34）


          圣大巴西略说：「谁的骸骨倒毙在旷野？岂不是那些渴求肉食的人吗？因为当他们以吗哪为满足时，他们击败了埃及人，并走过了红海，然而当他们想起肉食和锅中的食物时，他们就未能见到那应许之地。」'
    - type: paragraph
      text:
        ru: 'Итак, находя здесь повод и причину, всем противоборствующим доброму преданию богодухновенных отцов наших о воздержании от мяса по монашескому добровольному обещанию представляем в ответ только одно: если некоторые из древних монахов и были причастны к мясоядению, то эти обычаи их так же принимал Бог, как и ветхозаконные кровавые жертвы. «Ибо явно, что изначально Бог не хотел установить им такие жертвы, но, снисходя немощи их и видя их неистовствующих и обуреваемых желанием жертв, попустил им», – сказал божественный Златоуст. Так и вкушение мяса: изначально не столько была на это воля Божия, сколько снисхождение и дело вынужденное. Потому это и отменено впоследствии богоносными отцами, что довольно и истинно будет показано ниже. Поскольку монашеское обещание ищет своего исконного бытия и бесстрастия, а не Ною явленного снисхождения, постольку до́лжно избирать пищу, данную Богом Адаму в раю, а не Ною после потопа. Ибо пища – первое свидетельство страха Божия и показывает любовь и благоговение монаха.'
        cn: 因此，在此寻得缘由和理由，对于一切反对我们受上帝启示的教父们关于按修道自愿誓愿而禁食肉类的美好传统的人，我们只给出这一个回应：如果一些古代的修士曾参与食肉，那么上帝接纳他们的这些习俗，就如同祂接纳旧约中的血祭一样。「因为显然，上帝最初并不想为他们设立这样的祭献，但祂出于对他们软弱的宽容，看到他们狂热且被献祭的欲望所驱动，就允许了他们。」神圣的金口圣徒如此说道。同样，食肉之事：最初并非是上帝的旨意，更多的是一种宽容和被迫之举。因此，这（食肉之举）后来被承载上帝的教父们废除了，这将在下文充分且真实地阐明。既然修道誓愿寻求其本源的存在与无情欲，而非向挪亚显明的宽容，那么就应当选择上帝在伊甸园赐予亚当的食物，而非在洪水后赐予挪亚的食物。因为食物是敬畏上帝的第一个明证，并且显明了修士的爱与虔敬。
    - type: paragraph
      text:
        ru: Вопрос:от кого монахи приняли обычай не есть мяса – ведь ему явно противился божественный апостол Павел, когда писал к Тимофею:«В последняя времена отступят нецыи от веры, внемлюще духовом лестчим и учением бесовским, в лицемерии лжесловесник, сожженных своею совестию, повелевающих удалятися от брашен, яже Бог сотвори в снедение верным и познавшим истину»(1Тим.4:1–3)?
        cn: 问题：修士们从何处习得了不食肉的习俗——因为神圣使徒保罗曾明确地反对它，当他致信提摩太时，写道：「在末后的日子里，必有些人离弃信仰，转而听从那迷惑人的灵和鬼魔的教训；那是出于说谎之人的伪善，他们的良心如同被热铁烙过一般，他们命令人禁戒食物，就是上帝所造，为要给那些信而又认识真理的人享用的。」（1提摩太福音 4:1-3）
    - type: paragraph
      text:
        ru: 'Ответ:Хотя и были еретики, называемые манихеи, енкратиты, евстафиане, маркиониты, сатурниане и присциллиане, которые называли нечистым мясо всех животных, вино и брак, однако нам ныне нет нужды иметь какое-либо сомнение обо всем этом, поскольку по благодати Христовой Святая Соборная Церковь, проклиная еретическую хулу о брашнах, почитает воздержание. Подобает же обращать внимание, как диавол, усматривая, что это его оружие совсем ослабело, берется за первые свои хитрости и брань, которыми низринул первозданного из рая и исходатайствовал ему осуждение на смерть. И об этом божественный Павел писал к филиппийцам не только чернилами и пером, но более слезами своими:«мнози, – сказал он, –ходят,ихжемногащиглаголахвам, ныне же и плача глаголю: враги креста Христова, имже бог чрево, и слава в студе их, иже земная мудрствуют»(см.Флп.3:18–19) и прочее. Толкуя это, божественный Златоуст говорит: «ничего нет столь недостойного и чуждого для христианина, как искать отрады и покоя. Владыка твой распялся, а ты пресыщаешься. Носи крест не просто, но сострадая крестным мукам Спасителя. Ибо всякий, кто друг пресыщению и здешнему упокоению, есть враг креста Христова. Плачет Павел о том, над чем смеются те, для кого, как он сказал, бог – чрево. Потому оно бог им, что они говорят: «будем есть и пить». Видишь ли, какое зло – пресыщение? Ибо иным бог – имение, этим же – чрево, и слава их – в сраме. И только ли о тех (об иудеях) так сказано, а находящиеся здесь избежали ли этого упрека и разве нет никого, повинного этому? Разве никто не имеет богом чрево и славой – срам? Хочу и очень хочу, чтобы ничего этого не было у нас, и хочу даже не видеть кого-нибудь виновным в сказанном, но боюсь, чтобы это не говорилось более о нас, чем о живущих тогда. Когда же кто-либо в пище и питии всю жизнь потратит на чрево, не уместно ли будет сказать и о нем, что бог ему – чрево и слава его – в сраме?»'
        cn: '答：

          虽然曾有异端者，被称为摩尼教徒、恩克拉提派、欧斯塔提派、马吉安派、撒图尼诺派和普利西利安派，他们称一切动物的肉、酒和婚姻为不洁，然而我们现今无需对此有任何疑虑，因着基督的恩典，圣而公之教会，咒诅关于食物的异端亵渎，并尊崇节制。然则，当留意魔鬼，眼见其此武器全然衰弱，便拾起其最初的诡计与争战，借此使始祖堕出乐园，并为他招致了死刑的宣判。神圣的保罗就此写信给腓立比人，不单是用墨水和笔，更是用他的眼泪：「有许多人行事为人，我屡次告诉你们，现在又流泪告诉你们，他们是基督十字架的仇敌。他们的神是自己的肚腹；他们的荣耀是自己的羞辱；他们所思想的是地上的事。」(腓立比书 3:18-19) 等等。神圣的金口圣徒诠释此言道：「基督徒莫过于寻求享乐与安逸，没有什么比这更不配、更陌生的了。你的主被钉在十字架上，而你却大吃大喝。你当背负十字架，不只是简单地背负，更是要与救主的十字架苦难一同受苦。因为凡是贪食和贪恋世上安逸之人，就是基督十字架的仇敌。保罗为那些以肚腹为神之人所嘲笑的事而哭泣，正如他所说。它之所以是他们的神，是因为他们说：『我们只管吃喝吧。』你看，贪食是何等邪恶？因为有人的神是钱财，而这些人的神则是肚腹，他们的荣耀在羞辱之中。难道这话只论及那些人（指犹太人），而我们这里的人就免受此责备，难道就没有人犯此罪吗？难道没有人以肚腹为神，以羞辱为荣耀吗？我愿，并且切切地愿我们中间没有这一切，我甚至愿没有人犯下所说的罪，但我恐怕这话更是对我们所说，甚于对当时的人所说。当有人终其一生将食物和饮品耗费在肚腹上，岂不是也适合说，他的神是肚腹，他的荣耀在羞辱之中吗？」'
    - type: paragraph
      text:
        ru: Потому нам, монахам, наиболее подобает избегать такой дерзости и бесстрашия перед Богом, о каковых прегрешениях мало заботясь, весь род латинский и лютеранский исследует вышнее и нижнее, писания и древние истории, пронырливым духом собирая слова и оправдания постоянному употреблению мяса, уподобляясь шершням и осам, которые, не умея собирать меда с цветов полевых или плодовых деревьев и растений, питаются мертвечиной плоти животных, правильнее же сказать, они, как жуки, рождающиеся в навозе, навозом и питаются. Вообще, каждому из нас, кому омерзителен такой нрав, нужно уподобляться пчелам, собирая из Святого Писания и житий преподобных отцов медоточные слова (как и пчелы с цветов – мед), могущие погасить похоть сластолюбивого духа и покорить нас в послушание Христу и преданию святых отцов наших, совершенно запрещающих монахам вкушение мяса.
        cn: 因此，我们这些修士，最应避免这等在上帝面前的僭妄与无畏。整个拉丁宗族和路德宗族，对这类过犯少有顾虑，探究上下，经书与古史，以狡黠之灵搜集言语与辩辞，为着恒常食肉，如同大黄蜂与黄蜂，它们不谙从田野花卉或果树植物上采蜜，却以动物的尸肉为食；更确切地说，它们如同生于粪中的甲虫，以粪为食。总之，我们各人中，凡厌恶这等习性者，都当效法蜜蜂，从《圣经》与诸位可敬教父的生平中采撷蜜言（一如蜜蜂从花朵中采蜜），足以熄灭贪爱宴乐之灵的私欲，并使我们顺服于基督以及我们圣教父的圣传，此圣传是全然禁止修士食肉的。
    - type: paragraph
      text:
        ru: Вопрос:Если Бог позволил праведному Ною есть мясо после потопа, ибо«всякое, – сказал Бог, –животное вам будет в пищу, и как зелень травную даю вам все»(Быт.9:3), то какой будет грех или какая добродетель монахам, вкушающим или не вкушающим мяса?
        cn: 问题：如果上帝允许义人挪亚在洪水之后吃肉，因为上帝说：「凡活着的动物，都可以作你们的食物；我将这一切，如同菜蔬一样，赐给你们了。」（创世记 9:3）那么，对于那些吃肉或不吃肉的修士来说，会有什么罪或有什么美德呢？
    - type: paragraph
      text:
        ru: Ответ:Не есть мяса до потопа было общим законом для всех людей, изначально данным Адаму Богом в раю.«Ибо вот, Я дал вам, – сказал Бог, –всякую траву семенную, сеющую семя, и всякое дерево, у которого в себе плод древесный, сеющий семя, это будет в пищу вам, и всем зверям земным, и всем птицам небесным, и всякому гаду, пресмыкающемуся по земле, который имеет в себе душу живую»(Быт.1:29–30).
        cn: '回答：在洪水之前不食肉，是所有人共同的律法，最初由上帝在乐园里赐予亚当的。


          「看哪，我已将凡结种子的各样菜蔬，和树上一切有核的果子，就是结种子的果子，都赐给你们作食物。又赐给地上一切的走兽，和空中一切的飞鸟，以及地上一切爬行的活物，凡有生命的，都可以作食物。」（创世记 1:29-30）'
    - type: paragraph
      text:
        ru: А то, что после потопа стали вкушать мясо, представляется скорее попущением Божиим и снисхождением к невоздержанию нашему, чем законом Божиим. «Ибо после потопа, – сказал Василий Великий, – позволено Богом Ною и после него всем людям есть мясо, не как нужное естеству нашему, но как снисхождение немощи нашей. Ибо ведал Господь, что люди жестоки, и попустил наслаждение всем. И по такому попущению и прочие животные начали есть мясо без боязни, восставая друг на друга. Возможно тем, кто желает, подражая жизни райской, и ныне руководить собой и направлять самих себя к этому житию, избегая наслаждения многими и различными яствами и употребляя в пищу плоды и семена древесные. Излишнее же, как ненужное, отвергнем, не потому что считаем это мерзким, ибо почитаем Создавшего, но как нежелательное из-за удобострастности плоти».
        cn: 至于洪水之后开始吃肉，与其说是上帝的律法，不如说是上帝的允许，以及对我们不节制的迁就。「因为洪水之后，」大巴西略说，「上帝允许挪亚和他之后的所有人吃肉，并非因为我们的本性需要，而是作为对我们软弱的迁就。因为上主知晓人是刚硬的，并允许（人们）享受一切。并且由于这样的允许，其他的动物也开始毫无畏惧地吃肉，彼此相残。那些愿意效法伊甸园生活的人，即使现在也可能管理自己，引导自己走向这种生活方式，避免享受许多不同的美食，并以果实和树木的种子为食。至于多余的，作为不必要之物，我们应摒弃，不是因为我们认为这可憎，因为我们敬重造物主，而是因为肉体易受情欲影响，而将其视为不合宜的。」
    - type: paragraph
      text:
        ru: Удивляться же здесь должно тому, как этот божественный иерарх в одном из постнических слов своих позволяет монахам обмакивать хлеб в жидкость, в которой варился небольшой кусок мяса, и есть для некоего услаждения. Здесь же, в слове на шестоднев, он запрещает вкушение мяса, называя его пищей, возбуждающей страсти, и всем, желающим подражать упомянутому райскому житию, повелевает питаться одними семенами и плодами земными, да и сам Василий Великий имел пищей хлеб и воду, по свидетельству божественного Григория Богослова. И отсюда познается, что даже во времена этого великого учителя некоторые из монахов не полностью воздерживались от мяса, так как это еще не было запрещено.
        cn: 而此处令人诧异的是，这位神圣的圣职长官，在他的一篇禁食讲道中，竟允许修士们将面包蘸入曾煮过一小块肉的汤汁中，并食用，以作某种享受。然而在此，在论六日创造的讲道中，他禁止食用肉类，称其为激发情欲的食物，并命令所有渴望效法上述乐园生活的人，只以地上的种子和果实为食。根据神圣的格里高利神学家的见证，甚至大圣瓦西里本人也以面包和水为食。由此可知，即使在这位伟大的导师时代，一些修士也并未完全戒绝肉食，因为当时尚未明令禁止。
    - type: paragraph
      text:
        ru: Когда же преподобный отец нашАнтоний Великий, первый пустынножитель, полностью отказался от вкушения мяса, как показывает само описание его жития, с тех пор начало распространяться среди всех монахов это доброе установление воздержания от мяса, как от пищи, которая возбуждает сладострастие и из-за которой пали кости древних израильтян в пустыне, и израильтяне не увидели Земли Обетованной. Ибо как тогда манна называлась хлебом ангельским, потому что сходила с небес, так и сейчас хлеб, а не мясо – пища ангельская, которая посылается многим святым свыше святыми ангелами.
        cn: 当我们的圣父大安东尼，第一位隐修士，完全禁绝了食肉，正如他生平的记载所表明的，从那时起，这一美好的禁绝肉食的规定，便开始在所有修士中流传开来，作为一种会激起肉欲的食物，并且由于这种食物，古以色列人的骸骨倒毙在旷野，而以色列人也没有看见应许之地。因为正如那时吗哪被称为天使的粮，因为它从天上降下，照样，如今乃是面包，而非肉食，才是天使的食物，这种食物由圣天使从上头赐给许多圣徒。
    - type: paragraph
      text:
        ru: После Великого Антония был преподобный Евфимий, после же него – Савва Освященный, имена которых положено воспоминать и в чине монашеского пострига, как установителей и исполнителей всего монашеского благочиния и обетов. Ибо они были первыми по Бозе учившими монахов воздержанию от мяса. Они видели, что древним была посылаема манна с неба, в новой же благодати[3]многим пустынножителям посылались вместо манны хлеб, вино и елей, а не мясо, иногда через ангелов, иногда через поднебесных птиц, а иногда и невидимой рукой Божественной. И особенно через то, что в пустыне Самим Жизнодавцем Христом предлагаемы были четырем и пяти тысячам человек хлеб и рыба, а не мясо, познали они волю Божию и предпочтение закона, данного Адаму в раю, и в типиках полностью запретили монахам вкушение мяса.
        cn: 在大安东尼之后是圣欧瑟弥，而在他之后，则是受祝圣的萨瓦，他们的名字理当在授修士戒的仪式中被追忆，作为所有修士虔诚生活和誓愿的创立者和践行者。因为他们是首批蒙上帝教导修士们节制肉食的人。他们看见，古时吗哪从天而降，然而在新的恩典[3]中，许多隐修者所得的不是吗哪，而是面包、酒和油，而不是肉，有时藉着天使，有时藉着天空的飞鸟，有时则藉着上帝那看不见的手。尤其藉着，在旷野中，生命赐予者基督亲自为四千和五千人预备的是面包和鱼，而不是肉，他们因此认识到上帝的旨意，以及上帝对在乐园中赐予亚当的律法的偏爱，并在规章中完全禁止修士们食用肉类。
    - type: paragraph
      text:
        ru: 'Вот о чем еще здесь нужно вспомнить: в житии преподобного Павла Фивейского написано, что, когда сидел он, беседуя с Великим Антонием, прилетел ворон, неся целый хлеб, и, положив перед ними, тихо отлетел, и сказал святой Павел Великому Антонию: «Вот уже шестьдесят лет, как я получаю полхлеба, ради же твоего прихода Христос Господь удвоил подаяние рабам Своим». Подобное же этому говорит о себе и Великий Онуфрий: «Бог, увидев алкание мое, повелел святому ангелу заботиться обо мне: приносить каждый день немного хлеба».'
        cn: 此处还需回顾：在底比斯的圣保罗的生平记载中写道，当他与大安东尼坐着交谈时，一只乌鸦飞来，衔着一整块面包，放在他们面前，然后悄然飞走，圣保罗对大安东尼说：「我领受半块面包已有六十年了，因为你的到来，基督上主便使祂仆人所得的供养加倍了。」大奥努弗里也如此谈及自己：「上帝，看到我的饥渴，便吩咐圣天使照管我：每天带来一点面包。」
    - type: paragraph
      text:
        ru: 'Из жития преподобных отцов наших Симеона и Иоанна: «Ввел Иоанн некоторого мужа в свою келию, и нашли они предложенную невидимой рукой Божией трапезу, необычную в пустыне, ибо это были чистые и теплые хлебы, и рыбы превосходные, и вино доброе».'
        cn: '选自我们荣福圣教父西缅和约翰的生平：


          「约翰领一位男子进入他的隐修室，他们便发现由上帝无形之手摆上的膳食，在旷野中非同寻常，因为那是洁净温热的饼，以及上好的鱼和佳美的酒。」'
    - type: paragraph
      text:
        ru: 'В житии преподобного Евфимия говорится: «Случилось, что пришли в обитель святого Евфимия паломники из Иерусалима, около четырехсот мужей, и старец, видя, что они голодны, сказал эконому: «Поставь этим людям еду». Он же отвечал: «Отче, келарь не имеет хлеба, чтобы накормить хотя бы десять человек, где же мы возьмем хлебов для стольких людей?» Святой же сказал: «Иди, и делай то, что я тебе повелеваю!» Когда же эконом пришел в место, где хранили хлеб, он не мог отворить дверей, ибо благословение Божие наполнило это место до верха хлебами. Когда же позвали нескольких братьев и сняли двери, посыпались хлебы оттуда, такое же благословение было и на вине и елее: сосуды внезапно наполнились». Так говорится о Великом Евфимии.'
        cn: 在圣以弗提米修士的生平中记载道：「恰逢有约四百名来自耶路撒冷的朝圣者来到圣以弗提米修士的隐修院，长老见他们饥饿，便对管家说：『给这些人预备食物。』管家答道：『父啊，管库的连喂饱十个人的面包都没有，我们又要到哪里去为如此多的人寻得面包呢？』圣者说：『去吧，照我吩咐你的去做！』管家来到存放面包的地方时，他无法打开门，因为上帝的赐福使这地方堆满了面包，直至满溢。当唤来几位修士弟兄，并卸下门时，面包便从里面倾泻而出，葡萄酒和油也同样蒙受了这样的赐福：容器突然满了。」圣传如此记载大圣以弗提米。
    - type: paragraph
      text:
        ru: Хотя и многое множество есть божественных отцов, живших как в уединении, так и в общежитии и принимавших посылаемую им от Бога пищу, кроме мяса, однако, краткости ради, невозможно здесь всё по порядку описывать. Одно только здесь мы показали, что Бог ни Сам, ни через святых ангелов или птиц небесных никогда в новой благодати не подавал рабам своим мяса, но только хлеб и рыбу, вино же и елей, которые по домостроительству вкусил и Сам Бог Слово по воскресении Своем из мертвых. Всё это уверяет нас в том, что не подобает нам, монахам, взирая на неких древних отцов, есть ныне мясо, так как Божие свидетельство о том, что нужно воздерживаться от мяса намного больше и достовернее, чем человеческое разрешение. В этом уверяя нас, Бог никогда не является посылающим рабам своим пищу мясную. Поэтому более до́лжно нам покоряться доброму преданию святых отцов, запрещающих монахам вкушение мяса, нежели тем, которые вкушают его и другим позволяют. Ибо и Сам Христос Господь, почитая закон о пище, данный в раю Адаму, насытил, как сказано, четыре тысячи мужей семью хлебами и малыми рыбами и потом пять тысяч, кроме жен и детей, пятью хлебами и двумя рыбами, хотя мог насытить их мясом птиц пернатых, как в древности непокорных евреев в пустыне. Потом же и Сам Он, по восстании Своем из гроба, являлся ученикам Своим, то одиннадцати, перед которыми ел рыбу и сотовый мед (см.Лк.24:42), то Симону Петру с прочими учениками на море Тивериадском, с которыми ел хлеб и рыбу печеную (см.Ин.21:13). Но нигде Он не является вкушающим мясо, лучше же сказать, в Священном Евангелии нигде об этом не упоминается. И видя, что евангелисты ничего не упоминают о мясе, показывая Христа Господа вкушающим только рыбу, хлеб и мед, веруем, что это, в указание совести нашей, не что иное, как только предпочтение закона о пище, данного в раю Адаму изначально, и это пример и предписание монахам употреблять такую пищу, а не мясо. Ибо всё богомужное житие Господа на земле и подвиги Его были примером и образцом для нас, чтобы мы последовали стопам Его (см.1Пет.2:21), ибо Он сказал:«Аще кто Мне служит, Мне да последует»(Ин.12:26).
        cn: 虽有许多神圣的教父，无论是在隐修中还是在修道院团体中生活，他们接受上帝赐予的食物，除了肉类，然而，为求简明，此处无法逐一详述。我们在此只指出一点，即上帝既没有亲自，也没有通过圣天使或天上的飞鸟，在新恩典中，从未赐予祂的仆人肉类，而只赐予了面包、鱼、葡萄酒和油，照着其救赎计划，上帝圣言自身在从死者中复活后也曾享用这些。这一切都使我们确信，我们这些修士不当效法某些古代教父，如今吃肉，因为上帝关于禁食肉类的见证远比人类的许可更为重大和可靠。在这一点上，上帝向我们保证，祂从未将肉食赐予祂的仆人。因此，我们更当顺服圣教父们的美好传承，他们禁止修士食用肉类，而非那些自己吃肉并允许他人吃肉的人。因为基督上主祂自己，尊崇在乐园中赐予亚当的饮食律法，曾如经上所说，用七个饼和几条小鱼喂饱了四千人，后来又用五个饼和两条鱼喂饱了五千人（不包括妇女和儿童），尽管祂本可以像古代在旷野中对待悖逆的犹太人一样，用飞禽的肉来喂饱他们。祂从坟墓中复活后，也曾向祂的门徒显现，向十一位门徒显现时，祂在他们面前吃了鱼和蜂巢蜜 (路加福音 24:42)，也曾向西门彼得和提比哩亚海边的其他门徒显现，与他们一同吃了饼和烤鱼 (约翰福音 21:13)。但祂从未显现为吃肉，更确切地说，在《圣福音书》中对此从未提及。看到福音书作者没有提及肉类，而只描绘基督上主吃鱼、饼和蜜，我们相信，这旨在指引我们的良心，无非是偏爱那最初在乐园中赐予亚当的饮食律法，这也是修士们食用此类食物而非肉类的榜样和指示。因为上主在世上神圣智慧的生活以及祂的苦修，都是为我们树立的榜样和典范，使我们追随祂的脚踪 (彼得前书 2:21)，因为祂曾说：「若有人服事我，就当跟随我。」 (约翰福音 12:26)。
    - type: paragraph
      text:
        ru: Вопрос:Если бы в воздержании от мяса или во вкушении его была какая-либо добродетель или грех для монахов, то неужели святые Вселенские Соборы не законоположили бы есть или не есть мяса монахам? Но если Соборы умалчивают об этом, то как можно всем узнать истину?
        cn: 问题：如果对于修士而言，禁食肉类或享用肉类存在任何美德或罪过，难道神圣的普世大公会议就不会制定关于修士是否可以食肉的法律吗？但如果大公会议对此保持沉默，那么所有人又怎能得知真相呢？
    - type: paragraph
      text:
        ru: 'Ответ:Вызывает великое удивление и исполнен крайней безрассудности этот вопрос. Если и в древнем законе иное был закон Божий, иное – предание старческое, иное же – произвольное обещание всякого отдельного человека, ибо сказано:«Муж или жена, ижеащеобещается зело обетом, еже очиститися чистотою Господу, да воздержится от вина и сикера, и оцта винна и оцта от сикера да не пиет, и, елика делаются от грозд винных, да не пиет, и гроздия свежаго и сухаго да не снест, вовсядни обета своего»(Чис.6:2–4) и еще:«Человек, ижеащеобещает обет Господу или закленется клятвою, не осквернавит словесе своего: вся, елика изыдут из уст его, да сотворит»(Чис.30:3), – то почему же и в новой благодати не принимаешь ты подобного этому? Ибо когда ты отрекаешься от мира и принимаешь по доброй воле все уставы и предания монашеского жития, то не добровольное ли это обещание? Не думай же, что святые Соборы, умалчивая о воздержании монахов от мяса, дают повод монахам в их добровольных обетах презирать добрые предания богоносных отцов – да не будет этого, – ибо таким умолчанием они преимущественно утверждают эти предания. Если бы святые Соборы считали, что воздержание монахов от мяса противно уставу Святой Церкви, то, конечно же, запретили бы это и не приняли для Святой Церкви типики: Иерусалимский, Студийский и Афонский о качестве и количестве пищи, которыми все христиане, то есть монахи и мирские, руководствуются доныне. Если же ты соблазняешься молчанием святых Соборов, то понимай это так, что не только святые Соборы не полагают закона обещанию монашескому через правила и запрещение, но и Сам Господь наш Иисус Христос хотя и многие примеры и делания показал монашескому обещанию Богомужным Своим житием на земле, однако нигде не утверждает эти обеты угрозами и геенной, как прочие Свои священные заповеди, но что говорит? –«Аще кто хощет по Мне ити, да отвержется себе, и возмет крест свой, и последует Ми»(Лк.9:23). И тому юноше сказал:«Аще хощеши совершен быти, иди, продаждь имение твое, и даждь нищим, и гряди вслед Мене»(Мф.19:21). Зачем же монахам требовать закона и зачем законополагать это святым Соборам, если добровольное монашеское обещание по Богу само есть им закон и правило? Твердость же обетов узаконена Богом еще в Ветхом Завете.'
        cn: '答：这个问题令人非常惊讶，并且充满了极度的鲁莽。倘若在古律中，既有上帝的律法，又有长老的传统，另有每个人的自愿承诺，因为经上说：「无论男女，若发誓愿，要为上主分别为圣，就当禁戒酒和浓酒；不可喝葡萄酒醋和浓酒醋，也不可喝任何以葡萄酿造的饮品；凡他许愿的日子，不可吃新鲜或干的葡萄。（民数记 6:2-4）」又说：「人若向上主许愿，或起誓，就不可背弃他的话。凡从他口中所出的，他都当照行。（民数记 30:3）」——那么为何在新的恩典中，你却不接纳类似这样的呢？


          诚然，当你弃绝世界，甘愿接受修道生活的全部规章和传统时，这不正是自愿的承诺吗？那么，切勿以为圣大公会议缄默不提修士禁食肉类之事，便是给予修士们在其自愿承诺中蔑视蒙受上帝启示的教父们之美好传统的借口——绝无此事——因为他们以这样的缄默，反而更主要地肯定了这些传统。倘若圣大公会议认为修士禁食肉类违背圣教会的规章，那么，他们当然会禁止此事，并且不会为圣教会采纳耶路撒冷、斯图狄特和阿索斯的礼仪章程，这些关于食物种类和分量的章程，所有基督徒，即修士和平信徒，至今仍以此为指导。


          若你因圣大公会议的缄默而感到困扰，那么请这样理解：圣大公会议不仅没有通过规章和禁令为修道誓愿立法，就连我们主耶稣基督本人，祂虽以祂在世的神人生活，为修道誓愿展现了许多榜样和行止，然而祂却未曾像祂其他神圣的诫命那样，以威胁和地狱来确立这些誓愿，祂却说了什么呢？——「阿谁若要跟从我，就当舍己，背起他的十字架，来跟从我。（路加福音 9:23）」祂对那个青年人说：「若你愿为全备，就去变卖你所有的，施舍给穷人，然后来跟从我。（马太福音 19:21）」那么，修士们为何要寻求律法呢？圣大公会议又为何要为此立法呢？倘若按着上帝之意的自愿修道承诺，本身就已是他们的律法和规章？誓愿的坚定性，早在旧约中就已蒙上帝立法确立了。'
    - type: paragraph
      text:
        ru: Вопрос:Но мы говорим не обо всем обете монашеском, а только об одном воздержании от мяса, которое от апостольских времен и до времени Василия Великого многие монахи вкушали без всякого осуждения. Почему же ныне это стало соблазном?
        cn: 问题：但我们所谈论的并非全部的修士誓愿，而仅仅是关于禁食肉类这一项，在使徒时代直至大圣瓦西里时期，许多修士都食用肉类，且未受到任何谴责。为何如今这却成了绊脚石？
    - type: paragraph
      text:
        ru: 'Ответ:На это уже довольно было сказано, что не только богоносные отцы отвергли вкушение монахами мяса, как пищи, удобно вызывающей страсти, но прежде всего и Сам Господь был примером и образцом этому, ибо, показывая Свое неблаговоление к вкушению мяса, никогда не посылал рабам Своим мяса, но только хлеб и елей, иногда же рыбу и вино, такую же пищу и Сам Он промыслительно вкушал после Своего Воскресения. И множеству народа повелел предложить только хлеб и рыбу, а не мясо. А в том, что некоторым из древних незазорно было вкушать мясо, видится не что иное, как то, что еще не было определено воздержание от мяса, да и не только этого не было, но и сам чин монашеский не пришел еще в полную свою красоту и совершенство. Святой Симеон, архиепископ Солунский, сказал: «И это неудивительно, ибо самое церковное благочиние со всеми священнодействиями даже до самого Седьмого Вселенского Собора, мало-помалу принимая благочестивое предание, пришло в совершенство, а не сразу изначала всё так было. Так как кому-либо невозможно, и даже не благочестиво отклонять или презирать что-либо из писанного или неписанного Церковного Предания с тем оправданием и под тем предлогом, что не все это приняло начало и совершенство от святых апостолов, то не праведно и не богоугодно, когда кто-либо, оправдываясь первым, кажущимся несовершенным монашеским уставом и определением, вкушает чуждую монашескому образу и обету пищу из мяса».'
        cn: '回答：

          对此已经说得够多了，不仅蒙受上帝的父老们拒绝了修士们食用肉类，认为肉类是容易引发情欲的食物，但最重要的是，主上帝亲自为此树立了榜样和楷模，因为祂藉着表明自己不喜悦食用肉类，从未给祂的仆人送去肉类，而只有面包和油，有时是鱼和酒，祂自己复活后也曾蒙上帝的安排食用同样的食物。祂也曾吩咐众人只提供面包和鱼，而不是肉。


          至于古时一些人食用肉类并无不妥之处，则无非是那时尚未明确规定戒食肉类，不仅如此，连修士的品级也尚未达到其完全的美丽与完善。帖撒罗尼迦的圣西美翁大主教曾说：「这并不令人称奇，因为教会的规范及其所有的圣事，甚至直到第七次大公会议，都是一点一滴地接受虔敬的圣传，才得以完善，并非一开始就如此。既然任何人都不可能，甚至是不虔敬的，以并非所有这些都始于并完善于圣使徒的理由和借口，拒绝或蔑视任何成文或不成文的教会圣传，那么，任何人以早期看似不完善的修士规章和规定为由，食用与修士生活方式和誓愿不符的肉类食物，都是不正义且不蒙上帝喜悦的。」'
    - type: paragraph
      text:
        ru: 'В житии преподобного Александра, учителя обители «Неусыпающих», говорится: «Равул, градоначальник, последовал совету преподобного Александра и, встав утром, взял с собой множество домашних и друзей, и шли они по непроходимой пустыне весь день, до одиннадцатого часа[4], и увидели некоторого поселянина, ведущего нагруженный скот, на котором были хлебы чистые и теплые и иная пища – садовые и огородные плоды, и спросили его: Откуда ты и кто послал тебя сюда? Он же сказал: Господин мой послал меня к вам. И в тот же миг стал невидим. Александр же сказал Равулу: Примите пищу и не будьте неверующими, но верующими (см.Ин.20:27). И снова узнал преподобный, что пришли к нему некоторые из граждан, желая узнать, откуда он берет пищу для множества братьев, будучи нищим, и сказал он одному брату при тех мужах: Пойди и приведи мужа, стоящего перед воротами с теплыми и чистыми хлебами. Когда же вошел этот муж, он спросил его перед всеми: Откуда ты пришел с этими хлебами? Он же отвечал: Когда я вынимал эти хлебы из печи, некий светлый юноша властно повелел мне нести их за ним и, доведя меня до ворот этой обители, сказал отдать хлебы, сам же стал невидим». И что скажут против этого вкушающие мясо? Не явно ли этим показано, что пища монашеская, среди которой нет мяса, посылаема Богом? И Великому Онуфрию, бывшему еще отроком, Христос Господь Своими руками дал чистый и теплый хлеб. Также и Сама Препетая Дева Богородица, любящая монашеское воздержание от мяса, беседуя с блаженным Досифеем лицом к лицу, дала ему эти три заповеди[5], говоря: «Постись, не ешь мяса и часто молись, и избавишься от муки».'
        cn: '在「不寐者」修道院的导师，可敬者亚历山大（Alexander）的生平记载中说：「城主拉武尔（Rabul）听从了可敬者亚历山大的建议，清晨起身，带上许多家人和朋友，他们在难以通行的旷野中走了一整天，直到第十一时辰[4]，他们看见一个农夫，正牵着驮有负重的牲畜，上面有洁净而温热的饼和其他食物——园蔬和菜果，便问他：你从哪里来，谁派你到这里？那人说：我的主派我来的。就在那一刻，他便隐形不见了。亚历山大对拉武尔说：收下食物吧，不要不信，总要信（参阅 约翰福音 20:27）。可敬者又得知，有几位市民来到他那里，想要知道他一个贫穷人如何为众弟兄取得食物，他便当着那些人的面对一个弟兄说：去，把站在门外，带着温热洁净饼的那个男子领进来。那男子进来后，他当着众人问他：你从哪里带来这些饼？那人回答说：当我把这些饼从烤炉里取出来的时候，一个光明的少年人强力吩咐我跟着他拿这些饼，他把我带到这座修道院的门前，吩咐我把饼交出来，他自己就隐形不见了。」那些吃肉的人对此有何话说呢？这岂不是清楚表明，没有肉食的修道者膳食是上帝所赐的吗？


          当伟大的奥努弗里（Onuphrius）还是个孩童时，基督上主曾亲手赐给他洁净而温热的饼。同样，受赞颂的童贞圣母，那喜爱修道者戒绝肉食的，与蒙福者多西斐（Dositheus）面对面交谈时，曾赐给他这三条诫命[5]，说：「禁食，不要吃肉，并常常祷告，你就会免除苦难。」'
    - type: paragraph
      text:
        ru: Вопрос:В древней Церкви многие из монахов, вкушавшие мясо, не явились ли постниками и более угодившими Богу, чем нынешние, не вкушающие мяса?
        cn: 问题： 在早期教会中，许多曾食肉的修士，难道不是苦修者，并且比如今不食肉者更蒙上帝悦纳吗？
    - type: paragraph
      text:
        ru: 'Ответ:Хорошо сказал божественный апостол:«Греха не знах, точию законом, вину же прием грех заповедию, содела во мне всяку похоть. Пришедшей бо заповеди, грех убо оживе, аз же умрох»(Рим.7:7–10). Также говорит и Господь:«Аще не бых пришел и глаголал им, греха не быша имели»(Ин.15:22). Постники и воздержники в древней Церкви, поскольку не имели предания о качестве пищи, не были виновны в преступлении доброго и благочестивого установления богоносных отцов: Антония, Евфимия, Саввы и прочих. Ныне же монахи, дерзающие, преступая предание, есть мясо, не тем же ли судом осудятся и ответят перед Богом, как сказано об Израиле:«Еще мяса бяху в зубех их, и Господь порази их язвою великою зело, и прозвася имя месту тому гробы похотения: яко тамо погребоша людий похотевших»(Чис.11:33–34). Но и нам, слышащим это, подобает весьма бояться того, что мы, имея установленную святыми отцами монашескую пищу, как и древние – манну от Бога, гнушаемся ее, увлекаясь похотением мяса так же, как и те, чьи кости пали в пустыне. Не можем мы во всем уподобляться древней Церкви, в которой, опасаясь неверных, священники иногда совершали литургию вечером и ночью, причащая Святейших Таин вкушавших пищу в тот день, и Святое Крещение откладывали до тридцатилетнего возраста, и диаконам разрешали жениться после хиротонии, и Святейшие Тайны преподавали, влагая их всем причащающимся прямо в руки.'
        cn: '回答：神圣的使徒说得好：「非因律法，我就不知何为罪；但我藉着诫命得了罪的机会，在我里面生出各样的贪欲。因为诫命来到的时候，罪就活了，我却死了。」（罗马书 7:7-10）上主也说：「我若没有来，也没有对他们说话，他们就没有罪了。」（约翰福音 15:22）


          初期教会的禁食者和节制者，由于他们没有关于食物性质的传统，所以他们没有犯下违反负神的教父们——安东尼、欧提米乌斯、萨瓦及其他教父——所定立的良善和虔敬之规条的罪过。然而今日，那些胆敢违背传统吃肉的修士们，难道不会被同样的审判所定罪，并向上帝交账吗？正如论及以色列时所说：「肉尚在他们牙齿之间，上主就以极其严重的瘟疫击打他们，那地方因此得名为『贪欲之墓』，因为他们在那里埋葬了那些贪欲之人。」（民数记 11:33-34）但我们这些听到此事的人，也应当极其恐惧，因为我们拥有圣教父们所制定的修士食物，如同古人从上帝那里得到的吗哪一样，我们却厌弃它，被肉食的贪欲所吸引，就像那些骸骨倒毙在旷野的人一样。


          我们不能在所有方面都效法初期教会，在其中，司祭有时因为惧怕不信者，而在晚上或夜间举行圣礼，并将圣奥迹分施给当日已进食的人；圣洗礼会推迟到三十岁；辅祭在祝圣后被允许结婚；并将圣奥迹直接放在所有领受圣餐者的手中。'
    - type: paragraph
      text:
        ru: Если эти и многие другие древние обычаи, так же как и вкушение мяса монахами, отложены, неужели благовременно почитающим без различия всё древнее, принимать вместе с вкушением мяса и все эти оставленные обычаи? Как же нам сравниться с древними отцами, которые вкушали мясо со столь великим воздержанием и отсечением похоти, с каким мы ныне не вкушаем и неуслаждающей пищи, раболепствуя чреву, как богу, служа ему и желая приносить ему жертвы сластолюбия и невоздержания и без вкушения мяса? Если же и без мяса, скудной пищей мы задумываем совершать сластолюбивое служение чреву, то во что вменим сластолюбивый наш нрав и рабство чреву, когда попустим себе, по желанию нашему, вкушать естественную сладость мяса? Сластолюбие, появляющееся от вкушения мяса, подобно печи халдейской, семикратно разожженной, а появляющееся и помышляемое от простой пищи, равняется львиному рву, в который некогда был ввергнут Даниил. И как эта печь более ужасала и мучение в ней более устрашало, чем львы и этот ров, так намного страшнее чревослужение и сластолюбие, порабощенное вкушением мяса, нежели простой пищей. И насколько труднее было кому-либо приблизиться и посмотреть в печь, пламя которой разливалось на сорок девять локтей, и увидеть ввергнутых в нее трех отроков, чем приступить к рву со львами и Даниилом, сидящим там с ними, – настолько более непростительна дерзость презирающих типики и уставы святых отцов и вкушающих ныне мясо, чем дерзновение древних, которые, не имея предания об этом, вкушали мясо.
        cn: 如果这些以及许多其他古老的习俗，正如僧侣食肉一样，都被搁置了，那么对于那些不加区分地崇尚一切古老事物的人来说，难道适宜连同食肉一起接纳所有这些已被抛弃的习俗吗？我们又如何能与古时的教父们相比呢？他们食肉带着如此大的节制和断绝情欲，而我们如今即便是食无味之物，却也奴役于腹，将腹部奉若神明，服事它，渴望向它献上饕餮和放纵的祭物，即使不食肉也是如此？如果即使不食肉，只以粗茶淡饭，我们也存心对腹部进行贪食的服事，那么当我们任凭自己的意愿去品尝肉类自然的甘美时，我们这种贪食的习性和对腹部的奴役又将如何看待呢？食肉所产生的贪食，就像迦勒底人七倍烧热的火炉；而由简单食物所产生和思念的贪食，则等同于但以理曾被投入的狮子坑。正如那火炉比狮子和那坑更令人惊恐，其中的苦楚更令人恐惧，那么远比这更可怕的是，被食肉所奴役的腹部事奉和贪食，甚于由简单食物所致的。一个人要靠近那火焰蔓延四十九肘的火炉，并看到被投入其中的三个青年人，是何其困难；这比靠近那有狮子和与它们一同坐在那里的但以理的坑，要困难得多。同样，如今那些蔑视圣教父们的规章和诫律，并食肉之人的胆大妄为，就远比古时那些没有关于此事之传承却食肉之人的大胆，更不可饶恕。
    - type: paragraph
      text:
        ru: Вопрос:Но не то же ли самое мясо, как и ныне, вкушали древние? И какое здесь можно найти различие?
        cn: 然而，古人所吃的肉，不也和现在的一样吗？这里能找到什么区别呢？
    - type: paragraph
      text:
        ru: 'Ответ:Мясо то же самое, но не то же рассуждение, ибо если нет предания, не бывает и преступления. Ныне же вкушение монахами мяса противоречит преданию, правильнее же сказать, противоречит закону, данному изначально Богом, и вменяется в непослушание и самочиние перед Богом. Если тот древний Иоанадав, сын Рехава, запретил всему племени своему пить вино, и сыновьям его, хранящим эту заповедь, пророк Иеремия сказал от лица Господня:«Тако рече Господь Бог Вседержитель: понеже послушаша сынове Ионадава заповеди отца своего, творити, елика заповеда им отец их: сего ради сия глаголет Господь сил: не оскудеет муж от сынов Ионадавлих, сына Рихавля, стояй пред лицем Моимвсядни земли»(Иер.35:18–19).'
        cn: '回答：肉食本身是一样的，但理据不同，因为若无圣传，便无罪过。然而，如今修士们食用肉食违背了圣传，更确切地说，违背了上帝起初所颁布的律法，且被视为在上帝面前的不顺从与僭妄自专。若那古时的约拿达（利甲的儿子）禁止他的整个宗族饮酒，并且先知耶利米奉上主之名对遵守此诫命的他的子孙说：


          「上主上帝全能者如此说：『因为约拿达的子孙听从了他们父亲的命令，遵行他们父亲所吩咐他们的一切：因此，万军之主如此说：约拿达（利甲的儿子）的子孙中，必不致缺少一人永远侍立在我面前。』」

          （耶利米书 35:18-19）'
    - type: paragraph
      text:
        ru: 'Насколько же лучше и гораздо более благоприятно было бы Богу, если бы мы, монахи, послушали святых отцов наших, заповедавших не вино, но мясо, как пищу легко разжигающую страсти, не вкушать во все дни жизни нашей! Ибо насколько блаженные отцы наши многочисленнее и выше по святости перед Богом, чем Ионадав, настолько и нам подобает по преимуществу хранить их заповеди. Где же ныне носящие на устах своих неполезную древность и разоряющие ею установленное для монахов благочестивое предание святых отцов о качестве пищи? Не уничтожают ли древнейшие сыны Ионадава их древность одной похвалой Божией им за столь великое повиновение и хранение заповеди отеческой, которая многим не только кажется малой и вменяется ими ни во что, но и наиболее презираема всеми и в древности, и ныне? Предание же богоносных отцов наших изначально было законоположено в раю, потом – в Священном Евангелии, лучше же сказать, засвидетельствовано Богомужным житием на земле Христа Господа нашего и передано Самой Пречистой Богоматерью, а еще и подтверждаемо пищей, посылаемой от Бога множеству святых, как это уже было сказано выше. Поэтому подобает считать и называть его первейшим законом, который дан от Бога и который мы должны хранить с несомненной верой и добрым произволением от всей души, а не только изобретенным позднее преданием отеческим. Спорящим же с нами об этом и спрашивающим: кто установил это предание? – надо отвечать, что изначально сам Бог законоположил это, вкушение же мяса попущено было Богом только по одной немощи нашей, так же как и древним – приношение в жертву скота.'
        cn: 上帝将多么喜悦，多么更为称心满意啊，如果我们这些修士，能够听从我们的圣教父们所吩咐的，在一生中所有日子里，不食用酒，而是不食用肉——这种极易激起情欲的食物！因为我们的蒙福教父们，无论是数量还是在上帝面前的圣洁，都远超约拿达，因此我们也理当优先遵守他们的诫命。如今，那些口中谈论无益的古风，并借此破坏圣教父们为修士们所确立的关于食物种类之虔敬传统的人，又在哪里呢？约拿达的后裔们难道不是凭借上帝对他们如此伟大之顺服与遵守父辈诫命的赞扬，就废除了他们的古老习俗吗？这诫命对许多人来说，不仅显得微不足道，被他们视若无物，而且在古今都被所有人最甚地轻蔑。而我们蒙神之教父们的传统，最初是在乐园中被确立为律法，继而在圣福音中，更确切地说，是由我们主基督在世的神人生命所见证，并由至洁圣母亲自传授，此外，还借由上帝赐予众多圣人的食物所证实，如前所述。因此，理当将此传统视为并称之为首要的律法，它由上帝所赐予，我们应以毫无疑虑的信仰和全心善意的意愿去遵守，而不仅仅是后来才由父辈们创立的传统。而对于那些与我们争论此事并询问：「是谁确立了这项传统？」的人，我们必须回答：最初是上帝亲自确立了它；至于食用肉类，则是上帝仅仅因着我们的软弱才允许的，正如对古人允许献祭牲畜一样。
    - type: paragraph
      text:
        ru: 'Поэтому вкушение мяса для мирян, а не для монахов – ни грех, ни добродетель, по простой поговорке: ни греха, ни спасения не приносит человеку, воздержание же от мяса – спасительный закон Божий и богоугодная добродетель. Первая причина святого поста – обуздание плоти и укрощение всякого бессловесного движения, что весьма нужно и полезно монахам. Вторая та, что пост делает душу легкой для молитвы и небесных размышлений. Третья та, что этим мы служим Богу и говение – это благочестие. Четвертая та, что пост – удовлетворение Бога и умилостивление Его гнева праведного. Пятая – пост есть прошение у Бога вечных и временных благ, и прочее, как сказал божественный Златоуст: «Постись, чтобы не согрешить; постись, потому что согрешил; постись, чтобы принять; постись, чтобы не потерять принятого». Хотя пост и разделяется на четыре вида, то есть на пост духовный и нравственный и на пост естественный и церковный, но монахам всё же должно всегда воздерживаться от мясоядения. Духовный пост – это удаление от грехов, нравственный же пост – умеренное употребление пищи, естественный пост – нисколько не есть, не пить до какого-либо времени, по примеру ниневитян, пост же церковный – воздержание от мяса по закону и правилам церковным, и мирским людям должно держать этот пост четыре раза в год и в каждую среду и пятницу, по благоговению же и в понедельник, наравне с монахами. Однако слово наше не об этом посте, а о постоянном воздержании монахов от мяса, при вкушении рыбы, сыра, яиц и елея в указанное в типиках время. Если мы обещаем перед Богом хранить девство и произвольную нищету во все дни жизни нашей, что вышеестественно, то не тем ли более мы должны, по преданию святых отцов, иметь произволение к естественному воздержанию от мяса? Поскольку монашеское наше житие и обещание взыскует не иного чего-либо, а только райского бесстрастия, постольку нужно избирать и пищу, данную Богом в раю. Почему же и те пять дев названы Господом неразумными (см.Мф.25:1–12)? Не за то ли только, что девство, высшее всех добродетелей, сохранили, а милостыни, добродетели легчайшей и удобнейшей для всех, ибо она естественна, не обрели. Таким же образом для монахов равное безумие – исполнять высшие и труднейшие добродетели, то есть девство и добровольную нищету, и не хранить весьма легкой добродетели – воздержания от мяса.'
        cn: '因此，对于平信徒而非修士而言，吃肉既非罪过，亦非美德，正如一句简单的俗语所言：不给人带来罪过，也不给人带来救恩；而戒食肉类则是上帝的救赎性法则，乃蒙上帝喜悦的美德。神圣斋期的第一个原因是约束肉体，制服一切无理性的冲动，这对修士们而言，是极其必要且有益的。第二个原因是斋期使灵魂轻盈，便于祷告与属天默想。第三个原因是借此我们事奉上帝，而虔诚守斋乃是虔敬。第四个原因是斋期是令上帝喜悦，并平息祂公义的愤怒。第五个原因是，斋期是向上帝祈求永恒和暂时的益处，以及其他，正如神圣的金口圣徒约翰所说：「守斋，以免犯罪；守斋，因为你已犯罪；守斋，为要领受；守斋，为免失去所领受的。」斋期虽分为四种，即属灵的斋期与伦理的斋期，以及自然的斋期与教会的斋期，但修士们仍应始终戒食肉类。属灵的斋期是远离罪恶，而伦理的斋期是适度进食，自然的斋期是按照尼尼微人的榜样，在特定时间内滴食不进、滴水不沾；而教会的斋期是按照教会的法律和规矩戒食肉类，平信徒每年应守此斋期四次，以及每周三和周五，若出于虔敬，亦可在周一守斋，与修士同等。然而，我们所谈论的并非此种斋期，而是修士们对肉类的永久戒食，即在圣规（типиках）所规定的时间内，可食用鱼、奶酪、蛋和油。


          如果我们向上帝许诺，在我们有生之年保守童贞和自愿贫穷，这些都是超乎自然的，那么，我们岂不更应依照圣教父的传统，甘心乐意地自然戒食肉类吗？既然我们的修士生活与许诺所寻求的并非他物，而唯独是乐园般的无情欲，那么，就当选择上帝在乐园中所赐予的食物。那么，那五个童女为何被上主称为愚拙的呢（参马太福音 25:1-12）？难道不正是因为她们虽然保守了童贞，这乃是所有美德中最高的，但却未曾获得施舍，这美德对所有人而言是最轻易、最便捷的，因为它合乎自然？同样地，对于修士而言，履行最高且最艰难的美德，即童贞和自愿贫穷，却不保守戒食肉类这极其轻而易举的美德，乃是同等的愚昧。'
    - type: paragraph
      text:
        ru: Свет всему миру и слава монахов, особенно же Христовой Церкви, – Афонская гора, Киев и вся великая Россия, где в эти последние времена просияли столь великой святостью преподобные отцы, которые, покоряясь преданию древнейших святых отцов, принимали в пищу только одни семена, елей, рыбу, сыр и молоко, и ни одного из них мы не видим питающимся мясом. Их житие и воздержание подает всем мирянам ревность к постничеству и вызывает великое удивление, что в иных местах монахи вкушают мясо. И многие из монахов, обличаемые совестью, трепещут перед неизвестным судом за это.
        cn: 是全世界的亮光，是修士们的荣耀，尤其也是基督教会的荣耀——阿索斯山、基辅以及整个伟大的俄罗斯。在那里，在这末后的日子里，曾有如此伟大的圣洁的尊贵教父们彰显，他们顺从最古老圣教父们的传统，只以谷物、油、鱼、奶酪和牛奶为食，我们没有见到他们中任何一位食用肉类。他们的修道生活和节制赋予所有平信徒对禁食的热忱，并引起极大的惊讶，即在其他地方的修士竟然食用肉类。并且许多修士，被良心责备着，为此事而在未知的审判面前颤栗。
    - type: paragraph
      text:
        ru: Поэтому не подобает нам шутить нешуточными вещами и, оправдывая свое чревослужение древними повестями и историями, дерзать на мясоядение, думая, что это оставлено на волю каждого, а не является законом Божиим и отречением нашим перед Богом и святыми Его ангелами.
        cn: 因此，我们不应轻忽非同小可之事，并且，借着古代的叙述和故事为自己的贪食辩解，竟敢食肉，以为这是任凭各人自由选择的，而不是上帝的律法，以及我们在上帝和祂的圣天使面前所作的誓绝。
    - type: paragraph
      text:
        ru: Вопрос:Если, как видно, воздержание от мяса – первый закон Божий, а не одно предание святых отцов, изображенное в типиках и принятое Святой Соборной Церковью, и распростряняется во всех странах православных, то есть греческих, российских, болгарских и сербских, угровлахийских и молдавских, и прочих, то откуда пошло начало этого презрения и бесстрашия в монахах?
        cn: 问题：如果，显而易见地，禁食肉类是上帝的首要律法，而非仅是圣教父们在规程书（типиках）中描绘并为圣公教会所接受的某个传统，且普行于所有东正教国家，即希腊、俄罗斯、保加利亚和塞尔维亚、瓦拉几亚和摩尔多瓦，以及其他国家，那么，这种轻蔑以及修士们中间的无所畏惧是从何而起的呢？
    - type: paragraph
      text:
        ru: 'Ответ:Начало и конец, лучше же сказать, источник многих беззаконий перед Богом в этом мире – ветхий Рим, который со времен апостольских пророчески был назван матерью блудниц и мерзостей земных, как написано в Откровении (см.Откр.17:3–5). Оттуда, вместе с многим другим злом, пошло начало презрению благочестивых отеческих преданий о воздержании монахов от мяса. Всеблаженнейший Патриарх Константинопольский кир Михаил Керуларий пишет против латинской ереси: «Если в Римской державе кто-либо из монашеского звания станет епископом, то он без боязни разрешает монахам есть мясо, и сам, если и малая болезнь ему приключится, ест мясо. А в общежительных монастырях все, будучи здоровыми, едят сало». Это признает и Бароний Римлянин, когда в седьмой главе описывает события 1054 лета Господня: «Михаил Керуларий, Патриарх Константинопольский, в согласии с Львом Охридским, архиепископом Болгарским, написал обличительное послание против римской церкви, перечисляя такие заблуждения латинские: литургисают на опресноках, удавленину едят, монахи их мясом питаются, и прочее». Не удивительно же, что и греческие монахи научились от латинян есть мясо. Когда римляне владели Иерусалимом восемьдесят и более лет, начиная с 1099 года и до 1186 года, и поставили в нем своего Патриарха и короля, тогда понадобилось многим сластолюбивым греческим монахам перенимать у латинян мясоядение, особенно же когда и сам Константинополь был взят латинянами. Бароний пишет о событиях 1191 года: «Когда Вальсамон, Патриарх Антиохийский, дерзнул изложить в письме многие хулы на Папу, считая и называя его мерзким и недостойным не только поминания на святейшей литургии, но даже и имени христианского, тогда, через два года, латиняне взяли Константинополь и поставили своего Патриарха». Всё это было по попущению Божию, помощью и действием сатаны, отпущенного после тысячи лет заключения в бездне, как сказал тайновидец (см.Откр.20:1–3), и показавшего знамение своего нового возвращения в Рим как отступлением латинян от ново-римской монархии, так и разделением Святой Соборной и Апостольской Церкви и разрешением монахам есть мясо, а мирянам пренебрегать святыми постами, хранимыми Святой Церковью с апостольских дней.'
        cn: 起初与终结，不如说，是这世上许多忤逆上帝之罪的源头——那便是古罗马，自使徒时代起，它便被预言性地称为世上淫妇和可憎之物的母，正如《启示录》中所记载的（参见启示录 17:3-5）。从那里，伴随着许多其他邪恶，开始了对修士们禁食肉类的虔敬教父传统的蔑视。至福的君士坦丁堡牧首基尔·米海尔·凯鲁拉里乌斯针对拉丁异端写道：「如果在罗马辖境，有人从修士品级成为主教，他便毫无顾忌地允许修士们吃肉；并且他自己，即便只患有小病，也会吃肉。而在共生修道院里，所有人，即便身体健康，也吃肥肉。」 罗马人巴罗尼乌斯也承认这一点，当他在第七章描述主历1054年的事件时，他写道：「君士坦丁堡牧首米海尔·凯鲁拉里乌斯，在奥赫里德的利奥（保加利亚大主教）的同意下，写了一封谴责罗马教会的书信，列举了拉丁教的以下谬误：他们用无酵饼行礼仪，食勒毙之物，他们的修士们以肉为食，等等。」 那么，希腊修士们也从拉丁人那里学会了吃肉，这便不足为奇了。当罗马人从1099年到1186年占领耶路撒冷八十年或更久，并在那里设立了自己的牧首和国王时，许多贪爱口腹之欲的希腊修士，便不得不向拉丁人学习吃肉，尤其当君士坦丁堡本身也被拉丁人攻陷时。巴罗尼乌斯写道关于1191年的事件：「当安提阿牧首瓦尔萨蒙胆敢在信中对教宗多有亵渎，认为并称他不仅在至圣礼仪中不配被提及，甚至不配拥有基督徒之名时，两年后，拉丁人攻陷了君士坦丁堡，并设立了自己的牧首。」 这一切都是出于上帝的许可，借着撒旦的帮助和运作而发生，它在深渊中被囚禁千年之后被释放，正如启示者所言（参见启示录 20:1-3），并展示了它重新回到罗马的迹象，这既体现在拉丁人脱离新罗马的君主制，也体现在圣大公与使徒教会的分裂，以及允许修士们吃肉，和平信徒轻忽圣教会自使徒时代起所遵守的圣斋期。
    - type: paragraph
      text:
        ru: 'А о том, что Василий Великий в одном из постнических слов своих написал, что монахи варят в соленой воде небольшой кусок мяса и, обмакивая в этот рассол хлеб, едят, скажем, что они делали это не по сластолюбию, а для подкрепления тела, и святой написал об этом не как о законном предании, а как о тогдашнем обычае. Утверждая же и предпочитая закон, данный изначально Богом, он повелевает монахам питаться растениями и плодами земными, а не мясом, вкушение которого попущено из-за невоздержания людей после потопа, как об этом было сказано. Поэтому и богоносные отцы, усмотрев, что вкушение мяса неполезно монахам и возжигает любострастие, запретили его полностью и против этой древности изложили правила в типиках. Поэтому, взирая на всю древность, подобает нам придерживаться только того, что составляет наше спасение, а то, что не таково, – упразднять. Ибо еще в древнейшей истории написано о святом Петре, верховном апостоле: «Сказал он Клименту: Зачем ты, не понимая моего жития и произволения, хочешь всегда быть со мной? Не видишь ли, что я питаюсь только хлебом, и маслинами, и скудным количеством овощей?» Такая древность полезна для понимания нашего монашеского обета. Подобное пишетКлимент Александрийскийо святом евангелисте Матфее во второй книге «Педагога», в первой главе: «Питался он только одними травами». Иаков же, апостол, всегда воздерживался от мяса, как пишет святой Евсевий во второй книге истории, в двадцать второй главе. Что еще сказать нам о тех христианах, которые жили недалеко от Александрии и которых наставлял святой Марк? – Они принимали пищу однажды в день к вечеру, от мяса же всегда воздерживались, как пишет об этом святой Евсевий во второй книге истории, в семнадцатой главе. И святой Епифаний в книге против ересей говорит: «Много было тех, которые по своей воле всегда воздерживались от мяса». И святойКирилл Иерусалимскийв четвертом поучении катехизиса также свидетельствует о воздержании от мяса, бывшем в обыкновении у многих христиан. Также и Августин в книге о церковных обычаях, в главах тридцать первой и тридцать третьей, и Иероним в книге третьей против Иовиана, и Феодорит, и иные многие пишут в своих книгах о постоянном воздержании христиан от мяса. Если же изначально среди мирян было такое тщание и усердие в воздержании от мяса, то разве не бо́льшим подобает ему ныне быть среди монахов? Да и зачем нужно много говорить? Скажем только самые слова Христовы:«Подвизайтесь войти через тесные врата, ибо пространны врата и широк путь, ведущие в погибель, и много входящих ими. И узкие врата и тесен путь, ведущий в жизнь, и мало тех, которые обретают его»(см.Мф.7:13–14).'
        cn: 至于大圣巴西尔在他一篇论禁食的讲论中写道，修士们将一小块肉放入盐水中煮熟，然后将面包蘸着肉汁吃，我们要说，他们这样做并非出于贪食，而是为了强健身体；圣人写下此事，也并非将其作为一项合乎律法的传统，而是作为当时的习俗。至于他所确认并推崇的、最初由上帝所赐的律法，他吩咐修士们以植物和地上的果实为食，而非肉类；肉类的食用，如前所述，是在洪水之后因着人们的不节制才被允许的。因此，那些承载着神的教父们，鉴察到食用肉类对修士无益，且会燃起情欲，便完全禁止了肉食，并针对这种古老的习俗，在修院规章中制定了规则。因此，审视所有的古老传统，我们应当只遵守那些关乎我们得救的，而那些并非如此的，则应予以废除。因为在最古老的历史中，曾记载着关于至高无上的使徒圣彼得的事件：「他对革利免说：『你为何不理解我的生活和意愿，却总想与我在一起呢？难道你没看到我只以面包、橄榄和少量蔬菜为食吗？』」这样的古老传统对于理解我们的修士誓愿是有益的。亚历山大革利免在《导师》一书的第二卷第一章中，也类似地记载了关于圣福音书作者马太的事：「他只以草本植物为食。」而使徒雅各伯，总是禁食肉类，如圣优西比乌在《教会史》第二卷第二十二章中所写。我们还需要对那些居住在亚历山大附近、并由圣马尔谷教导的基督徒说些什么呢？——他们每天只在傍晚进食一次，并且总是禁食肉类，正如圣优西比乌在《教会史》第二卷第十七章中所记载。圣厄丕法尼在他的《驳异端书》中说：「有许多人自愿地总是禁食肉类。」耶路撒冷的圣济利禄在他的第四篇要理讲道中，也证实了许多基督徒有禁食肉类的习俗。此外，奥古斯丁在他的《论教会习俗》一书第三十一章和第三十三章中，以及耶罗尼莫在他的《驳约维盎》第三卷中，还有狄奥多利、以及其他许多人都各自在著作中写道，基督徒一直以来都禁食肉类。若是起初平信徒中就有如此在禁食肉类上的细致和热忱，那么如今修士们当中，岂不更应当如此吗？又何须多言呢？我们只需引用基督自己的话：「你们要努力进入那窄门，因为通往灭亡的门是宽的，路是广的，进去的人也多。通往生命的门是窄的，路是小的，找到的人也少。」(参 马太福音 7:13-14)。
    - type: paragraph
      text:
        ru: 'А поскольку здесь во многих местах упоминается о типиках великих монастырей, составленных святыми отцами, то нужно вкратце и из них привести выдержки. Студийский типик, определяя количество и качество снедей, говорит: «Подобает знать, что после Пасхи до недели Всех святых едим вареное сочиво с елеем и зеленью, принимаем же и рыбу, и сыр, и яйца, кроме понедельника, среды и пятницы». Типик Иерусалимский пишет: «Подобает знать, что весь год в простые дни, когда нет праздника или поста, в пятый час клеплем[6]на литургию и после отпуста входим в трапезную и едим два кушанья: одно вареное, а другое – обваренную зелень или сочиво, в постные же дни, то есть в понедельник, среду и пятницу всего года, – сухоядение[7], по преданию божественных отцов». Типик святой Афонской Горы говорит: «Подобает знать, что от Пасхи до недели Всех святых в трапезной едим два кушанья с маслом, зелень и сочиво, сыр и рыбу, если имеем».'
        cn: '鉴于此处多处提及圣教父们编纂的大修道院规章，因此需要从中简要引述摘录。


          斯图迪特修道院规章，在规定膳食的数量和品质时，写道：「应当知道，从复活节之后直到诸圣主日，我们食用熟谷物配橄榄油和蔬菜，并且也食用鱼、奶酪和鸡蛋，除了周一、周三和周五。」


          耶路撒冷修道院规章写道：「应当知道，全年，凡无节期或斋戒之平日，我们于第五时辰敲响钟木[6]以召集圣祭，并在释放礼后进入膳厅，食用两道菜肴：一道是煮熟的，另一道是烫熟的蔬菜或谷物。而在斋戒日，即全年之周一、周三和周五，则为干食[7]，依照圣教父们的神圣传统。」


          圣阿索斯山修道院规章写道：「应当知道，从复活节直到诸圣主日，我们在膳厅食用两道菜，配油、蔬菜和谷物，如果具备，还有奶酪和鱼。」'
    - type: paragraph
      text:
        ru: 'О Рождестве Христовом: «Если праздник Рождества Христова случится в среду или в пятницу, разрешаем: мирянам – мясо, монахам же – сыр и яйца, и едим от Рождества Христова во все дни до навечерия[8]святого Богоявления, миряне – мясо, монахи же – сыр и яйца».'
        cn: '关于基督诞生节：


          「倘若基督诞生节恰逢周三或周五，我们允许：平信徒可食肉类，而修士则可食奶酪和鸡蛋；并且从基督诞生节起，直到圣显节[8]前夕的所有日子，平信徒可食肉类，而修士则可食奶酪和鸡蛋。」'
    - type: paragraph
      text:
        ru: 'Об Успении Пресвятой Богородицы: «Если этот праздник будет в среду или в пятницу, разрешаем только рыбу и вино. Если же в понедельник, мирянам разрешается мясо, и сыр, и яйца, монахам же – только рыба и вино».'
        cn: '关于至圣圣母安息节：

          「如果此节落在星期三或星期五，我们只允许鱼和酒。如果落在星期一，则允许平信徒食肉、奶酪和鸡蛋，至于修士们，只允许鱼和酒。」'
    - type: paragraph
      text:
        ru: Таково предание богоносных и всеблаженнейших отцов наших о воздержании от мяса, хранимое от дней апостольских одним только произволением каждого благочестивого монаха, в годы же Великого Антония и Евфимия, Саввы и Феодосия и прочих богоносных отцов собранное и утвержденное типиками и писаниями, принятое Святой Соборной Церковью и даже до нынешнего времени не изглаждаемое из книг церковных. Поэтому противники воздержания хотя и не дерзают изгладить это предание, однако имеют к этим правилам непримиримую вражду и ненависть и горе и долу выискивают подобные слова и древние истории для уничтожения и истребления их из монашеского чина.
        cn: 此乃我们那些负有神性且至福的教父们关于禁食肉类的传统，此传统自使徒时代起便仅凭每一位虔敬修士的自由意志而持守；及至伟大的安东尼、欧提米、萨瓦和提奥多西以及其他负有神性的教父们在世之时，此传统被汇集并由规章和著述所确立，为圣而公的教会所接纳，甚至直到今日也未从教会典籍中抹去。因此，禁食的反对者们纵然不敢抹去这个传统，然而却对这些规条怀有不可调和的敌意和仇恨，并四处搜寻类似的言论和古老的记载，为要将其从修道阶层中毁灭和清除。
    - type: paragraph
      text:
        ru: 'Таким был и законоучитель их кир Петр, Патриарх Антиохии, о котором в книге, называемой «Тактикон», в 1033 году написано так: «Этот кир Петр был словно обоюдоострый меч: латинское нечестие по причине служения на опресноках и учения об исхождении Святого Духа от Сына совершенно отвергал, а по причине разрешения на вкушение мяса и на всё остальное принимал и оправдывал и поэтому противостоял он всеблаженнейшему Патриарху, кир Михаилу Керуларию». «И это, от начала и до этого места, избрал я из разных посланий кир Петра, – пишет преподобныйНикон Черногорец, – и некоторое, как не имеющее большого вреда, я пропустил, а именно разрешение мирянам недозволенного вкушения мяса некоторого скота и зверей, каковы медведи и им подобные. А то, что он изложил весьма вредное для монашеского жительства учение о вкушении мяса по своим страстным помыслам и, отыскав фряжеские[9]отпадения, ввел учение страстное по своей страстной воле и привел постнические слова Василия Великого и житие Пахомия, об этом молчать не до́лжно. Ибо что значит такая древность ныне, когда вкушение мяса совершенно запрещено монахам? О такой древности рассуждают и армяне. Так и кир Петр писал о ней, будучи порабощен страстью, как поведал мне кир Лука, митрополит на Вирзу и мой духовный отец, ибо когда кир Петр принял поставление на патриаршество, там был и этот мой отец. Ему-то и сказал царь: Даем вам Патриарха, но он не оставляет вкушения мяса. Старец же дерзнул сказать при всех: Добр владыка мой и разумен, но мы не принимаем в Антиохии Патриарха, вкушающего мясо. Тогда кир Петр отвечал ему: Перестань, владыка мой, не возбраняй мне этого, ибо я не оставлю вкушения мяса, и святой наш царь в этом снизошел мне. Но так как старец не позволил этого, то кир Петру совершенно запретили есть мясо. Когда же они вышли все вместе из Константинополя и пришли в Антиохию, было возведение Патриарха на престол, и те, кто не ел мяса, сели с Патриархом, а те, кто ел, сели отдельно. Когда сварили мясо, то сначала принесли его к Патриарху, и он обонял запах его с наслаждением, и тогда уносили мясо к тем, кто ел его. Старец же, сидя возле Патриарха, снова запрещал ему, как и прежде перед царем, и сказал при всех: Владыка мой, не делай этого, ибо воздвигнешь на себя большую брань. Тогда Патриарх, не вынесший этого слова, взял кусок мяса и сказал: Замолчи, старче, чтобы я не ударил тебя им! Старец же отвечал: Я, Владыка мой, сказал это, видя милость твою ко мне и надеясь на нее; если же ты не велишь, то я не буду больше говорить. Патриарх же сказал: Святой царь повелевал мне есть мясо, ты же запретил мне, и я теперь не имею никакого утешения, кроме одного обоняния мяса. Так рассказал мне это мой духовный отец Лука. Я же, убоявшись, как бы кто-либо другой не принял обмана в душу свою, изложил, прежде чем умру, на письме то, что знаю достоверно.'
        cn: '他们的教法师吉尔·彼得，即安提阿牧首，在1033年出版的名为《规程手册》一书中，关于他有如下记载：「这位吉尔·彼得如同两刃的剑：他因拉丁人使用无酵饼举行圣礼，并主张圣灵由子发出的教义而完全拒绝其不敬虔，却因其允许吃肉和所有其他方面而予以接受和辩护，因此他与至福牧首吉尔·米哈伊尔·凯鲁拉里乌斯对立。」


          「这从头至此的一切，我从吉尔·彼得的各篇书信中选取而来——可敬者黑山尼孔写道——有些内容，因其无甚大害，我略去了，即允许平信徒吃一些被禁止食用的牲畜和野兽的肉，如熊和类似之物。至于他依据自己的情欲思想，阐述了对修道生活极其有害的吃肉教义，并且，他寻得了法兰克人的[9]背道行为，凭其情欲意志引入了情欲的教义，并引用了大巴西略关于禁食的话语和帕科谬的生平事迹，对此不应保持沉默。因为如今这样的古老传统有何意义，当吃肉已被僧侣完全禁止之时？亚美尼亚人也讨论这样的古老传统。吉尔·彼得也是如此，他写下这些时被情欲所奴役，正如维尔祖都主教吉尔·路加，我的神父，向我讲述的那样，因为当吉尔·彼得接受牧首祝圣时，我的这位神父也在场。皇帝对他说：「我们给你们一位牧首，但他不放弃吃肉。」这位长者却敢于在众人面前说：「我的主是善良且明智的，但在安提阿，我们不接受吃肉的牧首。」随后吉尔·彼得回答他说：「住口，我的主，不要禁止我这样做，因为我不会放弃吃肉，而且我们神圣的皇帝在这方面也迁就了我。」但因为这位长者不允许这样做，吉尔·彼得被完全禁止吃肉。当他们一同离开君士坦丁堡来到安提阿时，举行了牧首登基仪式，不吃肉的人与牧首同坐，吃肉的人则分开坐。当肉煮熟后，首先把肉端到牧首面前，他带着喜悦嗅闻它的香气，然后才把肉端给那些吃肉的人。这位长者，坐在牧首身旁，再次禁止他，如同之前在皇帝面前一样，并在众人面前说：「我的主，不要这样做，因为你会给自己招致巨大的争战。」牧首当时听不进这些话，拿起一块肉说：「住口，长者，免得我用这肉打你！」这位长者回答说：「我的主，我这样说，是看到了你对我的恩慈并寄希望于此；如果你不准许，我便不再多言。」牧首说：「神圣的皇帝命令我吃肉，你却禁止了我，我现在除了嗅闻肉香之外，没有任何慰藉了。」我的神父路加就是这样向我讲述此事的。我担心有人会将虚假引入灵魂，便在离世之前，将我确切知晓的写了下来。'
    - type: paragraph
      text:
        ru: 'И еще об этом же Патриархе некоторые говорили мне, что он тайно ел мясо, и из этого я понял: то, что он писал о мясе, было вызвано страстями, так же, как и снисхождение к другим вещам, к крови и удавленине, которое есть и у фрягов. Пишет он Константинопольскому Патриарху: “В греческой земле едят кровь, и даже в самом Константинополе, и ты не можешь запретить этого, как же говоришь фрягу не есть удавленины?” Но да будет известно всем, что он пишет так по своим страстным помыслам, на соблазн и преткновение многим, как говорит Писание:«Каждый увлекается и обольщается собственною похотью»(см.Иак.1:14). И еще Сам Господь говорит:«Горе вам, книжники и фарисеи, лицемеры, ибо и сами не входите в Царствие Небесное, и другим возбраняете»(см.Мф.23:13). И еще о принявших талант и не научивших других говорит:«Лукавый раб, подобало тебе отдать серебро мое торгующим, и я, придя, взял бы свое с прибылью»(см.Мф.25:26–27). И божественный Златоуст, так понимая это, говорит: «Тебе прилично было бы говорить и учить, и принести Мне прибыль – наставление на добрые дела. Нам же, все это видящим и слышащим, что подобает говорить или разуметь? Ибо если свет, который в нас – тьма, то какова же тьма (см.Мф.6:23)? И где же слово божественного Павла, гремящее: Если мясо соблазняет брата моего, не буду есть мяса вовеки (см.1Кор.8:13)? И не прибавил: Если праведно соблазняется, но в любом случае. И не говорю, – продолжает Златоуст, – идоложертвенное мясо, которое возбранено вкушать и по другой причине, но если и то, что в нашей власти и дозволено, соблазняет, удаляюсь от этого, и не один день, но всё время жизни моей, как сказал апостол, во веки не буду есть мяса».'
        cn: '还有一些人告诉我，关于这位宗主教，他曾秘密食肉，由此我明白：他所写关于肉食的，是出于情欲，正如他对其他事物，对血和勒死之物的宽容，这在法兰克人中也是有的。他写信给君士坦丁堡宗主教说：「在希腊之地食血，甚至在君士坦丁堡城内也是如此，而你无法禁止此事，又怎能对法兰克人说不要吃勒死之物呢？」但愿众人皆知，他如此书写是出于自己的情欲意念，是为了使许多人跌倒和绊脚，正如圣经所言：「每个人被自己的私欲所牵引诱惑。」（雅各书 1:14）


          还有，上主亲自说道：「祸哉，你们这文士和法利赛人，假冒为善的人！因为你们自己不进入天国，也阻碍别人进去。」（马太福音 23:13）还有，关于那些领受了恩赐却未教导他人的人，祂说道：「你这又恶又懒的仆人！你本该把我的银子存入银行，这样我回来的时候，就可以连本带利收回了。」（马太福音 25:26-27）神圣的金口圣徒，如此理解此事，说道：「你本应宣讲教导，并为我带来益处——即对善行的训诲。而我们这些看见和听见这一切的人，又当说什么或明白什么呢？因为如果我们里面的光是黑暗，那黑暗该是何等大呢？（马太福音 6:23）那么，神圣的保罗那振聋发聩的话语何在呢：『如果肉使我的弟兄跌倒，我就永远不吃肉了。』（哥林多前书 8:13）他并未补充说：『如果只是正当地跌倒，而是在任何情况下。』『我不是说，』金口圣徒继续道，『献给偶像的肉，因着另一个原因是被禁止食用的；而是即使那些在我们权柄之内且被允许的，如果它使人跌倒，我也会远离它，而且不只是一天，而是我一生中所有的时间，正如使徒所说，永远不吃肉。』」'
    - type: paragraph
      text:
        ru: 'Но вот, как видим, вся Антиохийская епархия со всем освященным чином архиерейским, и иерейским, и монашеским, и мирским не желала иметь Патриарха, вкушающего мясо, и считала это соблазном себе. Однако кир Петр нисколько не обращал на это внимания, лучше же сказать, презирал имеющего Христовы уста самого апостола Павла, истолковывая писания которого, божественный Златоуст сказал в двадцать первом поучении на послание к Коринфянам: «Да услышим мы это, возлюбленные, и да не презрим соблазняющихся, и да не лишимся своего спасения! Не говори мне: Что из того, что соблазняется брат, ведь это не возбранено. Я же скажу тебе больше: если бы и Сам Христос позволил, но ты видишь, что кто-либо повреждается, то подожди и не пользуйся позволением». А также он говорит в двадцатом поучении на это же послание: «Все это сказано не только им, но уместно сказать и нам, нерадящим о спасении ближнего и говорящим такие сатанинские слова: «Что мне заботы, что тот соблазняется и этот погибает?» Это – жестокость и крайнее бесчеловечие». Так силой и действием апостольского духа законополагает божественный Златоуст то, что дозволено и оставлено на наше произволение, но приносит многий вред и соблазн. Вкушение же мяса не дозволено монахам и не оставлено на произволение всякого. Не есть мяса – закон и установление Божие, данное прежде потопа, а после потопа, как сказано, позволено было Ною по снисхождению есть мясо. Оттого это предание и богоносными отцами отменено, и типиками подтверждено не как какое-то новое и незасвидетельствованное, но как изначальное и соединенное с бытием первозданного Адама, а прежде всего и Самому Богу более благоугодное, чем вкушение мяса. И если это истина (как оно и есть), то кто сможет монахов, черных, как эфиопы, и на соблазн миру вкушающих мясо, омыть от порока? Где ныне говорящие и пишущие, что святая царица Феофания заповедала монахам не есть мяса? Не затыкает ли им уста Бароний, бывший римлянином, который свидетельствует в описании 1054 года: «Патриарх Михаил Керуларий поносит латинян не только за то, что они служат на опресноках, но и за то, что едят удавленину и всякое нечистое, монахи же их и епископы питаются мясом, и прочее». Блаженная царица Феофания жила в 885 году, и если в дни святейшего Патриарха Михаила монахи, по свидетельству Барония, не ели мяса, то как же за сто шестьдесят девять лет до этого, в дни царя Льва Премудрого, хотели есть его? Тем более и кир Петр, споря с антиохийцами о мясе, не умолчал бы назвать воздержание монахов от мяса преданием женским (то есть царицы Феофании), а не святоотеческим. Но он не сказал этого, точно зная, что таковое вкушение мяса началось в Риме, как согласно пишут об этом все церковные учители, и не царицей Феофанией упразднено и прекращено, но мудрыми и святыми отцами нашими, и воздержание от мяса началось от них, правильнее же сказать, от Самого Создателя всех Бога, говорящего Адаму и законополагающего:«Вот, Я дал вам всякую траву семенную, сеющую семя, и всякое дерево, которое имеет в себе плод семени семенного, и это будет вам в пищу»(см.Быт.1:29)».'
        cn: '但你看，正如我们所见，整个安提阿教区，连同所有圣职阶层——主教、司祭、修士以及平信徒——都不愿拥有一位食肉的牧首，并认为这对他们是一种引诱。然而，吉尔·彼得对此丝毫没有留意，甚至可以说，他藐视了拥有基督之口的使徒保罗本人。圣约翰金口在解释他的著作时，在《哥林多书信》第二十一篇讲道中说：「愿我们听闻此言，蒙爱者啊，愿我们不要轻视那些受引诱之人，也不要丧失自己的救恩！不要对我说：『即便弟兄受引诱，那又何妨？这毕竟没有被禁止啊。』我要对你说的更多是：即使基督亲自允许了，但如果你看到有人因此受损，你就当忍耐，不要使用那份允许。」他在这同一封书信的第二十篇讲道中还说：「所有这些话，不仅是对他们说的，也适合对我们这些不顾及邻人救恩，并说着这样撒旦话语的人说：『那人受引诱，这人灭亡，与我何干？』这是残忍和极端的非人道。」因此，圣约翰金口以使徒之灵的力量和作为立法，针对那些被允许并留待我们自由决定的事，但却带来了许多损害和引诱。而食肉是不允许修士的，也没有留待任何人自由决定。


          不食肉是 上帝 的律法和规定，在洪水之前就已经赐下；而在洪水之后，如经文所说，挪亚蒙恩被允许食肉。因此，这一传统被神圣的教父们废除了，并由修道规章证实，并非作为某种新颖或未经证实之事，而是作为最初的，并与始祖亚当的存有相结合的，而且，首先，它比食肉本身更蒙 上帝 悦纳。如果这是真理（而它确是如此），那么，谁能洗净那些像埃塞俄比亚人一样漆黑，并因食肉而成为世人引诱的修士，使他们脱离这罪恶呢？那些如今说圣女皇后提奥法尼亚曾吩咐修士们不食肉的人，他们现在何在？曾为罗马人的巴罗尼乌斯（Baronius）难道没有堵住他们的嘴吗？他在1054年的记载中见证道：「牧首米哈伊尔·凯鲁拉里乌斯谴责拉丁人不只是因为他们使用无酵饼举行圣祭，还因为他们吃勒死的动物和一切不洁之物，而他们的修士和主教则食用肉类，等等。」福哉皇后提奥法尼亚生活在885年，如果按照巴罗尼乌斯的证词，在最圣洁的牧首米哈伊尔时代，修士们不食肉，那么，在这之前一百六十九年，在智者利奥皇帝时代，他们又怎会想要食肉呢？更何况，吉尔·彼得在与安提阿人争论食肉问题时，也不会缄默不言，称修士们戒食肉为「女人的传统」（即提奥法尼亚皇后的），而非教父们的传统。但他没有这样说，因为他清楚知道，这种食肉习俗始于罗马，正如所有教会导师对此一致记载的，并且并非由提奥法尼亚皇后废除和停止，而是由我们智慧而神圣的教父们（废止的），而戒食肉的传统也始于他们，更确切地说，是始于万有的造物主 上帝 亲自，他曾对亚当说并立法规定：「看哪，我将所有结种子的菜蔬和一切树上结有种子的果子赐给你们，作为食物。」（参见创世记 1:29）'
    - type: paragraph
      text:
        ru: Эта книга сочинена старцем схимонахом Василием
        cn: 这本书由长老大舍马修士瓦西里撰写。
    - type: paragraph
      text:
        ru: 'Выписано из «Пращицы», из Деяния Собора, созванного в Киеве против еретика Мартина, из послания Святейшего Патриарха Цареградского Луки Хрисоверга митрополиту Киевскому Константину со всем духовным чином, где между прочим он пишет так: «Армяне повелевают монахам есть мясо, но вы не слушайте этого армянского учения, ибо хотя прежде и православные монахи ели мясо, но потом святые отцы соборно запретили монахам есть мясо, а вкушающих его повелели подвергать епитимье. И вы никак не попускайте монахам вкушения мяса, но повелевайте всячески воздерживаться от него и не есть, как издревле приняли мы от отцов и вам передали». В житиях на двадцать первое число месяца июля сказано: «Достойно упомянуть и о том, что было возвещено Богом святому пророку Иезекиилю:«Если праведник, уповая на праведное свое житие, дерзнет сотворить какое-либо согрешение, и в том согрешении постигнет его кончина, и он умрет без покаяния, то уже не вспомнит Бог все прежде бывшие праведные и богоугодные его дела, но в том грехе, в котором он умрет, будет осужден. Так же и беззаконник, проведший всю жизнь свою в беззакониях, если при кончине своей покается и в покаянии постигнет его смерть, то уже не вспомнит Бог все прежние его беззакония, но будет он причислен к праведным»(см.Иез.3:20, 18:21–22)».'
        cn: '摘录自《Пращица》，以及基辅召开的、旨在反对异端分子马丁的一部公会议的决议，以及君士坦丁堡圣哉宗主教路加·赫里索维尔格致基辅都主教君士坦丁及所有神职人员的牧函，其中他写道：

          「亚美尼亚人命令修士们吃肉，但你们不要听从这种亚美尼亚教导，因为虽然以前东正教修士也吃肉，但后来圣教父们在公会议上禁止修士们吃肉，并命令对吃肉者施以补赎。你们也绝不可允许修士们吃肉，而要命令他们竭力禁戒不食，正如我们自古以来从教父们那里领受，并已传给你们的。」

          在七月二十一日的圣徒传中记载道：「值得一提的是，上帝曾向圣先知以西结宣告说：『如果义人，仗恃自己公义的生活，胆敢犯下某种罪过，且在他犯下那罪过之时，终结临到他，他便在未曾悔改中死去，那么上帝就不会再记念他先前一切公义且蒙上帝悦纳的行为，反而他将因死时所犯的罪而被定罪。同样，那一生作恶的罪人，如果在他生命终结时悔改，且在他悔改中死亡临到他，那么上帝就不会再记念他先前一切的罪恶，反而他将被列入义人之中』」（参见以西结书 3:20，18:21-22）。'
