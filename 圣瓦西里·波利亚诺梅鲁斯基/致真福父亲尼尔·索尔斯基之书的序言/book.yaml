title:
  ru: Предисловие к книге блаженного отца Нила Сорского
  cn: 为圣尼尔·索尔斯基父一书的序言
languages:
- ru
- cn
authors:
- ru: преподобный Василий Поляномерульский
  cn: 尊者 瓦西里·波利亚诺梅鲁斯基
document:
- type: heading1
  text:
    ru: преподобный Василий ПоляномерульскийПредисловие к книге блаженного отца Нила Сорского[*]
    cn: '圣善者 瓦西里·波利亚诺梅鲁斯基


      真福者教父尼尔·索尔斯基之书的序言[*]'
  children:
  - type: heading2
    text:
      ru: Надсловие на книгу блаженного отца Нила, сочиненное учеником его иноком Иннокентием
      cn: 至福者尼尔神父之书的题记，由其门徒修士因诺肯提所作。
    children:
    - type: paragraph
      text:
        ru: 'Святые отцы, что едиными заповедями Христовыми учат обуздывать страсти и очищать сердце от злых помыслов, две эти рекомендуют как крепчайшее оружие иметь делателям, а именно – страх Божий и память о Боге, здесь сущем, следуя говорящему: «Страхом Господним всякий уклоняется от зла» (ср.:Притч. 16, 6) и«Видел я Господа пред собою всегда, дане поколеблюсь»(ср.:Пс. 15, 8). И прибавляют, что до этого надо иметь память о смерти и геенне. А третье – чтение святых Писаний.'
        cn: 圣教父们，他们以基督的诫命教导人克制情欲，并洁净心灵脱离邪恶思想，向修道者建议持有两样最坚固的武器：即对上帝的敬畏和对在此之上帝的忆念，遵循（圣经）所言：「敬畏上主者，必远离邪恶」（参：箴言 16:6）以及「我常将上主置于我前，使我不会动摇」（参：诗篇 15:8）。他们补充说，在此之前，必须要有对死亡和地狱的忆念。第三是阅读圣经。
    - type: paragraph
      text:
        ru: Все ведь это хорошо для хороших и благоговейных мужей; бесчувственным же и окаменелым, хоть и сама та геенна или Сам Бог чувствам их откроется, никакого не наведут на них страха. К тому же и самый ум у новоначальных монахов скоро притупляется для памяти о таковых ионабежит от них, как пчела от воскурения дыма.
        cn: 这一切对于良善又虔敬的男子是好的；然而，对于麻木不仁和心如顽石之人，即便那地狱本身，抑或上帝亲自向他们的知觉显现，也丝毫不会在他们身上激起恐惧。此外，初学修士的心智很快就会对于这类事物的记忆迟钝，并且会像蜜蜂躲避熏烟一般逃离它们。
    - type: paragraph
      text:
        ru: 'Хотя память о таковых хороша и полезна в час рати, но прежде этого добра явили духовнейшие и искуснейшие отцы и еще большее и несравненное добро, могущее даже очень немощным помочь. Если первого подобие и образ – мелющие в жерновах своими собственными руками и силой, то второго – мелющие в мельнице с помощью воды и искусства: ибо как вода сама собой движет колесо и камень, так и пресладкое имя Иисусово с памятью о Боге, тут сущем, во всей полноте живущем в Иисусе, подвигает ум на молитву, на что указывая, великий в богословии Исихий говорит: «Душа, благодетельствуемая и услаждаемая Иисусом, с радостью некоею и любовию и со исповеданием Благодателю хвалу воссылает, благодаря и призывая Его с веселием»; и еще: «Как невозможно в этой жизни жить без еды и не пия, так же невозможно для души без хранения ума и чистоты сердечной, что и является и называется трезвением, достичь чего-либо достигнути души, или свободитися по уму сотвореннаго[1]греха,ащеи нудит кто себе страха ради мук еже не согрешати»; и: «Аще помыслом вшедшим в сердце, нам не хотящым, и укрепляющимся и стоящим, прогонити весть Исусова молитва из глубины сердца».'
        cn: '虽在争战之时，对此类良善的记忆，固然美好且有益；但在这份良善之前，那些最属灵、最精通的教父们，早已彰显了一份更大、无可比拟的良善，它甚至能帮助那些极其软弱的人。如果说前者的写照与形象，是那些用自己的双手和力量磨碾石磨的人；那么后者的写照与形象，则是那些借助水力与技艺操作水磨的人：因为正如水自身驱动轮子和磨石，同样，那至甜的耶稣之名，连同对上帝的记忆——那在此在、并完完全全居住在耶稣里的上帝——能推动心智进入祷告。为此，神学上的伟大者希西基（Hesychius）如此说：


          「蒙耶稣施恩、得耶稣甘甜的灵魂，带着某种喜乐与爱，并以认信，向施恩者献上赞美，以欢欣感谢并呼求祂」；


          又说：「正如人在今生不可能不食不饮而活下去，同样，灵魂若无对心智的持守和对心灵的洁净——这正是且被称为警醒——也就不可能有所得，或从心智所造的[1]罪恶中得自由，即使有人因惧怕刑罚而强迫自己不去犯罪」；


          又说：「若有思想（或意念）进入我心，并非我们所愿，且生发壮大，立足不退，唯有发自心底的耶稣祷文，方能将其驱逐出去。」'
    - type: paragraph
      text:
        ru: 'В таком чину и в обучении таинству будучи опытным, великий старец,  преподобный отец наш Нил, пустынник Сорский, составил настоящую эту  книжицу, показывая в ней начало умного делания, победу и поражение  невидимых ратников и наши. Ибо первым способом – без умного внимания, – хоть  бы и достигался успех, но очень медленно и довольно болезненно. Этим же  вторым скоро и легко приближается делатель к Богу, – сказалГригорий Синаит[2].  Ибо там – одно внешнее моление, поучение и исполнение заповедей, здесь же оба:  внешнее и внутреннее хранение.'
        cn: 在这样的品秩中，并对奥秘的教导经验丰富，伟大的长老，我们可敬的父尼尔，索尔斯基的隐修士，著成了这本小书，在其中展示了心智侍奉的开端，隐形战士的胜利与失败，以及我们自身的胜败。因为以第一种方式——不带有心智的专注——即便能取得成功，但却非常缓慢且相当痛苦。然而以这第二种方式，侍奉者能迅速而轻松地亲近上帝——格里高利·西奈特[2]如此说。因为在那里——只有外在的祷告、训诲和诫命的遵行；在这里，则两者兼备：外在与内在的持守。
    - type: paragraph
      text:
        ru: Ведь когда новоначальный инок по отречении от мира и от совершения великих и  смертных грехов положит перед Богом обет воздерживаться не только от  малых повседневных и простительных грехов, о которых Сам Господь заповедал  молиться непрестанно (см.:Лк. 18:1), но и от действия самих тех страстей  и злых помыслов, и, войдя внутрь в сердце умом своим, начнет призывать  на всякую рать и на всякий злой помысел Господа Иисуса; или, если по немощи  своей согласится с прилогом вражьим и, сделав что-то противное заповедям  Христовым, припадет к Нему с сердечною молитвою, каясь, осуждая себя,  и в этом до самой кончины своей пребудет, падая и вставая, бывая побежден  и побеждая, и прося защиты день и ночь от соперника своего (см.:Лк. 18, 2–8),  не будет ли у него надежды на благое – получить спасение?
        cn: 况且，当初入道的修士，在弃绝世俗并远离了大罪和致死之罪之后，在上帝面前立下誓愿，不仅要禁戒微小的日常可赦之罪（主自己曾教导我们要为此恒切祷告，参：路加福音 18:1），更要禁戒那些情欲和恶念的作为；并用心神进入内心，开始在每一次争战和每一个恶念临到时呼求主耶稣；又或者，若因自身软弱，同意了仇敌的引诱，并做出了任何违背基督诫命之事，便以诚挚的祷告俯伏在祂面前，悔改，自责；并在此状态中，直到生命的终结，跌倒又站起，被战胜又战胜，日夜向祂祈求，抵挡他的对头（参：路加福音 18:2-8），他岂不会对良善抱有希望——获得救恩吗？
    - type: paragraph
      text:
        ru: 'Бывают ведь у подвизающихся, как опыт учит, падения (что не к смерти) в мыслях и чувствах,  как то причиняемые словом, яростью и похотью, – тремя частями души,  или чувствами телесными, т. е. зрением, слухом, речью, осязанием и обонянием.  И нет возможности даже самым великим мужам до конца избежать порока в этих  повседневных грехах, что не к смерти, начало которых: слова, мысль, неведение,  забвение, неволя, воля, случай, – каковые и прощаемы бывают вседневной  благодатью Христовой, – сказал святой Кассиан.'
        cn: 诚然，如经验所教导，修行者在思想和情感上会有堕落（不至于死），诸如言语、怒气和情欲所引起者——这些是灵魂的三个部分，或是身体的感官，即视觉、听觉、言语、触觉和嗅觉所引起者。即使最伟大的圣贤也无法完全避免这些不至于死的日常罪过，其根源有：言语、思想、无知、遗忘、被迫、自愿、偶然——而这些罪过藉着基督的每日恩典得以赦免，圣卡西安如是说。
    - type: paragraph
      text:
        ru: Если же кто-то, малодушествовав из-за них, скажет, что святой Кассиан имеет в виду одних святых, очищающихся благодатью Христовою от таковых повседневных грехов, а не также новоначальных и страстных, ладно, пусть будет и такому мнению место, но лучше – приняв рассуждение и решение таковых вещей из святых Писаний, как всякий новоначальный и страстный осуждается за эти повсечасные грехи и страсти, становясь повинен вечной муке, и как может и он благодатью Христовой вновь получить то же прощение, что и все святые, ежечасным покаянием и исповеданием перед Богом.
        cn: 然而若有人，因这些（罪）而心生怯懦，从而说圣卡西安所指的是，唯独靠着基督的恩典得以洁净、脱离此类日常罪过的圣徒，而非也指初信者和有情欲者，好吧，就让这种观点也有一席之地。但更好的方式是——从圣经中接受对这类事情的论证与判定：即任何初信者和有情欲者，如何因这些时常发生的罪和情欲而被定罪，从而当受永恒的苦刑；以及他如何也能靠着基督的恩典，借着每时的悔改和在上帝面前的认罪，再次获得与所有圣徒同样的赦免。
    - type: paragraph
      text:
        ru: '«Есть ведь, – сказалАвва Дорофей, – действующий по страсти и есть сопротивляющийся страсти». И действующий по страсти, когда услышит одновраждебноеслово, смущается или говорит пять слов или десять в ответ на одно слово, и враждует, и огорчается. И когда прекратится ссора, продолжает мыслить злое на сказавшего ему то слово, и помнит зло на него, и печалится, что не сказал ему больше, чем сказал, и готовит в себе слова еще злейшие, чтобы сказать ему, и постоянно говорит: «Почему я не сказал ему так?» – и постоянно гневается. Это одно устроение, т. е. иметь зло в обыкновении. Бог да избавит нас от такого устроения! Ибо такое устроение непременно подлежит муке.'
        cn: 阿爸多罗斐说：「这确是有顺从情欲而行者，而有抵制情欲者。」而顺从情欲而行者，当他听见一句带有敌意的话时，便心烦意乱，或以五句、十句言语回应一句言语，并心生敌意，且痛苦忧伤。而当争吵平息后，他仍继续对那对他说了那句话的人心怀恶意，并对他怀恨在心，且因没有对他说更多而忧愁，并在心中准备了更恶毒的言语以对他说，且不断地说：「我为何没有那样对他说？」且不断地发怒。这是一种习性，即习惯性地怀有恶意。愿上帝拯救我们脱离这样的习性！因为这样的习性必然遭受苦难。
    - type: paragraph
      text:
        ru: А другой, услышавзлоеслово, и смущается, и говорит и он пять или десятьсловна одно, и огорчается, что не сказал и три других, худших, и печалится, и помнит зло, но проводит немного дней, и переменяется. Другой, проведя семь дней в этом, переменяется. Другой, – один день, и переменяется. Другой досадует, враждует, огорчается и вдруг переменяется. Вот сколько различия в устроениях, однако под адом все они, пока действуютпо страсти. Из всего этого, стало быть, всех яве познаваемо есть, почто страстный не может очиститися[3]вседневною благодатию Христовою от грехов мнимых малых и не к смерти сущих.
        cn: 而另一个人，听到一句恶言，就心烦意乱，他也以五句或十句言语回敬一句，又懊恼自己没能说出另外三句更恶毒的话，于是忧愁，怀恨在心，但过了几天，他就改变了。另一个人，在此境中度过七日，便改变了。另一个人，一日便改变了。另一个人，恼恨，怀敌意，忧愁，却又忽然改变了。看啊，这些性情何其不同，然而他们都在地狱的权下，只要他们仍在被情欲所驱使。由此，众人皆可清楚知晓，为何受制于情欲的人无法藉着基督每日的恩典而得洁净[3]，脱离那些看似微小却不至于死的罪。
    - type: paragraph
      text:
        ru: 'Теперь приступим к решению: каким образом бывают простительными таковые грехи новоначальным и страстным? Сказал ведь тот же святой Дорофей: «Бывает, услышит кто-нибудьзлоеслово и скорбит в себе не оттого, что досаждение воспринял, но что не претерпел. Таковой по устроению – из подвизающихся и сопротивляющихся страсти. Другой подвизается и трудится, напоследок же оказывается побежденным от приступа страсти. Иной и не хочет отвечать зло, по привычке же увлекается. Другой и старается не говорить совершенно ничего злого, и скорбит, что досаждение воспринял, однако осуждает себя, что скорбит, и кается в этом. Другой не скорбит, что досаждение получил, но и не радуется. Вот эти все суть сопротивляющиеся страсти, ибо волею остановили страсть и не хотятдать ейдействовать, но и скорбят, и стараются. Сказали же отцы, что всякая вещь, которой не хочет душа, маловременна.'
        cn: 现在我们来解决：初心者和有情欲者，这类罪过以何种方式获得赦免呢？正如圣多萝西所说：「有时，有人听见恶语，心中忧伤，并非因为受到了侮辱，而是因为未能忍受。这样的人，就其精神状态而言，属于那些在修苦和抵挡情欲者。另一种人修苦并劳作，最终却被情欲的突袭所战胜。又一种人甚至不想以恶报恶，却因习惯而受牵引。还有一种人努力完全不说任何恶语，并因受到了侮辱而忧伤，然而他谴责自己为何忧伤，并为此忏悔。又有一种人不因受到侮辱而忧伤，也不为此高兴。所有这些人都是抵挡情欲者，因为他们藉着意志阻止了情欲，不愿让它作祟，但他们也忧伤，也努力。教父们说过，任何事物，只要灵魂不愿意它，都是短暂的。」
    - type: paragraph
      text:
        ru: 'Расскажу-ка я вам и притчу. Кому подобен действующий по страсти и приемлющий ее? Подобен он человеку, раненному стрелами врага своего, и берущему стрелы руками своими, и вонзающему их в сердце свое. А сопротивляющийся страсти подобен обстреливаемому врагом его, но облеченному в броню и не получает ранений». Таковой, хоть и страстен, однако может благодатью Христовой получить прощение за таковые повседневные грехи, не по произволению, но невольно совершаемые, о которых Господь заповедал святому Петру до«семижды семидесяти раз»(Мф. 18, 22) прощать каждый день. Подтверждает это и святойАнастасий Синаит, говоря: «Думаем и полагаем о приемлющих святые тайны тела и крови Господней, что если малые некие и удобь простителныя грехи[4]имут, яко то: языком, слухом или оком крадоми, или тщеславием, или печалию, или яростию, или чим от таковых, похуляюще себе и исповедающеся Богу, и тако святыя тайны[5]приемлют, веруем, яко во очищение грехов таковых приятие святых таин бывает имъ».'
        cn: '我来给你们讲一个比喻吧。顺从情欲并接受情欲之人，他像什么呢？他就像一个人，被仇敌的箭射伤，却用自己的手取出箭，并将其刺入自己的心脏。而抵挡情欲之人，他就像被仇敌射击，却身披盔甲，因而毫发无损。


          这样的人，虽有情欲，却能藉着基督的恩典获得赦免，为此类并非出于本意、而是无意间犯下的日常罪过得到赦免，关于这些罪过，上主曾吩咐圣彼得，每日要赦免「七十个七次」（马太福音 18:22）。圣阿纳斯塔修·西奈山者也证实了这一点，他说：「我们认为并相信，对于那些领受上主圣体圣血之圣奥秘者，如果他们[4]犯有某些轻微且易得赦免的罪过，例如：口舌、耳闻或眼见不知不觉所犯之罪，或因虚荣、忧愁、愤怒，或诸如此类者，如果他们自责并向上帝忏悔，并[5]如此领受圣奥秘，我们相信，领受圣奥秘便能洁净他们此类罪过。」'
    - type: paragraph
      text:
        ru: 'Подобное же сказал и святой Пимен: «Предпочитаю человека согрешившего и кающегося не согрешающему и не кающемуся»,[6]– и прочее.'
        cn: 圣彼门也同样说过：「我宁愿要一个犯了罪又悔改的人，也不要一个不犯罪却不悔改的人。」[6]——等等。
    - type: paragraph
      text:
        ru: А поскольку было в начале сказано о благоискусном обуздании страстей умною молитвою и заповедями, то надо уже откровеннейшим образом показать и сам ход сражения в уме со страстями.
        cn: 既然在开篇已提及通过心祷与诫命善巧地制伏诸情欲，那么现在就必须最为坦诚地显明在心智中与情欲争战本身的进程。
    - type: paragraph
      text:
        ru: 'Итак, прилог вражий находит какою-либо страстью или помыслом злым;нопризывает делатель Христа на это, и погибает дьявол с прилогом его. От немощи ли, мыслью ли, словом ли, или яростью, или пожеланием плотским палчеловек, – молит он Христа, исповедуясь Ему и каясь. Объят бывая унынием и печалью, стеснившими ум его и сердце, берется за память о смерти, о геенне и о Боге, здесь сущем, и в этом немного потрудившись, призывает Христа. Затем, обретая мир после рати, вновь молит Христа милостивым быть к нему сегогрехами вольными и невольными. И, просто сказать, в час и брани и мира душевного прибегает он ко Христу, и бывает ему Христос всем во всем – и благом, и дурномс нимслучающемся. И не привлекает такового мнение, будто исправляет он что-то, молясь или угождая Богу, ибо все его моление, от страха и мук, от грехов и покаяния, имеет начало и конец. Потому что одно разумение внешнего моления, а другое этого внутреннего. Тот ведь, исполняя число песнопений, уповает на Бога, оставляя же его, осуждает себя. А этот, ударяем бывая своею совестию за ежечасные грехи, о которых было сказано, и терпя нашествие прилогов вражиих, постоянно вопиет ко Христу, нося в уме такое изречение: «Если и по всей лестнице совершенства пройдешь, о оставлении грехов молись».[7]И еще:«Хочу... пять слов умом моим сказать, ...нежели тьмуязыком"(ср.:1Кор. 14, 19). И так, без всякого сомнения, исполняет сказанное святым Дорофеем.'
        cn: '因此，仇敌的诱惑会借着某种情欲或恶念临到；然而，基督的信徒为此呼求基督，魔鬼及其诱惑便消亡。无论人是因软弱、思想、言语、怒火，抑或是肉体的私欲而跌倒，他都向基督祈祷，向祂认罪悔改。当他被沮丧和忧愁所笼罩，压抑了他的心智和内心时，他便开始思想死亡、地狱以及此刻与他同在的上帝，在此略作努力后，他便呼求基督。然后，在争战之后获得平安，他又再次祈求基督怜悯他，赦免他有意和无意的罪过。简单来说，无论是在心灵的争战之时，还是在平安之际，他都投奔基督，基督便成为他一切中的一切——无论是发生在他身上的好事，还是坏事。这样的信徒不会被这种想法所吸引，仿佛他藉着祈祷或取悦上帝而修补了什么，因为他所有的祈祷，其始末皆源于恐惧、痛苦、罪过和悔改。


          因为外在的祈祷有一种理解，而这种内在的祈祷则有另一种理解。那类人（指外在祈祷者），当他履行规定数量的赞美诗时，便仰望上帝；若他停止履行，则自我谴责。而这（指内在祈祷者），因自己每时每刻的罪过（如前所述）被良心责打，并忍受着仇敌诱惑的入侵，持续不断地呼求基督，心中常存这样的格言：「即便你已走过全部的成圣阶梯，仍当为罪孽的赦免而祈祷。」[7]又有：「我宁愿用悟性说五句话，……不愿用方言说万句。」（参：哥林多前书 14:19）。因此，他毫无疑问地实践了圣多萝西所说的话。'
    - type: paragraph
      text:
        ru: 'Святой воспринял это от пророка, ибо тот сказал: «Вот, поскорбел он и отошел печальным, и исцелю пути его» (ср.:Ис. 57, 17–18). Как и Златоуст сказал: «Если только посетуешь о грехах, и то будет тебе превеликим врачеванием». Здесь же не одна только скорбь, но и молитва, и сокрушение, и покаяние, и намерение благое хранить заповеди, воздыхание и исповедание, как и сама молитва на сон грядущим поучает, говоря: «Если именем Твоим клялся или похулил его в помышлении моем, или кого-нибудь укорил, или оклеветал кого-то во гневе моем, или опечалил, или чем-то прогневал», – и прочие воспоминания простительных грехов и невольных, случающихся у обучающихся умному деланию, к которому многие не хотят и очей своих возвести, взирая на таковые повсечасные грехопадения и воображая, что всякому обучающемуся сему священному деланию подобает быть чистым от таковых, чтов реальностине так, как было показано. Иное дело те, кто волею действует по страсти. Так что одни и те же страсти и грехи бывают одному ароматом для жизни, а другому жезапахомк смерти (ср.:2Кор. 2, 16). Ибо первый приходит от них в смирение и познание своей немощи и приносит покаяние, второй же – в ожесточение и погибель вечную от дерзновения своего.'
        cn: 圣者从先知那里领受了这话，因为先知说：「看哪，他忧伤地离开了，我将医治他的道路。」 (参：以赛亚书 57:17-18) 正如金口圣徒所说：「即使只是为罪哀叹，这本身就将是你极大的医治。」在此处，不仅有忧伤，更有祷告、痛悔、悔改，以及持守诫命的善意、叹息和认罪，正如睡前祷告本身所教导的，它说：「若我曾凭祢的名起誓，或在我意念中亵渎了祢，或责备了任何人，或在我的怒气中诽谤了某人，或使人忧伤，或因某种事激怒了人」——以及其他那些可赦免的、非故意的罪，这些罪发生在那些学习心灵祷告（умному деланию）的人身上，许多人甚至不愿将目光投向这操练，因为他们看到了这些时常发生的堕落，并想象所有学习这神圣操练的人都应当洁净无此类罪污，而实际情况并非如所显示的。那些凭情欲而行的人，情况则不同。因此，同样的激情和罪对一些人而言是生命的馨香，对另一些人而言却是死亡的气味 (参：哥林多后书 2:16)。因为前者因这些而变得谦卑，认识到自己的软弱并悔改，而后者则因自己的胆大妄为而陷入刚硬和永远的灭亡。
    - type: paragraph
      text:
        ru: 'Если же кто-то скажет, что возможно и помимо умного делания очиститься от таковых грехов через благодать Христову покаянием, тому повторениемуженаписанного здесь отвечается так: поставь, о таковой, с одной стороны заповеди Христовы, а с другой – вседневную молитву об оставлении нам грехов наших, и дай мне истинное обещание не преступать ни единой заповеди, а именно: не похотствовать, не гневаться, не осуждать, не клеветать, не лгать, праздного не говорить, любить врагов, добро творить ненавидящим, молиться за творящих нам напасти, затем уклоняться от сластолюбия, сребролюбия, блудных помыслов, печали, тщеславия и гордости и просто от всех грехов и помыслов злых, – и с таковымдушевнымрасположением преступи к обучению умному деланию и внимай прилежно, сколько раз всякий день вопреки твоему намерению преступишь заповеди и сколькими грехами, страстями же и злыми помыслами будешь ранен. Подражай же и той вдовице, приступающей к судье день и ночь (см.:Лк. 18,3–5), и начни вопить ко Христу всякий час о всякой заповеди, которую ты преступишь, и о всякой страсти и помысле злом, какими будешь побежден. Прими же к этому и советника доброго – святое Писание. И, проведя достаточное время в таковом, приди и расскажи мне, что увидишь в душе твоей: неужели и сам не признаешь невозможной вещью – вместиться такому вниманию во внешнее моление, помимо единого вмещающего его умного делания? Оно ведь обучает своего рачителя таковым таинствам и извещает душу его, что не нарушает он своего правила, оставляя многое псалмопение, каноны и тропари и все свое тщание обращая на умную молитву, но значительно умножает его.'
        cn: '若有人说，即便不藉着心志功夫，也能借着基督的恩典，通过悔改，洁净自己脱离此类罪恶，对此，此处已写之言可再次如此回答他：


          如此之人啊，你可把基督的诫命置于一方面，把日日求祢赦免我们罪孽的祷告置于另一方面，并向我真诚许诺，不违背任何一条诫命，即：不贪恋，不恼怒，不论断，不诽谤，不说谎，不说闲言，爱仇敌，善待那些恨我们的人，为那逼迫我们的人祷告；然后远避贪图享乐、爱财、邪淫意念、忧愁、虚荣和骄傲，简言之，远离一切罪恶和邪恶意念。你若怀着如此心境开始学习心志功夫，并留心察看，你每天会违背诫命多少次，即便并非出于本意，又会被多少罪恶、情欲和邪恶意念所伤。


          你要效法那日夜求告法官的寡妇（参：路加福音 18:3-5），并开始时刻向基督呼求，为你所违背的每一条诫命，也为你所被战胜的每一份情欲和邪恶意念。除此之外，也要接受一位良善的顾问——圣经。


          这样经历一段时间后，来告诉我，你在你的灵魂中看到了什么：你自己难道不会承认，若非这唯一能容纳它的心志功夫，如此的专注是不可能容纳在外在的祷告中的吗？因为它教导其热心寻求者此类奥秘，并使其灵魂确知，他并非违背了自己的功修，即便他撇下许多诗篇诵读、颂歌和短颂，将他所有的努力都转向心志祷告，反而极大地增添了他的功修。'
    - type: paragraph
      text:
        ru: Ведь как у Закона вся сила и стремление состояли в том, чтобы всех приводить ко Христу, хотя и кажется, что он Им умаляется, так и многое пение отсылает делателя к умной молитве, а не на всю монашескую жизнь простирается. И самый ведь опыт в этом учит, когда, таким образом молясь, познаем мы наличие некоей преграды между нами и Богом, словно стену медную, по пророку (см.:Иер. 1:18, 15:20), не допускающую уму нашему взглянуть ясно в молитве на Бога, ни также внимать сердцу, в котором все силы душевные вместились и источник помыслов и благих, и злых. А поскольку эта святая книжица великой осторожности хотящих безмолвствовать научает и причины прелести находящей обнажает, потому, отсылая туда читателя, лишь это скажем.
        cn: 就像律法的一切力量和志向都在于将所有人引向基督，尽管他似乎被基督所贬抑，同样，许多歌咏将修道者引向心祷，而不是贯穿整个修士生活。实践本身也教导我们这一点，当我们如此祷告时，便会认识到我们与上帝之间存在着某种阻碍，仿佛先知所说的铜墙（参：耶利米书 1:18，15:20），不允许我们的心智在祷告中清楚地瞻仰上帝，也不允许专注于内心，那里面蕴含着所有的灵魂力量，也是善恶意念的源头。而因为这本圣洁的小册子教导那些寻求静默的人极大的谨慎，并揭示出所遇到的迷惑的原因，因此，我们在此将读者引向该书，仅作此言。
    - type: paragraph
      text:
        ru: Святые отцы на три только чина разделяют все монашеское жительство. Первое – общеежитие. Второе царским путем, или средним называют, то есть, вдвоем или втроем живя, иметь общее стяжание необходимого, общую пищу и одежду, общие труд и рукоделие и всякую промышление житию имети, над вся же сия, отсекающе свою волю, повиноватися[8]друг другу в страсе Божий и любви. Третие же – уединенное отшельство, еже есть совершенных и святых мужей дело.
        cn: 圣教父们将整个修道生活只划分为三种品级。第一种是共同生活。第二种被称为君王之道，或中庸之道，也就是说，两三人一同生活，共同拥有必需品，共同的饮食和衣物，共同的劳作和手工，并为生计作一切筹划；而在这这一切之上，要舍弃自己的意志，在敬畏上帝和爱中彼此顺服[8]。第三种则是隐居独修，这乃是完美和圣洁之人的事工。
    - type: paragraph
      text:
        ru: А ныне некоторые, не внимая смыслу святого Писания, изобрели себе – ни по воле, ни по преданию святых отцов – четвертый чин, или житие. Ибо строя кельи всякий где только хочет, вдалеке или поблизости, живут уединенно, всякий свою волю предпочитая и стяжание с попечением добывая, и прочее. И по таковому их чину и жительству уподобляются они отшельникам; по определению же святых отцов и грозному запрещению всем недугующим душевными страстями и дерзающим отшельнически единоборствовать с бесами, подобны они самочинникам и самопретыкателям. Сами ведь себе изобретятакоежитие, сами в нем и претыкаются, не будучи способны мирно и постоянно в нем пожить как не в своей для них мере и степени.
        cn: 但如今，某些人，不留心于圣经之真义，既非出于圣父们的意愿，也非出于他们的圣传，为自己发明了第四种修道方式，或曰生活。因为他们各自随心所欲地建造小室，无论远近，隐居度日，各自偏爱自己的意志，并以挂虑的心获得财物，等等。按照他们这样的修道方式和生活，他们与隐士相似；然而，按照圣父们的定义，并根据他们对所有被精神情欲所困扰之人以及对那些胆敢独自行隐修生活与魔鬼争战之人所发出的严厉禁令，他们就像是自作主张者和自取跌倒者。他们为自己发明了这样的生活，却也在其中自取跌倒，无法在其中平静而持久地生活，因为这并非适合他们的尺度和程度。
    - type: paragraph
      text:
        ru: 'Просматривающий же трудолюбиво книгу святогоГригория Синаита, найдет там не что иное, как название самочинием и единоборствомтакогоуединенного и необщительного жительства. И автор жития этого святого специально показывает, что никому из учеников его не допустил он жить в келье одному, поблизости ли, или вдалекеот других, но, в трех лаврах и двух башнях множество иноков старых и юных собрав, дал он им чин отсечения воли и послушания. И всех их поучал он умному деланию, говоря: «Научить иных не всегда легко, номожно научить дажегрубых и некнижных,тольконастоящих послушников, поскольку послушание всем добродетелям причастно благодаря смирению. Непокорным жеобучениене дается, да не прельстятся, – грубы ли они, или разумны. Ибо самочинник не может избежать самомнения»,[9]– и прочее.'
        cn: 凡勤恳查阅圣西乃的格里高利的著作者，便会发现，此种隐居独处且不与人交往的生活，正是被称为任意妄为和独自争战。而这位圣者的列圣传记作者特意指出，他绝不容许他的任何一位门徒独自住在小室，无论是靠近还是远离他人；但他却在三座修道院和两座塔楼中，聚集了众多年长和年轻的修士，并赐予他们舍弃己意和顺服的规程。他教导所有这些修士修习「心行」，并说道：「教导他人并非总是易事，但甚至能教导粗鄙无知和未受教育之人，只要他们是真切顺服的人；因为顺服因着谦卑而与一切美德相连。至于不顺服之人，则不给予教导，以免他们受诱惑——无论他们是粗鄙无知，还是聪慧。因为任意妄为者无法避免自负自大。」[9] —以及其他训诫。
    - type: paragraph
      text:
        ru: И сам же этот блаженный старец Нил многие и страшные слова изрек в адрес уединенно жить хотящих, пребывающих страстными, и, весьма похвалив царский путь, говорит,  что этот чин и устав существует в Святой горе Афонской, где доныне самое и древнее и новое построение келий, как живой образ, всем указывает царский путь. Будь то келии с церковью, или хижины вдали от церкви, все они на двоих или на троих, а не на одного вместимость имеют.
        cn: 这位真福长者尼尔本人，针对那些欲隐居而仍身陷情欲之人，发出许多严厉之语；同时，他极力称赞君王之道，并言道：这套规程与定制存在于阿索斯圣山，在那里，直到今日，无论是古老还是新建的修道室，都作为活生生的典范，向所有人昭示着君王之道。无论是附带教堂的修道室，还是远离教堂的小茅屋，它们都可容纳两人或三人，而非仅供一人居住。
    - type: paragraph
      text:
        ru: 'Если бы это царский путь был – особо каждому жить поблизости или вдалекеот других, какая нужда или потребностьбыла быдвух или трех вспоминать? Ведь по этому мнению, либо два, или три, или множество будет, все это одно и то же, ибо всякий свою волю и разум при себе имеет. И этого жития пример и изображение – тот юный брат, что, поселившись один в келье, отвечал вопрошающим: «Вот, я уже отшельничаю». И, выведя его из кельи, отцы повелели ему, всех обходя, просить: «Простите меня, отцы, потому что я не отшельник». После этого сказали старцы: «Если видишь юного восходящим на небо, схватив за ноги, сдерни его на землю».'
        cn: 如果这是君王之路——每个人独自生活，无论与人或远或近，那又何必顾及两三人呢？毕竟，按照这种观点，无论是两个人、三个人，还是许多人，都并无二致，因为每个人都保有自己的意志和理性。这种生活的榜样和写照，便是那位年轻的弟兄。他独自住在小室里，回答询问他的人说：「看哪，我已隐修了。」众教父于是把他带出小室，吩咐他一一向众人请求：「请宽恕我，众教父，因为我不是隐修者。」之后，长老们说：「如果你看见一个年轻人升向天堂，就抓住他的双脚，把他拉回地上。」
    - type: paragraph
      text:
        ru: 'Но что означают слова говорящих: «Чтобы ни прогневать, ни прогневаться на брата, уклонюсь от празднословия и осуждения, живя наедине»? – А знаешь ли, друг, что то, что ты сказал и подобное этому, скорее, смиряет и посрамляет человека, а не возвышает? Как сказали отцы, в юности полезно падать, тщеславие же, самомнение, лукавство и подобное им надмевают и делают напыщенными. Потому лучше, живя с братом, познавать свою немощь и меру и об этом, себя укоряя, молиться, каясь перед Господом, и очищать себя вседневною благодатью Христовою, как уже об этом сказано, нежели тщеславие и самомнение с лукавством внутрисебянося, прикрывать и питать уединенным житием то, отчего ни следа уединенного безмолвия увидеть невозможно, как учит Лествичник со всеми великими отцами.'
        cn: 但是那些说这话的人是什么意思呢：「为了不冒犯弟兄，也不被弟兄冒犯，我将避开闲谈和论断，独自生活」？——朋友啊，你可知道，你所说的以及类似的话语，更可能使人谦卑和羞愧，而非使人升高？正如教父们所说，在青年时期跌倒是有益的，而虚荣、自负、诡诈以及类似的心态，却使人骄傲和自大。因此，更好的是，与弟兄一同生活时，认识自己的软弱和限度，并为此责备自己，向上主忏悔和祈祷，正如已提及的，通过基督每日的恩典洁净自己，而不是内怀虚荣、自负和诡诈，借由隐修生活来遮掩和滋养那些使人无法看到隐修静默丝毫痕迹的东西，正如《天梯》作者和所有伟大教父们所教导的。
    - type: paragraph
      text:
        ru: Да и само это уединенное житие немалый вред обычно причиняет страстному. «Безмолвие ведь, – сказал Варсонофий Великий, – дает приносит высокоумия».
        cn: 况且，这独居生活本身通常就会给为情欲所困者带来不小的损害。「因为静默，」——大瓦尔萨努菲说——「会生出自高自大。」
    - type: paragraph
      text:
        ru: Самое ведь общительное житие одними только заповедями Христовыми подает иноку усердие во всяком деле, чему и сопротивляется сатана, поскольку самолюбие и пристрастие не могут вместиться здесь, чтобы насильствовать и допускать поджигательству вражию переходить от дела в дело и от попечения в попечение у всякого страстного, живущего уединенно.
        cn: 毕竟，至为共融的生活，唯独凭藉基督的诫命，赐予修士在一切事上的热忱，撒旦也正为此而抵挡；因为自爱和偏执无法在此容身，以致它们不能强行施加影响，也不能任由仇敌的煽动在每一个独居且有情欲的人身上，从一件事到另一件事，从一桩挂虑到另一桩挂虑地蔓延。
    - type: paragraph
      text:
        ru: 'Чудо воистину преужасное среди таковых нынешних времен увидено было. Оставив ведь свое уединение и приобщившись к братии, не имеющей «твоего» или «моего», называемого отцами «пекло лукавого», где им, прежде по своей воле делавшим для своих приобретений каждый день рукоделие многое и не ограниченное числом, было установлено только то числом делать, что они ежедневно для себя делали; они же с унынием сказали: «Это нам тяжело». Когда же еще на половину снизили им задание, они на это сказали: «Это возможно». Будучи же изобличаемы и вопрошаемы, отвечали они, что, когда сам на себя делаешь, это подает некое усердие и ревность, здесь же вместо тех растут ропот и леность. Так что истинно говорится, что всякий, общежительно вдвоем или втроем живущий, самим сожитием освобождается от самолюбия и пристрастия и одними заповедями Христовыми должен подвигать себя на всякое дело. А без такого поучения и веры он считает себя рабом или наемником, лишаемым платы и невыносимую жизнь ведущим.'
        cn: 诚然，在现今这样的时代中，竟可见到一个极其可怖的奇迹。他们放弃了自己的隐修生活，并加入到弟兄们中间，那里没有「你的」或「我的」之分，被教父们称作「邪恶地狱」；在那里，他们以前每日按自己的意愿为自己的所得做许多手艺活，且数量不受限制；如今却被规定只做他们每日为自己所做的那份，且数量相同；他们却愁苦地说：「这我们承受不了。」当他们的任务再被减去一半时，他们对此说：「这有可能。」当他们被指责并质问时，他们回答说，当人为自己做工时，这就会激发某种勤勉与热忱，而在这里，取代那些的，却是抱怨与懒惰的滋生。因此，诚然有言说，凡是两人或三人一同过共同生活的人，单单借着共同生活就从自爱与偏私中得到解脱，并当单单藉着基督的诫命，激励自己去行一切善工。若无此等教导与信仰，他就会将自己视为被剥夺工钱的奴隶或雇工，过着无法忍受的生活。
    - type: paragraph
      text:
        ru: Как в одиночестве живущему немощному и страстному поджигателями и побудителями на всякое дело внешнее бывают самолюбие и пристрастие, так живущему в общежитии одни заповеди, или Христос, возбуждают усердие к деланию, случающемуся в житии их. Потому нужно и должно нам, страстным, царского пути держась, вдвоем или втроем безмолвствовать, да и прельщения избежим, самолюбию и пристрастию не поработимся и порока самочинства избудем; вместо же всех таковых обретем удобную стезю и отверстую дверь к выполнению заповедей Христовых и обучению умному священнодейству.
        cn: 犹如住在独处的、软弱并为情欲所困的人，自爱和贪恋会成为煽动与驱动者，促使其从事一切外在事务；同样，对于住在共同生活团体中的人，唯有诫命，或基督，激发起他们对其生活中所遇之事的修行的热忱。因此，我们这些受情欲捆绑的人，有必要且理当持守王道，二人或三人一同静修，得以避免诱惑，不为自爱和贪恋所奴役，并免除擅自行事的恶习；相反地，我们必将寻得一条便利的途径和一扇敞开的门，通往遵行基督诫命和学习心智圣祭的境界。
    - type: paragraph
      text:
        ru: В уединение и пустыню, как сказал святой Кассиан, никто да не пожелает, но пусть идет только «совершенный и от всякой страсти очищенный, кто до конца, в собрании вместе с прочими живя, все свои неправды выварил и оттряс. Вот этот туда идти может, и то не от малодушия и от усердия убегая, но чтобы стяжать божественное зрение, желая совершенного и светлого видения Господа Бога. Ибо это бывает достижимо в уединении только для совершенных. Всякие же страсти неуврачеванные если инок с собою занесет в пустыню, только покрытыми в нем пребудут, а не истребленными. Ибо пустыня только исправленный нрав имеющим может открыть вход к радостному созерцанию и исполнитьихвидением светлых духовных таинств. У всех же тех, кто в своих нравах неисправлен, она не только сохраняет злобу, но и в худшую обращает или преумножает. И дотоле инок будет казаться имеющим терпение, пока к нему в сообщество никто не приходит, а когда он получает для нее причину, тут же к прежнему своему обычаю возвращается. Ибо тогда пробиваются потаенные страсти и, словно кони необузданные и от долгого стояния утучневшие, быстрейшим образом всадника своего к беде они своего понесут.
        cn: 至于隐修与旷野，正如圣卡西安所言，愿无人向往，唯有「达到完全境界，并从一切情欲中洁净者」方可前往，即「那与众人共处时，已将自己的所有不义彻底熬尽并抖落干净者」。这样的人方可前往，而且并非出于怯懦或逃避勤劳，而是为了获取属神的洞察力，渴望得见上主上帝完全而明亮的异象。因为这唯有在隐修中才能为达到完全境界者所实现。至于一切未得医治的情欲，若修士将其带入旷野，只会在他里面被遮蔽，而非被根除。因为旷野唯有对品格已修正者，方能开启进入喜乐默观之门，并使其充满明亮的属灵奥秘之异象。至于所有品格未修正者，旷野不仅会保留其内心的恶念，还会使其恶化或增多。只要无人前来与他共处，修士便看似具有忍耐力；而当他获得其发作的缘由时，便立刻回到他先前的习性。因为那时，隐藏的情欲便会迸发出来，并且，如同未经驯服且因久立而肥壮的马匹，会以最快的速度将它们的主人载向祸患。
    - type: paragraph
      text:
        ru: Потому что, если учение и наставление братское нами отвергается, то прорастают в нас дикие злобы, буде они не выполоты. И та тень терпения, какую, с братией вместе живя, мы хранили – ради ли почести от них, или боясь срама и соблазна, – когда становимся беспечными, от нерадения погибает у нас. Как всякий ведь змей ядовитый или лютый зверь, когда в пещере или в гнезде таится и скрывается, не остается ли лют и вредоносен? Однако в то время не вредит и не знает меры своей, незлобив ли он или зол, потому что не имеет перед собой никого, чтобы укусить. И это не от доброго характера змиева, но место пустынное и безлюдное не позволяют ему соделать зло. Когда же обретает время для вреда, тогда сокровенный яд и горькую злобность он из себя изливает. Так что ищущим совершенства недостаточно на людей только не гневаться. Вспомним то, как, живя в пустыне, и на перо, которое для дела толсто или тонко было, также и на топор тупой и не быстро рубящий ветви, а также на кремень, когда торопились на соборное пение, а он не сразу искры огненные испускал, так горько мы гневались, что из-за этого, смутившись мыслью, не только немое творение, но и самого демона проклинали. Так что для достижения совершенства недостаточно просто не жить с людьми, на которых гневаемся, потому что, если прежде не обретем в себе терпения, и на бездушные и немые вещи по малой причине разгневаемся».[10]
        cn: 因为，如果我们拒绝兄弟的教导和训诲，那么野生的恶意就会在我们里面滋长，如果它们不被拔除。而我们所持守的那份忍耐的影子，是我们与兄弟们同住时所持守的——无论是为了从他们那里得到的尊敬，还是害怕羞耻和绊跌——当我们变得疏忽时，就会因不殷勤而从我们这里消逝。正如任何有毒的蛇或凶猛的野兽，当它藏匿于洞穴或巢穴中时，难道它就不再凶猛和有害了吗？然而在那时候，它不伤人，也不知道自己是无恶意的还是凶恶的程度，因为它面前没有任何可咬的对象。而这并非出于蛇的良善本性，而是荒凉无人的地方不允许它作恶。然而当它找到作恶的时机，它就会倾泻出隐藏的毒液和苦涩的恶意。因此，追求完美的人仅仅不对人发怒是不够的。让我们回想一下，在旷野生活时，我们曾对那或粗或细、不合用处的羽毛笔发怒，也对那迟钝且不能迅速砍伐树枝的斧头发怒，还有，当我们急着去参加集会礼拜却点不着火的燧石，我们是如此苦毒地发怒，以至于因此，思绪混乱，我们不仅咒骂无言的受造物，甚至咒骂魔鬼本身。因此，为了达到完美，仅仅不与我们发怒的人同住是不够的，因为如果我们事先不在自己里面获得忍耐，那么我们也会因小事而对无生命、无言的物件发怒。」[10]
    - type: paragraph
      text:
        ru: 'Говорит ведь святой Лествичник: «Кто, душевною страстью недугуя, безмолвие начинает, подобен в пучину с корабля соскочившему и на доске земли безбедно достичь надеющемуся. А кто с похотью борется, к тем в свое время безмолвие приходит, если они имеют наставляющего. Уединение ведь ангельской крепости требует».[11]И еще: «Ибо безмолвие неискусных удавляет».[12]'
        cn: 圣阶梯者曾说：「凡为灵魂的私欲所困扰，却开始静默的人，如同从船上跳入深渊，却希望靠着一块木板安然抵达陆地之人。而那些与情欲争战的人，若他们有指导者，静默便会在适当的时候临到他们。因为独处需要天使般的刚毅。」[11] 他又说：「因为静默会扼杀缺乏经验者。」[12]
    - type: paragraph
      text:
        ru: '«В трех главных устроениях все иноческое житие содержится: в страдальческом отшельничестве и уединении; или с одним, или, много, с двумя безмолвствовании; или в общем житии терпеливом сидении.«Не уклоняйся, – сказал Екклезиаст, –ни направо, ни налево»(Притч. 4, 27), но путем царским иди. Ибо средний из перечисленныхпутейдля многих был подходящим. Одному же горе, если он впадет в уныние или сон, или разленение, или отчаяние, нет воздвигающего его среди людей (ср.:Еккл. 4, 10). А«где два или три собраны во имя Мое, там Я посреди них», – сказал Господь (Мф. 18, 20)».[13]"Не такспасаетсяинок, каккогдаинокпомогаетиноку",[14]– т. е. не так спасается от преткновения уединенный, как имеющий другого инока с собою.'
        cn: 「修道生活的全部内容，都包含于以下三种主要规制之中：在受苦的隐修与独处中；或与一人，或最多与二人共同静修中；或在共生生活中耐心坐守中。『不可偏离左右，』传道者说（箴言 4:27），却要行在康庄大道上。因为所列举的这些道路中，居中的那条对许多人来说是适宜的。独自一人就祸哉，若他陷入忧郁、或沉睡、或懒惰、或绝望，便没有人在他中间能将他扶起（参阅传道书 4:10）。『因为无论在哪里，有两三个人奉我的名聚会，那里就有我在他们中间，』主说（马太福音 18:20）。」[13]「修士得救，并非独力完成，而是修士帮助修士。」[14]——也就是说，独处的修士，其得救脱离跌倒，不如身边有另一位修士者。
    - type: paragraph
      text:
        ru: Слышал я, навестив, мужа безмолвствующего, как ястреба в клетке от горести и ярости в себе бранившегося и на лицо, словно тут бывшее, опечалившее, наскакивавшего, и я им благочестно советовал не сидеть особняком, да не станут из людей бесами.
        cn: 我曾听说，在拜访时，一位沉默寡言的男子，像笼中之鹰一般，因心中的悲痛和狂怒而咒骂自己，并扑向那仿佛在场、令其悲伤的面容。于是我虔诚地建议他们不要独坐离群，免得他们从人变为魔鬼。
    - type: paragraph
      text:
        ru: Эти писания святых отцов вспомнились здесь немного ради того только, чтобы показать не вызывающим сомнений образом царский не грозящий падением путь, о котором пишут древние и последних времен отцы, хваля житие вдвоем или втроем. Ибо показалось некоторым, что жить, не общаясь, поблизости или вдалидруг от другав своих кельях особо, выходить временами на совет – это и есть путь средний и царский. Но не так это, не так! Ибо всякое сидение без общения, поблизости ли, или далекодруг от другабудут кельи, не есть мера этого среднего пути, но отшельническое это житие и единоборство с бесами, как то было при обители святого Герасима на Иордане. И в таком житии в древности и ныне многое множество страстных и немощных повредилось. Того ради повелевают святые жить вдвоем или втроем общежительно, чтобы, друг другу в страхе Божием повинуясь, познавали мы свою немощь.
        cn: 这些圣教父的著作在此略为引述，仅为以毋庸置疑的方式，显明古时及近代教父们所论述并称赞的、二人或三人共居的稳固不坠的君王之道。因为有人以为，不相交通地，各在自己的隐室中独自居住，无论彼此远近，有时则出来寻求建议——这便是中庸之道与君王之道。但并非如此，并非如此！因为凡是彼此不相交通的独居，无论隐室彼此相近或相远，都不是这中庸之道的标准，而是隐修生活和与邪魔的搏斗，一如约旦河畔圣格拉西姆修道院所行的。在这种修道生活中，古时和现在，许多有情欲的和软弱的人都遭受了损害。为此，圣人谕令二人或三人共同生活，以便我们能彼此在敬畏上帝中顺从，并认识到自己的软弱。
    - type: paragraph
      text:
        ru: 'Ведь когда двое сойдутся жить общежительно и положат себе за правило, будь то духовное или телесное делание, только по силе своей и по необходимой потребности, а не излишнее, ни несвоевременное, главное же – по рассуждению писаний святых отцов начинать; затем, когда помыслит один о каком-либо деле или выходенаружуи скажет брату своему об этом, а тот рассудит, что делоэтонесвоевременное или ненужное, и несоизволитсогласиться на это; брат же тогда, видя доброе рассуждение его и не настаивая на своем помысле и разуме, повинуется его совету, как имеющего свидетельство из Писания, – не это ли будет отсечение своей воли и духовный совет? И наоборот: когда усмотритвторой, что соответственно потребности и вовремя сказал ему это брат, и согласится с его рассуждением и желанием, не будет ли это означать, что второй отрекся от своей воли и повиновался совету брата?'
        cn: 当两人共同生活在一起，并定下规矩，无论是属灵的还是身体的操练，都只依循自己的能力和必要的需求，而非多余的，也不是不合时宜的，最主要的是，要依照圣教父著作中的论断来开始；接着，当其中一人想到某事或外出，并告诉他的弟兄，而那弟兄判断此事不合时宜或不必要，且不同意此事；那弟兄看到他的良好判断，且不坚持自己的想法和理性，服从他的建议，仿佛那建议有圣经的见证，——这不正是克己意和属灵的建议吗？反之：当第二人看出弟兄对他所说的是符合需求且适时的，并同意他的判断和意愿，这不就意味着第二人舍弃了自己的意愿并服从了弟兄的建议吗？
    - type: paragraph
      text:
        ru: 'И так во всяком деле и начинании: когда тот, когда другой отсечением своей воли подавая добрую весть начинанию брата, или сам принимая это от брата, научаются они доброму и не грозящему падением житию, имея готовность и твердую веру в то, что это великое приобретение для своей души, отсечь свою волю перед братом во всяких делах, в которых не видится беда душевная и преступление заповедей Христовых. Если же иногда от непонятливости своей соскользнет кто в прекословное оправдание, то, веруя, что это падение его души, обращается к Богу и к брату с покаянием, получает прощение вседневной благодатью Христовой. Ибо как человек пал он и встал, нисколько не сомневаясь.'
        cn: 在每件事和每个开端中亦是如此：无论是这一位还是那一位，藉着舍弃自己的意愿——或肯定弟兄的开端，或自己从弟兄那里接受（提议）——他们便学会了良善的、不致跌倒的生活。他们怀着预备好的心和坚定的信心，相信在凡不见灵魂祸患和不违犯基督诫命的诸事上，在弟兄面前舍弃自己的意愿，是对自己灵魂巨大的益处。倘若有时，有人因着自己的不明事理，失足陷入争辩的开脱，那么，他相信这是他灵魂的跌倒，便带着悔改转向上帝和弟兄，藉着基督日复一日的恩典获得赦免。因为他像人一样跌倒又站起，丝毫没有怀疑。
    - type: paragraph
      text:
        ru: И это – путь царский, не грозящий падением, а не тот, чтобы жить особняком.
        cn: 而这便是王道，不致跌倒，而非离群索居。
    - type: paragraph
      text:
        ru: ПРИСТЕЖЕНИЕ
        cn: 系联
    - type: paragraph
      text:
        ru: 'Еще же этот блаженный старец наш Нил, определяя среднюю меру пищи и питья, заимствует из СловаГригория Синаита, – что всякому, желающему обрести Бога, подобает вкушать все сладостное с воздержанием. Это «сладостное» у многих вызывает недоумение: семена ли это, или овощи, или масло и рыба?'
        cn: 再者，我们这位蒙福的长老尼尔，在界定食物和饮品的适中程度时，引用了西奈的格里高利的话——凡渴望寻得上帝之人，都应以节制之心享用一切甜美之物。这「甜美之物」令许多人困惑不解：究竟是指籽粒、蔬菜，还是油和鱼呢？
    - type: paragraph
      text:
        ru: 'Однако кажется, что это слово не о семенах и травах или об овощах и меде, ибо это постная и нежирная пища, от которой никто никогда не воздерживался; но, несомненно, подразумеваются рыба, масло и вино. Это недоумение может разрешиться словами епископа Ираклида, говорящего так: «С разумом вкушающий брашен и с разумом избегающий их никак не погрешит. Ибо праведный, – сказал он, – закону не подлежит».[15]Лучше ведь с умом пить вино, нежели с дерзостью воду. Взгляни на мужей, с благочестивым разумом пьющих вино, святыми бывших, и на безрассудно с гордостью пьющих воду, людей скверных и растленных. И впредь не брани и не хвали материю пищи и пития, но восхвали или укори разум хорошо или плохо принимающих их. Поносили некогда иудеи Господа из-за апостолов, говоря: «Почему ученики Твои не постятся, как Иоанновы?» (ср.:Мф. 9, 14;Мк. 2, 18;Лк. 5, 33), – и еще на учеников нападали и, укоряя, говорили:«Учитель ваш с мытарями и грешниками ест и пьет»(Мф. 9:11;Мк. 2, 16) (не к хлебу и вину придирались ведь уже, если не к чему-то вареному и вину, те, кто укоряет за питие вина и восхваляет питье воды). Отвечал же Спас:«Пришел Иоаннпутем правды,не ест, ни пьет(имеется в виду – мяса и вина, ибо без иного жить не мог бы),и говорят: в нем бес. Пришел и Сын Человеческий, ест и пьет, и говорят: вот человек, который любит есть и пить вино, друг мытарей и грешников»(ср.:Мф. 11:18–19;Лк. 7, 34–35). И что же нам делать? Да не последуем ни укоряющим, ни восхваляющим. С Иоанном ли разумно будем поститься, хоть и скажут: «В вас бес», или с Иисусовым разумом будем пить вино, хоть и скажут: «Эти люди обжоры и винопийцы»?'
        cn: '然而，这话说得似乎不是关于种子和草药，或蔬菜和蜂蜜，因为这些是斋戒和不含脂肪的食物，从没有人禁戒过这些；但无疑，这里指的是鱼、油和酒。这种困惑可以通过希拉克利德主教的话语得到解决，他如此说：「有智慧地享用食物，并有智慧地避免食物，绝不会犯错。因为义人，」他说，「是不在律法之下的。」[15]毕竟，最好是有智慧地饮酒，而不是鲁莽地饮水。看那些以虔敬的智慧饮酒，成为圣人的人；再看那些愚蠢地、骄傲地饮水，却是污秽堕落之徒。从今以后，不要责骂，也不要称赞饮食的物质本身，而要称赞或谴责那些好好或不好接受它们的人的智慧。


          曾几何时，犹太人因使徒的缘故，诋毁上主，说：「祢的门徒为何不像约翰的门徒那样禁食呢？」 (马太福音 9:14，马可福音 2:18，路加福音 5:33) — 他们还攻击门徒，谴责说：「你们的老师与税吏和罪人一同吃喝！」 (马太福音 9:11，马可福音 2:16) （那些谴责饮酒并赞扬饮水的人，所挑剔的难道不是熟食和酒，而非仅仅是饼和酒吗？）救主则回答说：「约翰来了，行公义之道，不吃不喝（指不吃肉不饮酒，因为若无其他食物便无法生存），人们却说：他被鬼附着了。人子来了，又吃又喝，人们却说：看哪，这是个贪食好酒的人，是税吏和罪人的朋友。」 (马太福音 11:18-19，路加福音 7:34-35) 那么我们该怎么办呢？我们既不应追随那些谴责的，也不应追随那些称赞的。难道我们应该有智慧地与约翰一同禁食，即使他们会说：「你们被鬼附着了」，还是应该有耶稣的智慧去饮酒，即使他们会说：「这些人是贪食者和好酒之徒」？'
    - type: paragraph
      text:
        ru: 'Но когда всякий из сластолюбивых или как-либо согрешающих говорит: «С верою вкушу пищу», – или иное что-то делая по безрассудному желанию или с растленною совестью, не верою он утверждается. Спас ведь заповедал от плодов тех распознавать. Плод же божественным словом живущих, духом и разумом –«любовь, радость, мир, долготерпение»(Гал. 5, 22), кротость и воздержание. Вообще же для здравствующей плоти следует избегать утучняющего, немощной же или больной, или печалям и напастям подвергающейся надо подавать пищу и питие как напиток целебный для врачевания печалей, да отступит от того, что вредит душе: гнева, зависти, тщеславия, клеветы и самомнения.'
        cn: 然而，当任何贪爱享乐者或以某种方式犯罪者说：「我凭着信心享用食物」，——或出于鲁莽的欲望、带着败坏的良心做其他事时，他并非以信心为根基。救主确曾吩咐要凭他们的果子认出他们。而凭着神圣之道、在灵与理智上生活的人的果子，就是「仁爱、喜乐、和平、恒久忍耐」(加拉太书 5:22)，温柔和节制。总的来说，对于健康的肉身，应当避免使肉身肥腻之物；然而，对于软弱的或生病的，或遭受悲伤和苦难的，需要供给食物和饮品，作为治愈悲伤的良药，好让她能远离伤害灵魂之事：愤怒、嫉妒、虚荣、诽谤和自负。
    - type: paragraph
      text:
        ru: Отсюда ясно, что, по Иоаннову равноангельскому житию, травы, овощи, сухой хлеб и вода есть пища сухая. По Христову же богомужному житию, семена, масло, рыба и вино есть пища сладостная. Их ведь Христос не заслуживающим упрека образом прежде страдания, как и по восстании Своем, вкушал. Об этих сладостных снедях ясно говорится и в житиях преподобных отцов Симеона Юродивого и Иоанна, брата его. Ведь они принесенную ангелом пищу – светлый хлеб, рыбу и вино – ели и пили с неким христолюбцем, посетившим их в пустыне. Оттого и святойГригорий Синаитсладостной назвал такую снедь, какую вовремя и с разумом вкушают во славу Божию. Другие же, погрешая против правого разума, с распущенностью и сластолюбием ее принимают. Иные же, тоже неверием и малодушием недугуя, воздерживаются от них, воображая, что таковые пища и питие служат помехой для достижения совершенства.
        cn: 由此可见，根据约翰（施洗者约翰）如同天使般的生平，青草、蔬菜、干粮和水是干食。而根据基督那神人智慧般的生平，谷物、油、鱼和酒是甜美之食。因为基督在祂受难前，以及在祂复活后，都以无可指摘的方式享用过这些。关于这些甜美之食，在可敬的教父们——圣愚西缅和他的兄弟约翰的生平中也清楚记载。因为他们曾与一位拜访他们在旷野的爱基督者一同饮食了天使带来的食物——光洁的饼、鱼和酒。因此，圣格列高利·西奈特将那种在合宜的时间并以理智、为了上帝的荣耀而享用的食物称为甜美的。而另一些人，则违背了正确的理性，放纵而贪食地接受它。还有一些人，也因不信和胆怯而病态地禁戒这些，幻想这样的食物和饮品是达到完美的障碍。
    - type: paragraph
      text:
        ru: 'Хотя между жизнью ИоаннаПредтечии Христа нет противоречия, однако рассудительные отцы не столько из-за телесной немощи нашей, сколько из-за душевной, учат больше подражать Христову богомужнему житию, нежели Иоаннову равноангельскому. Как страсти, по Лествичнику, одни смиряют нас, а другие возвышают, так и добродетели могут немощных и смирять, и надмевать. Ибо один недугует страстью самомнения и лукавства, а другой – блуда и сластолюбия. И для первого безмерный пост – масло, на огонь возливаемое, для второго же разрешение – согревание змеи за пазухой. Врачевание этому –умеренное и рассудительное употребление съестного, как сказалВасилий Великий: «Ничем не отличается от постящегося принимающий пищу в меру. Не только пост, но и всегдашнее неядение исполнил таковой благорассудительным попечением о теле». «И да не укоришь за это, всяких укоров исполненный ревнитель, – сказал святой Кассиан, – потому что, хотя безмерный пост и распущенность оба суть от дьявола, однако безмерное и безрассудное воздержание больший вред приносит, нежели до сытости ядение». Не в яму ведь нас святые отцы сталкивая, но дальше от ямы удаляя, повелевают нам средним путем идти, а на высокий несвоевременно не устремляться.'
        cn: 尽管施洗约翰和基督的生平之间没有矛盾，然而明智的教父们，不单是因着我们肉体的软弱，更是因着我们灵魂的软弱，教导我们更多地效法基督的神人生活，而非约翰那近似天使的生平。正如《天梯》的作者所言，有些情欲使我们谦卑，另一些则使我们高傲，同样，德行也可能使软弱之人或趋于谦卑，或流于骄傲。因为有人患有自高自大和狡猾的情欲，而另一些人则患有淫乱和贪食的情欲。对于前者，无节制的禁食犹如火上浇油；而对于后者，解除禁食则如同怀中暖蛇。解决之道在于适度而明智地摄取食物，正如大巴西尔所言：「适量进食者与禁食者并无二致。不仅是禁食，此人也藉着对身体的明智照料，完成了终身的节制。」「各种指责缠身的狂热者啊，你切莫因此事而指摘他人，」圣卡西安说道，「因为，尽管无节制的禁食和放纵都源于魔鬼，然而，无节制且不明智的节制所造成的损害，甚于饱食。」圣教父们并非将我们推入坑中，而是将我们进一步远离坑穴，吩咐我们走中庸之道，而不要不合时宜地追求高深的境界。
    - type: paragraph
      text:
        ru: 'И сами ведь они, пройдя жизнь вышеестественную, разные, иным совершенно недоступные разумения стяжали, каковыми и были подвигаемы на высокие пост и труды. Что как пример приведем? Ведь некоторые из них удручали свою плоть злостраданием ради одной любви Христовой, подражая Его добровольному ради нас страданию, каковым был старецПахомия Великого, который никогда не вкушал ни вареного, ни масла, ни вина, говоря: «Христос меня ради распялся и вкусил желчи, так я ли приму масло и вино в уста мои?»[16]Иные же за грехи свои пост и безмерные труды понесли, как-то: Мария Египетская, Пафнутий и подобные им. Многие же целомудрия и бесстрастия ради постились. Некоторые же, по обету родившиеся и от чрева матери посвященные Богу, вышеестественные труды и пост понесли, как-то: великий чудотворец Николай, Феодор Сикеот и иные таковые.'
        cn: 他们自己，在经历过超乎自然的生活后，获得了各种各样、他人完全无法理解的领悟，并因此被推动去进行高强度的禁食与苦修。我们可以举什么例子呢？事实上，他们中的一些人仅仅是为了基督的爱，以苦行折磨自己的肉身，效法祂为我们所受的甘愿苦难。例如伟大的长老帕科米亚，他从未尝过煮熟的食物、油或酒，他说：「基督为我被钉十字架并尝了胆汁，我岂能将油和酒入口呢？」[16]而另一些人则为了自己的罪孽，承受了禁食和无尽的苦修，例如：埃及的马利亚、帕夫努提和与他们相似的人。许多人则为了贞洁和无情欲而禁食。还有一些人，是因誓愿而生，并自母腹中就奉献给上帝的，他们承受了超乎自然的苦修和禁食，例如：伟大的行奇迹者尼古拉、提奥多·西克奥特以及其他这样的人。
    - type: paragraph
      text:
        ru: У некоторых же и небесный огонь, коснувшись, воспалил их душу на неизреченные труды и пощение, так что они не ощущали их, каковыми были Симеон Дивногорец и все святые мученики. На иных же единое чувство, коснувшееся сердца их напоминанием о геенне или Страшном судище Христовом, так подействовало, что не только болезней и трудов они не чувствовали, но и самих себя забывали, каким,например, был тот старец, что от чувства памяти смертной оцепеневал, падая как мертвый, и иные многие.
        cn: 对于一些人而言，天上的火甚至触及并点燃了他们的灵魂，使他们能从事无法言喻的苦修和禁食，以至于他们不觉其苦；神迹山上的西缅和所有圣殉道者便是如此。而对于另一些人而言，仅仅一种触及他们心扉的感觉，借由对革痕纳或基督可怕审判的提醒，就如此作用于他们，以至于他们不仅感觉不到痛苦和劳苦，甚至忘记了他们自己；例如那位长者，他因默想死亡而感到麻木，像死人一样倒下，以及许多其他的人，都是如此。
    - type: paragraph
      text:
        ru: Все они с разумом и добрым намерением благодатью Христовой высокие добродетели и пощения совершили, не думая о себе, что какую-то добродетель проходят, но единым разумом каждое свое духовное чувство проверяя, позади себя всякое делание доброе оставили. Ибо ни пост, ни иные труды не сочли они добродетелью, но одно то предпочли, чтобы по естеству представить себя Христу такими, какими мы были созданы.
        cn: 他们所有的人，都凭着理智并以良善的意图，藉着基督的恩典，实行了高尚的德行和禁食，不认为自己正在修行某种德行，但以纯一的心智检验着自己每一个属灵的感受，将一切善行都置于身后。因为无论是禁食，还是其他的劳苦，他们都不算作是德行；但他们只选择了一件事，就是按着本性将自己呈献给基督，正如我们受造时的样子。
    - type: paragraph
      text:
        ru: Некоторые же, подвластные страстям и безрассудные и не только не имеющие в себе ни одного чувства, лучше же сказать, дарования из вышеназванных и не распознавая никогда таковых, поревновали посту и трудам святых не с добрым разумом и намерением, понимая это, будто добродетель проходят. Сидящий же поблизости, как пес при заклании животных, дьявол бросает во чрево их семя радостного самомнения, от коего, зачавшись, воспитывается внутренний фарисей, и он, день ото дня возрастая, предает таковых совершенной гордыне, из-за которой оставляются они Богом во власти сатанинской. Таковые ведь отдали предпочтение материи пищи и пития, отвергли же соображения воздерживающихся или приемлющих их хорошо или дурно.
        cn: 然而有些人，被情欲所辖制且愚昧无知，不仅自身不具备上述任何一种感受，更确切地说，任何一种恩赐，且从未辨明此类事物，却又效法圣徒的禁食与苦修，并非出于良善的理智与心意，误以为自己是在践行美德。邻近而坐的魔鬼，如同屠宰牲畜旁的犬只，将狂喜自负的种子，投入他们腹中；从这种子受孕而生，便滋养出他们内心的法利赛人，而他，日渐滋长，将此类人引向彻底的骄傲，因此他们被上帝离弃，落在撒旦的权势之下。这样的人竟偏爱饮食的物质性，却摒弃了节制者的考量，以及如何善恶领受（饮食）的考量。
    - type: paragraph
      text:
        ru: Хорошо ведь воистину и благорассудно предавая нам путь царский святые назвали его не грозящим падением. Ибо кто когда, живя вместе с братом в безмолвии, был таким, чтобы молил Бога открыть ему, какой добродетели он еще не освоил? Не все ли таковые, взирая на высоту и совершенство заповедей Христовых, видели себя недостаточными, хотя и были святыми и совершенными."Если, – сказал ведь Богослов, –говорим, чтомы не согрешаем,обманываем себя»(ср.:1Ин. 1, 8). И еще великий Павел сказал:«Похвалюсь... в немощах моих, да вселится в меня сила Христова»(2Кор. 12, 9).
        cn: 圣人们将这君王之道传授给我们，确实是美好而明智的，他们称其为不至于跌倒的道路。因为，谁曾几何时，在与弟兄一同静修时，是这样祈求上帝向他启示自己尚未掌握哪种美德呢？难道所有这样的人，仰望着基督诫命的崇高与完全时，不都发现自己有所不足吗，即使他们已是圣洁且完全的？「因为神学家曾说：『我们若说自己没有罪，便是自欺』」（参阅 约翰一书 1:8）。并且，伟大的保罗也说：「我更喜欢在我的软弱上夸口，好叫基督的能力覆庇我。」(哥林多后书 12:9)。
    - type: paragraph
      text:
        ru: 'Уединенные же пустынники многие успешно совершили это – кто в простоте, с нелукавым разумом и нравом, а кто с явным самомнением. И потому Господь, одних, возводя к смирению, посылал к мужам добродетельным, жившим в городах, как того, пасшегося с дикими буйволами, послал к игумену, повелев тому приставить его свиней пасти, а другого – предать себя общежительному послушанию, какового не имея сил стерпеть, познав свою немощь, помолился он, чтобы его отпустили обратно в пустыню. Других же, как неисцелимо недугующих, Он отпускал во власть сатанинскую. Так что хорошо сказал Лествичник: «Уединенное безмолвие неискусных удавляет».[17]И Варсонофий Великий сказал: «Безмолвие подает повод для высокоумия»[18]и прочее.'
        cn: 许多独居的隐修者成功地完成了这事——有的是出于纯朴，带着真诚的心思和品格，而有的则是带着明显的自负。因此，上主为了使一些人达到谦卑，将他们送往住在城里的有德之人那里，就像把那个牧放野牛的人送去见修道院长，命令后者让他去牧猪一样；而另一些人——则让他们将自己完全托付于团居修道院的顺从生活，但由于他没有力量忍受，认识到自己的软弱，便祈祷求让他回到旷野。至于另一些人，则因他们患有无法医治的疾病，上主便任凭他们陷入撒旦的权势。因此，天梯圣师说得好：「不熟练之人独居的静默，会扼杀他们。」[17]伟大的瓦尔撒努菲也说：「静默提供了骄傲自负的借口」[18]等等。
    - type: paragraph
      text:
        ru: И никто да не удивится тому, что всякий, кто соблюдая пост, поклоны и бдение, псалмопение, на земле лежание и подобное этому, воображает, что осуществляет добродетели, тем самым согрешает всвоемобращении к Богу. Ведь если кто-то из имеющих слезы и плачущих воображает, что добро творит, а сверх того еще и высится над не имеющими слез, всуе трудится, – сказал Лествичник.[19]
        cn: 无人应为此感到惊奇，即凡是遵守禁食、拜跪、守夜、咏唱诗篇、卧地以及诸如此类事的人，却想象自己是在实行美德，他就在此转向上帝时犯了罪。因为，如果流泪哭泣的人，却想象自己是在行善，并且更甚的是，还高傲地凌驾于那些没有眼泪的人之上，他便是徒然劳苦。——梯子著作者如是说。[19]
    - type: paragraph
      text:
        ru: 'Вопрос: А как же, сказалкто-то, что творящему таковое невозможно не помыслить, что он делает хорошо?'
        cn: 问题：有人说，那么，行此之事者必然会认为他所做的是好的呢？
    - type: paragraph
      text:
        ru: 'Ответ: Потому-то и сказано выше, что не только правого разума и духовного чувства нет у нас, но мы и со слов не познаем таковое и рвемся на уединение и высокое делание святых отцов. Есть ведь, воистину есть такой строгий и твердый помысел, что не только воззретьввысь, но и помыслитьне позволяет, что добродетелью является всякое достижение наше, как уже об этом немного было сказано. Ведь если бы это было не так, как возможно было бы, чтобы святые почитали себя ниже всей твари? Или: насколько кто приближался к Богу, настолько видел себя грешным. И прочеетакого рода. И это трудный алфавит[20]– познавать кому-либо свою степень и меру, – с каким разумом и намерением проходить ему добродетели.'
        cn: 回答：正因如此，上文已经说过，我们不仅没有正直的理智和属灵的感受，甚至无法从言语中领悟这些，却急切地追求隐修和圣教父们那崇高的修行。 的确，确有这样一种严谨而坚定的思想，它不仅不允许我们高看，甚至不允许我们认为我们的任何成就都是美德，正如之前已稍有提及。 因为如果不是这样，圣徒们怎可能认为自己比万物都卑微呢？ 或者：一个人越是亲近上帝，就越是觉得自己有罪。 诸如此类。 而这乃是一门艰难的学问[20]——认识自己的品级和尺度，以及以何种理智和意图去实践美德。
    - type: paragraph
      text:
        ru: 'Если же скажет кто-то, что таковое мало кем постижимо, – ему отвечают святые отцы: пусть держится царского пути, среднего и не грозящего падением, – вдвоем или втроем общительного безмолвия. Ибо «многократно враг подает усердие на великое пощение и на труды святых, – сказал святой Исаак, – на уединенное безмолвие и молчание, – чтобы отсюда уловить слушающих его совета».[21]Подобное же и святой Кассиан об этом говорил: «Умерщвление плоти и воздержание мыслей не должно быть выше естественной силы и дарования, Богом данного, каковое, многим знаменитым святым даровав, Он привлек их к подвигам и великой аскезе через особое вдохновение».[22]Если же тех божественных сил не имеешь, не возжелай последовать святым в крайнем и необычном умерщвлении, но только рассматривай его, и удивляйся, и смиряй себя, по изречению святого Лествичника о нищих, ибо они, говорит он, «сокровища царские видя, лучше познают свое убожество; так и душа, читая о великих отеческих добродетелях, непременно делает более смиренным свое мудрование».'
        cn: 如果有人说，这样的事很少有人能领悟，——圣教父们回答他：让他持守中庸且不至于跌倒的王道，即两三个人共处的静默。因为，「仇敌常常激起人对极大的禁食和圣徒的苦修、对独处的静默和沉默的热心，」——圣以撒说——「以便由此来网罗听从他建议的人。」[21]圣卡西扬也曾论及此事，他说：「肉体的治死和思想的节制，不应超越自然的禀赋和上帝所赐的恩赐；上帝将这样的恩赐赐予了许多著名的圣徒，并借着特别的灵感吸引他们去进行苦修和伟大的禁欲生活。」[22]如果你没有那些神圣的力量，就不要渴望在极致和异乎寻常的治死上效法圣徒，而只应省察它，并惊叹，且谦卑自己，依循圣阶梯者（约翰）关于穷人所说的话，因为，他说，「他们看见君王的财宝，就更能认清自己的贫困；同样，灵魂阅读伟大的教父美德时，也必使自己的思想更加谦卑。」
    - type: paragraph
      text:
        ru: 'Говорит и святой Иустин: «Небесная благодать до всех достигает, но не в равной мере. Хочет Господь всех спасти, но не освятить».[23]Однако из-за этого не вообрази, что ты неблагополучен, раз не можешь во плоти твоей, как святые, сурово подвижнически пожить. Можешь ведь твоеспасениесовершить теплым вожделением и тщанием внутреннего делания со смирением – и этим угодить Богу. Ведь порфироносный пророк не «алкал я», не «бдел я», не «на земле я легах», но «смирихся, – рече, – и спасе мя» Господь.[24]И паки святый Кассиан рече: «Всяким убо тщанием дару разсуждения поищемъ[25], сие бо имать крепость сохранити. Источнику убо мати бездна есть, разсуждению же – смирение. Не сущу бо свету, вся мрачна суть; и не сущу смирению, вся наша суетна».'
        cn: 圣尤斯廷也说：「天上的恩典临到所有人，但并非以同等的方式。上主愿人人得救，但并非人人成圣。」[23]然而，因此不要以为你不幸，只因你无法像圣徒那样，在你的肉身中严峻地苦修生活。你可以藉着热切的渴望、内在事工的勤勉并带着谦卑来完成你的救恩——并以此取悦上帝。因为那身披紫袍的先知没有说：「我饥饿了」，没有说：「我彻夜不眠」，也没有说：「我躺卧在地」，而是说：「我谦卑了，上主就拯救了我。」[24]圣卡西安又说：「我们务要竭尽全力寻求辨别的恩赐[25]，因为这（恩赐）具有保存（灵魂）的力量。深渊是泉源之母，而谦卑则是辨别力之母。因为若无光，一切尽是黑暗；若无谦卑，我们的一切都将虚妄。」
    - type: paragraph
      text:
        ru: Как же мы можем его стяжать? Услышим же Господом сказанное:«Без Меня не можете делать ничего»(Ин. 15, 5). И помолимся Ему усердно, да подаст нам во всех наших делах присутствие смирения, которое от веры и страха Божия, кротости и совершенного нестяжания обычно бывает, каковыми и совершенная любовь достигается благодатью и человеколюбием Господа нашего Иисуса Христа, Которому и слава во веки, аминь.
        cn: 我们如何才能得着它呢？ 让我们听一听主所说的：「离了我，你们就不能做什么。」（约翰福音 15:5） 恳切地向祂祷告，求祂在我们一切的作为中，赐予我们谦卑的临在，这谦卑通常是出于信德与敬畏上帝之心、温顺以及完全的清贫，藉着这些美德，完全的爱便得以藉着我主耶稣基督的恩典与仁爱而成就，愿荣耀归于祂，直到永远，阿们。
    - type: paragraph
      text:
        ru: ПРИ ЭТИХ «НАДСЛОВИИ» И «ПРИСТЕЖЕНИИ» РАДИ СЛОВ, КОТОРЫЕ НЕМНОГО ВЫШЕ, В «ПРИСТЕЖЕНИИ», МЫ СКАЗАЛИ, УПОМИНАЯ О ВНУТРЕННЕМ ДЕЛАНИИ, РАССУДИЛИ О НЕМ ВКРАТЦЕ ИЗЛОЖИТЬ ЗДЕСЬ. И ныне тому начало. Благослови, отче!
        cn: 就着这些《题词》与《附篇》，我们为了那些稍早于《附篇》中提及、关乎内在工夫的言语，遂决意在此对之简要阐述。而今此即其始。求父祝福！
    - type: paragraph
      text:
        ru: «Потому что наша брань не против плоти и крови, но против начал и властей и мироправителей тьмы века сего, против духов злобы поднебесных»(Еф. 6, 12).
        cn: 「因为我们的争战，不是对抗血肉之躯，而是对抗执政的、掌权的，对抗这世代幽暗世界的掌管者，对抗天空属灵气的恶魔。」 (以弗所书 6:12)
    - type: paragraph
      text:
        ru: 'Воины земного царя носят меч, будучи готовы и искусны воевать против врагов. Носят такой же меч и не настоящие воины, следуя единственно только обычаю, а не для готовности к брани, ибо не имеют опыта в противоборстве врагам. Это – совершенный во всем образ и нашей духовной брани, о которой ныне предстоит слово. Ибо всякий, отрекающийся мира и становящийся монахом, принимает вместе с этим и меч духовный как воин Христов и исходит на брань против духов злобных. Ему ведь говорится в час пострига: «Прими, брат, “меч духовный, иже есть глагол Божий”, его же и, нося и во устнах твоих, уме же и в сердце, глаголи непрестанно: “Господи Исусе Христе, Сыне Божий, помилуй мя!”».'
        cn: 地上君王的战士们佩戴着宝剑，预备好并精通于与仇敌作战。并非真正的战士也佩戴着同样的宝剑，他们仅仅是遵从习俗，而并非为着预备战斗，因为他们没有与仇敌对抗的经验。这在各方面都是一个完美的比喻，用于我们属灵的争战，这正是我们现在要谈论的。因为凡是舍弃世俗并成为修士的人，也随之领受了属灵的宝剑，作为基督的战士，并出去与邪恶的诸灵争战。因为在剃度礼时，对他如此说：「弟兄啊，领受『属灵的宝剑，即是上帝的圣言』，这宝剑，你要持之于口，持之于心，并要不停地诵念：『上主耶稣基督，上帝之子，怜悯我！』」
    - type: paragraph
      text:
        ru: Но, о, время наше! Сколь многие, а может и все, носят этот меч по одному только обычаю, а не для какой-то бранной потребности! Ибо не обучаясь тому, как пред очами врагов вращать его и поражать им, как пламенем, просто и плотски его употребляют, а не действенно. То есть прочитывая за одну «Славу» Псалтири одну вервицу, а за кафизму три, заканчивают число внешнего моления. Большинство же, и совсем отложив этот «глагол Божий», лучше же сказать, пламенное оружие, охраняющее врата сердечные, воинствуют одним псалмопением, канонами и тропарями, каковые суть церковное предание, воображая, что эта святая пятисловная молитва придумана для простых и некнижных монахов в качестве правила. Таковое их неправое мнение исправляя и низлагая, Симеон, архиепископ Солунский, преподает и законополагает всем архиереям, архимандритам, игуменам и священноинокам, иереям, диаконам, монахам и мирским людям, всякие чин и профессию имеющим, вместо всякого правила, как свое дыхание и жизнь, эту святую молитву Иисусову в уме и в устах произносить во всякие час и время, хоть они и не могут познавать ее искусного действия, ибо это дело, сказал он, одних монахов, отрекшихся мира.
        cn: 然，呜呼，我们的时代！多少人，或许是所有人，佩戴此剑仅是出于习俗，而非出于某种争战的需要！因为他们不曾学习如何在敌人眼前挥舞此剑，并以其如火焰般击打，只是简单地、肉体地使用它，而非以其发挥效用。也就是说，为诗篇中的一句「荣耀经」念诵一串念珠，而为一篇「分段诗篇」念诵三串念珠，便完成了外在祷告的数量。大多数人则完全搁置了这「上帝的话语」，更确切地说，是那守卫心门之火焰兵器，单以唱诵诗篇、圣歌集和短颂来争战，这些都是教会传统，却以为这神圣的五言祷文是为那些不识字、淳朴的修士所设的规矩。为了纠正并驳斥他们这种错误见解，塞萨洛尼基大主教西缅教导并立法规定，所有的主教、总司祭、院长和神品修士，所有的司祭、辅祭、修士和平信徒，无论其何等品秩与职业，都应当代替一切规矩，如同他们的呼吸与生命一般，无论何时何刻，在心中和口中诵念这神圣的耶稣祷文，纵使他们无法明了其精巧的效用，因为他说，那是那些弃绝世界的修士才有的事功。
    - type: paragraph
      text:
        ru: А еслиВасилий Великийповелевает некнижному монаху этой молитвой совершать правило по счету и безыскусно, надо думать, что он необученным, а может и мирским, законополагает это, чтобы и они по мере своей славословили Бога, а не были праздными.
        cn: 如果瓦西里大帝吩咐不识字的修士用此祷文，按数目并纯朴地履行祈祷规矩，那么我们应当认为，他是为未受教育者，或许也为平信徒制定此规定，好使他们也能尽其所能地颂赞上帝，而不致闲散。
    - type: paragraph
      text:
        ru: Носящий же меч свой, или «глагол», в разуме, при внутреннем внимании, знает время, когда обращать его на врагов и молиться против злых прилогов, страстей и помыслов, или о грехах своих. Бывает ведь время, когда, поскальзываясь при некоторых обстоятельствах и невнимании словом или яростью, оком и похотью, или тщеславием и самомнением и тому подобным, и ударяем бывая из-за них своею совестию, и не терпя ее обличения, обращаетсячеловекк Богу, каясь и молясь сердцем и умом, ища помилования. Все ведь правило состоит  в одном покаянии и внимании сердечном, – как у той вдовицы,  пристававшей к судье день и ночь и просившей защиты от соперника  своего (см.:Лк. 18, 3–5). Это и есть чин умного делания, подобающего  страстным. И пусть никто не презирает слово о том, что припадающим  с такими грехами к Богу возможно обучаться умному деланию.
        cn: 持有自己之剑，即「话语」的人，在他的心智中，在内在的警醒下，知道何时将它转向仇敌，并祈祷对抗邪恶的引诱、诸情欲和意念，或为自己的罪孽祈祷。确实有这样的时刻，当一个人在某些境况下，因言语或愤怒，因眼目和情欲，或因虚荣和自负等等而失足跌倒时，并因此被自己的良心击打，且无法忍受其指责时，便会转向上帝，以心和智悔改并祈祷，寻求怜悯。毕竟，所有的法则都只在于悔改和内心的专注， – 正如那位寡妇，日夜纠缠法官，请求他保护自己免受对手的侵害（参：路加福音 18:3-5）。这就是心智工作的规范，适合那些有情欲的人。愿无人轻视这番话，即带着此类罪孽投靠上帝的人，仍可能学习心智工作。
    - type: paragraph
      text:
        ru: 'Расположи в пяти степенях действующих по страсти: 1) когда кто-то, впав в гнев и досаду, пребудет всегда злобствующим на оскорбившего; 2) будучи опечален, помнит зло много дней; 3) гневается только одну неделю; 4) только один день помнит зло; 5) враждуя, досадуя, смущаясь и смущая, в тот же часэтопрекращает. Вот каково различие устроений, однако под адом суть все они, пока действуют по страсти, сказал святой Дорофей. И таким не подобает и невозможно прикасаться к умному деланию. Все они подобны человеку, раненному врагом своим и берущему стрелы собственными руками и вонзающему их в свое сердце. О таких сказал Богослов:«Всякий, рожденный от Бога, не делает греха»(Ин. 3, 9);«Кто делает грех, тот от дьявола»(1Ин. 3, 8).'
        cn: '将那些因情欲而行事的人分为五个等级：

          1) 当某人陷入愤怒和怨恨，并对那冒犯他的人一直怀有恶意时；

          2) 心怀忧伤，记恨多日；

          3) 只发怒一周；

          4) 只记恨一天；

          5) 虽心怀敌意、恼怒，心绪烦乱并扰乱他人，却在同一时刻止息。


          圣多罗斐说，这就是性情上的区别，然而，只要他们因情欲而行事，就都仍在阴间之下。这样的人不适合也无法触及心智操练。他们都如同一个人，被自己的敌人所伤，却又亲手拿起箭矢，将其刺入自己的心中。论及这样的人，神学家说：「凡从上帝生的，就不犯罪」(约翰福音 3:9)；「犯罪的是属魔鬼」(约翰一书 3:8)。'
    - type: paragraph
      text:
        ru: 'Возьми и другие пять степеней: 1) – оскорбившегося и скорбящего не потому, что получил досаду, но что ее не претерпел; 2) – всегда поучающегося терпению, напоследок же побежденному порывомстрасти; 3) – не хотящего отвечатьзлом, но по привычке увлекающегося; 4) старающегося совершенно не говорить злого, скорбящего, что получил досаждение, но и укоряющего себя и кающегося в этом; – не скорбящего, что получил досаждение, но и не радующегося. Эти все суть сопротивляющиеся страсти, ибосвоейволей остановили страсть и не хотятпо нейдействовать, но и скорбят, и стараются. И таковые подобны тому, в кого враг стреляет, но он облечен в броню и не получает ранений, сказал тот же святой Дорофей.[26]И им всячески подобает и возможно обучаться умному деланию, ибо они очищаются вседневной благодатью Христовой через умную молитву и ежечасное покаяние. О них ведь Тайновидец сказал:«Если говорим, что греха не имеем, обманываем самих себя. И если грехи наши исповедуем, то Он, будучи верен и праведен, простит нам и очистит нас от всякой неправды»(ср.:1Ин. 1, 8–9).'
        cn: '我们再来看另外五个阶段：

          1) 受了冒犯并因此忧伤的人，不是因为他受到了恼怒，而是因为他未能忍受住；

          2) 常常学习忍耐，但最终却被情欲的冲动所胜过的人；

          3) 不愿以恶报恶，但因习惯而情不自禁的人；

          4) 努力完全不说恶言，为自己受到恼怒而忧伤，并且责备自己并为此悔改的人；

          5) 不为自己受到恼怒而忧伤，但也不为此欢喜的人。

          这些人都是抵制情欲的，因为他们凭自己的意志遏制了情欲，不愿按其行事，他们为此忧伤，并为此努力。这样的人就好比那被仇敌射击的人，但他身披铠甲，并未受伤，圣多罗斐长老如此说。[26]他们完全适合，也完全能够学习心神操练，因为他们借着基督每日的恩典，通过心祷和每时每刻的悔改而得以洁净。关于他们，那位奥秘启示者曾说：「如果我们说自己没有罪，便是自欺。如果我们承认自己的罪，祂是信实的，是公义的，必会赦免我们的罪，洗净我们一切的不义。」(参见：约翰一书 1:8-9)'
    - type: paragraph
      text:
        ru: 'Известно и то, что эта священная Иисусова молитва для многих и в древности и ныне оказалась камнем преткновения и соблазна. Хотя многие, если не все, молятся ею просто и внешне, и никто против этого не восстает, искусство же ею действовать, каковое состоит в блюдении сердца умом в молитве, очень мало кто знает. И самомуГригорию Синаитусопротивлялись сначала сами разумнейшие отцы Афонской Горы, когда он начал этому их учить. И если эти отцы, удалившиеся из городов, так споткнулись об это делание, то что подобает сказать о привязавшихся к миру монахах? Однако хотящему душу свою спасти должно покоряться Писанию и учению святых отцов, а не плотским людям. Ведь не вкаком-тоодном углу, но посреди самого Царьграда процвело это священное умное делание, и не у одних монахов, но даже сами патриархи Константинопольские были его делателями и учителями: Иоанн, я имею в виду, Златоуст, Фотий, Каллист, один за другим бывшие со временем преемниками патриаршего престола, о которых пишетСимеон Солунский, что они целые свои книги об одном этом творении умной молитвы сочинили премудро и искусно.'
        cn: 同样周知的是，这神圣的耶稣祷文对于许多人而言，无论在古代还是现在，都成为了绊脚石和诱惑。尽管许多人，甚至几乎所有人，都以简单和外在的方式诵念此祷文，并且没有人对此反对，然而，以此祷文行功的艺术，即在于祷告中以心智守卫心，却鲜为人知。甚至当西奈的格列高利本人开始教导他们这项功课时，起初也遭到了阿索斯山上最明智的教父们的反对。倘若这些远离城市生活的教父们，尚且在这项功课上跌倒，那么对于那些依恋世俗的修士们，又当说些什么呢？然而，凡愿拯救自己灵魂的人，都当顺服《圣经》和圣教父们的教导，而非属血气的人。因为这项神圣的心智功课并非只在某个角落，而是在君士坦丁堡的中心地带兴盛起来，并且不只在修士之中，甚至君士坦丁堡的众牧首也曾是它的实践者和教导者：我指的是金口约翰、佛提乌、卡利斯特，他们先后继承了牧首的宝座。索卢恩的西缅曾写道，他们曾智慧而精妙地，将整部著作专门用于阐述这项心智祷文的行持。
    - type: paragraph
      text:
        ru: 'Так что не подобает удивляться тому, что ныне о таковом учении и писании ни слова не произносится среди монахов. Всякий ведь может, если только захочет, монах или мирянин, петь псалмы или каноны, для общего моления в святой Церкви святыми отцами преданные,"ГосподомжеИисуса никто не может назватьв уме,как только Духом Святым», по апостолу (ср.:1Кор. 12, 3). Потому святые отцы, бывшие делателями и учителями этого, уподобляют внешнее пение малому отроку, умную же молитву совершенному мужу. И как отроку нет укора, потому что он может со временем стать мужем и старцем, так и внешнему пению, по немощи младенчеству нашему от Бога данному, нет укоризны и презрения. Когда человек, все старание свое на умную молитву обращая, очень мало же поя канонов и тропарей, уповая через умную молитву обрести разумное пение, восходя от которого опять же к зрительной молитве и на ее уровень, как отрока по отношению к совершенному мужу пение воспринимая, вновь мало отдает времени пению, больше же молитве, – не может таковой впредь много петь. Внешне ведь поющие и не воспринимающие чувством произносимого, – эти могут петь много, сказал святойГригорий Синаит.[27]И по этой причине подобает пение именовать утренней звездой, а молитву солнцем: ясно ведь, что утренняя звезда какой-нибудь час или два видима, солнце же сияет весь день. Такими разумей пение и молитву.'
        cn: 因此，不应惊讶于现今在修士中关于此类教导和著作一言不发。凡是愿意的，无论是修士还是平信徒，都可以咏唱圣咏或颂歌，这些都是圣教父们为圣教会的公共祈祷所传下来的；然而，「若非被圣灵感动，没有人能在心中称耶稣为主」，正如使徒所言（参阅：哥林多前书 12:3）。因此，曾是这实践者和教导者的圣教父们，将外在的咏唱比作幼小的孩童，而将心祷比作完全的成年男子。正像幼小的孩童不应受责备，因为他有朝一日能成为成年男子和老人，同样，对外在的咏唱，鉴于我们从上帝领受的婴儿般的软弱，也没有责备和轻蔑。当一个人将全部精力都投入到心祷中，而极少咏唱颂歌和短颂，指望通过心祷获得悟性的歌唱，并由此再次上升到观想的祈祷及其境界，他将咏唱视作孩童之于完全的成年男子，再次很少将时间用于咏唱，更多地用于祈祷——这样的人以后就无法多咏唱了。圣格列高利·西乃山人曾说：「那些只在外表上咏唱，而无法以感受领会所说之言的人，这些人才可以多咏唱。」[27] 基于此原因，宜将咏唱称为晨星，而将祷告称为太阳：显而易见，晨星只能被看见一两个小时，而太阳则整日照耀。当以此理解咏唱和祷告。
    - type: paragraph
      text:
        ru: И не говори мне, что многие из святых многого пения придерживались, но разумей и веруй, что те же отцы повелевают нам без сомнений восходить от пения к молитве, каким был и святойГригорий Синаит, который сначала по неведению лучшего держался одного пения, а затем, будучи наставлен одним критянином, сменил многое пение на умную молитву и, по опыту познав, что не будет такого скорого и легкого успеха от пения, как от молитвы, все тщание повелел иметь всем о молитве, петь же немного, когда уныние.
        cn: 也不要对我说，许多圣人坚持大量咏唱，但请明白并相信，同样的教父们毫无疑问地吩咐我们从咏唱进升到祷告。圣格里高利·西奈特就是这样一位，他起初因不知有更美者而只坚持咏唱，而后，被一位克里特人教导后，他将大量咏唱改为心智祷告，并且，他根据经验得知，咏唱不会像祷告那样带来如此迅速和轻易的成功，因而他吩咐所有人在祷告上倾注一切心思，至于咏唱，则少量为宜，仅在灰心丧志时进行。
    - type: paragraph
      text:
        ru: Так что и ты, без всякого сомнения так делай, да не будут и тебе за твое непокорство сказаны слова апостола, говорящего так:«Желание моего сердца и молитва к Богу об Израиле во спасение. Ибо свидетельствую им, что ревность Божию имеют, но непо разуму.Не разумеяправдыБожиейи свою правдустараясь поставить,они не покорилисьправде Божией»(Рим. 10,1–3). Ибо что говорит Писание? «Близко к тебе слово, в устах твоих и в сердце твоем» (Втор. 30, 14). «Ибо если исповедаешь устами твоими Господа Иисуса, спасешься» (ср.:Рим. 10, 9). «Ибовсякий, кто призовет имя Господне, спасется»(ср.:Иоил. 2, 32;Рим. 10, 13).
        cn: '所以你也要毫无疑问地如此行，免得使徒的话也因你的悖逆而被说给你听，他如此说：


          「我心里所愿的，和向 上帝 的祷告，是为以色列人，使他们得救。我为他们作证，他们有对 上帝 的热心，但不是按着真知。因为不认识 上帝 的义，并且想要立自己的义，他们就不服 上帝 的义。」(罗马书 10:1-3)


          因为圣经说什么呢？「这话离你甚近，就在你口里，在你心里。」(申命记 30:14)「因为你若口里承认主耶稣，就必得救。」(参阅罗马书 10:9)「因为凡求告 上主 之名的，就必得救。」(参阅约珥书 2:32，罗马书 10:13)'
    - type: paragraph
      text:
        ru: 'Все же это – «глагол», исповедание и призывание – разумей как присутствие внутри тебя Христа, через святое крещение вселившегося, призывать Которого, именовать и исповедовать ты должен непрестанно, когда в сердце, а когда устами говоря: «Господи Иисусе Христе, Сыне Божий, помилуй меня». Так что наблюдай, человече, за собой и своим упорством, да не пошлет на тебя за это Бог дух усыпления –«глаза, которые не видят, и уши, которые не слышат»(ср.:Рим. 11:8), – как против тебя, словно второй Илия об Израиле к Богу, говорит священное Писание, против которого ты, словно против острого рожна, прешь. Так что не надейся и не верь, что в чем-либо духовном преуспеешь, если не возьмешь за правило призывать Иисуса Христа на всякий помысел злой и на всякую рать вражью, сказал святой Исихий. Не найдешь ведь крепче оружия на врагов на небесах и на земле кроме имени Христова. И невозможно тебе избежать горького напоения злых помыслов, ни хлеб из отрубей перестать есть, пока не постараешься вкусить чистого«хлеба, сошедшего с небес»(Ин. 6, 51), каковой ядущии не проголодаются вовеки, воспринимая веселие и радость, а не страх или безрассудное утешение, каковое есть радостное самомнение. Ведь как Закон, неспособный сам сделать человека безгрешным, отсылал всех ко Христу и к Нему устремлялся, хотя и казался при этом умаляемым, так и внешнее пение, предварительно обучив делателя, передаетегоХристу, т. е. умной Иисусовой молитве, аки не могуще того собою в духовное действо возвести,ащеи само то ради молитвы сокращается, а второе бывает.'
        cn: 所有这些——这「话语」、认信和呼求——你当领会为基督内在于你，祂是借着圣洗礼住入你内的。你当不停地呼求、称呼并认信祂，有时在心里，有时在口中说：「上主耶稣基督，上帝之子，怜悯我。」因此，人啊，当察看自己和自己的固执，免得为此上帝将昏睡的灵降在你身上——「有眼却看不见，有耳却听不见」（参见：罗马书 11:8）——圣经针对你说话，如同第二个厄利亚就以色列对上帝说话一样，你却像用脚踢尖刺一样对抗。所以，不要指望，也不要相信你在任何属灵之事上能有所进步，除非你把在每一个恶念和每一次仇敌的攻击面前呼求耶稣基督作为一条规矩，圣伊西希说。因为在天上和地下，你找不到比基督之名更坚固的武器来对抗仇敌。你无法避开恶念的苦饮，也无法停止吃麸皮面包，直到你努力尝到那纯净的「从天上降下的粮」（约翰福音 6:51），吃这粮的人必永远不再饥饿，领受的是欢愉和喜乐，而不是恐惧或无理智的安慰，那种安慰乃是自满的喜乐。因为律法本身不能使人无罪，它将所有人都引向基督，并归向祂，尽管在此过程中，律法本身似乎被贬低了。同样，外在的歌唱，在事先教导了实践者之后，将他引向基督，即引向心祷的耶稣祷文，仿佛它本身不能将（人）提升到属灵的行动中，尽管它自身因着祷文的缘故而退隐，而后者则成为主导。
    - type: paragraph
      text:
        ru: 'Если же не все хотят перейти от него ко Христу, нет в этом вины пения, как и у Закона – в противлении иудейском, нопричина –один их плотский разум и неведение силы, сокровенной в святом Писании. Ибо думая, что растягивать сладкие гласы и изливатьсязыка красные словеса – это есть начало и конец моления к Богу, не уразумели они сказанного Господом:«Кто верует в Меня, у того... реки потекут из чрева его воды живой»(ср.:Ин. 7, 38). Всякий ведь крестящийся принимает свыше таинственно в глубину своего сердца эту воду живую, о которой написано в житии святого священномученикаИгнатия Богоносца: «Разрезали неверные сердце его, говоря: “Как он носил Бога своего в сердце своем?” И нашли внутри такие слова из золота: “Иисус Христос”». Знамение же это было на посрамление неверных, во уверение же всех верных, что всякий при святом крещении принимает внутрь себя Христа. Сего ради совершеннейшие и глубочайшие в духовных дарованиях святые отцы прежде повелевают нам очищаться от страстей призыванием в уме и сердце имени Иисуса Христа против всякого помысла злого, ратования и прилога вражьего; и это с чувством, а не просто и по обычаю только совершаемое моление, каковое не грешно назвать и мертвым.'
        cn: 如果并非所有人都想通过它归向基督，这并非圣歌的过错，正如犹太人在抵触律法时那样，其原因仅仅是他们肉体的理智，以及对圣经中所隐藏力量的无知。因为他们认为，发出甜美的歌声，口出华丽的言辞，便是向上帝祷告的开端与终结，他们不明白上主所说的话：「信我的人，从他腹中要流出活水的江河来」（参：约翰福音 7:38）。凡受洗的人，都从上方神秘地领受这活水，进入他心灵深处。关于这活水，在圣祭司殉道者伊格纳提乌斯·佩戴上帝者（伊格纳提乌斯·提奥弗洛斯）的生平中记载道：「不信者剖开他的心，说：『他怎能将他的上帝佩戴在他心中？』结果在里面发现了金色的字样：『耶稣基督』。」而这神迹是为羞辱不信者，也是为坚固所有信徒的信心，即凡在圣洗中，都将基督接纳到自己里面。因此，那些在属灵恩赐上最完美、最深刻的圣教父们，首先吩咐我们，要洁净自身，摆脱诸情欲，借着在心意和心中呼求耶稣基督之名，以对抗一切邪恶的意念、争战和仇敌的诱惑；并且这祷告是带着真情的，而非仅仅是敷衍了事、例行公事的祷告，称之为死去的祷告也不为过。
    - type: paragraph
      text:
        ru: 'И в таком разумном внимании и молении положивших начало, учат нас блаженные отцы даже до смерти пребывать, воюя с врагами и со страстями нашими: хоть и тысячу язв каждый день мы получаем, никак не отступать от живоносного делания этого, то есть призывания Иисуса Христа, сущего в сердцах наших, как уже и выше было об этом сказано. И тогда, если усмотрит Богчто-тона пользу нашу, возведет, кого захочет и знает, через таковое доброе начало на зрительную молитву умную.'
        cn: 在这样明智的专注和祷告中，那些已经开始的人，蒙福的教父们教导我们，即使我们每天遭受千百次的创伤，也要至死不渝地持守，与我们的仇敌和情欲争战，绝不放弃这赐予生命的操练，也就是呼求住在我们心中的耶稣基督之名，正如上面已经说过的。这样，如果上帝认为对我们有益处，祂就会借着这样美好的开始，将祂所愿和所知的人提升到心智的观想祷告中。
    - type: paragraph
      text:
        ru: 'Некоторые же, кого и легкомысленными назвать подобает, слыша, что быстрейшее преуспеяние достигается через эту делательную умную молитву, торопятся прежде времени достичь зрительной, воображая, что в руках желающих это обретается. Другие же, узнав, что зрительной молитвы удостаиваются не все, но немногие, ослабевают или совсем нерадят о делательной молитве умной, без которой никому невозможно избежать действия страстей и сложения с лукавыми помыслами, о которых они будут спрошены в час смерти и ответ дадут на Страшном суде. Таковые должны ведь понимать, что за зрительную молитву мы всяко не осудимся, не сподобившись ей по немощи нашей в умном и сердечном блюдении, при котором можно противостать и злым помыслам и дьяволу, побеждая его не собою, но страшным именем Христовым.  Дадим мы ответ Богу за то, что, нося Христа внутри себя по дару святого крещения, не знаем, правильнее же сказать, не хотим обучаться, как призывать Его на помощь в час брани. И за одно это укоряет нас апостол, говоря: «Не знаете разве, что Христос живет в вас?» (2Кор. 13, 5). Разве вы неопытны, не обучены умом делать действующим в сердце имя Христово?'
        cn: 有些人，甚至可称之为轻浮的，听闻通过这种实践的、心神的祷告可获得最快的进步，便急于在时机未到前就企求获得视觉性的（祷告），以为这随愿望而得。另一些人则明白，并非所有人都蒙恩获得视觉性的祷告，唯有少数，便懈怠或完全疏忽实践的、心神的祷告；若无此祷告，无人能避免情欲的作用和与邪恶意念的结合，他们将为这些在死亡之时受审问，并在最后的审判中作出交代。这样的人理当明白，我们绝不会因为我们肉体的软弱，未能蒙恩获得视觉性的祷告而受定罪，而是在心神与心灵的谨慎持守中，借此可以抵挡邪恶的意念和魔鬼，战胜他并非靠自己，而是靠基督可畏的圣名。我们将向上帝作出交代，因为我们借由圣洗的恩赐将基督存于自身之中，却不知道，更准确地说，是不愿学习如何在争战之时呼求祂的帮助。使徒为此责备我们，说道：「你们难道不知道基督住在你们里面吗？」（哥林多后书 13:5）。难道你们没有经验吗？难道你们没有受过心神训练，以使基督的圣名在心中运行吗？
    - type: paragraph
      text:
        ru: А что древние, а не нынешние только во множестве скончались, не сподобившись при жизни зрительной молитвы, – не должно из-за этого сомневаться, ибо неправда у Бога места не имеет, но непременно за труды их, которыми они потрудились на истинном отеческом пути делательной молитвы, дает Он им при смерти или по смерти действие этой зрительной молитвы, с которой они, словно пламя огненное, проходят воздушные мытарства, – сказал святой Исихий.[28]И бывает жребий их с теми святыми, которые здесь«не получили обещанного», по апостолу (Евр. 11, 39), и потрудились всю свою жизнь во уповании.
        cn: 至于古代的圣徒，而非仅仅是现在的圣徒，有许多人离世时，生前并未蒙受可视祷告的恩赐——不应因此而生疑，因为在上帝那里，不义是没有立足之地的。但祂必然会因他们的劳苦，即他们在真正的教父式苦修祷告之路上所付出的努力，在他们离世时或离世之后，赐予他们可视祷告的功效。他们凭借这功效，如同火焰般，穿越空中关卡——圣伊西хий如是说。[28]他们的命运与那些圣徒同在，即那些在此世「未曾得着所应许的」圣徒，正如使徒所言（希伯来书 11:39），他们一生都在盼望中劳苦。
    - type: paragraph
      text:
        ru: 'Изложив таким образом это со свидетельством святого Писания о единой делательной и подобающей тем, кто еще страстен, умной молитве, скажем по необходимости и о возникающей при этой мере прелести. Во-первых же –то, чтосказал святейший патриарх Каллист: если прежде всего начинаются в теле подвизающегося и внимающего молитве некие движения, как бы взыграния под кожей, что кажется некоторым прелестью, то приходит и теплота от почек, как бы опоясывающая те движения. Кажется, что и это прелесть, но это не прелесть, а как бы свойства естества, порождаемые этим подвигом. Если же кто-то думает, что это от благодати, а не от естества, то это поистине прелесть. Какими бы они ни были, должен подвизающийся не любить их, но отражать.[29]'
        cn: '这样，我们已经引证圣经的见证，阐述了这一点，关于那唯一属乎行动的、适合于那些仍有情欲之人、用心意进行的祷告，那么，我们现在也必须谈谈在这种程度下可能产生的妄想。


          首先，圣哉宗主教卡利斯托斯说过：如果首先在苦修者和专心祷告者的身体里出现某些动作，如同皮肤下有跳动感，这在有些人看来是妄想，那么，接着便有热从肾脏发出，如同环绕着那些动作。这似乎也是妄想，但这并非妄想，而是如同由这种苦修所产生的自然本性的特性。然而，如果有人认为这是出于恩典，而非出于自然本性，那么这才是真正的妄想。无论这些现象如何，苦修者都不应喜爱它们，而应加以抵制。[29]'
    - type: paragraph
      text:
        ru: Приходит же и иная теплота – от сердца.[30]И если нисходит ум в блудные помыслы, то это воистину прелесть. Если же все тело от сердца разгорается, ум же чист и бесстрастен и как бы прилеплен ко внутреннейшей глубине сердца, то это воистину от благодати, а не от прелести.
        cn: '另有一种温暖，是发自内心的。[30]

          如果心神坠入淫邪的意念中，那这确实是妄念。如果整个身体从内心燃起，而心神洁净无私欲，仿佛依附在内心最深处，那么这确实是出于恩典，而不是出于妄念。'
    - type: paragraph
      text:
        ru: 'Ввиду этого подобает нам в самом начале обучать ум в час молитвы стоять сверху сердца и взирать в глубину его, а не в середине сбоку, или на конце снизу. Причина же этого такова: когда ум стоит сверху сердца и действует внутри него молитвой, тогда, как царь, сидя на высоте, свободно рассматривает он все ползающие внизу злые помыслы и разбивает их о камень имени Христова, как новых вавилонских младенцев (см.:Пс. 136, 9). К тому же по причине такого удаления от чресл он может уверенно избежать похотного разжжения, свойственного естеству нашему вследствие преступления Адама.'
        cn: 鉴于此，我们理当在开端就训练心智，在祷告时立于心之上方，并凝视其深处，而非在中间的侧面，或在底部的末端。其原因乃是：当心智立于心之上方并藉祷告在其内运作时，那么，如同君王，安坐高处，他便能自由审视所有在下方爬行的邪恶意念，并将它们摔碎在基督之名的磐石上，如同新的巴比伦婴孩（见：诗篇 136:9）。此外，由于如此远离腰间，他便能确切地避免情欲的炽热，此炽热乃我人本性因亚当的犯罪所固有的。
    - type: paragraph
      text:
        ru: Если же на середине сердца, от груди начинает кто-то сосредоточивать внимание в молитве, тогда – либо из-за случающегося оскудения сердечной теплоты, либо от изнеможения ума, притупляющего свое зрение от частого действия молитвы, или от самой воздвигнутой врагом брани, – ниспадает ум сам собою к чреслам и смешивается с теплотой похотной, хотя и невольно, так как сближается с ней, творя молитву на середине сердца.
        cn: 若有人开始从胸中，在心之中央集中注意力进行祷告，那么，—— 或因心之温煦偶然的匮乏，或因心神的疲惫，使眼目因祷告频繁的功效而迟钝，或因仇敌所兴起的争战本身，—— 心神便会自行降至腰腹，并与情欲的温热相混淆，即便并非出于本愿，因为在心之中央行祷告时，心神与之接近了。
    - type: paragraph
      text:
        ru: Некоторые же по крайней нерассудительности, лучше сказать, не зная, что такое верх или середина сердца, и что такое половина, и что такое конец его, начинают действие молитвы снизу, на конце сердца, при чреслах. И так, частью ума касаясь сердца, а частью чресел, сами к себе призываем мы прелесть, как факиры змею. Ибо так направляющим внимание не избежать приобщения вражьего.
        cn: 有些人却因着极度缺乏分辨力，毋宁说，是不明白心的顶部或中部为何物，以及心的半部和末端为何物，便从下方，在心的末端，靠近腰部，开始进行祷告的运作。如此一来，一部分心智触及心，一部分触及腰部，我们就自行招致迷惑，如同法基尔招引蛇一般。因为，如此导引注意力的人，无法避免与仇敌相交。
    - type: paragraph
      text:
        ru: Другие же, крайним неразумием и грубостью недугующие, не знают даже самого того места сердечного, находящегося под левым соском сбоку, но, воображая, что оно находится среди пупа на животе, дерзают (увы их прелести!) туда направлять умом молитву.
        cn: 然而，另一些患有极度愚昧和粗陋之疾的人，甚至不知道那个位于左乳头下方侧面的心之所在，却误以为它位于肚脐中央的腹部，竟敢（唉，他们的迷惑啊！）将心智的祷告导向那里。
    - type: paragraph
      text:
        ru: Так что, следуя таковым указаниям, подобает, как сказано, направлять умом внимание и молитву внутрь сердца сверху от соска, а не на середину от груди, особенно же не снизу от чресел, а затем распознавать умным чувством и теплоту в молитве – какая божественная, излиянная в сердце, как миро благоуханное, через святое крещение, и какая прившедшая к нам от преступления прародительского, или какая дьяволом возжигаемая.
        cn: 因此，遵循此类指示，理应如前所述，以心神将注意力与祷告，自乳头上方而非胸部中央，更非腰部下方，导引至内心。然后以心神的感觉辨识祷告中的暖意——哪一种是神圣的，如同芬芳的圣油，借着圣洗礼倾注于心中的；哪一种是因始祖的逾越临到我们的；或哪一种是魔鬼煽动的。
    - type: paragraph
      text:
        ru: Первая ведь только в сердце с молитвой начинается и в сердце заканчивает молитву, подавая душе извещение и духовные плоды. Вторая же от почек имеет начало и в почках заканчивает молитву, жестокость и студеность и смущение души наносит. Третья же, от смешения с похотью возбудив жжение, распаляет члены и сердце сладострастием блудным, пленяя ум скверными помыслами и к телесному совокуплению привлекая, что внимательному и возможно быстро познать и заметить. Хотя враг, сказалГригорий Синаит, и производит внутри естественных членов подмены, какие хочет, вместо теплоты духовной наводя свое жжение и вместо веселия принося бессмысленную радость и мокротную сладость, и понуждает воспринимать как действующую благодать свою прелесть, но время, опыт и чувство научают его распознавать. «А поскольку временем, опытом и чувством познается прелесть, того ради не подобает бояться или сомневаться, Бога призывая», – сказал тот же святой.[31]
        cn: 第一种实在唯独在心中以祷告开始，并在心中结束祷告，赐予灵魂启迪和属灵的果实。第二种则从腰肾发端，并在腰肾结束祷告，带来灵魂的刚硬、冰冷和困惑。第三种则与情欲混合，激起灼烧感，用淫荡的肉欲燃遍肢体和心，以污秽的意念俘虏心思，并引诱人行肉体上的结合，对此，细心的人能迅速认清和察觉。虽然敌人，革利免·西乃山人曾说，会在自然肢体内随心所欲地进行替代，用他的灼烧感代替属灵的温暖，用毫无意义的喜乐和黏腻的甘甜代替真正的欢愉，并强迫人将他的妄想误认为是运行中的恩典，但时间、经验和感觉会教导他辨别。「既然妄想可以通过时间、经验和感觉来识破，所以当我们呼求上帝时，不应恐惧或怀疑。」——同一位圣人如此说。[31]
    - type: paragraph
      text:
        ru: «Если же некоторые и совратились, будучи повреждены умом, разумей, что от самочиния и высокоумия они так пострадали».[32]Не для того ведь, чтобы напугать или отогнать нас от этого священного делания написали святые отцы о прелести в многоразличных видах ипо разнымпричинам настигающей делателей, но ради осторожности нашей и для познания лукавого действия сатанинского, из-за которого и повелевают всем борющимся со страстями держаться царского не грозящего падениями пути, вдвоем или втроем живя в пустыне, где, добрыми советниками брат брата имея и день и ночь святое Писание изучая, могут благодатью Христовою, не впадая в прелесть, обучаться этому умному деланию.
        cn: 「如果有些人确实走入歧途了，心智受损，你当明白，他们是因自作主张和心高气傲才如此受苦的。」[32]圣教父们写下关于「妄念」——那以各种形式并因各种原因降临到灵修者身上的——并非是为了恐吓我们或使我们远离这项神圣的灵修操练，而是为了我们的谨慎，并为了认识撒旦的诡诈作为。因此他们命令所有与情欲搏斗的人，要紧守那君王般的、不至于跌倒的道路，两人或三人生活在旷野中，在那里，弟兄互为良善的建议者，日日夜夜研习圣经，便能借着基督的恩典，不陷入妄念，学习这项心智的操练。
    - type: paragraph
      text:
        ru: Некоторым из множайших неведомо откуда возомнилось, будто нынешним монахам не дается больше действие Святого Духа, как прежним. Уже ведь минули, говорят они, таковые времена. Но это – первое преткновение так говорящих, потому что о знамениях и чудотворениях сказали это отцы, – что без них некое умаление веры бывает, по слову Христову:«Блаженны не видевшиеМеняи уверовавшие»(ср.:Ин. 20, 29), – а не о прекращении действия Святого Духа. Они ведь сподобляясь непосредственно, подобно херувимам, беседовать со Христом в сердце чистою молитвою.
        cn: 不知从何处，有些人臆想出，认为当今的修士不再被赐予圣灵的运行，如同从前的修士一样。他们说，那样的时代已经过去了。但这乃是这样说之人的第一个绊脚石，因为教父们谈及神迹和奇事时说过，没有它们，信心会某种程度地减损，依基督的话语：「福哉那些没有看见我却信了的人」（约翰福音 20:29），——而不是关于圣灵运行的停止。因为他们蒙受殊荣，得以直接地，如同革鲁宾一样，在心中借着纯净的祷告与基督交谈。
    - type: paragraph
      text:
        ru: 'Потому несправедливо измышлением причины грехов упрекать время или Бога за оскудение действия Святого Духа. Но трем злейшим исполинам всю вину в этом приписав – неверию, имею в виду, лености и небрежению, – будем отступать от лжи и, взявшись за истину, приступим, не сомневаясь, к обучению умному деланию, отлагая от себя и еще три главнейших супостата: самолюбие, имею в виду, сребролюбие и тщеславие, – с которыми вместе и иные можем из наших душ истреблять.'
        cn: 因此，若借口罪恶的缘由，指责时间或上帝，归咎于圣灵行动的匮乏，是不公正的。然而，我们应将一切罪责归咎于这三个至恶的巨灵——我指的是不信、懒惰和怠惰——我们当远离虚谎，持定真理，毫不迟疑地着手学习心智的修行，并从我们自身摒弃另外三个主要的仇敌：我指的是自爱、贪财和虚荣，与它们一同，我们也能将其他的仇敌从我们的灵魂中根除。
    - type: paragraph
      text:
        ru: Это я, многогрешный инок Иннокентий, написал. Усердно читающих молю, чтобы всякий, желающий в Божьем хранении жить и небесных благ быть наследником, постарался от этого написанного не уклоняться, но, все это в памяти своей имея, всем сердцем и мыслию исполнять. Им же от Христа Спасителя нашего благословение как послушным да будет ныне и в бесконечные веки. Аминь.
        cn: 这是我，多罪的僧人因诺肯提所写。我恳求虔心阅读者，愿所有渴望生活在上帝的护佑之中，并成为天上福乐的继承者，都能努力不偏离这所写的一切，而是将这一切铭记于心，并全心全意地去实行。愿我们的救主基督赐福于他们，作为顺从之人，从现在直到永世无尽。阿们。
    - type: paragraph
      text:
        ru: Написано в селе Т. чете(?)1784 года в месяце августе.
        cn: 写于T村，读(?)1784年八月。
    - type: heading4
      text:
        ru: notes
        cn: 笔记
      children: []
