  - type: paragraph
    text:
      ru: Творения прп. Василия, относящиеся к прп. Нилу взяты из книги Г. М. Прохорова «ПреподобныеНил Сорскийи Иннокентий Комельский. Сочинения». Прохоров (вместе сН. Поповым) оспаривают авторство Василия и приписывают данные тексты прп. Иннокентию Комельскому. Однако традиция (как церковная, так и историографическая) все же стоит за авторство Василия.
      cn: 圣者瓦西里与圣者尼罗相关的著作摘自 G. M. 普罗霍罗夫的著作《圣者索尔斯基的尼罗与科梅尔斯基的英诺森。著作》。普罗霍罗夫（与 N. 波波夫一同）对瓦西里的作者身份提出异议，并将这些文本归于圣者科梅尔斯基的英诺森。然而，传统（无论是教会传统还是史学传统）仍然支持瓦西里的作者身份。
