- type: heading1
  text:
    ru: Толкование на молитву святого Ефрема Сирина
    cn: 圣以法莲叙利亚人祷告的诠释
  children:
  - type: paragraph
    text:
      ru: «Господи и Владыко живота моего! Дух праздности, уныния, любоначалия и празднословия не даждь ми! Дух же целомудрия, смиренномудрия, терпения и любви даруй ми, рабу Твоему. Ей, Господи Царю, даруй ми зрети моя прегрешения и не осуждати брата моего, яко благословен ecи во веки веков. Аминь».
      cn: '«主啊，我生命的主宰！

        懈怠、沮丧、好为首和虚谈之灵，不要赐予我！

        但求祢将贞洁、谦卑、忍耐和爱之灵，赐予我，祢的仆人。

        恳求祢，主君王啊，赐予我看见我的过犯，并且不审判我的弟兄，因为祢是永世受颂扬的。

        阿门。»'
  - type: paragraph
    text:
      ru: Вы знаете, что это молитва преподобногоЕфрема Сирина, о котором уже говорил вам, и некоторые из великих творений которого зачитывал. Почему этой молитве СвятаяЦерковьуделяет такое необычно видное место в богослужении, почему так много раз повторяется она во время всех великопостных богослужений? Не без особой причины – чувствуете сами сердцем вашим, в чем причина – эта молитва проникает в сердце, как никакая другая, вы чувствуете особую, исключительную, божественную силу ее.
      cn: 你们知道，这是叙利亚的圣厄弗棱的祷文，我已向你们提过他，也曾诵读过他的一些伟大作品。为什么圣教会对这篇祷文在礼仪中给予如此非同寻常的重要地位，为什么它在所有大斋期的礼仪中被如此多次地重复呢？这并非没有特别原因——你们自己心中感受得到，原因何在——这篇祷文能像没有其他祷文那样深入人心，你们感受到它那独特、超凡、神圣的力量。
  - type: paragraph
    text:
      ru: Отчего это? Оттого, что излилась она из сердца совершенно очищенного, совершенного, святого, из ума, просвещенного Божией благодатью, который стал причастником ума Христова. Поэтому такая власть, такое таинственное действие на сердце христианское этой удивительной молитвы.
      cn: '这是为何？

        这是因为它流淌自一颗全然洁净、完全、圣洁的心，以及一个蒙受上帝恩典光照、并已成为基督之心智的分享者的心智。因此，这奇妙的祷告对基督徒的心，才具有如此的权能和奥秘的功效。'
  - type: paragraph
    text:
      ru: Для начала скажу, что чрезвычайно важен сам факт, что святой Ефрем просит Бога, чтобы избавил его от всего порочного, что противно Богу, чтобы Господь сподобил его добродетелей, важнейших великих добродетелей. Почему просит об этом? Есть люди, и в особенности были такие в прежние языческие времена, которые во всем полагались на себя, думали, что все достижимо силами их ума, их чувства. Есть и теперь люди, которые не понимают, что многое, и притом самое важное, самое драгоценное, самое сокровенное нашему уму и чувству недоступно.
      cn: 首先我要说的是，圣厄弗冷祈求上帝使他摆脱一切与上帝相悖的邪恶事物，并使上主赐予他德行，即那些极其重要的伟大德行，这个事实本身就极其重要。他为何如此祈求？有些人，尤其在昔日异教时代有这样的人，他们凡事都倚仗自己，认为一切都可以凭借他们的心智和情感的力量达成。如今也有人不明白，许多事物，而且是最重要、最宝贵、最隐秘的事物，是我们的心智和情感所无法企及的。
  - type: paragraph
    text:
      ru: 'Люди, понимающие это, помнят, что сказано святым апостолом Павлом: «Не понимаю, что делаю: потому что не то делаю, что хочу, а что ненавижу, то делаю» (Рим. 7, 15). Так говорит величайший верховный апостол, сознавая свое бессилье идти по пути добра, глубоко понимая, что плоть его, которая тянет вниз и не пускает сердце высоко к Богу, имеет огромную власть над ним. Он тосковал, мучился душой, что не творил того доброго, чего жаждала душа его, а творил то злое, чего не хотел.'
      cn: 明白这一点的人记得圣使徒保罗所说的话：「我所做的，我不明白；因为我所愿意的，我没有做；我所憎恨的，我反而做。」（罗马书 7:15）。伟大至高的使徒如此说，他意识到自己无力走在善的道路上，深刻地明白他的肉体——这肉体向下牵引，不让他的心高举归向上帝——对他有着巨大的权势。他心中忧愁，灵魂备受折磨，因为他没有做灵魂所渴望的善事，却做了他不愿做的恶事。
  - type: paragraph
    text:
      ru: Святой Ефрем, глубоко сознавая это, молил Бога, чтобы избавил от пороков, чтобы дал силу творить добро. Силу творить добрые дела получаем только от Бога, силу избавиться от пороков получаем только от Бога. Это смутно сознает душа каждого христианина, и потому так трогает молитва святогоЕфрема Сирина.
      cn: 圣以弗仑叙利亚人，深深领悟到这一点，向上帝祈求，求祢使他摆脱罪恶，并赐予他行善的力量。行善的力量唯独来自上帝，摆脱罪恶的力量也唯独来自上帝。每位基督徒的灵魂都朦胧地感知到这一点，因此，圣以弗仑叙利亚人的祷文才如此动人心弦。
  - type: paragraph
    text:
      ru: 'Вникните глубже в эту молитву, подумайте, почему не просит он просто, чтобы Бог избавил от таких и таких пороков и дал такие и такие добродетели. Почему говорит: «Дух праздности, уныния, любоначалия и празднословия не даждь ми». Почему говорит о духе пороков, говорит о духе добродетелей – это важно понять.'
      cn: 深入思考这个祷文，想想他为何不只是简单地祈求上帝使他摆脱这样那那样的恶习，并赐予他这样那样的美德。为何他说：「懒惰、灰心、贪权和空谈之灵，求祢不要赐给我。」为何他谈及恶习之灵，又谈及美德之灵——这一点理解起来非常重要。
  - type: paragraph
    text:
      ru: Вы знаете, что вещи имеют свой запах, свойственный им. Если в вашей комнате останутся вещи ваши, сосуды разные, все, что потребляли при жизни в ней, и комната останется запертой, в ней останется запах ваш, дух этих вещей. Знаете, что, если в сосуд влить вещество благовонное, потом опорожнить сосуд и вымыть, надолго останется аромат; и напротив, если влить чего-либо зловонного, то зловонный дух останется надолго-надолго. Так бывает и в человеческой душе. В душе человека оставляют свой дух, свой след все пороки, которыми грешит человек, оставляет, с другой стороны, свой свет все добро, которое творит он. Если человек всегда творил злые дела, если его душа пропитана пороками, в душе останется навсегда дух этих пороков. Если человек живет доброй жизнью, творит много добра, если душу освящает постоянно молитвой, он проникается духом молитвы, духом добродетелей, духом праведности.
      cn: 你们知道，物件有其固有的气味。倘若你们的物件，各种器皿，以及你们在其间生活时所用的一切，都留在你们的房间里，并且房间保持上锁，那么你们的气味，这些物件的气息，将留在其中。你们知道，倘若将芬芳的物质倒入器皿中，随后将器皿倒空并洗净，香气会长时间留存；反之，倘若倒入某种恶臭之物，那么恶臭的气息将长久长久地留存。在人的灵魂中亦是如此。人所犯的一切罪愆，都在人的灵魂中留下其气息，其印记；另一方面，他所行的一切善事，则留下其光芒。倘若一个人总是行恶事，倘若他的灵魂被罪愆浸透，那么这些罪愆的气息将永远留在他的灵魂中。倘若一个人过着良善的生活，广行善事，倘若他不断地以祷告圣化灵魂，他便会充满祷告的气息、美德的气息、公义的气息。
  - type: paragraph
    text:
      ru: Знаем по житейскому опыту, что мы можем уже при кратком знакомстве, иногда при первой же встрече, можем уловить, какого духа человек. Если встретимся с человеком, погрязшим в грехах, уловите, какого духа этот человек. Это подобно тому, как собака ищет по запаху, который остается даже на следах человека, и приводит к этому человеку.
      cn: 我们凭着生活经验得知，即便在短暂相识之时，有时甚至在初次见面时，我们就能察觉出一个人是何等心神。如果我们遇到一个沉溺于罪恶之人，便能察觉此人是何等心神。这好比狗凭气味搜寻，那气味甚至残留在人的足迹上，并能循着它找到这个人。
  - type: paragraph
    text:
      ru: Есть у каждого человека свой дух, и вот святойЕфрем Сиринпросит Бога не только о том, чтобы избавил его от пороков и дал добродетели, просит, чтобы дал ему Господь дух этих добродетелей, избавил бы его от духа порока – даже, чтобы не было следа, запаха порока, чтобы благоухало Христом.
      cn: 每一个人的身上都有他自己的灵，而圣叶夫列姆叙利亚人向上帝祈求，不仅是求祢使他脱离恶行，赐予他美德，他恳求上主赐予他这些美德的灵，使他摆脱恶行的灵——甚至连一点罪恶的痕迹、气息都不要留下，使之散发基督的馨香。
  - type: paragraph
    text:
      ru: Надо знать, что гораздо легче избавиться от отдельных пороков, чем избавиться от духа этих пороков. Дух этот чрезвычайно цепко держится у сердца нашего, и совсем избавиться от духа порочного возможно только постепенно, молясь Богу о помощи, чтобы Бог избавил от этого зловредного духа. Так нужно понимать словаЕфрема Сирина. Может быть, и более прямо можно их понимать.
      cn: 须知，摆脱单个的恶行远比摆脱这些恶行的灵更容易。这灵极其牢固地附着在我们的心中，而要完全摆脱这败坏的灵，则只能循序渐进地进行，并向 上帝 祷告求助，好使 上帝 救我们脱离这邪恶的灵。应当如此理解圣厄弗所的话。或许，也可以更直接地理解它们。
  - type: paragraph
    text:
      ru: 'Всегда живем мы и действуем под духовным воздействием двух родов: с одной стороны – благодатное святое воздействие Самого Бога, Ангелов святых и, в особенности, нашего Ангела Хранителя, с другой стороны – темным потоком всегда изливается на нас дух сатаны, дух бесовский. И как среди Ангелов света есть Ангелы-носители отдельных святых добродетелей, так и среди бесов есть носители отдельных грехов, воздействующие на нас всегда. Вот и просит святой Ефрем Бога о том, чтобы благодатью Божией были отогнаны темные, лукавые духи бесовские, которые ведут нас ко греху.'
      cn: 我们总是生活和行动在两种属灵的影响之下：一方面是来自上帝本身、众圣天使，尤其是我们的守护天使的恩典和神圣的影响；另一方面，撒旦的灵、邪灵的黑暗洪流总是倾泻在我们身上。正如在光明的天使中，有承载着个别圣善美德的天使，同样在邪灵中，也有承载着个别罪恶的，总是影响着我们。因此，圣厄弗仑祈求上帝，为的是借着上帝的恩典，那些引我们走向罪恶的黑暗的、狡猾的邪灵能够被驱逐。
  - type: paragraph
    text:
      ru: 'Вот видите, что значат эти глубокие словаЕфрема Сирина. Просите сознательно того, чтобы освободиться нам от самого духа нечестия, злобы, всех пороков, что чрезвычайно трудно, так как власть бесов над нами чрезвычайно сильна. Помните, что собственными усилиями не можете избегнуть темного, гибельного влияния этих духов и смиренно молитесь Богу, как научает молитьсяЕфрем Сирин:'
      cn: 可见圣厄弗良叙利亚人的这些深刻言语所蕴含的意义。要自觉地祈求，使我们能脱离那不虔、邪恶、以及一切罪恶的灵，这极其困难，因为邪魔在我们身上的权势极其强大。请记住，靠着自己的努力，你们无法逃脱这些幽暗、毁灭性之灵的影响，当谦卑地向上帝祈祷，正如圣厄弗良叙利亚人教导我们的祷告方式：
  - type: paragraph
    text:
      ru: «Господи и Владыко живота моего! Дух праздности, уныния, любоначалия и празднословия не даждь ми! Дух же целомудрия, смиренномудрия, терпения и любви даруй ми, рабу Твоему. Ей, Господи Царю, даруй ми зрети моя прегрешения и не осуждати брата моего, яко благословен ecи во веки веков. Аминь».
      cn: '«主啊，我生命的主宰！

        懈怠、沮丧、好为首和虚谈之灵，不要赐予我！

        但求祢将贞洁、谦卑、忍耐和爱之灵，赐予我，祢的仆人。

        恳求祢，主君王啊，赐予我看见我的过犯，并且不审判我的弟兄，因为祢是永世受颂扬的。

        阿门。»'
  - type: heading2
    text:
      ru: Молитва святого Ефрема Сирина – о праздности
      cn: 圣厄弗愣叙利亚人祷文——论懈怠
    children:
    - type: paragraph
      text:
        ru: Господи и Владыко живота моего! Дух праздности, уныния, любоначалия и празднословия не даждь ми!
        cn: 主啊，我生命的主宰者！怠惰、沮丧、好为首与空谈之灵，求祢不要赐予我！
    - type: paragraph
      text:
        ru: Так начинает святойЕфрем Сиринсвою великую молитву. Почему начинает он с прошения избавить от праздности, как будто нет более тяжких пороков, чем праздность?
        cn: 圣厄弗棱叙利亚人如此开始他的伟大祷文。他为何以祈求摆脱怠惰开始，仿佛没有比怠惰更为严重的罪恶一般呢？
    - type: paragraph
      text:
        ru: Святой Ефрем говорит о праздности, а ему виднее, чем нам, что важнее, что гибельнее, какой порок сильнее, опаснее, и, если говорить о праздности, начинает свою молитву с моления не дать духа праздности, значит, праздность есть весьма опасный порок.
        cn: 圣厄弗棱论及懒惰。他比我们更清楚何为更重要，何为更具毁灭性，何种罪恶更强大、更危险。并且，若要论及懒惰，他便以祈求不赐予懒惰之灵来开始他的祷告，这意味着懒惰乃是一种极其危险的罪恶。
    - type: paragraph
      text:
        ru: Наблюдая праздность с обычной, житейской точки зрения, видим, что праздность презренна, заслуживает всеобщего осуждения. Смотрите, как низки праздные люди, не хотящие работать, проводящие свою жизнь в полной праздности и доходящие до многих-многих пороков. Праздность является матерью огромного количества пороков. Лежат праздные люди, ничего не делая, сидят и мечтают. О чем? Ни о чем, мысли их блуждают часто совершенно бесцельно; они вспоминают прошлое, то счастье, те радости, которые пережили, мечтают, чтобы все это повторилось. Думают только об этом, ни о чем серьезном, не сосредотачиваются мыслью своей на глубокой серьезности жизни, на огромной ответственности, которая лежит на каждом не только пред людьми, но и пред Самим Богом.
        cn: 从普通的、世俗的观点来看待虚度光阴，我们看到，虚度光阴是可鄙的，理应受到普遍谴责。看看那些虚度光阴的人是多么卑劣，他们不愿工作，将生命全然虚度，以至堕入重重罪恶之中。虚度光阴是滔天罪恶之母。虚度光阴之人躺卧其间，一无所事，坐着冥想。想些什么？一无所想，他们的思绪常常漫无目的、全然漂泊；他们追忆往昔，回想他们曾经历的幸福与喜乐，梦想这一切能重演。他们只顾念及此，不思任何严肃之事，不将思想集中在生命的深层严肃性上，以及每个人所肩负的巨大责任上，这责任不仅在人面前，更是在上帝自己面前。
    - type: paragraph
      text:
        ru: 'Праздный человек – вредный член общества, вредный член государства. Праздность доводит до больших и тяжких пороков. Праздные люди не способны работать, впадают в бедность, в нищету. Сами по себе не приходят деньги, не приходит богатство, работать не хотят, а ничто не приходит само по себе, и человек нуждается во всем, что необходимо для жизни, и кроме того, в том, что превышает предел необходимого: нужны ему удовольствия, нужна роскошь в жизни.'
        cn: 闲懒之人是社会有害的成员，也是国家有害的成员。闲懒导致巨大而深重的罪恶。闲懒之人无法劳作，陷入贫困，甚至赤贫。金钱不会自行到来，财富也不会自行到来，他们不愿劳作，然而万物皆不会自行到来，而人需要生命所需的一切；此外，还需要超出必需的限度：他需要享乐，需要在生活中享有奢华。
    - type: paragraph
      text:
        ru: Чтобы достать денег, он измышляет разные, нередко греховные, средства, становится способен на всякую низость, на темные дела, воровство, ложь, обман, взятки. Так презренна праздность уже с точки зрения чисто житейской.
        cn: 为了弄到钱，他构思出各种各样的、常常是罪恶的手段，变得能行各样卑劣之事，例如暗昧的勾当、偷盗、谎言、欺骗、贿赂。因此，懒惰是如此可鄙，即便单从纯粹世俗生活的角度来看也是如此。
    - type: paragraph
      text:
        ru: А что скажем, если будем говорить о праздности в духовной жизни нашей? Неужели она заслуживает меньшего осуждения, чем в области жизни нашей материальной? Еще гораздо более гибельна она в жизни духовной. Всякая способность наша, остающаяся без упражнения, теряется. Если музыкант, достигший совершенства в игре, перестает упражняться, на долгие годы оставит совсем музыку, он теряет свое совершенство в игре.
        cn: 那么，倘若我们谈论在我们的属灵生活中的懈怠，我们当如何说呢？难道它应得的谴责，会比在我们物质生活领域中的懈怠更少吗？在属灵生活中，它甚至更具毁灭性。我们的任何能力，若不加以操练，就会丧失。倘若一位音乐家，达到了演奏的精湛境界，却停止练习，并完全放下音乐多年，他就会失去其演奏的精湛技艺。
    - type: paragraph
      text:
        ru: Каждый орган нашего тела без упражнения приходит в состояние вялости, неспособности работать. Человек, который всегда лежит и лежит, теряет способность ходить. Кто не работает руками своими, доводит мускулы рук до дряблости. При физическом бездействии силы тела угасают.
        cn: 我们身体的每一个器官，若不加以锻炼，就会变得迟钝，无法发挥功能。一个人若总是躺卧不起，就会丧失行走的能力。谁若不使用自己的双手工作，就会使手臂的肌肉变得松弛无力。在身体不活动的情况下，身体的力量就会衰退。
    - type: paragraph
      text:
        ru: 'Также и способности души: всякая духовная способность, оставленная без упражнения, теряется. Если человек не молится, то теряет способность молиться. Человек, который всегда отвергает пост, не заставит себя молиться. Кто не следит за духом, за сердцем своим, становится распущенным в духовном отношении, никогда ни за чем не следит. Душа, оставшаяся без упражнения, становится подобной ниве, не возделанной несколько лет, которая зарастает бурьяном, негодной травой, колючками, которую трудно сделать плодоносной. Праздность духа, неупражнение в добрых делах приводят к гибели души, к зарастанию души всеми сорными травами греха. Как это ни тяжело, в этом еще не вся беда.'
        cn: 以及灵魂的能力：凡未经操练的属灵能力，都会丧失。如果人不去祷告，就会失去祷告的能力。那总是拒绝禁食的人，便无法强迫自己祷告。谁若不看顾自己的灵，不看顾自己的心，就会在属灵上变得放纵，从不警醒。未经操练的灵魂，就像一片多年未耕的田地，长满了杂草、无用的野草和荆棘，难以使其结出果实。灵的怠惰，不操练善行，导致灵魂的毁灭，导致灵魂被一切罪恶的杂草所覆盖。尽管这很沉重，但这还不是全部的祸患。
    - type: paragraph
      text:
        ru: Гораздо большая беда, что теряем дни духовного делания – краткие дни своей жизни, а они даны от Бога для того, чтобы достичь великой и святой цели, чтобы подготовиться к Страшному Суду, к ответу на Суде, чтобы стали мы достойными в очах Божиих, чтобы не поставил Он нас в левую сторону и не сказал:«Идите..., проклятые, в огонь вечный, уготованный диаволу и ангелам его»(Мф. 25, 41).
        cn: 更大的祸患在于，我们失丧了灵性操练的日子——我们生命中短暂的日子，而这些日子乃是上帝所赐，旨在达成一个伟大而神圣的目标，为了预备面对可怕的审判，预备在审判中的答辩，为了使我们在上帝眼中成为配得之人，好叫祂不将我们安置在左边，不至于说：「离开我吧，你们这被咒诅的人，进入永火，那是为魔鬼和它的使者所预备的。」 (马太福音 25:41)
    - type: paragraph
      text:
        ru: Жизнь нам дана для того, чтобы мы спешили, спешили делать великое дело очищения сердца своего, следуя за Господом Иисусом Христом. А ведь это следование – напряженное делание, нередко тяжкий труд, а не праздность. Это перенесение страданий за Господа Иисуса Христа, а праздность не страдает, избегает страдания.
        cn: 生命赐予我们，是为了让我们赶紧、赶紧地去完成洁净自己心灵的伟大圣工，追随主耶稣基督。然而，这种追随乃是紧张的操练，常常是艰巨的劳作，而不是怠惰。这是为了主耶稣基督而忍受苦难，而怠惰不会受苦，它逃避苦难。
    - type: paragraph
      text:
        ru: 'Знаете ли вы, что все святые, которые, казалось бы, и не нуждались в труде, которые все время жизни посвящали духовным подвигам, делили время суток на три части: одну часть – молитве, другую часть – чтению слова Божьего, одну часть – работе, труду. Они жили в пустыне, в дикой Ливийской пустыне, жили в лесах Дальнего Севера, в непроходимых дебрях, и посвящали труду одну часть своего времени.'
        cn: 你们知道吗，所有那些圣徒，他们似乎并不需要劳作，他们将自己一生的时间都奉献给属灵的功修，却将昼夜的时间分成三部分：一部分用于祷告，一部分用于阅读上帝的圣言，一部分用于工作、劳作。他们生活在旷野里，在那荒凉的利比亚旷野；他们生活在遥远北方的森林里，在那人迹罕至的丛林深处；并且将他们时间的一部分奉献给劳作。
    - type: paragraph
      text:
        ru: 'Разный труд избирали они: плели корзины, рогожи, разводили огороды, рубили лес, строили келии, церкви и целые монастыри. То, что делали руками, продавали в ближайший город, питались сами и питали нищих. Считали они труд важным и необходимым делом.'
        cn: 他们选择从事不同的劳动：编织篮子和粗席，耕种菜园，伐木，建造隐修室、圣堂，甚至整个修道院。他们将亲手所做的出售到最近的城镇，以此供养自己并供养贫者。他们认为劳动是一项重要而必要的事务。
    - type: paragraph
      text:
        ru: Святой апостол Павел проповедовал по целым дням Бога, а по ночам делал палатки. При свете луны или лампы он усердно трудился, считая для себя обязательным труд. Главный труд, главное его стремление было в том, чтобы бежать, чтобы спешить сколько было сил к цели – бежать в Царство Божие.
        cn: 圣使徒保罗整日宣讲上帝，而夜间则制造帐篷。在月光或灯火下，他殷勤劳作，视劳作为己任。他主要的劳作，他主要的志向，在于竭力奔赴目标——奔入上帝的国。
    - type: paragraph
      text:
        ru: Знаете ли его удивительные слова:«Братия, я не почитаю себя достигшим; а только, забывая заднее и простираясь вперед, стремлюсь к цели, к почести вышнего звания Божия во Христе Иисусе»(Фил. 3, 13–14).
        cn: '您可曾知道他那奇妙的话语？：

          「弟兄们，我不是以为自己已经得着了；我只有一件事，就是忘记背后，努力面前的，向着标竿直跑，要得上帝在基督耶稣里从上面召我来得的奖赏。」

          （腓立比书 3:13-14）'
    - type: paragraph
      text:
        ru: Он, нисколько не считая себя достигшим, стремился все вперед, забывая уже достигнутое, стремился к цели высшей, к получению высшего звания Божественного во Христе Иисусе.
        cn: 他，丝毫未曾自以为已经达到，却总是竭力向前，忘记已达到的，竭力向着更高的目标，为要获得在基督耶稣里那高阶的属神召叫。
    - type: paragraph
      text:
        ru: Это пример жизни, противоположной жизни праздных людей. Никакого следа праздности не найдете в жизни апостола Павла, в жизни отшельников-постников, в жизни монашеской, в жизни великих святых. Все они занимались с утра до ночи. Праздности чуждались, праздность считали великим и гибельным злом.
        cn: 这是一个与虚度光阴之人所过的生活截然相反的范例。在使徒保罗、禁食的隐修士、修道者以及诸位大圣徒的生命中，都寻不见丝毫闲散的踪迹。他们每一个人都从早到晚地操劳着。他们远避闲散，并将其视为一种巨大而致命的恶。
    - type: paragraph
      text:
        ru: Надо, слыша молитву святогоЕфрема Сирина, которая так часто повторяется, внимательно вслушиваться в каждое слово молитвы, запоминать, вникать в смысл этих слов и запечатлеть их навсегда в сердце своем. Буду помогать вам запечатлевать их. Сегодня запечатлел прошение святого Ефрема об избавлении от духа праздности.
        cn: 务要，在听闻圣埃弗拉姆叙利亚人的祷文时，此祷文常被诵念，仔细聆听祷文中的每个字句，铭记，并深入领会这些字句的含义，将其永远铭刻在自己心中。我将协助祢们将其铭刻于心。今日我已将圣埃弗拉姆关于摆脱懈怠之灵的祈求铭刻于心。
    - type: paragraph
      text:
        ru: Помните, что жизнь коротка, надо спешить, спешить, как апостол Павел спешил, – надо спешить в делании Господу. Аминь.
        cn: 谨记，生命短暂，当急速，急速，像使徒保罗那样急速，——当在为上主做工之事上急速。阿们。
  - type: heading2
    text:
      ru: Молитва святого Ефрема Сирина – об унынии
      cn: 叙利亚的圣以法莲的祷文——论灰心
    children:
    - type: paragraph
      text:
        ru: Господи и Владыко живота моего! Дух уныния не даждь ми.
        cn: 主啊，我生命的主宰！不要赐予我忧郁之灵。
    - type: paragraph
      text:
        ru: Что такое дух уныния? Это то, что называют упадком духа. Люди, совсем не понимающие христианства, не понимающие нашей духовной жизни, думают, что вся религия христианская полна духом уныния. Глядя на монахов, ходящих в черной одежде потупив глаза и перебирая четки, думают, что вся религия уныла, как вид монахов. А это совсем не так. Это противоречит тому духу, которым проникнуто все христианство, ибо скажите, человек с упадком духа может ли обладать силой духовной, бодростью духовной, необходимыми для того, чтобы идти по узкому пути, неутомимо борясь с бесами? Конечно, нет.
        cn: 何为忧郁之灵？这就是所谓的精神萎靡。那些全然不理解基督教、不理解我们灵性生活的人，认为整个基督教信仰都充满了忧郁之灵。看着那些身着黑衣、垂下眼睑、拨动着念珠的修士们，他们就认为整个信仰都死气沉沉，如同修士们的样子一般。然而绝非如此。这与整个基督教所贯穿的灵性相悖。因为请问，一个精神萎靡的人，能否拥有行走于窄路之上，不倦地与魔鬼搏斗所必需的灵性力量与灵性活力呢？当然不能。
    - type: paragraph
      text:
        ru: 'Наша религия – не религия уныния, наоборот, она – религия бодрости, энергии, силы воли, силы характера. Религия наша плодом своим имеет не уныние, а нечто совершенно противоположное, то, о чем говорит апостол Павел:«Плод же духа: любовь, радость, мир, долготерпение, благость, милосердие, вера, кротость, воздержание. На таковых нет закона»(Гал. 5, 22–23).'
        cn: '我们的宗教不是忧郁沮丧的宗教，相反地，它是一种振奋、充满活力、意志坚强、品格刚强的宗教。我们的宗教结出的果实不是忧郁沮丧，而是某种完全相反的东西，正如使徒保罗所说的：

          「圣灵的果实却是：爱、喜乐、和平、忍耐、恩慈、良善、信德、温柔、节制。对于这样的事，是没有律法的。」(加拉太书 5:22-23)'
    - type: paragraph
      text:
        ru: 'Вот это подлинный дух, сущность нашей религии: вовсе не уныние, а праведность, мирная радость о Духе Святом. Разве обладающий этой радостью может быть унылым? Конечно, нет.'
        cn: 这就是我们信仰的真正精神，它的精髓：绝非颓丧，而是义德，在圣灵中的平和喜乐。难道拥有这喜乐的人还会颓丧吗？当然不会。
    - type: paragraph
      text:
        ru: Люди часто ошибаются, оценивая внешность человека. Подлинный христианин не имеет такого вида, как люди, предающиеся радостям жизни. Он всегда мирен, часто бывает на вид глубоко задумчив, ходит, опустив голову, предаваясь своим размышлениям. Разве значит это, что он уныл, упал духом? Это значит, что радости мирские, которые ценят другие люди, далеки от христиан, чужды ему, как чужды взрослому человеку детские игры и забавы.
        cn: 人们常常在评判一个人的外貌时犯错。真正的基督徒没有那样一种外表，像那些沉溺于世俗的快乐的人一样。他总是平静的，常常在外表上显得深沉地沉思着，垂着头行走，沉浸在自己的思虑中。这难道意味着他是沮丧的，意志消沉的吗？这意味着，那些其他人所珍视的世俗快乐，对基督徒而言是遥远的，对他来说是陌生的，就像儿童的游戏和玩乐对成年人而言是陌生的一样。
    - type: paragraph
      text:
        ru: Мысли христианина сосредоточены на вечном, на Царстве Божьем, обращении к Господу Иисусу Христу, поэтому он всегда серьезен и задумчив. Иногда бывает, что и христиане становятся по временам унылыми, наступает упадок духа. Они, уже далеко уйдя по пути Христову, пути отречения от мира, иногда мыслями возвращаются на прежний путь; им кажется, что напрасно сошли они с этого пути, что хорошо было бы идти по широкому проторенному пути, по которому идет большинство людей. Тогда впадают в уныние.
        cn: 基督徒的思想专注于永恒之事，专注于上帝之国，专注于归向主耶稣基督，因此他总是严肃而沉思的。有时，基督徒也会时常变得忧郁，感到精神萎靡。他们，在基督的道路上，那条舍弃世界的道路上已走得很远，有时思想却回到从前的道路上；他们觉得当初白白离开了那条道路，觉得走在宽阔的、众所周知的、大多数人所走的道路上会更好。那时他们就陷入了忧郁。
    - type: paragraph
      text:
        ru: Это состояние тех людей, которые познали великие тайны Христовы, оставили широкий путь соблазнов мира, пошли по пути страданий за Христом. Их соблазняет дьявол, останавливают легионы бесов, мешают идти по Христову пути, представляя картины радостной жизни, которую оставили, картину счастья семейного, блаженства дружбы, тянут с великого пути обратно, обратно на этот путь.
        cn: 这是那些认识了基督的伟大奥秘，舍弃了世俗诱惑的宽广道路，并踏上了为基督受苦的道路的人们的状态。恶魔引诱他们，群魔的军团阻拦他们，阻碍他们走基督的道路，向他们展现他们所舍弃的欢乐生活的画面，家庭幸福的画面，友谊的福乐，将他们从这条伟大的道路上拉回去，拉回到那条路上。
    - type: paragraph
      text:
        ru: 'И нередко бесам удается достигнуть своего: человек впадает в уныние, падает духом, теряет ревность о Господе Иисусе Христе, и это уныние – великая опасность, подстерегающая каждого христианина на пути его за Христом, это соблазн дьявольский. Этим наветам духов тьмы подвергались все святые, и в огромном большинстве случаев молитвой, постом, бдением побеждали христиане духа уныния, навеваемого от дьявола. Но были и такие, дух уныния в душах которых все возрастал и возрастал, и уходили они с пути Христова. А когда уходили, чувствовали себя оставленными Богом, пустота и тяжесть жизни становились им невыносимыми, и кончали они часто жизнь самоубийством.'
        cn: 并且邪魔常常得逞：人陷入忧郁，意志消沉，失去了对主耶稣基督的热忱，而这种忧郁是巨大的危险，潜伏在每个基督徒追随基督的道路上，这是魔鬼的诱惑。黑暗之灵的这些诱惑，所有的圣徒都曾遭受过，并且在绝大多数情况下，基督徒们借着祷告、禁食、守夜，战胜了由魔鬼所诱发的忧郁之灵。但也有这样的人，忧郁之灵在他们心中不断增长，他们就偏离了基督的道路。而当他们偏离时，感觉自己被上帝所遗弃，生命的空虚与重压对他们来说变得无法忍受，他们常常以自杀终结生命。
    - type: paragraph
      text:
        ru: Вот почему все святые считали уныние великой опасностью, великим несчастьем и все силы направляли на борьбу с духом уныния.
        cn: 这就是为什么所有的圣徒都认为沮丧是巨大的危险、巨大的不幸，并倾注全力与沮丧之灵争战。
    - type: paragraph
      text:
        ru: В уныние могут впадать даже люди святые. Почему, откуда? Уже не от сатаны, не от духов тьмы. Уныние возникает, когда временно бывают они оставлены Божьей благодатью. Это бывало со всеми святыми, это необходимое испытание каждого подвизающегося в благочестии. Необходимо оно, чтобы человек не приписал себе, своим силам, своим достоинствам, все, чего уже достиг. Нужно ему напомнить, что не своими силами достиг этого, а только Божьей благодатью.
        cn: 甚至圣徒也可能陷入灰心之中。为何，从何而来？不再来自撒旦，也不来自幽暗的灵。灰心生发，乃是当他们暂时被上帝的恩典所离弃时。所有圣徒都曾经历此事，这是每个在虔敬中操练者的必要考验。这是必要的，为的是使人不将自己已达到的一切归于自己、自己的力量或自己的功德。需要提醒他，他并非凭自己的力量达到这一切，而只是靠着上帝的恩典。
    - type: paragraph
      text:
        ru: Когда человек достигнет высокой жизни, возомнит он иногда о себе, и Божия благодать его на время оставляет. Впадает он тогда в тяжелое, невыносимое состояние духа, сердце в нем сразу пустеет. Вместо тепла, от Бога посылаемого, водворяется в сердце холод, настает вместо света непроглядная тьма, вместо радости – глубокое уныние. Это Господь делает для того, чтобы напомнить подвижнику, что не своими силами, а благодатью Божией идет по Христову пути.
        cn: 当人达到高尚的生命时，他有时会自以为是，上帝的恩典就会暂时离开他。他便陷入一种沉重、无法忍受的灵性状态中，他的心便立刻空虚了。代替上帝所赐的温暖，冰冷便驻扎在心中；代替光明，一片漆黑笼罩而来；代替喜乐的，是深切的忧郁。上主如此行，是为了提醒苦修者，走基督的道路并非凭借自己的力量，而是凭借上帝的恩典。
    - type: paragraph
      text:
        ru: Это один источник уныния. Какие еще есть источники его? Я говорил вам о праздности, вам должно быть понятно, что праздность – одна из матерей уныния. Люди праздные, не работающие и вполне обезпеченные, утопающие в роскоши, люди, которые пресыщены благами жизни, теряют вкус к жизни, все им надоедает, все становится неинтересным, скучным, ни в чем не находят радости, сердце их наполняет уныние – этот тяжкий и опасный враг нашего спасения.
        cn: 这是一个忧郁的源头。还有哪些是它的源头呢？我曾对你们说过关于懈怠，你们应该明白，懈怠是忧郁的母亲之一。懈怠的、不工作且生活无虞的人，沉溺于奢华之中，对生活的享乐感到厌腻，他们失去了生活的滋味，一切都令他们感到厌倦，一切都变得索然无味，枯燥乏味，在任何事上都找不到喜乐，忧郁充斥他们的心——这个沉重而危险的我们救赎的敌人。
    - type: paragraph
      text:
        ru: 'Еще один источник уныния: есть люди, которые склонны видеть все в мрачном свете, их называют пессимистами. Они склонны быть в таком настроении, сосредотачивать мысль на темном – греховном. Ставят они вопрос: где справедливость Божия, где правда, если бедный, но благочестивый страдает, а неверующий богат, идущий кривыми путями блаженствует?'
        cn: 另一个沮丧的来源是：有些人倾向于以悲观的眼光看待一切，他们被称为悲观主义者。他们倾向于处于这种情绪中，将思想集中在阴暗——即罪恶的事物上。他们提出问题：上帝的公义何在，公道何在，如果贫穷却虔诚的人受苦，而富有的不信者，行不义之路的人却享福？
    - type: paragraph
      text:
        ru: Если склонен человек замечать в жизни только темное, только дурное, овладевающее им уныние все возрастает, доходит до того, что человек не видит ничего доброго и кончает жизнь самоубийством. Так силен дух уныния. Второй раз говорю, как может он довести до самоубийства.
        cn: 如果人倾向于在生活中只看见黑暗、只看见恶的，那么笼罩他的沮丧就会持续增长，乃至达到人看不见任何善的事物，并以自杀终结生命的地步。沮丧之灵如此强大。我再次重申，它是如何能导向自杀的。
    - type: paragraph
      text:
        ru: Есть и еще источник уныния, наиболее частый источник. Это горести, прискорбные случаи, которые испытываем в жизни. Умрет близкий, любимый человек, умрет ребенок, муж, мать. Впадает человек в уныние. Свет ему не мил, думает только об умершем своем дорогом, человек бедный блуждает мыслью около могилы, представляет себе своего близкого лежащим в гробу и разлагающимся. Глубже и глубже становится уныние.
        cn: 还有另一个忧郁的来源，也是最常见的来源。这就是我们在生活中所经历的悲痛和令人痛心的遭遇。亲近的、所爱的人去世了，孩子、丈夫、母亲去世了。人就陷入忧郁。世间的一切都对他索然无味，他只想着他所珍爱的逝者，可怜的人思绪围绕着坟墓徘徊，想象着他所爱的人躺在棺木中腐烂。忧郁变得越来越深重。
    - type: paragraph
      text:
        ru: Какое средство избавиться от этого уныния? Не надо блуждать около могилы мыслями своими, вспоминать прошлое, проливать слезы. Умерший далеко-далеко. Надо унестись туда, куда ушел дорогой, любимый всей силой мысли. Знайте, что душа его предстоит Богу и ангелам, радуясь своему освобождению. Если сосредоточиться не на темном, а на светлом, не на тленном, а на вечном, – дух уныния уйдет.
        cn: 有何方法摆脱这颓丧呢？不必让思绪在坟墓旁徘徊，回忆过去，洒下泪水。逝者已远在天边。应当以全部思想之力飞向所爱之人离去的方向。须知，他的灵魂正侍立在上帝与天使面前，欢欣于自身的解脱。若将重心放在光明而非黑暗，放在永恒而非朽坏之上，——颓丧之灵自会离去。
    - type: paragraph
      text:
        ru: 'В уныние повергают иногда тяжкие телесные болезни. Есть много людей, нетерпеливо переносящих болезни. А были люди святые, которые всю свою жизнь лежали прикованные болезнью к постели и славили за это Бога. Нужно помнить о таких и уметь принимать посылаемые от Бога болезни. Не надо отказываться от помощи врача, ибо премудрый сын Сирахов говорит: «Врача сотворил Бог на помощь людям» (Сир.38:1, 12).'
        cn: 沉重的肉体疾病有时会使人沮丧。有许多人，不耐烦地忍受着疾病。但也有圣人，他们一生被疾病捆锁在床，却因此赞美上帝。当记念这样的人，并学会接受上帝所差遣的疾病。不可拒绝医生的帮助，因为智慧的西拉子说：「上帝造医生是为帮助人。」(西拉书 38:1, 12)。
    - type: paragraph
      text:
        ru: Врач – это слуга Божий, который может облегчить страдания и отогнать дух уныния.
        cn: 医生是上帝的仆人，他能够减轻痛苦并驱散忧郁之灵。
    - type: paragraph
      text:
        ru: Вот каковы источники и причины уныния. Главное средство борьбы с ними – молитва. Это средство, много-много веков испытанное всеми святыми. Нет средства более действенного, чем молитва, постоянная просьба к Богу о помощи.
        cn: 这就是忧闷的来源和原因。克服它们的主要手段是祷告。这是所有圣徒千百年来验证过的手段。没有比祷告更有效的手段了，它就是向上帝恒常地祈求帮助。
    - type: paragraph
      text:
        ru: Когда вступаете в беседу с Богом, Он утешает вас, отгоняет духа уныния. Когда приходите в храм Божий, где все так далеко от мирской суеты, вслушивайтесь в песнопения, и уйдет дух ваш из темной области уныния и воспарит.
        cn: 当你与上帝交谈时，祂会安慰你，驱散你沮丧的灵。当你来到上帝的圣殿，那里的一切都远离世俗的纷扰时，仔细聆听圣咏，你的灵将脱离沮丧的黑暗境地，并得以高翔。
    - type: paragraph
      text:
        ru: А если приступите к могущественному средству борьбы с унынием, которое дал Господь Иисус Христос, если на исповеди откроете сердце пред пастырем Церкви и если вслед за этим причаститесь Тела и Крови Христовой, почувствуете облегчение и радость, и тогда дух уныния с позором будет прогнан от вас.
        cn: 如果你们接受并运用圣主耶稣基督所赐予的对抗忧郁的有力途径，如果你们在告解中向教会的牧者敞开你们的心，并且如果在此之后领受基督的圣体与宝血，你们便会感受到慰藉与喜乐，那么忧郁之灵就必蒙羞地被从你们那里驱逐出去。
    - type: paragraph
      text:
        ru: Не сосредотачивайте мыслей на мрачном, на греховном, на тяжком, но, возносясь духом горе, сердцем своим пребывайте у Бога, в чертогах небесных, куда нет доступа темным духам, навевающим уныние.
        cn: 不要将心思集中在阴暗的、罪恶的、沉重的事物上，而是，在灵里高升，你们的心要安住在上帝那里，在天上的居所中，那是黑暗的灵、带来忧郁的灵无法进入之处。
    - type: paragraph
      text:
        ru: Вот что нужно знать об унынии каждому христианину.
        cn: 关于忧郁，每个基督徒都当知道这些。
    - type: paragraph
      text:
        ru: А что сказать о людях, не знающих почти Христа, идущих путем мирским, ищущих радость и утешение от мира? Они по виду часто кажутся довольными, бодрыми, веселыми, как будто нет у них уныния. Не думайте, что это так, не соблазняйтесь их видом, но подумайте об уклонении их с пути. Если бы знали, что происходит в глубине их сердца. В глубине их души никогда не прекращается обличение совести. Совесть услышать никто не может. Внутренний человек поднимает временами голову и начинает вопить. Это постоянное страдание тех, кто гонится за мирским благополучием. Апостол Павел говорит:«Печаль яже по Бозе покаяние нераскаянно во спасение соделывает, печальжемирскаясмерть соделывает»(2Кор. 7, 10).
        cn: 那么，关于那些几乎不认识基督，行在世俗道路上，从世上寻求喜乐和安慰的人，又当如何呢？他们外表常常显得满足、精神饱满、愉快，仿佛他们毫无忧闷。不要认为事情就是如此，不要被他们的外表所迷惑，但要思想他们偏离正道的情况。倘若人知道在他们内心深处发生了什么。在他们灵魂的深处，良心的责备从未停止过。良心的声音，无人能听闻。内在的人有时会抬起头来，并开始呐喊。这是那些追逐世俗福祉之人持续不断的痛苦。使徒保罗说：「按上帝旨意的忧愁生出不致后悔的悔改，以至得救；世俗的忧愁却生出死亡。」(哥林多后书 7:10)
    - type: paragraph
      text:
        ru: Если не обратитесь от печали по миру к печали по Богу – погибнете. Помните о тяжести уныния, помните, что сердце христианина должно быть наполнено радостью о Духе Святом, радостью стремления к свету, должно быть чуждо печали, которая наполняет сердца грешников.
        cn: 如果你们不转离世俗的忧愁，转向按着上帝的忧愁，你们就将灭亡。你们当记住沮丧的重压，记住基督徒的心应当被圣灵中的喜乐充满，被渴慕光明的喜乐充满，应当远离那充满罪人内心的忧愁。
    - type: paragraph
      text:
        ru: Помните об этом всегда, и да помилует вас Господь Бог, а святой Ефрем да содействует вам молитвами своими. Аминь.
        cn: 永远记住这一点，愿上主上帝怜悯你们，愿圣厄弗棱藉着他的祷告协助你们。阿们。
  - type: heading2
    text:
      ru: Молитва святого Ефрема Сирина – о любоначалии
      cn: 圣以法莲叙利亚人的祷文——论好为首
    children:
    - type: paragraph
      text:
        ru: Господи и Владыко живота моего! Дух любоначалия не даждь ми!
        cn: 上主，我生命的主宰！不要赐给我好权欲的灵！
    - type: paragraph
      text:
        ru: 'Что такое дух любоначалия? Это стремление первенствовать, властвовать над другими, занимать первое место. Это стремление первенствовать погубило архангела – главу всех ангелов – и сделало его сатаною, низвергло его с неба. Это стремление господствовать погубило Корея, Дафана и Авирона, которые позавидовали славе Моисея, когда он вел народ израильский по пустыне в землю Ханаанскую; они хотели низвергнуть его и присвоить себе власть, и покарал их Господь страшною казнью: земля разверзлась и поглотила их со всеми семьями их.'
        cn: 什么是好为首的灵？这是一种追求居首位、辖制他人、占居头名的渴望。这种追求居首位的渴望毁坏了总领天使——众天使之长——使他成了撒旦，并将他从天上摔下。这种追求辖制的渴望毁坏了可拉、大坍和亚比兰，他们嫉妒摩西的荣耀，当他带领以色列民穿过旷野前往迦南地时；他们想要推翻他，并为自己攫取权力，于是上主以可怕的刑罚惩罚了他们：大地裂开，将他们和他们的全家都吞噬了。
    - type: paragraph
      text:
        ru: Любоначалие двигало всеми еретиками, превозносившимися над Церковью Христовой, они свое хотели поставить вместо течения Церкви, или же хотели стать вождями в Церкви.
        cn: 恋慕权位之心推动着所有自高凌驾于基督教会之上的异端，他们欲以己意取代教会的道路，抑或欲作教会之领袖。
    - type: paragraph
      text:
        ru: Любоначалие двигало всеми людьми, которые потрясали мир государственными восстаниями своими. Были писатели с развращенными мыслями, которые развращали целые поколения.
        cn: 好为首推动了所有那些藉着他们的国家叛乱而震撼世界的人。曾有思想败坏的作家，他们败坏了整整几代人。
    - type: paragraph
      text:
        ru: Любоначалие – страсть властвовать – Господь Иисус Христос осудил в речи против книжников и фарисеев, лицемеров. Осудил их страсть быть первыми, их желание предвозлежать на пиршествах, получать приветствия, приличествующие вождям народа. Господь осудил их и сказал ученикам Своим, а чрез них всем нам:«Кто хочет быть первым, пусть будет...всем слуга»(Мк.9:35). Это противоположно любоначалию – велит стремиться не к высокому положению, а быть последним, быть слугой всем.
        cn: 好管辖——即掌权的欲念——主耶稣基督在反对文士、法利赛人这群伪君子的言论中谴责了它。祂谴责了他们争为首位的欲念，他们渴望在筵席上坐首位，接受那属于民众领袖的问安。主谴责了他们，并对祂的门徒，也通过他们对我们众人说：「谁若想为首，就当......作众人的仆役」（马可福音 9:35）。这与好管辖是截然相反的——它教导人不要追求高位，而是要作末后的，作众人的仆役。
    - type: paragraph
      text:
        ru: 'Видите, как любоначалие – страсть иметь влияние, страсть занимать первое место, как она противна духу Евангелия, духу смирения. А она владеет всеми, нет никого, кто не был бы заражен ею – даже малые дети. Знаем, как бывает при играх детей: выделится какой-нибудь мальчуган, начнет командовать, потом повелевает всеми, в драку готов вступить, когда кто-нибудь оспаривает его первенство вождя.'
        cn: 可见，爱好权势——即渴望有影响力、渴望居首位的这种情欲——它是何等违背福音的精神和谦卑的精神。然而，它掌控着所有人，没有人不被它感染——甚至小孩子也不例外。我们知道孩子们玩耍时是怎样的：会有个小男孩显露出来，开始发号施令，然后统领所有的人；若有人争夺他作为首领的优先权，他甚至准备大打出手。
    - type: paragraph
      text:
        ru: Даже среди отшельников, даже в монастырях, где не должно быть любоначалия, где все должны помнитьзавет быть всем слугой, даже там владеет людьми любоначалие, хотя в сокровенной форме. Пред людьми они не домогаются первенства, но чрезмерным постом и бдением стараются первенствовать над всеми.
        cn: 即使在隐修者之中，即使在修道院里——那里不应有好为首的心，所有人都当谨记「成为众人的仆役」这诫命——即使在那里，好为首的心也辖制着人们，尽管是以隐秘的形式。在人前他们不谋求居首，但藉着过度禁食与守夜，他们试图凌驾于众人之上。
    - type: paragraph
      text:
        ru: 'В жизни мирской страсть эта владеет всеми: все добиваются высшего положения, жаждут поощрения, все желают почета. Многие родители воспитывают в детях своих честолюбие, страсть первенствовать, стараются, чтобы они заняли в жизни высшее положение, и этим развращают детей своих.'
        cn: 在尘世生活中，此种私欲驾驭着所有人：所有人都在追求最高地位，贪求赞扬，都渴望尊荣。许多父母在自己的孩子身上培养功名心、争先之欲，竭力使其在生活中占据最高地位，并以此败坏自己的孩子。
    - type: paragraph
      text:
        ru: Разве не надо понять, что высшее положение – удел немногих, не могут все первенствовать, занимать высокое положение. По сути дела, это удел людей исключительных, отмеченных Богом. Чрезвычайно многие стремятся занять такое общественное положение, не брезгуют никакими средствами для достижения этой цели, пускают в ход связи, заискивают, прислуживаются, не гнушаются никакими средствами, чтобы только добиться своей цели, занять высокое положение в обществе, стать одним из власть имущих.
        cn: 难道不应该明白，至高的地位是少数人的份，并非人人都能居首位，占据高位吗？事实上，这是那些杰出人士的份，是蒙上帝拣选之人的份。极多的人力图占据这样的社会地位，为了达到这个目的，不择手段，动用关系，奉承讨好，阿谀谄媚，不惜一切手段，只为实现自己的目的，在社会中取得高位，成为掌权者之一。
    - type: paragraph
      text:
        ru: 'Часто-часто Господь карает их: несчастная страсть их кончается крахом. Они озлобляются, отказываются от общественной работы, уходят в круг семьи и замыкаются в семейной жизни. Но самолюбие и тут терзает их, а они терзают семью, терзают ближних своих, и нет покоя в их душе.'
        cn: 常常，上主惩罚他们：他们不幸的欲念以崩溃告终。他们心生怨恨，放弃公共事务，退回到家庭圈子中，并封闭于家庭生活。但私爱亦在此处折磨他们，而他们则折磨家人，折磨他们的近人，他们的灵魂里也没有平安。
    - type: paragraph
      text:
        ru: Вот плоды любоначалия, вот почему святой Ефрем в великой молитве своей просит Бога избавить его от тлетворного духа любоначалия, столь противоположного смирению, без которого нельзя и шагу ступить в христианской жизни.
        cn: 这就是爱居首位所结的果子，这就是为什么圣埃弗雷姆在其伟大的祷告中祈求上帝，使他摆脱那败坏人心的爱居首位之灵，这灵与谦卑截然相反，若无谦卑，人在基督徒生命中便寸步难行。
    - type: paragraph
      text:
        ru: Если так, если не нужно домогаться высшего звания, домогаться первенства, разве можно сказать, что не должны мы стремиться подняться, домогаться высшего достоинства, но именно только высшего, не тленного и ничего не стоящего достоинства, а стяжать то достоинство, которое велико в очах Божиих. Указан нам всем путь к почету, выше которого нет, с которым не сравнятся никакие земные достижения, никакой почет. Указан нам путь в Царство Божие, сказано, что мы можем стать друзьями Божьими, детьми Божьими. Этой цели достигнем только стремясь исполнить все Христовы заповеди. Не надо смущаться, если поставлены мы в положение низкое, незаметное в обществе, надо помнить, что Господь умеет вывести нас на чрезвычайно широкий путь, когда не ждем, не стремимся к славе земной.
        cn: 如果是这样，如果我们无需追求最高地位、追求首位，难道我们就不应该力求提升，追求更高的尊荣吗？但唯独是那至高的，不是那朽坏的、毫无价值的尊荣，而是要得着在上帝眼中看为大的尊荣。已为我们众人指明了通往尊荣的道路，这尊荣是至高无上的，没有任何地上的成就、任何属世的尊荣能与之相比。已为我们指明了通往上帝之国的道路，并且告诉我们，我们能够成为上帝的朋友，上帝的儿女。唯有努力遵行基督的一切诫命，才能达成这个目标。如果我们身处社会上低微、默默无闻的境地，我们不必困扰，我们当记住，上主能引领我们走上一条极其宽广的道路，当我们不期望、不追求属世荣耀的时候。
    - type: paragraph
      text:
        ru: Господь нередко помимо старанья и воли нашей дает эту славу. Слава бежит от тех, кто гонится за ней, кто ее жаждет, и находит тех, кто бежит от нее. Истинная слава, слава от Бога, дается тем, кто не гонится за ней.
        cn: 主常常在我们的努力和意愿之外赐予这荣耀。荣耀逃离那些追逐它、渴望它的人，却找到那些逃避它的人。真正的荣耀，来自上帝的荣耀，赐予那些不追逐它的人。
    - type: paragraph
      text:
        ru: Надо, не помышляя о власти над людьми, вникнуть в то, как можно развить способности свои и таланты, данные от Бога; смиренно, тихо углубиться в развитие способностей своих в тиши, в неведении миру. И может быть случится, как случалось уже не раз, что Господь возведет такого человека на недосягаемые вершины славы.
        cn: 应不思图对人的权力，而应深入思考如何发展自己蒙上帝所赐的能力与才华；谦卑、安静地在静默中、在不为世人所知中深入发展自己的能力。并且也许会发生——正如已发生过不止一次的——上主会将这样的人提拔到无法企及的荣耀之巅。
    - type: paragraph
      text:
        ru: Знаем много примеров из истории науки и философии, из жизни крупных деятелей науки, которые проводили жизнь в нищете, в неведении миру, бывали даже преследуемы и гонимы, были в полном противоречии тому, чего ищут люди, зараженные пороком любоначалия; они в тиши, в бедности, в уединении работали над задачами науки и философии и творили дела, которые прославили их в истории человечества, сделали их яркими звездами прогресса человечества.
        cn: 我们知道，从科学史和哲学史中，从伟大科学家的生平中，有许多例子表明，他们一生贫困，不为世人所知，甚至曾遭受迫害和排挤，与那些染上恋权恶习的人所追求的一切完全相悖；他们却在宁静、贫困、隐居中，致力于解决科学和哲学的难题，并成就了那些使他们在人类历史上声名显赫、成为人类进步璀璨之星的伟业。
    - type: paragraph
      text:
        ru: Помните, Господь умеет отметить людей, отличить дела человеческие, творимые по заповедям Христовым.«Кто хочет быть первым,да будетпоследним, да будетвсем слуга»(Мк.9:35).
        cn: 你们要记住，主懂得辨识人，区分人的作为，这些作为是按基督的诫命而行的。「谁愿为首，就必作末后的，也必作众人的仆役」（马可福音 9:35）。
    - type: paragraph
      text:
        ru: Молитесь сЕфремом Сиринымоб избавлении от тяжкого порока любоначалия. От этого порока да избавит вас всех Господь Иисус Христос. Аминь.
        cn: '与叙利亚的圣厄弗拉伊姆一同祷告，祈求从爱权这一严重罪恶中蒙解脱。

          愿主耶稣基督使你们众人从这罪恶中蒙解脱。阿们。'
  - type: heading2
    text:
      ru: Молитва святого Ефрема Сирина – о празднословии
      cn: 圣厄弗愣叙利亚人的祷文——论妄言
    children:
    - type: paragraph
      text:
        ru: Господи и Владыко живота моего, дух празднословия не даждь ми!
        cn: 吾主吾命之主宰，勿赐我虚浮言语之灵！
    - type: paragraph
      text:
        ru: И святой Ефрем молится об этом, и святой пророк Давид говорит в псалме своем:«Положи, Господи, хранение устам моим и дверь ограждения о устах моих»(Пс.140:3).
        cn: 圣以法莲也为此事祈祷，圣先知大卫在他的诗篇中说：「上主啊，求祢在我的口上设守卫，在我唇上安设一道栅门。」(诗篇 140:3)
    - type: paragraph
      text:
        ru: 'И Сам Господь Иисус Христос сказал, что«за всякое праздное словодадим мыответна Страшном Суде (Мф.12:36). Вдумайтесь, как это серьезно, как тяжело: за каждое, за единое праздное слово дать ответ.'
        cn: 上主耶稣基督自己也说：「凡人所说的每一句闲话，在末日审判中，我们都必要交账（马太福音 12:36）。」请深思，这是多么严肃，多么沉重啊：为了一切，为了仅仅一句闲话，都要交账。
    - type: paragraph
      text:
        ru: А скажите, разве есть что-либо другое, к чему относились бы легче, чем к слову? Удивительно, поразительно, как люди не понимают огромного, колоссального значения слова человеческого.
        cn: 请问，难道有哪样事物，其受到的对待比话语更轻忽吗？令人惊异，令人震惊的是，人们竟然不明白人所说的话语那巨大而无比深远的意义。
    - type: paragraph
      text:
        ru: Наша способность слова в значительной мере уподобляет нас Самому Богу. Бог словом сотворил весь мир (Быт.1:1), слово Божие имеет огромную, могущественную силу. Знаете, что пророк Илья словом воскрешал мертвых (3Цар.17:21–22), словом своим останавливал дождь, заключал небо и вызывал этим голод (3Цар.17:1), низводил дождь на землю (3Цар.18:42–45).
        cn: 我们的言语能力在很大程度上使我们肖似上帝本身。上帝借着话语创造了整个世界（创世记 1:1），上帝的话语具有巨大、大能的力量。你们知道，先知以利亚借着话语使死人复活（列王纪上 17:21-22），借着他的话语止住雨，封闭了天空并因此引发了饥荒（列王纪上 17:1），又使雨降到地上（列王纪上 18:42-45）。
    - type: paragraph
      text:
        ru: В чем же сила, заключающаяся в слове? Не думайте, что вырвавшееся из уст слово рассеивается в воздухе, и не остается от слова ничего. Это неверно. Слово живет, живет столетия, тысячи лет. До сих пор живут слова, которые изрекали великие Божии пророки, жившие за много столетий до Рождества Христова. Великие слова Моисея, великие слова, которые некогда говорили святые апостолы, те слова, которые изошли из уст подвижников Божиих, учение Церкви Божией, живы в течение тысяч лет.
        cn: 话语蕴含的力量究竟何在？切勿以为从口中说出的话语会消散于空气中，而话语不留下任何痕迹。这并非事实。话语是活着的，它存活数百年，数千年。直到如今，那些由上帝的伟大先知们所宣讲的话语依然活存，他们活在基督诞生前许多世纪。摩西的伟大话语，圣使徒们昔日所言说的伟大话语，那些出自上帝之苦修者们口中的话语，以及上帝教会的教义，都存活千年之久。
    - type: paragraph
      text:
        ru: А если слово живет тысячи лет, значит, это нечто чрезвычайно важное. Слово, исходя из уст наших, всегда производит действие, чрезвычайно глубокое на окружающих нас людей, даже на удаленных от нас людей.
        cn: 那么，如果一个话语能流传千年，这便意味着它极其重要。发自我们口中的话语，总是对我们周围的人，甚至对那些远离我们的人，产生极其深远的作用。
    - type: paragraph
      text:
        ru: Каждое доброе, мудрое слово живет в сердцах людских и приносит благие плоды на долгие годы. Всякое злое слово – клевета, ложь, злословие – тоже живет чрезвычайно долго, много лет, вселяется в умы, в сердца и близких, и далеких людей, направляет их мысли, их желания. Слыша злые наши слова, отравляются ими, подражают нам и испускают такие же злые, ядовитые слова.
        cn: 每一个良善、智慧的言语，都活在人心之中，并长久地带来善果。每一个恶毒的言语——诽谤、谎言、恶语——也同样极其长久地存活，历经多年，潜入亲近与疏远之人的头脑与心灵，引导他们的思想和欲望。听见我们恶毒的言语，人们便被其毒害，模仿我们，发出同样恶毒、有毒的言语。
    - type: paragraph
      text:
        ru: Благодатные и мудрые слова святых созидают правду в мире, творят вечное добро, а злые, греховные слова приносят безчестье, ненависть, приносят огромный вред людям окружающим, даже всему человечеству.
        cn: 圣徒充满恩典和智慧的言语，在世上建立真理，成就永恒的良善；而邪恶、罪恶的言语，则带来耻辱、仇恨，给周围的人们，甚至给全人类带来巨大的伤害。
    - type: paragraph
      text:
        ru: Слова живы, несутся как волны радио, несутся в пространстве и вливаются в сердца и умы людей. Слова – огромная сила, соединяющая или разъединяющая людей. Соединяющая, когда слово полно правды и истины, разъединяющая, когда оно полно клеветы и злобы к людям. Если бы люди были лишены слова, уподобились бы они животным, и жизнь человеческая была бы расстроена.
        cn: 言语是活泼的，如无线电波般奔腾，在空间中传播，并注入人们的心灵和思想。言语是巨大的力量，能连结人，也能离散人。当言语充满真理和真实时，便能连结人；当言语充满诽谤和对人的恶意时，便会离散人。若人被剥夺了言语，他们便如同动物一般，人类的生活也将会紊乱不堪。
    - type: paragraph
      text:
        ru: Вот как велико, как глубоко значение человеческого слова. Вот почему молится святой Ефрем об избавлении от празднословия, от пустословия.
        cn: 看哪，人类言语的意义是何等伟大，何等深邃啊！这就是为什么圣以弗拉因祈求摆脱空话，摆脱虚浮之言。
    - type: paragraph
      text:
        ru: 'Вы все встречали в жизни немало людей, особенно женщин, которые болтают, болтают и болтают без конца, неудержимо, и не знает при этом язык их никакой усталости: мелет, мелет и мелет. Все, что говорят они, пусто, никому не нужно. ИЕфрем Сиринмолит Бога избавить его от празднословия. Боялся он пасть, чтобы язык не погубил его, а эти несчастные болтуны ничего не боятся.'
        cn: 你们都在生活中遇到过不少人，尤其是女人，她们喋喋不休，滔滔不绝，止不住地说话，她们的舌头不知疲倦：磨呀，磨呀，磨个不停。她们所说的一切都空洞无物，对任何人都没有用处。叙利亚的以法莲向上帝祈求使他摆脱空谈。他害怕跌倒，唯恐舌头毁了他，而那些不幸的饶舌者却什么都不怕。
    - type: paragraph
      text:
        ru: Вы знаете, что этих пустословов часто люди терпят – болтают, и пусть себе болтают – а им кажется, что слушают их с удовольствием, не знают того, что в глубине сердца все тяготятся ими, ненавидят их. Так велико зло празднословия, зло, которое причиняют болтовней своей.
        cn: 你们知道，那些空谈者常常被人容忍——他们只管滔滔不绝，就让他们说去吧——而他们却以为人们听得津津有味，却不知道，在人们心底深处，所有人都厌倦他们，憎恨他们。闲谈之恶是如此巨大，这种恶是他们因着自己的饶舌所造成的。
    - type: paragraph
      text:
        ru: Если язык болтает и празднословит, то и мысли блуждают, не сосредотачиваясь ни на чем глубоком, истинном, важном, блуждают безцельно повсюду, как блуждает несчастная дворняжка, виляя хвостом. Как их мысли, так и чувства, так и направление их желаний, их деятельность – все пусто, ничтожно. Душа голодает, человек противен другим, себе самому причиняет тяжкий, тяжкий вред. Вот каково значение празднословия.
        cn: 如果舌头饶舌、空言无度，那么思绪也随之游荡，无法专注于任何深刻的、真实的、重要的事物，漫无目的地四处游荡，如同不幸的流浪狗，摇着尾巴到处游荡。他们的思绪如此，他们的情感亦然，他们的愿望方向亦然，他们的行动——一切都是空虚、微不足道的。灵魂饥饿，人令他人厌恶，给自己造成沉重、沉重的伤害。这就是空言的意义所在。
    - type: paragraph
      text:
        ru: Люди мудрые, живущие жизнью духовной, никогда не празднословят, они всегда молчаливы, сосредоточенны. В Древней Греции в чрезвычайном почете были философы и мудрецы. Философы не принимали к себе в ученики никого прежде, чем человек не докажет, что умеет молчать. А разве экзамен молчания выдержал бы теперь кто-либо из празднословящих? Конечно, нет.
        cn: 活在属灵生命中的智慧之人，绝不空谈，他们总是沉默寡言，心神专注。在古希腊，哲学家和智者备受尊崇。哲学家不收任何人为弟子，除非此人证明自己懂得沉默。那么，现在那些空谈的人中，有谁能通过沉默的考验呢？当然，没有。
    - type: paragraph
      text:
        ru: 'Если так тяжел порок празднословия, как отделаться от него, что делать с неудержимым языком нашим? Нужно делать то, что делалЕфрем Сирин: нужно молить Бога об избавлении от этого порока, и подаст просимое Господь Иисус Христос. Нужно избегать общения с людьми празднословящими, подальше, подальше уходить от них, искать общества немногих мудрых, которые отверзают уста свои, чтобы сказать что-либо полезное, от кого не услышишь праздных, душевредных слов.'
        cn: 如果闲谈的罪过如此沉重，我们该如何摆脱它，我们那难以抑制的舌头该如何处置呢？我们必须做叙利亚的以法莲所做的事：我们需要向上帝祈求摆脱这罪过，主耶稣基督必将赐予所求的。我们需要避免与那些闲谈的人交往，远远地，远远地避开他们，寻求少数智者的陪伴，他们开启自己的口，为要说出有益的话语，从他们那里听不到闲言碎语、有害灵魂的话。
    - type: paragraph
      text:
        ru: Чрезвычайно внимательно следить за собой, приобрести привычку наблюдать, что говорите, чем занят язык ваш, привыкнуть держать язык в узде. Не позволяйте ему праздно болтать. Припоминайте вечером, что говорили днем, не болтали ли, не оскорбили ли кого, не лгали ли, не ябедничали ли. Если усвоите эту привычку, то привыкнете следить за языком, за каждым движением и сдерживать его.
        cn: 务必极其警醒地审察自己，养成习惯去察看自己所说的话，以及你的口舌在忙些什么，并习惯于勒住口舌。不要让它空泛闲谈。晚上回想一下白天所说的话，是否有空泛闲谈，是否冒犯了谁，是否撒谎，是否搬弄是非。若你习得此习惯，就会习惯于警醒口舌，警醒它的每一个举动并约束它。
    - type: paragraph
      text:
        ru: Помните, чем больше человек сосредоточен на главном, внутреннем, на истинном, чем больше времени полагает на чтение Евангелия, Священного Писания, творений святых отцов, тем более проникается их мудростью и тем больше теряет охоту праздно болтать. Приобрести власть над языком – дело великое.
        cn: 记住，一个人越是专注于首要的、内在的、真实的，越是花时间阅读《福音书》、圣经、圣教父的著作，就越是深受其智慧的熏陶，就越是失去闲聊的兴致。获得对舌头的驾驭，是一件伟大的事。
    - type: paragraph
      text:
        ru: Апостол Иаков в соборном послании своем говорит:«Кто не согрешает в слове, тот человек совершенный, могущий обуздать и все тело»(Иак. 3, 2).
        cn: 使徒雅各在他的大公书信中说：「在言语上没有过失的，这人就是完全的，也能勒住自己的全身」（雅各书 3:2）。
    - type: paragraph
      text:
        ru: Понимаете ли, что значит обуздать все тело? Это значит, подчинить тело высшим целям духовной жизни, обуздать все похоти, страсти, все дурное, к чему влечет плоть. Начните с обуздания языка, и если достигнете этой цели, стяжите совершенство и обуздаете все тело ваше. А если обуздаете все тело свое, будете чисты и праведны пред Богом. Этой чистоты и праведности да сподобит вас всех Господь, а молитваЕфрема Сиринада будет всегда напоминать об этом. Аминь.
        cn: 你们明白何为勒住全身吗？这意味着使身体顺服属灵生命更高的目标，勒住一切的邪情私欲、情欲以及肉体所引诱的一切恶事。始于勒住舌头，倘若你们达成此目标，就将得着全备，并勒住你们的全身。倘若你们勒住自己的全身，就必在上帝面前洁净且公义。愿上主使你们所有人都蒙赐此洁净与公义，而叙利亚的厄弗冷祷文则将常提醒你们此点。阿门。
  - type: heading2
    text:
      ru: Молитва святого Ефрема Сирина – о целомудрии
      cn: 圣厄弗冷叙利亚人的祷文——论贞洁
    children:
    - type: paragraph
      text:
        ru: Господи и Владыко живота моего, дух целомудрия даруй ми!
        cn: 主啊，我生命的主宰啊，求祢赐予我贞洁之灵！
    - type: paragraph
      text:
        ru: Обратили ли вы внимание на то, что даже такой великий подвижник, пустынножитель, такой великий святой, какЕфрем Сирин, молился о том, чтобы Господь дал ему дух целомудрия. Неужели он, святой старец, нуждался в этой молитве? Не нам судить, он сам судил, что нужно об этом молиться, и все святые молились об этом.
        cn: 你们有没有注意到，连像叙利亚的厄弗冷这样伟大的苦行者、隐修者、伟大的圣人，也祈祷主赐予他贞洁之灵。难道他，这位圣洁的长者，需要这样的祈祷吗？不由我们来判断，他自己判断必须为此祈祷，所有的圣人也都为此祈祷。
    - type: paragraph
      text:
        ru: Почему молились? Потому что знали, что Господь требует от них, как и от всех христиан, полного, безусловного целомудрия, целомудрия не только плоти, но и духа. Даже в помыслах наших мы не смеем и не должны нарушать целомудрия, ибо Сам Господь сказал,«что всякий, кто с вожделением посмотрит на женщину, ужеблудствовалс нею в сердце своем»(Мф.5:28). А помыслов нечистых никто не может избегнуть, и святые долгие годы мучительно боролись с этими помыслами.
        cn: 为什么祷告？因为他们知道，上主要求他们，就像要求所有基督徒一样，完全的、无条件的贞洁，这贞洁不仅是肉体上的，也是灵魂上的。甚至在我们的意念中，我们也不敢、也不应破坏贞洁，因为上主亲自说过：「凡是带着淫欲的心看妇女的，已经在心里与她犯了奸淫」（马太福音 5:28）。然而不洁的意念无人能避免，圣人们也曾多年痛苦地与这些意念搏斗。
    - type: paragraph
      text:
        ru: Я уже говорил вам о том, как преподобный Мартиниан, человек молодой, боролся отчаянно с этой страстью, как он, когда его соблазняла развратная женщина, сумевшая проникнуть в келлию его, стал на горящие уголья, чтобы побороть в себе плотскую страсть.
        cn: 我已经给你们讲过，年轻的圣马尔提尼安如何与这情欲拼死搏斗；以及他如何在一个设法潜入他隐修室的放荡女人引诱他的时候，站到了燃烧的炭火上，为的是要克服他自身的肉欲。
    - type: paragraph
      text:
        ru: Так боролись святые десятками лет, и главным средством в их борьбе был пост, смирение и молитва, ибо все святые отцы говорят, что нет большей защиты от плотских вожделений, чем смирение.
        cn: 就这样，圣徒们争战了数十年之久，而在他们的争战中，主要的方法是禁食、谦卑和祷告。因为所有的圣教父们都说，没有比谦卑更能保护人免于肉体的贪欲的了。
    - type: paragraph
      text:
        ru: 'Человек, если стяжет смирение, освобождается от них, а люди гордые, чуждые смирения, всецело обуреваются этой низменной страстью. Это запомните: смирение есть первый и самый важный способ для освобождения нас от похоти.'
        cn: 人若能获得谦卑，便从中解脱；而那些骄傲、与谦卑无缘的人，则完全被这种卑劣的激情所困扰。请记住这一点：谦卑是使我们从情欲中解脱的首要且最重要的途径。
    - type: paragraph
      text:
        ru: 'А знаете вы, как много среди нас легко, чрезвычайно легко относящихся к нарушению седьмой заповеди, как много таких христиан, которые не считают серьезным грехом этот грех, которые говорят: «Ведь я благочестив, стараюсь изо всех сил исполнять заповеди Христовы, стараюсь творить дела милосердия, неужели Господь не простит эту маленькую слабость»?'
        cn: 可你们知道吗，我们中间有多少人，对待第七条诫命的违犯是多么地轻率，多么地极度轻率；又有多少基督徒不认为这个罪是严重的罪，他们说：「我不是敬虔的吗？我尽力遵守基督的诫命，尽力行慈悲的事，难道上主不会赦免我这点小小的软弱吗？」
    - type: paragraph
      text:
        ru: Говорящие так глубоко, глубоко ошибаются, ибо то, что они называют маленькой слабостью, апостол Павел называет совсем иначе. Он так строг в этом отношении, что в послании Ефесянам говорит:«А блуд и всякая нечистота и любостяжание не должны даже именоваться у вас, как прилично святым»(Еф. 5, 3).
        cn: 这样说的人大错特错，错得极深，因为他们所称的「小弱点」，使徒保罗却有截然不同的称呼。在这方面，他如此严厉，以至于在致以弗所人书信中说：「至于淫乱和一切污秽，或贪婪，在你们中间连提都不可提，方合圣徒的体统。」 (以弗所书 5:3)
    - type: paragraph
      text:
        ru: Даже помышлять о них нельзя, даже говорить нельзя, как прилично святым. Он говорит, что прелюбодейцы, и блудники, и пьяницы не войдут в Царство Божие. А разве это не страшно, разве это не есть указание апостола на то, что грех против седьмой заповеди – не только слабость, которую Бог простит. Прямо говорит апостол, что нарушающие эту заповедь – блудники и прелюбодейцы – в Царство Божие не войдут (1Кор.6:9).
        cn: 甚至不可思念这些事，甚至不可谈论，如同圣徒本是相宜的。他说，奸淫者、淫乱者和醉酒者都不能进入上帝的国。这岂不可怕吗？这难道不是使徒所指明的吗，即违犯第七条诫命的罪——不仅仅是上帝会赦免的软弱。使徒直言，那些违犯这条诫命的人——淫乱者和奸淫者——都不能进入上帝的国（哥林多前书 6:9）。
    - type: paragraph
      text:
        ru: 'А где же они будут? Конечно, в месте тьмы, в месте вечных мучений. Об этом задумайтесь. Не говорите никто из вас, что сама природа так устроена, что эта страсть естественна. Это совершенно неверно, природа человека устроена так, чтобы рождали люди детей, а не для того, чтобы оскверняли сами себя. Ибо говорит апостол Павел, что всякий грех есть вне тела: вне тела гордость, тщеславие, честолюбие, зависть, гнев, так как это все страсти души, а блуд и прелюбодеяние в самом теле, оскверняет не только дух, но и тело наше.'
        cn: 那么他们会在哪里呢？当然，在黑暗之地，在永恒痛苦之地。请各位思考这一点。你们中谁也不要说，自然本身是这样被造的，这种情欲是自然的。这是完全错误的，人的本性被造是为了生育子女，而不是为了玷污自己。因为使徒保罗说，所有的罪都在身体之外：骄傲、虚荣、野心、嫉妒、愤怒都在身体之外，因为这些都是灵魂的情欲；但淫乱和奸淫却是在身体本身之中，不仅玷污我们的灵魂，也玷污我们的身体。
    - type: paragraph
      text:
        ru: Не сказал ли апостол Павел, что тела наши суть храм Духа Святого, а если храм, то тела наши должны быть чисты, ничем не осквернены. Разрушать храм Святого Духа, делать члены тела нашего членами блудницы. Апостол с ужасом говорит:«Да не будеттак!» (1Кор.6:15)
        cn: 难道使徒保罗没有说过，我们的身体是圣灵的殿吗？既然是殿，我们的身体就应当是洁净的，不被任何事物玷污的。毁坏圣灵的殿，使我们身体的肢体成为娼妓的肢体。使徒以惊恐之心说道：「断乎不可！」（哥林多前书 6:15）
    - type: paragraph
      text:
        ru: 'Сколько среди людей таких, которые плотскую страсть обращают в постоянное услаждение, самое нечистое, самое низменное услаждение, которое делает их равными тем животным, которые отличаются особой похотливостью: петухам и павианам.'
        cn: 多少人啊，他们将肉欲变为恒常的享乐，这享乐是最不洁的，也是最卑劣的，它使他们与那些特别淫荡的动物——公鸡和狒狒——无异。
    - type: paragraph
      text:
        ru: Стыдно, стыдно человеку вообще, а тем паче человеку-христианину равняться с павианом. Стыдно, стыдно забывать, что тело его есть храм Духа Святого. Ибо говорит апостол Павел в послании своем:«Воля Божия есть освящение ваше, чтобы вы воздерживались от блуда; чтобы каждый из вас умел соблюдать свой сосуд в святости и чести, а не в страсти похотения, как и язычники, не знающие Бога. Ибо призвал нас Бог не к нечистоте, но к святости»(1Фес. 4, 3–5, 7).
        cn: 羞耻啊，羞耻！人，尤其是基督徒，与狒狒等同，实在羞耻！羞耻啊，羞耻！忘记自己的身体是圣灵的殿，实在羞耻！因为使徒保罗在他的书信中说：「上帝的旨意是要你们成为圣洁，远避淫乱；要你们各人晓得持守自己的器皿，在圣洁和尊贵里，不在贪欲的邪情里，像那不认识上帝的外邦人一样。因为上帝召我们，不是要我们沾染污秽，乃是要我们成为圣洁。」(帖撒罗尼迦前书 4:3-5，7)
    - type: paragraph
      text:
        ru: Апостол святой сказал:«Те, которые Христовы, распяли плоть со страстьми и похотьми»(Гал. 5, 24).
        cn: 圣使徒说：「凡属基督的人，已经把肉体连同邪情私欲同钉在十字架上了」（加拉太书 5:24）。
    - type: paragraph
      text:
        ru: 'Хотите быть Христовыми, хотите быть друзьями Христа, сынами Божиими? Если хотите, то запомните это: вы должны плоть свою со страстями и похотями распять, умертвить. Нужна огромная, повседневная борьба со своей плотью.'
        cn: 你们想要成为基督的，想要成为基督的朋友，成为上帝之子吗？如果你们想要，那么请记住这一点：你们必须将你们的肉体，连同情欲和贪欲，钉死，治死。需要与你们的肉体进行一场巨大而日常的争战。
    - type: paragraph
      text:
        ru: Эта борьба неодинаково дается различным людям, ибо есть счастливые люди, которые не имеют большой чувственности, а есть и другие, которые по природе, по наследству от родителей, страдают необычайно высокой чувственностью и похотливостью.
        cn: 这场挣扎在不同的人身上体现得不尽相同，因为有些人蒙福，没有强烈的感官欲望，而另一些人则因天性，或从父母那里遗传，饱受异常强烈的感官欲望和淫欲之苦。
    - type: paragraph
      text:
        ru: 'Знаю я такого несчастного человека – одну несчастную женщину, чрезвычайно благочестивую, которая унаследовала от родителей своих такую исключительную похотливость. Знаю, как борется она с этой похотливостью. Она борется изо всех сил, доходит до самоистязания: собирает терновник с колючими шипами и руками мнет его, чтобы шипы вонзились в руки. Она мучается, она страдает и все-таки падает. Но падают не только такие несчастные, но и многие из нас, которым гораздо легче воздержаться.'
        cn: 我认识一个这样不幸的人——一个不幸的女人，她极其虔诚，却从父母那里继承了如此非凡的淫欲。我知道她如何与这淫欲搏斗。她竭尽全力地搏斗，甚至到了自我折磨的地步：她收集带刺的荆棘，用手揉搓，好让荆棘的刺扎进她的手里。她受苦，她受难，然而她仍旧跌倒。但跌倒的不仅是这样不幸的人，还有我们中许多原本更容易克制的人。
    - type: paragraph
      text:
        ru: Что скажем о таком падении? Скажем, что как из всякого падения, так и из этого падения можно и должно восстать. Падаем часто, падаем во многих отношениях, а если падаем и в этом отношении, то должны из той бездны, из той пропасти, в которую упали, выкарабкиваться, всеми силами выкарабкиваться, призвав на помощь Духа Святого, как человек, упавший в пропасть, выкарабкиваться из нее.
        cn: 对于这样的堕落，我们能说什么呢？我们要说，就像从每一次堕落中一样，从这种堕落中我们也可以并且应该站立起来。我们常常跌倒，在许多方面跌倒；而如果我们在这种方面也跌倒了，我们就必须从我们所跌入的那深渊、那深谷中，竭尽全力地挣扎着爬出来，呼求圣灵的帮助，就像一个掉进深谷里的人，要从里面挣扎着爬出来一样。
    - type: paragraph
      text:
        ru: А что делают люди, упавшие в пропасть? Они изо всех сил своих выбираются из нее, не щадя рук, обагренных кровью, исцарапанных об острые камни, своих ногтей оборванных, своих ног израненных – изо всех сил стремятся выбраться.
        cn: 那些坠入深渊的人，他们会怎么做呢？他们会用尽全身力气从中攀爬，不顾双手已鲜血淋漓，被尖锐的石头划得伤痕累累，指甲全部崩裂，双腿伤痕累累——他们倾尽所有气力，一心挣脱而出。
    - type: paragraph
      text:
        ru: Так и впавшим в грех против седьмой заповеди надо выкарабкиваться из бездны падения, призвав на помощь Того, Кто дал заповедь о целомудрии, надо молиться, горячо молиться. Надо помнить, постоянно помнить, что говорит апостол:«Не упивайтесь вином,вкоторомблуд"(Еф. 5, 18).
        cn: 同样地，那些犯了第七条诫命之罪的人，也必须呼求那赐下贞洁诫命者的帮助，从堕落的深渊中挣脱出来，必须祷告，热切地祷告。必须记住，不断地记住使徒所说的话：「不要醉酒，因为其中有淫乱」（以弗所书 5:18）。
    - type: paragraph
      text:
        ru: 'В вине есть блуд, ибо ничто так не возбуждает похоти нашей, как именно пьянство: напившись вина, становится человек игралищем в руках беса блудного.'
        cn: 酒中有淫乱，因为没有什么能比醉酒本身更能激起我们的肉欲：喝了酒，人就成了淫乱魔鬼手中的玩物。
    - type: paragraph
      text:
        ru: Человек, который питается излишне, который всегда праздный, который не желает работать, который живет разгульно и только занят развлечениями, танцами, хождением в театры и кино, человек, который спит, как изнеженные женщины, до 11 часов утра, будет конечно и неизбежно блудником, ибо делает все для того, чтобы похоть плотская связала его в свои путы.
        cn: 饮食过度，终日游手好闲，不愿工作，生活放荡，只顾着娱乐、跳舞、出入剧院影院，以及像娇生惯养的妇人一样睡到上午十一时的人，必然且无可避免地会成为淫乱者，因为他竭尽所能，为要让肉体的情欲将他束缚于其罗网之中。
    - type: paragraph
      text:
        ru: А если человек занят постоянным трудом, физическим или умственным, если нет времени отвлекаться от этого труда, окончив свой труд, вечером будет стремиться только к отдыху. Поскорее насытится он необходимой пищей и ляжет спать; ему ничто так не нужно, как отдых, ему не до похоти, не до безобразия.
        cn: 那么，如果一个人忙于恒久的劳作，无论是体力上的，还是脑力上的，如果没有时间从这劳作中抽身，在完成他的劳作后，到了晚上，只会寻求安息。他会尽快地饱足必要的食物，然后躺下睡觉；对他而言，没有什么比安息更需要了，他顾不上情欲，也顾不上败德。
    - type: paragraph
      text:
        ru: Итак, следовательно, смирение, пост, напряженный труд, всегдашний пост, всегдашние молитвы – это те средства, которыми можем освободиться от власти беса блудного. А как безконечно много несчастных людей, особенно среди молодежи, которые с огромным интересом и ненасытимостью читают страстные романы и повести, в которых описываются грязные картины разврата и похоти. Какой это яд! Если человек смакует их в грязном романе или повести, то он разжигает свою похоть.
        cn: 因此，所以，谦卑、禁食、辛勤劳作、恒常禁食、恒常祷告——这些就是我们得以摆脱淫乱之魔权势的方法。然而有多少无数不幸之人，尤其是在青年人当中，他们怀着巨大的兴趣和永不满足的心情阅读那些描述着淫乱和色欲肮脏画面的情欲小说和故事。这是何等的毒药！如果一个人在肮脏的小说或故事中细细品味它们，那么他就是在挑旺自己的情欲。
    - type: paragraph
      text:
        ru: 'А надо поступать иначе: не только не разжигать похоть порнографическими писаниями и картинами, а надо стремиться следить за похотью, и как только замечаем, что появляются в мыслях подобные образы, сейчас поймать и стараться схватить змия за шею, возле главы его, и размозжить ему голову, ибо если этого не сделаем, то змий незаметно вползет в ваше сердце и отравит вас блудной страстью. И образы соблазнительные, нечистые, которые вселит древний змий в сердце ваше, легко и быстро перейдут в любование этими помыслами, а любование ими переходит потом и в само дело.'
        cn: 然而，我们必须采取不同的做法：不仅不应以色情书刊和图像煽动情欲，反而要努力警惕情欲，一旦我们察觉到类似的想法和画面出现在心中，就要立即捕捉，并努力抓住那蛇的颈项，在其头部附近，将其头颅砸碎。因为如果我们不这样做，那蛇就会悄无声息地潜入你的内心，用淫欲的激情毒害你。而那古蛇植入你心中的诱惑性、不洁的画面，很快就会轻易地转变为对这些意念的恋慕，而对它们的恋慕随后就会转变为实际的行动。
    - type: paragraph
      text:
        ru: 'Надо помнить то, что слышали недавно в псалме136: надо этих младенцев вавилонских хватать за ноги и разбивать головы их о камень, пока это младенцы, пока не возмужали они, пока не овладели сердцем вашим (Пс.136:9).'
        cn: 务要记住我们不久前在诗篇136篇中听到的：必须抓住这些巴比伦婴孩的脚，将他们的头摔碎在磐石上，趁他们还是婴孩，趁他们尚未长大成人，趁他们尚未完全占据你的心（诗篇 136:9）。
    - type: paragraph
      text:
        ru: 'Вот такая задача стоит перед вами: задача полного целомудрия, целомудрия не только плоти, но и духа. Но, как я сказал, очень многие легко относятся к греху блуда, не считают его тяжким, а наше дело остановить вас, заставить одуматься.'
        cn: 摆在你们面前的，就是这样一项任务：完全的贞洁，不仅是肉体的贞洁，更是灵魂的贞洁。但是，正如我所说，许多人对淫乱的罪行掉以轻心，不认为它是重罪，而我们的职责是阻止你们，促使你们深思反省。
    - type: paragraph
      text:
        ru: 'Чем можно помочь вам в этом? Тем, кто исправится и на исповеди получит отпущение этого греха, будет допущен к Святой Чаше. А если кто из вас получит на некоторое время такое отлучение от Причастия, пусть не сетует, не огорчается. Надо глубоко призадуматься и сказать себе: если так, то дело обстоит серьезно; мне это казалось малым грехом, аЦерковьСвятая отлучает меня от Причастия. Не огорчайтесь, не думайте, что можно и умереть, не получив Причащения Святых Тайн. Всякое запрещение Причащения снимается при опасности смертной.'
        cn: 在这事上能如何助益您呢？凡悔改并在告解中获得此罪赦免者，将获准领受圣体血。若你们中有人暂时受此禁领圣体血之罚，就不要抱怨，不要忧伤。应当深思，并自省道：若是如此，那么此事非同小可；我原以为这只是小罪，而圣教会却禁止我领受圣体血。不要忧伤，也不要以为，纵使未领受圣奥秘，便会因此死亡。一切禁领圣体血之罚，在面临死亡危险时都会被解除。
    - type: paragraph
      text:
        ru: 'Теперь понимаете, почемуЕфрем Сиринмолится Богу о том, чтобы дал ему дух целомудрия. Будем же мы, все грешные, все повинные в этом грехе, молиться Богу о спасении и обратимся за помощью к святомуЕфрему Сирину: «Помоги, помоги нам в этой борьбе: мы слабы, а ты силен!»  Аминь.'
        cn: 现在你们明白，为什么叙利亚的圣以弗所向上帝祈祷，求祂赐予他贞洁之灵。那么，我们这些罪孽深重、有份于此罪的所有人，都向上帝祈祷，求祂拯救，并向叙利亚的圣以弗所求助：「帮助，帮助我们在这场斗争中：我们软弱，而你刚强！」 阿门。
  - type: heading2
    text:
      ru: Молитва святого Ефрема Сирина – о смиренномудрии
      cn: 圣厄弗愣叙利亚人的祷文——论谦卑的心智
    children:
    - type: paragraph
      text:
        ru: Дух смиренномудрия даруй ми, Господи, рабу Твоему.
        cn: 主啊，求祢赐予我，祢的仆人，谦卑的灵。
    - type: paragraph
      text:
        ru: Помните, что заповедь о смирении – это первая заповедь блаженства, а если первая, значит, самая важная. Слышали ли когда-нибудь слово Божье, возвещенное пророком Исаиею:«Так говорит Высокий и Превознесенный, вечно Живущий – Святый имя Его. Я живу на высоте небес и во святилище и также с сокрушенными и смиренными духом, чтоб оживлять дух смиренных и оживлять сердца сокрушенных»(Ис. 57, 15).
        cn: 记住，谦卑这诫命是第一条福哉诫命，既是第一条，那便是最重要的。祢曾否听过借着先知以赛亚所宣扬的上帝的话语：«上主如此说：我是那至高至上、永恒的活者，我的名为圣。我住在至高之处和圣所中，也与心灵痛悔和谦卑之人同在，为要使谦卑人的灵苏醒，也使痛悔人的心苏醒。» (以赛亚书 57:15)
    - type: paragraph
      text:
        ru: 'Разве не хотите, чтобы с вами жил Сам Бог? А если хотите, запомните, хорошенько запомните: Он Сам говорит, что живет в сердце смиренных и оживляет сердца их, а как мы нуждаемся в оживлении сердец наших!'
        cn: 难道你们不愿上帝亲自与你们同住吗？如果你们愿意，请记住，牢牢记住：祂亲自说，祂住在谦卑人的心里，并使他们的心苏醒，而我们多么需要我们的心被苏醒啊！
    - type: paragraph
      text:
        ru: Разве не хотите, чтобы Бог призрел на вас? А если хотите, знайте и помните, что Бог призирает на смиренных сердцем. Помните, помните и слова апостола Иакова:«Бог гордым противится,смиренным же дает благодать»(Иак. 4, 6).
        cn: 难道你们不愿上帝眷顾你们吗？若是你们愿意，你们当知晓并牢记，上帝眷顾谦卑者。牢记，再牢记使徒雅各的话语：「上帝抵挡骄傲的人，却赐恩典给谦卑者。」（雅各书 4:6）
    - type: paragraph
      text:
        ru: Разве вы хотите, чтоб Господь противился вам, разве не хотите получить благодать? А если хотите, запомните, что такое смирение, что за святая добродетель, которая так угодна Богу, за которую Бог живет с нами и призирает на нас.
        cn: 难道你们想让主抵挡你们吗？难道你们不想领受恩典吗？如果你们想，请记住什么是谦卑，那是何等神圣的德行，如此蒙上帝喜悦，为此上帝与我们同住并眷顾我们。
    - type: paragraph
      text:
        ru: Это то, что противоположно гордости. Смиренные – это нищие духом, помнящие о недостатках своих, устремляющие взор свой в глубины сердца, всегда неустанно наблюдают они за движениями сердца своего, следят за всякой нечистотой, которую увидят в сердце своем.
        cn: 这是与骄傲相反的。谦卑的人是虚心的人，他们铭记自身的缺欠，将目光投向内心深处，总是孜孜不倦地审视自己内心的动向，监察着他们在心中所见的每一样不洁。
    - type: paragraph
      text:
        ru: Святые, которые всегда исполняли заповеди Христовы, любили Христа, пред мысленным взором которых стоял всегда Господь, помнили всегда о смирении и всегда молили о нем.
        cn: 圣徒们，他们始终遵行基督的诫命，爱慕基督，他们的心目中常有上主，始终谨记谦卑，并常为此祈祷。
    - type: paragraph
      text:
        ru: Христос говорит:«Научитесь от Меня, ибо Я кроток и смирен сердцем»(Мф. 11, 29). Господь велит научиться от Него смирению, Господь велит подражать Ему в смирении. Смирение проявлялось во всей земной жизни Господа. Оно началось с самого рождения Его, ибо родился Он как самый смиренный, самый простой, незаметный человек, родился в вертепе для скота, был положен в ясли.
        cn: 基督说：「你们当学我的样式，因为我心里柔和谦卑」（马太福音 11:29）。上主吩咐我们向祂学习谦卑，上主吩咐我们在谦卑上效法祂。谦卑体现在上主整个尘世的生命中。它始于祂的降生，因为祂的降生，如同最谦卑、最朴素、最不引人注目之人，生在畜牧的洞穴里，被放置在马槽中。
    - type: paragraph
      text:
        ru: А потом всю жизнь, разве не давал Он безчисленные примеры смирения? Когда Ирод возгорелся яростью, хотел убить Новорожденного Спасителя и послал воинов своих избить вифлеемских младенцев, разве не мог Господь послать один легион ангелов из легионов, которые всегда были в Его распоряжении, разве не мог Он поразить Ирода? Конечно мог, но Он предпочел проявить смирение и бежал в Египет от гнева Ирода.
        cn: 而祂一生之中，岂不曾赐予无数谦卑的榜样吗？当希律王怒火中烧，意欲杀害初生的救主，并派遣士兵屠杀伯利恒的婴孩时，难道上主不能从祂常能调动的众天使军团中，只遣一队天使军团，难道祂不能击杀希律王吗？祂当然能，但祂选择展现谦卑，并为避开希律王的怒气而逃往埃及。
    - type: paragraph
      text:
        ru: А дальше сколько смирения проявил Он в жизни Своей, ходя за 200 километров пешком в Иерусалим, по первому зову нуждающихся в Его помощи, не имея где голову приклонить.
        cn: 再者，祂在世的生命中，所彰显的谦卑是何等之深啊！祂曾徒步逾两百公里去往耶路撒冷，应着那些需要祂帮助之人的首声呼唤，自己却无处枕首。
    - type: paragraph
      text:
        ru: Разве не явил он совершенного, необычайного примера смирения, умыв ноги ученикам Своим? Это представляет собою предел смирения.
        cn: 他为自己的门徒洗脚，难道不是显明了完美、超凡的谦卑典范吗？这正是谦卑的极致。
    - type: paragraph
      text:
        ru: А о том смирении, которое явил Он перед судом и после суда, когда веден был на Голгофу, распят на кресте – о нем не смеют говорить уста человеческие, так безмерно оно, так велико.
        cn: 而对于祂在受审之前和受审之后，当祂被带往各各他，并被钉在十字架上时所彰显的谦卑，人嘴不敢言说，因它如此无限，如此伟大。
    - type: paragraph
      text:
        ru: 'Господь велит научиться от Него смирению. А кто теперь помнит о смирении? Смирение есть качество души человеческой, которое гордые клеймят презрением, ибо эти люди не верят во Христа, избрали не путь Христов, а иные пути: говорят, что это – дух рабства, что смиренные – рабы, лишенные качества самого нужного, необходимого, лишенные духа протеста, сопротивления силой тяжким бедствиям человечества.'
        cn: 主吩咐我们向祂学习谦卑。可是现在有谁还会记念谦卑呢？谦卑是人类灵魂的一种品质，却被骄傲之人以轻蔑加以贬损，因为这些人不信基督，选择的不是基督的道路，而是别的道路：他们说，这是一种奴役精神，说谦卑者是奴隶，缺乏最重要、最必需的品质，缺乏反抗精神，缺乏以力量抵抗人类深重苦难的精神。
    - type: paragraph
      text:
        ru: 'Есть ли в этом правда? Никакой, ни следа. О смиренных надо сказать не то, что говорят клеймящие, а совсем иное: что они не рабы, подчиняющиеся злу и насилию, а единственные победители зла и насилия. Надо сказать, что только они ведут настоящую борьбу со злом, ибо искореняют из сердец своих и сердец других людей самые источники зла. Они не верят в то, что причина зла лежит только в несовершенстве социальных отношений.'
        cn: 这其中有真理吗？毫无，一丝一毫也没有。关于谦卑之人，不应说那些定罪者所说的话，而应说截然不同的话：他们不是屈服于邪恶和暴力的奴隶，而是邪恶和暴力的唯一胜利者。必须说，只有他们才真正与邪恶争战，因为他们将邪恶的根源从自己的心里以及他人的心里根除。他们不相信邪恶的起因仅仅在于社会关系的不完善。
    - type: paragraph
      text:
        ru: Смиренный – это подлинный воин Христов, а не раб.
        cn: 谦卑的人是真正的基督战士，而非奴隶。
    - type: paragraph
      text:
        ru: Но как мало смирения, безконечно мало теперь! Огромное большинство людей презирают смирение, стремятся к первенству и преобладанию в мире сем. Подлинно смиренных почти не найти, о смирении не думают, смирение забыто, совсем забыто. О смирении думают те, кто идет всем сердцем по пути Христову, кто учится от Него смирению. Только святые подлинно смиренны.
        cn: 但现今谦卑何其稀少，稀少到无尽！绝大多数人蔑视谦卑，在这世上追求首位和凌驾他人。真正谦卑的人几乎寻不见，人们不思念谦卑，谦卑被遗忘，完全被遗忘了。思念谦卑的，是那些全心全意走在基督道路上、并从祂那里学习谦卑的人。唯有圣徒才真正谦卑。
    - type: paragraph
      text:
        ru: Это может показаться странным, как это святые, превосходящие в огромной мере других людей по нравственным достоинствам, по высоте, достигнутой ими, могут считать себя, считать совершенно искренне ниже всех других. Основа святости их в том, что они ни над кем не превозносятся, но осуждают сердце свое.
        cn: 这可能看似奇怪，为什么圣徒——他们在道德品格上，在他们所达到的高度上，都远远超越其他世人——竟能完全真诚地认为自己低于所有其他人。他们的圣洁基础在于，他们不凌驾于任何人之上，而是谴责自己的心。
    - type: paragraph
      text:
        ru: Святые с необыкновенной зоркостью наблюдали за каждым движением сердца и видели малейшую нечистоту в нем, и если видели, всегда помнили об этой нечистоте и потому считали себя недостойными пред Богом.
        cn: 圣徒们以非凡的敏锐，观察着心里的每一个微动，并看见其中哪怕最微小的污秽；若是看见了，就总会记着这污秽，因此就自视为在上帝面前不配的。
    - type: paragraph
      text:
        ru: Люди гордые и дерзкие смеют судить обо всем самом высоком и святом, смиренные лишены дерзости, скромны, тихи. Примеры этого находим во множестве в Святом Писании и в житиях святых.
        cn: 傲慢而放肆的人竟敢论断一切至高至圣之事，谦卑的人则毫无放肆，谦逊而恬静。这样的例子，我们在圣经中和圣徒传记中多有记载。
    - type: paragraph
      text:
        ru: 'Кто более велик пред Богом, чем праведный Авраам, который слышал великие обетования и назван другом Божиим, а этот Великий никогда не переставал называть себя прахом и пеплом. Кто более велик пред Богом, чем Давид, пророк и царь, а он говорил о себе:«Я червь, а не человек – поношение в людях»(Пс. 21, 7). Это были его совершенно искренние слова. Кто был более велик пред Богом по трудам своим, чем апостол Павел? А он называет себя первым грешником, так чужд был он дерзости и превозношения: он был робок, а не дерзок, говорил о себе, что был среди коринфян«в немощи и страхе и великом трепете»(1Кор.2:3). Это глубокое смирение – пример для нас всех, безконечно далеких от него.'
        cn: 谁在上帝面前更为伟大，胜过义人亚伯拉罕呢？他听见了伟大的应许，并且被称为上帝的朋友，而这位伟大之人从未停止称自己为尘土和炉灰。谁在上帝面前更为伟大，胜过先知与君王大卫呢？而他论及自己说：「我是虫，不是人，是众人的羞辱」（诗篇 21:7）。这些是他全然真诚的言语。谁在上帝面前因其劳作而更为伟大，胜过使徒保罗呢？而他称自己为罪人中的罪魁，他是如此远离胆大妄为与自高自大：他是怯懦的，而非鲁莽的，他论及自己说，在哥林多人当中是「又软弱又惧怕又极其战兢」（哥林多前书 2:3）。这深刻的谦卑是我们所有人的榜样，我们与它相距无限遥远。
    - type: paragraph
      text:
        ru: Нам нужно с усердием всегда думать о смирении и просить его у Бога. Никакими усилиями собственными мы не можем эту добродетель стяжать. Смирение – великий Божий дар – получают те, кто всем сердцем своим любит Бога, стремится исполнять заповеди Христовы. Только им даст Господь этот великий дар. Их сердце смиренно, а когда смиренно сердце человека, Дух Святый поселяется в нем.
        cn: 我们当殷勤地常常思念谦卑，并向上帝祈求它。凭我们自己的任何努力，我们都不能获得这美德。谦卑是上帝伟大的恩赐，那些全心爱上帝、努力遵行基督诫命的人才能领受。主只将这伟大的恩赐赐予他们。他们的心谦卑，而当人心谦卑时，圣灵便居住在他里面。
    - type: paragraph
      text:
        ru: Видите, какое великое счастье быть смиренным, видите, как трудно быть смиренным. Имейте упование и знайте, что каждый шаг по пути Христову приближает вас ко святому смирению. Если такие шаги умножите и участите, как апостолы и святые, этим приблизитесь к Богу. Господь Иисус Христос говорил ученикам:«Больший из вас да будет всем слуга, ибо кто возвышает себя, тот унижен будет, а кто унижает себя, тот возвысится»(Мф.23:11–12).
        cn: 你们看，谦卑是何等大的福分，你们看，谦卑又是何等艰难。要怀有信心，并要知道，在基督之路上的每一步，都使你们更接近圣洁的谦卑。如果你们能增添并加快这样的步伐，如同使徒和圣徒那样，以此，你们将更接近上帝。上主耶稣基督对门徒们说：「你们中间为大的，要作你们的仆役，因为凡自高的，必降为卑；凡自卑的，必升为高。」（马太福音 23:11-12）
    - type: paragraph
      text:
        ru: Как безконечно часто сбываются эти слова Христовы, сколько гордых, стремящихся стать выше всех, потом падают ниже всех. Сколько было смиренных, ничтожных, рождавшихся в нищенской семье, бедствовавших в начале жизни своей, а потом ставших великими людьми. Такова история великих московских святителей.
        cn: 基督的这些话语何其频繁地应验，多少骄傲自大、企图凌驾于众人之上者，最终却跌落至众人之下。多少谦卑、微不足道，出生于贫苦家庭，一生之初饱受苦难之人，最终却成为伟人。这便是伟大的莫斯科圣主教们的故事。
    - type: paragraph
      text:
        ru: Многие, многие другие тоже происходили из самой низкой общественной среды и были возвышены Богом за свое великое, безмерное смирение. Господь говорит:«Многие первые будут последними, а последние первыми»(Мф. 19, 30). Так бывает в жизни нашей, так будет на Страшном Суде. Первые станут последними, а последние, ничтожные, презренные окажутся первыми. Много-много надо труда, чтоб не забыть смирения, много-много труда, чтобы его стяжать.
        cn: 许多许多其他人也出身于最低下的社会阶层，并因他们伟大、无限的谦卑而被上帝高举。主说：「许多在前的将要在后，在后的将要在前」（马太福音 19:30）。在我们的生命中也是如此，在末日审判时也将如此。在前的将成为在后的，而在后的、渺小的、受鄙视的将成为在前的。需要付出许多许多努力，才能不忘记谦卑；需要付出许多许多努力，才能求得谦卑。
    - type: paragraph
      text:
        ru: Должны мы помнить слова апостола Петра:«Все же, подчиняясь друг другу, облекитесь смиренномудрием, потому что Бог гордым противится, а смиренным дает благодать»(1Пет. 5, 5). Помните, Бог гордым противится, и только смиренным дает благодать. Помните, что даже до смерти крестной смирил Себя Господь Иисус Христос. Нам же нужно стремиться к смирению, постоянно просить его у Бога:Господи и Владыко живота моего, дух смиренномудрия даруй ми, рабу Твоему!
        cn: '我们当牢记使徒彼得的话语：

          「你们众人，要彼此顺服，以谦卑束腰，因为上帝抵挡骄傲的人，却赐恩典给谦卑的人。」(彼得前书 5:5)

          要记住，上帝抵挡骄傲的人，且只将恩典赐予谦卑的人。要记住，主耶稣基督甚至受死于十字架，也谦卑了自己。而我们则需要竭力追求谦卑，不断向上帝祈求它：

          我生命的主与主宰啊，求祢将谦卑之灵赐予我，祢的仆人！'
    - type: paragraph
      text:
        ru: Знайте и помните, что если человек будет постоянно иметь в памяти эти святые слова, то получит от Бога глубокую добродетель смирения. Аминь.
        cn: 务要知晓并牢记，如果一个人能不断地将这些圣言铭记于心，则将获得来自上帝的深邃的谦卑德行。阿们。
  - type: heading2
    text:
      ru: Молитва святого Ефрема Сирина – о терпении
      cn: 圣以法莲·叙利亚人的祷告 – 论忍耐
    children:
    - type: paragraph
      text:
        ru: Господи и Владыко живота моего, дух терпения даруй ми!
        cn: 主啊，我生命的主宰啊，求祢赐予我忍耐之灵！
    - type: paragraph
      text:
        ru: О, как надо нам просить этого духа терпения! О, как надо нам стяжать терпение! Ведь Сам Господь сказал:«Терпением вашим спасайте души ваши»(Лк. 21, 19).
        cn: 哦，我们多么需要祈求这忍耐之灵啊！哦，我们多么需要得着忍耐啊！因为主亲口说过：「你们要凭着忍耐，救你们的灵魂。」(路加福音 21:19)
    - type: paragraph
      text:
        ru: В терпении спасение души нашей. Почему это так? Потому что сказал Господь Иисус Христос:«Тесны врата и узок путь, ведущие в жизнь»(Мф. 7, 14). Труден, труден этот путь, и сказал нам Господь, и говорят нам апостолы, что путь этот – путь жизни христианской – это путь страданий, путь скорбей.«В мире скорби будете, но дерзайте, яко Аз победих мир»(Ин. 16, 33).
        cn: 在忍耐中，有我们灵魂的救赎。为何如此？因为主耶稣基督说：「门是窄的，路是狭的，引向生命的」（马太福音 7:14）。这条路是艰难的，是艰难的，主也告诉我们，众使徒也告诉我们，这条路——基督徒生命之路——是受苦之路，是忧患之路。「在世上你们有忧患，但你们要壮胆，因为我已胜了世界」（约翰福音 16:33）。
    - type: paragraph
      text:
        ru: Если так, если весь путь христианский есть путь страданий, путь скорбей, только в терпении спасение миру. Мы только терпением можем спасти души наши.
        cn: 如果是这样，如果基督徒的整个道路是受苦的道路，是忧患的道路，唯有在忍耐中，世界才有救赎。我们唯有借着忍耐，才能拯救我们的灵魂。
    - type: paragraph
      text:
        ru: Апостол Иаков говорит в своем соборном послании:«С великой радостью принимайте, братия мои, когда впадаете в различные искушения, зная, что испытание вашей веры производит терпение; терпение же должно иметь совершенное действие, чтобы вы были совершенны во всей полноте, без всякого недостатка»(Иак. 1, 2–4).
        cn: '使徒雅各在他的大公书信中说：

          「我的弟兄们，当你们遭遇各种试炼时，要以为大喜乐，因为你们知道，你们信心的考验会生出忍耐；而忍耐也当有完全的功效，好使你们能完全完备，毫无缺欠。」(雅各书 1:2-4)'
    - type: paragraph
      text:
        ru: Видите, терпение имеет совершенное действие, терпение делает нас совершенными во всей полноте без всяких недостатков. Апостол Павел говорит:«Терпение нужно вам, чтобы, исполнив волю Божию, получить обещанное»(Евр. 10, 36), – жизнь вечную, Царство Божие.
        cn: 可见，忍耐具有完全的效用，忍耐使我们达到完全，在一切丰盛中毫无瑕疵。使徒保罗说：「你们需要忍耐，才能在遵行了上帝的旨意后，领受所应许的」（希伯来书 10:36）——就是永生，上帝的国。
    - type: paragraph
      text:
        ru: 'Терпите: без терпения невозможно спастись. Этот апостол, как и все другие апостолы, терпел много, много великих скорбей, гонений, преследований, и в конце – мученическую смерть. Ее претерпели все апостолы, кроме Иоанна Богослова, который в глубокой старости умер естественной смертью.'
        cn: 务要忍耐：没有忍耐，就不可能得救。这位使徒，正如所有其他使徒一样，忍受了许多许多巨大的苦难、逼迫和迫害，最终殉道而死。所有使徒都承受了这种死亡，除了圣约翰神学家，他在高龄时自然寿终正寝。
    - type: paragraph
      text:
        ru: А говорит апостол Павел:«Признаки апостола оказались пред вами всяким терпением, знамениями чудесами и силами»(2Кор. 12, 12). (Все увидели мое апостольское достоинство не только в чудесах и знамениях, которые я творил, но увидели и в терпении моем).
        cn: 圣使保罗说：「圣使的凭据在你们中间得以证实，是藉着诸般的忍耐、神迹、奇事和异能。」(哥林多后书 12:12) (众人不仅在我所行的奇事和神迹中看见我的圣使的尊荣，也看见在我的忍耐中。)
    - type: paragraph
      text:
        ru: 'Видите, как велико терпение: апостол, наряду с чудесами и знамениями, называет терпение признаком апостольским, признаком святости, признаком друзей Божиих. Он говорит в другом послании:«Мы же являем себя, как служители Божии,... в великом терпении, в бедствиях, в тесных обстоятельствах»(2Кор.6:1, 6:4).'
        cn: 你们看，忍耐何其伟大：使徒，连同神迹和异兆，称忍耐为使徒的标记，圣洁的标记，以及上帝朋友的标记。他在另一封书信中说：「我们却显明自己是上帝的仆人，……在极大的忍耐中，在患难中，在窘迫中。」(哥林多后书 6:1，6:4)
    - type: paragraph
      text:
        ru: Всем явил он лицо апостольское в великом терпении. А своему ученику, епископу Тимофею, он завещал:«Ты же, человек Божий, ...преуспевай в правде, благочестии, вере, любви, терпении, кротости»(1Тим. 6, 11).
        cn: 他向所有人显明了使徒的风范，以极大的忍耐。而他向他的门徒，主教提摩太，嘱咐道：「然而你这属上帝的人，...要在公义、敬虔、信心、仁爱、忍耐、温柔上追求。」(提摩太前书 6:11)
    - type: paragraph
      text:
        ru: Если апостолу так надо было преуспевать в терпении, то как же нам, столь слабым христианам, отвергать эту добродетель? Как отвергать терпение, когда так легко начинаем мы роптать на Бога, если посылает Он неизбежные для христиан страдания? Никогда, никогда нельзя отвергать терпение, ибо без него совершенно невозможен путь в Царство Божие.
        cn: 如果使徒都需要如此在忍耐中精进，那么我们这些如此软弱的基督徒，怎能拒绝这种美德呢？怎能拒绝忍耐呢，当我们如此轻易就开始向上帝发怨言，如果祂降下基督徒不可避免的苦难时？绝不能，绝不能拒绝忍耐，因为没有它，通往上帝之国的道路是完全不可能的。
    - type: paragraph
      text:
        ru: Вы знаете, что даже в мирских делах нужно великое терпение, что же скажем о нашем пути, о нашей духовной жизни? Нам оно неизмеримо важнее, чем людям мирским. Как стяжать терпение? Привыкать терпеть, привыкать не роптать – а роптать все очень склонны. И, конечно, просить у Бога терпения.
        cn: 你们知道，即使在世俗事务中，也需要极大的忍耐，那么对于我们的道路，对于我们的灵性生活，又该怎么说呢？对我们而言，忍耐比世俗之人无可比拟地更为重要。如何才能获得忍耐呢？习惯于忍耐，习惯于不抱怨——而所有人都非常倾向于抱怨。当然，也要向上帝祈求忍耐。
    - type: paragraph
      text:
        ru: Если будем просить у Бога терпения, будем просить того, что угодно Ему, и будет с нами по слову Христову:«Если вы, будучи злы, умеете даяния благие давать детям вашим, тем более Отец ваш Небесный даст блага просящим у Него»(Мф. 7, 11).
        cn: '如果我们向上帝祈求忍耐，我们就是在祈求合乎祂心意的事，事情就会按基督的话成就：


          「你们虽然不好，尚且知道把好东西给你们的儿女，何况你们在天上的父，岂不更把好东西给求祂的人吗？」(马太福音 7:11)'
    - type: paragraph
      text:
        ru: А это разве не благо – терпение? Прошение о терпении – это угодное Богу прошение, и Бог не оставит, Бог поможет каждому христианину, взывающему о терпении под тяжестью креста своего. Бог поможет каждому несчастному человеку, обремененному большой семьей и изнывающему в нищете, если будет просить он о терпении.
        cn: 难道忍耐不是一项美德吗？祈求忍耐是蒙上帝悦纳的祈求，上帝必不离弃，祂会帮助每一位在自身十字架重担下呼求忍耐的基督徒。上帝会帮助每一个肩负着庞大家庭重担、在贫困中备受煎熬的不幸之人，只要他祈求忍耐。
    - type: paragraph
      text:
        ru: 'Но бывает, что просят и люди злые, идущие путем темным, греховным, творящие зло на каждом шагу; они тоже изнывают под тяжестью своей злой жизни, бывает, что и они просят терпения. А им Бог терпения не даст: это значило бы облегчить их черную, греховную жизнь, содействовать ей. Им не даст, а всем тем добрым, которые просят смиренно о терпении на своем христианском пути, Господь даст терпение, как говорит апостол Павел:«Верен Бог, Который не попустит вам быть искушаемыми сверх сил, но при искушении даст и облегчение, так чтобы вы могли перенести»(1Кор. 10, 13).'
        cn: 但也有恶人祈求，他们走在黑暗、罪恶的道路上，每一步都作恶；他们也因自己邪恶生活的重担而疲惫不堪，有时他们也祈求忍耐。但上帝不会赐给他们忍耐：那将意味着减轻他们黑暗、罪恶的生活，助长它。祂不会赐给他们，但对于所有那些在自己的基督徒道路上谦卑地祈求忍耐的良善之人，上主会赐予忍耐，正如使徒保罗所说：「上帝是信实的，祂不会让你们受试探过于你们所能承受的，在受试探的时候，祂也会开出一条出路，好使你们能够忍受」（哥林多前书 10:13）。
    - type: paragraph
      text:
        ru: Дает терпение, сверх сил никого не обременяет, только бы не впадали в малодушие, только бы помнили, что наши беды и страдания, что наше горе ничто по сравнению с тем, что претерпел за нас Господь наш Иисус Христос. И потому надо нам много терпеть, ища утешения,«взирая на начальника и совершителя веры Иисуса, Который, вместо предлежавшей Ему радости, претерпел крест, пренебрегши посрамление, и восселодеснуюПрестола Божия. Помыслите о Претерпевшем такое над Собою поругание от грешников, чтобы вам не изнемочь и не ослабеть душами вашими»(Евр. 12, 2–3).
        cn: 祂赐予耐心，不将过度的重担加于任何人身上，只要我们不灰心丧志，只要我们记住，我们的苦难、痛苦和悲伤，与我们的主耶稣基督为我们所承受的一切相比，都算不得什么。因此，我们需要多多忍耐，寻求安慰，『仰望为我们信德之创始成终者耶稣。祂为那摆在祂面前的喜乐，忍受了十字架，轻看羞辱，便坐在上帝宝座的右边。你们要思想那忍受罪人如此顶撞祂的，免得你们疲倦灰心。』(希伯来书 12:2-3)
    - type: paragraph
      text:
        ru: Вот чем надо укрепляться, вот откуда черпать можно, без конца черпать терпение – от креста Христова.
        cn: 你们当以此得着力量，当从此汲取——无止尽地汲取忍耐——从基督的十字架。
    - type: paragraph
      text:
        ru: Взирайте почаще на Крест святой, на Спасителя, Распятого на кресте, и молитесь вместе сЕфремом Сириным:Господи и Владыко живота моего, дух терпения даруй ми, рабу Твоему.  Аминь.
        cn: '请常常瞻仰圣十字架，瞻仰被钉在十字架上的救主，并与叙利亚的圣厄弗伦一同祈祷：


          上主，我生命之主宰，求祢赐予我，祢的仆人，忍耐之灵。阿们。'
  - type: heading2
    text:
      ru: Молитва святого Ефрема Сирина – о любви
      cn: 圣叙利亚的以法莲祷告文——关于爱
    children:
    - type: paragraph
      text:
        ru: Господи и Владыко живота моего, дух любви даруй ми, рабу Твоему.
        cn: 主啊，我生命的主宰，求祢将爱之灵赐予祢的仆人。
    - type: paragraph
      text:
        ru: О любви, которая есть исполнение всего закона, о любви просим мы. Если не имеем любви, то, по слову святого апостола Павла, мы«...медь звенящая или кимвал звучащий»(1Кор. 13, 1).
        cn: 我们所祈求的，是爱，是那成全全部律法的爱。如果我们没有爱，那么，按着圣使徒保罗的话说，我们就是「鸣的铜，响的钹」（哥林多前书 13:1）。
    - type: paragraph
      text:
        ru: Если мы имеем дар пророчества и знания великие и имеем веру, горы переставляющую, но не имеем любви, мы – ничто. Если раздадим все имущество свое нищим и отдадим тело на сожжение, но любви не имеем, мы – ничто. Вот что такое любовь. Если нет любви, какими бы совершенствами ни обладали, мы – ничто.
        cn: 如果我们拥有预言的恩赐以及广博的知识，并拥有移山的信心，但没有爱，我们什么也不是。如果我们散尽所有财产给穷人，并舍弃身体被焚烧，但没有爱，我们什么也不是。这就是爱。如果没有爱，无论我们拥有何等全备，我们什么也不是。
    - type: paragraph
      text:
        ru: Любовь – это все, ибо все, что говорил Господь Иисус Христос, что совершил во дни Своей земной жизни, и прежде всего то, что явил на Голгофе, есть сплошная великая проповедь о любви. Значит, любовь есть то, о чем должны просить всегда, настойчиво, постоянно. Любовь есть то, стяжать которое – величайшая и основная задача жизни нашей, ибо задача наша в том, чтобы приблизились мы к Богу, чтобы стали совершенны, как совершенен Отец наш Небесный. А как приблизиться к Богу без любви? Без нее мы безконечно далеки от Бога.
        cn: 爱就是一切，因为主耶稣基督所说的一切，祂在尘世生命中所成就的一切，尤其是在髑髅地所显明的一切，都是一场关于爱的宏大宣讲。因此，爱是我们当永远、恒切、不懈地祈求的。得着爱，是我们生命中至大且首要的任务，因为我们的任务在于亲近上帝，使我们像我们在天上的父那样完全。然而，若没有爱，又如何能亲近上帝呢？没有它，我们就无限远离上帝。
    - type: paragraph
      text:
        ru: Любовь – это то, что культивировали в сердце своем все святые, то, что дано от Бога, как величайший дар благодати Божией за исполнение заповедей Христовых.
        cn: 爱是所有圣徒在自己心中所培养的，是上帝的赐予，作为因遵行基督诫命而蒙受的、上帝恩典中最大的恩赐。
    - type: paragraph
      text:
        ru: Есть счастливые люди, которые рождаются с сердцем мягким, кротким, любовным; им легче достигнуть в жизни христианской любви, чем всем другим, в особенности тем несчастным, которые рождаются с сердцем грубым, жестоким, мало способным к любви.
        cn: 有一些幸福的人，他们生来就拥有一颗柔和、谦卑、满怀爱的心；他们比其他人更容易在生活中达到基督徒的爱，尤其是那些不幸的人，他们生来就拥有一颗刚硬、残忍、不甚能爱的心。
    - type: paragraph
      text:
        ru: Если человек родился с сердцем кротким, надлежит ему все-таки претерпеть весьма многое, пройти крестный путь страданий, чтобы ярким пламенем разгорелась любовь Христова в сердце его; умножить должен он эту любовь, которая дана ему.
        cn: 如果一个人天生拥有一颗温柔谦卑的心，他仍然需要承受甚多，走过十字架的苦路，以便基督之爱能在他心中如烈火般炽热燃烧；他必须增进这被赐予他的爱。
    - type: paragraph
      text:
        ru: Любовью христианской были переполнены сердца людей в древние времена, особенно во времена апостолов, когда люди любили друг друга, как братья, исполняя заповедь Христову. О них Господь мог сказать:«По тому узнают, что вы Мои ученики, если будете иметь любовь между собой»(Ин. 13, 35).
        cn: 在古代，尤其是在使徒时代，人们的心中洋溢着基督徒的爱，当时他们彼此相爱如同弟兄，遵行基督的诫命。关于他们，主曾说：「世人因此就知道你们是我的门徒，如果你们彼此相爱。」(约翰福音 13:35)
    - type: paragraph
      text:
        ru: А теперь, где теперь любовь, кто найдет ее днем с огнем? Настанет страшное время, о котором говорит Господь, указывая признаки Своего второго пришествия. Он говорил, между прочим, и так:«Тогда соблазнятся многие, и друг друга предадут, и возненавидят друг друга, и, по причине умножения беззаконий, во многих охладеет любовь»(Мф. 24:10, 12).
        cn: 而今，爱在何方？谁还能在白昼里打着灯笼寻得它呢？可怕的时期将要到来，主曾提及这个时期，指明祂第二次降临的征兆。祂曾如此说道，其中亦有：「那时，许多人将被诱惑跌倒，彼此出卖，互相憎恨；又因不法之事增多，许多人的爱心将要冷淡。」(马太福音 24:10，12)
    - type: paragraph
      text:
        ru: Это видим в наше время, это то, что терзает, раздирает сердце наше. Видим множество людей, которые ненавидят друг друга, предают друг друга, в сердце которых охладела любовь, и следов ее не осталось.
        cn: 我们在现今时代看到这一点，它折磨、撕裂着我们的心。我们看到许多人，他们彼此憎恨，彼此背叛，在他们心中爱已冷却，甚至连爱的痕迹也荡然无存。
    - type: paragraph
      text:
        ru: Тяжко, невыносимо тяжко жить, видеть, что вместо любви Христовой свирепствует ненависть, взаимная ненависть. Какой ужас, несказанный ужас пережили мы столь недавно, когда народ, исповедующий Христа, в союзе с другими тоже христианскими народами – народ германский – сотворил такие злодеяния, такие надругательства над законом любви, каких мир не видел.
        cn: 活下去是如此艰难，如此难以忍受，眼见代替基督之爱的是肆虐的仇恨，相互的仇恨。我们在如此近的时期经历了何等恐怖，难以言喻的恐怖，当时一个宣认基督的民族，联同其他同样是基督徒的民族——德意志民族——竟犯下了如此的恶行，如此践踏爱之律法，是世界前所未见的。
    - type: paragraph
      text:
        ru: Что осталось от закона любви в тех злодеях, которые закапывали детей и стариков живыми в землю, разбивали о камни головы новорожденных, истребляли десятки миллионов людей? Где любовь? Не осталось ее и следа, любовь забыта.
        cn: 在那些将孩童与老人活埋于地、将新生儿的头颅摔碎在石头上、屠杀了数千万人的恶人身上，爱的律法还剩下什么？爱在哪里？它一丝痕迹也未留下，爱已被遗忘。
    - type: paragraph
      text:
        ru: Вместо закона Христовой любви мир живет законом всеобщей вражды. Кто следит по газетам, что совершается в мире, содрогается, видя, как самая сатанинская неправда торжествует, как поощряются великими державами политические насилия, заслуживающие глубокого осуждения.
        cn: 世界并非遵循基督之爱的法则，而是活在普遍敌意的法则之中。凡是关注报纸上世界所发生之事的人，都会因看到最撒旦式的非义正在凯旋，以及那本应受到严厉谴责的政治暴力如何被大国所纵容而感到不寒而栗。
    - type: paragraph
      text:
        ru: А вокруг нас? Жить в городе опаснее, чем в дремучем лесу, ибо много в городе бандитов, полных злобы и ненависти. Ибо люди в городе – крещеные люди, бывшие некогда христианами, – стали злее, опаснее зверей. Попрана святая любовь, попрана грязными сапогами, попрано Евангелие Христово, о любви никто не хочет и слышать.
        cn: 那么我们周围呢？在城市中生活，比在密林深处更危险，因为城里充满了恶意与仇恨的匪徒。因为城里的人——那些受过洗、曾为基督徒的人——变得比野兽更邪恶、更危险了。神圣的爱被践踏了，被污秽的靴子践踏了，基督的福音被践踏了，关于爱，无人愿意听闻。
    - type: paragraph
      text:
        ru: Что нам делать, как нам быть? Неужели и нам сделаться волками, которых так много вокруг? Конечно, нет. Любовь Христова должна сохраниться до второго пришествия Господа Иисуса Христа, любовь Христова должна сохраниться в сердцах малого Христова стада, и те ужасы жизни, ужасы неправды, попранной любви, которые видим ежедневно и ежечасно, должны нас побуждать к тому, чтобы возгревать в сердцах наших святую Христову любовь.
        cn: 我们该如何行事，我们该如何自处？难道我们也要变成狼吗，像周围那么多的狼一样？当然不是。基督之爱必须存留，直到主耶稣基督的第二次降临，基督之爱必须存留在基督小羊群的心中；而那些我们每日每时所见的，生活的恐怖、不义的恐怖、被践踏之爱的恐怖，都应当促使我们在心中激发起神圣的基督之爱。
    - type: paragraph
      text:
        ru: Как же это сделать, кому дается любовь? Только тем, кто исполняет заповеди Христовы, кто идет по узкому пути страдания, не сворачивая с этого пути, какие бы страдания и гонения не грозили. Идти, идти, идти без конца по этому крестному пути, идти без оглядки, идти к свету Христову. Если будем упорно и непрестанно идти к свету, то придем.
        cn: 怎样才能做到呢？爱是赐予谁的呢？唯有那些遵行基督诫命、行在受苦的窄路上、不偏离这条道路、无论面临何种苦难和逼迫的人。不停地走啊，走啊，走啊，在这条十字架的道路上，毫不回顾地走向基督的光。如果我们坚忍不拔、不懈地走向光明，那么我们必将抵达。
    - type: paragraph
      text:
        ru: 'Как можно любить людей, которые истязают нас: воров, бандитов, насильников, которые творят нам великое зло? Это возможно, возможно не в полной мере, но хотя бы в небольшой мере. Подумайте, что такое жалость? Это одна из форм любви святой. Разве не должны мы жалеть всем сердцем людей, отвергших Христа, идущих по пути погибельному, идущих к отцу своему – дьяволу? Разве вы их не должны жалеть? Любить их чистой, полной любовью невозможно, но жалеть их возможно, сокрушаясь сердцем, что эти несчастные люди на пути погибели. Если не будем проклинать этих людей, исполним закон Христов даже по отношению к ним.'
        cn: '我们如何能爱那些折磨我们、对我们行大恶的人，例如盗贼、匪徒和强暴犯？这是可能的，也许不是全然的爱，但至少在某种程度上是可能的。


          试着思考，怜悯是什么？它是圣洁之爱的一种形式。难道我们不应该全心全意地怜悯那些弃绝基督、行在灭亡之道上、走向他们的父——魔鬼的人吗？难道你们不应该怜悯他们吗？以纯洁、全然的爱去爱他们是不可能的，但怜悯他们是可能的，心中因这些不幸之人正行在灭亡之路上而忧伤。如果我们不咒骂这些人，那么即使是对待他们，我们也践行了基督的律法。'
    - type: paragraph
      text:
        ru: Знаете ли вы, что на великого святогоСерафима Саровскогонапали разбойники, несколько мужиков из соседней с монастырем деревни, избили его смертным боем, проломили череп, сломали ребра так, что он потерял сознание и несколько месяцев пролежал в монастырской больнице, пока не пришла Пресвятая Богородица исцелить его. Как отнесся он к разбойникам? Они были пойманы, переданы суду, а преподобный Серафим упросил со слезами, чтобы не наказывали их, а отпустили. Он плакал, он жалел их, а, следовательно, любил их.
        cn: 你们知道吗，伟大的圣塞拉芬·萨罗夫斯基曾遭到强盗袭击，几个来自修道院附近村庄的男子将他毒打至奄奄一息，打穿了头骨，打断了肋骨，以至于他失去了知觉，并在修道院医院里躺了几个月，直到至圣圣母前来医治他。他是怎样对待那些强盗的呢？他们被抓获，移交法庭审理，然而可敬者塞拉芬却含泪恳求，不要惩罚他们，而是释放他们。他哭了，他怜悯他们，因此，他爱他们。
    - type: paragraph
      text:
        ru: Такую жалость проявляли весьма многие другие святые. Так святые относились к тем, кто творил им великое зло. Так Сам Бог терпит грешников, терпел даже такого страшного разбойника, как Варвар, который убил триста человек, потом покаялся, принес Богу такое покаяние, какого представить себе нельзя, и был прощен Богом, был возлюблен Богом, получил даже от Него дар чудотворения.
        cn: 许许多多其他圣徒也表现出这样的怜悯。圣徒就是这样对待那些对他们犯下大恶之人。上帝自己也是这样宽容罪人，甚至宽容了瓦尔瓦尔这样可怕的强盗，他曾杀害三百人。后来他悔改了，向上帝献上了那样无法想象的悔改，并蒙上帝赦免，蒙上帝所爱，甚至从祂那里获得了行神迹的恩赐。
    - type: paragraph
      text:
        ru: Сам Господь так долготерпелив по отношению к тяжким грешникам, как же смеем мы их ненавидеть и проклинать? Должны мы их жалеть, а жалость, как я уже сказал, – одна из форм любви.
        cn: 上主自己对重罪之人尚且如此恒忍，我们又怎敢恨恶并咒诅他们呢？我们应当怜悯他们，而怜悯，正如我所说，是爱的一种形式。
    - type: paragraph
      text:
        ru: 'Если можно даже убийц, злодеев жалеть, то что скажем о менее тяжких грешниках – о несчастных ворах, о всех погибающих во грехах? Их надо жалеть еще больше, чем преподобный Серафим жалел своих убийц. Пусть никто не говорит: «Как могу я любить этих людей, отравляющих жизнь нашу, позорящих народ русский?» Пусть каждый не проклинает, а жалеет их, и тогда любовь Христова вселится в наши сердца. Любовь Христова незаметно, изо дня в день проникает в сердце человека, который старается Богу угодить, всегда молится, постом смиряет плоть свою, старается помочь окружающим людям.'
        cn: 既然甚至可以怜悯杀人犯、恶人，那么对于罪孽较轻的罪人——对于不幸的窃贼，对于所有在罪中沉沦的人，我们该说什么呢？我们必须更加怜悯他们，甚至超过圣塞拉芬怜悯他的那些杀人犯。愿无人说：「我怎能爱这些人，他们毒害我们的生命，羞辱俄罗斯民族？」愿每个人都不要咒骂，而是怜悯他们，这样一来，基督的爱将居于我们的心中。基督的爱日复一日、不知不觉地渗入那些努力取悦上帝、常常祷告、藉禁食克制己身、努力帮助周围之人心中。
    - type: paragraph
      text:
        ru: 'Любовь Христова изливается в сердце такого человека, наполняет его до краев и изливается через край, как изливалась она у преподобного Серафима на грешников, которые тысячами приходили к нему. О такой любви молите Бога все словами святогоЕфрема Сирина: «Господи и Владыко живота моего, дух любви даруй ми, рабу Твоему!» И даст вам Бог дух любви. Аминь.'
        cn: 基督的爱倾注到这样的人心中，将其充满至满溢，并溢流出来，正如它从圣塞拉芬那里涌流到成千上万来到他面前的罪人身上一样。为这样的爱，你们都以圣叙利亚的埃弗雷姆的话语向上帝祈祷：「我生命的上主和主宰啊，求祢赐予我，祢的仆人，爱之灵！」上帝就会赐予你们爱之灵。阿们。
  - type: heading2
    text:
      ru: Заключение молитвы святого Ефрема Сирина
      cn: 圣厄弗所叙利亚人祷告的总结
    children:
    - type: paragraph
      text:
        ru: 'Великая молитваЕфрема Сиринакончается чрезвычайно важным прошением:'
        cn: 大圣以法莲祷文以极其重要的祈求告终：
    - type: paragraph
      text:
        ru: Даруй ми зрети моя прегрешения и не осуждати брата моего, яко благословен еси во веки веков.
        cn: 求祢赐我省察我的过犯，不判断我的弟兄，因为祢是受称颂的，直到永远。
    - type: paragraph
      text:
        ru: Осуждение братьев наших – это самая закоренелая всеобщая привычка наша. Осуждение ближних – то, чем мы всегда заняты, и оставляем важнейшее из всех дел наших – рассмотрение прегрешений наших.
        cn: 论断我们的弟兄——这是我们最根深蒂固、普遍的习惯。论断我们的近人，是我们总是忙于之事，却忽略了我们所有事务中最重要的——审视我们自己的过犯。
    - type: paragraph
      text:
        ru: 'Такого обычая нет ни у кого: с начала дня до самой ночи мы думаем обо всем, занимаемся всем, только не занимаемся важным делом – рассмотрением сердца своего. Этим никто не занимается, кроме малого-малого числа людей, посвятивших себя Богу, у них это самое важное, основное занятие: ищут нечистоты греха в сердце своем. Когда найдут, легко и скоро освобождаются от него, ибо когда найдут какую-либо нечистоту в сердце своем, станет противно и стараются изо всех сил избавиться от нее. Когда узрят прегрешения, покаются и очистятся от них.'
        cn: 这样的习惯无人所有：从清晨到深夜，我们思虑万事，处理万事，唯独不从事这件重要的事——省察己心。唯有极少数献身于上帝之人，方将此视为最重要、最主要的职责：在自己的心中搜寻罪恶的污秽。当他们寻见时，便轻易而迅速地从中解脱，因为当他们在心中寻见任何污秽时，便会心生厌恶，并竭尽全力摆脱它。当他们察觉到罪过时，便会悔改并从中得到洁净。
    - type: paragraph
      text:
        ru: Запомните слова апостола Павла к нам:«А ты что осуждаешь брата твоего? Или и ты, что унижаешь брата твоего? Все мы предстанем на суд Христов»(Рим. 14, 10). Когда осуждаем других, не вспоминаем, не замечаем, что сами виновны в том же. А мы знаем, что есть суд Божий не только за совершенные прегрешения, за которые осуждаем ближних своих, но и за самое осуждение:«Неужели думаешь ты, человек, что избежишь суда Божия, осуждая делающих такие дела и сам делая то же?»(Рим.2:3)  Тебя самого ведет Господь к покаянию, а не к осуждению других. О других не заботься.
        cn: 记住使徒保罗对我们说的话：「你为何论断你的弟兄呢？你又为何轻看你的弟兄呢？因为我们都要站在基督的审判台前。」(罗马书 14:10) 当我们论断他人时，却不曾记起，也不曾察觉我们自己也犯了同样的罪。我们知道，上帝的审判不仅是为着我们论断邻人所犯下的罪过，也是为着论断本身：「你这人哪，你以为你能逃脱上帝的审判吗？你论断行这样事的人，自己却做着同样的事？」(罗马书 2:3) 上主引导你自己走向悔改，而不是走向论断他人。不要管他人。
    - type: paragraph
      text:
        ru: 'Помните, как привели к Господу женщину, взятую в прелюбодеянии, и спросили: «Учитель, Моисей повелел таких грешников побивать камнями. А ты что скажешь?» Господь Иисус Христос не сразу ответил. Он сидел во дворе храма и что-то писал пальцем на песке. И лишь когда спросили Его вторично, дал удивительный ответ, какой только мог дать:«Кто из вас без греха, первый брось в нее камень». С великим стыдом, низко опустив головы, стали расходиться один за другим книжники и фарисеи, которые считали себя праведниками. А Иисус писал на песке, и наконец поднял голову и спросил:«Где твои обвинители? Никто не осудил тебя. ...И Я не осуждаю тебя. Иди и впредь не греши»(Ин. 8:4–11).'
        cn: '你们可曾记得，当人们将一个行淫时被拿的妇人带到主面前，并问道：「老师，摩西吩咐我们要用石头打死这样的罪人。那么，祢怎么说呢？」


          主耶稣基督没有立刻回答。祂坐在圣殿院子里，用手指在地上写字。只有当他们第二次问祂时，祂才给出了一个令人惊叹的回答，唯有祂能给出的回答：「你们中间谁是没有罪的，谁就可以先拿石头打她。」


          那些自以为义的文士和法利赛人，带着极大的羞耻，低着头，便一个接一个地离开了。而耶稣仍旧在地上写字，并最终抬起头来，问道：「你的控告者在哪里？没有人定你的罪吗？……我也不定你的罪。去吧，从今以后不要再犯罪了。」(约翰福音 8:4-11)'
    - type: paragraph
      text:
        ru: Какой удивительный запрет осуждения, как ясно Господь сказал, что надо думать прежде всего и больше всего о своих грехах. Кто без греха, пусть первый бросит камень. Мы не без греха, значит, не смеем бросать камень осуждения в других, а мы бросаем камни постоянно, каждый день и каждую ночь бросаем камни осуждения:«Кто ты, осуждающий чужого раба? Пред своим Господом стоит он или падает. И будет восставлен, ибо силен Бог восставить его. Все предстанем на суд Христов»(Рим. 14:4, 10). Нужно думать об этом суде над нами, о себе, а не заниматься чужими грехами. Видите, как свят и важен этот закон.
        cn: '这是一个多么令人惊叹的论断禁令啊！主多么清楚地说了，我们首先且最重要的是要思想自己的罪。谁没有罪，谁就可以先扔石头。我们并非无罪，因此我们不敢向他人投掷论断的石头。然而，我们却不断地投掷石头，日日夜夜投掷论断的石头：

          «你这论断别人仆人的，你是谁呢？他或站住，或跌倒，自有他的主。他也必要站立得住，因为上帝能使他站立。我们都要站在基督的审判台前»（罗马书 14:4，10）。

          我们需要思想这临到我们身上的审判，思想我们自己，而不是去管别人的罪。你们看，这律法是何等神圣和重要。'
    - type: paragraph
      text:
        ru: 'Что делать, если видим человека, явно согрешающего, заслуживающего осуждения? И тогда не должно осуждать, надо положить дверь заграждения на уста свои, не осудить согрешающего, а пожалеть его, помнить о том, что тяжек ответ его пред Богом, и молча вознести краткую молитву: Господи, прости его. И тогда бес осуждения убежит сейчас же, ибо бесы бегут от молитвы. Если же осудим, бес останется, и другой раз осудим, и без конца будем осуждать.'
        cn: 如果我们看见一个人，他明显地在犯罪，且是当受谴责的，我们该怎么做呢？那么，就不应论断，务必在自己的口上安设一道堵截之门，不要论断那犯罪的人，而是怜悯他，记住他在上帝面前将要负的沉重交待，并默默地献上一个简短的祷告：「主啊，赦免他。」如此，那论断的魔鬼就会立刻逃走，因为魔鬼会因祷告而逃遁。然而，如果我们论断了，魔鬼就会留下，接着又会再次论断，并会无止境地论断。
    - type: paragraph
      text:
        ru: 'Откуда дух осуждения? От гордости, от того, что многие считают себя выше и лучше других. Часто бывает осуждение от зависти: завидуем тем, кто получил дары духовные, иногда даже людям просто благочестивым, а зависть ведет к осуждению. Осуждают от злобы, от ненависти. А любви очень мало, злобы же, ненависти очень много в сердцах наших. Эта злоба, эта ненависть побуждает осуждать ближних наших, закрывает наши глаза на собственные грехи и недостатки.'
        cn: 论断之灵从何而来？从骄傲而来，从许多人自视高人一等、比他人更优越而来。论断也常因嫉妒而生：我们嫉妒那些领受了属灵恩赐的人，有时甚至嫉妒仅仅是虔敬的人，而嫉妒引向论断。人们因恶毒、因憎恨而论断。而爱却极其稀少，恶毒和憎恨却在我们心中极其众多。这恶毒，这憎恨驱使我们论断我们的近人，蒙蔽我们的双眼，使我们看不见自己的罪过和缺点。
    - type: paragraph
      text:
        ru: Осуждаем человека весьма часто и без всякой зависти. Это часто зависит от укоренившейся привычки осуждать. Осуждение, как и все прочее, становится нашей привычкой, если постоянно осуждаем.
        cn: 我们常常论断人，并且不带任何嫉妒。这常常取决于根深蒂固的论断习惯。论断，正如其他所有事情一样，如果我们持续不断地论断，就会成为我们的习惯。
    - type: paragraph
      text:
        ru: Все, что часто делается, становится нашим навыком. Если у кого-нибудь зависть, ненависть владеет сердцем, укоренится привычка осуждать, будет всегда, неумолчно, неустанно осуждать.
        cn: 凡是常做的事情，都会成为我们的习惯。如果有人心中被嫉妒、仇恨所占据，论断的习惯就会根深蒂固，他就会总是不止息地、不倦地论断。
    - type: paragraph
      text:
        ru: Эту привычку надо искоренить, не давая ей возрастать в нас. Ловить надо себя на всяком осуждении, осудить себя за всякое осуждение. Осудив себя один-два раза, научимся воздерживаться и перестанем осуждать других, а сосредоточим духовный взгляд на собственном сердце.
        cn: 这种习惯必须根除，不让它在我们里面滋长。我们必须在每一次论断中察觉自己，并为每一次论断而谴责自己。谴责自己一两次之后，我们就会学会克制，停止论断他人，而将属灵的目光集中在自己的心上。
    - type: paragraph
      text:
        ru: Так исполним то, о чем просим в молитвеЕфрема Сирина:Даруй ми зрети моя прегрешения и не осуждати брата моего, яко благословен еси во веки веков.
        cn: '那么，让我们去实行我们在叙利亚的圣厄弗仑的祷文中所祈求的：


          求祢赐我看见我自己的罪过，并且不判断我的弟兄，因为祢是蒙福的，直到世世代代。'
    - type: paragraph
      text:
        ru: Аминь.
        cn: 阿们。
